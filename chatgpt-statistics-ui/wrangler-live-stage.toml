# B46-STAT-UI-01: Real-current-frontend visual QA, isolated no custom routes.
# Always a NEW staging Worker; no overwrite of existing preview or Production.
name = "ball46-chat-statistics-live-ui-test-20261115"
main = "live-staging-worker.mjs"
compatibility_date = "2026-11-15"
workers_dev = true
compatibility_flags = ["nodejs_compat"]

[[rules]]
type = "Text"
globs = ["**/live-staging-overlay.css"]
fallthrough = true

# Internal GET-only staging read of CURRENT Production Worker, never a Production deploy.
[[services]]
binding = "B46_PRODUCTION_READ"
service = "ball46-production"

# Staging-only verified public Ledger snapshot: never bind Production KV.
[[kv_namespaces]]
binding = "B46_STAGE_STATS_KV"
id = "f144dc8b6525477984067f7ab5762924"

[[durable_objects.bindings]]
name = "B46_NEW_BOOK"
class_name = "StageAccountingBook"

[[migrations]]
tag = "new-book-v1"
new_sqlite_classes = ["StageAccountingBook"]
