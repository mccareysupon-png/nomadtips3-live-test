name = "nomadtips3-engine-343"
main = "src/index-bulk.js"
compatibility_date = "2026-09-09"
workers_dev = true
# BULK-ONLY STANDARD: pricing is read from HUB snapshot providerOdds.
# No per-fixture provider odds fetch is allowed from the engine.

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[[services]]
binding = "HUB"
service = "nomadtips3-5usd-hub-343"

[[durable_objects.bindings]]
name = "ENGINE"
class_name = "Nomad343Engine"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Nomad343Engine"]
