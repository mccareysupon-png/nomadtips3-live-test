name = "nomadtips3-engine-343"
main = "src/index-bulk-recovery.js"
compatibility_date = "2026-09-09"
workers_dev = true
# BULK-ONLY STANDARD: pricing stays on HUB/FULL_MARKET.
# Direct provider access in the recovery wrapper is settlement-only and capped.
# Runtime verification: 2026-09-27 missing-final settlement recovery.
# Legacy deploy branches must not replace this entrypoint.

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[[services]]
binding = "HUB"
service = "nomadtips3-5usd-hub-343"

[[services]]
binding = "FULL_MARKET"
service = "nomadtips3-full-market-343-ball46"

[[durable_objects.bindings]]
name = "ENGINE"
class_name = "Nomad343Engine"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Nomad343Engine"]
