<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADD K AH</title><style>:root{color-scheme:dark;font-family:system-ui;background:#080d0a;color:#edf7ef}*{box-sizing:border-box}body{margin:0}header{background:#105c45;padding:18px;display:flex;justify-content:space-between}button{border:0;border-radius:0;padding:12px 18px;background:#61db7f;color:#071109;font-weight:800}main{max-width:1100px;margin:auto;padding:24px}.tabs{display:flex;gap:8px}.panel,fieldset,.card{background:#111a14;border:0;border-radius:0;padding:18px;margin:12px 0}fieldset{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}label{display:grid;gap:5px}input,select{padding:10px;background:#080d0a;color:white;border:1px solid #385442;border-radius:0}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.row{display:flex;justify-content:space-between}.metric{display:grid;grid-template-columns:1fr 1fr;gap:7px}.metric span{background:#080d0a;padding:8px}@media(max-width:600px){main{padding:12px}.cards{grid-template-columns:1fr}}</style></head><body><header><b>nomadtips3 · ADD K AH</b><div class="tabs"><button onclick="tab('result')">ผลตรวจจับ</button><button onclick="tab('settings')">ตั้งค่า</button></div></header><main><section id="result"><h1>คู่ที่ผ่านเงื่อนไข</h1><p id="status">กำลังโหลด</p><div id="cards" class="cards"></div></section><section id="settings" hidden><h1>ตั้งค่าการตรวจจับ AH</h1><form id="form"><fieldset><legend>เวลาและฝั่ง</legend><label>นาทีเริ่ม<input name="minuteFrom" type="number"></label><label>นาทีสิ้นสุด<input name="minuteTo" type="number"></label><label>ฝั่ง<select name="side"><option value="BOTH">ทั้งสองฝั่ง</option><option value="HOME">เจ้าบ้าน</option><option value="AWAY">ทีมเยือน</option></select></label><label>เปิดระบบ<input name="enabled" type="checkbox"></label><p id="times"></p></fieldset><fieldset><legend>เหตุการณ์ขั้นต่ำ</legend><label>ยิงเข้ากรอบ<input name="sotMin" type="number"></label><label>ยิงออก<input name="shotOffMin" type="number"></label><label>เตะมุม<input name="cornerMin" type="number"></label></fieldset><fieldset><legend>เปอร์เซ็นต์การบุก</legend><label>Attack ต่ำสุด<input name="attackShareMin" type="number"></label><label>Attack สูงสุด<input name="attackShareMax" type="number"></label><label>Dangerous ต่ำสุด<input name="dangerousShareMin" type="number"></label><label>Dangerous สูงสุด<input name="dangerousShareMax" type="number"></label><label>อัตราการบุกต่ำสุด<input name="attackRateMin" type="number"></label><label>อัตราการบุกสูงสุด<input name="attackRateMax" type="number"></label></fieldset><fieldset><legend>NowGoal AH</legend><label>แต้มต่อต่ำสุด<input name="ahMin" type="number" step=".25"></label><label>แต้มต่อสูงสุด<input name="ahMax" type="number" step=".25"></label><label>ราคาต่ำสุด<input name="oddsMin" type="number" step=".01"></label><label>ราคาสูงสุด<input name="oddsMax" type="number" step=".01"></label></fieldset><label>รหัสเจ้าของ<input id="key" type="password"></label><button>บันทึก</button><output id="msg"></output></form></section></main><script>const B='https://add-k-ah-detector.mccarey-supon.workers.dev',q=s=>document.querySelector(s);function tab(x){q('#result').hidden=x!=='result';q('#settings').hidden=x!=='settings'}async function api(p,o){let r=await fetch(B+p,o),j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||'ผิดพลาด');return j}function put(k,v){let e=q('#form').elements[k];if(e)e.type==='checkbox'?e.checked=!!v:e.value=v}async function load(){try{let[c,s,g]=await Promise.all([api('/config'),api('/signals'),api('/status')]);Object.entries(c.config).forEach(x=>put(...x));q('#times').textContent='ตรวจ 4 รอบ: นาที '+c.schedule.join(', ');q('#status').textContent=g.status?'บอลสด '+g.status.live+' · อัปเดต '+new Date(g.status.updatedAt).toLocaleTimeString('th-TH'):'ระบบยังไม่เริ่ม';q('#cards').innerHTML=s.signals.length?s.signals.map(x=>`<article class=card><div class=row><b>${x.home}</b><b>${x.score.home}-${x.score.away}</b><b>${x.away}</b></div><p>${x.league||''} · นาที ${x.minute} · ${x.side==='HOME'?'เจ้าบ้าน':'ทีมเยือน'}</p><div class=metric><span>SOT ${x.stats.sot[x.side.toLowerCase()]}</span><span>ยิงออก ${x.stats.shotOff[x.side.toLowerCase()]}</span><span>มุม ${x.stats.corners[x.side.toLowerCase()]}</span><span>บุก ${x.metrics.attackRate?.toFixed(1)}%</span><span>AH ${x.metrics.line}</span><span>ราคา ${x.metrics.odds}</span></div></article>`).join(''):'ยังไม่มีคู่ที่ผ่าน'}catch(e){q('#status').textContent=e.message}}q('#form').onsubmit=async e=>{e.preventDefault();let d={};for(let x of e.target.elements)if(x.name)d[x.name]=x.type==='checkbox'?x.checked:x.name==='side'?x.value:Number(x.value);try{let j=await api('/config',{method:'POST',headers:{'content-type':'application/json','x-owner-key':q('#key').value},body:JSON.stringify(d)});q('#msg').textContent='บันทึกแล้ว · '+j.schedule.join(', ')}catch(e){q('#msg').textContent=e.message}};load();setInterval(load,30000)</script></body></html>
