    function refreshClock(root){const c=root._liveClock;if(!c)return;const st=statusInfo(c.status,c.elapsed,c.updated);node(root,'statusPill').textContent=st.label;node(root,'statusPill').className=`live-pill ${st.cls}`;node(root,'minute').textContent=st.minuteLabel}
    function render(root,data){const m=normalise(data),st=statusInfo(m.status,m.elapsed,m.updated);root._liveClock={status:m.status,elapsed:m.elapsed,updated:m.updated};node(root,'league').textContent=[m.league,m.country].filter(Boolean).join(' · ');node(root,'source').textContent=`SOURCE ${String(m.source).toUpperCase()}`;node(root,'statusPill').textContent=st.label;node(root,'statusPill').className=`live-pill ${st.cls}`;node(root,'home').textContent=m.home;node(root,'away').textContent=m.away;node(root,'homeInitial').textContent=initial(m.home);node(root,'awayInitial').textContent=initial(m.away);node(root,'pitchHome').textContent=m.home;node(root,'pitchAway').textContent=m.away;node(root,'score').textContent=`${shown(m.hs)} : ${shown(m.as)}`;node(root,'minute').textContent=st.minuteLabel;if(m.kickoff){const d=new Date(m.kickoff);node(root,'kickoff').textContent=Number.isNaN(d.getTime())?String(m.kickoff):d.toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})}const stats=m.stats||{},html=[statRow('Attacks',statValue(stats,'home',['attacks']),statValue(stats,'away',['attacks'])),statRow('Dangerous Attacks',statValue(stats,'home',['dangerous_attacks','dangerousAttacks']),statValue(stats,'away',['dangerous_attacks','dangerousAttacks'])),statRow('Possession',statValue(stats,'home',['possession','ball_possession']),statValue(stats,'away',['possession','ball_possession'])),statRow('Total Shots',statValue(stats,'home',['shots','total_shots']),statValue(stats,'away',['shots','total_shots'])),statRow('Shots on Target',statValue(stats,'home',['shots_on_target','shotsOnTarget']),statValue(stats,'away',['shots_on_target','shotsOnTarget'])),statRow('Corners',statValue(stats,'home',['corners']),statValue(stats,'away',['corners'])),statRow('Yellow Cards',statValue(stats,'home',['yellow_cards','yellowCards']),statValue(stats,'away',['yellow_cards','yellowCards'])),statRow('Red Cards',statValue(stats,'home',['red_cards','redCards']),statValue(stats,'away',['red_cards','redCards']))].filter(Boolean).join('');node(root,'stats').innerHTML=html||'<div class="empty">No statistics available from this source</div>';const ordered=[...m.events].sort((a,b)=>(Number(b.minute??b.time?.elapsed)||0)-(Number(a.minute??a.time?.elapsed)||0));node(root,'events').innerHTML=ordered.length?ordered.slice(0,20).map(e=>{const minute=e.minute??e.time?.elapsed??'–',title=[e.type||e.event,e.team?.name||e.team].filter(Boolean).join(' — '),detail=[e.detail,e.player?.name||e.player].filter(Boolean).join(' · ');return `<div class="event"><div class="event-time">${esc(minute)}′</div><div><div class="event-type">${esc(title||'เหตุการณ์')}</div><div class="event-detail">${esc(detail||'No additional details')}</div></div></div>`}).join(''):'<div class="empty">No events available from this source</div>';const latest=ordered[0];if(latest){const team=latest.team?.name||latest.team||'';node(root,'latestText').textContent=[team,latest.type||latest.event,latest.detail].filter(Boolean).join(' · ');node(root,'latestMinute').textContent=`${latest.minute??latest.time?.elapsed??'—'}′`;const marker=node(root,'marker');marker.className='marker neutral';if(team===m.home)marker.className='marker home';else if(team===m.away)marker.className='marker away'}else{node(root,'latestText').textContent='No events available from this source';node(root,'latestMinute').textContent='—';node(root,'marker').className='marker neutral'}const pickInfo=data.match||data;node(root,'pick').textContent=pickInfo.pick||pickInfo.core_pick||'N/A';node(root,'confidence').textContent=pickInfo.confidence!==undefined&&pickInfo.confidence!==null?`${pickInfo.confidence}%`:'N/A';node(root,'predicted').textContent=pickInfo.predicted_score||pickInfo.predictedScore||'N/A';node(root,'updated').textContent=m.updated?`Updated ${new Date(m.updated).toLocaleString('th-TH')}`:'Not updated yet'}
    function bindTabs(root){root.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{root.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));root.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));btn.classList.add('active');root.querySelector(`[data-panel="${btn.dataset.tab}"]`).classList.add('active')}))}
    async function loadOne(root,src){try{const r=await fetch(`${src.file}?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const data=await r.json();if(!data.source)data.source=src.fallbackSource;render(root,data)}catch(e){node(root,'statusPill').textContent='โหลดไม่สำเร็จ';node(root,'statusPill').className='live-pill error';node(root,'updated').innerHTML=`<span class="error-text">${esc(e.message||e)}</span>`}}
    const host=document.getElementById('matches');sources.forEach((src,i)=>{host.insertAdjacentHTML('beforeend',card(i));const root=host.lastElementChild;bindTabs(root);loadOne(root,src);setInterval(()=>loadOne(root,src),60000);setInterval(()=>refreshClock(root),15000)});
  </script>
