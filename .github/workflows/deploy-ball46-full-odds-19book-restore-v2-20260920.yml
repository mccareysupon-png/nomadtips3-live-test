name: Deploy Ball46 Full Odds 19Book Restore V2 20260920

on:
  push:
    branches:
      - work/ball46-full-odds-19book-restore-v1-20260920
    paths:
      - .github/workflows/deploy-ball46-full-odds-19book-restore-v2-20260920.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_URL: https://ball46.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  EXPECTED_PROD_VERSION: 4ffb5681-89aa-47b3-b2b3-75c25dfb231c
  EXPECT_ENGINE: nomad343-engine-v6.2-viewer-readonly-cron-referee-lock-v1
  EXPECT_HUB: nomad343-5usd-hub-v5-last-good-continuity
  EXPECT_FULLMARKET: nomad343-ball46-full-market-v6-server-prewarm-cache
  CANONICAL_BRANCH: work/ball46-viewer-readonly-lock-v1-20260920
  PATCH_JS: live-summary-full-odds-343.js

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preflight exact production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod /tmp/before /tmp/patch /tmp/names
          npx --yes wrangler@4.92.0 deployments list --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc --json > /tmp/deployments-before.json
          current=$(node -e "const r=require('/tmp/deployments-before.json'); const x=r[r.length-1]; console.log(x?.versions?.find(v=>Number(v.percentage)===100)?.version_id||'')")
          echo CURRENT_PROD_VERSION=$current
          [ "$current" = "$EXPECTED_PROD_VERSION" ] || { echo PRODUCTION_MOVED:$current; exit 1; }
          echo "$current" > /tmp/prod-version
          for page in index.html signal.html statistics.html; do curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/$page?fo-before=$GITHUB_RUN_ID" -o "/tmp/prod/$page"; done
          curl -fsS -L --max-time 25 "$BALL46_URL/$PATCH_JS?fo-before=$GITHUB_RUN_ID" -o /tmp/prod/$PATCH_JS
          grep -Fq BALL46_VIEWER_READONLY_LOCK_V1 /tmp/prod/$PATCH_JS
          cp "nomad-live-343/$PATCH_JS" "/tmp/patch/$PATCH_JS"
          grep -Fq BALL46_FULL_ODDS_19BOOK_RESTORE_V1 "/tmp/patch/$PATCH_JS"
          grep -Fq 'signalFilterPrefetch:false' "/tmp/patch/$PATCH_JS"
          ! grep -Fq applyRichOdds "/tmp/patch/$PATCH_JS"
          for ep in engine hub full-market; do curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/api/$ep/health?fo-before=$GITHUB_RUN_ID" -o "/tmp/before/$ep.json"; done
          ev=$(node -e "console.log(require('/tmp/before/engine.json').version||'')")
          hv=$(node -e "console.log(require('/tmp/before/hub.json').version||'')")
          fv=$(node -e "console.log(require('/tmp/before/full-market.json').version||'')")
          [ "$ev" = "$EXPECT_ENGINE" ]
          [ "$hv" = "$EXPECT_HUB" ]
          [ "$fv" = "$EXPECT_FULLMARKET" ]
          printf '%s\n%s\n%s\n' "$ev" "$hv" "$fv" > /tmp/backend-versions
          sc=$(curl -sS -L --max-time 25 -o /tmp/before/scan.json -w '%{http_code}' "$BALL46_URL/api/engine/scan?fo-before=$GITHUB_RUN_ID")
          [ "$sc" = 403 ]
          grep -Fq VIEWER_ENGINE_TRIGGER_DISABLED /tmp/before/scan.json
          ec=$(curl -sS -L --max-time 25 -o /tmp/before/eo.json -w '%{http_code}' "$BALL46_URL/api/engine/fixture-odds?fo-before=$GITHUB_RUN_ID")
          [ "$ec" = 403 ]
          fc=$(curl -sS -L --max-time 25 -o /tmp/before/fo.json -w '%{http_code}' "$BALL46_URL/api/full-market/fixture-odds?fo-before=$GITHUB_RUN_ID")
          [ "$fc" = 410 ]
          grep -Fq VIEWER_PROVIDER_FETCH_DISABLED /tmp/before/fo.json
          echo PRECHECK_PASS

      - name: Load canonical wrapper and open only Full Market fixture route
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CANONICAL_BRANCH" --no-tags
          git show FETCH_HEAD:workers/nomadtips3-343-preview/src/index.js > /tmp/canonical-index.js
          git show FETCH_HEAD:workers/nomadtips3-343-preview/wrangler.ball46.jsonc > /tmp/canonical-wrangler.jsonc
          cp /tmp/canonical-index.js workers/nomadtips3-343-preview/src/index.js
          cp /tmp/canonical-wrangler.jsonc workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          python3 -c "from pathlib import Path; p=Path('workers/nomadtips3-343-preview/src/index.js'); s=p.read_text(); old=\"if (path === '/fixture-odds') return Response.json({ok:false,error:'VIEWER_PROVIDER_FETCH_DISABLED',mode:'CENTRAL_CACHE_READ_ONLY',externalRequestsAdded:0,lock:'BALL46_VIEWER_READONLY_LOCK_V1'},{status:410,headers:{'cache-control':'no-store'}});\"; new=\"if (path === '/fixture-odds') return env.FULL_MARKET.fetch(fullMarketRequest(request, '/fixture-odds'));\"; assert s.count(old)==1; p.write_text(s.replace(old,new))"
          grep -Fq "if (path === '/fixture-odds') return env.FULL_MARKET.fetch" workers/nomadtips3-343-preview/src/index.js
          grep -Fq VIEWER_ENGINE_TRIGGER_DISABLED workers/nomadtips3-343-preview/src/index.js
          ! grep -Fq VIEWER_PROVIDER_FETCH_DISABLED workers/nomadtips3-343-preview/src/index.js
          cmp -s /tmp/canonical-wrangler.jsonc workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          node --check workers/nomadtips3-343-preview/src/index.js
          echo WRAPPER_PATCH_PASS

      - name: Verify 19 bookmaker one-request contract
        shell: bash
        run: |
          set -euo pipefail
          git show FETCH_HEAD:workers/nomadtips3-full-market-343-ball46/src/index.js > /tmp/full-market.js
          grep -Fq "BOOKMAKERS.join(',')" /tmp/full-market.js
          grep -Fq "url.searchParams.set('bookmakers'" /tmp/full-market.js
          for b in bet365 pinnacle williamhill ladbrokes vcbet 1xbet bwin easybets interwetten betfair snai macauslot betsson betathome 18bet 10bet 12bet coral crown; do grep -Fq "'$b'" /tmp/full-market.js; done
          echo FULL_MARKET_19BOOK_ONE_REQUEST_PASS

      - name: Mirror current Production assets and overlay only client patch
        shell: bash
        run: |
          set -euo pipefail
          mv nomad-live-343 /tmp/repo-assets
          mkdir -p nomad-live-343
          find /tmp/repo-assets -maxdepth 1 -type f -printf '%f\n' > /tmp/names/workspace.txt
          git ls-tree -r --name-only FETCH_HEAD nomad-live-343/ | sed 's#^nomad-live-343/##' | awk 'index($0,"/")==0' > /tmp/names/canonical.txt
          cat /tmp/names/workspace.txt /tmp/names/canonical.txt | sort -u > /tmp/names/all.txt
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            [ "$name" = "$PATCH_JS" ] && continue
            case "$name" in *.html|*.js|*.css|*.svg|*.json|*.txt|*.xml|*.png|*.webp|*.jpg|*.jpeg|*.ico|*.woff|*.woff2) ;; *) continue ;; esac
            tmp="/tmp/prod-${name//\//_}"
            code=$(curl -sS -L --retry 3 --retry-all-errors --retry-delay 1 --max-time 20 -o "$tmp" -w '%{http_code}' "$BALL46_URL/$name?fo-mirror=$GITHUB_RUN_ID") || code=000
            if [ "$code" = 200 ] && [ -s "$tmp" ]; then cp "$tmp" "nomad-live-343/$name"; fi
          done < /tmp/names/all.txt
          cp /tmp/prod/index.html nomad-live-343/index.html
          cp /tmp/prod/signal.html nomad-live-343/signal.html
          cp /tmp/prod/statistics.html nomad-live-343/statistics.html
          count=$(find nomad-live-343 -maxdepth 1 -type f | wc -l)
          echo PRODUCTION_STAGING_FILES=$count
          [ "$count" -ge 100 ]
          cp -a nomad-live-343 /tmp/assets-before
          cp "/tmp/patch/$PATCH_JS" "nomad-live-343/$PATCH_JS"
          node --check "nomad-live-343/$PATCH_JS"
          diff -qr /tmp/assets-before nomad-live-343 > /tmp/assets.diff || true
          cat /tmp/assets.diff
          [ "$(grep -c "$PATCH_JS" /tmp/assets.diff)" -eq 1 ]
          [ "$(wc -l < /tmp/assets.diff)" -eq 1 ]
          cmp -s /tmp/prod/index.html nomad-live-343/index.html
          cmp -s /tmp/prod/signal.html nomad-live-343/signal.html
          cmp -s /tmp/prod/statistics.html nomad-live-343/statistics.html
          echo ASSET_SCOPE_PASS

      - name: Race guard and dry run
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deployments list --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc --json > /tmp/deployments-race.json
          current=$(node -e "const r=require('/tmp/deployments-race.json'); const x=r[r.length-1]; console.log(x?.versions?.find(v=>Number(v.percentage)===100)?.version_id||'')")
          base=$(cat /tmp/prod-version)
          echo RACE_GUARD=$base:$current
          [ "$current" = "$base" ]
          npx --yes wrangler@4.92.0 deploy --dry-run --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc

      - name: Deploy
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc

      - name: Verify and rollback on regression
        shell: bash
        run: |
          set -euo pipefail
          rollback(){ echo ROLLBACK_TO=$EXPECTED_PROD_VERSION; npx --yes wrangler@4.92.0 rollback "$EXPECTED_PROD_VERSION" --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc || true; }
          trap rollback ERR
          mkdir -p /tmp/after
          for page in index.html signal.html statistics.html; do curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/$page?fo-after=$GITHUB_RUN_ID" -o "/tmp/after/$page"; cmp -s "/tmp/prod/$page" "/tmp/after/$page"; done
          curl -fsS -L --max-time 25 "$BALL46_URL/$PATCH_JS?fo-after=$GITHUB_RUN_ID" -o /tmp/after/$PATCH_JS
          grep -Fq BALL46_FULL_ODDS_19BOOK_RESTORE_V1 /tmp/after/$PATCH_JS
          grep -Fq 'signalFilterPrefetch:false' /tmp/after/$PATCH_JS
          grep -Fq 'match-row>.market-cell b' /tmp/after/$PATCH_JS
          ! grep -Fq applyRichOdds /tmp/after/$PATCH_JS
          sc=$(curl -sS -L --max-time 25 -o /tmp/after/scan.json -w '%{http_code}' "$BALL46_URL/api/engine/scan?fo-after=$GITHUB_RUN_ID")
          [ "$sc" = 403 ]
          ec=$(curl -sS -L --max-time 25 -o /tmp/after/eo.json -w '%{http_code}' "$BALL46_URL/api/engine/fixture-odds?fo-after=$GITHUB_RUN_ID")
          [ "$ec" = 403 ]
          fc=$(curl -sS -L --max-time 25 -o /tmp/after/fo-empty.json -w '%{http_code}' "$BALL46_URL/api/full-market/fixture-odds?fo-after=$GITHUB_RUN_ID")
          [ "$fc" = 400 ]
          grep -Fq INVALID_FIXTURE_ID /tmp/after/fo-empty.json
          for ep in engine hub full-market; do curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/api/$ep/health?fo-after=$GITHUB_RUN_ID" -o "/tmp/after/$ep.json"; done
          ev=$(node -e "console.log(require('/tmp/after/engine.json').version||'')")
          hv=$(node -e "console.log(require('/tmp/after/hub.json').version||'')")
          fv=$(node -e "console.log(require('/tmp/after/full-market.json').version||'')")
          [ "$ev" = "$EXPECT_ENGINE" ]
          [ "$hv" = "$EXPECT_HUB" ]
          [ "$fv" = "$EXPECT_FULLMARKET" ]
          curl -fsS -L --max-time 30 "$BALL46_URL/api/engine/board?fo-smoke=$GITHUB_RUN_ID" -o /tmp/after/board.json
          fid=$(node -e "const j=require('/tmp/after/board.json'); const a=Array.isArray(j.fixtures)?j.fixtures:[]; const f=a.find(x=>String(x.boardState||x.status||'').toLowerCase().includes('live'))||a[0]; console.log(f?.fixtureId||'')")
          echo FULL_ODDS_SMOKE_FIXTURE=$fid
          [ -n "$fid" ]
          fullcode=$(curl -sS -L --max-time 40 -o /tmp/after/full.json -w '%{http_code}' "$BALL46_URL/api/full-market/fixture-odds?fixtureId=$fid&fo-smoke=$GITHUB_RUN_ID")
          echo FULL_ODDS_SMOKE_STATUS=$fullcode
          [ "$fullcode" = 200 ]
          requested=$(node -e "const j=require('/tmp/after/full.json'); console.log(Array.isArray(j.requestedBookmakers)?j.requestedBookmakers.length:0)")
          returned=$(node -e "const j=require('/tmp/after/full.json'); console.log(Number(j.bookmakerCount||0))")
          echo FULL_ODDS_REQUESTED_BOOKS=$requested
          echo FULL_ODDS_RETURNED_BOOKS=$returned
          [ "$requested" -eq 19 ]
          [ "$returned" -ge 1 ]
          npx --yes wrangler@4.92.0 deployments list --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc --json > /tmp/deployments-after.json
          newv=$(node -e "const r=require('/tmp/deployments-after.json'); const x=r[r.length-1]; console.log(x?.versions?.find(v=>Number(v.percentage)===100)?.version_id||'')")
          echo NEW_PROD_VERSION=$newv
          [ -n "$newv" ]
          trap - ERR
          echo BALL46_FULL_ODDS_19BOOK_RESTORE_PASS
