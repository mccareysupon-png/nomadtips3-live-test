name: BALL46 Mobile Event Flow Depth Surface
on:
  push:
    branches: [work/mobile-eventflow-depth-20261020]
    paths: ['mobile-eventflow-depth/**', '.github/workflows/mobile-eventflow-depth-20261020.yml']
permissions:
  contents: read
concurrency:
  group: ball46-mobile-eventflow-depth-production
  cancel-in-progress: false
jobs:
  mobile-flow-depth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts acorn@8 playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify real signals and mobile surface, retain assets, deploy and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node mobile-eventflow-depth/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-eventflow-depth-proof
          path: audit/
          retention-days: 30
