name: BALL46 deploy isolated shared archive Last5 and verify real cache
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-last5-archive-deploy.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test qa/prematch-history-20261120/*.test.mjs
      - name: Deploy test archive and Last5 binding only; never call upstream
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node qa/prematch-history-20261120/last5-archive-deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last5-archive-real
          path: evidence/
