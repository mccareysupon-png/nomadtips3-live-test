name: BALL46 Native Live CPU profiler for scrolling and Full Market
on:
  push:
    branches: [test/ball46-fullmarket-odds-v3-20261121]
    paths:
      - '.github/workflows/ball46-native-live-scroll-cpu-profile-20261121.yml'
      - 'qa/fullmarket-odds-v3-20261121/native-live-cpu-profile.mjs'
permissions: {contents: read}
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: CDP profiler baseline and Full Market with no Default V3 runtime
        run: node qa/fullmarket-odds-v3-20261121/native-live-cpu-profile.mjs
