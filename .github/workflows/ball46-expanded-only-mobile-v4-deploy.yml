name: BALL46 Expanded Mobile Only - Guarded Production
on:
  push:
    branches: [fix/ball46-featured-expanded-only-20261021]
    paths:
      - '.github/workflows/ball46-expanded-only-mobile-v4-deploy.yml'
      - 'deploy-assets/expanded-match-mobile-v4/expanded-only.css'
      - 'deploy-assets/expanded-match-mobile-v4/expanded-only.js'
      - 'deploy-assets/expanded-match-mobile-v4/deploy-expanded-only.mjs'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check and QA dependencies
        working-directory: deploy-assets/expanded-match-mobile-v4
        run: |
          set -euo pipefail
          node --check expanded-only.js
          node --check deploy-expanded-only.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 pngjs@7
      - name: Baseline, candidate browser tests, guarded 100 percent promotion, after-deploy QA
        working-directory: deploy-assets/expanded-match-mobile-v4
        run: node deploy-expanded-only.mjs
      - name: Preserve before, candidate, live screenshots and rollback report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-expanded-mobile-v4-safe-proof
          path: deploy-assets/expanded-match-mobile-v4/proof/
          retention-days: 30
          if-no-files-found: warn