name: Ball46 Bulk Provider Odds Display Diagnose 20260920

on:
  push:
    branches: [work/ball46-bulk-provider-odds-display-fix-v1-20260920]
    paths:
      - '.github/workflows/ball46-bulk-provider-odds-display-diagnose-20260920.yml'

permissions:
  contents: read

env:
  BALL46_URL: https://ball46.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_CANONICAL_BRANCH: work/ball46-viewer-readonly-lock-v1-20260920

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Load canonical Ball46 wrapper config
        run: |
          set -euo pipefail
          git fetch origin "$API_CANONICAL_BRANCH" --no-tags
          git show FETCH_HEAD:workers/nomadtips3-343-preview/wrangler.ball46.jsonc > workers/nomadtips3-343-preview/wrangler.ball46.jsonc
      - name: List current Ball46 versions
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 versions list --config wrangler.ball46.jsonc --json
      - name: List current Ball46 deployments
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deployments list --config wrangler.ball46.jsonc --json
      - name: Verify current viewer-readonly runtime
        run: |
          set -euo pipefail
          curl -fsS -L --max-time 25 "$BALL46_URL/live-summary-full-odds-343.js?diag=$GITHUB_RUN_ID" -o /tmp/live-summary.js
          grep -Fq 'BALL46_VIEWER_READONLY_LOCK_V1' /tmp/live-summary.js
          scan_code=$(curl -sS -L --max-time 25 -o /tmp/scan.json -w '%{http_code}' "$BALL46_URL/api/engine/scan?diag=$GITHUB_RUN_ID")
          [ "$scan_code" = 403 ]
          grep -Fq 'BALL46_VIEWER_READONLY_LOCK_V1' /tmp/scan.json
          fm_code=$(curl -sS -L --max-time 25 -o /tmp/fm.json -w '%{http_code}' "$BALL46_URL/api/full-market/fixture-odds?diag=$GITHUB_RUN_ID")
          [ "$fm_code" = 410 ]
          grep -Fq 'BALL46_VIEWER_READONLY_LOCK_V1' /tmp/fm.json
          for ep in engine hub full-market; do curl -fsS -L --max-time 25 "$BALL46_URL/api/$ep/health?diag=$GITHUB_RUN_ID" -o "/tmp/$ep.json"; done
          node - <<'NODE'
          const fs=require('fs');
          for(const n of ['engine','hub','full-market']){
            const j=JSON.parse(fs.readFileSync(`/tmp/${n}.json`,'utf8'));
            console.log('BACKEND',n,JSON.stringify({ok:j.ok,version:j.version,component:j.component,staleCachePolicy:j.staleCachePolicy||''}));
            if(j?.ok!==true) process.exit(1);
          }
          NODE
          echo BALL46_BULK_PROVIDER_ODDS_DISPLAY_DIAG_PASS
