name: BALL46 isolated flow scroll release QA
on:
  push:
    branches: [test/ball46-ui-interaction-baseline-20261125]
    paths: ['.github/workflows/qa-ball46-flow-scroll-release.yml']
permissions:
  contents: read
jobs:
  touch:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install chromium --only-shell
      - run: |
          node <<'JS'
          const {chromium,devices}=require('playwright'),assert=require('node:assert/strict');
          const url='https://www.ball46.com/';
          (async()=>{const browser=await chromium.launch();try{
           for(const name of ['Desktop','Pixel 7','iPhone 13']){
           const p=await browser.newPage({...(devices[name]??{viewport:{width:1440,height:900}}),defaultBrowserType:'chromium',serviceWorkers:'block'});
           const errors=[];p.on('pageerror',e=>errors.push(e.message));const asset=p.waitForResponse(r=>new URL(r.url()).pathname==='/ui-sync-fixes-343-v2.js',{timeout:28000});
           const doc=await p.goto(url,{waitUntil:'domcontentloaded',timeout:32000});
           assert.ok(['ball46.com','www.ball46.com'].includes(new URL(p.url()).hostname),'Production origin expected');assert.equal(doc.headers()['x-b46-flow-scroll'],'batch-v1');
           assert.equal(await p.locator('#b46-full-market-scroll-v1').count(),1);
           const response=await asset;assert.equal(new URL(response.url()).searchParams.get('b46_flow'),'batch-v1');assert.ok((await response.text()).includes('B46_TEST_FLOW_BATCH_MARKERS_V1'),'patched event marker JS required');
           const desktop=name==='Desktop';
           const rows=p.locator(desktop?'.match-row[data-match-id]:visible':'#b46gn-cards [data-b46gn-fixture]:visible');await rows.first().waitFor({timeout:20000});
           const ids=await rows.evaluateAll(es=>es.slice(0,12).map(e=>e.dataset.b46gnFixture||e.dataset.matchId));let fit, holder, tabs, books, market;
           for(const id of ids){
            const row=rows.and(p.locator(desktop?'[data-match-id="'+id+'"]':'[data-b46gn-fixture="'+id+'"]'));await (desktop?row.click():row.tap());
            const expand=p.locator(desktop?'.match-expanded[data-expanded-match="'+id+'"]:visible':'#b46gn-detail[aria-hidden=false]');
            await expand.waitFor({timeout:8500});
            holder=expand.locator(desktop?'.expand-full-market-card:visible':'.b46gn-full-market:visible').first();
            if(!await holder.waitFor({timeout:6500}).then(()=>true,()=>false)){
             console.log('NO_MARKET',id,await expand.innerText().then(s=>s.slice(0,350)));
             await p.goto(url,{waitUntil:'domcontentloaded'});continue;
            }
            tabs=holder.locator('.fmb-tabs:visible').first();books=holder.locator('[data-fmb-book].has-data:visible');market=holder.locator('.fmb-market:visible');
            if(!await books.first().waitFor({timeout:4500}).then(()=>true,()=>false)){await p.goto(url,{waitUntil:'domcontentloaded'});continue;}
            const available=await books.count();
            for(let j=0;j<Math.min(available,4);j++){const book=books.nth(j);await (desktop?book.click():book.tap());if(await market.first().waitFor({timeout:1200}).then(()=>true,()=>false)&&await market.count()>=6){fit={id,j,available,book:(await book.textContent()).trim(),markets:await market.count()};break;}}
            if(fit)break;await p.goto(url,{waitUntil:'domcontentloaded'});
           }
           assert.ok(fit,'no populated mobile market');await tabs.scrollIntoViewIfNeeded();await p.waitForTimeout(450);
           await p.screenshot({path:name.replace(/\W/g,'-')+'.png'});
           const snap=()=>holder.evaluate(el=>({height:Math.round(el.getBoundingClientRect().height),top:Math.round(el.getBoundingClientRect().top),scroll:[...function*(n){for(;n;n=n.parentElement)yield n}(el)].reduce((sum,n)=>sum+n.scrollTop,0),viewport:innerWidth,pageWidth:document.documentElement.scrollWidth,marketStyle:getComputedStyle(el.querySelector('.fmb-market')).contentVisibility,icons:document.querySelectorAll('#b46gn-detail .expand-flow-card [data-b46-event-icon]').length}));
           const cdp=await p.context().newCDPSession(p);const vp=p.viewportSize();const x=Math.round(vp.width*0.5);const observed=[await snap()];
           if(desktop){const b=await tabs.boundingBox();await p.mouse.move(x,Math.min(vp.height-50,b.y+b.height+150));for(const sign of [1,1,-1,1,-1,-1])for(let j=0;j<4;j++){await p.mouse.wheel(0,125*sign);await p.waitForTimeout(90);observed.push(await snap());}}
           else for(const sign of [1,1,-1,1,-1,-1]){
            const y=sign>0?Math.round(vp.height*.80):Math.round(vp.height*.31);
            await cdp.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x,y}]});
            for(let i=1;i<=10;i++){await cdp.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x,y:y-sign*i*29}]});await p.waitForTimeout(25);observed.push(await snap());}
            await cdp.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});await p.waitForTimeout(250);observed.push(await snap());
           }
           const report={name,fit,heights:[...new Set(observed.map(o=>o.height))],scrollMin:Math.min(...observed.map(o=>o.scroll)),scrollMax:Math.max(...observed.map(o=>o.scroll)),first:observed[0],errors};
           console.log('MOBILE',JSON.stringify(report));
           assert.ok(report.scrollMax-report.scrollMin>235,'vertical touch scroll must move');
           assert.ok(report.first.pageWidth<=vp.width+2,'page must not overflow horizontally');
           assert.equal(report.first.marketStyle,'visible');assert.equal(report.heights.length,1,'Full Market height must not change while scrolling');
           if(fit.available>1){const other=books.nth(fit.j===0?1:0);await (desktop?other.click():other.tap());assert.equal(await other.getAttribute('aria-pressed'),'true');await (desktop?books.nth(fit.j).click():books.nth(fit.j).tap());assert.equal(await books.nth(fit.j).getAttribute('aria-pressed'),'true');await p.waitForTimeout(250);assert.equal(await market.count(),fit.markets);}
           assert.deepEqual(errors,[]);
           if(desktop){for(const route of ['/?view=statistics','/prematch/over-under/']){const check=await p.request.get(new URL(route,url).href,{timeout:10000});assert.equal(check.status(),200,'untouched route '+route);const html=await check.text();assert.ok(html.includes('<html')&&html.length>2000);assert.ok(!html.includes('B46_PM_NAV_INDEPENDENT_PALETTE_V1')&&!html.includes('B46_TEST_THEME_LOADING_V1'));console.log('UNCHANGED_ROUTE',route,check.status());}}
           await p.close();
           }
          }finally{await browser.close()}})().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-market-screens
          path: '*.png'
          if-no-files-found: ignore
          retention-days: 3
