name: Deploy Ball46 Daily Performance 20261005

on:
  workflow_dispatch:
  push:
    branches:
      - work/ball46-daily-performance-20261005
    paths:
      - '.github/workflows/deploy-ball46-daily-performance-20261005.yml'
      - 'deploy-assets/daily-performance-20261005/**'

permissions:
  contents: read

concurrency:
  group: ball46-production-daily-performance
  cancel-in-progress: false

jobs:
  guarded-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_ENABLED: 'true'
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install parser dependency only
        run: npm install --no-save --ignore-scripts acorn@8

      - name: Guarded current-Production deploy
        working-directory: deploy-assets/daily-performance-20261005
        run: node run.mjs

      - name: Upload audit and rollback proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-daily-performance-${{ github.run_id }}
          path: deploy-assets/daily-performance-20261005/audit
          if-no-files-found: warn
          retention-days: 30
