name: DIAG Ball46 live lock 20261002

on:
  push:
    branches: [diag/ball46-live-lock-20261002]
    paths:
      - '.github/workflows/diag-ball46-live-lock-20261002.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  BALL46_URL: https://ball46.com

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Capture current Ball46 Event Flow source read-only
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          mkdir -p /tmp/b46diag/modules /tmp/b46diag/public

          # READ ONLY: lock current production deployment and traffic.
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=5" -H "$AUTH" -o /tmp/b46diag/deployments.json
          node - <<'NODE'
          const fs=require('fs');const j=require('/tmp/b46diag/deployments.json');
          if(j.success!==true)throw Error('DEPLOYMENTS_READ_FAILED');
          const d=j.result?.deployments?.[0],vs=d?.versions||[];
          if(!d||vs.length!==1||Number(vs[0].percentage)!==100)throw Error('NOT_SINGLE_100_TRAFFIC');
          fs.writeFileSync('/tmp/b46diag/current-version',String(vs[0].version_id));
          console.log('LATEST_DEPLOYMENT_ID='+d.id);
          console.log('TRAFFIC_VERSIONS='+vs.map(v=>`${v.version_id}:${v.percentage}`).join(','));
          console.log('CURRENT_PRODUCTION_VERSION='+vs[0].version_id);
          NODE

          V=$(cat /tmp/b46diag/current-version)
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/workers/$SCRIPT_NAME/versions/$V?include=modules" -H "$AUTH" -o /tmp/b46diag/version.json
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');const j=require('/tmp/b46diag/version.json');
          if(j.success!==true)throw Error('VERSION_READ_FAILED');const r=j.result||{};
          fs.writeFileSync('/tmp/b46diag/main-module',String(r.main_module||''));
          for(const m of r.modules||[]){const b=Buffer.from(m.content_base64||'','base64');const p=path.join('/tmp/b46diag/modules',m.name);fs.mkdirSync(path.dirname(p),{recursive:true});fs.writeFileSync(p,b);console.log(`MODULE_SHA=${m.name}:${crypto.createHash('sha256').update(b).digest('hex')}:${b.length}`)}
          NODE
          rm -f /tmp/b46diag/version.json

          # READ ONLY: exact live Event Flow assets and surrounding page.
          K="${GITHUB_RUN_ID}-$(date +%s%N)"
          for p in index.html signal-event-flow-line-343.css signal-event-flow-line-343.js dashboard-v2-tune.css dashboard-v2-stage3.js; do
            curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/$p?diag=$K" -o "/tmp/b46diag/public/$p"
            echo "PUBLIC_SHA=$p:$(sha256sum "/tmp/b46diag/public/$p"|awk '{print $1}'):$(wc -c < "/tmp/b46diag/public/$p"|tr -d ' ')"
          done
          node --check /tmp/b46diag/public/signal-event-flow-line-343.js
          node --check /tmp/b46diag/public/dashboard-v2-stage3.js

          # Prove the target is present in the current Worker and public files.
          MAIN=$(cat /tmp/b46diag/main-module)
          grep -Ein -m 30 'signal-event-flow-line-343|event[[:space:]_-]*flow|momentum' "/tmp/b46diag/modules/$MAIN" /tmp/b46diag/public/index.html /tmp/b46diag/public/signal-event-flow-line-343.css /tmp/b46diag/public/signal-event-flow-line-343.js || true

          curl -fsS "$BALL46_URL/api/engine/health?diag=$K" -o /tmp/b46diag/engine.json
          curl -fsS "$BALL46_URL/api/full-market/health?diag=$K" -o /tmp/b46diag/full.json
          node - <<'NODE'
          const e=require('/tmp/b46diag/engine.json'),f=require('/tmp/b46diag/full.json');if(e.ok!==true||f.ok!==true)throw Error('LIVE_BACKEND_NOT_OK');console.log('LIVE_BACKEND_OK');console.log('EVENT_FLOW_CAPTURE_READ_ONLY_PASS');
          NODE
          rm -f /tmp/b46diag/engine.json /tmp/b46diag/full.json

      - name: Upload read-only Event Flow capture
        uses: actions/upload-artifact@v4
        with:
          name: ball46-event-flow-live-${{ github.run_id }}
          path: /tmp/b46diag
          retention-days: 7
