name: Member2 Restore Live Auth Only
on:
  push:
    branches: [hotfix/member2-access-data-restore-20261011]
    paths: ['.github/workflows/member2-auth-hotfix-prod.yml']
permissions: {contents: read}
concurrency:
  group: member2-isolated-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a28a6ec368ad5e1a84eadf11dae358c44870fa87
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pre-deploy safety and signed-Access tests
        run: |
          set -euo pipefail
          test "$(node -p "JSON.parse(require('fs').readFileSync('ball46-member2/wrangler.production.jsonc')).name")" = 'ball46-member2-production'
          grep -q '"MEMBER_CHECKOUT_ENABLED":"false"' ball46-member2/wrangler.production.jsonc
          grep -q 'member2.ball46.com' ball46-member2/wrangler.production.jsonc
          node --check ball46-member2/src/worker.js
          node --check ball46-member2/public/member.js
          node --test ball46-member2/tests/*.test.mjs
      - name: Deploy only Member2 Worker, restored stable UI + signed auth fallback
        working-directory: ball46-member2
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.production.jsonc
      - name: Verify protected production remains isolated
        run: |
          set -euo pipefail
          base='https://ball46-member2-production.mccarey-supon.workers.dev'
          test "$(curl -sS --max-time 20 -o /tmp/health -w '%{http_code}' "$base/api/health")" = 200
          jq -e '.ok==true and .stage=="production"' /tmp/health
          test "$(curl -sS --max-time 20 -o /tmp/denied -w '%{http_code}' "$base/api/member/daily")" = 401
          jq -e '.error=="MEMBERSHIP_AUTH_REQUIRED"' /tmp/denied
          test "$(curl -sS --max-time 20 -o /tmp/asset -w '%{http_code}' "$base/member.js")" = 200
          grep -q 'async function boot()' /tmp/asset
          test "$(curl -sS --max-time 20 -o /tmp/access -w '%{http_code}' 'https://member2.ball46.com/member")" = 302
          echo 'MEMBER2_AUTH_HOTFIX_DEPLOYED_AND_PROTECTED'
