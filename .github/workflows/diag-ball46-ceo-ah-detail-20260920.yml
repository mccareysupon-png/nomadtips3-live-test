name: Diagnose Ball46 Settlement Gap 20260920

on:
  push:
    branches:
      - work/ball46-ceo-ah-tuning-20260920
    paths:
      - .github/workflows/diag-ball46-ceo-ah-detail-20260920.yml

permissions:
  contents: read

jobs:
  detail:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect pending signals against board and statistics
        run: |
          set -euo pipefail
          base='https://ball46.com/api/engine'
          for ep in health board signals statistics; do
            curl -fsS -L --max-time 30 "$base/$ep?diag=settlement-gap-${{ github.run_id }}" -o "/tmp/$ep.json"
          done
          node - <<'NODE'
          const fs=require('fs');
          const health=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const board=JSON.parse(fs.readFileSync('/tmp/board.json','utf8'));
          const sig=JSON.parse(fs.readFileSync('/tmp/signals.json','utf8'));
          const stats=JSON.parse(fs.readFileSync('/tmp/statistics.json','utf8'));
          const now=Date.now();
          const fixtures=Array.isArray(board.fixtures)?board.fixtures:[];
          const pending=Array.isArray(sig.signals)?sig.signals:[];
          const rows=Array.isArray(stats.rows)?stats.rows:[];
          const fid=x=>String(x?.fixtureId??x?.fixture?.id??x?.id??'');
          const at=x=>Number(x?.createdAt??0)||0;
          const fmt=t=>t?new Date(t).toISOString():'-';
          const state=f=>String(f?.boardState??f?.status??f?.state??'').toLowerCase();
          const byId=new Map(fixtures.map(f=>[fid(f),f]).filter(([id])=>id));
          const newestStats=rows.reduce((m,x)=>Math.max(m,at(x)),0);
          const afterNewest=pending.filter(x=>at(x)>newestStats);
          const missing=pending.filter(x=>!byId.has(fid(x)));
          const missingAfter=afterNewest.filter(x=>!byId.has(fid(x)));
          const older90=pending.filter(x=>now-at(x)>=90*60*1000);
          const older120=pending.filter(x=>now-at(x)>=120*60*1000);
          const presentFinished=pending.filter(x=>{const f=byId.get(fid(x));return f&&['finished','ft','ended','full_time','full time'].includes(state(f));});
          const sample=x=>({fixtureId:fid(x),createdAt:fmt(at(x)),ageMin:Math.round((now-at(x))/60000),home:x?.home??x?.homeName??x?.teams?.home?.name,away:x?.away??x?.awayName??x?.teams?.away?.name,market:x?.market,selection:x?.selection,line:x?.line});
          console.log('SETTLEMENT_GAP_SUMMARY',JSON.stringify({engine:health.version,statsRows:rows.length,newestStatsCreatedAt:newestStats,newestStatsISO:fmt(newestStats),boardFixtures:fixtures.length,pending:pending.length,pendingAfterNewest:afterNewest.length,pendingMissingFromBoard:missing.length,pendingAfterNewestMissingFromBoard:missingAfter.length,pendingOlder90m:older90.length,pendingOlder120m:older120.length,pendingPresentButFinished:presentFinished.length,allSignalCount:sig.allCount,hubVersion:board.hubVersion,hubFetchedAt:board.hubFetchedAt,hubAgeMs:board.hubAgeMs,boardStale:board.stale}));
          console.log('PENDING_AFTER_NEWEST_SAMPLE',JSON.stringify(afterNewest.slice(0,30).map(sample)));
          console.log('MISSING_FROM_BOARD_SAMPLE',JSON.stringify(missing.slice(0,30).map(sample)));
          console.log('OLDER120_MISSING_SAMPLE',JSON.stringify(older120.filter(x=>!byId.has(fid(x))).slice(0,30).map(sample)));
          console.log('PRESENT_FINISHED_PENDING_SAMPLE',JSON.stringify(presentFinished.slice(0,20).map(x=>({...sample(x),boardState:state(byId.get(fid(x))),goals:byId.get(fid(x))?.goals}))));
          if(!health?.ok) throw Error('ENGINE_UNHEALTHY');
          if(!stats?.ok||!sig?.ok||!board?.ok) throw Error('DIAG_ENDPOINT_UNHEALTHY');
          NODE
