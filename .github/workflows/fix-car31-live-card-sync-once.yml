name: Fix CAR 3.1 live card sync once

on:
  push:
    paths:
      - '.github/workflows/fix-car31-live-card-sync-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Patch live card synchronization
        run: python .github/scripts/fix_car31_live_card_sync.py
      - name: Validate JavaScript
        run: |
          node --check car3-1-hybrid-live-engine/web/app.js
          node --check car3-1-hybrid-live-engine/web/signal-polish.js
      - name: Commit fix
        run: |
          git config user.name 'NOMADTIPS3 automation'
          git config user.email 'actions@users.noreply.github.com'
          git add car3-1-hybrid-live-engine/web/app.js car3-1-hybrid-live-engine/web/signal-polish.js
          git diff --cached --quiet && exit 0
          git commit -m 'CAR 3.1 remove stale finished live cards promptly'
          git push origin HEAD:main
