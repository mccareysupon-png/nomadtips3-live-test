name: Restore Ball46 Signal Scorebar 20260926

on:
  push:
    branches: [work/ball46-restore-signal-scorebar-20260926]
    paths:
      - '.github/workflows/restore-ball46-signal-scorebar-20260926.yml'

permissions:
  contents: read

env:
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  BALL46_PUBLIC: https://www.ball46.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  restore-signal-scorebar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Mirror exact current Production and snapshot target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod /tmp/rollback
          fetch_required(){
            name="$1"; safe="${name//\//_}"
            code=$(curl -sS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 -o "/tmp/prod/$safe" -w '%{http_code}' "$BALL46_WORKER/$name?signal-scorebar-copy=${GITHUB_RUN_ID}") || true
            [ "$code" = 200 ] || { echo "REQUIRED_PROD_ASSET_HTTP_${code}:$name"; exit 1; }
            test -s "/tmp/prod/$safe" || { echo "REQUIRED_PROD_ASSET_EMPTY:$name"; exit 1; }
            mkdir -p "$(dirname "nomad-live-343/$name")"
            cp "/tmp/prod/$safe" "nomad-live-343/$name"
          }
          fetch_required index.html
          fetch_required dashboard-v2-stage3.js
          cp nomad-live-343/dashboard-v2-stage3.js /tmp/rollback/dashboard-v2-stage3.js
          cp nomad-live-343/index.html /tmp/rollback/index.html
          sha256sum nomad-live-343/index.html | awk '{print $1}' > /tmp/index-before.sha
          sha256sum nomad-live-343/dashboard-v2-stage3.js | awk '{print $1}' > /tmp/target-before.sha
          grep -Fc 'fetch(' nomad-live-343/dashboard-v2-stage3.js > /tmp/fetch-before.count
          grep -Fq 'const COLLAPSED_LIMIT=10;' nomad-live-343/dashboard-v2-stage3.js
          grep -Fq 'function renderBoard(){' nomad-live-343/dashboard-v2-stage3.js
          protected='dashboard-v2.css dashboard-v2-tune.js v2-shared.css v2-shared.js bulk-odds-compat-343.js expanded-match-343.js full-market-bookmaker-343.js live-summary-full-odds-343.js signal-next.js singlepage-workspace-343.js singlepage-workspace-343.css signal-shared-view-343.css ball46-next.css market-registry-343.js'
          : > /tmp/protected.sha
          for f in $protected; do
            fetch_required "$f"
            printf '%s  %s\n' "$(sha256sum "nomad-live-343/$f" | awk '{print $1}')" "$f" >> /tmp/protected.sha
          done
          curl -fsS -L --retry 4 --retry-all-errors --max-time 25 "$BALL46_WORKER/api/engine/board?signal-scorebar-before=${GITHUB_RUN_ID}" -o /tmp/board-before.json
          curl -fsS -L --retry 4 --retry-all-errors --max-time 25 "$BALL46_WORKER/api/engine/signals?signal-scorebar-before=${GITHUB_RUN_ID}" -o /tmp/signals-before.json
          curl -fsS -L --retry 4 --retry-all-errors --max-time 25 "$BALL46_WORKER/api/engine/statistics?signal-scorebar-before=${GITHUB_RUN_ID}" -o /tmp/stats-before.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/board-before.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals-before.json'));
          const t=JSON.parse(fs.readFileSync('/tmp/stats-before.json'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures))throw Error('PRE_BOARD');
          if(!Array.isArray(s?.signals))throw Error('PRE_SIGNALS');
          if(t?.ok!==true||!Array.isArray(t?.rows))throw Error('PRE_STATS');
          NODE

      - name: Restore presentation-only scorebar on Signal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('nomad-live-343/dashboard-v2-stage3.js')
          s=p.read_text()
          marker='BALL46_SCOREBAR10_20260925'
          if marker in s:
              s=s.replace('body[data-workspace-view="signal"] .ball46-scorebar10,body[data-workspace-view="statistics"] .ball46-scorebar10{display:none}', 'body[data-workspace-view="statistics"] .ball46-scorebar10{display:none}')
          else:
              anchor='function renderBoard(){'
              if s.count(anchor)!=1: raise SystemExit('RENDER_BOARD_ANCHOR_BAD')
              code=r'''/* BALL46_SCOREBAR10_20260925 — presentation only; reuses current fixtures, zero extra requests */
function renderScorebar10(){
  let bar=document.querySelector('[data-ball46-scorebar10]');
  const workspace=document.querySelector('.workspace');
  if(!workspace)return;
  if(!bar){
    bar=document.createElement('section');bar.className='ball46-scorebar10';bar.dataset.ball46Scorebar10='1';bar.setAttribute('aria-label','Live match scorebar');workspace.parentNode.insertBefore(bar,workspace);
    if(!document.getElementById('ball46-scorebar10-style')){const st=document.createElement('style');st.id='ball46-scorebar10-style';st.textContent='.ball46-scorebar10{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:1px;margin:0 0 10px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}.ball46-scorebar10 .sb10-item{min-width:0;border:0;background:var(--panel);color:var(--text);padding:7px 8px;text-align:left;cursor:pointer}.ball46-scorebar10 .sb10-item:hover,.ball46-scorebar10 .sb10-item.active{background:var(--green-soft)}.ball46-scorebar10 .sb10-item.active{box-shadow:inset 0 -2px var(--green)}.ball46-scorebar10 .sb10-top{display:flex;align-items:center;justify-content:space-between;gap:5px;color:var(--muted);font-size:7px;font-weight:900}.ball46-scorebar10 .sb10-score{color:var(--green);font-size:13px}.ball46-scorebar10 .sb10-team{display:block;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:8px;font-weight:800}.ball46-scorebar10 .sb10-team.away{color:var(--yellow)}body[data-workspace-view="statistics"] .ball46-scorebar10{display:none}@media(max-width:1180px){.ball46-scorebar10{grid-template-columns:repeat(10,minmax(120px,1fr));overflow-x:auto}}@media(max-width:760px){.ball46-scorebar10{display:none!important}}';document.head.appendChild(st)}
  }
  const rows=visibleRows().filter(function(f){return classify(f)==='live'}).slice(0,10);
  if(!rows.length){bar.innerHTML='<div class="sb10-item"><span class="sb10-team">No live matches</span></div>';return;}
  bar.innerHTML=rows.map(function(f){const id=fixtureKey(f),p=scorePair(f),score=(p.home===null||p.away===null)?'—':(show(p.home)+'–'+show(p.away)),active=id===selectedId?' active':'',home=f&&f.home&&f.home.name?f.home.name:'—',away=f&&f.away&&f.away.name?f.away.name:'—';return '<button type="button" class="sb10-item'+active+'" data-scorebar10-id="'+esc(id)+'"><span class="sb10-top"><span>'+esc(detailedStatus(f))+'</span><strong class="sb10-score">'+esc(score)+'</strong></span><span class="sb10-team">'+esc(home)+'</span><span class="sb10-team away">'+esc(away)+'</span></button>';}).join('');
  bar.querySelectorAll('[data-scorebar10-id]').forEach(function(btn){btn.addEventListener('click',function(){selectedId=btn.dataset.scorebar10Id;renderBoard();renderFeatured();});});
}
'''
              s=s.replace(anchor,code+anchor.replace('{','{renderScorebar10();'),1)
          p.write_text(s)
          PY
          node --check nomad-live-343/dashboard-v2-stage3.js
          grep -Fq 'BALL46_SCOREBAR10_20260925' nomad-live-343/dashboard-v2-stage3.js
          grep -Fq 'function renderBoard(){renderScorebar10();' nomad-live-343/dashboard-v2-stage3.js
          ! grep -Fq 'body[data-workspace-view="signal"] .ball46-scorebar10' nomad-live-343/dashboard-v2-stage3.js
          [ "$(cat /tmp/fetch-before.count)" = "$(grep -Fc 'fetch(' nomad-live-343/dashboard-v2-stage3.js)" ]
          [ "$(cat /tmp/index-before.sha)" = "$(sha256sum nomad-live-343/index.html | awk '{print $1}')" ]
          while read -r expected f; do [ "$(sha256sum "nomad-live-343/$f"|awk '{print $1}')" = "$expected" ] || exit 1; done < /tmp/protected.sha

      - name: Race guard and dry run
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --retry 4 --retry-all-errors --max-time 25 "$BALL46_WORKER/dashboard-v2-stage3.js?signal-scorebar-race=${GITHUB_RUN_ID}" -o /tmp/target-race.js
          [ "$(sha256sum /tmp/target-race.js|awk '{print $1}')" = "$(cat /tmp/target-before.sha)" ] || { echo 'PRODUCTION_MOVED_ABORT'; exit 1; }
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy only current Production plus scorebar patch
        id: deploy
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify Signal scorebar and continuity
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 20); do
            if curl -fsS -L --retry 2 --retry-all-errors --max-time 20 "$BALL46_WORKER/dashboard-v2-stage3.js?signal-scorebar-after=${GITHUB_RUN_ID}-${n}" -o /tmp/target.after.js && grep -Fq 'BALL46_SCOREBAR10_20260925' /tmp/target.after.js && ! grep -Fq 'body[data-workspace-view="signal"] .ball46-scorebar10' /tmp/target.after.js; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = 1 ] || exit 1
          node --check /tmp/target.after.js
          [ "$(cat /tmp/fetch-before.count)" = "$(grep -Fc 'fetch(' /tmp/target.after.js)" ]
          curl -fsS -L --retry 4 --retry-all-errors --max-time 25 "$BALL46_WORKER/index.html?signal-scorebar-index=${GITHUB_RUN_ID}" -o /tmp/index.after.html
          [ "$(sha256sum /tmp/index.after.html|awk '{print $1}')" = "$(cat /tmp/index-before.sha)" ]
          while read -r expected f; do curl -fsS -L --retry 4 --retry-all-errors --max-time 25 "$BALL46_WORKER/$f?signal-scorebar-protected=${GITHUB_RUN_ID}" -o "/tmp/${f//\//_}.after"; [ "$(sha256sum "/tmp/${f//\//_}.after"|awk '{print $1}')" = "$expected" ] || exit 1; done < /tmp/protected.sha
          curl -fsS -L --retry 4 --retry-all-errors --max-time 25 "$BALL46_WORKER/api/engine/board?signal-scorebar-final=${GITHUB_RUN_ID}" -o /tmp/board-after.json
          curl -fsS -L --retry 4 --retry-all-errors --max-time 25 "$BALL46_WORKER/api/engine/signals?signal-scorebar-final=${GITHUB_RUN_ID}" -o /tmp/signals-after.json
          curl -fsS -L --retry 4 --retry-all-errors --max-time 25 "$BALL46_WORKER/api/engine/statistics?signal-scorebar-final=${GITHUB_RUN_ID}" -o /tmp/stats-after.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/board-after.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals-after.json'));
          const t=JSON.parse(fs.readFileSync('/tmp/stats-after.json'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures))throw Error('POST_BOARD');
          if(!Array.isArray(s?.signals))throw Error('POST_SIGNALS');
          if(t?.ok!==true||!Array.isArray(t?.rows))throw Error('POST_STATS');
          console.log('BALL46_SIGNAL_SCOREBAR_RESTORE_PASS');
          NODE

      - name: Roll back target if verification fails
        if: failure() && steps.deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/rollback/dashboard-v2-stage3.js nomad-live-343/dashboard-v2-stage3.js
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc
