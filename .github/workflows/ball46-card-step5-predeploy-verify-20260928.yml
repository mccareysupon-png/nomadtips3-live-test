name: VERIFY ONLY - Ball46 Card Rebuild Step5 20260928

on:
  push:
    branches:
      - work/ball46-card-rebuild-step5-20260928
    paths:
      - '.github/workflows/ball46-card-step5-predeploy-verify-20260928.yml'
      - '.github/scripts/ball46_card_step5_predeploy_verify_20260928.sh'

permissions:
  contents: read
  actions: read

jobs:
  verify-no-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download exact verified Ball46 asset package
        uses: actions/download-artifact@v4
        with:
          name: ball46-odds-visible-36361291283
          path: /tmp/b46-step5-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36361291283
      - name: Verify current Production and build one-file candidate without deploy
        shell: bash
        run: bash .github/scripts/ball46_card_step5_predeploy_verify_20260928.sh
      - name: Upload Step5 verification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-card-step5-predeploy-${{ github.run_id }}
          path: /tmp/b46-step5
          if-no-files-found: error
          retention-days: 30
