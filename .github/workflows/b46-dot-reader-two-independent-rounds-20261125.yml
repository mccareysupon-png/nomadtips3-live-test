name: BALL46 Dot read-only 2 independent sessions and real 15m Cron proof TEST 20261125
on:
  push:
    branches: [feature/ball46-adaptive-manual-control-test-20261125]
    paths: [.github/workflows/b46-dot-reader-two-independent-rounds-20261125.yml]
permissions: {contents: read}
jobs:
  fresh-reader-A:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      B46_PROBE_ID: COLD_READER_A_NO_BROWSER
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify fresh process reader auth, fail-closed stale data, no writes
        run: node qa/prematch-history-20261120/b46-adaptive-dot-independent-probe-test-20261125.mjs --allow-pending
  fresh-reader-B-after-real-cron:
    needs: fresh-reader-A
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      B46_PROBE_ID: COLD_READER_B_AFTER_NEXT_ACTUAL_15M_CRON
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Wait for a genuine next Cloudflare scheduled quarter-hour plus propagation (no HTTP POST)
        run: |
          now=$(date -u +%s)
          next=$(( (now / 900 + 1) * 900 + 90 ))
          delay=$((next - now))
          echo "Awaiting next real */15 UTC Cron + 90 sec; no synthetic trigger or owner tab"
          sleep "$delay"
      - name: Prove separate runner reads 42 formula risk and persisted Risk Guard Cron execution
        run: node qa/prematch-history-20261120/b46-adaptive-dot-independent-probe-test-20261125.mjs
