name: Deploy Tested 3.42 OVER Full Win Gate Once

on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/deploy-342-over-full-win-once.yml'

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  ENGINE_URL: https://nomadtips3-342-signal-engine.mccarey-supon.workers.dev

jobs:
  validate-deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate tested full-win goal gate
        shell: bash
        run: |
          set -euo pipefail
          node --check workers/nomadtips3-342-signal-engine/src/index.js
          node --check nomad-live-342/market-settings-v3.js
          node --check nomad-live-342/market-settings-server-sync.js
          npm --prefix workers/nomadtips3-342-signal-engine test
          grep -Fq 'maxGoalsToFullWin:1' workers/nomadtips3-342-signal-engine/src/index.js
          grep -Fq 'fullWinGoalLimitOk(line,m.score,cfg.maxGoalsToFullWin)' workers/nomadtips3-342-signal-engine/src/index.js
          grep -Fq 'name="maxGoalsToFullWin"' nomad-live-342/settings.html

      - name: Validate Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"

      - name: Deploy 3.42 signal engine
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: workers/nomadtips3-342-signal-engine
          wranglerVersion: '4.92.0'
          command: deploy

      - name: Smoke test full-win settings contract
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 20 "$ENGINE_URL/settings?t=$(date +%s)" -o /tmp/settings.json; then
              if node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/settings.json','utf8'));
          const v=Number(j?.snapshot?.settings?.over?.maxGoalsToFullWin);
          if(j?.ok!==true||![1,2,3,999].includes(v))process.exit(1);
          if(Object.prototype.hasOwnProperty.call(j?.snapshot?.settings?.over||{},'lineMax'))process.exit(1);
          console.log(JSON.stringify({ok:j.ok,maxGoalsToFullWin:v,run:j.snapshot.run.over},null,2));
          NODE
              then ok=1; break; fi
            fi
            sleep 5
          done
          test "$ok" = 1
