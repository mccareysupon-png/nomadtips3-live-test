name: QA - Ball46 League Flag Image Load Proof 20261004

on:
  push:
    branches:
      - work/ball46-league-flags-prefix-20261004
    paths:
      - '.github/workflows/ball46-league-flags-image-load-proof-20261004.yml'
      - 'deploy-assets/match-status-svg-20261003/league-flags-image-load-proof.mjs'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove eager detached flag images load
        shell: bash
        run: |
          cd deploy-assets/match-status-svg-20261003
          export PLAYWRIGHT_EXECUTABLE_PATH
          PLAYWRIGHT_EXECUTABLE_PATH=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$PLAYWRIGHT_EXECUTABLE_PATH" || { echo CHROME_MISSING; exit 1; }
          npm ci --ignore-scripts --no-audit --no-fund
          node league-flags-image-load-proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-league-flags-image-load-proof-${{ github.run_id }}
          path: deploy-assets/match-status-svg-20261003/audit/league-flags-image-load-proof/
          if-no-files-found: error
          retention-days: 30
