name: BALL46 TEST inspect existing frontend prediction history cards & Adaptive record map 20261124
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-ou-original-cards-readonly-20261124.yml, qa/prematch-history-20261120/b46-ou-original-cards-readonly-20261124.mjs]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Inspect deployed TEST original cards and record fields without writes
        run: node qa/prematch-history-20261120/b46-ou-original-cards-readonly-20261124.mjs
