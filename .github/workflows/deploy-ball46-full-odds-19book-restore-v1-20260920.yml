name: Deploy Ball46 Full Odds 19Book Restore V1 20260920

on:
  push:
    branches: [work/ball46-full-odds-19book-restore-v1-20260920]
    paths:
      - '.github/workflows/deploy-ball46-full-odds-19book-restore-v1-20260920.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_URL: https://ball46.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  EXPECTED_PROD_VERSION: 4ffb5681-89aa-47b3-b2b3-75c25dfb231c
  EXPECT_ENGINE: nomad343-engine-v6.2-viewer-readonly-cron-referee-lock-v1
  EXPECT_HUB: nomad343-5usd-hub-v5-last-good-continuity
  EXPECT_FULLMARKET: nomad343-ball46-full-market-v6-server-prewarm-cache
  API_CANONICAL_BRANCH: work/ball46-viewer-readonly-lock-v1-20260920
  PATCH_JS: live-summary-full-odds-343.js

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preflight exact production and backend invariants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod /tmp/before /tmp/patch
          npx --yes wrangler@4.92.0 deployments list --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc --json > /tmp/deployments-before.json
          node - <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/deployments-before.json','utf8'));
          const last=rows[rows.length-1];
          const current=last?.versions?.find(v=>Number(v.percentage)===100)?.version_id||'';
          console.log('CURRENT_PROD_VERSION',current);
          if(current!==process.env.EXPECTED_PROD_VERSION) throw Error(`PRODUCTION_MOVED:${current}`);
          fs.writeFileSync('/tmp/prod-version',current);
          NODE

          for page in index.html signal.html statistics.html; do
            curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/$page?fullodds-before=$GITHUB_RUN_ID" -o "/tmp/prod/$page"
            test -s "/tmp/prod/$page"
          done
          curl -fsS -L --max-time 25 "$BALL46_URL/$PATCH_JS?fullodds-before=$GITHUB_RUN_ID" -o /tmp/prod/$PATCH_JS
          grep -Fq 'BALL46_VIEWER_READONLY_LOCK_V1' /tmp/prod/$PATCH_JS
          cp "nomad-live-343/$PATCH_JS" "/tmp/patch/$PATCH_JS"
          grep -Fq 'BALL46_FULL_ODDS_19BOOK_RESTORE_V1' "/tmp/patch/$PATCH_JS"
          grep -Fq "signalFilterPrefetch:false" "/tmp/patch/$PATCH_JS"
          ! grep -Fq 'applyRichOdds' "/tmp/patch/$PATCH_JS"

          for ep in engine hub full-market; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/api/$ep/health?fullodds-before=$GITHUB_RUN_ID" -o "/tmp/before/$ep.json"
          done
          node - <<'NODE'
          const fs=require('fs');
          const expected={engine:process.env.EXPECT_ENGINE,hub:process.env.EXPECT_HUB,'full-market':process.env.EXPECT_FULLMARKET};
          const out={};
          for(const n of ['engine','hub','full-market']){
            const j=JSON.parse(fs.readFileSync(`/tmp/before/${n}.json`,'utf8'));
            if(j?.ok!==true) throw Error(`PREFLIGHT_${n}_FAIL`);
            out[n]={version:String(j.version||''),component:String(j.component||'')};
            if(out[n].version!==expected[n]) throw Error(`BACKEND_CHANGED_${n}:${out[n].version}`);
          }
          fs.writeFileSync('/tmp/backend-before.json',JSON.stringify(out,null,2));
          console.log('BACKEND_BEFORE',JSON.stringify(out));
          NODE

          scan_code=$(curl -sS -L --max-time 25 -o /tmp/before/scan.json -w '%{http_code}' "$BALL46_URL/api/engine/scan?fullodds-before=$GITHUB_RUN_ID")
          [ "$scan_code" = 403 ]
          grep -Fq 'VIEWER_ENGINE_TRIGGER_DISABLED' /tmp/before/scan.json
          engine_odds_code=$(curl -sS -L --max-time 25 -o /tmp/before/engine-odds.json -w '%{http_code}' "$BALL46_URL/api/engine/fixture-odds?fullodds-before=$GITHUB_RUN_ID")
          [ "$engine_odds_code" = 403 ]
          fm_code=$(curl -sS -L --max-time 25 -o /tmp/before/fm.json -w '%{http_code}' "$BALL46_URL/api/full-market/fixture-odds?fullodds-before=$GITHUB_RUN_ID")
          [ "$fm_code" = 410 ]
          grep -Fq 'VIEWER_PROVIDER_FETCH_DISABLED' /tmp/before/fm.json
          echo PRECHECK_EXACT_BASE_PASS

      - name: Load canonical wrapper and reopen only Full Market fixture odds
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$API_CANONICAL_BRANCH" --no-tags
          git show FETCH_HEAD:workers/nomadtips3-343-preview/src/index.js > /tmp/canonical-index.js
          git show FETCH_HEAD:workers/nomadtips3-343-preview/wrangler.ball46.jsonc > /tmp/canonical-wrangler.jsonc
          cp /tmp/canonical-index.js workers/nomadtips3-343-preview/src/index.js
          cp /tmp/canonical-wrangler.jsonc workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workers/nomadtips3-343-preview/src/index.js')
          s=p.read_text()
          old="if (path === '/fixture-odds') return Response.json({ok:false,error:'VIEWER_PROVIDER_FETCH_DISABLED',mode:'CENTRAL_CACHE_READ_ONLY',externalRequestsAdded:0,lock:'BALL46_VIEWER_READONLY_LOCK_V1'},{status:410,headers:{'cache-control':'no-store'}});"
          new="if (path === '/fixture-odds') return env.FULL_MARKET.fetch(fullMarketRequest(request, '/fixture-odds'));"
          if s.count(old)!=1: raise SystemExit('CANONICAL_FIXTURE_ODDS_LOCK_PATTERN_CHANGED')
          s=s.replace(old,new)
          p.write_text(s)
          PY
          grep -Fq "if (path === '/fixture-odds') return env.FULL_MARKET.fetch" workers/nomadtips3-343-preview/src/index.js
          grep -Fq "VIEWER_ENGINE_TRIGGER_DISABLED" workers/nomadtips3-343-preview/src/index.js
          ! grep -Fq "VIEWER_PROVIDER_FETCH_DISABLED" workers/nomadtips3-343-preview/src/index.js
          cmp -s /tmp/canonical-wrangler.jsonc workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          echo WRAPPER_SURGICAL_ROUTE_PATCH_PASS

      - name: Prove Full Market source requests all 19 books in one provider call
        shell: bash
        run: |
          set -euo pipefail
          git show FETCH_HEAD:workers/nomadtips3-full-market-343-ball46/src/index.js > /tmp/full-market-source.js
          node - <<'NODE'
          const fs=require('fs'); const s=fs.readFileSync('/tmp/full-market-source.js','utf8');
          const books=['bet365','pinnacle','williamhill','ladbrokes','vcbet','1xbet','bwin','easybets','interwetten','betfair','snai','macauslot','betsson','betathome','18bet','10bet','12bet','coral','crown'];
          for(const b of books) if(!s.includes(`'${b}'`)&&!s.includes(`\"${b}\"`)) throw Error(`MISSING_BOOK:${b}`);
          if(!s.includes("BOOKMAKERS.join(',')")) throw Error('BOOKMAKER_FANOUT_CONTRACT_MISSING');
          if(!s.includes("url.searchParams.set('bookmakers'")) throw Error('MULTIBOOK_QUERY_MISSING');
          console.log('FULL_MARKET_19BOOK_ONE_REQUEST_CONTRACT_PASS',books.length);
          NODE

      - name: Build deployment assets from current Production bytes
        shell: bash
        run: |
          set -euo pipefail
          mv nomad-live-343 /tmp/repo-assets
          mkdir -p nomad-live-343 /tmp/names
          find /tmp/repo-assets -maxdepth 1 -type f -printf '%f\n' > /tmp/names/workspace.txt
          git ls-tree -r --name-only FETCH_HEAD nomad-live-343/ | sed 's#^nomad-live-343/##' | awk 'index($0,"/")==0' > /tmp/names/canonical.txt
          cat /tmp/names/workspace.txt /tmp/names/canonical.txt | sort -u > /tmp/names/all.txt
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            [ "$name" = "$PATCH_JS" ] && continue
            case "$name" in *.html|*.js|*.css|*.svg|*.json|*.txt|*.xml|*.png|*.webp|*.jpg|*.jpeg|*.ico|*.woff|*.woff2) ;; *) continue ;; esac
            tmp="/tmp/prod-file-${name//\//_}"
            code=$(curl -sS -L --retry 3 --retry-all-errors --retry-delay 1 --max-time 20 -o "$tmp" -w '%{http_code}' "$BALL46_URL/$name?fullodds-mirror=$GITHUB_RUN_ID") || code=000
            if [ "$code" = 200 ] && [ -s "$tmp" ]; then cp "$tmp" "nomad-live-343/$name"; fi
          done < /tmp/names/all.txt
          cp /tmp/prod/index.html nomad-live-343/index.html
          cp /tmp/prod/signal.html nomad-live-343/signal.html
          cp /tmp/prod/statistics.html nomad-live-343/statistics.html
          count=$(find nomad-live-343 -maxdepth 1 -type f | wc -l)
          echo PRODUCTION_STAGING_FILES=$count
          [ "$count" -ge 100 ] || { echo STAGING_ASSET_COUNT_TOO_LOW; exit 1; }
          cp -a nomad-live-343 /tmp/assets-before
          cp "/tmp/patch/$PATCH_JS" "nomad-live-343/$PATCH_JS"
          node --check "nomad-live-343/$PATCH_JS"
          node --check workers/nomadtips3-343-preview/src/index.js

      - name: Scope guard one UI asset plus one wrapper route only
        shell: bash
        run: |
          set -euo pipefail
          diff -qr /tmp/assets-before nomad-live-343 > /tmp/assets.diff || true
          cat /tmp/assets.diff
          [ -s /tmp/assets.diff ]
          if grep -Ev "${PATCH_JS//./\.}" /tmp/assets.diff | grep -q .; then echo UNEXPECTED_ASSET_DIFF; exit 1; fi
          grep -Fq "$PATCH_JS" /tmp/assets.diff
          cmp -s /tmp/prod/index.html nomad-live-343/index.html
          cmp -s /tmp/prod/signal.html nomad-live-343/signal.html
          cmp -s /tmp/prod/statistics.html nomad-live-343/statistics.html
          python3 - <<'PY'
          from pathlib import Path
          a=Path('/tmp/canonical-index.js').read_text()
          b=Path('workers/nomadtips3-343-preview/src/index.js').read_text()
          old="if (path === '/fixture-odds') return Response.json({ok:false,error:'VIEWER_PROVIDER_FETCH_DISABLED',mode:'CENTRAL_CACHE_READ_ONLY',externalRequestsAdded:0,lock:'BALL46_VIEWER_READONLY_LOCK_V1'},{status:410,headers:{'cache-control':'no-store'}});"
          new="if (path === '/fixture-odds') return env.FULL_MARKET.fetch(fullMarketRequest(request, '/fixture-odds'));"
          if a.replace(old,new)!=b: raise SystemExit('WRAPPER_DIFF_NOT_SURGICAL')
          PY
          echo SCOPE_GUARD_PASS

      - name: Race guard immediately before deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deployments list --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc --json > /tmp/deployments-race.json
          node - <<'NODE'
          const fs=require('fs'); const rows=JSON.parse(fs.readFileSync('/tmp/deployments-race.json','utf8')); const last=rows[rows.length-1]; const current=last?.versions?.find(v=>Number(v.percentage)===100)?.version_id||'';
          const base=fs.readFileSync('/tmp/prod-version','utf8').trim(); console.log('RACE_GUARD',base,current); if(current!==base) throw Error(`PRODUCTION_MOVED_DURING_BUILD:${current}`);
          NODE
          npx --yes wrangler@4.92.0 deploy --dry-run --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc

      - name: Deploy isolated Full Odds restore
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc

      - name: Verify route, UI isolation, backends and a real Full Odds fixture
        shell: bash
        run: |
          set -euo pipefail
          rollback(){ echo VERIFY_FAILED_ROLLBACK_TO=$EXPECTED_PROD_VERSION; npx --yes wrangler@4.92.0 rollback "$EXPECTED_PROD_VERSION" --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc || true; }
          trap rollback ERR
          mkdir -p /tmp/after
          for page in index.html signal.html statistics.html; do
            curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/$page?fullodds-after=$GITHUB_RUN_ID" -o "/tmp/after/$page"
            cmp -s "/tmp/prod/$page" "/tmp/after/$page" || { echo "HTML_CHANGED:$page"; exit 1; }
          done
          curl -fsS -L --max-time 25 "$BALL46_URL/$PATCH_JS?fullodds-after=$GITHUB_RUN_ID" -o /tmp/after/$PATCH_JS
          grep -Fq 'BALL46_FULL_ODDS_19BOOK_RESTORE_V1' /tmp/after/$PATCH_JS
          grep -Fq "signalFilterPrefetch:false" /tmp/after/$PATCH_JS
          grep -Fq "match-row>.market-cell b" /tmp/after/$PATCH_JS
          ! grep -Fq 'applyRichOdds' /tmp/after/$PATCH_JS

          scan_code=$(curl -sS -L --max-time 25 -o /tmp/after/scan.json -w '%{http_code}' "$BALL46_URL/api/engine/scan?fullodds-after=$GITHUB_RUN_ID")
          [ "$scan_code" = 403 ]
          grep -Fq 'VIEWER_ENGINE_TRIGGER_DISABLED' /tmp/after/scan.json
          engine_odds_code=$(curl -sS -L --max-time 25 -o /tmp/after/engine-odds.json -w '%{http_code}' "$BALL46_URL/api/engine/fixture-odds?fullodds-after=$GITHUB_RUN_ID")
          [ "$engine_odds_code" = 403 ]
          fm_empty_code=$(curl -sS -L --max-time 25 -o /tmp/after/fm-empty.json -w '%{http_code}' "$BALL46_URL/api/full-market/fixture-odds?fullodds-after=$GITHUB_RUN_ID")
          [ "$fm_empty_code" = 400 ]
          grep -Fq 'INVALID_FIXTURE_ID' /tmp/after/fm-empty.json

          for ep in engine hub full-market; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/api/$ep/health?fullodds-after=$GITHUB_RUN_ID" -o "/tmp/after/$ep.json"
          done
          node - <<'NODE'
          const fs=require('fs'), before=JSON.parse(fs.readFileSync('/tmp/backend-before.json','utf8'));
          for(const n of ['engine','hub','full-market']){
            const j=JSON.parse(fs.readFileSync(`/tmp/after/${n}.json`,'utf8'));
            if(j?.ok!==true) throw Error(`POST_${n}_FAIL`);
            if(String(j.version||'')!==before[n].version) throw Error(`BACKEND_VERSION_CHANGED_${n}:${j.version}`);
          }
          NODE

          curl -fsS -L --max-time 30 "$BALL46_URL/api/engine/board?fullodds-smoke=$GITHUB_RUN_ID" -o /tmp/after/board.json
          node - <<'NODE'
          const fs=require('fs'); const j=JSON.parse(fs.readFileSync('/tmp/after/board.json','utf8')); if(j?.ok!==true) throw Error('BOARD_NOT_READY');
          const rows=Array.isArray(j.fixtures)?j.fixtures:[];
          const live=rows.filter(f=>String(f?.boardState||f?.status||'').toLowerCase().includes('live')||String(f?.status||'').toLowerCase().includes('play'));
          const ids=[...new Set([...live,...rows].map(f=>String(f?.fixtureId||'').trim()).filter(Boolean))].slice(0,5);
          fs.writeFileSync('/tmp/fixture-ids',ids.join('\n')); console.log('FULL_ODDS_SMOKE_FIXTURES',ids.join(','));
          NODE

          success=0
          best_books=0
          best_requested=0
          best_fixture=''
          while IFS= read -r fid; do
            [ -n "$fid" ] || continue
            code=$(curl -sS -L --max-time 35 -o "/tmp/after/full-$fid.json" -w '%{http_code}' "$BALL46_URL/api/full-market/fixture-odds?fixtureId=$fid&fullodds-smoke=$GITHUB_RUN_ID") || code=000
            echo FULL_ODDS_SMOKE fixture=$fid status=$code
            if [ "$code" = 200 ]; then
              read -r books requested < <(node - "$fid" <<'NODE'
              const fs=require('fs'); const id=process.argv[2]; const j=JSON.parse(fs.readFileSync(`/tmp/after/full-${id}.json`,'utf8')); console.log(Number(j.bookmakerCount||0),Array.isArray(j.requestedBookmakers)?j.requestedBookmakers.length:0);
NODE
              )
              echo FULL_ODDS_COUNTS fixture=$fid returned_books=$books requested_books=$requested
              [ "$requested" -eq 19 ] || { echo REQUESTED_BOOKS_NOT_19; exit 1; }
              success=1
              if [ "$books" -gt "$best_books" ]; then best_books=$books; best_requested=$requested; best_fixture=$fid; fi
              [ "$books" -ge 2 ] && break
            fi
          done < /tmp/fixture-ids
          [ "$success" -eq 1 ] || { echo NO_FULL_ODDS_200_RESPONSE; exit 1; }
          echo FULL_ODDS_BEST fixture=$best_fixture returned_books=$best_books requested_books=$best_requested

          npx --yes wrangler@4.92.0 deployments list --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc --json > /tmp/deployments-after.json
          node - <<'NODE'
          const fs=require('fs'); const rows=JSON.parse(fs.readFileSync('/tmp/deployments-after.json','utf8')); const last=rows[rows.length-1]; const current=last?.versions?.find(v=>Number(v.percentage)===100)?.version_id||''; if(!current) throw Error('NO_ACTIVE_VERSION'); console.log('NEW_PROD_VERSION',current); fs.writeFileSync('/tmp/new-prod-version',current);
          NODE
          trap - ERR
          echo BALL46_FULL_ODDS_19BOOK_RESTORE_PASS
