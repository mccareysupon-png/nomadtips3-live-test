name: Deploy Ball46 Statistics ADD K Flash Fix 20260920

on:
  push:
    branches: [work/ball46-full-ui-recovery-20260920]
    paths:
      - '.github/workflows/deploy-ball46-statistics-addk-flashfix-20260920.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_URL: https://ball46.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight production and backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod /tmp/before
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/statistics.html?flashfix-before=$GITHUB_RUN_ID" -o /tmp/prod/statistics.html
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/statistics-refine-v2.css?flashfix-before=$GITHUB_RUN_ID" -o /tmp/prod/statistics-refine-v2.css
          grep -Fq 'statistics-refine-v2.css' /tmp/prod/statistics.html
          grep -Fq 'market-performance-cluster-v2' /tmp/prod/statistics-refine-v2.css
          for ep in engine hub full-market; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/api/$ep/health?flashfix-before=$GITHUB_RUN_ID" -o "/tmp/before/$ep.json"
          done
          node - <<'NODE'
          const fs=require('fs'); const o={};
          for(const n of ['engine','hub','full-market']){
            const j=JSON.parse(fs.readFileSync(`/tmp/before/${n}.json`,'utf8'));
            if(j?.ok!==true) throw Error(`PREFLIGHT_${n}_FAIL`);
            o[n]={version:String(j.version||''),component:String(j.component||''),staleCachePolicy:String(j.staleCachePolicy||'')};
          }
          fs.writeFileSync('/tmp/backend-before.json',JSON.stringify(o));
          console.log('BACKEND_BEFORE',JSON.stringify(o));
          NODE

      - name: Mirror current Production assets before CSS-only presentation patch
        shell: bash
        run: |
          set -euo pipefail
          cp nomad-live-343/statistics-refine-v2.css /tmp/statistics-refine-v2.flashfix.css
          mkdir -p /tmp/mirror
          while IFS= read -r f; do
            name="${f#nomad-live-343/}"
            [ "$name" = 'statistics-refine-v2.css' ] && continue
            case "$name" in *.html|*.js|*.css|*.svg|*.json|*.txt|*.xml|*.png|*.webp|*.jpg|*.jpeg|*.ico) ;; *) continue ;; esac
            tmp="/tmp/mirror/${name//\//_}"
            code=$(curl -sS -L --retry 3 --retry-all-errors --retry-delay 1 --max-time 20 -o "$tmp" -w '%{http_code}' "$BALL46_URL/$name?flashfix-mirror=$GITHUB_RUN_ID") || code=000
            if [ "$code" = 200 ] && [ -s "$tmp" ]; then cp "$tmp" "$f"; fi
          done < <(find nomad-live-343 -maxdepth 1 -type f | sort)
          cp /tmp/statistics-refine-v2.flashfix.css nomad-live-343/statistics-refine-v2.css
          cp /tmp/prod/statistics.html nomad-live-343/statistics.html

          python3 - <<'PY'
          from pathlib import Path
          import re, urllib.request, urllib.parse
          root=Path('nomad-live-343')
          base='https://ball46.com/'
          for page in ('index.html','signal.html','statistics.html'):
              p=root/page
              if not p.exists():
                  continue
              h=p.read_text(errors='ignore')
              refs=re.findall(r'(?:src|href)=["\']([^"\']+)["\']',h,re.I)
              for ref in refs:
                  ref=ref.split('#',1)[0]
                  if not ref or ref.startswith(('http:','https:','//','data:','mailto:','#','/api/')):
                      continue
                  path=ref.split('?',1)[0].lstrip('./')
                  if not re.search(r'\.(?:css|js|svg|png|webp|jpg|jpeg|ico)$',path,re.I):
                      continue
                  dst=root/path
                  if dst.exists():
                      continue
                  try:
                      data=urllib.request.urlopen(base+urllib.parse.quote(path),timeout=12).read()
                      if data:
                          dst.parent.mkdir(parents=True,exist_ok=True); dst.write_bytes(data)
                          print('mirrored extra',path)
                  except Exception as e:
                      print('skip extra',path,e)
          PY

      - name: Apply cache-busted loader only on Statistics page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('nomad-live-343/statistics.html')
          s=p.read_text()
          pat=r'(statistics-refine-v2\.css)(?:\?[^"\']*)?'
          s2,n=re.subn(pat,r'\1?v=343-stat-refine-v2-flashfix-20260920a',s,count=1)
          if n!=1: raise SystemExit(f'REFINE_CSS_LOADER_COUNT={n}')
          p.write_text(s2)
          PY
          grep -Fq 'statistics-refine-v2.css?v=343-stat-refine-v2-flashfix-20260920a' nomad-live-343/statistics.html
          grep -Fq 'Prevent ADD K from flashing in its legacy position' nomad-live-343/statistics-refine-v2.css
          grep -Fq '.ceo-performance-shell{' nomad-live-343/statistics-refine-v2.css
          grep -Fq 'display:none!important' nomad-live-343/statistics-refine-v2.css
          grep -Fq '.market-performance-cluster-v2 > .ceo-performance-shell{' nomad-live-343/statistics-refine-v2.css
          grep -Fq 'display:block!important' nomad-live-343/statistics-refine-v2.css
          ! grep -Eq 'fetch[[:space:]]*\(|/api/|XMLHttpRequest' nomad-live-343/statistics-refine-v2.css
          git diff --check -- nomad-live-343/statistics-refine-v2.css

      - name: Guard runtime files unchanged from Production mirror
        shell: bash
        run: |
          set -euo pipefail
          for f in signal-next.js statistics-next.js bulk-odds-compat-343.js odds-format-343.js full-market-bookmaker-343.js full-odds-main-343.js live-summary-full-odds-343.js dashboard-v2-stage3.js; do
            [ -f "nomad-live-343/$f" ] || continue
            tmp="/tmp/check-$f"
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_URL/$f?flashfix-guard=$GITHUB_RUN_ID" -o "$tmp"
            cmp -s "$tmp" "nomad-live-343/$f" || { echo "PROTECTED_RUNTIME_DIFF:$f"; exit 1; }
          done
          git diff --quiet HEAD -- workers/nomadtips3-343-preview/src/index.js
          git diff --quiet HEAD -- workers/nomadtips3-343-preview/wrangler.ball46.jsonc

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dry run
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify live flash fix and backend invariants
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 15); do
            if curl -fsS -L --max-time 25 "$BALL46_URL/statistics.html?flashfix-after=$GITHUB_RUN_ID-$n" -o /tmp/statistics.after.html && grep -Fq 'statistics-refine-v2.css?v=343-stat-refine-v2-flashfix-20260920a' /tmp/statistics.after.html; then break; fi
            sleep 2
          done
          grep -Fq 'statistics-refine-v2.css?v=343-stat-refine-v2-flashfix-20260920a' /tmp/statistics.after.html
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/statistics-refine-v2.css?v=343-stat-refine-v2-flashfix-20260920a" -o /tmp/refine.after.css
          grep -Fq 'Prevent ADD K from flashing in its legacy position' /tmp/refine.after.css
          grep -Fq 'display:none!important' /tmp/refine.after.css
          grep -Fq 'display:block!important' /tmp/refine.after.css
          curl -fsS -L --max-time 25 "$BALL46_URL/index.html?flashfix-page1=$GITHUB_RUN_ID" -o /tmp/index.after.html
          curl -fsS -L --max-time 25 "$BALL46_URL/signal.html?flashfix-page2=$GITHUB_RUN_ID" -o /tmp/signal.after.html
          test -s /tmp/index.after.html
          test -s /tmp/signal.after.html

          mkdir -p /tmp/after
          for ep in engine hub full-market; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/api/$ep/health?flashfix-after=$GITHUB_RUN_ID" -o "/tmp/after/$ep.json"
          done
          node - <<'NODE'
          const fs=require('fs'); const before=JSON.parse(fs.readFileSync('/tmp/backend-before.json','utf8'));
          for(const n of ['engine','hub','full-market']){
            const j=JSON.parse(fs.readFileSync(`/tmp/after/${n}.json`,'utf8'));
            if(j?.ok!==true) throw Error(`POST_${n}_FAIL`);
            for(const k of ['version','component','staleCachePolicy']){
              const now=String(j[k]||''); if(before[n][k] && now!==before[n][k]) throw Error(`${n}_${k}_CHANGED`);
            }
          }
          console.log('BALL46_STAT_ADDK_FLASHFIX_PASS');
          NODE
