name: BALL46 fullmarket bookmaker actual rendered quote probe
on:
  push:
    branches: [test/ball46-fullmarket-odds-v3-20261121]
    paths: ['.github/workflows/ball46-fullmarket-bookmaker-render-probe-20261121.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Inspect actual expanded full market after data and bookmaker selection
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const b=await chromium.launch();
          const p=await b.newPage({viewport:{width:1440,height:960},serviceWorkers:'block'});
          await p.addInitScript(()=>localStorage.setItem('nomad343_dashboard_theme_v1','dark'));
          await p.route('**/*',r=>['GET','HEAD'].includes(r.request().method())?r.continue():r.abort());
          await p.goto('https://ball46.com/?view=live',{waitUntil:'domcontentloaded',timeout:70000});
          await p.waitForFunction(()=>document.querySelectorAll('.status-section[data-status-section="live"] .match-row').length>0,null,{timeout:50000});
          const row=p.locator('.status-section[data-status-section="live"] .match-row').first();
          await row.click({position:{x:95,y:35},force:true});
          await p.waitForFunction(()=>document.querySelector('.expand-full-market-card'),null,{timeout:15000});
          await p.waitForTimeout(4500);
          const view=await p.evaluate(()=>{
           const card=document.querySelector('.expand-full-market-card');
           const nodes=[...card?.querySelectorAll('button,[role=button],select,option,a,input,[class*=fmb]')||[]];
           return {fixture:card?.closest('[data-expanded-match]')?.getAttribute('data-expanded-match'),html:card?.outerHTML.slice(0,20000),text:card?.innerText.slice(0,5000),nodes:nodes.slice(0,100).map(e=>({tag:e.tagName,cls:String(e.className),html:e.outerHTML.slice(0,1500)})),list:[...card.querySelectorAll('[data-*]')].length};
          });
          console.log('FULL_MARKET_RENDERED_CARD '+JSON.stringify(view).slice(0,35000));
          const choice=await p.evaluate(()=>{
            const c=document.querySelector('.expand-full-market-card');
            const options=[...c.querySelectorAll('button,[role=button],select,option,[data-bookmaker],.fmb-bookmaker')].filter(e=>e.getBoundingClientRect().width>10);
            return options.slice(0,16).map(e=>({tag:e.tagName,text:e.textContent?.trim().slice(0,80),html:e.outerHTML.slice(0,800)}));
          });
          console.log('FULL_MARKET_CHOICES '+JSON.stringify(choice).slice(0,13000));
          if(choice.length){
            await p.evaluate(()=>{
              const c=document.querySelector('.expand-full-market-card');
              const els=[...c.querySelectorAll('button,[role=button],select,option,[data-bookmaker],.fmb-bookmaker')].filter(e=>e.getBoundingClientRect().width>10);
              const e=els.find(e=>/bookmaker|select/i.test(e.textContent)&&e.tagName==='BUTTON')||els.find(e=>e.tagName==='BUTTON');
              e?.click();
            });
            await p.waitForTimeout(1000);
            const selected=await p.evaluate(()=>{
              const c=document.querySelector('.expand-full-market-card');
              return {html:c.outerHTML.slice(0,30000),text:c.innerText.slice(0,3800),priceElements:[...c.querySelectorAll('strong,em,span,td,[data-odds],.fmb-price')].filter(e=>e.getBoundingClientRect().width>10).slice(0,90).map(e=>({html:e.outerHTML.slice(0,900),text:e.textContent?.trim().slice(0,70)}))};
            });
            console.log('FULL_MARKET_SELECTED '+JSON.stringify(selected).slice(0,44000));
          }
          await b.close();
          NODE