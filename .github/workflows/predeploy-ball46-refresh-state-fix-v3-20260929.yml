          chrome=$(command -v google-chrome||command -v chromium||command -v chromium-browser);"$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --remote-debugging-port=9666 --user-data-dir="$R/chrome" about:blank >"$R/verify/chrome.log" 2>&1&CPID=$!;trap 'kill $CPID $SPID 2>/dev/null||true' EXIT;for i in $(seq 1 80);do curl -fsS http://127.0.0.1:9666/json >"$R/pages.json" 2>/dev/null&&break;sleep .1;done
          cat >"$R/check.js" <<'NODE'
          const fs=require('fs'),pg=JSON.parse(fs.readFileSync('/tmp/b46fix3/pages.json')).find(x=>x.type==='page');if(!pg)throw Error('NO_PAGE');const ws=new WebSocket(pg.webSocketDebuggerUrl);let id=0,M=new Map();ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.id&&M.has(m.id)){let z=M.get(m.id);M.delete(m.id);m.error?z.j(Error(JSON.stringify(m.error))):z.r(m.result)}};const call=(m,p={})=>new Promise((r,j)=>{let n=++id;M.set(n,{r,j});ws.send(JSON.stringify({id:n,method:m,params:p}))}),sl=x=>new Promise(r=>setTimeout(r,x));async function ev(x){let z=await call('Runtime.evaluate',{expression:x,returnByValue:true,awaitPromise:true});if(z.exceptionDetails)throw Error('EVAL');return z.result.value}async function wait(x,t=30000){let s=Date.now();while(Date.now()-s<t){try{if(await ev(x))return}catch{}await sl(50)}throw Error('WAIT:'+x)}const A=(x,m)=>{if(!x)throw Error(m)};(async()=>{await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});await call('Runtime.enable');await call('Page.enable');const sampler=`(()=>{window.__b46Samples=[];const tick=()=>{const st=document.querySelector('.workspace-stage'),sl=document.querySelector('[data-workspace-scorebar-slot]');if(st)window.__b46Samples.push({t:performance.now(),stage:true,slot:!!sl,h:sl?sl.getBoundingClientRect().height:0,view:document.body?.dataset?.workspaceView||'',url:location.href})};setInterval(tick,5);try{new MutationObserver(tick).observe(document.documentElement,{childList:true,subtree:true})}catch(_){}})()`;await call('Page.addScriptToEvaluateOnNewDocument',{source:sampler});async function nav(url,view){await call('Page.navigate',{url});await sl(100);await wait(`document.body&&document.body.dataset.workspaceView==='${view}'`);await sl(1200);return await ev(`(()=>({url:location.href,view:document.body.dataset.workspaceView,samples:window.__b46Samples||[],slots:document.querySelectorAll('[data-workspace-scorebar-slot]').length,h:document.querySelector('[data-workspace-scorebar-slot]')?.getBoundingClientRect().height||0,total:document.querySelector('[data-stat-market="all"]')?.classList.contains('active')||false,ah:document.querySelector('[data-stat-market="ah"]')?.classList.contains('active')||false}))()`)}let x=await nav('http://127.0.0.1:8765/index.html?view=statistics','statistics');A(x.total&&new URL(x.url).searchParams.get('view')==='statistics','TOTAL_INITIAL:'+JSON.stringify(x));A(x.slots===1&&x.h>0,'TOTAL_SHELL_INITIAL');A(x.samples.some(s=>s.stage)&&x.samples.filter(s=>s.stage).every(s=>s.slot),'STAGE_WITHOUT_SHELL_INITIAL:'+JSON.stringify(x.samples.slice(0,30)));let old=await ev('performance.timeOrigin');await call('Page.reload',{ignoreCache:true});await sl(100);await wait(`performance.timeOrigin!==${old}`);await wait(`document.body&&document.body.dataset.workspaceView==='statistics'`);await sl(1200);let y=await ev(`(()=>({url:location.href,view:document.body.dataset.workspaceView,samples:window.__b46Samples||[],slots:document.querySelectorAll('[data-workspace-scorebar-slot]').length,h:document.querySelector('[data-workspace-scorebar-slot]')?.getBoundingClientRect().height||0,total:document.querySelector('[data-stat-market="all"]')?.classList.contains('active')||false}))()`);A(y.total&&new URL(y.url).searchParams.get('view')==='statistics','TOTAL_RELOAD:'+JSON.stringify(y));A(y.slots===1&&Math.abs(y.h-x.h)<=1,'TOTAL_GEOMETRY:'+JSON.stringify({x:x.h,y:y.h}));A(y.samples.some(s=>s.stage)&&y.samples.filter(s=>s.stage).every(s=>s.slot),'STAGE_WITHOUT_SHELL_RELOAD:'+JSON.stringify(y.samples.slice(0,30)));let ah=await nav('http://127.0.0.1:8765/index.html?view=statistics&market=ah','statistics');A(ah.ah&&new URL(ah.url).searchParams.get('market')==='ah','AH_INITIAL');old=await ev('performance.timeOrigin');await call('Page.reload',{ignoreCache:true});await sl(100);await wait(`performance.timeOrigin!==${old}`);await wait(`document.body&&document.body.dataset.workspaceView==='statistics'`);await sl(400);ah=await ev(`(()=>({url:location.href,a:document.querySelector('[data-stat-market="ah"]')?.classList.contains('active')}))()`);A(ah.a&&new URL(ah.url).searchParams.get('market')==='ah','AH_RELOAD:'+JSON.stringify(ah));let sig=await nav('http://127.0.0.1:8765/index.html?view=signal','signal');old=await ev('performance.timeOrigin');await call('Page.reload',{ignoreCache:true});await sl(100);await wait(`performance.timeOrigin!==${old}`);await wait(`document.body&&document.body.dataset.workspaceView==='signal'`);let sig2=await ev(`(()=>({url:location.href,v:document.body.dataset.workspaceView}))()`);A(sig2.v==='signal'&&new URL(sig2.url).searchParams.get('view')==='signal','SIGNAL_RELOAD:'+JSON.stringify(sig2));console.log('V3_BROWSER_PASS',JSON.stringify({total:x,totalReload:y,ah,sig:sig2}));ws.close();process.exit(0)})().catch(e=>{console.error('V3_BROWSER_FAIL',e);try{ws.close()}catch{}process.exit(1)});
          NODE
