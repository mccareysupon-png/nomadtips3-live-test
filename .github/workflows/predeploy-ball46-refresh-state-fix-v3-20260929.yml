          p=C/'workspace-route-guard-343.js';g=p.read_text();marker='function cleanLiveRoute(){';assert g.count(marker)==1 and 'BALL46_REFRESH_ROUTE_GUARD_20260929' not in g;g=g.replace(marker,"/* BALL46_REFRESH_ROUTE_GUARD_20260929 */\nfunction hasExplicitNonLiveRoute(){const v=new URLSearchParams(location.search).get('view');return v==='statistics'||v==='signal'}\n"+marker,1);g,n=re.subn(r"if\s*\(\s*navType\(\)\s*===\s*'reload'\s*&&\s*last\s*===\s*'live'\s*\)\s*cleanLiveRoute\(\)\s*;","if(navType()==='reload'&&last==='live'&&!hasExplicitNonLiveRoute())cleanLiveRoute();",g,count=1);assert n==1;g,n=re.subn(r"if\s*\(\s*view\s*===\s*'live'\s*\)\s*cleanLiveRoute\(\)\s*;","if(view==='live'&&!hasExplicitNonLiveRoute())cleanLiveRoute();",g,count=1);assert n==1;p.write_text(g)
          def h(x):return hashlib.sha256(x.read_bytes()).hexdigest()
          ch=[str(x.relative_to(B)) for x in sorted(B.rglob('*')) if x.is_file() and h(x)!=h(C/x.relative_to(B))];ex=[str(x.relative_to(C)) for x in C.rglob('*') if x.is_file() and not(B/x.relative_to(C)).exists()];print('V3_CHANGED',ch,'EXTRA',ex);assert ch==['index.html','workspace-route-guard-343.js'] and not ex
