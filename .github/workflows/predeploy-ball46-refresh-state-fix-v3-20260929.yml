          NODE
          find "$R/base" -type f -printf '%P\n'|LC_ALL=C sort >"$R/verify/paths.txt";[ "$(wc -l <"$R/verify/paths.txt"|tr -d ' ')" = 83 ];nonce="${GITHUB_RUN_ID}-$(date +%s%N)";while IFS= read -r rel;do mkdir -p "$R/live/$(dirname "$rel")";c=$(curl -sS -L --retry 4 --retry-all-errors --max-time 30 -H 'Cache-Control: no-cache' -o "$R/live/$rel" -w '%{http_code}' "$DIRECT/$rel?v3=$nonce-$RANDOM")||true;[ "$c" = 200 ]||exit 1;done<"$R/verify/paths.txt"
          node - <<'NODE'
          const fs=require('fs'),R='/tmp/b46fix3',rt=fs.readFileSync(R+'/runtime/index.js','utf8'),m=rt.match(/const __B46_FOOTER_HTML__=(.*?);\nconst __B46_FOOTER_CSS__/s);if(!m)throw Error('FOOTER_CONST');const foot=JSON.parse(m[1]),link='<link rel="stylesheet" href="/ball46-footer.css?v=20260929">',hs=new Set(['index.html','signal.html','statistics.html']),ps=fs.readFileSync(R+'/verify/paths.txt','utf8').trim().split('\n'),bad=[];for(const p of ps){let a=fs.readFileSync(R+'/base/'+p),b=fs.readFileSync(R+'/live/'+p);if(hs.has(p))b=Buffer.from(b.toString().replace(link,'').replace(foot,''));if(!a.equals(b))bad.push(p)}console.log('V3_RACE_MISMATCH',bad);if(bad.length)throw Error('ASSETS_MOVED:'+bad);console.log('V3_RACE_83_PASS');
          NODE
      - name: Build only index plus route guard
        shell: bash
        run: |
          set -euo pipefail;R=/tmp/b46fix3;cp -a "$R/base/." "$R/candidate/"
          python3 - <<'PY'
          from pathlib import Path
