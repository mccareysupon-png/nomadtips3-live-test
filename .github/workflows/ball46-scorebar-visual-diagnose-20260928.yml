name: READ ONLY - Ball46 Scorebar Visual Diagnose 20260928
on:
  push:
    branches:
      - work/ball46-scorebar-background-pending-20260928
    paths:
      - '.github/workflows/ball46-scorebar-visual-diagnose-20260928.yml'
      - '.github/scripts/ball46_scorebar_visual_diagnose_20260928.sh'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose live scorebar backgrounds without deploy
        run: bash .github/scripts/ball46_scorebar_visual_diagnose_20260928.sh
      - name: Upload diagnostic proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-scorebar-visual-diagnose-${{ github.run_id }}
          path: /tmp/b46-scorebar-visual-diagnose
          if-no-files-found: ignore
          retention-days: 30
