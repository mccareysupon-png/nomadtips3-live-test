name: Verify Ball46 UI Geometry Chart Frame 20260922

on:
  push:
    branches: [work/ball46-ui-geometry-chart-frame-20260922]
    paths:
      - '.github/workflows/verify-ball46-ui-geometry-chart-frame-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  BALL46_PUBLIC: https://www.ball46.com

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify deployed UI assets
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 "$BALL46_WORKER/index.html?verify-geometry=$stamp" -o /tmp/index.html
          grep -Fq 'dashboard-v2.css?v=343-geometry-frame-20260922a' /tmp/index.html
          grep -Fq 'singlepage-workspace-343.css?v=343-geometry-frame-20260922a' /tmp/index.html
          grep -Fq 'longterm-performance-343.css?v=343-geometry-frame-20260922a' /tmp/index.html
          grep -Fq 'expanded-match-343.css?v=343-geometry-frame-20260922a' /tmp/index.html

          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 "$BALL46_WORKER/dashboard-v2.css?verify-geometry=$stamp" -o /tmp/dashboard-v2.css
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 "$BALL46_WORKER/singlepage-workspace-343.css?verify-geometry=$stamp" -o /tmp/singlepage.css
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 "$BALL46_WORKER/longterm-performance-343.css?verify-geometry=$stamp" -o /tmp/perf.css
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 "$BALL46_WORKER/expanded-match-343.css?verify-geometry=$stamp" -o /tmp/expanded.css

          grep -Fq 'grid-template-columns:minmax(0,1fr) 38px' /tmp/dashboard-v2.css
          grep -Fq 'padding:10px 11px' /tmp/dashboard-v2.css
          grep -Fq 'width:38px;min-width:38px;max-width:38px;text-align:right' /tmp/dashboard-v2.css
          grep -Fq 'grid-template-columns:minmax(0,1fr) 38px' /tmp/singlepage.css
          grep -Fq 'padding:0 11px' /tmp/singlepage.css
          grep -Fq 'justify-content:flex-end;text-align:right' /tmp/singlepage.css
          grep -Fq 'box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--line) 90%,transparent)' /tmp/perf.css
          grep -Fq 'box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--line) 90%,transparent)' /tmp/expanded.css
          echo 'UI_ASSETS_OK'

      - name: Verify engine APIs
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          curl -fsS -L --retry 6 --retry-all-errors --retry-delay 2 --max-time 35 "$BALL46_WORKER/api/engine/board?verify-geometry=$stamp" -o /tmp/board.json
          curl -fsS -L --retry 6 --retry-all-errors --retry-delay 2 --max-time 35 "$BALL46_WORKER/api/engine/signals?verify-geometry=$stamp" -o /tmp/signals.json
          curl -fsS -L --retry 6 --retry-all-errors --retry-delay 2 --max-time 35 "$BALL46_WORKER/api/engine/statistics?verify-geometry=$stamp" -o /tmp/stats.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/board.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals.json','utf8'));
          const t=JSON.parse(fs.readFileSync('/tmp/stats.json','utf8'));
          if(b?.ok!==true || !Array.isArray(b?.fixtures)) throw new Error('BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals)) throw new Error('SIGNALS_UNHEALTHY');
          if(t?.ok!==true || !Array.isArray(t?.rows)) throw new Error('STATISTICS_UNHEALTHY');
          console.log('BALL46_GEOMETRY_VERIFY_OK', {fixtures:b.fixtures.length, signals:s.signals.length, stats:t.rows.length});
          NODE

      - name: Verify public propagation
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 12); do
            if curl -fsS -L --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 "$BALL46_PUBLIC/?verify-geometry=${GITHUB_RUN_ID}-$n" -o /tmp/public.html \
              && grep -Fq 'dashboard-v2.css?v=343-geometry-frame-20260922a' /tmp/public.html \
              && grep -Fq 'singlepage-workspace-343.css?v=343-geometry-frame-20260922a' /tmp/public.html \
              && grep -Fq 'longterm-performance-343.css?v=343-geometry-frame-20260922a' /tmp/public.html \
              && grep -Fq 'expanded-match-343.css?v=343-geometry-frame-20260922a' /tmp/public.html; then
              ok=1; break
            fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo 'PUBLIC_PROPAGATION_FAILED'; exit 1; }
          echo 'PUBLIC_PROPAGATION_OK'
