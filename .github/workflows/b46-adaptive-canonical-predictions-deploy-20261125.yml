name: BALL46 TEST canonical Predictions Adaptive latest O/U patch 20261125
on:
  push:
    branches: [feature/ball46-adaptive-manual-control-test-20261125]
    paths: [.github/workflows/b46-adaptive-canonical-predictions-deploy-20261125.yml]
permissions: {contents: read}
jobs:
  test-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax check canonical patcher and version-locked deployer
        run: |
          node --check qa/prematch-history-20261120/b46-adaptive-canonical-predictions-test-patch.mjs
          node --check qa/prematch-history-20261120/deploy-adaptive-canonical-predictions-test-20261125.mjs
      - name: Preflight real active frontend module, no writes
        run: node qa/prematch-history-20261120/deploy-adaptive-canonical-predictions-test-20261125.mjs --dry-run
      - name: Activate TEST frontend only and validate preserved Workers
        run: node qa/prematch-history-20261120/deploy-adaptive-canonical-predictions-test-20261125.mjs
