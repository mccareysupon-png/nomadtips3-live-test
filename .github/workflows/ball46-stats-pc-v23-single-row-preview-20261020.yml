name: BALL46 Statistics PC V2.3 Single Row 14 KPI Browser Preview
on:
  push:
    branches: [codex/ball46-stats-pc-v23-single-row-preview-20261020]
    paths:
      - '.github/workflows/ball46-stats-pc-v23-single-row-preview-20261020.yml'
      - 'deploy-assets/stats-pc-v2-preview-20261020/preview.mjs'
      - 'deploy-assets/stats-pc-v2-preview-20261020/preview.css'
      - 'deploy-assets/stats-pc-v2-preview-20261020/compact-v21.css'
      - 'deploy-assets/stats-pc-v2-preview-20261020/compact-v22.css'
      - 'deploy-assets/stats-pc-v2-preview-20261020/single-row-v23.css'
      - 'deploy-assets/stats-pc-v2-preview-20261020/ribbon-v23.mjs'
permissions:
  contents: read
concurrency:
  group: ball46-statistics-pc-v23-inactive-preview
  cancel-in-progress: false
jobs:
  preview-and-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated ribbon sources
        working-directory: deploy-assets/stats-pc-v2-preview-20261020
        run: |
          set -euo pipefail
          node --check preview.mjs
          node --check ribbon-v23.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
      - name: Create inactive 14-card preview, visually test PC and mobile, confirm Production unchanged
        working-directory: deploy-assets/stats-pc-v2-preview-20261020
        run: node preview.mjs
      - name: Save browser screenshot evidence and no-deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-stats-v23-single-row14-preview
          path: deploy-assets/stats-pc-v2-preview-20261020/audit/
          retention-days: 30
          if-no-files-found: warn
