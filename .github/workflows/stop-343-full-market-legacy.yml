name: Stop NOMAD 3.43 Legacy Full Market Worker

on:
  push:
    branches: [work/nomad343-clean-bet365-ui]
    paths:
      - '.github/workflows/stop-343-full-market-legacy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  stop-legacy-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate Cloudflare credentials only
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Delete legacy Full Market Worker
        run: npx --yes wrangler@4.92.0 delete nomadtips3-343-full-market --force

      - name: Verify public routes no longer expose legacy worker
        run: |
          set -euo pipefail
          for url in \
            https://nomadtips3-343-preview.mccarey-supon.workers.dev/api/full-market/health \
            https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev/api/full-market/health
          do
            code="$(curl -L -sS --max-time 20 -o /tmp/check -w '%{http_code}' "$url?stop=$RANDOM")"
            echo "$url -> HTTP $code"
            cat /tmp/check || true
            echo
            if grep -Fq 'ONE_FIXTURE_ONE_REQUEST' /tmp/check; then
              echo 'legacy full-market worker still exposed'
              exit 1
            fi
          done
