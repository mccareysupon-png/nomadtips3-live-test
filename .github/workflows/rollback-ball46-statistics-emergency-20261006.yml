name: Rollback Ball46 Statistics Emergency 20261006

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rollback-ball46-statistics-emergency-20261006.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-statistics-emergency-rollback
  cancel-in-progress: false

jobs:
  rollback-statistics-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact rollback branch
        uses: actions/checkout@v4
        with:
          ref: ops/ball46-statistics-emergency-rollback-20261006
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore last confirmed-good Statistics engine only
        working-directory: deploy-assets/statistics-emergency-rollback-20261006
        run: node run.mjs
