name: BALL46 exact asset owner scout (read only)
on:
  push:
    branches: [test/ball46-eventflow-same-minute-20261118]
    paths: ['.github/workflows/eventflow-exact-owner-20261118.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - run: npm install --no-save --no-package-lock --prefix /tmp/b46scout acorn
      - run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import {parse} from '/tmp/b46scout/node_modules/acorn/dist/acorn.mjs';
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers';
          async function get(p){const r=await fetch(root+p,{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});const j=await r.json();assert(r.ok&&j.success);return j.result;}
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const d=await get('/scripts/ball46-production/deployments?per_page=1'),id=d.deployments[0].versions[0].version_id,v=await get('/workers/ball46-production/versions/'+id+'?include=modules');
          const s=Buffer.from(v.modules.find(m=>m.name==='index.js').content_base64,'base64').toString('utf8');
          const needle='function signalMarkers(rows,points,current,w,h,pad){';
          function walk(n){if(!n||typeof n!=='object')return;if(n.type==='VariableDeclarator'&&typeof n.init?.value==='string'&&n.init.value.includes(needle))console.log('LITERAL '+JSON.stringify({name:n.id.name,size:n.init.value.length,sha:sha(n.init.value)}));for(const [k,c]of Object.entries(n)){if(k==='start'||k==='end')continue;if(Array.isArray(c))c.forEach(walk);else if(c&&typeof c==='object')walk(c);}}
          walk(parse(s,{ecmaVersion:'latest',sourceType:'module'}));
          const m=v.modules.find(m=>m.name==='mobile-event-flow-bars-assets-20261102.txt'),j=JSON.parse(Buffer.from(m.content_base64,'base64').toString());
          console.log('ASSET_ROOT '+JSON.stringify({array:Array.isArray(j),keys:Object.keys(j)}));
          function inspect(x){if(!x||typeof x!=='object')return;if(x.path==='/expanded-match-343.js'){console.log('ASSET_RECORD '+JSON.stringify({keys:Object.keys(x),version:x.version,fields:Object.entries(x).filter(([k,v])=>typeof v==='string'&&v.length>100).map(([k,v])=>({k,decodedHash:sha(Buffer.from(v,'base64')),decodedSize:Buffer.from(v,'base64').length,hasRenderer:Buffer.from(v,'base64').toString().includes(needle)}))}));}for(const c of Object.values(x))if(c&&typeof c==='object')inspect(c);}
          inspect(j);
          for(const a of ['b46-mobile-bars-fresh-20261112','mobile-event-flow-bars-assets-20261102','/expanded-match-343.js']){let pos=-1;while((pos=s.indexOf(a,pos+1))>=0)console.log('ROUTE '+a+' '+s.slice(Math.max(0,pos-350),pos+450).replace(/\n/g,' '));}
          NODE
