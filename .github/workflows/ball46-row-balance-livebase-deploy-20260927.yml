name: DEPLOY - Ball46 row balance exact current livebase 20260927

on:
  push:
    branches: [work/ball46-row-balance-livebase-20260927]
    paths:
      - '.github/workflows/ball46-row-balance-livebase-deploy-20260927.yml'

permissions:
  contents: read
  actions: read

jobs:
  deploy-row-balance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_COMMIT: 6276320261cdc10a3835b27e81850c3d4f17f126
      PATCH_COMMIT: bb055502511638df5b6f2fc741ce93e80e15c09e
      LIVEBASE_RUN_ID: 36291401917
      LIVEBASE_NAME: ball46-livebase-v2-36291401917
      ROLLBACK_VERSION: 8e95c148-ea19-4ed1-88a1-2f14565c6888
      BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact source that created current Worker runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download exact captured current Production assets
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.LIVEBASE_NAME }}
          path: /tmp/livebase
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.LIVEBASE_RUN_ID }}

      - name: Load patcher pinned to immutable commit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 1 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${PATCH_COMMIT}/.github/scripts/ball46_row_balance_livebase_v3_20260927.py" -o /tmp/patch.py
          test -s /tmp/patch.py
          python3 -m py_compile /tmp/patch.py

      - name: Verify captured live base and current backend health
        shell: bash
        run: |
          set -euo pipefail
          test -d /tmp/livebase/current-assets
          test -s /tmp/livebase/current-assets.sha256
          test -s /tmp/livebase/reference-files.txt
          test "$(wc -l < /tmp/livebase/reference-files.txt)" = 69
          test "$(wc -l < /tmp/livebase/current-assets.sha256)" = 69
          cd /tmp/livebase/current-assets
          sha256sum -c /tmp/livebase/current-assets.sha256
          cd - >/dev/null
          for ep in health board signals statistics; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_WORKER/api/engine/$ep?row-balance-before=${GITHUB_RUN_ID}" -o "/tmp/$ep-before.json"
          done
          node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/health-before.json'));const b=JSON.parse(fs.readFileSync('/tmp/board-before.json'));const s=JSON.parse(fs.readFileSync('/tmp/signals-before.json'));const t=JSON.parse(fs.readFileSync('/tmp/statistics-before.json'));if(h?.ok!==true||b?.ok!==true||!Array.isArray(b.fixtures)||!Array.isArray(s.signals)||t?.ok!==true||!Array.isArray(t.rows))process.exit(1);console.log('PRE_BACKEND_OK',{fixtures:b.fixtures.length,signals:s.signals.length,settled:t.rows.length})"

      - name: Race guard all 69 Production assets before patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/race-before
          mkdir -p /tmp/race-before
          while read -r expected name; do
            safe="${name//\//_}"
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 -H 'Cache-Control: no-cache' "$BALL46_WORKER/$name?row-balance-race=${GITHUB_RUN_ID}-$(date +%s%N)" -o "/tmp/race-before/$safe"
            actual=$(sha256sum "/tmp/race-before/$safe" | awk '{print $1}')
            test "$actual" = "$expected" || { echo "PRODUCTION_CHANGED_STOP:$name expected=$expected actual=$actual"; exit 1; }
          done < /tmp/livebase/current-assets.sha256
          echo RACE_GUARD_69_PASS

      - name: Rebuild exact current Production locally and patch only presentation targets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf nomad-live-343
          mkdir -p nomad-live-343
          cp -a /tmp/livebase/current-assets/. nomad-live-343/
          python3 /tmp/patch.py verify-base nomad-live-343
          python3 /tmp/patch.py patch nomad-live-343
          node --check nomad-live-343/dashboard-v2-stage3.js
          python3 /tmp/patch.py gate nomad-live-343 /tmp/livebase/current-assets /tmp/livebase/reference-files.txt
          cd nomad-live-343
          while IFS= read -r f; do sha256sum "$f"; done < /tmp/livebase/reference-files.txt > /tmp/candidate-assets.sha256
          cd - >/dev/null
          sha256sum nomad-live-343/index.html nomad-live-343/dashboard-v2-stage3.js nomad-live-343/dashboard-v2-tune.css
          echo CANDIDATE_EXACT_THREE_FILE_PATCH_PASS

      - name: Immediate second race guard on three touched Production files
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html dashboard-v2-stage3.js dashboard-v2-tune.css; do
            expected=$(grep -F "  $f" /tmp/livebase/current-assets.sha256 | awk '{print $1}')
            test -n "$expected"
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_WORKER/$f?row-balance-final-race=${GITHUB_RUN_ID}-$(date +%s%N)" -o "/tmp/final-race-$f"
            actual=$(sha256sum "/tmp/final-race-$f" | awk '{print $1}')
            test "$actual" = "$expected" || { echo "TOUCHED_FILE_CHANGED_STOP:$f expected=$expected actual=$actual"; exit 1; }
          done
          echo FINAL_RACE_GUARD_PASS

      - name: Final dry run exact current package
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy exact current package plus three-file UI patch
        id: deploy
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc | tee /tmp/deploy.log
          grep -Fq 'Uploaded ball46-production' /tmp/deploy.log

      - name: Verify all 69 Production assets and backend after deploy
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          index_expected=$(grep -F '  index.html' /tmp/candidate-assets.sha256 | awk '{print $1}')
          ok=0
          for n in $(seq 1 20); do
            if curl -fsS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/index.html?row-balance-propagation=${GITHUB_RUN_ID}-$n" -o /tmp/live-index.html; then
              actual=$(sha256sum /tmp/live-index.html | awk '{print $1}')
              if [ "$actual" = "$index_expected" ]; then ok=1; break; fi
            fi
            sleep 3
          done
          test "$ok" = 1 || { echo INDEX_CANDIDATE_NOT_LIVE; exit 1; }
          rm -rf /tmp/verify-after
          mkdir -p /tmp/verify-after
          while read -r expected name; do
            safe="${name//\//_}"
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 -H 'Cache-Control: no-cache' "$BALL46_WORKER/$name?row-balance-after=${GITHUB_RUN_ID}-$(date +%s%N)" -o "/tmp/verify-after/$safe"
            actual=$(sha256sum "/tmp/verify-after/$safe" | awk '{print $1}')
            test "$actual" = "$expected" || { echo "POST_ASSET_MISMATCH:$name expected=$expected actual=$actual"; exit 1; }
          done < /tmp/candidate-assets.sha256
          grep -Fq 'layout=20260927-row-balance-livebase-v3' /tmp/verify-after/index.html
          grep -Fq 'class=\"match-meta-cell\"' /tmp/verify-after/dashboard-v2-stage3.js
          grep -Fq 'BALL46 LIVE ROW BALANCE LIVEBASE V3 20260927' /tmp/verify-after/dashboard-v2-tune.css
          for ep in health board signals statistics; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_WORKER/api/engine/$ep?row-balance-after=${GITHUB_RUN_ID}" -o "/tmp/$ep-after.json"
          done
          node -e "const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/health-after.json'));const b=JSON.parse(fs.readFileSync('/tmp/board-after.json'));const s=JSON.parse(fs.readFileSync('/tmp/signals-after.json'));const t=JSON.parse(fs.readFileSync('/tmp/statistics-after.json'));if(h?.ok!==true||b?.ok!==true||!Array.isArray(b.fixtures)||!Array.isArray(s.signals)||t?.ok!==true||!Array.isArray(t.rows))process.exit(1);console.log('POST_BACKEND_OK',{fixtures:b.fixtures.length,signals:s.signals.length,settled:t.rows.length})"
          echo POST_DEPLOY_69_ASSET_VERIFY_PASS

      - name: Roll back exact pre-change Worker version if verification fails
        id: rollback
        if: steps.deploy.outcome == 'success' && steps.verify.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 rollback "$ROLLBACK_VERSION" --name ball46-production --message "Auto rollback Ball46 row-balance verification failure 2026-09-27"
          sleep 6
          for f in index.html dashboard-v2-stage3.js dashboard-v2-tune.css; do
            expected=$(grep -F "  $f" /tmp/livebase/current-assets.sha256 | awk '{print $1}')
            curl -fsS -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 30 "$BALL46_WORKER/$f?row-balance-rollback=${GITHUB_RUN_ID}-$(date +%s%N)" -o "/tmp/rollback-$f"
            actual=$(sha256sum "/tmp/rollback-$f" | awk '{print $1}')
            test "$actual" = "$expected" || { echo "ROLLBACK_HASH_MISMATCH:$f"; exit 1; }
          done
          echo ROLLBACK_EXACT_PRECHANGE_PASS

      - name: Final safety gate
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.deploy.outcome }}" != "success" ]; then echo DEPLOY_DID_NOT_COMPLETE; exit 1; fi
          if [ "${{ steps.verify.outcome }}" != "success" ]; then echo "VERIFY_FAILED rollback=${{ steps.rollback.outcome }}"; exit 1; fi
          echo BALL46_ROW_BALANCE_LIVEBASE_DEPLOY_VERIFIED
