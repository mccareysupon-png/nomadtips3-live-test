name: BALL46 Statistics PC V2 Read Only Audit 20261020
on:
  push:
    branches: [codex/ball46-stats-pc-v2-browser-preview-20261020]
    paths:
      - '.github/workflows/ball46-stats-pc-v2-audit-20261020.yml'
      - 'deploy-assets/stats-pc-v2-preview-20261020/audit.mjs'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read actual statistics page without writing Production
        working-directory: deploy-assets/stats-pc-v2-preview-20261020
        run: |
          set -euo pipefail
          node --check audit.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
          node audit.mjs
