name: Deploy Ball46 Statistics Market Rank V1 20260920

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ball46-statistics-market-rank-v1-20260920.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_BRANCH: work/ball46-statistics-outcome-labels-v1-20260920
  BALL46_URL: https://ball46.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-stat-market-rank:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout isolated Page 3 rank source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Mirror production and lock protected systems
        shell: bash
        run: |
          set -euo pipefail
          test -s workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          mkdir -p /tmp/prod /tmp/hdr
          while IFS= read -r f; do
            name="${f#nomad-live-343/}"
            case "$name" in statistics-market-rank-v1.js) continue ;; esac
            case "$name" in *.html|*.js|*.css|*.svg|*.json|*.png|*.webp|*.jpg|*.jpeg|*.ico) ;; *) continue ;; esac
            safe="${name//\//_}"
            code=$(curl -sS -L --max-time 25 -D "/tmp/hdr/$safe" -o "/tmp/prod/$safe" -w '%{http_code}' "$BALL46_URL/$name?rank-rb0=${GITHUB_RUN_ID}") || true
            [ "$code" = 200 ] || continue
            ctype=$(tr -d '\r' < "/tmp/hdr/$safe" | awk 'BEGIN{IGNORECASE=1}/^content-type:/{print tolower($0)}' | tail -1)
            case "$name" in
              *.js) [[ "$ctype" == *javascript* || "$ctype" == *text/plain* ]] || continue ;;
              *.css) [[ "$ctype" == *text/css* || "$ctype" == *text/plain* ]] || continue ;;
              *.html) [[ "$ctype" == *text/html* || "$ctype" == *text/plain* ]] || continue ;;
            esac
            cp "/tmp/prod/$safe" "$f"
          done < <(find nomad-live-343 -maxdepth 1 -type f | sort)

          protected='index.html signal.html v2-header.css signal-next.js statistics-next.js statistics-units-v1.js statistics-units-v1.css statistics-refine-v2.js statistics-refine-v2.css statistics-outcome-labels-v1.js statistics-outcome-labels-v1.css statistics-addk-expand-v1.js statistics-addk-expand-v1.css statistics-performance.css ball46-product-pages-v1.css dashboard-v2-stage3.js bulk-odds-compat-343.js full-market-bookmaker-343.js live-summary-full-odds-343.js page2-workspace-v1.js page2-workspace-v1.css page2-hide-kpis-v1.css page2-scroll-five-v1.css'
          for f in statistics.html $protected; do
            test -s "/tmp/prod/${f//\//_}" || { echo "PRODUCTION_ASSET_MISSING:$f"; exit 1; }
          done
          cp /tmp/prod/statistics.html /tmp/statistics.original.html
          for f in $protected; do
            sha256sum "/tmp/prod/${f//\//_}" | awk '{print $1}' > "/tmp/${f//\//_}.sha"
          done

          grep -Fq "ball46:statistics" /tmp/prod/statistics-next.js || { echo 'STAT_EVENT_HOOK_MISSING'; exit 1; }
          grep -Fq 'statistics-units-v1.js' /tmp/prod/statistics.html || { echo 'UNITS_LOADER_MISSING'; exit 1; }
          grep -Fq 'statistics-addk-expand-v1.js' /tmp/prod/statistics.html || { echo 'ADDK_EXPAND_LOADER_MISSING'; exit 1; }
          grep -Fq 'data-unit-market-card' /tmp/prod/statistics-units-v1.js || { echo 'UNIT_MARKET_CARD_MISSING'; exit 1; }

          curl -fsS --max-time 25 "$BALL46_URL/api/engine/health?rank-rb0=${GITHUB_RUN_ID}" -o /tmp/engine-before.json
          curl -fsS --max-time 25 "$BALL46_URL/api/full-market/health?rank-rb0=${GITHUB_RUN_ID}" -o /tmp/full-before.json
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/engine-before.json','utf8'));
          const f=JSON.parse(fs.readFileSync('/tmp/full-before.json','utf8'));
          if(!e.version||!f.version) throw Error('HEALTH_VERSION_MISSING');
          fs.writeFileSync('/tmp/engine-version',String(e.version));
          fs.writeFileSync('/tmp/full-version',String(f.version));
          fs.writeFileSync('/tmp/full-policy',String(f.staleCachePolicy||''));
          NODE

      - name: Validate presentation-only market rank module
        shell: bash
        run: |
          set -euo pipefail
          test -s nomad-live-343/statistics-market-rank-v1.js
          node --check nomad-live-343/statistics-market-rank-v1.js
          ! grep -Fq 'fetch(' nomad-live-343/statistics-market-rank-v1.js
          ! grep -Fq '/api/' nomad-live-343/statistics-market-rank-v1.js
          grep -Fq "const EVENT='ball46:statistics'" nomad-live-343/statistics-market-rank-v1.js
          grep -Fq 'BALL46_STAT_UNITS_V1' nomad-live-343/statistics-market-rank-v1.js
          grep -Fq 'return b.net-a.net' nomad-live-343/statistics-market-rank-v1.js
          grep -Fq 'return b.roi-a.roi' nomad-live-343/statistics-market-rank-v1.js
          grep -Fq 'return b.settled-a.settled' nomad-live-343/statistics-market-rank-v1.js
          grep -Fq 'lastAppliedOrder' nomad-live-343/statistics-market-rank-v1.js
          grep -Fq 'pendingOrder' nomad-live-343/statistics-market-rank-v1.js
          grep -Fq 'if(isOpen())' nomad-live-343/statistics-market-rank-v1.js

      - name: Apply Page 3 market rank loader only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('nomad-live-343/statistics.html')
          h=p.read_text()
          h=re.sub(r'\s*<script[^>]+statistics-market-rank-v1\.js[^>]*></script>','',h,flags=re.I)
          js='<script src="statistics-market-rank-v1.js?v=343-stat-market-rank-v1-20260920a" defer></script>'
          m=re.search(r'<script[^>]+src=["\']statistics-next\.js[^"\']*["\'][^>]*></script>',h,re.I)
          if not m: raise SystemExit('STAT_SCRIPT_ANCHOR_MISSING')
          h=h[:m.start()]+js+h[m.start():]
          p.write_text(h)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          prod=Path('/tmp/statistics.original.html').read_text()
          now=Path('nomad-live-343/statistics.html').read_text()
          def norm(s):
              s=re.sub(r'\s*<script[^>]+statistics-market-rank-v1\.js[^>]*></script>','',s,flags=re.I)
              return re.sub(r'>\s+<','><',s).strip()
          if norm(now)!=norm(prod): raise SystemExit('NON_RANK_HTML_CHANGED')
          PY

          protected='index.html signal.html v2-header.css signal-next.js statistics-next.js statistics-units-v1.js statistics-units-v1.css statistics-refine-v2.js statistics-refine-v2.css statistics-outcome-labels-v1.js statistics-outcome-labels-v1.css statistics-addk-expand-v1.js statistics-addk-expand-v1.css statistics-performance.css ball46-product-pages-v1.css dashboard-v2-stage3.js bulk-odds-compat-343.js full-market-bookmaker-343.js live-summary-full-odds-343.js page2-workspace-v1.js page2-workspace-v1.css page2-hide-kpis-v1.css page2-scroll-five-v1.css'
          for f in $protected; do
            cmp -s "/tmp/prod/${f//\//_}" "nomad-live-343/$f" || { echo "PROTECTED_LOCAL_CHANGED:$f"; exit 1; }
          done

      - name: Deploy Ball46 wrapper assets only
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify market ranking and protected systems
        shell: bash
        run: |
          set -euo pipefail
          check_marker(){
            file="$1"; marker="$2"; ok=0
            for n in $(seq 1 15); do
              code=$(curl -sS -L --max-time 20 -o "/tmp/${file//\//_}.after" -w '%{http_code}' "$BALL46_URL/$file?rank=${GITHUB_RUN_ID}-${n}") || code=000
              if [ "$code" = 200 ] && grep -Fq "$marker" "/tmp/${file//\//_}.after"; then ok=1; break; fi
              sleep 2
            done
            [ "$ok" = 1 ] || { echo "RANK_MARKER_FAILED:$file"; exit 1; }
          }
          check_marker statistics.html 'statistics-market-rank-v1.js?v=343-stat-market-rank-v1-20260920a'
          check_marker statistics-market-rank-v1.js 'net-units-desc'
          grep -Fq 'lastAppliedOrder' /tmp/statistics-market-rank-v1.js.after
          grep -Fq 'pendingOrder' /tmp/statistics-market-rank-v1.js.after

          protected='index.html signal.html v2-header.css signal-next.js statistics-next.js statistics-units-v1.js statistics-units-v1.css statistics-refine-v2.js statistics-refine-v2.css statistics-outcome-labels-v1.js statistics-outcome-labels-v1.css statistics-addk-expand-v1.js statistics-addk-expand-v1.css statistics-performance.css ball46-product-pages-v1.css dashboard-v2-stage3.js bulk-odds-compat-343.js full-market-bookmaker-343.js live-summary-full-odds-343.js page2-workspace-v1.js page2-workspace-v1.css page2-hide-kpis-v1.css page2-scroll-five-v1.css'
          for f in $protected; do
            safe="${f//\//_}"
            curl -fsS -L --max-time 25 "$BALL46_URL/$f?rank=${GITHUB_RUN_ID}-protected" -o "/tmp/$safe.after"
            test "$(sha256sum "/tmp/$safe.after" | awk '{print $1}')" = "$(cat "/tmp/$safe.sha")" || { echo "PROTECTED_ASSET_CHANGED:$f"; exit 1; }
          done

          curl -fsS --max-time 25 "$BALL46_URL/api/engine/health?rank=${GITHUB_RUN_ID}-after" -o /tmp/engine-after.json
          curl -fsS --max-time 25 "$BALL46_URL/api/full-market/health?rank=${GITHUB_RUN_ID}-after" -o /tmp/full-after.json
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/engine-after.json','utf8'));
          const f=JSON.parse(fs.readFileSync('/tmp/full-after.json','utf8'));
          if(String(e.version||'')!==fs.readFileSync('/tmp/engine-version','utf8')) throw Error('ENGINE_CHANGED');
          if(String(f.version||'')!==fs.readFileSync('/tmp/full-version','utf8')) throw Error('FULL_MARKET_CHANGED');
          if(String(f.staleCachePolicy||'')!==fs.readFileSync('/tmp/full-policy','utf8')) throw Error('FULL_MARKET_POLICY_CHANGED');
          console.log('BALL46_STAT_MARKET_RANK_V1_PASS',JSON.stringify({engine:e.version,fullMarket:f.version}));
          NODE
