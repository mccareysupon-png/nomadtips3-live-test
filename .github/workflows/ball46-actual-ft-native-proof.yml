name: BALL46 actual Engine isolated FT Ledger V2 proof
on:
  push:
    branches: [stage/ball46-multisource-v5-20261017]
    paths: [.github/workflows/ball46-actual-ft-native-proof.yml]
permissions: {contents: read}
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CF_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy active Engine source to disposable local test Worker
        run: |
          mkdir -p /tmp/b46local
          cd /tmp/b46local
          node - <<'NODE'
          const fs=require('fs');
          (async()=>{
            const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ID+'/workers/scripts/nomadtips3-engine-343';
            const r=await fetch(url,{headers:{Authorization:'Bearer '+process.env.CF_TOKEN}});
            if(!r.ok)throw Error('CF_HTTP_'+r.status);
            const text=await r.text(),ct=r.headers.get('content-type')||'';
            let source=text;
            if(ct.includes('multipart')){
              const boundary=ct.match(/boundary="?([^";]+)"?/)?.[1];
              const part=text.split('--'+boundary).filter(p=>p.includes('async reconcileExternalFinal(')).sort((a,b)=>b.length-a.length)[0];
              const sp=part?.match(/\r?\n\r?\n/);
              if(!sp)throw Error('CANNOT_READ_MULTIPART_JS');
              source=part.slice(sp.index+sp[0].length).replace(/\r?\n--\s*$/,'');
            }
            const start=source.indexOf('async reconcileExternalFinal('),pos=source.indexOf('async fetch(request) {',start);
            if(start<0||pos<start)throw Error('NOT_THE_ACTIVE_ENGINE');
            const inject='async fetch(request) { if(request.method==="POST"&&new URL(request.url).pathname==="/__sandbox_seed"){const v=await request.json();await writeWorkingSignals(this.ctx,v.signals);const x=await this.upsertLedgerRows(v.signals);return Response.json({ok:true,inserted:x.inserted});} if(request.method==="POST"&&new URL(request.url).pathname==="/__sandbox_ledger_only"){const v=await request.json();const x=await this.upsertLedgerRows(v.signals);return Response.json({ok:true,inserted:x.inserted});} if(request.method==="POST"&&new URL(request.url).pathname==="/__sandbox_assert_no_repeat"){const s=await readWorkingSignals(this.ctx);const pending=s.filter(x=>x.status==="PENDING"||phase2IsEarly(x)||x.status==="UNRESOLVED");const result=await this.autoReconcileMissingFinals();return Response.json({ok:true,checked:result.checked,candidatesRemaining:result.candidatesRemaining,eligiblePendingCount:pending.length,source:"NATIVE_MISSING_FINAL_FALLBACK",outboundProviderRequestsExpected:0});} ';
            source=source.slice(0,pos)+source.slice(pos).replace('async fetch(request) {',inject);
            if(!source.includes('"/ledger-health"]'))throw Error('ACTIVE_ROUTING_CHANGED');
            source=source.replace('"/ledger-health"]','"/ledger-health", "/__sandbox_seed", "/__sandbox_ledger_only", "/__sandbox_assert_no_repeat"]');
            fs.writeFileSync('index.mjs',source);
            fs.writeFileSync('wrangler.toml',[
              'name = "ball46-native-test-local"',
              'main = "index.mjs"',
              'compatibility_date = "2026-10-18"',
              '[vars]',
              'FIVEDOLLAR_API_KEY = "sandbox-only-token-for-rehearsal-1234"',
              '[[durable_objects.bindings]]',
              'name = "ENGINE"',
              'class_name = "Nomad343Engine"',
              '[[migrations]]',
              'tag = "v1"',
              'new_sqlite_classes = ["Nomad343Engine"]'
            ].join('\n'));
            console.log('EXACT_SOURCE_ISOLATED',source.length);
          })().catch(e=>{console.error('SOURCE_REHEARSAL_FAILED',e.message);process.exit(1)});
          NODE
      - name: Check real native grader and Ledger V2 on fake locally seeded Signal
        run: |
          cd /tmp/b46local
          npx --yes wrangler@4 dev --local --ip 127.0.0.1 --port 8949 --persist-to /tmp/b46native-isolated >/tmp/b46local.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 60); do
            if curl -s --max-time 1 http://127.0.0.1:8949/bridge-health -o /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then tail -n 65 /tmp/b46local.log; exit 1; fi
          node - <<'NODE'
          const base='http://127.0.0.1:8949';
          async function req(path,method='GET',body,headers={}){
            const r=await fetch(base+path,{method,headers:{'content-type':'application/json',...headers},body:body?JSON.stringify(body):undefined});
            const j=await r.json().catch(()=>({}));
            return{http:r.status,...j};
          }
          (async()=>{
            const health=await req('/bridge-health');
            if(health.statisticsSource!=='LEDGER_V2_ONLY')throw Error('WRONG_SANDBOX_SOURCE');
            const id='LOCAL-FT-CANARY-ONLY',sigId='LOCAL-PENDING-SIGNAL-ONLY';
            const signal={id:sigId,fixtureId:id,status:'PENDING',result:null,market:'ft_over',
              selection:'OVER',line:1.5,period:'FT',odds:2.1,
              createdAt:Date.now()-3600000,minute:75,entryMinute:75,entryScore:{home:0,away:0}};
            const corner={...signal,id:'LOCAL-SIGNAL-CORNER-ONLY',market:'ft_corner_over',line:8.5,selection:'OVER'};
            const seed=await req('/__sandbox_seed','POST',{signals:[signal,corner]});
            if(!seed.ok)throw Error('CANNOT_SEED_LOCAL_SIGNAL_'+seed.http);
            const body={fixture:{id,fixture_id:id,status:'finished',status_code:'full',minute:90,teams:{home:{name:'Home FC'},away:{name:'Away FC'}},league:{name:'Sandbox League'},goals:{home:2,away:1,halfHome:null,halfAway:null},corners:{home:null,away:null,halfHome:null,halfAway:null},cards:null}};
            const hdr={'x-settlement-token':'sandbox-only-token-for-rehearsal-1234'};
            const one=await req('/reconcile-final','POST',body,hdr);
            const two=await req('/reconcile-final','POST',body,hdr);
            const noRepeat=await req('/__sandbox_assert_no_repeat','POST',{});
            if(noRepeat.checked!==0||noRepeat.eligiblePendingCount!==1)
              throw Error('REPEATED_5USD_FIXTURE_API_CANDIDATE_AFTER_GOALOO_FINAL');
            console.log('GOALOO_SETTLED_NO_5USD_FINAL_REPEAT',JSON.stringify({
              nativeFallbackChecked:noRepeat.checked,remaining:noRepeat.candidatesRemaining,
              note:'Corners remain independently pending; no qualified final-fetch candidate',
              productionWrites:0}));
            const ledger=await req('/statistics?cursor='+encodeURIComponent('stat:v2:row:9999999999999:~')+'&paged=1');
            const row=ledger.rows?.find(x=>x.id===sigId);
            const cornerRow=ledger.rows?.find(x=>x.id===corner.id);
            console.log('LOCAL_NATIVE_ENGINE_LEDGER_V2_PROOF',JSON.stringify({
              first:one.settled,replay:two.settled,ledgerStatus:row?.status,
              ledgerResult:row?.result,ledgerUpdated:one.ledgerUpdated,
              nativeLedger:ledger.statisticsSource,cornerStatus:cornerRow?.status,cornerResult:cornerRow?.result,productionMutations:0}));
            if(one.settled!==1||two.settled!==0||row?.status!=='SETTLED'||row?.result!=='WIN'||cornerRow?.status!=='PENDING')
              throw Error('FT_LEDGER_V2_NOT_YET_PROVEN');
            const oldId='LOCAL-LEDGER-ONLY-FIXTURE';
            const oldSignal={...signal,id:'LOCAL-LEDGER-ONLY-SIGNAL',fixtureId:oldId};
            const oldSeed=await req('/__sandbox_ledger_only','POST',{signals:[oldSignal]});
            if(!oldSeed.ok)throw Error('CANNOT_SEED_LEDGER_ONLY');
            const oldFt=await req('/reconcile-final','POST',{fixture:{
              id:oldId,status:'finished',status_code:'FT',minute:90,goals:{home:2,away:1}
            }},hdr);
            const oldLedger=await req('/statistics?cursor='+encodeURIComponent('stat:v2:row:9999999999999:~')+'&paged=1');
            const oldRow=oldLedger.rows?.find(x=>x.id===oldSignal.id);
            console.log('LEDGER_ONLY_PENDING_GAP',JSON.stringify({
             settlementCount:oldFt.settled,ledgerStatus:oldRow?.status,
             writerUpserted:oldFt.ledgerUpdated,
             productionWrites:0}));
            if(oldFt.settled!==0||oldRow?.status!=='PENDING')
              throw Error('LEDGER_ONLY_BEHAVIOR_CHANGED');

          })().catch(e=>{console.error('NATIVE_FT_PROOF_FAILED',e.message);process.exit(1)});
          NODE
