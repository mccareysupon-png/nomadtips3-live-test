name: BALL46 PreMatch Original League Metadata TEST Deploy
on:
  push:
    branches: [fix/ball46-prematch-original-league-restore-20261122]
    paths:
      - .github/workflows/b46-prematch-original-league-restore-test-deploy-20261122.yml
permissions:
  contents: read
concurrency:
  group: ball46-prematch-only-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run league metadata and unchanged 1X2 and HCR regression tests
        run: |
          node --check qa/prematch-history-20261120/deploy-league-original-restore-test-20261122.mjs
          node --test qa/prematch-history-20261120/league-original-restore.test.mjs qa/prematch-history-20261120/league-id-catalog.test.mjs qa/prematch-history-20261120/league-name-cache.test.mjs qa/prematch-history-20261120/stored-prematch-feed.test.mjs qa/prematch-history-20261120/test-pick-ledger.test.mjs qa/prematch-history-20261120/history-cargo-registry.test.mjs qa/prematch-history-20261120/history-cargo-full-payload.test.mjs
      - name: Deploy owner-only verified original league metadata restore to TEST
        run: node qa/prematch-history-20261120/deploy-league-original-restore-test-20261122.mjs
