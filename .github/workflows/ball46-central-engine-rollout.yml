name: BALL46 central transport migrate Engine only
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-central-engine-rollout.yml']
permissions:
  contents: read
concurrency:
  group: ball46-central-engine-rollout
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Switch tested Engine transport and observe natural scan; rollback on failure
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node qa/prematch-history-20261120/central-engine-rollout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: central-engine-rollout
          path: evidence/
