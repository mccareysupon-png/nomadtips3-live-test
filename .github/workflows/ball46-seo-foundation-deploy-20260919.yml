name: Ball46 SEO Foundation Deploy 20260919

on:
  push:
    branches: [work/ball46-full-market-20260918]
    paths:
      - '.github/workflows/ball46-seo-foundation-deploy-20260919.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BALL46_URL: https://www.ball46.com
  APPROVED_BASE: 95ff87940fd879de6aacbb0570eb4dd679f084cf

jobs:
  seo-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard pre-existing application tree
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "${APPROVED_BASE}..HEAD")
          printf 'Changed before SEO patch:\n%s\n' "${changed[*]:-none}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/ball46-seo-foundation-deploy-20260919.yml'

      - name: Apply head-only SEO metadata and crawl files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          root=Path('nomad-live-343')
          pages={
            'index.html':(
              'Live Football Scores, Soccer Odds & Match Data | Ball46',
              'Ball46 provides live football scores, soccer match data, decimal odds, live statistics and transparent match signals in one fast dashboard.',
              'https://www.ball46.com/',
              'WebSite'
            ),
            'signal.html':(
              'Live Football Signals & Soccer Match Analysis | Ball46',
              'Track active Ball46 football signals with match time, score, market, selection, line, entry odds and live supporting match context.',
              'https://www.ball46.com/signal.html',
              'WebPage'
            ),
            'statistics.html':(
              'Football Signal Statistics & Results | Ball46',
              'Review Ball46 settled football signal results, win and loss totals, win rate, average entry odds, market performance and transparent result history.',
              'https://www.ball46.com/statistics.html',
              'WebPage'
            )
          }

          def body(s):
            i=s.find('<body')
            assert i>=0
            return s[i:]

          def block(title,description,canonical,page_type):
            if page_type=='WebSite':
              data={
                '@context':'https://schema.org',
                '@graph':[
                  {'@type':'WebSite','@id':'https://www.ball46.com/#website','url':'https://www.ball46.com/','name':'Ball46','description':description,'inLanguage':'en'},
                  {'@type':'Organization','@id':'https://www.ball46.com/#organization','name':'Ball46','url':'https://www.ball46.com/','logo':{'@type':'ImageObject','url':'https://www.ball46.com/ball46-logo.svg'}}
                ]
              }
            else:
              data={
                '@context':'https://schema.org','@type':'WebPage','@id':canonical+'#webpage',
                'url':canonical,'name':title,'description':description,'inLanguage':'en',
                'isPartOf':{'@id':'https://www.ball46.com/#website'},
                'about':{'@type':'Thing','name':'Football'}
              }
            return ''.join([
              '<!-- BALL46 SEO START -->',
              f'<meta name="description" content="{description}">',
              '<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">',
              f'<link rel="canonical" href="{canonical}">',
              '<link rel="icon" href="/ball46-logo.svg" type="image/svg+xml">',
              '<meta property="og:type" content="website">',
              '<meta property="og:locale" content="en_US">',
              '<meta property="og:site_name" content="Ball46">',
              f'<meta property="og:title" content="{title}">',
              f'<meta property="og:description" content="{description}">',
              f'<meta property="og:url" content="{canonical}">',
              '<meta name="twitter:card" content="summary">',
              f'<meta name="twitter:title" content="{title}">',
              f'<meta name="twitter:description" content="{description}">',
              '<script type="application/ld+json">'+json.dumps(data,separators=(',',':'))+'</script>',
              '<!-- BALL46 SEO END -->'
            ])

          for name,(title,description,canonical,page_type) in pages.items():
            p=root/name
            s=p.read_text()
            original_body=body(s)
            s=re.sub(r'<meta name="robots" content="[^"]*">','',s,count=1)
            s=re.sub(r'<!-- BALL46 SEO START -->.*?<!-- BALL46 SEO END -->','',s,flags=re.S)
            s=re.sub(r'<title>.*?</title>',f'<title>{title}</title>',s,count=1,flags=re.S)
            marker=f'<title>{title}</title>'
            assert marker in s
            s=s.replace(marker,marker+block(title,description,canonical,page_type),1)
            assert body(s)==original_body, f'BODY_CHANGED:{name}'
            assert 'noindex' not in s.split('<body',1)[0].lower(), name
            p.write_text(s)

          previews={
            'signal-next.html':'https://www.ball46.com/signal.html',
            'statistics-next.html':'https://www.ball46.com/statistics.html'
          }
          for name,canonical in previews.items():
            p=root/name
            s=p.read_text(); original_body=body(s)
            s=re.sub(r'<meta name="robots" content="[^"]*">','<meta name="robots" content="noindex,follow">',s,count=1)
            s=re.sub(r'<link rel="canonical" href="[^"]*">','',s,count=1)
            m=re.search(r'<title>.*?</title>',s,re.S); assert m
            s=s.replace(m.group(0),m.group(0)+f'<link rel="canonical" href="{canonical}">',1)
            assert body(s)==original_body, f'PREVIEW_BODY_CHANGED:{name}'
            p.write_text(s)

          (root/'robots.txt').write_text(
            'User-agent: *\n'
            'Allow: /\n'
            'Disallow: /api/\n'
            'Disallow: /5usd-control.html\n'
            'Disallow: /api-monitor.html\n'
            'Disallow: /detection-test.html\n\n'
            'Sitemap: https://www.ball46.com/sitemap.xml\n'
          )
          (root/'sitemap.xml').write_text(
            '<?xml version="1.0" encoding="UTF-8"?>\n'
            '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
            '  <url><loc>https://www.ball46.com/</loc><lastmod>2026-09-19</lastmod></url>\n'
            '  <url><loc>https://www.ball46.com/signal.html</loc><lastmod>2026-09-19</lastmod></url>\n'
            '  <url><loc>https://www.ball46.com/statistics.html</loc><lastmod>2026-09-19</lastmod></url>\n'
            '</urlset>\n'
          )
          PY

          git diff --check
          for p in index.html signal.html statistics.html; do
            grep -Fq 'BALL46 SEO START' "nomad-live-343/$p"
            grep -Fq 'content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"' "nomad-live-343/$p"
          done
          grep -Fq 'content="noindex,follow"' nomad-live-343/signal-next.html
          grep -Fq 'content="noindex,follow"' nomad-live-343/statistics-next.html
          grep -Fq 'Sitemap: https://www.ball46.com/sitemap.xml' nomad-live-343/robots.txt
          grep -Fq '<loc>https://www.ball46.com/</loc>' nomad-live-343/sitemap.xml

      - name: Prove UI Odds and engines untouched
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            nomad-live-343/dashboard-v2.css \
            nomad-live-343/dashboard-v2-tune.css \
            nomad-live-343/dashboard-v2-stage3.js \
            nomad-live-343/dashboard-v2-tune.js \
            nomad-live-343/bulk-odds-compat-343.js \
            nomad-live-343/odds-format-343.js \
            nomad-live-343/full-market-bookmaker-343.js \
            nomad-live-343/live-summary-full-odds-343.js \
            nomad-live-343/signal-next.js \
            nomad-live-343/statistics-next.js \
            workers/nomadtips3-343-preview/src/index.js \
            workers/nomadtips3-engine-343/src/index.js; do
            git diff --quiet -- "$p" || { echo "FORBIDDEN_CHANGE:$p"; exit 1; }
          done
          mapfile -t files < <({ git diff --name-only; git ls-files --others --exclude-standard -- nomad-live-343; } | sort -u)
          printf 'SEO files:\n%s\n' "${files[*]}"
          test "${#files[@]}" -eq 7
          for p in \
            nomad-live-343/index.html \
            nomad-live-343/signal.html \
            nomad-live-343/statistics.html \
            nomad-live-343/signal-next.html \
            nomad-live-343/statistics-next.html \
            nomad-live-343/robots.txt \
            nomad-live-343/sitemap.xml; do
            printf '%s\n' "${files[@]}" | grep -Fxq "$p"
          done
          echo 'PASS: UI body, Odds, renderers, Worker and Engine untouched.'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dry-run Ball46 assets
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy Ball46 SEO foundation
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify production indexability and engine health
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl -fsS --max-time 30 "$BALL46_URL/?seo=$GITHUB_RUN_ID" -o /tmp/home.html
          curl -fsS --max-time 30 "$BALL46_URL/signal.html?seo=$GITHUB_RUN_ID" -o /tmp/signal.html
          curl -fsS --max-time 30 "$BALL46_URL/statistics.html?seo=$GITHUB_RUN_ID" -o /tmp/statistics.html
          for f in /tmp/home.html /tmp/signal.html /tmp/statistics.html; do
            grep -Fq 'BALL46 SEO START' "$f"
            grep -Fq 'content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"' "$f"
            ! grep -Fqi 'noindex,nofollow' "$f"
          done
          curl -fsS --max-time 30 "$BALL46_URL/robots.txt?seo=$GITHUB_RUN_ID" -o /tmp/robots.txt
          curl -fsS --max-time 30 "$BALL46_URL/sitemap.xml?seo=$GITHUB_RUN_ID" -o /tmp/sitemap.xml
          grep -Fq 'Sitemap: https://www.ball46.com/sitemap.xml' /tmp/robots.txt
          grep -Fq '<loc>https://www.ball46.com/</loc>' /tmp/sitemap.xml
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/health?seo=$GITHUB_RUN_ID" -o /tmp/health.json
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/board?seo=$GITHUB_RUN_ID" -o /tmp/board.json
          node -e 'const j=require("/tmp/health.json"); if(j?.ok!==true) throw Error("ENGINE_UNHEALTHY")'
          node -e 'const j=require("/tmp/board.json"); if(j?.ok!==true || !Array.isArray(j?.fixtures)) throw Error("BOARD_UNHEALTHY")'
          echo 'BALL46_SEO_FOUNDATION_PASS'

      - name: Persist SEO files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            nomad-live-343/index.html \
            nomad-live-343/signal.html \
            nomad-live-343/statistics.html \
            nomad-live-343/signal-next.html \
            nomad-live-343/statistics-next.html \
            nomad-live-343/robots.txt \
            nomad-live-343/sitemap.xml
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 7
          git commit -m 'seo(ball46): enable indexing and add canonical crawl foundation [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
