name: DIAG Ball46 Event Flow Baseline 20261002

on:
  push:
    branches:
      - diag/ball46-event-flow-baseline-20261002
    paths:
      - '.github/workflows/diag-ball46-event-flow-baseline-20261002.yml'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read Cloudflare production baseline
        shell: bash
        run: |
          set -euo pipefail
          echo '=== DEPLOYMENT STATUS ==='
          npx --yes wrangler@4.92.0 deployments status --name ball46-production --json
          echo '=== RECENT VERSIONS ==='
          npx --yes wrangler@4.92.0 versions list --name ball46-production --json | tail -220

      - name: Identify live Event Flow implementation
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ball46-production.mccarey-supon.workers.dev'
          curl -fsS -L --retry 3 --retry-all-errors --max-time 25 "$BASE/index.html?diag=${GITHUB_RUN_ID}" -o /tmp/index.html
          echo "INDEX_SHA=$(sha256sum /tmp/index.html | awk '{print $1}')"
          echo '=== INDEX LOCAL JS/CSS REFS ==='
          python3 - <<'PY' > /tmp/refs.txt
          from pathlib import Path
          import re
          h=Path('/tmp/index.html').read_text(errors='ignore')
          refs=[]
          for x in re.findall(r'''(?:src|href)=["']([^"']+)["']''',h,re.I):
              x=x.split('#',1)[0].split('?',1)[0].strip().lstrip('./').lstrip('/')
              if not x or '://' in x: continue
              if re.search(r'\.(?:js|css)$',x,re.I) and x not in refs: refs.append(x)
          print('\n'.join(refs))
          PY
          cat /tmp/refs.txt

          echo '=== REFERENCED ASSET EVENT-FLOW HITS ==='
          mkdir -p /tmp/assets
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            safe=$(echo "$name" | sed 's#[/.]#_#g')
            code=$(curl -sS -L --retry 3 --retry-all-errors --max-time 25 -o "/tmp/assets/$safe" -w '%{http_code}' "$BASE/$name?diag=${GITHUB_RUN_ID}" || true)
            echo "ASSET_HTTP=$code $name"
            [ "$code" = 200 ] || continue
            echo "ASSET_SHA=$(sha256sum "/tmp/assets/$safe" | awk '{print $1}') $name"
            hits=$(grep -nEi 'event[- _]?flow|momentum|b46-flow|flow-bars|flowline|flow-line' "/tmp/assets/$safe" | head -60 || true)
            if [ -n "$hits" ]; then
              echo "--- HITS $name ---"
              printf '%s\n' "$hits"
            fi
          done < /tmp/refs.txt

          echo '=== KNOWN EVENT FLOW SIDECARS ==='
          for name in event-flow-bars-343.css event-flow-bars-343.js signal-event-flow-line-343.css signal-event-flow-line-343.js momentum.js live.css live-app.js; do
            safe=$(echo "$name" | sed 's#[/.]#_#g')
            code=$(curl -sS -L --retry 3 --retry-all-errors --max-time 25 -o "/tmp/assets/known_$safe" -w '%{http_code}' "$BASE/$name?diag=${GITHUB_RUN_ID}" || true)
            echo "KNOWN_HTTP=$code $name"
            [ "$code" = 200 ] || continue
            echo "KNOWN_SHA=$(sha256sum "/tmp/assets/known_$safe" | awk '{print $1}') BYTES=$(wc -c < "/tmp/assets/known_$safe") $name"
            grep -nEi 'event[- _]?flow|momentum|b46-flow|flow-bars|flowline|flow-line|height:|min-height|max-height|svg|canvas|background' "/tmp/assets/known_$safe" | head -120 || true
          done

          echo '=== BALL46.COM PARITY ==='
          for name in index.html signal-event-flow-line-343.css signal-event-flow-line-343.js event-flow-bars-343.css event-flow-bars-343.js; do
            a="/tmp/parity_worker_$(echo "$name"|sed 's#[/.]#_#g')"
            b="/tmp/parity_domain_$(echo "$name"|sed 's#[/.]#_#g')"
            curl -fsS -L --retry 3 --retry-all-errors --max-time 25 "$BASE/$name?diag=${GITHUB_RUN_ID}" -o "$a"
            curl -fsS -L --retry 3 --retry-all-errors --max-time 25 "https://ball46.com/$name?diag=${GITHUB_RUN_ID}" -o "$b"
            echo "PARITY $(sha256sum "$a"|awk '{print $1}') $(sha256sum "$b"|awk '{print $1}') $name"
          done

      - name: Read live backend continuity
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ball46-production.mccarey-supon.workers.dev'
          for ep in health board signals statistics; do
            curl -fsS -L --retry 3 --retry-all-errors --max-time 25 "$BASE/api/engine/$ep?diag=${GITHUB_RUN_ID}" -o "/tmp/$ep.json"
            echo "API_OK $ep $(wc -c < "/tmp/$ep.json") bytes"
          done
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/board.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals.json','utf8'));
          const t=JSON.parse(fs.readFileSync('/tmp/statistics.json','utf8'));
          console.log('LIVE_COUNTS', JSON.stringify({fixtures:Array.isArray(b?.fixtures)?b.fixtures.length:null,signals:Array.isArray(s?.signals)?s.signals.length:null,stats:Array.isArray(t?.rows)?t.rows.length:null}));
          NODE
