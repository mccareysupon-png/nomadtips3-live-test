name: Prediction2 — Add Draw Metric

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prediction2-add-draw-metric.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Add display-only draw metric
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('nomad-live/prediction2.html')
          s = p.read_text()

          s2 = s.replace(
            '.king-scorebar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));',
            '.king-scorebar{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));',
            1,
          )
          if s2 == s:
            raise SystemExit('scorebar 7-column selector not found')
          s = s2

          old = '<div class="metric loss"><span>LOSS</span><b id="sumLoss">—</b></div>\n      <div class="metric"><span>WIN RATE</span><b id="sumRate">—</b></div>'
          new = '<div class="metric loss"><span>LOSS</span><b id="sumLoss">—</b></div>\n      <div class="metric draw"><span>DRAW</span><b id="sumDraw">—</b></div>\n      <div class="metric"><span>WIN RATE</span><b id="sumRate">—</b></div>'
          if old not in s:
            raise SystemExit('scorebar LOSS/WIN RATE block not found')
          s = s.replace(old, new, 1)

          old = "const losses=settled.filter(x=>x.result==='LOSS').length;"
          new = "const losses=settled.filter(x=>x.result==='LOSS').length;\n        const draws=(data.history||[]).filter(x=>x.result==='DRAW'||x.result==='PUSH').length;"
          if old not in s:
            raise SystemExit('loss counter not found')
          s = s.replace(old, new, 1)

          old = "$('#sumPicks').textContent=settled.length;$('#sumWin').textContent=wins;$('#sumLoss').textContent=losses;$('#sumRate').textContent=pct(settled.length?wins/settled.length:NaN);"
          new = "$('#sumPicks').textContent=settled.length;$('#sumWin').textContent=wins;$('#sumLoss').textContent=losses;$('#sumDraw').textContent=draws;$('#sumRate').textContent=pct(settled.length?wins/settled.length:NaN);"
          if old not in s:
            raise SystemExit('summary assignment not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit draw metric
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nomad-live/prediction2.html
          git diff --cached --quiet && exit 0
          git commit -m "Show DRAW in Prediction2 performance summary"
          git push origin HEAD:main
