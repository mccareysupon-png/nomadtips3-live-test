name: BALL46 Featured Corner ENTRY — candidate and QA (no deploy)
on:
  push:
    branches: [fix/ball46-corner-entry-20261024]
    paths:
      - .github/workflows/ball46-corner-entry-candidate.yml
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Chrome and check source
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core
          command -v google-chrome
          node --check deploy-assets/corner-entry-20261024/patch.mjs
          node --check deploy-assets/corner-entry-20261024/candidate.mjs
          node --check deploy-assets/corner-entry-20261024/qa.mjs
      - name: Upload isolated candidate preserving all modules and bindings
        run: node deploy-assets/corner-entry-20261024/candidate.mjs
      - name: Assert immutable corner snapshot and preview PC/mobile UI
        run: node deploy-assets/corner-entry-20261024/qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b46-corner-entry-candidate-${{ github.run_id }}
          path: deploy-assets/corner-entry-20261024/audit/
          retention-days: 14
