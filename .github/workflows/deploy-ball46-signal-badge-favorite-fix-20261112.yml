name: Deploy BALL46 Signal Badge Favorite Fix 20261112
on:
  push:
    branches: [test/ball46-pin-v2-mobile-fix-20261112]
    paths: ['pinned-fixtures-v2-production/SIGNAL_BADGE_DEPLOY_READY']
permissions: {contents: read}
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: test/ball46-pin-v2-mobile-fix-20261112}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Guarded Signal badge deploy
        run: node pinned-fixtures-v2-production/signal-badge-hotfix-deploy-20261112.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-badge-hotfix-production-${{ github.run_id }}
          path: pinned-fixtures-v2-production/signal-badge-hotfix-state.json
          retention-days: 7
