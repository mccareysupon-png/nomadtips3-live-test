name: BALL46 owner Access login cookie compatibility correction only
on:
  push:
    branches: [codex/ball46-5usd-latency-control-20261102]
    paths: ['work/ball46-5usd-latency-control-20261102/connection/cookie-fix-request.json']
permissions:
  contents: write
concurrency:
  group: ball46-bulk-owner-connection
  cancel-in-progress: false
jobs:
  cookie:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: work/ball46-5usd-latency-control-20261102
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Correct only own Bulk Access app SameSite; preserve owner, paths and HttpOnly
        run: node connection/access-owner.mjs --provision-owner-access
      - name: Preserve scoped correction proof; no Worker deployment
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-audit/owner-access-connection.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Correct own Bulk Access cookie compatibility, preserving exact owner policy and paths [skip ci]"
          git push origin HEAD:codex/ball46-5usd-latency-control-20261102
