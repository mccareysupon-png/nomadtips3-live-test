name: Apex Redirect Inspect 20260905

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apex-redirect-inspect-20260905.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  ZONE_ID: 35badb923b6451ed5109276f20b6c749

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public DNS and redirect-rule capability
        shell: bash
        run: |
          set +e
          echo '=== DNS apex ==='
          dig @1.1.1.1 +short CNAME nomadtips3.com
          dig @1.1.1.1 +short A nomadtips3.com
          echo '=== DNS www ==='
          dig @1.1.1.1 +short CNAME www.nomadtips3.com
          dig @1.1.1.1 +short A www.nomadtips3.com
          echo '=== HEAD apex ==='
          curl -sS -D - -o /dev/null --max-time 20 https://nomadtips3.com/ | sed -n '1,35p'
          echo '=== HEAD www ==='
          curl -sS -D - -o /dev/null --max-time 20 https://www.nomadtips3.com/ | sed -n '1,35p'
          echo '=== Zone rulesets capability ==='
          code=$(curl -sS -o /tmp/rulesets.json -w '%{http_code}' \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/rulesets")
          echo "HTTP=$code"
          python - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/rulesets.json'))
          except Exception as e:
              print('parse_error=',e); raise SystemExit
          print('success=',d.get('success'))
          for e in d.get('errors') or []:
              print('error=',e.get('code'),e.get('message'))
          for r in d.get('result') or []:
              print('ruleset=',r.get('id'),r.get('name'),r.get('phase'),r.get('kind'))
          PY
