name: READ ONLY - Ball46 Scorebar Images Predeploy 20260929

on:
  push:
    branches:
      - work/ball46-scorebar-images-20260929
    paths:
      - '.github/workflows/ball46-scorebar-images-predeploy-20260929.yml'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-scorebar-images-20260929
      - uses: actions/download-artifact@v4
        with:
          name: ball46-topcard-deploy-36511270959
          path: /tmp/b46-seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36511270959
      - name: Verify current Production and build exact 83-asset image candidate
        shell: bash
        run: bash .github/scripts/ball46_scorebar_images_predeploy_20260929.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-scorebar-images-predeploy-${{ github.run_id }}
          path: /tmp/b46-scorebar-images-predeploy
          if-no-files-found: ignore
          retention-days: 30
