name: Fix 3.43 Multi Open Cards

on:
  push:
    branches: [work/nomad343-server-prewarm-20260914]
    paths:
      - '.github/workflows/fix-343-multi-open-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CANARY_URL: https://nomadtips3-343-stable-preview.mccarey-supon.workers.dev
  PROD_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/nomad343-server-prewarm-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm multi-open source
        run: |
          set -euo pipefail
          node --check nomad-live-343/live-stable-343.js
          grep -Fq "343-stable-bulk-viewer-v2-multi-open" nomad-live-343/live-stable-343.js
          grep -Fq 'const openedIds=new Set()' nomad-live-343/live-stable-343.js
          grep -Fq "const opening=card.getAttribute('aria-expanded')!=='true'" nomad-live-343/live-stable-343.js
          ! grep -Fq 'if(openedId&&openedId!==id)' nomad-live-343/live-stable-343.js
          grep -Fq 'live-stable-343.js?v=343-stable-bulk-v2-multi-open' nomad-live-343/index.html

      - name: Guard scope
        run: |
          set -euo pipefail
          git diff --quiet HEAD^ HEAD -- workers/nomadtips3-engine-343 workers/nomadtips3-5usd-hub-343 workers/nomadtips3-343-full-market workers/nomadtips3-343-full-market-central nomad-live-341

      - name: Dry run viewers
        run: |
          set -euo pipefail
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.stable.jsonc)
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc)

      - name: Deploy canary viewer
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.stable.jsonc

      - name: Verify multi-open behavior on canary
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          TARGET_URL="$CANARY_URL" node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1366,height:900}});
            let detailCalls=0;
            page.on('request',r=>{if(r.url().includes('/api/full-market/fixture-odds'))detailCalls++});
            await page.goto(process.env.TARGET_URL+'/?multiopen='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForSelector('.match-card[data-match-id]',{timeout:45000});
            const cards=page.locator('.match-card[data-match-id]');
            if(await cards.count()<2)throw Error('NEED_AT_LEAST_TWO_CARDS');
            const first=cards.nth(0),second=cards.nth(1);
            await first.locator('.match-row.scoreboard-default').click();
            await page.waitForTimeout(250);
            if(await first.getAttribute('aria-expanded')!=='true')throw Error('FIRST_NOT_OPEN');

            await second.scrollIntoViewIfNeeded();
            await page.waitForTimeout(120);
            const topBefore=await second.evaluate(el=>el.getBoundingClientRect().top);
            const scrollBefore=await page.evaluate(()=>scrollY);
            await second.evaluate(el=>el.querySelector('.match-row.scoreboard-default')?.click());
            await page.waitForTimeout(250);
            const topAfter=await second.evaluate(el=>el.getBoundingClientRect().top);
            const scrollAfter=await page.evaluate(()=>scrollY);

            if(await first.getAttribute('aria-expanded')!=='true')throw Error('FIRST_AUTO_CLOSED');
            if(await second.getAttribute('aria-expanded')!=='true')throw Error('SECOND_NOT_OPEN');
            const expanded=await page.locator('.match-card[aria-expanded="true"]').count();
            if(expanded<2)throw Error('MULTI_OPEN_COUNT='+expanded);
            if(Math.abs(topAfter-topBefore)>2)throw Error('SECOND_CARD_MOVED delta='+(topAfter-topBefore));
            if(Math.abs(scrollAfter-scrollBefore)>2)throw Error('APP_SCROLLED_PAGE delta='+(scrollAfter-scrollBefore));

            await first.evaluate(el=>el.querySelector('.match-row.scoreboard-default')?.click());
            await page.waitForTimeout(150);
            if(await first.getAttribute('aria-expanded')!=='false')throw Error('FIRST_DID_NOT_CLOSE_ON_OWN_CLICK');
            if(await second.getAttribute('aria-expanded')!=='true')throw Error('SECOND_CLOSED_WITH_FIRST');
            if(detailCalls!==0)throw Error('VIEWER_DETAIL_CALLS='+detailCalls);
            console.log('CANARY MULTI OPEN OK',{expanded,topBefore,topAfter,scrollBefore,scrollAfter,detailCalls});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Deploy production viewer
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Verify production assets
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            js="$(curl -fsS "$PROD_URL/live-stable-343.js?x=$RANDOM$(date +%s)" || true)"
            if grep -Fq '343-stable-bulk-viewer-v2-multi-open' <<<"$js" && grep -Fq 'const openedIds=new Set()' <<<"$js" && ! grep -Fq 'if(openedId&&openedId!==id)' <<<"$js"; then
              echo 'PRODUCTION MULTI OPEN ASSET OK'
              exit 0
            fi
            sleep 2
          done
          exit 1
