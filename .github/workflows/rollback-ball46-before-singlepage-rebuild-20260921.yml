name: Rollback Ball46 Before Single Page Rebuild 20260921

on:
  push:
    branches: [work/ball46-singlepage-workspace-20260921]
    paths:
      - '.github/workflows/rollback-ball46-before-singlepage-rebuild-20260921.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BALL46_URL: https://www.ball46.com
  BALL46_APEX: https://ball46.com
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  BASELINE_SHA: 179eeec2d4aefb12592b036688ab42386bcfb609

jobs:
  rollback-ball46:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify clean baseline
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASELINE_SHA^{commit}"
          test "$(git merge-base HEAD "$BASELINE_SHA")" = "$BASELINE_SHA"
          grep -Fq '"name": "ball46-production"' workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          grep -Fq '"ENGINE", "service": "nomadtips3-engine-343"' workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          grep -Fq '"HUB", "service": "nomadtips3-5usd-hub-343"' workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          grep -Fq '<nav class="v2-mainnav"' nomad-live-343/index.html
          ! grep -Fq 'CONNECTED WORKSPACE' nomad-live-343/index.html
          echo 'PASS: clean pre-connected-workspace baseline verified.'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Dry-run Ball46 rollback package
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy clean Ball46 baseline
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Smoke clean Ball46 baseline
        shell: bash
        run: |
          set -euo pipefail
          sleep 4
          for base in "$BALL46_WORKER" "$BALL46_URL" "$BALL46_APEX"; do
            curl -fsS --max-time 30 "$base/?rollback=$GITHUB_RUN_ID" -o /tmp/home.html
            grep -Fq 'NOMAD LIVE 3.43 · BULK DASHBOARD' /tmp/home.html
            grep -Fq '<nav class="v2-mainnav"' /tmp/home.html
            ! grep -Fq 'CONNECTED WORKSPACE' /tmp/home.html
          done
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/board?rollback=$GITHUB_RUN_ID" -o /tmp/board.json
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/signals?rollback=$GITHUB_RUN_ID" -o /tmp/signals.json
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/statistics?rollback=$GITHUB_RUN_ID" -o /tmp/stats.json
          node - <<'NODE'
          const fs=require('fs');
          const board=JSON.parse(fs.readFileSync('/tmp/board.json','utf8'));
          const signals=JSON.parse(fs.readFileSync('/tmp/signals.json','utf8'));
          const stats=JSON.parse(fs.readFileSync('/tmp/stats.json','utf8'));
          if(board?.ok!==true||!Array.isArray(board?.fixtures)) throw Error('board unhealthy');
          if(!Array.isArray(signals?.signals)) throw Error('signals unhealthy');
          if(stats?.ok!==true||!Array.isArray(stats?.rows)) throw Error('statistics unhealthy');
          console.log('ROLLBACK PASS',{fixtures:board.fixtures.length,signals:signals.signals.length,statistics:stats.rows.length});
          NODE
