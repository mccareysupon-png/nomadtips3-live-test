name: READ ONLY - Ball46 Scorebar Current Snapshot 20261001

on:
  push:
    branches: [ops/ball46-scorebar-visual-20261001]
    paths: ['.github/workflows/audit-ball46-scorebar-current-20261001.yml']

permissions:
  contents: read

env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  BALL46_URL: https://ball46.com

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Lock current Production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/current
          AUTH="Authorization: Bearer $API_TOKEN"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=3" -H "$AUTH" -o /tmp/deployments.json
          CUR=$(node -e "const j=require('/tmp/deployments.json');const d=j.result?.deployments?.[0];if(!d||d.versions?.length!==1||Number(d.versions[0].percentage)!==100)process.exit(2);process.stdout.write(String(d.versions[0].version_id||''))")
          [ -n "$CUR" ]
          echo -n "$CUR" >/tmp/current-version.txt
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/workers/$SCRIPT_NAME/versions/$CUR?include=modules" -H "$AUTH" -o /tmp/current-version.json
          echo "CURRENT_VERSION=$CUR"

      - name: Fetch exact current static set
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/paths.txt <<'EOF'
          5usd-control.html
          api-monitor.html
          app.css
          ball46-logo.svg
          ball46-next.css
          brand-clean-header-343.css
          bulk-odds-compat-343.js
          color-semantics-343.css
          color-semantics-343.js
          content-rails-343.css
          dashboard-v2-stage3.js
          dashboard-v2-tune.css
          dashboard-v2-tune.js
          dashboard-v2.css
          detection-test.html
          event-flow-bars-343.css
          event-flow-bars-343.js
          expanded-match-343.css
          expanded-match-343.js
          football-language-343.js
          full-market-bookmaker-343.css
          full-market-bookmaker-343.js
          index.html
          language-ar-343.js
          language-es-343.js
          language-fr-343.js
          language-id-343.js
          language-menu-343.js
          language-pt-br-343.js
          language-vintage-343.png
          league-flags-343.js
          live-prediction-343.js
          live-summary-full-odds-343.js
          longterm-performance-343.css
          longterm-performance-343.js
          market-registry-343.js
          mobile-menu-classic-343.css
          mobile-menu-classic-343.js
          odds-format-343.js
          odds-vintage-343.png
          promo-live-343.svg
          promo-signal-343.svg
          promo-stat-343.svg
          rich-odds-on-demand-343.js
          robots.txt
          scorebar-draw-20260929a.webp
          scorebar-loss-20260929a.webp
          scorebar-pending-20260929a.webp
          scorebar-win-20260929a.webp
          settings.css
          settings.html
          settings.js
          signal-bettor-343.css
          signal-compact-343.css
          signal-event-flow-line-343.css
          signal-event-flow-line-343.js
          signal-focus-343.js
          signal-next.html
          signal-next.js
          signal-shared-view-343.css
          signal-v2-clean-343.css
          signal.html
          signal.js
          singlepage-workspace-343.css
          singlepage-workspace-343.js
          sitemap.xml
          statistics-next.html
          statistics-next.js
          statistics-page-343.css
          statistics-v2-clean-343.css
          statistics.html
          statistics.js
          team-kits-343.js
          team-sides-343.css
          team-sides-343.js
          theme-341-343.css
          theme-light-343.css
          ui-sync-fixes-343-v2.js
          ui-sync-fixes-343.css
          v2-header.css
          v2-shared.css
          v2-shared.js
          workspace-route-guard-343.js
          EOF
          sed -i 's/^          //' /tmp/paths.txt
          [ "$(wc -l </tmp/paths.txt)" -eq 83 ]
          K="${GITHUB_RUN_ID}-$(date +%s%N)"
          while IFS= read -r p; do
            mkdir -p "/tmp/current/$(dirname "$p")"
            code=$(curl -sS -L -H 'Cache-Control: no-cache' -o "/tmp/current/$p" -w '%{http_code}' "$BALL46_URL/$p?audit=$K")
            [ "$code" = 200 ] || { echo "FETCH_FAIL $p $code"; exit 5; }
          done </tmp/paths.txt
          cp /tmp/paths.txt /tmp/current/paths.txt
          cp /tmp/current-version.txt /tmp/current/current-version.txt
          cp /tmp/current-version.json /tmp/current/current-version.json
          sha256sum /tmp/current/index.html /tmp/current/dashboard-v2-tune.css /tmp/current/dashboard-v2-stage3.js | tee /tmp/current/key-sha256.txt
          grep -nE 'workspace-scorebar|outcome-(win|loss|draw)|scorebar-(win|loss|draw|pending)|border-right|background-image|background-position' /tmp/current/dashboard-v2-tune.css > /tmp/current/scorebar-css-lines.txt || true
          grep -nE 'workspace-scorebar|makeSettled|makePending|recent\.map|pending\.map' /tmp/current/dashboard-v2-stage3.js > /tmp/current/scorebar-js-lines.txt || true

      - name: Measure current scorebar DOM and CSS
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm i playwright@1.57.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > /tmp/measure.cjs <<'NODE'
          const { chromium }=require('playwright');const fs=require('fs');
          (async()=>{const b=await chromium.launch({headless:true});const out={at:new Date().toISOString(),views:[]};
          for(const [name,w,h] of [['desktop-1920',1920,900],['desktop-1440',1440,900],['tablet-1000',1000,900],['mobile-390',390,844]]){
            const p=await b.newPage({viewport:{width:w,height:h}});const errs=[];p.on('pageerror',e=>errs.push(String(e)));
            await p.goto(process.env.BALL46_URL+'/index.html?scorebar-audit='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});await p.waitForTimeout(6500);
            const s=await p.evaluate(()=>{const slot=document.querySelector('[data-workspace-scorebar-slot]');if(!slot)return {missing:true};const live=[...slot.querySelectorAll('.workspace-scorebar-cell')];const original=slot.innerHTML;slot.style.display='block';slot.innerHTML='<div class="workspace-scorebar-grid">'+[
              'workspace-scorebar-cell workspace-scorebar-signal-result outcome-win','workspace-scorebar-cell workspace-scorebar-signal-result outcome-loss','workspace-scorebar-cell workspace-scorebar-signal-result outcome-draw','workspace-scorebar-cell workspace-scorebar-pending','workspace-scorebar-cell workspace-scorebar-signal-result outcome-win','workspace-scorebar-cell workspace-scorebar-signal-result outcome-loss','workspace-scorebar-cell workspace-scorebar-pending','workspace-scorebar-cell workspace-scorebar-pending','workspace-scorebar-cell workspace-scorebar-pending','workspace-scorebar-cell workspace-scorebar-pending'].map(c=>'<div class="'+c+'"><span class="workspace-scorebar-meta"><i>TEST</i><b>1-0</b></span><span class="workspace-scorebar-match">Home v Away</span><span class="workspace-scorebar-pick"><strong>AH</strong><em>Home -0.5 @ 1.90</em></span><span class="workspace-scorebar-details"><span>ENTRY</span><span>60\'</span><span>NOW</span></span></div>').join('')+'</div>';
              const cells=[...slot.querySelectorAll('.workspace-scorebar-cell')].map((e,i)=>{const c=getComputedStyle(e),r=e.getBoundingClientRect();return {i,cls:e.className,width:r.width,height:r.height,borderRightWidth:c.borderRightWidth,borderRightStyle:c.borderRightStyle,borderRightColor:c.borderRightColor,backgroundImage:c.backgroundImage,backgroundSize:c.backgroundSize,backgroundPosition:c.backgroundPosition,boxShadow:c.boxShadow,borderRadius:c.borderRadius,overflow:c.overflow}});const grid=slot.querySelector('.workspace-scorebar-grid'),gr=grid?.getBoundingClientRect();const sr=slot.getBoundingClientRect();slot.innerHTML=original;return {slot:{width:sr.width,height:sr.height,display:getComputedStyle(slot).display},grid:gr?{width:gr.width,height:gr.height}:null,liveCount:live.length,cells};});
            out.views.push({name,viewport:{width:w,height:h},state:s,errs});await p.close();}
          await b.close();fs.writeFileSync('/tmp/current/scorebar-measure.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out));})();
          NODE
          node /tmp/measure.cjs

      - name: Verify Production did not move during snapshot
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN";BASE=$(cat /tmp/current-version.txt)
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/end.json
          CUR=$(node -e "const j=require('/tmp/end.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))")
          [ "$CUR" = "$BASE" ] || { echo "PRODUCTION_MOVED:$BASE->$CUR"; exit 8; }
          echo SNAPSHOT_PASS

      - uses: actions/upload-artifact@v4
        with:
          name: ball46-scorebar-current-${{ github.run_id }}
          path: /tmp/current
          if-no-files-found: error
          retention-days: 10
