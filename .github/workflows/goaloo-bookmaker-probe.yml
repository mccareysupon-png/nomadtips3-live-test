name: Goaloo Bookmaker Feed Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goaloo-bookmaker-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe public Goaloo odds routes without changing engine config
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          urls=[
            'https://live10.goaloo28.com/gf/data/odds/en/runOddsData_8.txt',
            'https://live10.goaloo28.com/gf/data/odds/en/runOddsData_50.txt',
            'https://live10.goaloo28.com/gf/data/odds/en/goal8.xml',
            'https://live10.goaloo28.com/gf/data/odds/en/goal50.xml',
          ]
          headers={'User-Agent':'NOMADTIPS3-Bookmaker-Probe/1.0','Accept':'*/*'}
          for url in urls:
            print('\n===',url,'===')
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:
                body=r.read().decode('utf-8','replace')
                print('HTTP',r.status,'content-type',r.headers.get('content-type'),'bytes',len(body))
                print(body[:12000])
            except Exception as exc:
              print('FETCH_ERROR',repr(exc))
          PY
