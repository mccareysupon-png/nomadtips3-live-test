name: Ball46 realtime PENDING statistics 20261005

on:
  push:
    branches:
      - ops/ball46-stat-realtime-pending-20261005b
    paths:
      - '.github/workflows/ball46-stat-realtime-pending-20261005.yml'
      - '.github/scripts/ball46_stat_realtime_pending_patch_20261005.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-stat-realtime-pending-production
  cancel-in-progress: false

jobs:
  guarded-production-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
    steps:
      - name: Checkout exact operations branch
        uses: actions/checkout@v4
        with:
          ref: ops/ball46-stat-realtime-pending-20261005b
          fetch-depth: 1

      - name: Build guarded realtime deploy rail from proven final-flow rail
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/ball46_stat_final_flow_deploy_v2_20261004.sh /tmp/ball46-stat-realtime-pending-deploy.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/ball46-stat-realtime-pending-deploy.sh')
          s=p.read_text()
          old="PATCHER='.github/scripts/ball46_stat_final_flow_patch_20261004.py'"
          new="PATCHER='.github/scripts/ball46_stat_realtime_pending_patch_20261005.py'"
          if s.count(old)!=1: raise SystemExit('PROVEN_RAIL_PATCHER_ANCHOR_MOVED')
          s=s.replace(old,new,1)
          oldcheck="if(st.statisticsLedgerVersion!=='signal-ledger-v2-longterm'||st.statisticsSource!=='LEDGER_V2_ONLY'||st.workingStoreVersion!=='chunked-working-store-v1'||st.finalReconcileVersion!=='missing-final-direct-v1'||st.retention!=='LONG_TERM_NO_APPLICATION_EXPIRY')throw Error('POST_STATISTICS_CONTRACT_BAD');"
          newcheck="if(st.statisticsLedgerVersion!=='signal-ledger-v2-longterm'||st.statisticsSource!=='LEDGER_V2_ONLY'||st.realtimePendingLedgerVersion!=='realtime-pending-ledger-v1'||st.workingStoreVersion!=='chunked-working-store-v1'||st.finalReconcileVersion!=='missing-final-direct-v1'||st.retention!=='LONG_TERM_NO_APPLICATION_EXPIRY')throw Error('POST_STATISTICS_CONTRACT_BAD');"
          if s.count(oldcheck)!=1: raise SystemExit('STAT_CONTRACT_VERIFY_ANCHOR_MOVED')
          s=s.replace(oldcheck,newcheck,1)
          oldbridge="if(bh.statisticsSource!=='LEDGER_V2_ONLY'||bh.workingStoreVersion!=='chunked-working-store-v1'||bh.finalReconcileVersion!=='missing-final-direct-v1')throw Error('POST_BRIDGE_CONTRACT_BAD');"
          newbridge="if(bh.statisticsSource!=='LEDGER_V2_ONLY'||bh.realtimePendingLedgerVersion!=='realtime-pending-ledger-v1'||bh.workingStoreVersion!=='chunked-working-store-v1'||bh.finalReconcileVersion!=='missing-final-direct-v1')throw Error('POST_BRIDGE_CONTRACT_BAD');"
          if s.count(oldbridge)!=1: raise SystemExit('BRIDGE_VERIFY_ANCHOR_MOVED')
          s=s.replace(oldbridge,newbridge,1)
          oldpending="for(const x of st.rows){const q=String(x?.status||'').toUpperCase();if(q==='PENDING'&&x.result!=='LIVE')throw Error('PENDING_NOT_LIVE:'+x.id);if(q==='SETTLED'&&x.result==='LIVE')throw Error('SETTLED_STILL_LIVE:'+x.id)}"
          newpending="const statById=new Map(st.rows.map(x=>[String(x?.id||''),x]));for(const x of sig.signals.filter(x=>String(x?.status||'').toUpperCase()==='PENDING')){const row=statById.get(String(x?.id||''));if(!row)throw Error('PENDING_SIGNAL_MISSING_FROM_LEDGER:'+x.id);if(String(row?.status||'').toUpperCase()!=='PENDING')throw Error('PENDING_LEDGER_STATUS_MISMATCH:'+x.id)}for(const x of st.rows){const q=String(x?.status||'').toUpperCase(),res=String(x?.result||'').toUpperCase(),display=String(x?.displayStatus||'').toUpperCase();if(q==='PENDING'&&(res==='LIVE'||display==='LIVE'))throw Error('PENDING_STILL_LIVE:'+x.id);if(q==='PENDING'&&display!=='PENDING')throw Error('PENDING_DISPLAY_NOT_PENDING:'+x.id);if(q==='SETTLED'&&res==='LIVE')throw Error('SETTLED_STILL_LIVE:'+x.id)}"
          if s.count(oldpending)!=1: raise SystemExit('PENDING_VERIFY_ANCHOR_MOVED')
          s=s.replace(oldpending,newpending,1)
          grep_anchor="grep -Fq 'signal-ledger-v2-longterm' \"$ROOT/worker/index-bulk-recovery.js\""
          if s.count(grep_anchor)!=1: raise SystemExit('STATIC_GREP_ANCHOR_MOVED')
          s=s.replace(grep_anchor,grep_anchor+"; grep -Fq 'realtime-pending-ledger-v1' \"$ROOT/worker/index-bulk-recovery.js\"",1)
          p.write_text(s)
          PY
          chmod +x /tmp/ball46-stat-realtime-pending-deploy.sh

      - name: Deploy only after preflight and rollback on any verification failure
        shell: bash
        run: /tmp/ball46-stat-realtime-pending-deploy.sh

# retry 2: live-source anchor matcher hardened after fail-closed preflight
