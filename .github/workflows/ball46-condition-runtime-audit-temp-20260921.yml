name: Ball46 Condition Runtime Audit Temp 20260921

on:
  push:
    branches: [work/ball46-full-market-20260918]
    paths:
      - '.github/workflows/ball46-condition-runtime-audit-temp-20260921.yml'

env:
  BALL46_URL: https://www.ball46.com
  ENGINE_URL: https://nomadtips3-engine-343.mccarey-supon.workers.dev

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Expose engine scan failure details
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$BALL46_URL/api/hub/snapshot?audit=$GITHUB_RUN_ID" -o /tmp/hub.json
          curl -fsS --max-time 30 "$ENGINE_URL/health?audit=$GITHUB_RUN_ID" -o /tmp/health-before.json
          scan_code=$(curl -sS --max-time 60 -X POST -o /tmp/scan.json -w '%{http_code}' "$ENGINE_URL/scan?audit=$GITHUB_RUN_ID")
          sleep 3
          curl -fsS --max-time 30 "$ENGINE_URL/health?audit=after-$GITHUB_RUN_ID" -o /tmp/health-after.json
          board_code=$(curl -sS --max-time 30 -o /tmp/board.json -w '%{http_code}' "$ENGINE_URL/board?audit=after-$GITHUB_RUN_ID")
          node - "$scan_code" "$board_code" <<'NODE'
          const fs=require('fs');
          const rd=p=>JSON.parse(fs.readFileSync(p));
          const [scanCode,boardCode]=process.argv.slice(2);
          const hub=rd('/tmp/hub.json'), hb=rd('/tmp/health-before.json'), scan=rd('/tmp/scan.json'), ha=rd('/tmp/health-after.json'), b=rd('/tmp/board.json');
          const pick=x=>({
            ok:x?.ok,version:x?.version,startedAt:x?.startedAt,finishedAt:x?.finishedAt,
            fixtureCount:x?.fixtureCount,liveCount:x?.liveCount,signalCount:x?.signalCount,
            refereeRequests:x?.refereeRequests,refereeQueued:x?.refereeQueued,
            staleGuard:x?.staleGuard,skipReason:x?.skipReason,lastError:x?.lastError,
            error:x?.error,hubAgeMs:x?.hubAgeMs,hubFetchedAt:x?.hubFetchedAt
          });
          console.log('HTTP',JSON.stringify({scanCode,boardCode}));
          console.log('HUB',JSON.stringify({ok:hub.ok,stale:hub.stale,ageMs:hub.ageMs,fetchedAt:hub.fetchedAt,fixtures:(hub.fixtures||[]).length}));
          console.log('HEALTH_BEFORE_DETAIL',JSON.stringify(pick(hb)));
          console.log('SCAN_DETAIL',JSON.stringify(pick(scan)));
          console.log('HEALTH_AFTER_DETAIL',JSON.stringify(pick(ha)));
          console.log('BOARD_DETAIL',JSON.stringify({ok:b.ok,stale:b.stale,staleGuard:b.staleGuard,hubAgeMs:b.hubAgeMs,hubFetchedAt:b.hubFetchedAt,fixtures:(b.fixtures||[]).length}));
          NODE
