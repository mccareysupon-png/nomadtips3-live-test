name: BALL46 Pre-Match normal HUB live and FT test deploy
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-prematch-normal-hub-live-20261121.yml']
permissions: {contents: read}
concurrency:
  group: ball46-prematch-only-test
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check qa/prematch-history-20261120/prematch-only-worker.mjs
          node --check qa/prematch-history-20261120/normal-hub-monitor.mjs
          node --check qa/prematch-history-20261120/deploy-normal-hub-monitor.mjs
          node --test qa/prematch-history-20261120/normal-hub-monitor.test.mjs qa/prematch-history-20261120/test-pick-ledger.test.mjs qa/prematch-history-20261120/london-cutoff.test.mjs qa/prematch-history-20261120/history-five-rounds.test.mjs
      - name: Test only - consume standard cached HUB feed and settle genuine full times
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node qa/prematch-history-20261120/deploy-normal-hub-monitor.mjs
