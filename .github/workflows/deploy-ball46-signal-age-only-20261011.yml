name: Deploy Ball46 Signal Age 45min to Zero ONLY
on:
  push:
    branches: [work/ball46-phase1-safe-patch-20261011]
    paths:
      - '.github/workflows/deploy-ball46-signal-age-only-20261011.yml'
permissions:
  contents: read
concurrency:
  group: ball46-engine343-signal-age-only-deploy
  cancel-in-progress: false
jobs:
  guarded-production-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact deploy branch
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment script syntax
        run: node --check deploy-assets/ball46-signal-age-only-20261011/deploy.mjs
      - name: Deploy exact one-line Signal age change from ACTIVE Engine only
        run: node deploy-assets/ball46-signal-age-only-20261011/deploy.mjs
      - name: Save verification and rollback version IDs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-signal-age-only-${{ github.run_id }}
          path: audit/
          if-no-files-found: warn
          retention-days: 30
