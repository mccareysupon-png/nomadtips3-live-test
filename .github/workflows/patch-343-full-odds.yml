name: Patch 3.43 Full Odds

on:
  push:
    branches:
      - work/nomad343-clean-bet365-ui
    paths:
      - .github/workflows/patch-343-full-odds.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nomad343-clean-bet365-ui
          fetch-depth: 0

      - name: Patch only Engine full-odds handoff and Live market card
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          engine = Path('workers/nomadtips3-engine-343/src/index.js')
          s = engine.read_text()

          old = """      const settings=await this.readSettings(),run=await this.readRun(),oldHist=await this.ctx.storage.get('histories')||{},signals=await this.ctx.storage.get('signals')||[];
      const histories={},board=[],seen=new Set(signals.filter(s=>s.status==='PENDING').map(s=>`${s.fixtureId}:${s.market}`));const at=Number(hub.fetchedAt||now());"""
          new = """      const settings=await this.readSettings(),run=await this.readRun(),oldHist=await this.ctx.storage.get('histories')||{},signals=await this.ctx.storage.get('signals')||[],prevBoard=await this.ctx.storage.get('board')||{};
      const prevById=new Map((Array.isArray(prevBoard?.fixtures)?prevBoard.fixtures:[]).map(x=>[String(x?.fixtureId??''),x]));
      const pendingFixtureIds=new Set(signals.filter(s=>s.status==='PENDING').map(s=>String(s.fixtureId)));
      const histories={},board=[],seen=new Set(signals.filter(s=>s.status==='PENDING').map(s=>`${s.fixtureId}:${s.market}`));const at=Number(hub.fetchedAt||now());"""
          assert old in s, 'engine scan setup anchor not found'
          s = s.replace(old, new, 1)

          old = "        board.push({...f,analysis});"
          new = """        const prev=prevById.get(String(f.fixtureId)),prevAt=num(prev?.fullOddsFetchedAt),keepFullOdds=Boolean(prev?.fullOdds)&&(pendingFixtureIds.has(String(f.fixtureId))||(isLive(f)&&prevAt!==null&&at-prevAt<=15*60_000));
        board.push({...f,analysis,fullOdds:keepFullOdds?prev.fullOdds:null,fullOddsFetchedAt:keepFullOdds?prevAt:null,fullOddsSource:keepFullOdds?'ENGINE_REFEREE':null});"""
          assert old in s, 'engine board row anchor not found'
          s = s.replace(old, new, 1)

          old = """        const f=item.fixture,id=String(f.fixtureId);let root=null;try{root=await fetchFullOdds(id,this.env);refereeRequests++}catch(e){refereeErrors.push({fixtureId:id,error:String(e?.message||e)});const b=board.find(x=>String(x.fixtureId)===id);if(b)for(const c of item.candidates)b.analysis[c.market]={state:'PRICE_REFEREE_ERROR'};continue}
        const grouped=new Map();"""
          new = """        const f=item.fixture,id=String(f.fixtureId);let root=null;try{root=await fetchFullOdds(id,this.env);refereeRequests++}catch(e){refereeErrors.push({fixtureId:id,error:String(e?.message||e)});const b=board.find(x=>String(x.fixtureId)===id);if(b)for(const c of item.candidates)b.analysis[c.market]={state:'PRICE_REFEREE_ERROR'};continue}
        const fullOddsBoardRow=board.find(x=>String(x.fixtureId)===id);if(fullOddsBoardRow){fullOddsBoardRow.fullOdds=clone(root);fullOddsBoardRow.fullOddsFetchedAt=now();fullOddsBoardRow.fullOddsSource='ENGINE_REFEREE'}
        const grouped=new Map();"""
          assert old in s, 'engine Full Odds anchor not found'
          s = s.replace(old, new, 1)
          engine.write_text(s)

          board = Path('nomad-live-343/bet365-board.js')
          s = board.read_text()
          old = """function oddsPanel(f,snapshot,signalRows=[]){
  const root=oddsRoot(f?.providerOdds??f?.odds),state=classify(f),title=state==='live'?'BET365 · LIVE MARKETS':state==='scheduled'?'BET365 · PRE-MATCH MARKETS':'BET365 · MARKET SNAPSHOT';
  const age=Math.max(0,Math.round(Number(snapshot?.hubAgeMs||0)/1000)),sub=`${teamName(f,'home')} vs ${teamName(f,'away')} · bulk feed${Number.isFinite(age)?` · ${age}s`:''}`,signalHtml=signalEntries(signalRows,f);"""
          new = """function oddsPanel(f,snapshot,signalRows=[]){
  const fullRoot=oddsRoot(f?.fullOdds),root=fullRoot||oddsRoot(f?.providerOdds??f?.odds),state=classify(f),title=state==='live'?'BET365 · LIVE MARKETS':state==='scheduled'?'BET365 · PRE-MATCH MARKETS':'BET365 · MARKET SNAPSHOT';
  const fetchedAt=num(f?.fullOddsFetchedAt),age=fullRoot?(fetchedAt===null?null:Math.max(0,Math.round((Date.now()-fetchedAt)/1000))):Math.max(0,Math.round(Number(snapshot?.hubAgeMs||0)/1000)),source=fullRoot?'full odds · engine referee':'bulk feed',sub=`${teamName(f,'home')} vs ${teamName(f,'away')} · ${source}${age===null||!Number.isFinite(age)?'':` · ${age}s`}`,signalHtml=signalEntries(signalRows,f);"""
          assert old in s, 'Live market oddsPanel anchor not found'
          s = s.replace(old, new, 1)
          s = s.replace('Bulk odds unavailable for this fixture', 'Odds unavailable for this fixture')
          board.write_text(s)
          PY

          node --check workers/nomadtips3-engine-343/src/index.js
          node --check nomad-live-343/bet365-board.js
          grep -Fq "const VERSION='nomad343-engine-v3-settlement-safe'" workers/nomadtips3-engine-343/src/index.js
          grep -Fq "const VERSION='343-bet365-board-v4-market-language'" nomad-live-343/bet365-board.js
          grep -Fq 'SOURCE RAW HOME LINE' nomad-live-343/bet365-board.js
          grep -Fq 'fullOddsBoardRow.fullOdds=clone(root)' workers/nomadtips3-engine-343/src/index.js
          grep -Fq "fullRoot=oddsRoot(f?.fullOdds)" nomad-live-343/bet365-board.js

      - name: Commit isolated patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nomad343-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add workers/nomadtips3-engine-343/src/index.js nomad-live-343/bet365-board.js
          git rm .github/workflows/patch-343-full-odds.yml
          git commit -m '3.43: expose referee full odds on live market cards'
          git push origin HEAD:work/nomad343-clean-bet365-ui
