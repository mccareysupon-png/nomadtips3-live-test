name: Verify 3.43 Production Central Prime

on:
  push:
    branches: [work/nomad343-server-prewarm-20260914]
    paths:
      - '.github/workflows/verify-343-production-central-prime.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CENTRAL_PROD_URL: https://nomadtips3-343-central-cache.mccarey-supon.workers.dev
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}

jobs:
  prime-production-central:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for protected production endpoint
        run: |
          set -euo pipefail
          test -n "$FIVEDOLLAR_API_KEY"
          ready=0
          for n in $(seq 1 30); do
            code=$(curl -sS -o /tmp/unauth.json -w '%{http_code}' -X POST "$CENTRAL_PROD_URL/scheduler-tick" || true)
            if [ "$code" = "403" ]; then ready=1; break; fi
            sleep 5
          done
          test "$ready" = "1"

      - name: Prime production scheduler now
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-all-errors --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer $FIVEDOLLAR_API_KEY" \
            "$CENTRAL_PROD_URL/scheduler-tick" -o /tmp/tick.json
          node - <<'NODE'
          const j=require('/tmp/tick.json');
          if(j.ok!==true) throw Error(j.error||'PROD_TICK_FAILED');
          if(Number(j.providerCalls||0)>18) throw Error('PROD_RATE_GUARD_EXCEEDED');
          console.log('PROD TICK', {active:j.activeFixtures,due:j.dueFixtures,selected:j.selectedFixtures,providerCalls:j.providerCalls});
          NODE

      - name: Verify production cache is populated
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-all-errors --retry-delay 2 "$CENTRAL_PROD_URL/cache-snapshot" -o /tmp/cache.json
          node - <<'NODE'
          const j=require('/tmp/cache.json');
          if(j.ok!==true) throw Error('PROD_CACHE_NOT_OK');
          if(!j.lastTick) throw Error('PROD_LAST_TICK_MISSING');
          if(Number(j.fixtureCount||0)<=0) throw Error('PROD_CACHE_EMPTY');
          if(Number(j.providerCallsTriggeredByViewer||0)!==0) throw Error('VIEWER_PROVIDER_CALLS_NOT_ZERO');
          console.log('PROD CENTRAL READY', {fixtureCount:j.fixtureCount,lastTick:true,viewerProviderCalls:j.providerCallsTriggeredByViewer});
          NODE
