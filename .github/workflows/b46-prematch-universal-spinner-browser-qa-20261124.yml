name: BALL46 TEST universal spinner real browser QA all viewports 20261124
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-prematch-universal-spinner-browser-qa-20261124.yml]
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install isolated Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Verify first-paint spinner and data-ready transition on 4 viewport sizes and 5 pages
        run: node qa/prematch-history-20261120/b46-prematch-spinner-browser-qa-test-20261124.mjs
