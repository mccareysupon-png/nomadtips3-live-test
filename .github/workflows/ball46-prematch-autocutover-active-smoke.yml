name: BALL46 verify armed London cutoff cargo Bot and 1X2 monitor in test
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-prematch-autocutover-active-smoke.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import crypto from 'node:crypto';
          const acct=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          const n='ball46-prematch-only-test-20261120',host='https://'+n+'.mccarey-supon.workers.dev';
          const root='https://api.cloudflare.com/client/v4/accounts/'+acct+'/workers';
          const secret=crypto.createHmac('sha256',token).update('BALL46_PREMATCH_ONLY_V1').digest('hex');
          async function req(path,method='GET'){const r=await fetch(host+path,{method,headers:{authorization:'Bearer '+secret},signal:AbortSignal.timeout(20000),cache:'no-store'});assert(r.ok,'HTTP '+path+' '+r.status);return r.json()}
          const [before,health,schedules]=await Promise.all([req('/daily-mission-state'),req('/health'),fetch(root+'/scripts/'+n+'/schedules',{headers:{authorization:'Bearer '+token}}).then(r=>r.json())]);
          assert(schedules.success&&schedules.result?.schedules?.some(x=>x.cron==='*/15 * * * *'),'REQUIRED_EXISTING_BOT_CRON_MISSING');
          assert(health.dailyMission!==undefined,'NEW_DURABLE_OBJECT_CODE_NOT_ACTIVE');
          assert(before.history.maxRounds===5&&before.history.maxPerRound===100&&before.history.maxPerDay===500,'LIMIT_MISSING');
          const trial=await req('/daily-mission','POST');
          assert(['AWAIT_NEXT_CUTOFF','HISTORY_DELIVERED_BOT_READY','DEFERRED_HUB_CACHE','DEFERRED_HUB_STALE','HISTORY_REVIEW_REQUIRED'].includes(trial.state),'UNEXPECTED_MISSION '+trial.state);
          assert(trial.extraProviderCalls===0);
          const monitor=await req('/monitor','POST');
          assert.equal(monitor.extraProviderCalls,0);
          const after=await req('/daily-mission-state');
          assert(after.history.imported<=500&&after.history.completed<=5&&after.history.providerCalls===0);
          assert(after.feed?.providerCalls==null||after.feed.providerCalls===0);
          console.log('AUTO_CUTOVER_ARMED_VERIFIED '+JSON.stringify({cron:'*/15 * * * *',day:after.history.businessDay,cutoff:health.cutoff,missionState:trial.state,mission:after.mission?.state??null,historyCompleted:after.history.completed,historyImported:after.history.imported,upcomingFeed:after.feed?.stats??null,botRanAfterHistory:after.bot?.checkedAt??null,ledger:monitor.ledger,extraProviderCalls:0,scheduleUsesExistingHub:true}));
          JS
