name: Test 3.42 Price Module

on:
  push:
    branches: [main]
    paths:
      - 'nomad-live-342/runtime-config.js'
      - 'nomad-live-342/event-config.js'
      - 'nomad-live-342/fivedollar-live.js'
      - 'nomad-live-342/ui-5dollar-source.js'
      - 'nomad-live-342/app.js'
      - 'nomad-live-342/settings.html'
      - 'nomad-live-342/health.html'
      - '.github/workflows/test-342-5dollar-price.yml'
  pull_request:
    paths:
      - 'nomad-live-342/runtime-config.js'
      - 'nomad-live-342/event-config.js'
      - 'nomad-live-342/fivedollar-live.js'
      - 'nomad-live-342/ui-5dollar-source.js'
      - 'nomad-live-342/app.js'
      - 'nomad-live-342/settings.html'
      - 'nomad-live-342/health.html'
      - '.github/workflows/test-342-5dollar-price.yml'

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check nomad-live-342/runtime-config.js
          node --check nomad-live-342/event-config.js
          node --check nomad-live-342/fivedollar-live.js
          node --check nomad-live-342/ui-5dollar-source.js
          node --check nomad-live-342/app.js
      - name: Price module contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const runtime = fs.readFileSync('nomad-live-342/runtime-config.js','utf8');
          const live = fs.readFileSync('nomad-live-342/fivedollar-live.js','utf8');
          const settings = fs.readFileSync('nomad-live-342/settings.html','utf8');
          const health = fs.readFileSync('nomad-live-342/health.html','utf8');
          assert(runtime.includes('nomadtips3-live-engine-5dollar'), 'runtime must retain the optional 5Dollar adapter endpoint');
          assert(live.includes("source:'5DollarFootballAPI'"), 'price evaluator must identify 5Dollar provider');
          assert(live.includes("bookmaker:'Bet365'"), 'price evaluator must identify Bet365 bookmaker');
          assert(settings.includes('5DollarFootballAPI') && settings.includes('Bet365'), 'settings must retain the inactive price-module controls');
          assert(health.includes('5DollarFootballAPI') && health.includes('Bet365'), 'health must retain price-module diagnostics');
          assert(!settings.includes('bet365-observer.js'), 'settings must not load browser Bet365 observer');
          assert(!health.includes('bet365-observer.js'), 'health must not load browser Bet365 observer');
          console.log('3.42 optional price module contract OK');
          NODE
