name: Test 3.42 5Dollar price path

on:
  push:
    branches: [main]
    paths:
      - 'nomad-live-342/**'
      - '.github/workflows/test-342-5dollar-price.yml'
  pull_request:
    paths:
      - 'nomad-live-342/**'
      - '.github/workflows/test-342-5dollar-price.yml'

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check nomad-live-342/runtime-config.js
          node --check nomad-live-342/fivedollar-live.js
          node --check nomad-live-342/ui-5dollar-source.js
          node --check nomad-live-342/app.js
      - name: Active source contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const index = fs.readFileSync('nomad-live-342/index.html','utf8');
          const runtime = fs.readFileSync('nomad-live-342/runtime-config.js','utf8');
          const live = fs.readFileSync('nomad-live-342/fivedollar-live.js','utf8');
          const settings = fs.readFileSync('nomad-live-342/settings.html','utf8');
          const health = fs.readFileSync('nomad-live-342/health.html','utf8');
          assert(index.includes('fivedollar-live.js'), 'active Live page must load fivedollar-live.js');
          assert(!index.includes('m88-observer.js'), 'active Live page must not load M88 observer');
          assert(!index.includes('bet365-observer.js'), 'active Live page must not load browser Bet365 observer');
          assert(!index.includes('totalcorner-live.js'), 'active Live page must not load old browser-referee evaluator');
          assert(runtime.includes('nomadtips3-live-engine-5dollar'), 'runtime must point to 5Dollar adapter');
          assert(live.includes("source:'5DollarFootballAPI'"), 'live evaluator must identify 5Dollar provider');
          assert(live.includes("bookmaker:'Bet365'"), 'live evaluator must identify Bet365 bookmaker');
          assert(settings.includes('5DollarFootballAPI') && settings.includes('Bet365'), 'settings must show provider and bookmaker');
          assert(!settings.includes('bet365-observer.js'), 'settings must not load browser Bet365 observer');
          assert(!health.includes('bet365-observer.js'), 'health must not load browser Bet365 observer');
          console.log('3.42 5Dollar / Bet365 active contract OK');
          NODE
