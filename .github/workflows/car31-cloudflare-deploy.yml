name: Deploy CAR 3.1 Goaloo Shadow

on:
  push:
    branches: [main]
    paths:
      - "car3-1-hybrid-live-engine/worker/**"
      - ".github/workflows/car31-cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-and-start:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate CAR 3.1 source code
        working-directory: car3-1-hybrid-live-engine
        run: |
          node --test
          node --check worker/src/index.js
          node --check web/app.js
          node --check web/settings.js

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy CAR 3.1 worker and every-minute Cron
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: car3-1-hybrid-live-engine/worker
          wranglerVersion: "4"
          command: deploy

      - name: Start first wheel immediately
        id: first_scan
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL" || { echo "::error::Deployment URL unavailable"; exit 1; }
          echo "Worker: $DEPLOYMENT_URL"
          curl -fsS -X POST "$DEPLOYMENT_URL/scan" -o /tmp/car31-first-scan.json || true
          cat /tmp/car31-first-scan.json || true
          sleep 5
          curl -fsS "$DEPLOYMENT_URL/health" -o /tmp/car31-health.json
          cat /tmp/car31-health.json

      - name: Publish browser runtime endpoint and deploy status
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          NOW=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          python - <<'PY'
          import json, os
          from pathlib import Path
          url = os.environ['DEPLOYMENT_URL'].rstrip('/')
          now = os.popen("date -u '+%Y-%m-%dT%H:%M:%SZ'").read().strip()
          runtime = {
            'engine':'CAR 3.1',
            'mode':'SHADOW',
            'source':'GOALOO_ONLY',
            'workerUrl':url,
            'liveUrl':url + '/live',
            'healthUrl':url + '/health',
            'updatedAt':now
          }
          Path('car3-1-hybrid-live-engine/web/runtime.json').write_text(json.dumps(runtime, indent=2) + '\n', encoding='utf-8')
          health = Path('/tmp/car31-health.json').read_text(encoding='utf-8') if Path('/tmp/car31-health.json').exists() else '{}'
          first = Path('/tmp/car31-first-scan.json').read_text(encoding='utf-8') if Path('/tmp/car31-first-scan.json').exists() else '{}'
          Path('car3-1-hybrid-live-engine/DEPLOY_STATUS.md').write_text(
            '# CAR 3.1 — Last Deploy Status\n\n'
            f'- Commit: {os.environ.get("GITHUB_SHA", "unknown")}\n'
            f'- UTC: {now}\n'
            f'- Worker: {url}\n'
            '- Source mode: GOALOO ONLY\n'
            '- API-Football: OFF\n'
            '- Cron: every minute\n\n'
            '## Health\n```json\n' + health + '\n```\n\n'
            '## First scan\n```json\n' + first[:12000] + '\n```\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add car3-1-hybrid-live-engine/web/runtime.json car3-1-hybrid-live-engine/DEPLOY_STATUS.md
          git commit -m "Publish CAR 3.1 live runtime endpoint" || exit 0
          git push
