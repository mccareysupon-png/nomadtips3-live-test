name: Deploy CAR 3.1 Goaloo Shadow

on:
  push:
    branches: [main]
    paths:
      - "car3-1-hybrid-live-engine/worker/**"
      - ".github/workflows/car31-cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-and-start:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate CAR 3.1 source code
        working-directory: car3-1-hybrid-live-engine
        run: |
          node --test
          node --check worker/src/index.js
          node --check web/app.js
          node --check web/settings.js

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy CAR 3.1 worker and every-minute Cron
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: car3-1-hybrid-live-engine/worker
          wranglerVersion: "4"
          command: deploy

      - name: Inspect Goaloo public discovery pages
        shell: bash
        run: |
          UA='NOMADTIPS3-CAR3.1-Shadow/1.0 (+public research monitor)'
          for SPEC in \
            'live2|https://live2.goaloo28.com/?half=0' \
            'free|https://free.goaloo188.com/free/freesoccer?f=ft1'; do
            NAME="${SPEC%%|*}"
            URL="${SPEC#*|}"
            FILE="/tmp/goaloo-${NAME}.html"
            echo "=== SOURCE $NAME : $URL ==="
            curl -L --max-time 20 -A "$UA" -sS "$URL" -o "$FILE" || true
            echo "bytes=$(wc -c < "$FILE" 2>/dev/null || echo 0)"
            echo '-- script/src/href candidates --'
            grep -Eoi '(src|href)=["'"'][^"'"']+["'"']' "$FILE" 2>/dev/null | sed -E 's/^(src|href)=["'"']|["'"']$//g' | grep -Ei 'live|score|soccer|football|match|data|ajax|api|js' | head -80 || true
            echo '-- numeric ids >= 6 digits --'
            grep -Eo '[0-9]{6,}' "$FILE" 2>/dev/null | sort -u | head -80 || true
            echo '-- endpoint-like tokens --'
            grep -Eoi '[A-Za-z0-9_./:?=&%-]{3,}(live|score|soccer|football|match|data|ajax|api)[A-Za-z0-9_./:?=&%-]{0,120}' "$FILE" 2>/dev/null | sort -u | head -120 || true
          done

      - name: Wait for scheduled wheel and verify health
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL" || { echo "::error::Deployment URL unavailable"; exit 1; }
          echo "Worker: $DEPLOYMENT_URL"
          : > /tmp/car31-health.json
          for i in $(seq 1 8); do
            curl -fsS "$DEPLOYMENT_URL/health" -o /tmp/car31-health.json
            cat /tmp/car31-health.json
            if ! grep -q '"lastCycle": null' /tmp/car31-health.json && ! grep -q '"lastCycle":null' /tmp/car31-health.json; then
              echo "CAR 3.1 wheel has completed at least one cycle."
              exit 0
            fi
            echo "Waiting for Cron wheel... attempt $i/8"
            sleep 15
          done
          echo "::error::CAR 3.1 deployed, but no completed Cron cycle was observed within 120 seconds"
          exit 1

      - name: Show live collector state
        if: ${{ always() }}
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "CAR 3.1 Worker: ${DEPLOYMENT_URL:-unavailable}"
          if [ -n "$DEPLOYMENT_URL" ]; then
            echo "--- HEALTH ---"
            curl -fsS "$DEPLOYMENT_URL/health" || true
            echo
            echo "--- LIVE ---"
            curl -fsS "$DEPLOYMENT_URL/live" | head -c 12000 || true
            echo
          fi
