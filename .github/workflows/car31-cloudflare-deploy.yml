name: Stop CAR 3.1 Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/car31-cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  stop-car31:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete CAR 3.1 Worker and associated runtime resources
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          curl -fsS -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/nomadtips3-car31-goaloo?force=true" \
            -H "Authorization: Bearer ${CF_API_TOKEN}"
          echo "CAR 3.1 Cloudflare Worker deleted."
