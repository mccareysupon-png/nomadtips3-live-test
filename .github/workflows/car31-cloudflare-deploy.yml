name: Deploy CAR 3.1 Goaloo Shadow

on:
  push:
    branches: [main]
    paths:
      - "car3-1-hybrid-live-engine/worker/**"
      - ".github/workflows/car31-cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-and-start:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate CAR 3.1 source code
        working-directory: car3-1-hybrid-live-engine
        run: |
          node --test
          node --check worker/src/index.js
          node --check web/app.js
          node --check web/settings.js

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy CAR 3.1 worker and every-minute Cron
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: car3-1-hybrid-live-engine/worker
          wranglerVersion: "4"
          command: deploy

      - name: Inspect Goaloo dynamic live feeds
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          urls = {
            'bf_us': 'https://live10.goaloo28.com/gf/data/bf_us.js',
            'bf_us1': 'https://live10.goaloo28.com/gf/data/bf_us1.js',
            'liveScore': 'https://live10.goaloo28.com/scripts/liveScore?v=l3DOxOCERrCvTal5BZfuZkIbuUDlQZVJB5ATblxZJI81',
            'freeSoccer': 'https://free.goaloo188.com/scripts/freesoccer?v=rirfjjjnd2u14HR04tN77b7HUbpXoevRI3VPnhWwIgE1'
          }
          headers={'User-Agent':'NOMADTIPS3-CAR3.1-Shadow/1.0 (+public research monitor)','Accept':'*/*'}
          for name,url in urls.items():
            print(f'=== {name} {url} ===')
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r: raw=r.read()
            except Exception as exc:
              print('FETCH_ERROR',repr(exc)); continue
            text=raw.decode('utf-8','replace')
            print('bytes=',len(raw),'lines=',len(text.splitlines()))
            print('--- first 7000 chars ---')
            print(text[:7000])
            print('--- likely match arrays/records ---')
            for pat in [r'\b(?:A|B|C|D|E)\s*=\s*new Array\([\s\S]{0,3000}', r'\b(?:A|B|C|D|E)\s*=\s*\[[\s\S]{0,3000}', r'\b\w+\[\d+\]\s*=\s*["\'][^"\']{0,2000}']:
              m=re.search(pat,text,re.I)
              if m: print(m.group(0)[:3000])
            print('--- URL/endpoint tokens ---')
            tokens=sorted(set(re.findall(r'https?://[^\"\'\s]+|/[A-Za-z0-9_./?=&%+-]{3,}',text)))
            for token in [t for t in tokens if re.search(r'live|score|match|detail|tech|stat|odds|data|ajax|api|\.js',t,re.I)][:140]: print(token[:300])
          PY

      - name: Wait for scheduled wheel and verify health
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL" || { echo "::error::Deployment URL unavailable"; exit 1; }
          echo "Worker: $DEPLOYMENT_URL"
          : > /tmp/car31-health.json
          for i in $(seq 1 8); do
            curl -fsS "$DEPLOYMENT_URL/health" -o /tmp/car31-health.json
            cat /tmp/car31-health.json
            if ! grep -q '"lastCycle": null' /tmp/car31-health.json && ! grep -q '"lastCycle":null' /tmp/car31-health.json; then
              echo "CAR 3.1 wheel has completed at least one cycle."
              exit 0
            fi
            sleep 15
          done
          echo "::error::CAR 3.1 deployed, but no completed Cron cycle was observed within 120 seconds"
          exit 1

      - name: Show live collector state
        if: ${{ always() }}
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "CAR 3.1 Worker: ${DEPLOYMENT_URL:-unavailable}"
          if [ -n "$DEPLOYMENT_URL" ]; then
            echo "--- HEALTH ---"
            curl -fsS "$DEPLOYMENT_URL/health" || true
            echo
            echo "--- LIVE ---"
            curl -fsS "$DEPLOYMENT_URL/live" | head -c 12000 || true
            echo
          fi
