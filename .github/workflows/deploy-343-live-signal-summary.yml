name: Deploy 3.43 Live Signal Summary
on:
  push:
    branches:
      - work/nomad343-live-signal-summary-20260914
    paths:
      - .github/workflows/deploy-343-live-signal-summary.yml
jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CANARY_URL: https://nomadtips3-343-stable-preview.mccarey-supon.workers.dev
      PROD_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev
      ACTIVE_BRANCH: work/nomad343-server-prewarm-20260914
      ROLLBACK_REF: backup/pre-343-live-signal-summary-20260914
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nomad343-live-signal-summary-20260914
          fetch-depth: 30
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify rollback point
        run: |
          set -euo pipefail
          git fetch origin "$ROLLBACK_REF" --depth=1
          git rev-parse "origin/$ROLLBACK_REF"
      - name: Apply isolated Live card patch
        run: |
          set -euo pipefail
          python .github/scripts/patch-343-live-signal-summary.py
          changed="$(git diff --name-only)"
          echo "$changed"
          printf '%s\n' "$changed" | sort >/tmp/changed.txt
          printf '%s\n' nomad-live-343/index.html nomad-live-343/live-stable-343.css nomad-live-343/live-stable-343.js | sort >/tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Verify source invariants
        run: |
          set -euo pipefail
          node --check nomad-live-343/live-stable-343.js
          grep -Fq 'HOME ·' .github/scripts/test-343-live-signal-summary.js
          grep -Fq 'signal-lock-summary' nomad-live-343/live-stable-343.css
          grep -Fq 'lockedSignalDetails' nomad-live-343/live-stable-343.js
          grep -Fq '343-live-signal-summary-v1' nomad-live-343/index.html
          git diff --quiet -- workers/nomadtips3-engine-343 workers/nomadtips3-5usd-hub-343 workers/nomadtips3-343-full-market-central
      - name: Dry run viewers
        run: |
          set -euo pipefail
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.stable.jsonc)
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc)
      - name: Install browser test
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Commit isolated runtime patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nomad-live-343/index.html nomad-live-343/live-stable-343.css nomad-live-343/live-stable-343.js
          git commit -m "feat(343): show locked signal summary on default live card"
          git push origin HEAD:work/nomad343-live-signal-summary-20260914
      - name: Deploy canary viewer
        run: |
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.stable.jsonc
      - name: Wait for canary assets
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            html="$(curl -fsS "$CANARY_URL/index.html?asset=$RANDOM$(date +%s)" || true)"
            if grep -Fq '343-live-signal-summary-v1' <<<"$html"; then echo "CANARY ASSETS READY attempt=$i"; exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify canary default card summary
        run: TARGET_URL="$CANARY_URL" node .github/scripts/test-343-live-signal-summary.js
      - name: Deploy production viewer
        id: prod_deploy
        run: |
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc
      - name: Wait for production assets
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            html="$(curl -fsS "$PROD_URL/index.html?asset=$RANDOM$(date +%s)" || true)"
            if grep -Fq '343-live-signal-summary-v1' <<<"$html"; then echo "PRODUCTION ASSETS READY attempt=$i"; exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify production default card summary
        run: TARGET_URL="$PROD_URL" node .github/scripts/test-343-live-signal-summary.js
      - name: Promote verified commit to active branch
        run: |
          set -euo pipefail
          git fetch origin "$ACTIVE_BRANCH" --depth=1
          git merge-base --is-ancestor "origin/$ACTIVE_BRANCH" HEAD || { echo ACTIVE_BRANCH_MOVED_OR_DIVERGED; exit 1; }
          git push origin HEAD:"$ACTIVE_BRANCH"
      - name: Roll back production viewer if verification failed after deploy
        if: failure() && steps.prod_deploy.outcome == 'success'
        run: |
          set -euo pipefail
          git fetch origin "$ROLLBACK_REF" --depth=1
          git checkout --detach "origin/$ROLLBACK_REF"
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc
