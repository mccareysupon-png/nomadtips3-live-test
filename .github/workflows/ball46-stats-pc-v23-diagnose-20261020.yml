name: BALL46 Statistics PC V2.3 Rollback and HTML Diagnostic
on:
  push:
    branches: [codex/ball46-stats-pc-v23-guarded-production-20261020]
    paths:
      - '.github/workflows/ball46-stats-pc-v23-diagnose-20261020.yml'
      - 'deploy-assets/stats-pc-v2-preview-20261020/diagnose-production-v23.mjs'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only verification of active production version and HTML
        working-directory: deploy-assets/stats-pc-v2-preview-20261020
        run: node diagnose-production-v23.mjs
