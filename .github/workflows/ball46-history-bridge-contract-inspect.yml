name: BALL46 inspect central history gateway contract for 5 daily rounds
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-history-bridge-contract-inspect.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers',headers={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          for(const n of ['nomadtips3-5usd-hub-343','nomadtips3-engine-343']){
            const d=await(await fetch(base+'/scripts/'+n+'/deployments?per_page=1',{headers})).json();
            const v=await(await fetch(base+'/workers/'+n+'/versions/'+d.result.deployments[0].versions[0].version_id+'?include=modules',{headers})).json();
            for(const module of v.result.modules||[]){
              const code=Buffer.from(module.content_base64||'','base64').toString();
              if(module.name==='history-gateway.mjs'||module.name==='provider-bridge.mjs'||module.name==='central-actor.mjs'){
                console.log('HISTORY_BRIDGE_MODULE '+JSON.stringify({worker:n,module:module.name,content:code.slice(0,9000)}));
              }else if(module.name==='index-viewer-safe.js'){
                const lines=code.split('\n');let hit=[];
                for(let i=0;i<lines.length;i++)if(/history|prematch|provider\/v1|quota|permit|_internal|bridge/i.test(lines[i])&&/history|prematch|provider\/v1|bridge/i.test(lines[i]))hit.push({line:i+1,content:lines.slice(Math.max(0,i-2),Math.min(lines.length,i+4)).join('\n').slice(0,900)});
                console.log('HUB_HISTORY_ROUTES '+JSON.stringify({worker:n,total:hit.length,excerpts:hit.slice(0,45)}));
              }
            }
          }
          JS
