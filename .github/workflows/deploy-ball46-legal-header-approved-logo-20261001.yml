name: DEPLOY Ball46 legal header approved logo 20261001

on:
  push:
    branches: [ops/ball46-footer-links-20261001]
    paths:
      - '.github/workflows/deploy-ball46-legal-header-approved-logo-20261001.yml'

permissions:
  contents: read

env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  BALL46_URL: https://ball46.com

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ball46-footer-links-20261001
          fetch-depth: 1

      - name: Patch exactly 11 legal-page headers with approved desktop/mobile images
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          mkdir -p /tmp/modules /tmp/before /tmp/after

          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=3" -H "$AUTH" -o /tmp/deploy-before.json
          BASE=$(node -e "const j=require('/tmp/deploy-before.json');const d=j.result?.deployments?.[0];if(!d||d.versions?.length!==1||Number(d.versions[0].percentage)!==100)process.exit(2);process.stdout.write(String(d.versions[0].version_id||''))")
          [ -n "$BASE" ] || exit 2
          echo -n "$BASE" >/tmp/base-version

          K="${GITHUB_RUN_ID}-$(date +%s%N)"
          curl -fsS "$BALL46_URL/api/engine/health?before=$K" -o /tmp/before/e.json
          curl -fsS "$BALL46_URL/api/full-market/health?before=$K" -o /tmp/before/f.json
          curl -fsS "$BALL46_URL/api/engine/statistics?before=$K" -o /tmp/before/s.json
          node - <<'NODE'
          const fs=require('fs');const e=require('/tmp/before/e.json'),f=require('/tmp/before/f.json'),s=require('/tmp/before/s.json');if(e.ok!==true||f.ok!==true||s.ok!==true)throw Error('BACKEND_NOT_OK_BEFORE');fs.writeFileSync('/tmp/backend-before.json',JSON.stringify({engine:e.version,fullMarket:f.version,settlementRevision:s.settlementRevision}));
          NODE

          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/workers/$SCRIPT_NAME/versions/$BASE?include=modules" -H "$AUTH" -o /tmp/version.json
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const j=require('/tmp/version.json');if(j.success!==true)throw Error('VERSION_FETCH_FAILED');const r=j.result;if(!r?.main_module||!r.modules?.length)throw Error('MODULES_MISSING');
          const meta=[];for(const m of r.modules){const b=Buffer.from(m.content_base64,'base64'),p=path.join('/tmp/modules',m.name);fs.mkdirSync(path.dirname(p),{recursive:true});fs.writeFileSync(p,b);meta.push({name:m.name,content_type:m.content_type,beforeSha:crypto.createHash('sha256').update(b).digest('hex')});}
          const main=r.main_module,p=path.join('/tmp/modules',main),orig=fs.readFileSync(p,'utf8');
          const legalStart=orig.indexOf('const __B46_LEGAL_PAGES__='),legalCssStart=orig.indexOf('const __B46_LEGAL_CSS_20261001__=',legalStart),footerHtmlStart=orig.indexOf('const __B46_FOOTER_HTML__=',legalCssStart);if([legalStart,legalCssStart,footerHtmlStart].some(x=>x<0))throw Error('ANCHORS_MISSING');
          let legalPages=orig.slice(legalStart,legalCssStart);
          const old='<a class=\\"brand\\" href=\\"information.html\\"><div class=\\"mark\\">BALL<b>46</b></div><div class=\\"brand-copy\\"><strong>BALL46</strong><small>Live signals • transparent records</small></div></a>';
          const replacement='<a class=\\"brand b46-approved-header-brand\\" href=\\"information.html\\"><span class=\\"b46-header-logo-image\\" role=\\"img\\" aria-label=\\"ball46\\"></span><small class=\\"b46-header-tagline\\">Live signals • transparent records</small></a>';
          const count=legalPages.split(old).length-1;if(count!==11)throw Error('LEGAL_HEADER_SLOT_COUNT:'+count);
          legalPages=legalPages.split(old).join(replacement);

          const cssSeg=orig.slice(legalCssStart,footerHtmlStart),marker='const __B46_LEGAL_CSS_20261001__=',raw=cssSeg.slice(marker.length).trim().replace(/;$/,'');let css=JSON.parse(raw);if(css.includes('B46_APPROVED_HEADER_LOGO_20261001'))throw Error('HEADER_PATCH_ALREADY_PRESENT');
          const word=fs.readFileSync('assets/ball46-footer-wordmark.webp').toString('base64'),icon=fs.readFileSync('assets/ball46-footer-icon.webp').toString('base64');
          const add='/* B46_APPROVED_HEADER_LOGO_20261001 */.b46-approved-header-brand{display:flex!important;flex-direction:column!important;align-items:flex-start!important;justify-content:center!important;gap:2px!important;text-decoration:none!important;min-width:0!important}.b46-header-logo-image{display:block!important;width:126px!important;height:38px!important;background-image:url("data:image/webp;base64,'+word+'")!important;background-size:contain!important;background-repeat:no-repeat!important;background-position:left center!important;flex:none!important}.b46-header-tagline{display:block!important;margin:0!important;color:var(--muted)!important;font-size:11px!important;line-height:1.2!important;white-space:nowrap!important}@media(max-width:640px){.b46-approved-header-brand{flex-direction:row!important;align-items:center!important;gap:10px!important}.b46-header-logo-image{width:46px!important;height:46px!important;border-radius:12px!important;background-image:url("data:image/webp;base64,'+icon+'")!important;background-position:center!important}.b46-header-tagline{font-size:10px!important;white-space:normal!important;max-width:150px!important}}';
          css+=add;const legalCss=marker+JSON.stringify(css)+';\n';const patched=orig.slice(0,legalStart)+legalPages+legalCss+orig.slice(footerHtmlStart);
          if(patched.slice(0,legalStart)!==orig.slice(0,legalStart)||patched.slice(patched.indexOf('const __B46_FOOTER_HTML__='))!==orig.slice(footerHtmlStart))throw Error('OUTSIDE_LEGAL_SCOPE_CHANGED');
          fs.writeFileSync(p,patched);fs.writeFileSync('/tmp/main',main);fs.writeFileSync('/tmp/meta.json',JSON.stringify(meta));fs.writeFileSync('/tmp/main-after.sha',crypto.createHash('sha256').update(Buffer.from(patched)).digest('hex'));console.log('PATCH_READY headers=11');
          NODE

          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/recheck.json
          CUR=$(node -e "const j=require('/tmp/recheck.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))")
          [ "$CUR" = "$BASE" ] || { echo "ABORT_CONCURRENT_DEPLOY:$CUR";exit 4; }

          node -e "const fs=require('fs');fs.writeFileSync('/tmp/upload-meta.json',JSON.stringify({main_module:fs.readFileSync('/tmp/main','utf8').trim()}))"
          mapfile -t args < <(node - <<'NODE'
          const fs=require('fs');for(const m of JSON.parse(fs.readFileSync('/tmp/meta.json','utf8')))console.log(`-F\n${m.name}=@/tmp/modules/${m.name};type=${m.content_type}`);
          NODE
          )
          CURL_ARGS=();i=0;while [ $i -lt ${#args[@]} ];do CURL_ARGS+=("${args[$i]}" "${args[$((i+1))]}");i=$((i+2));done
          curl -fsS -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/content" -H "$AUTH" -F 'metadata=</tmp/upload-meta.json;type=application/json' "${CURL_ARGS[@]}" -o /tmp/update.json
          node -e "const j=require('/tmp/update.json');if(j.success!==true)throw Error(JSON.stringify(j.errors||[]));console.log('UPLOAD_ACCEPTED')"

          rollback(){ set +e;[ -s /tmp/our-version ]||return;OUR=$(cat /tmp/our-version);curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/current.json||return;NOW=$(node -e "const j=require('/tmp/current.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))");[ "$NOW" = "$OUR" ]||return;node -e "require('fs').writeFileSync('/tmp/rb.json',JSON.stringify({strategy:'percentage',versions:[{version_id:process.argv[1],percentage:100}],annotations:{'workers/message':'Rollback approved legal-header logo verification failure'}}))" "$BASE";curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments" -H "$AUTH" -H 'content-type: application/json' --data-binary @/tmp/rb.json >/tmp/rb-resp.json||true;echo ROLLBACK_TO:$BASE; }
          trap 'rc=$?;rollback;exit $rc' ERR

          CAND='';for n in $(seq 1 20);do curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/d.json;CAND=$(node -e "const j=require('/tmp/d.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))");[ -n "$CAND" ]&&[ "$CAND" != "$BASE" ]&&break;sleep 2;done;[ -n "$CAND" ]&&[ "$CAND" != "$BASE" ];echo -n "$CAND" >/tmp/our-version

          pages='information about user-guide methodology privacy terms disclaimer affiliate-disclosure responsible-gambling cookies contact'
          for p in $pages; do
            ok=0
            for n in $(seq 1 30); do
              Q="${GITHUB_RUN_ID}-$p-$n-$(date +%s%N)"
              curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/$p.html?after=$Q" -o "/tmp/after/$p.html"
              curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/legal.css?after=$Q" -o "/tmp/after/legal-$p.css"
              if grep -Fq 'class="brand b46-approved-header-brand"' "/tmp/after/$p.html" && grep -Fq 'class="b46-header-logo-image" role="img" aria-label="ball46"' "/tmp/after/$p.html" && ! grep -Fq '<div class="mark">BALL<b>46</b></div>' "/tmp/after/$p.html" && ! grep -Fq '<strong>BALL46</strong>' "/tmp/after/$p.html" && grep -Fq 'B46_APPROVED_HEADER_LOGO_20261001' "/tmp/after/legal-$p.css" && grep -Fq 'data:image/webp;base64,' "/tmp/after/legal-$p.css"; then ok=1;break; fi
              sleep 2
            done
            [ "$ok" = 1 ] || { echo "EDGE_TIMEOUT:$p";false; }
            echo "HEADER_PAGE_PASS:$p"
          done

          curl -fsS "$BALL46_URL/api/engine/health?after=${GITHUB_RUN_ID}" -o /tmp/after/e.json
          curl -fsS "$BALL46_URL/api/full-market/health?after=${GITHUB_RUN_ID}" -o /tmp/after/f.json
          curl -fsS "$BALL46_URL/api/engine/statistics?after=${GITHUB_RUN_ID}" -o /tmp/after/s.json
          node - <<'NODE'
          const fs=require('fs');const b=require('/tmp/backend-before.json'),e=require('/tmp/after/e.json'),f=require('/tmp/after/f.json'),s=require('/tmp/after/s.json'),a={engine:e.version,fullMarket:f.version,settlementRevision:s.settlementRevision};if(JSON.stringify(a)!==JSON.stringify(b))throw Error('BACKEND_CHANGED');console.log('VERIFY_APPROVED_LEGAL_HEADER_PASS',a);fs.writeFileSync('/tmp/final-version',fs.readFileSync('/tmp/our-version'));
          NODE
          OUR=$(cat /tmp/our-version);curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/final.json;FINAL=$(node -e "const j=require('/tmp/final.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))");[ "$FINAL" = "$OUR" ]||false
          trap - ERR
