name: BALL46 Pre-Match real cutoff schedule audit
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-prematch-cutoff-schedule-audit-20261121.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read Cloudflare cron schedule and test-selection state without any upstream request
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          import crypto from 'node:crypto';
          const n='ball46-prematch-only-test-20261120',acct=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          const root='https://api.cloudflare.com/client/v4/accounts/'+acct+'/workers/scripts/'+n;
          const r=await fetch(root+'/schedules',{headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(12000)});
          let j=null;try{j=await r.json()}catch{}
          console.log('PREMATCH_SCHEDULE_AUDIT '+JSON.stringify({status:r.status,cron:j?.result?.schedules??j?.result??null,errors:j?.errors?.map(e=>e.message)}));
          const secret=crypto.createHmac('sha256',token).update('BALL46_PREMATCH_ONLY_V1').digest('hex');
          const base='https://'+n+'.mccarey-supon.workers.dev';
          for(const p of ['/bot-state','/test-ledger']){
            const q=await fetch(base+p,{headers:{authorization:'Bearer '+secret},signal:AbortSignal.timeout(12000)});
            let v;try{v=await q.json()}catch{v={}};
            const out=p==='/bot-state'?{autoVersion:v.config?.autoVersion,config:v.config?{mode:v.config.mode,enabled:v.config.enabled}:null,feed:v.feed,lastRun:v.lastRun?{checkedAt:v.lastRun.checkedAt,qualified:v.lastRun.qualified,published:v.lastRun.published}:null,inputs:v.inputs}:{stats:v.stats,rows:v.rows?.slice(0,10).map(x=>({id:x.fixture_id,kickoff:x.kickoff,pickedAt:x.picked_at,settledAt:x.settled_at,status:x.status}))};
            console.log('PREMATCH_STATE_AUDIT '+JSON.stringify({path:p,status:q.status,...out}));
          }
          JS
