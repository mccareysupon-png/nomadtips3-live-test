name: CAR 1.1 Feed Diagnostic

on:
  push:
    branches:
      - agent/car11-goaloo-launch-20260816
    paths:
      - 'car1-1/scripts/summarize_probe.mjs'
      - '.github/workflows/car11-feed-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/car11-goaloo-launch-20260816
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build compact diagnostics
        run: node car1-1/scripts/summarize_probe.mjs
      - name: Commit diagnostics
        run: |
          git config user.name 'nomadtips3-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add car1-1/data/feed-diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'car1.1: update compact feed diagnostics'
          git push origin HEAD:agent/car11-goaloo-launch-20260816
