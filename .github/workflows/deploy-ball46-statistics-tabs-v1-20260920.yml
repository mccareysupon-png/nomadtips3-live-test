name: Deploy Ball46 Statistics Tabs V1 20260920

on:
  push:
    branches: [work/ball46-statistics-tabs-v1-20260920]
    paths:
      - '.github/workflows/deploy-ball46-statistics-tabs-v1-20260920.yml'
      - 'nomad-live-343/statistics-tabs-v1.css'
      - 'nomad-live-343/statistics-tabs-v1.js'
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_URL: https://ball46.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PATCH_CSS: statistics-tabs-v1.css
  PATCH_JS: statistics-tabs-v1.js
  PATCH_VER: 343-stat-tabs-v1-20260920a

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight current Production and backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod /tmp/before /tmp/patch
          for page in index.html signal.html statistics.html; do
            curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/$page?tabs-v1-before=$GITHUB_RUN_ID" -o "/tmp/prod/$page"
            test -s "/tmp/prod/$page"
          done
          grep -Fq 'next-page-head' /tmp/prod/statistics.html
          grep -Fq 'data-next-stat-markets' /tmp/prod/statistics.html
          grep -Fq 'Results History' /tmp/prod/statistics.html
          cp nomad-live-343/$PATCH_CSS /tmp/patch/$PATCH_CSS
          cp nomad-live-343/$PATCH_JS /tmp/patch/$PATCH_JS
          grep -Fq 'BALL46_STAT_TABS_V1' /tmp/patch/$PATCH_CSS
          grep -Fq 'BALL46_STAT_TABS_V1' /tmp/patch/$PATCH_JS
          ! grep -Eq 'fetch[[:space:]]*\(|XMLHttpRequest|/api/' /tmp/patch/$PATCH_JS
          ! grep -Eq 'fetch[[:space:]]*\(|XMLHttpRequest|/api/' /tmp/patch/$PATCH_CSS

          for ep in engine hub full-market; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/api/$ep/health?tabs-v1-before=$GITHUB_RUN_ID" -o "/tmp/before/$ep.json"
          done
          node - <<'NODE'
          const fs=require('fs'); const out={};
          for(const n of ['engine','hub','full-market']){
            const j=JSON.parse(fs.readFileSync(`/tmp/before/${n}.json`,'utf8'));
            if(j?.ok!==true) throw Error(`PREFLIGHT_${n}_FAIL`);
            out[n]={version:String(j.version||''),component:String(j.component||''),staleCachePolicy:String(j.staleCachePolicy||'')};
          }
          fs.writeFileSync('/tmp/backend-before.json',JSON.stringify(out,null,2));
          console.log('BACKEND_BEFORE',JSON.stringify(out));
          NODE

      - name: Build clean staging tree only from current Production
        shell: bash
        run: |
          set -euo pipefail
          mv nomad-live-343 /tmp/repo-assets
          mkdir -p nomad-live-343

          while IFS= read -r f; do
            name="${f#/tmp/repo-assets/}"
            [ "$name" = "$PATCH_CSS" ] && continue
            [ "$name" = "$PATCH_JS" ] && continue
            case "$name" in *.html|*.js|*.css|*.svg|*.json|*.txt|*.xml|*.png|*.webp|*.jpg|*.jpeg|*.ico|*.woff|*.woff2) ;; *) continue ;; esac
            tmp="/tmp/prod-file-${name//\//_}"
            mkdir -p "$(dirname "$tmp")"
            code=$(curl -sS -L --retry 3 --retry-all-errors --retry-delay 1 --max-time 20 -o "$tmp" -w '%{http_code}' "$BALL46_URL/$name?tabs-v1-mirror=$GITHUB_RUN_ID") || code=000
            if [ "$code" = 200 ] && [ -s "$tmp" ]; then
              mkdir -p "nomad-live-343/$(dirname "$name")"
              cp "$tmp" "nomad-live-343/$name"
            fi
          done < <(find /tmp/repo-assets -maxdepth 1 -type f | sort)

          cp /tmp/prod/index.html nomad-live-343/index.html
          cp /tmp/prod/signal.html nomad-live-343/signal.html
          cp /tmp/prod/statistics.html nomad-live-343/statistics.html

          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import re, urllib.request, urllib.parse
          root=Path('nomad-live-343')
          base='https://ball46.com/'
          pages=('index.html','signal.html','statistics.html')
          for page in pages:
              h=(root/page).read_text(errors='ignore')
              refs=re.findall(r'(?:src|href)=["\']([^"\']+)["\']',h,re.I)
              for ref in refs:
                  ref=ref.split('#',1)[0]
                  if not ref or ref.startswith(('http:','https:','//','data:','mailto:','#','/api/')):
                      continue
                  path=ref.split('?',1)[0].lstrip('/')
                  pp=PurePosixPath(path)
                  if '..' in pp.parts or not path:
                      continue
                  if not re.search(r'\.(?:css|js|svg|png|webp|jpg|jpeg|ico|woff2?)$',path,re.I):
                      continue
                  dst=root/path
                  if dst.exists():
                      continue
                  try:
                      req=urllib.request.Request(base+urllib.parse.quote(path),headers={'User-Agent':'ball46-production-mirror'})
                      data=urllib.request.urlopen(req,timeout=15).read()
                      if data:
                          dst.parent.mkdir(parents=True,exist_ok=True)
                          dst.write_bytes(data)
                          print('mirrored referenced production asset',path)
                  except Exception as e:
                      raise SystemExit(f'REQUIRED_REF_MIRROR_FAIL:{path}:{e}')
          PY

          test -s nomad-live-343/index.html
          test -s nomad-live-343/signal.html
          test -s nomad-live-343/statistics.html
          count=$(find nomad-live-343 -type f | wc -l)
          echo "PRODUCTION_MIRROR_FILES=$count"
          [ "$count" -ge 15 ]

      - name: Create RB0 Production snapshot and hashes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rb0-assets
          cp -a nomad-live-343 /tmp/rb0-assets
          (cd /tmp/rb0-assets && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/rb0-sha256.txt
          cp /tmp/backend-before.json /tmp/rb0-backend.json
          tar -C /tmp -czf /tmp/ball46-rb0-production-$GITHUB_RUN_ID.tar.gz rb0-assets rb0-sha256.txt rb0-backend.json
          echo "RB0_PRODUCTION_SNAPSHOT_CREATED run=$GITHUB_RUN_ID"

      - name: Upload RB0 rollback artifact
        uses: actions/upload-artifact@v4
        with:
          name: ball46-rb0-statistics-tabs-v1-${{ github.run_id }}
          path: /tmp/ball46-rb0-production-${{ github.run_id }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Apply Phase 1 tabs overlay only
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/patch/$PATCH_CSS nomad-live-343/$PATCH_CSS
          cp /tmp/patch/$PATCH_JS nomad-live-343/$PATCH_JS

          python3 - <<'PY'
          from pathlib import Path
          import re, os
          p=Path('nomad-live-343/statistics.html')
          s=p.read_text()
          css=os.environ['PATCH_CSS']; js=os.environ['PATCH_JS']; ver=os.environ['PATCH_VER']
          s=re.sub(r'\s*<link[^>]+href=["\'][^"\']*statistics-tabs-v1\.css[^"\']*["\'][^>]*>','',s,flags=re.I)
          s=re.sub(r'\s*<script[^>]+src=["\'][^"\']*statistics-tabs-v1\.js[^"\']*["\'][^>]*>\s*</script>','',s,flags=re.I)
          css_tag=f'\n<link rel="stylesheet" href="{css}?v={ver}" data-ball46-phase="statistics-tabs-v1">\n'
          js_tag=f'\n<script src="{js}?v={ver}" defer data-ball46-phase="statistics-tabs-v1"></script>\n'
          if '</head>' not in s.lower() or '</body>' not in s.lower():
              raise SystemExit('STATISTICS_HTML_STRUCTURE_INVALID')
          s=re.sub(r'</head>',css_tag+'</head>',s,count=1,flags=re.I)
          s=re.sub(r'</body>',js_tag+'</body>',s,count=1,flags=re.I)
          p.write_text(s)
          PY

          grep -Fq "$PATCH_CSS?v=$PATCH_VER" nomad-live-343/statistics.html
          grep -Fq "$PATCH_JS?v=$PATCH_VER" nomad-live-343/statistics.html
          grep -Fq 'BALL46_STAT_TABS_V1' nomad-live-343/$PATCH_CSS
          grep -Fq 'BALL46_STAT_TABS_V1' nomad-live-343/$PATCH_JS
          ! grep -Eq 'fetch[[:space:]]*\(|XMLHttpRequest|/api/' nomad-live-343/$PATCH_JS
          ! grep -Eq 'fetch[[:space:]]*\(|XMLHttpRequest|/api/' nomad-live-343/$PATCH_CSS

      - name: Scope guard - only Statistics loader plus two new overlay files may differ from RB0
        shell: bash
        run: |
          set -euo pipefail
          diff -qr /tmp/rb0-assets nomad-live-343 > /tmp/phase1.diff || true
          cat /tmp/phase1.diff
          [ -s /tmp/phase1.diff ]
          if grep -Ev 'statistics\.html|statistics-tabs-v1\.css|statistics-tabs-v1\.js' /tmp/phase1.diff | grep -q .; then
            echo 'UNEXPECTED_PHASE1_ASSET_DIFF'
            exit 1
          fi
          grep -Eq 'statistics\.html' /tmp/phase1.diff
          echo 'PHASE1_SCOPE_GUARD_PASS'

      - name: Guard Page 1 Page 2 and protected runtime unchanged from Production
        shell: bash
        run: |
          set -euo pipefail
          cmp -s /tmp/prod/index.html nomad-live-343/index.html || { echo PAGE1_HTML_CHANGED; exit 1; }
          cmp -s /tmp/prod/signal.html nomad-live-343/signal.html || { echo PAGE2_HTML_CHANGED; exit 1; }
          for f in signal-next.js statistics-next.js bulk-odds-compat-343.js odds-format-343.js full-market-bookmaker-343.js full-odds-main-343.js live-summary-full-odds-343.js dashboard-v2-stage3.js; do
            [ -f "nomad-live-343/$f" ] || continue
            tmp="/tmp/runtime-$f"
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_URL/$f?tabs-v1-guard=$GITHUB_RUN_ID" -o "$tmp"
            cmp -s "$tmp" "nomad-live-343/$f" || { echo "PROTECTED_RUNTIME_DIFF:$f"; exit 1; }
          done
          git diff --quiet HEAD -- workers/nomadtips3-343-preview/src/index.js
          git diff --quiet HEAD -- workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          echo 'PROTECTED_RUNTIME_GUARD_PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and dry-run validation
        shell: bash
        run: |
          set -euo pipefail
          node --check nomad-live-343/$PATCH_JS
          npx --yes wrangler@4.92.0 deploy --dry-run --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc

      - name: Deploy Phase 1
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc

      - name: Verify live tabs and backend invariants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/after
          for n in $(seq 1 15); do
            if curl -fsS -L --max-time 25 "$BALL46_URL/statistics.html?tabs-v1-after=$GITHUB_RUN_ID-$n" -o /tmp/after/statistics.html && grep -Fq "$PATCH_CSS?v=$PATCH_VER" /tmp/after/statistics.html && grep -Fq "$PATCH_JS?v=$PATCH_VER" /tmp/after/statistics.html; then break; fi
            sleep 2
          done
          grep -Fq "$PATCH_CSS?v=$PATCH_VER" /tmp/after/statistics.html
          grep -Fq "$PATCH_JS?v=$PATCH_VER" /tmp/after/statistics.html
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/$PATCH_CSS?v=$PATCH_VER" -o /tmp/after/$PATCH_CSS
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/$PATCH_JS?v=$PATCH_VER" -o /tmp/after/$PATCH_JS
          grep -Fq 'BALL46_STAT_TABS_V1' /tmp/after/$PATCH_CSS
          grep -Fq 'BALL46_STAT_TABS_V1' /tmp/after/$PATCH_JS

          curl -fsS -L --max-time 25 "$BALL46_URL/index.html?tabs-v1-page1=$GITHUB_RUN_ID" -o /tmp/after/index.html
          curl -fsS -L --max-time 25 "$BALL46_URL/signal.html?tabs-v1-page2=$GITHUB_RUN_ID" -o /tmp/after/signal.html
          cmp -s /tmp/prod/index.html /tmp/after/index.html || { echo PAGE1_POSTDEPLOY_CHANGED; exit 1; }
          cmp -s /tmp/prod/signal.html /tmp/after/signal.html || { echo PAGE2_POSTDEPLOY_CHANGED; exit 1; }

          for ep in engine hub full-market; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/api/$ep/health?tabs-v1-after=$GITHUB_RUN_ID" -o "/tmp/after/$ep.json"
          done
          node - <<'NODE'
          const fs=require('fs'); const before=JSON.parse(fs.readFileSync('/tmp/backend-before.json','utf8'));
          for(const n of ['engine','hub','full-market']){
            const j=JSON.parse(fs.readFileSync(`/tmp/after/${n}.json`,'utf8'));
            if(j?.ok!==true) throw Error(`POST_${n}_FAIL`);
            for(const k of ['version','component','staleCachePolicy']){
              const now=String(j[k]||'');
              if(before[n][k] && now!==before[n][k]) throw Error(`${n}_${k}_CHANGED`);
            }
          }
          console.log('BALL46_STAT_TABS_V1_PASS');
          NODE
