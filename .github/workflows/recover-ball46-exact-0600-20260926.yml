name: Recover Ball46 Exact 0600 20260926

on:
  push:
    branches:
      - ops/ball46-recovery-history-fullbase-20260926
    paths:
      - .github/workflows/recover-ball46-exact-0600-20260926.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_VERSION: 6dd5723a-4a01-43e5-ab57-1dcde2ac0d7c
      BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
      BALL46_PUBLIC: https://www.ball46.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preflight exact target exists
        run: |
          set -euo pipefail
          test -f workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          npx --yes wrangler@4.92.0 versions list --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc > /tmp/versions.txt
          grep -Fq "$TARGET_VERSION" /tmp/versions.txt
          echo "TARGET_EXISTS=$TARGET_VERSION"

      - name: Undo latest rollback and restore exact previous production version
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 rollback "$TARGET_VERSION" \
            --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc \
            --message "Undo latest recovery and restore Ball46 production state immediately before it" \
            --yes

      - name: Verify target is active and site continuity
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deployments list --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc > /tmp/deployments.txt
          cat /tmp/deployments.txt
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/deployments.txt').read_text(errors='ignore')
          target='6dd5723a-4a01-43e5-ab57-1dcde2ac0d7c'
          if target not in s:
              raise SystemExit('TARGET_NOT_IN_DEPLOYMENTS')
          print('TARGET_DEPLOYMENT_CONFIRMED', target)
          PY
          curl -fsS -L --retry 6 --retry-all-errors --retry-delay 2 --max-time 30 "$BALL46_WORKER/index.html?recovery=${GITHUB_RUN_ID}" -o /tmp/index.html
          test -s /tmp/index.html
          curl -fsS -L --retry 6 --retry-all-errors --retry-delay 2 --max-time 30 "$BALL46_WORKER/api/engine/board?recovery=${GITHUB_RUN_ID}" -o /tmp/board.json
          curl -fsS -L --retry 6 --retry-all-errors --retry-delay 2 --max-time 30 "$BALL46_WORKER/api/engine/signals?recovery=${GITHUB_RUN_ID}" -o /tmp/signals.json
          curl -fsS -L --retry 6 --retry-all-errors --retry-delay 2 --max-time 30 "$BALL46_WORKER/api/engine/statistics?recovery=${GITHUB_RUN_ID}" -o /tmp/stats.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/board.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals.json'));
          const t=JSON.parse(fs.readFileSync('/tmp/stats.json'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures)) throw Error('BOARD_BAD');
          if(!Array.isArray(s?.signals)) throw Error('SIGNALS_BAD');
          if(t?.ok!==true||!Array.isArray(t?.rows)) throw Error('STATS_BAD');
          console.log('BACKEND_OK',{fixtures:b.fixtures.length,signals:s.signals.length,settled:t.rows.length});
          NODE
          public_code=$(curl -sS -L --retry 6 --retry-all-errors --retry-delay 2 --max-time 30 -o /tmp/public.html -w '%{http_code}' "$BALL46_PUBLIC/?recovery=${GITHUB_RUN_ID}")
          [ "$public_code" = 200 ]
          test -s /tmp/public.html
          echo "PUBLIC_OK=$public_code"
