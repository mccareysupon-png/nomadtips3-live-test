name: BALL46 combined latest-TEST and Production version guard
on:
  push:
    branches: [fix/b46-prematch-perf-range-inplace-20261125]
    paths: ['.github/workflows/b46-combined-current-check.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node qa/perf-range-inplace-20261125/current.mjs

# route source inspection before single production page release
