name: Diagnose Ball46 Cloudflare History Fullbase 20260926

on:
  push:
    branches:
      - ops/ball46-recovery-history-fullbase-20260926
    paths:
      - .github/workflows/diag-ball46-cloudflare-history-fullbase-20260926.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect Ball46 deployment and version history
        run: |
          set -euo pipefail
          test -f workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          echo '=== deployments list ==='
          npx --yes wrangler@4.92.0 deployments list --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          echo '=== versions list ==='
          npx --yes wrangler@4.92.0 versions list --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc
