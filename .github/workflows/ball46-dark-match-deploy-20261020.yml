name: BALL46 Production Deep Graphite Teal Match Cards 20261020
on:
  push:
    branches: [codex/ball46-match-deep-teal-20261020]
    paths:
      - '.github/workflows/ball46-dark-match-deploy-20261020.yml'
      - 'deploy-assets/match-deep-teal-20261020/deploy.mjs'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  guarded-ui-cutover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check and install browser-only test dependency
        working-directory: deploy-assets/match-deep-teal-20261020
        run: |
          set -euo pipefail
          node --check deploy.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Check and preview; deploy only after tests; rollback if post-test fails
        working-directory: deploy-assets/match-deep-teal-20261020
        run: |
          node deploy.mjs
      - name: Save before after verification and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-dark-match-deep-teal-verification
          path: deploy-assets/match-deep-teal-20261020/audit
          if-no-files-found: warn
          retention-days: 30
