name: Ball46 Topcards Clean UI Scout 20261004

on:
  push:
    branches: [work/ball46-topcards-clean-ui-20261004]
    paths:
      - '.github/workflows/ball46-topcards-clean-ui-scout-20261004.yml'
      - 'deploy-assets/match-status-svg-20261003/topcards-clean-ui-scout.mjs'
      - 'deploy-assets/match-status-svg-20261003/topcards-style-owner-scout.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: deploy-assets/match-status-svg-20261003
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inspect live scorebar source
        working-directory: deploy-assets/match-status-svg-20261003
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node topcards-clean-ui-scout.mjs
      - name: Inspect live scorebar stylesheet owner
        working-directory: deploy-assets/match-status-svg-20261003
        shell: bash
        run: |
          export PLAYWRIGHT_EXECUTABLE_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$PLAYWRIGHT_EXECUTABLE_PATH" || { echo PLAYWRIGHT_EXECUTABLE_PATH_MISSING; exit 1; }
          node topcards-style-owner-scout.mjs
      - name: Upload scout evidence
        uses: actions/upload-artifact@v4
        with:
          name: ball46-topcards-clean-ui-scout-${{ github.run_id }}
          path: deploy-assets/match-status-svg-20261003/audit/
          retention-days: 3
