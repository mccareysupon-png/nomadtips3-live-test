name: Fix 3.43 Upcoming Source

on:
  push:
    branches: [work/nomad343-server-prewarm-20260914]
    paths:
      - '.github/workflows/deploy-343-upcoming-source-fix.yml'

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
  CANARY_HUB_URL: https://nomadtips3-5usd-hub-343-stable-canary.mccarey-supon.workers.dev
  PROD_HUB_URL: https://nomadtips3-5usd-hub-343.mccarey-supon.workers.dev
  PROD_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev

jobs:
  patch-test-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/nomad343-server-prewarm-20260914

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch only Upcoming catalog source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('workers/nomadtips3-5usd-hub-343/src/index-v5.js')
          s=p.read_text()
          old='`start_time=${w.start}&end_time=${w.end}&status=all&include=${include}`'
          new='`start_time=${w.start}&end_time=${w.end}&status=scheduled&include=${include}`'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one status=all catalog query, found {s.count(old)}')
          s=s.replace(old,new)
          old_exp="const catalogExpired=!catalogMeta||catalogMeta.windowStart!==w.start||now()-Number(catalogMeta.fetchedAt||0)>=CATALOG_REFRESH_MS"
          new_exp="const catalogExpired=!catalogMeta||catalogMeta.mode!=='scheduled'||catalogMeta.windowStart!==w.start||now()-Number(catalogMeta.fetchedAt||0)>=CATALOG_REFRESH_MS"
          if s.count(old_exp) != 1:
              raise SystemExit('catalog expiry guard shape changed')
          s=s.replace(old_exp,new_exp)
          old_meta="catalogMeta={...stored,fetchedAt:now(),windowStart:w.start,windowEnd:w.end,requests:today.requests,guardHit:today.guardHit}"
          new_meta="catalogMeta={...stored,fetchedAt:now(),windowStart:w.start,windowEnd:w.end,mode:'scheduled',requests:today.requests,guardHit:today.guardHit}"
          if s.count(old_meta) != 1:
              raise SystemExit('catalog metadata shape changed')
          s=s.replace(old_meta,new_meta)
          p.write_text(s)
          PY
          node --check workers/nomadtips3-5usd-hub-343/src/index-v5.js
          grep -Fq 'status=scheduled&include=${include}' workers/nomadtips3-5usd-hub-343/src/index-v5.js
          grep -Fq 'status=live&include=${include}' workers/nomadtips3-5usd-hub-343/src/index-v5.js
          grep -Fq 'const TODAY_MAX_PAGES=4' workers/nomadtips3-5usd-hub-343/src/index-v5.js
          grep -Fq 'const LIVE_MAX_PAGES=1' workers/nomadtips3-5usd-hub-343/src/index-v5.js
          grep -Fq 'const MAX_PROVIDER_REQUESTS_PER_REFRESH=5' workers/nomadtips3-5usd-hub-343/src/index-v5.js
          if grep -Fq 'status=all&include=${include}' workers/nomadtips3-5usd-hub-343/src/index-v5.js; then
            echo '::error::Finished/all catalog query still present'; exit 1
          fi

      - name: Persist source fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/nomadtips3-5usd-hub-343/src/index-v5.js
          git commit -m 'fix(343): source upcoming from scheduled fixtures only'
          git push origin HEAD:work/nomad343-server-prewarm-20260914

      - name: Guard unrelated systems unchanged
        run: |
          set -euo pipefail
          git diff --quiet HEAD^ HEAD -- workers/nomadtips3-engine-343 || { echo 'ENGINE CHANGED'; exit 1; }
          git diff --quiet HEAD^ HEAD -- workers/nomadtips3-343-full-market || { echo 'FULL MARKET CHANGED'; exit 1; }
          git diff --quiet HEAD^ HEAD -- workers/nomadtips3-343-full-market-central || { echo 'CENTRAL MARKET CHANGED'; exit 1; }
          git diff --quiet HEAD^ HEAD -- nomad-live-341 || { echo '3.41 CHANGED'; exit 1; }
          test "$(git diff --name-only HEAD^ HEAD | wc -l)" -eq 1
          test "$(git diff --name-only HEAD^ HEAD)" = 'workers/nomadtips3-5usd-hub-343/src/index-v5.js'

      - name: Dry-run HUBs
        run: |
          set -euo pipefail
          (cd workers/nomadtips3-5usd-hub-343 && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.stable.toml)
          (cd workers/nomadtips3-5usd-hub-343 && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.toml)

      - name: Deploy and verify Canary HUB
        working-directory: workers/nomadtips3-5usd-hub-343
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --config wrangler.stable.toml
          printf '%s' "$FIVEDOLLAR_API_KEY" | npx --yes wrangler@4.92.0 secret put FIVEDOLLAR_API_KEY --config wrangler.stable.toml
          curl -fsS --retry 5 --retry-all-errors --retry-delay 2 "$CANARY_HUB_URL/snapshot?upcoming=$RANDOM" -o /tmp/canary.json
          node - <<'NODE'
          const j=require('/tmp/canary.json');
          if(j.ok!==true) throw Error('CANARY_NOT_OK '+JSON.stringify(j));
          if(j.version!=='nomad343-5usd-hub-v5-bulk-15s') throw Error('CANARY_VERSION '+j.version);
          if(Number(j.providerRequestCount||0)>5) throw Error('CANARY_REQUEST_BUDGET '+j.providerRequestCount);
          if(Number(j.counts?.finished||0)!==0) throw Error('FINISHED_STILL_IN_CATALOG '+JSON.stringify(j.counts));
          if(Number(j.counts?.scheduled||0)<=0) throw Error('NO_UPCOMING_FROM_SOURCE '+JSON.stringify(j.counts));
          console.log('CANARY UPCOMING OK',{counts:j.counts,requests:j.providerRequestCount,guardHit:j.guardHit});
          NODE

      - name: Promote same HUB service to Production
        working-directory: workers/nomadtips3-5usd-hub-343
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --config wrangler.toml
          printf '%s' "$FIVEDOLLAR_API_KEY" | npx --yes wrangler@4.92.0 secret put FIVEDOLLAR_API_KEY --config wrangler.toml

      - name: Verify Production source and viewer wire
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 8); do
            if curl -fsS --max-time 40 "$PROD_HUB_URL/snapshot?upcoming=$RANDOM" -o /tmp/prod-hub.json; then
              if node - <<'NODE'
          const j=require('/tmp/prod-hub.json');
          const good=j.ok===true && j.version==='nomad343-5usd-hub-v5-bulk-15s' && Number(j.providerRequestCount||0)<=5 && Number(j.counts?.finished||0)===0 && Number(j.counts?.scheduled||0)>0;
          console.log('PROD HUB CHECK',{good,counts:j.counts,requests:j.providerRequestCount,guardHit:j.guardHit,lastError:j.lastError});
          process.exit(good?0:1);
          NODE
              then ok=1; break; fi
            fi
            sleep 3
          done
          test "$ok" = "1"
          curl -fsS --max-time 40 "$PROD_URL/api/live/snapshot?upcoming=$RANDOM" -o /tmp/prod-view.json
          node - <<'NODE'
          const j=require('/tmp/prod-view.json');
          if(j.ok!==true) throw Error('VIEW_NOT_OK');
          if(Number(j.counts?.finished||0)!==0) throw Error('VIEW_FINISHED_PRESENT '+JSON.stringify(j.counts));
          if(Number(j.counts?.scheduled||0)<=0) throw Error('VIEW_UPCOMING_MISSING '+JSON.stringify(j.counts));
          if(Number(j.providerRequestCount||0)>5) throw Error('VIEW_REQUEST_BUDGET '+j.providerRequestCount);
          console.log('PRODUCTION VIEW UPCOMING OK',{counts:j.counts,requests:j.providerRequestCount,fixtureCount:j.fixtureCount});
          NODE
