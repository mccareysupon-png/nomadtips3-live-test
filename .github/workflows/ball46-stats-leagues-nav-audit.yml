name: BALL46 Statistics Leagues Navigation Audit
on:
  push:
    branches: [fix/ball46-stats-leagues-nav-20261021]
    paths:
      - '.github/workflows/ball46-stats-leagues-nav-audit.yml'
      - 'deploy-assets/stats-leagues-20261021/nav-audit.mjs'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Reproduce Stats to Leagues navigation in production; read only
        working-directory: deploy-assets/stats-leagues-20261021
        run: |
          npm install --no-save --ignore-scripts puppeteer-core@24
          node nav-audit.mjs
      - name: Keep read-only navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-statistics-leagues-readonly-audit
          path: deploy-assets/stats-leagues-20261021/proof/
          retention-days: 14
          if-no-files-found: warn