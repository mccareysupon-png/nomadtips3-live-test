name: QA Ball46 Statistics Legacy Route Recovery 20261011
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-ball46-statistics-legacy-route-recovery-20261011.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ball46-easybet-crossdevice-fix-20261007
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Verify both old routes redirect to healthy main Statistics page (read only)
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const addresses=['https://ball46.com/statistics.html','https://www.ball46.com/statistics.html','https://ball46.com/index.html?view=statistics'];
          for(const url of addresses){
           const ctx=await browser.newContext({viewport:{width:1440,height:900}});
           const page=await ctx.newPage(),errors=[];
           page.on('pageerror',e=>errors.push(e.message.slice(0,400)));
           const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
           await page.waitForFunction(()=>{
            const el=document.querySelector('[data-sp-kpi="total"]');
            const v=Number(el?.textContent?.replaceAll(',',''));
            return document.body?.dataset?.workspaceView==='statistics'&&el&&Number.isInteger(v)&&v>5000;
           },null,{timeout:60000});
           await page.waitForTimeout(800);
           const state=await page.evaluate(()=>({
            href:location.href,
            title:document.title,
            view:document.body?.dataset?.workspaceView,
            current:document.querySelector('[data-sp-market-title]')?.textContent?.trim(),
            settled:document.querySelector('[data-sp-kpi="total"]')?.textContent?.trim(),
            unsettled:document.querySelector('[data-sp-kpi="unsettled"]')?.textContent?.trim(),
            wins:document.querySelector('[data-sp-kpi="win"]')?.textContent?.trim(),
            losses:document.querySelector('[data-sp-kpi="loss"]')?.textContent?.trim(),
            statisticsVisible:document.querySelector('[data-workspace-panel="statistics"]')?.hidden===false,
            legacyPanel:!!document.querySelector('[data-next-stat-state]'),
            statsTables:document.querySelectorAll('.sp-table tbody tr').length
           }));
           console.log('LEGACY_STATS_REPAIR_QA',url,'RESULT',JSON.stringify(state),'ERRORS',JSON.stringify(errors),'HTTP',response.status());
           assert.equal(state.view,'statistics','NOT_IN_MAIN_STATS_VIEW');
           assert(state.href.includes('/index.html?view=statistics'),'LEGACY_NOT_REDIRECTED_TO_MAIN_STATS');
           assert(state.statisticsVisible,'STATS_PANEL_NOT_VISIBLE');
           assert(Number(state.settled.replaceAll(',',''))>5000,'SETTLED_NOT_LOADED');
           assert(Number(state.unsettled.replaceAll(',',''))>=0,'UNSETTLED_NOT_LOADED');
           assert(Number(state.wins.replaceAll(',',''))>2000,'WINS_MISSING');
           assert.equal(state.legacyPanel,false,'OLD_LEGACY_PAGE_STILL_DISPLAYED');
           assert.equal(errors.length,0,'PAGE_ERROR');
           await ctx.close();
          }
          await browser.close();
          console.log('BALL46_STATISTICS_LEGACY_REDIRECT_BROWSER_QA_SUCCESS');
          NODE
