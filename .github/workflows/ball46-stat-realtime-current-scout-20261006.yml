name: Ball46 Realtime Pending Current Scout 20261006

on:
  push:
    branches: [work/ball46-stat-realtime-current-20261006]
    paths:
      - '.github/workflows/ball46-stat-realtime-current-scout-20261006.yml'
      - '.github/scripts/ball46_stat_realtime_pending_patch_20261006.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-stat-realtime-current-scout
  cancel-in-progress: true

jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ENGINE_NAME: nomadtips3-engine-343
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-stat-realtime-current-20261006
          fetch-depth: 1

      - name: Capture exact current Production engine source read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b46-stat-current
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          root=pathlib.Path('/tmp/b46-stat-current')
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; worker=os.environ['ENGINE_NAME']
          if not account or not token: raise SystemExit('CLOUDFLARE_AUTH_MISSING')
          headers={'Authorization':f'Bearer {token}','Accept':'application/json'}
          api=f'https://api.cloudflare.com/client/v4/accounts/{account}'
          def getj(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=45) as r: j=json.load(r)
              if not isinstance(j,dict) or j.get('success') is not True: raise SystemExit('CF_API_FAIL:'+json.dumps(j)[:1000])
              return j['result']
          deps=getj(f'{api}/workers/scripts/{worker}/deployments?per_page=5')
          deployments=deps.get('deployments',[]) if isinstance(deps,dict) else deps
          if not deployments: raise SystemExit('NO_DEPLOYMENTS')
          versions=deployments[0].get('versions') or []
          active=[str(v.get('version_id')) for v in versions if v.get('version_id') and float(v.get('percentage',0))>=99.999]
          if len(active)!=1: raise SystemExit('ACTIVE_VERSION_AMBIGUOUS:'+repr(active))
          vid=active[0]
          ver=getj(f'{api}/workers/workers/{worker}/versions/{vid}?include=modules')
          mods=ver.get('modules') or []; main=ver.get('main_module')
          mm=[m for m in mods if m.get('name')==main]
          if len(mm)!=1 or not mm[0].get('content_base64'): raise SystemExit('MAIN_MODULE_NOT_FOUND')
          raw=base64.b64decode(mm[0]['content_base64'])
          root.joinpath('current-engine.js').write_bytes(raw)
          meta={'version':vid,'sha256':hashlib.sha256(raw).hexdigest(),'main_module':main,'module_count':len(mods)}
          root.joinpath('current-engine-meta.json').write_text(json.dumps(meta,indent=2))
          print('CURRENT_ENGINE_VERSION='+vid)
          print('CURRENT_ENGINE_SHA='+meta['sha256'])
          PY

      - name: Apply realtime PENDING patch to temporary copy only
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ball46_stat_realtime_pending_patch_20261006.py /tmp/b46-stat-current/current-engine.js /tmp/b46-stat-current/patched-engine.js
          node --check /tmp/b46-stat-current/current-engine.js
          node --check /tmp/b46-stat-current/patched-engine.js
          grep -Fq 'realtime-pending-ledger-v1' /tmp/b46-stat-current/patched-engine.js
          grep -Fq 'commit all active PENDING signals to Statistics now' /tmp/b46-stat-current/patched-engine.js
          cmp -s /tmp/b46-stat-current/current-engine.js /tmp/b46-stat-current/patched-engine.js && { echo PATCH_MADE_NO_CHANGE; exit 1; } || true
          echo PATCH_COMPATIBLE_WITH_CURRENT_PRODUCTION

      - name: Probe current public contract read-only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-all-errors --max-time 30 "https://ball46.com/api/engine/signals?scout=${GITHUB_RUN_ID}" -o /tmp/b46-stat-current/signals.json
          curl -fsS --retry 4 --retry-all-errors --max-time 30 "https://ball46.com/api/engine/statistics?scout=${GITHUB_RUN_ID}" -o /tmp/b46-stat-current/statistics.json
          node - <<'NODE'
          const fs=require('fs');
          const sig=JSON.parse(fs.readFileSync('/tmp/b46-stat-current/signals.json'));
          const st=JSON.parse(fs.readFileSync('/tmp/b46-stat-current/statistics.json'));
          if(sig?.ok!==true||st?.ok!==true||!Array.isArray(sig.signals)||!Array.isArray(st.rows)) throw Error('PUBLIC_CONTRACT_UNHEALTHY');
          console.log('PUBLIC_SIGNALS='+sig.signals.length);
          console.log('PUBLIC_STAT_ROWS='+st.rows.length);
          console.log('PUBLIC_PENDING='+Number(st.pending||0));
          console.log('STAT_LEDGER_VERSION='+String(st.statisticsLedgerVersion||''));
          NODE

      - name: Upload read-only scout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-stat-realtime-current-scout-${{ github.run_id }}
          path: /tmp/b46-stat-current
          retention-days: 7
