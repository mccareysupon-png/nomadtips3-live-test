name: Deploy Ball46 Statistics Workspace V2 Phase2 20260920

on:
  push:
    branches: [work/ball46-statistics-workspace-v2-20260920]
    paths:
      - '.github/workflows/deploy-ball46-statistics-workspace-v2-phase2-20260920.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_URL: https://ball46.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PATCH_CSS: statistics-workspace-v2.css
  PATCH_JS: statistics-workspace-v2.js
  PATCH_VER: 343-stat-workspace-v2-phase2-20260920a
  EXPECT_ENGINE: nomad343-engine-v6.2-viewer-readonly-cron-referee-lock-v1

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight latest Production after API work
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod /tmp/before /tmp/patch
          for page in index.html signal.html statistics.html; do
            curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/$page?workspace2-p2-before=$GITHUB_RUN_ID" -o "/tmp/prod/$page"
            test -s "/tmp/prod/$page"
          done
          grep -Fq 'data-next-stat-markets' /tmp/prod/statistics.html
          grep -Fq 'Results History' /tmp/prod/statistics.html
          ! grep -Fq 'statistics-tabs-v1.css' /tmp/prod/statistics.html
          ! grep -Fq 'statistics-tabs-v1.js' /tmp/prod/statistics.html

          cp "nomad-live-343/$PATCH_CSS" "/tmp/patch/$PATCH_CSS"
          cp "nomad-live-343/$PATCH_JS" "/tmp/patch/$PATCH_JS"
          grep -Fq 'BALL46_STAT_WORKSPACE_V2' "/tmp/patch/$PATCH_CSS"
          grep -Fq 'BALL46_STAT_WORKSPACE_V2' "/tmp/patch/$PATCH_JS"
          ! grep -Eq 'fetch[[:space:]]*\(|XMLHttpRequest|/api/' "/tmp/patch/$PATCH_JS"
          ! grep -Eq 'fetch[[:space:]]*\(|XMLHttpRequest|/api/' "/tmp/patch/$PATCH_CSS"

          for ep in engine hub full-market; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/api/$ep/health?workspace2-p2-before=$GITHUB_RUN_ID" -o "/tmp/before/$ep.json"
          done
          node - <<'NODE'
          const fs=require('fs'); const out={};
          for(const n of ['engine','hub','full-market']){
            const j=JSON.parse(fs.readFileSync(`/tmp/before/${n}.json`,'utf8'));
            if(j?.ok!==true) throw Error(`PREFLIGHT_${n}_FAIL`);
            out[n]={version:String(j.version||''),component:String(j.component||''),staleCachePolicy:String(j.staleCachePolicy||'')};
          }
          if(out.engine.version !== process.env.EXPECT_ENGINE) throw Error(`ENGINE_BASE_CHANGED:${out.engine.version}`);
          fs.writeFileSync('/tmp/backend-before.json',JSON.stringify(out,null,2));
          console.log('BACKEND_BEFORE',JSON.stringify(out));
          NODE

      - name: Verify deploy harness matches latest API canonical branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin work/ball46-viewer-readonly-lock-v1-20260920 --no-tags
          git diff --quiet HEAD FETCH_HEAD -- workers/nomadtips3-343-preview/src/index.js || { echo BALL46_WRAPPER_DIFF_FROM_API_CANONICAL; exit 1; }
          git diff --quiet HEAD FETCH_HEAD -- workers/nomadtips3-343-preview/wrangler.ball46.jsonc || { echo BALL46_CONFIG_DIFF_FROM_API_CANONICAL; exit 1; }
          echo 'DEPLOY_HARNESS_CANONICAL_GUARD_PASS'

      - name: Build staging from current Production bytes only
        shell: bash
        run: |
          set -euo pipefail
          mv nomad-live-343 /tmp/repo-assets
          mkdir -p nomad-live-343 /tmp/names

          find /tmp/repo-assets -maxdepth 1 -type f -printf '%f\n' > /tmp/names/workspace.txt
          git ls-tree -r --name-only FETCH_HEAD nomad-live-343/ | sed 's#^nomad-live-343/##' | awk 'index($0,"/")==0' > /tmp/names/api-canonical.txt
          cat /tmp/names/workspace.txt /tmp/names/api-canonical.txt | sort -u > /tmp/names/all.txt

          while IFS= read -r name; do
            [ -n "$name" ] || continue
            [ "$name" = "$PATCH_CSS" ] && continue
            [ "$name" = "$PATCH_JS" ] && continue
            case "$name" in *.html|*.js|*.css|*.svg|*.json|*.txt|*.xml|*.png|*.webp|*.jpg|*.jpeg|*.ico|*.woff|*.woff2) ;; *) continue ;; esac
            tmp="/tmp/prod-file-${name//\//_}"
            code=$(curl -sS -L --retry 3 --retry-all-errors --retry-delay 1 --max-time 20 -o "$tmp" -w '%{http_code}' "$BALL46_URL/$name?workspace2-p2-mirror=$GITHUB_RUN_ID") || code=000
            if [ "$code" = 200 ] && [ -s "$tmp" ]; then
              cp "$tmp" "nomad-live-343/$name"
            fi
          done < /tmp/names/all.txt

          cp /tmp/prod/index.html nomad-live-343/index.html
          cp /tmp/prod/signal.html nomad-live-343/signal.html
          cp /tmp/prod/statistics.html nomad-live-343/statistics.html

          # Explicitly preserve every protected runtime from current Production.
          for f in signal-next.js statistics-next.js bulk-odds-compat-343.js odds-format-343.js full-market-bookmaker-343.js full-odds-main-343.js live-summary-full-odds-343.js dashboard-v2-stage3.js; do
            tmp="/tmp/protected-$f"
            code=$(curl -sS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 -o "$tmp" -w '%{http_code}' "$BALL46_URL/$f?workspace2-p2-protected=$GITHUB_RUN_ID") || code=000
            if [ "$code" = 200 ] && [ -s "$tmp" ]; then cp "$tmp" "nomad-live-343/$f"; fi
          done

          test -s nomad-live-343/index.html
          test -s nomad-live-343/signal.html
          test -s nomad-live-343/statistics.html
          count=$(find nomad-live-343 -maxdepth 1 -type f | wc -l)
          echo "PRODUCTION_STAGING_FILES=$count"
          [ "$count" -ge 100 ] || { echo STAGING_ASSET_COUNT_TOO_LOW; exit 1; }
          cp -a nomad-live-343 /tmp/phase2-before

      - name: Apply isolated workspace shell overlay
        shell: bash
        run: |
          set -euo pipefail
          cp "/tmp/patch/$PATCH_CSS" "nomad-live-343/$PATCH_CSS"
          cp "/tmp/patch/$PATCH_JS" "nomad-live-343/$PATCH_JS"
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          p=Path('nomad-live-343/statistics.html')
          s=p.read_text()
          css=os.environ['PATCH_CSS']; js=os.environ['PATCH_JS']; ver=os.environ['PATCH_VER']
          s=re.sub(r'\s*<link[^>]+href=["\'][^"\']*statistics-workspace-v2\.css[^"\']*["\'][^>]*>','',s,flags=re.I)
          s=re.sub(r'\s*<script[^>]+src=["\'][^"\']*statistics-workspace-v2\.js[^"\']*["\'][^>]*>\s*</script>','',s,flags=re.I)
          if '</head>' not in s.lower() or '</body>' not in s.lower(): raise SystemExit('STATISTICS_HTML_STRUCTURE_INVALID')
          s=re.sub(r'</head>',f'\n<link rel="stylesheet" href="{css}?v={ver}" data-ball46-phase="statistics-workspace-v2-phase2">\n</head>',s,count=1,flags=re.I)
          s=re.sub(r'</body>',f'\n<script src="{js}?v={ver}" defer data-ball46-phase="statistics-workspace-v2-phase2"></script>\n</body>',s,count=1,flags=re.I)
          p.write_text(s)
          PY
          grep -Fq "$PATCH_CSS?v=$PATCH_VER" nomad-live-343/statistics.html
          grep -Fq "$PATCH_JS?v=$PATCH_VER" nomad-live-343/statistics.html
          ! grep -Fq 'statistics-tabs-v1.css' nomad-live-343/statistics.html
          ! grep -Fq 'statistics-tabs-v1.js' nomad-live-343/statistics.html

      - name: Scope guard - only Page3 loader and two new overlay files
        shell: bash
        run: |
          set -euo pipefail
          diff -qr /tmp/phase2-before nomad-live-343 > /tmp/phase2.diff || true
          cat /tmp/phase2.diff
          [ -s /tmp/phase2.diff ]
          if grep -Ev 'statistics\.html|statistics-workspace-v2\.css|statistics-workspace-v2\.js' /tmp/phase2.diff | grep -q .; then
            echo 'UNEXPECTED_PHASE2_DIFF'; exit 1
          fi
          grep -Eq 'statistics\.html' /tmp/phase2.diff
          cmp -s /tmp/prod/index.html nomad-live-343/index.html || { echo PAGE1_HTML_CHANGED; exit 1; }
          cmp -s /tmp/prod/signal.html nomad-live-343/signal.html || { echo PAGE2_HTML_CHANGED; exit 1; }
          echo 'PHASE2_SCOPE_GUARD_PASS'

      - name: Guard protected runtime byte-for-byte against Production
        shell: bash
        run: |
          set -euo pipefail
          for f in signal-next.js statistics-next.js bulk-odds-compat-343.js odds-format-343.js full-market-bookmaker-343.js full-odds-main-343.js live-summary-full-odds-343.js dashboard-v2-stage3.js; do
            [ -f "nomad-live-343/$f" ] || continue
            tmp="/tmp/runtime-check-$f"
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_URL/$f?workspace2-p2-guard=$GITHUB_RUN_ID" -o "$tmp"
            cmp -s "$tmp" "nomad-live-343/$f" || { echo "PROTECTED_RUNTIME_DIFF:$f"; exit 1; }
          done
          echo 'PROTECTED_RUNTIME_GUARD_PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and dry-run validation
        shell: bash
        run: |
          set -euo pipefail
          node --check "nomad-live-343/$PATCH_JS"
          ! grep -Eq 'fetch[[:space:]]*\(|XMLHttpRequest|/api/' "nomad-live-343/$PATCH_JS"
          npx --yes wrangler@4.92.0 deploy --dry-run --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc

      - name: Deploy Phase 2 shell only
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc

      - name: Verify Page3 overlay and backend invariants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/after
          for n in $(seq 1 15); do
            if curl -fsS -L --max-time 25 "$BALL46_URL/statistics.html?workspace2-p2-after=$GITHUB_RUN_ID-$n" -o /tmp/after/statistics.html && grep -Fq "$PATCH_CSS?v=$PATCH_VER" /tmp/after/statistics.html && grep -Fq "$PATCH_JS?v=$PATCH_VER" /tmp/after/statistics.html; then break; fi
            sleep 2
          done
          grep -Fq "$PATCH_CSS?v=$PATCH_VER" /tmp/after/statistics.html
          grep -Fq "$PATCH_JS?v=$PATCH_VER" /tmp/after/statistics.html
          ! grep -Fq 'statistics-tabs-v1.css' /tmp/after/statistics.html
          ! grep -Fq 'statistics-tabs-v1.js' /tmp/after/statistics.html
          curl -fsS -L --max-time 25 "$BALL46_URL/$PATCH_CSS?v=$PATCH_VER" -o /tmp/after/$PATCH_CSS
          curl -fsS -L --max-time 25 "$BALL46_URL/$PATCH_JS?v=$PATCH_VER" -o /tmp/after/$PATCH_JS
          grep -Fq 'BALL46_STAT_WORKSPACE_V2' /tmp/after/$PATCH_CSS
          grep -Fq 'BALL46_STAT_WORKSPACE_V2' /tmp/after/$PATCH_JS

          curl -fsS -L --max-time 25 "$BALL46_URL/index.html?workspace2-p2-page1=$GITHUB_RUN_ID" -o /tmp/after/index.html
          curl -fsS -L --max-time 25 "$BALL46_URL/signal.html?workspace2-p2-page2=$GITHUB_RUN_ID" -o /tmp/after/signal.html
          cmp -s /tmp/prod/index.html /tmp/after/index.html || { echo PAGE1_POSTDEPLOY_CHANGED; exit 1; }
          cmp -s /tmp/prod/signal.html /tmp/after/signal.html || { echo PAGE2_POSTDEPLOY_CHANGED; exit 1; }

          for ep in engine hub full-market; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/api/$ep/health?workspace2-p2-after=$GITHUB_RUN_ID" -o "/tmp/after/$ep.json"
          done
          node - <<'NODE'
          const fs=require('fs'); const before=JSON.parse(fs.readFileSync('/tmp/backend-before.json','utf8'));
          for(const n of ['engine','hub','full-market']){
            const j=JSON.parse(fs.readFileSync(`/tmp/after/${n}.json`,'utf8'));
            if(j?.ok!==true) throw Error(`POST_${n}_FAIL`);
            for(const k of ['version','component','staleCachePolicy']){
              const now=String(j[k]||''); if(now!==before[n][k]) throw Error(`${n}_${k}_CHANGED`);
            }
          }
          if(before.engine.version !== process.env.EXPECT_ENGINE) throw Error('ENGINE_BASE_NOT_EXPECTED');
          console.log('BALL46_STAT_WORKSPACE_V2_PHASE2_PASS');
          NODE
