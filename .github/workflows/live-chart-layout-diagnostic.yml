name: LIVE chart layout and actual theme diagnostic
on:
  push:
    branches: [fix/ball46-live-statistics-inplace-20261125]
    paths: [.github/workflows/live-chart-layout-diagnostic.yml]
permissions: {contents: read}
jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Click QA
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          for(const colorScheme of ['dark','light'])for(const width of [1440,390]){
          const page=await browser.newPage({viewport:{width,height:900},colorScheme,recordVideo:{dir:'videos/'}});
          await page.goto('https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev/index.html?view=statistics&market=1x2');
          page.on('pageerror',e=>console.log('PAGE_ERROR',e.message));page.on('response',r=>{if(r.url().includes('/graph?'))console.log('GRAPH_RESPONSE',r.status(),r.url())});
          const card=page.locator('#b46-finance-chart-card .f46-card');
          await card.waitFor({timeout:45000});
          await page.waitForTimeout(1500);
          console.log('THEME_CONTROLS',await page.evaluate(()=>[...document.querySelectorAll('button,[role=button]')].filter(e=>/theme|light|dark|sun|moon/i.test([e.id,e.className,e.title,e.getAttribute('aria-label'),e.textContent].join(' '))).map(e=>({html:e.outerHTML.slice(0,700)}))));
          await page.evaluate(()=>{window.layoutTrace=[];const root=document.querySelector('#b46-finance-chart-card');const nodes=[...document.querySelectorAll('aside,header,table,.sp-stats-content > *')].filter(e=>e!==root&&!root.contains(e)&&!e.contains(root)&&e.getBoundingClientRect().height);const initial=nodes.map(e=>({e,r:e.getBoundingClientRect()}));let last='';function frame(){const changes=initial.map(({e,r})=>{const n=e.getBoundingClientRect();return {tag:e.tagName,cls:String(e.className),connected:e.isConnected,dx:n.x-r.x,dy:n.y-r.y,dw:n.width-r.width,dh:n.height-r.height,opacity:getComputedStyle(e).opacity}}).filter(x=>!x.connected||Math.abs(x.dx)>1||Math.abs(x.dy)>1||Math.abs(x.dw)>1||Math.abs(x.dh)>1||x.opacity!=='1');const key=JSON.stringify(changes);if(key!==last){window.layoutTrace.push({time:performance.now(),changes});last=key}requestAnimationFrame(frame)}requestAnimationFrame(frame)});

          await page.screenshot({path:`before-${colorScheme}-${width}.png`});
          await page.evaluate(()=>{window.qaCard=document.querySelector('.f46-card');window.qaPlot=document.querySelector('[data-f46-plot]');});
          for(const range of ['d7','d30','d90','all']){
          console.log('CLICK_RANGE',width,range);
          await page.locator('button[data-b46-range="'+range+'"]').click();
          await page.waitForTimeout(1000);
          console.log('STATE',await page.evaluate(()=>({buttons:[...document.querySelectorAll('button[data-b46-range]')].map(x=>[x.dataset.b46Range,x.className]),source:document.querySelector('#b46-finance-chart-card')?.dataset.b46StatisticsSource,scripts:[...document.scripts].map(s=>s.src).filter(s=>s.includes('performance'))})));
          await page.waitForFunction(r=>document.querySelector('button[data-b46-range="'+r+'"]')?.classList.contains('active')&&document.querySelector('#b46-finance-chart-card')?.dataset.b46Range===r&&document.querySelector('#b46-finance-chart-card')?.dataset.b46StatisticsSource==='receiver',range,{timeout:20000});
          assert(await page.evaluate(()=>window.qaCard===document.querySelector('.f46-card')&&window.qaPlot===document.querySelector('[data-f46-plot]')));
          }
          for(const metric of await page.locator('button[data-b46-mode]').evaluateAll(xs=>xs.map(x=>x.dataset.b46Mode))){
          await page.locator('button[data-b46-mode="'+metric+'"]').click();
          await page.waitForFunction(m=>document.querySelector('button[data-b46-mode="'+m+'"]')?.classList.contains('active'),metric);
          assert(await page.evaluate(()=>window.qaCard===document.querySelector('.f46-card')));
          }
          console.log('LAYOUT_TRACE',JSON.stringify(await page.evaluate(()=>window.layoutTrace)));await page.screenshot({path:`after-${colorScheme}-${width}.png`});console.log('CLICK_QA_PASS',colorScheme,width);await page.close();
          }await browser.close();
          JS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-visual-evidence
          path: |
            *.png
            videos/
