name: BALL46 ledger pending safe read verification
on:
  push:
    branches:
      - stage/ball46-multisource-v5-20261017
    paths:
      - .github/workflows/ball46-ledger-pending-safe-read.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: GET authoritative ledger rows only
        shell: bash
        run: |
          node - <<'NODE'
          const root='https://nomadtips3-engine-343.mccarey-supon.workers.dev/statistics';
          const cursor='stat:v2:row:9999999999999:~';
          (async()=>{
            const res=await fetch(root+'?paged=1&cursor='+encodeURIComponent(cursor),
              {method:'GET',redirect:'error',signal:AbortSignal.timeout(15000)});
            const x=await res.json();
            console.log('PENDING_LEDGER_GET_RESULT',JSON.stringify({
              http:res.status,ok:x.ok,source:x.statisticsSource,
              version:x.statisticsLedgerVersion,pending:x.pending,
              rowCount:Array.isArray(x.rows)?x.rows.length:null,
              nextCursor:typeof x.nextCursor==='string',
              firstPageMarkets:Array.isArray(x.rows)?
                [...new Set(x.rows.filter(r=>r.status==='PENDING').map(r=>r.market))].slice(0,12):[]}));
            if(!res.ok||x.ok!==true||x.statisticsSource!=='LEDGER_V2_ONLY')
              process.exit(1);
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
