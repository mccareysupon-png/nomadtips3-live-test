name: ONE SHOT - Ball46 Signal Market Hide Text 20260927

on:
  push:
    branches: [ops/ball46-signal-market-hide-text-20260927]

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  GH_TOKEN: ${{ github.token }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy and verify hidden Signal Market text
        shell: bash
        run: bash .github/scripts/ball46_signal_market_hide_text_20260927.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-signal-market-hide-text-${{ github.run_id }}
          path: |
            /tmp/screens/signal-market-text-hidden.png
            /tmp/deploy.log
          if-no-files-found: ignore
          retention-days: 30
