name: Resize Live Scores Beta heading

on:
  push:
    paths:
      - .github/workflows/resize-live-scores-beta-heading.yml

permissions:
  contents: write

jobs:
  resize-heading:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reduce heading by 40 percent and keep it bold
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          desktop_old = ".brand span{color:#fff}.brand b{color:#b7f34a;font:inherit}.v2{padding:6px 9px;color:#c7f9d9;background:rgba(0,230,118,.08);border-color:rgba(199,249,217,.25);font-size:9px}"
          desktop_new = ".brand span{color:#fff}.brand b{color:#b7f34a;font:inherit}.v2{padding:6px 9px;color:#c7f9d9;background:rgba(0,230,118,.08);border-color:rgba(199,249,217,.25);font-size:5.4px;font-weight:900}"
          mobile_old = ".brand{font-size:25px}.v2{padding:5px 7px;font-size:7px}.match-list"
          mobile_new = ".brand{font-size:25px}.v2{padding:5px 7px;font-size:4.2px;font-weight:900}.match-list"

          if desktop_old not in text:
              raise SystemExit("Desktop heading rule was not found")
          if mobile_old not in text:
              raise SystemExit("Mobile heading rule was not found")

          text = text.replace(desktop_old, desktop_new, 1)
          text = text.replace(mobile_old, mobile_new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/resize-live-scores-beta-heading.yml

      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/resize-live-scores-beta-heading.yml
          git commit -m "Reduce Live Scores Beta heading size"
          git push
