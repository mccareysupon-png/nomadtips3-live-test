name: BLOCKED - Legacy Ball46 Production Rail

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-firewall:
    runs-on: ubuntu-24.04
    steps:
      - name: Block retired production rail
        run: |
          echo "BALL46_PRODUCTION_FIREWALL_BLOCK"
          echo "Historical Ball46 overlay/recovery source is retired and cannot deploy to current Production."
          exit 1
