name: Deploy Ball46 Full Market 20260918

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ball46-full-market-20260918.yml'

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
  BALL46_URL: https://ball46.com
  FULL_MARKET_BRANCH: work/ball46-full-market-20260918
  KNOWN_GOOD_UI: 2e92b012f5046a10b7c5124b9984b5fd8fb0f722
  OLD_WRAPPER_REF: 9ea1ec399ba27e946f271f6ca925f4daa2a7f850

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full-market candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FULL_MARKET_BRANCH }}
          path: production

      - name: Checkout known-good 3.43 UI
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KNOWN_GOOD_UI }}
          path: candidate-ui

      - name: Checkout rollback wrapper
        uses: actions/checkout@v4
        with:
          ref: ${{ env.OLD_WRAPPER_REF }}
          path: rollback

      - name: Validate scope and overlay known-good UI
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          test -n "$FIVEDOLLAR_API_KEY"
          test -s production/workers/nomadtips3-full-market-343-ball46/src/index.js
          test -s production/workers/nomadtips3-full-market-343-ball46/wrangler.toml
          test -s production/workers/nomadtips3-343-preview/src/index.js
          test -s production/workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          test -s production/nomad-live-343/full-odds-main-343.js
          test -s production/nomad-live-343/index.html
          test -s production/nomad-live-343/live-summary-full-odds-343.js
          test -s production/nomad-live-343/rich-odds-on-demand-343.js
          test -s production/nomad-live-343/5usd-control.html
          grep -Fq 'nomad343-ball46-full-market-v3-control' production/workers/nomadtips3-full-market-343-ball46/src/index.js
          grep -Fq "path === '/settings'" production/workers/nomadtips3-343-preview/src/index.js
          grep -Fq '5USD CONTROL' production/nomad-live-343/5usd-control.html
          grep -Fq '343-full-odds-main-v8-ultra-19book' production/nomad-live-343/full-odds-main-343.js
          node --check production/workers/nomadtips3-full-market-343-ball46/src/index.js
          node --check production/workers/nomadtips3-343-preview/src/index.js
          node --check production/nomad-live-343/full-odds-main-343.js
          node --check production/nomad-live-343/live-summary-full-odds-343.js
          node --check production/nomad-live-343/rich-odds-on-demand-343.js
          cp production/nomad-live-343/full-odds-main-343.js /tmp/full-odds-main-343.js
          cp production/nomad-live-343/index.html /tmp/index.html
          cp production/nomad-live-343/live-summary-full-odds-343.js /tmp/live-summary-full-odds-343.js
          cp production/nomad-live-343/rich-odds-on-demand-343.js /tmp/rich-odds-on-demand-343.js
          cp production/nomad-live-343/5usd-control.html /tmp/5usd-control.html
          rm -rf production/nomad-live-343
          cp -a candidate-ui/nomad-live-343 production/nomad-live-343
          cp /tmp/full-odds-main-343.js production/nomad-live-343/full-odds-main-343.js
          cp /tmp/index.html production/nomad-live-343/index.html
          cp /tmp/live-summary-full-odds-343.js production/nomad-live-343/live-summary-full-odds-343.js
          cp /tmp/rich-odds-on-demand-343.js production/nomad-live-343/rich-odds-on-demand-343.js
          cp /tmp/5usd-control.html production/nomad-live-343/5usd-control.html
          echo "FULL_MARKET_SOURCE=$(git -C production rev-parse HEAD)"
          echo "BASE_UI_SOURCE=$KNOWN_GOOD_UI"
          echo '5USD_CONTROL_SOURCE=FULL_MARKET_BRANCH'

      - name: Dry-run isolated Full Market worker
        working-directory: production/workers/nomadtips3-full-market-343-ball46
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.toml

      - name: Deploy isolated Full Market worker
        working-directory: production/workers/nomadtips3-full-market-343-ball46
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.toml

      - name: Bind provider API key only to Full Market worker
        working-directory: production/workers/nomadtips3-full-market-343-ball46
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: printf '%s' "$FIVEDOLLAR_API_KEY" | npx --yes wrangler@4.92.0 secret put FIVEDOLLAR_API_KEY --config wrangler.toml

      - name: Dry-run Ball46 wrapper with Full Market binding
        working-directory: production/workers/nomadtips3-343-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy Ball46 wrapper only
        working-directory: production/workers/nomadtips3-343-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify Ball46 Full Market and 5USD Control
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 15); do
            code="$(curl -sS --max-time 25 -o /tmp/health.json -w '%{http_code}' "$BALL46_URL/api/full-market/health?_=${GITHUB_RUN_ID}-${n}" || true)"
            if [ "$code" = 200 ]; then break; fi
            sleep 2
          done
          node - <<'NODE'
          const h=require('/tmp/health.json');
          if(h.ok!==true||h.component!=='BALL46_FULL_MARKET_GATE') throw Error(JSON.stringify(h));
          if(Number(h.bookmakerCount)!==19) throw Error(`bookmakerCount=${h.bookmakerCount}`);
          const presets={eco:[30000,15],normal:[20000,25],fast:[12000,30]};
          if(!presets[h.mode]) throw Error(`mode=${h.mode}`);
          const [cache,guard]=presets[h.mode];
          if(Number(h.cacheMs)!==cache) throw Error(`cacheMs=${h.cacheMs}`);
          if(Number(h.maxFullMarketCallsPerMinute)!==guard) throw Error(`guard=${h.maxFullMarketCallsPerMinute}`);
          if(Number(h.accountLimitPerMinute)!==40) throw Error(`accountLimit=${h.accountLimitPerMinute}`);
          require('fs').writeFileSync('/tmp/mode',h.mode);
          console.log('FULL_MARKET_HEALTH_PASS',h.version,h.mode,h.cacheMs,h.maxFullMarketCallsPerMinute,h.callsLast60s);
          NODE

          MODE="$(cat /tmp/mode)"
          curl -fsS --max-time 20 -X PUT -H 'content-type: application/json' --data "{\"mode\":\"${MODE}\"}" "$BALL46_URL/api/full-market/settings" -o /tmp/settings.json
          node - <<'NODE'
          const j=require('/tmp/settings.json');
          if(j.ok!==true||!j.config?.mode) throw Error(JSON.stringify(j));
          console.log('CONTROL_SETTINGS_PASS',j.config.mode,j.config.cacheMs,j.config.maxCallsPerMinute);
          NODE

          curl -fsS --max-time 30 "$BALL46_URL/api/engine/board?_=${GITHUB_RUN_ID}" -o /tmp/board.json
          node - <<'NODE'
          const j=require('/tmp/board.json');
          if(j.ok!==true||!Array.isArray(j.fixtures)||!j.fixtures.length) throw Error('BOARD_NOT_READY');
          const live=j.fixtures.find(f=>String(f?.boardState||f?.status||'').toLowerCase().includes('live')||String(f?.status||'').toLowerCase().includes('in_play'))||j.fixtures[0];
          if(!live?.fixtureId) throw Error('NO_FIXTURE');
          require('fs').writeFileSync('/tmp/id',String(live.fixtureId));
          console.log('BOARD_PASS',j.fixtures.length,'fixture',live.fixtureId);
          NODE

          ID="$(cat /tmp/id)"
          curl -fsS --max-time 30 "$BALL46_URL/api/full-market/fixture-odds?fixtureId=${ID}&_=${GITHUB_RUN_ID}" -o /tmp/full.json
          node - <<'NODE'
          const j=require('/tmp/full.json');
          if(j.ok!==true) throw Error(JSON.stringify(j));
          const books=Array.isArray(j?.fullOdds?.bookmakers)?j.fullOdds.bookmakers:[];
          if(books.length!==19) throw Error(`books=${books.length}`);
          console.log('FULL_MARKET_ODDS_PASS',j.fixtureId,books.length,j.config?.mode,j.cached,j.stale);
          NODE

          curl -fsS --max-time 30 "$BALL46_URL/api/hub/health?_=${GITHUB_RUN_ID}" -o /tmp/hub.json
          node - <<'NODE'
          const h=require('/tmp/hub.json');
          if(h.ok!==true||h.component!=='5USD_HUB') throw Error(JSON.stringify(h));
          console.log('HUB_UNCHANGED_PASS',h.version,h.fixtureCount,h.refreshMs);
          NODE

          curl -fsS --max-time 25 "$BALL46_URL/5usd-control.html?_=${GITHUB_RUN_ID}" -o /tmp/control.html
          grep -Fq '5USD CONTROL' /tmp/control.html
          grep -Fq '/api/full-market/settings' /tmp/control.html
          grep -Fq '/api/hub/health' /tmp/control.html
          echo 'BALL46_5USD_CONTROL_END_TO_END_PASS'

      - name: Roll back Ball46 wrapper on verification failure
        if: failure() && steps.verify.outcome == 'failure'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          rm -rf rollback/nomad-live-343
          cp -a candidate-ui/nomad-live-343 rollback/nomad-live-343
          cd rollback/workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc
          echo 'BALL46_WRAPPER_ROLLBACK_DEPLOYED'
