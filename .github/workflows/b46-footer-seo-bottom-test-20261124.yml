name: BALL46 SEO footer at bottom responsive isolated test
on:
  push:
    branches: [test/ball46-footer-seo-bottom-20261124]
    paths:
      - '.github/workflows/b46-footer-seo-bottom-test-20261124.yml'
      - 'qa/footer-seo-bottom-20261124/**'
permissions: {contents: read}
concurrency:
  group: b46-footer-bottom-test
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check qa/footer-seo-bottom-20261124/worker.mjs
          node --check qa/footer-seo-bottom-20261124/qa.mjs
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Deploy isolated TEST worker only
        run: npx --yes wrangler@4.50.0 deploy --config qa/footer-seo-bottom-20261124/wrangler.toml
      - name: Verify desktop/mobile footer location and SEO links
        run: node qa/footer-seo-bottom-20261124/qa.mjs
