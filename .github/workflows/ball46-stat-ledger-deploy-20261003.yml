name: ONE SHOT - Ball46 Signal Statistics Ledger 20261003

on:
  push:
    branches: ['ops/ball46-stat-ledger-20261003']
    paths:
      - '.github/workflows/ball46-stat-ledger-deploy-20261003.yml'

permissions:
  contents: read

concurrency:
  group: ball46-engine-production
  cancel-in-progress: false

env:
  ENGINE_NAME: nomadtips3-engine-343
  ENGINE_URL: https://nomadtips3-engine-343.mccarey-supon.workers.dev
  BALL46_DIRECT: https://ball46-production.mccarey-supon.workers.dev
  PUBLIC_URL: https://www.ball46.com
  SNAPSHOT_MODULE: .audit/ball46-stat-ledger-20261003/live-modules/index-bulk-recovery.js
  SNAPSHOT_SHA256: 531e87cbefb93749bd028014efa77f5b1b506eeb107e6f34cdf814e7f56adaf8
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}

jobs:
  deploy-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ball46-stat-ledger-20261003
          fetch-depth: 1

      - name: Preflight exact current Production and restore point
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SNAPSHOT_MODULE"
          [ "$(sha256sum "$SNAPSHOT_MODULE" | awk '{print $1}')" = "$SNAPSHOT_SHA256" ] || { echo SNAPSHOT_SHA_MISMATCH; exit 1; }
          mkdir -p /tmp/b46-ledger/{before,worker,after}
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, urllib.request
          root=pathlib.Path('/tmp/b46-ledger')
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']; worker=os.environ['ENGINE_NAME']
          if not account or not token: raise SystemExit('MISSING_CLOUDFLARE_CREDENTIALS')
          h={'Authorization':f'Bearer {token}','Accept':'application/json'}; api=f'https://api.cloudflare.com/client/v4/accounts/{account}'
          def getj(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=30) as r: j=json.load(r)
              if isinstance(j,dict) and j.get('success') is False: raise SystemExit('CF_API_FAIL:'+json.dumps(j)[:800])
              return j
          deps=getj(f'{api}/workers/scripts/{worker}/deployments')['result']['deployments']
          if not deps: raise SystemExit('NO_CURRENT_ENGINE_DEPLOYMENT')
          versions=deps[0].get('versions') or []
          active=[str(v['version_id']) for v in versions if v.get('version_id') and float(v.get('percentage',0))>=99.999]
          if len(active)!=1: raise SystemExit('ACTIVE_VERSION_AMBIGUOUS:'+repr(active))
          vid=active[0]; ver=getj(f'{api}/workers/workers/{worker}/versions/{vid}?include=modules')['result']
          mods=ver.get('modules') or []
          if len(mods)!=1 or not mods[0].get('content_base64'): raise SystemExit('LIVE_MODULE_SHAPE_CHANGED')
          raw=base64.b64decode(mods[0]['content_base64']); sha=hashlib.sha256(raw).hexdigest()
          expected=os.environ['SNAPSHOT_SHA256']
          if sha!=expected: raise SystemExit(f'PRODUCTION_SOURCE_MOVED:{sha}!={expected}')
          if ver.get('main_module')!='index-bulk-recovery.js': raise SystemExit('MAIN_MODULE_MOVED:'+repr(ver.get('main_module')))
          if ver.get('compatibility_date')!='2026-09-09' or (ver.get('compatibility_flags') or []): raise SystemExit('COMPAT_CONFIG_MOVED')
          actual=sorted([{k:b.get(k) for k in ('name','type','service','environment','class_name','namespace_id') if b.get(k) is not None} for b in (ver.get('bindings') or [])],key=lambda x:x.get('name',''))
          names={x.get('name'):x for x in actual}
          if names.get('ENGINE',{}).get('class_name')!='Nomad343Engine' or names.get('ENGINE',{}).get('type')!='durable_object_namespace': raise SystemExit('ENGINE_BINDING_MOVED:'+json.dumps(actual))
          if names.get('HUB',{}).get('service')!='nomadtips3-5usd-hub-343': raise SystemExit('HUB_BINDING_MOVED:'+json.dumps(actual))
          if names.get('FULL_MARKET',{}).get('service')!='nomadtips3-full-market-343-ball46': raise SystemExit('FULL_MARKET_BINDING_MOVED:'+json.dumps(actual))
          if names.get('FIVEDOLLAR_API_KEY',{}).get('type')!='secret_text': raise SystemExit('SECRET_BINDING_MISSING')
          root.joinpath('before/live-index.js').write_bytes(raw)
          root.joinpath('before/version.txt').write_text(vid)
          root.joinpath('before/meta.json').write_text(json.dumps({'version':vid,'sha256':sha,'main_module':ver.get('main_module'),'bindings':actual},indent=2,sort_keys=True))
          print('PRODUCTION_LOCK_OK',vid,sha)
          PY
          echo "PRE_ENGINE_VERSION=$(cat /tmp/b46-ledger/before/version.txt)" >> "$GITHUB_ENV"

          nonce="${GITHUB_RUN_ID}-pre-$(date +%s%N)"
          for p in index.html signal.html statistics.html ball46-logo.svg; do
            curl -fsS -L --retry 4 --retry-all-errors --max-time 30 "$BALL46_DIRECT/$p?ledger=$nonce-$RANDOM" -o "/tmp/b46-ledger/before/${p//\//_}"
          done
          for ep in health signals statistics; do
            curl -fsS -L --retry 4 --retry-all-errors --max-time 30 "$ENGINE_URL/$ep?ledger=$nonce-$RANDOM" -o "/tmp/b46-ledger/before/$ep.json"
          done
          node - <<'NODE' >> "$GITHUB_ENV"
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/b46-ledger/before/health.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/b46-ledger/before/signals.json'));
          const t=JSON.parse(fs.readFileSync('/tmp/b46-ledger/before/statistics.json'));
          if(h?.ok!==true||s?.ok!==true||t?.ok!==true||!Array.isArray(s?.signals)||!Array.isArray(t?.rows))throw Error('PRE_API_UNHEALTHY');
          if(Number(s?.allCount)!==Number(t?.rows?.length+s?.signals?.length)) throw Error('PRE_WORKING_SET_ACCOUNTING_MOVED');
          console.log('PRE_SETTLED='+t.rows.length);
          console.log('PRE_WORKING_TOTAL='+s.allCount);
          console.log('PRE_PENDING='+s.signals.length);
          console.error('PRE_STATE',{settled:t.rows.length,pending:s.signals.length,workingTotal:s.allCount,version:h.version});
          NODE
          for p in index.html signal.html statistics.html ball46-logo.svg; do echo "PRE_${p//[^A-Za-z0-9]/_}_SHA=$(sha256sum "/tmp/b46-ledger/before/${p//\//_}"|awk '{print $1}')" >> "$GITHUB_ENV"; done

      - name: Build surgical persistent ledger patch from exact live module
        shell: bash
        run: |
          set -euo pipefail
          cp "$SNAPSHOT_MODULE" /tmp/b46-ledger/worker/index-bulk-recovery.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/b46-ledger/worker/index-bulk-recovery.js'); s=p.read_text()
          start='var Nomad343Engine2 = class extends Nomad343Engine {'
          end='};\nfunction stub(env) {'
          a=s.find(start); b=s.find(end,a)
          if a<0 or b<0: raise SystemExit('BRIDGE_CLASS_ANCHOR_MISSING')
          new=r'''var STAT_LEDGER_PREFIX = "stat:v1:";
var STAT_LEDGER_VERSION = "signal-ledger-v1";
var Nomad343Engine2 = class extends Nomad343Engine {
  static {
    __name(this, "Nomad343Engine");
  }
  async writeLedgerBatch(entries) {
    for (let i = 0; i < entries.length; i += 64) {
      const batch = Object.fromEntries(entries.slice(i, i + 64));
      if (Object.keys(batch).length) await this.ctx.storage.put(batch);
    }
  }
  async syncStatisticsLedger(finalFixture = null) {
    const signals = await this.ctx.storage.get("signals") || [];
    const board = await this.ctx.storage.get("board") || { fixtures: [] };
    const fixtureMap = new Map((board.fixtures || []).map((f) => [String(f?.fixtureId ?? f?.id ?? ""), f]));
    if (finalFixture?.fixtureId) fixtureMap.set(String(finalFixture.fixtureId), finalFixture);
    const writes = [];
    let workingChanged = false;
    const at = now2();
    for (const sig of signals) {
      if (!sig?.id) continue;
      const f = fixtureMap.get(String(sig.fixtureId));
      const row = clone2(sig);
      if (f) {
        const minute = num3(f?.minute);
        if (minute !== null) row.currentMinute = minute;
        if (f?.goals != null) row.currentScore = clone2(f.goals);
        if (f?.corners != null) row.currentCorners = clone2(f.corners);
        if (f?.cards != null) row.currentCards = clone2(f.cards);
        row.liveStatus = f?.boardState ?? f?.status ?? f?.statusCode ?? row.liveStatus ?? null;
        row.lastLiveAt = at;
      } else if (row.status === "SETTLED") {
        row.currentScore = clone2(row.finalScore ?? row.currentScore ?? row.scoreAt ?? row.entryScore);
        row.currentCorners = clone2(row.finalCorners ?? row.currentCorners ?? row.entryCorners);
        row.currentCards = clone2(row.finalCards ?? row.currentCards ?? row.entryCards);
        row.liveStatus = "finished";
      } else {
        row.currentMinute = row.currentMinute ?? row.minute ?? row.entryMinute ?? null;
        row.currentScore = clone2(row.currentScore ?? row.scoreAt ?? row.entryScore);
        row.currentCorners = clone2(row.currentCorners ?? row.entryCorners);
        row.currentCards = clone2(row.currentCards ?? row.entryCards);
        row.liveStatus = row.liveStatus ?? "live";
      }
      const marker = JSON.stringify([row.status,row.result,row.settledAt,row.currentMinute,row.currentScore,row.currentCorners,row.currentCards,row.liveStatus]);
      if (sig._statLedgerMarker !== marker) {
        row.statisticsLedgerVersion = STAT_LEDGER_VERSION;
        delete row._statLedgerMarker;
        writes.push([STAT_LEDGER_PREFIX + String(sig.id), row]);
        sig.currentMinute = row.currentMinute;
        sig.currentScore = clone2(row.currentScore);
        sig.currentCorners = clone2(row.currentCorners);
        sig.currentCards = clone2(row.currentCards);
        sig.liveStatus = row.liveStatus;
        sig.lastLiveAt = row.lastLiveAt ?? sig.lastLiveAt ?? null;
        sig._statLedgerMarker = marker;
        workingChanged = true;
      }
    }
    await this.writeLedgerBatch(writes);
    if (workingChanged) await this.ctx.storage.put("signals", signals.slice(-MAX_SIGNALS2));
    return { ok: true, version: STAT_LEDGER_VERSION, workingSignals: signals.length, writes: writes.length };
  }
  async readStatisticsLedger() {
    const rows = [];
    let start = void 0;
    for (let page = 0; page < 200; page++) {
      const opts = { prefix: STAT_LEDGER_PREFIX, limit: 1000 };
      if (start !== void 0) opts.start = start;
      const found = await this.ctx.storage.list(opts);
      if (!found.size) break;
      let last = null;
      for (const [key, value] of found) {
        last = key;
        if (value && typeof value === "object") rows.push(value);
      }
      if (found.size < 1000 || !last) break;
      start = last + "\u0000";
    }
    return rows;
  }
  async ledgerStatisticsResponse() {
    const all = await this.readStatisticsLedger();
    const core = statsFrom(all);
    const liveRows = all.filter((x) => x?.status === "PENDING").sort((a,b)=>(b?.createdAt||0)-(a?.createdAt||0));
    return { ok:true, version:VERSION, settlementRevision:SETTLEMENT_REVISION, markets:MARKET_RULES, statisticsLedgerVersion:STAT_LEDGER_VERSION, ledgerTotal:all.length, pending:liveRows.length, liveRows, ...core };
  }
  async scan() {
    const meta = await super.scan();
    if (meta?.ok) {
      const ledger = await this.syncStatisticsLedger();
      return { ...meta, statisticsLedgerVersion: STAT_LEDGER_VERSION, ledgerWrites: ledger.writes };
    }
    return meta;
  }
  async reconcileExternalFinal(request) {
    if (!secureTokenOk(request, this.env)) return Response.json({ ok: false, error: "UNAUTHORIZED" }, { status: 401 });
    const body = await request.json().catch(() => null);
    const fixture = normalizeFinalFixture(body?.fixture ?? body);
    if (!fixture) return Response.json({ ok: false, error: "INVALID_FIXTURE_PAYLOAD" }, { status: 400 });
    if (!isFinished2(fixture) && !isHalfComplete2(fixture)) return Response.json({ ok: true, version: BRIDGE_VERSION, fixtureId: fixture.fixtureId, state: "NOT_FINAL", settled: 0 });
    const signals = await this.ctx.storage.get("signals") || [];
    const changed = [];
    for (const sig of signals) {
      if (sig?.status !== "PENDING" || String(sig?.fixtureId) !== fixture.fixtureId || !periodComplete(sig, fixture)) continue;
      const result = settleMarketSignal(sig, fixture);
      if (!result) continue;
      sig.status = "SETTLED";
      sig.result = result;
      sig.finalScore = clone2(fixture.goals);
      sig.finalCorners = clone2(fixture.corners);
      sig.finalCards = clone2(fixture.cards);
      sig.settledAt = now2();
      sig.settlementError = null;
      sig.settlementSource = "EXTERNAL_FINAL_BRIDGE";
      changed.push({ id: sig.id, market: sig.market, selection: sig.selection, line: sig.line, result: sig.result, finalScore: sig.finalScore, finalCorners: sig.finalCorners });
    }
    if (changed.length) await this.ctx.storage.put("signals", signals.slice(-MAX_SIGNALS2));
    const ledger = await this.syncStatisticsLedger(fixture);
    return Response.json({ ok: true, version: BRIDGE_VERSION, statisticsLedgerVersion:STAT_LEDGER_VERSION, fixtureId: fixture.fixtureId, finished: isFinished2(fixture), settled: changed.length, ledgerWrites:ledger.writes, rows: changed });
  }
  async fetch(request) {
    const u = new URL(request.url);
    if (u.pathname === "/reconcile-final" && request.method === "POST") return this.reconcileExternalFinal(request);
    if (u.pathname === "/bridge-health" && request.method === "GET") return Response.json({ ok: true, version: BRIDGE_VERSION, statisticsLedgerVersion:STAT_LEDGER_VERSION });
    if (u.pathname === "/ledger-sync" && request.method === "POST") {
      if (!secureTokenOk(request, this.env)) return Response.json({ok:false,error:"UNAUTHORIZED"},{status:401});
      const sync = await this.syncStatisticsLedger();
      const stats = await this.ledgerStatisticsResponse();
      return Response.json({...sync,total:stats.total,ledgerTotal:stats.ledgerTotal,pending:stats.pending});
    }
    if (u.pathname === "/ledger-health" && request.method === "GET") {
      const stats = await this.ledgerStatisticsResponse();
      return Response.json({ok:true,version:STAT_LEDGER_VERSION,total:stats.total,ledgerTotal:stats.ledgerTotal,pending:stats.pending});
    }
    if (u.pathname === "/statistics" && request.method === "GET") {
      await this.scanIfDue();
      await this.syncStatisticsLedger();
      return Response.json(await this.ledgerStatisticsResponse());
    }
    return super.fetch(request);
  }
'''
          s=s[:a]+new+s[b:]
          old='["/health", "/registry", "/settings", "/scan", "/board", "/signals", "/statistics", "/history", "/fixture-odds", "/referee", "/reconcile-final", "/bridge-health"]'
          newpaths='["/health", "/registry", "/settings", "/scan", "/board", "/signals", "/statistics", "/history", "/fixture-odds", "/referee", "/reconcile-final", "/bridge-health", "/ledger-sync", "/ledger-health"]'
          if s.count(old)!=1: raise SystemExit('ROUTER_ALLOWLIST_ANCHOR_COUNT:'+str(s.count(old)))
          s=s.replace(old,newpaths,1)
          p.write_text(s)
          print('PATCH_OK',len(s))
          PY
          node --check /tmp/b46-ledger/worker/index-bulk-recovery.js
          grep -Fq 'var STAT_LEDGER_VERSION = "signal-ledger-v1";' /tmp/b46-ledger/worker/index-bulk-recovery.js
          grep -Fq 'statisticsLedgerVersion:STAT_LEDGER_VERSION' /tmp/b46-ledger/worker/index-bulk-recovery.js
          grep -Fq 'STAT_LEDGER_PREFIX + String(sig.id)' /tmp/b46-ledger/worker/index-bulk-recovery.js
          grep -Fq 'entryScore' /tmp/b46-ledger/worker/index-bulk-recovery.js
          grep -Fq 'currentScore' /tmp/b46-ledger/worker/index-bulk-recovery.js
          [ "$(grep -c 'var MAX_SIGNALS = 1600;' /tmp/b46-ledger/worker/index-bulk-recovery.js)" = 1 ]
          echo PATCH_STATIC_GUARDS_PASS

          cat > /tmp/b46-ledger/worker/wrangler.toml <<'TOML'
          name = "nomadtips3-engine-343"
          main = "index-bulk-recovery.js"
          compatibility_date = "2026-09-09"
          workers_dev = true

          [observability]
          enabled = true

          [triggers]
          crons = ["* * * * *"]

          [[services]]
          binding = "HUB"
          service = "nomadtips3-5usd-hub-343"

          [[services]]
          binding = "FULL_MARKET"
          service = "nomadtips3-full-market-343-ball46"

          [[durable_objects.bindings]]
          name = "ENGINE"
          class_name = "Nomad343Engine"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["Nomad343Engine"]
          TOML

      - name: Dry run exact Engine patch
        working-directory: /tmp/b46-ledger/worker
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.toml

      - name: Deploy persistent statistics ledger only
        id: deploy
        working-directory: /tmp/b46-ledger/worker
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.toml

      - name: Migrate accessible working set and verify Production
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          [ -n "${FIVEDOLLAR_API_KEY:-}" ] || { echo MISSING_SETTLEMENT_SECRET; exit 1; }
          sync_code=$(curl -sS -L --retry 4 --retry-all-errors --max-time 30 -o /tmp/b46-ledger/after/ledger-sync.json -w '%{http_code}' -X POST -H "x-settlement-token: $FIVEDOLLAR_API_KEY" "$ENGINE_URL/ledger-sync")
          [ "$sync_code" = 200 ] || { echo LEDGER_SYNC_HTTP_$sync_code; cat /tmp/b46-ledger/after/ledger-sync.json; exit 1; }
          nonce="${GITHUB_RUN_ID}-post-$(date +%s%N)"
          for ep in health signals statistics ledger-health bridge-health; do
            curl -fsS -L --retry 4 --retry-all-errors --max-time 30 "$ENGINE_URL/$ep?ledger=$nonce-$RANDOM" -o "/tmp/b46-ledger/after/$ep.json"
          done
          curl -fsS -L --retry 4 --retry-all-errors --max-time 30 "$PUBLIC_URL/api/engine/statistics?ledger=$nonce" -o /tmp/b46-ledger/after/public-statistics.json
          node - <<'NODE'
          const fs=require('fs');
          const pre=JSON.parse(fs.readFileSync('/tmp/b46-ledger/before/statistics.json'));
          const ps=JSON.parse(fs.readFileSync('/tmp/b46-ledger/before/signals.json'));
          const sync=JSON.parse(fs.readFileSync('/tmp/b46-ledger/after/ledger-sync.json'));
          const h=JSON.parse(fs.readFileSync('/tmp/b46-ledger/after/health.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/b46-ledger/after/signals.json'));
          const t=JSON.parse(fs.readFileSync('/tmp/b46-ledger/after/statistics.json'));
          const lh=JSON.parse(fs.readFileSync('/tmp/b46-ledger/after/ledger-health.json'));
          const b=JSON.parse(fs.readFileSync('/tmp/b46-ledger/after/bridge-health.json'));
          const pub=JSON.parse(fs.readFileSync('/tmp/b46-ledger/after/public-statistics.json'));
          if(h?.ok!==true||s?.ok!==true||t?.ok!==true||lh?.ok!==true||b?.ok!==true||pub?.ok!==true)throw Error('POST_CORE_API_BAD');
          if(t?.statisticsLedgerVersion!=='signal-ledger-v1'||lh?.version!=='signal-ledger-v1'||b?.statisticsLedgerVersion!=='signal-ledger-v1')throw Error('LEDGER_MARKER_MISSING');
          if(!Array.isArray(t?.rows)||!Array.isArray(t?.liveRows))throw Error('LEDGER_STATS_SHAPE_BAD');
          if(Number(t.total)!==t.rows.length)throw Error('TOTAL_ROW_MISMATCH');
          if(Number(t.total)<Number(pre.rows.length))throw Error(`SETTLED_REGRESSION:${t.total}<${pre.rows.length}`);
          if(Number(t.ledgerTotal)<Number(ps.allCount))throw Error(`MIGRATION_INCOMPLETE:${t.ledgerTotal}<${ps.allCount}`);
          if(Number(pub.total)!==Number(t.total)||Number(pub.ledgerTotal)!==Number(t.ledgerTotal))throw Error('PUBLIC_DIRECT_STATS_MISMATCH');
          const immutableBad=t.liveRows.filter(x=>x.entryScore===undefined||x.entryMinute===undefined||x.currentScore===undefined||x.currentMinute===undefined);
          if(immutableBad.length)throw Error('LIVE_LEDGER_FIELDS_MISSING:'+immutableBad.slice(0,3).map(x=>x.id).join(','));
          console.log('LEDGER_VERIFY_PASS',{preSettled:pre.rows.length,postSettled:t.total,ledgerTotal:t.ledgerTotal,pending:t.pending,syncWrites:sync.writes});
          NODE

          for p in index.html signal.html statistics.html ball46-logo.svg; do
            curl -fsS -L --retry 4 --retry-all-errors --max-time 30 "$BALL46_DIRECT/$p?ledger=$nonce-$RANDOM" -o "/tmp/b46-ledger/after/${p//\//_}"
            before=$(sha256sum "/tmp/b46-ledger/before/${p//\//_}"|awk '{print $1}')
            after=$(sha256sum "/tmp/b46-ledger/after/${p//\//_}"|awk '{print $1}')
            [ "$before" = "$after" ] || { echo FRONTEND_CHANGED_$p; exit 1; }
          done
          echo FRONTEND_UNTOUCHED_PASS

          sleep 65
          nonce="${GITHUB_RUN_ID}-stability-$(date +%s%N)"
          curl -fsS -L --retry 4 --retry-all-errors --max-time 30 "$ENGINE_URL/statistics?ledger=$nonce" -o /tmp/b46-ledger/after/statistics-stability.json
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/b46-ledger/after/statistics.json'));
          const b=JSON.parse(fs.readFileSync('/tmp/b46-ledger/after/statistics-stability.json'));
          if(b?.ok!==true||b?.statisticsLedgerVersion!=='signal-ledger-v1')throw Error('STABILITY_API_BAD');
          if(Number(b.total)<Number(a.total))throw Error(`TOTAL_DECREASED_AFTER_SCAN:${a.total}->${b.total}`);
          if(Number(b.ledgerTotal)<Number(a.ledgerTotal))throw Error(`LEDGER_DECREASED:${a.ledgerTotal}->${b.ledgerTotal}`);
          console.log('STABILITY_PASS',{firstTotal:a.total,laterTotal:b.total,firstLedger:a.ledgerTotal,laterLedger:b.ledgerTotal});
          NODE

      - name: Roll back exact Engine version on verification failure
        if: failure() && steps.deploy.outcome == 'success' && steps.verify.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${PRE_ENGINE_VERSION:-}" ]
          npx --yes wrangler@4.92.0 versions deploy "$PRE_ENGINE_VERSION@100%" --name "$ENGINE_NAME" -y --message "Auto rollback Ball46 statistics ledger verification $GITHUB_RUN_ID"

      - name: Final Production version evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deployments status --name "$ENGINE_NAME" --json > /tmp/b46-ledger/after/deployment.json
          node - <<'NODE'
          const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/b46-ledger/after/deployment.json'));
