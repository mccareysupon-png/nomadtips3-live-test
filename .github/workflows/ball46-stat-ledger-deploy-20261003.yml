name: ONE SHOT - Ball46 Signal Statistics Ledger 20261003

on:
  push:
    branches:
      - ops/ball46-stat-ledger-20261003
    paths:
      - .github/workflows/ball46-stat-ledger-deploy-20261003.yml
      - .github/scripts/ball46_stat_ledger_deploy_20261003.sh
      - .github/scripts/ball46_stat_ledger_patch_20261003.py

permissions:
  contents: read

concurrency:
  group: ball46-engine-production
  cancel-in-progress: false

jobs:
  deploy-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ball46-stat-ledger-20261003
          fetch-depth: 1
      - name: Deploy and verify persistent statistics ledger
        shell: bash
        run: bash .github/scripts/ball46_stat_ledger_deploy_20261003.sh
