name: Audit remaining 341 provider cron and paused workers
on:
  push:
    branches: [fix/ball46-john-single-pricing-cron-20261017]
    paths: [.github/workflows/audit-legacy-341-5usd-cron-20261017.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Inspect old worker source without editing
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          const a=process.env.CLOUDFLARE_ACCOUNT_ID,t=process.env.CLOUDFLARE_API_TOKEN;
          async function cf(path){const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+a+'/workers/'+path,{headers:{Authorization:'Bearer '+t},signal:AbortSignal.timeout(19000)});const j=await r.json();if(!j.success)throw Error(r.status+' '+JSON.stringify(j.errors).slice(0,140));return j.result}
          for(const w of ['nomadtips3-341-5usd-staged','nomadtips3-343-auto-engine','nomadtips3-rich-odds-343']){
            try{
              const deps=await cf('scripts/'+w+'/deployments?per_page=1');const id=deps.deployments[0].versions.find(x=>x.percentage===100)?.version_id;
              const ver=await cf('workers/'+w+'/versions/'+id+'?include=modules');
              const s=Buffer.from(ver.modules.find(x=>x.name===ver.main_module).content_base64,'base64').toString();
              const marks=['async scheduled(','scheduled(_event','providerRequest','api.5dollarfootballapi.com','/fixtures/','/odds','/scan','FIVEUSD_API_KEY','FIVEDOLLAR_API_KEY','pause_default'];
              console.log('OLD_WORKER_META '+JSON.stringify({worker:w,id,main:ver.main_module,length:s.length,codeMarkers:Object.fromEntries(marks.map(k=>[k,s.indexOf(k)]))}));
              const term=s.lastIndexOf('async scheduled(');
              console.log('OLD_WORKER_SCHEDULED '+JSON.stringify({worker:w,snippet:term<0?null:s.slice(term,term+800)}));
              const p=s.indexOf('api.5dollarfootballapi.com');
              if(p>=0)console.log('OLD_WORKER_PROVIDER '+JSON.stringify({worker:w,snippet:s.slice(Math.max(0,p-130),p+340)}));
              const hs=await fetch('https://'+w+'.mccarey-supon.workers.dev/health?view='+Date.now(),{signal:AbortSignal.timeout(15000)});
              const hj=await hs.json().catch(()=>({}));
              console.log('OLD_WORKER_HEALTH '+JSON.stringify({worker:w,http:hs.status,version:hj.version,paused:hj.paused,lastError:hj.lastError||hj.error,providerCalls60s:hj.providerCalls60s}));
            }catch(e){console.log('OLD_WORKER_ERROR '+w+' '+String(e.message))}
          }
          NODE
