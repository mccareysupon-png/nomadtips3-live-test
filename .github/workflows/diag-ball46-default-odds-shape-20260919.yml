name: Diagnose Ball46 Default Odds Shape 20260919
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-ball46-default-odds-shape-20260919.yml']
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Browser verify rendered default odds
        shell: bash
        run: |
          set -euo pipefail
          echo "Chrome: $(google-chrome --version || true)"
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1440,1200 --virtual-time-budget=15000 --dump-dom "https://ball46.com/?diag=${GITHUB_RUN_ID}" > /tmp/dom.html
          echo DOM_BYTES=$(wc -c </tmp/dom.html)
          grep -Fq 'data-board' /tmp/dom.html
          python - <<'PY'
          from pathlib import Path
          import re, html
          s=Path('/tmp/dom.html').read_text(errors='replace')
          rows=re.findall(r'<div[^>]+class="[^"]*match-row[^"]*"[^>]+data-match-id="([^"]+)"[^>]*>(.*?)</div>\s*</div>',s,re.S)
          print('MATCH_ROW_CANDIDATES',len(rows))
          # More robust scan by market-cell text across full DOM.
          cells=re.findall(r'<div[^>]+class="[^"]*market-cell[^"]*"[^>]*>(.*?)</div>',s,re.S)
          clean=[]
          for c in cells[:60]:
            t=re.sub(r'<[^>]+>',' ',c)
            t=html.unescape(re.sub(r'\s+',' ',t)).strip()
            clean.append(t)
          print('MARKET_CELLS_SAMPLE',clean[:24])
          ah=[x for x in clean if x.startswith('AH ') or ' AH ' in x]
          ou=[x for x in clean if x.startswith('O/U ') or 'O/U' in x]
          one=[x for x in clean if x.startswith('1X2 ') or '1X2' in x]
          print('RENDER_COUNTS',{'1x2':len(one),'ah':len(ah),'ou':len(ou)})
          print('AH_SAMPLE',ah[:5])
          print('OU_SAMPLE',ou[:5])
          if not ah or not ou:
            print('DEFAULT_ODDS_RENDER_INCOMPLETE')
            raise SystemExit(22)
          # Require at least one price-like token after AH/O-U, not only a bare dash.
          price=re.compile(r'(?<!\d)(?:1\.\d{1,3}|2\.\d{1,3}|3\.\d{1,3}|[4-9]\.\d{1,3}|\d{2,3}\.\d{1,3})(?!\d)')
          if not any(price.search(x) for x in ah):
            print('AH_PRICE_NOT_RENDERED')
            raise SystemExit(23)
          if not any(price.search(x) for x in ou):
            print('OU_PRICE_NOT_RENDERED')
            raise SystemExit(24)
          print('DEFAULT_ODDS_BROWSER_PASS')
          PY