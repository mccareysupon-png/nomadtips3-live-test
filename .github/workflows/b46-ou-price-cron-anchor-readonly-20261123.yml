name: BALL46 O/U TEST cron anchor inspection READONLY
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-ou-price-cron-anchor-readonly-20261123.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Exact active main guarded cron and method anchor inspection
        run: |
          node --input-type=module <<'JS'
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers';
          const h={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const a=await fetch(root+'/workers/ball46-prematch-only-test-20261120/versions/5254176c-4280-4a68-9fad-3483eeda883f?include=modules',{headers:h}).then(r=>r.json());
          if(!a.success)throw Error('FETCH_FAILED');
          const src=Buffer.from(a.result.modules.find(x=>x.name===a.result.main_module).content_base64,'base64').toString();
          const checks={
            class:src.includes('class PrematchStore extends DurableObject'),
            closed:src.includes("return {state:'BTTS_PROJECT_CLOSED',providerCalls:0,productionWrites:0}"),
            ouCycle:src.includes("path==='/ou-cycle-test'&&req.method==='POST'"),
            bttsCron:src.includes("const b=await stub.fetch('https://prematch.internal/btts-cycle-test'"),
            ownerOuComment:src.includes('   // O/U MODEL-ONLY research: no paid odds; separate durable prediction ledger.'),
            leagueMethod:src.includes(' async rememberLeagueCatalog(snapshot){'),
            oldConstructor:src.includes('initOu(this.db);initBttsPricePickup(this.db)}')
          };
          const part=src.slice(src.indexOf('export default {async scheduled'),src.indexOf('export default {async scheduled')+4000);
          console.log('OU_CRON_ACTIVE '+JSON.stringify({checks,scheduled:part}));
          JS
