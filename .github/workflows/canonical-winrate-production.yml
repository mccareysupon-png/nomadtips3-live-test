name: BALL46 owner-approved canonical Win Rate release
on:
  push:
    branches: [release/ball46-canonical-winrate-20261120]
    paths: ['.github/workflows/canonical-winrate-production.yml']
permissions:
  contents: read
concurrency:
  group: ball46-production-ui-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release and prepare browser
        run: |
          node --check qa/winrate-canonical-20261120/production-release.mjs
          node --check qa/winrate-canonical-20261120/production-wrapper.mjs
          npm install --prefix qa/winrate-canonical-20261120/.runtime --no-audit --no-fund playwright@1.55.0
          qa/winrate-canonical-20261120/.runtime/node_modules/.bin/playwright install chromium --only-shell
      - name: Verify and release receiver formula and exact frontend only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node qa/winrate-canonical-20261120/production-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-winrate-proof
          path: ${{ runner.temp }}/canonical-winrate-proof
          if-no-files-found: ignore
