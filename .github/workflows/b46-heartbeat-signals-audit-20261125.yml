name: BALL46 TEST read-only 15-minute signals heartbeat audit 20261125
on:
  push:
    branches: [feature/ball46-adaptive-manual-control-test-20261125]
    paths: [.github/workflows/b46-heartbeat-signals-audit-20261125.yml]
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read public TEST frontend service-bound Adaptive and match signal snapshots
        run: |
          node --input-type=module <<'JS'
          const frontend='https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev';
          const started=Date.now();
          async function read(path){
            const r=await fetch(frontend+path,{headers:{accept:'application/json'},signal:AbortSignal.timeout(28000),cache:'no-store'});
            const j=await r.json().catch(()=>null);
            if(!r.ok||!j)throw Error('FRONT_DATA_NOT_AVAILABLE_'+path+'_HTTP_'+r.status);
            return j;
          }
          const [fa,native]=await Promise.all([read('/__b46_pm_adaptive_research'),read('/__b46_prematch_data')]);
          const lag=(value)=>{const time=Date.parse(value||'');return Number.isFinite(time)?Math.round((started-time)/60000*10)/10:null};
          const record=fa.records||[];
          const counts=record.reduce((a,r)=>(a[r.status]=(a[r.status]||0)+1,a),{});
          const newest=record.filter(x=>x.picked_at).sort((a,b)=>b.picked_at-a.picked_at)[0];
          console.log('BALL46_FRONTEND_LIVE_CHECK '+JSON.stringify({
            timestampUtc:new Date(started).toISOString(),
            adaptive:{
              keys:Object.keys(fa),
              formulaCount:fa.formulas?.length,
              lastRunAt:fa.lastRunAt||null,
              ageMinutes:lag(fa.lastRunAt),
              cronUpToDate:lag(fa.lastRunAt)!==null&&lag(fa.lastRunAt)>=0&&lag(fa.lastRunAt)<33,
              code:fa.code,legacyOuIssuance:fa.legacyOuIssuance,
              screeningCounts:fa.screeningCounts,
              priced:fa.priced,
              fixtureFeed:fa.fixtureFeed,
              recordCount:record.length,recordStatusCounts:counts,
              newestPick:newest?{at:new Date(Number(newest.picked_at)*1000).toISOString(),formula:newest.formula_id}:null,
              statsSample:fa.formulas?.slice(0,2).map(f=>({formula:f.formula,settled:f.settled,pending:f.pending}))
            },
            otherPrematch:{
              keys:Object.keys(native),
              system:native.system,
              stored:native.stored,
              monitor:native.testMonitor,
              selection:native.selection,
              testLedger:{keys:Object.keys(native.testLedger||{}),count:native.testLedger?.rows?.length},
              bttsLedger:{keys:Object.keys(native.bttsLedger||{}),count:native.bttsLedger?.rows?.length},
              allLedger:{keys:Object.keys(native.allLedger||{}),count:native.allLedger?.rows?.length},
              ouLedger:{keys:Object.keys(native.ouLedger||{}),count:native.ouLedger?.rows?.length}
            },
            readOnly:true
          }));
          if(fa.formulas?.length!==42)process.exitCode=1;
          JS

      - name: Capture recent Adaptive O/U matched records and schema (redacted, read-only)
        run: |
          node --input-type=module <<'JS'
          const url='https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev/__b46_pm_adaptive_research';
          const resp=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(28000)});
          if(!resp.ok)throw Error('ADAPTIVE_DATA_HTTP_'+resp.status);
          const data=await resp.json();
          const all=Array.isArray(data.records)?data.records:[];
          const sorted=all.slice().sort((a,b)=>Number(b.picked_at)-Number(a.picked_at)||Number(b.kickoff)-Number(a.kickoff));
          const current=sorted.slice(0,18).map(r=>({fixture_id:r.fixture_id,formula_id:r.formula_id,home:r.home,away:r.away,kickoff:r.kickoff,picked_at:r.picked_at,selection:r.selection,line:r.line,odds:r.odds,bookmaker:r.bookmaker,odds_source:r.odds_source,status:r.status,hg:r.hg,ag:r.ag}));
          console.log('BALL46_LATEST_PICKS '+JSON.stringify({lastRunAt:data.lastRunAt,latestPickedAt:sorted[0]?.picked_at,latestPickCount:sorted.filter(r=>r.picked_at===sorted[0]?.picked_at).length,records:current,rawCandidateKeys:Object.keys(data.rawCandidates?.[0]||{}),schemaKeys:Object.keys(data)}));
          JS
