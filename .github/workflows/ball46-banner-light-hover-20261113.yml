name: BALL46 PC banner light and hover CSS guarded deploy
on:
  push:
    branches: [codex/ball46-banner-light-hover-20261113]
    paths: ['work/member-banner-light-hover-release-20261113/**','.github/workflows/ball46-banner-light-hover-20261113.yml']
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  images-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: '62cb0db544160e6591342abd6b4f35cc'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated visual verification tools
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund acorn@8.15.0 parse5@7.3.0
          npm install --prefix work/member-banner-light-hover-release-20261113/.runtime --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          work/member-banner-light-hover-release-20261113/.runtime/node_modules/.bin/playwright install --with-deps chromium
      - name: Stage only existing image payload from fresh active Production
        run: node work/member-banner-light-hover-release-20261113/release.mjs stage
      - name: Check image placement and mobile exclusion without Statistics API reads
        run: node work/member-banner-light-hover-release-20261113/browser.mjs candidate
      - name: Activate only after unchanged-module and visual gates pass
        run: node work/member-banner-light-hover-release-20261113/release.mjs activate
      - name: Verify images on active Worker
        run: node work/member-banner-light-hover-release-20261113/browser.mjs production
      - name: Verify active version and all unchanged boundaries
        run: node work/member-banner-light-hover-release-20261113/release.mjs finish
      - name: Restore immediate baseline if any post-activation check fails
        if: failure()
        run: node work/member-banner-light-hover-release-20261113/release.mjs rollback
      - name: Save image-only evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/member-banner-light-hover-release-20261113/qa
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record PC banner CSS-only release evidence [skip ci]'
          git push origin HEAD:codex/ball46-banner-light-hover-20261113
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-banner-light-hover-proof
          path: work/member-banner-light-hover-release-20261113/qa
