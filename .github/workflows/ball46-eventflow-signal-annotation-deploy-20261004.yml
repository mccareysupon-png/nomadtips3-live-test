name: Ball46 Event Flow Signal Annotation Surgical 20261004

on:
  push:
    branches: [work/eventflow-signal-annotation-20261004]
    paths:
      - '.github/workflows/ball46-eventflow-signal-annotation-deploy-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-production-eventflow-signal-annotation
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  DEPLOY_ENABLED: 'true'

jobs:
  surgical-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy edge-aware Event Flow Signal annotation from exact current Production with convergence guard
        working-directory: deploy-assets/eventflow-signal-annotation-20261004
        run: node run-convergent.mjs
      - name: Retain surgical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-eventflow-signal-annotation-${{ github.run_id }}
          path: deploy-assets/eventflow-signal-annotation-20261004/audit/
          if-no-files-found: error
          retention-days: 30
