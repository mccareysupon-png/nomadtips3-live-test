name: READ ONLY - Ball46 Scorebar Refresh Baseline 20260928

on:
  push:
    branches:
      - ops/ball46-scorebar-6x4-surgical-20260928
    paths:
      - '.github/workflows/ball46-scorebar-refresh-baseline-20260928.yml'

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh current Production baseline read-only
        shell: bash
        run: bash .github/scripts/ball46_scorebar_refresh_baseline_20260928.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-scorebar-refresh-baseline-${{ github.run_id }}
          path: /tmp/b46-scorebar-refresh
          if-no-files-found: ignore
          retention-days: 30
