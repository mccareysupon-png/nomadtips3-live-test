name: BALL46 V13 Compare Version Assets & Bindings — Read Only
on:
  push:
    branches: [fix/ball46-featured-flag-flicker-v13-20261022]
    paths:
      - '.github/workflows/ball46-v13-assets-bindings-readonly.yml'
      - 'deploy-assets/featured-flicker-v13/inspect-worker-config.mjs'
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node deploy-assets/featured-flicker-v13/inspect-worker-config.mjs