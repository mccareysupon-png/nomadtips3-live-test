name: BALL46 Statistics persistent staging — TEST ONLY (no deploy)
on:
  push:
    branches: [test/ball46-statistics-durable-stage-20261114]
    paths:
      - 'work/statistics-read-model-v2-20261114/**'
      - '.github/workflows/ball46-statistics-durable-stage-20261114.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: b46-statistics-persistent-stage
  cancel-in-progress: true
jobs:
  isolated-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks first
        run: |
          node --check work/statistics-read-model-v2-20261114/persisted-read-store.mjs
          node --check work/statistics-read-model-v2-20261114/test-storage.mjs
          node --check work/statistics-read-model-v2-20261114/persisted-read-test.mjs
          node --check work/statistics-read-model-v2-20261114/persisted-preview-server.mjs
          node --check work/statistics-read-model-v2-20261114/persisted-browser.mjs
          node --check work/statistics-read-model-v2-20261114/durable-worker-harness.mjs
          node --check work/statistics-read-model-v2-20261114/actual-do-test.mjs
      - name: Reuse 14998 previously recorded real Ledger rows (never query Production Ledger)
        uses: actions/download-artifact@v4
        with:
          name: ball46-statistics-shadow-proof
          run-id: 43373832113
          github-token: ${{ github.token }}
          path: work/statistics-summary-shadow-20261113/reference/ui-proof
      - name: Pin active Engine and Website source with Cloudflare control-plane READ-ONLY GET
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node work/statistics-summary-shadow-20261113/fresh-source.mjs
          node work/statistics-summary-shadow-20261113/capture-ui.mjs
          mkdir -p work/statistics-summary-shadow-20261113/reference/ui-proof/qa/ui-capture
          cp -r work/statistics-summary-shadow-20261113/qa/ui-capture/. work/statistics-summary-shadow-20261113/reference/ui-proof/qa/ui-capture/
          node work/statistics-summary-shadow-20261113/build-summary-formulas.mjs
      - name: Validate persistent complete-ledger derivation / source formulas / revision / rollback
        run: |
          mkdir -p work/statistics-read-model-v2-20261114/qa
          node --max-old-space-size=4096 work/statistics-read-model-v2-20261114/persisted-read-test.mjs
      - name: Install Playwright for independent PC/mobile Chromium staging
        run: |
          npm install --prefix work/statistics-summary-shadow-20261113/.runtime --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1 miniflare esbuild
          work/statistics-summary-shadow-20261113/.runtime/node_modules/.bin/playwright install --with-deps chromium
      - name: Test actual isolated SQLite Durable Object API and revision race
        run: node --max-old-space-size=4096 work/statistics-read-model-v2-20261114/actual-do-test.mjs
      - name: Real browser flow over persisted 50-row API (PC/mobile, dark/light)
        run: |
          mkdir -p work/statistics-read-model-v2-20261114/qa
          node --max-old-space-size=4096 work/statistics-read-model-v2-20261114/persisted-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-statistics-persistent-stage-evidence
          path: |
            work/statistics-read-model-v2-20261114/qa/
            work/statistics-summary-shadow-20261113/source/active.json
