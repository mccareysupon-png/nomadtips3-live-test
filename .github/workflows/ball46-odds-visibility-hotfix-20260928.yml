name: ONE SHOT - Ball46 Odds Visibility Hotfix 20260928

on:
  push:
    branches:
      - ops/ball46-odds-surgical-20260928
    paths:
      - '.github/workflows/ball46-odds-visibility-hotfix-20260928.yml'

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download exact current Odds deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: ball46-odds-visible-36361291283
          path: /tmp/b46-repair-artifact
          repository: mccareysupon-png/nomadtips3-live-test
          run-id: 36361291283
          github-token: ${{ github.token }}
      - name: Repair Worker module shape without changing current assets
        shell: bash
        run: bash .github/scripts/ball46_repair_runtime_shape_current_20260928.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-odds-runtime-repair-${{ github.run_id }}
          path: /tmp/b46-repair-verify
          if-no-files-found: ignore
          retention-days: 30
