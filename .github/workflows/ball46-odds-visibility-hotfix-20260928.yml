name: ONE SHOT - Ball46 Odds Visibility Hotfix 20260928

on:
  push:
    branches:
      - ops/ball46-odds-surgical-20260928
    paths:
      - '.github/workflows/ball46-odds-visibility-hotfix-20260928.yml'
      - '.github/scripts/ball46_odds_visibility_hotfix_20260928.sh'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reveal Odds control under logo without touching wiring
        shell: bash
        run: bash .github/scripts/ball46_odds_visibility_hotfix_20260928.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-odds-visible-${{ github.run_id }}
          path: /tmp/b46-odds-visible
          if-no-files-found: ignore
          retention-days: 30
