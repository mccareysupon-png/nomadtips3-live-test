name: BALL46 read-only shadow cron registration audit
on:
  workflow_dispatch:
  push:
    branches:
      - stage/ball46-multisource-v5-20261017
    paths:
      - .github/workflows/ball46-shadow-cron-schedule-readonly.yml
permissions:
  contents: read
jobs:
  cron-get-only:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: GET active Cloudflare cron schedule without modifying anything
        run: |
          node - <<'NODE'
          const a=process.env.CLOUDFLARE_ACCOUNT_ID,t=process.env.CLOUDFLARE_API_TOKEN;
          if(!a||!t)throw Error('READ_CREDS_MISSING');
          const name='ball46-multisource-shadow-20261018';
          const url='https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(a)+
           '/workers/scripts/'+name+'/schedules';
          (async()=>{
            const r=await fetch(url,{method:'GET',headers:{Authorization:'Bearer '+t},redirect:'error'});
            const j=await r.json().catch(()=>({}));
            const crons=j.result?.schedules||j.result||[];
            console.log('SHADOW_SCHEDULE_READ_ONLY',JSON.stringify({
              http:r.status,success:j.success===true,
              crons:Array.isArray(crons)?crons.map(x=>x.cron||x):[],writes:0}));
            if(!r.ok||j.success!==true)process.exitCode=1;
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
