name: BALL46 Member ODDS Glass55 V4 — Read Only Preflight
on:
  push:
    branches: [codex/ball46-member-odds-glass55-v4-20261021]
    paths:
      - '.github/workflows/member-odds-glass55-v4-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify only popup background and Member CSS reference change
        run: |
          set -euo pipefail
          node --check ball46-member/member-odds-glass55-v4-20261021/glass55.mjs
          node --check ball46-member/member-odds-glass55-v4-20261021/deploy.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {patchGlass55,CSS,MARKER} from './ball46-member/member-odds-glass55-v4-20261021/glass55.mjs';
          const html='<html>b46-odds-trigger-label<link href="/member-odds-topbar.css?v=20261021-odds-borderless-v3"></html>';
          const css='/* B46_MEMBER_ODDS_BORDERLESS_LABEL_V3_20261021 */';
          const got=patchGlass55({html,css});
          assert.equal(got.html.replace('odds-glass55-v4','odds-borderless-v3'),html,'HTML_BOUNDS');
          assert.equal(got.css,css+'\n'+CSS+'\n','CSS_APPEND_ONLY');
          assert(got.css.includes('rgba(18,38,48,.45)!important')&&got.css.includes('backdrop-filter:blur(10px)'),'55_PERCENT_BACKDROP_MISSING');
          assert(got.css.includes('border:0!important')&&got.css.includes('box-shadow:none!important'),'ZERO_BORDER_SHADOW_MISSING');
          assert(got.css.includes(MARKER));
          console.log('BALL46_MEMBER_ODDS_GLASS55_V4_PATCH_CONTRACT_PASS');
          JS
      - name: Confirm active production Worker version and critical SHA checks read only
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          assert(account&&token,'MISSING_READ_CREDS');
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/ball46-member-production/deployments?per_page=1',{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(25000)});
          const j=await r.json();assert(r.ok&&j.success,'CLOUDFLARE_READ_FAILED');
          const v=j.result.deployments?.[0]?.versions;
          assert(v?.length===1&&Number(v[0].percentage)===100,'PRODUCTION_SPLIT');
          assert.equal(v[0].version_id,'67c9b9f0-18ea-4595-9712-662bf6322da0','PRODUCTION_VERSION_MOVED');
          const files={
            '/member-odds-topbar.css':'10a07147ada8f1923cdbe174c893e17d74e193ac9d4273b771819ae7d5fc6aa5',
            '/member-odds-topbar.js':'12265bd447751f9223860a852196bc97a576e1c70a08020343f12524698848c7',
            '/member.js':'ef4489618ae07303a7f275b4b37fddd0f7a8cb721bf98d3216c887128c806524',
            '/styles.css':'5186dd9dfa27c36b7dced6068b15a20d04ab8f15ab771e33d61116c8725b817d'
          };
          for(const [p,want] of Object.entries(files)){
            const u=new URL(p,'https://member.ball46.com');u.searchParams.set('glass55preflight',Date.now());
            const x=await fetch(u,{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(24000)});
            assert.equal(x.status,200,'MEMBER_ASSET_STATUS_CHANGED_'+p);
            assert.equal(createHash('sha256').update(Buffer.from(await x.arrayBuffer())).digest('hex'),want,'MEMBER_ASSET_HASH_CHANGED_'+p);
          }
          const gate=await fetch('https://member.ball46.com/member.html',{redirect:'manual',signal:AbortSignal.timeout(20000)});
          assert([302,303].includes(gate.status),'MEMBER_GATE_BYPASS');
          console.log('BALL46_MEMBER_ODDS_GLASS55_V4_READONLY_PREFLIGHT_PASS',JSON.stringify({worker:v[0].version_id,filesChecked:Object.keys(files).length,memberGate:gate.status}));
          JS
