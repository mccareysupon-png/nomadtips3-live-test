name: BALL46 O/U dedicated FT history TEST deploy preserve BTTS CLOSED 20261124
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-ou-dedicated-ft-vault-test-deploy-20261124.yml]
permissions: {contents: read}
concurrency:
  group: ball46-prematch-only-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Unit tests for distinct O/U FT storage, model and targeting
        run: |
          node --check qa/prematch-history-20261120/deploy-ou-dedicated-ft-vault-test-20261124.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-target-history-ft-v1.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-value-screener-v2.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/history-cargo-registry.test.mjs
      - name: Deploy and verify isolated O/U FT vault without activating the closed BTTS project
        run: node qa/prematch-history-20261120/deploy-ou-dedicated-ft-vault-test-20261124.mjs
