name: BALL46 inspect runtime BTTS CLOSED fence for independent O/U FT import 20261124
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-ou-btts-closed-fence-inspect-20261124.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --input-type=module <<'JS'
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID,
            root='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers',
            name='ball46-prematch-only-test-20261120';
          async function cf(p){const r=await fetch(root+p,{headers:{authorization:'Bearer '+token},
            signal:AbortSignal.timeout(30000)});const j=await r.json();
            if(!r.ok||!j.success)throw Error(p+'_'+r.status);return j.result}
          const id=(await cf('/scripts/'+name+'/deployments?per_page=1')).deployments[0].versions[0].version_id;
          const obj=await cf('/workers/'+name+'/versions/'+id+'?include=modules');
          const out=[];
          for(const m of obj.modules){
           const s=Buffer.from(m.content_base64,'base64').toString();
           for(const term of ['BTTS_PROJECT_CLOSED','bttsProjectClosed','closedProject','bttsProject','isBttsClosed','bttsShutdown']){
            let i=s.indexOf(term);if(i<0)continue;
            out.push({module:m.name,term,around:s.slice(Math.max(0,i-650),i+750)});
           }
          }
          const main=Buffer.from(obj.modules.find(x=>x.name===obj.main_module).content_base64,'base64').toString();
          for(const t of ["async fetch(req)","const path=","path==='/prematch-ou-engine-state'",
           "path==='/btts-history-import-test'","path==='/ou-v2-settlement-state'"]){
           const i=main.indexOf(t);
           out.push({module:obj.main_module,term:t,around:i<0?'NOT_FOUND':main.slice(Math.max(0,i-270),i+580)});
          }
          console.log('B46_CLOSED_FENCE_SOURCE '+JSON.stringify({id,main:obj.main_module,lines:out}).slice(0,30000));
          JS
