name: TEMP CAR 3.1 Live Display Final

on:
  push:
    branches:
      - fix/car31-live-display-source-truth-final-20260816

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply final source-truth display patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old in text:
                  return text.replace(old,new,1)
              if new in text:
                  return text
              raise SystemExit(f'missing patch target: {label}')

          app=Path('car3-1-hybrid-live-engine/web/app.js')
          s=app.read_text()
          s=replace_once(s,"matches=[],selected=0;","matches=[],selectedId=null;",'selected id state')
          s=replace_once(s,"${i===selected?'active':''}","${m.id===selectedId?'active':''}",'active candidate by id')
          s=replace_once(s,"document.querySelectorAll('.candidate').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.index);render();});","document.querySelectorAll('.candidate').forEach(b=>b.onclick=()=>{selectedId=matches[Number(b.dataset.index)]?.id||null;render();});",'candidate click id')
          old="function render(){renderMetrics();renderCandidates();if(!matches.length)return;const m=matches[Math.min(selected,matches.length-1)],d=m.serverEngine||localDecision(m);"
          new="function clearDetail(){for(const [id,value] of Object.entries({homeTeam:'—',awayTeam:'—',matchMinute:'—',scoreText:'—',leagueText:'—'})){const el=$('#'+id);if(el)el.textContent=value;}for(const id of ['sourceRow','statsGrid','pitchStats','evidenceGrid','oddsGrid','events','sourceTrace','gateList']){const el=$('#'+id);if(el)el.innerHTML='';}const p=$('#pressureChart'),d=$('#dangerChart');if(p)p.innerHTML='';if(d)d.innerHTML='';const tag=$('#possessionTag');if(tag)tag.textContent='WAITING FOR LIVE MATCH';}\nfunction render(){renderMetrics();renderCandidates();if(!matches.length){clearDetail();return;}const m=matches.find(x=>x.id===selectedId)||matches[0];selectedId=m.id;const d=m.serverEngine||localDecision(m);"
          s=replace_once(s,old,new,'clear stale finished detail')
          old="snapshots=snaps.snapshots||[];matches=(live.matches||[]).map(adapt);$('#lastUpdate').textContent=live.generatedAt?new Date(live.generatedAt).toLocaleTimeString():'live collector';render();"
          new="snapshots=snaps.snapshots||[];const generated=Date.parse(live.generatedAt||'');const sourceFresh=Boolean(live?.ok)&&Number.isFinite(generated)&&Date.now()-generated<=90000;const rows=sourceFresh?(live.matches||[]).filter(row=>{const s=String(row?.status||'LIVE').toUpperCase();return s!=='FT'&&!s.includes('FINISH')&&s!=='SCHEDULED'&&s!=='NS';}):[];matches=rows.map(adapt);if(!matches.some(m=>m.id===selectedId))selectedId=matches[0]?.id||null;$('#lastUpdate').textContent=live.generatedAt?new Date(live.generatedAt).toLocaleTimeString():'live collector';render();"
          s=replace_once(s,old,new,'fresh live rows only')
          s=replace_once(s,"setInterval(()=>load().catch(()=>{}),30000);","setInterval(()=>load().catch(()=>{}),5000);",'5 second source refresh')
          app.write_text(s)

          polish=Path('car3-1-hybrid-live-engine/web/signal-polish.js')
          p=polish.read_text()
          p=replace_once(p,"let lastAutoFocusedSignalKey=null;\nconst $=s=>document.querySelector(s)","let lastAutoFocusedSignalKey=null;\nconst LIVE_STALE_MS=90000;\nconst $=s=>document.querySelector(s)",'stale guard const')
          marker="function signalKey(record,row){\n  return String(record?.id??row?.sourceMatchId??row?.id??'');\n}\n"
          insert=marker+"\nfunction statusText(row){\n  return String(row?.status||'LIVE').toUpperCase();\n}\n\nfunction isDisplayLive(row){\n  if(!row)return false;\n  const status=statusText(row);\n  return status!=='FT'&&!status.includes('FINISH')&&status!=='SCHEDULED'&&status!=='NS';\n}\n\nfunction clearLiveDetail(){\n  const banner=$('#confirmedSignalBanner');\n  if(banner)banner.hidden=true;\n  $('.scoreboard')?.classList.remove('confirmed-signal-active');\n  const values={homeTeam:'—',awayTeam:'—',matchMinute:'—',scoreText:'—',leagueText:'—',signalMinute:'—',liveClock:'—',finalDecision:'MONITORING',finalReason:'—'};\n  for(const [id,value] of Object.entries(values)){const el=$(`#${id}`);if(el)el.textContent=value;}\n  const clock=$('#signalClockRow');if(clock)clock.hidden=true;\n  for(const id of ['sourceRow','statsGrid','pitchStats','evidenceGrid','oddsGrid','events','sourceTrace','gateList']){const el=$(`#${id}`);if(el)el.innerHTML='';}\n  const pressure=$('#pressureChart'),danger=$('#dangerChart');if(pressure)pressure.innerHTML='';if(danger)danger.innerHTML='';\n  const tag=$('#possessionTag');if(tag)tag.textContent='WAITING FOR LIVE MATCH';\n}\n"
          if 'function isDisplayLive(row)' not in p:
              if marker not in p: raise SystemExit('missing signalKey insertion point')
              p=p.replace(marker,insert,1)

          old="function apply(){\n  let cards=[...document.querySelectorAll('.candidate')];\n  updateCandidateMinutes(cards);"
          new="function apply(){\n  let cards=[...document.querySelectorAll('.candidate')];\n  cards.forEach(card=>{const index=Number(card.dataset.index||0),row=liveRows[index];if(!isDisplayLive(row))card.remove();});\n  cards=[...document.querySelectorAll('.candidate')];\n  if(!cards.length){clearLiveDetail();return;}\n  updateCandidateMinutes(cards);"
          p=replace_once(p,old,new,'drop ended cards')

          old="  const active=$('.candidate.active'),index=Number(active?.dataset.index||0),row=liveRows[index],record=confirmedRecord(row);"
          new="  let active=$('.candidate.active');\n  if(!active&&cards[0]){cards[0].click();return;}\n  const index=Number(active?.dataset.index),row=Number.isFinite(index)?liveRows[index]:null,record=confirmedRecord(row);\n  if(!isDisplayLive(row)){clearLiveDetail();return;}"
          p=replace_once(p,old,new,'safe active row')

          old="  liveRows=live.matches||[];historyRecords=history.records||[];\n  apply();"
          new="  const generatedAt=Date.parse(live?.generatedAt||'');\n  const fresh=Boolean(live?.ok)&&Number.isFinite(generatedAt)&&Date.now()-generatedAt<=LIVE_STALE_MS;\n  liveRows=fresh?(live.matches||[]):[];historyRecords=history.records||[];\n  apply();"
          p=replace_once(p,old,new,'fresh signal rows only')
          polish.write_text(p)

          for filename,prefix in [
              ('car3-1-hybrid-live-engine/web/index.html','./'),
              ('car3-1-hybrid-live-engine/monitor/index.html','../web/')
          ]:
              f=Path(filename); html=f.read_text()
              html=re.sub(r'src="'+re.escape(prefix)+r'app\.js(?:\?v=[^"]+)?"',f'src="{prefix}app.js?v=20260816-source-truth-final"',html,count=1)
              html=re.sub(r'src="'+re.escape(prefix)+r'signal-polish\.js\?v=[^"]+"',f'src="{prefix}signal-polish.js?v=20260816-source-truth-final"',html,count=1)
              f.write_text(html)
          PY
      - name: Syntax check display scripts
        run: |
          node --check car3-1-hybrid-live-engine/web/app.js
          node --check car3-1-hybrid-live-engine/web/signal-polish.js
      - name: Guard final behavior
        run: |
          grep -q "goalooElapsedSeconds" car3-1-hybrid-live-engine/web/signal-polish.js
          grep -q "goalooClock?.verified" car3-1-hybrid-live-engine/web/signal-polish.js
          grep -q "isDisplayLive" car3-1-hybrid-live-engine/web/signal-polish.js
          grep -q "LIVE_STALE_MS=90000" car3-1-hybrid-live-engine/web/signal-polish.js
          grep -q "selectedId" car3-1-hybrid-live-engine/web/app.js
          grep -q "clearDetail" car3-1-hybrid-live-engine/web/app.js
          grep -q "sourceFresh" car3-1-hybrid-live-engine/web/app.js
          grep -q "5000" car3-1-hybrid-live-engine/web/app.js
      - name: Inspect live source and ended-match leakage
        run: |
          curl -fsS --retry 3 --retry-delay 2 "https://nomadtips3-car31-goaloo.mccarey-supon.workers.dev/live?t=$(date +%s)" -o /tmp/live.json
          python - <<'PY'
          import json,datetime
          from pathlib import Path
          data=json.loads(Path('/tmp/live.json').read_text())
          print('ok=',data.get('ok'),'generatedAt=',data.get('generatedAt'))
          rows=data.get('matches') or []
          ended=[]; verified=0
          for r in rows:
              status=str(r.get('status') or '').upper()
              if status=='FT' or 'FINISH' in status: ended.append(r.get('sourceMatchId'))
              if (r.get('goalooClock') or {}).get('verified') is True: verified+=1
              print(r.get('sourceMatchId'),status,r.get('minute'),r.get('goalooElapsedSeconds'),r.get('home'),'vs',r.get('away'))
          print('matches=',len(rows),'ended_in_live=',ended,'verified_clock_rows=',verified)
          if ended: raise SystemExit('FT/FINISHED match leaked into /live')
          PY
      - name: Commit final patch
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git config user.name "NOMADTIPS3 verification"
          git config user.email "actions@users.noreply.github.com"
          git add car3-1-hybrid-live-engine/web/app.js car3-1-hybrid-live-engine/web/signal-polish.js car3-1-hybrid-live-engine/web/index.html car3-1-hybrid-live-engine/monitor/index.html
          git commit -m "Fix CAR 3.1 live display stale match state"
          git push origin HEAD:fix/car31-live-display-source-truth-final-20260816
