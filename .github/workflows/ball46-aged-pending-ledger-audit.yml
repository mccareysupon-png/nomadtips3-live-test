name: BALL46 aged PENDING ledger audit read-only
on:
  workflow_dispatch:
  push:
    branches:
      - stage/ball46-multisource-v5-20261017
    paths:
      - .github/workflows/ball46-aged-pending-ledger-audit.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read all authoritative Ledger V2 pages and inspect PENDING ages (no write)
        run: |
          node - <<'NODE'
          const first='stat:v2:row:9999999999999:~';
          const base='https://nomadtips3-engine-343.mccarey-supon.workers.dev/statistics';
          (async()=>{
            let cursor=first,pages=0,total=0,pending=0,aged=0,unknown=0,under=0,eligible=0,last=null;
            const now=Date.now(),used=new Set();
            for(let n=0;n<30;n++){
              if(used.has(cursor))throw Error('CURSOR_LOOP');used.add(cursor);
              const url=base+'?cursor='+encodeURIComponent(cursor)+'&paged=1';
              const response=await fetch(url,{method:'GET',signal:AbortSignal.timeout(15000)});
              const d=await response.json();
              if(!response.ok||d.ok!==true||d.statisticsSource!=='LEDGER_V2_ONLY')
                throw Error('NOT_AUTHORITATIVE_PAGE_'+(n+1));
              pages++;total+=d.rows.length;
              for(const x of d.rows){
                if(x.status!=='PENDING')continue;pending++;
                const tm=typeof x.createdAt==='number'?
                  (x.createdAt<1e12?x.createdAt*1000:x.createdAt):
                  Date.parse(String(x.createdAt||''));
                if(!Number.isFinite(tm))unknown++;
                else if(now-tm>=600000){aged++;
                  const m=String(x.market||'').toUpperCase();
                  if(!m.includes('CORNER')&&!m.includes('CARD')&&
                     String(x.period||'FT').toUpperCase()!=='HT')eligible++;
                }else under++;
              }
              if(!d.nextCursor){last='COMPLETE';break}
              if(typeof d.nextCursor!=='string'||d.nextCursor>=cursor)
                throw Error('INVALID_CURSOR');
              cursor=d.nextCursor;
            }
            console.log('REAL_LEDGER_PENDING_10M_AUDIT',JSON.stringify({
              pages,scanned:total,pending,aged,eligibleExcludingCornerCardHT:eligible,
              unknownTimestamp:unknown,under10minutes:under,completeness:last||'PAGE_LIMIT',
              writes:0}));
            if(last!=='COMPLETE')process.exitCode=2;
          })().catch(e=>{console.error('READ_ONLY_BLOCKED',e.message);process.exit(1)});
          NODE
