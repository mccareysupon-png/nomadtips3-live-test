name: READ ONLY - Ball46 Scorebar Realistic BG Predeploy 20260928
on:
  push:
    branches:
      - work/ball46-scorebar-realistic-bg-20260928
    paths:
      - '.github/workflows/ball46-scorebar-realistic-bg-predeploy-20260928.yml'
      - '.github/scripts/ball46_scorebar_realistic_bg_predeploy_20260928.sh'
      - '.github/assets/ball46_scorebar_win_234x116.webp.b64'
      - '.github/assets/ball46_scorebar_loss_234x116.webp.b64'
      - '.github/assets/ball46_scorebar_pending_234x116.webp.b64'
permissions:
  contents: read
jobs:
  predeploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify candidate only
        run: bash .github/scripts/ball46_scorebar_realistic_bg_predeploy_20260928.sh
      - name: Upload predeploy proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-realistic-scorebar-bg-predeploy-${{ github.run_id }}
          path: /tmp/b46-realistic-bg-predeploy
          if-no-files-found: ignore
          retention-days: 30
