name: Deploy Ball46 Color Semantics 20260922

on:
  push:
    branches:
      - work/ball46-color-semantics-20260922
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  BALL46_PUBLIC: https://www.ball46.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  GOLDEN_SHA: ad34452074b300787c91c7788c02d0e242854d0d

jobs:
  deploy-color-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preflight semantic sidecar
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$GOLDEN_SHA^{commit}"
          python3 -m py_compile scripts/patch_ball46_color_semantics_20260922.py
          node --check nomad-live-343/color-semantics-343.js
          grep -Fq 'BALL46_COLOR_SEMANTICS_20260922' nomad-live-343/color-semantics-343.css
          grep -Fq "343-color-semantics-20260922a" nomad-live-343/color-semantics-343.js
          git diff --check

      - name: Mirror exact current Production baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod
          fetch_required(){
            name="$1"; safe="${name//\//_}"
            code=$(curl -sS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 -o "/tmp/prod/$safe" -w '%{http_code}' "$BALL46_WORKER/$name?color-semantics-mirror=${GITHUB_RUN_ID}") || true
            [ "$code" = 200 ] || { echo "REQUIRED_PROD_ASSET_HTTP_${code}:$name"; exit 1; }
            test -s "/tmp/prod/$safe" || { echo "REQUIRED_PROD_ASSET_EMPTY:$name"; exit 1; }
            mkdir -p "$(dirname "nomad-live-343/$name")"
            cp "/tmp/prod/$safe" "nomad-live-343/$name"
          }
          fetch_required index.html
          cp nomad-live-343/index.html /tmp/index.before.html
          grep -Fq 'data-board-sections' /tmp/index.before.html
          python3 - <<'PY' > /tmp/index-assets.txt
          from pathlib import Path
          import re
          h=Path('/tmp/index.before.html').read_text(errors='ignore')
          found=set()
          for x in re.findall(r'''(?:src|href)=["']([^"']+)["']''',h,re.I):
              x=x.split('?',1)[0].split('#',1)[0].strip().lstrip('./').lstrip('/')
              if not x or '://' in x or '/' in x: continue
              if re.search(r'\.(?:js|css|svg|json|png|webp|jpg|jpeg|ico)$',x,re.I): found.add(x)
          for x in sorted(found): print(x)
          PY
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            fetch_required "$name"
          done < /tmp/index-assets.txt
          cat > /tmp/critical-assets.txt <<'EOF'
          dashboard-v2-stage3.js
          dashboard-v2-tune.js
          bulk-odds-compat-343.js
          expanded-match-343.js
          full-market-bookmaker-343.js
          live-summary-full-odds-343.js
          singlepage-workspace-343.js
          EOF
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            fetch_required "$name"
          done < /tmp/critical-assets.txt
          cat /tmp/index-assets.txt /tmp/critical-assets.txt | sort -u > /tmp/mirrored-assets.txt
          : > /tmp/mirrored.sha
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            [ "$name" = 'color-semantics-343.css' ] && continue
            [ "$name" = 'color-semantics-343.js' ] && continue
            [ -f "nomad-live-343/$name" ] || continue
            printf '%s  %s\n' "$(sha256sum "nomad-live-343/$name" | awk '{print $1}')" "$name" >> /tmp/mirrored.sha
          done < /tmp/mirrored-assets.txt
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_WORKER/api/engine/board?color-semantics-before=${GITHUB_RUN_ID}" -o /tmp/board-before.json
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_WORKER/api/engine/signals?color-semantics-before=${GITHUB_RUN_ID}" -o /tmp/signals-before.json
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_WORKER/api/engine/statistics?color-semantics-before=${GITHUB_RUN_ID}" -o /tmp/stats-before.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/board-before.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals-before.json'));
          const t=JSON.parse(fs.readFileSync('/tmp/stats-before.json'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures))throw Error('PRE_BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals))throw Error('PRE_SIGNALS_UNHEALTHY');
          if(t?.ok!==true||!Array.isArray(t?.rows))throw Error('PRE_STATS_UNHEALTHY');
          console.log('PRE_COLOR_HEALTH_OK',{fixtures:b.fixtures.length,signals:s.signals.length,stats:t.rows.length});
          NODE

      - name: Install shared semantic presentation
        shell: bash
        run: |
          set -euo pipefail
          cp nomad-live-343/color-semantics-343.css /tmp/color-semantics.css
          cp nomad-live-343/color-semantics-343.js /tmp/color-semantics.js
          python3 scripts/patch_ball46_color_semantics_20260922.py
          cp /tmp/color-semantics.css nomad-live-343/color-semantics-343.css
          cp /tmp/color-semantics.js nomad-live-343/color-semantics-343.js
          grep -Fq 'color-semantics-343.css?v=343-color-semantics-20260922a' nomad-live-343/index.html
          grep -Fq 'color-semantics-343.js?v=343-color-semantics-20260922a' nomad-live-343/index.html
          grep -Fq 'BALL46_COLOR_SEMANTICS_20260922' nomad-live-343/color-semantics-343.css
          node --check nomad-live-343/color-semantics-343.js
          while read -r expected f; do
            actual=$(sha256sum "nomad-live-343/$f" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "MIRRORED_ASSET_CHANGED:$f"; exit 1; }
          done < /tmp/mirrored.sha

      - name: Dry run Production package
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy shared color semantics
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify Production and protected continuity
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 15); do
            if curl -fsS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/index.html?color-semantics-after=${GITHUB_RUN_ID}-$n" -o /tmp/index.after.html \
              && grep -Fq 'color-semantics-343.css?v=343-color-semantics-20260922a' /tmp/index.after.html \
              && grep -Fq 'color-semantics-343.js?v=343-color-semantics-20260922a' /tmp/index.after.html; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo COLOR_SEMANTICS_MARKER_NOT_PROPAGATED; exit 1; }
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_WORKER/color-semantics-343.css?verify=${GITHUB_RUN_ID}" -o /tmp/color.after.css
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_WORKER/color-semantics-343.js?verify=${GITHUB_RUN_ID}" -o /tmp/color.after.js
          grep -Fq 'BALL46_COLOR_SEMANTICS_20260922' /tmp/color.after.css
          grep -Fq "343-color-semantics-20260922a" /tmp/color.after.js
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            safe="${name//\//_}"
            curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_WORKER/$name?color-protected=${GITHUB_RUN_ID}" -o "/tmp/after_$safe"
            expected=$(grep -F "  $name" /tmp/mirrored.sha | awk '{print $1}')
            actual=$(sha256sum "/tmp/after_$safe" | awk '{print $1}')
            [ -n "$expected" ] && [ "$actual" = "$expected" ] || { echo "PROTECTED_ASSET_CHANGED:$name"; exit 1; }
          done < /tmp/critical-assets.txt
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_WORKER/api/engine/board?color-semantics-final=${GITHUB_RUN_ID}" -o /tmp/board-after.json
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_WORKER/api/engine/signals?color-semantics-final=${GITHUB_RUN_ID}" -o /tmp/signals-after.json
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_WORKER/api/engine/statistics?color-semantics-final=${GITHUB_RUN_ID}" -o /tmp/stats-after.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/board-after.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals-after.json'));
          const t=JSON.parse(fs.readFileSync('/tmp/stats-after.json'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures))throw Error('BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals))throw Error('SIGNALS_UNHEALTHY');
          if(t?.ok!==true||!Array.isArray(t?.rows))throw Error('STATISTICS_UNHEALTHY');
          console.log('BALL46_COLOR_SEMANTICS_VERIFY_OK',{fixtures:b.fixtures.length,signals:s.signals.length,stats:t.rows.length});
          NODE
          public_ok=0
          for n in $(seq 1 15); do
            if curl -fsS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_PUBLIC/?color-semantics-public=${GITHUB_RUN_ID}-$n" -o /tmp/public.html \
              && grep -Fq 'color-semantics-343.css?v=343-color-semantics-20260922a' /tmp/public.html \
              && grep -Fq 'color-semantics-343.js?v=343-color-semantics-20260922a' /tmp/public.html; then public_ok=1; break; fi
            sleep 3
          done
          [ "$public_ok" = 1 ] || { echo PUBLIC_COLOR_SEMANTICS_PROPAGATION_FAILED; exit 1; }
          echo BALL46_COLOR_SEMANTICS_OK
