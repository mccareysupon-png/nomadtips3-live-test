name: Ball46 Viewer Readonly Persist Lock V1 20260920

on:
  push:
    branches:
      - work/ball46-viewer-readonly-lock-v1-20260920
    paths:
      - .github/workflows/ball46-viewer-readonly-persist-lock-v1-20260920.yml

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact lock branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Persist audited canonical source without deployment
        shell: bash
        run: bash scripts/persist-ball46-viewer-readonly-canonical-v1.sh
