name: BALL46 Pre-Match main Scorebar structure audit TEST only
on:
  push:
    branches: [test/ball46-premium-match-colors-20261120]
    paths: ['.github/workflows/ball46-prematch-scorebar-structure-audit.yml']
permissions: {contents: read}
jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Inspect native Scorebar in Live Statistics and Pre-Match
        run: |
          node --input-type=module <<'JS'
          import {chromium,devices} from 'playwright';
          const browser=await chromium.launch();
          const base='https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev';
          for(const mobile of [false,true]){
            const p=await browser.newPage(mobile?{...devices['iPhone 13'],serviceWorkers:'block'}:{viewport:{width:1440,height:940},serviceWorkers:'block'});
            await p.addInitScript(()=>localStorage.setItem('nomad343_dashboard_theme_v1','dark'));
            for(const route of ['/?view=statistics','/?b46pm=all']){
              await p.goto(base+route,{waitUntil:'domcontentloaded',timeout:60000});
              await p.waitForTimeout(2200);
              const graph=await p.evaluate(()=>{
                const outline=e=>{const cs=getComputedStyle(e),r=e.getBoundingClientRect();return {
                  tag:e.tagName,id:e.id,cls:typeof e.className==='string'?e.className.slice(0,180):'',
                  role:e.getAttribute('role'),visible:!!(r.width&&r.height)&&cs.display!=='none'&&cs.visibility!=='hidden',
                  display:cs.display,position:cs.position,overflow:cs.overflow,overflowY:cs.overflowY,z:cs.zIndex,
                  top:Math.round(r.top),bottom:Math.round(r.bottom),height:Math.round(r.height),width:Math.round(r.width),
                  parent:e.parentElement?.tagName+'.'+(typeof e.parentElement?.className==='string'?e.parentElement.className.slice(0,90):''),
                  text:e.textContent?.trim().slice(0,70)
                }};
                const candidates=[...document.querySelectorAll('[id],[class],section,header,aside')].filter(e=>{
                  const key=(String(e.id||'')+' '+(typeof e.className==='string'?e.className:'')).toLowerCase();
                  return /score.?bar|score.?strip|live.?score|fixture.?bar|score.?ticker|scoreboard|match.?ticker|match.?bar|match.?strip|top.?bar|scores/.test(key);
                }).map(outline).filter(e=>e.height>0||/score.?bar|score.?strip|top.?bar/.test(e.id+' '+e.cls)).slice(0,90);
                const layout={
                  body:[...document.body.children].slice(0,20).map(outline),
                  workspace:[...document.querySelectorAll('section.workspace.singlepage')].flatMap(e=>[outline(e),...[...e.children].slice(0,14).map(outline)]),
                  preMatch:document.querySelector('#b46-prematch-panel')?outline(document.querySelector('#b46-prematch-panel')):null,
                  rootScroll:{windowY:scrollY,bodyScroll:document.body.scrollTop,rootOverflow:getComputedStyle(document.documentElement).overflowY}
                };
                return {url:location.href,theme:document.documentElement.dataset.theme,candidates,layout};
              });
              console.log('SCOREBAR_STRUCTURE_AUDIT '+JSON.stringify({mobile,route,...graph}));
            }
            await p.close();
          }
          await browser.close();
          JS
