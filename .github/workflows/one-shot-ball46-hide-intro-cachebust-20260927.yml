name: ONE SHOT - Ball46 Hide Intro Cache Refresh 20260927

on:
  push:
    branches: [ops/ball46-hide-intro-cachebust-20260927]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
      BALL46_WWW: https://www.ball46.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      PATH_SOURCE_SHA: 6276320261cdc10a3835b27e81850c3d4f17f126
      CSS_TOKEN: 343-v2-shared-hide-intro-20260927b
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mirror exact current Production and lock it
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/b46-assets /tmp/b46-before /tmp/b46-runtime /tmp/b46-after
          mkdir -p /tmp/b46-assets /tmp/b46-runtime

          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          h={'Authorization':f'Bearer {token}','Accept':'application/json'}
          dep=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/ball46-production/deployments'
          with urllib.request.urlopen(urllib.request.Request(dep,headers=h),timeout=30) as r:p=json.load(r)
          ds=(p.get('result') or {}).get('deployments') or []
          if not ds or not ds[0].get('versions'): raise SystemExit('NO_ACTIVE_DEPLOYMENT')
          vid=ds[0]['versions'][0]['version_id']
          pathlib.Path('/tmp/pre-version.txt').write_text(vid)
          print('PRE_VERSION='+vid)
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/workers/ball46-production/versions/{vid}?include=modules'
          with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=30) as r:vp=json.load(r)
          result=vp.get('result') or {}; mods=result.get('modules') or []
          if len(mods)!=1 or mods[0].get('name')!='index.js' or not mods[0].get('content_base64'): raise SystemExit('RUNTIME_UNEXPECTED')
          runtime=base64.b64decode(mods[0]['content_base64'])
          pathlib.Path('/tmp/b46-runtime/index.js').write_bytes(runtime)
          pathlib.Path('/tmp/runtime-before.sha').write_text(hashlib.sha256(runtime).hexdigest())
          meta={k:result.get(k) for k in ['main_module','compatibility_date','bindings','assets','usage_model']}
          pathlib.Path('/tmp/runtime-meta-before.json').write_text(json.dumps(meta,sort_keys=True))
          PY

          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          sha=os.environ['PATH_SOURCE_SHA']
          req=urllib.request.Request(f'https://api.github.com/repos/mccareysupon-png/nomadtips3-live-test/git/trees/{sha}?recursive=1',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as r:p=json.load(r)
          prefix='nomad-live-343/'
          paths=sorted(x['path'][len(prefix):] for x in p.get('tree',[]) if x.get('type')=='blob' and x.get('path','').startswith(prefix))
          if len(paths)!=69: raise SystemExit(f'PATH_COUNT_CHANGED:{len(paths)}')
          pathlib.Path('/tmp/asset-paths.txt').write_text('\n'.join(paths)+'\n')
          PY

          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            mkdir -p "/tmp/b46-assets/$(dirname "$rel")"
            code=$(curl -sS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 -H 'Cache-Control: no-cache' -o "/tmp/b46-assets/$rel" -w '%{http_code}' "$BALL46_WWW/$rel?mirror=${GITHUB_RUN_ID}-$(date +%s%N)") || true
            [ "$code" = 200 ] || { echo "ASSET_FETCH_${code}:$rel"; exit 1; }
          done < /tmp/asset-paths.txt
          cp -a /tmp/b46-assets /tmp/b46-before
          (cd /tmp/b46-before && while IFS= read -r rel; do sha256sum "$rel"; done < /tmp/asset-paths.txt) > /tmp/before.manifest

          grep -Fq 'BALL46_HIDE_PAGE_INTRO_20260927' /tmp/b46-assets/v2-shared.css
          grep -Fq '.next-page-head{display:none!important}' /tmp/b46-assets/v2-shared.css
          echo EXACT_CURRENT_PRODUCTION_LOCKED

      - name: Cache-bust shared CSS on every HTML page that uses it
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, re
          root=pathlib.Path('/tmp/b46-assets')
          before=pathlib.Path('/tmp/b46-before')
          token=os.environ['CSS_TOKEN']
          touched=[]
          users=[]
          pat=re.compile(r'v2-shared\.css(?:\?[^"\']*)?')
          for p in sorted(root.rglob('*.html')):
              text=p.read_text(errors='strict')
              if 'v2-shared.css' not in text: continue
              rel=p.relative_to(root).as_posix(); users.append(rel)
              new=pat.sub('v2-shared.css?v='+token,text)
              if new!=text:
                  p.write_text(new)
                  touched.append(rel)
          if not users: raise SystemExit('NO_HTML_USES_V2_SHARED')
          print('V2_SHARED_HTML_USERS=',users)
          print('TOUCHED_HTML=',touched)
          if not touched: raise SystemExit('NO_CACHE_BUSTER_CHANGE')
          changed=[]
          for rel in pathlib.Path('/tmp/asset-paths.txt').read_text().splitlines():
              a=before/rel; b=root/rel
              if hashlib.sha256(a.read_bytes()).digest()!=hashlib.sha256(b.read_bytes()).digest(): changed.append(rel)
          print('CHANGED_ASSETS=',changed)
          if changed!=touched: raise SystemExit('DIFF_GATE_FAILED')
          if any(not x.endswith('.html') for x in changed): raise SystemExit('NON_HTML_CHANGED')
          pathlib.Path('/tmp/touched-html.txt').write_text('\n'.join(touched)+'\n')
          PY
          while IFS= read -r f; do [ -n "$f" ] || continue; grep -Fq "v2-shared.css?v=$CSS_TOKEN" "/tmp/b46-assets/$f"; done < /tmp/touched-html.txt
          echo HTML_CACHE_BUSTER_DIFF_PASS

      - name: Dry run exact current package
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/b46-runtime/wrangler.jsonc <<'EOF'
          {"name":"ball46-production","main":"./index.js","compatibility_date":"2026-09-09","no_bundle":true,"services":[{"binding":"ENGINE","service":"nomadtips3-engine-343","environment":"production"},{"binding":"FULL_MARKET","service":"nomadtips3-full-market-343-ball46","environment":"production"},{"binding":"HUB","service":"nomadtips3-5usd-hub-343","environment":"production"}],"assets":{"directory":"/tmp/b46-assets","binding":"ASSETS","html_handling":"none","not_found_handling":"none","run_worker_first":true},"triggers":{"crons":["* * * * *"]}}
          EOF
          cd /tmp/b46-runtime
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc

      - name: Final race guard against live Production
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, pathlib
          a=os.environ['CLOUDFLARE_ACCOUNT_ID']; t=os.environ['CLOUDFLARE_API_TOKEN']; h={'Authorization':f'Bearer {t}','Accept':'application/json'}
          with urllib.request.urlopen(urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/scripts/ball46-production/deployments',headers=h),timeout=30) as r:p=json.load(r)
          cur=((p.get('result') or {}).get('deployments') or [])[0]['versions'][0]['version_id']; pre=pathlib.Path('/tmp/pre-version.txt').read_text().strip()
          print('RACE_VERSION',cur,pre)
          if cur!=pre: raise SystemExit('PRODUCTION_MOVED')
          PY
          echo FINAL_RACE_PASS

      - name: Deploy cache-buster only
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/b46-runtime
          npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc | tee /tmp/deploy.log
          grep -Fq 'Uploaded ball46-production' /tmp/deploy.log
          echo DEPLOY_COMMAND_PASS

      - name: Verify www.ball46.com exact assets and hide rule
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          a=os.environ['CLOUDFLARE_ACCOUNT_ID']; t=os.environ['CLOUDFLARE_API_TOKEN']; h={'Authorization':f'Bearer {t}','Accept':'application/json'}
          dep=f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/scripts/ball46-production/deployments'
          with urllib.request.urlopen(urllib.request.Request(dep,headers=h),timeout=30) as r:p=json.load(r)
          vid=((p.get('result') or {}).get('deployments') or [])[0]['versions'][0]['version_id']; print('POST_VERSION='+vid)
          pre=pathlib.Path('/tmp/pre-version.txt').read_text().strip()
          if vid==pre: raise SystemExit('VERSION_DID_NOT_ADVANCE')
          url=f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/workers/ball46-production/versions/{vid}?include=modules'
          with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=30) as r:vp=json.load(r)
          result=vp.get('result') or {}; mods=result.get('modules') or []
          runtime=base64.b64decode(mods[0]['content_base64'])
          if hashlib.sha256(runtime).hexdigest()!=pathlib.Path('/tmp/runtime-before.sha').read_text().strip(): raise SystemExit('RUNTIME_CHANGED')
          before=json.loads(pathlib.Path('/tmp/runtime-meta-before.json').read_text()); after={k:result.get(k) for k in ['main_module','compatibility_date','bindings','assets','usage_model']}
          if json.dumps(before,sort_keys=True)!=json.dumps(after,sort_keys=True): raise SystemExit('RUNTIME_META_CHANGED')
          PY

          ok=0
          for pass in 1 2 3 4; do
            rm -rf /tmp/b46-after && mkdir -p /tmp/b46-after
            while IFS= read -r rel; do
              [ -n "$rel" ] || continue
              mkdir -p "/tmp/b46-after/$(dirname "$rel")"
              curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 -H 'Cache-Control: no-cache' "$BALL46_WWW/$rel?verify=${GITHUB_RUN_ID}-${pass}-$(date +%s%N)" -o "/tmp/b46-after/$rel"
            done < /tmp/asset-paths.txt
            if python3 - <<'PY'
          from pathlib import Path
          import hashlib
          want=Path('/tmp/b46-assets'); got=Path('/tmp/b46-after'); bad=[]
          for rel in Path('/tmp/asset-paths.txt').read_text().splitlines():
              if hashlib.sha256((want/rel).read_bytes()).digest()!=hashlib.sha256((got/rel).read_bytes()).digest(): bad.append(rel)
          print('WWW_ASSET_MISMATCH=',bad)
          raise SystemExit(0 if not bad else 1)
          PY
            then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo WWW_ASSET_VERIFY_FAILED; exit 1; }

          while IFS= read -r f; do
            [ -n "$f" ] || continue
            grep -Fq "v2-shared.css?v=$CSS_TOKEN" "/tmp/b46-after/$f"
          done < /tmp/touched-html.txt
          grep -Fq 'BALL46_HIDE_PAGE_INTRO_20260927' /tmp/b46-after/v2-shared.css
          grep -Fq '.dash-heading,' /tmp/b46-after/v2-shared.css
          grep -Fq '.next-page-head{display:none!important}' /tmp/b46-after/v2-shared.css

          for ep in board signals statistics; do curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WWW/api/engine/$ep?verify=${GITHUB_RUN_ID}" -o "/tmp/$ep.json"; done
          node - <<'NODE'
          const fs=require('fs');const b=JSON.parse(fs.readFileSync('/tmp/board.json')),s=JSON.parse(fs.readFileSync('/tmp/signals.json')),t=JSON.parse(fs.readFileSync('/tmp/statistics.json'));
          if(b?.ok!==true||!Array.isArray(b.fixtures)||!Array.isArray(s.signals)||t?.ok!==true||!Array.isArray(t.rows))process.exit(1);
          console.log('LIVE_API_OK',{fixtures:b.fixtures.length,signals:s.signals.length,settled:t.rows.length});
          NODE
          echo BALL46_WWW_HIDE_RULE_VERIFIED

      - name: Screenshot the real www.ball46.com pages
        shell: bash
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          [ -n "$chrome" ] || { echo CHROME_NOT_FOUND; exit 1; }
          mkdir -p /tmp/screens
          "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1200 --virtual-time-budget=7000 --screenshot=/tmp/screens/live.png "$BALL46_WWW/index.html?status=live&shot=${GITHUB_RUN_ID}" >/tmp/chrome-live.log 2>&1
          "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1200 --virtual-time-budget=5000 --screenshot=/tmp/screens/signal.png "$BALL46_WWW/signal.html?shot=${GITHUB_RUN_ID}" >/tmp/chrome-signal.log 2>&1 || true
          "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1200 --virtual-time-budget=5000 --screenshot=/tmp/screens/statistics.png "$BALL46_WWW/statistics.html?shot=${GITHUB_RUN_ID}" >/tmp/chrome-stat.log 2>&1 || true
          test -s /tmp/screens/live.png
          ls -lh /tmp/screens

      - uses: actions/upload-artifact@v4
        with:
          name: ball46-www-hide-intro-screens-${{ github.run_id }}
          path: /tmp/screens
          retention-days: 7
