          const model=" // B46_TEST_PUBLISHED_PORTFOLIO_V1: same validated selections and tie-breaker as Predictions.\n const prepared=(issued,ouRows,p01Rows)=>[\n   ...issued.map(r=>makeRow(r,'issued')),\n   ...ouRows.map(r=>makeRow(r,'adaptive')),\n   ...p01Rows.map(r=>makeRow(r,'poisson'))\n ].filter(Boolean);\n function groupPublicSelections(rows){\n   const groups=new Map();\n   for(const row of rows){\n     if(!groups.has(row.id))groups.set(row.id,{id:row.id,rows:[],keys:new Set(),identity:null});\n     const g=groups.get(row.id),k=[row.kind,row.model,row.market,row.pick].join('|');\n     const identity=validIds(row.raw.home_id)&&validIds(row.raw.away_id)?[+row.raw.home_id,+row.raw.away_id].join(':'):null;\n     if((identity&&g.identity&&identity!==g.identity)||(!bestOnly(row.market)&&g.keys.has(k)))continue;\n     if(identity&&!g.identity)g.identity=identity;\n     g.keys.add(k);g.rows.push(row);\n   }\n   return [...groups.values()].map(g=>({...g,rows:chooseDisplayed(g.rows)}));\n }\n const londonTime=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit',hourCycle:'h23',hour:'2-digit'});\n function businessDate(sec){\n   const p=Object.fromEntries(londonTime.formatToParts(sec*1000).map(v=>[v.type,v.value]));\n   return new Date(Date.UTC(+p.year,+p.month-1,+p.day)-(+p.hour<6?86400000:0)).toISOString().slice(0,10);\n }\n const roundUnits=n=>Math.round(n*1e8)/1e8;\n function unitsFor(status,price){\n   switch(status){\n    case 'WIN':return price-1;\n    case 'LOSS':return -1;\n    case 'HALF_WIN':return (price-1)/2;\n    case 'HALF_LOSS':return -.5;\n    case 'PUSH':case 'VOID':case 'DRAW':return 0;\n    default:return null;\n   }\n }\n function scorePortfolio(settled,selected){\n   let win=0,loss=0,draw=0,units=0,staked=0,odds=0;\n   for(const r of settled){\n     const u=r.units;units+=u;odds+=r.price;\n     if(u>0)win++;else if(u<0)loss++;else draw++;\n     if(r.status!=='VOID')staked++;\n   }\n   return {source:'PUBLISHED_SELECTIONS_TEST',total:selected.length,settled:settled.length,\n    pending:selected.filter(r=>r.status==='PENDING').length,win,loss,draw,staked,units:roundUnits(units),\n    winRate:win+loss?100*win/(win+loss):null,avgOdds:settled.length?odds/settled.length:null};\n }\n function portfolio(issued,archive,window,market='all'){\n   if(!window?.businessDay||!Number.isSafeInteger(window.begin)||!Number.isSafeInteger(window.end))throw Error('Missing London accounting window');\n   const now=Math.floor(Date.now()/1000);\n   const rows=groupPublicSelections(prepared(issued,archive.rows,archive.poisson).filter(r=>r.kickoff<archive.range.before))\n     .flatMap(g=>g.rows).filter(r=>market==='all'||r.market===market).map(row=>{\n     const r=row.raw,status=row.status==='DRAW'&&row.market==='1X2'?'PENDING':row.status;\n     const u=unitsFor(status,row.price),at=seconds(r.settled_at??r.settledAt);\n     const validFT=Number.isInteger(r.hg)&&Number.isInteger(r.ag)&&Math.min(r.hg,r.ag)>=0;\n     const final=u!==null&&at!==null&&at>=row.kickoff&&at<=now&&(validFT||status==='VOID');\n     return {...r,fixture_id:row.id,market:row.market,home:row.home,away:row.away,\n      kickoff:row.kickoff,picked_at:row.recorded,bookmaker:row.bet,\n      pick:row.kind==='adaptive'?row.pick:r.pick,formula_id:row.model,price:row.price,\n      status:final?status:'PENDING',settled_at:final?at:null,units:final?roundUnits(u):null};\n   });\n   const settled=rows.filter(r=>r.settled_at!==null);\n   const inWindow=t=>t>=window.begin&&t<window.end;\n   const todayIssued=rows.filter(r=>inWindow(r.picked_at)),todaySettled=settled.filter(r=>inWindow(r.settled_at));\n   const todayRows=rows.filter(r=>inWindow(r.picked_at)||inWindow(r.settled_at));\n   const groups=new Map();\n   for(const row of settled){\n     const d=businessDate(row.settled_at);\n     if(!groups.has(d))groups.set(d,[]);\n     groups.get(d).push(row);\n   }\n   let running=0;\n   const daily=[...groups].sort(([a],[b])=>a.localeCompare(b)).map(([date,rs])=>{\n     const s=scorePortfolio(rs,rs);running=roundUnits(running+s.units);\n     return {date,cumulativeUnits:running,netUnits:s.units,stakedUnits:s.staked,win:s.win,loss:s.loss,draw:s.draw};\n   });\n   return {window,rows,todayRows,today:scorePortfolio(todaySettled,todayIssued),all:{...scorePortfolio(settled,rows),daily}};\n }\n";
