name: BALL46 V12 Post-Deploy Continuous Flicker Verification
on:
  push:
    branches: [fix/ball46-featured-events-inline-v12-20261021]
    paths:
      - '.github/workflows/ball46-featured-v12-postdeploy-verify.yml'
      - 'deploy-assets/featured-events-v12/post-verify.mjs'
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Observe REAL Production continuously with no mutations of deployed code
        working-directory: deploy-assets/featured-events-v12
        run: |
          npm install --no-save --ignore-scripts puppeteer-core@24
          node post-verify.mjs
      - name: Save visible recent-events screenshots and 15-second stability measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b46-v12-postdeploy-live-flicker-visible
          path: deploy-assets/featured-events-v12/post-proof/
          retention-days: 15
          if-no-files-found: warn