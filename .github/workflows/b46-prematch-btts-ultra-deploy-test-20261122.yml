name: BALL46 PreMatch BTTS Ultra 10 Match TEST Deploy
on:
  push:
    branches: [fix/ball46-prematch-btts-ultra-shadow-test-20261122]
    paths:
      - .github/workflows/b46-prematch-btts-ultra-deploy-test-20261122.yml
permissions:
  contents: read
concurrency:
  group: ball46-prematch-only-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 10 match BTTS history, Bet365 source, unchanged 1X2/HCR
        run: |
          node --check qa/prematch-history-20261120/deploy-btts-ultra-test-20261122.mjs
          node --test qa/prematch-history-20261120/btts-ultra-shadow.test.mjs qa/prematch-history-20261120/market-1x2.test.mjs qa/prematch-history-20261120/test-pick-ledger.test.mjs qa/prematch-history-20261120/league-original-restore.test.mjs qa/prematch-history-20261120/history-cargo-registry.test.mjs qa/prematch-history-20261120/history-cargo-full-payload.test.mjs
      - name: Install isolated BTTS shadow only in existing PreMatch TEST worker
        run: node qa/prematch-history-20261120/deploy-btts-ultra-test-20261122.mjs
