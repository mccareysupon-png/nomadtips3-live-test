name: BALL46 Signal league label visual layout read-only audit
on:
  push:
    branches: [test/ball46-premium-match-colors-20261120]
    paths: ['.github/workflows/ball46-signal-league-layout-audit-20261121.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-audit --no-fund --no-save playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Inspect text box geometry and layout before local-only changes
        run: |
          node --input-type=module <<'NODE'
          import {chromium,devices} from 'playwright';
          const b=await chromium.launch();
          for(const device of ['desktop','mobile']){
            const p=await b.newPage(device==='desktop'?{viewport:{width:1440,height:960},serviceWorkers:'block'}:{...devices['iPhone 13'],viewport:{width:390,height:844},serviceWorkers:'block'});
            await p.addInitScript(()=>localStorage.setItem('nomad343_dashboard_theme_v1','dark'));
            await p.goto('https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev/?view=signal',{waitUntil:'domcontentloaded',timeout:65000});
            await p.waitForFunction(()=>document.querySelector('.board-sections[data-b46-signal-sort-ready="1"] .b46-signal-league-chip'),null,{timeout:35000});
            const map=await p.evaluate(()=>{
              const cell=document.querySelector('.status-section .match-row .teams-cell');
              const row=cell.closest('.match-row');const rect=e=>{const r=e.getBoundingClientRect();return {x:+r.x.toFixed(2),y:+r.y.toFixed(2),w:+r.width.toFixed(2),h:+r.height.toFixed(2),bottom:+r.bottom.toFixed(2),right:+r.right.toFixed(2)}};
              const styles=e=>{const s=getComputedStyle(e);return {display:s.display,position:s.position,overflow:s.overflow,flexDirection:s.flexDirection,gap:s.gap,padding:s.padding,margin:s.margin,lineHeight:s.lineHeight,fontSize:s.fontSize,whiteSpace:s.whiteSpace,justifyContent:s.justifyContent,alignItems:s.alignItems,gridTemplateRows:s.gridTemplateRows}};
              const children=[...cell.querySelectorAll('*')].slice(0,30).map(e=>({tag:e.tagName,cls:String(e.className),text:e.textContent?.trim().slice(0,105),box:rect(e),css:styles(e)}));
              const chip=cell.querySelector('.b46-signal-league-chip');
              const texts=[...cell.querySelectorAll('b,span,strong,small')].filter(e=>e!==chip&&e.textContent?.trim()).map(e=>({tag:e.tagName,cls:String(e.className),text:e.textContent.trim().slice(0,80),rect:rect(e)}));
              return {viewport:innerWidth,cellHtml:cell.outerHTML.slice(0,7000),row:rect(row),cell:rect(cell),cellStyles:styles(cell),chip:chip?{text:chip.textContent,box:rect(chip),css:styles(chip)}:null,texts,children};
            });
            console.log('BALL46_LEAGUE_LAYOUT_'+device+' '+JSON.stringify(map));
            await p.close();
          }
          await b.close();
          NODE