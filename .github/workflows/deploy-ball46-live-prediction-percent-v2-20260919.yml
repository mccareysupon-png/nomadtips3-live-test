name: Deploy Ball46 Live Prediction Percent V2 20260919

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ball46-live-prediction-percent-v2-20260919.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_BRANCH: work/ball46-live-prediction-percent-20260919
  BASE_SHA: 049161799cd2d7899bf944b3ed72f4a9a0c5bebd
  BALL46_URL: https://ball46.com
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-prediction-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout isolated prediction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Enforce source boundary before production sync
        shell: bash
        run: |
          set -euo pipefail
          node --check nomad-live-343/live-prediction-percent-343.js
          python3 - <<'PY'
          import subprocess
          allowed={'nomad-live-343/live-prediction-percent-343.js'}
          changed=set(filter(None,subprocess.check_output(['git','diff','--name-only','049161799cd2d7899bf944b3ed72f4a9a0c5bebd...HEAD']).decode().splitlines()))
          bad=changed-allowed
          if bad: raise SystemExit('SOURCE_BRANCH_PROTECTED_CHANGE: '+', '.join(sorted(bad)))
          if changed!=allowed: raise SystemExit('PREDICTION_SOURCE_NOT_ISOLATED')
          print('SOURCE_BOUNDARY_PASS',sorted(changed))
          PY
          git diff --quiet "$BASE_SHA...HEAD" -- \
            workers/nomadtips3-full-market-343-ball46 \
            workers/nomadtips3-5usd-hub-343 \
            workers/nomadtips3-engine-343 \
            workers/add-k-ah-detector \
            workers/nomadtips3-343-preview/src \
            workers/nomadtips3-343-preview/wrangler.ball46.jsonc \
            nomad-live-343/dashboard-v2-stage3.js \
            nomad-live-343/signal.html \
            nomad-live-343/statistics.html
          grep -Fq "networkRequestsAdded:0" nomad-live-343/live-prediction-percent-343.js
          grep -Fq "mode:'READ_ONLY_SHARED_BOARD'" nomad-live-343/live-prediction-percent-343.js
          grep -Fq 'const UPDATE_MS=60_000' nomad-live-343/live-prediction-percent-343.js
          grep -Fq 'const ROLLING_MS=5*60_000' nomad-live-343/live-prediction-percent-343.js
          grep -Fq 'const STABILITY_MS=10*60_000' nomad-live-343/live-prediction-percent-343.js

      - name: Snapshot and mirror current production static assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ball46-prod /tmp/ball46-headers
          : > /tmp/protected-assets.tsv
          while IFS= read -r f; do
            name="${f#nomad-live-343/}"
            [ "$name" = 'live-prediction-percent-343.js' ] && continue
            case "$name" in
              *.html|*.js|*.css|*.svg|*.json|*.png|*.webp|*.jpg|*.jpeg|*.ico) ;;
              *) continue ;;
            esac
            safe="${name//\//_}"
            code=$(curl -sS -L --max-time 25 -D "/tmp/ball46-headers/$safe" -o "/tmp/ball46-prod/$safe" -w '%{http_code}' "$BALL46_URL/$name?_=${GITHUB_RUN_ID}") || true
            [ "$code" = 200 ] || continue
            ctype=$(tr -d '\r' < "/tmp/ball46-headers/$safe" | awk 'BEGIN{IGNORECASE=1}/^content-type:/{print tolower($0)}' | tail -1)
            case "$name" in
              *.js) [[ "$ctype" == *javascript* || "$ctype" == *text/plain* ]] || continue ;;
              *.css) [[ "$ctype" == *text/css* || "$ctype" == *text/plain* ]] || continue ;;
              *.html) [[ "$ctype" == *text/html* || "$ctype" == *text/plain* ]] || continue ;;
              *.svg) [[ "$ctype" == *svg* || "$ctype" == *xml* || "$ctype" == *text/plain* ]] || continue ;;
            esac
            sha=$(sha256sum "/tmp/ball46-prod/$safe" | awk '{print $1}')
            printf '%s\t%s\n' "$name" "$sha" >> /tmp/protected-assets.tsv
            cp "/tmp/ball46-prod/$safe" "$f"
          done < <(find nomad-live-343 -maxdepth 1 -type f | sort)
          test -s /tmp/protected-assets.tsv
          grep -Fq $'signal.html\t' /tmp/protected-assets.tsv
          grep -Fq $'statistics.html\t' /tmp/protected-assets.tsv
          grep -Fq $'dashboard-v2-stage3.js\t' /tmp/protected-assets.tsv
          echo PRODUCTION_STATIC_MIRROR_PASS

      - name: Patch only current production index with Prediction loader
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('nomad-live-343/index.html')
          s=p.read_text()
          loader='<script src="live-prediction-percent-343.js?v=343-live-prediction-percent-v1&order=20260919-1" defer></script>'
          marker='<script src="dashboard-v2-stage3.js?v=343-dashboard-v2-stage3-v5-default-rich-bridge&order=20260919-2&signal-owner=dashboard-v1" defer></script>'
          if loader not in s:
              if marker not in s: raise SystemExit('DASHBOARD_LOADER_MARKER_MISSING')
              s=s.replace(marker,loader+marker,1)
          if s.count(loader)!=1: raise SystemExit('PREDICTION_LOADER_COUNT_FAIL')
          if s.index(loader)>s.index(marker): raise SystemExit('PREDICTION_LOADER_ORDER_FAIL')
          p.write_text(s)
          PY
          grep -Fq 'data-prediction-card' nomad-live-343/index.html
          grep -Fq 'live-prediction-percent-343.js?v=343-live-prediction-percent-v1' nomad-live-343/index.html
          node --check nomad-live-343/live-prediction-percent-343.js

      - name: Persist only Prediction source and current index loader
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ball46 Prediction Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add nomad-live-343/index.html nomad-live-343/live-prediction-percent-343.js
          staged="$(git diff --cached --name-only)"
          printf '%s\n' "$staged"
          bad=$(printf '%s\n' "$staged" | grep -Ev '^(nomad-live-343/index.html|nomad-live-343/live-prediction-percent-343.js)$' || true)
          test -z "$bad" || { echo "STAGED_PROTECTED_CHANGE=$bad"; exit 1; }
          if git diff --cached --quiet; then echo 'No source commit needed'; else git commit -m 'feat(ball46): enable rolling live prediction percentages'; git push origin HEAD:${SOURCE_BRANCH}; fi

      - name: Record protected service state before deploy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 25 "$BALL46_URL/api/full-market/health?_=${GITHUB_RUN_ID}" -o /tmp/health-before.json
          node - <<'NODE'
          const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/health-before.json','utf8'));
          fs.writeFileSync('/tmp/fullmarket-version-before',String(h.version||''));
          fs.writeFileSync('/tmp/fullmarket-policy-before',String(h.staleCachePolicy||''));
          console.log('FULL_MARKET_BEFORE',h.version,h.staleCachePolicy||'');
          NODE

      - name: Deploy Ball46 wrapper/assets only
        working-directory: workers/nomadtips3-343-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify Prediction and protected surfaces unchanged
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 15); do
            curl -fsS --max-time 25 "$BALL46_URL/index.html?_=${GITHUB_RUN_ID}-${n}" -o /tmp/index-after.html || true
            if grep -Fq 'live-prediction-percent-343.js?v=343-live-prediction-percent-v1' /tmp/index-after.html 2>/dev/null; then break; fi
            sleep 2
          done
          grep -Fq 'data-prediction-card' /tmp/index-after.html
          grep -Fq 'live-prediction-percent-343.js?v=343-live-prediction-percent-v1' /tmp/index-after.html
          curl -fsS --max-time 25 "$BALL46_URL/live-prediction-percent-343.js?_=${GITHUB_RUN_ID}" -o /tmp/prediction-after.js
          node --check /tmp/prediction-after.js
          grep -Fq '343-live-prediction-percent-v1-rolling5-stability10-readonly' /tmp/prediction-after.js
          grep -Fq 'networkRequestsAdded:0' /tmp/prediction-after.js
          while IFS=$'\t' read -r name before; do
            [ "$name" = 'index.html' ] && continue
            safe="${name//\//_}"
            curl -fsS -L --max-time 25 "$BALL46_URL/$name?_=${GITHUB_RUN_ID}-after" -o "/tmp/after-$safe"
            after=$(sha256sum "/tmp/after-$safe" | awk '{print $1}')
            [ "$before" = "$after" ] || { echo "PROTECTED_ASSET_CHANGED: $name"; exit 1; }
          done < /tmp/protected-assets.tsv
          curl -fsS --max-time 25 "$BALL46_URL/api/full-market/health?_=${GITHUB_RUN_ID}-after" -o /tmp/health-after.json
          node - <<'NODE'
          const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/health-after.json','utf8'));
          const vb=fs.readFileSync('/tmp/fullmarket-version-before','utf8');const pb=fs.readFileSync('/tmp/fullmarket-policy-before','utf8');
          if(String(h.version||'')!==vb||String(h.staleCachePolicy||'')!==pb) throw Error('FULL_MARKET_CHANGED');
          console.log('PROTECTED_SURFACES_UNCHANGED',h.version,h.staleCachePolicy||'');
          NODE
          curl -fsS --max-time 25 "$BALL46_URL/api/engine/board?_=${GITHUB_RUN_ID}" -o /tmp/board.json
          node - <<'NODE'
          const fs=require('fs');const b=JSON.parse(fs.readFileSync('/tmp/board.json','utf8'));
          if(b.ok!==true||!Array.isArray(b.fixtures)) throw Error('BOARD_FAIL');
          console.log('BALL46_PREDICTION_PERCENT_DEPLOY_PASS',JSON.stringify({fixtures:b.fixtures.length,networkRequestsAdded:0,rolling:'5m',stability:'10m',update:'1m'}));
          NODE
