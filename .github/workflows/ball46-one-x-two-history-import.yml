name: BALL46 1X2 existing-feed league history import
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-one-x-two-history-import.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: ball46-direct-finished-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: real-prematch-raw-and-progress
          run-id: 44759126984
          github-token: ${{ github.token }}
          path: prior
      - name: Import confirmed league history and evaluate 1X2
        env:
          FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --check qa/prematch-history-20261120/one-x-two-history-import.mjs
          node qa/prematch-history-20261120/one-x-two-history-import.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-x-two-history-progress
          path: evidence/one-x-two/
          if-no-files-found: warn
          retention-days: 90
