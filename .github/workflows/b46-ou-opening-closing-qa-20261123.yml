name: BALL46 TEST O/U true opening-or-closing prices - offline QA
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-ou-opening-closing-qa-20261123.yml]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate actual Bet365 pre-match O/U payout stage, zero upstream calls
        run: |
          node --check qa/prematch-history-20261120/ou-verified-price-ingest-v1-test.mjs
          node --check qa/prematch-history-20261120/ou-price-pickup-v1-test.mjs
          node --test qa/prematch-history-20261120/ou-verified-price-ingest-v1.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-price-pickup-v1.test.mjs
          node --test qa/prematch-history-20261120/ou-math-v1.test.mjs
          echo 'OU_OPENING_CLOSING_OFFLINE_TEST_PASS 0 paid API calls'
