name: B46 live Shadow settlement audit (READ ONLY)
on:
  push:
    branches: [chatgpt/ball46-new-ledger-clean-v1]
    paths: ['.github/workflows/b46-live-shadow-readonly-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read legacy ledger, deployed versions, receiver namespace and logs; no writes
        run: |
          node <<'JS'
          const {createHash}=require('node:crypto');
          const cutoff=Date.parse('2026-11-17T21:32:00+07:00'),actual=Date.parse('2026-11-17T21:32:15.056+07:00');
          const base='https://api.cloudflare.com/client/v4/accounts/62cb0db544160e6591342abd6b4f35cc';
          const headers={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const qaId=s=>createHash('sha256').update(String(s)).digest('hex').slice(0,16);
          const get=async path=>{const r=await fetch(base+path,{headers,signal:AbortSignal.timeout(20000)});const j=await r.json();if(!r.ok||!j.success)throw Error('CF_READ_'+r.status+'_'+(j.errors??[]).map(e=>e.code).join('_'));return j};
          const result=(key,value)=>console.log(key+'='+JSON.stringify(value));
          const iso=t=>new Date(t).toISOString();
          (async()=>{
            const names=['nomadtips3-engine-343','ball46-shadow-receiver-production','ball46-production'];
            const state={};
            for(const name of names){
              try{
                const d=(await get('/workers/scripts/'+name+'/deployments?per_page=1')).result;
                const s=(await get('/workers/scripts/'+name+'/settings')).result;
                state[name]={active:d.deployments?.[0]?.versions,observability:s.observability??null,shadowBinding:s.bindings?.find(b=>b.name==='B46_SHADOW_RECEIVER')?.service??null};
              }catch(e){state[name]={error:e.message}}
            }
            result('AUDIT_DEPLOYMENT',state);
            try{
              let cursor=null,pages=0,scanned=0,source=null;const rows=new Map();
              // Archive is sorted by createdAt, not settlement time. Bound to 8 pages, never claim exhaustive absence.
              do{
                const u=new URL('https://www.ball46.com/api/engine/statistics');
                u.searchParams.set('paged','1');if(cursor)u.searchParams.set('cursor',cursor);
                const res=await fetch(u,{headers:{accept:'application/json','cache-control':'no-cache'},signal:AbortSignal.timeout(25000)});
                const d=await res.json().catch(()=>null);if(!res.ok||!d?.ok||!Array.isArray(d.rows))throw Error('LEGACY_HTTP_'+res.status);
                pages++;scanned+=d.rows.length;source=d.statisticsSource;
                for(const row of d.rows)if(row?.id&&row.status==='SETTLED'&&['WIN','HALF_WIN','LOSS','HALF_LOSS','PUSH'].includes(row.result)&&Number(row.settledAt)>=cutoff)rows.set(String(row.id),row);
                const next=d.nextCursor??null;if(next===cursor){cursor=null;break}cursor=next;
              }while(cursor&&pages<8);
              const ordered=[...rows.values()].sort((a,b)=>Number(b.settledAt)-Number(a.settledAt));
              const summarize=items=>{
                let w=0,l=0,pnl=0,unknown=0;
                for(const r of items){
                  if(['WIN','HALF_WIN'].includes(r.result)){w++;const o=Number(r.odds);if(r.odds==null||!Number.isFinite(o)||o<1)unknown++;else pnl+=(o-1)*(r.result==='HALF_WIN'?0.5:1);}
                  if(['LOSS','HALF_LOSS'].includes(r.result)){l++;pnl-=r.result==='HALF_LOSS'?0.5:1;}
                }
                return {count:items.length,pnl:unknown?null:Math.round(pnl*1e8)/1e8,winRate:w+l?w/(w+l)*100:0,latest:items.slice(0,5).map(r=>({idHash:qaId(r.id),settled_at:Number(r.settledAt),market_type:r.market??null,odds:r.odds??null,result:r.result}))};
              };
              const baseline=summarize(ordered.filter(r=>Number(r.settledAt)<=Date.parse('2026-11-17T23:26:57.974Z')));
              const current=summarize(ordered.filter(r=>Number(r.settledAt)>=actual));
              result('LEGACY_AUDIT_TOTALS',{baseline,current,archiveExhausted:!cursor,pnlUnit:'1 unit per signal; decimal odds; PUSH excluded from win rate'});
              require('node:fs').writeFileSync(process.env.RUNNER_TEMP+'/b46-legacy-audit.json',JSON.stringify({baseline,current,archiveExhausted:!cursor}));
              result('LEGACY_SETTLEMENT_AUDIT',{checkedAt:iso(Date.now()),cutoff:iso(cutoff),activation:iso(actual),source,pages,scanned,archiveExhausted:!cursor,matched:ordered.length,fixtures:new Set(ordered.map(r=>r.fixtureId).filter(Boolean)).size,latest:ordered.slice(0,5).map(r=>({idHash:qaId(r.id),fixtureHash:r.fixtureId?qaId(r.fixtureId):null,settledAt:iso(Number(r.settledAt)),result:r.result,market:r.market??null,odds:r.odds??null,afterActualDeploy:Number(r.settledAt)>=actual}))});
            }catch(e){result('LEGACY_READ_ERROR',e.message)}
            try{
              const ns=(await get('/workers/durable_objects/namespaces?per_page=100')).result;
              const targets=ns.filter(n=>n.script==='ball46-shadow-receiver-production'&&n.class==='ShadowProductionStore');
              const output=[];
              for(const target of targets){
                const o=await get('/workers/durable_objects/namespaces/'+encodeURIComponent(target.id)+'/objects?limit=100');
                output.push({class:target.class,sqlite:target.use_sqlite,objects:o.result?.length??0,withStoredData:(o.result??[]).filter(x=>x.hasStoredData===true).length,metadataOnly:true});
              }
              result('RECEIVER_NAMESPACE_METADATA',{namespaces:output,individualRowsReadable:false,pendingReadable:false,duplicateReadable:false});
            }catch(e){result('RECEIVER_METADATA_ERROR',e.message)}
            for(const name of names.slice(0,2)){
              try{
                // Observability query is a dry read; POST is used only for query parameters.
                const q={queryId:'b46-shadow-readonly-'+name,timeframe:{from:cutoff,to:Date.now()},dry:true,view:'events',limit:200,parameters:{datasets:['cloudflare-workers'],filters:[{key:'$workers.scriptName',operation:'eq',type:'string',value:name}],filterCombination:'and'}};
                const res=await fetch(base+'/workers/observability/telemetry/query',{method:'POST',headers:{...headers,'content-type':'application/json'},body:JSON.stringify(q),signal:AbortSignal.timeout(25000)});
                const d=await res.json();if(!res.ok||d.success===false)throw Error('OBS_HTTP_'+res.status+'_'+(d.errors??[]).map(x=>x.code).join('_'));
                const root=d.result??d;
                const list=Array.isArray(root.events)?root.events:Array.isArray(root.events?.events)?root.events.events:null;
                if(!list){result('OBS_LOG_SHAPE',{name,keys:Object.keys(root),eventsKeys:Object.keys(root.events??{})});continue}
                let shadowErrors=0,failedInvocations=0,settledCalls=0,alarmEvents=0;
                for(const event of list){const s=JSON.stringify(event);if(/SHADOW_DROP_RECOVERY|SHADOW_COLLECTION_FAILED|SHADOW_SCHEDULE_FAILED|SHADOW_RECEIVER_ERROR/.test(s))shadowErrors++;const o=event.$workers?.outcome??event.outcome;if(o&&o!=='ok')failedInvocations++;if(/shadow\.internal\/settled|store\.internal\/enqueue/.test(s))settledCalls++;if(event.$workers?.eventType==='alarm')alarmEvents++}
                result('OBS_READ',{name,returned:list.length,shadowErrors,failedInvocations,settledCalls,alarmEvents,limit:200,absenceIsNotProof:list.length===0||list.length>=200});
              }catch(e){result('OBS_READ_ERROR',{name,error:e.message})}
            }
          })().catch(e=>{console.error('AUDIT_FAILED='+String(e.message).slice(0,120));process.exitCode=1});
          JS
      - name: Read authenticated private Receiver snapshot through remote service binding (no deployment)
        env:
          CLOUDFLARE_ACCOUNT_ID: '62cb0db544160e6591342abd6b4f35cc'
          B46_AUDIT_TOKEN: ${{ secrets.AUDIT_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${B46_AUDIT_TOKEN:-}" ]; then
            echo 'RECEIVER_AUDIT_BLOCKED=AUDIT_READ_TOKEN_NOT_AVAILABLE_IN_ACTIONS'
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/b46-private-read"
          cd "$RUNNER_TEMP/b46-private-read"
          npm install --no-save --no-package-lock --ignore-scripts wrangler@4.92.0
          cat > wrangler.json <<'JSON'
          {"name":"b46-private-audit-local","compatibility_date":"2026-11-17","workers_dev":false,"preview_urls":false,"services":[{"binding":"RECEIVER","service":"ball46-shadow-receiver-production","remote":true}]}
          JSON
          node --input-type=module <<'JS'
          import {getPlatformProxy} from 'wrangler';
          import {createHash} from 'node:crypto';
          import {readFileSync} from 'node:fs';
          const hash=s=>createHash('sha256').update(String(s)).digest('hex').slice(0,16);
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const res=await fetch(base+'/workers/scripts/ball46-shadow-receiver-production/deployments?per_page=1',{headers,signal:AbortSignal.timeout(20000)});
          const dep=await res.json();
          if(!res.ok||!dep.success)throw Error('RECEIVER_DEPLOYMENT_READ_FAILED');
          const versions=dep.result?.deployments?.[0]?.versions??[];
          if(versions.length!==1||Number(versions[0].percentage)!==100||['9fc95e75-4833-429e-b119-0051b3a3d316','7a576455-14b3-401f-80e6-f6dd70f76dc1'].includes(versions[0].version_id)){
            console.log('RECEIVER_AUDIT_BLOCKED=RECEIVER_SNAPSHOT_DEPLOYMENT_NOT_CONFIRMED');process.exit(0);
          }
          const proxy=await getPlatformProxy({configPath:'wrangler.json',remoteBindings:true,persist:false});
          try{
            const url='https://shadow.internal/audit-snapshot';
            const missing=await proxy.env.RECEIVER.fetch(url,{method:'GET'});
            console.log('RECEIVER_AUTH_MISSING_HTTP='+missing.status);
            if(missing.status!==403)throw Error('NO_TOKEN_EXPECTED_403');
            const wrong=await proxy.env.RECEIVER.fetch(url,{method:'GET',headers:{authorization:'Bearer invalid-audit-token'}});
            console.log('RECEIVER_AUTH_WRONG_HTTP='+wrong.status);
            if(wrong.status!==403)throw Error('WRONG_TOKEN_EXPECTED_403');
            const good=await proxy.env.RECEIVER.fetch(url,{method:'GET',headers:{authorization:'Bearer '+process.env.B46_AUDIT_TOKEN}});
            console.log('RECEIVER_AUTH_VALID_HTTP='+good.status);
            if(good.status!==200)throw Error('VALID_TOKEN_EXPECTED_200');
            const data=await good.json();
            if(data.readOnly!==true||!data.inbox||!data.book||!Array.isArray(data.book.recent_5_signals))throw Error('UNEXPECTED_SNAPSHOT_SCHEMA');
            const book={settled_count:data.book.settled_count,total_pnl:data.book.total_pnl,win_rate:data.book.win_rate,recent_5_signals:data.book.recent_5_signals.map(r=>({idHash:hash(r.signal_id),settled_at:r.settled_at,market_type:r.market_type,odds:r.odds,result:r.result}))};
            console.log('RECEIVER_AUDIT_SNAPSHOT='+JSON.stringify({inbox:data.inbox,book,readOnly:true}));
            let legacy;try{legacy=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/b46-legacy-audit.json','utf8'))}catch{}
            if(legacy){
              const compare=rows=>rows.map(a=>{const b=book.recent_5_signals.find(x=>x.idHash===a.idHash);return {legacy:a,receiver:b??null,match:!!b&&a.market_type===b.market_type&&Number(a.odds)===Number(b.odds)&&a.odds!=null&&b.odds!=null&&a.result===b.result&&a.settled_at===b.settled_at};});
              console.log('RECEIVER_AUDIT_COMPARISON='+JSON.stringify({baseline:legacy.baseline,current:legacy.current,receiverCount:book.settled_count,baselineRecent:compare(legacy.baseline.latest),currentRecent:compare(legacy.current.latest),note:'Receiver snapshot is cumulative; historical cohort equality not proven if later signals exist; legacy scan is bounded and reads are not atomic.'}));
            }
          }finally{await proxy.dispose()}
          JS
