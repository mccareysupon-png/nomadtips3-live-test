name: Deploy Telegram Alerts Step 2 TEST

on:
  push:
    branches:
      - 'work/telegram-alerts-step2-mainline-20260903'
    paths:
      - '.github/workflows/telegram-alerts-step2-deploy.yml'
      - '.github/telegram-alerts-step2-deploy-trigger'
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKER_NAME: nomadtips3-telegram-alerts-test
  WORKER_URL: https://nomadtips3-telegram-alerts-test.mccarey-supon.workers.dev

jobs:
  deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Step 2 source
        working-directory: telegram-alerts/worker
        run: |
          npm run check
          npm test

      - name: Validate Cloudflare credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy Step 2 to existing TEST Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: telegram-alerts/worker
          wranglerVersion: '4'
          command: deploy

      - name: Verify Worker health and preserved Step 1 secrets
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            HEALTH=$(curl -fsS "$WORKER_URL/health" || true)
            if printf '%s' "$HEALTH" | grep -q 'STEP_2_SIGNAL_BRIDGE'; then
              break
            fi
            sleep 3
          done
          echo "$HEALTH"
          printf '%s' "$HEALTH" | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] is True; assert d['service']=='nomadtips3-telegram-alerts'; assert d['phase']=='STEP_2_SIGNAL_BRIDGE'; c=d['configured']; assert c['db'] and c['signalBridgeDb'] and c['botToken'] and c['webhookSecret'] and c['adminToken'] and c['publicWebhookUrl'] and c['signalSourceUrl']"

      - name: Verify service-bound baseline and membership safety
        run: |
          set -euo pipefail
          BRIDGE=''
          for i in $(seq 1 30); do
            BRIDGE=$(curl -fsS "$WORKER_URL/bridge/status" || true)
            if printf '%s' "$BRIDGE" | python -c "import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if d.get('initialized') is True else 1)" 2>/dev/null; then
              break
            fi
            sleep 5
          done
          echo "$BRIDGE"
          printf '%s' "$BRIDGE" | python -c "import json,sys; d=json.load(sys.stdin); assert d['ok'] is True; assert d['phase']=='STEP_2_SIGNAL_BRIDGE'; assert d['initialized'] is True; assert d['sourceTransport']=='SERVICE_BINDING'; assert int(d.get('sourceRecordCount') or 0)>0; assert not d.get('lastError'); s=d['subscribers']; assert int(s.get('pending_payment') or 0)>=1; assert int(s.get('active') or 0)==0; signals=d['signals']; assert int(signals.get('baseline') or 0)>0; assert int(signals.get('delivered') or 0)==0; print('STEP2_LIVE_SAFE', {'transport':d['sourceTransport'],'baseline':signals.get('baseline'),'pending':s.get('pending_payment'),'active':s.get('active'),'delivered':signals.get('delivered')})"
