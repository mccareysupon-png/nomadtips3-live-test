name: BALL46 Performance Summary isolated QA 20261124
on:
  push:
    branches: [test/ball46-performance-summary-20261124]
    paths:
      - '.github/workflows/b46-performance-summary-test-20261124.yml'
      - 'qa/performance-summary-20261124/**'
permissions:
  contents: read
concurrency:
  group: ball46-performance-summary-test-20261124
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check formula, London rollover, and snapshot verification
        run: |
          node --check qa/performance-summary-20261124/worker.mjs
          node --test qa/performance-summary-20261124/summary.test.mjs
      - name: Deploy isolated Performance Worker
        run: npx --yes wrangler@4.50.0 deploy --config qa/performance-summary-20261124/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify served first paint and preserve responsive layout
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
          node qa/performance-summary-20261124/browser-qa.mjs
