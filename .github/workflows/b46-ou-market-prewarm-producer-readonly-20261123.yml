name: BALL46 O/U source of Full Market cache prewarm READ ONLY
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-ou-market-prewarm-producer-readonly-20261123.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Inspect only deployed source cache fill consumers and prewarm route selection
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const root='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers';
          const cf=async path=>{
           const r=await fetch(root+path,{headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(45000)});
           const j=await r.json();assert(r.ok&&j.success,'BAD_CF_GET_'+path);return j.result;
          };
          for(const name of ['ball46-production','nomadtips3-full-market-343-ball46']){
           const latest=await cf('/scripts/'+name+'/deployments?per_page=1');
           const id=latest.deployments?.[0]?.versions?.[0]?.version_id;
           const worker=await cf('/workers/'+name+'/versions/'+id+'?include=modules');
           let files=0,shown=0;
           for(const module of worker.modules){
            if(!module.content_base64)continue;
            const src=Buffer.from(module.content_base64,'base64').toString('utf8');
            const lines=src.split('\n'),out=[];
            for(let i=0;i<lines.length;i++)if(/\/prewarm|\/board-cache|\/fixture-odds|FULL_MARKET|fullMarket|scheduled.*full|scheduled.*prewarm/i.test(lines[i])){
             for(let k=Math.max(0,i-1);k<=Math.min(lines.length-1,i+2);k++){
              const item={n:k+1,line:lines[k].slice(0,280)};
              if(!out.some(x=>x.n===item.n))out.push(item);
             }
            }
            if(out.length){files++;shown+=out.length;console.log('B46_PREWARM_USAGE '+JSON.stringify({
             worker:name,version:id,module:module.name,
             totalLines:lines.length,excerpts:out.slice(0,65)}).slice(0,17000))}
           }
           console.log('B46_PREWARM_SUMMARY '+JSON.stringify({worker:name,version:id,sourceModules:worker.modules.length,matchedFiles:files,excerpts:shown,providerRequests:0,changes:0}));
          }
          JS
