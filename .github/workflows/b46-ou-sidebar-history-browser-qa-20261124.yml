name: BALL46 TEST browser QA sidebar combined win rate and public paged O-U history 20261124
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-ou-sidebar-history-browser-qa-20261124.yml]
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Chromium for read-only UI test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Verify sidebar combined rate on O/U and 1X2, and 10-row page history PC/mobile
        run: node qa/prematch-history-20261120/b46-ou-sidebar-history-browser-qa-20261124.mjs
