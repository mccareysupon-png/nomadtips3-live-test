name: DIAG - Map active Ball46 Event Flow modules 20261002

on:
  push:
    branches: [work/eventflow-signal-20261002]
    paths: ['.github/workflows/diag-ball46-eventflow-module-map-20261002.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  BALL46_URL: https://ball46.com

jobs:
  map-modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Lock active version and download modules
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          mkdir -p /tmp/b46-map/modules /tmp/b46-map/out
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=3" -H "$AUTH" -o /tmp/b46-map/deployments.json
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/b46-map/deployments.json','utf8'));
          if(j.success!==true)throw Error('DEPLOYMENTS_FAILED');
          const d=j.result?.deployments?.[0];
          if(!d||!Array.isArray(d.versions)||d.versions.length!==1||Number(d.versions[0].percentage)!==100)throw Error('NOT_SINGLE_ACTIVE_VERSION');
          const id=String(d.versions[0].version_id);
          fs.writeFileSync('/tmp/b46-map/version-id',id);
          fs.writeFileSync('/tmp/b46-map/out/active.json',JSON.stringify({deploymentId:d.id,versionId:id,createdOn:d.created_on},null,2));
          NODE
          V=$(cat /tmp/b46-map/version-id)
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/workers/$SCRIPT_NAME/versions/$V?include=modules" -H "$AUTH" -o /tmp/b46-map/version.json
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const v=JSON.parse(fs.readFileSync('/tmp/b46-map/version.json','utf8'));
          if(v.success!==true)throw Error('VERSION_FETCH_FAILED');
          const r=v.result;if(!r?.main_module||!Array.isArray(r.modules))throw Error('MODULES_MISSING');
          for(const m of r.modules){
            const p=path.join('/tmp/b46-map/modules',m.name);fs.mkdirSync(path.dirname(p),{recursive:true});fs.writeFileSync(p,Buffer.from(m.content_base64,'base64'));
          }
          fs.writeFileSync('/tmp/b46-map/out/module-list.json',JSON.stringify({mainModule:r.main_module,modules:r.modules.map(m=>({name:m.name,contentType:m.content_type,size:Buffer.from(m.content_base64,'base64').length}))},null,2));
          NODE

      - name: Capture current public Event Flow assets
        shell: bash
        run: |
          set -euo pipefail
          nonce="${GITHUB_RUN_ID}-$(date +%s%N)"
          curl -fsSL "$BALL46_URL/expanded-match-343.js?diag=$nonce" -o /tmp/b46-map/current-expanded-match-343.js
          curl -fsSL "$BALL46_URL/expanded-match-343.css?diag=$nonce" -o /tmp/b46-map/current-expanded-match-343.css
          sha256sum /tmp/b46-map/current-expanded-match-343.* > /tmp/b46-map/out/public-asset-sha256.txt

      - name: Map exact asset content and serving anchors
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const root='/tmp/b46-map/modules';
          const js=fs.readFileSync('/tmp/b46-map/current-expanded-match-343.js');
          const css=fs.readFileSync('/tmp/b46-map/current-expanded-match-343.css');
          const needles=[
            '343-expanded-match-v4-stable-lifecycle',
            'expanded-match-343.js',
            'expanded-match-343.css',
            'EVENT FLOW',
            'expand-flow-chart'
          ];
          const files=[];
          function walk(d){for(const n of fs.readdirSync(d)){const p=path.join(d,n),st=fs.statSync(p);if(st.isDirectory())walk(p);else files.push(p)}}walk(root);
          const result=[];
          for(const p of files){
            const b=fs.readFileSync(p);const text=b.toString('utf8');
            const hits={};for(const n of needles){const i=text.indexOf(n);if(i>=0)hits[n]={index:i,snippet:text.slice(Math.max(0,i-180),Math.min(text.length,i+420))}}
            const exactJs=text.includes(js.toString('utf8'));
            const exactCss=text.includes(css.toString('utf8'));
            if(Object.keys(hits).length||exactJs||exactCss)result.push({module:path.relative(root,p),size:b.length,sha256:crypto.createHash('sha256').update(b).digest('hex'),exactJs,exactCss,hits});
          }
          fs.writeFileSync('/tmp/b46-map/out/module-map.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result.map(x=>({module:x.module,exactJs:x.exactJs,exactCss:x.exactCss,keys:Object.keys(x.hits)})),null,2));
          if(!result.some(x=>x.hits['343-expanded-match-v4-stable-lifecycle']||x.exactJs))throw Error('EXPANDED_JS_NOT_MAPPED');
          NODE

      - name: Upload map
        uses: actions/upload-artifact@v4
        with:
          name: ball46-eventflow-module-map-${{ github.run_id }}
          path: /tmp/b46-map/out
          if-no-files-found: error
          retention-days: 7
