name: BALL46 owner-approved pending UI batch production release
on:
  push:
    branches: [release/ball46-ui-batch-20261120]
    paths: ['.github/workflows/ui-batch-production-20261120.yml']
permissions:
  contents: read
concurrency:
  group: ball46-production-ui-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/release/ball46-ui-batch-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser and check frozen source
        run: |
          node --check qa/ui-batch-20261120/patch.mjs
          node --check qa/ui-batch-20261120/wrapper.mjs
          node --check qa/ui-batch-20261120/release.mjs
          npm install --prefix qa/ui-batch-20261120/.runtime --no-fund --no-audit playwright@1.55.0
          qa/ui-batch-20261120/.runtime/node_modules/.bin/playwright install chromium --only-shell
      - name: Inactive preview verification then single gated Production deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node qa/ui-batch-20261120/release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-batch-production-proof
          path: ${{ runner.temp }}/ui-batch-production-proof
          if-no-files-found: ignore
