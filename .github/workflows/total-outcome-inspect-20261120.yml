name: Read-only inspect Total outcome bar border
on:
  push:
    branches: [test/ball46-total-outcome-border-20261120]
    paths: ['.github/workflows/total-outcome-inspect-20261120.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
          node <<'EOF'
          const {chromium,devices}=require('playwright');
          (async()=>{const b=await chromium.launch();try{for(const mobile of [false,true]){
          const p=await b.newPage(mobile?{...devices['iPhone 13'],serviceWorkers:'block'}:{viewport:{width:1920,height:1000},serviceWorkers:'block'});
          await p.route('**/*',r=>['GET','HEAD'].includes(r.request().method())?r.continue():r.abort());
          await p.goto('https://ball46-production.mccarey-supon.workers.dev/index.html?view=statistics',{waitUntil:'domcontentloaded'});
          await p.waitForFunction(()=>[...document.querySelectorAll('[data-sp-table-body] tr')].some(r=>r.cells.length>=4),null,{timeout:60000});
          await p.waitForTimeout(3000);
          const a=await p.evaluate(()=>[...document.querySelectorAll('#b46-finance-chart-card .b46-stage-outcomes-track, #b46-finance-chart-card .b46-stage-outcomes-segment')].map(e=>{const c=getComputedStyle(e);return {html:e.outerHTML.slice(0,1000),border:c.border,outline:c.outline,shadow:c.boxShadow,background:c.backgroundColor,padding:c.padding,gap:c.gap,visible:!!e.getClientRects().length}}));
          console.log('OUTCOME_DOM '+JSON.stringify({mobile,a}));
          await p.close()
          }}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)})
          EOF
