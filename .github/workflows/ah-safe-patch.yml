name: AH Settings Safe Patch

on:
  push:
    branches:
      - work/nomad342-ah-settings-safe
    paths:
      - .github/workflows/ah-safe-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nomad342-ah-settings-safe
          fetch-depth: 0
      - name: Apply isolated Asian Handicap patch
        env:
          PATCH_B64: >-
            
            
            
            
            tVd5hHEuKSyETEk/ljhsbYzfsrFuldrTVZ2AzA1Oqghn0dZ2fOwlffVPHNYrhhZGWgX/rmRF8wLCid+J8gcoEOiNGQRVtt0eS07oT2LYms8O3c4J/ZVKjkC0BlqGEFwD+NpdLYYWGv3NC7yLaeizhNkAoHYqOEn71kTrGkwsCGMs/X8XXCR+
        run: |
          python - <<'PY2'
          import os,base64,zlib
          exec(zlib.decompress(base64.b64decode(os.environ['PATCH_B64'])).decode('utf-8'), {'__name__':'__main__','__file__':'.github/scripts/ah-safe-patch.py'})
          PY2
      - name: Safety and syntax checks
        run: |
          node --check nomad-live-342/market-settings-v3.js
          node --check nomad-live-342/market-settings-server-sync.js
          node --check workers/nomadtips3-342-signal-engine/src/index.js
          node --check workers/nomadtips3-342-ledger/src/index.js
          (cd workers/nomadtips3-342-ledger && npm test)
          git diff --check
          changed="$(git diff --name-only)"
          echo "$changed"
          if echo "$changed" | grep -Eq '^nomad-live/|3\.41'; then
            echo '::error::Legacy 3.41 path changed'; exit 1
          fi
      - name: Commit tested AH changes to safe branch
        run: |
          rm -f .github/workflows/ah-safe-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add isolated Asian Handicap settings with rollback safety'
          git push origin HEAD:work/nomad342-ah-settings-safe
