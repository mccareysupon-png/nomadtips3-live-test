name: BALL46 real O/U V2 to EXISTING PreMatch TEST UI backend deploy
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-priced-ou-existing-ui-backend-deploy-test-20261123.yml]
permissions: {contents: read}
concurrency:
  group: ball46-prematch-only-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Pure view transformation tests + Asian O/U and original PreMatch engine regression
        run: |
          node --check qa/prematch-history-20261120/deploy-priced-ou-existing-test-ui-backend-20261123.mjs
          node --check qa/prematch-history-20261120/patch-priced-ou-into-existing-prematch-ui-test-20261123.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/patch-priced-ou-into-existing-prematch-ui.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-value-screener-v2.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/prematch-ou-engine-v1.test.mjs
      - name: Guarded backend TEST deploy: add actual immutable O/U V2 picks to EXISTING UI data path
        run: node qa/prematch-history-20261120/deploy-priced-ou-existing-test-ui-backend-20261123.mjs
