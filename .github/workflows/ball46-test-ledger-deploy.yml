name: BALL46 existing test Worker 1X2 ledger
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-test-ledger-deploy.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: ball46-prematch-only-test
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check qa/prematch-v1-20261120/deploy-test-ledger.mjs
          node --check qa/prematch-history-20261120/prematch-only-worker.mjs
          node --test qa/prematch-history-20261120/test-pick-ledger.test.mjs qa/prematch-history-20261120/market-1x2.test.mjs qa/prematch-history-20261120/stored-signal-adapter.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: ball46-frozen-1x2-test-picks
          run-id: 44766282517
          github-token: ${{ github.token }}
          path: frozen
      - name: Deploy into existing test Workers and seed verified picks
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
        run: node qa/prematch-v1-20261120/deploy-test-ledger.mjs
