name: BALL46 Statistics Mobile 14 KPI — Active State Read Only
on:
  push:
    branches: [codex/ball46-stats-mobile-14-kpi-7x2-prod-20261020]
    paths:
      - '.github/workflows/ball46-stats-mobile-14kpi-active-readonly-20261020.yml'
      - 'deploy-assets/stats-mobile-v1-preview-20261020/verify-active-only.mjs'
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read active Cloudflare production and domain marker
        run: node deploy-assets/stats-mobile-v1-preview-20261020/verify-active-only.mjs
