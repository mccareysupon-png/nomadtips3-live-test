name: Member2 Cloudflare Access Recent Decisions
on:
  push:
    branches: [member2/isolated-ui-and-registration-20261011]
    paths: ['.github/workflows/member2-access-decisions-readonly.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read Access application events without exposing personal details
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/access/logs/access_requests?per_page=100"
          code=$(curl -sS --max-time 20 -o /tmp/logs -w '%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "$url")
          echo "ACCESS_LOG_HTTP=$code"
          jq -c '{success,errors,eventsCount:(.result|if type=="array" then length else 0 end),events:[.result[]? | select((.app_domain//.application_name//.app_name//"")|contains("member2")) | {allowed,action,decision,created_at,reason,application_name,app_domain}]}' /tmp/logs | head -c 6000
          echo
