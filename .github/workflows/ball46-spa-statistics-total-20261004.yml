name: Ball46 SPA Statistics TOTAL Asset Only 20261004
on:
  push:
    branches: ['safe/ball46-spa-statistics-total-20261004']
    paths: ['.github/workflows/ball46-spa-statistics-total-20261004.yml']
permissions:
  contents: read
concurrency:
  group: ball46-production-spa-statistics-total
  cancel-in-progress: false
jobs:
  total:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install proven surgical rail dependencies
        working-directory: deploy-assets/match-status-svg-20261003
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Preview, deploy only SPA asset and verify live TOTAL against API
        working-directory: deploy-assets/match-status-svg-20261003
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node spa-total-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-spa-total-${{ github.run_id }}
          path: deploy-assets/match-status-svg-20261003/audit/
          retention-days: 7
