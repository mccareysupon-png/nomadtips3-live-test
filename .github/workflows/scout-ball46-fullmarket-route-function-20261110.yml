name: Scout BALL46 Full Market Route Function 20261110
on:
  push:
    branches: [test/ball46-fullmarket-perf-fix-20261110]
    paths: ['fullmarket-perf-fix-20261110/FUNCTION_SCOUT_READY']
permissions: {contents: read}
jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: test/ball46-fullmarket-perf-fix-20261110}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node fullmarket-perf-fix-20261110/function-scout.mjs
