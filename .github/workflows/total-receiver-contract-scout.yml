name: TOTAL card receiver contract scout (read only)
on:
  push:
    branches: [test/ball46-total-single-renderer-20261119]
    paths: ['.github/workflows/total-receiver-contract-scout.yml']
permissions:
  contents: read
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read the existing receiver graph and verify its summary fields
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          for(const market of ['all','AH']){
            const url='https://ball46.com/b46-receiver-v1/graph?'+new URLSearchParams({market,variant:'all',filter:'all',range:'all'});
            try{const r=await fetch(url,{signal:AbortSignal.timeout(25000)}),j=await r.json();
              console.log('GRAPH '+JSON.stringify({market,status:r.status,keys:Object.keys(j),summary:j.summary,seq:j.sequence,series:Object.fromEntries(Object.entries(j.series||{}).map(([k,v])=>[k,{length:v.length,first:v[0],last:v.at(-1)}]))}));
            }catch(e){console.log('GRAPH_ERROR '+String(e))}
          }
          NODE
