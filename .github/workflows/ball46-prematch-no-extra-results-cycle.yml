name: BALL46 Pre-Match consume normal results cycle only
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-prematch-no-extra-results-cycle.yml']
permissions:
  contents: read
concurrency:
  group: ball46-prematch-only-test
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static no additional pickup checks
        run: |
          node --check qa/prematch-history-20261120/prematch-only-worker.mjs
          node --check qa/prematch-history-20261120/no-extra-results-deploy.mjs
          ! grep -q 'api.5dollarfootballapi.com' qa/prematch-history-20261120/prematch-only-worker.mjs
          node --test qa/prematch-history-20261120/test-pick-ledger.test.mjs qa/prematch-history-20261120/market-1x2.test.mjs
      - name: Deploy isolated Pre-Match no-polling result handler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node qa/prematch-history-20261120/no-extra-results-deploy.mjs
