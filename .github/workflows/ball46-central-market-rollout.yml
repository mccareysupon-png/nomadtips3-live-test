name: BALL46 central transport migrate Full Market only
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-central-market-rollout.yml']
permissions:
  contents: read
concurrency:
  group: ball46-central-market-rollout
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Migrate Full Market and verify natural scan and private read-only health
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node qa/prematch-history-20261120/central-market-rollout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: central-market-rollout
          path: evidence/
