name: BALL46 Production Mobile Ultra Soft Event Flow V3
on:
  push:
    branches: [codex/ball46-mobile-ultrasoft-eventflow-20261020]
    paths:
      - '.github/workflows/ball46-mobile-ultrasoft-deploy-20261020.yml'
      - 'deploy-assets/mobile-ultrasoft-flow-20261020/deploy.mjs'
      - 'deploy-assets/mobile-ultrasoft-flow-20261020/patch.mjs'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  verify-preview-and-cutover:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and browser test dependency
        working-directory: deploy-assets/mobile-ultrasoft-flow-20261020
        run: |
          set -euo pipefail
          node --check patch.mjs
          node --check deploy.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
      - name: Verify live Worker, test real asset and synthetic 11 min curves, then guarded deploy
        working-directory: deploy-assets/mobile-ultrasoft-flow-20261020
        run: node deploy.mjs
      - name: Save audit and before-after screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-mobile-ultrasoft-eventflow-v3-verification
          path: deploy-assets/mobile-ultrasoft-flow-20261020/audit/
          retention-days: 30
          if-no-files-found: warn
