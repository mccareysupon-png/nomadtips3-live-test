name: DIAG Engine343 secret names 20260927

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-engine343-secrets-20260927.yml'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: List production engine secret names only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 secret list --name nomadtips3-engine-343
