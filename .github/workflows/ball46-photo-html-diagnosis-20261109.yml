name: BALL46 photo candidate HTML read-only diagnosis
on:
  push:
    branches: [codex/ball46-member-promo-20261104]
    paths: ['work/member-promo-sharp-20261109/html-diagnosis-request.json']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false --prefix work/member-promo-sharp-20261109 parse5@7.3.0
      - run: node work/member-promo-sharp-20261109/html-diagnosis.mjs
      - name: Save public HTML comparison
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/member-promo-sharp-20261109/release-audit/html-diagnosis.json
          git commit -m "Record read-only HTML candidate difference [skip ci]"
          git push origin HEAD:codex/ball46-member-promo-20261104
