name: BALL46 Stripe Sandbox — Complete Hosted Checkout using Test Card
on:
  push:
    branches: [audit/ball46-member-stripe-e2e-20261021]
    paths:
      - '.github/workflows/ball46-stripe-test-checkout-pay.yml'
permissions:
  contents: read
jobs:
  pay-testmode:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install hosted test Checkout automation browser
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Complete Stripe-hosted Test Mode $5 subscription with Stripe's fake Visa
        env:
          CHECKOUT_TEST_ONLY_URL: "https://checkout.stripe.com/c/pay/cs_test_a14jYICcHvwJJk7Ze8PB9TiWD0AmKYmYcgDQ4HBdsm9b20qgSOLaIW25G0#fidnandhYHdWcXxpYCc%2FJ2FgY2RwaXEnKSdicyc%2FNSknZHVsTmB8Jz8ndW5acWB2cVowNEkxYE9dQ11oTlZWU31UYUZ%2FN1AxRkhARHNJaVIzTlZEfU9wXWAzcERMUkNnNj1KbDRBNEFBTDdxY309c0hSdHVEXFdraG8wX2lMd312ZF1SQUcySHd9cTU1VWhddnB0T0knKSdjd2poVmB3c2B3Jz9xd3BgKSdnZGZuYndqcGthRmppancnPycmY2NjY2NjJyknaWR8anBxUXx1YCc%2FJ3Zsa2JpYFpscWBoJyknYGtkZ2lgVWlkZmBtamlhYHd2Jz9xd3BgeCUl"
          CHECKOUT_TEST_ONLY_ID: "cs_test_a14jYICcHvwJJk7Ze8PB9TiWD0AmKYmYcgDQ4HBdsm9b20qgSOLaIW25G0"
        run: |
          node <<'JS'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright');
          (async()=>{
            assert(process.env.CHECKOUT_TEST_ONLY_ID.startsWith('cs_test_'),'STOP_NON_TEST_CHECKOUT_SESSION');
            const target=new URL(process.env.CHECKOUT_TEST_ONLY_URL);
            assert(target.hostname==='checkout.stripe.com'&&target.pathname.includes('pay'),'STOP_NON_STRIPE_HOSTED_CHECKOUT');
            const browser=await chromium.launch({headless:true});
            try{
             const page=await browser.newPage({viewport:{width:1280,height:940}});
             await page.goto(target.toString(),{waitUntil:'domcontentloaded',timeout:60000});
             await page.locator('input[name="cardNumber"]').waitFor({state:'visible',timeout:45000});
             const shown=await page.locator('body').innerText();
             assert(/BALL46 MEMBER/.test(shown),'STOP_WRONG_PRODUCT');
             assert(/5[.,]00|\$5|5.00/.test(shown),'STOP_NON_FIVE_DOLLAR_PRICE');
             await page.locator('input[name="cardNumber"]').fill('4242424242424242');
             await page.locator('input[name="cardExpiry"]').fill('12 / 30');
             await page.locator('input[name="cardCvc"]').fill('123');
             await page.locator('input[name="billingName"]').fill('BALL46 TEST CUSTOMER');
             const zip=page.locator('input[name="billingPostalCode"]');
             if(await zip.isVisible())await zip.fill('10001');
             const pay=page.getByRole('button',{name:/Subscribe/i}).last();
             await pay.click({timeout:30000});
             try{
               await page.waitForURL(u=>u.hostname==='member.ball46.com'&&u.pathname.startsWith('/success'),{timeout:100000});
             }catch(err){
               const info=await page.evaluate(()=>({host:location.hostname,path:location.pathname,
                 errors:[...document.querySelectorAll('[role=alert]')].map(x=>x.innerText?.slice(0,120)),
                 buttonText:[...document.querySelectorAll('button')].map(x=>x.innerText?.trim().slice(0,80)).filter(Boolean).slice(0,10)}));
               console.error('BALL46_CHECKOUT_TEST_MODE_NO_SUCCESS_REDIRECT',JSON.stringify(info));
               throw err;
             }
             const state=await page.evaluate(()=>({host:location.hostname,path:location.pathname,title:document.title,
               sessionIdInUrl:new URL(location.href).searchParams.get('session_id')?.startsWith('cs_test_')}));
             assert(state.sessionIdInUrl,'STRIPE_TEST_SESSION_ID_NOT_RETURNED');
             console.log('BALL46_STRIPE_TEST_HOSTED_CHECKOUT_PAYMENT_RETURN_SUCCESS',JSON.stringify(state));
            }finally{await browser.close();}
          })().catch(e=>{console.error('BALL46_STRIPE_TEST_HOSTED_CHECKOUT_PAYMENT_FAILED',String(e.stack||e));process.exitCode=1});
          JS
