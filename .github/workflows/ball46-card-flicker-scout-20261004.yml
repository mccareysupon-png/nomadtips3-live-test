name: Ball46 Card Flicker Scout 20261004

on:
  push:
    branches: [work/card-flicker-scout-20261004]
    paths:
      - '.github/workflows/ball46-card-flicker-scout-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Capture current Production card behavior read only
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/ball46-card-flicker-scout
          mkdir -p "$OUT/assets" "$OUT/board"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/ball46-production/deployments?per_page=3" -H "$AUTH" -o "$OUT/deployments.json"
          node - <<'NODE' "$OUT/deployments.json" "$OUT/active.txt"
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const d=j.result.deployments[0];
          if(!d?.versions?.length) throw Error('NO_ACTIVE_VERSION');
          const active=d.versions.find(v=>Number(v.percentage)===100)?.version_id || d.versions[0].version_id;
          fs.writeFileSync(process.argv[3],active);
          console.log('ACTIVE='+active);
          NODE
          paths=(
            index.html
            dashboard-v2-stage3.js
            dashboard-v2-tune.js
            ui-sync-fixes-343-v2.js
            singlepage-workspace-343.js
            live-summary-full-odds-343.js
            bulk-odds-compat-343.js
            market-registry-343.js
            signal-focus-343.js
            v2-shared.js
          )
          for p in "${paths[@]}"; do
            curl -fsSL -H 'Cache-Control: no-cache' "https://ball46.com/$p?flickerScout=${GITHUB_RUN_ID}-$(date +%s%N)" -o "$OUT/assets/$p"
            sha256sum "$OUT/assets/$p"
          done
          for i in 1 2 3 4 5 6; do
            curl -fsSL -H 'Cache-Control: no-cache' "https://ball46.com/api/full-market/board?flickerScout=${GITHUB_RUN_ID}-${i}-$(date +%s%N)" -o "$OUT/board/board-$i.json"
            node - <<'NODE' "$OUT/board/board-$i.json" "$OUT/board/order-$i.txt"
            const fs=require('fs');
            const j=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
            const arr=Array.isArray(j)?j:(j.matches||j.data||j.rows||j.items||[]);
            const id=x=>x?.fixture?.id ?? x?.id ?? x?.fixture_id ?? x?.match_id ?? '?';
            const min=x=>x?.fixture?.status?.elapsed ?? x?.elapsed ?? x?.minute ?? '';
            const st=x=>x?.fixture?.status?.short ?? x?.status ?? '';
            const sig=x=>Boolean(x?.signal||x?.signals?.length||x?.hasSignal||x?.signal_count);
            const out=arr.map((x,n)=>`${n+1}\t${id(x)}\t${min(x)}\t${st(x)}\t${sig(x)?'SIGNAL':''}`).join('\n');
            fs.writeFileSync(process.argv[3],out+'\n');
            console.log(`BOARD_SAMPLE count=${arr.length} first=${arr.slice(0,8).map(id).join(',')}`);
            NODE
            sleep 2
          done
          node - <<'NODE' "$OUT/assets" "$OUT/pattern-report.txt"
          const fs=require('fs'),path=require('path');
          const dir=process.argv[2], out=[];
          const patterns=['innerHTML','replaceChildren','outerHTML','insertAdjacentHTML','appendChild','prepend','removeChild','cloneNode','.sort(','requestAnimationFrame','setInterval','setTimeout','MutationObserver','transition','animation','opacity','display'];
          for(const name of fs.readdirSync(dir)){
            if(!name.endsWith('.js')&&!name.endsWith('.html')) continue;
            const s=fs.readFileSync(path.join(dir,name),'utf8');
            out.push(`## ${name}`);
            for(const p of patterns){ const n=s.split(p).length-1; if(n) out.push(`${p}\t${n}`); }
          }
          fs.writeFileSync(process.argv[3],out.join('\n')+'\n');
          NODE
          echo 'READ_ONLY_CARD_FLICKER_SCOUT_SUCCESS'
      - uses: actions/upload-artifact@v4
        with:
          name: ball46-card-flicker-scout-${{ github.run_id }}
          path: /tmp/ball46-card-flicker-scout/
          if-no-files-found: error
          retention-days: 7
