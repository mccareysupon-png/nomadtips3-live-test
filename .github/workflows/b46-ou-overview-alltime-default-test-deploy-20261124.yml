name: BALL46 TEST OU overview default All Time align cumulative and cards 20261124
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-ou-overview-alltime-default-test-deploy-20261124.yml]
permissions: {contents: read}
concurrency:
  group: ball46-prematch-frontend-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Assert default alltime only on O-U and explicit Today stays
        run: |
          node --check qa/prematch-history-20261120/patch-ou-overview-alltime-default-v2-test.mjs
          node --test qa/prematch-history-20261120/patch-ou-overview-alltime-default-v2.test.mjs
      - name: Deploy original TEST frontend only and prove unchanged other systems
        run: node qa/prematch-history-20261120/deploy-ou-overview-alltime-default-v2-20261124.mjs
