name: NOMAD 3.42 TEST Worker Deploy

on:
  push:
    branches:
      - 'feat/342-totalcorner-inlet'
    paths:
      - 'nomad-live-engine-342/**'
      - '.github/workflows/nomad342-test-worker-deploy.yml'

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TEST_URL: https://nomadtips3-live-engine-342-test.mccarey-supon.workers.dev

jobs:
  validate-deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/342-totalcorner-inlet

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate isolated 3.42 engine
        working-directory: nomad-live-engine-342
        run: |
          node --check src/totalcorner.js
          node --check src/index.js
          npm test
          grep -q '^\[env.test\]' wrangler.toml
          grep -q '^name = "nomadtips3-live-engine-342-test"$' wrangler.toml
          TEST_ENV_CONFIG="$(awk '/^\[env.test\]$/{inside=1;next} /^\[/{if(inside) exit} inside{print}' wrangler.toml)"
          printf '%s\n' "$TEST_ENV_CONFIG" | grep -q '^workers_dev = true$'

      - name: Dry-run TEST Worker bundle
        working-directory: nomad-live-engine-342
        run: npx --yes wrangler@4.92.0 deploy --dry-run --env test --config wrangler.toml

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CF_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Deploy isolated 3.42 TEST Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: nomad-live-engine-342
          wranglerVersion: '4.92.0'
          command: deploy --env test

      - name: Configure optional THScore TEST secret
        working-directory: nomad-live-engine-342
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TEST_THSCORE_API_KEY: ${{ secrets.TEST_THSCORE_API_KEY }}
        run: |
          if [ -z "$TEST_THSCORE_API_KEY" ]; then
            echo "TEST THSCORE_API_KEY not configured; THScore judge stays fail-closed."
          else
            printf '%s' "$TEST_THSCORE_API_KEY" | npx --yes wrangler@4.92.0 secret put THSCORE_API_KEY --env test >/dev/null
            echo "TEST THSCORE_API_KEY configured."
          fi

      - name: Smoke TEST Worker contract
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS --max-time 15 "$TEST_URL/contract?_=$RANDOM$RANDOM" -o /tmp/contract.json && node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/contract.json','utf8'));
          if(j.version!=='3.42'||j.ok!==true||j.source?.detailMode!=='TODAY_ONLY') process.exit(1);
          if(j.source?.capabilities?.attacks!==true||j.source?.capabilities?.dangerous!==true||j.source?.capabilities?.corner!==true) process.exit(1);
          NODE
            then ok=1; break; fi
            sleep 5
          done
          test "$ok" = '1'
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/contract.json','utf8'));
          console.log('contract OK',j.version,j.source.detailMode,j.source.capabilities);
          NODE

      - name: Smoke THScore judge rail
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 "$TEST_URL/judge/thscore/status?_=$RANDOM$RANDOM" -o /tmp/thscore-status.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/thscore-status.json','utf8'));
          if(j.version!=='3.42'||j.source!=='THScore'||typeof j.configured!=='boolean') process.exit(1);
          console.log('THScore judge rail',j.configured?'CONFIGURED':'FAIL-CLOSED');
          NODE

      - name: Probe live TotalCorner feed
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS --max-time 30 "$TEST_URL/feed?force=1&_=$RANDOM$RANDOM" -o /tmp/feed.json && node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/feed.json','utf8'));
          if(j.ok!==true||j.version!=='3.42'||j.source?.name!=='TotalCorner'||j.source?.detailMode!=='TODAY_ONLY'||!Array.isArray(j.matches)) process.exit(1);
          if(Number(j.counts?.detailAttempts||0)!==0||Number(j.counts?.detailFetchErrors||0)!==0) process.exit(1);
          NODE
            then ok=1; break; fi
            sleep 5
          done
          test "$ok" = '1'
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/feed.json','utf8'));
          console.log(JSON.stringify({ok:j.ok,version:j.version,mode:j.mode,source:j.source?.name,detailMode:j.source?.detailMode,capabilities:j.source?.capabilities,counts:j.counts,lastError:j.lastError,updatedAt:j.updatedAt},null,2));
          NODE
