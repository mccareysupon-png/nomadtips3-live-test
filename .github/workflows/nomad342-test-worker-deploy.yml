name: NOMAD 3.42 LAB Worker Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  LAB_URL: https://nomadtips3-live-engine-342-lab.mccarey-supon.workers.dev

jobs:
  validate-deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/342-totalcorner-inlet

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate isolated 3.42 LAB engine
        working-directory: nomad-live-engine-342
        run: |
          node --check src/totalcorner.js
          node --check src/index.js
          npm test
          grep -q '^\[env.test\]' wrangler.toml
          grep -q '^name = "nomadtips3-live-engine-342-lab"$' wrangler.toml
          TEST_ENV_CONFIG="$(awk '/^\[env.test\]$/{inside=1;next} /^\[/{if(inside) exit} inside{print}' wrangler.toml)"
          printf '%s\n' "$TEST_ENV_CONFIG" | grep -q '^workers_dev = true$'

      - name: Dry-run LAB Worker bundle
        working-directory: nomad-live-engine-342
        run: npx --yes wrangler@4.92.0 deploy --dry-run --env test --config wrangler.toml

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CF_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Deploy isolated 3.42 LAB Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: nomad-live-engine-342
          wranglerVersion: '4.92.0'
          command: deploy --env test

      - name: Configure optional 5Dollar adapter token
        working-directory: nomad-live-engine-342
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TEST_S8_ADAPTER_TOKEN: ${{ secrets.TEST_S8_ADAPTER_TOKEN }}
          SHARED_S8_ADAPTER_TOKEN: ${{ secrets.S8_ADAPTER_TOKEN }}
        run: |
          token="$TEST_S8_ADAPTER_TOKEN"
          if [ -z "$token" ]; then token="$SHARED_S8_ADAPTER_TOKEN"; fi
          if [ -z "$token" ]; then
            echo "No S8 adapter token secret configured; LAB rail will still work if optional auth is disabled."
          else
            printf '%s' "$token" | npx --yes wrangler@4.92.0 secret put S8_ADAPTER_TOKEN --env test >/dev/null
            echo "S8_ADAPTER_TOKEN configured on 3.42 LAB Worker."
          fi

      - name: Smoke LAB Worker contract
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS --max-time 15 "$LAB_URL/contract?_=$RANDOM$RANDOM" -o /tmp/contract.json && node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/contract.json','utf8'));
          if(j.version!=='3.42'||j.ok!==true||j.source?.detailMode!=='TODAY_ONLY') process.exit(1);
          if(j.source?.capabilities?.attacks!==true||j.source?.capabilities?.dangerous!==true||j.source?.capabilities?.corner!==true) process.exit(1);
          if(j.judge?.source!=='5DollarFootballAPI'||j.judge?.bookmaker!=='Bet365'||j.judge?.path!=='/judge/5dollar'||j.judge?.transport!=='SERVER_TO_SERVER') process.exit(1);
          NODE
            then ok=1; break; fi
            sleep 5
          done
          test "$ok" = '1'

      - name: Smoke 5Dollar Bet365 judge rail
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 "$LAB_URL/judge/5dollar/status?_=$RANDOM$RANDOM" -o /tmp/5dollar-status.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/5dollar-status.json','utf8'));
          console.log(JSON.stringify(j,null,2));
          if(j.version!=='3.42'||j.source!=='5DollarFootballAPI'||j.bookmaker!=='Bet365') process.exit(1);
          if(j.transport!=='SERVER_TO_SERVER'||j.authOk!==true||j.adapterKeyConfigured!==true||j.ready!==true) process.exit(1);
          NODE

      - name: Probe live TotalCorner feed
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS --max-time 30 "$LAB_URL/feed?force=1&_=$RANDOM$RANDOM" -o /tmp/feed.json && node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/feed.json','utf8'));
          if(j.ok!==true||j.version!=='3.42'||j.source?.name!=='TotalCorner'||j.source?.detailMode!=='TODAY_ONLY'||!Array.isArray(j.matches)) process.exit(1);
          if(j.priceJudge?.source!=='5DollarFootballAPI'||j.priceJudge?.bookmaker!=='Bet365') process.exit(1);
          if(Number(j.counts?.detailAttempts||0)!==0||Number(j.counts?.detailFetchErrors||0)!==0) process.exit(1);
          NODE
            then ok=1; break; fi
            sleep 5
          done
          test "$ok" = '1'
