name: BALL46 Default odds V3 scroll stutter A-B ablation read-only
on:
  push:
    branches: [test/ball46-fullmarket-odds-v3-20261121]
    paths:
      - '.github/workflows/ball46-fullmarket-default-odds-ablation-20261121.yml'
      - 'qa/fullmarket-odds-v3-20261121/default-odds-perf-ablation.mjs'
permissions: {contents: read}
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Browser-only compare Default V3, no-filter, and no-runtime scroll
        run: node qa/fullmarket-odds-v3-20261121/default-odds-perf-ablation.mjs
