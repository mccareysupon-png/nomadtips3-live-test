name: BALL46 Search Green Caret — guarded Production
on:
  push:
    branches: [fix/ball46-search-green-caret-20261024]
    paths:
      - .github/workflows/b46-search-caret-activate.yml
permissions:
  contents: read
concurrency:
  group: ball46-green-caret-production-20261024
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check deploy-assets/search-caret-20261024/activate.mjs
          node deploy-assets/search-caret-20261024/activate.mjs
