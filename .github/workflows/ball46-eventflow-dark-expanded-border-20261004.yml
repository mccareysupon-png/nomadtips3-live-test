name: Ball46 Event Flow Dark + Expanded Border Surgical 20261004

on:
  push:
    branches: [work/eventflow-dark-expanded-border-20261004]
    paths:
      - '.github/workflows/ball46-eventflow-dark-expanded-border-20261004.yml'
      - 'deploy-assets/match-status-svg-20261003/eventflow-dark-expanded-border-run.mjs'
      - 'ops/ball46-card-stability/patch-match-expanded-outline-20261004.js'
      - 'ops/ball46-eventflow/patch-eventflow-dark-surface-20261004.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-production-eventflow-dark-expanded-border
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  DEPLOY_ENABLED: 'true'

jobs:
  surgical-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact proven-rail dependencies
        working-directory: deploy-assets/match-status-svg-20261003
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Surgical deploy Event Flow dark surface and expanded match outline
        working-directory: deploy-assets/match-status-svg-20261003
        run: node eventflow-dark-expanded-border-run.mjs
      - name: Retain surgical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-eventflow-dark-expanded-border-${{ github.run_id }}
          path: deploy-assets/match-status-svg-20261003/audit/
          if-no-files-found: error
          retention-days: 30
