name: BALL46 Mobile Expanded Frame Readonly 20261019
on:
  push:
    branches: [fix/ball46-mobile-expanded-green-frame-20261019]
    paths: ['.github/workflows/ball46-mobile-expanded-frame-20261019.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Inspect exact mobile expanded card DOM and borders (READ ONLY)
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage({viewport:{width:390,height:850},deviceScaleFactor:1});
            page.on('pageerror',e=>console.log('PAGE_ERROR',e.message.slice(0,200)));
            await page.goto('https://ball46.com/?view=signals&frameAudit='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(2300);
            await page.locator('[data-b46m-open]').click();
            await page.locator('[data-b46m-page="signal"]').click();
            await page.waitForTimeout(2200);
            const index=await page.evaluate(()=>({
              current:location.href,
              view:document.body.dataset.workspaceView,
              panels:[...document.querySelectorAll('[data-workspace-panel]')].map(x=>({view:x.getAttribute('data-workspace-panel'),class:x.className})),
              signalButtons:[...document.querySelectorAll('a,button,[role="tab"]')].filter(x=>/signal/i.test((x.textContent||'').slice(0,100)+' '+x.outerHTML.slice(0,200))).slice(0,25).map(x=>x.outerHTML.slice(0,340)),
              signalCards:[...document.querySelectorAll('[class*="signal"],[data-match-id]')].filter(x=>x.getBoundingClientRect().width>200).slice(0,26).map(x=>x.outerHTML.slice(0,350))
            }));
            console.log('SIGNAL_ROUTE',JSON.stringify(index).slice(0,18000));
            const roots=['#b46gn-cards [data-b46gn-fixture]','#b46gn-cards .b46gn-card','#b46gn-results [data-b46gn-fixture]'];
            const counts=await Promise.all(roots.map(s=>page.locator(s).count()));
            console.log('ROOT_COUNTS',JSON.stringify(Object.fromEntries(roots.map((s,i)=>[s,counts[i]]))));
            const other=await page.evaluate(()=>{
              const match=[...document.querySelectorAll('body *')].find(e=>e.children.length===0&&e.textContent.trim()==='ACTIVE SIGNALS');
              const signals=[...document.querySelectorAll('[class*="signal"],[data-signal]')].filter(e=>e.getBoundingClientRect().width>100).slice(0,45);
              return {url:location.href,bodyView:document.body.dataset.workspaceView,heading:match?.parentElement?.parentElement?.outerHTML.slice(0,14000),signalEls:signals.map(x=>({tag:x.tagName,id:x.id,cls:x.className,outer:x.outerHTML.slice(0,600)})),text:document.body.innerText.slice(0,6000)}
            });
            console.log('SIGNALS_DOM',JSON.stringify(other).slice(0,28000));
            const first=roots.find((s,i)=>counts[i]>0);
            const signalRow=page.locator('article.match-row[data-match-id]').first();
            console.log('SIGNAL_ROWS_VISIBLE',await signalRow.count(),await signalRow.isVisible());
            if(await signalRow.isVisible()){await signalRow.click({timeout:7000});await page.waitForTimeout(650)}
            const result=await page.evaluate(()=>{
              const summary=(el)=>{
                if(!el)return null;
                const s=getComputedStyle(el),r=el.getBoundingClientRect();
                return {tag:el.tagName,id:el.id,className:typeof el.className==='string'?el.className.slice(0,230):'',outerStart:el.outerHTML.slice(0,650),box:{x:r.x,y:r.y,w:r.width,h:r.height},style:{border:s.border,borderTop:s.borderTop,borderBottom:s.borderBottom,borderRadius:s.borderRadius,marginTop:s.marginTop,marginBottom:s.marginBottom,padding:s.padding,display:s.display,position:s.position,overflow:s.overflow,background:s.backgroundColor,boxShadow:s.boxShadow}};
              };
              const detail=document.querySelector('#b46gn-detail');
              const flow=document.querySelector('#b46gn-detail .b46gn-event-flow')||document.querySelector('.b46gn-event-flow');
              const sheet=document.querySelector('#b46gn-detail .b46gn-sheet');
              const first=document.querySelector('#b46gn-cards [data-b46gn-fixture]');
              const aroundFlow=[];for(let e=flow,j=0;e&&j<8;e=e.parentElement,j++)aroundFlow.push(summary(e));
              const aroundSheet=[];for(let e=sheet,j=0;e&&j<8;e=e.parentElement,j++)aroundSheet.push(summary(e));
              const aroundCard=[];for(let e=first,j=0;e&&j<6;e=e.parentElement,j++)aroundCard.push(summary(e));
              const all=[...document.querySelectorAll('[class*="expand"],[class*="event"],[class*="detail"],[class*="sheet"],[class*="card"]')].filter(e=>e.getBoundingClientRect().width>100&&e.getBoundingClientRect().height>10).slice(0,80).map(summary);
              const actualRow=document.querySelector('article.match-row[data-match-id]');
              const actualParent=actualRow?.parentElement;
              const nearby=[actualRow,actualRow?.nextElementSibling,actualRow?.parentElement,actualParent?.nextElementSibling].map(summary);
              return {detail:summary(detail),flow:summary(flow),sheet:summary(sheet),aroundFlow,aroundSheet,aroundCard,all,nearby,actualRow:actualRow?.outerHTML.slice(0,26000),actualParent:actualParent?.outerHTML.slice(0,24000),detailOuter:detail?.outerHTML.slice(0,4000),activeHTML:document.documentElement.getAttribute('data-b46gn'),screenWidth:innerWidth};
            });
            console.log('FRAME_AUDIT',JSON.stringify(result).slice(0,55000));
            await page.close();
          } finally {await browser.close()}
          JS
