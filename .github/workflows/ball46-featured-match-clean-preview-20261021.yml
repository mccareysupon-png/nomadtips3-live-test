name: BALL46 Featured Match — Clean PC Mobile Browser Preview
on:
  push:
    branches: [codex/ball46-featured-match-clean-preview-20261021]
    paths:
      - '.github/workflows/ball46-featured-match-clean-preview-20261021.yml'
      - 'deploy-assets/featured-match-clean-preview-20261021/preview-featured.mjs'
      - 'deploy-assets/featured-match-clean-preview-20261021/clean-featured.mjs'
      - 'deploy-assets/featured-match-clean-preview-20261021/clean-featured.css'
permissions:
  contents: read
concurrency:
  group: ball46-featured-match-clean-inactive-preview
  cancel-in-progress: false
jobs:
  create-and-test-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JS syntax and install browser
        working-directory: deploy-assets/featured-match-clean-preview-20261021
        run: |
          set -euo pipefail
          node --check preview-featured.mjs
          node --check clean-featured.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
      - name: Create INACTIVE Candidate and visual QA both PC and mobile, Production unchanged
        working-directory: deploy-assets/featured-match-clean-preview-20261021
        run: node preview-featured.mjs
      - name: Save screenshots and production isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-featured-match-clean-pc-mobile-preview-proof
          path: deploy-assets/featured-match-clean-preview-20261021/audit/
          retention-days: 30
          if-no-files-found: warn
