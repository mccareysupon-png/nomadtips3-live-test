name: ONE SHOT - Ball46 Odds Surgical 20260928

on:
  push:
    branches:
      - ops/ball46-odds-surgical-20260928
    paths:
      - '.github/workflows/ball46-odds-surgical-deploy-20260928.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Surgical Odds deploy from current Production only
        shell: bash
        run: bash .github/scripts/ball46_odds_surgical_20260928.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-odds-surgical-${{ github.run_id }}
          path: /tmp/b46-odds-surgical
          if-no-files-found: ignore
          retention-days: 30
