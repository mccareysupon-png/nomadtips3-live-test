name: ONE SHOT - Ball46 Odds Surgical 20260928

on:
  push:
    branches:
      - ops/ball46-odds-surgical-20260928
    paths:
      - '.github/workflows/ball46-odds-surgical-deploy-20260928.yml'
      - '.github/scripts/ball46_odds_surgical_20260928.sh'
      - 'deploy-assets/match-status-svg-20261003/**'

permissions:
  contents: read

concurrency:
  group: ball46-production-surgical
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Surgical scorebar state frames from current Production only
        shell: bash
        run: bash .github/scripts/ball46_odds_surgical_20260928.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-odds-surgical-${{ github.run_id }}
          path: deploy-assets/match-status-svg-20261003/audit/
          if-no-files-found: error
          retention-days: 30
