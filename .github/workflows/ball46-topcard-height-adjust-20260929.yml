name: BUILD ONLY - Ball46 Top Card Height Adjust 20260929

on:
  push:
    branches:
      - work/ball46-topcard-details-20260929
    paths:
      - '.github/workflows/ball46-topcard-height-adjust-20260929.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-topcard-details-20260929
      - name: Increase only scorebar slot/grid/card height after clipping evidence
        run: python3 .github/scripts/ball46_topcard_height_adjust_20260929.py
      - name: Recheck JavaScript syntax
        run: node --check ball46-topcard-candidate-20260929/dashboard-v2-stage3.js
      - name: Commit candidate/test adjustments to work branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ball46-topcard-candidate-20260929/singlepage-workspace-343.css \
                  .github/scripts/ball46_topcard_patch_20260929.py \
                  .github/scripts/ball46_topcard_browser_preview_20260929.js \
                  .github/workflows/ball46-topcard-build-20260929.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(ball46): expand top scorebar height after browser clipping proof'
          git push origin HEAD:work/ball46-topcard-details-20260929
