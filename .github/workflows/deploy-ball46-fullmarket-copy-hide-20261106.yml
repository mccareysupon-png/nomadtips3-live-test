name: Deploy BALL46 Full Market Copy Hide 20261106

on:
  push:
    branches: [test/ball46-fullmarket-copy-20261106]
    paths:
      - '.github/workflows/deploy-ball46-fullmarket-copy-hide-20261106.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/ball46-fullmarket-copy-20261106
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Guarded Full Market copy deployment
        working-directory: deploy-assets/fullmarket-copy-hide-20261106
        run: node deploy.mjs
