name: BALL46 Statistics source read-only diagnosis
on:
  push:
    branches: [test/ball46-statistics-content-revision-20261113]
    paths: ['.github/workflows/ball46-statistics-source-diagnosis-20261114.yml','work/statistics-content-revision-20261113/source-audit.mjs']
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read source identity and complete bounded Ledger without sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node work/statistics-content-revision-20261113/source-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-source-diagnosis
          path: work/statistics-content-revision-20261113/qa/release/source-diagnosis.json

