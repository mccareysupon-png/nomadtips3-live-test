name: Audit Ball46 All FiveDollar Producers
on:
  push:
    branches: [audit/ball46-backoff-repair-verification-20261011]
    paths:
      - '.github/workflows/audit-ball46-5usd-producers-20261011.yml'
permissions:
  contents: read
jobs:
  readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node deploy-assets/ball46-backoff-repair-verify/producers.mjs
