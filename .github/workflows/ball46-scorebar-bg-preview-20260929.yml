name: PREVIEW ONLY - Ball46 Scorebar Backgrounds 20260929

on:
  push:
    branches:
      - work/ball46-scorebar-bg-20260929
    paths:
      - '.github/workflows/ball46-scorebar-bg-preview-20260929.yml'
      - '.github/scripts/ball46_scorebar_bg_preview_20260929.js'
      - 'ops/ball46-scorebar-bg-20260929/**'

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-scorebar-bg-20260929
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Preview new WIN LOSS DRAW PENDING backgrounds on live Ball46 DOM only
        run: node .github/scripts/ball46_scorebar_bg_preview_20260929.js
      - name: Commit preview report only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ball46-scorebar-bg-preview-20260929/report.json
          git diff --cached --quiet || git commit -m 'report(ball46): scorebar background preview 20260929'
          git pull --rebase origin work/ball46-scorebar-bg-20260929
          git push origin HEAD:work/ball46-scorebar-bg-20260929
      - name: Upload screenshots for visual review
        uses: actions/upload-artifact@v4
        with:
          name: ball46-scorebar-bg-preview-${{ github.run_id }}
          path: ball46-scorebar-bg-preview-20260929
          retention-days: 7
