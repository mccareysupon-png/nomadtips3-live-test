name: BALL46 Member Current Active Kit Preflight — Read Only
on:
  push:
    branches: [work/ball46-member-16-premium-kits-20261019]
    paths:
      - '.github/workflows/ball46-member-16kit-readonly.yml'
      - 'ball46-member/scripts/kit-active-audit.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect exact Member production worker, version and public assets
        run: node ball46-member/scripts/kit-active-audit.mjs
      - name: Preserve asset source and version proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-kit-active-readonly-${{ github.run_id }}
          path: member-audit
          retention-days: 7
