name: Audit Ball46 Phase3 Active Fallback Readonly
on:
  push:
    branches: [work/ball46-phase3-missing-hub-final-20261011]
    paths:
      - '.github/workflows/audit-ball46-phase3-active-20261011.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node deploy-assets/ball46-phase3/audit-active.mjs
