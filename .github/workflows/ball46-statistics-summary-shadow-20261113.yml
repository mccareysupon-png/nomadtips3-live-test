name: BALL46 statistics shadow read-only verification
on:
  push:
    branches: [test/ball46-statistics-summary-shadow-20261113]
    paths: ['work/statistics-summary-shadow-20261113/**', '.github/workflows/ball46-statistics-summary-shadow-20261113.yml']
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read actual active source only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node work/statistics-summary-shadow-20261113/fresh-source.mjs
      - name: Verify current backend before any deployment preparation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node work/statistics-summary-shadow-20261113/deploy-preflight.mjs
      - name: Reuse verified Ledger evidence without reading Production again
        uses: actions/download-artifact@v4
        with:
          name: ball46-statistics-shadow-proof
          run-id: 43371896543
          github-token: ${{ github.token }}
          path: work/statistics-summary-shadow-20261113/reference/live-proof
      - name: Reuse current captured UI for browser QA
        if: contains(github.event.head_commit.message, '[ui-qa]') || contains(github.event.head_commit.message, '[summary-service-test]') || contains(github.event.head_commit.message, '[pinned-engine-test]')
        uses: actions/download-artifact@v4
        with:
          name: ball46-statistics-shadow-proof
          run-id: 43399899623
          github-token: ${{ github.token }}
          path: work/statistics-summary-shadow-20261113/reference/ui-proof
      - name: Reuse recorded complete Ledger only
        if: contains(github.event.head_commit.message, '[ui-qa]') || contains(github.event.head_commit.message, '[summary-service-test]') || contains(github.event.head_commit.message, '[pinned-engine-test]')
        uses: actions/download-artifact@v4
        with:
          name: ball46-statistics-shadow-proof
          run-id: 43373832113
          github-token: ${{ github.token }}
          path: work/statistics-summary-shadow-20261113/reference/ledger-proof
      - name: Pair current UI with recorded full Ledger for deterministic QA
        if: contains(github.event.head_commit.message, '[ui-qa]') || contains(github.event.head_commit.message, '[summary-service-test]') || contains(github.event.head_commit.message, '[pinned-engine-test]')
        run: |
          cp work/statistics-summary-shadow-20261113/reference/ledger-proof/qa/verified-full-ledger.json work/statistics-summary-shadow-20261113/reference/ui-proof/qa/
          cp work/statistics-summary-shadow-20261113/reference/ledger-proof/qa/live-ledger.json work/statistics-summary-shadow-20261113/reference/ui-proof/qa/
      - name: Build pinned-generation Engine candidate from exact captured source
        if: contains(github.event.head_commit.message, '[pinned-engine-test]')
        run: node work/statistics-summary-shadow-20261113/build-pinned-engine-candidate.mjs
      - name: Verify pinned generation and 2k page size against recorded real Ledger
        if: contains(github.event.head_commit.message, '[pinned-engine-test]')
        run: node work/statistics-summary-shadow-20261113/pinned-real-ledger-test.mjs
      - name: Verify isolated bounded service on complete recorded current Ledger
        if: contains(github.event.head_commit.message, '[summary-service-test]')
        run: |
          node work/statistics-summary-shadow-20261113/build-summary-formulas.mjs
          node work/statistics-summary-shadow-20261113/bounded-summary-test.mjs
          node work/statistics-summary-shadow-20261113/build-combined.mjs
      - name: Run isolated projection and actual-source contracts
        run: |
          node work/statistics-summary-shadow-20261113/test.mjs
          node work/statistics-summary-shadow-20261113/ordered-test.mjs
          node work/statistics-summary-shadow-20261113/writer-test.mjs
          node work/statistics-summary-shadow-20261113/readonly-contract.mjs
          node work/statistics-summary-shadow-20261113/consumer-test.mjs
      - name: Install isolated local runtime test dependencies
        run: npm install --prefix work/statistics-summary-shadow-20261113/.runtime --no-save --package-lock=false --no-audit --no-fund miniflare esbuild playwright@1.56.1
      - name: Test actual storage transactions in local workerd
        run: node work/statistics-summary-shadow-20261113/runtime-test.mjs
      - name: Test isolated shared summary service and four banner assets
        if: contains(github.event.head_commit.message, '[summary-service-test]')
        run: node work/statistics-summary-shadow-20261113/service-runtime-test.mjs
      - name: One authorized read-only Ledger audit, no scan and no retries
        if: contains(github.event.head_commit.message, '[ledger-audit-once]')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          B46_FULL_SNAPSHOT: '1'
        run: node work/statistics-summary-shadow-20261113/live-ledger-audit.mjs
      - name: Capture current HTML and static assets for existing-UI replay
        if: contains(github.event.head_commit.message, '[ui-capture-once]')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node work/statistics-summary-shadow-20261113/capture-ui.mjs
      - name: Install Chromium for existing-UI PC and mobile tests
        if: contains(github.event.head_commit.message, '[ui-qa]') || contains(github.event.head_commit.message, '[summary-service-test]')
        run: work/statistics-summary-shadow-20261113/.runtime/node_modules/.bin/playwright install --with-deps chromium
      - name: Test existing PC and mobile UI against the same recorded Ledger
        if: contains(github.event.head_commit.message, '[ui-qa]') || contains(github.event.head_commit.message, '[summary-service-test]')
        run: node work/statistics-summary-shadow-20261113/ui-browser-test.mjs
      - name: Test combined PC banners and mobile exclusion
        if: contains(github.event.head_commit.message, '[summary-service-test]')
        run: node work/statistics-summary-shadow-20261113/combined-browser-test.mjs
      - name: Prepare inactive combined candidate only after all tests pass
        if: contains(github.event.head_commit.message, '[combined-stage]')
        env:
          CLOUDFLARE_ACCOUNT_ID: '62cb0db544160e6591342abd6b4f35cc'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund parse5
          node work/statistics-summary-shadow-20261113/stage-combined.mjs
      - name: Save successful UI evidence to test branch only
        if: success() && contains(github.event.head_commit.message, '[ui-qa]')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/statistics-summary-shadow-20261113/qa/ui/*.png work/statistics-summary-shadow-20261113/qa/ui/browser.json work/statistics-summary-shadow-20261113/qa/ui/boundary.json
          git commit -m "Record existing UI PC/mobile summary integration QA [skip ci]"
          git push origin HEAD:test/ball46-statistics-summary-shadow-20261113
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-statistics-shadow-proof
          path: |
            work/statistics-summary-shadow-20261113/source/active.json
            work/statistics-summary-shadow-20261113/qa/results.json
            work/statistics-summary-shadow-20261113/qa/ordered.json
            work/statistics-summary-shadow-20261113/qa/writer.json
            work/statistics-summary-shadow-20261113/qa/runtime.json
            work/statistics-summary-shadow-20261113/qa/live-ledger.json
            work/statistics-summary-shadow-20261113/qa/verified-compact-ledger.json
            work/statistics-summary-shadow-20261113/qa/consumer.json
            work/statistics-summary-shadow-20261113/qa/verified-full-ledger.json
            work/statistics-summary-shadow-20261113/qa/ui-capture
            work/statistics-summary-shadow-20261113/qa/ui
            work/statistics-summary-shadow-20261113/qa/calendar-checks.json


            work/statistics-summary-shadow-20261113/qa/deploy-preflight.json
            work/statistics-summary-shadow-20261113/qa/bounded-summary.json

            work/statistics-summary-shadow-20261113/qa/service-runtime.json
            work/statistics-summary-shadow-20261113/qa/combined
