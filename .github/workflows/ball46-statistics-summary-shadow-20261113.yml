name: BALL46 statistics shadow read-only verification
on:
  push:
    branches: [test/ball46-statistics-summary-shadow-20261113]
    paths: ['work/statistics-summary-shadow-20261113/**', '.github/workflows/ball46-statistics-summary-shadow-20261113.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read actual active source only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node work/statistics-summary-shadow-20261113/fresh-source.mjs
      - name: Run isolated projection and actual-source contracts
        run: |
          node work/statistics-summary-shadow-20261113/test.mjs
          node work/statistics-summary-shadow-20261113/ordered-test.mjs
          node work/statistics-summary-shadow-20261113/writer-test.mjs
      - name: Install isolated local runtime test dependencies
        run: npm install --prefix work/statistics-summary-shadow-20261113/.runtime --no-save --package-lock=false --no-audit --no-fund miniflare esbuild
      - name: Test actual storage transactions in local workerd
        run: node work/statistics-summary-shadow-20261113/runtime-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-statistics-shadow-proof
          path: |
            work/statistics-summary-shadow-20261113/source/active.json
            work/statistics-summary-shadow-20261113/qa/results.json
            work/statistics-summary-shadow-20261113/qa/ordered.json
            work/statistics-summary-shadow-20261113/qa/writer.json
            work/statistics-summary-shadow-20261113/qa/runtime.json
