name: 5USD BTTS SOURCE — READ ONLY
on:
  push:
    branches: [audit/ball46-5usd-btts-source-20261023]
    paths:
      - .github/workflows/b46-5usd-btts-source-readonly.yml
      - deploy-assets/5usd-btts-source-20261023/*.mjs
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect current Hub / Engine source, routes, and cached health. No upstream 5USD requests
        run: |
          node --check deploy-assets/5usd-btts-source-20261023/inspect.mjs
          node --check deploy-assets/5usd-btts-source-20261023/routes.mjs
          node --check deploy-assets/5usd-btts-source-20261023/bindings.mjs
          node --check deploy-assets/5usd-btts-source-20261023/fullmarket.mjs
          node --check deploy-assets/5usd-btts-source-20261023/cache-paths.mjs
          node deploy-assets/5usd-btts-source-20261023/cache-paths.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b46-5usd-btts-source-readonly-${{ github.run_id }}
          path: deploy-assets/5usd-btts-source-20261023/audit/
          retention-days: 14
