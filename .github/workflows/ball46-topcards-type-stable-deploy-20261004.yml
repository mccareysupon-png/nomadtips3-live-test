name: Ball46 Topcards Type Stable Deploy 20261004

on:
  push:
    branches: [work/ball46-topcards-clean-ui-20261004]
    paths:
      - '.github/workflows/ball46-topcards-type-stable-deploy-20261004.yml'
      - 'ops/ball46-topcards-clean-ui/patch-topcards-type-stable-20261004.js'
      - 'deploy-assets/match-status-svg-20261003/topcards-type-stable-run.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-deploy-live-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: deploy-assets/match-status-svg-20261003
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Production preflight and dry-run
        working-directory: deploy-assets/match-status-svg-20261003
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENABLED: 'false'
        run: node topcards-type-stable-run.mjs
      - name: Surgical deploy with integrated live QA
        working-directory: deploy-assets/match-status-svg-20261003
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENABLED: 'true'
        run: |
          export PLAYWRIGHT_EXECUTABLE_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$PLAYWRIGHT_EXECUTABLE_PATH" || { echo PLAYWRIGHT_EXECUTABLE_PATH_MISSING; exit 1; }
          node topcards-type-stable-run.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-topcards-type-stable-${{ github.run_id }}
          path: deploy-assets/match-status-svg-20261003/audit/
          retention-days: 7
