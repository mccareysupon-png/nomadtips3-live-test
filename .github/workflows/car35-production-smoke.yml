name: NOMAD Live 3.41 Production Smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'statistics.html'
      - 'nomad-live/**'
      - '.github/workflows/car35-production-smoke.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  PAGES_URL: https://mccareysupon-png.github.io/nomadtips3-live-test
  CUSTOM_URL: https://www.nomadtips3.com
  LIVE_WORKER: https://nomadtips3-live-engine.mccarey-supon.workers.dev

jobs:
  production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Validate 3.41 production entry pages
        run: |
          set -euo pipefail
          grep -Fq 'NOMAD LIVE 3.41' index.html
          grep -Fq 'Live Asian Handicap scanner' index.html
          grep -Fq '<base href="./nomad-live/">' index.html
          grep -Fq '<base href="./nomad-live/">' statistics.html
          grep -Fq 'LOCKED SIGNALS' statistics.html
          grep -Fq "'www.nomadtips3.com','nomadtips3.com'" nomad-live/runtime-config.js
          grep -Fq 'nomadtips3-live-engine.mccarey-supon.workers.dev' nomad-live/runtime-config.js
          test -f legacy-car35/index.html
          test -f legacy-car35/statistics.html
          echo 'Production entry pages point to NOMAD Live 3.41; CAR 3.5 entry pages are archived.'

      - name: Verify NOMAD Live production engine
        run: |
          curl -fsS "$LIVE_WORKER/health?t=$(date +%s)" -o /tmp/live-health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/live-health.json', encoding='utf-8'))
          assert isinstance(data, dict), 'health response is not an object'
          print('NOMAD Live production engine reachable')
          PY

      - name: Wait for GitHub Pages 3.41 publication
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 18); do
            home=$(curl -fsSL --max-time 20 "$PAGES_URL/?release=$(date +%s)" || true)
            stats=$(curl -fsSL --max-time 20 "$PAGES_URL/statistics.html?release=$(date +%s)" || true)
            if printf '%s' "$home" | grep -Fq 'NOMAD LIVE 3.41' \
              && printf '%s' "$home" | grep -Fq 'Live Asian Handicap scanner' \
              && printf '%s' "$stats" | grep -Fq 'LOCKED SIGNALS'; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1 || { echo '::error::GitHub Pages did not publish the NOMAD Live 3.41 entry pages'; exit 1; }
          echo 'GitHub Pages NOMAD Live 3.41 publication verified.'

      - name: Verify custom domain serves 3.41
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 18); do
            home=$(curl -fsSL --max-time 20 "$CUSTOM_URL/?release=$(date +%s)" || true)
            stats=$(curl -fsSL --max-time 20 "$CUSTOM_URL/statistics.html?release=$(date +%s)" || true)
            if printf '%s' "$home" | grep -Fq 'NOMAD LIVE 3.41' \
              && printf '%s' "$home" | grep -Fq 'Live Asian Handicap scanner' \
              && printf '%s' "$stats" | grep -Fq 'LOCKED SIGNALS'; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1 || { echo '::error::www.nomadtips3.com is not serving NOMAD Live 3.41'; exit 1; }
          echo 'www.nomadtips3.com NOMAD Live 3.41 verified.'
