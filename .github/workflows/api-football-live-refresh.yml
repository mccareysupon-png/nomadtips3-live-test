name: Refresh Greenock Morton v Partick Thistle

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/api-football-live-refresh.yml'
      - 'live-data.json'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: api-football-greenock-partick
  cancel-in-progress: true

jobs:
  refresh-once:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      TARGET_DATE: '2026-08-01'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop API polling after final state
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          current_status="$(jq -r '.match.status // ""' live-data.json 2>/dev/null || true)"
          if [[ "$current_status" =~ ^(FT|AET|PEN|CANC|ABD|AWD|WO)$ ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Stored match is final: $current_status"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve fixture and fetch live data
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${API_FOOTBALL_KEY:-}" ]; then
            echo 'API_FOOTBALL_KEY is missing'
            exit 1
          fi

          BASE='https://v3.football.api-sports.io'

          curl --fail --silent --show-error --get \
            -H "x-apisports-key: $API_FOOTBALL_KEY" \
            --data-urlencode "date=$TARGET_DATE" \
            --data-urlencode 'timezone=UTC' \
            "$BASE/fixtures" > /tmp/day-fixtures.json

          FIXTURE_ID="$(jq -r '
            def norm: ascii_downcase | gsub("[^a-z0-9]"; "");
            [
              .response[]?
              | select(
                  ((.teams.home.name | norm) | test("greenockmorton|morton"))
                  and
                  ((.teams.away.name | norm) | test("partickthistle|partick"))
                )
              | .fixture.id
            ][0] // empty
          ' /tmp/day-fixtures.json)"

          if [ -z "$FIXTURE_ID" ]; then
            echo 'Fixture not found yet; preserving the current verified fallback snapshot.'
            jq '{errors,results,paging,fixtures:[.response[]? | {id:.fixture.id,date:.fixture.date,home:.teams.home.name,away:.teams.away.name}]}' /tmp/day-fixtures.json || true
            exit 0
          fi

          echo "Resolved fixture ID: $FIXTURE_ID"

          curl --fail --silent --show-error \
            -H "x-apisports-key: $API_FOOTBALL_KEY" \
            "$BASE/fixtures?id=$FIXTURE_ID" > /tmp/fixture.json
          curl --silent --show-error \
            -H "x-apisports-key: $API_FOOTBALL_KEY" \
            "$BASE/fixtures/statistics?fixture=$FIXTURE_ID" > /tmp/stats.json || echo '{"response":[]}' > /tmp/stats.json
          curl --silent --show-error \
            -H "x-apisports-key: $API_FOOTBALL_KEY" \
            "$BASE/fixtures/events?fixture=$FIXTURE_ID" > /tmp/events.json || echo '{"response":[]}' > /tmp/events.json

          jq -e '.response[0]' /tmp/fixture.json >/dev/null
          jq -e '.response | arrays' /tmp/stats.json >/dev/null 2>&1 || echo '{"response":[]}' > /tmp/stats.json
          jq -e '.response | arrays' /tmp/events.json >/dev/null 2>&1 || echo '{"response":[]}' > /tmp/events.json

          jq -n \
            --arg fetched_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --slurpfile fixture /tmp/fixture.json \
            --slurpfile stats /tmp/stats.json \
            --slurpfile events /tmp/events.json \
            '
            def value_for($team_id; $type):
              ([ $stats[0].response[]?
                 | select(.team.id == $team_id)
                 | .statistics[]?
                 | select(.type == $type)
                 | .value ][0] // null);
            ($fixture[0].response[0]) as $f
            | {
                source:"api-football",
                fetched_at_utc:$fetched_at,
                http_status:200,
                match:{
                  id:($f.fixture.id|tostring),
                  sport:"football",
                  league:$f.league.name,
                  country:$f.league.country,
                  home:{name:$f.teams.home.name,short_name:$f.teams.home.name},
                  away:{name:$f.teams.away.name,short_name:$f.teams.away.name},
                  kickoff_utc:$f.fixture.date,
                  status:$f.fixture.status.short,
                  status_long:$f.fixture.status.long,
                  elapsed:$f.fixture.status.elapsed,
                  score:{home:$f.goals.home,away:$f.goals.away},
                  halftime_score:{home:$f.score.halftime.home,away:$f.score.halftime.away},
                  fulltime_score:{home:$f.score.fulltime.home,away:$f.score.fulltime.away},
                  stats:{
                    possession:{home:value_for($f.teams.home.id; "Ball Possession"),away:value_for($f.teams.away.id; "Ball Possession")},
                    shots:{home:value_for($f.teams.home.id; "Total Shots"),away:value_for($f.teams.away.id; "Total Shots")},
                    shots_on_target:{home:value_for($f.teams.home.id; "Shots on Goal"),away:value_for($f.teams.away.id; "Shots on Goal")},
                    corners:{home:value_for($f.teams.home.id; "Corner Kicks"),away:value_for($f.teams.away.id; "Corner Kicks")},
                    yellow_cards:{home:value_for($f.teams.home.id; "Yellow Cards"),away:value_for($f.teams.away.id; "Yellow Cards")},
                    red_cards:{home:value_for($f.teams.home.id; "Red Cards"),away:value_for($f.teams.away.id; "Red Cards")},
                    dangerous_attacks:{home:value_for($f.teams.home.id; "Dangerous Attacks"),away:value_for($f.teams.away.id; "Dangerous Attacks")}
                  },
                  events:[
                    $events[0].response[]?
                    | {minute:.time.elapsed,type:.type,detail:.detail,player:(.player.name // ""),team:(.team.name // "")}
                  ]
                },
                api_response:{fixture:$f},
                stored_response:{mode:"scheduled-five-minute",details_refreshed:true}
              }
          ' > live-data.json

      - name: Commit refreshed live data
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-data.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh Greenock Morton v Partick Thistle'
          git pull --rebase origin main
          git push origin main
