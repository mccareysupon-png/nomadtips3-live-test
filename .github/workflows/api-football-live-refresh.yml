name: Refresh Greenock Morton v Partick Thistle

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/api-football-live-refresh.yml'
  schedule:
    - cron: '*/10 14-17 1 8 *'

permissions:
  contents: write

concurrency:
  group: api-football-greenock-partick
  cancel-in-progress: false

jobs:
  refresh-until-finished:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      TARGET_DATE: '2026-08-01'
      WINDOW_END_UTC: '2026-08-01T17:30:00Z'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Poll API-Football every five minutes until final state
        shell: bash
        run: |
          set -uo pipefail

          if [ -z "${API_FOOTBALL_KEY:-}" ]; then
            echo 'API_FOOTBALL_KEY is missing'
            exit 1
          fi

          BASE='https://v3.football.api-sports.io'
          end_epoch="$(date -u -d "$WINDOW_END_UTC" +%s)"
          now_epoch="$(date -u +%s)"

          if [ "$now_epoch" -gt "$end_epoch" ]; then
            echo 'Match polling window already ended.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          FIXTURE_ID="$(jq -r '.match.id // empty' live-data.json 2>/dev/null || true)"
          if ! [[ "$FIXTURE_ID" =~ ^[0-9]+$ ]]; then
            if ! curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors --get \
              -H "x-apisports-key: $API_FOOTBALL_KEY" \
              --data-urlencode "date=$TARGET_DATE" \
              --data-urlencode 'timezone=UTC' \
              "$BASE/fixtures" > /tmp/day-fixtures.json; then
              echo 'Unable to resolve fixture list.'
              exit 1
            fi

            FIXTURE_ID="$(jq -r '
              def norm: ascii_downcase | gsub("[^a-z0-9]"; "");
              [
                .response[]?
                | select(
                    ((.teams.home.name | norm) | test("greenockmorton|morton"))
                    and
                    ((.teams.away.name | norm) | test("partickthistle|partick"))
                  )
                | .fixture.id
              ][0] // empty
            ' /tmp/day-fixtures.json)"
          fi

          if ! [[ "$FIXTURE_ID" =~ ^[0-9]+$ ]]; then
            echo 'Fixture ID was not resolved; preserving current live-data.json.'
            exit 1
          fi

          echo "Using fixture ID: $FIXTURE_ID"
          cycle=0

          while [ "$(date -u +%s)" -le "$end_epoch" ]; do
            cycle=$((cycle + 1))
            echo "Live refresh cycle $cycle at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

            git pull --rebase origin main || true
            cp live-data.json /tmp/previous.json 2>/dev/null || echo '{}' > /tmp/previous.json

            if ! curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors \
              -H "x-apisports-key: $API_FOOTBALL_KEY" \
              "$BASE/fixtures?id=$FIXTURE_ID" > /tmp/fixture.json; then
              echo 'Fixture request failed; preserving the previous snapshot.'
              sleep 60
              continue
            fi

            if ! jq -e '.response[0]' /tmp/fixture.json >/dev/null 2>&1; then
              echo 'Fixture response was empty; preserving the previous snapshot.'
              sleep 60
              continue
            fi

            curl --silent --show-error --retry 2 --retry-delay 3 --retry-all-errors \
              -H "x-apisports-key: $API_FOOTBALL_KEY" \
              "$BASE/fixtures/statistics?fixture=$FIXTURE_ID" > /tmp/stats.json \
              || echo '{"response":[]}' > /tmp/stats.json

            curl --silent --show-error --retry 2 --retry-delay 3 --retry-all-errors \
              -H "x-apisports-key: $API_FOOTBALL_KEY" \
              "$BASE/fixtures/events?fixture=$FIXTURE_ID" > /tmp/events.json \
              || echo '{"response":[]}' > /tmp/events.json

            jq -e '.response | arrays' /tmp/stats.json >/dev/null 2>&1 \
              || echo '{"response":[]}' > /tmp/stats.json
            jq -e '.response | arrays' /tmp/events.json >/dev/null 2>&1 \
              || echo '{"response":[]}' > /tmp/events.json

            if ! jq -n \
              --arg fetched_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              --argjson cycle "$cycle" \
              --slurpfile fixture /tmp/fixture.json \
              --slurpfile stats /tmp/stats.json \
              --slurpfile events /tmp/events.json \
              --slurpfile previous /tmp/previous.json \
              '
              def value_for($team_id; $type):
                ([ $stats[0].response[]?
                   | select(.team.id == $team_id)
                   | .statistics[]?
                   | select(.type == $type)
                   | .value ][0] // null);
              def keep($new; $old):
                if $new == null or $new == "" then $old else $new end;

              ($fixture[0].response[0]) as $f
              | ($previous[0].match.stats // {}) as $old_stats
              | ($previous[0].match.events // []) as $old_events
              | ([
                  $events[0].response[]?
                  | {minute:.time.elapsed,type:.type,detail:.detail,player:(.player.name // ""),team:(.team.name // "")}
                ]) as $new_events
              | {
                  source:"api-football",
                  fetched_at_utc:$fetched_at,
                  http_status:200,
                  match:{
                    id:($f.fixture.id|tostring),
                    sport:"football",
                    league:$f.league.name,
                    country:$f.league.country,
                    home:{name:$f.teams.home.name,short_name:$f.teams.home.name},
                    away:{name:$f.teams.away.name,short_name:$f.teams.away.name},
                    kickoff_utc:$f.fixture.date,
                    status:$f.fixture.status.short,
                    status_long:$f.fixture.status.long,
                    elapsed:$f.fixture.status.elapsed,
                    score:{home:$f.goals.home,away:$f.goals.away},
                    halftime_score:{home:$f.score.halftime.home,away:$f.score.halftime.away},
                    fulltime_score:{home:$f.score.fulltime.home,away:$f.score.fulltime.away},
                    stats:{
                      possession:{
                        home:keep(value_for($f.teams.home.id; "Ball Possession"); $old_stats.possession.home),
                        away:keep(value_for($f.teams.away.id; "Ball Possession"); $old_stats.possession.away)
                      },
                      shots:{
                        home:keep(value_for($f.teams.home.id; "Total Shots"); $old_stats.shots.home),
                        away:keep(value_for($f.teams.away.id; "Total Shots"); $old_stats.shots.away)
                      },
                      shots_on_target:{
                        home:keep(value_for($f.teams.home.id; "Shots on Goal"); $old_stats.shots_on_target.home),
                        away:keep(value_for($f.teams.away.id; "Shots on Goal"); $old_stats.shots_on_target.away)
                      },
                      corners:{
                        home:keep(value_for($f.teams.home.id; "Corner Kicks"); $old_stats.corners.home),
                        away:keep(value_for($f.teams.away.id; "Corner Kicks"); $old_stats.corners.away)
                      },
                      yellow_cards:{
                        home:keep(value_for($f.teams.home.id; "Yellow Cards"); $old_stats.yellow_cards.home),
                        away:keep(value_for($f.teams.away.id; "Yellow Cards"); $old_stats.yellow_cards.away)
                      },
                      red_cards:{
                        home:keep(value_for($f.teams.home.id; "Red Cards"); $old_stats.red_cards.home),
                        away:keep(value_for($f.teams.away.id; "Red Cards"); $old_stats.red_cards.away)
                      },
                      dangerous_attacks:{
                        home:keep(value_for($f.teams.home.id; "Dangerous Attacks"); $old_stats.dangerous_attacks.home),
                        away:keep(value_for($f.teams.away.id; "Dangerous Attacks"); $old_stats.dangerous_attacks.away)
                      }
                    },
                    events:(if ($new_events|length) > 0 then $new_events else $old_events end)
                  },
                  api_response:{fixture:$f},
                  stored_response:{mode:"continuous-five-minute",cycle:$cycle,details_refreshed:true}
                }
              ' > /tmp/live-data.new; then
              echo 'Could not build the new JSON snapshot; preserving the previous file.'
              sleep 60
              continue
            fi

            mv /tmp/live-data.new live-data.json
            status_short="$(jq -r '.match.status // ""' live-data.json)"

            git add live-data.json
            if ! git diff --cached --quiet; then
              git commit -m "Refresh Morton v Partick live data"
              if ! git pull --rebase origin main; then
                git rebase --abort || true
                git reset --hard origin/main
                sleep 30
                continue
              fi
              git push origin main || true
            fi

            if [[ "$status_short" =~ ^(FT|AET|PEN|CANC|ABD|AWD|WO)$ ]]; then
              echo "Match reached final state: $status_short"
              break
            fi

            sleep 300
          done
