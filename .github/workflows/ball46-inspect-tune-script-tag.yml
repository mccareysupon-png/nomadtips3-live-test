name: BALL46 Inspect Tune Load Order
on:
  push:
    branches: [fix/ball46-all-matches-landing-real-20261019]
    paths: ['.github/workflows/ball46-inspect-tune-script-tag.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          node --input-type=module <<'JS'
          const s=await(await fetch('https://ball46.com/index.html?tagAudit='+Date.now())).text();
          const pattern=/<script\b[^>]*\bsrc=(["'])(?:\/)?dashboard-v2-tune\.js[^"']*\1[^>]*>\s*<\/script>/gi;
          const tags=[...s.matchAll(pattern)];
          console.log('TUNE_SCRIPT_TAG',JSON.stringify({matches:tags.map(m=>({tag:m[0],offset:m.index,around:s.slice(m.index-700,m.index+m[0].length+700)})),bodyStart:s.indexOf('<body'),bodyEnd:s.indexOf('</body>')}));
          JS
