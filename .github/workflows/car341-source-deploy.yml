name: Deploy CAR 3.4.1 Source Monitor

on:
  push:
    branches:
      - feature/car3-4-1-ui-shell
    paths:
      - "car3-4-1/worker/**"
      - ".github/workflows/car341-source-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  CAR341_WORKER_URL: https://nomadtips3-car341-source-monitor.mccarey-supon.workers.dev

jobs:
  validate-deploy-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate isolated CAR 3.4.1 source layer
        working-directory: car3-4-1/worker
        run: |
          npm test
          npm run check
          npx --yes wrangler@4 deploy --dry-run --outdir /tmp/car341-dry-run
      - name: Mark source code validation
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d '{"state":"success","context":"car341/source-code","description":"Source tests and dry-run passed"}'
      - name: Validate Cloudflare credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Deploy new CAR 3.4.1 source monitor only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: car3-4-1/worker
          wranglerVersion: "4"
          command: deploy
      - name: Mark source Cloudflare deployment
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d '{"state":"success","context":"car341/source-cloudflare","description":"Source Worker deployed"}'
      - name: Smoke test process health
        shell: bash
        run: |
          HEALTH=""
          for i in $(seq 1 12); do
            if HEALTH=$(curl -fsS "$CAR341_WORKER_URL/health"); then break; fi
            sleep 5
          done
          printf '%s' "$HEALTH" | head -c 12000; echo
          printf '%s' "$HEALTH" | grep -q '"version": "3.4.1"' || { echo "::error::CAR 3.4.1 identity missing"; exit 1; }
          printf '%s' "$HEALTH" | grep -q '"phase": "SOURCE_MONITOR"' || { echo "::error::SOURCE_MONITOR phase missing"; exit 1; }
          printf '%s' "$HEALTH" | grep -q '"detector": false' || { echo "::error::Detector must remain disconnected"; exit 1; }
          printf '%s' "$HEALTH" | grep -q '"cron": false' || { echo "::error::Cron must remain disconnected"; exit 1; }
      - name: Mark source process health
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d '{"state":"success","context":"car341/source-health","description":"Source health endpoint passed"}'
      - name: Probe Goaloo source
        shell: bash
        run: |
          SOURCE=$(curl -fsS "$CAR341_WORKER_URL/source-health")
          printf '%s' "$SOURCE" | head -c 12000; echo
          printf '%s' "$SOURCE" | grep -q '"provider": "GOALOO"' || { echo "::error::Goaloo provider identity missing"; exit 1; }
          printf '%s' "$SOURCE" | grep -q '"ok": true' || { echo "::error::Goaloo source probe failed"; exit 1; }
      - name: Mark Goaloo probe
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d '{"state":"success","context":"car341/source-goaloo","description":"Goaloo source probe passed"}'
      - name: Probe normalized live snapshot
        shell: bash
        run: |
          LIVE=$(curl -fsS "$CAR341_WORKER_URL/live")
          printf '%s' "$LIVE" | head -c 20000; echo
          printf '%s' "$LIVE" | grep -q '"phase": "SOURCE_MONITOR"' || { echo "::error::Live snapshot phase missing"; exit 1; }
          printf '%s' "$LIVE" | grep -q '"source": "GOALOO"' || { echo "::error::Live snapshot source missing"; exit 1; }
          printf '%s' "$LIVE" | grep -q '"generatedAt"' || { echo "::error::Live generatedAt missing"; exit 1; }
      - name: Mark normalized live feed
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d '{"state":"success","context":"car341/source-live","description":"Normalized live feed passed"}'
      - name: Probe fixture and FT settlement feed
        shell: bash
        run: |
          FIXTURES=$(curl -fsS "$CAR341_WORKER_URL/fixtures")
          printf '%s' "$FIXTURES" | head -c 20000; echo
          printf '%s' "$FIXTURES" | grep -q '"source": "GOALOO"' || { echo "::error::Fixture source missing"; exit 1; }
          printf '%s' "$FIXTURES" | grep -q '"fixtures"' || { echo "::error::Fixture collection missing"; exit 1; }
          printf '%s' "$FIXTURES" | grep -q '"generatedAt"' || { echo "::error::Fixture generatedAt missing"; exit 1; }
      - name: Mark fixture feed
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d '{"state":"success","context":"car341/source-fixtures","description":"Fixture settlement feed passed"}'
      - name: Show isolated test URLs
        run: |
          echo "CAR 3.4.1 Source: $CAR341_WORKER_URL"
          echo "Health: $CAR341_WORKER_URL/health"
          echo "Source health: $CAR341_WORKER_URL/source-health"
          echo "Fixtures: $CAR341_WORKER_URL/fixtures"
          echo "Live normalized source: $CAR341_WORKER_URL/live"
          echo "CAR 3.4 worker was not referenced or deployed by this workflow."
      - name: Publish source deployment proof
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE=success
          [ "$JOB_STATUS" = "success" ] || STATE=failure
          curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "{\"state\":\"$STATE\",\"context\":\"car341/source-deploy\",\"description\":\"CAR 3.4.1 source deployment $STATE\"}"
