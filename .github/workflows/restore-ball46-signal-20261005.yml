name: Restore Ball46 Signal 20261005

on:
  push:
    branches: [work/ball46-daily-performance-20261005]
    paths:
      - '.github/workflows/restore-ball46-signal-20261005.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-production-signal-restore
  cancel-in-progress: false

jobs:
  restore-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install rollback dependency
        run: npm install --no-save --ignore-scripts acorn@8

      - name: Restore previous production version
        working-directory: deploy-assets/daily-performance-20261005
        run: node restore-signal.mjs
