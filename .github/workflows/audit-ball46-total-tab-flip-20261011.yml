name: Audit Ball46 Total Tab Count Sources Readonly
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-ball46-total-tab-flip-20261011.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Inspect Production Total tab count writers, no mutation
        run: |
          node --input-type=module <<'NODE'
          const base='https://ball46.com';
          const sync=await(await fetch(base+'/ui-sync-fixes-343-v2.js',{signal:AbortSignal.timeout(20000)})).text();
          for(const term of ['function paintStatCounts','function paintStatSummary','function loadStatCountsOnce','ball46:statistics-snapshot','const summary','function bind']){
           const i=sync.indexOf(term);console.log('UI_SYNC_FUNCTION',term,i,i>=0?sync.slice(Math.max(0,i-250),Math.min(sync.length,i+2300)).replaceAll('\n',' '):'');
          }
          console.log('UI_SYNC_LENGTH',sync.length);
          const sjs=await(await fetch(base+'/singlepage-workspace-343.js',{signal:AbortSignal.timeout(20000)})).text();
          console.log('MIRROR_FUNCTION_BLOCK',sjs.slice(15550,17520).replaceAll('\n',' '));
          console.log('STAT_NAV_BLOCK',sjs.slice(17000,17600).replaceAll('\n',' '));
          const sh=await(await fetch(base+'/index.html',{signal:AbortSignal.timeout(20000)})).text();
          for(const i of [sh.indexOf('data-stat-market="all"'),sh.indexOf('data-stat-market="all"',60000)])console.log('HTML_LOCAL',i,sh.slice(Math.max(0,i-180),i+350));
          const ascripts=[...sh.matchAll(/<script\b[^>]*>[\s\S]*?<\/script>/gi)];
          console.log('INLINE_SCRIPT_COUNT',ascripts.length);
          for(let i=0;i<ascripts.length;i++){const source=ascripts[i][0];if(/data-stat-market|workspace-nav-row|sp-kpi|ledgerTotal/.test(source))console.log('SCRIPT_CONTEXT',i,source.length,source.slice(0,330),source.slice(-300));}
          const paths=['/index.html','/singlepage-workspace-343.js','/mobile-menu-classic-343.js','/dashboard-v2-tune.js','/workspace-route-guard-343.js','/statistics-page-343.js','/statistics-v2-343.js'];
          for(const path of paths){
           try{
            const r=await fetch(base+path,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)});console.log('FILE',path,r.status);if(!r.ok)continue;
            const s=await r.text();console.log('LENGTH',path,s.length);
            const tokens=['data-stat-market','marketCounts','statisticsTotal','ledgerTotal','data-sp-market','data-statistics-total','data-workspace-nav','[data-stat-market]','statistics-snapshot','stat-market','textContent=','MutationObserver','SETTLED'];
            for(const term of tokens){let at=0,n=0;while((at=s.indexOf(term,at))>=0&&n++<24){
             const p=s.slice(Math.max(0,at-150),Math.min(s.length,at+380)).replaceAll('\n',' ');
             if(path!='/index.html'||/data-stat-market|statisticsTotal|ledgerTotal|data-sp-market/.test(term))console.log('HIT',path,term,at,p);
             at+=term.length;
            }}
           }catch(e){console.log('ERROR',path,String(e).slice(0,300))}
          }
          const d=await(await fetch(base+'/api/engine/statistics?paged=1',{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(20000)})).json();
          console.log('TOTALS',JSON.stringify({total:d.total,ledgerTotal:d.ledgerTotal,pending:d.pending,unresolved:d.unresolved,rows:d.rows?.length}));
          NODE
