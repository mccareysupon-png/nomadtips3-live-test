name: Terminate Ball46 3.44

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ball46-344-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ball46-344-termination
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  ENGINE_URL: https://ball46-344-engine.mccarey-supon.workers.dev

jobs:
  terminate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Cloudflare credentials for termination
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Remove 5Dollar secret binding from Ball46 3.44 only
        shell: bash
        run: |
          set +e
          printf 'y\n' | npx --yes wrangler@4.131.1 secret delete FIVEDOLLAR_API_KEY --name ball46-344-engine 2>&1 | tee /tmp/ball46-344-secret-delete.log
          secret_status=${PIPESTATUS[1]}
          set -e
          if [ "$secret_status" -ne 0 ]; then
            if grep -Eiq 'not found|does not exist|no worker|missing|unknown worker|could not find' /tmp/ball46-344-secret-delete.log; then
              echo 'FIVEDOLLAR_API_KEY binding already absent or Worker already missing for 3.44.'
            else
              echo 'Secret delete did not complete; Worker deletion will remove the 3.44 binding if the Worker exists.'
            fi
          fi

      - name: Delete Ball46 3.44 Cloudflare Worker
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4.131.1 delete ball46-344-engine --force 2>&1 | tee /tmp/ball46-344-worker-delete.log
          delete_status=${PIPESTATUS[0]}
          set -e
          if [ "$delete_status" -ne 0 ]; then
            if grep -Eiq 'not found|does not exist|no worker|missing|unknown worker|could not find' /tmp/ball46-344-worker-delete.log; then
              echo 'ball46-344-engine already absent.'
            else
              echo 'Failed to delete ball46-344-engine.'
              exit "$delete_status"
            fi
          fi

      - name: Verify Ball46 3.44 Worker no longer serves traffic
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/ball46-344-worker-check.txt -w '%{http_code}' "$ENGINE_URL/health" || true)
          echo "Worker health status after delete: $status"
          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            cat /tmp/ball46-344-worker-check.txt
            echo 'ball46-344-engine still serves a 2xx response after delete.'
            exit 1
          fi

      - name: Remove Ball46 3.44 files and self-delete terminator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ball46 Terminator'
          git config user.email 'actions@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            echo 'Files planned for Ball46 3.44 removal:'
            git ls-files \
              .github/workflows/ball46-344-deploy.yml \
              .github/workflows/ball46-344-bootstrap.yml \
              .ball46-bootstrap \
              ball46-344 \
              workers/ball46-344-engine
            git rm -r --ignore-unmatch \
              .github/workflows/ball46-344-deploy.yml \
              .github/workflows/ball46-344-bootstrap.yml \
              .ball46-bootstrap \
              ball46-344 \
              workers/ball46-344-engine
            if git diff --cached --quiet; then
              echo 'No Ball46 3.44 files remained to delete.'
              exit 1
            fi
            git status --short
            git commit -m 'remove failed Ball46 3.44 and stop all upstream API activity'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying against latest main."
            sleep 5
          done
          echo 'Failed to push Ball46 3.44 deletion commit after retries.'
          exit 1
