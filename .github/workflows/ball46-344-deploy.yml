name: Deploy Ball46 3.44 Engine

on:
  push:
    branches: [main]
    paths:
      - 'workers/ball46-344-engine/**'
      - 'ball46-344/**'
      - '.github/workflows/ball46-344-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
  ENGINE_URL: https://ball46-344-engine.mccarey-supon.workers.dev

jobs:
  validate-deploy-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate isolated 3.44 source
        run: |
          set -euo pipefail
          node --check workers/ball46-344-engine/src/index.js
          node --check ball46-344/app.js
          grep -Fq 'status=live&include=odds,events,stats' workers/ball46-344-engine/src/index.js
          ! grep -R -F 'api.5dollarfootballapi.com' ball46-344/
          test -f ball46-344/index.html
          test -f ball46-344/signal.html
          test -f ball46-344/statistics.html
          test -f ball46-344/match-lab.html
          test -f ball46-344/prediction.html

      - name: Dry run Worker bundle
        working-directory: workers/ball46-344-engine
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc

      - name: Validate deploy credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$FIVEDOLLAR_API_KEY"

      - name: Deploy Ball46 3.44 Worker
        working-directory: workers/ball46-344-engine
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Bind 5Dollar Ultra key
        working-directory: workers/ball46-344-engine
        run: printf '%s' "$FIVEDOLLAR_API_KEY" | npx --yes wrangler@4.92.0 secret put FIVEDOLLAR_API_KEY --config wrangler.jsonc

      - name: Start state object and wait for central collector
        run: |
          set -euo pipefail
          curl -fsS "$ENGINE_URL/health" -o /tmp/health.json
          ok=0
          for i in $(seq 1 15); do
            sleep 4
            curl -fsS "$ENGINE_URL/health" -o /tmp/health.json
            cat /tmp/health.json
            if node -e "const h=require('/tmp/health.json');process.exit(h.lastSuccessAt?0:1)"; then ok=1; break; fi
          done
          test "$ok" = 1
          node - <<'NODE'
          const h=require('/tmp/health.json');
          if(h.lastError) throw new Error('collector unhealthy: '+JSON.stringify(h.lastError));
          if(Number(h.viewerUpstreamRequests)!==0) throw new Error('viewer invariant failed');
          console.log('central collector PASS',{status:h.status,live:h.liveCount,rate:h.rate});
          NODE

      - name: Prove viewer layer is provider-isolated
        run: |
          set -euo pipefail
          ! grep -R -F '5dollarfootballapi.com' ball46-344/
          for i in $(seq 1 20); do curl -fsS "$ENGINE_URL/api/live" >/dev/null; done
          curl -fsS "$ENGINE_URL/health" -o /tmp/health2.json
          node - <<'NODE'
          const h=require('/tmp/health2.json');
          if(h.viewerUpstreamRequests!==0) throw new Error('viewer upstream request invariant failed');
          console.log('20 viewer reads complete; viewer upstream invariant = 0');
          NODE

      - name: Verify public API shape
        run: |
          set -euo pipefail
          curl -fsS "$ENGINE_URL/health" -o /tmp/health.json
          curl -fsS "$ENGINE_URL/api/live" -o /tmp/live.json
          node - <<'NODE'
          const h=require('/tmp/health.json'), l=require('/tmp/live.json');
          if(h.ok!==true || !String(h.version||'').startsWith('ball46-344-')) throw new Error('wrong health/version');
          if(!Array.isArray(l.fixtures)) throw new Error('live fixtures array missing');
          if(l.viewerUpstreamRequests!==0) throw new Error('live invariant missing');
          console.log('Ball46 3.44 public API PASS',{status:h.status,live:l.fixtures.length,rate:h.rate});
          NODE
