name: Member 12 Kits — Staging QA Only
on:
  push:
    branches:
      - stage/ball46-member-12-kits-20261020
    paths:
      - 'ball46-member/**'
      - '.github/workflows/member-12-kits-stage-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-member-kits:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and tests
        working-directory: ball46-member
        run: |
          node --check src/worker.js
          node --check public/member.js
          node --check public/member-kits.js
          node --check public/event-flow-icons.js
          node --test tests/*.test.mjs
      - name: Verify assets and member HTML wiring
        working-directory: ball46-member
        run: |
          set -euo pipefail
          count=$(find public/assets/kits/webp/2x -maxdepth 1 -name 'kit_*.webp' -type f | wc -l)
          test "$count" -eq 12
          test "$(file -b public/assets/kits/webp/2x/kit_01_red.webp | grep -c 'Web/P')" -eq 1
          grep -Fq '/member-kits.js' public/member.html
          ! grep -Fq '/member-kits.js' public/pricing.html
          ! grep -Fq '/member-kits.js' public/login.html
          echo "12_BALL46_PREMIUM_KITS_PRESENT"
      - name: Worker dry run (NO DEPLOY)
        working-directory: ball46-member
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc
