name: diag-ball46-signal-status-literals
on:
  push:
    branches: [diag/ball46-stats-gap-run2-20260927]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect status literals in current engine
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,base64,re
          a=os.environ['CLOUDFLARE_ACCOUNT_ID']; t=os.environ['CLOUDFLARE_API_TOKEN']
          h={'Authorization':'Bearer '+t,'Accept':'application/json'}
          base=f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/scripts/nomadtips3-engine-343'
          with urllib.request.urlopen(urllib.request.Request(base+'/deployments',headers=h),timeout=30) as r:p=json.load(r)
          vid=p['result']['deployments'][0]['versions'][0]['version_id']
          u=f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/workers/nomadtips3-engine-343/versions/{vid}?include=modules'
          with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=30) as r:q=json.load(r)
          m=(q.get('result') or {}).get('modules') or []
          s='\n'.join(base64.b64decode(x['content_base64']).decode('utf-8','replace') for x in m if x.get('content_base64'))
          vals=sorted(set(re.findall(r'(?:status\s*[:=]\s*|status\s*===?\s*)["\']([A-Z_]+)["\']',s)))
          print('STATUS_LITERALS',vals)
          for word in vals:
              for mm in list(re.finditer(re.escape(word),s))[:12]:
                  chunk=re.sub(r'\s+',' ',s[max(0,mm.start()-350):min(len(s),mm.end()+650)])
                  if 'status' in chunk.lower(): print('STATUS_CONTEXT',word,chunk[:1200])
          PY
