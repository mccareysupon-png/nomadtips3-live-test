name: BALL46 read-only engine routing check
on:
  push:
    branches: [test/ball46-sidebar-spacing-20261119]
    paths: ['.github/workflows/detection-engine-routing-audit-20261119.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspect service binding routing metadata
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node qa/detection-private-20261119/audit-engine-routing.mjs
