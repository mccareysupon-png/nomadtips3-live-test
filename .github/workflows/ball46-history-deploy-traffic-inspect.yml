name: BALL46 read only check latest test Worker version and live route
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-history-deploy-traffic-inspect.yml']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import crypto from 'node:crypto';
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers';
          const n='ball46-prematch-only-test-20261120',headers={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const cf=async p=>{const r=await fetch(root+p,{headers});const j=await r.json();return {status:r.status,ok:r.ok,success:j.success,result:j.result,errors:j.errors}};
          const deploy=await cf('/scripts/'+n+'/deployments?per_page=6');
          const versions=await cf('/workers/'+n+'/versions?per_page=6');
          const v2=await cf('/workers/workers/'+n+'/versions?per_page=6');
          console.log('TRAFFIC_DEPLOY '+JSON.stringify({status:deploy.status,deployments:deploy.result?.deployments?.map(x=>({id:x.id,created_on:x.created_on,versions:x.versions}))}));
          console.log('TRAFFIC_VERSION_LIST '+JSON.stringify({legacy:{status:versions.status,errors:versions.errors,versions:versions.result?.versions?.slice(0,5).map(x=>({id:x.id,created_on:x.created_on}))},new:{status:v2.status,errors:v2.errors,versions:v2.result?.versions?.slice(0,5).map(x=>({id:x.id,created_on:x.created_on}))}}));
          const current=deploy.result?.deployments?.[0]?.versions?.[0]?.version_id;
          if(current)for(const p of ['/workers/'+n+'/versions/'+current+'?include=modules','/workers/workers/'+n+'/versions/'+current+'?include=modules']){
            const got=await cf(p);const modules=got.result?.modules?.map(x=>({name:x.name,length:x.content_base64?.length,containsHistory:(Buffer.from(x.content_base64||'','base64').toString().includes('history-round-tick'))}));
            console.log('TRAFFIC_ACTIVE_MODULE '+JSON.stringify({path:p,status:got.status,errors:got.errors,modules}));
          }
          const token=crypto.createHmac('sha256',process.env.CLOUDFLARE_API_TOKEN).update('BALL46_PREMATCH_ONLY_V1').digest('hex');
          const h=await fetch('https://'+n+'.mccarey-supon.workers.dev/health',{headers:{authorization:'Bearer '+token},cache:'no-store'});
          const data=await h.json();console.log('TRAFFIC_HTTP_HEALTH '+JSON.stringify({status:h.status,historyRounds:data.historyRounds,cutoff:data.cutoff,providerCalls:data.providerCalls,stored:data.stored}));
          JS
