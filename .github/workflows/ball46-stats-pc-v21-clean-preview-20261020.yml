name: BALL46 Statistics PC V2.1 Clean Compact Browser Preview
on:
  push:
    branches: [codex/ball46-stats-pc-v21-clean-preview-20261020]
    paths:
      - '.github/workflows/ball46-stats-pc-v21-clean-preview-20261020.yml'
      - 'deploy-assets/stats-pc-v2-preview-20261020/preview.mjs'
      - 'deploy-assets/stats-pc-v2-preview-20261020/preview.css'
      - 'deploy-assets/stats-pc-v2-preview-20261020/compact-v21.css'
permissions:
  contents: read
concurrency:
  group: ball46-statistics-pc-v21-inactive-preview
  cancel-in-progress: false
jobs:
  preview-and-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate clean compact preview sources
        working-directory: deploy-assets/stats-pc-v2-preview-20261020
        run: |
          set -euo pipefail
          node --check preview.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
      - name: Create inactive preview and browser QA; never activate Production
        working-directory: deploy-assets/stats-pc-v2-preview-20261020
        run: node preview.mjs
      - name: Save PC screenshots and no-production-change proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-statistics-v21-clean-compact-preview
          path: deploy-assets/stats-pc-v2-preview-20261020/audit/
          retention-days: 30
          if-no-files-found: warn
