name: BALL46 exact Production Statistics 7D 30D 90D source and DOM diagnostic
on:
  push:
    branches: [fix/b46-production-statistics-range-no-flicker-20261125]
    paths: ['.github/workflows/b46-production-statistics-diagnostic-20261125.yml']
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - run: node qa/statistics-no-flicker-20261125/diagnose.mjs
