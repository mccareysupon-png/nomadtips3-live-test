name: Rollback Ball46 Flat Result Cards 20261006

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-production-flat-result-cards-rollback-20261006
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact flat-card branch
        uses: actions/checkout@v4
        with:
          ref: work/ball46-flat-result-cards-20261006
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore exact pre-flat-card Production version
        working-directory: deploy-assets/rollback-flat-result-cards-20261006
        run: node run.mjs
