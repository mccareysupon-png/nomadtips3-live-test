name: BALL46 MEMBER Event Flow SIGNAL V3 — Guarded Production
on:
  push:
    branches: [codex/ball46-member-eventflow-signal-v3-20261020]
    paths:
      - '.github/workflows/member-eventflow-signal-v3-production.yml'
permissions:
  contents: read
concurrency:
  group: ball46-member-production-deploy
  cancel-in-progress: false
jobs:
  member-signal-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser for candidate and live site
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate exact visual-only source and protect latest Member release
        run: |
          set -euo pipefail
          node --check ball46-member/member-signal-v3-20261020/theme.mjs
          node --check ball46-member/member-signal-v3-20261020/deploy.mjs
          python3 -m py_compile ball46-member/member-loading-20261020/patch_member.py
          # Rebuild the previous protected HTML from the exact source used for the live Member Worker.
          git fetch origin 05c276f7f76a6226b10b45bd85ac369e53167d2f
          git cat-file -e 05c276f7f76a6226b10b45bd85ac369e53167d2f^{commit}
          mkdir -p /tmp/ball46-member-live-tree
          git archive --format=tar 05c276f7f76a6226b10b45bd85ac369e53167d2f ball46-member/public | tar xf - -C /tmp/ball46-member-live-tree
          test -s /tmp/ball46-member-live-tree/ball46-member/public/member.js
          test -s /tmp/ball46-member-live-tree/ball46-member/public/member.html
      - name: Verify all 42 latest assets, create candidate and preview, deploy guarded, verify or rollback
        run: node ball46-member/member-signal-v3-20261020/deploy.mjs
      - name: Upload immutable audit, hashes, screenshots and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-member-eventflow-signal-v3-guard-audit
          path: audit/member-eventflow-signal-v3-production/
          retention-days: 30
          if-no-files-found: warn
