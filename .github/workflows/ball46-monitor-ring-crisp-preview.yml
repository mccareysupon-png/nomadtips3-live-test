name: BALL46 crisp monitor rings PREVIEW ONLY
on:
  push:
    branches: [codex/ball46-monitor-ring-crisp-20261101]
    paths: ['work/ball46-monitor-ring-crisp-20261101/request.json']
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: work/ball46-monitor-ring-crisp-20261101
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only source guard and build comparison
        run: |
          node verify-source.mjs
          node build.mjs
      - name: Install browser tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Vector edges, stationary and moving, PC/mobile sizes
        run: node check.mjs
      - name: Preserve preview proof only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record monitor ring preview proof only [skip ci]"
          git push origin HEAD:codex/ball46-monitor-ring-crisp-20261101
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crisp-rings-preview-${{ github.run_id }}
          path: work/ball46-monitor-ring-crisp-20261101/qa
