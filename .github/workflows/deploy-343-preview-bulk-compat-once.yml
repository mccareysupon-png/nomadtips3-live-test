name: Deploy NOMAD 3.43 Preview Bulk Compat Once

on:
  push:
    branches: ['recovery/343-start-of-morning-20260915']
    paths:
      - '.github/workflows/deploy-343-preview-bulk-compat-once.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-preview-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/343-start-of-morning-20260915

      - name: Validate Cloudflare deploy credentials only
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Assert target is bulk-only and has no legacy provider path
        run: |
          set -euo pipefail
          TARGETS="workers/nomadtips3-343-preview nomad-live-343/full-odds-main-343.js"
          ! grep -R -n -E 'api\.5dollarfootballapi\.com|FIVEDOLLAR_API_KEY|ONE_FIXTURE_ONE_REQUEST|env\.FULL_MARKET|nomadtips3-343-full-market|full-market\.internal|setInterval\(pollExpanded|POLL_MS=15_000|FALLBACK_API' $TARGETS

      - name: Build preview Worker config without legacy full-market binding
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'workers/nomadtips3-343-preview/wrangler.jsonc';
          let config = fs.readFileSync(path, 'utf8');
          config = config.replace('"name": "nomadtips3-343-ultra-preview"', '"name": "nomadtips3-343-preview"');
          fs.writeFileSync('workers/nomadtips3-343-preview/wrangler.preview.jsonc', config);
          NODE
          ! grep -n -E 'FULL_MARKET|nomadtips3-343-full-market|FIVEDOLLAR_API_KEY' workers/nomadtips3-343-preview/wrangler.preview.jsonc

      - name: Deploy preview compat only
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.preview.jsonc

      - name: Verify preview compat and engine stay bulk-only
        run: |
          set -euo pipefail
          node <<'NODE'
          const checks = [
            ['full', 'https://nomadtips3-343-preview.mccarey-supon.workers.dev/api/full-market/health'],
            ['engine', 'https://nomadtips3-343-preview.mccarey-supon.workers.dev/api/engine/health']
          ];
          (async () => {
            for (const [name, url] of checks) {
              const res = await fetch(`${url}?verify=${Date.now()}`, { headers: { 'cache-control': 'no-cache' } });
              const text = await res.text();
              console.log(`${url} -> HTTP ${res.status}`);
              console.log(text);
              if (text.includes('ONE_FIXTURE_ONE_REQUEST')) throw new Error(`${name}: legacy request mode still exposed`);
              if (name === 'full') {
                const json = JSON.parse(text);
                if (res.status !== 200 || json.component !== 'NOMAD343_FULL_MARKET_COMPAT' || json.mode !== 'BULK_SNAPSHOT_ONLY' || json.externalRequestsAdded !== 0) throw new Error(`${name}: compat health check failed`);
              }
              if (name === 'engine') {
                const json = JSON.parse(text);
                if (res.status !== 200 || json.ok !== true || json.dataMode !== 'BULK_SNAPSHOT_ONLY' || json.externalOddsRequests !== 0) throw new Error(`${name}: engine bulk-only check failed`);
              }
            }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
