name: Fix 3.43 Full Market Empty Books V2

on:
  push:
    branches: [work/nomad343-server-prewarm-20260914]
    paths:
      - '.github/workflows/fix-343-full-market-empty-books-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CANARY_URL: https://nomadtips3-343-stable-preview.mccarey-supon.workers.dev
  PROD_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/nomad343-server-prewarm-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch UI source
        run: |
          set -euo pipefail
          python .github/scripts/fix_343_full_market_empty_books.py
          node --check nomad-live-343/full-odds-bulk-343.js
          grep -Fq '343-full-odds-bulk-v2-fixed-10book-roster' nomad-live-343/full-odds-bulk-343.js
          grep -Fq 'data-has-market' nomad-live-343/full-odds-bulk-343.js
      - name: Persist UI source only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nomad-live-343/full-odds-bulk-343.js nomad-live-343/index.html
          git commit -m 'fix(343): keep all 10 bookmaker rows visible'
          git push origin HEAD:work/nomad343-server-prewarm-20260914
      - name: Guard exact scope
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD | sort)"
          expected="$(printf '%s\n' nomad-live-343/full-odds-bulk-343.js nomad-live-343/index.html | sort)"
          [ "$changed" = "$expected" ] || { echo "UNEXPECTED_SCOPE: $changed"; exit 1; }
          git diff --quiet HEAD^ HEAD -- workers/nomadtips3-engine-343 workers/nomadtips3-5usd-hub-343 workers/nomadtips3-343-full-market workers/nomadtips3-343-full-market-central nomad-live-341
      - name: Dry run viewers
        run: |
          set -euo pipefail
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.stable.jsonc)
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc)
      - name: Deploy canary viewer
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.stable.jsonc
      - name: Verify canary UI contract
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          TARGET_URL="$CANARY_URL" node .github/scripts/test_343_full_market_roster.js
      - name: Deploy production viewer
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc
      - name: Verify production asset
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            js="$(curl -fsS "$PROD_URL/full-odds-bulk-343.js?x=$RANDOM$(date +%s)" || true)"
            if grep -Fq '343-full-odds-bulk-v2-fixed-10book-roster' <<<"$js" && grep -Fq 'data-has-market' <<<"$js"; then
              echo 'PRODUCTION FULL MARKET 10 BOOK ROSTER ASSET OK'
              exit 0
            fi
            sleep 2
          done
          exit 1
