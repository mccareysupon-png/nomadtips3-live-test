name: BALL46 PC Featured Read Only Forensic
on:
  push:
    branches: [fix/ball46-existing-allmatches-mobile-detail-v6-20261021]
    paths:
      - '.github/workflows/ball46-pc-featured-readonly-20261021.yml'
      - 'deploy-assets/allmatches-detail-v6/pc-forensic-readonly.mjs'
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Measure live PC and mobile computed styles without deploying
        working-directory: deploy-assets/allmatches-detail-v6
        run: |
          npm install --no-save --ignore-scripts puppeteer-core@24
          node pc-forensic-readonly.mjs
      - name: Keep screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b46-pc-featured-readonly-proof
          path: deploy-assets/allmatches-detail-v6/pc-proof/
          retention-days: 15
          if-no-files-found: warn