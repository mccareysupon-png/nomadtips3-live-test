name: BALL46 deploy separate O-U two-way streak TEST system 20261124
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-ou-streak-reversal-v1-test-deploy-20261124.yml]
permissions: {contents: read}
concurrency:
  group: ball46-prematch-only-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check independent ledger, both streak directions and historical O/U regression
        run: |
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-streak-reversal-v1.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-value-screener-v2.test.mjs
      - name: Deploy only to isolated Pre-Match TEST Worker and verify separate page, records and counts
        run: node qa/prematch-history-20261120/deploy-ou-streak-reversal-v1-test-20261124.mjs
