name: Add 3.43 Standard Match Events

on:
  push:
    branches: [work/nomad343-server-prewarm-20260914]
    paths:
      - '.github/workflows/add-343-standard-match-events.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CANARY_URL: https://nomadtips3-343-stable-preview.mccarey-supon.workers.dev
  PROD_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev

jobs:
  test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/nomad343-server-prewarm-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm event timeline source
        run: |
          set -euo pipefail
          node --check nomad-live-343/event-flow-343.js
          node --check nomad-live-343/live-stable-343.js
          grep -Fq '343-flow-v4-standard-match-events' nomad-live-343/event-flow-343.js
          grep -Fq 'normalizeMatchEvents' nomad-live-343/event-flow-343.js
          grep -Fq 'data-events' nomad-live-343/live-stable-343.js
          grep -Fq '.nomad-event-rail{' nomad-live-343/event-flow-343.css
          grep -Fq 'event-flow-343.js?v=343-flow-v4-events' nomad-live-343/index.html
          git diff --quiet HEAD~1..HEAD -- workers/nomadtips3-engine-343 workers/nomadtips3-5usd-hub-343 workers/nomadtips3-343-full-market workers/nomadtips3-343-full-market-central nomad-live-341 || true

      - name: Dry run viewers
        run: |
          set -euo pipefail
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.stable.jsonc)
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc)

      - name: Deploy canary viewer
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.stable.jsonc

      - name: Wait for canary event assets
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            js="$(curl -fsS "$CANARY_URL/event-flow-343.js?probe=$RANDOM$(date +%s)" || true)"
            html="$(curl -fsS "$CANARY_URL/?probe=$RANDOM$(date +%s)" || true)"
            if grep -Fq '343-flow-v4-standard-match-events' <<<"$js" && grep -Fq 'event-flow-343.js?v=343-flow-v4-events' <<<"$html"; then
              echo 'CANARY EVENT ASSETS READY'
              ok=1
              break
            fi
            sleep 2
          done
          [ "$ok" = 1 ]

      - name: Verify event timeline on canary
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          TARGET_URL="$CANARY_URL" node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1366,height:900}});
            let detailCalls=0;
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            page.on('request',r=>{if(r.url().includes('/api/full-market/fixture-odds'))detailCalls++});
            await page.goto(process.env.TARGET_URL+'/?events='+Date.now(),{waitUntil:'networkidle',timeout:45000});
            await page.waitForFunction(()=>window.NOMAD_EVENT_FLOW_343?.version==='343-flow-v4-standard-match-events',{timeout:15000});
            const result=await page.evaluate(()=>{
              const el=document.createElement('section');
              el.className='nomad-event-flow-card';
              el.dataset.eventFlowFixture='qa';el.dataset.home='HOME';el.dataset.away='AWAY';el.dataset.homeId='1';el.dataset.awayId='2';
              const events=[
                {minute:12,type:'Goal',team:{id:1},player:{name:'Home Scorer'}},
                {time:{elapsed:27},type:'Card',detail:'Yellow Card',team:{id:2},player:{name:'Away Player'}},
                {time:{elapsed:46,extra:2},type:'subst',team:{id:1}},
                {minute:61,type:'VAR',team:{id:2}},
                {minute:73,type:'Card',detail:'Red Card',team:{id:1}},
                {minute:88,type:'Goal',detail:'Penalty',team:{id:2}}
              ];
              el.dataset.events=encodeURIComponent(JSON.stringify(events));document.body.appendChild(el);
              const now=Date.now(),rows=[];
              for(let m=1;m<=90;m+=5)rows.push({at:now+m*60000,minute:m,attacks:{home:m,away:m*.8},dangerousAttacks:{home:m*.4,away:m*.3},shotsOnTarget:{home:Math.floor(m/20),away:Math.floor(m/25)},shotsOffTarget:{home:Math.floor(m/12),away:Math.floor(m/15)},corners:{home:Math.floor(m/18),away:Math.floor(m/22)},possession:{home:54,away:46}});
              window.NOMAD_EVENT_FLOW_343.render(el,{rows});
              return {markers:el.querySelectorAll('.nomad-match-event').length,kinds:[...el.querySelectorAll('.nomad-event-icon')].map(x=>x.className),rail:!!el.querySelector('.nomad-event-rail')};
            });
            if(pageErrors.length)throw Error('PAGE_ERRORS '+JSON.stringify(pageErrors));
            if(!result.rail||result.markers!==6)throw Error('EVENT_RAIL_FAIL '+JSON.stringify(result));
            for(const k of ['goal','yellow','sub','var','red','penalty-goal'])if(!result.kinds.some(x=>x.includes(k)))throw Error('MISSING_'+k+' '+JSON.stringify(result));
            if(detailCalls!==0)throw Error('VIEWER_DETAIL_CALLS='+detailCalls);
            console.log('CANARY MATCH EVENTS OK',result,{detailCalls});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Deploy production viewer
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Verify production assets
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            js="$(curl -fsS "$PROD_URL/event-flow-343.js?x=$RANDOM$(date +%s)" || true)"
            css="$(curl -fsS "$PROD_URL/event-flow-343.css?x=$RANDOM$(date +%s)" || true)"
            html="$(curl -fsS "$PROD_URL/?x=$RANDOM$(date +%s)" || true)"
            if grep -Fq '343-flow-v4-standard-match-events' <<<"$js" && grep -Fq 'normalizeMatchEvents' <<<"$js" && grep -Fq '.nomad-event-rail{' <<<"$css" && grep -Fq 'event-flow-343.js?v=343-flow-v4-events' <<<"$html"; then
              echo 'PRODUCTION STANDARD MATCH EVENTS ASSETS OK'
              ok=1
              break
            fi
            sleep 2
          done
          [ "$ok" = 1 ]
