name: INSPECT Ball46 production signal rendering 20261002

on:
  push:
    branches: [ops/ball46-footer-links-20261001]
    paths:
      - '.github/workflows/inspect-ball46-production-signal-render-20261002.yml'

permissions:
  contents: read

env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect exact current Production worker without changing it
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=3" -H "$AUTH" -o /tmp/deploy.json
          BASE=$(node -e "const j=require('/tmp/deploy.json');const d=j.result?.deployments?.[0];if(!d||d.versions?.length!==1||Number(d.versions[0].percentage)!==100)process.exit(2);process.stdout.write(String(d.versions[0].version_id||''))")
          echo "PRODUCTION_VERSION=$BASE"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/workers/$SCRIPT_NAME/versions/$BASE?include=modules" -H "$AUTH" -o /tmp/version.json
          node - <<'NODE'
          const j=require('/tmp/version.json');
          if(j.success!==true) throw Error('VERSION_FETCH_FAILED');
          const r=j.result;
          console.log('MAIN_MODULE='+r.main_module);
          for(const m of r.modules||[]){
            const text=Buffer.from(m.content_base64,'base64').toString('utf8');
            if(!/signal|market|card|render|match/i.test(text)) continue;
            console.log('\n===== MODULE '+m.name+' size='+text.length+' =====');
            const needles=[
              'Belford','RoxoSanta','Roxo Santa','signalCount','activeSignals','signals[0]','signal[0]','markets[0]','market[0]',
              '.find(','renderCard','match-card','matchCard','signal-card','signalCard','market-chip','signal-chip','data-market','data-signal',
              'signals','markets','market','signal'
            ];
            const seen=[];
            for(const needle of needles){
              let from=0,count=0;
              while(count<5){
                const idx=text.indexOf(needle,from); if(idx<0) break;
                if(!seen.some(x=>Math.abs(x-idx)<300)) seen.push(idx);
                from=idx+needle.length; count++;
              }
            }
            seen.sort((a,b)=>a-b);
            for(const idx of seen.slice(0,60)){
              const s=Math.max(0,idx-500),e=Math.min(text.length,idx+900);
              console.log('\n--- CONTEXT '+idx+' ---\n'+text.slice(s,e).replace(/\n/g,' '));
            }
          }
          NODE
