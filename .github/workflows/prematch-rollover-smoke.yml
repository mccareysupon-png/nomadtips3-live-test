name: Prematch Rollover Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prematch-rollover-smoke.yml'
      - '.github/workflows/prematch-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare actual settlement guard
        run: |
          git fetch origin agent/car11-goaloo-launch-20260816
          mkdir -p .rollover-test
          git show origin/agent/car11-goaloo-launch-20260816:car1-1/scripts/market_helpers.mjs > .rollover-test/market_helpers.mjs
          git show origin/agent/car11-goaloo-launch-20260816:car1-1/scripts/settle_guard.mjs > .rollover-test/settle_guard.mjs
          git show origin/agent/car11-goaloo-launch-20260816:car1-1/data/public-selections.json > .rollover-test/latest.json
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null

      - name: Validate all-qualified source contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('.rollover-test/latest.json','utf8'));
          if(d.rules?.selectionPolicy!=='ALL_QUALIFIED') throw new Error('selectionPolicy is not ALL_QUALIFIED');
          if(d.rules?.maximumSelections!==null) throw new Error('maximumSelections must be null');
          if(Number(d.scan?.qualified)!==Number(d.scan?.published)) throw new Error(`qualified ${d.scan?.qualified} != published ${d.scan?.published}`);
          console.log(`PASS all-qualified qualified=${d.scan.qualified} published=${d.scan.published}`);
          NODE

      - name: Simulate final match already settled
        run: |
          cat > .rollover-test/current.json <<'JSON'
          {
            "selectionDate":"2099-01-01",
            "generatedAtUtc":"2099-01-01T00:00:00.000Z",
            "matches":[
              {"fixtureId":"A","home":"Alpha","away":"Beta","pick":"Alpha Win","pickSide":"home","odds":1.8,"confidence":70,"status":"WIN"},
              {"fixtureId":"B","home":"Gamma","away":"Delta","pick":"Delta Win","pickSide":"away","odds":2.1,"confidence":65,"status":"LOSS"}
            ]
          }
          JSON
          CURRENT_PATH=.rollover-test/current.json HISTORY_PATH=.rollover-test/history.json ACTION_PATH=.rollover-test/action.txt node .rollover-test/settle_guard.mjs
          test "$(tr -d '\r\n' < .rollover-test/action.txt)" = "SELECT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const h=JSON.parse(fs.readFileSync('.rollover-test/history.json','utf8'));
          if(h.length!==1) throw new Error(`expected one archived batch, got ${h.length}`);
          if(h[0].selectionDate!=='2099-01-01') throw new Error('wrong archived batch');
          console.log('PASS all settled -> archive -> SELECT');
          NODE

      - name: Verify no duplicate history on repeated check
        run: |
          CURRENT_PATH=.rollover-test/current.json HISTORY_PATH=.rollover-test/history.json ACTION_PATH=.rollover-test/action.txt node .rollover-test/settle_guard.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const h=JSON.parse(fs.readFileSync('.rollover-test/history.json','utf8'));
          if(h.length!==1) throw new Error(`duplicate history detected: ${h.length}`);
          console.log('PASS duplicate guard');
          NODE

      - name: Verify production cadence and immediate next-selection path
        run: |
          grep -F "cron: '*/5 * * * *'" .github/workflows/prematch-production.yml
          grep -F 'if [ "$ACTION" = "SELECT" ]; then' .github/workflows/prematch-production.yml
          grep -F 'MAX_ANALYSIS=0 node .prematch-runtime/select.mjs' .github/workflows/prematch-production.yml
          echo 'PASS production checks every 5 minutes and selects in the same run after full settlement.'