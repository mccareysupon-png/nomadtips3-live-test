name: BALL46 approved jersey spacing
on:
  push:
    branches: [codex/ball46-kit-spacing-20261030]
    paths: ['deploy-assets/kit-spacing-20261030/request.json']
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: deploy-assets/kit-spacing-20261030
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser verification
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Guarded candidate and browser check
        run: |
          node --check patch.mjs
          node --check run.mjs
          node run.mjs
          node browser-check.mjs
      - name: Activate approved spacing and verify production
        run: |
          node -e "const fs=require('fs'),c=JSON.parse(fs.readFileSync('audit/candidate.json'));fs.writeFileSync('request.json',JSON.stringify({phase:'activate',base:c.base,candidate:c.candidate}))"
          node run.mjs
          node browser-check.mjs https://ball46.com
      - name: Restore if production browser verification fails
        if: failure()
        run: |
          node -e "const fs=require('fs');if(fs.existsSync('audit/result.json')){const r=JSON.parse(fs.readFileSync('audit/result.json'));if(r.activated){fs.writeFileSync('request.json',JSON.stringify({phase:'restore',base:r.base,candidate:r.candidate}));fs.writeFileSync('restore-needed','yes')}}"
          if [ -f restore-needed ]; then node run.mjs; fi
      - name: Commit sanitized audit
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/*.json
          if [ -f browser-proof.json ]; then git add browser-proof.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git restore -- request.json
          git commit -m "Record jersey spacing deployment evidence [skip ci]"
          git fetch origin codex/ball46-kit-spacing-20261030
          git rebase FETCH_HEAD
          git push origin HEAD:codex/ball46-kit-spacing-20261030
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kit-spacing-${{ github.run_id }}
          path: deploy-assets/kit-spacing-20261030/audit
