name: Repair Ball46 Performance Card Only 20261014
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ball46-performance-concept-b-20261014.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-performance-concept-b-20261014
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts acorn@8 puppeteer-core@24
      - name: Verify complete current assets and repair Performance card only
        working-directory: deploy-assets/performance-concept-b-20261014
        run: |
          node --check performance-repair.mjs
          node performance-repair.mjs
      - name: Record repair evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          folder="deploy-assets/performance-concept-b-20261014"
          mkdir -p "$folder/audit-last"
          if [ -f "$folder/audit/performance-repair.json" ]; then
            cp "$folder/audit/performance-repair.json" "$folder/audit-last/performance-repair-${GITHUB_RUN_ID}.json"
          fi
          for file in "$folder"/audit/*.png; do
            if [ -f "$file" ]; then cp "$file" "$folder/audit-last/${GITHUB_RUN_ID}-$(basename "$file")"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$folder/audit-last"
          git commit -m "Record Performance card repair ${GITHUB_RUN_ID} [skip ci]" || exit 0
          git push origin HEAD:work/ball46-performance-concept-b-20261014
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-performance-card-repair-${{ github.run_id }}
          path: deploy-assets/performance-concept-b-20261014/audit
          if-no-files-found: warn
          retention-days: 30
