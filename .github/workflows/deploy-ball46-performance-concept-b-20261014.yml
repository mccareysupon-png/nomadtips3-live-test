name: Ball46 Read Only Repair Scout 20261014

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ball46-performance-concept-b-20261014.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-performance-concept-b-20261014
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts acorn@8
      - name: Read current Production only
        working-directory: deploy-assets/performance-concept-b-20261014
        run: node repair-scout.mjs
      - name: Record read-only audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          src="deploy-assets/performance-concept-b-20261014/audit/repair-scout.json"
          if [ ! -f "$src" ]; then exit 0; fi
          mkdir -p deploy-assets/performance-concept-b-20261014/audit-last
          cp "$src" "deploy-assets/performance-concept-b-20261014/audit-last/repair-scout-${GITHUB_RUN_ID}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-assets/performance-concept-b-20261014/audit-last
          git commit -m "Record read-only Ball46 repair scout ${GITHUB_RUN_ID} [skip ci]" || exit 0
          git push origin HEAD:work/ball46-performance-concept-b-20261014
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-repair-scout-${{ github.run_id }}
          path: deploy-assets/performance-concept-b-20261014/audit
          if-no-files-found: warn
