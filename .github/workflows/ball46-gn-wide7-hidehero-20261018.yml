name: BALL46 Green Noir Mobile Wide 7px Hide Hero Safe Deploy
on:
  push:
    branches:
      - work/ball46-gn-wide7-hidehero-20261018
    paths:
      - '.github/workflows/ball46-gn-wide7-hidehero-20261018.yml'
      - 'deploy-assets/ball46-mobile-deep-teal-20261018/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false

jobs:
  safe-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact source and isolated deployment script
        shell: bash
        run: |
          set -euo pipefail
          node --check deploy-assets/ball46-mobile-deep-teal-20261018/deploy.mjs
          python3 -m py_compile deploy-assets/ball46-mobile-deep-teal-20261018/apply_width.py
          echo 'Mobile-only CSS injected after exact-current Active readback; native Event Flow and kits retained'
          node --check deploy-assets/member-orange-only-20261015/assets.mjs
          node --check deploy-assets/member-orange-only-20261015/cutover.mjs
          echo 'Only ball46-production active version may be replaced, after candidate testing.'
      - name: Install browser dependencies for real Production-version preview
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Audit Active assets, verify wider mobile cards and hidden Hero before safe deploy
        run: node deploy-assets/ball46-mobile-deep-teal-20261018/deploy.mjs
      - name: Preserve sanitized verification, screenshots, and rollback report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-green-noir-wide7-hidehero-${{ github.run_id }}
          path: deploy-assets/ball46-mobile-deep-teal-20261018/audit/
          retention-days: 14
