name: BALL46 Adaptive OU42 full research regression offline
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-adaptive-ou-v1-offline-20261124.yml]
permissions: {contents: read}
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prove all 42 formulas, actual bookmaker prices, isolated 1 unit ledger, snapshots and complete FT outcomes
        run: |
          node --experimental-sqlite --test qa/prematch-history-20261120/b46-adaptive-ou-research-v1.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-value-screener-v2.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-target-history-ft-v1.test.mjs

# Validation includes fresh cached HUB full-time settlement without HCR wait; no paid API.
