name: BALL46 Snapshot V1 Preview Resources GET ONLY
on:
  push:
    branches:
      - work/ball46-performance-snapshot-v1-20261029
    paths:
      - .github/workflows/ball46-snapshot-v1-preview-resource-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: node --check isolated-labs/ball46-performance-snapshot-v1/resource-preflight.mjs
      - name: Confirm separate Worker and D1 name availability (GET ONLY)
        run: node isolated-labs/ball46-performance-snapshot-v1/resource-preflight.mjs
      - name: Save report (no account secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-snapshot-v1-preview-resource-preflight
          path: reports/ball46-snapshot-v1-resource-preflight.json
          retention-days: 7
          if-no-files-found: warn
