name: BALL46 readonly vote response diagnosis
on:
  push:
    branches: [codex/ball46-mobile-event-flow-bars-20261102]
    paths: ['work/ball46-mobile-event-flow-bars-20261102/vote-diagnose-request.json']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: work/ball46-mobile-event-flow-bars-20261102
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node vote-diagnose.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-audit/vote-readonly-diagnosis.json
          git commit -m "Record read-only vote endpoint diagnosis [skip ci]"
          git push origin HEAD:codex/ball46-mobile-event-flow-bars-20261102
