name: Repair Ball46 John Bulk Qualified Bookmaker Prices
on:
  push:
    branches: [fix/ball46-john-bulk-qualified-prices-20261011]
    paths:
      - '.github/workflows/repair-ball46-john-bulk-qualified-prices-20261011.yml'
permissions:
  contents: read
concurrency:
  group: ball46-engine343-john-bulk-qualified-prices-20261011
  cancel-in-progress: false
jobs:
  guarded-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check deploy-assets/ball46-john-bulk-qualified-prices-20261011/deploy.mjs
      - name: Strict source preflight NO production writes
        env:
          JOHN_DRY_RUN: '1'
        run: node deploy-assets/ball46-john-bulk-qualified-prices-20261011/deploy.mjs
      - name: Deploy exact active John qualified cache-only price scan and rollback on failed QA
        env:
          JOHN_DRY_RUN: '0'
        run: node deploy-assets/ball46-john-bulk-qualified-prices-20261011/deploy.mjs
      - name: Save rollback candidate checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: john-bulk-qualified-preflight-${{ github.run_id }}
          path: audit/
          if-no-files-found: warn
          retention-days: 30
