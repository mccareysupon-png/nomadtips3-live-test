name: Patch Nowgoal 188BET Pinnacle Test Branch

on:
  push:
    branches: [nowgoal-188bet-pinnacle-341-20260823]
    paths:
      - ".github/workflows/patch-nowgoal-188-pinnacle.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: nowgoal-188bet-pinnacle-341-20260823
      - name: Add verified Nowgoal 188BET and Pinnacle AH sockets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          nowgoal = Path('nomad-live-engine/src/nowgoal.js')
          text = nowgoal.read_text()
          old = "  Object.freeze({companyId:'49',bookmaker:'BWin',sourceId:'source23',position:23}),\n]);"
          new = "  Object.freeze({companyId:'49',bookmaker:'BWin',sourceId:'source23',position:23}),\n  Object.freeze({companyId:'23',bookmaker:'188BET',sourceId:'source24',position:24}),\n  Object.freeze({companyId:'47',bookmaker:'Pinnacle',sourceId:'source25',position:25}),\n]);"
          if old not in text:
              raise SystemExit('nowgoal registry anchor not found')
          nowgoal.write_text(text.replace(old, new, 1))

          test = Path('nomad-live-engine/test/nowgoal-all-bookmakers.test.js')
          text = test.read_text()
          replacements = {
              "gate 1: Nowgoal exposes all 18 approved bookmaker identities": "gate 1: Nowgoal exposes all 20 verified bookmaker identities",
              "assert.equal(NOWGOAL_BOOKMAKERS.length,18);": "assert.equal(NOWGOAL_BOOKMAKERS.length,20);",
              "assert.equal(new Set(NOWGOAL_BOOKMAKERS.map(item=>item.companyId)).size,18);": "assert.equal(new Set(NOWGOAL_BOOKMAKERS.map(item=>item.companyId)).size,20);",
              "assert.equal(new Set(NOWGOAL_BOOKMAKERS.map(item=>item.sourceId)).size,18);": "assert.equal(new Set(NOWGOAL_BOOKMAKERS.map(item=>item.sourceId)).size,20);",
              "for(let position=9;position<=23;position++)": "for(let position=9;position<=25;position++)",
              "assert.equal(result.bookmakers.total,18);": "assert.equal(result.bookmakers.total,20);",
              "assert.equal(result.bookmakers.extraChecked,15);": "assert.equal(result.bookmakers.extraChecked,17);",
              "assert.equal(snapshots.filter(item=>item.source==='Nowgoal').length,18);": "assert.equal(snapshots.filter(item=>item.source==='Nowgoal').length,20);",
          }
          for old_value,new_value in replacements.items():
              if old_value not in text:
                  raise SystemExit(f'test anchor not found: {old_value}')
              text = text.replace(old_value,new_value,1)

          old_vars = "  const sbobet=`<c><match><m>3003850,17348417,0.25,0.91,0.99,155043777,1.63,4.41,5.28</m></match></c>`;\n  const calls=[];"
          new_vars = "  const sbobet=`<c><match><m>3003850,17348417,0.25,0.91,0.99,155043777,1.63,4.41,5.28</m></match></c>`;\n  const bet188=`<c><match><m>3003850,17348417,0.25,0.90,1.00,155043777,1.63,4.41,5.28</m></match></c>`;\n  const pinnacle=`<c><match><m>3003850,17348417,0.25,0.89,1.01,155043777,1.63,4.41,5.28</m></match></c>`;\n  const calls=[];"
          if old_vars not in text:
              raise SystemExit('feed variable anchor not found')
          text = text.replace(old_vars,new_vars,1)

          old_fetch = "    if(path==='/gf/data/odds/en/ch_goal31.xml') return new Response(sbobet);\n    return new Response('missing',{status:404});"
          new_fetch = "    if(path==='/gf/data/odds/en/ch_goal31.xml') return new Response(sbobet);\n    if(path==='/gf/data/odds/en/ch_goal23.xml') return new Response(bet188);\n    if(path==='/gf/data/odds/en/ch_goal47.xml') return new Response(pinnacle);\n    return new Response('missing',{status:404});"
          if old_fetch not in text:
              raise SystemExit('fetch anchor not found')
          text = text.replace(old_fetch,new_fetch,1)

          old_assert = "  assert.equal(sbobetPeer.homeOdds,1.91);\n  assert.ok(calls.some(call=>call.path==='/gf/data/odds/en/ch_goal31.xml'));"
          new_assert = "  assert.equal(sbobetPeer.homeOdds,1.91);\n  const bet188Peer=result.results[0].market.nowgoalPeers.source24;\n  assert.equal(bet188Peer.status,'AH READY');\n  assert.equal(bet188Peer.bookmaker,'188BET');\n  assert.equal(bet188Peer.line,-.25);\n  assert.equal(bet188Peer.homeOdds,1.90);\n  const pinnaclePeer=result.results[0].market.nowgoalPeers.source25;\n  assert.equal(pinnaclePeer.status,'AH READY');\n  assert.equal(pinnaclePeer.bookmaker,'Pinnacle');\n  assert.equal(pinnaclePeer.line,-.25);\n  assert.equal(pinnaclePeer.homeOdds,1.89);\n  assert.ok(calls.some(call=>call.path==='/gf/data/odds/en/ch_goal31.xml'));\n  assert.ok(calls.some(call=>call.path==='/gf/data/odds/en/ch_goal23.xml'));\n  assert.ok(calls.some(call=>call.path==='/gf/data/odds/en/ch_goal47.xml'));\n  assert.equal(calls.some(call=>call.path==='/gf/data/odds/en/goal23.xml'),false);\n  assert.equal(calls.some(call=>call.path==='/gf/data/odds/en/goal47.xml'),false);"
          if old_assert not in text:
              raise SystemExit('assert anchor not found')
          text = text.replace(old_assert,new_assert,1)

          old_peers = "  source5.nowgoalPeers={source6:ready('Nowgoal','Bet365',-.5,1.84),source19:ready('Nowgoal','Sbobet',-.5,1.83)};"
          new_peers = "  source5.nowgoalPeers={source6:ready('Nowgoal','Bet365',-.5,1.84),source19:ready('Nowgoal','Sbobet',-.5,1.83),source24:ready('Nowgoal','188BET',-.5,1.85),source25:ready('Nowgoal','Pinnacle',-.5,1.81)};"
          if old_peers not in text:
              raise SystemExit('snapshot peer anchor not found')
          text = text.replace(old_peers,new_peers,1)

          old_snapshot_assert = "  assert.equal(snapshots.find(item=>item.id==='source19').bookmaker,'Sbobet');"
          new_snapshot_assert = "  assert.equal(snapshots.find(item=>item.id==='source19').bookmaker,'Sbobet');\n  assert.equal(snapshots.find(item=>item.id==='source24').bookmaker,'188BET');\n  assert.equal(snapshots.find(item=>item.id==='source25').bookmaker,'Pinnacle');"
          if old_snapshot_assert not in text:
              raise SystemExit('snapshot assertion anchor not found')
          test.write_text(text.replace(old_snapshot_assert,new_snapshot_assert,1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nomad-live-engine/src/nowgoal.js nomad-live-engine/test/nowgoal-all-bookmakers.test.js
          git commit -m "Add Nowgoal 188BET and Pinnacle Live AH judges"
          git push origin HEAD:nowgoal-188bet-pinnacle-341-20260823
