name: BALL46 Motagua Ledger current source READ ONLY
on:
  push:
    branches: [codex/ball46-ledger-reconcile-motagua-20261102]
    paths: ['work/ball46-ledger-reconcile-motagua-20261102/inspect-request.json']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: work/ball46-ledger-reconcile-motagua-20261102
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false acorn@8.15.0
      - run: node inspect.mjs
      - name: Preserve sanitized source evidence, never raw private stage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit
          git commit -m "Inspect live Engine Ledger persistence and reconciliation paths without writes [skip ci]"
          git push origin HEAD:codex/ball46-ledger-reconcile-motagua-20261102
