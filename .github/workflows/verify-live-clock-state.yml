name: Verify LIVE TIME per-match state

on:
  push:
    branches:
      - 'fix/car31-live-clock-per-match-stable'
    paths:
      - 'car3-1-hybrid-live-engine/web/signal-polish.js'
      - 'car3-1-hybrid-live-engine/test/live-clock-state-smoke.mjs'
      - '.github/workflows/verify-live-clock-state.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: node --check car3-1-hybrid-live-engine/web/signal-polish.js
      - name: Per-match clock regression
        run: node car3-1-hybrid-live-engine/test/live-clock-state-smoke.mjs
