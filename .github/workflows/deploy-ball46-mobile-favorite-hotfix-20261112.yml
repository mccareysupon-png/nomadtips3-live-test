name: Deploy BALL46 Mobile Favorite Hotfix 20261112
on:
  push:
    branches: [test/ball46-pin-v2-mobile-fix-20261112]
    paths: ['pinned-fixtures-v2-production/MOBILE_HOTFIX_DEPLOY_READY']
permissions: {contents: read}
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: test/ball46-pin-v2-mobile-fix-20261112}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Guarded one-module deploy
        run: node pinned-fixtures-v2-production/mobile-hotfix-deploy.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install chromium
      - name: Production mobile browser QA
        run: node pinned-fixtures-v2-production/mobile-hotfix-qa.mjs
      - name: Rollback if browser QA failed
        if: failure()
        run: node pinned-fixtures-v2-production/mobile-hotfix-rollback.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-hotfix-production-${{ github.run_id }}
          path: |
            pinned-fixtures-v2-production/mobile-hotfix-state.json
            pinned-fixtures-v2-production/mobile-hotfix-production.png
          retention-days: 7
