name: DIAG - Ball46 Engine Live Incident 20260927

on:
  push:
    branches: [diag/ball46-engine-live-incident-20260927]
    paths:
      - '.github/workflows/diag-ball46-engine-live-incident-20260927.yml'

permissions:
  contents: read

env:
  ENGINE_URL: https://nomadtips3-engine-343.mccarey-supon.workers.dev
  BALL46_URL: https://ball46-production.mccarey-supon.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect live engine deployment and endpoints
        shell: bash
        run: |
          set -euo pipefail
          for ep in health board signals statistics; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_URL/api/engine/$ep?incident=${GITHUB_RUN_ID}-$(date +%s%N)" -o "/tmp/$ep.json"
          done
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$ENGINE_URL/health?incident=${GITHUB_RUN_ID}" -o /tmp/engine-health.json || true
          node - <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const h=read('/tmp/health.json');
          const b=read('/tmp/board.json');
          const s=read('/tmp/signals.json');
          const t=read('/tmp/statistics.json');
          const now=Date.now();
          const fixtures=Array.isArray(b.fixtures)?b.fixtures:[];
          const signals=Array.isArray(s.signals)?s.signals:[];
          const rows=Array.isArray(t.rows)?t.rows:[];
          const latestSignal=signals.slice().sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0))[0]||null;
          const latestSettled=rows.slice().sort((a,b)=>Number(b.settledAt||0)-Number(a.settledAt||0))[0]||null;
          const statusCount={};
          for(const f of fixtures){const k=String(f.status||f.matchStatus||'UNKNOWN');statusCount[k]=(statusCount[k]||0)+1;}
          console.log('LIVE_ENGINE_SUMMARY='+JSON.stringify({
            healthOk:h?.ok,
            healthVersion:h?.version||null,
            boardOk:b?.ok,
            fixtureCount:fixtures.length,
            fixtureStatuses:statusCount,
            signalCount:signals.length,
            latestSignal:latestSignal?{id:latestSignal.id,fixtureId:latestSignal.fixtureId,market:latestSignal.market,createdAt:latestSignal.createdAt,ageMin:Math.round((now-Number(latestSignal.createdAt||0))/60000)}:null,
            statisticsOk:t?.ok,
            settledCount:rows.length,
            latestSettled:latestSettled?{id:latestSettled.id,fixtureId:latestSettled.fixtureId,result:latestSettled.result,settledAt:latestSettled.settledAt,ageMin:Math.round((now-Number(latestSettled.settledAt||0))/60000)}:null,
            unresolved:t?.unresolved,
            total:t?.total,
            win:t?.win,
            loss:t?.loss,
            push:t?.push
          }));
          if(h?.ok!==true||b?.ok!==true||s?.signals==null||t?.ok!==true) process.exitCode=2;
          NODE

          python3 - <<'PY'
          import json, os, urllib.request
          a=os.environ['CLOUDFLARE_ACCOUNT_ID']; t=os.environ['CLOUDFLARE_API_TOKEN']
          h={'Authorization':f'Bearer {t}','Accept':'application/json'}
          for name in ['nomadtips3-engine-343','ball46-production','nomadtips3-5usd-hub-343']:
              u=f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/scripts/{name}/deployments'
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=30) as r: p=json.load(r)
                  ds=(p.get('result') or {}).get('deployments') or []
                  cur=(ds[0].get('versions') or [{}])[0].get('version_id') if ds else None
                  print(f'ACTIVE_{name}={cur}')
              except Exception as e:
                  print(f'ACTIVE_{name}=ERROR:{e}')
          PY
