name: Patch 3.43 Hub All Live Data

on:
  push:
    branches:
      - work/nomad343-clean-bet365-ui
    paths:
      - .github/workflows/patch-343-hub-all-live-data.yml

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  patch-hub-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nomad343-clean-bet365-ui
          fetch-depth: 0

      - name: Guard against concurrent edits
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin work/nomad343-clean-bet365-ui
          test "$(git rev-parse origin/work/nomad343-clean-bet365-ui)" = "$GITHUB_SHA" || { echo '::error::Branch changed after this patch started; aborting to avoid overwriting another chat.'; exit 9; }

      - name: Wire all live enrichments into 3.43 HUB only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('workers/nomadtips3-5usd-hub-343/src/index.js')
          s = p.read_text()
          old_url = 'include=events,stats&per_page=${PAGE_SIZE}&page=${page}'
          new_url = 'include=odds,events,stats&per_page=${PAGE_SIZE}&page=${page}'
          assert s.count(old_url) == 1, f'expected one live include anchor, got {s.count(old_url)}'
          s = s.replace(old_url, new_url, 1)
          old_meta = "include: 'events,stats'"
          assert s.count(old_meta) == 2, f'expected two include metadata anchors, got {s.count(old_meta)}'
          s = s.replace(old_meta, "include: 'odds,events,stats'")
          p.write_text(s)
          PY
          node --check workers/nomadtips3-5usd-hub-343/src/index.js
          grep -Fq 'include=odds,events,stats&per_page=${PAGE_SIZE}&page=${page}' workers/nomadtips3-5usd-hub-343/src/index.js
          test "$(grep -Fc "include: 'odds,events,stats'" workers/nomadtips3-5usd-hub-343/src/index.js)" = "2"
          git diff --exit-code -- workers/nomadtips3-engine-343 || true
          test -z "$(git status --short | grep -vE '^ M workers/nomadtips3-5usd-hub-343/src/index.js$' | grep -vE '^ M \.github/workflows/patch-343-hub-all-live-data.yml$' || true)" || { git status --short; echo '::error::Unexpected file changed'; exit 10; }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy HUB only
        working-directory: workers/nomadtips3-5usd-hub-343
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.toml

      - name: Verify deployed HUB advertises full live include
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl -fsS --max-time 20 'https://nomadtips3-5usd-hub-343.mccarey-supon.workers.dev/health' -o /tmp/h.json
          node - <<'NODE'
          const h=require('/tmp/h.json');
          console.log(JSON.stringify(h,null,2));
          if(h.ok!==true)process.exit(1);
          if(h.include!=='odds,events,stats')process.exit(2);
          NODE

      - name: Commit HUB patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nomad343-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/patch-343-hub-all-live-data.yml
          git add workers/nomadtips3-5usd-hub-343/src/index.js
          git diff --cached --name-only
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/patch-343-hub-all-live-data.yml workers/nomadtips3-5usd-hub-343/src/index.js "
          git commit -m 'fix(343): wire odds into central live hub'
          git push origin HEAD:work/nomad343-clean-bet365-ui
