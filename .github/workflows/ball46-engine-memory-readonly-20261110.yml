name: BALL46 Engine memory source READ ONLY
on:
  push:
    branches: [codex/ball46-favorites-test-20261110]
    paths: ['work/engine-memory-diagnosis-20261110/request.json']
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read actual Engine binding source and DO mapping without runtime requests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node work/engine-memory-diagnosis-20261110/read-source.mjs
      - name: Store code and redacted binding evidence
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/engine-memory-diagnosis-20261110/source work/engine-memory-diagnosis-20261110/report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record active Engine source for read-only memory investigation [skip ci]"
          git push origin HEAD:codex/ball46-favorites-test-20261110
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-engine-memory-source-proof
          path: work/engine-memory-diagnosis-20261110/report.json
