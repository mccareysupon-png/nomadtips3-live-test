name: BALL46 flow and scorebar QA
on:
  push:
    branches: [test/ball46-ui-interaction-baseline-20261125]
    paths: ['.github/workflows/qa-ball46-flow-scroll.yml']
permissions:
  contents: read
jobs:
  scroll:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install chromium --only-shell
      - shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const url='https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev/';
          (async()=>{
           const browser=await chromium.launch();
           try {for(const variant of ['before','stable geometry']){
           const page=await browser.newPage({viewport:{width:1440,height:900},serviceWorkers:'block'});const err=[];page.on('pageerror',e=>err.push(e.message));
           await page.goto(url,{waitUntil:'domcontentloaded',timeout:25000});
           if(variant!=='before')await page.addStyleTag({content:'.expand-full-market-card .fmb-market{content-visibility:visible!important;contain-intrinsic-size:none!important}'});
           const rows=page.locator('.match-row[data-match-id]:visible');await rows.first().waitFor({timeout:15000});
           const market=page.locator('.expand-full-market-card .fmb-market:visible');
           let fit=null;
           for(let i=0;i<Math.min(6,await rows.count())&&!fit;i++){
            await rows.nth(i).click();
            const books=page.locator('.expand-full-market-card [data-fmb-book]:visible');
            if(!await books.first().waitFor({timeout:5000}).then(()=>true,()=>false))continue;
            for(let j=0;j<Math.min(6,await books.count());j++){
              const b=books.nth(j);if(!await b.isEnabled())continue;
              await b.click();
              if(await market.first().waitFor({timeout:850}).then(()=>true,()=>false)){fit={id:await row.getAttribute('data-match-id'),book:await b.textContent(),markets:await market.count()};break}
            }
           }
           if(!fit)throw Error('Could not find a populated market');
           if(variant==='before'){benchmark=fit;assert.ok(fit.markets>=8,'need a dense market');}else{assert.deepEqual(fit,benchmark);}
             const tabs=page.locator('.expand-full-market-card .fmb-tabs:visible');
           await tabs.scrollIntoViewIfNeeded();
           const box=await tabs.boundingBox();await page.mouse.move(box.x+box.width/2, Math.min(860,box.y+box.height+160));
           const cdp=await page.context().newCDPSession(page);await cdp.send('Profiler.enable');await cdp.send('Profiler.setSamplingInterval',{interval:2500});await cdp.send('Profiler.start');
           await page.evaluate(()=>{
            const d=window.qa={geometry:[],flow:{},long:[]};let s=performance.now(),t0=s;
            const f=document.querySelector('.expand-flow-card');new MutationObserver(rs=>{for(const r of rs){const k=String(r.target.className?.baseVal??r.target.className??r.target.nodeName);d.flow[k]=(d.flow[k]||0)+1}}).observe(f,{subtree:true,childList:true});
            new PerformanceObserver(ls=>{for(const e of ls.getEntries())d.long.push(Math.round(e.duration))}).observe({type:'longtask'});
            function frame(t){const el=document.querySelector('.expand-full-market-card');d.geometry.push([Math.round(t-t0),Math.round(el?.getBoundingClientRect().height||0)]);t0=t;if(t-s<17000)requestAnimationFrame(frame)}requestAnimationFrame(frame);
           });
           for(const sign of [1,-1,1,-1])for(let n=0;n<8;n++){await page.mouse.wheel(0,115*sign);await page.waitForTimeout(100)}
           await page.waitForTimeout(1500);
           const {profile}=await cdp.send('Profiler.stop');const names={};for(const n of profile.nodes){if(!n.hitCount)continue;const f=n.callFrame;const name=(f.functionName||'(anonymous)')+' '+(f.url?f.url.split('/').pop().split('?')[0]+':'+f.lineNumber:'');names[name]=(names[name]||0)+n.hitCount;}
           const diag=await page.evaluate(()=>{const d=window.qa;return {heights:[...new Set(d.geometry.map(x=>x[1]))],maxFrame:Math.max(...d.geometry.map(x=>x[0])),long:d.long,flow:d.flow}});
           console.log('AB',JSON.stringify({variant,fit,diag,top:Object.entries(names).sort((a,b)=>b[1]-a[1]).slice(0,24),err}));
           await page.close();
           }}finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
