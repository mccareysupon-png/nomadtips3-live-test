name: BALL46 BTTS UI V2 Render Insertion Anchors READ ONLY
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-btts-ui-v2-render-body-audit-20261122.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Retrieve target card region snippets from existing deployed client
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          assert(token&&account);
          const root='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers';
          const n='ball46-premium-match-colors-test-20261120';
          async function cf(p){const r=await fetch(root+p,{headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
           const j=await r.json();assert(r.ok&&j.success);return j.result}
          const d=await cf('/scripts/'+n+'/deployments?per_page=1');
          const v=d.deployments[0].versions[0].version_id;
          const m=await cf('/workers/'+n+'/versions/'+v+'?include=modules');
          const source=Buffer.from(m.modules[0].content_base64,'base64').toString('utf8');
          const found=source.match(/var prematchClientScript = ("(?:\\.|[^"\\])*");/);assert(found);
          const s=JSON.parse(found[1]);
          const needles=[
           'function draw(){','function draw(', 'const activeLedger=mode',
           'const visible=[...rows].sort', "if(mode==='btts')",
           "const list=el('div','b46pm-list')", "content.append(list)",
           "No predictions recorded", "if(!rows.length)",
           "const content=el(", "function render", "function show(", "b46pm-empty",
           "b46pm-stats-navigation","function statsCard"
          ];
          const out={};
          for(const needle of needles){
           let at=-1,n=0,parts=[];
           while((at=s.indexOf(needle,at+1))!==-1&&n++<5){
            parts.push({pos:at,text:s.slice(Math.max(0,at-450),at+1800)});
           }
           out[needle]=parts;
          }
          console.log('B46_BTTS_V2_RENDER_ANCHORS '+JSON.stringify(out));
          JS
