name: NOMADTIPS3 Member Ball Teng Selector — Test

on:
  workflow_dispatch:
    inputs:
      member:
        description: 'Test member id'
        required: false
        default: '0001'
      force:
        description: 'Force a fresh member selection even when current config/window is already stored'
        required: false
        default: 'false'
  # Member Test is parked. Keep manual dispatch available for a future
  # owner-approved test, but do not run it on a timer or repository push.

permissions:
  contents: read

concurrency:
  group: nomadtips3-member-ball-teng-selector-test
  cancel-in-progress: false

jobs:
  member-select:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      MEMBER_ID: ${{ github.event.inputs.member || '0001' }}
      MEMBER_SELECTOR_FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
      MEMBER_WORKER_BASE: 'https://nomadtips3-test-api.mccarey-supon.workers.dev'
      PYTHONPATH: '${{ github.workspace }}/.github/member-api-guard'
      MEMBER_API_DEFAULT_LIMIT_PER_MINUTE: '10'
      MEMBER_API_RATE_SAFETY: '1.10'
      MEMBER_API_429_PAUSE_SECONDS: '65'
    steps:
      - uses: actions/checkout@v4

      - name: Validate isolated member selector runner and rate guard
        run: |
          python3 -m py_compile .github/scripts/run_member_ball_teng_selector.py
          python3 -m py_compile .github/member-api-guard/sitecustomize.py

      - name: Run copied Ball Teng engine in Member room
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_FOOTBALL_KEY:-}"
          python3 .github/scripts/run_member_ball_teng_selector.py
