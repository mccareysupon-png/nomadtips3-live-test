name: Verify BALL46 Lazy Full Market Mobile 20261110
on:
  push:
    branches: [test/ball46-fullmarket-lazy-prod-20261110]
    paths: ['fullmarket-lazy-prod-20261110/MOBILE_VERIFY_READY']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: test/ball46-fullmarket-lazy-prod-20261110}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node fullmarket-lazy-prod-20261110/mobile-verify.mjs
