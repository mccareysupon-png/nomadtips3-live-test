name: Ball46 rollback realtime pending 20261005

on:
  push:
    branches:
      - ops/ball46-stat-realtime-pending-20261005b
    paths:
      - '.github/workflows/ball46-rollback-20261005.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollback-production-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Roll back Ball46 engine to last known good version
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 versions deploy c4174e9b-50ab-4e15-a7f5-6ef637fb6599@100% --name nomadtips3-engine-343 -y --message "Rollback realtime pending regression 20261005"
          sleep 3
          curl -fsS -L --max-time 40 'https://nomadtips3-engine-343.mccarey-supon.workers.dev/health?rollback=20261005' -o /tmp/health.json
          curl -fsS -L --max-time 40 'https://www.ball46.com/api/engine/statistics?limit=10&rollback=20261005' -o /tmp/statistics.json
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/statistics.json','utf8'));
          if(h?.ok!==true) throw new Error('ROLLBACK_HEALTH_NOT_OK');
          if(s?.ok!==true || !Array.isArray(s?.rows)) throw new Error('ROLLBACK_STATISTICS_NOT_OK');
          console.log('ROLLBACK_VERIFY_PASS',{health:h.ok,rows:s.rows.length,ledgerTotal:s.ledgerTotal,total:s.total,pending:s.pending});
          NODE
