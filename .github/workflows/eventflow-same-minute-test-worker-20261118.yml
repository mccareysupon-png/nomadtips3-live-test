name: Deploy isolated Event Flow test Worker (no production deploy)
on:
  push:
    branches: [test/ball46-eventflow-same-minute-20261118]
    paths: ['.github/workflows/eventflow-same-minute-test-worker-20261118.yml']
permissions:
  contents: read
jobs:
  worker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Build candidate with exact production asset hash
        run: |
          mkdir -p qa-output
          curl --fail --silent --show-error --max-time 35 "https://ball46.com/expanded-match-343.js?b46_worker_qa=${GITHUB_RUN_ID}" -o qa-output/expanded-match-343.original.js
          node qa/eventflow-same-minute-20261118/patch.mjs qa-output/expanded-match-343.original.js qa-output/expanded-match-343.candidate.js
          node --check qa-output/expanded-match-343.candidate.js
          curl --fail --silent --show-error --max-time 35 "https://ball46.com/?b46_worker_qa=${GITHUB_RUN_ID}" -o /tmp/b46page.html
      - name: Install test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/b46qa" --no-save --no-package-lock puppeteer-core
          echo "PUPPETEER_ENTRY=$(node -p "require.resolve('puppeteer-core',{paths:['$RUNNER_TEMP/b46qa']})")" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Verify candidate browser replay before Worker upload
        run: node qa/eventflow-same-minute-20261118/browser.mjs
      - name: Deploy separate test Worker only and verify hashes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node qa/eventflow-same-minute-20261118/deploy-test-worker.mjs
      - name: Verify browser from actual test Worker URL
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {pathToFileURL} from 'node:url';
          const puppeteer=(await import(pathToFileURL(process.env.PUPPETEER_ENTRY).href)).default;
          const report=JSON.parse(fs.readFileSync('qa-output/worker-report.json','utf8'));
          const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          try{
            const page=await browser.newPage();await page.setViewport({width:1090,height:800});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            const response=await page.goto(report.url,{waitUntil:'load',timeout:30000});assert.equal(response.status(),200);
            await page.waitForFunction(()=>document.querySelectorAll('.b46-flow-signal').length===3,{timeout:8000});
            const x=await page.evaluate(()=>{const c=[...document.querySelectorAll('.b46-flow-signal')].map(e=>{const r=e.getBoundingClientRect();return {text:e.innerText,x:r.x,y:r.y,w:r.width,h:r.height}});return {cards:c,connectors:document.querySelectorAll('.b46-flow-connectors path').length,overlap:c.some((a,i)=>c.slice(i+1).some(b=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y))}});
            assert.equal(x.cards.length,3);assert.equal(x.cards.filter(c=>c.text.includes('63')).length,2);assert.equal(x.connectors,3);assert(!x.overlap);assert.deepEqual(errors,[]);
            await page.screenshot({path:'qa-output/worker-desktop-1090.png'});
            console.log('LIVE_TEST_WORKER_BROWSER_PASS '+JSON.stringify(x));
          }finally{await browser.close()}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eventflow-isolated-worker-test
          path: |
            qa-output/worker-report.json
            qa-output/worker-desktop-1090.png
            qa-output/browser-report.json
            qa-output/expanded-match-343.candidate.js.report.json
          retention-days: 7
