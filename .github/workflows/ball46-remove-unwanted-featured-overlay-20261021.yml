name: BALL46 — Remove Accidental Featured Overlay (Guarded Production)
on:
  push:
    branches: [fix/ball46-remove-added-featured-mobile-overlay-20261021]
    paths:
      - '.github/workflows/ball46-remove-unwanted-featured-overlay-20261021.yml'
      - 'deploy-assets/remove-unwanted-featured-overlay-20261021/cleanup.mjs'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  remove-only-unwanted-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate cleanup and start browser test
        working-directory: deploy-assets/remove-unwanted-featured-overlay-20261021
        run: |
          set -euo pipefail
          node --check cleanup.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
      - name: Guard active version, remove injected overlay, verify untouched PC/mobile and deploy
        working-directory: deploy-assets/remove-unwanted-featured-overlay-20261021
        run: node cleanup.mjs
      - name: Keep pre/post screenshot and rollback proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-unwanted-featured-overlay-removal-production-proof
          path: deploy-assets/remove-unwanted-featured-overlay-20261021/proof/
          retention-days: 30
          if-no-files-found: warn
