name: BALL46 Adaptive latest selections all related TEST UI deploy 20261125
on:
  push:
    branches: [feature/ball46-adaptive-manual-control-test-20261125]
    paths: [.github/workflows/b46-adaptive-latest-all-ui-deploy-20261125.yml]
permissions: {contents: read}
jobs:
  deploy-test-ui-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax check additive TEST modules, native UI patcher, guarded deployer
        run: |
          node --check qa/prematch-history-20261120/b46-adaptive-latest-native-test-patch.mjs
          node --check qa/prematch-history-20261120/b46-adaptive-formula-control-risk-test.mjs
          node --check qa/prematch-history-20261120/b46-adaptive-manual-control-page-test.mjs
          node --check qa/prematch-history-20261120/b46-adaptive-ou-ui-v1-test.mjs
          node --check qa/prematch-history-20261120/deploy-adaptive-latest-all-ui-test-20261125.mjs
      - name: Confirm 42 formula control and shadow safety with isolated SQL test
        run: node --experimental-sqlite qa/prematch-history-20261120/b46-adaptive-formula-control-risk.test.mjs
      - name: Preflight exact current Cloudflare Worker version and all TEST UI patch anchors
        run: node qa/prematch-history-20261120/deploy-adaptive-latest-all-ui-test-20261125.mjs --dry-run
      - name: Deploy ONLY the two TEST UI Workers and verify all pages and protected versions
        run: node qa/prematch-history-20261120/deploy-adaptive-latest-all-ui-test-20261125.mjs

