name: Ball46 MEMBER Outer Card Transparent No Hover 20261011
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ball46-member-outer-card-clear-20261011.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  member-outer-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ball46-easybet-crossdevice-fix-20261007
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install parser dependency
        run: npm install --no-save --ignore-scripts acorn@8
      - name: Patch only current MEMBER outer rail card
        working-directory: deploy-assets/ball46-member-nav-20261009
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs';
          import {resolve} from 'node:path';
          import {inspect,api,script,activeVersion,getVersion,publicFile,sha,canonical} from '../daily-performance-20261005/production.mjs';
          import {schedules,stageCurrentRail,verifyRailBase,wrangler} from '../daily-performance-20261005/rail.mjs';
          
          const report={scope:'ONLY MEMBER outer rail-card transparent with no hover; preserve 1,011, link, location and all other components',startedAt:new Date().toISOString()};
          mkdirSync('audit-member-outer-clear',{recursive:true});
          const save=()=>writeFileSync('audit-member-outer-clear/report.json',JSON.stringify(report,null,2));
          const delay=ms=>new Promise(r=>setTimeout(r,ms));
          let original=null,candidate=null;
          const scoped=String.raw`
          /* B46 MEMBER outer rail-card only: no square background and no hover. */
          body .workspace.singlepage > .left-rail > div.rail-card[data-b46-member-independent="1"],
          body .workspace.singlepage > .left-rail > div.rail-card[data-b46-member-independent="1"]:hover,
          body .workspace.singlepage > .left-rail > div.rail-card[data-b46-member-independent="1"]:active,
          body .workspace.singlepage > .left-rail > div.rail-card[data-b46-member-independent="1"]:focus-within{
          background:transparent!important;background-image:none!important;border:0!important;box-shadow:none!important;outline:none!important;filter:none!important;transform:none!important;transition:none!important;animation:none!important;
          }
          body .workspace.singlepage > .left-rail > div.rail-card[data-b46-member-independent="1"]::before,
          body .workspace.singlepage > .left-rail > div.rail-card[data-b46-member-independent="1"]::after{
          content:none!important;display:none!important;
          }
          body .workspace.singlepage > .left-rail > div.rail-card[data-b46-member-independent="1"] > a[data-b46-member-entry="rail"],
          body .workspace.singlepage > .left-rail > div.rail-card[data-b46-member-independent="1"] > a[data-b46-member-entry="rail"]:hover,
          body .workspace.singlepage > .left-rail > div.rail-card[data-b46-member-independent="1"] > a[data-b46-member-entry="rail"]:active,
          body .workspace.singlepage > .left-rail > div.rail-card[data-b46-member-independent="1"] > a[data-b46-member-entry="rail"]:focus-visible{
          background:transparent!important;background-image:none!important;border-color:transparent!important;box-shadow:none!important;filter:none!important;transform:none!important;transition:none!important;animation:none!important;text-decoration:none!important;color:#ffe57c!important;
          }
          body .workspace.singlepage > .left-rail > div.rail-card[data-b46-member-independent="1"] > a[data-b46-member-entry="rail"]:hover .b46-premium-name,
          body .workspace.singlepage > .left-rail > div.rail-card[data-b46-member-independent="1"] > a[data-b46-member-entry="rail"]:hover .b46-premium-star{
          color:#ffe57c!important;background:transparent!important;box-shadow:none!important;transform:none!important;filter:none!important;
          }
          `;
          function patch(html){
            const parent='<div class="rail-card" data-b46-member-independent="1" style="padding:0;overflow:hidden">';
            assert.equal(html.split(parent).length-1,1,'EXACT_MEMBER_OUTER_CARD_MUST_EXIST');
            const anchor=[...html.matchAll(/<a\b(?=[^>]*data-b46-member-entry="rail")[^>]*>[\s\S]*?<\/a>/g)];
            assert.equal(anchor.length,1,'MEMBER_ANCHOR_COUNT_CHANGED');
            assert(anchor[0][0].includes('>1,011</strong>'),'MOCK_COUNT_MUST_REMAIN_1011');
            assert(anchor[0][0].includes('https://member.ball46.com/pricing'),'LINK_CHANGED');
            assert.equal((html.match(/<style id="b46-member-gold-1011">/g)||[]).length,1,'ORIGINAL_MEMBER_STYLE_MISSING');
            assert(!html.includes('B46 MEMBER outer rail-card only'),'ALREADY_APPLIED_STOP');
            const start=html.indexOf('<style id="b46-member-gold-1011">');
            const end=html.indexOf('</style>',start);
            assert(end>start,'STYLE_CLOSE_MISSING');
            const output=html.slice(0,end)+scoped+html.slice(end);
            assert.equal(output.length-html.length,scoped.length,'ONLY_SCOPED_CSS_SHOULD_CHANGE');
            assert(output.includes(parent),'MEMBER_LOCATION_CHANGED');
            assert(output.includes(anchor[0][0]),'MEMBER_CONTENT_CHANGED');
            return output;
          }
          async function rollback(){
            if(!original)return;
            const active=await activeVersion();
            if(active===original)return;
            if(!candidate||active!==candidate)throw Error('FOREIGN_PRODUCTION_VERSION_STOP_NO_ROLLBACK');
            await api('/scripts/'+script+'/deployments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({strategy:'percentage',versions:[{version_id:original,percentage:100}],annotations:{'workers/message':'Rollback outer MEMBER rail card only'}})});
            assert.equal(await activeVersion(),original,'ROLLBACK_NOT_CONFIRMED');
          }
          try{
            const current=await inspect();original=current.restore.version;
            const settings=await api('/scripts/'+script+'/settings'),crons=await schedules();
            const settingsSha=sha(canonical(settings)),workerSha=sha(Buffer.from(current.source));
            const staged=await stageCurrentRail(current.version,settings,crons,current.source);
            await verifyRailBase(staged);
            assert.equal(await activeVersion(),original,'PRODUCTION_CHANGED_DURING_STAGE');
            const file=resolve(staged.runtime,'assets/index.html');
            const before=readFileSync(file,'utf8');
            assert.equal(sha(Buffer.from(before)),staged.hashes['index.html'],'STAGED_HTML_NOT_CURRENT');
            const after=patch(before);
            const newHash=sha(Buffer.from(after));
            writeFileSync(file,after);
            report.beforeVersion=original;report.onlyChangedAsset='index.html';report.beforeHash=staged.hashes['index.html'];report.afterHash=newHash;save();
            wrangler(staged,true);
            assert.equal(await activeVersion(),original,'PRODUCTION_MOVED_BEFORE_DEPLOY');
            wrangler(staged,false);
            for(let i=0;i<25;i++){const v=await activeVersion();if(v!==original){candidate=v;break}await delay(1200)}
            assert(candidate,'DEPLOYED_VERSION_NOT_OBSERVED');
            let liveOk=false;
            for(let i=0;i<25;i++){
              assert.equal(await activeVersion(),candidate,'PRODUCTION_MOVED_DURING_VERIFY');
              try{liveOk=sha(await publicFile('/index.html','html'))===newHash;if(liveOk)break}catch{}
              await delay(1200);
            }
            assert(liveOk,'PUBLIC_MEMBER_CSS_NOT_VERIFIED');
            for(const [name,hash] of Object.entries(staged.hashes)){
              if(name==='index.html')continue;
              assert.equal(sha(await publicFile('/'+name)),hash,'UNRELATED_ASSET_CHANGED:'+name);
            }
            const deployed=await getVersion(candidate),main=deployed.modules.find(x=>x.name===deployed.main_module);
            assert(main,'MAIN_MODULE_MISSING');
            assert.equal(sha(Buffer.from(Buffer.from(main.content_base64,'base64').toString('utf8'))),workerSha,'WORKER_ENGINE_CHANGED');
            assert.equal(sha(canonical(await api('/scripts/'+script+'/settings'))),settingsSha,'WORKER_SETTINGS_CHANGED');
            assert.equal(canonical(await schedules()),canonical(crons),'WORKER_CRONS_CHANGED');
            report.result='SUCCESS';report.deployedVersion=candidate;report.completedAt=new Date().toISOString();save();
            console.log('BALL46_MEMBER_OUTER_CARD_CLEAR_SUCCESS',JSON.stringify({before:original,deployed:candidate,unchangedAssets:Object.keys(staged.hashes).length-1}));
          }catch(e){
            report.result='FAIL_STOPPED';report.error=String(e?.message||e);save();
            try{await rollback();report.rolledBack=true;save()}catch(rb){report.rollbackError=String(rb?.message||rb);save()}
            console.error(e.stack);process.exitCode=1;
          }
          
          NODE
      - name: Save readback audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-member-outer-${{ github.run_id }}
          path: deploy-assets/ball46-member-nav-20261009/audit-member-outer-clear
          retention-days: 30
