name: Diagnose CAR 3.1 finished live once

on:
  push:
    paths:
      - '.github/workflows/diagnose-car31-finished-live-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live worker state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://nomadtips3-car31-goaloo.mccarey-supon.workers.dev'
          echo '--- HEALTH ---'
          curl -fsS "$BASE/health"
          echo
          echo '--- LIVE SUMMARY ---'
          curl -fsS "$BASE/live" -o /tmp/live.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/live.json'))
          print('generatedAt=',p.get('generatedAt'),'discoveredLive=',p.get('discoveredLive'),'count=',len(p.get('matches') or []))
          for m in sorted(p.get('matches') or [], key=lambda x: (-(x.get('minute') or 0), str(x.get('sourceMatchId')))):
              print(m.get('sourceMatchId'), '|', m.get('status'), '|', m.get('minute'), '| fresh=',m.get('sourceFreshnessSeconds'), '|', m.get('home'), 'vs', m.get('away'), '| score', (m.get('score') or {}).get('home'), '-', (m.get('score') or {}).get('away'))
          PY
          echo '--- HISTORY PENDING/SETTLED IDS ---'
          curl -fsS "$BASE/history?page=1&limit=100" -o /tmp/history.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/history.json'))
          for r in p.get('records') or []:
              print(r.get('id'), '|', r.get('status'), '|', r.get('ftStatus'), '|', r.get('home'), 'vs', r.get('away'), '|', r.get('result'))
          PY
