name: Emergency Restore Member2 Previous Deployment
on:
  push:
    branches: [member2/isolated-ui-and-registration-20261011]
    paths: ['.github/workflows/member2-emergency-restore-20261011.yml']
permissions: {contents: read}
jobs:
  rollback:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Restore only member2 production Worker version from 20:29 Bangkok
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/ball46-member2-production/deployments"
          curl -fsS -H "Authorization: Bearer $CF_TOKEN" "$api" > /tmp/history.json
          jq -c '.result.deployments[:5] | map({created_on,versions})' /tmp/history.json
          current=$(jq -r '.result.deployments[0].versions[0].version_id // empty' /tmp/history.json)
          old='8dec25c2-8203-4598-acf4-3958c26a1f0d'
          test "$current" = '5ed98fc4-a214-4845-b7a3-417f971cfe77' || { echo "UNEXPECTED_CURRENT_VERSION: refusing rollback"; exit 1; }
          jq -e --arg old "$old" '.result.deployments[] | select(any(.versions[]?; .version_id==$old))' /tmp/history.json >/dev/null
          printf '{"strategy":"percentage","versions":[{"percentage":100,"version_id":"%s"}],"annotations":{"workers/message":"Emergency restore Member2 pre-21:21 deployment; no changes to main"}}' "$old" > /tmp/body.json
          code=$(curl -sS -X POST -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/body.json -o /tmp/result.json -w '%{http_code}' "$api")
          jq -c '{success,errors,result:{id:.result.id,versions:.result.versions}}' /tmp/result.json
          test "$code" = 200 || test "$code" = 201
          jq -e '.success==true' /tmp/result.json
          curl -fsS -H "Authorization: Bearer $CF_TOKEN" "$api" | jq -e --arg old "$old" '.result.deployments[0].versions | any(.version_id==$old and .percentage==100)'
          for route in /api/health /api/member/daily; do
            code=$(curl -sS --max-time 15 -o /tmp/http -w '%{http_code}' "https://ball46-member2-production.mccarey-supon.workers.dev$route")
            echo "VERIFIED_ROUTE $route HTTP=$code"
            if [ "$route" = /api/health ]; then test "$code" = 200; else test "$code" = 401; fi
          done
          echo 'MEMBER2_RESTORED_PREVIOUS_DEPLOYMENT'
