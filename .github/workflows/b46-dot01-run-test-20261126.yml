name: BALL46 dot01 RUN TEST only
on:
  push:
    branches: [feature/ball46-adaptive-manual-control-test-20261125]
    paths: ['.github/workflows/b46-dot01-run-test-20261126.yml']
permissions:
  contents: read
jobs:
  run-test-formula:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Enable only dot01 using the owner endpoint and read back
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'E01_JS'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          const {CLOUDFLARE_API_TOKEN:token}=process.env;
          assert(token);
          assert.equal(process.env.GITHUB_RUN_ATTEMPT,'1');
          const url='https://ball46-prematch-only-test-20261120.mccarey-supon.workers.dev/adaptive-control-api-test';
          const authorization='Bearer '+crypto.createHmac('sha256',token).update('BALL46_PREMATCH_ONLY_V1').digest('hex');
          async function get(method='GET',body){
           const res=await fetch(url,{method,headers:{authorization,accept:'application/json',...(body?{'content-type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),redirect:'error',signal:AbortSignal.timeout(15000)});
           if(!res.ok)throw Error(method+' HTTP '+res.status);
           return res.json();
          }
          const old=await get();
          assert(old.testOnly===true&&old.code==='B46_ADAPTIVE_FORMULA_CONTROL_TEST_V1'&&old.extraFormula?.formula==='E01'&&old.formulas.length===42);
          assert(['RUN','PAUSED_MANUAL'].includes(old.extraFormula.mode));
          if(old.extraFormula.mode!=='RUN'){
           const enabled=await get('POST',{formula:'E01',action:'RUN'});
           assert(enabled.ok&&enabled.formula==='E01'&&enabled.mode==='RUN');
          }
          const fresh=await get();
          assert(fresh.testOnly===true&&fresh.extraFormula?.formula==='E01'&&fresh.extraFormula.mode==='RUN'&&fresh.formulas.length===42);
          console.log('B46_DOT01_RUN '+JSON.stringify({status:'PASS',before:old.extraFormula.mode,after:fresh.extraFormula.mode,updatedAt:fresh.extraFormula.updatedAt,checkedAt:fresh.updatedAt,lastRun:fresh.extraFormula.lastRun,total:fresh.extraFormula.total}));
          E01_JS
