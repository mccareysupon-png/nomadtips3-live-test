name: PREVIEW ONLY - Ball46 Top Card Browser 20260929

on:
  push:
    branches:
      - work/ball46-topcard-details-20260929
    paths:
      - '.github/workflows/ball46-topcard-browser-preview-20260929.yml'
      - '.github/scripts/ball46_topcard_browser_preview_20260929.js'
      - 'ball46-topcard-candidate-20260929/dashboard-v2-stage3.js'
      - 'ball46-topcard-candidate-20260929/singlepage-workspace-343.css'

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-topcard-details-20260929
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Preview candidate by intercepting only JS/CSS on live Ball46
        run: node .github/scripts/ball46_topcard_browser_preview_20260929.js
      - name: Commit preview report and screenshots to work branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ball46-topcard-preview-20260929
          git diff --cached --quiet && exit 0
          git commit -m 'report(ball46): browser preview top-card details 20260929'
          git push origin HEAD:work/ball46-topcard-details-20260929
