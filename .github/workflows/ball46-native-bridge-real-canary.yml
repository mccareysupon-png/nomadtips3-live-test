name: BALL46 native Ledger V2 bridge real authorization canary
on:
  push:
    branches: [stage/ball46-multisource-v5-20261017]
    paths: [.github/workflows/ball46-native-bridge-real-canary.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native-bridge-safe-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      FIVE_KEY_A: ${{ secrets.FIVEDOLLAR_API_KEY }}
      FIVE_KEY_B: ${{ secrets.FIVE_DOLLAR_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check actual native Ledger V2 source and authenticated nonfinal route
        shell: bash
        run: |
          node - <<'NODE'
          const token=process.env.FIVE_KEY_A||process.env.FIVE_KEY_B;
          if(!token||token.length<16)throw Error('NO_ENGINE_SETTLEMENT_CREDENTIAL');
          if(!process.env.CF_TOKEN||!process.env.CF_ACCOUNT_ID)throw Error('NO_CF_SOURCE_CREDENTIAL');
          const base='https://nomadtips3-engine-343.mccarey-supon.workers.dev';
          const cf='https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ACCOUNT_ID+
           '/workers/scripts/nomadtips3-engine-343';
          async function json(path,options){
           const res=await fetch(base+path,{redirect:'error',signal:AbortSignal.timeout(15000),...options});
           const obj=await res.json().catch(()=>({}));
           return{http:res.status,data:obj};
          }
          (async()=>{
           const sourceRes=await fetch(cf,{headers:{Authorization:'Bearer '+process.env.CF_TOKEN}});
           if(!sourceRes.ok)throw Error('CLOUDFLARE_SOURCE_UNAVAILABLE_'+sourceRes.status);
           const source=await sourceRes.text();
           const begin=source.indexOf('async reconcileExternalFinal(');
           const close=source.indexOf('async fetch(request)',begin);
           if(begin<0||close<begin)throw Error('RECONCILE_ENTRY_NOT_FOUND');
           const segment=source.slice(begin,close);
           const checks={
            fixtureValidation:segment.includes('normalizeFinalFixture('),
            nonfinalGuard:segment.includes('NOT_FINAL')&&segment.indexOf('NOT_FINAL')<segment.indexOf('readWorkingSignals(this.ctx)'),
            readsCurrentSignals:segment.includes('readWorkingSignals(this.ctx)'),
            usesNativeMarketGrader:segment.includes('settleMarketSignal(sig, fixture)'),
            nativeLedgerV2Sync:segment.includes('await this.syncStatisticsLedger(fixture)'),
            antiRepeatedPending:segment.includes('sig?.status !== "PENDING"'),
            existingAuth:segment.includes('secureTokenOk(request, this.env)'),
            correctWriter:source.includes('async upsertLedgerRows(')
           };
           console.log('LIVE_NATIVE_SOURCE_GATES',JSON.stringify(checks));
           if(Object.values(checks).some(x=>!x))throw Error('LIVE_SOURCE_GATE_FAILED');
           const before=await json('/bridge-health');
           if(before.http!==200||before.data.statisticsSource!=='LEDGER_V2_ONLY')
            throw Error('BRIDGE_LEDGER_V2_HEALTH_MISMATCH');
           const beforeLedger=await json('/ledger-health');
           if(beforeLedger.http!==200)throw Error('LEDGER_HEALTH_UNAVAILABLE');
           // Deliberately NOT final. The verified source returns before any
           // Signal/DO/Ledger write. Never send an FT canary to live Production.
           const test=await json('/reconcile-final',{
            method:'POST',
            headers:{'content-type':'application/json','x-settlement-token':token},
            body:JSON.stringify({fixture:{
             id:'BALL46-BRIDGE-AUTH-CANARY-NONFINAL',
             status:'live',status_code:'1h',minute:1,
             goals:{home:0,away:0}
            }})
           });
           if(test.http!==200||test.data.ok!==true||test.data.state!=='NOT_FINAL'||
             Number(test.data.settled)!==0)
            throw Error('NATIVE_AUTH_OR_NONFINAL_GUARD_FAILED_'+test.http+'_'+String(test.data.error||test.data.state));
           const afterLedger=await json('/ledger-health');
           console.log('LIVE_NATIVE_NONFINAL_CANARY',JSON.stringify({
            authorized:true,http:test.http,state:test.data.state,settled:test.data.settled,
            bridgeVersion:before.data.version,ledgerVersion:before.data.statisticsLedgerVersion,
            ledgerBefore:{total:beforeLedger.data.ledgerTotal,pending:beforeLedger.data.pending,
             settledTotal:beforeLedger.data.settledTotal},
            ledgerAfter:{total:afterLedger.data.ledgerTotal,pending:afterLedger.data.pending,
             settledTotal:afterLedger.data.settledTotal},
            canaryType:'AUTHENTICATED_NONFINAL_NO_SETTLEMENT',
            productionTestFtWrites:0}));
          })().catch(e=>{console.error('CANARY_FAILED',e.message);process.exit(1)});
          NODE
