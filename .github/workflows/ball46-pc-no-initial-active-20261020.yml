name: BALL46 PC Dark No Initial Active 20261020
on:
  push:
    branches: [codex/ball46-pc-no-initial-active-20261020]
    paths:
      - '.github/workflows/ball46-pc-no-initial-active-20261020.yml'
      - 'deploy-assets/pc-initial-active-fix-20261020/deploy.mjs'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  guarded-pc-initial-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and browser dependencies
        working-directory: deploy-assets/pc-initial-active-fix-20261020
        run: |
          set -euo pipefail
          node --check deploy.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
      - name: Baseline and candidate browser QA, then conditional production cutover
        working-directory: deploy-assets/pc-initial-active-fix-20261020
        run: node deploy.mjs
      - name: Save verification screenshots and rollback audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-pc-initial-active-fix-audit
          path: deploy-assets/pc-initial-active-fix-20261020/audit/
          retention-days: 30
          if-no-files-found: warn
