name: BALL46 O/U TEST old and V2 concurrent price audit READONLY
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-ou-v2-price-concurrency-audit-20261123.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Inspect old O/U worker route and new V2 scheduling without extra provider calls
        run: |
          node --input-type=module <<'JS'
          import crypto from 'node:crypto';
          const t=process.env.CLOUDFLARE_API_TOKEN,a=process.env.CLOUDFLARE_ACCOUNT_ID;
          const n='ball46-prematch-only-test-20261120';
          const root='https://api.cloudflare.com/client/v4/accounts/'+a+'/workers';
          const fetchCF=async p=>(await (await fetch(root+p,{headers:{authorization:'Bearer '+t}})).json()).result;
          const ver=(await fetchCF('/scripts/'+n+'/deployments?per_page=1')).deployments[0].versions[0].version_id;
          const v=await fetchCF('/workers/'+n+'/versions/'+ver+'?include=modules');
          const main=Buffer.from(v.modules.find(m=>m.name===v.main_module).content_base64,'base64').toString();
          const lines=main.split('\n');
          for(const pattern of ["path==='/ou-cycle-test'","async runOuInstant",
            "async runOuValueV2Shadow","async runPreMatchOuEngine",
            "const ouSettled=settleOu","export default {async scheduled"]){
            const hits=lines.map((x,i)=>({x,i})).filter(x=>x.x.includes(pattern)).slice(0,5);
            console.log('B46_OLD_NEW_OU_SOURCE '+JSON.stringify({pattern,hits:hits.map(x=>({
              line:x.i+1,excerpt:lines.slice(Math.max(0,x.i-4),Math.min(lines.length,x.i+18))
                .map((s,j)=>(Math.max(0,x.i-4)+j+1)+':'+s.slice(0,700)).join('\n')
            }))}).slice(0,14000));
          }
          const headers={authorization:'Bearer '+crypto.createHmac('sha256',t).update('BALL46_PREMATCH_ONLY_V1').digest('hex')};
          const url='https://'+n+'.mccarey-supon.workers.dev';
          for(const p of ['/ou-state-test','/ou-price-pickup-state','/prematch-ou-engine-state','/ou-value-v2-state']){
            const r=await fetch(url+p,{headers,cache:'no-store'});
            const x=await r.json().catch(()=>null);
            console.log('B46_OLD_NEW_OU_STATE '+JSON.stringify({path:p,http:r.status,
             last:x?.last&&{status:x.last.status,priceBridge:x.last.priceBridge?.state,
              providerCalls:x.last.providerCalls,at:x.last.at},
             stats:x?.stats,policy:x?.policy&&{mode:x.policy.mode,maxProviderCallsPerLondonDay:x.policy.maxProviderCallsPerLondonDay},
             providerCallsToday:x?.providerCallsToday,remainingToday:x?.remainingToday,
             selections:x?.selections?.length,quota:x?.quota
            }).slice(0,7000));
          }
          console.log('B46_OLD_NEW_OU_CONCURRENCY_AUDIT_FINISHED_NO_CALLS');
          JS
