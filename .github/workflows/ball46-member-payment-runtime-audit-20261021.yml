name: BALL46 Member Payments — Live Worker Configuration Forensics (READ ONLY)
on:
  push:
    branches: [audit/ball46-member-stripe-e2e-20261021]
    paths:
      - '.github/workflows/ball46-member-payment-runtime-audit-20261021.yml'
permissions:
  contents: read
jobs:
  audit-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect deployed Member Worker bindings, Stripe config and public routes without mutation
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          assert(account&&token,'CLOUDFLARE_READ_CREDENTIALS_MISSING');
          const api='https://api.cloudflare.com/client/v4/accounts/'+account;
          async function read(path){
            const r=await fetch(api+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(27000)});
            const j=await r.json();assert(r.ok&&j.success,'CF_READ_ERROR '+path);
            return j.result;
          }
          const deployments=await read('/workers/scripts/ball46-member-production/deployments?per_page=1');
          const versions=deployments.deployments?.[0]?.versions||[];
          assert(versions.length===1&&Number(versions[0].percentage)===100,'MULTIPLE_MEMBER_WORKER_VERSIONS_ACTIVE');
          const current=versions[0].version_id;
          const settings=await read('/workers/scripts/ball46-member-production/settings');
          const bindings=settings.bindings||[];
          const find=name=>bindings.find(b=>b.name===name);
          const present=name=>Boolean(find(name));
          const required=['ASSETS','STRIPE_SECRET_KEY','STRIPE_PRICE_ID','CF_ACCESS_TEAM_DOMAIN','CF_ACCESS_AUD','OWNER_CHECKOUT_EMAIL','MEMBER_CHECKOUT_ENABLED'];
          const has=Object.fromEntries(required.map(k=>[k,present(k)]));
          assert(required.every(present),'REQUIRED_PRODUCTION_BINDING_MISSING '+JSON.stringify(has));
          assert.equal(find('STRIPE_SECRET_KEY').type,'secret_text','LIVE_STRIPE_SECRET_NOT_SECRET_BINDING');
          assert.equal(find('STRIPE_PRICE_ID').value,'price_1UOGIkFXmKSSVxQdhVjI9ml6','LIVE_STRIPE_PRICE_BINDING_MISMATCH');
          assert.equal(find('MEMBER_CHECKOUT_ENABLED').value,'true','CHECKOUT_FLAG_DISABLED');
          assert.equal(settings.domains?.includes('member.ball46.com'),true,'MEMBER_PRODUCTION_DOMAIN_WRONG');
          const checks=[];
          for(const [path,expectedStatus] of [['/api/health',200],['/api/enrollment-status',200],['/api/stripe/webhook',503]]){
            const url=new URL(path,'https://member.ball46.com');url.searchParams.set('paymentForensicAudit',Date.now());
            const r=await fetch(url,{headers:{'cache-control':'no-cache'},redirect:'manual',signal:AbortSignal.timeout(23000)});
            assert.equal(r.status,expectedStatus,'PUBLIC_ROUTE_UNEXPECTED_'+path);
            checks.push({path,http:r.status});
          }
          const expectedWorkerScript=await read('/workers/workers/ball46-member-production/versions/'+current+'?include=modules');
          const main=(expectedWorkerScript.modules||[]).find(m=>m.name===expectedWorkerScript.main_module);
          assert(main?.content_base64,'MEMBER_WORKER_MODULE_UNREADABLE');
          const bytes=Buffer.from(main.content_base64,'base64');
          const script=bytes.toString('utf8');
          const safeMarkers={
            secureCheckout:script.includes('createMemberCheckout'),
            secureStripeCheck:script.includes('paidEntitlement')||script.includes('memberAccess'),
            signedCloudflare:script.includes('verifyAccessIdentity'),
            stripeWebhooksDisabled:script.includes('WEBHOOK_NOT_CONFIGURED'),
            ownedBillingPortalRoute:script.includes('/api/member/billing-portal')||script.includes('/api/member/manage-billing')
          };
          assert(safeMarkers.secureCheckout&&safeMarkers.signedCloudflare&&safeMarkers.stripeWebhooksDisabled,'PAYMENT_HANDLER_RUNTIME_UNEXPECTED');
          console.log('BALL46_MEMBER_PAYMENT_PRODUCTION_CONFIG_AUDIT_PASS',JSON.stringify({
            workerVersion:current,workerMainSha256:createHash('sha256').update(bytes).digest('hex'),
            requiredBindingsPresent:has,stripeKeyStoredAsSecret:true,checkoutEnabled:true,
            intendedLivePriceMatches:true,domain:'member.ball46.com',safeMarkers,routeStatuses:checks,
            noSecretsPrinted:true,noMutations:true
          }));
          JS
