name: BALL46 actual HUB source shadow integration
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-hub-history-shadow.yml']
permissions:
  contents: read
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing history contract tests
        run: |
          node --check qa/prematch-history-20261120/hub-clone-patch.mjs
          node --test qa/prematch-history-20261120/*.test.mjs
      - name: Run isolated copy of actual HUB with mock transport
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node qa/prematch-history-20261120/hub-shadow-run.mjs

