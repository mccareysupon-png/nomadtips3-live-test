name: Audit John Bulk HUB Before Any New Engine Change 20261011
on:
  push:
    branches: [incident/ball46-signal-silent-20261011]
    paths: [.github/workflows/incident-audit-john-bulk-hub-20261011.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect HUB bulk ingest + Engine cached feeds and live price provenance READ ONLY
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          const acc=process.env.CLOUDFLARE_ACCOUNT_ID,tok=process.env.CLOUDFLARE_API_TOKEN,b='https://api.cloudflare.com/client/v4/accounts/'+acc+'/workers';
          const get=async p=>{const r=await fetch(b+p,{headers:{Authorization:'Bearer '+tok},signal:AbortSignal.timeout(25000)}),j=await r.json();if(!r.ok||!j.success)throw Error('CF_'+r.status+'_'+p);return j.result};
          for(const name of ['nomadtips3-5usd-hub-343','nomadtips3-engine-343']){
            const ds=await get('/scripts/'+name+'/deployments'),id=ds.deployments[0].versions.find(x=>Number(x.percentage)===100).version_id;
            const v=await get('/workers/'+name+'/versions/'+id+'?include=modules');
            const src=Buffer.from(v.modules.find(x=>x.name===v.main_module).content_base64,'base64').toString('utf8'),lines=src.split('\n');
            console.log('JOHN_ACTIVE',JSON.stringify({name,id,sha:createHash('sha256').update(src).digest('hex'),bytes:src.length}));
            const keys=name.includes('hub')?['status=live','include=','per_page=','providerOdds','oddsUpdatedAt','providerOddsUpdatedAt','async function provider','api.5dollarfootballapi','fetchLive','async fetch(','snapshot','FIVEDOLLAR_API_KEY','/v1/fixtures','status=all']:['oddsRoot(f.providerOdds)','providerOddsUpdatedAt','pricePass','pickBestPriced','full = j','goalline','goal_line','corner_line','bookmakers'];
            for(const term of keys){
              const hits=lines.flatMap((l,i)=>l.includes(term)?[{line:i+1,text:l.trim().slice(0,680)}]:[]).slice(0,12);
              console.log('JOHN_SOURCE_MATCH',JSON.stringify({name,term,count:hits.length,hits}));
            }
          }
          const r=await fetch('https://www.ball46.com/api/engine/board?john_bulk_audit='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(24000)}),j=await r.json();
          const f=(j.fixtures||[]).find(x=>x.status==='in_play'&&(x?.fullOdds?.goalline?.inplay||x?.fullOdds?.goal_line?.inplay||x?.fullOdds?.corner_line?.inplay))||(j.fixtures||[]).find(x=>x.status==='in_play');
          const odds=f?.fullOdds||null;
          const leaves=[];
          const scan=(x,path='',depth=0)=>{
            if(depth>5||leaves.length>=90||x==null)return;
            if(Array.isArray(x)){leaves.push({path:path+'[]',length:x.length,sampleKeys:Object.keys(x[0]||{}).slice(0,20)});if(x[0])scan(x[0],path+'[0]',depth+1);return}
            if(typeof x==='object'){for(const [key,value] of Object.entries(x).slice(0,25))scan(value,path?path+'.'+key:key,depth+1);return}
            if(/record|update|fetched|time|live|inplay|line|over|under|slug|bookmaker|suspend|odds/i.test(path)){leaves.push({path,type:typeof x,example:(/time|date|updated|recorded/i.test(path)?x:null)})}
          };
          scan(odds);
          console.log('JOHN_BOARD_PUBLIC',JSON.stringify({http:r.status,ok:j.ok,hubFetchedAt:j.hubFetchedAt,hubAgeMs:j.hubAgeMs,stale:j.stale,count:j.fixtures?.length,exampleFixtureId:f?.fixtureId,fixtureMinute:f?.minute,fullOddsSource:f?.fullOddsSource,fullOddsFetchedAt:f?.fullOddsFetchedAt,topLevelKeys:Object.keys(odds||{}).slice(0,30),oddsShape:leaves}));
          NODE
