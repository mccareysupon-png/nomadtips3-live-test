name: NOMAD Source Probe

on:
  pull_request:
    paths:
      - 'nomad-live-engine/src/probe.js'
      - 'nomad-live-engine/wrangler.probe.toml'
      - '.github/workflows/nomad-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate Cloudflare credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
      - name: Deploy isolated diagnostic worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: nomad-live-engine
          wranglerVersion: '4'
          command: deploy --config wrangler.probe.toml
      - name: Probe all source layers
        run: |
          URL='https://nomadtips3-source-probe.mccarey-supon.workers.dev/probe'
          rm -f /tmp/probe.json
          for i in $(seq 1 12); do
            CODE=$(curl -sS -o /tmp/probe.json -w '%{http_code}' "$URL" || true)
            echo "probe attempt $i HTTP $CODE"
            if [ "$CODE" = "200" ] && [ -s /tmp/probe.json ]; then break; fi
            sleep 5
          done
          test -s /tmp/probe.json
          node <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/probe.json','utf8'));
          const compact={
            checkedAt:x.checkedAt,
            today:x.today,
            deep:(x.deep||[]).map(d=>({
              matchId:d.matchId,minute:d.minute,score:d.score,
              stats:{status:d.stats?.status,title:d.stats?.title,challenge:d.stats?.challenge,parsed:d.stats?.parsed},
              live:{status:d.live?.status,title:d.live?.title,challenge:d.live?.challenge,parsed:d.live?.parsed},
              odds:{status:d.odds?.status,title:d.odds?.title,challenge:d.odds?.challenge,parsed:d.odds?.parsed,bookmaker:d.odds?.bookmaker,line:d.odds?.line}
            })),
            ended:x.ended
          };
          console.log(JSON.stringify(compact,null,2));
          if(!x.today) process.exit(2);
          NODE
