name: Rollback Ball46 Ticker WAAPI 20261007

on:
  push:
    branches:
      - work/ball46-signal-ticker-waapi-20261007
    paths:
      - '.github/workflows/rollback-ball46-ticker-waapi-20261007.yml'
      - 'deploy-assets/signal-ticker-waapi-20261007/rollback.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-signal-ticker-waapi-20261007
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore last good Ball46 production
        working-directory: deploy-assets/signal-ticker-waapi-20261007
        run: node rollback.mjs
