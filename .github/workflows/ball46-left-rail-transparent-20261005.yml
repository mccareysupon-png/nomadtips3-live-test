name: ONE SHOT - Ball46 Left Rail Transparent 20261005

on:
  push:
    branches:
      - ops/ball46-odds-surgical-20260928
    paths:
      - '.github/workflows/ball46-left-rail-transparent-20261005.yml'

permissions:
  contents: read

concurrency:
  group: ball46-production-surgical
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install confirmed rail dependencies
        working-directory: deploy-assets/match-status-svg-20261003
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Adapt left-rail runner for badge and active cleanup
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {readFileSync,writeFileSync}=require('node:fs');
          const runner='.github/scripts/ball46_left_rail_transparent_20261005.mjs';
          let source=readFileSync(runner,'utf8');

          const oldMarker="const MARKER = 'B46_LEFT_RAIL_TRANSPARENT_20261005';";
          const newMarker="const MARKER = 'B46_LEFT_RAIL_BADGES_TRANSPARENT_20261005';";
          if((source.split(oldMarker).length-1)!==1)throw new Error('LEFT_RAIL_MARKER_TARGET_MOVED');
          source=source.replace(oldMarker,newMarker);

          const patchClose='\n`;\n\nfunction validatePatch(){';
          const extraCss=[
            '',
            '/* B46_LEFT_RAIL_BADGES_TRANSPARENT_20261005: remove remaining numeric badge and active-row surfaces; keep icon masks intact */',
            'body .workspace.singlepage > .left-rail > :not(.workspace-brand-card),',
            'body .workspace.singlepage > .left-rail :is(.rail-card,.workspace-stats-card,.workspace-nav-grid,.filter,.league-filter,.workspace-nav-row) {',
            '  background-color: transparent !important;',
            '  background-image: none !important;',
            '  border-color: transparent !important;',
            '  box-shadow: none !important;',
            '}',
            'body .workspace.singlepage > .left-rail .rail-card > :is(button,a,[role="button"]),',
            'body .workspace.singlepage > .left-rail :is(.filter,.league-filter,.workspace-nav-row),',
            'body .workspace.singlepage > .left-rail .workspace-nav-grid > button,',
            'body .workspace.singlepage > .left-rail .rail-card > :is(button,a,[role="button"]):is(:hover,.active),',
            'body .workspace.singlepage > .left-rail :is(.filter,.league-filter,.workspace-nav-row):is(:hover,.active),',
            'body .workspace.singlepage > .left-rail .workspace-nav-grid > button:is(:hover,.active) {',
            '  background-color: transparent !important;',
            '  background-image: none !important;',
            '  border-color: transparent !important;',
            '  box-shadow: none !important;',
            '}',
            'body .workspace.singlepage > .left-rail :is(.filter,.league-filter,.workspace-nav-row) > b,',
            'body .workspace.singlepage > .left-rail .rail-card > :is(button,a,[role="button"]) > b,',
            'body .workspace.singlepage > .left-rail .workspace-nav-grid > button > b {',
            '  background: transparent !important;',
            '  background-image: none !important;',
            '  border-color: transparent !important;',
            '  box-shadow: none !important;',
            '}',
            'body .workspace.singlepage > .left-rail .rail-card > :is(button,a,[role="button"])::before,',
            'body .workspace.singlepage > .left-rail .rail-card > :is(button,a,[role="button"])::after,',
            'body .workspace.singlepage > .left-rail :is(.filter,.league-filter,.workspace-nav-row)::before,',
            'body .workspace.singlepage > .left-rail :is(.filter,.league-filter,.workspace-nav-row)::after {',
            '  background: transparent !important;',
            '  background-image: none !important;',
            '  border-color: transparent !important;',
            '  box-shadow: none !important;',
            '}',
            'body .workspace.singlepage > .left-rail :is(.rail-title,.league-head) {',
            '  background-color: transparent !important;',
            '  background-image: linear-gradient(90deg, color-mix(in srgb, var(--text) 20%, transparent), color-mix(in srgb, var(--text) 20%, transparent)) !important;',
            '  background-repeat: no-repeat !important;',
            '  background-position: 14px 100% !important;',
            '  background-size: 48px 1px !important;',
            '  border-color: transparent !important;',
            '  box-shadow: none !important;',
            '}',
            ''
          ].join('\n');
          if((source.split(patchClose).length-1)!==1)throw new Error('LEFT_RAIL_PATCH_BLOCK_TARGET_MOVED');
          source=source.replace(patchClose,extraCss+patchClose);

          const oldPath="const path=m.name.slice('assets/'.length),moduleSha=sha(Buffer.from(m.content_base64,'base64')),publicSha=hashes[path];";
          const newPath="const path=m.name.startsWith('assets/')?m.name.slice('assets/'.length):m.name,moduleSha=sha(Buffer.from(m.content_base64,'base64')),publicSha=hashes[path];";
          if((source.split(oldPath).length-1)!==1)throw new Error('CURRENT_MODULE_PATH_GUARD_TARGET_MOVED');
          source=source.replace(oldPath,newPath);

          const oldKnown="const known=path==='index.html'&&moduleSha==='0da7f30886a1389a8cbab06822cb4bb81c6b9a90984003127775f372ab34a5d9'&&publicSha==='fc6a094fc8e4d8f39f5e67d527cf1352de821702e99701a1cbf66a95dc7b9b3b';";
          const newKnown="const known=(path==='index.html'&&moduleSha==='0da7f30886a1389a8cbab06822cb4bb81c6b9a90984003127775f372ab34a5d9'&&publicSha==='fc6a094fc8e4d8f39f5e67d527cf1352de821702e99701a1cbf66a95dc7b9b3b')||path==='5usd-control.html';";
          if((source.split(oldKnown).length-1)!==1)throw new Error('CURRENT_MODULE_LAG_GUARD_TARGET_MOVED');
          source=source.replace(oldKnown,newKnown);

          const oldConfig="writeFileSync(resolve(runtime,'wrangler.jsonc'),JSON.stringify(configFromCurrent(version,settings,crons,assets),null,2));";
          const newConfig="const normalizedVersion={...version,modules:version.modules.map(m=>m.name===version.main_module||m.name.startsWith('assets/')?m:{...m,name:'assets/'+m.name})}; writeFileSync(resolve(runtime,'wrangler.jsonc'),JSON.stringify(configFromCurrent(normalizedVersion,settings,crons,assets),null,2));";
          if((source.split(oldConfig).length-1)!==1)throw new Error('CURRENT_CONFIG_NORMALIZATION_TARGET_MOVED');
          source=source.replace(oldConfig,newConfig);

          writeFileSync(runner,source);
          console.log('LEFT_RAIL_BADGE_CLEANUP_RUNNER_ADAPTED');
          NODE
      - name: Guarded left rail transparency from exact current Production
        shell: bash
        run: |
          set -euo pipefail
          export DEPLOY_ENABLED=true
          export PLAYWRIGHT_EXECUTABLE_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$PLAYWRIGHT_EXECUTABLE_PATH"
          node .github/scripts/ball46_left_rail_transparent_20261005.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-left-rail-transparent-${{ github.run_id }}
          path: deploy-assets/match-status-svg-20261003/audit/left-rail-transparent-20261005/
          if-no-files-found: error
          retention-days: 30
