name: ONE SHOT - Ball46 Left Rail Transparent 20261005

on:
  push:
    branches:
      - ops/ball46-odds-surgical-20260928
    paths:
      - '.github/workflows/ball46-left-rail-transparent-20261005.yml'

permissions:
  contents: read

concurrency:
  group: ball46-production-surgical
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install confirmed rail dependencies
        working-directory: deploy-assets/match-status-svg-20261003
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Guarded left rail transparency from exact current Production
        shell: bash
        run: |
          set -euo pipefail
          export DEPLOY_ENABLED=true
          export PLAYWRIGHT_EXECUTABLE_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$PLAYWRIGHT_EXECUTABLE_PATH"
          node .github/scripts/ball46_left_rail_transparent_20261005.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-left-rail-transparent-${{ github.run_id }}
          path: deploy-assets/match-status-svg-20261003/audit/left-rail-transparent-20261005/
          if-no-files-found: error
          retention-days: 30
