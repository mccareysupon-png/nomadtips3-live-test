name: BALL46 PC Ticker Gap Audit 20261020
on:
  push:
    branches: [codex/ball46-pc-ticker-gap-20261020]
    paths:
      - '.github/workflows/ball46-pc-ticker-gap-audit-20261020.yml'
      - 'deploy-assets/pc-ticker-gap-20261020/audit.mjs'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure desktop gap and surrounding layout without changing production
        working-directory: deploy-assets/pc-ticker-gap-20261020
        run: |
          node --check audit.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
          node audit.mjs
