name: Check 3.43 Full Market Settings

on:
  push:
    branches: [work/nomad343-full-market-settings-20260914]
    paths:
      - 'nomad-live-343/settings.js'
      - 'nomad-live-343/settings.html'
      - 'nomad-live-343/settings.css'
      - 'nomad-live-343/index.html'
      - 'nomad-live-343/full-market-event-trigger-343.js'
      - 'workers/nomadtips3-343-full-market/src/index.js'
      - '.github/workflows/check-343-full-market-settings.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check nomad-live-343/settings.js
          node --check nomad-live-343/full-market-event-trigger-343.js
          node --check workers/nomadtips3-343-full-market/src/index.js
      - name: Verify defaults and isolation
        run: |
          grep -Fq "refreshSeconds: 30" workers/nomadtips3-343-full-market/src/index.js
          grep -Fq "workerCacheSeconds: 30" workers/nomadtips3-343-full-market/src/index.js
          grep -Fq "eventTrigger: true" workers/nomadtips3-343-full-market/src/index.js
          grep -Fq "softLimitPerMinute: 24" workers/nomadtips3-343-full-market/src/index.js
          grep -Fq "ACCOUNT_RATE_LIMIT_PER_MIN = 40" workers/nomadtips3-343-full-market/src/index.js
          grep -Fq "data-full-market-form" nomad-live-343/settings.html
          grep -Fq "full-market-event-trigger-343.js" nomad-live-343/index.html
          git diff --exit-code HEAD~1 -- workers/nomadtips3-engine-343 workers/nomadtips3-5usd-hub-343 || { echo 'Engine/HUB changed unexpectedly'; exit 1; }
