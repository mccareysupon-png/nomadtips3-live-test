name: Telegram Step 2 Diagnostics

on:
  push:
    branches: ['work/telegram-alerts-step2-mainline-20260903']
    paths: ['.github/workflows/telegram-alerts-step2-diagnostics.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check NOMAD source contract
        run: |
          set -euo pipefail
          curl -sS -o /tmp/source.json -w 'SOURCE_HTTP=%{http_code}\n' 'https://nomadtips3-car34-real-market-audit.mccarey-supon.workers.dev/history?page=1&limit=25'
          python - <<'PY'
          import json
          p='/tmp/source.json'
          raw=open(p,encoding='utf-8').read()
          print('SOURCE_PREFIX',raw[:300].replace('\n',' '))
          try:
              d=json.loads(raw)
              print('SOURCE_RECORDS',len(d.get('records') or []))
              if d.get('records'):
                  r=d['records'][0]
                  print('FIRST_KEYS',sorted(r.keys()))
                  print('FIRST_SELECTED_AT',r.get('selectedAt'))
          except Exception as e:
              print('SOURCE_JSON_ERROR',repr(e))
          PY
      - name: Check deployed bridge status
        run: |
          curl -fsS 'https://nomadtips3-telegram-alerts-test.mccarey-supon.workers.dev/bridge/status'
      - name: Read Signal runtime from D1
        working-directory: telegram-alerts/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 execute nomadtips3-paper-db --remote --command="SELECT key,value,updated_at FROM telegram_signal_runtime ORDER BY key;" || true
          npx --yes wrangler@4 d1 execute nomadtips3-paper-db --remote --command="SELECT status,COUNT(*) total FROM telegram_signal_ledger GROUP BY status ORDER BY status;" || true
