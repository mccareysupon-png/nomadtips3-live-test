name: ONE SHOT - Ball46 Menu Count Repair 20260927

on:
  push:
    branches: [ops/ball46-menu-count-repair-20260927]

permissions:
  contents: read

env:
  WWW: https://www.ball46.com
  WORKER: https://ball46-production.mccarey-supon.workers.dev
  CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  GH_TOKEN: ${{ github.token }}
  PATH_SOURCE_SHA: 6276320261cdc10a3835b27e81850c3d4f17f126
  JS_TOKEN: 343-menu-count-repair-20260927a

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mirror exact current Production and lock runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/b46-assets /tmp/b46-before /tmp/b46-runtime /tmp/b46-after /tmp/b46-backup
          mkdir -p /tmp/b46-assets /tmp/b46-runtime /tmp/b46-backup

          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          a=os.environ['CF_ACCOUNT']; t=os.environ['CF_TOKEN']; h={'Authorization':f'Bearer {t}','Accept':'application/json'}
          dep=f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/scripts/ball46-production/deployments'
          with urllib.request.urlopen(urllib.request.Request(dep,headers=h),timeout=30) as r:p=json.load(r)
          ds=(p.get('result') or {}).get('deployments') or []
          if not ds or not ds[0].get('versions'): raise SystemExit('NO_ACTIVE_DEPLOYMENT')
          vid=ds[0]['versions'][0]['version_id']; pathlib.Path('/tmp/pre-version.txt').write_text(vid); print('PRE_VERSION='+vid)
          url=f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/workers/ball46-production/versions/{vid}?include=modules'
          with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=30) as r:vp=json.load(r)
          result=vp.get('result') or {}; mods=result.get('modules') or []
          if len(mods)!=1 or mods[0].get('name')!='index.js' or not mods[0].get('content_base64'): raise SystemExit('RUNTIME_UNEXPECTED')
          runtime=base64.b64decode(mods[0]['content_base64']); pathlib.Path('/tmp/b46-runtime/index.js').write_bytes(runtime)
          pathlib.Path('/tmp/runtime-before.sha').write_text(hashlib.sha256(runtime).hexdigest())
          meta={k:result.get(k) for k in ['main_module','compatibility_date','bindings','assets','usage_model']}
          pathlib.Path('/tmp/runtime-meta-before.json').write_text(json.dumps(meta,sort_keys=True))
          PY

          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          sha=os.environ['PATH_SOURCE_SHA']
          req=urllib.request.Request(f'https://api.github.com/repos/mccareysupon-png/nomadtips3-live-test/git/trees/{sha}?recursive=1',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as r:p=json.load(r)
          prefix='nomad-live-343/'
          paths=sorted(x['path'][len(prefix):] for x in p.get('tree',[]) if x.get('type')=='blob' and x.get('path','').startswith(prefix))
          if len(paths)!=69: raise SystemExit(f'PATH_COUNT_CHANGED:{len(paths)}')
          pathlib.Path('/tmp/asset-paths.txt').write_text('\n'.join(paths)+'\n')
          PY

          nonce="${GITHUB_RUN_ID}-$(date +%s%N)"
          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            mkdir -p "/tmp/b46-assets/$(dirname "$rel")"
            code=$(curl -sS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 -H 'Cache-Control: no-cache' -o "/tmp/b46-assets/$rel" -w '%{http_code}' "$WWW/$rel?menu-base=$nonce-$(date +%s%N)") || true
            [ "$code" = 200 ] || { echo "ASSET_FETCH_${code}:$rel"; exit 1; }
          done < /tmp/asset-paths.txt
          cp -a /tmp/b46-assets /tmp/b46-before
          cp -a /tmp/b46-before /tmp/b46-backup/assets
          cp /tmp/pre-version.txt /tmp/runtime-before.sha /tmp/runtime-meta-before.json /tmp/asset-paths.txt /tmp/b46-backup/
          cp /tmp/b46-runtime/index.js /tmp/b46-backup/index.js
          (cd /tmp/b46-before && while IFS= read -r rel; do sha256sum "$rel"; done < /tmp/asset-paths.txt) > /tmp/before.manifest
          cp /tmp/before.manifest /tmp/b46-backup/
          grep -Fq 'data-stat-market="all"' /tmp/b46-assets/index.html
          grep -Fq 'data-workspace-signal-count' /tmp/b46-assets/index.html
          ! grep -Fq 'BALL46_MENU_COUNT_REPAIR_20260927' /tmp/b46-assets/dashboard-v2-stage3.js
          echo EXACT_CURRENT_PRODUCTION_LOCKED

      - name: Patch menu counts only and cache-bust dashboard JS
        shell: bash
        run: |
          set -euo pipefail
          cat >> /tmp/b46-assets/dashboard-v2-stage3.js <<'JS'

          /* BALL46_MENU_COUNT_REPAIR_20260927 — UI counters only; no odds/feed/signal decision logic changes */
          ;(()=>{
          'use strict';
          const STATS_API='/api/engine/statistics';
          const SIGNALS_API_MENU='/api/engine/signals';
          const qsa=s=>[...document.querySelectorAll(s)];
          const put=(el,v)=>{if(el)el.textContent=String(v)};
          const statKey=r=>{
            const x=String(`${r?.market||''} ${r?.marketLabel||''}`).toLowerCase();
            if(/corner/.test(x))return'corners';
            if(/card/.test(x))return'cards';
            if(/btts|both\s*teams?\s*to\s*score/.test(x))return'btts';
            if(/1x2|match\s*result|moneyline|winner|3way|three\s*way/.test(x))return'1x2';
            if(/asian|handicap|(^|[^a-z])ah([^a-z]|$)|_ah\b/.test(x))return'ah';
            if(/goal|over|under|o\/u|total/.test(x))return'ou';
            return'other';
          };
          const signalKey=s=>{
            const x=String(s?.marketLabel||s?.market||s?.providerMarket||'').toLowerCase();
            if(/corner/.test(x))return'corners';
            if(/card/.test(x))return'cards';
            if(/1x2|match\s*result|moneyline|winner|3way|three\s*way/.test(x))return'1x2';
            if(/asian|handicap|(^|[^a-z])ah([^a-z]|$)/.test(x))return'ah';
            if(/over|under|o\/u|goal[_ -]?line|total/.test(x))return'ou';
            return'other';
          };
          const renderStats=rows=>{
            const c={all:rows.length,'1x2':0,ah:0,ou:0,btts:0,corners:0,cards:0,other:0};
            for(const r of rows)c[statKey(r)]++;
            qsa('[data-stat-market]').forEach(btn=>put(btn.querySelector('b'),c[btn.dataset.statMarket]??0));
          };
          const renderSignals=rows=>{
            const c={all:rows.length,'1x2':0,ah:0,ou:0,corners:0,cards:0,other:0};
            for(const r of rows)c[signalKey(r)]++;
            put(document.querySelector('[data-workspace-signal-count]'),rows.length);
            put(document.querySelector('[data-signal-count]'),rows.length);
            const matchCount=new Set(rows.map(r=>String(r?.fixtureId??'').trim()).filter(Boolean)).size;
            put(document.querySelector('[data-active-match-count]'),matchCount);
            qsa('[data-signal-market-count]').forEach(el=>put(el,c[el.dataset.signalMarketCount]??0));
          };
          async function get(url){const r=await fetch(`${url}${url.includes('?')?'&':'?'}menu_count=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(`HTTP_${r.status}`);return r.json()}
          async function refreshStats(){try{const j=await get(STATS_API);renderStats(Array.isArray(j?.rows)?j.rows:[])}catch(e){console.warn('Menu statistics count refresh failed',e)}}
          async function refreshSignals(){try{const j=await get(SIGNALS_API_MENU);renderSignals(Array.isArray(j?.signals)?j.signals:[])}catch(e){console.warn('Menu signal count refresh failed',e)}}
          function start(){refreshStats();refreshSignals();setInterval(refreshStats,60000);setInterval(refreshSignals,30000)}
          document.addEventListener('ball46:signals-snapshot',e=>renderSignals(Array.isArray(e?.detail?.signals)?e.detail.signals:[]));
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
          })();
          JS

          python3 - <<'PY'
          import hashlib, os, pathlib, re
          root=pathlib.Path('/tmp/b46-assets'); before=pathlib.Path('/tmp/b46-before'); token=os.environ['JS_TOKEN']
          p=root/'index.html'; s=p.read_text(); pat=re.compile(r'dashboard-v2-stage3\.js(?:\?[^"\']*)?')
          if len(pat.findall(s))!=1: raise SystemExit(f'DASHBOARD_SCRIPT_REF_COUNT:{len(pat.findall(s))}')
          p.write_text(pat.sub('dashboard-v2-stage3.js?v='+token,s,1))
          changed=[]
          for rel in pathlib.Path('/tmp/asset-paths.txt').read_text().splitlines():
              if hashlib.sha256((before/rel).read_bytes()).digest()!=hashlib.sha256((root/rel).read_bytes()).digest(): changed.append(rel)
          print('CHANGED_ASSETS=',changed)
          if changed!=['dashboard-v2-stage3.js','index.html']: raise SystemExit('DIFF_GATE_FAILED:'+repr(changed))
          PY
          grep -Fq 'BALL46_MENU_COUNT_REPAIR_20260927' /tmp/b46-assets/dashboard-v2-stage3.js
          grep -Fq "dashboard-v2-stage3.js?v=$JS_TOKEN" /tmp/b46-assets/index.html
          node --check /tmp/b46-assets/dashboard-v2-stage3.js
          echo MENU_COUNT_PATCH_DIFF_PASS

      - name: Dry run exact current package
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/b46-runtime/wrangler.jsonc <<'EOF'
          {"name":"ball46-production","main":"./index.js","compatibility_date":"2026-09-09","no_bundle":true,"services":[{"binding":"ENGINE","service":"nomadtips3-engine-343","environment":"production"},{"binding":"FULL_MARKET","service":"nomadtips3-full-market-343-ball46","environment":"production"},{"binding":"HUB","service":"nomadtips3-5usd-hub-343","environment":"production"}],"assets":{"directory":"/tmp/b46-assets","binding":"ASSETS","html_handling":"none","not_found_handling":"none","run_worker_first":true},"triggers":{"crons":["* * * * *"]}}
          EOF
          cd /tmp/b46-runtime
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc

      - name: Final race guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          a=os.environ['CF_ACCOUNT']; t=os.environ['CF_TOKEN']; h={'Authorization':f'Bearer {t}','Accept':'application/json'}
          url=f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/scripts/ball46-production/deployments'
          with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=30) as r:p=json.load(r)
          cur=((p.get('result') or {}).get('deployments') or [])[0]['versions'][0]['version_id']; pre=pathlib.Path('/tmp/pre-version.txt').read_text().strip()
          print('RACE_VERSION',cur,pre)
          if cur!=pre: raise SystemExit('PRODUCTION_MOVED')
          PY
          for f in dashboard-v2-stage3.js index.html v2-shared.css; do
            curl -fsS -L --retry 4 --retry-all-errors --max-time 30 -H 'Cache-Control: no-cache' "$WWW/$f?race=${GITHUB_RUN_ID}-$(date +%s%N)" -o "/tmp/race-$f"
            [ "$(sha256sum "/tmp/race-$f" | awk '{print $1}')" = "$(sha256sum "/tmp/b46-before/$f" | awk '{print $1}')" ] || { echo "RACE_ASSET_MOVED:$f"; exit 1; }
          done
          echo FINAL_RACE_PASS

      - name: Deploy menu count repair only
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/b46-runtime
          npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc | tee /tmp/deploy.log
          grep -Fq 'Uploaded ball46-production' /tmp/deploy.log

      - name: Verify exact www assets, live APIs and rendered menu counts
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          a=os.environ['CF_ACCOUNT']; t=os.environ['CF_TOKEN']; h={'Authorization':f'Bearer {t}','Accept':'application/json'}
          dep=f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/scripts/ball46-production/deployments'
          with urllib.request.urlopen(urllib.request.Request(dep,headers=h),timeout=30) as r:p=json.load(r)
          vid=((p.get('result') or {}).get('deployments') or [])[0]['versions'][0]['version_id']; print('POST_VERSION='+vid)
          if vid==pathlib.Path('/tmp/pre-version.txt').read_text().strip(): raise SystemExit('VERSION_DID_NOT_ADVANCE')
          url=f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/workers/ball46-production/versions/{vid}?include=modules'
          with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=30) as r:vp=json.load(r)
          result=vp.get('result') or {}; mods=result.get('modules') or []
          runtime=base64.b64decode(mods[0]['content_base64'])
          if hashlib.sha256(runtime).hexdigest()!=pathlib.Path('/tmp/runtime-before.sha').read_text().strip(): raise SystemExit('RUNTIME_CHANGED')
          before=json.loads(pathlib.Path('/tmp/runtime-meta-before.json').read_text()); after={k:result.get(k) for k in ['main_module','compatibility_date','bindings','assets','usage_model']}
          if json.dumps(before,sort_keys=True)!=json.dumps(after,sort_keys=True): raise SystemExit('RUNTIME_META_CHANGED')
          PY

          ok=0
          for pass in 1 2 3 4; do
            rm -rf /tmp/b46-after && mkdir -p /tmp/b46-after
            while IFS= read -r rel; do
              [ -n "$rel" ] || continue
              mkdir -p "/tmp/b46-after/$(dirname "$rel")"
              curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 -H 'Cache-Control: no-cache' "$WWW/$rel?verify=${GITHUB_RUN_ID}-${pass}-$(date +%s%N)" -o "/tmp/b46-after/$rel"
            done < /tmp/asset-paths.txt
            if python3 - <<'PY'
          from pathlib import Path
          import hashlib
          want=Path('/tmp/b46-assets'); got=Path('/tmp/b46-after'); bad=[]
          for rel in Path('/tmp/asset-paths.txt').read_text().splitlines():
              if hashlib.sha256((want/rel).read_bytes()).digest()!=hashlib.sha256((got/rel).read_bytes()).digest(): bad.append(rel)
          print('WWW_ASSET_MISMATCH=',bad)
          raise SystemExit(0 if not bad else 1)
          PY
            then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo WWW_ASSET_VERIFY_FAILED; exit 1; }
          grep -Fq 'BALL46_MENU_COUNT_REPAIR_20260927' /tmp/b46-after/dashboard-v2-stage3.js
          grep -Fq "dashboard-v2-stage3.js?v=$JS_TOKEN" /tmp/b46-after/index.html

          nonce="${GITHUB_RUN_ID}-$(date +%s%N)"
          for ep in board signals statistics; do curl -fsS -L --retry 4 --retry-all-errors --max-time 30 "$WWW/api/engine/$ep?menu-verify=$nonce" -o "/tmp/$ep.json"; done
          python3 - <<'PY'
          import json,re
          b=json.load(open('/tmp/board.json')); s=json.load(open('/tmp/signals.json')); t=json.load(open('/tmp/statistics.json'))
          rows=t.get('rows') or []; sig=s.get('signals') or []
          def sk(r):
              x=(str(r.get('market') or '')+' '+str(r.get('marketLabel') or '')).lower()
              if 'corner' in x:return 'corners'
              if 'card' in x:return 'cards'
              if 'btts' in x or re.search(r'both\s*teams?\s*to\s*score',x):return 'btts'
              if re.search(r'1x2|match\s*result|moneyline|winner|3way|three\s*way',x):return '1x2'
              if re.search(r'asian|handicap|(^|[^a-z])ah([^a-z]|$)|_ah\b',x):return 'ah'
              if re.search(r'goal|over|under|o/u|total',x):return 'ou'
              return 'other'
          c={k:0 for k in ['1x2','ah','ou','btts','corners','cards','other']}
          for r in rows:c[sk(r)]+=1
          print('EXPECTED_MENU_COUNTS',{'all':len(rows),**c,'signals':len(sig),'fixtures':len(b.get('fixtures') or [])})
          if not rows: raise SystemExit('NO_STAT_ROWS')
          open('/tmp/expected-counts.json','w').write(json.dumps({'all':len(rows),**c,'signals':len(sig)}))
          PY

          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          [ -n "$chrome" ] || { echo CHROME_NOT_FOUND; exit 1; }
          "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=12000 --dump-dom "$WWW/index.html?status=live&menu-shot=${GITHUB_RUN_ID}" >/tmp/live-dom.html 2>/tmp/chrome.log
          python3 - <<'PY'
          import json,re
          dom=open('/tmp/live-dom.html').read(); exp=json.load(open('/tmp/expected-counts.json'))
          got={k:int(v) for k,v in re.findall(r'data-stat-market="([^"]+)"[^>]*>.*?<b>(\d+)</b>',dom,re.S)}
          m=re.search(r'data-workspace-signal-count[^>]*>(\d+)</b>',dom); sig=int(m.group(1)) if m else None
          print('RENDERED_STATS_MENU',got); print('RENDERED_SIGNAL_MENU',sig)
          for k in ['all','1x2','ah','ou','btts','corners','cards','other']:
              if got.get(k)!=exp[k]: raise SystemExit(f'STAT_MENU_BAD:{k}:{got.get(k)}!={exp[k]}')
          if sig!=exp['signals']: raise SystemExit(f'SIGNAL_MENU_BAD:{sig}!={exp["signals"]}')
          print('MENU_COUNTS_RENDERED_OK')
          PY
          mkdir -p /tmp/screens
          "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1200 --virtual-time-budget=10000 --screenshot=/tmp/screens/menu-counts.png "$WWW/index.html?status=live&menu-screen=${GITHUB_RUN_ID}" >/tmp/chrome-shot.log 2>&1
          test -s /tmp/screens/menu-counts.png

      - uses: actions/upload-artifact@v4
        with:
          name: ball46-menu-count-repair-${{ github.run_id }}
          path: |
            /tmp/b46-backup
            /tmp/screens/menu-counts.png
            /tmp/live-dom.html
          retention-days: 30
