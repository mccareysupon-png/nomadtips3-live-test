name: BALL46 League Flag Blink Root Fix V8
on:
  push:
    branches: [fix/ball46-flag-flicker-root-cause-20261021]
    paths:
      - '.github/workflows/ball46-flag-no-flicker-v8-deploy.yml'
      - 'deploy-assets/flag-flicker-20261021/flag-patch-v8.mjs'
      - 'deploy-assets/flag-flicker-20261021/deploy-flag-v8.mjs'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax checks and install browser testing
        working-directory: deploy-assets/flag-flicker-20261021
        run: |
          set -euo pipefail
          node --check flag-patch-v8.mjs
          node --check deploy-flag-v8.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Guard real V7 production, test and deploy flags only, rollback if regressions
        working-directory: deploy-assets/flag-flicker-20261021
        run: node deploy-flag-v8.mjs
      - name: Keep browser screenshots and deploy/rollback report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-flag-flicker-v8-production-proof
          path: deploy-assets/flag-flicker-20261021/proof/
          retention-days: 30
          if-no-files-found: warn