name: BALL46 PreMatch League ID Catalog ACTIVE Postdeploy Audit READ ONLY
on:
  push:
    branches:
      - fix/ball46-prematch-league-id-registry-20261122
    paths:
      - .github/workflows/b46-prematch-league-id-postdeploy-verify-20261122.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit latest active version and GET-only league names without any new provider request
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          assert(token&&account);
          const worker='ball46-prematch-only-test-20261120',prefix='qa/prematch-history-20261120/';
          const root='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers';
          const host='https://'+worker+'.mccarey-supon.workers.dev';
          const auth='Bearer '+crypto.createHmac('sha256',token).update('BALL46_PREMATCH_ONLY_V1').digest('hex');
          async function cf(path){
            const r=await fetch(path,{headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
            const j=await r.json();assert(r.ok&&j.success,JSON.stringify(j.errors));return j.result;
          }
          async function version(w){
            const r=await cf(root+'/scripts/'+w+'/deployments?per_page=1');
            return r.deployments?.[0]?.versions?.[0]?.version_id;
          }
          const active=await version(worker);
          const v=await cf(root+'/workers/'+worker+'/versions/'+active+'?include=modules');
          const changed=['league-name-cache.mjs','stored-prematch-feed.mjs','prematch-only-worker.mjs'];
          for(const n of changed){
            const m=v.modules.find(x=>x.name===n);
            assert(m?.content_base64,'MISSING_ACTIVE_MODULE_'+n);
            assert.equal(Buffer.from(m.content_base64,'base64').toString('utf8'),fs.readFileSync(prefix+n,'utf8'),'ACTIVE_SOURCE_NOT_LATEST_'+n);
          }
          async function owner(p){
            const r=await fetch(host+p,{headers:{authorization:auth},cache:'no-store',signal:AbortSignal.timeout(15000)});
            if(!r.ok)throw Error('OWNER_'+p+'_'+r.status);return r.json();
          }
          let state=null,attempts=0,err;
          for(let i=0;i<45;i++){
            attempts=i+1;
            try{
              // existing cached HUB snapshot only - never upstream endpoint.
              const d=await owner('/preview-data');
              const names=await owner('/league-name-audit');
              const hcr=await owner('/history-cargo-registry?detail=0');
              const cargo=await owner('/history-cargo-full');
              assert.equal(names.code,'PREMATCH_LEAGUE_ID_CATALOG_V1');
              assert.equal(hcr.registry.code,'HCR-V1');
              assert.equal(cargo.registry,'HISTORY-CARGO-FULL-V1');
              assert.equal(names.providerCalls,0);
              const monitor=d.testMonitor?.monitor||{};
              const phases={};const missingByPhase={};const missingByStatus={};const missingSamples=[];let named=0;
              for(const p of d.testLedger?.rows||[]){
                const item=monitor[String(p.fixture_id)]||{},ph=item.phase||'UNKNOWN';
                if(item.leagueName){named++;phases[ph]=(phases[ph]||0)+1}
                else{
                  missingByPhase[ph]=(missingByPhase[ph]||0)+1;
                  missingByStatus[p.status]=(missingByStatus[p.status]||0)+1;
                  if(missingSamples.length<10)missingSamples.push({id:p.fixture_id,home:p.home,away:p.away,pickStatus:p.status,phase:ph});
                }
              }
              state={active,attempts,names,preview:{rows:d.testLedger.rows.length,named,missing:d.testLedger.rows.length-named,namedByPhase:phases,missingByPhase,missingByStatus,missingSamples},
                finishedResults:hcr.inventory.finishedFixtures,fullCargoRounds:cargo.roundsTracked,
                protectedVersions:{
                  production:await version('ball46-production'),
                  engine:await version('nomadtips3-engine-343'),
                  hub:await version('nomadtips3-5usd-hub-343')},
                providerCallsAdded:0,productionWrites:0};
              break;
            }catch(e){err=e;if(i<44)await new Promise(r=>setTimeout(r,1500))}
          }
          assert(state,'ACTIVE_ROUTE_NOT_READY_'+String(err));
          console.log('B46_PREMATCH_LEAGUE_ID_ACTIVE_VERIFIED '+JSON.stringify(state));
          JS
