name: BALL46 read-only quota and season audit
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-history-quota-season-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspect active HUB and cache without upstream traffic
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node qa/prematch-history-20261120/quota-season-audit.mjs
