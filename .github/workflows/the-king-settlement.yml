name: The King — Settlement Wheel

on:
  workflow_dispatch:
  schedule:
    - cron: '20 * * * *'

permissions:
  contents: write

concurrency:
  group: the-king-settlement-wheel
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install scraper dependencies
        run: python3 -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Engine self-test
        run: python3 .github/scripts/the_king_engine.py self-test

      - name: Settle verified pending picks
        run: python3 .github/scripts/the_king_engine.py settle

      - name: Publish verified results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add the-king-feed.json the-king-state.json
          if git diff --cached --quiet; then
            echo 'No The King settlement change.'
            exit 0
          fi
          git commit -m "The King settlement $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
