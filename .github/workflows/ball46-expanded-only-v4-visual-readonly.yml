name: BALL46 V4 Read Only Visual QA
on:
  push:
    branches: [fix/ball46-featured-expanded-only-20261021]
    paths:
      - '.github/workflows/ball46-expanded-only-v4-visual-readonly.yml'
      - 'deploy-assets/expanded-match-mobile-v4/verify-visual-readonly.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current production visually, no code change or deploy
        working-directory: deploy-assets/expanded-match-mobile-v4
        run: |
          npm install --no-save --ignore-scripts puppeteer-core@24
          node verify-visual-readonly.mjs
      - name: Keep browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-expanded-only-v4-visible-readonly
          path: deploy-assets/expanded-match-mobile-v4/visual-proof/
          retention-days: 10
          if-no-files-found: warn