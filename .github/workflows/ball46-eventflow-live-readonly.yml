name: BALL46 Event Flow V2 Read-Only Browser Baseline
on:
  push:
    branches: [codex/ball46-eventflow-zones-20261026]
    paths:
      - 'deploy-assets/eventflow-zones-20261026/audit-live.mjs'
      - '.github/workflows/ball46-eventflow-live-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install read-only browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture public PC/mobile baseline (NO DEPLOY)
        run: node deploy-assets/eventflow-zones-20261026/audit-live.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-eventflow-v2-live-baseline
          path: deploy-assets/eventflow-zones-20261026/audit-live/
          retention-days: 14
