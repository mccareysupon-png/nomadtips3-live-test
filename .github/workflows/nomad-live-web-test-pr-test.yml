name: NOMAD Live Web TEST PR Test

on:
  pull_request:
    paths:
      - 'nomad-live/**'
      - 'nomad-live-web-test/**'
      - '.github/workflows/nomad-live-web-test-pr-test.yml'
      - '.github/workflows/nomad-live-web-test-deploy.yml'

permissions:
  contents: read

jobs:
  validate-sealed-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate SEALED TEST Web and frontend isolation
        run: |
          node --check nomad-live-web-test/src/index.js
          node --test nomad-live-web-test/test/*.test.js

      - name: Dry-run the exact Static Assets Worker bundle
        working-directory: nomad-live-web-test
        run: npx --yes wrangler@4.92.0 deploy --dry-run
