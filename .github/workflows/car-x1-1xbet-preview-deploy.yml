# X1 preview deploy workflow — on-demand scan, no cron trigger
name: Deploy X1 1xBet Detector Preview

on:
  push:
    branches:
      - work/car-x1-1xbet-detector
    paths:
      - 'car-x1-1xbet-detector/**'
      - '.github/workflows/car-x1-1xbet-preview-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PREVIEW_URL: https://nomadtips3-x1-preview.mccarey-supon.workers.dev

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Probe MelBet public live feeds
        id: melbet_probe
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error
          bases=['https://my.melbet.com','https://th.melbet.com','https://melbet.com']
          paths=['/service-api/LiveFeed/Get1x2_VZip','/LiveFeed/Get1x2_VZip']
          qs=urllib.parse.urlencode({'sports':1,'count':20,'lng':'en','mode':4,'getEmpty':'true'})
          headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'Accept':'application/json,text/plain,*/*',
            'X-Requested-With':'XMLHttpRequest',
            'Referer':'https://my.melbet.com/en/live'
          }
          out=[]
          for base in bases:
            for path in paths:
              url=f'{base}{path}?{qs}'
              row={'url':url}
              try:
                req=urllib.request.Request(url,headers=headers)
                with urllib.request.urlopen(req,timeout=15) as r:
                  body=r.read(250000)
                  text=body.decode('utf-8','replace')
                  row.update(status=r.status,contentType=r.headers.get('content-type',''),finalUrl=r.geturl(),prefix=text[:120].replace('\n',' '))
                  try:
                    data=json.loads(text)
                    row['json']=True
                    if isinstance(data,dict):
                      value=data.get('Value')
                      row['events']=len(value) if isinstance(value,list) else None
                      row['keys']=list(data)[:12]
                    elif isinstance(data,list):
                      row['events']=len(data)
                  except Exception:
                    row['json']=False
              except Exception as e:
                row.update(error=type(e).__name__+': '+str(e)[:300],json=False)
              out.append(row)
          ok=next((x for x in out if x.get('json') and (x.get('events') is None or x.get('events',0)>=0)),None)
          result={'ok':bool(ok),'winner':ok,'attempts':out}
          import os
          os.makedirs('.deploy-status',exist_ok=True)
          with open('.deploy-status/melbet-probe.json','w',encoding='utf-8') as f: json.dump(result,f,ensure_ascii=False,indent=2)
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Persist MelBet probe
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy-status/melbet-probe.json
          git commit -m "Record MelBet feed probe" || true
          git push || true

      - name: Validate X1 source
        id: validate
        run: |
          node --check car-x1-1xbet-detector/src/index.js
          node --check car-x1-1xbet-detector/web/app.js
          node --check car-x1-1xbet-detector/web/statistics.js
          test -s car-x1-1xbet-detector/web/index.html
          test -s car-x1-1xbet-detector/web/statistics.html
          grep -q '1xBet DIRECT' car-x1-1xbet-detector/web/index.html
          grep -q 'X1_SQLITE_HISTORY_V1' car-x1-1xbet-detector/src/index.js
          grep -q 'new_sqlite_classes' car-x1-1xbet-detector/wrangler.jsonc
          ! grep -R -q 'GOALOO' car-x1-1xbet-detector

      - name: Validate Cloudflare credentials
        id: credentials
        run: |
          test -n "$CF_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Deploy X1 detector preview
        id: deploy
        continue-on-error: true
        working-directory: car-x1-1xbet-detector
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          npx --yes wrangler@4 deploy 2>&1 | tee /tmp/x1-deploy.log
          CODE=${PIPESTATUS[0]}
          ERROR_LINE=$(grep -Ei 'error|failed|code:' /tmp/x1-deploy.log | tail -n 5 | tr '\n' ' ' | sed 's/["\\]/ /g;s/[[:space:]]\+/ /g' | cut -c1-500)
          if [ -z "$ERROR_LINE" ]; then
            ERROR_LINE=$(tail -n 8 /tmp/x1-deploy.log | tr '\n' ' ' | sed 's/["\\]/ /g;s/[[:space:]]\+/ /g' | cut -c1-500)
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "error=$ERROR_LINE" >> "$GITHUB_OUTPUT"
          exit "$CODE"

      - name: Smoke test X1 preview
        id: smoke
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          const base=process.env.PREVIEW_URL, stamp=Date.now();
          const root=await fetch(`${base}/?smoke=${stamp}`,{cache:'no-store'});
          const html=await root.text();
          if(!root.ok||!html.includes('Signal Detector')||!html.includes('1xBet DIRECT')) throw new Error(`root failed ${root.status}`);
          const stats=await fetch(`${base}/statistics.html?smoke=${stamp}`,{cache:'no-store'});
          const statsHtml=await stats.text();
          if(!stats.ok||!statsHtml.includes('Statistics')||!statsHtml.includes('Locked 1xBet signal history')) throw new Error(`statistics failed ${stats.status}`);
          const health=await fetch(`${base}/health?t=${stamp}`,{cache:'no-store'}).then(r=>r.json());
          if(!health.ok||health.mode!=='DIRECT_1XBET'||health.source!=='1XBET_DIRECT') throw new Error(`health contract failed ${JSON.stringify(health).slice(0,400)}`);
          const live=await fetch(`${base}/live?t=${stamp}`,{cache:'no-store'}).then(r=>r.json());
          if(!live.ok||!Array.isArray(live.matches)||live.source!=='1XBET_DIRECT') throw new Error(`live contract failed ${JSON.stringify(live).slice(0,400)}`);
          const history=await fetch(`${base}/history?page=1&limit=25&range=ALL&t=${stamp}`,{cache:'no-store'}).then(r=>r.json());
          if(!history.ok||history.historyStorage!=='X1_SQLITE_HISTORY_V1'||!Array.isArray(history.records)||!history.summary) throw new Error('history contract failed');
          console.log('X1 preview smoke tests: OK');
          NODE

      - name: Report deploy stages
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATE: ${{ steps.validate.outcome }}
          CREDENTIALS: ${{ steps.credentials.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          DEPLOY_ERROR: ${{ steps.deploy.outputs.error }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          post_status() {
            CONTEXT="$1"; OUTCOME="$2"; DESCRIPTION="$3"
            case "$OUTCOME" in success) STATE=success;; failure) STATE=failure;; *) STATE=error;; esac
            DESCRIPTION=$(printf '%s' "$DESCRIPTION" | sed 's/["\\]/ /g' | cut -c1-130)
            curl -fsS -L -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -d "{\"state\":\"$STATE\",\"context\":\"$CONTEXT\",\"description\":\"$DESCRIPTION\",\"target_url\":\"$PREVIEW_URL\"}"
          }
          post_status "x1-preview/validate" "$VALIDATE" "source validation: $VALIDATE"
          post_status "x1-preview/credentials" "$CREDENTIALS" "Cloudflare credentials: $CREDENTIALS"
          if [ "$DEPLOY" = "success" ]; then
            post_status "x1-preview/deploy" "$DEPLOY" "Cloudflare deploy: success"
          else
            post_status "x1-preview/deploy" "$DEPLOY" "deploy failed: $DEPLOY_ERROR"
          fi
          post_status "x1-preview/smoke" "$SMOKE" "preview smoke test: $SMOKE"

      - name: Persist deploy diagnostics
        if: always()
        env:
          VALIDATE: ${{ steps.validate.outcome }}
          CREDENTIALS: ${{ steps.credentials.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          DEPLOY_CODE: ${{ steps.deploy.outputs.code }}
          DEPLOY_ERROR: ${{ steps.deploy.outputs.error }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          mkdir -p .deploy-status
          python - <<'PY'
          import json, os
          data = {
            "validate": os.environ.get("VALIDATE"),
            "credentials": os.environ.get("CREDENTIALS"),
            "deploy": os.environ.get("DEPLOY"),
            "deployCode": os.environ.get("DEPLOY_CODE"),
            "deployError": os.environ.get("DEPLOY_ERROR"),
            "smoke": os.environ.get("SMOKE"),
            "commit": os.environ.get("GITHUB_SHA"),
            "previewUrl": os.environ.get("PREVIEW_URL")
          }
          with open('.deploy-status/x1-preview.json','w',encoding='utf-8') as f:
              json.dump(data,f,ensure_ascii=False,indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy-status/x1-preview.json
          git commit -m "Record X1 preview diagnostics" || exit 0
          git push

      - name: Fail workflow when preview is not healthy
        if: always() && (steps.deploy.outcome != 'success' || steps.smoke.outcome != 'success')
        run: exit 1
