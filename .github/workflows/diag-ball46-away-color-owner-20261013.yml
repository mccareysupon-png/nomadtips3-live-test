name: DIAG Ball46 Away Color Owner 20261013

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-ball46-away-color-owner-20261013.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-performance-chart-market-style-20261012
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts acorn@8
      - name: Locate away-team color owner
        working-directory: deploy-assets/performance-chart-market-style-20261012
        run: |
          node --input-type=module <<'NODE'
          import {publicFile} from '../daily-performance-20261005/production.mjs';
          for(const file of ['color-semantics-343.css','dashboard-v2.css','dashboard-v2-tune.css']){
            const s=(await publicFile('/'+file)).toString('utf8');
            console.log('\n===== '+file+' =====');
            for(const needle of ['#8a6a00','8a6a00','feature-score','featured-away','data-featured-away','.away']){
              let from=0,n=0;
              while(true){
                const i=s.toLowerCase().indexOf(needle.toLowerCase(),from);if(i<0)break;
                console.log('\n--- '+needle+' @ '+i+' ---\n'+s.slice(Math.max(0,i-1200),Math.min(s.length,i+4200)));
                from=i+needle.length;if(++n>=20)break;
              }
            }
          }
          NODE
