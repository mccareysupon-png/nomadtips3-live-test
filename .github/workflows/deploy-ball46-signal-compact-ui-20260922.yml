          p=Path('nomad-live-343/singlepage-workspace-343.css')
          sp=p.read_text()
          old='/* signal subpage inherits proven NEXT cards, but stays inside page 1 */\n.sp-signal .next-kpis{margin:0 0 10px}.sp-signal .next-market-strip{margin:0 0 10px}.sp-signal .next-panel{margin:0}.sp-signal .next-note{margin:10px 2px 0}'
          new='/* signal subpage canonical compact geometry */\n.sp-signal .workspace-view-head{min-height:46px;margin:0 0 8px;padding:8px 11px}.sp-signal .workspace-view-head .kicker,.sp-signal .workspace-view-head p{display:none}.sp-signal .workspace-view-head h2{margin:0;font-size:14px;line-height:1.1}.sp-signal .workspace-view-state{font-size:8px}.sp-signal .next-kpis{margin:0 0 7px}.sp-signal .next-market-strip{margin:0 0 7px}.sp-signal .next-panel{margin:0}.sp-signal .next-note{margin:7px 2px 0;font-size:8px}\n@media(max-width:760px){.sp-signal .workspace-view-head{min-height:42px;margin-bottom:6px;padding:7px 9px}.sp-signal .workspace-view-head h2{font-size:13px}.sp-signal .workspace-view-state{font-size:7.5px}}'
          sp=replace_once(sp,old,new,'SINGLEPAGE_SIGNAL_BLOCK')
          sp='/* BALL46_SIGNAL_WORKSPACE_COMPACT_20260922 */\n'+sp
          p.write_text(sp)

          p=Path('nomad-live-343/index.html')
          h=p.read_text()
          h,n1=re.subn(r'ball46-next\.css(?:\?[^"\']*)?', 'ball46-next.css?v=343-signal-compact-20260922a', h)
          h,n2=re.subn(r'singlepage-workspace-343\.css(?:\?[^"\']*)?', 'singlepage-workspace-343.css?v=343-signal-compact-20260922a', h)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'CACHE_REF_COUNTS:{n1}:{n2}')
          p.write_text(h)
          PY

          grep -Fq 'BALL46_SIGNAL_COMPACT_CANONICAL_20260922' nomad-live-343/ball46-next.css
          grep -Fq 'BALL46_SIGNAL_WORKSPACE_COMPACT_20260922' nomad-live-343/singlepage-workspace-343.css
          grep -Fq 'min-height:58px;display:grid;grid-template-columns:minmax(230px,1.5fr)' nomad-live-343/ball46-next.css
          grep -Fq '.next-kpi{min-height:62px' nomad-live-343/ball46-next.css
          grep -Fq '.next-kpi{min-height:56px' nomad-live-343/ball46-next.css
          grep -Fq '.next-market-strip{display:flex;overflow-x:auto' nomad-live-343/ball46-next.css
          grep -Fq '.sp-signal .workspace-view-head{min-height:46px' nomad-live-343/singlepage-workspace-343.css
          grep -Fq '343-signal-compact-20260922a' nomad-live-343/index.html
          git diff --check

          while read -r expected name; do
            actual=$(sha256sum "nomad-live-343/$name" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "UNRELATED_LOCAL_CHANGED:$name"; exit 1; }
          done < /tmp/unchanged.sha

      - name: Dry run Production package
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy Signal compact UI
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify Production and core continuity
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 15); do
            if curl -fsS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 "$BALL46_WORKER/index.html?signal-compact-after=${GITHUB_RUN_ID}-${n}" -o /tmp/index.after.html \
              && grep -Fq '343-signal-compact-20260922a' /tmp/index.after.html; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo 'SIGNAL_COMPACT_INDEX_NOT_PROPAGATED'; exit 1; }
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/ball46-next.css?verify=${GITHUB_RUN_ID}" -o /tmp/ball46-next.after.css
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/singlepage-workspace-343.css?verify=${GITHUB_RUN_ID}" -o /tmp/singlepage.after.css
          grep -Fq 'BALL46_SIGNAL_COMPACT_CANONICAL_20260922' /tmp/ball46-next.after.css
          grep -Fq 'BALL46_SIGNAL_WORKSPACE_COMPACT_20260922' /tmp/singlepage.after.css
          grep -Fq '.next-kpi{min-height:62px' /tmp/ball46-next.after.css
          grep -Fq '.next-market-strip{display:flex;overflow-x:auto' /tmp/ball46-next.after.css

          while read -r expected name; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/$name?signal-compact-protected=${GITHUB_RUN_ID}" -o "/tmp/protected-${name//\//_}"
            actual=$(sha256sum "/tmp/protected-${name//\//_}" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "UNRELATED_DEPLOYED_CHANGED:$name"; exit 1; }
          done < /tmp/unchanged.sha

          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?signal-compact-final=${GITHUB_RUN_ID}" -o /tmp/board-after.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?signal-compact-final=${GITHUB_RUN_ID}" -o /tmp/signals-after.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/statistics?signal-compact-final=${GITHUB_RUN_ID}" -o /tmp/stats-after.json
          node - <<'NODE'
          const fs=require('fs'),b=JSON.parse(fs.readFileSync('/tmp/board-after.json')),s=JSON.parse(fs.readFileSync('/tmp/signals-after.json')),t=JSON.parse(fs.readFileSync('/tmp/stats-after.json'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures))throw Error('POST_BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals))throw Error('POST_SIGNALS_UNHEALTHY');
          if(t?.ok!==true||!Array.isArray(t?.rows))throw Error('POST_STATS_UNHEALTHY');
          console.log('BALL46_SIGNAL_COMPACT_OK',{fixtures:b.fixtures.length,signals:s.signals.length,stats:t.rows.length});
          NODE

          pub=0
          for n in $(seq 1 10); do
            if curl -fsS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 "$BALL46_PUBLIC/?signal-compact-public=${GITHUB_RUN_ID}-${n}" -o /tmp/public.html \
              && grep -Fq '343-signal-compact-20260922a' /tmp/public.html; then pub=1; break; fi
            sleep 3
          done
          [ "$pub" = 1 ] || { echo 'PUBLIC_SIGNAL_COMPACT_NOT_PROPAGATED'; exit 1; }
