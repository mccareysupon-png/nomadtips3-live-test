           '.next-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:8px}.next-kpis.five{grid-template-columns:repeat(5,minmax(0,1fr))}.next-kpi{min-height:62px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--shadow-soft)}.next-kpi .label{display:block;color:var(--muted);font-size:8px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}.next-kpi strong{display:block;margin-top:3px;font-size:18px;line-height:1;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.next-kpi small{display:block;margin-top:3px;color:var(--muted);font-size:7.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.next-kpi.good strong{color:var(--green)}.next-kpi.warn strong{color:var(--amber)}','KPI_BLOCK'),
