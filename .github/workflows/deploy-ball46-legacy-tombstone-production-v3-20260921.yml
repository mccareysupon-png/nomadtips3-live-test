name: Deploy Ball46 Legacy Tombstones Production V3 20260921

on:
  push:
    branches: [work/ball46-remove-legacy-pages-20260921]
    paths:
      - '.github/workflows/deploy-ball46-legacy-tombstone-production-v3-20260921.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BASE_SHA: 7c9e26118244dc14a676e7f887d97bdf899553fd
  WORKER: https://ball46-production.mccarey-supon.workers.dev
  WWW: https://www.ball46.com
  APEX: https://ball46.com

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Guard isolated cleanup package
        shell: bash
        run: |
          set -euo pipefail
          for p in workers/nomadtips3-engine-343/src/index.js workers/nomadtips3-343-preview/wrangler.ball46.jsonc nomad-live-343/index.html nomad-live-343/dashboard-v2-stage3.js nomad-live-343/bulk-odds-compat-343.js nomad-live-343/full-market-bookmaker-343.js nomad-live-343/live-summary-full-odds-343.js nomad-live-343/expanded-match-343.js nomad-live-343/signal-next.js nomad-live-343/singlepage-workspace-343.js; do
            git diff --quiet "$BASE_SHA"..HEAD -- "$p" || { echo "FORBIDDEN PAGE1 CHANGE: $p"; exit 1; }
          done
          node --check workers/nomadtips3-343-preview/src/index.js
          grep -Fq 'LEGACY_STANDALONE_PATHS' workers/nomadtips3-343-preview/src/index.js
          grep -Fq 'status:410' workers/nomadtips3-343-preview/src/index.js
          for p in signal.html statistics.html signal-next.html statistics-next.html signal.js statistics.js statistics-next.js; do test ! -e "nomad-live-343/$p"; done
          ! grep -Eq 'signal\.html|statistics\.html' nomad-live-343/sitemap.xml

      - name: Capture Odds baseline with retry
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 6); do
            if curl -fsS --connect-timeout 6 --max-time 20 "$WORKER/api/engine/board?pre=$GITHUB_RUN_ID-$n" -o /tmp/preboard.json; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          node - <<'NODE'
          const fs=require('fs'),b=JSON.parse(fs.readFileSync('/tmp/preboard.json'));
          if(b?.ok!==true||!Array.isArray(b.fixtures))throw Error('pre board unhealthy');
          function has(v){if(Array.isArray(v))return v.length>0;if(!v||typeof v!=='object')return false;const c=[v.bookmakers,v.odds,v.markets,v?.data?.bookmakers,v?.data?.odds,v?.data?.markets];return c.some(x=>Array.isArray(x)?x.length>0:!!(x&&typeof x==='object'&&Object.keys(x).length))||Object.keys(v).some(k=>/bet365|pinnacle|crown|1xbet|12bet|interwetten|macauslot|18bet|vcbet|easybets|bookmaker/i.test(String(k)))}
          const odds=b.fixtures.filter(f=>has(f?.providerOdds)||has(f?.fullOdds)||has(f?.odds)).length;fs.writeFileSync('/tmp/pre.json',JSON.stringify({fixtures:b.fixtures.length,odds}));console.log({fixtures:b.fixtures.length,odds});
          NODE

      - name: Validate Cloudflare credentials
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Dry-run production cleanup
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy production cleanup
        id: deploy
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify Worker tombstones first
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 20); do
            a=$(curl -sS --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}' "$WORKER/signal.html?v3=$GITHUB_RUN_ID-$n" || true)
            b=$(curl -sS --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}' "$WORKER/statistics.html?v3=$GITHUB_RUN_ID-$n" || true)
            echo "try=$n signal=$a stats=$b"
            if [ "$a" = 410 ] && [ "$b" = 410 ]; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          for p in signal-next.html statistics-next.html signal.js statistics.js statistics-next.js signal-focus-343.js v2-header.css; do
            code=$(curl -sS --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}' "$WORKER/$p?v3=$GITHUB_RUN_ID" || true); echo "$p -> $code"; test "$code" = 410;
          done

      - name: Verify Worker Page 1 and Odds with retry
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 6 --max-time 20 "$WORKER/?v3=$GITHUB_RUN_ID" -o /tmp/home.html
          grep -Fq 'signal-next.js' /tmp/home.html
          grep -Fq 'singlepage-workspace-343.js' /tmp/home.html
          ok=0
          for n in $(seq 1 8); do
            if curl -fsS --connect-timeout 6 --max-time 20 "$WORKER/api/engine/board?v3=$GITHUB_RUN_ID-$n" -o /tmp/board.json; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          node - <<'NODE'
          const fs=require('fs'),pre=JSON.parse(fs.readFileSync('/tmp/pre.json')),b=JSON.parse(fs.readFileSync('/tmp/board.json'));
          function has(v){if(Array.isArray(v))return v.length>0;if(!v||typeof v!=='object')return false;const c=[v.bookmakers,v.odds,v.markets,v?.data?.bookmakers,v?.data?.odds,v?.data?.markets];return c.some(x=>Array.isArray(x)?x.length>0:!!(x&&typeof x==='object'&&Object.keys(x).length))||Object.keys(v).some(k=>/bet365|pinnacle|crown|1xbet|12bet|interwetten|macauslot|18bet|vcbet|easybets|bookmaker/i.test(String(k)))}
          if(b?.ok!==true||!Array.isArray(b.fixtures))throw Error('post board unhealthy');const odds=b.fixtures.filter(f=>has(f?.providerOdds)||has(f?.fullOdds)||has(f?.odds)).length;if(pre.fixtures>0&&b.fixtures.length===0)throw Error('fixtures zero');if(pre.odds>0&&odds===0)throw Error(`odds lost ${pre.odds}->0`);console.log('WORKER PASS',{before:pre,after:{fixtures:b.fixtures.length,odds}});
          NODE

      - name: Verify WWW and Apex tombstones and Page 1
        shell: bash
        run: |
          set -euo pipefail
          for base in "$WWW" "$APEX"; do
            ok=0
            for n in $(seq 1 25); do
              h=$(curl -sS --connect-timeout 5 --max-time 10 -o /tmp/site.html -w '%{http_code}' "$base/?v3=$GITHUB_RUN_ID-$n" || true)
              s=$(curl -sS --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}' "$base/signal.html?v3=$GITHUB_RUN_ID-$n" || true)
              t=$(curl -sS --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}' "$base/statistics.html?v3=$GITHUB_RUN_ID-$n" || true)
              echo "$base try=$n home=$h signal=$s stats=$t"
              if [ "$h" = 200 ] && grep -Fq 'singlepage-workspace-343.js' /tmp/site.html && [ "$s" = 410 ] && [ "$t" = 410 ]; then ok=1; break; fi
              sleep 3
            done
            test "$ok" = 1
          done
          ok=0
          for n in $(seq 1 8); do
            if curl -fsS --connect-timeout 6 --max-time 20 "$WWW/api/engine/board?v3final=$GITHUB_RUN_ID-$n" -o /tmp/wwwboard.json; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          node - <<'NODE'
          const fs=require('fs'),pre=JSON.parse(fs.readFileSync('/tmp/pre.json')),b=JSON.parse(fs.readFileSync('/tmp/wwwboard.json'));function has(v){if(Array.isArray(v))return v.length>0;if(!v||typeof v!=='object')return false;const c=[v.bookmakers,v.odds,v.markets,v?.data?.bookmakers,v?.data?.odds,v?.data?.markets];return c.some(x=>Array.isArray(x)?x.length>0:!!(x&&typeof x==='object'&&Object.keys(x).length))||Object.keys(v).some(k=>/bet365|pinnacle|crown|1xbet|12bet|interwetten|macauslot|18bet|vcbet|easybets|bookmaker/i.test(String(k)))};if(b?.ok!==true||!Array.isArray(b.fixtures))throw Error('www board unhealthy');const odds=b.fixtures.filter(f=>has(f?.providerOdds)||has(f?.fullOdds)||has(f?.odds)).length;if(pre.odds>0&&odds===0)throw Error('www odds lost');console.log('WWW PASS',{fixtures:b.fixtures.length,odds});
          NODE

      - name: Automatic rollback to Performance V1 on any failure
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/ball46-v3-rollback "$BASE_SHA"
          cd /tmp/ball46-v3-rollback/workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc
          sleep 5
          curl -fsS --connect-timeout 6 --max-time 30 "$WORKER/api/engine/board?rollback=$GITHUB_RUN_ID" -o /tmp/rb.json
          node - <<'NODE'
          const fs=require('fs'),b=JSON.parse(fs.readFileSync('/tmp/rb.json'));if(b?.ok!==true||!Array.isArray(b.fixtures))throw Error('rollback unhealthy');console.log('PERFORMANCE V1 RESTORED',{fixtures:b.fixtures.length});
          NODE
