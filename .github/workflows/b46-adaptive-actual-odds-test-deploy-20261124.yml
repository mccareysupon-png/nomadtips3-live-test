name: BALL46 fix actual 2.5 odds in Adaptive research TEST backend 20261124
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-adaptive-actual-odds-test-deploy-20261124.yml]
permissions: {contents: read}
concurrency:
  group: ball46-prematch-only-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check qa/prematch-history-20261120/b46-adaptive-actual-odds-test-deploy-20261124.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/b46-adaptive-ou-research-v1.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-value-screener-v2.test.mjs
      - run: node qa/prematch-history-20261120/b46-adaptive-actual-odds-test-deploy-20261124.mjs
