name: DEPLOY Ball46 Footer brand logo V2 20261001

on:
  push:
    branches: [ops/ball46-footer-links-20261001]
    paths: ['.github/workflows/deploy-ball46-footer-brand-logo-v2-20261001.yml']

permissions:
  contents: read

env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  BALL46_URL: https://ball46.com

jobs:
  footer-brand-logo-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Lock current Production and capture baseline
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          mkdir -p /tmp/before /tmp/after /tmp/modules
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=3" -H "$AUTH" -o /tmp/deploy-before.json
          CUR=$(node -e "const j=require('/tmp/deploy-before.json');const d=j.result?.deployments?.[0];if(!d||d.versions?.length!==1||Number(d.versions[0].percentage)!==100)process.exit(2);process.stdout.write(String(d.versions[0].version_id||''))")
          [ -n "$CUR" ] || exit 2
          echo -n "$CUR" >/tmp/base-version
          K="${GITHUB_RUN_ID}-$(date +%s%N)"
          curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/index.html?before=$K" -o /tmp/before/index.html
          curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/legal.css?before=$K" -o /tmp/before/legal.css
          curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/ball46-footer.css?before=$K" -o /tmp/before/footer.css
          pages='information about user-guide methodology privacy terms disclaimer affiliate-disclosure responsible-gambling cookies contact'
          for p in $pages; do curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/$p.html?before=$K-$p" -o "/tmp/before/$p.html"; done
          curl -fsS "$BALL46_URL/api/engine/health?before=$K" -o /tmp/before/e.json
          curl -fsS "$BALL46_URL/api/full-market/health?before=$K" -o /tmp/before/f.json
          curl -fsS "$BALL46_URL/api/engine/statistics?before=$K" -o /tmp/before/s.json
          node - <<'NODE'
          const fs=require('fs');const idx=fs.readFileSync('/tmp/before/index.html','utf8'),foot=idx.match(/<footer\b[^>]*id=["']b46-site-footer-v1["'][\s\S]*?<\/footer>/i);if(!foot)throw Error('GLOBAL_FOOTER_MISSING');if(!foot[0].includes('/index.html?view=signal')||!foot[0].includes('/index.html?view=statistics'))throw Error('CURRENT_LINKS_NOT_FOUND');const e=require('/tmp/before/e.json'),f=require('/tmp/before/f.json'),s=require('/tmp/before/s.json');if(e.ok!==true||f.ok!==true||s.ok!==true)throw Error('BACKEND_NOT_OK');fs.writeFileSync('/tmp/footer-before.html',foot[0]);fs.writeFileSync('/tmp/backend-before.json',JSON.stringify({engine:e.version,fullMarket:f.version,settlementRevision:s.settlementRevision}));console.log('BASE',fs.readFileSync('/tmp/base-version','utf8'));
          NODE

      - name: Build Footer-logo-only source patch
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"; BASE=$(cat /tmp/base-version)
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/workers/$SCRIPT_NAME/versions/$BASE?include=modules" -H "$AUTH" -o /tmp/version.json
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');const j=require('/tmp/version.json');if(j.success!==true)throw Error('VERSION_FETCH_FAILED');const r=j.result;if(!r?.main_module||!r.modules?.length)throw Error('MODULES_MISSING');const meta=[];for(const m of r.modules){const b=Buffer.from(m.content_base64,'base64'),p=path.join('/tmp/modules',m.name);fs.mkdirSync(path.dirname(p),{recursive:true});fs.writeFileSync(p,b);meta.push({name:m.name,content_type:m.content_type,beforeSha:crypto.createHash('sha256').update(b).digest('hex')});}
          const main=r.main_module,p=path.join('/tmp/modules',main),orig=fs.readFileSync(p,'utf8');if(!orig.includes('__B46_LEGAL_CSS_20261001__'))throw Error('LEGAL_CSS_MARKER_MISSING');if(orig.includes('B46_FOOTER_BRAND_LOGO_20261001'))throw Error('PATCH_ALREADY_PRESENT');
          const legalStart=orig.indexOf('const __B46_LEGAL_PAGES__='),legalCssStart=orig.indexOf('const __B46_LEGAL_CSS_20261001__=',legalStart),footerHtmlStart=orig.indexOf('const __B46_FOOTER_HTML__=',legalCssStart),footerCssStart=orig.indexOf('const __B46_FOOTER_CSS__=',footerHtmlStart),afterFooterCss=orig.indexOf('function __b46Text',footerCssStart);if([legalStart,legalCssStart,footerHtmlStart,footerCssStart,afterFooterCss].some(x=>x<0))throw Error('ANCHORS_MISSING');
          let legalPages=orig.slice(legalStart,legalCssStart);const lc=(legalPages.split('>BALL46</div>').length-1);if(lc!==11)throw Error('LEGAL_BRAND_COUNT:'+lc);legalPages=legalPages.split('>BALL46</div>').join('>ball<span>46</span></div>');
          let footerHtml=orig.slice(footerHtmlStart,footerCssStart);const gc=(footerHtml.split('BALL<span>46</span>').length-1);if(gc!==1)throw Error('GLOBAL_BRAND_COUNT:'+gc);footerHtml=footerHtml.replace('BALL<span>46</span>','ball<span>46</span>');
          function patchStringConst(segment,name,add){const marker='const '+name+'=';const pos=segment.indexOf(marker);if(pos<0)throw Error('CONST_MISSING:'+name);let raw=segment.slice(pos+marker.length).trim();if(raw.endsWith(';'))raw=raw.slice(0,-1);const value=JSON.parse(raw);if(value.includes('B46_FOOTER_BRAND_LOGO_20261001'))throw Error('CSS_ALREADY_PATCHED:'+name);return marker+JSON.stringify(value+add)+';\n';}
          const legalAdd='/* B46_FOOTER_BRAND_LOGO_20261001 */.footer-title{font-family:"Arial Black",Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:900;letter-spacing:-.055em;text-transform:none}.footer-title span{color:var(--green2)}@media(max-width:640px){.footer-title{width:76px;height:76px;border-radius:19px;background:#000;border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;line-height:.78;letter-spacing:-.06em;overflow:hidden}.footer-title span{display:block;font-size:42px;line-height:.82;letter-spacing:-.07em;margin-top:1px}}';
          const footerAdd='/* B46_FOOTER_BRAND_LOGO_20261001 */#b46-site-footer-v1 .b46f-brand{font-family:"Arial Black",Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:900;letter-spacing:-.055em;text-transform:none}#b46-site-footer-v1 .b46f-brand span{color:#31b878}@media(max-width:560px){#b46-site-footer-v1 .b46f-brand{width:76px;height:76px;border-radius:19px;background:#000;border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;line-height:.78;letter-spacing:-.06em;overflow:hidden}#b46-site-footer-v1 .b46f-brand span{display:block;font-size:42px;line-height:.82;letter-spacing:-.07em;margin-top:1px}}';
          const legalCss=patchStringConst(orig.slice(legalCssStart,footerHtmlStart),'__B46_LEGAL_CSS_20261001__',legalAdd);const footerCss=patchStringConst(orig.slice(footerCssStart,afterFooterCss),'__B46_FOOTER_CSS__',footerAdd);
          const patched=orig.slice(0,legalStart)+legalPages+legalCss+footerHtml+footerCss+orig.slice(afterFooterCss);if(!patched.includes('/index.html?view=signal')||!patched.includes('/index.html?view=statistics'))throw Error('LINKS_LOST');fs.writeFileSync(p,patched);const beforeSha=crypto.createHash('sha256').update(Buffer.from(orig)).digest('hex'),afterSha=crypto.createHash('sha256').update(Buffer.from(patched)).digest('hex');fs.writeFileSync('/tmp/main',main);fs.writeFileSync('/tmp/meta.json',JSON.stringify(meta));fs.writeFileSync('/tmp/main-after.sha',afterSha);fs.writeFileSync('/tmp/source-report.json',JSON.stringify({main,beforeSha,afterSha,globalBrandChanges:1,legalFooterBrandChanges:11,cssOnlyAdditions:true,noJavascriptAdded:true,noFetchAdded:true,noApiChange:true,noOddsChange:true},null,2));console.log('PATCH_READY');
          NODE

      - name: Abort if Production changed before upload
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN";BASE=$(cat /tmp/base-version);curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/recheck.json;CUR=$(node -e "const j=require('/tmp/recheck.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))");[ "$CUR" = "$BASE" ]||{ echo "ABORT_CONCURRENT_DEPLOY:$CUR";exit 4; }

      - name: Upload exact current modules with Footer-logo-only patch
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN";node -e "const fs=require('fs');fs.writeFileSync('/tmp/upload-meta.json',JSON.stringify({main_module:fs.readFileSync('/tmp/main','utf8').trim()}))";mapfile -t args < <(node - <<'NODE'
          const fs=require('fs');for(const m of JSON.parse(fs.readFileSync('/tmp/meta.json','utf8')))console.log(`-F\n${m.name}=@/tmp/modules/${m.name};type=${m.content_type}`);
          NODE
          );CURL_ARGS=();i=0;while [ $i -lt ${#args[@]} ];do CURL_ARGS+=("${args[$i]}" "${args[$((i+1))]}");i=$((i+2));done;curl -fsS -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/content" -H "$AUTH" -F 'metadata=</tmp/upload-meta.json;type=application/json' "${CURL_ARGS[@]}" -o /tmp/update.json;node -e "const j=require('/tmp/update.json');if(j.success!==true)throw Error(JSON.stringify(j.errors||[]));console.log('UPLOAD_ACCEPTED')"

      - name: Verify exact scope and rollback on any failure
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN";BASE=$(cat /tmp/base-version)
          rollback(){ set +e;[ -s /tmp/our-version ]||return;OUR=$(cat /tmp/our-version);curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/current.json||return;CUR=$(node -e "const j=require('/tmp/current.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))");[ "$CUR" = "$OUR" ]||return;node -e "require('fs').writeFileSync('/tmp/rb.json',JSON.stringify({strategy:'percentage',versions:[{version_id:process.argv[1],percentage:100}],annotations:{'workers/message':'Rollback Footer brand logo V2 verification failure'}}))" "$BASE";curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments" -H "$AUTH" -H 'content-type: application/json' --data-binary @/tmp/rb.json -o /tmp/rb-resp.json||true;echo ROLLBACK_TO:$BASE; }
          trap 'rc=$?;rollback;exit $rc' ERR
          CAND='';for n in $(seq 1 15);do curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/d.json;CAND=$(node -e "const j=require('/tmp/d.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))");[ -n "$CAND" ]&&[ "$CAND" != "$BASE" ]&&break;sleep 2;done;[ -n "$CAND" ]&&[ "$CAND" != "$BASE" ];echo -n "$CAND" >/tmp/our-version
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/workers/$SCRIPT_NAME/versions/$CAND?include=modules" -H "$AUTH" -o /tmp/candidate.json
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),j=require('/tmp/candidate.json'),meta=require('/tmp/meta.json'),main=fs.readFileSync('/tmp/main','utf8').trim(),want=fs.readFileSync('/tmp/main-after.sha','utf8').trim();if(j.success!==true)throw Error('CANDIDATE_FETCH_FAILED');const a=new Map(j.result.modules.map(m=>[m.name,crypto.createHash('sha256').update(Buffer.from(m.content_base64,'base64')).digest('hex')]));for(const m of meta){const expected=m.name===main?want:m.beforeSha;if(a.get(m.name)!==expected)throw Error('MODULE_MISMATCH:'+m.name)}if(a.size!==meta.length)throw Error('MODULE_COUNT_CHANGED');
          NODE
          visible=0;for n in $(seq 1 25);do K="${GITHUB_RUN_ID}-$n-$(date +%s%N)";curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/index.html?after=$K" -o /tmp/after/index.html;curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/information.html?after=$K" -o /tmp/after/information.html;curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/legal.css?after=$K" -o /tmp/after/legal.css;curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/ball46-footer.css?after=$K" -o /tmp/after/footer.css;if grep -Fq 'ball<span>46</span>' /tmp/after/index.html && grep -Fq 'footer-title">ball<span>46</span>' /tmp/after/information.html && grep -Fq 'B46_FOOTER_BRAND_LOGO_20261001' /tmp/after/legal.css && grep -Fq 'B46_FOOTER_BRAND_LOGO_20261001' /tmp/after/footer.css;then visible=1;break;fi;sleep 2;done;[ "$visible" = 1 ]||false
          pages='information about user-guide methodology privacy terms disclaimer affiliate-disclosure responsible-gambling cookies contact';for p in $pages;do curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/$p.html?after=${GITHUB_RUN_ID}-$p-$(date +%s%N)" -o "/tmp/after/$p.html";done
          curl -fsS "$BALL46_URL/api/engine/health?after=${GITHUB_RUN_ID}" -o /tmp/after/e.json;curl -fsS "$BALL46_URL/api/full-market/health?after=${GITHUB_RUN_ID}" -o /tmp/after/f.json;curl -fsS "$BALL46_URL/api/engine/statistics?after=${GITHUB_RUN_ID}" -o /tmp/after/s.json
          node - <<'NODE'
          const fs=require('fs');const b=require('/tmp/backend-before.json'),e=require('/tmp/after/e.json'),f=require('/tmp/after/f.json'),s=require('/tmp/after/s.json'),a={engine:e.version,fullMarket:f.version,settlementRevision:s.settlementRevision};if(JSON.stringify(a)!==JSON.stringify(b))throw Error('BACKEND_CHANGED');const beforeFoot=fs.readFileSync('/tmp/footer-before.html','utf8'),idx=fs.readFileSync('/tmp/after/index.html','utf8'),aft=idx.match(/<footer\b[^>]*id=["']b46-site-footer-v1["'][\s\S]*?<\/footer>/i);if(!aft)throw Error('FOOTER_MISSING');if(aft[0].replace('ball<span>46</span>','BALL<span>46</span>')!==beforeFoot)throw Error('GLOBAL_FOOTER_CHANGED_OUTSIDE_LOGO');const pages='information about user-guide methodology privacy terms disclaimer affiliate-disclosure responsible-gambling cookies contact'.split(' ');for(const p of pages){const before=fs.readFileSync('/tmp/before/'+p+'.html','utf8'),after=fs.readFileSync('/tmp/after/'+p+'.html','utf8');if(after.replace('>ball<span>46</span></div>','>BALL46</div>')!==before)throw Error('LEGAL_CHANGED_OUTSIDE_LOGO:'+p)}const lb=fs.readFileSync('/tmp/before/legal.css','utf8'),la=fs.readFileSync('/tmp/after/legal.css','utf8'),fb=fs.readFileSync('/tmp/before/footer.css','utf8'),fa=fs.readFileSync('/tmp/after/footer.css','utf8'),mark='/* B46_FOOTER_BRAND_LOGO_20261001 */',li=la.indexOf(mark),fi=fa.indexOf(mark);if(li<0||fi<0)throw Error('CSS_MARKER_MISSING');if(la.slice(0,li)!==lb)throw Error('LEGAL_CSS_OUTSIDE_LOGO_CHANGED');if(fa.slice(0,fi)!==fb)throw Error('FOOTER_CSS_OUTSIDE_LOGO_CHANGED');console.log('VERIFY_PASS',{base:fs.readFileSync('/tmp/base-version','utf8'),deployed:fs.readFileSync('/tmp/our-version','utf8'),backend:a});
          NODE
          OUR=$(cat /tmp/our-version);curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/final.json;FINAL=$(node -e "const j=require('/tmp/final.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))");[ "$FINAL" = "$OUR" ]||false;trap - ERR
