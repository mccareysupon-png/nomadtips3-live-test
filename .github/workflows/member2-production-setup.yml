name: Member2 Production Domain And Access
on:
  push:
    branches: [member2/isolated-ui-and-registration-20261011]
    paths: ['.github/workflows/member2-production-setup.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read Member 2 domain and Access status
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/workers/domains" | jq -c '[.result[]|select(.hostname=="member2.ball46.com")]'
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/access/apps" | jq -c '[.result[]|select(.domain=="member2.ball46.com")|{name,id,aud,domain}]'
