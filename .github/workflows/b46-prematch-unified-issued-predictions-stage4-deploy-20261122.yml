name: BALL46 Unified Prematch Predictions issued 1X2 BTTS TEST stage4
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-prematch-unified-issued-predictions-stage4-deploy-20261122.yml]
permissions: {contents: read}
concurrency:
  group: ball46-premium-match-colors-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify grouped issued markets and independent stats identity
        run: |
          node --check qa/prematch-history-20261120/patch-prematch-unified-predictions-test-20261122.mjs
          node --check qa/prematch-history-20261120/deploy-prematch-unified-predictions-test-20261122.mjs
          node --test qa/prematch-history-20261120/patch-prematch-unified-predictions.test.mjs qa/prematch-history-20261120/btts-pick-ledger-test.test.mjs qa/prematch-history-20261120/prematch-stats-registry-test.test.mjs
      - name: Deploy original 1X2 native Live Mirror + grouped BTTS issued selection; TEST front-end only
        run: node qa/prematch-history-20261120/deploy-prematch-unified-predictions-test-20261122.mjs
