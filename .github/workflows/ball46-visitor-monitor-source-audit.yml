name: BALL46 Visitor Monitor source availability (read only)
on:
  push:
    branches: [work/ball46-traffic-intelligence-isolated-20261020]
    paths: ['.github/workflows/ball46-visitor-monitor-source-audit.yml']
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: traffic-intelligence/isolated-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read existing Cloudflare dataset permissions without saving visitor records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node source-audit.mjs
      - name: Test the existing encrypted Analytics secret without changing production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node source-preview-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visitor-monitor-source-availability
          path: traffic-intelligence/isolated-deploy/source-audit-evidence/
          retention-days: 7
