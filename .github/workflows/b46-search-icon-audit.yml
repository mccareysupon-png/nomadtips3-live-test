name: BALL46 Search Icon Audit
on:
  push:
    branches: [fix/ball46-search-borderless-icon-20261024]
    paths:
      - .github/workflows/b46-search-icon-audit.yml
      - deploy-assets/search-icon-20261024/inspect.mjs
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node deploy-assets/search-icon-20261024/inspect.mjs
