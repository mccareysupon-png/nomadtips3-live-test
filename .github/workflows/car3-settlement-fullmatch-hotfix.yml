name: Apply and Verify CAR 3 Full-Match AH Settlement

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/car3-settlement-fullmatch-hotfix.yml"

permissions:
  contents: write

jobs:
  apply-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Patch stored-FT reconciliation path
        run: python scripts/car3-settlement-fullmatch-hotfix.py

      - name: Run settlement and API guard regression tests
        run: |
          node scripts/test-car3-full-match-settlement.mjs
          node scripts/test-api-football-rate-guard.mjs

      - name: Commit Engine 3 source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-worker/src/paper-db-side.js scripts/test-car3-full-match-settlement.mjs
          git commit -m "Reuse stored FT for CAR 3 settlement reconciliation"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Deploy corrected Engine 3 Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.120.0
          command: deploy --config cloudflare-worker/wrangler.jsonc

      - name: Reconcile ledger and verify Engine 3 wheel
        run: node scripts/car3-settlement-live-verify.mjs
