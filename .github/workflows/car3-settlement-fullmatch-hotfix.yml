name: Verify CAR 3 Full-Match AH Settlement

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/car3-settlement-fullmatch-hotfix.yml"

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run permanent settlement regression tests
        run: |
          node scripts/test-car3-full-match-settlement.mjs
          node scripts/test-api-football-rate-guard.mjs

      - name: Reconcile ledger and verify Engine 3 wheel
        run: node scripts/car3-settlement-live-verify.mjs
