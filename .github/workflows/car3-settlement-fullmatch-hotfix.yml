name: Inspect CAR 3 Public Ledger Identity

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/car3-settlement-fullmatch-hotfix.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect fixture 1569049 from live Worker ledger
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://nomadtips3-test-api.mccarey-supon.workers.dev';
          const response = await fetch(`${base}/paper-trades?limit=5000&identity=${Date.now()}`, { cache: 'no-store' });
          const data = await response.json();
          if (!response.ok || !data?.ok) throw new Error(`ledger unavailable HTTP ${response.status}`);
          const target = (data.trades || []).find(t => Number(t.fixtureId) === 1569049);
          if (!target) throw new Error('fixture 1569049 not found');
          const view = {
            fixtureId: target.fixtureId,
            tradeKey: target.tradeKey,
            selectedSide: target.selectedSide,
            selectedTeam: target.selectedTeam,
            opponent: target.opponent,
            actualHome: target.actualHome,
            actualAway: target.actualAway,
            league: target.league,
            country: target.country,
            createdAt: target.createdAt,
            createdIso: new Date(Number(target.createdAt)).toISOString(),
            entryMinute: target.entryMinute,
            entrySelected: `${target.entryHomeScore}-${target.entryAwayScore}`,
            entryActual: `${target.entryActualHomeScore}-${target.entryActualAwayScore}`,
            ahLine: target.ahLine,
            ahOdds: target.ahOdds,
            finalStatus: target.finalStatus,
            finalSelected: `${target.finalHomeScore}-${target.finalAwayScore}`,
            finalActual: `${target.finalActualHomeScore}-${target.finalActualAwayScore}`,
            status: target.status,
            result: target.result,
            settlement: target.settlement,
            note: target.note
          };
          console.log(JSON.stringify(view, null, 2));
          NODE
