name: Diagnose BALL46 Mobile Favorites Preview Against Origin 20261112
on:
  push:
    branches: [test/ball46-mobile-favorites-off-20261112]
    paths: ['.github/workflows/diagnose-ball46-mobile-favorites-off-preview-20261112.yml']
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node pinned-fixtures-v2-production/mobile-favorites-off-diagnose-browser-20261112.mjs
