name: Deploy 3.43 Central Full Market Cache

on:
  push:
    branches: [work/nomad343-server-prewarm-20260914]
    paths:
      - 'nomad-live-343/index.html'
      - 'nomad-live-343/full-odds-10book-343.js'
      - 'workers/nomadtips3-343-full-market-central/**'
      - 'workers/nomadtips3-343-preview/src/index-stable.js'
      - 'workers/nomadtips3-343-preview/wrangler.stable.jsonc'
      - 'workers/nomadtips3-343-preview/wrangler.jsonc'
      - '.github/workflows/deploy-343-central-market-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
  CENTRAL_CANARY_URL: https://nomadtips3-343-full-market-central-canary.mccarey-supon.workers.dev
  VIEW_CANARY_URL: https://nomadtips3-343-stable-preview.mccarey-supon.workers.dev
  PROD_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev

jobs:
  central-cache-canary-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard exact scope
        run: |
          set -euo pipefail
          BASE=5250989e680b76d2ef73815fc3f5c00f4d9ebbca
          git diff --name-only "$BASE" HEAD | tee /tmp/changed
          while IFS= read -r f; do
            case "$f" in
              nomad-live-343/index.html|nomad-live-343/full-odds-10book-343.js|workers/nomadtips3-343-full-market-central/*|workers/nomadtips3-343-full-market-central/*/*|workers/nomadtips3-343-preview/src/index-stable.js|workers/nomadtips3-343-preview/wrangler.stable.jsonc|workers/nomadtips3-343-preview/wrangler.jsonc|.github/workflows/deploy-343-central-market-cache.yml) ;;
              *) echo "UNEXPECTED CHANGE: $f"; exit 1;;
            esac
          done < /tmp/changed
          git diff --quiet "$BASE" HEAD -- workers/nomadtips3-343-full-market || { echo 'LEGACY FULL MARKET CHANGED'; exit 1; }
          git diff --quiet "$BASE" HEAD -- workers/nomadtips3-engine-343 || { echo 'ENGINE CHANGED'; exit 1; }
          git diff --quiet "$BASE" HEAD -- workers/nomadtips3-5usd-hub-343 || { echo 'HUB CHANGED'; exit 1; }
          git diff --quiet "$BASE" HEAD -- nomad-live-341 || { echo '3.41 CHANGED'; exit 1; }

      - name: Static architecture validation
        run: |
          set -euo pipefail
          node --check nomad-live-343/full-odds-10book-343.js
          node --check workers/nomadtips3-343-preview/src/index-stable.js
          node --check workers/nomadtips3-343-full-market-central/src/index.js
          grep -Fq "CENTRAL_SERVER_CACHE_ZERO_PROVIDER_REQUESTS" nomad-live-343/full-odds-10book-343.js
          grep -Fq "const API='/api/full-market/cache-snapshot'" nomad-live-343/full-odds-10book-343.js
          if grep -Fq '/api/full-market/fixture-odds' nomad-live-343/full-odds-10book-343.js; then echo 'BROWSER DETAIL REQUEST STILL PRESENT'; exit 1; fi
          if grep -Eq 'IntersectionObserver|fetch10\(|enqueue\(|PREWARM' nomad-live-343/full-odds-10book-343.js; then echo 'BROWSER PREWARM STILL PRESENT'; exit 1; fi
          grep -Fq "env.CENTRAL_MARKET.fetch" workers/nomadtips3-343-preview/src/index-stable.js
          grep -Fq "VIEWER_PROVIDER_REFRESH_DISABLED" workers/nomadtips3-343-preview/src/index-stable.js
          grep -Fq "const MAX_PROVIDER_PER_60S=18" workers/nomadtips3-343-full-market-central/src/index.js
          grep -Fq "providerCallsTriggeredByViewer:0" workers/nomadtips3-343-full-market-central/src/index.js
          grep -Fq 'crons = ["* * * * *"]' workers/nomadtips3-343-full-market-central/wrangler.toml
          grep -Fq 'binding = "CENTRAL_MARKET"' workers/nomadtips3-343-full-market-central/wrangler.toml
          grep -Fq '"binding": "CENTRAL_MARKET"' workers/nomadtips3-343-preview/wrangler.stable.jsonc
          grep -Fq '"binding": "CENTRAL_MARKET"' workers/nomadtips3-343-preview/wrangler.jsonc
          grep -Fq 'full-odds-10book-343.js?v=343-central-cache-v5' nomad-live-343/index.html

      - name: Validate deploy credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$FIVEDOLLAR_API_KEY"

      - name: Dry-run standalone central workers and viewers
        run: |
          set -euo pipefail
          (cd workers/nomadtips3-343-full-market-central && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.canary.toml)
          (cd workers/nomadtips3-343-full-market-central && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.toml)
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.stable.jsonc)
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc)

      - name: Deploy standalone central canary
        working-directory: workers/nomadtips3-343-full-market-central
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.canary.toml

      - name: Bind 5USD key to standalone canary
        working-directory: workers/nomadtips3-343-full-market-central
        run: printf '%s' "$FIVEDOLLAR_API_KEY" | npx --yes wrangler@4.92.0 secret put FIVEDOLLAR_API_KEY --config wrangler.canary.toml

      - name: Exercise central scheduler canary
        run: |
          set -euo pipefail
          curl_retry() { curl -fsS --retry 10 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 45 "$@"; }
          curl_retry "$CENTRAL_CANARY_URL/health" -o /tmp/ch.json
          node -e 'const j=require("/tmp/ch.json");if(j.ok!==true||j.component!=="NOMAD343_CENTRAL_MARKET_CACHE"||j.viewerProviderCalls!==0)throw Error("central health");console.log("CENTRAL HEALTH",j.version)'
          curl_retry -X POST "$CENTRAL_CANARY_URL/scheduler-tick" -o /tmp/tick.json
          node -e 'const j=require("/tmp/tick.json");if(j.ok!==true)throw Error(j.error||"scheduler failed");if(Number(j.providerCalls||0)>18)throw Error("scheduler exceeded 18/60s");console.log("SCHEDULER",{catalog:j.catalogFixtures,active:j.activeFixtures,due:j.dueFixtures,selected:j.selectedFixtures,providerCalls:j.providerCalls})'
          curl_retry "$CENTRAL_CANARY_URL/cache-snapshot" -o /tmp/fm-snapshot.json
          node -e 'const j=require("/tmp/fm-snapshot.json");if(j.ok!==true||j.providerCallsTriggeredByViewer!==0)throw Error("cache snapshot contract");console.log("CENTRAL CACHE",j.fixtureCount)'

      - name: Deploy canary viewer
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.stable.jsonc

      - name: Canary multi-user browser contract
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          TARGET_URL="$VIEW_CANARY_URL" TARGET_LABEL="CANARY" node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            let detail=0,eventRefresh=0,snapshot=0;
            const contexts=[];
            for(let i=0;i<10;i++){
              const ctx=await browser.newContext({viewport:{width:1366,height:768}});contexts.push(ctx);
              const page=await ctx.newPage();
              page.on('request',r=>{const u=r.url();if(u.includes('/api/full-market/fixture-odds'))detail++;if(u.includes('/api/full-market/event-refresh'))eventRefresh++;if(u.includes('/api/full-market/cache-snapshot'))snapshot++;});
              await page.goto(process.env.TARGET_URL+'/?users='+i+'&_='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForSelector('.match-card[data-match-id]',{timeout:45000});
              const cards=page.locator('.match-card[data-match-id]');
              const count=Math.min(5,await cards.count());
              for(let k=0;k<count;k++){await cards.nth(k).locator('.match-row.scoreboard-default').click();await page.waitForTimeout(80)}
            }
            await new Promise(r=>setTimeout(r,1500));
            if(detail!==0)throw Error('BROWSER_DETAIL_REQUESTS='+detail);
            if(eventRefresh!==0)throw Error('BROWSER_EVENT_REFRESH_REQUESTS='+eventRefresh);
            if(snapshot<1)throw Error('CENTRAL_SNAPSHOT_NOT_READ');
            console.log(process.env.TARGET_LABEL+' MULTI USER OK',{sessions:10,cardClicks:'up to 50',detail,eventRefresh,snapshot});
            await Promise.all(contexts.map(c=>c.close()));await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Verify viewer routes cannot trigger provider
        run: |
          set -euo pipefail
          curl -fsS -D /tmp/sh "$VIEW_CANARY_URL/api/full-market/cache-snapshot?verify=$RANDOM" -o /tmp/sj
          tr -d '\r' < /tmp/sh | grep -Fiq 'x-nomad-provider-trigger: 0'
          curl -fsS "$VIEW_CANARY_URL/api/live/snapshot?verify=$RANDOM" -o /tmp/board.json
          node -e 'const j=require("/tmp/board.json"),f=(j.fixtures||[]).find(x=>x.fixtureId);require("fs").writeFileSync("/tmp/id",f?String(f.fixtureId):"")'
          ID="$(cat /tmp/id)"
          if [ -n "$ID" ]; then
            curl -fsS -D /tmp/fh "$VIEW_CANARY_URL/api/full-market/fixture-odds?fixtureId=$ID&verify=$RANDOM" -o /tmp/fr.json
            tr -d '\r' < /tmp/fh | grep -Fiq 'x-nomad-provider-trigger: 0'
            node -e 'const j=require("/tmp/fr.json");if(j.ok!==true||!/CENTRAL_CACHE/.test(j.source||""))throw Error("public fixture route not cache only");console.log("PUBLIC FIXTURE CACHE ONLY",j.fixtureId,j.source)'
          fi
          CODE=$(curl -sS -o /tmp/blocked -w '%{http_code}' "$VIEW_CANARY_URL/api/full-market/event-refresh?fixtureId=123")
          test "$CODE" = "403"

      - name: Deploy production central cache
        working-directory: workers/nomadtips3-343-full-market-central
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.toml

      - name: Bind 5USD key to production central cache
        working-directory: workers/nomadtips3-343-full-market-central
        run: printf '%s' "$FIVEDOLLAR_API_KEY" | npx --yes wrangler@4.92.0 secret put FIVEDOLLAR_API_KEY --config wrangler.toml

      - name: Deploy production viewer
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Production cache-only browser contract
        run: |
          set -euo pipefail
          TARGET_URL="$PROD_URL" TARGET_LABEL="PRODUCTION" node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1366,height:768}});
            let detail=0,eventRefresh=0,snapshot=0;
            page.on('request',r=>{const u=r.url();if(u.includes('/api/full-market/fixture-odds'))detail++;if(u.includes('/api/full-market/event-refresh'))eventRefresh++;if(u.includes('/api/full-market/cache-snapshot'))snapshot++;});
            for(let n=0;n<10;n++){const r=await page.goto(process.env.TARGET_URL+'/?central='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000}).catch(()=>null);if(r&&r.ok())break;await page.waitForTimeout(2000)}
            await page.waitForSelector('.match-card[data-match-id]',{timeout:45000});
            const cards=page.locator('.match-card[data-match-id]'),count=Math.min(5,await cards.count());
            const first=cards.first(),before=await first.evaluate(el=>el.getBoundingClientRect().top);
            for(let i=0;i<count;i++){await cards.nth(i).locator('.match-row.scoreboard-default').click();await page.waitForTimeout(120)}
            await first.locator('.match-row.scoreboard-default').click();
            await page.waitForTimeout(1000);
            if(detail!==0)throw Error('PROD_BROWSER_DETAIL_REQUESTS='+detail);
            if(eventRefresh!==0)throw Error('PROD_BROWSER_EVENT_REFRESH_REQUESTS='+eventRefresh);
            if(snapshot<1)throw Error('PROD_CENTRAL_SNAPSHOT_NOT_READ');
            await page.waitForTimeout(16000);
            const after=await first.evaluate(el=>el.getBoundingClientRect().top);
            if(Math.abs(after-before)>6)throw Error('PROD_CARD_JUMP '+before+' '+after);
            console.log('PRODUCTION CENTRAL CACHE OK',{cardsClicked:count,detail,eventRefresh,snapshot,topBefore:before,topAfter:after});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          curl -fsS -D /tmp/prodh "$PROD_URL/api/full-market/cache-snapshot?verify=$RANDOM" -o /tmp/prods.json
          tr -d '\r' < /tmp/prodh | grep -Fiq 'x-nomad-provider-trigger: 0'
          node -e 'const j=require("/tmp/prods.json");if(j.ok!==true||j.providerCallsTriggeredByViewer!==0)throw Error("prod central snapshot");console.log("PROD CACHE",{fixtures:j.fixtureCount,lastTick:Boolean(j.lastTick),viewerProviderCalls:j.providerCallsTriggeredByViewer})'
