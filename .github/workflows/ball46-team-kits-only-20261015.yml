name: BALL46 team shirts complete Active assets 20261015
on:
  push:
    branches: [codex/ball46-team-kits-only-20261015]
    paths:
      - '.github/workflows/ball46-team-kits-only-20261015.yml'
      - 'deploy-assets/team-kits-only-20261015/v2-run.mjs'
      - 'deploy-assets/team-kits-only-20261015/assets.mjs'
      - 'deploy-assets/team-kits-only-20261015/assets.test.mjs'
      - 'deploy-assets/team-kits-only-20261015/patch.mjs'
      - 'deploy-assets/team-kits-only-20261015/team-kits-343.js'
      - 'deploy-assets/team-kits-only-20261015/provenance.json'
      - 'deploy-assets/team-kits-only-20261015/request.json'
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  team-shirts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate upload protocol and run the requested phase
        working-directory: deploy-assets/team-kits-only-20261015
        run: |
          node --check v2-run.mjs
          node assets.test.mjs
          node v2-run.mjs
      - name: Preserve sanitized audit on the isolated branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-assets/team-kits-only-20261015/audit-last
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record team shirt phase ${GITHUB_RUN_ID} [skip ci]"
          git push origin HEAD:codex/ball46-team-kits-only-20261015
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-team-kits-complete-${{ github.run_id }}
          path: deploy-assets/team-kits-only-20261015/audit
          retention-days: 30
