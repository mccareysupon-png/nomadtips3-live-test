name: DIAG Ball46 Featured CSS Owner 20261013

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-ball46-featured-css-owner-20261013.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-performance-chart-market-style-20261012
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts acorn@8
      - name: Find Featured card CSS owner
        working-directory: deploy-assets/performance-chart-market-style-20261012
        run: |
          node --input-type=module <<'NODE'
          import {publicFile,inspect} from '../daily-performance-20261005/production.mjs';\n          const cur=await inspect(); console.log('ACTIVE_VERSION='+cur.restore.version);
          const html=(await publicFile('/index.html')).toString('utf8');
          const links=[...html.matchAll(/<link[^>]+href=["']([^"']+\.css[^"']*)["'][^>]*>/gi)].map(m=>m[1]);
          console.log('CSS_LINKS='+JSON.stringify(links));
          for(const href of links){
            const path=href.replace(/^https?:\/\/[^/]+/,'').split('?')[0];
            try{
              const css=(await publicFile(path)).toString('utf8');
              for(const needle of ['.featured-card','.feature-score','.feature-facts','.feature-status','.feature-signal']){
                const i=css.indexOf(needle);
                if(i>=0)console.log('\n===== '+path+' :: '+needle+' @ '+i+' =====\n'+css.slice(Math.max(0,i-1800),Math.min(css.length,i+8000)));
              }
            }catch(e){console.log('MISS '+path+' '+e.message)}
          }
          NODE

# verify-active-after-featured-v1-fail
