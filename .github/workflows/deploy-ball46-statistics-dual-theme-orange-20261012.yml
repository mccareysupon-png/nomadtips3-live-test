name: Deploy Ball46 Statistics Dual Theme Orange 20261012

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ball46-statistics-dual-theme-orange-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout isolated dual-theme patch
        uses: actions/checkout@v4
        with:
          ref: work/ball46-statistics-dual-theme-orange-20261012
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification dependencies
        run: npm install --no-save --ignore-scripts acorn@8 puppeteer-core@24
      - name: Deploy Statistics dual-theme orange palette
        working-directory: deploy-assets/statistics-dual-theme-orange-20261012
        run: node run.mjs
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-statistics-dual-theme-orange-${{ github.run_id }}
          path: deploy-assets/statistics-dual-theme-orange-20261012/audit
          if-no-files-found: warn
          retention-days: 30
