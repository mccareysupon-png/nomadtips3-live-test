name: Rollback Ball46 Performance Fast Window 20261006

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-production-performance-fast-window-rollback-20261006
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-performance-fast-window-20261006
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact pre-fast-window Production
        working-directory: deploy-assets/rollback-performance-fast-window-20261006
        run: node run.mjs
