name: ONE SHOT - Ball46 Signal Menu Count Hotfix 20260927

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ball46-signal-count-hotfix-20260927.yml'

permissions:
  contents: read
  actions: read

env:
  SOURCE_COMMIT: ac7229ca7f521f8627bd66d5fbb939b970118571
  SNAPSHOT_RUN_ID: 36275642150
  SNAPSHOT_NAME: ball46-pre-mobile-parity-36275642150
  EXPECTED_INDEX_SHA256: 49082e5c2336bb83e7f2652a9f44c83966f54a024464544c8b690ddf135c5dd5
  EXPECTED_OLD_DASHBOARD_SHA256: 41b896a4dd07e2ff2cffde62247b2db1c407ee4a1b3f739a5c560bce56e90c0e
  EXPECTED_NEW_DASHBOARD_SHA256: 679b472c504b6d2284a5faf4a64536a570994924abe1a543858a5d392a199262
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  signal-count-live-payload-hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact production package source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download exact pre-mobile production snapshot
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SNAPSHOT_NAME }}
          path: /tmp/pre-mobile
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SNAPSHOT_RUN_ID }}

      - name: Rebuild exact snapshot and patch signal count only
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/pre-mobile/index.html
          test -s /tmp/pre-mobile/protected.sha
          test "$(sha256sum /tmp/pre-mobile/index.html | awk '{print $1}')" = "$EXPECTED_INDEX_SHA256"
          test ! -s /tmp/pre-mobile/missing.txt
          ! grep -Fq 'BALL46-MOBILE-PARITY LOADER START' /tmp/pre-mobile/index.html

          cp /tmp/pre-mobile/index.html nomad-live-343/index.html
          while read -r expected name; do
            src="/tmp/pre-mobile/current-assets/$name"
            test -s "$src" || { echo "SNAPSHOT_ASSET_MISSING:$name"; exit 1; }
            actual=$(sha256sum "$src" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "SNAPSHOT_HASH_BAD:$name"; exit 1; }
            cp "$src" "nomad-live-343/$name"
          done < /tmp/pre-mobile/protected.sha
          rm -f nomad-live-343/ball46-mobile-parity-v1.css

          target=nomad-live-343/dashboard-v2-stage3.js
          test "$(sha256sum "$target" | awk '{print $1}')" = "$EXPECTED_OLD_DASHBOARD_SHA256"

          python3 - <<'PY'
          from pathlib import Path
          p=Path('nomad-live-343/dashboard-v2-stage3.js')
          s=p.read_text()
          replacements=[
            ('let signalMap=new Map();','let signalMap=new Map(),signalCount=0;'),
            ("async function loadSignals(){try{const j=await fetchJson(SIGNALS_API),rows=Array.isArray(j?.signals)?j.signals:[],next=new Map();rows.sort", "async function loadSignals(){try{const j=await fetchJson(SIGNALS_API),rows=Array.isArray(j?.signals)?j.signals:[],next=new Map();signalCount=rows.length;rows.sort"),
            ('const activeSignals=num(signalMirror?.activeSignals)??signalMap.size,activeMatches=', 'const activeSignals=signalCount,activeMatches='),
          ]
          for old,new in replacements:
              count=s.count(old)
              if count != 1:
                  raise SystemExit(f'COUNT_PATCH_TARGET_MISMATCH:{count}:{old[:80]}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY

          test "$(sha256sum "$target" | awk '{print $1}')" = "$EXPECTED_NEW_DASHBOARD_SHA256"
          grep -Fq 'let signalMap=new Map(),signalCount=0;' "$target"
          grep -Fq 'signalCount=rows.length;' "$target"
          grep -Fq 'const activeSignals=signalCount,activeMatches=' "$target"
          ! grep -Fq 'const activeSignals=num(signalMirror?.activeSignals)??signalMap.size,activeMatches=' "$target"

          test "$(sha256sum nomad-live-343/index.html | awk '{print $1}')" = "$EXPECTED_INDEX_SHA256"
          ! grep -Fq 'BALL46-MOBILE-PARITY' nomad-live-343/index.html
          while read -r expected name; do
            [ "$name" = 'dashboard-v2-stage3.js' ] && continue
            actual=$(sha256sum "nomad-live-343/$name" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "UNINTENDED_ASSET_CHANGE:$name"; exit 1; }
          done < /tmp/pre-mobile/protected.sha
          echo 'SIGNAL_COUNT_PATCH_LOCK_PASS'

      - name: Dry run exact package
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy signal count hotfix
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify production exactness and signal payload
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 20); do
            code=$(curl -sS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 -o /tmp/index-live.html -w '%{http_code}' "$BALL46_WORKER/index.html?signal-count-hotfix=${GITHUB_RUN_ID}-${n}") || code=000
            if [ "$code" = 200 ] && [ "$(sha256sum /tmp/index-live.html | awk '{print $1}')" = "$EXPECTED_INDEX_SHA256" ]; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo 'INDEX_CHANGED_OR_NOT_READY'; exit 1; }
          ! grep -Fq 'BALL46-MOBILE-PARITY' /tmp/index-live.html

          while read -r expected name; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/$name?signal-count-hotfix=${GITHUB_RUN_ID}" -o "/tmp/live-${name//\//_}"
            actual=$(sha256sum "/tmp/live-${name//\//_}" | awk '{print $1}')
            if [ "$name" = 'dashboard-v2-stage3.js' ]; then
              [ "$actual" = "$EXPECTED_NEW_DASHBOARD_SHA256" ] || { echo "REMOTE_PATCH_HASH_BAD:$name:$actual"; exit 1; }
              grep -Fq 'signalCount=rows.length;' "/tmp/live-${name//\//_}"
              grep -Fq 'const activeSignals=signalCount,activeMatches=' "/tmp/live-${name//\//_}"
              ! grep -Fq 'const activeSignals=num(signalMirror?.activeSignals)??signalMap.size,activeMatches=' "/tmp/live-${name//\//_}"
            else
              [ "$actual" = "$expected" ] || { echo "REMOTE_UNINTENDED_ASSET_CHANGE:$name"; exit 1; }
            fi
          done < /tmp/pre-mobile/protected.sha

          for page in signal.html statistics.html; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/$page?signal-count-hotfix=${GITHUB_RUN_ID}" -o "/tmp/$page"
            test -s "/tmp/$page"
          done

          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/health?signal-count-hotfix=${GITHUB_RUN_ID}" -o /tmp/health.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?signal-count-hotfix=${GITHUB_RUN_ID}" -o /tmp/board.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?signal-count-hotfix=${GITHUB_RUN_ID}" -o /tmp/signals.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/statistics?signal-count-hotfix=${GITHUB_RUN_ID}" -o /tmp/stats.json

          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/board.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals.json','utf8'));
          const t=JSON.parse(fs.readFileSync('/tmp/stats.json','utf8'));
          if(h?.ok!==true) throw Error('HEALTH_BAD');
          if(b?.ok!==true || !Array.isArray(b?.fixtures)) throw Error('BOARD_BAD');
          if(!Array.isArray(s?.signals)) throw Error('SIGNALS_BAD');
          if(t?.ok!==true || !Array.isArray(t?.rows)) throw Error('STATS_BAD');
          console.log('BALL46_SIGNAL_COUNT_HOTFIX_PASS',{fixtures:b.fixtures.length,signals:s.signals.length,settled:t.rows.length,menuSignalCountSource:'signals.length'});
          NODE
