name: SCAN Ball46 Scorebar Origin 20260929
on:
  push:
    branches: [work/ball46-refresh-state-fix-20260929-scan]
    paths: ['.github/workflows/scan-ball46-scorebar-origin-20260929.yml']
permissions:
  contents: read
env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  DIRECT: https://ball46-production.mccarey-supon.workers.dev
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Lock exact current worker and scan live asset sources
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/b46origin; rm -rf "$OUT"; mkdir -p "$OUT"
          AUTH="Authorization: Bearer $API_TOKEN"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=5" -H "$AUTH" -o "$OUT/deployments.json"
          node - <<'NODE'
          const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/b46origin/deployments.json'));
          const d=j.result?.deployments?.[0],v=d?.versions||[];if(j.success!==true||v.length!==1||Number(v[0].percentage)!==100)throw Error('BAD_DEPLOYMENT');
          console.log('ORIGIN_LOCK',JSON.stringify({deployment:d.id,version:v[0].version_id,created_on:d.created_on}));
          if(v[0].version_id!=='d54d0bae-0bd7-4a36-beed-052aa69a3a5e')throw Error('PRODUCTION_MOVED:'+v[0].version_id);
          NODE
          files='index.html singlepage-workspace-343.js dashboard-v2-stage3.js ui-sync-fixes-343-v2.js v2-shared.js dashboard-v2-tune.js expanded-match-343.js workspace-route-guard-343.js singlepage-workspace-343.css dashboard-v2.css dashboard-v2-tune.css v2-shared.css'
          nonce="${GITHUB_RUN_ID}-$(date +%s%N)"
          for f in $files; do
            code=$(curl -sS -L --retry 3 --retry-all-errors --max-time 25 -H 'Cache-Control: no-cache' -o "$OUT/$f" -w '%{http_code}' "$DIRECT/$f?origin=$nonce-$RANDOM") || true
            echo "ORIGIN_FETCH:$f:$code:$(test -s "$OUT/$f" && wc -c <"$OUT/$f" || echo 0)"
          done
          echo '=== SCOREBAR REFERENCES ==='
          grep -nEH 'workspace-scorebar-slot|stable-chrome-ready|workspace-stable|insertAdjacentHTML|createElement|prepend\(|append\(|before\(' "$OUT"/*.js "$OUT"/index.html 2>/dev/null | head -250 || true
          echo '=== HTML SCOREBAR ==='
          grep -nE 'workspace-scorebar|workspace-stable' "$OUT/index.html" | head -80 || true
          echo '=== WORKSPACE INIT TAIL ==='
          tail -n 45 "$OUT/singlepage-workspace-343.js" || true
          echo '=== ROUTE GUARD FULL ==='
          cat "$OUT/workspace-route-guard-343.js"
