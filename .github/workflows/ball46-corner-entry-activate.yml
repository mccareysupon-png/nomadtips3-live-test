name: BALL46 Corner ENTRY — guarded Production
on:
  push:
    branches: [fix/ball46-corner-entry-20261024]
    paths:
      - .github/workflows/ball46-corner-entry-activate.yml
permissions:
  contents: read
concurrency:
  group: ball46-production-corner-entry-20261024
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guarded Corner-only Worker cutover and verification
        run: |
          node --check deploy-assets/corner-entry-20261024/activate.mjs
          node deploy-assets/corner-entry-20261024/activate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b46-corner-entry-production-${{ github.run_id }}
          path: deploy-assets/corner-entry-20261024/audit/
          retention-days: 14
