name: Deploy Ball46 Color Semantics Entry Fix 20261011
# trigger-3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ball46-color-semantics-entry-fix-20261011.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout isolated color semantics patch
        uses: actions/checkout@v4
        with:
          ref: work/ball46-color-semantics-entry-fix-20261011
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install parser dependency only
        run: npm install --no-save --ignore-scripts acorn@8
      - name: Deploy Entry preservation guard
        working-directory: deploy-assets/color-semantics-entry-fix-20261011
        run: node run.mjs
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-color-semantics-entry-fix-${{ github.run_id }}
          path: deploy-assets/color-semantics-entry-fix-20261011/audit
          if-no-files-found: warn
          retention-days: 30
