name: Deploy NOMADTIPS3 Live Scores Beta

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.css"
      - "**/*.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate CAR 3.1 Statistics and Signal UI
        run: |
          WEB="car3-1-hybrid-live-engine/web"
          MON="car3-1-hybrid-live-engine/monitor"

          test -f "$WEB/index.html"
          test -f "$WEB/statistics.html"
          test -f "$WEB/history.html"
          test -f "$WEB/statistics.js"
          test -f "$WEB/topbar-lock.js"
          test -f "$WEB/signal-polish.js"
          test -f "$WEB/live-fetch-guard.js"
          test -f "$MON/index.html"
          test -f "$MON/history.html"
          test -f "$MON/statistics.html"
          test -f "$MON/match-time-card.js"

          node --check "$WEB/statistics.js"
          node --check "$WEB/topbar-lock.js"
          node --check "$WEB/signal-polish.js"
          node --check "$WEB/live-fetch-guard.js"
          node --check "$MON/match-time-card.js"

          grep -q "import './live-fetch-guard.js'" "$WEB/topbar-lock.js"
          grep -q 'HOLDING LAST GOOD' "$WEB/live-fetch-guard.js"

          for PAGE in "$WEB/statistics.html" "$WEB/history.html"; do
            grep -q 'statistics.js' "$PAGE"
            grep -q 'id="historySummary"' "$PAGE"
            grep -q 'id="historyBody"' "$PAGE"
            if grep -q 'http-equiv="refresh"' "$PAGE"; then
              echo "::error::$PAGE must be a real Statistics page, not a redirect"
              exit 1
            fi
          done

          grep -q 'href="./statistics.html"' "$WEB/index.html"
          grep -q 'href="../web/statistics.html"' "$MON/index.html"
          grep -q "monitor/'))return '../web/statistics.html'" "$WEB/topbar-lock.js"
          grep -q "return './statistics.html'" "$WEB/topbar-lock.js"

          grep -q 'id="signalTicket"' "$WEB/index.html"
          grep -q 'id="signalTicket"' "$MON/index.html"
          grep -q 'ODDS @ SIGNAL' "$WEB/index.html"
          grep -q 'ENTRY SCORE' "$WEB/index.html"
          grep -q 'DETECTED MINUTE' "$WEB/index.html"

          if grep -q 'LIVE TIME' "$WEB/index.html"; then
            echo "::error::web/index.html still exposes obsolete LIVE TIME"
            exit 1
          fi
          if grep -q 'LIVE TIME' "$MON/index.html"; then
            echo "::error::monitor/index.html still exposes obsolete LIVE TIME"
            exit 1
          fi

      - name: Inspect CAR 3.1 Worker read-only
        continue-on-error: true
        run: |
          set +e
          BASE="https://nomadtips3-car31-goaloo.mccarey-supon.workers.dev"
          echo "=== HEALTH ==="
          curl -fsS --max-time 20 "$BASE/health?t=$(date +%s)" | tee /tmp/car31-health.json
          echo
          echo "=== LIVE ==="
          curl -fsS --max-time 20 "$BASE/live?t=$(date +%s)" | tee /tmp/car31-live.json
          echo
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('health','live'):
              p=Path(f'/tmp/car31-{name}.json')
              if not p.exists() or not p.read_text().strip():
                  print(f'{name}: NO RESPONSE')
                  continue
              try:
                  d=json.loads(p.read_text())
              except Exception as e:
                  print(f'{name}: INVALID JSON {e}')
                  continue
              if name=='health':
                  print('health summary:', {
                      'ok': d.get('ok'),
                      'lastCycle': d.get('lastCycle'),
                      'lastSuccess': d.get('lastSuccess'),
                      'lastError': d.get('lastError'),
                      'historyTotal': d.get('historyTotal'),
                      'settlementContract': d.get('settlementContract')
                  })
              else:
                  rows=d.get('matches') or []
                  print('live summary:', {
                      'ok': d.get('ok'),
                      'generatedAt': d.get('generatedAt'),
                      'matches': len(rows),
                      'signals': sum(1 for r in rows if str((r.get('engine') or {}).get('decision','')).upper()=='SHADOW SIGNAL')
                  })
          PY

      - name: Apply exact 40 percent visual reduction to heading
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          override = """
          <style id="live-scores-beta-heading-fix">
            .v2 {
              font-size: 9px !important;
              font-weight: 900 !important;
              transform: scale(.6);
              transform-origin: right center;
            }
            @media (max-width: 640px) {
              .v2 { font-size: 7px !important; }
            }
          </style>
          """
          marker = "</head>"
          if marker not in text:
              raise SystemExit("Closing head tag not found")
          text = text.replace(marker, override + "\n" + marker, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Stamp NOMAD 3.42 release and asset cache keys
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("nomad-live-342/index.html")
          text = path.read_text(encoding="utf-8")
          sha = os.environ.get("RELEASE_SHA", "").strip().lower()
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit(f"Invalid release SHA: {sha!r}")
          short = sha[:12]

          text = re.sub(
              r'\s*<meta name="nomad342-release" content="[^"]*">\s*',
              "\n",
              text,
              count=1,
          )
          marker = "</head>"
          if marker not in text:
              raise SystemExit("NOMAD 3.42 closing head tag not found")
          release_meta = f'  <meta name="nomad342-release" content="{sha}">\n'
          text = text.replace(marker, release_meta + marker, 1)

          asset_pattern = re.compile(
              r'((?:href|src)=")(?!\.\./)([^"?]+\.(?:css|js))(?:\?[^\"]*)?(\")'
          )
          text, count = asset_pattern.subn(
              lambda m: f'{m.group(1)}{m.group(2)}?v={short}{m.group(3)}',
              text,
          )
          if count < 10:
              raise SystemExit(f"Expected NOMAD 3.42 local assets to be stamped; only {count} matched")

          path.write_text(text, encoding="utf-8")
          print(f"NOMAD342_RELEASE_STAMPED sha={sha} assets={count}")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify NOMAD 3.42 exact release is live on Pages and www
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short="${RELEASE_SHA:0:12}"
          targets=(
            "https://mccareysupon-png.github.io/nomadtips3-live-test/nomad-live-342/"
            "https://www.nomadtips3.com/nomad-live-342/"
          )

          for target in "${targets[@]}"; do
            ok=0
            out="/tmp/nomad342-live-check.html"
            for attempt in $(seq 1 36); do
              url="${target}?release=${RELEASE_SHA}&attempt=${attempt}&t=$(date +%s)"
              if curl -fsSL --max-time 20 "$url" -o "$out" \
                && grep -Fq "meta name=\"nomad342-release\" content=\"${RELEASE_SHA}\"" "$out" \
                && grep -Fq "ledger-pages.css?v=${short}" "$out" \
                && grep -Fq "live-score-alert-visual.css?v=${short}" "$out"; then
                css="/tmp/nomad342-ledger.css"
                if curl -fsSL --max-time 20 "${target}ledger-pages.css?v=${short}&t=$(date +%s)" -o "$css" \
                  && test -s "$css"; then
                  ok=1
                  echo "LIVE_OK target=${target} sha=${RELEASE_SHA} attempt=${attempt}"
                  break
                fi
              fi
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "::error::NOMAD 3.42 release ${RELEASE_SHA} did not reach ${target} within 3 minutes"
              exit 1
            fi
          done

          echo "NOMAD342_END_TO_END_LIVE sha=${RELEASE_SHA}"
