name: Deploy NOMADTIPS3 Live Scores Beta

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.css"
      - "**/*.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate CAR 3.1 Statistics and Signal UI
        run: |
          WEB="car3-1-hybrid-live-engine/web"
          MON="car3-1-hybrid-live-engine/monitor"

          test -f "$WEB/index.html"
          test -f "$WEB/statistics.html"
          test -f "$WEB/history.html"
          test -f "$WEB/statistics.js"
          test -f "$WEB/topbar-lock.js"
          test -f "$WEB/signal-polish.js"
          test -f "$MON/index.html"
          test -f "$MON/history.html"
          test -f "$MON/statistics.html"
          test -f "$MON/match-time-card.js"

          node --check "$WEB/statistics.js"
          node --check "$WEB/topbar-lock.js"
          node --check "$WEB/signal-polish.js"
          node --check "$MON/match-time-card.js"

          for PAGE in "$WEB/statistics.html" "$WEB/history.html"; do
            grep -q 'statistics.js' "$PAGE"
            grep -q 'id="historySummary"' "$PAGE"
            grep -q 'id="historyBody"' "$PAGE"
            if grep -q 'http-equiv="refresh"' "$PAGE"; then
              echo "::error::$PAGE must be a real Statistics page, not a redirect"
              exit 1
            fi
          done

          grep -q 'href="./statistics.html"' "$WEB/index.html"
          grep -q 'href="../web/statistics.html"' "$MON/index.html"
          grep -q "monitor/'))return '../web/statistics.html'" "$WEB/topbar-lock.js"
          grep -q "return './statistics.html'" "$WEB/topbar-lock.js"

          grep -q 'id="signalTicket"' "$WEB/index.html"
          grep -q 'id="signalTicket"' "$MON/index.html"
          grep -q 'ODDS @ SIGNAL' "$WEB/index.html"
          grep -q 'ENTRY SCORE' "$WEB/index.html"
          grep -q 'DETECTED MINUTE' "$WEB/index.html"

          if grep -q 'LIVE TIME' "$WEB/index.html"; then
            echo "::error::web/index.html still exposes obsolete LIVE TIME"
            exit 1
          fi
          if grep -q 'LIVE TIME' "$MON/index.html"; then
            echo "::error::monitor/index.html still exposes obsolete LIVE TIME"
            exit 1
          fi

      - name: Apply exact 40 percent visual reduction to heading
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          override = """
          <style id="live-scores-beta-heading-fix">
            .v2 {
              font-size: 9px !important;
              font-weight: 900 !important;
              transform: scale(.6);
              transform-origin: right center;
            }
            @media (max-width: 640px) {
              .v2 { font-size: 7px !important; }
            }
          </style>
          """
          marker = "</head>"
          if marker not in text:
              raise SystemExit("Closing head tag not found")
          text = text.replace(marker, override + "\n" + marker, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
