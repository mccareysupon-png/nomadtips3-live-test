name: Prematch UI Smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/prematch-current.json'
      - '.github/workflows/prematch-ui-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate public multi-market contract
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d=JSON.parse(fs.readFileSync('data/prematch-current.json','utf8'));
          const ms=d.matches||[];
          if(!ms.length) throw new Error('no published selections');
          const context=ms.filter(m=>m.context).length;
          const momentum=ms.filter(m=>Number.isFinite(Number(m.context?.momentum?.score))).length;
          const prediction=ms.filter(m=>m.context?.prediction).length;
          const marketSets=ms.filter(m=>m.markets && Object.keys(m.markets).length>=4).length;
          const btts=ms.filter(m=>m.markets?.btts).length;
          const dc=ms.filter(m=>m.markets?.doubleChance).length;
          const oe=ms.filter(m=>m.markets?.oddEven).length;
          if(context!==ms.length) throw new Error(`context ${context}/${ms.length}`);
          if(momentum!==ms.length) throw new Error(`momentum ${momentum}/${ms.length}`);
          if(prediction!==ms.length) throw new Error(`prediction ${prediction}/${ms.length}`);
          if(marketSets!==ms.length) throw new Error(`multi-market ${marketSets}/${ms.length}`);
          if(btts!==ms.length||dc!==ms.length||oe!==ms.length) throw new Error('derived markets missing');
          console.log(`PASS data selections=${ms.length} multiMarket=${marketSets}/${ms.length}`);
          NODE

      - name: Syntax check inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/prematch-ui.js').write_text(js)
          PY
          node --check /tmp/prematch-ui.js

      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Responsive interaction and timezone smoke
        run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const current=JSON.parse(fs.readFileSync('data/prematch-current.json','utf8'));
          const firstIso=current.matches[0].kickoffUtc;
          const sizes=[['desktop',1920,1080],['laptop',1366,768],['tablet-landscape',1024,768],['tablet-portrait',768,1024],['mobile',390,844],['mobile-landscape',844,390]];
          const browser=await chromium.launch({headless:true});
          for(const [name,width,height] of sizes){
            const page=await browser.newPage({viewport:{width,height}}),errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});await page.waitForTimeout(250);
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth);if(overflow>2)throw new Error(`${name}: overflow ${overflow}px`);
            if(await page.locator('.nav button').count()!==3)throw new Error(`${name}: nav mismatch`);
            const first=page.locator('.card').first();if(!(await first.count()))throw new Error(`${name}: no cards`);
            const rings=await first.locator('.ring b').allTextContents();if(rings.length<3||rings.every(v=>v==='—'))throw new Error(`${name}: rings empty`);
            if(await first.locator('.market-chip').count()<4)throw new Error(`${name}: market chips missing`);
            const tab=first.locator('.subtab[data-tab="prediction"]');await tab.click();if(!(await first.locator('[data-detail]').evaluate(el=>el.classList.contains('open'))))throw new Error(`${name}: prediction tab failed`);
            await page.locator('.nav button[data-view="stats"]').click();if(!(await page.locator('#stats').evaluate(el=>el.classList.contains('active'))))throw new Error(`${name}: stats view failed`);
            if(await page.locator('.filter').count()<7)throw new Error(`${name}: market filters missing`);
            if(errors.length)throw new Error(`${name}: ${errors.join(' | ')}`);console.log(`PASS ${name}`);await page.close();
          }
          const zones=['Asia/Bangkok','Asia/Tokyo','Europe/London','America/New_York','America/Los_Angeles','Australia/Sydney'];
          for(const zone of zones){
            const context=await browser.newContext({timezoneId:zone,viewport:{width:390,height:844}}),page=await context.newPage();
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'networkidle'});
            const expected=await page.evaluate(iso=>new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit'}).format(new Date(iso)),firstIso),shown=await page.locator('.card .kick').first().textContent();
            if(!shown.includes(expected))throw new Error(`${zone}: expected ${expected}, got ${shown}`);console.log(`PASS timezone ${zone} ${expected}`);await context.close();
          }
          await browser.close();
          NODE
