name: BALL46 TEST FT evidence quality aggregate only audit 20261125
on:
  push:
    branches: [feature/ball46-adaptive-manual-control-test-20261125]
    paths: [.github/workflows/b46-dot-ft-evidence-aggregate-audit-20261125.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read existing TEST snapshot and emit only verification aggregates
        run: |
          node --input-type=module <<'JS'
          const url='https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev/__b46_pm_adaptive_research';
          const res=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(26000)});
          if(!res.ok)throw Error('READ_ONLY_TEST_SNAPSHOT_HTTP_'+res.status);
          const j=await res.json();
          const records=Array.isArray(j.records)?j.records:[];
          const settled=records.filter(r=>['WIN','LOSS'].includes(r.status));
          const good=settled.filter(r=>Number.isInteger(Number(r.hg))&&Number.isInteger(Number(r.ag))&&
            Number(r.result_observed_at)>0&&Number(r.settled_at)>0&&
            typeof r.result_source==='string'&&r.result_source.trim().length>0&&Number.isFinite(Number(r.net_units)));
          const missing=settled.filter(r=>!good.includes(r));
          console.log('B46_FT_AGGREGATE_READ_ONLY '+JSON.stringify({
            formulaCount:j.formulas?.length,recordCount:records.length,
            settled: settled.length,verifiedEvidence:good.length,
            missingEvidence:missing.length,
            missingFormulaCounts:missing.reduce((a,r)=>(a[r.formula_id]=(a[r.formula_id]||0)+1,a),{}),
            lastRunAt:j.lastRunAt,doesNotLogIndividualLedgerRows:true,productionWrites:0,paidApiCalls:0
          }));
          if(j.formulas?.length!==42)process.exitCode=1;
          JS
