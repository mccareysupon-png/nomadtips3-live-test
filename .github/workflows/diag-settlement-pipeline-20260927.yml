name: READ ONLY - Settlement Pipeline Diagnostic 20260927

on:
  push:
    branches: [ops/settlement-diagnose-20260927]
    paths:
      - '.github/workflows/diag-settlement-pipeline-20260927.yml'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Correlate pending signals with provider finals
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ball46-production.mccarey-supon.workers.dev/api/engine'
          HUB='https://nomadtips3-5usd-hub-343.mccarey-supon.workers.dev'
          for ep in health signals statistics; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 "$BASE/$ep?diag=${GITHUB_RUN_ID}-$(date +%s%N)" -o "/tmp/$ep.json"
          done
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 "$HUB/snapshot?diag=${GITHUB_RUN_ID}-$(date +%s%N)" -o /tmp/hub.json
          node <<'NODE'
          const fs=require('fs'); const j=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const h=j('/tmp/health.json'), s=j('/tmp/signals.json'), t=j('/tmp/statistics.json'), hub=j('/tmp/hub.json');
          const signals=Array.isArray(s.signals)?s.signals:[], rows=Array.isArray(t.rows)?t.rows:[], fixtures=Array.isArray(hub.fixtures)?hub.fixtures:[];
          const fmap=new Map(fixtures.map(f=>[String(f.fixtureId??f.id??f.fixture_id),f]));
          const fin=f=>{const x=String(f?.status?.long||f?.status?.short||f?.status||f?.state||f?.statusText||'').toLowerCase(); return x==='ft'||x==='finished'||x==='full time'||x.includes('finished')||x.includes('after extra')||x.includes('after penalties')||x==='aet'||x==='pen';};
          const pending=signals.filter(x=>String(x.status)==='PENDING');
          const correlated=pending.map(x=>{const f=fmap.get(String(x.fixtureId));return {id:x.id,fixtureId:x.fixtureId,market:x.market,selection:x.selection,line:x.line,createdAt:x.createdAt,home:x.home?.name,away:x.away?.name,hubFound:!!f,hubStatus:f?.status,hubMinute:f?.minute,hubScore:f?.goals,hubFinished:fin(f)};});
          const pendingFinished=correlated.filter(x=>x.hubFinished);
          const exactId='201711330';
          const exactSignals=signals.filter(x=>String(x.fixtureId)===exactId);
          const exactRows=rows.filter(x=>String(x.fixtureId)===exactId || String(x.fixture_id)===exactId);
          const exactFixture=fmap.get(exactId)||null;
          const latestRows=[...rows].sort((a,b)=>Number(b.settledAt||b.settled_at||b.createdAt||0)-Number(a.settledAt||a.settled_at||a.createdAt||0)).slice(0,12).map(r=>({fixtureId:r.fixtureId,home:r.home?.name||r.home,away:r.away?.name||r.away,market:r.market,result:r.result,status:r.status,createdAt:r.createdAt,settledAt:r.settledAt,finalScore:r.finalScore}));
          console.log('CORE',JSON.stringify({engine:h,publicSignals:signals.length,pending:pending.length,settledRows:rows.length,hubFixtures:fixtures.length,pendingFinishedCount:pendingFinished.length}));
          console.log('PENDING_CORRELATED',JSON.stringify(correlated));
          console.log('PENDING_ALREADY_FINISHED',JSON.stringify(pendingFinished));
          console.log('EXACT_201711330',JSON.stringify({signals:exactSignals,rows:exactRows,fixture:exactFixture}));
          console.log('LATEST_SETTLED_ROWS',JSON.stringify(latestRows));
          NODE
