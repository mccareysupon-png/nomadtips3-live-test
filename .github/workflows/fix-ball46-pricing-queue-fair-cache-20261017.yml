name: Ball46 pricing queue fair cache - guarded production repair
on:
  push:
    branches: [fix/ball46-pricing-queue-fair-cache-20261017]
    paths:
      - .github/workflows/fix-ball46-pricing-queue-fair-cache-20261017.yml
      - deploy-assets/ball46-fair-cache-20261017/deploy.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-source-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate script syntax
        run: node --check deploy-assets/ball46-fair-cache-20261017/deploy.mjs
      - name: Strict live-source diff, price guard tests, deploy and smoke with rollback
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          JOHN_DRY_RUN: '0'
        run: node deploy-assets/ball46-fair-cache-20261017/deploy.mjs
