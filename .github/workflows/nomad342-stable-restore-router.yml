name: NOMAD 3.42 Stable Restore Router

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/342-totalcorner-inlet'
    paths:
      - '.github/workflows/nomad342-stable-restore-router.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  STABLE_URL: https://nomadtips3-live-engine-342-test.mccarey-supon.workers.dev

jobs:
  guarded-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/342-totalcorner-inlet

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate combined and rollback bundles
        working-directory: nomad-live-engine-342
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check src/index-5dollar.js
          node --check src/index-combined.js
          npm test
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler-stable-combined.toml
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler-stable-rollback.toml

      - name: Guard current live feed before judge repair
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 35 "$STABLE_URL/feed?force=1&_=$RANDOM$RANDOM" -o /tmp/pre-feed.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/pre-feed.json','utf8'));
          const count=Array.isArray(j.matches)?j.matches.length:0;
          console.log(JSON.stringify({ok:j.ok,count,lastError:j.lastError},null,2));
          if(j.ok!==true||count<1) process.exit(1);
          NODE

      - name: Deploy stable combined judge router
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: nomad-live-engine-342
          wranglerVersion: '4.92.0'
          command: deploy --config wrangler-stable-combined.toml

      - name: Verify restored THScore and 5Dollar routes
        id: postflight
        shell: bash
        run: |
          set -euo pipefail

          sleep 5

          thscore_ok=0
          for attempt in 1 2 3 4 5 6; do
            echo "THScore route attempt=$attempt"
            if curl -fsS --max-time 15 "$STABLE_URL/judge/thscore/status?_=$RANDOM$RANDOM" -o /tmp/thscore.json; then
              if node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/thscore.json','utf8'));
          console.log(JSON.stringify(j,null,2));
          if(j.version!=='3.42'||j.source!=='THScore'||typeof j.configured!=='boolean') process.exit(1);
          NODE
              then thscore_ok=1; break; fi
            fi
            sleep 5
          done
          test "$thscore_ok" = '1'

          five_ok=0
          for attempt in 1 2 3 4 5 6; do
            echo "5Dollar route attempt=$attempt"
            if curl -fsS --max-time 15 "$STABLE_URL/judge/5dollar/status?_=$RANDOM$RANDOM" -o /tmp/five.json; then
              if node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/five.json','utf8'));
          console.log(JSON.stringify(j,null,2));
          if(j.version!=='3.42'||j.source!=='5DollarFootballAPI'||j.bookmaker!=='Bet365') process.exit(1);
          NODE
              then five_ok=1; break; fi
            fi
            sleep 5
          done
          test "$five_ok" = '1'

          curl -fsS --max-time 35 "$STABLE_URL/feed?force=1&_=$RANDOM$RANDOM" -o /tmp/post-feed.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/post-feed.json','utf8'));
          const count=Array.isArray(j.matches)?j.matches.length:0;
          console.log(JSON.stringify({feedOk:j.ok,count,lastError:j.lastError},null,2));
          if(j.ok!==true||count<1) process.exit(1);
          NODE

      - name: Roll back stable runtime if judge restore fails
        if: failure() && steps.deploy.outcome == 'success'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: nomad-live-engine-342
          wranglerVersion: '4.92.0'
          command: deploy --config wrangler-stable-rollback.toml

      - name: Verify rollback feed
        if: failure() && steps.deploy.outcome == 'success'
        shell: bash
        run: |
          set +e
          sleep 4
          curl -sS --max-time 35 "$STABLE_URL/feed?force=1&_=$RANDOM$RANDOM" | head -c 1200
          echo
