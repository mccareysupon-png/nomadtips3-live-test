name: Restore NOMAD 3.43 Full Market from Shared Batch

on:
  push:
    branches:
      - work/nomad343-batch-fullmarket-restore
    paths:
      - .github/workflows/restore-343-batch-fullmarket.yml
      - .github/scripts/restore_343_fullmarket_batch.py

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nomad343-batch-fullmarket-restore
          fetch-depth: 0

      - name: Restore Full Market presentation file from last good UI baseline
        run: git show 26a4d235381b11c3cbfdd1ee9f040df9f203d60f:nomad-live-343/full-odds-main-343.js > nomad-live-343/full-odds-main-343.js

      - name: Convert Full Market card to shared batch only
        run: python .github/scripts/restore_343_fullmarket_batch.py

      - name: Validate shared-batch architecture and UI card
        run: |
          set -euo pipefail
          node --check nomad-live-343/bet365-board.js
          node --check nomad-live-343/full-odds-main-343.js
          node --check workers/nomadtips3-engine-343/src/index.js
          node --check workers/nomadtips3-343-preview/src/index.js
          grep -Fq 'full-odds-main-343.js?v=343-full-odds-batch-v1' nomad-live-343/index.html
          grep -Fq "const VERSION='343-full-odds-main-v6-shared-batch'" nomad-live-343/full-odds-main-343.js
          grep -Fq 'SHARED BATCH' nomad-live-343/full-odds-main-343.js
          grep -Fq 'zero per-match API calls' nomad-live-343/full-odds-main-343.js
          grep -Fq 'NOMAD343_BATCH_STATE' nomad-live-343/bet365-board.js
          grep -Fq "priceSource:'hub-batch'" workers/nomadtips3-engine-343/src/index.js
          grep -Fq 'externalRequests:0' workers/nomadtips3-engine-343/src/index.js
          if grep -R -n -E '/api/full-market/|/fixture-odds|fetchFullOdds|fixtures/.*/odds\?bookmakers=' nomad-live-343 workers/nomadtips3-engine-343 workers/nomadtips3-343-preview; then
            echo 'Per-fixture odds path remains'
            exit 1
          fi
          if grep -Fq 'fetch(' nomad-live-343/full-odds-main-343.js; then
            echo 'Full Market card still performs network fetch'
            exit 1
          fi
          test ! -d workers/nomadtips3-343-full-market
          git diff --check

      - name: Commit restored card and shared-batch wiring
        run: |
          set -euo pipefail
          git config user.name 'nomad343-restore-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add nomad-live-343/index.html nomad-live-343/bet365-board.js nomad-live-343/full-odds-main-343.js
          git commit -m 'fix(343): restore Full Market card on shared batch feed'
          git push origin HEAD:work/nomad343-batch-fullmarket-restore
