name: BALL46 O/U V2 priced bridge TEST guarded deploy
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-ou-v2-provider-bridge-test-deploy-20261123.yml]
permissions: {contents: read}
concurrency:
  group: ball46-prematch-only-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify bridge 1 daily shared budget, zero forged prices, exact full market provider
        run: |
          node --check qa/prematch-history-20261120/deploy-ou-v2-provider-bridge-test-20261123.mjs
          node --check qa/prematch-history-20261120/ou-value-v2-provider-bridge-test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-value-v2-provider-bridge.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-value-screener-v2.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-instant-full-market-issue-v1.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-pending-price-completion-v1.test.mjs
      - name: Guarded deploy isolated pre-match TEST Worker only, no provider calls in deployment
        run: node qa/prematch-history-20261120/deploy-ou-v2-provider-bridge-test-20261123.mjs
