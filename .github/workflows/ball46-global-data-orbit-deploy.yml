name: BALL46 Global Data Loading Orbit 20261019
on:
  push:
    branches: [fix/ball46-global-loading-orbit-20261019]
    paths:
      - '.github/workflows/ball46-global-data-orbit-deploy.yml'
      - 'deploy-assets/global-data-orbit-20261019/run.mjs'
      - 'deploy-assets/global-data-orbit-20261019/request.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  guarded-frame:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser-based before and after geometry checks
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Preview or activate only explicitly requested phase
        run: |
          node --check deploy-assets/global-data-orbit-20261019/run.mjs
          node deploy-assets/global-data-orbit-20261019/run.mjs
      - name: Preserve sanitized QA results for next guarded phase
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-assets/global-data-orbit-20261019/audit-last
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record BALL46 PC/mobile orbit loader QA evidence [skip ci]"
          git push origin HEAD:fix/ball46-global-loading-orbit-20261019
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-global-data-orbit-${{ github.run_id }}
          path: deploy-assets/global-data-orbit-20261019/audit-last
          retention-days: 30
