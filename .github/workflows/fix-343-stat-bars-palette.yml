name: Fix 3.43 Statistics Bar Palette

on:
  push:
    branches: [work/nomad343-server-prewarm-20260914]
    paths:
      - '.github/workflows/fix-343-stat-bars-palette.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CANARY_URL: https://nomadtips3-343-stable-preview.mccarey-supon.workers.dev
  PROD_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/nomad343-server-prewarm-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch stat bars at source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          HOME='#52d985'
          AWAY='#e6d45a'

          p=Path('nomad-live-343/live-stable-343.js')
          s=p.read_text()
          old='''<div class="mirror-track home-track"><i style="width:${hw}%;background:hsl(${135+i*8} 45% 52%)"></i></div><span>${esc(label)}</span><div class="mirror-track away-track"><i style="width:${aw}%;background:hsl(${28-i*5} 58% 57%)"></i></div>'''
          new='''<div class="mirror-track home-track"><i style="width:${hw}%"></i></div><span>${esc(label)}</span><div class="mirror-track away-track"><i style="width:${aw}%"></i></div>'''
          if old not in s:
              raise SystemExit('LIVE_INLINE_BAR_PATTERN_NOT_FOUND')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('nomad-live-343/live-stable-343.css')
          s=p.read_text()
          marker='/* 343 LIVE STAT BAR PALETTE SOURCE V1 */'
          if marker not in s:
              s += f'''\n{marker}\n.home-track i{{background:{HOME}}}\n.away-track i{{background:{AWAY}}}\n'''
          p.write_text(s)

          p=Path('nomad-live-343/signal-compact-343.css')
          s=p.read_text()
          s=re.sub(r'\.signal-mirror-row\[data-metric="0"\] \.home i\{background:[^}]+\}\.signal-mirror-row\[data-metric="1"\] \.home i\{background:[^}]+\}\.signal-mirror-row\[data-metric="2"\] \.home i\{background:[^}]+\}\.signal-mirror-row\[data-metric="3"\] \.home i\{background:[^}]+\}\.signal-mirror-row\[data-metric="4"\] \.home i\{background:[^}]+\}\.signal-mirror-row\[data-metric="5"\] \.home i\{background:[^}]+\}\n', '', s)
          s=re.sub(r'\.signal-mirror-row\[data-metric="0"\] \.away i\{background:[^}]+\}\.signal-mirror-row\[data-metric="1"\] \.away i\{background:[^}]+\}\.signal-mirror-row\[data-metric="2"\] \.away i\{background:[^}]+\}\.signal-mirror-row\[data-metric="3"\] \.away i\{background:[^}]+\}\.signal-mirror-row\[data-metric="4"\] \.away i\{background:[^}]+\}\.signal-mirror-row\[data-metric="5"\] \.away i\{background:[^}]+\}\n', '', s)
          s=s.replace('.signal-mirror-half.home i{background:#52d985!important}',f'.signal-mirror-half.home i{{background:{HOME}!important}}')
          s=s.replace('.signal-mirror-half.away i{background:#e6d45a!important}',f'.signal-mirror-half.away i{{background:{AWAY}!important}}')
          if '/* 343 SIGNAL STAT BAR PALETTE SOURCE V2 */' not in s:
              s += f'''\n/* 343 SIGNAL STAT BAR PALETTE SOURCE V2 */\n.signal-mirror-half.home i{{background:{HOME}!important}}\n.signal-mirror-half.away i{{background:{AWAY}!important}}\n'''
          p.write_text(s)

          for name in ['index.html','signal.html','statistics.html']:
              p=Path('nomad-live-343')/name
              h=p.read_text()
              if name=='index.html':
                  h=re.sub(r'live-stable-343\.css\?v=[^"\']+', 'live-stable-343.css?v=343-stat-bars-v1', h)
                  h=re.sub(r'live-stable-343\.js\?v=[^"\']+', 'live-stable-343.js?v=343-stat-bars-v1', h)
              else:
                  h=re.sub(r'signal-compact-343\.css\?v=[^"\']+', 'signal-compact-343.css?v=343-stat-bars-v2', h)
              p.write_text(h)
          PY
          node --check nomad-live-343/live-stable-343.js
          ! grep -Fq 'background:hsl(' nomad-live-343/live-stable-343.js
          grep -Fq '.home-track i{background:#52d985}' nomad-live-343/live-stable-343.css
          grep -Fq '.away-track i{background:#e6d45a}' nomad-live-343/live-stable-343.css
          grep -Fq '343 SIGNAL STAT BAR PALETTE SOURCE V2' nomad-live-343/signal-compact-343.css

      - name: Persist source fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nomad-live-343/live-stable-343.js nomad-live-343/live-stable-343.css nomad-live-343/signal-compact-343.css nomad-live-343/index.html nomad-live-343/signal.html nomad-live-343/statistics.html
          git commit -m 'fix(343): set stat bars home green away yellow at source'
          git push origin HEAD:work/nomad343-server-prewarm-20260914

      - name: Guard exact scope
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD | sort)"
          expected="$(printf '%s\n' nomad-live-343/index.html nomad-live-343/live-stable-343.css nomad-live-343/live-stable-343.js nomad-live-343/signal-compact-343.css nomad-live-343/signal.html nomad-live-343/statistics.html | sort)"
          [ "$changed" = "$expected" ] || { echo "UNEXPECTED_SCOPE: $changed"; exit 1; }
          git diff --quiet HEAD^ HEAD -- workers/nomadtips3-engine-343 workers/nomadtips3-5usd-hub-343 workers/nomadtips3-343-full-market workers/nomadtips3-343-full-market-central nomad-live-341 nomad-live-343/event-flow-343.css nomad-live-343/event-flow-343.js

      - name: Dry run viewers
        run: |
          set -euo pipefail
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.stable.jsonc)
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc)

      - name: Deploy canary viewer
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.stable.jsonc

      - name: Wait for canary assets
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            js="$(curl -fsS "$CANARY_URL/live-stable-343.js?x=$RANDOM$(date +%s)" || true)"
            css="$(curl -fsS "$CANARY_URL/live-stable-343.css?x=$RANDOM$(date +%s)" || true)"
            sig="$(curl -fsS "$CANARY_URL/signal-compact-343.css?x=$RANDOM$(date +%s)" || true)"
            if ! grep -Fq 'background:hsl(' <<<"$js" && grep -Fq '343 LIVE STAT BAR PALETTE SOURCE V1' <<<"$css" && grep -Fq '343 SIGNAL STAT BAR PALETTE SOURCE V2' <<<"$sig"; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Verify stat bars on canary
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          TARGET_URL="$CANARY_URL" node - <<'NODE'
          const {chromium}=require('playwright');
          const rgb=s=>String(s).replace(/\s+/g,'');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1366,height:900}});
            let detailCalls=0;
            page.on('request',r=>{if(r.url().includes('/api/full-market/fixture-odds'))detailCalls++});
            await page.goto(process.env.TARGET_URL+'/?bars='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
            const live=await page.evaluate(()=>{
              const h=document.createElement('div');
              h.innerHTML='<div class="mirror-track home-track"><i style="width:50%"></i></div><div class="mirror-track away-track"><i style="width:50%"></i></div>';
              document.body.appendChild(h);
              const home=getComputedStyle(h.querySelector('.home-track i')).backgroundColor;
              const away=getComputedStyle(h.querySelector('.away-track i')).backgroundColor;
              h.remove(); return {home,away};
            });
            if(rgb(live.home)!=='rgb(82,217,133)'||rgb(live.away)!=='rgb(230,212,90)')throw Error('LIVE_BAR_COLOR '+JSON.stringify(live));
            for(const path of ['/signal.html','/statistics.html']){
              await page.goto(process.env.TARGET_URL+path+'?bars='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
              const got=await page.evaluate(()=>{
                const h=document.createElement('div');
                h.innerHTML='<div class="signal-mirror-half home"><i style="width:50%"></i></div><div class="signal-mirror-half away"><i style="width:50%"></i></div>';
                document.body.appendChild(h);
                const home=getComputedStyle(h.querySelector('.home i')).backgroundColor;
                const away=getComputedStyle(h.querySelector('.away i')).backgroundColor;
                h.remove(); return {home,away};
              });
              if(rgb(got.home)!=='rgb(82,217,133)'||rgb(got.away)!=='rgb(230,212,90)')throw Error(path+' '+JSON.stringify(got));
            }
            if(detailCalls!==0)throw Error('VIEWER_DETAIL_CALLS='+detailCalls);
            console.log('CANARY STAT BARS OK',live,{detailCalls});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Deploy production viewer
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Verify production assets
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            js="$(curl -fsS "$PROD_URL/live-stable-343.js?x=$RANDOM$(date +%s)" || true)"
            css="$(curl -fsS "$PROD_URL/live-stable-343.css?x=$RANDOM$(date +%s)" || true)"
            sig="$(curl -fsS "$PROD_URL/signal-compact-343.css?x=$RANDOM$(date +%s)" || true)"
            if ! grep -Fq 'background:hsl(' <<<"$js" && grep -Fq '343 LIVE STAT BAR PALETTE SOURCE V1' <<<"$css" && grep -Fq '343 SIGNAL STAT BAR PALETTE SOURCE V2' <<<"$sig"; then
              echo 'PRODUCTION STAT BAR PALETTE ASSETS OK'
              exit 0
            fi
            sleep 2
          done
          exit 1
