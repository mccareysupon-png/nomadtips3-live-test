name: ONE SHOT - Ball46 Final Rate Guard 20261004

on:
  push:
    branches: ['ops/ball46-stat-final-flow-20261004']
    paths:
      - '.github/workflows/ball46-final-rate-guard-deploy-20261004.yml'

permissions:
  contents: read

concurrency:
  group: ball46-engine-production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}

jobs:
  deploy-rate-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ball46-stat-final-flow-20261004
          fetch-depth: 1
      - name: Lock current Production, add provider backoff, preserve referee and verify
        shell: bash
        run: bash .github/scripts/ball46_final_rate_guard_deploy_20261004.sh
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-final-rate-guard-${{ github.run_id }}
          path: /tmp/b46-final-rate-guard/
          if-no-files-found: warn
          retention-days: 30
