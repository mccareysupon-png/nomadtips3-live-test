name: Audit Ball46 Affiliate Assets 20261007
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-ball46-affiliate-assets-20261007.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ball46-affiliate-assets-audit-20261007
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts acorn@8
      - name: Audit current Production affiliate assets
        working-directory: deploy-assets/ball46-affiliate-assets-audit-20261007
        run: node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-affiliate-assets-audit-${{ github.run_id }}
          path: deploy-assets/ball46-affiliate-assets-audit-20261007/audit
          retention-days: 7
