name: NOMAD 3.42 Nowgoal Event Stats Probe

on:
  push:
    branches: [work/342-settings-clean-rebuild]
    paths:
      - 'nomad-live-342/diagnostics/nowgoal-event-stats-probe.mjs'
      - '.github/workflows/nomad342-nowgoal-event-stats-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Probe Nowgoal public match statistics read-only
        run: node nomad-live-342/diagnostics/nowgoal-event-stats-probe.mjs
