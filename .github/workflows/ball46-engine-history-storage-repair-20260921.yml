name: Ball46 Engine History Storage Repair 20260921

on:
  push:
    branches: [work/ball46-full-market-20260918]
    paths:
      - '.github/workflows/ball46-engine-history-storage-repair-20260921.yml'

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BALL46_URL: https://www.ball46.com
  ENGINE_URL: https://nomadtips3-engine-343.mccarey-supon.workers.dev

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-full-market-20260918
          fetch-depth: 0

      - name: Bound histories to live rolling-window data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('workers/nomadtips3-engine-343/src/index.js')
          s=p.read_text()
          pairs=[
            ("const VERSION='nomad343-engine-v6-condition-integrity';","const VERSION='nomad343-engine-v7-history-storage-bound';"),
            ("const HISTORY_MS=180*60_000;","const HISTORY_MS=45*60_000;"),
            ("const MAX_HISTORY_ROWS=180;","const MAX_HISTORY_ROWS=45;"),
            ("return Response.json({ok:true,version:'nomad343-flow-history-v1',fixtureId,retainedMinutes:180,maxRows:MAX_HISTORY_ROWS,pressureWindowMinutes:minutes,weights:PRESSURE_WEIGHTS,firstAt:rows[0]?.at??null,lastAt:rows[rows.length-1]?.at??null,rows,pressure:pressureSeries(rows,minutes)})",
             "return Response.json({ok:true,version:'nomad343-flow-history-v1',fixtureId,retainedMinutes:45,maxRows:MAX_HISTORY_ROWS,pressureWindowMinutes:minutes,weights:PRESSURE_WEIGHTS,firstAt:rows[0]?.at??null,lastAt:rows[rows.length-1]?.at??null,rows,pressure:pressureSeries(rows,minutes)})")
          ]
          for old,new in pairs:
            assert old in s, f'missing expected source: {old[:80]}'
            s=s.replace(old,new,1)
          old="""      for(const f of hub.fixtures||[]){
        const id=String(f.fixtureId),arr=Array.isArray(oldHist[id])?oldHist[id].slice():[];
        if(isLive(f)){const snap=metricSnapshot(f,at);if(arr.length&&arr[arr.length-1].at===at)arr[arr.length-1]=snap;else arr.push(snap)}
        histories[id]=arr.filter(x=>at-x.at<=HISTORY_MS).slice(-MAX_HISTORY_ROWS);
      }"""
          new="""      for(const f of hub.fixtures||[]){
        if(!isLive(f))continue;
        const id=String(f.fixtureId),arr=Array.isArray(oldHist[id])?oldHist[id].slice():[];
        const snap=metricSnapshot(f,at);if(arr.length&&arr[arr.length-1].at===at)arr[arr.length-1]=snap;else arr.push(snap);
        histories[id]=arr.filter(x=>at-x.at<=HISTORY_MS).slice(-MAX_HISTORY_ROWS);
      }"""
          assert old in s, 'history loop source not found'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check workers/nomadtips3-engine-343/src/index.js
          git diff --check -- workers/nomadtips3-engine-343/src/index.js
          git diff -- workers/nomadtips3-engine-343/src/index.js
          grep -F "nomad343-engine-v7-history-storage-bound" workers/nomadtips3-engine-343/src/index.js
          grep -F "mode:'BOTH_LOW'" workers/nomadtips3-engine-343/src/index.js
          grep -F "board?.staleGuard===true||board?.stale===true" workers/nomadtips3-engine-343/src/index.js

      - name: Persist engine-only storage repair
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          test "$changed" = "workers/nomadtips3-engine-343/src/index.js"
          git config user.name 'ADD-K Engine Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add workers/nomadtips3-engine-343/src/index.js
          git commit -m 'fix(ball46): keep rolling history below durable storage limit'
          git push origin HEAD:work/ball46-full-market-20260918

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy ENGINE only
        working-directory: workers/nomadtips3-engine-343
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.toml
          npx --yes wrangler@4.92.0 deploy --config wrangler.toml

      - name: Force scan and verify storage recovery
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl -fsS --max-time 60 -X POST "$ENGINE_URL/scan?storagefix=$GITHUB_RUN_ID" -o /tmp/scan.json
          curl -fsS --max-time 30 "$ENGINE_URL/health?storagefix=$GITHUB_RUN_ID" -o /tmp/health.json
          curl -fsS --max-time 30 "$ENGINE_URL/board?storagefix=$GITHUB_RUN_ID" -o /tmp/engine-board.json
          curl -fsS --max-time 30 "$ENGINE_URL/signals?storagefix=$GITHUB_RUN_ID" -o /tmp/engine-signals.json
          node - <<'NODE'
          const fs=require('fs'),rd=p=>JSON.parse(fs.readFileSync(p));
          const scan=rd('/tmp/scan.json'),h=rd('/tmp/health.json'),b=rd('/tmp/engine-board.json'),s=rd('/tmp/engine-signals.json');
          let analyzed=0;for(const f of b.fixtures||[])if(Object.keys(f.analysis||{}).length)analyzed++;
          console.log('ENGINE_RECOVERY',{scanOk:scan.ok,lastError:scan.lastError,healthOk:h.ok,version:h.version,fixtures:(b.fixtures||[]).length,analyzed,pending:(s.signals||[]).length});
          if(scan?.ok!==true)throw Error('SCAN_NOT_RECOVERED '+JSON.stringify(scan));
          if(h?.ok!==true||h?.version!=='nomad343-engine-v7-history-storage-bound')throw Error('HEALTH_NOT_RECOVERED '+JSON.stringify(h));
          if(b?.ok!==true||analyzed<1)throw Error('ANALYSIS_NOT_RECOVERED');
          NODE

      - name: Verify Ball46 public condition path uses ENGINE again
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/board?storagefix=$GITHUB_RUN_ID" -o /tmp/public-board.json
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/signals?storagefix=$GITHUB_RUN_ID" -o /tmp/public-signals.json
          node - <<'NODE'
          const fs=require('fs'),rd=p=>JSON.parse(fs.readFileSync(p));
          const b=rd('/tmp/public-board.json'),s=rd('/tmp/public-signals.json');
          let analyzed=0;for(const f of b.fixtures||[])if(Object.keys(f.analysis||{}).length)analyzed++;
          console.log('PUBLIC_CONDITION_PATH',{ok:b.ok,version:b.version,fixtures:(b.fixtures||[]).length,analyzed,signals:(s.signals||[]).length});
          if(b?.ok!==true||analyzed<1)throw Error('PUBLIC_BOARD_STILL_FALLBACK '+JSON.stringify({ok:b.ok,version:b.version,analyzed}));
          if(s?.ok!==true)throw Error('PUBLIC_SIGNALS_FAIL');
          NODE
