name: BALL46 O/U full odds TEST post-deploy READONLY
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-ou-full-market-postdeploy-readonly-20261123.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify active TEST Worker API and preserved quote cap WITHOUT provider calls
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          const t=process.env.CLOUDFLARE_API_TOKEN,a=process.env.CLOUDFLARE_ACCOUNT_ID;
          const worker='ball46-prematch-only-test-20261120',ver='13835689-f001-4451-aa0c-b89da962602b';
          const api='https://api.cloudflare.com/client/v4/accounts/'+a+'/workers';
          const deployed=await fetch(api+'/scripts/'+worker+'/deployments?per_page=1',{headers:{authorization:'Bearer '+t}}).then(r=>r.json());
          assert(deployed.success);
          assert.equal(deployed.result.deployments[0].versions[0].version_id,ver);
          const host='https://'+worker+'.mccarey-supon.workers.dev';
          const key=crypto.createHmac('sha256',t).update('BALL46_PREMATCH_ONLY_V1').digest('hex');
          let state=null;
          for(let i=0;i<35;i++){
           const r=await fetch(host+'/ou-price-pickup-state',{headers:{authorization:'Bearer '+key},cache:'no-store',signal:AbortSignal.timeout(20000)});
           if(r.ok){
            const j=await r.json();
            if(j?.system==='O_U_VERIFIED_PRICE_PICKUP_TEST'&&j?.policy?.quoteMarket==='full_fixture_odds'){state=j;break}
           }
           await new Promise(r=>setTimeout(r,1500));
          }
          assert(state,'LATEST_OU_FULL_MARKET_ROUTE_NOT_SERVING');
          assert.equal(state.policy.maxProviderCallsPerLondonDay,1);
          const p=await fetch(host+'/preview-data',{headers:{authorization:'Bearer '+key},cache:'no-store'});
          assert(p.ok);
          const j=await p.json();
          assert.equal(j.ouLedger?.mode,'TEST_ONLY');
          console.log('B46_OU_FULL_MARKET_OWNER_READONLY_PASS '+JSON.stringify({
           deployedVersion:ver,marketFetch:'all native markets in one response',
           storedQuoteAttempts:state.lifetimeRequests,callsCurrentLondonDay:state.providerCallsToday,
           remaining:state.remainingToday,priced:state.pricedImported,
           issuedOU:j.ouLedger.rows.length,source:'PERSISTED_OU_LEDGER',
           cap:1,noPaidApiCallsDuringTest:true,productionChanges:0
          }));
          JS
