name: ONE SHOT - Ball46 Odds Slot 20260927

on:
  push:
    branches:
      - ops/ball46-odds-slot-20260927

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy and verify Odds setting under logo
        shell: bash
        run: bash .github/scripts/ball46_odds_slot_20260927.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-odds-slot-${{ github.run_id }}
          path: |
            /tmp/b46-backup
            /tmp/screens/odds-slot.png
            /tmp/odds-dom.html
          if-no-files-found: ignore
          retention-days: 30
