name: Audit BALL46 Pinned Fixtures V2 20261111
on:
  push:
    branches: [test/ball46-pinned-fixtures-v2-20261111]
    paths: ['pinned-fixtures-v2/AUDIT_READY']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: test/ball46-pinned-fixtures-v2-20261111}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p pinned-fixtures-v2 && node pinned-fixtures-v2/audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-fixtures-v2-audit-${{ github.run_id }}
          path: pinned-fixtures-v2/audit-*.json
          retention-days: 7
