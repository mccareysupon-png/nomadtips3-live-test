name: Sync Engine343 5Dollar secret 20260927

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-engine343-fivedollar-secret-20260927.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
    steps:
      - name: Sync exact working provider key to production engine
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${FIVEDOLLAR_API_KEY:-}" ]
          printf '%s' "$FIVEDOLLAR_API_KEY" | npx --yes wrangler@4.92.0 secret put FIVEDOLLAR_API_KEY --name nomadtips3-engine-343
      - name: Verify secret name remains bound
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 secret list --name nomadtips3-engine-343 | tee /tmp/secrets.txt
          grep -Fq 'FIVEDOLLAR_API_KEY' /tmp/secrets.txt
