name: BALL46 Member Loading — Recheck New Active (Read Only)
on:
  push:
    branches: [work/ball46-member-loading-20261020]
    paths: ['.github/workflows/member-loading-active-recheck-20261020.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify latest actual Member active version and public JS CSS read only
        run: node ball46-member/scripts/member-scrollbar-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: member-loading-active-recheck-${{ github.run_id }}
          path: audit/member-scrollbar-before/
          retention-days: 7
