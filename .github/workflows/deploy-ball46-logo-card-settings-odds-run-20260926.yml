name: Deploy Ball46 Logo Card Settings Odds RUN 20260926

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ball46-logo-card-settings-odds-run-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_BRANCH: work/ball46-logo-card-settings-odds-prod-safe-20260926
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated UI source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Mirror exact current Production and create rollback point
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod /tmp/rollback-snapshot/current-assets
          fetch_required(){
            name="$1"; safe="${name//\//_}"
            code=$(curl -sS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 -o "/tmp/prod/$safe" -w '%{http_code}' "$BALL46_WORKER/$name?b46-settings-copy=${GITHUB_RUN_ID}") || true
            [ "$code" = 200 ] || { echo "REQUIRED_PROD_ASSET_HTTP_${code}:$name"; exit 1; }
            test -s "/tmp/prod/$safe" || { echo "REQUIRED_PROD_ASSET_EMPTY:$name"; exit 1; }
            mkdir -p "$(dirname "nomad-live-343/$name")"
            cp "/tmp/prod/$safe" "nomad-live-343/$name"
          }
          fetch_required index.html
          cp nomad-live-343/index.html /tmp/rollback-snapshot/index.html
          grep -Fq 'workspace-brand-card' nomad-live-343/index.html
          grep -Fq 'workspace singlepage' nomad-live-343/index.html
          [ "$(grep -Fo 'workspace-brand-card' nomad-live-343/index.html | wc -l)" -eq 1 ]

          python3 - <<'PY' > /tmp/current-assets.txt
          from pathlib import Path
          import re
          h=Path('nomad-live-343/index.html').read_text(errors='ignore')
          found=set()
          for x in re.findall(r'''(?:src|href)=["']([^"']+)["']''',h,re.I):
              x=x.split('?',1)[0].split('#',1)[0].strip().lstrip('./').lstrip('/')
              if not x or '://' in x or '/' in x: continue
              if re.search(r'\.(?:js|css|svg|json|png|webp|jpg|jpeg|ico)$',x,re.I): found.add(x)
          for x in sorted(found): print(x)
          PY
          : > /tmp/protected.sha
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            fetch_required "$name"
            printf '%s  %s\n' "$(sha256sum "nomad-live-343/$name" | awk '{print $1}')" "$name" >> /tmp/protected.sha
            cp "nomad-live-343/$name" "/tmp/rollback-snapshot/current-assets/${name//\//_}"
          done < /tmp/current-assets.txt
          cp /tmp/protected.sha /tmp/rollback-snapshot/protected.sha
          printf 'run=%s\nsource=exact-current-production\nremove-marker=BALL46-LOGO-CARD-SETTINGS-ODDS\n' "$GITHUB_RUN_ID" > /tmp/rollback-snapshot/ROLLBACK_POINT.txt

          test -s nomad-live-343/ball46-logo-card-settings-odds-v1.css
          test -s nomad-live-343/ball46-logo-card-settings-odds-v1.js
          test -s nomad-live-343/odds-format-343.js
          grep -Fq 'BALL46-LOGO-CARD-SETTINGS-ODDS START' nomad-live-343/ball46-logo-card-settings-odds-v1.css
          grep -Fq 'BALL46-LOGO-CARD-SETTINGS-ODDS START' nomad-live-343/ball46-logo-card-settings-odds-v1.js
          ! grep -Fq 'fetch(' nomad-live-343/ball46-logo-card-settings-odds-v1.js
          ! grep -Fq '/api/' nomad-live-343/ball46-logo-card-settings-odds-v1.js
          ! grep -Fq 'fetch(' nomad-live-343/odds-format-343.js
          node --check nomad-live-343/ball46-logo-card-settings-odds-v1.js
          node --check nomad-live-343/odds-format-343.js

          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?b46-settings-before=${GITHUB_RUN_ID}" -o /tmp/board-before.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?b46-settings-before=${GITHUB_RUN_ID}" -o /tmp/signals-before.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/statistics?b46-settings-before=${GITHUB_RUN_ID}" -o /tmp/stats-before.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/board-before.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals-before.json'));
          const t=JSON.parse(fs.readFileSync('/tmp/stats-before.json'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures)) throw Error('PRE_BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals)) throw Error('PRE_SIGNALS_UNHEALTHY');
          if(t?.ok!==true||!Array.isArray(t?.rows)) throw Error('PRE_STATS_UNHEALTHY');
          console.log('PRE_BACKEND_OK',{fixtures:b.fixtures.length,signals:s.signals.length,settled:t.rows.length});
          NODE

      - name: Upload exact pre-change rollback snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ball46-pre-logo-settings-odds-${{ github.run_id }}
          path: /tmp/rollback-snapshot
          retention-days: 30

      - name: Add only removable UI loaders to current Production index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('nomad-live-343/index.html')
          s=p.read_text()
          s=re.sub(r'\s*<!-- BALL46-LOGO-CARD-SETTINGS-ODDS LOADER START -->.*?<!-- BALL46-LOGO-CARD-SETTINGS-ODDS LOADER END -->\s*','\n',s,flags=re.S)
          if s.count('</head>')!=1 or s.count('</body>')!=1: raise SystemExit('HTML_ANCHOR_COUNT_BAD')
          css='<!-- BALL46-LOGO-CARD-SETTINGS-ODDS LOADER START -->\n<link rel="stylesheet" href="ball46-logo-card-settings-odds-v1.css?v=20260926a">\n<!-- BALL46-LOGO-CARD-SETTINGS-ODDS LOADER END -->'
          s=s.replace('</head>',css+'\n</head>',1)
          scripts=[]
          if not re.search(r'<script[^>]+src=["\'][^"\']*odds-format-343\.js',s,re.I):
              scripts.append('<script src="odds-format-343.js?v=343-odds-format-v4-topbar-fixed&ui=20260926" defer></script>')
          scripts.append('<script src="ball46-logo-card-settings-odds-v1.js?v=20260926a" defer></script>')
          block='<!-- BALL46-LOGO-CARD-SETTINGS-ODDS LOADER START -->\n'+'\n'.join(scripts)+'\n<!-- BALL46-LOGO-CARD-SETTINGS-ODDS LOADER END -->'
          s=s.replace('</body>',block+'\n</body>',1)
          p.write_text(s)
          PY
          grep -Fq 'ball46-logo-card-settings-odds-v1.css?v=20260926a' nomad-live-343/index.html
          grep -Fq 'ball46-logo-card-settings-odds-v1.js?v=20260926a' nomad-live-343/index.html
          while read -r expected f; do
            actual=$(sha256sum "nomad-live-343/$f" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "PROTECTED_LOCAL_CHANGED:$f"; exit 1; }
          done < /tmp/protected.sha

      - name: Dry run exact Production package
        shell: bash
        run: |
          set -euo pipefail
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy UI-only package
        id: deploy
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify UI and backend continuity
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 20); do
            curl -fsS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 "$BALL46_WORKER/index.html?b46-settings-after=${GITHUB_RUN_ID}-${n}" -o /tmp/index.after.html || true
            curl -fsS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 "$BALL46_WORKER/ball46-logo-card-settings-odds-v1.css?b46-settings-after=${GITHUB_RUN_ID}-${n}" -o /tmp/settings.after.css || true
            curl -fsS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 "$BALL46_WORKER/ball46-logo-card-settings-odds-v1.js?b46-settings-after=${GITHUB_RUN_ID}-${n}" -o /tmp/settings.after.js || true
            if grep -Fq 'ball46-logo-card-settings-odds-v1.css?v=20260926a' /tmp/index.after.html \
              && grep -Fq 'ball46-logo-card-settings-odds-v1.js?v=20260926a' /tmp/index.after.html \
              && grep -Fq 'BALL46-LOGO-CARD-SETTINGS-ODDS START' /tmp/settings.after.css \
              && grep -Fq 'BALL46-LOGO-CARD-SETTINGS-ODDS START' /tmp/settings.after.js; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo 'SETTINGS_ODDS_NOT_LIVE'; exit 1; }
          node --check /tmp/settings.after.js
          ! grep -Fq 'fetch(' /tmp/settings.after.js
          ! grep -Fq '/api/' /tmp/settings.after.js

          while read -r expected f; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/$f?b46-settings-protected=${GITHUB_RUN_ID}" -o "/tmp/protected-${f//\//_}"
            actual=$(sha256sum "/tmp/protected-${f//\//_}" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "PROTECTED_DEPLOY_CHANGED:$f"; exit 1; }
          done < /tmp/protected.sha

          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?b46-settings-final=${GITHUB_RUN_ID}" -o /tmp/board-after.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?b46-settings-final=${GITHUB_RUN_ID}" -o /tmp/signals-after.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/statistics?b46-settings-final=${GITHUB_RUN_ID}" -o /tmp/stats-after.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/board-after.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals-after.json'));
          const t=JSON.parse(fs.readFileSync('/tmp/stats-after.json'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures)) throw Error('POST_BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals)) throw Error('POST_SIGNALS_UNHEALTHY');
          if(t?.ok!==true||!Array.isArray(t?.rows)) throw Error('POST_STATS_UNHEALTHY');
          console.log('BALL46_SETTINGS_ODDS_PASS',{fixtures:b.fixtures.length,signals:s.signals.length,settled:t.rows.length});
          NODE

      - name: Auto rollback index if verification fails after deploy
        if: failure() && steps.deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/rollback-snapshot/index.html nomad-live-343/index.html
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc
