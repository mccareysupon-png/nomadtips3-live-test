name: BALL46 Signal latest-first mobile layout read-only QA
on:
  push:
    branches: [test/ball46-premium-match-colors-20261120]
    paths: ['.github/workflows/ball46-signal-mobile-layout-check-20261121.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Verify 390px mobile Signal viewport and expanded flow
        run: |
          node --input-type=module <<'NODE'
          import {chromium,devices} from 'playwright';
          const b=await chromium.launch(),p=await b.newPage({...devices['iPhone 13'],viewport:{width:390,height:844},serviceWorkers:'block'});
          await p.addInitScript(()=>localStorage.setItem('nomad343_dashboard_theme_v1','dark'));
          await p.goto('https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev/?view=signal',{waitUntil:'domcontentloaded',timeout:65000});
          await p.waitForFunction(()=>window.__b46SignalStableStatus?.seenSource===true&&document.querySelector('.status-section[data-status-section="live"] .match-row'),null,{timeout:45000});
          await p.waitForTimeout(700);
          const read=()=>p.evaluate(()=>{
            const root=document.querySelector('.status-section[data-status-section="live"]'),board=document.querySelector('.board-sections'),unified=root?.querySelector('.b46-signal-unified-head');
            const rows=[...root?.querySelectorAll('.match-row')||[]].map(e=>({id:e.dataset.matchId,rect:{x:e.getBoundingClientRect().x,y:e.getBoundingClientRect().y,w:e.getBoundingClientRect().width,h:e.getBoundingClientRect().height},order:getComputedStyle(e).order,league:e.querySelector('.b46-signal-league-chip')?.textContent})).sort((a,b)=>a.rect.y-b.rect.y);
            return {viewport:innerWidth,docWidth:document.documentElement.scrollWidth,bodyWidth:document.body.scrollWidth,rows,unified:unified?{display:getComputedStyle(unified).display,w:unified.getBoundingClientRect().width,h:unified.getBoundingClientRect().height}:null,board:board?{w:board.getBoundingClientRect().width,h:board.clientHeight,scroll:board.scrollTop}:null,flow:!!document.querySelector('.expand-flow-card'),state:window.__b46SignalStableQA.state()};
          });
          const before=await read();console.log('B46_SIGNAL_MOBILE_LAYOUT '+JSON.stringify(before));
          const first=p.locator('.status-section[data-status-section="live"] .match-row').first();
          await first.click({position:{x:50,y:25},force:true});
          await p.waitForTimeout(700);
          const after=await read();console.log('B46_SIGNAL_MOBILE_FLOW '+JSON.stringify(after));
          if(before.docWidth>before.viewport+5)throw Error('MOBILE_SIGNAL_HORIZONTAL_OVERFLOW');
          if(before.rows.length<1)throw Error('NO_MOBILE_SIGNAL_ROWS');
          if(before.rows.some(r=>r.rect.w>before.viewport+5))throw Error('MOBILE_SIGNAL_ROW_TOO_WIDE');
          if(!after.flow)throw Error('MOBILE_EVENT_FLOW_MISSING');
          if(after.state.frozen===null)throw Error('MOBILE_EVENT_FLOW_NOT_FROZEN');
          console.log('B46_SIGNAL_MOBILE_TEST_PASS');
          await b.close();
          NODE