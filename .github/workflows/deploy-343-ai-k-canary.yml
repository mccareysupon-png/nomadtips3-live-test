name: Deploy 3.43 AI K Canonical Ultra Only

on:
  push:
    branches: [work/nomad343-ai-k-win-only-20260914-stage1]
    paths:
      - 'nomad-live-343/ai-k-343.js'
      - 'nomad-live-343/ai-k-settings-343.js'
      - 'nomad-live-343/index.html'
      - 'nomad-live-343/settings.html'
      - '.github/workflows/deploy-343-ai-k-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PROD_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev

jobs:
  validate-and-deploy-ultra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scope guard
        run: |
          set -euo pipefail
          BASE=8056ec5f0b30c3da0a26bf681f385ce6d1f995de
          git diff --name-only "$BASE" HEAD | tee /tmp/changed
          while IFS= read -r f; do
            case "$f" in
              nomad-live-343/ai-k-343.js|nomad-live-343/ai-k-settings-343.js|nomad-live-343/index.html|nomad-live-343/settings.html|.github/workflows/deploy-343-ai-k-canary.yml) ;;
              *) echo "UNEXPECTED CHANGE: $f"; exit 1;;
            esac
          done < /tmp/changed
          git diff --quiet "$BASE" HEAD -- workers/nomadtips3-engine-343 || { echo 'ENGINE MUST REMAIN UNCHANGED'; exit 1; }
          git diff --quiet "$BASE" HEAD -- workers/nomadtips3-5usd-hub-343 || { echo 'HUB MUST REMAIN UNCHANGED'; exit 1; }
          git diff --quiet "$BASE" HEAD -- workers/nomadtips3-343-full-market || { echo 'FULL MARKET MUST REMAIN UNCHANGED'; exit 1; }
          git diff --quiet "$BASE" HEAD -- nomad-live-341 || { echo '3.41 MUST REMAIN UNCHANGED'; exit 1; }

      - name: Validate AI K zero-request design
        run: |
          set -euo pipefail
          node --check nomad-live-343/ai-k-343.js
          node --check nomad-live-343/ai-k-settings-343.js
          grep -Fq "AI เซียน K" nomad-live-343/ai-k-settings-343.js
          grep -Fq "bookmaker:'Bet365'" nomad-live-343/ai-k-343.js
          if grep -Eq "fetch\(|XMLHttpRequest|WebSocket" nomad-live-343/ai-k-343.js; then echo 'AI K MUST NOT CREATE NETWORK REQUESTS'; exit 1; fi
          grep -Fq 'ai-k-343.js?v=343-ai-k-win-only-v1' nomad-live-343/index.html
          grep -Fq 'ai-k-settings-343.js?v=343-ai-k-settings-v2' nomad-live-343/settings.html

      - name: Validate deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Dry run canonical ultra viewer only
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc

      - name: Deploy AI K to canonical ultra viewer only
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Smoke canonical settings and live pages
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            if curl -fsS --max-time 30 "$PROD_URL/settings.html?ai_k=$RANDOM" -o /tmp/settings.html && \
               curl -fsS --max-time 30 "$PROD_URL/?ai_k=$RANDOM" -o /tmp/live.html; then break; fi
            sleep 2
          done
          grep -Fq 'ai-k-settings-343.js?v=343-ai-k-settings-v2' /tmp/settings.html
          grep -Fq 'ai-k-343.js?v=343-ai-k-win-only-v1' /tmp/live.html
          curl -fsS --max-time 30 "$PROD_URL/ai-k-settings-343.js?x=$RANDOM" -o /tmp/ai-settings.js
          curl -fsS --max-time 30 "$PROD_URL/ai-k-343.js?x=$RANDOM" -o /tmp/ai.js
          grep -Fq 'AI เซียน K' /tmp/ai-settings.js
          if grep -Eq "fetch\(|XMLHttpRequest|WebSocket" /tmp/ai.js; then echo 'DEPLOYED AI K NETWORK REQUEST FOUND'; exit 1; fi
          echo "AI K ULTRA READY: $PROD_URL/settings.html"
