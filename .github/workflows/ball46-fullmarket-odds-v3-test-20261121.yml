name: BALL46 Full Market Odds Movement V3 isolated TEST
on:
  push:
    branches: [test/ball46-fullmarket-odds-v3-20261121]
    paths:
      - '.github/workflows/ball46-fullmarket-odds-v3-test-20261121.yml'
      - 'qa/fullmarket-odds-v3-20261121/fullmarket-odds-v3.mjs'
      - 'qa/fullmarket-odds-v3-20261121/qa.mjs'
      - 'qa/fullmarket-odds-v3-20261121/worker.mjs'
      - 'qa/fullmarket-odds-v3-20261121/wrangler.toml'
permissions: {contents: read}
concurrency:
  group: b46-fullmarket-v3-isolated-test-20261121
  cancel-in-progress: true
jobs:
  stage-and-qa:
    if: github.ref == 'refs/heads/test/ball46-fullmarket-odds-v3-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate client and read-only Worker source
        run: |
          node --check qa/fullmarket-odds-v3-20261121/fullmarket-odds-v3.mjs
          node --check qa/fullmarket-odds-v3-20261121/worker.mjs
          node --check qa/fullmarket-odds-v3-20261121/qa.mjs
      - name: Deploy to standalone TEST Worker only, not BALL46 Production
        run: npx --yes wrangler@4.50.0 deploy --config qa/fullmarket-odds-v3-20261121/wrangler.toml --name ball46-fullmarket-odds-v3-test-20261121
      - name: Verify bookmaker movement, no fake flashes, default untouched on desktop/mobile
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.55.0
          npx playwright install chromium --only-shell
          node qa/fullmarket-odds-v3-20261121/qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b46-fullmarket-odds-v3-test-report-${{ github.run_id }}
          path: qa-fullmarket-v3-*.png
          if-no-files-found: ignore
          retention-days: 10