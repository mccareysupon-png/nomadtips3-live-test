name: BALL46 desktop sticky membership test only
on:
  push:
    branches: [test/ball46-sticky-membership-20261120]
    paths: ['.github/workflows/sticky-membership-test-20261120.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy isolated test only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --check qa/sticky-membership-20261120/worker.mjs
          cat > qa/sticky-membership-20261120/wrangler.toml <<'EOF'
          name = "ball46-sticky-membership-test-20261120"
          main = "worker.mjs"
          compatibility_date = "2026-11-20"
          workers_dev = true
          preview_urls = false
          [[services]]
          binding = "B46_PRODUCTION_READ"
          service = "ball46-production"
          EOF
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';import {writeFile} from 'node:fs/promises';
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/ball46-production/deployments?per_page=1',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});const j=await r.json();assert(j.success);await writeFile(process.env.RUNNER_TEMP+'/prod-before.json',JSON.stringify(j.result.deployments[0].versions));
          EOF
          for attempt in 1 2 3; do
            if npx --yes wrangler@4.50.0 deploy --config qa/sticky-membership-20261120/wrangler.toml --name ball46-sticky-membership-test-20261120; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Verify desktop sticky membership and unchanged mobile
        run: |
          npm install --prefix qa/sticky-membership-20261120/.runtime --no-audit --no-fund playwright@1.55.0
          qa/sticky-membership-20261120/.runtime/node_modules/.bin/playwright install chromium --only-shell
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';import {createRequire} from 'node:module';
          const {chromium,devices}=createRequire(process.cwd()+'/qa/sticky-membership-20261120/.runtime/package.json')('playwright');
          const base='https://ball46-sticky-membership-test-20261120.mccarey-supon.workers.dev';
          let health;for(let i=0;i<15;i++){try{const r=await fetch(base+'/_sticky_membership_health');if(r.ok){health=await r.json();break}}catch{}await new Promise(r=>setTimeout(r,2000))}
          assert.equal(health?.scope,'TEST_ONLY_STICKY_MEMBERSHIP');assert.equal(health?.revision,'STICKY_MEMBERSHIP_V3');assert.equal((await fetch(base+'/_sticky_membership_health',{method:'POST'})).status,405);
          const browser=await chromium.launch();try{
          for(const mode of ['desktop-dark','desktop-light','wide-dark','mobile-dark','mobile-light']){
            const mobile=mode.startsWith('mobile'),theme=mode.endsWith('dark')?'dark':'light';
            const p=await browser.newPage(mobile?{...devices['iPhone 13'],serviceWorkers:'block'}:{viewport:{width:mode.startsWith('wide')?1920:1440,height:950},serviceWorkers:'block'});
            await p.addInitScript(t=>localStorage.setItem('nomad343_dashboard_theme_v1',t),theme);
            await p.route('**/*',r=>['GET','HEAD'].includes(r.request().method())?r.continue():r.abort());
            await p.goto(base+'/index.html?view=statistics',{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForFunction(()=>document.querySelector('#b46-finance-chart-card')?.getBoundingClientRect().height>0,null,{timeout:60000});
            const get=()=>p.evaluate(()=>{const e=document.querySelector('[data-workspace-panel="statistics"] > .b46-stat-member-top');if(!e)return null;const r=e.getBoundingClientRect(),s=getComputedStyle(e),a=e.querySelector('a'),mask=getComputedStyle(e,'::before'),rail=document.querySelector('.left-rail'),bar=document.querySelector('.b46-sidebar-outside-scroll');return {railY:rail?.getBoundingClientRect().y,barY:bar?.getBoundingClientRect().y,mask:{bg:mask.backgroundColor,top:mask.top,position:mask.position,bodyBG:getComputedStyle(document.body).backgroundColor,htmlBG:getComputedStyle(document.documentElement).backgroundColor,hit:e.contains(document.elementFromPoint(r.left+r.width/2,4))},y:r.y,x:r.x,w:r.width,h:r.height,pos:s.position,z:s.zIndex,top:s.top,href:a?.href,display:s.display,viewport:innerHeight,scroll:scrollY,docH:document.documentElement.scrollHeight,hit:r.height>0&&e.contains(document.elementFromPoint(Math.min(innerWidth-1,r.right-30),r.top+r.height/2))}});
            const before=await get();
            if(!mobile){
              assert(before&&before.h>0&&before.w>500,'BANNER_MISSING');assert.equal(before.pos,'sticky');assert(before.href.includes('member.ball46.com'));
              await p.mouse.move(750,450);await p.mouse.wheel(0,100);await p.waitForTimeout(500);
              const after=await get();assert(after.scroll>=90,'PAGE_NOT_SCROLLABLE');assert(Math.abs(after.y-before.y)<=1,'BANNER_FIRST_WHEEL_JUMP '+JSON.stringify(after));assert(Math.abs(after.railY-before.railY)<=1,'SIDEBAR_FIRST_WHEEL_JUMP '+JSON.stringify(after));assert(Math.abs(after.barY-before.barY)<=1,'OUTSIDE_SCROLLBAR_JUMP');assert(after.mask.position==='absolute'&&after.mask.top==='-18px'&&after.mask.bg!=='rgba(0, 0, 0, 0)'&&after.mask.hit,'TOP_CONTENT_MASK_MISSING '+JSON.stringify(after.mask));assert(Math.abs(after.w-before.w)<=1&&Math.abs(after.h-before.h)<=1,'BANNER_DIMENSIONS_CHANGED');assert(after.hit,'BANNER_OCCLUDED');
              await p.mouse.wheel(0,650);await p.waitForTimeout(500);const deeper=await get();assert(deeper.scroll>after.scroll,'DEEP_SCROLL_MISSING');assert(Math.abs(deeper.y-before.y)<=1,'BANNER_LOST_WHILE_SCROLLING');assert(deeper.mask.hit,'SCROLLED_CONTENT_LEAKS_ABOVE_BANNER');
              console.log('STICKY_PROOF '+JSON.stringify({mode,before,after,deeper}));
            }else{assert(!before||before.pos!=='sticky','MOBILE_STICKY_LEAK');console.log('STICKY_PROOF '+JSON.stringify({mode,before}));}
            await p.close();
          }
          }finally{await browser.close()}
          EOF
      - name: Confirm Production unchanged
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';import {readFile} from 'node:fs/promises';
          const before=await readFile(process.env.RUNNER_TEMP+'/prod-before.json','utf8');const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/ball46-production/deployments?per_page=1',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});const j=await r.json();assert(j.success);assert.deepEqual(j.result.deployments[0].versions,JSON.parse(before));console.log('PRODUCTION_UNCHANGED')
          EOF
