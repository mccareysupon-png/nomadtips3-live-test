# Verified browser analytics audit 39436107274 passed before activation.
name: BALL46 Visitor Monitor Analytics V1 (isolated, preserve latest)
on:
  push:
    branches: [work/ball46-traffic-intelligence-isolated-20261020]
    paths: ['.github/workflows/ball46-visitor-monitor-analytics-v1.yml']
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [audit, deploy]
        default: audit
        required: true
permissions:
  contents: read
concurrency:
  group: b46-visitor-monitor-deploy-only
  cancel-in-progress: false
jobs:
  analytics-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: traffic-intelligence/isolated-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and regression tests
        run: |
          node --check worker.mjs
          node --check analytics.mjs
          node --check web-analytics.mjs
          node --check deploy.mjs
          node --test worker.test.mjs analytics.test.mjs web-analytics.test.mjs
      - name: Verify exact latest state and preserve isolated Admin bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || (github.event.head_commit.message == 'Activate verified BALL46 browser visits [visitor-web-analytics-deploy-v1]' && 'deploy' || 'audit') }}
        run: node deploy.mjs "$ACTION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visitor-monitor-web-analytics-evidence
          path: traffic-intelligence/isolated-deploy/deployment-evidence/
          retention-days: 30
