name: BALL46 Statistics Old-UI Flash Diagnosis READ ONLY
on:
  push:
    branches: [audit/ball46-statistics-ui-flash-20261022]
    paths:
      - '.github/workflows/ball46-stats-flash-audit-20261022.yml'
      - 'deploy-assets/statistics-flash-20261022/audit-stats.mjs'
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Measure Statistics initial paint and transitions without production changes
        working-directory: deploy-assets/statistics-flash-20261022
        run: |
          npm install --no-save --ignore-scripts puppeteer-core@24
          node audit-stats.mjs
      - name: Archive first-render screenshots and DOM timeline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-statistics-flash-first-paint-20261022
          path: deploy-assets/statistics-flash-20261022/proof/
          retention-days: 14
          if-no-files-found: warn