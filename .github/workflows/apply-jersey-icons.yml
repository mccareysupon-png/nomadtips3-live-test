name: Apply Compact Jersey Icons

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/apply_jersey_icons.py"
      - ".github/workflows/apply-jersey-icons.yml"

permissions:
  contents: write

concurrency:
  group: apply-compact-jersey-icons
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace initials with compact shirts
        run: python3 scripts/apply_jersey_icons.py

      - name: Commit page update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Use compact colored team jersey icons"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
