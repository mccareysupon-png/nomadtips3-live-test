name: Ball46 Dashboard Owner Scout 20261004

on:
  push:
    branches: [work/card-flicker-scout-20261004]
    paths:
      - '.github/workflows/ball46-dashboard-owner-scout-20261004.yml'
      - 'deploy-assets/match-status-svg-20261003/dashboard-owner-scout.mjs'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install read-only scout dependencies
        working-directory: deploy-assets/match-status-svg-20261003
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Trace dashboard public-file owner from current Production
        working-directory: deploy-assets/match-status-svg-20261003
        run: node dashboard-owner-scout.mjs
      - name: Retain owner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-dashboard-owner-scout-${{ github.run_id }}
          path: deploy-assets/match-status-svg-20261003/audit/
          if-no-files-found: error
          retention-days: 14
