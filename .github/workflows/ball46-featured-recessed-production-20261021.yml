name: BALL46 Featured Match — Guarded Recessed Production
on:
  push:
    branches: [codex/ball46-featured-recessed-prod-20261021]
    paths:
      - '.github/workflows/ball46-featured-recessed-production-20261021.yml'
      - 'deploy-assets/featured-match-clean-preview-20261021/deploy-featured-recessed.mjs'
      - 'deploy-assets/featured-match-clean-preview-20261021/production-payload.mjs'
      - 'deploy-assets/featured-match-clean-preview-20261021/clean-featured.mjs'
      - 'deploy-assets/featured-match-clean-preview-20261021/clean-featured.css'
      - 'deploy-assets/featured-match-clean-preview-20261021/recessed-facts-production.css'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  guarded-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployed source syntax and install headless browser
        working-directory: deploy-assets/featured-match-clean-preview-20261021
        run: |
          set -euo pipefail
          node --check deploy-featured-recessed.mjs
          node --check production-payload.mjs
          node --check clean-featured.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
      - name: Verify Candidate and current production; deploy only approved Featured Match and post-test
        working-directory: deploy-assets/featured-match-clean-preview-20261021
        run: node deploy-featured-recessed.mjs
      - name: Preserve before/after screenshots and deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-featured-recessed-pc-mobile-production-proof
          path: deploy-assets/featured-match-clean-preview-20261021/audit/
          retention-days: 30
          if-no-files-found: warn
