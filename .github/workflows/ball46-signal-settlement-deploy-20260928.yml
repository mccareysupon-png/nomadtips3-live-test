name: ONE SHOT - Ball46 Signal Settlement Scorebar Deploy 20260928
on:
  push:
    branches:
      - work/ball46-scorebar-signal-settlement-20260928
    paths:
      - '.github/workflows/ball46-signal-settlement-deploy-20260928.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Download exact proven V5 candidate
        uses: actions/download-artifact@v4
        with:
          name: ball46-signal-settlement-predeploy-v5-36379588125
          path: /tmp/b46-scorebar-result-predeploy
          github-token: ${{ github.token }}
          run-id: 36379588125
      - name: Deploy exact Signal-settlement patch with race guards
        run: bash .github/scripts/ball46_signal_settlement_deploy_wrapper_20260928.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-signal-settlement-deploy-${{ github.run_id }}
          path: /tmp/b46-scorebar-result-deploy-verify
          if-no-files-found: ignore
          retention-days: 30
