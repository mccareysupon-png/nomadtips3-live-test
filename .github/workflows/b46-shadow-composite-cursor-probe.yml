name: B46 real archive composite cursor (staging only)
on:
  push:
    branches: [chatgpt/ball46-new-ledger-clean-v1]
    paths: ['.github/workflows/b46-shadow-composite-cursor-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b46-shadow-isolated-persistence-probe
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '62cb0db544160e6591342abd6b4f35cc'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check ten real archived rows with overlap and late arrival on durable storage
        working-directory: chatgpt-statistics-ui
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler-shadow-probe.toml <<'CONF'
          name = "ball46-shadow-persistence-probe-20261117"
          main = "shadow-real-persistence-probe.mjs"
          compatibility_date = "2026-11-17"
          workers_dev = true
          [vars]
          PROBE_GENERATION = "two"
          [[services]]
          binding = "PRODUCTION_READ"
          service = "ball46-production"
          [[durable_objects.bindings]]
          name = "PROBE_BOOK"
          class_name = "ShadowPersistenceProbe"
          [[migrations]]
          tag = "probe-v1"
          new_sqlite_classes = ["ShadowPersistenceProbe"]
          CONF
          node --check shadow-real-persistence-probe.mjs
          grep -Fx 'name = "ball46-shadow-persistence-probe-20261117"' wrangler-shadow-probe.toml
          npx --yes wrangler@4 deploy --config wrangler-shadow-probe.toml
          TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" | npx --yes wrangler@4 secret put PROBE_TOKEN --config wrangler-shadow-probe.toml
          BASE="https://ball46-shadow-persistence-probe-20261117.mccarey-supon.workers.dev"
          RUN="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          READY=false
          for i in $(seq 1 20); do
            code=$(curl -sS --max-time 20 -o /tmp/ready.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$BASE/state?run=$RUN" || true)
            if [ "$code" = "200" ]; then READY=true; break; fi
            sleep 3
          done
          test "$READY" = true
          sleep 5
          for i in $(seq 1 10); do
            CODE=$(curl -sS --max-time 60 -o /tmp/gap.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" "$BASE/cursor-probe?run=$RUN")
            echo "CURSOR_PROBE_HTTP=$CODE attempt=$i"
            if [ "$CODE" != "403" ]; then break; fi
            sleep 3
          done
          if [ "$CODE" != "200" ]; then
            node -e 'try{const d=require("/tmp/gap.json");console.log("CURSOR_PROBE_ERROR="+String(d.error||"UNKNOWN").replace(/[^a-zA-Z0-9_: .-]/g,"").slice(0,120))}catch{console.log("CURSOR_PROBE_NON_JSON_ERROR")}'
            exit 1
          fi
          node -e 'const d=require("/tmp/gap.json");const a=d.rounds;if(!d.ok||a[0].total!==4||a[1].total!==9||a[2].total!==10||a[2].late!==1||a[2].duplicates!==9||d.sourceCommitSequenceVerified!==false)throw Error("COMPOSITE_CURSOR_FAILED");console.log("REAL_COMPOSITE_CURSOR="+JSON.stringify({ok:d.ok,rounds:a.map(({cursor,...rest})=>({...rest,time:cursor.settled_at})),realSameTimestamp:d.realSameTimestamp,sourceCommitSequenceVerified:false}))'
