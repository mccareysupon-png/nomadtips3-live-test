name: Ball46 Rollback Inspect2 20260920

on:
  push:
    branches: [ops/ball46-rollback-inspect2-20260920]
    paths:
      - '.github/workflows/ball46-rollback-inspect2-20260920.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: List Ball46 versions
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 versions list --config wrangler.ball46.jsonc --json
      - name: List Ball46 deployments
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deployments list --config wrangler.ball46.jsonc --json
