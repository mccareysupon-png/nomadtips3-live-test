name: BALL46 isolated real history cache connection
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-prematch-real-connect.yml']
permissions:
  contents: read
jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check qa/prematch-history-20261120/real-worker.mjs
          node --test qa/prematch-history-20261120/history.test.mjs
      - name: Deploy isolated cache-only history connector
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node qa/prematch-history-20261120/real-deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-history-evidence
          path: evidence/
          retention-days: 7

# Retry only the existing isolated connector, retaining its SQLite namespace and logging non-JSON status.
