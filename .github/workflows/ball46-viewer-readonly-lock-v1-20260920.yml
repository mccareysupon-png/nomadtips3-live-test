name: Ball46 Viewer Readonly Lock V1 20260920

on:
  push:
    branches:
      - work/ball46-viewer-readonly-lock-v1-20260920
    paths:
      - .github/workflows/ball46-viewer-readonly-lock-v1-20260920.yml

permissions:
  contents: write

env:
  BALL46_URL: https://ball46.com
  BALL46_EXPECTED_VERSION: 54341a26-03be-45b3-87e2-9abfc1818856
  ENGINE_SOURCE_SHA: efb5da1920183b6034dc41ced0eb119929a182d9
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run guarded migration and verification
        shell: bash
        run: bash scripts/ball46-viewer-readonly-lock-deploy-v1.sh

      - name: Upload rollback and audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-viewer-readonly-lock-v1-${{ github.run_id }}
          path: |
            /tmp/ball46-viewer-readonly-rb0-${{ github.run_id }}.tar.gz
            /tmp/engine-lock.diff
            /tmp/engine-deploy.log
            /tmp/ball46-lock-deploy.log
            /tmp/final-*.json
          if-no-files-found: warn
          retention-days: 30
