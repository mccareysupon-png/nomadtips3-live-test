name: BALL46 HCR V1 history cargo registry SQLite TEST
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths:
      - 'qa/prematch-history-20261120/history-cargo-registry.mjs'
      - 'qa/prematch-history-20261120/history-cargo-registry.test.mjs'
      - 'qa/prematch-history-20261120/history-five-rounds.mjs'
      - 'qa/prematch-history-20261120/history-five-rounds.test.mjs'
      - 'qa/prematch-history-20261120/prematch-only-worker.mjs'
      - '.github/workflows/b46-hcr-v1-cargo-registry-test-20261122.yml'
permissions: {contents: read}
jobs:
  offline-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run five-round accounting, manifest and quota regressions offline
        run: |
          node --test qa/prematch-history-20261120/history-five-rounds.test.mjs qa/prematch-history-20261120/history-cargo-registry.test.mjs qa/prematch-history-20261120/normal-hub-monitor.test.mjs qa/prematch-history-20261120/rescheduled-ledger.test.mjs
          echo 'HCR-V1 TEST PASS: offline SQLite only, no API, no provider or Production'
