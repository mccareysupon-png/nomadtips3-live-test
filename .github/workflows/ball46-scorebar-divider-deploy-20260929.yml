name: ONE SHOT - Ball46 Scorebar Divider Deploy 20260929

on:
  push:
    branches:
      - work/ball46-scorebar-images-20260929
    paths:
      - '.github/workflows/ball46-scorebar-divider-deploy-20260929.yml'

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-scorebar-images-20260929
      - uses: actions/download-artifact@v4
        with:
          name: ball46-scorebar-divider-predeploy-36554072800
          path: /tmp
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36554072800
      - name: Prepare browser verifier before any Production mutation
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Deploy exact two-file divider camouflage with race guards
        shell: bash
        run: bash .github/scripts/ball46_scorebar_divider_deploy_20260929.sh
      - name: Verify actual Production divider and geometry at desktop tablet mobile
        run: node .github/scripts/ball46_scorebar_divider_post_browser_20260929.js
      - name: Guarded rollback to exact pre-divider 83-asset snapshot on failure
        if: failure()
        shell: bash
        run: bash .github/scripts/ball46_scorebar_divider_rollback_20260929.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-scorebar-divider-deploy-${{ github.run_id }}
          path: |
            /tmp/b46-divider-deploy
            /tmp/b46-divider-post-browser
            /tmp/b46-divider-rollback
          if-no-files-found: ignore
          retention-days: 30
