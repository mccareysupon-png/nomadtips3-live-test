name: TEMP CAR 3.1 Live Display Verify

on:
  push:
    branches:
      - fix/car31-live-display-source-truth-reset-20260816

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply source-truth display reset
        run: |
          python - <<'PY'
          from pathlib import Path

          app=Path('car3-1-hybrid-live-engine/web/app.js')
          s=app.read_text()

          def rep(old,new,label):
              global s
              if old not in s:
                  if new in s:
                      return
                  raise SystemExit(f'missing patch target: {label}')
              s=s.replace(old,new,1)

          rep("matches=[],selected=0;","matches=[],selectedId=null;",'selected id state')
          rep("${i===selected?'active':''}","${m.id===selectedId?'active':''}",'active candidate by id')
          rep("document.querySelectorAll('.candidate').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.index);render();});","document.querySelectorAll('.candidate').forEach(b=>b.onclick=()=>{selectedId=matches[Number(b.dataset.index)]?.id||null;render();});",'candidate click id')

          old="function render(){renderMetrics();renderCandidates();if(!matches.length)return;const m=matches[Math.min(selected,matches.length-1)],d=m.serverEngine||localDecision(m);"
          new="function clearDetail(){for(const [id,value] of Object.entries({homeTeam:'—',awayTeam:'—',matchMinute:'—',scoreText:'—',leagueText:'—'})){const el=$('#'+id);if(el)el.textContent=value;}for(const id of ['sourceRow','statsGrid','pitchStats','evidenceGrid','oddsGrid','events','sourceTrace','gateList']){const el=$('#'+id);if(el)el.innerHTML='';}const p=$('#pressureChart'),d=$('#dangerChart');if(p)p.innerHTML='';if(d)d.innerHTML='';const tag=$('#possessionTag');if(tag)tag.textContent='WAITING FOR LIVE MATCH';}\nfunction render(){renderMetrics();renderCandidates();if(!matches.length){clearDetail();return;}const m=matches.find(x=>x.id===selectedId)||matches[0];selectedId=m.id;const d=m.serverEngine||localDecision(m);"
          rep(old,new,'clear stale finished detail')

          old="snapshots=snaps.snapshots||[];matches=(live.matches||[]).map(adapt);$('#lastUpdate').textContent=live.generatedAt?new Date(live.generatedAt).toLocaleTimeString():'live collector';render();"
          new="snapshots=snaps.snapshots||[];const generated=Date.parse(live.generatedAt||'');const sourceFresh=Boolean(live?.ok)&&Number.isFinite(generated)&&Date.now()-generated<=90000;const rows=sourceFresh?(live.matches||[]).filter(row=>{const s=String(row?.status||'LIVE').toUpperCase();return s!=='FT'&&!s.includes('FINISH')&&s!=='SCHEDULED'&&s!=='NS';}):[];matches=rows.map(adapt);if(!matches.some(m=>m.id===selectedId))selectedId=matches[0]?.id||null;$('#lastUpdate').textContent=live.generatedAt?new Date(live.generatedAt).toLocaleTimeString():'live collector';render();"
          rep(old,new,'fresh live rows only')
          rep("setInterval(()=>load().catch(()=>{}),30000);","setInterval(()=>load().catch(()=>{}),5000);",'5 second source refresh')
          app.write_text(s)

          for filename,prefix in [
              ('car3-1-hybrid-live-engine/web/index.html','./'),
              ('car3-1-hybrid-live-engine/monitor/index.html','../web/')
          ]:
              p=Path(filename); html=p.read_text()
              app_src=f'src="{prefix}app.js"'
              app_new=f'src="{prefix}app.js?v=20260816-source-truth-reset"'
              if app_src in html: html=html.replace(app_src,app_new,1)
              elif app_new not in html: raise SystemExit(f'missing app cache target: {filename}')
              import re
              html,n=re.subn(r'src="'+re.escape(prefix)+r'signal-polish\.js\?v=[^"]+"',f'src="{prefix}signal-polish.js?v=20260816-source-truth-reset"',html,count=1)
              if n!=1 and 'source-truth-reset' not in html: raise SystemExit(f'missing signal cache target: {filename}')
              p.write_text(html)
          PY
      - name: Syntax check display scripts
        run: |
          node --check car3-1-hybrid-live-engine/web/app.js
          node --check car3-1-hybrid-live-engine/web/signal-polish.js
      - name: Guard source-truth behavior
        run: |
          ! grep -q "clockState" car3-1-hybrid-live-engine/web/signal-polish.js
          ! grep -q "sourceFreshnessSeconds" car3-1-hybrid-live-engine/web/signal-polish.js
          grep -q "selectedId" car3-1-hybrid-live-engine/web/app.js
          grep -q "clearDetail" car3-1-hybrid-live-engine/web/app.js
          grep -q "90000" car3-1-hybrid-live-engine/web/app.js
          grep -q "5000" car3-1-hybrid-live-engine/web/app.js
      - name: Inspect current CAR 3.1 live source
        run: |
          curl -fsS --retry 3 --retry-delay 2 "https://nomadtips3-car31-goaloo.mccarey-supon.workers.dev/live?t=$(date +%s)" -o /tmp/live.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/live.json').read_text())
          print('ok=',data.get('ok'),'generatedAt=',data.get('generatedAt'))
          rows=data.get('matches') or []
          print('matches=',len(rows))
          ended=[]
          for r in rows:
              status=str(r.get('status') or '').upper()
              print(r.get('sourceMatchId'), status, r.get('minute'), r.get('home'), 'vs', r.get('away'))
              if status=='FT' or 'FINISH' in status:
                  ended.append(r.get('sourceMatchId'))
          print('ended_in_live=',ended)
          if ended:
              raise SystemExit('FT/FINISHED match leaked into /live')
          PY
      - name: Commit reset patch
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git config user.name "NOMADTIPS3 verification"
          git config user.email "actions@users.noreply.github.com"
          git add car3-1-hybrid-live-engine/web/app.js car3-1-hybrid-live-engine/web/index.html car3-1-hybrid-live-engine/monitor/index.html
          git commit -m "Reset CAR 3.1 live display to source truth"
          git push origin HEAD:fix/car31-live-display-source-truth-reset-20260816
