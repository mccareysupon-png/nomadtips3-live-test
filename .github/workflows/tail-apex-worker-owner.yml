name: Tail Apex Worker Owner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tail-apex-worker-owner.yml'

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  ZONE_ID: 35badb923b6451ed5109276f20b6c749

jobs:
  tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect apex live and Cloudflare redirect capability
        shell: bash
        run: |
          set +e
          echo '=== DNS APEX ==='
          dig @1.1.1.1 +short CNAME nomadtips3.com
          dig @1.1.1.1 +short A nomadtips3.com
          echo '=== DNS WWW ==='
          dig @1.1.1.1 +short CNAME www.nomadtips3.com
          dig @1.1.1.1 +short A www.nomadtips3.com
          echo '=== APEX LIVE ==='
          curl -sS -D /tmp/apex.h -o /tmp/apex.html --max-time 20 "https://nomadtips3.com/?liveprobe=${GITHUB_RUN_ID}"
          sed -n '1,40p' /tmp/apex.h
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/apex.html').read_text(errors='ignore') if Path('/tmp/apex.html').exists() else ''
          m=re.search(r'<title[^>]*>(.*?)</title>',t,re.I|re.S)
          print('apex_title=',re.sub(r'\s+',' ',m.group(1)).strip() if m else 'NONE')
          print('apex_bytes=',len(t.encode()))
          print('has_redirect=', 'www.nomadtips3.com' in t and ('location.replace' in t or 'location.href' in t))
          PY
          echo '=== WWW LIVE ==='
          curl -sS -D /tmp/www.h -o /tmp/www.html --max-time 20 "https://www.nomadtips3.com/?liveprobe=${GITHUB_RUN_ID}"
          sed -n '1,40p' /tmp/www.h
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('/tmp/www.html').read_text(errors='ignore') if Path('/tmp/www.html').exists() else ''
          m=re.search(r'<title[^>]*>(.*?)</title>',t,re.I|re.S)
          print('www_title=',re.sub(r'\s+',' ',m.group(1)).strip() if m else 'NONE')
          print('www_bytes=',len(t.encode()))
          PY
          echo '=== RULESETS ==='
          code=$(curl -sS -o /tmp/rulesets.json -w '%{http_code}' -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/rulesets")
          echo "rulesets_http=$code"
          cat /tmp/rulesets.json
