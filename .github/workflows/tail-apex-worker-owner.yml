name: Tail Apex Worker Owner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tail-apex-worker-owner.yml'

permissions:
  contents: read

env:
  ZONE_ID: 35badb923b6451ed5109276f20b6c749
  T1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  T2: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
  T3: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
  T4: ${{ secrets.CLOUDFLARE_TOKEN }}
  T5: ${{ secrets.CF_API_TOKEN }}
  T6: ${{ secrets.CF_DNS_TOKEN }}
  T7: ${{ secrets.CLOUDFLARE_ZONE_API_TOKEN }}
  T8: ${{ secrets.CLOUDFLARE_PROD_TOKEN }}
  T9: ${{ secrets.CLOUDFLARE_PRODUCTION_TOKEN }}
  T10: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
  CF_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
  CF_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
  CF_GLOBAL_KEY: ${{ secrets.CLOUDFLARE_GLOBAL_API_KEY }}

jobs:
  tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Find existing Cloudflare credential with DNS or redirect access
        shell: bash
        run: |
          set +e
          test_token(){
            name="$1"; token="$2"
            if [ -z "$token" ]; then echo "$name present=no"; return; fi
            dns=$(curl -sS -o /tmp/${name}-dns.json -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=nomadtips3.com")
            rules=$(curl -sS -o /tmp/${name}-rules.json -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/rulesets")
            echo "$name present=yes dns_http=$dns rulesets_http=$rules"
          }
          test_token T1 "$T1"
          test_token T2 "$T2"
          test_token T3 "$T3"
          test_token T4 "$T4"
          test_token T5 "$T5"
          test_token T6 "$T6"
          test_token T7 "$T7"
          test_token T8 "$T8"
          test_token T9 "$T9"
          test_token T10 "$T10"
          if [ -n "$CF_EMAIL" ]; then echo 'CF_EMAIL present=yes'; else echo 'CF_EMAIL present=no'; fi
          if [ -n "$CF_KEY" ]; then echo 'CF_KEY present=yes'; else echo 'CF_KEY present=no'; fi
          if [ -n "$CF_GLOBAL_KEY" ]; then echo 'CF_GLOBAL_KEY present=yes'; else echo 'CF_GLOBAL_KEY present=no'; fi
          if [ -n "$CF_EMAIL" ] && [ -n "$CF_KEY" ]; then
            code=$(curl -sS -o /tmp/keydns.json -w '%{http_code}' -H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_KEY" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=nomadtips3.com")
            echo "EMAIL+CF_KEY dns_http=$code"
          fi
          if [ -n "$CF_EMAIL" ] && [ -n "$CF_GLOBAL_KEY" ]; then
            code=$(curl -sS -o /tmp/globaldns.json -w '%{http_code}' -H "X-Auth-Email: $CF_EMAIL" -H "X-Auth-Key: $CF_GLOBAL_KEY" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=nomadtips3.com")
            echo "EMAIL+CF_GLOBAL_KEY dns_http=$code"
          fi
