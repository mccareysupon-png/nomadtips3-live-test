name: Tail Apex Worker Owner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tail-apex-worker-owner.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Tail likely web Workers while probing apex
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            nomadtips3-car35-preview
            nomadtips3-live-web-production
            nomadtips3-car341-preview
            nomadtips3-car34-real-market-audit
          )

          for worker in "${candidates[@]}"; do
            echo "===== TAIL $worker ====="
            rm -f /tmp/tail.log /tmp/tail.err
            timeout 18s npx --yes wrangler@4.92.0 tail "$worker" --format json > /tmp/tail.log 2>/tmp/tail.err &
            pid=$!
            sleep 5
            marker="owner-tail-${worker}-${GITHUB_RUN_ID}-$(date +%s%N)"
            curl -sS --max-time 20 -o /dev/null -H "X-Nomad-Owner-Probe: $marker" "https://nomadtips3.com/?${marker}=1" || true
            sleep 5
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            echo '--- TAIL OUT ---'
            cat /tmp/tail.log || true
            echo '--- TAIL ERR ---'
            cat /tmp/tail.err || true
            if grep -Fq "$marker" /tmp/tail.log /tmp/tail.err 2>/dev/null; then
              echo "OWNER_MATCH=$worker"
            else
              echo "NO_MATCH=$worker"
            fi
          done
