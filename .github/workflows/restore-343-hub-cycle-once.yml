name: Restore NOMAD 3.43 HUB Cycle Once

on:
  push:
    branches: [work/nomad343-clean-bet365-ui]
    paths:
      - '.github/workflows/restore-343-hub-cycle-once.yml'

permissions:
  contents: read

jobs:
  restore-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Restore prior 15 second live bulk cycle
        run: |
          set -euo pipefail
          URL='https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev'
          curl -fsS --max-time 30 -X PUT -H 'content-type: application/json' --data '{"liveRefreshSeconds":15,"autoReturnMinutes":0}' "$URL/api/hub/control" -o /tmp/control.json
          node -e 'const j=require("/tmp/control.json");if(j.ok!==true||Number(j.control?.liveRefreshSeconds)!==15)throw Error("restore failed");console.log("RESTORED",j.control.liveRefreshSeconds,"seconds")'
          curl -fsS --max-time 30 "$URL/api/hub/health?verify=$RANDOM" -o /tmp/health.json
          node -e 'const j=require("/tmp/health.json");if(Number(j.control?.liveRefreshSeconds)!==15)throw Error("health mismatch");console.log("HEALTH cycle",j.control.liveRefreshSeconds,"rpm",j.estimatedBulkRequestsPerMinute,"limit",j.accountLimitPerMinute)'
