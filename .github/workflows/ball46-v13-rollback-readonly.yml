name: BALL46 V13 Failed-Purge Rollback Verification - Read Only
on:
  push:
    branches: [fix/ball46-featured-flag-flicker-v13-20261022]
    paths:
      - '.github/workflows/ball46-v13-rollback-readonly.yml'
      - 'deploy-assets/featured-flicker-v13/rollback-verify.mjs'
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify active Worker rollback and site bytes without making changes
        run: node deploy-assets/featured-flicker-v13/rollback-verify.mjs
