name: Deploy Ball46 Member V1

on:
  push:
    branches:
      - member/ball46-member-v1-20261008
    paths:
      - 'ball46-member/**'
      - '.github/workflows/deploy-ball46-member-v1-20261008.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-member-production-deploy
  cancel-in-progress: false

jobs:
  deploy-member:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: member/ball46-member-v1-20261008
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate isolated member package
        working-directory: ball46-member
        shell: bash
        run: |
          set -euo pipefail
          test -f wrangler.jsonc
          test -f src/worker.js
          test -f public/pricing.html
          test -f public/member.html
          grep -Fq '"name": "ball46-member-production"' wrangler.jsonc
          ! grep -R -Fq '"name": "ball46-production"' .
          node --check src/worker.js
          node --check public/pricing.js
          node --check public/member.js
          echo "BALL46_MEMBER_PACKAGE_VALID"

      - name: Dry run isolated Member worker
        working-directory: ball46-member
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc

      - name: Deploy isolated Member worker
        working-directory: ball46-member
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Verify Member mirror against live Ball46
        shell: bash
        run: |
          set -euo pipefail
          base="https://ball46-member-production.mccarey-supon.workers.dev"
          prod="https://www.ball46.com"

          for n in {1..20}; do
            if curl -fsS --max-time 20 "$base/api/health?run=${GITHUB_RUN_ID}" -o /tmp/health.json 2>/dev/null; then
              if jq -e '.ok==true and .service=="ball46-member-production"' /tmp/health.json >/dev/null; then
                break
              fi
            fi
            sleep 2
          done
          jq -e '.ok==true and .service=="ball46-member-production"' /tmp/health.json >/dev/null

          curl -fsS --max-time 20 "$base/pricing?run=${GITHUB_RUN_ID}" -o /tmp/pricing.html
          grep -Fq 'Daily signals. One screen.' /tmp/pricing.html
          curl -fsS --max-time 20 "$base/member?run=${GITHUB_RUN_ID}" -o /tmp/member.html
          grep -Fq 'Daily Signal Center' /tmp/member.html

          curl -fsS --max-time 45 "$base/api/member/daily?refresh=1&run=${GITHUB_RUN_ID}" -o /tmp/member-daily.json
          jq -e '.ok==true and .prototype==false and .source=="BALL46_PRODUCTION_LEDGER_V2" and .timezone=="Asia/Bangkok" and .cutoffLocal=="12:00"' /tmp/member-daily.json >/dev/null
          jq -e '.signals | (type=="array")' /tmp/member-daily.json >/dev/null

          first_id="$(jq -r '.signals[0].id // empty' /tmp/member-daily.json)"
          if [ -n "$first_id" ]; then
            curl -fsS --max-time 45 "$prod/api/engine/statistics?paged=1&member_qa=${GITHUB_RUN_ID}" -o /tmp/prod-stats.json
            jq -e --arg id "$first_id" '.rows | any(.id==$id)' /tmp/prod-stats.json >/dev/null
            jq --arg id "$first_id" '.rows[] | select(.id==$id)' /tmp/prod-stats.json | head -n 1 > /tmp/source-row.json

            jq -e --slurpfile src /tmp/source-row.json '
              .signals[0] as $m | $src[0] as $s |
              ($m.id == ($s.id|tostring)) and
              ($m.fixtureId == ($s.fixtureId|tostring)) and
              ($m.signalMinute == ($s.entryMinute // $s.minute)) and
              ($m.sourceMarket == ($s.market // "")) and
              ($m.selection == (($s.selection // "—")|ascii_upcase)) and
              ($m.line == $s.line) and
              ($m.odds == $s.odds) and
              ($m.bookmaker == ($s.bookmaker // "—")) and
              ($m.entryScore.home == ($s.entryScore.home // $s.scoreAt.home // null)) and
              ($m.entryScore.away == ($s.entryScore.away // $s.scoreAt.away // null))
            ' /tmp/member-daily.json >/dev/null

            fixture="$(jq -r '.signals[0].fixtureId' /tmp/member-daily.json)"
            curl -fsS --max-time 45 "$base/api/member/match?fixtureId=$fixture&run=${GITHUB_RUN_ID}" -o /tmp/member-match.json
            jq -e '.ok==true and .source=="BALL46_PRODUCTION_MIRROR"' /tmp/member-match.json >/dev/null
          fi

          echo "BALL46_MEMBER_DEPLOY_SUCCESS signals=$(jq -r '.signalCount' /tmp/member-daily.json) pages=$(jq -r '.pagesRead' /tmp/member-daily.json)"
