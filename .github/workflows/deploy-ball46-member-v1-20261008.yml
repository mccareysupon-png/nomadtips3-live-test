name: Deploy Ball46 Member V1

on:
  push:
    branches:
      - member/ball46-member-v1-20261008
    paths:
      - 'ball46-member/**'
      - '.github/workflows/deploy-ball46-member-v1-20261008.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-member-production-deploy
  cancel-in-progress: false

jobs:
  deploy-member:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: member/ball46-member-v1-20261008
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate isolated member package
        working-directory: ball46-member
        shell: bash
        run: |
          set -euo pipefail
          test -f wrangler.jsonc
          test -f src/worker.js
          test -f public/pricing.html
          test -f public/member.html
          grep -Fq '"name": "ball46-member-production"' wrangler.jsonc
          ! grep -R -Fq '"name": "ball46-production"' .
          node --check src/worker.js
          node --check src/access-auth.js
          node --check src/checkout.js
          node --test tests/*.test.mjs
          node --check public/pricing.js
          node --check public/event-flow-icons.js
          grep -Fq '/event-flow-icons.js' public/member.html
          node --check public/member.js
          echo "BALL46_MEMBER_PACKAGE_VALID"

      - name: Dry run isolated Member worker
        working-directory: ball46-member
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc

      - name: Deploy isolated Member worker
        working-directory: ball46-member
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Verify Member mirror against live Ball46
        shell: bash
        run: |
          set -euo pipefail
          base="https://ball46-member-production.mccarey-supon.workers.dev"
          prod="https://www.ball46.com"

          for n in {1..20}; do
            if curl -fsS --max-time 20 "$base/api/health?run=${GITHUB_RUN_ID}" -o /tmp/health.json 2>/dev/null; then
              if jq -e '.ok==true and .service=="ball46-member-production"' /tmp/health.json >/dev/null; then
                break
              fi
            fi
            sleep 2
          done
          jq -e '.ok==true and .service=="ball46-member-production"' /tmp/health.json >/dev/null

          curl -fsS --max-time 20 "$base/pricing?run=${GITHUB_RUN_ID}" -o /tmp/pricing.html
          grep -Fq 'Daily signals. One screen.' /tmp/pricing.html

          # Production security gate: unauthenticated users must not see member data.
          for endpoint in "/api/member/daily" "/api/member/match?fixtureId=123"; do
            status="$(curl -sS --max-time 20 -o /tmp/blocked.json -w '%{http_code}' "$base$endpoint")"
            echo "SECURITY_GATE endpoint=$endpoint http=$status body=$(cat /tmp/blocked.json | head -c 150)"
            test "$status" = 401
            jq -e '.ok==false and .error=="MEMBERSHIP_AUTH_REQUIRED"' /tmp/blocked.json >/dev/null
          done
          for endpoint in "/member" "/member.html"; do
            status="$(curl -sS --max-time 20 -o /dev/null -D /tmp/member-headers.txt -w '%{http_code}' "$base$endpoint")"
            echo "MEMBER_REDIRECT_GATE endpoint=$endpoint status=$status"
            test "$status" = 303
            grep -Eiq '^location: https://ball46-member-production\.mccarey-supon\.workers\.dev/pricing\?membership=required' /tmp/member-headers.txt
          done
          status="$(curl -sS --max-time 20 -o /tmp/stripe-readiness.json -w '%{http_code}' "$base/api/member/stripe-readiness")"
          test "$status" = 401
          jq -e '.error=="OWNER_AUTH_REQUIRED"' /tmp/stripe-readiness.json >/dev/null
          status="$(curl -sS --max-time 20 -o /tmp/identity.json -w '%{http_code}' "$base/api/member/checkout")"
          test "$status" = 401
          jq -e '.error=="IDENTITY_AUTH_REQUIRED"' /tmp/identity.json >/dev/null
          curl -fsS --max-time 20 "$base/api/enrollment-status" -o /tmp/enrollment.json
          expected_enrollment="$(jq -r '.vars.MEMBER_CHECKOUT_ENABLED' ball46-member/wrangler.jsonc)"
          jq -e --arg enabled "$expected_enrollment" '.ok==true and .enrollmentAvailable==($enabled=="true")' /tmp/enrollment.json >/dev/null
          curl -fsS --max-time 20 "$base/api/member/session" -o /tmp/session.json
          jq -e '.ok==true and .authenticated==false and .member==null' /tmp/session.json >/dev/null
          checkout_status="$(curl -sS --max-time 20 -X POST -o /tmp/checkout.json -w '%{http_code}' "$base/api/stripe/checkout")"
          echo "CHECKOUT_GATE http=$checkout_status body=$(cat /tmp/checkout.json | head -c 150)"
          test "$checkout_status" = 503
          jq -e '.error=="CHECKOUT_DISABLED_UNTIL_VERIFIED_ENTITLEMENTS"' /tmp/checkout.json >/dev/null
          echo "BALL46_MEMBER_FAIL_CLOSED_VERIFIED"
          echo "BALL46_MEMBER_PRODUCTION_SECURITY_DEPLOY_SUCCESS"
