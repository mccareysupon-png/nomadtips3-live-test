name: Scout BALL46 Affiliate Price Links 20261107
on:
  push:
    branches: [test/ball46-affiliate-link-scout-20261107]
    paths:
      - 'scout-affiliate-links-20261107/READY'
permissions:
  contents: read
jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/ball46-affiliate-link-scout-20261107
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect affiliate links around prices and bookmakers
        working-directory: scout-affiliate-links-20261107
        run: node scout.mjs
