name: BALL46 Bulk Live V1 read-only baseline
on:
  push:
    branches: [codex/ball46-bulk-live-v1-20261101]
    paths: ['work/ball46-bulk-live-v1-20261101/audit-request.json']
permissions:
  contents: write
jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: work/ball46-bulk-live-v1-20261101
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read current Cloudflare versions and settings only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node preflight.mjs
      - name: Commit baseline for review, never deploy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit
          git commit -m "Record read-only Bulk Live production baseline [skip ci]"
          git push origin HEAD:codex/ball46-bulk-live-v1-20261101
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bulk-live-baseline-${{ github.run_id }}
          path: work/ball46-bulk-live-v1-20261101/audit
