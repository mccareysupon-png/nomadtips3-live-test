name: BALL46 BTTS odds bridge read-only post-upload route verify
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-btts-quote-bridge-readonly-deployed-route-verify-20261122.yml]
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Prove version modules and owner route (zero odds calls, zero writes)
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          assert(token&&account);
          const api='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers';
          const name='ball46-prematch-only-test-20261120';
          const host='https://'+name+'.mccarey-supon.workers.dev';
          const bearer='Bearer '+crypto.createHmac('sha256',token).update('BALL46_PREMATCH_ONLY_V1').digest('hex');
          const cf=async(path)=>{
            const r=await fetch(api+path,{headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
            const d=await r.json();
            assert(r.ok&&d.success,JSON.stringify(d.errors??[]));
            return d.result;
          };
          const deployments=await cf('/scripts/'+name+'/deployments?per_page=1');
          const version=deployments.deployments[0].versions[0].version_id;
          const active=await cf('/workers/'+name+'/versions/'+version+'?include=modules');
          const main=active.modules.find(x=>x.name==='prematch-only-worker.mjs');
          const price=active.modules.find(x=>x.name==='btts-priced-fixture-pickup-test.mjs');
          const source=main?Buffer.from(main.content_base64,'base64').toString('utf8'):'';
          const codeStatus={version,modules:active.modules.length,priceModulePresent:!!price,
            mainPriceRoute:source.includes("path==='/btts-price-pickup-state'"),
            mainPriceScheduled:source.includes("const quoteTick=await stub.fetch('https://prematch.internal/btts-price-pickup-tick'"),
            oldTruckRetained:source.includes("path==='/btts-bulk-v2-trip'"),
            botStillPresent:source.includes("path==='/btts-cycle-test'")};
          console.log('B46_BTTS_BRIDGE_ACTIVE_CODE '+JSON.stringify(codeStatus));
          const probes=[];
          for(let i=0;i<6;i++){
            const res=await fetch(host+'/btts-price-pickup-state?check='+i,{headers:{authorization:bearer},cache:'no-store',signal:AbortSignal.timeout(16000)});
            const body=await res.text();
            let parsed;try{parsed=JSON.parse(body)}catch{parsed=null}
            probes.push({status:res.status,url:res.url,code:parsed?.transport?.code??null,body:body.slice(0,300)});
            if(res.ok&&parsed?.system==='BTTS_PRICE_PICKUP_TEST')break;
            await new Promise(r=>setTimeout(r,3500));
          }
          console.log('B46_BTTS_BRIDGE_ROUTE_PROBES '+JSON.stringify(probes));
          assert(price&&codeStatus.mainPriceRoute&&codeStatus.mainPriceScheduled,'PRICE_MODULE_NOT_ACTIVE');
          assert(probes.some(x=>x.status===200&&x.code==='B46_BTTS_BET365_PRICE_PICKUP_TEST'),
            'NEW_OWNER_READONLY_ROUTE_NOT_RESPONDING_YET');
          console.log('B46_BTTS_BRIDGE_READONLY_ROUTE_PASS '+JSON.stringify({version,routeStatus:200,
            paid5usdRequests:0,providerWrites:0,productionWrites:0}));
          JS
