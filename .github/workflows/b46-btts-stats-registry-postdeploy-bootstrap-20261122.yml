name: BALL46 BTTS Stats Registry V1 ACTIVE TEST Bootstrap and Audit
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-btts-stats-registry-postdeploy-bootstrap-20261122.yml]
permissions:
  contents: read
concurrency:
  group: ball46-prematch-stats-registry-bootstrap-test-20261122
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Bootstrap active TEST Snapshot and audit historic stats, no provider request
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          assert(token&&account);
          const name='ball46-prematch-only-test-20261120',activeExpected='81f20185-f2dc-4c37-a5f7-9453ed37acf8';
          const root='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers';
          const host='https://'+name+'.mccarey-supon.workers.dev';
          const auth='Bearer '+crypto.createHmac('sha256',token).update('BALL46_PREMATCH_ONLY_V1').digest('hex');
          async function cf(path){const r=await fetch(root+path,{headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});const j=await r.json();assert(r.ok&&j.success,'CF_'+r.status);return j.result;}
          async function version(n){const j=await cf('/scripts/'+n+'/deployments?per_page=1');return j.deployments?.[0]?.versions?.[0]?.version_id;}
          async function owner(p,method='GET'){
            const r=await fetch(host+p,{method,headers:{authorization:auth},cache:'no-store',signal:AbortSignal.timeout(16000)});
            const raw=await r.text();if(!r.ok)throw Error('OWNER_'+p+'_HTTP_'+r.status+'_'+raw.slice(0,120));
            return JSON.parse(raw);
          }
          assert.equal(await version(name),activeExpected,'ACTIVE_TEST_VERSION_CHANGED');
          const active=await cf('/workers/'+name+'/versions/'+activeExpected+'?include=modules');
          assert(active.modules.some(m=>m.name==='prematch-stats-registry-test.mjs'),'REGISTRY_MODULE_MISSING');
          const protectedNames=['ball46-production','nomadtips3-engine-343','nomadtips3-5usd-hub-343',
            'ball46-premium-match-colors-test-20261120'];
          const protectedBefore=Object.fromEntries(await Promise.all(protectedNames.map(async n=>[n,await version(n)])));
          let boot,lastError,attempts=0;
          for(let i=0;i<75;i++){
            attempts=i+1;
            try{boot=await owner('/prematch-stats-registry-sync-test','POST');assert.equal(boot.audit.verified,true);break}
            catch(e){lastError=e;if(i<74)await new Promise(r=>setTimeout(r,1400))}
          }
          assert(boot,'REGISTRY_OWNER_NOT_READY_'+String(lastError));
          const repeat=await owner('/prematch-stats-registry-sync-test','POST');
          assert.equal(repeat.update.processed,0,'DUPLICATED_SNAPSHOT_EVENTS');
          assert.equal(repeat.audit.verified,true,'BAD_STATS_SNAPSHOT_AUDIT');
          const registry=await owner('/prematch-stats-registry-test?days=90');
          const registry30=await owner('/prematch-stats-registry-test?days=30');
          const ledger=await owner('/test-ledger'),hcr=await owner('/history-cargo-registry?detail=0');
          const hist=await owner('/btts-history-private-test');
          assert.equal(registry.code,'B46_PREMATCH_STATS_REGISTRY_V1');
          assert.equal(ledger.rows.length,75);assert.equal(hcr.registry.code,'HCR-V1');
          assert.equal(hist.archive.privateFT,20);
          assert.equal(registry.markets['1X2'].total,ledger.rows.length);
          assert.equal(registry.markets.TOTAL.total,registry.markets['1X2'].total+registry.markets.BTTS.total);
          assert.equal(registry.fullLedgerRecalculationOnRead,false);
          const url='https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev';
          let webVerified=false,webTries=0;
          for(let i=0;i<40;i++){
            webTries=i+1;
            try{
              const r=await fetch(url+'/__b46_prematch_data',{cache:'no-store',signal:AbortSignal.timeout(15000)});
              assert(r.ok,'WEB_STATUS_'+r.status);
              const j=await r.json();
              assert.equal(j.statsRegistry?.code,registry.code);
              assert.equal(j.bttsLedger?.stats?.total,registry.markets.BTTS.total);
              assert.equal(j.allLedger?.stats?.total,registry.markets.TOTAL.total);
              assert.equal(j.testLedger?.rows?.length,75);
              webVerified=true;break;
            }catch(e){if(i===39)throw e;await new Promise(r=>setTimeout(r,1300))}
          }
          assert(webVerified);
          assert.deepEqual(Object.fromEntries(await Promise.all(protectedNames.map(async n=>[n,await version(n)]))),protectedBefore);
          console.log('B46_STATS_REGISTRY_V1_POSTDEPLOY_ACTIVE_PASS '+JSON.stringify({
            active:activeExpected,attempts,webTries,registry:registry.code,
            events:registry.registryEvents,oneX2:registry.markets['1X2'],
            btts:registry.markets.BTTS,total:registry.markets.TOTAL,
            days90:{btts:registry.dailySeries.BTTS.length,total:registry.dailySeries.TOTAL.length},
            days30:{btts:registry30.dailySeries.BTTS.length,total:registry30.dailySeries.TOTAL.length},
            repeatedSync:repeat.update.processed,audit:repeat.audit.verified,
            privateFT:hist.archive.privateFT,hcrFT:hcr.inventory.finishedFixtures,
            links:{predictions:url+'/?b46pm=predictions',btts:url+'/?b46pm=btts',all:url+'/?b46pm=all'},
            providerCallsAdded:0,productionWrites:0,uiUnchanged:true
          }));
          JS
