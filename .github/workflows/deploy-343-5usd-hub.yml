name: Deploy 3.43 5USD Hub

on:
  push:
    branches:
      - work/nomad343-clean-bet365-ui
      - work/nomad343-dashboard-v2-bulk-20260915
    paths:
      - 'workers/nomadtips3-5usd-hub-343/**'
      - '.github/workflows/deploy-343-5usd-hub.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
  HUB_URL: https://nomadtips3-5usd-hub-343.mccarey-supon.workers.dev

jobs:
  deploy-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify current 3.43 hub scope
        run: |
          set -euo pipefail
          node --check workers/nomadtips3-5usd-hub-343/src/index-v2.js
          grep -Fq "const VERSION='nomad343-5usd-hub-v5-rate-telemetry'" workers/nomadtips3-5usd-hub-343/src/index-v2.js
          grep -Fq 'main = "src/index-v2.js"' workers/nomadtips3-5usd-hub-343/wrangler.toml
          grep -Fq "crons = [\"*/2 * * * *\"]" workers/nomadtips3-5usd-hub-343/wrangler.toml
          grep -Fq "x-ratelimit-remaining" workers/nomadtips3-5usd-hub-343/src/index-v2.js
          grep -Fq "providerUsedInWindow" workers/nomadtips3-5usd-hub-343/src/index-v2.js
          if grep -R "nomadtips3-shot-sidecar-342\|nomadtips3-342-signal-engine" workers/nomadtips3-5usd-hub-343; then
            echo '::error::3.43 hub must not depend on 3.42 runtime'; exit 1
          fi

      - name: Dry-run hub bundle
        working-directory: workers/nomadtips3-5usd-hub-343
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.toml

      - name: Validate credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$FIVEDOLLAR_API_KEY" || { echo '::error::Missing FIVEDOLLAR_API_KEY'; exit 1; }

      - name: Deploy 3.43 hub
        working-directory: workers/nomadtips3-5usd-hub-343
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.toml

      - name: Bind 5USD API key
        working-directory: workers/nomadtips3-5usd-hub-343
        run: printf '%s' "$FIVEDOLLAR_API_KEY" | npx --yes wrangler@4.92.0 secret put FIVEDOLLAR_API_KEY --config wrangler.toml

      - name: Verify hub telemetry without direct provider probe
        run: |
          set -euo pipefail
          curl -fsS --max-time 45 "$HUB_URL/snapshot?_=$RANDOM$RANDOM" -o /tmp/hub-snapshot.json
          curl -fsS --max-time 20 "$HUB_URL/health?_=$RANDOM$RANDOM" -o /tmp/hub-health.json
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/hub-snapshot.json','utf8'));
          const h=JSON.parse(fs.readFileSync('/tmp/hub-health.json','utf8'));
          const sample=(Array.isArray(s.fixtures)?s.fixtures:[]).slice(0,3).map(x=>({fixtureId:x.fixtureId,league:x.league?.name,home:x.home?.name,away:x.away?.name,minute:x.minute}));
          console.log(JSON.stringify({health:h,snapshot:{ok:s.ok,version:s.version,provider:s.provider,fixtureCount:s.fixtureCount,ageMs:s.ageMs,stale:s.stale,providerRequestCount:s.providerRequestCount,providerUsedInWindow:s.providerUsedInWindow,estimatedKnownRequestsPerMinute:s.estimatedKnownRequestsPerMinute,lastError:s.lastError},sample},null,2));
          if(s.ok!==true||h.ok!==true)process.exit(1);
          if(s.version!=='nomad343-5usd-hub-v5-rate-telemetry'||h.version!=='nomad343-5usd-hub-v5-rate-telemetry')process.exit(2);
          if(!Object.prototype.hasOwnProperty.call(h,'providerHeadersAvailable'))process.exit(3);
          if(!Object.prototype.hasOwnProperty.call(h,'providerUsedInWindow'))process.exit(4);
          NODE
