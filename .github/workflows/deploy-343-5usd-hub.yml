name: Deploy 3.43 5USD Hub

on:
  push:
    branches:
      - work/ball46-bulk-provider-odds-display-fix-v1-20260920
    paths:
      - 'workers/nomadtips3-5usd-hub-343/**'
      - '.github/workflows/deploy-343-5usd-hub.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
  HUB_URL: https://nomadtips3-5usd-hub-343.mccarey-supon.workers.dev
  FIVEDOLLAR_URL: https://api.5dollarfootballapi.com/v1/fixtures?status=live&include=odds,events,stats&per_page=500&page=1

jobs:
  deploy-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Ball46 viewer-safe hub scope
        run: |
          set -euo pipefail
          node --check workers/nomadtips3-5usd-hub-343/src/index-v2.js
          node --check workers/nomadtips3-5usd-hub-343/src/index-rich-odds.js
          node --check workers/nomadtips3-5usd-hub-343/src/index-viewer-safe.js
          grep -Fq 'main = "src/index-viewer-safe.js"' workers/nomadtips3-5usd-hub-343/wrangler.toml
          grep -Fq 'class_name = "RichOddsGate"' workers/nomadtips3-5usd-hub-343/wrangler.toml
          grep -Fq 'crons = ["*/2 * * * *"]' workers/nomadtips3-5usd-hub-343/wrangler.toml
          grep -Fq 'viewerRefreshEnabled: false' workers/nomadtips3-5usd-hub-343/src/index-viewer-safe.js
          grep -Fq 'externalRequestsAdded: 0' workers/nomadtips3-5usd-hub-343/src/index-viewer-safe.js
          grep -Fq 'VIEWER_RICH_ODDS_DISABLED_USE_BULK_SNAPSHOT' workers/nomadtips3-5usd-hub-343/src/index-viewer-safe.js
          if grep -R "nomadtips3-shot-sidecar-342\|nomadtips3-342-signal-engine" workers/nomadtips3-5usd-hub-343; then
            echo '::error::3.43 hub must not depend on 3.42 runtime'; exit 1
          fi

      - name: Dry-run hub bundle
        working-directory: workers/nomadtips3-5usd-hub-343
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.toml

      - name: Validate credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$FIVEDOLLAR_API_KEY" || { echo '::error::Missing FIVEDOLLAR_API_KEY'; exit 1; }

      - name: Probe 5USD bulk read
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 30 -o /tmp/provider.json -w '%{http_code}' -H 'Accept: application/json' -H "Authorization: Bearer $FIVEDOLLAR_API_KEY" "$FIVEDOLLAR_URL")"
          echo "5USD HTTP $code"
          test "$code" = "200" || { head -c 2000 /tmp/provider.json; echo; exit 21; }
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/provider.json','utf8'));
          const rows=Array.isArray(j?.data)?j.data:Array.isArray(j?.data?.data)?j.data.data:Array.isArray(j?.fixtures)?j.fixtures:[];
          const p=j?.pagination??j?.meta?.pagination??j?.meta??{};
          console.log(JSON.stringify({live:rows.length,has_more:p?.has_more??p?.hasMore??null,sample:rows.slice(0,2).map(x=>({id:x?.id??x?.fixture_id,status:x?.status,status_code:x?.status_code,odds:Boolean(x?.bookmakers||x?.bet365||x?.markets||x?.odds)}))},null,2));
          NODE

      - name: Deploy 3.43 hub
        working-directory: workers/nomadtips3-5usd-hub-343
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.toml

      - name: Bind 5USD API key
        working-directory: workers/nomadtips3-5usd-hub-343
        run: printf '%s' "$FIVEDOLLAR_API_KEY" | npx --yes wrangler@4.92.0 secret put FIVEDOLLAR_API_KEY --config wrangler.toml

      - name: Verify shared cache and zero-viewer fanout
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$HUB_URL/health?_=$RANDOM$RANDOM" -o /tmp/health-before.json
          for i in 1 2 3 4 5; do
            curl -fsS --max-time 45 "$HUB_URL/snapshot?viewer_test=$i&_=$RANDOM$RANDOM" -o "/tmp/snapshot-$i.json"
          done
          curl -fsS --max-time 20 "$HUB_URL/health?_=$RANDOM$RANDOM" -o /tmp/health-after.json
          rich_code="$(curl -sS --max-time 20 -o /tmp/rich.json -w '%{http_code}' "$HUB_URL/rich-odds?fixture_id=viewer-test")"
          test "$rich_code" = "410" || { echo "::error::public rich-odds must be disabled, got $rich_code"; cat /tmp/rich.json; exit 31; }
          node - <<'NODE'
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync('/tmp/health-before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('/tmp/health-after.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/snapshot-5.json','utf8'));
          const rich=JSON.parse(fs.readFileSync('/tmp/rich.json','utf8'));
          const rows=Array.isArray(s.fixtures)?s.fixtures:[];
          const oddsRows=rows.filter(x=>x?.providerOdds&&typeof x.providerOdds==='object'&&Object.keys(x.providerOdds).length>0).length;
          console.log(JSON.stringify({before,after,snapshot:{ok:s.ok,version:s.version,fixtureCount:s.fixtureCount,counts:s.counts,cacheOnly:s.cacheOnly,viewerRefreshEnabled:s.viewerRefreshEnabled,externalRequestsAdded:s.externalRequestsAdded,continuityHeldFixtures:s.continuityHeldFixtures,oddsRows},rich},null,2));
          if(s.ok!==true||before.ok!==true||after.ok!==true)process.exit(1);
          if(after.component!=='5USD_HUB')process.exit(2);
          if(s.provider!=='5DollarFootballAPI')process.exit(3);
          if(s.version!=='nomad343-5usd-hub-v6-viewer-cache-only'||after.version!=='nomad343-5usd-hub-v6-viewer-cache-only')process.exit(4);
          if(s.cacheOnly!==true||s.viewerRefreshEnabled!==false||Number(s.externalRequestsAdded)!==0)process.exit(5);
          if(after.cacheOnlyViewer!==true||after.viewerRefreshEnabled!==false||Number(after.externalRequestsPerViewer)!==0)process.exit(6);
          if(!Number(after.control?.liveRefreshSeconds)||Number(after.accountLimitPerMinute)!==40)process.exit(7);
          if(rich.error!=='VIEWER_RICH_ODDS_DISABLED_USE_BULK_SNAPSHOT'||Number(rich.externalRequestsAdded)!==0)process.exit(8);
          // Five rapid snapshot reads must not cause a HUB provider attempt. A cron can
          // legitimately run concurrently, so only report a timestamp change here.
          if(before.lastAttemptAt!==after.lastAttemptAt) console.log('NOTE: scheduled producer ran during viewer test window');
          NODE