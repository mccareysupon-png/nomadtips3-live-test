name: Deploy 3.43 5USD Hub

on:
  push:
    branches:
      - work/nomad343-clean-bet365-ui
      - work/nomad343-dashboard-v2-bulk-20260915
    paths:
      - 'workers/nomadtips3-5usd-hub-343/**'
      - '.github/workflows/deploy-343-5usd-hub.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
  HUB_URL: https://nomadtips3-5usd-hub-343.mccarey-supon.workers.dev

jobs:
  deploy-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify 3.43 one-call live core scope
        run: |
          set -euo pipefail
          node --check workers/nomadtips3-5usd-hub-343/src/index-v2.js
          grep -Fq "const VERSION='nomad343-5usd-hub-v7-live-core-500'" workers/nomadtips3-5usd-hub-343/src/index-v2.js
          grep -Fq 'const LIVE_PAGE_SIZE=500' workers/nomadtips3-5usd-hub-343/src/index-v2.js
          grep -Fq 'const LIVE_CORE_REQUESTS=1' workers/nomadtips3-5usd-hub-343/src/index-v2.js
          grep -Fq "status=live&include=\${include}" workers/nomadtips3-5usd-hub-343/src/index-v2.js
          grep -Fq "'LIVE_CORE'" workers/nomadtips3-5usd-hub-343/src/index-v2.js
          grep -Fq 'localKnownUsedInWindow' workers/nomadtips3-5usd-hub-343/src/index-v2.js
          grep -Fq 'unexplainedUsedInWindow' workers/nomadtips3-5usd-hub-343/src/index-v2.js
          grep -Fq 'main = "src/index-v2.js"' workers/nomadtips3-5usd-hub-343/wrangler.toml
          grep -Fq "crons = [\"*/2 * * * *\"]" workers/nomadtips3-5usd-hub-343/wrangler.toml
          if grep -R "nomadtips3-shot-sidecar-342\|nomadtips3-342-signal-engine" workers/nomadtips3-5usd-hub-343; then
            echo '::error::3.43 hub must not depend on 3.42 runtime'; exit 1
          fi

      - name: Dry-run hub bundle
        working-directory: workers/nomadtips3-5usd-hub-343
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.toml

      - name: Validate credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$FIVEDOLLAR_API_KEY" || { echo '::error::Missing FIVEDOLLAR_API_KEY'; exit 1; }

      - name: Deploy 3.43 hub
        working-directory: workers/nomadtips3-5usd-hub-343
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.toml

      - name: Bind 5USD API key
        working-directory: workers/nomadtips3-5usd-hub-343
        run: printf '%s' "$FIVEDOLLAR_API_KEY" | npx --yes wrangler@4.92.0 secret put FIVEDOLLAR_API_KEY --config wrangler.toml

      - name: Verify one-call live core and protected direct control
        run: |
          set -euo pipefail
          get() {
            name="$1"; url="$2"; out="$3"; max="$4"
            code="000"
            for attempt in $(seq 1 12); do
              code=$(curl -sS --max-time "$max" -w '%{http_code}' -o "$out" "$url" || true)
              echo "$name attempt $attempt HTTP $code"
              [ "$code" = "200" ] && break
              sleep 2
            done
            test "$code" = "200"
          }
          get SNAPSHOT "$HUB_URL/snapshot?_=$RANDOM$RANDOM" /tmp/hub-snapshot.json 45
          get HEALTH "$HUB_URL/health?_=$RANDOM$RANDOM" /tmp/hub-health.json 20
          get CONTROL "$HUB_URL/control?_=$RANDOM$RANDOM" /tmp/hub-control.json 20
          unauth=$(curl -sS --max-time 20 -o /tmp/control-unauth.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"enabled":true,"intervalSec":120}' "$HUB_URL/control")
          test "$unauth" = "401"
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/hub-snapshot.json','utf8'));
          const h=JSON.parse(fs.readFileSync('/tmp/hub-health.json','utf8'));
          const c=JSON.parse(fs.readFileSync('/tmp/hub-control.json','utf8'));
          if(s.ok!==true||h.ok!==true||c.ok!==true) throw Error('hub not ready');
          if(s.version!=='nomad343-5usd-hub-v7-live-core-500'||h.version!==s.version||c.version!==s.version) throw Error('v7 mismatch');
          if(h.architecture!=='LIVE_CORE_1_CALL_PER_CYCLE'||Number(h.livePageSize)!==500) throw Error('live core architecture mismatch');
          const m3=(c.modes||[]).find(x=>Number(x.intervalSec)===3);
          const m2=(c.modes||[]).find(x=>Number(x.intervalSec)===2);
          if(!m3||m3.allowed!==true||Number(m3.liveRequestsPerMinute)!==20||Number(m3.projectedTotalRequestsPerMinute)!==22.5) throw Error('3s projection');
          if(!m2||m2.allowed!==true||Number(m2.liveRequestsPerMinute)!==30||Number(m2.projectedTotalRequestsPerMinute)!==32.5||Number(m2.projectedPeakMinuteRequests)!==35) throw Error('2s projection');
          if(!Object.prototype.hasOwnProperty.call(h,'providerUsedInWindow')||!Object.prototype.hasOwnProperty.call(h,'localKnownUsedInWindow')||!Object.prototype.hasOwnProperty.call(h,'unexplainedUsedInWindow')) throw Error('account ledger missing');
          console.log(JSON.stringify({version:h.version,architecture:h.architecture,livePageSize:h.livePageSize,current:c.intervalSec,m3,m2,providerUsed:h.providerUsedInWindow,localKnown:h.localKnownUsedInWindow,unexplained:h.unexplainedUsedInWindow},null,2));
          NODE
