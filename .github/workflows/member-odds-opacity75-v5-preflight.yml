name: BALL46 Member ODDS Opacity75 V5 — Read Only Preflight
on:
  push:
    branches: [codex/ball46-member-odds-opacity75-20261021]
    paths:
      - '.github/workflows/member-odds-opacity75-v5-preflight.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify V5 patch affects only ODDS background opacity and HTML cache
        run: |
          set -euo pipefail
          node --check ball46-member/member-odds-opacity75-v5-20261021/opacity75.mjs
          node --check ball46-member/member-odds-opacity75-v5-20261021/deploy.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {patchOpacity75,CSS} from './ball46-member/member-odds-opacity75-v5-20261021/opacity75.mjs';
          const html='<html><span class="b46-odds-trigger-label">ODDS</span><link href="/member-odds-topbar.css?v=20261021-odds-glass55-v4"></html>';
          const css='/* B46_MEMBER_ODDS_DROPDOWN_GLASS55_V4_20261021 */';
          const p=patchOpacity75({html,css});
          assert.equal(p.html.replace('odds-opacity75-v5','odds-glass55-v4'),html);
          assert.equal(p.css,css+'\n'+CSS+'\n');
          assert(CSS.includes('rgba(18,38,48,.75)!important'));
          assert(!CSS.includes('opacity:.75')&&!CSS.includes('opacity:0.75'));
          console.log('BALL46_MEMBER_ODDS_OPACITY75_PATCH_CONTRACT_PASS');
          JS
      - name: Verify active Worker V4, live SHA and member Access without writes
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const a=process.env.CLOUDFLARE_ACCOUNT_ID,t=process.env.CLOUDFLARE_API_TOKEN;
          assert(a&&t,'MISSING_CREDS');
          const u='https://api.cloudflare.com/client/v4/accounts/'+a+'/workers/scripts/ball46-member-production/deployments?per_page=1';
          const r=await fetch(u,{headers:{Authorization:'Bearer '+t},signal:AbortSignal.timeout(25000)});
          const j=await r.json();assert(r.ok&&j.success,'CLOUDFLARE_READ_FAIL');
          const v=j.result.deployments?.[0]?.versions;assert(v?.length===1&&Number(v[0].percentage)===100,'WORKER_SPLIT');
          assert.equal(v[0].version_id,'1c85b2ca-17ae-4bec-9049-ca6db3e3778f','WORKER_CHANGED');
          const hashes={
            '/member-odds-topbar.css':'b6633b6d654bcd11396b3975726ac612b32e06b8601572421d3b4045e420c833',
            '/member.js':'ef4489618ae07303a7f275b4b37fddd0f7a8cb721bf98d3216c887128c806524',
            '/styles.css':'5186dd9dfa27c36b7dced6068b15a20d04ab8f15ab771e33d61116c8725b817d'
          };
          for(const [path,want] of Object.entries(hashes)){
            const url=new URL(path,'https://member.ball46.com');url.searchParams.set('opacity75ReadOnly',Date.now());
            const response=await fetch(url,{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(24000)});
            assert.equal(response.status,200,'FILE_NOT_200 '+path);
            const digest=createHash('sha256').update(Buffer.from(await response.arrayBuffer())).digest('hex');
            assert.equal(digest,want,'FILE_CHANGED '+path);
          }
          const gate=await fetch('https://member.ball46.com/member.html',{redirect:'manual',signal:AbortSignal.timeout(20000)});
          assert([302,303].includes(gate.status),'MEMBER_AUTH_GATE_CHANGED');
          console.log('BALL46_MEMBER_ODDS_OPACITY75_READ_ONLY_PREFLIGHT_PASS',JSON.stringify({active:v[0].version_id,filesChecked:Object.keys(hashes).length,memberAccess:gate.status}));
          JS
