name: BALL46 Match Comparison Labels READ ONLY
on:
  push:
    branches: [fix/ball46-match-comparison-labels-20261023]
    paths:
      - .github/workflows/ball46-match-comparison-inspect.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect current Worker and compare label code
        run: |
          node --check deploy-assets/match-comparison-labels-20261023/inspect.mjs
          node deploy-assets/match-comparison-labels-20261023/inspect.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-match-comparison-readonly-${{ github.run_id }}
          path: deploy-assets/match-comparison-labels-20261023/audit/
          retention-days: 14
