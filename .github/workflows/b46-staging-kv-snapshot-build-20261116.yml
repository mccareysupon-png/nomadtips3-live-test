name: B46 precompute full verified statistics snapshot to STAGING KV only
# Rebuild latest fully-validated source for staging-only refresh parity regression, 16 Nov 2026.
on:
  push:
    branches: [chatgpt/ball46-statistics-ui-v1]
    paths:
      - '.github/workflows/b46-staging-kv-snapshot-build-20261116.yml'
      - 'chatgpt-statistics-ui/stage-kv-sync.mjs'
      - 'chatgpt-statistics-ui/.stage-snapshot-trigger.txt'
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: b46-stage-stats-kv-build, cancel-in-progress: false}
jobs:
  read-only-ledger-build:
    if: ${{ false }} # Retired legacy full-history builder; retained for rollback.
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate staging-only generation and settlement source contract
        run: |
          node --check chatgpt-statistics-ui/stage-kv-sync.mjs
          node chatgpt-statistics-ui/test-stage-kv-sync.mjs
      - name: Read public source and atomically update ONLY STAGING KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node chatgpt-statistics-ui/stage-kv-sync.mjs
