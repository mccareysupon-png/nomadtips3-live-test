name: BALL46 Chat Statistics (isolated staging)
on:
  push:
    branches:
      - chatgpt/ball46-statistics-v1
    paths:
      - 'chatgpt-statistics/**'
      - '.github/workflows/ball46-chat-statistics-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and SQL schema
        working-directory: chatgpt-statistics
        run: |
          node --test tests/core.test.mjs
          node --check src/worker.mjs
          node --check scripts/bootstrap.mjs
          node scripts/schema.mjs > /tmp/b46-chat-staging-schema.sql
          python3 -c "import sqlite3; c=sqlite3.connect(':memory:'); c.executescript(open('/tmp/b46-chat-staging-schema.sql').read()); print('D1/SQLite schema syntax OK')"

  deploy-staging:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require separately provisioned staging-only Cloudflare credentials
        id: guard
        env:
          CF_TOKEN: ${{ secrets.B46_CHAT_CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.B46_CHAT_CF_ACCOUNT_ID }}
          D1_STAGING: ${{ secrets.B46_CHAT_STAGING_D1_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] && [ -n "$D1_STAGING" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'STAGING DEPLOY SKIPPED: credentials or dedicated D1 not configured'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy ONLY ball46-chat-statistics-staging
        if: steps.guard.outputs.ready == 'true'
        working-directory: chatgpt-statistics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.B46_CHAT_CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.B46_CHAT_CF_ACCOUNT_ID }}
          B46_CHAT_STAGING_D1_ID: ${{ secrets.B46_CHAT_STAGING_D1_ID }}
        run: |
          set -eu
          sed "s/REPLACE_WITH_SEPARATE_STAGING_D1_ID/$B46_CHAT_STAGING_D1_ID/g" wrangler.toml > wrangler-ci.toml
          node scripts/schema.mjs > staging-schema.sql
          npx --yes wrangler@4 d1 execute ball46-chat-statistics-staging-db --remote --env staging --config wrangler-ci.toml --file staging-schema.sql
          npx --yes wrangler@4 deploy --env staging --config wrangler-ci.toml
