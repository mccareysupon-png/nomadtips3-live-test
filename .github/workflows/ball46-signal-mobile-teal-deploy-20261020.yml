name: BALL46 Production Signal Mobile Card Theme V2
on:
  push:
    branches: [codex/ball46-signal-mobile-deep-teal-20261020]
    paths:
      - '.github/workflows/ball46-signal-mobile-teal-deploy-20261020.yml'
      - 'deploy-assets/signal-mobile-teal-20261020/deploy.mjs'
      - 'deploy-assets/signal-mobile-teal-20261020/theme.mjs'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  guarded-signal-theme:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and Browser setup
        working-directory: deploy-assets/signal-mobile-teal-20261020
        run: |
          set -euo pipefail
          node --check theme.mjs
          node --check deploy.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
      - name: Verify existing Production, QA all mobile tabs and desktop, deploy only if safe
        working-directory: deploy-assets/signal-mobile-teal-20261020
        run: node deploy.mjs
      - name: Preserve before-after screenshots and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-signal-mobile-card-theme-v2-audit
          path: deploy-assets/signal-mobile-teal-20261020/audit/
          retention-days: 30
          if-no-files-found: warn
