name: BALL46 BTTS One REAL Fixture Team Last10 TEST ONLY
on:
  push:
    branches: [fix/ball46-btts-backend-only-test-20261122]
    paths: [.github/workflows/b46-btts-team-last10-single-fixture-real-test-20261122.yml]
permissions:
  contents: read
concurrency:
  group: b46-btts-team-last10-one-fixture-20261122
  cancel-in-progress: false
jobs:
  run-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real BTTS-only team fallback protections
        run: |
          node --check qa/prematch-history-20261120/btts-test-one-fixture-team-last10-once-20261122.mjs
          node --test qa/prematch-history-20261120/btts-history-private.test.mjs qa/prematch-history-20261120/btts-ultra-shadow.test.mjs qa/prematch-history-20261120/test-pick-ledger.test.mjs
      - name: Use John's team fallback for ONE BTTS TEST fixture only, 3 calls max
        run: node qa/prematch-history-20261120/btts-test-one-fixture-team-last10-once-20261122.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-btts-one-fixture-original-team-last10-20261122
          path: evidence/btts-private/
          if-no-files-found: ignore
          retention-days: 30

