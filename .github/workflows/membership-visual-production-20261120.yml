name: BALL46 owner-approved membership visual V13 production release
on:
  push:
    branches: [release/ball46-membership-visual-20261120]
    paths: ['.github/workflows/membership-visual-production-20261120.yml']
permissions:
  contents: read
concurrency:
  group: ball46-production-ui-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/release/ball46-membership-visual-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and validate exact approved assets and additive release
        run: |
          python -m pip install --quiet pillow
          python qa/membership-visual-v2-20261120/build-release-assets.py
          node --check qa/membership-visual-v2-20261120/production-wrapper.mjs
          node --check qa/membership-visual-v2-20261120/production-release.mjs
          npm install --prefix qa/membership-visual-v2-20261120/.runtime --no-fund --no-audit playwright@1.55.0
          qa/membership-visual-v2-20261120/.runtime/node_modules/.bin/playwright install chromium --only-shell
      - name: Preview checks, Production deploy, and rollback gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node qa/membership-visual-v2-20261120/production-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: membership-visual-production-proof
          path: ${{ runner.temp }}/membership-visual-production-proof
          if-no-files-found: ignore
