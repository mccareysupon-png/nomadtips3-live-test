name: NOMADTIPS3 Auto Selector — Test

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even when the current result feed is not settled'
        required: false
        default: 'false'
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: nomadtips3-auto-selector-test
  cancel-in-progress: false

jobs:
  select-next:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FORCE_AUTO_SELECT: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run NOMAD automatic selection engine
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_FOOTBALL_KEY:-}"
          python3 .github/scripts/auto_select_next.py

      - name: Publish automatic test selection state
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add selected-live-matches.json auto-selection-state.json auto-selection-report.json archive/auto-selections 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Auto-select next NOMAD test set $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: Start live tracking for the new set
        if: steps.publish.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/live-selected-matches.yml/dispatches" \
            -d '{"ref":"main"}'
