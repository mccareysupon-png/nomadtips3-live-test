name: NOMADTIPS3 Ball Teng Auto Selector — Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto-select-next.yml'
      - '.github/scripts/auto_select_next.py'
      - '.github/scripts/run_ball_teng_selector.py'
      - '.github/scripts/apply_confidence_policy.py'
      - '.github/scripts/materialize_add_k_no_pick.py'
      - '.github/scripts/enforce_add_k_data_quality.py'
      - '.github/scripts/merge_add_k_locked_picks.py'
      - '.github/scripts/finalize_ball_teng_analysis.py'
      - '.github/scripts/enrich_selected_odds.py'
      - '.github/scripts/prepare_ball_teng_control.py'
      - '.github/scripts/consume_ball_teng_control.py'
      - 'config/nomad-auto-rules.json'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even when the current result feed is not settled'
        required: false
        default: 'false'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: nomadtips3-ball-teng-auto-selector-test
  cancel-in-progress: false

jobs:
  select-next:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FORCE_AUTO_SELECT: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
      FORCE_AUTO_RESELECT: '0'
      BALL_TENG_CONTROL_URL: 'https://nomadtips3-test-api.mccarey-supon.workers.dev/ball-teng-config'
      ADD_K_PREVIOUS_SELECTED_PATH: '/tmp/nomad-prev-selected.json'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load active owner ball-teng settings
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare_ball_teng_control.py

      - name: Run NOMAD ball-teng automatic selection engine
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_FOOTBALL_KEY:-}"

          # Snapshot the previous published set before a forced Add K rerun.
          # It is used only to preserve already-started matches; future picks remain replaceable.
          cp selected-live-matches.json "$ADD_K_PREVIOUS_SELECTED_PATH" 2>/dev/null || printf '{"matches":[]}\n' > "$ADD_K_PREVIOUS_SELECTED_PATH"

          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('config/nomad-auto-rules.json')
          rules = json.loads(path.read_text(encoding='utf-8'))
          rules['fixed_confidence'] = int(rules.get('minimum_confidence', 58))
          path.write_text(json.dumps(rules, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python3 .github/scripts/run_ball_teng_selector.py
          python3 .github/scripts/materialize_add_k_no_pick.py

          selection_regenerated=false
          if git diff --quiet -- selected-live-matches.json; then
            echo 'No new ball-teng set generated; current locked set stays unchanged.'
          else
            selection_regenerated=true
            selection_count="$(python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              data = json.loads(Path('selected-live-matches.json').read_text(encoding='utf-8'))
              print(len(data.get('matches') or []))
          except Exception:
              print('0')
          PY
          )"
            if [ "$selection_count" -gt 0 ]; then
              python3 .github/scripts/apply_confidence_policy.py
              python3 .github/scripts/enforce_add_k_data_quality.py
              python3 .github/scripts/materialize_add_k_no_pick.py
              python3 .github/scripts/finalize_ball_teng_analysis.py
            else
              echo 'Explicit Add K NO PICK outcome published; skipping match enrichment.'
            fi
          fi

          needs_ou_enrichment="$(python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('selected-live-matches.json')
          try:
              data = json.loads(path.read_text(encoding='utf-8'))
          except Exception:
              print('0')
              raise SystemExit
          matches = data.get('matches') or []
          missing = any('overUnder' not in (match.get('markets') or {}) for match in matches)
          print('1' if missing else '0')
          PY
          )"

          match_count="$(python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              data = json.loads(Path('selected-live-matches.json').read_text(encoding='utf-8'))
              print(len(data.get('matches') or []))
          except Exception:
              print('0')
          PY
          )"

          if [ "$match_count" -gt 0 ] && { [ "$selection_regenerated" = true ] || [ "$needs_ou_enrichment" = "1" ]; }; then
            echo 'Enriching independent O/U 2.5 market and real API odds once for this selected set.'
            python3 .github/scripts/enrich_selected_odds.py
          else
            echo 'No O/U enrichment required.'
          fi

          # Add K reruns keep matches that have already reached kickoff, replace future picks,
          # and de-duplicate fixture ids. This is isolated from the live-condition scanner.
          python3 .github/scripts/merge_add_k_locked_picks.py

          # Dashboard settings are runtime configuration; repository defaults remain the fallback.
          git checkout -- config/nomad-auto-rules.json
          python3 .github/scripts/consume_ball_teng_control.py

      - name: Publish selector or control-state changes
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          selection_changed=false
          control_changed=false
          if ! git diff --quiet -- selected-live-matches.json; then selection_changed=true; fi
          if ! git diff --quiet -- auto-selection-state.json; then control_changed=true; fi

          echo "selection_changed=${selection_changed}" >> "$GITHUB_OUTPUT"
          echo "control_changed=${control_changed}" >> "$GITHUB_OUTPUT"

          if [ "$selection_changed" != true ] && [ "$control_changed" != true ]; then
            echo 'No ball-teng selection or owner-control state changed.'
            exit 0
          fi

          git add auto-selection-state.json
          if [ "$selection_changed" = true ]; then
            git add selected-live-matches.json auto-selection-report.json archive/auto-selections 2>/dev/null || true
          fi

          git commit -m "Update NOMAD ball-teng auto state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
