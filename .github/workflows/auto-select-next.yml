name: NOMADTIPS3 Auto Selector — Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto-select-next.yml'
      - '.github/scripts/auto_select_next.py'
      - '.github/scripts/run_ball_teng_selector.py'
      - '.github/scripts/apply_confidence_policy.py'
      - '.github/scripts/finalize_ball_teng_analysis.py'
      - 'config/nomad-auto-rules.json'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even when the current result feed is not settled'
        required: false
        default: 'false'
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: nomadtips3-auto-selector-test
  cancel-in-progress: false

jobs:
  select-next:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FORCE_AUTO_SELECT: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run NOMAD ball-teng automatic selection engine
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_FOOTBALL_KEY:-}"

          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('config/nomad-auto-rules.json')
          rules = json.loads(path.read_text(encoding='utf-8'))
          rules['fixed_confidence'] = int(rules.get('minimum_confidence', 58))
          path.write_text(json.dumps(rules, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python3 .github/scripts/run_ball_teng_selector.py
          git checkout -- config/nomad-auto-rules.json

          if git diff --quiet -- selected-live-matches.json; then
            echo 'No new ball-teng set generated; current locked set stays unchanged.'
          else
            python3 .github/scripts/apply_confidence_policy.py
            python3 .github/scripts/finalize_ball_teng_analysis.py
          fi

      - name: Publish new ball-teng test set only when selections changed
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet -- selected-live-matches.json; then
            echo 'selection_changed=false' >> "$GITHUB_OUTPUT"
            echo 'No new qualifying set was published; current test set remains unchanged.'
            exit 0
          fi

          git add selected-live-matches.json auto-selection-state.json auto-selection-report.json archive/auto-selections 2>/dev/null || true
          git commit -m "Auto-select next NOMAD ball-teng test set $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo 'selection_changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
