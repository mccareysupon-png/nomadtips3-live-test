name: NOMADTIPS3 Ball Teng Auto Selector — Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto-select-next.yml'
      - '.github/scripts/auto_select_next.py'
      - '.github/scripts/run_ball_teng_selector.py'
      - '.github/scripts/apply_confidence_policy.py'
      - '.github/scripts/finalize_ball_teng_analysis.py'
      - '.github/scripts/prepare_ball_teng_control.py'
      - '.github/scripts/consume_ball_teng_control.py'
      - 'config/nomad-auto-rules.json'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even when the current result feed is not settled'
        required: false
        default: 'false'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: nomadtips3-ball-teng-auto-selector-test
  cancel-in-progress: false

jobs:
  select-next:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FORCE_AUTO_SELECT: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
      FORCE_AUTO_RESELECT: '0'
      BALL_TENG_CONTROL_URL: 'https://nomadtips3-test-api.mccarey-supon.workers.dev/ball-teng-config'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load active owner ball-teng settings
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare_ball_teng_control.py

      - name: Run NOMAD ball-teng automatic selection engine
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_FOOTBALL_KEY:-}"

          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('config/nomad-auto-rules.json')
          rules = json.loads(path.read_text(encoding='utf-8'))
          rules['fixed_confidence'] = int(rules.get('minimum_confidence', 58))
          path.write_text(json.dumps(rules, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python3 .github/scripts/run_ball_teng_selector.py

          if git diff --quiet -- selected-live-matches.json; then
            echo 'No new ball-teng set generated; current locked set stays unchanged.'
          else
            python3 .github/scripts/apply_confidence_policy.py
            python3 .github/scripts/finalize_ball_teng_analysis.py
          fi

          # Dashboard settings are runtime configuration; repository defaults remain the fallback.
          git checkout -- config/nomad-auto-rules.json
          python3 .github/scripts/consume_ball_teng_control.py

      - name: Publish selector or control-state changes
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          selection_changed=false
          control_changed=false
          if ! git diff --quiet -- selected-live-matches.json; then selection_changed=true; fi
          if ! git diff --quiet -- auto-selection-state.json; then control_changed=true; fi

          echo "selection_changed=${selection_changed}" >> "$GITHUB_OUTPUT"
          echo "control_changed=${control_changed}" >> "$GITHUB_OUTPUT"

          if [ "$selection_changed" != true ] && [ "$control_changed" != true ]; then
            echo 'No ball-teng selection or owner-control state changed.'
            exit 0
          fi

          git add auto-selection-state.json
          if [ "$selection_changed" = true ]; then
            git add selected-live-matches.json auto-selection-report.json archive/auto-selections 2>/dev/null || true
          fi

          git commit -m "Update NOMAD ball-teng auto state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
