name: BALL46 Statistics 14 Cards — Real User Light Dark Fix
on:
  push:
    branches: [codex/ball46-stats-14row-allthemes-repair-20261020]
    paths:
      - '.github/workflows/ball46-stats-v23-allthemes-repair-20261020.yml'
      - 'deploy-assets/stats-pc-v2-preview-20261020/repair-production-v23.mjs'
      - 'deploy-assets/stats-pc-v2-preview-20261020/allthemes-fix.mjs'
      - 'deploy-assets/stats-pc-v2-preview-20261020/single-row-v23.css'
      - 'deploy-assets/stats-pc-v2-preview-20261020/ribbon-v23.mjs'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  guarded-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scripts and initialize Chrome
        working-directory: deploy-assets/stats-pc-v2-preview-20261020
        run: |
          set -euo pipefail
          node --check repair-production-v23.mjs
          node --check allthemes-fix.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
      - name: Verify inactive candidate, guarded promote, verify both themes on real Production
        working-directory: deploy-assets/stats-pc-v2-preview-20261020
        run: node repair-production-v23.mjs
      - name: Preserve browser screenshots and version / rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-stats-v23-allthemes-realuser-proof
          path: deploy-assets/stats-pc-v2-preview-20261020/audit/repair/
          retention-days: 30
          if-no-files-found: warn
