name: Deploy Ball46 Homepage Default 10 Cards 20260925

on:
  push:
    branches: [work/ball46-home-default-10-prod-safe-20260925]
    paths:
      - '.github/workflows/deploy-ball46-home-default-10-20260925.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  BALL46_PUBLIC: https://www.ball46.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-home-default-10:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Mirror exact current Production package and create rollback snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod /tmp/rollback-snapshot
          fetch_required(){
            name="$1"; safe="${name//\//_}"
            code=$(curl -sS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 -o "/tmp/prod/$safe" -w '%{http_code}' "$BALL46_WORKER/$name?home10-copy=${GITHUB_RUN_ID}") || true
            [ "$code" = 200 ] || { echo "REQUIRED_PROD_ASSET_HTTP_${code}:$name"; exit 1; }
            test -s "/tmp/prod/$safe" || { echo "REQUIRED_PROD_ASSET_EMPTY:$name"; exit 1; }
            mkdir -p "$(dirname "nomad-live-343/$name")"
            cp "/tmp/prod/$safe" "nomad-live-343/$name"
          }

          fetch_required index.html
          python3 - <<'PY' > /tmp/index-assets.txt
          from pathlib import Path
          import re
          h=Path('nomad-live-343/index.html').read_text(errors='ignore')
          found=set()
          for x in re.findall(r'''(?:src|href)=["']([^"']+)["']''',h,re.I):
              x=x.split('?',1)[0].split('#',1)[0].strip().lstrip('./').lstrip('/')
              if not x or '://' in x or '/' in x: continue
              if re.search(r'\.(?:js|css|svg|json|png|webp|jpg|jpeg|ico)$',x,re.I): found.add(x)
          for x in sorted(found): print(x)
          PY
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            fetch_required "$name"
          done < /tmp/index-assets.txt

          # Target file: display/render layer only.
          fetch_required dashboard-v2-stage3.js
          cp nomad-live-343/dashboard-v2-stage3.js /tmp/prod/dashboard-v2-stage3.js
          cp nomad-live-343/dashboard-v2-stage3.js /tmp/rollback-snapshot/dashboard-v2-stage3.js
          cp nomad-live-343/index.html /tmp/rollback-snapshot/index.html

          # Explicitly mirror and lock critical non-target UI/data bridge assets.
          : > /tmp/protected.sha
          protected='dashboard-v2.css dashboard-v2-tune.js v2-shared.css v2-shared.js bulk-odds-compat-343.js expanded-match-343.js full-market-bookmaker-343.js live-summary-full-odds-343.js signal-next.js singlepage-workspace-343.js singlepage-workspace-343.css signal-shared-view-343.css ball46-next.css market-registry-343.js'
          for f in $protected; do
            fetch_required "$f"
            printf '%s  %s\n' "$(sha256sum "nomad-live-343/$f" | awk '{print $1}')" "$f" >> /tmp/protected.sha
          done
          cp /tmp/protected.sha /tmp/rollback-snapshot/protected.sha
          sha256sum nomad-live-343/index.html | awk '{print $1}' > /tmp/index-before.sha
          sha256sum nomad-live-343/dashboard-v2-stage3.js | awk '{print $1}' > /tmp/target-before.sha
          cp /tmp/index-before.sha /tmp/rollback-snapshot/index-before.sha
          cp /tmp/target-before.sha /tmp/rollback-snapshot/target-before.sha

          # Prove target is the current default-card renderer and no new request path is needed.
          grep -Eq 'const COLLAPSED_LIMIT=[0-9]+;' nomad-live-343/dashboard-v2-stage3.js
          grep -Fq 'all.slice(0,COLLAPSED_LIMIT)' nomad-live-343/dashboard-v2-stage3.js
          grep -Fq "const API='/api/engine/board'" nomad-live-343/dashboard-v2-stage3.js
          grep -Fq "const SIGNALS_API='/api/engine/signals'" nomad-live-343/dashboard-v2-stage3.js

          current=$(grep -Eo 'const COLLAPSED_LIMIT=[0-9]+;' nomad-live-343/dashboard-v2-stage3.js | head -1 | grep -Eo '[0-9]+')
          echo "CURRENT_COLLAPSED_LIMIT=$current"
          printf 'run=%s\ncurrent_collapsed_limit=%s\n' "$GITHUB_RUN_ID" "$current" > /tmp/rollback-snapshot/ROLLBACK_POINT.txt

          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?home10-before=${GITHUB_RUN_ID}" -o /tmp/board-before.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?home10-before=${GITHUB_RUN_ID}" -o /tmp/signals-before.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/statistics?home10-before=${GITHUB_RUN_ID}" -o /tmp/stats-before.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/board-before.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals-before.json'));
          const t=JSON.parse(fs.readFileSync('/tmp/stats-before.json'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures))throw Error('PRE_BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals))throw Error('PRE_SIGNALS_UNHEALTHY');
          if(t?.ok!==true||!Array.isArray(t?.rows))throw Error('PRE_STATS_UNHEALTHY');
          console.log('ROLLBACK_POINT_OK',{fixtures:b.fixtures.length,signals:s.signals.length,settled:t.rows.length});
          NODE

      - name: Upload exact pre-change rollback snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ball46-pre-home10-${{ github.run_id }}
          path: /tmp/rollback-snapshot
          retention-days: 30

      - name: Patch only homepage default-card display limit to 10
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('nomad-live-343/dashboard-v2-stage3.js')
          s=p.read_text()
          pat=r'const COLLAPSED_LIMIT=(\d+);'
          hits=re.findall(pat,s)
          if len(hits)!=1:
              raise SystemExit(f'COLLAPSED_LIMIT_ANCHOR_COUNT:{len(hits)}')
          print('PREVIOUS_COLLAPSED_LIMIT='+hits[0])
          s2,n=re.subn(pat,'const COLLAPSED_LIMIT=10;',s,count=1)
          if n!=1:
              raise SystemExit('COLLAPSED_LIMIT_PATCH_FAILED')
          if 'all.slice(0,COLLAPSED_LIMIT)' not in s2:
              raise SystemExit('RENDER_CONTRACT_MISSING')
          p.write_text(s2)
          PY

          node --check nomad-live-343/dashboard-v2-stage3.js
          grep -Fq 'const COLLAPSED_LIMIT=10;' nomad-live-343/dashboard-v2-stage3.js
          grep -Fq 'all.slice(0,COLLAPSED_LIMIT)' nomad-live-343/dashboard-v2-stage3.js

          # Index and every protected bridge must remain byte-identical.
          [ "$(cat /tmp/index-before.sha)" = "$(sha256sum nomad-live-343/index.html | awk '{print $1}')" ] || { echo 'INDEX_CHANGED_UNEXPECTEDLY'; exit 1; }
          while read -r expected f; do
            actual=$(sha256sum "nomad-live-343/$f" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "PROTECTED_LOCAL_CHANGED:$f"; exit 1; }
          done < /tmp/protected.sha
          [ "$(cat /tmp/target-before.sha)" != "$(sha256sum nomad-live-343/dashboard-v2-stage3.js | awk '{print $1}')" ] || { echo 'TARGET_NOT_CHANGED'; exit 1; }
          echo 'HOME10_PRESENTATION_ONLY_PATCH_OK'

      - name: Dry run exact Production package with one UI renderer change
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy homepage default 10 cards
        id: deploy
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify Production UI and untouched systems
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 20); do
            if curl -fsS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 "$BALL46_WORKER/dashboard-v2-stage3.js?home10-after=${GITHUB_RUN_ID}-${n}" -o /tmp/target.after.js \
              && grep -Fq 'const COLLAPSED_LIMIT=10;' /tmp/target.after.js \
              && grep -Fq 'all.slice(0,COLLAPSED_LIMIT)' /tmp/target.after.js; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo 'HOME10_TARGET_NOT_LIVE'; exit 1; }

          # Exact target payload expected; index and protected files must remain unchanged.
          [ "$(sha256sum /tmp/target.after.js | awk '{print $1}')" = "$(sha256sum nomad-live-343/dashboard-v2-stage3.js | awk '{print $1}')" ] || { echo 'TARGET_DEPLOY_HASH_MISMATCH'; exit 1; }

          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/index.html?home10-index=${GITHUB_RUN_ID}" -o /tmp/index.after.html
          [ "$(sha256sum /tmp/index.after.html | awk '{print $1}')" = "$(cat /tmp/index-before.sha)" ] || { echo 'INDEX_CHANGED_UNEXPECTEDLY'; exit 1; }

          while read -r expected f; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/$f?home10-protected=${GITHUB_RUN_ID}" -o "/tmp/protected-${f//\//_}"
            actual=$(sha256sum "/tmp/protected-${f//\//_}" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "PROTECTED_DEPLOYED_CHANGED:$f"; exit 1; }
          done < /tmp/protected.sha

          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?home10-final=${GITHUB_RUN_ID}" -o /tmp/board-after.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?home10-final=${GITHUB_RUN_ID}" -o /tmp/signals-after.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/statistics?home10-final=${GITHUB_RUN_ID}" -o /tmp/stats-after.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/board-after.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals-after.json'));
          const t=JSON.parse(fs.readFileSync('/tmp/stats-after.json'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures))throw Error('POST_BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals))throw Error('POST_SIGNALS_UNHEALTHY');
          if(t?.ok!==true||!Array.isArray(t?.rows))throw Error('POST_STATS_UNHEALTHY');
          console.log('HOME10_BACKEND_CONTINUITY_OK',{fixtures:b.fixtures.length,signals:s.signals.length,settled:t.rows.length});
          NODE

          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_PUBLIC/dashboard-v2-stage3.js?home10-public=${GITHUB_RUN_ID}" -o /tmp/public-target.js
          grep -Fq 'const COLLAPSED_LIMIT=10;' /tmp/public-target.js
          echo 'BALL46_HOME_DEFAULT_10_PRODUCTION_PASS'

      - name: Restore exact pre-change Production package if verification fails
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/prod/dashboard-v2-stage3.js nomad-live-343/dashboard-v2-stage3.js
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc
          echo 'BALL46_HOME10_ROLLBACK_COMPLETE'
