name: BALL46 Adaptive Equity TEST source diagnosis read only
on:
  push:
    branches: [fix/b46-adaptive-equity-no-flicker-20261125]
    paths: ['.github/workflows/b46-adaptive-equity-diagnose-20261125.yml']
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node qa/adaptive-equity-no-flicker-20261125/diagnose.mjs

