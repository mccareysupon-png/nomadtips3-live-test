name: BALL46 flow SVG path sampling performance and geometry read-only
on:
  push:
    branches: [test/ball46-fullmarket-odds-v3-20261121]
    paths:
      - '.github/workflows/ball46-flow-svg-sampling-benchmark-20261121.yml'
      - 'qa/fullmarket-odds-v3-20261121/flow-sampling-benchmark.mjs'
permissions: {contents: read}
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Browser-only compare native SVG point inversion and cached samples
        run: node qa/fullmarket-odds-v3-20261121/flow-sampling-benchmark.mjs
