name: BALL46 Expanded Match Mobile Read Only DOM Audit
on:
  push:
    branches: [fix/ball46-featured-expanded-only-20261021]
    paths:
      - '.github/workflows/ball46-expanded-match-mobile-v4-audit.yml'
      - 'deploy-assets/expanded-match-mobile-v4/audit-live-expanded.mjs'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect live expanded card markup
        working-directory: deploy-assets/expanded-match-mobile-v4
        run: |
          npm install --no-save --ignore-scripts puppeteer-core@24
          node audit-live-expanded.mjs