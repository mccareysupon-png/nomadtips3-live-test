name: Diagnose Ball46 STATISTICS V2 Title 20261008
on:
  push:
    branches:
      - work/ball46-statistics-title-hide-v2-20261008
    paths:
      - '.github/workflows/diagnose-ball46-statistics-title-20261008.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-statistics-title-hide-v2-20261008
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts acorn@8
      - name: Inspect current STATISTICS V2 title
        working-directory: deploy-assets/statistics-title-hide-v2-20261008
        run: node diagnose.mjs
