name: VERIFY ONLY - Ball46 Horizontal Card 20260928

on:
  push:
    branches:
      - work/ball46-horizontal-card-20260928
    paths:
      - '.github/workflows/ball46-horizontal-card-verify-only-20260928.yml'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ball46-horizontal-card-predeploy-36374800695
          path: /tmp/b46-predeploy
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36374800695
      - name: Verify current horizontal card Production without deploy
        shell: bash
        run: bash .github/scripts/ball46_horizontal_card_verify_only_20260928.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-horizontal-card-verify-only-${{ github.run_id }}
          path: /tmp/b46-horizontal-verify
          if-no-files-found: ignore
          retention-days: 30
