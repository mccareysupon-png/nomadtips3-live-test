name: DIAG Ball46 Statistics Overwrite 20261011

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-ball46-statistics-overwrite-20261011.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Inspect live Statistics writers and script order
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/b46-stat-overwrite
          mkdir -p "$ROOT"
          curl -fsSL --max-time 30 https://ball46.com/ -o "$ROOT/index.html"

          python3 - <<'PY'
          import re,urllib.parse,subprocess,os
          root='/tmp/b46-stat-overwrite'
          h=open(root+'/index.html',encoding='utf-8',errors='replace').read()
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',h,re.I)
          print('=== SCRIPT ORDER ===')
          for i,s in enumerate(srcs):
              print(i,urllib.parse.urljoin('https://ball46.com/',s))
          for i,s in enumerate(srcs):
              u=urllib.parse.urljoin('https://ball46.com/',s)
              p=f'{root}/script-{i}.js'
              try:
                  subprocess.run(['curl','-fsSL','--max-time','30',u,'-o',p],check=True)
              except Exception:
                  continue
          print('=== WRITERS ===')
          pats=[
            'data-sp-table-body',
            'ball46:statistics-snapshot',
            'renderTable(',
            'sp-table-body',
            'statistics-snapshot',
            'innerHTML=',
            'replaceChildren('
          ]
          for fn in sorted([x for x in os.listdir(root) if x.startswith('script-')], key=lambda x:int(x.split('-')[1].split('.')[0])):
              txt=open(root+'/'+fn,encoding='utf-8',errors='replace').read()
              hits=[p for p in pats if p in txt]
              if hits:
                  print(fn,'HITS',','.join(hits))
                  for p in hits:
                      idx=txt.find(p)
                      print('---',p,'---')
                      print(txt[max(0,idx-900):idx+2200].replace('\n',' '))
          PY
