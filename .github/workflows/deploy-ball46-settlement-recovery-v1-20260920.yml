name: Restore Ball46 Settlement Recovery v1 20260920

on:
  push:
    branches:
      - work/ball46-ceo-ah-tuning-20260920
    paths:
      - .github/workflows/deploy-ball46-settlement-recovery-v1-20260920.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  ENGINE_DIR: workers/nomadtips3-engine-343
  BALL46_URL: https://ball46.com
  BASE_VERSION: nomad343-engine-v6-ceo-auto-v1.1-ah-guard-settlement-recovery-v1
  WATCH_VERSION: nomad343-engine-v6-ceo-auto-v1.1-ah-guard-settlement-recovery-v1-watch-v1

jobs:
  restore-recovery-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout verified recovery branch
        uses: actions/checkout@v4
        with:
          ref: work/ball46-ceo-ah-tuning-20260920
          fetch-depth: 0

      - name: Freeze production state
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/health?restore=${GITHUB_RUN_ID}-before" -o /tmp/engine-before.json
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/statistics?restore=${GITHUB_RUN_ID}-before" -o /tmp/stats-before.json
          curl -fsS --max-time 30 "$BALL46_URL/api/full-market/health?restore=${GITHUB_RUN_ID}-before" -o /tmp/full-before.json
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/engine-before.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/stats-before.json','utf8'));
          const f=JSON.parse(fs.readFileSync('/tmp/full-before.json','utf8'));
          if(![process.env.BASE_VERSION,process.env.WATCH_VERSION].includes(String(e.version||''))) throw Error(`UNEXPECTED_ENGINE:${e.version}`);
          if(s?.ok!==true||!Array.isArray(s.rows)) throw Error('STATISTICS_UNHEALTHY');
          if(!f?.version) throw Error('FULL_MARKET_UNHEALTHY');
          fs.writeFileSync('/tmp/full-version-before',String(f.version));
          fs.writeFileSync('/tmp/stats-count-before',String(s.rows.length));
          console.log('RESTORE_RECOVERY_BASELINE',JSON.stringify({engine:e.version,fullMarket:f.version,statistics:s.rows.length}));
          NODE

      - name: Guard recovery source and protected logic
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const VERSION='nomad343-engine-v6-ceo-auto-v1.1-ah-guard-settlement-recovery-v1';" "$ENGINE_DIR/src/index.js"
          grep -Fq 'main = "src/index.js"' "$ENGINE_DIR/wrangler.toml"
          grep -Fq 'const MAX_SETTLEMENT_RECOVERY_PER_SCAN=2;' "$ENGINE_DIR/src/index.js"
          node --check "$ENGINE_DIR/src/index.js"
          node --test "$ENGINE_DIR"/test/*.test.mjs
          echo RECOVERY_SOURCE_GUARD_PASS

      - name: Restore original recovery engine only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(node -p "require('/tmp/engine-before.json').version")"
          if [ "$current" = "$BASE_VERSION" ]; then
            echo RECOVERY_ENGINE_ALREADY_ACTIVE
          else
            npx --yes wrangler@4.92.0 deploy --config "$ENGINE_DIR/wrangler.toml"
          fi

      - name: Verify Settlement Watch stopped and no other system changed
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 20); do
            curl -fsS --max-time 30 "$BALL46_URL/api/engine/health?restore=${GITHUB_RUN_ID}-${n}" -o /tmp/engine-after.json || true
            node -e "const j=require('/tmp/engine-after.json');process.exit(j.version===process.env.BASE_VERSION?0:1)" 2>/dev/null && { ok=1; break; }
            sleep 2
          done
          [ "$ok" = 1 ]
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/statistics?restore=${GITHUB_RUN_ID}-after" -o /tmp/stats-after.json
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/signals?restore=${GITHUB_RUN_ID}-after" -o /tmp/signals-after.json
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/board?restore=${GITHUB_RUN_ID}-after" -o /tmp/board-after.json
          curl -fsS --max-time 30 "$BALL46_URL/api/full-market/health?restore=${GITHUB_RUN_ID}-after" -o /tmp/full-after.json
          curl -sS --max-time 30 "$BALL46_URL/api/engine/settlement-watch?restore=${GITHUB_RUN_ID}" -o /tmp/watch-after.txt || true
          curl -sS --max-time 30 "$BALL46_URL/api/engine/settlement-watch-page?restore=${GITHUB_RUN_ID}" -o /tmp/watch-page-after.txt || true
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/engine-after.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/stats-after.json','utf8'));
          const g=JSON.parse(fs.readFileSync('/tmp/signals-after.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/board-after.json','utf8'));
          const f=JSON.parse(fs.readFileSync('/tmp/full-after.json','utf8'));
          const statsBefore=Number(fs.readFileSync('/tmp/stats-count-before','utf8'));
          const fullBefore=fs.readFileSync('/tmp/full-version-before','utf8');
          const watch=fs.readFileSync('/tmp/watch-after.txt','utf8');
          const page=fs.readFileSync('/tmp/watch-page-after.txt','utf8');
          if(e.version!==process.env.BASE_VERSION) throw Error('RECOVERY_ENGINE_NOT_RESTORED');
          if(s?.ok!==true||!Array.isArray(s.rows)||s.rows.length<statsBefore) throw Error('STATISTICS_REGRESSED');
          if(!Array.isArray(g?.signals)) throw Error('SIGNALS_UNHEALTHY');
          if(!Array.isArray(b?.fixtures)) throw Error('BOARD_UNHEALTHY');
          if(String(f.version||'')!==fullBefore) throw Error('FULL_MARKET_CHANGED');
          if(/settlement-recovery-v1-watch-v1|Settlement Watch|"records"\s*:/.test(watch)) throw Error('WATCH_API_STILL_ACTIVE');
          if(/Settlement Watch|Signal matches stay here until/.test(page)) throw Error('WATCH_PAGE_STILL_ACTIVE');
          console.log('SETTLEMENT_WATCH_STOPPED_PASS',JSON.stringify({engine:e.version,fullMarket:f.version,statisticsBefore:statsBefore,statisticsAfter:s.rows.length}));
          NODE
          echo SETTLEMENT_WATCH_STOP_VERIFY_PASS
