name: BALL46 Adaptive research read-only Worker binding diagnostic
on:
  push:
    branches: [release/b46-adaptive-readonly-page-20261125]
    paths: ['.github/workflows/b46-adaptive-readonly-stage-debug-20261125.yml']
permissions: {contents: read}
concurrency:
  group: b46-adaptive-readonly-test-20261125
  cancel-in-progress: false
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Redeploy stage Worker only
        working-directory: qa/adaptive-readonly-production-20261125
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.toml
      - name: Debug service binding and projection status
        run: |
          node --input-type=module <<'NODE'
          const u='https://ball46-adaptive-readonly-page-test-20261125.mccarey-supon.workers.dev';
          for(const path of ['/__b46_adaptive_stage_debug','/research/adaptive-ou/data']){
            const r=await fetch(u+path);
            console.log('B46_ADAPTIVE_STAGE_DEBUG',JSON.stringify({path,status:r.status,body:(await r.text()).slice(0,900)}));
          }
          NODE

# inspect projection schema and formula IDs in isolated stage
