name: READ ONLY - Ball46 Detector Zero Signals 20261017
on:
  push:
    branches: [diag/ball46-detector-zero-signals-20261017]
    paths:
      - .github/workflows/diag-ball46-detector-zero-signals-20261017.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-detector:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Inspect current production engine and upstream HUB - read only
        shell: bash
        run: |
          node <<'NODE'
          const urls={
            hub_health:'https://nomadtips3-5usd-hub-343.mccarey-supon.workers.dev/health',
            hub_snapshot:'https://nomadtips3-5usd-hub-343.mccarey-supon.workers.dev/snapshot',
            engine_health:'https://nomadtips3-engine-343.mccarey-supon.workers.dev/health',
            engine_board:'https://nomadtips3-engine-343.mccarey-supon.workers.dev/board',
            engine_signals:'https://nomadtips3-engine-343.mccarey-supon.workers.dev/signals',
            ball46_board:'https://ball46-production.mccarey-supon.workers.dev/api/engine/board',
            ball46_signals:'https://ball46-production.mccarey-supon.workers.dev/api/engine/signals'
          };
          const stamp=Date.now();
          const short=(s)=>String(s||'').slice(0,220);
          async function probe([name,url]){
            try{
              const res=await fetch(url+'?diag='+stamp,{signal:AbortSignal.timeout(19000),headers:{'cache-control':'no-cache'}});
              const text=await res.text(); let j={};try{j=JSON.parse(text)}catch{}
              const fixtures=Array.isArray(j.fixtures)?j.fixtures:[];
              const candidates=Array.isArray(j.candidates)?j.candidates:[];
              const signals=Array.isArray(j.signals)?j.signals:[];
              const stages={};for(const c of candidates){const key=String(c.stage||c.reason||c.status||'UNKNOWN'); stages[key]=(stages[key]||0)+1}
              const statuses={};for(const f of fixtures){const key=String(f.boardState||f.statusCode||f.status||'unknown');statuses[key]=(statuses[key]||0)+1}
              const meta={probe:name,http:res.status,ok:j.ok,version:j.version,engineState:j.engineState,status:j.status,paused:j.paused,reason:j.reason,lastError:short(j.lastError||j.error),observedAt:j.observedAt,lastScanAt:j.lastScanAt,lastSuccessAt:j.lastSuccessAt,lastSuccessAgeSeconds:j.lastSuccessAgeSeconds,updatedAt:j.updatedAt,fetchedAt:j.fetchedAt,ageMs:j.ageMs,liveAgeMs:j.liveAgeMs,counts:j.counts,provider:j.provider,requestCount:j.lastRequestCount,refereeErrors:j.refereeErrors?.slice?.(0,4),run:j.run,fixtureCount:fixtures.length,candidateCount:candidates.length,signalCount:signals.length,newSignalCount:j.newSignals?.length||0,allCount:j.allCount,stages,statuses};
              if(name==='ball46_signals'||name==='engine_signals'){meta.responseKeys=Object.keys(j);meta.signalArrayType=typeof j.signals;meta.activeSignalsLen=Array.isArray(j.activeSignals)?j.activeSignals.length:null;meta.rowsLen=Array.isArray(j.rows)?j.rows.length:null;meta.filters=j.filters||null;meta.emptyReason=j.emptyReason||null;meta.mirrorInfo=j.mirror||null;}
              if(name==='engine_health'){
                meta.healthKeys=Object.keys(j);
                for(const key of Object.keys(j)){if(/scan|reason|reject|candidate|minute|qualified|evidence|cache|gate|referee|backoff|age|cycle|refresh|source|signal|fetch|warning/i.test(key)&& !/token|key|secret|credential/i.test(key)){const value=j[key];if(value===null||typeof value!=='object'||JSON.stringify(value).length<900)meta['health_'+key]=value}}
              }
              if(name==='engine_signals'||name==='ball46_signals'){
                const ages={};const markets={};let newest=0,oldest=Infinity;const sample=[];
                for(const sig of signals){
                  const t=Number(sig.createdAt||sig.lockedAt||sig.selectedAt||0);if(t){newest=Math.max(newest,t);oldest=Math.min(oldest,t);const day=new Date(t).toISOString().slice(0,10);ages[day]=(ages[day]||0)+1}
                  const market=String(sig.market||sig.providerMarket||'unknown');markets[market]=(markets[market]||0)+1;
                  if(sample.length<3)sample.push({fixtureId:sig.fixtureId,market,createdAt:sig.createdAt,minute:sig.entryMinute,status:sig.status})
                }
                Object.assign(meta,{signalDateCounts:ages,signalMarkets:markets,newestSignalAt:newest?new Date(newest).toISOString():null,oldestSignalAt:oldest<Infinity?new Date(oldest).toISOString():null,sample});
              }
              console.log('PROBE '+JSON.stringify(meta));
            }catch(e){console.log('PROBE '+JSON.stringify({probe:name,error:short(e.message)}))}
          }
          await Promise.all(Object.entries(urls).map(probe));
          NODE

      - name: Read only current detector source and pricing-gate signatures
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          if(!account||!token){console.log('SOURCE_INSPECT_UNAVAILABLE credentials missing');process.exit(0)}
          async function call(path){
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/workers'+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(26000)});
            const j=await r.json();if(!r.ok||j.success!==true)throw Error('CF_READ_'+r.status+'_'+JSON.stringify(j.errors||[]).slice(0,250));return j.result
          }
          try{
            for(const worker of ['nomadtips3-engine-343','ball46-production','nomadtips3-full-market-343-ball46']){
              const deployment=await call('/scripts/'+worker+'/deployments?per_page=2');
              const versionId=deployment.deployments?.[0]?.versions?.[0]?.version_id;
              if(!versionId){console.log('CODE '+worker+' current-version-unavailable');continue}
              const version=await call('/workers/'+worker+'/versions/'+versionId+'?include=modules');
              const main=version.modules?.find(x=>x.name===version.main_module);
              const source=main?.content_base64?Buffer.from(main.content_base64,'base64').toString('utf8'):'';
              const bindings=(version.bindings||[]).map(x=>({name:x.name,type:x.type,service:x.service||null}));
              console.log('SOURCE '+JSON.stringify({worker,versionId,main:version.main_module,chars:source.length,bindings}));
              const marks=worker==='nomadtips3-engine-343'?['JOHN_QUALIFIED_PRICE_CACHE_MISS','JOHN_BULK_QUALIFIED_PRICE_PREWARM_20261011','johnEligibleFixtureIds','refereeScanOrder','johnQuotesByFixture','FULL_MARKET_REQUESTS_PER_SCAN','async scan()']:worker==='ball46-production'?['async function activeSignals','function activeSignals','hiddenPendingSignals','ENGINE_BOARD_LIVE']:['/prewarm','/board-cache','prewarm','RATE_GUARD','MAX_REQUESTS','PROVIDER_BACKOFF','429','FULL_MARKET'];
              for(const mark of marks){const i=source.indexOf(mark);if(i>=0)console.log('SOURCE_FRAGMENT '+JSON.stringify({worker,mark,index:i,fragment:source.slice(Math.max(0,i-340),Math.min(source.length,i+1200))}));else console.log('SOURCE_MARK_MISSING '+worker+' '+mark)}
            }
          }catch(e){console.log('SOURCE_READ_ERROR '+String(e.message).slice(0,250))}
          NODE
