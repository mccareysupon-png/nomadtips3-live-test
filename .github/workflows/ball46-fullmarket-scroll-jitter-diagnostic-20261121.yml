name: BALL46 Full Market and Default odds scroll jitter read-only comparison
on:
  push:
    branches: [test/ball46-fullmarket-odds-v3-20261121]
    paths:
      - '.github/workflows/ball46-fullmarket-scroll-jitter-diagnostic-20261121.yml'
      - 'qa/fullmarket-odds-v3-20261121/scroll-diagnostic.mjs'
permissions: {contents: read}
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Read-only compare original and isolated test scrolling with live DOM refresh
        run: node qa/fullmarket-odds-v3-20261121/scroll-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b46-scroll-diagnostic-${{ github.run_id }}
          path: fullmarket-scroll-*.png
          if-no-files-found: ignore
