name: STEP 3 - Ball46 Scorebar 6x4 Surgical Deploy 20260928

on:
  push:
    branches:
      - ops/ball46-scorebar-6x4-surgical-20260928
    paths:
      - '.github/workflows/ball46-scorebar-6x4-deploy-20260928.yml'

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download exact step 2 candidate
        uses: actions/download-artifact@v4
        with:
          name: ball46-scorebar-6x4-candidate-36363756157
          path: /tmp/b46-scorebar-candidate
          repository: mccareysupon-png/nomadtips3-live-test
          run-id: 36363756157
          github-token: ${{ github.token }}
      - name: Guarded one-file deploy and full verification
        shell: bash
        run: bash .github/scripts/ball46_scorebar_6x4_deploy_20260928.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-scorebar-6x4-deploy-${{ github.run_id }}
          path: /tmp/b46-scorebar-deploy
          if-no-files-found: ignore
          retention-days: 30
