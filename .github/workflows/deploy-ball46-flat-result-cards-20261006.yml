name: Deploy Ball46 Flat Result Cards 20261006
# rerun after EasyBet production deploys completed

on:
  push:
    branches:
      - work/ball46-flat-result-cards-20261006
    paths:
      - '.github/workflows/deploy-ball46-flat-result-cards-20261006.yml'
      - 'deploy-assets/flat-result-cards-20261006/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-production-flat-result-cards-20261006
  cancel-in-progress: false

jobs:
  guarded-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_ENABLED: 'true'
      PATCH_SOURCE_BRANCH: work/ball46-flat-result-cards-20261006
    steps:
      - name: Checkout exact flat-card branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PATCH_SOURCE_BRANCH }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install parser dependency only
        run: npm install --no-save --ignore-scripts acorn@8

      - name: Guarded current-Production visual deploy
        working-directory: deploy-assets/flat-result-cards-20261006
        run: node run.mjs

      - name: Upload audit and rollback proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-flat-result-cards-${{ github.run_id }}
          path: deploy-assets/flat-result-cards-20261006/audit
          if-no-files-found: warn
          retention-days: 30
