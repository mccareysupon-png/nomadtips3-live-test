name: ONE SHOT - Restore Ball46 Approved 18:50 Composite V2

on:
  push:
    branches: [recovery/ball46-approved-1850-composite-20260927]
    paths:
      - '.github/workflows/restore-ball46-approved-1850-composite-v2-20260927.yml'

permissions:
  contents: read

env:
  TARGET_VERSION: 8e95c148-ea19-4ed1-88a1-2f14565c6888
  SOURCE_COMMIT: 6276320261cdc10a3835b27e81850c3d4f17f126
  EXPECTED_SOURCE_COUNT: '69'
  EXPECTED_DEPLOY_COUNT: '81'
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  BALL46_WWW: https://www.ball46.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  exact-approved-composite:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm exact approved Worker is active
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          a=os.environ['CLOUDFLARE_ACCOUNT_ID']; t=os.environ['CLOUDFLARE_API_TOKEN']; want=os.environ['TARGET_VERSION']
          h={'Authorization':f'Bearer {t}','Accept':'application/json'}
          u=f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/scripts/ball46-production/deployments'
          with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=30) as r: p=json.load(r)
          cur=((p.get('result') or {}).get('deployments') or [])[0]['versions'][0]['version_id']
          print('ACTIVE_VERSION='+cur)
          if cur != want: raise SystemExit(f'APPROVED_BASE_NOT_ACTIVE:{cur}')
          PY

      - name: Reconstruct exact 81-file path set used by approved deploy
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/approved-assets /tmp/approved-runtime /tmp/approved-backup
          mkdir -p /tmp/approved-assets /tmp/approved-runtime /tmp/approved-backup

          find nomad-live-343 -type f -printf '%P\n' | sort -u > /tmp/source-paths.txt
          scount=$(wc -l < /tmp/source-paths.txt | tr -d ' ')
          [ "$scount" = "$EXPECTED_SOURCE_COUNT" ] || { echo "SOURCE_PATH_COUNT_CHANGED:$scount"; exit 1; }

          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 -H 'Cache-Control: no-cache' "$BALL46_WORKER/index.html?approved-paths=${GITHUB_RUN_ID}-$(date +%s%N)" -o /tmp/approved-index.html
          python3 - <<'PY' > /tmp/index-ref-paths.txt
          from pathlib import Path
          from urllib.parse import urlsplit
          import re
          h=Path('/tmp/approved-index.html').read_text(errors='ignore')
          found=set()
          for x in re.findall(r'''(?:src|href)=["']([^"']+)["']''',h,re.I):
              x=x.strip()
              if not x or x.startswith(('http://','https://','//','data:','mailto:','javascript:','#')): continue
              x=urlsplit(x).path.strip().lstrip('./').lstrip('/')
              if not x: continue
              if re.search(r'\.(?:js|css|svg|json|png|webp|jpg|jpeg|ico)$',x,re.I): found.add(x)
          for x in sorted(found): print(x)
          PY

          cat /tmp/source-paths.txt /tmp/index-ref-paths.txt | sed '/^$/d' | sort -u > /tmp/asset-paths.txt
          dcount=$(wc -l < /tmp/asset-paths.txt | tr -d ' ')
          echo "SOURCE_COUNT=$scount INDEX_REF_COUNT=$(wc -l < /tmp/index-ref-paths.txt | tr -d ' ') DEPLOY_PATH_COUNT=$dcount"
          [ "$dcount" = "$EXPECTED_DEPLOY_COUNT" ] || { echo 'DEPLOY_PATH_SET_NOT_EXACT_81'; cat /tmp/index-ref-paths.txt; exit 1; }

          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            mkdir -p "/tmp/approved-assets/$(dirname "$rel")"
            curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 -H 'Cache-Control: no-cache' "$BALL46_WORKER/$rel?approved-capture=${GITHUB_RUN_ID}-$(date +%s%N)" -o "/tmp/approved-assets/$rel"
            test -s "/tmp/approved-assets/$rel" || { echo "EMPTY_APPROVED_ASSET:$rel"; exit 1; }
          done < /tmp/asset-paths.txt

          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.request
          a=os.environ['CLOUDFLARE_ACCOUNT_ID']; t=os.environ['CLOUDFLARE_API_TOKEN']; v=os.environ['TARGET_VERSION']
          h={'Authorization':f'Bearer {t}','Accept':'application/json'}
          u=f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/workers/ball46-production/versions/{v}?include=modules'
          with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=30) as r: p=json.load(r)
          result=p.get('result') or {}; mods=result.get('modules') or []
          hits=[m for m in mods if m.get('name')=='index.js' and m.get('content_base64')]
          if len(hits)!=1: raise SystemExit(f'RUNTIME_MODULE_COUNT:{len(hits)}')
          pathlib.Path('/tmp/approved-runtime/index.js').write_bytes(base64.b64decode(hits[0]['content_base64']))
          pathlib.Path('/tmp/approved-backup/runtime-meta.json').write_text(json.dumps({k:result.get(k) for k in ['main_module','compatibility_date','bindings','assets','usage_model']},sort_keys=True,indent=2))
          PY

          (cd /tmp/approved-assets && while IFS= read -r rel; do sha256sum "$rel"; done < /tmp/asset-paths.txt) > /tmp/approved-backup/assets.sha256
          sha256sum /tmp/approved-runtime/index.js > /tmp/approved-backup/runtime.sha256
          cp /tmp/asset-paths.txt /tmp/approved-backup/
          cp /tmp/source-paths.txt /tmp/approved-backup/
          cp /tmp/index-ref-paths.txt /tmp/approved-backup/
          cp -a /tmp/approved-assets /tmp/approved-backup/assets
          cp /tmp/approved-runtime/index.js /tmp/approved-backup/index.js

          grep -Fq 'BALL46_SCOREBAR_READONLY_20260926' /tmp/approved-assets/dashboard-v2-stage3.js
          grep -Fq 'button.workspace-scorebar-cell{cursor:default}' /tmp/approved-assets/singlepage-workspace-343.css
          grep -Fq 'const activeSignals=num(signalMirror?.activeSignals)??signalMap.size,activeMatches=' /tmp/approved-assets/dashboard-v2-stage3.js
          ! grep -Fq 'BALL46-MOBILE-PARITY' /tmp/approved-assets/index.html
          test -s /tmp/approved-assets/signal.html
          test -s /tmp/approved-assets/statistics.html
          echo APPROVED_EXACT_81_CAPTURE_PASS

      - name: Upload immutable approved base package
        uses: actions/upload-artifact@v4
        with:
          name: ball46-approved-1850-exact81-${{ github.run_id }}
          path: /tmp/approved-backup
          retention-days: 30
          compression-level: 6

      - name: Patch Signal menu count only
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/approved-assets /tmp/patched-assets
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/patched-assets/dashboard-v2-stage3.js')
          s=p.read_text()
          old='const activeSignals=num(signalMirror?.activeSignals)??signalMap.size,activeMatches='
          new='const activeSignals=signalRows.length,activeMatches='
          if s.count(old)!=1: raise SystemExit(f'SIGNAL_COUNT_TARGET_COUNT:{s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          a=Path('/tmp/approved-assets'); b=Path('/tmp/patched-assets'); changed=[]
          for rel in Path('/tmp/asset-paths.txt').read_text().splitlines():
              if hashlib.sha256((a/rel).read_bytes()).digest()!=hashlib.sha256((b/rel).read_bytes()).digest(): changed.append(rel)
          print('CHANGED_ASSETS=',changed)
          if changed != ['dashboard-v2-stage3.js']: raise SystemExit('NOT_EXACT_ONE_ASSET_CHANGE')
          PY
          grep -Fq 'const activeSignals=signalRows.length,activeMatches=' /tmp/patched-assets/dashboard-v2-stage3.js
          echo SIGNAL_COUNT_SURGICAL_PATCH_PASS

      - name: Build exact approved runtime config and dry run
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/approved-runtime/index.js /tmp/index.js
          cat > /tmp/wrangler.ball46.recovery.jsonc <<'EOF'
          {
            "name": "ball46-production",
            "main": "./index.js",
            "compatibility_date": "2026-09-09",
            "no_bundle": true,
            "workers_dev": true,
            "preview_urls": false,
            "assets": {
              "directory": "/tmp/patched-assets",
              "binding": "ASSETS",
              "run_worker_first": true,
              "html_handling": "none"
            },
            "services": [
              { "binding": "ENGINE", "service": "nomadtips3-engine-343" },
              { "binding": "HUB", "service": "nomadtips3-5usd-hub-343" },
              { "binding": "FULL_MARKET", "service": "nomadtips3-full-market-343-ball46" }
            ],
            "triggers": { "crons": ["* * * * *"] },
            "observability": { "enabled": true }
          }
          EOF
          cd /tmp
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.recovery.jsonc

      - name: Deploy exact approved package plus one Signal count patch
        id: deploy
        working-directory: /tmp
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.recovery.jsonc | tee /tmp/deploy.log
          grep -Fq 'Uploaded ball46-production' /tmp/deploy.log

      - name: Verify exact 81 assets and all critical pages
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          sleep 4
          rm -rf /tmp/live-verify && mkdir -p /tmp/live-verify
          while IFS= read -r rel; do
            mkdir -p "/tmp/live-verify/$(dirname "$rel")"
            curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 -H 'Cache-Control: no-cache' "$BALL46_WORKER/$rel?full-verify=${GITHUB_RUN_ID}-$(date +%s%N)" -o "/tmp/live-verify/$rel"
          done < /tmp/asset-paths.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          want=Path('/tmp/patched-assets'); got=Path('/tmp/live-verify'); bad=[]
          for rel in Path('/tmp/asset-paths.txt').read_text().splitlines():
              if hashlib.sha256((want/rel).read_bytes()).digest()!=hashlib.sha256((got/rel).read_bytes()).digest(): bad.append(rel)
          print('WORKER_ASSET_MISMATCH=',bad)
          if bad: raise SystemExit(1)
          PY
          grep -Fq 'const activeSignals=signalRows.length,activeMatches=' /tmp/live-verify/dashboard-v2-stage3.js
          grep -Fq 'button.workspace-scorebar-cell{cursor:default}' /tmp/live-verify/singlepage-workspace-343.css
          ! grep -Fq 'BALL46-MOBILE-PARITY' /tmp/live-verify/index.html
          test -s /tmp/live-verify/signal.html
          test -s /tmp/live-verify/statistics.html

          for ep in health board signals statistics; do
            curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/$ep?recovery=${GITHUB_RUN_ID}" -o "/tmp/$ep.json"
          done
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json'));
          const b=JSON.parse(fs.readFileSync('/tmp/board.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals.json'));
          const t=JSON.parse(fs.readFileSync('/tmp/statistics.json'));
          if(h?.ok!==true) throw Error('HEALTH_BAD');
          if(b?.ok!==true || !Array.isArray(b?.fixtures)) throw Error('BOARD_BAD');
          if(!Array.isArray(s?.signals)) throw Error('SIGNALS_BAD');
          if(t?.ok!==true || !Array.isArray(t?.rows)) throw Error('STATISTICS_BAD');
          console.log('CURRENT_BACKEND_OK',{fixtures:b.fixtures.length,signals:s.signals.length,settled:t.rows.length});
          NODE

          for rel in index.html signal.html statistics.html dashboard-v2-stage3.js; do
            curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 25 -H 'Cache-Control: no-cache' "$BALL46_WWW/$rel?recovery-www=${GITHUB_RUN_ID}-$(date +%s%N)" -o "/tmp/www-${rel//\//_}"
            [ "$(sha256sum "/tmp/www-${rel//\//_}" | awk '{print $1}')" = "$(sha256sum "/tmp/patched-assets/$rel" | awk '{print $1}')" ] || { echo "WWW_HASH_MISMATCH:$rel"; exit 1; }
          done
          echo BALL46_APPROVED_FULL_RECOVERY_PASS

      - name: Fallback to exact approved 18:50 Worker on verification failure
        if: ${{ failure() && steps.deploy.outcome == 'success' && steps.verify.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 rollback "$TARGET_VERSION" --name ball46-production --message "Fallback exact approved 18:50 after composite verify failure"
          echo FALLBACK_TO_APPROVED_BASE_DONE
