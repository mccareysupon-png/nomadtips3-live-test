name: NOMAD Live 3.41 Rail PR Test

on:
  pull_request:
    paths:
      - 'nomad-live/**'
      - 'nomad-live-web-test/**'
      - 'nomad-live-engine/wrangler.toml'
      - '.github/workflows/nomad-live-rail-pr-test.yml'
      - '.github/workflows/nomad-live-engine-test-deploy.yml'
      - '.github/workflows/nomad-live-web-test-deploy.yml'

permissions:
  contents: read

jobs:
  validate-rail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate runtime JavaScript
        run: |
          node --check nomad-live/runtime-config.js
          node --check nomad-live/runtime.js
          node --check nomad-live/signal-retention.js
          node --check nomad-live/live-entry-score.js
          node --check nomad-live/statistics-live.js
          node --check nomad-live/health-live.js
          node --check nomad-live/site-footer.js
          node --check nomad-live/match-scout-sidecar.js

      - name: Reject Production engine URLs outside the centralized runtime config
        run: |
          PRODUCTION_ENGINE_HOST='nomadtips3-live-engine.mccarey-supon.workers.dev'
          if grep -RInF --exclude='runtime-config.js' "$PRODUCTION_ENGINE_HOST" nomad-live; then
            echo '::error::Production engine URL is hardcoded outside nomad-live/runtime-config.js'
            exit 1
          fi
          TEST_ENGINE_HOST='nomadtips3-live-engine-test.mccarey-supon.workers.dev'
          if grep -RInF "$TEST_ENGINE_HOST" nomad-live; then
            echo '::error::Public TEST Engine URL is exposed to browser runtime assets'
            exit 1
          fi
          ! grep -RIn 'NOMAD_RUNTIME[^;]*engineUrl' nomad-live
          node --test nomad-live-engine/test/runtime-isolation.test.js

      - name: Validate public and owner page separation
        run: |
          grep -q 'runtime-config.js' nomad-live/index.html
          grep -q 'runtime-config.js' nomad-live/statistics.html
          grep -q 'runtime-config.js' nomad-live/settings.html
          grep -q 'runtime-config.js' nomad-live/health.html
          ! grep -q 'href="settings.html"' nomad-live/index.html
          ! grep -q 'href="health.html"' nomad-live/index.html
          ! grep -q 'href="settings.html"' nomad-live/statistics.html
          ! grep -q 'href="health.html"' nomad-live/statistics.html
          grep -q 'noindex,nofollow' nomad-live/settings.html
          grep -q 'noindex,nofollow' nomad-live/health.html

      - name: Validate TEST isolation config
        run: |
          grep -q '^\[env.test\]' nomad-live-engine/wrangler.toml
          grep -q 'name = "nomadtips3-live-engine-test"' nomad-live-engine/wrangler.toml
          TEST_ENV_CONFIG="$(awk '/^\[env.test\]$/{inside=1;next} /^\[/{if(inside) exit} inside{print}' nomad-live-engine/wrangler.toml)"
          printf '%s\n' "$TEST_ENV_CONFIG" | grep -q '^workers_dev = false$'
          printf '%s\n' "$TEST_ENV_CONFIG" | grep -q '^preview_urls = false$'
          grep -q '^\[env.test.vars\]' nomad-live-engine/wrangler.toml
          grep -q '^ENGINE_CYCLE_MODE = "on_demand"' nomad-live-engine/wrangler.toml
          grep -q '^\[\[env.test.durable_objects.bindings\]\]' nomad-live-engine/wrangler.toml
          grep -q '^\[\[env.test.migrations\]\]' nomad-live-engine/wrangler.toml
          grep -q ":'/api'" nomad-live/runtime-config.js
          node --test nomad-live-web-test/test/*.test.js
