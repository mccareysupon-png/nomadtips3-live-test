name: Test themed chart loader
on:
  push:
    branches: [test/ball46-ui-interaction-baseline-20261125]
    paths: ['.github/workflows/qa-themed-chart-loader.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install chromium --only-shell
      - name: Verify actual delays across viewports
        shell: bash
        run: |
          node <<'JS'
          const {chromium,devices}=require('playwright');
          const url='https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev/?b46pm=ou';
          (async()=>{
            const browser=await chromium.launch();
            try {
              const cases=[
                ['desktop', {viewport:{width:1440,height:900}}, true],
                ['phone', devices['iPhone 13'], false],
                ['tablet', devices['iPad Mini'], false],
                ['reduced motion',{viewport:{width:390,height:844},reducedMotion:'reduce'},false],
              ];
              const results=await Promise.allSettled(cases.map(async ([label,opts,switchMarket])=>{
                const page=await browser.newPage({...opts,serviceWorkers:'block'});
                const errors=[];page.on('pageerror',e=>errors.push(e.message));
                let release;
                const hold=()=>new Promise(r=>{release=r});
                let gate=hold();
                await page.route('**/b46-receiver-v1/graph?*',async route=>{await gate;await route.continue()});
                const wait=page.locator('.b46-market-loading');
                const card=page.locator('#b46-finance-chart-card');
                try{
                  await page.goto(url,{waitUntil:'domcontentloaded',timeout:25000});
                  const desktopTotal=page.locator('button[data-stat-market="all"]:visible').first();
                  if(await desktopTotal.isVisible())await desktopTotal.click();
                  else {
                    await page.getByRole('button',{name:'Open navigation'}).click({timeout:12000});
                    await page.locator('#b46m-drawer [data-b46m-page="statistics"]:visible').first().click({timeout:12000});
                  }
                  await wait.waitFor({state:'visible',timeout:10000});
                  const style=await wait.evaluate(async el=>{
                    const css=()=>getComputedStyle(el,'::before');
                    const before=css().transform;
                    await new Promise(r=>setTimeout(r,145));
                    return {name:css().animationName,before,after:css().transform,role:el.getAttribute('role'),assetWidth:css().width,width:innerWidth,color:css().borderTopColor};
                  });
                  const isReduced=label==='reduced motion';
                  if(style.role!=='status'||style.assetWidth!=='24px'||(isReduced?style.name!=='none':(style.name!=='b46-market-rotate'||style.before===style.after)))throw Error(JSON.stringify(style));
                  release();
                  await wait.waitFor({state:'hidden',timeout:18000});
                  await card.locator('.f46-card').waitFor({state:'visible',timeout:18000});
                  if(switchMarket){
                    const market=page.locator('[data-stat-market="1x2"]:visible').first();
                    await market.scrollIntoViewIfNeeded();
                    await page.waitForFunction(()=>window.__B46_FAST_DETAILS_REQUESTED===true);
                    gate=hold();
                    await market.click();
                    await wait.waitFor({state:'visible',timeout:5000});
                    const pending=await wait.getAttribute('data-held-height');
                    const shell=card.locator('[data-b46-perf-shell]');
                    const height=await shell.evaluate(e=>e.getBoundingClientRect().height);
                    if(!pending||Math.abs(+pending-height)>1)throw Error('reserved chart height mismatches actual layout: '+height+' / '+pending);
                    release();
                    await page.waitForFunction(()=>document.querySelector('#b46-finance-chart-card')?.dataset.b46PaintedMarket==='1x2');
                    await wait.waitFor({state:'hidden'});
                  }
                  if(errors.length)throw Error(errors.join('; '));
                  console.log(label+' PASS '+JSON.stringify(style)+(switchMarket?' + market switch':''));
                } catch(e){console.error(label+' DIAG',await page.evaluate(()=>({view:document.body.dataset.workspaceView,url:location.href,loader:!!document.querySelector('.b46-market-loading'),chart:document.querySelector('#b46-finance-chart-card')?.outerHTML.slice(0,300),width:innerWidth})),errors);throw e;} finally {release();await page.close()}
              }));
              const failed=results.flatMap((r,i)=>r.status==='rejected'?[cases[i][0]+': '+r.reason.stack]:[]);
              if(failed.length)throw Error(failed.join('\n'));
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
