name: Ball46 Sidebar TOTAL Runtime Guarded Surgical Deploy
on:
  push:
    branches: ['safe/ball46-statistics-runtime-total-20261004']
    paths: ['.github/workflows/ball46-sidebar-total-runtime-deploy-20261004.yml']
permissions:
  contents: read
concurrency:
  group: ball46-production-spa-statistics-total
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: deploy-assets/match-status-svg-20261003
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture both writers before surgical asset deploy and watch two actual polling cycles
        working-directory: deploy-assets/match-status-svg-20261003
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node sidebar-total-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-sidebar-total-runtime-${{ github.run_id }}
          path: deploy-assets/match-status-svg-20261003/audit/
          retention-days: 7
