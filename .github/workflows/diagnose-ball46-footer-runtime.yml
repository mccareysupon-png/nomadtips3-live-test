name: Diagnose BALL46 Footer Runtime Guard
on:
  push:
    branches: [test/ball46-pin-v2-mobile-fix-20261112]
    paths: ['ball46-android-app/DIAGNOSE_FOOTER_RUNTIME_READY']
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node ball46-android-app/diagnose-footer-runtime.mjs
