name: Audit Ball46 Scheduled Extra 5Dollar Consumers
on:
  push:
    branches: [incident/ball46-signal-silent-20261011]
    paths: [.github/workflows/audit-ball46-scheduled-hidden-producers-20261011.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect extra cron Worker live source and routes without calling provider
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const b='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers',auth={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          async function get(p){const r=await fetch(b+p,{headers:auth,signal:AbortSignal.timeout(20000)}),j=await r.json();if(!r.ok||j.success!==true)throw Error('CF_'+r.status+'_'+p);return j.result}
          for(const name of ['nomadtips3-343-central-cache','nomadtips3-343-central-cache-canary','nomadtips3-343-full-market-central-canary','nomadtips3-5usd-hub-343-stable-canary','nomadtips3-rich-odds-343']){
            try{
              const ds=await get('/scripts/'+name+'/deployments'),id=ds.deployments[0].versions.find(x=>Number(x.percentage)===100)?.version_id;
              const v=await get('/workers/'+name+'/versions/'+id+'?include=modules');
              const mod=v.modules.find(x=>x.name===v.main_module),src=Buffer.from(mod.content_base64,'base64').toString('utf8'),lines=src.split('\n');
              const patterns=['async scheduled','scheduled(', 'api.5dollarfootballapi','/v1/fixtures','/fixtures?', '/odds','fetch(', 'REQUEST_BUDGET','MAX_CALL','MAX_PER','RATE_LIMIT','cron','scan'];
              const hits={};for(const p of patterns)hits[p]=lines.flatMap((x,i)=>x.includes(p)?[{line:i+1,code:x.trim().slice(0,320)}]:[]).slice(0,16);
              const sched=(await get('/scripts/'+name+'/schedules')).schedules.map(x=>x.cron);
              console.log('EXTRA_PRODUCER',JSON.stringify({name,id,bytes:src.length,cron:sched,hits}));
              const pos=lines.findIndex(x=>x.includes('async scheduled('));
              if(pos>=0)console.log('EXTRA_SCHEDULED_SOURCE',JSON.stringify({name,start:pos+1,code:lines.slice(Math.max(0,pos-4),pos+18).join('\n').slice(0,2700)}));
            }catch(e){console.log('EXTRA_ERROR',JSON.stringify({name,error:String(e?.message||e)}))}
          }
          NODE
