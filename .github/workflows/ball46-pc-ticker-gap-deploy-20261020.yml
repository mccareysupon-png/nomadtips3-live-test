name: BALL46 Production PC Ticker Top Gap Fix 20261020
on:
  push:
    branches: [codex/ball46-pc-ticker-gap-20261020]
    paths:
      - '.github/workflows/ball46-pc-ticker-gap-deploy-20261020.yml'
      - 'deploy-assets/pc-ticker-gap-20261020/deploy.mjs'
      - 'deploy-assets/pc-ticker-gap-20261020/theme.mjs'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  gated-desktop-gap-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check and browser tooling
        working-directory: deploy-assets/pc-ticker-gap-20261020
        run: |
          set -euo pipefail
          node --check theme.mjs
          node --check deploy.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
      - name: Baseline measure, candidate visual test and conditional Production deployment
        working-directory: deploy-assets/pc-ticker-gap-20261020
        run: node deploy.mjs
      - name: Preserve before and after desktop and mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-pc-ticker-gap-before-after
          path: deploy-assets/pc-ticker-gap-20261020/audit/
          retention-days: 30
          if-no-files-found: warn
