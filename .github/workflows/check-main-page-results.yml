name: Check Main Page Results

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-main-page-results.yml"
      - "scripts/fetch_main_page_results.py"

permissions:
  contents: write

jobs:
  check-results:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch final results
        run: python scripts/fetch_main_page_results.py

      - name: Commit result snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main-page-results.json
          if git diff --cached --quiet; then
            echo "No result changes."
            exit 0
          fi
          git commit -m "Update main page final results"
          git pull --rebase origin main
          git push origin main
