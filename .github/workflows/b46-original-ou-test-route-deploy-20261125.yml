name: BALL46 Original Nov22 Over-Under TEST route restore and deploy
on:
  push:
    branches: [restore/b46-original-ou-test-deploy-lane-20261125]
    paths: ['.github/workflows/b46-original-ou-test-route-deploy-20261125.yml']
permissions: {contents: read}
concurrency:
  group: ball46-original-ou-test-release
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check original TEST release path script
        run: node --check qa/prematch-history-20261120/redeploy-current-ou-on-original-test-20261125.mjs
      - name: Redeploy current, already-audited O/U frontend on original TEST Worker
        run: node qa/prematch-history-20261120/redeploy-current-ou-on-original-test-20261125.mjs
      - name: Install Chromium for original path browser verification
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Verify original O/U path and 7D 30D 90D no-flicker
        run: node qa/prematch-history-20261120/qa-restored-original-ou-test-20261125.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-original-ou-test-route-${{ github.run_id }}
          path: qa/prematch-history-20261120/audit-original-20261122-route/
          if-no-files-found: warn
