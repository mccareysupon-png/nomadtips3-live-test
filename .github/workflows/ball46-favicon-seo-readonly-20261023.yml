name: BALL46 favicon and SEO production READ ONLY audit 20261023
on:
  push:
    branches: [audit/ball46-favicon-seo-20261023]
    paths:
      - '.github/workflows/ball46-favicon-seo-readonly-20261023.yml'
      - 'deploy-assets/ball46-favicon-seo-20261023/audit.mjs'
permissions:
  contents: read
concurrency:
  group: ball46-favicon-seo-audit-read-only
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read live Worker version plus Google favicon and SEO paths (NO WRITES)
        working-directory: deploy-assets/ball46-favicon-seo-20261023
        run: |
          node --check audit.mjs
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-favicon-seo-readonly-${{ github.run_id }}
          path: deploy-assets/ball46-favicon-seo-20261023/audit/
          retention-days: 14
