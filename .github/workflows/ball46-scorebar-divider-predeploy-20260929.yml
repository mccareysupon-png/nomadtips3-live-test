name: READ ONLY - Ball46 Scorebar Divider Predeploy 20260929

on:
  push:
    branches:
      - work/ball46-scorebar-images-20260929
    paths:
      - '.github/workflows/ball46-scorebar-divider-predeploy-20260929.yml'
      - '.github/scripts/ball46_scorebar_divider_predeploy_20260929.sh'
      - '.github/scripts/ball46_scorebar_divider_preview_20260929.js'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-scorebar-images-20260929
      - uses: actions/download-artifact@v4
        with:
          name: ball46-scorebar-images-predeploy-36530376786
          path: /tmp/b46-divider-seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36530376786
      - name: Build exact two-file divider candidate from fresh Production
        shell: bash
        run: bash .github/scripts/ball46_scorebar_divider_predeploy_20260929.sh
      - name: Install browser verifier
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Preview divider camouflage without Production mutation
        run: node .github/scripts/ball46_scorebar_divider_preview_20260929.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-scorebar-divider-predeploy-${{ github.run_id }}
          path: |
            /tmp/b46-divider-predeploy
            /tmp/b46-divider-preview
          if-no-files-found: ignore
          retention-days: 30
