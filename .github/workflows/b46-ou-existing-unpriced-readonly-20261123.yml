name: BALL46 TEST inspect existing unpriced pending O/U picks readonly
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-ou-existing-unpriced-readonly-20261123.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read issued pending O/U evidence, no calls to paid 5USD API
        run: |
          node --input-type=module <<'JS'
          import crypto from 'node:crypto';
          const token=process.env.CLOUDFLARE_API_TOKEN,a=process.env.CLOUDFLARE_ACCOUNT_ID;
          const host='https://ball46-prematch-only-test-20261120.mccarey-supon.workers.dev';
          const key=crypto.createHmac('sha256',token).update('BALL46_PREMATCH_ONLY_V1').digest('hex');
          const get=async path=>{const r=await fetch(host+path,{headers:{authorization:'Bearer '+key},cache:'no-store',signal:AbortSignal.timeout(25000)});return {status:r.status,body:await r.json().catch(()=>null)}};
          const [e,p,s]=await Promise.all([get('/ou-locked-evidence-test'),get('/preview-data'),get('/ou-price-pickup-state')]);
          const rows=e.body?.rows??[];const now=Math.floor(Date.now()/1000);
          console.log('B46_OU_CURRENT_PENDING_AUDIT '+JSON.stringify({
           ownerEvidenceStatus:e.status,previewStatus:p.status,quoteStatus:s.status,
           now,workerVersionExpected:'25e26c01-88ac-47a1-9d71-93140b3efe47',
           issued:rows.length, priced:rows.filter(r=>typeof r.price==='number'&&r.price>1).length,
           unpriced:rows.filter(r=>r.price==null).length, 
           eligibleBeforeKickoff:rows.filter(r=>r.price==null&&Number(r.kickoff)>now+300).length,
           previewOU:p.body?.ouLedger?.rows?.map(r=>({id:r.fixture_id,pick:r.pick,
             price:r.price,status:r.status,kickoff:r.kickoff,pickedAt:r.picked_at}))??[],
           recentQuoteRequests:s.body?.recent?.map(r=>({id:r.fixture_id,state:r.state}))??[],
           providerRequestsMadeByCheck:0
          }).slice(0,14000));
          JS
