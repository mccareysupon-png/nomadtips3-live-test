name: BALL46 Pre-Match performance incremental math isolated QA
on:
  push:
    branches: [test/ball46-premium-match-colors-20261120]
    paths:
      - '.github/workflows/ball46-prematch-performance-unit-qa.yml'
      - 'qa/prematch-performance-20261121/**'
permissions: {contents: read}
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax and date-based ledger snapshot formulas
        run: |
          node --check qa/prematch-performance-20261121/performance-core.mjs
          node --test qa/prematch-performance-20261121/performance-core.test.mjs
          echo 'PREMATCH_PERFORMANCE_CORE_PASS'
