name: Diagnose Ball46 Corners Performance 20261006

on:
  push:
    branches:
      - diag/ball46-corners-performance-20261006
    paths:
      - '.github/workflows/diag-ball46-corners-performance-20261006.yml'
      - 'deploy-assets/diag-corners-performance-20261006/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/ball46-corners-performance-20261006
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Corners contribution to current Performance Card
        working-directory: deploy-assets/diag-corners-performance-20261006
        run: node run.mjs
