name: BALL46 Green Noir Loaded Board Read-only Probe
on:
  push:
    branches: [work/ball46-green-noir-mobile-production-20261018]
    paths: [.github/workflows/ball46-green-noir-loaded-board-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Observe loaded boards (read-only)
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          for(const width of [390,1280]){
            const page=await browser.newPage({viewport:{width,height:860}});
            const errors=[];page.on('pageerror',e=>errors.push(String(e.message).slice(0,200)));
            const failures=[];page.on('response',r=>{if(r.url().includes('/api/engine/board'))failures.push({status:r.status(),url:r.url()})});
            await page.goto('https://ball46.com/?_gnprobe='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(20000);
            const x=await page.evaluate(()=>({fixtureRows:document.querySelectorAll('[data-board-sections] [data-match-id]').length,gnCards:document.querySelectorAll('#b46gn-cards [data-b46gn-fixture]').length,gnEmpty:document.querySelector('#b46gn-cards')?.textContent?.slice(0,200),boardContent:document.querySelector('[data-board-sections]')?.textContent?.slice(0,250),pageState:document.querySelector('[data-state]')?.textContent?.slice(0,200),view:document.body.dataset.workspaceView,desktopCount:document.querySelector('[data-filter-count="all"]')?.textContent,hasGN:document.documentElement.dataset.b46gn||null}));
            console.log('BOARD_LOAD_DIAG',JSON.stringify({width,...x,errors,boardResponses:failures}));
            await page.screenshot({path:'green-noir-loaded-'+width+'.png',fullPage:false});
            await page.close();
          }
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-green-noir-loaded-board-probe
          path: green-noir-loaded-*.png
          retention-days: 3
