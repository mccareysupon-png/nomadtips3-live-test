name: INSPECT Ball46 source for safe Footer patch 20261001

on:
  push:
    branches: [ops/ball46-footer-links-20261001]
    paths: ['.github/workflows/rollback-ball46-footer-v5-20261001.yml']

permissions:
  contents: read

env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  EXPECTED_VERSION: d54d0bae-0bd7-4a36-beed-052aa69a3a5e

jobs:
  inspect-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Inspect exact active Worker source anchors only
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/d.json
          CUR=$(node -e "const j=require('/tmp/d.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))")
          [ "$CUR" = "$EXPECTED_VERSION" ] || { echo "PRODUCTION_MOVED:$CUR"; exit 2; }
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/workers/$SCRIPT_NAME/versions/$EXPECTED_VERSION?include=modules" -H "$AUTH" -o /tmp/v.json
          node - <<'NODE'
          const fs=require('fs');const j=require('/tmp/v.json');const main=j.result.main_module;const m=j.result.modules.find(x=>x.name===main);const s=Buffer.from(m.content_base64,'base64').toString('utf8');
          const needles=['Information & Legal Center','legal.css','/signal.html','/statistics.html','b46-site-footer-v1'];
          console.log('MAIN',main,'BYTES',Buffer.byteLength(s));
          for(const n of needles){let pos=-1,count=0;while((pos=s.indexOf(n,pos+1))>=0){count++;const a=Math.max(0,pos-2200),b=Math.min(s.length,pos+4200);console.log('\n===ANCHOR',JSON.stringify(n),'#'+count,'AT',pos,'===\n'+s.slice(a,b)+'\n===END===');if(count>=4)break}console.log('COUNT_SHOWN',n,count)}
          NODE
