name: DEPLOY Ball46 legal CSS + Footer links source-only 20261001

on:
  push:
    branches: [ops/ball46-footer-links-20261001]
    paths: ['.github/workflows/rollback-ball46-footer-v5-20261001.yml']

permissions:
  contents: write

env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  BALL46_URL: https://ball46.com
  EXPECTED_BASE: d54d0bae-0bd7-4a36-beed-052aa69a3a5e

jobs:
  legal-css-footer-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ball46-footer-links-20261001
          fetch-depth: 1

      - name: Lock exact Production and capture unchanged legal HTML/backend
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          mkdir -p /tmp/before /tmp/after /tmp/modules audit
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=3" -H "$AUTH" -o /tmp/deploy-before.json
          CUR=$(node -e "const j=require('/tmp/deploy-before.json');const d=j.result?.deployments?.[0];if(!d||d.versions?.length!==1||Number(d.versions[0].percentage)!==100)process.exit(2);process.stdout.write(String(d.versions[0].version_id||''))")
          [ "$CUR" = "$EXPECTED_BASE" ] || { echo "ABORT_PRODUCTION_MOVED current=$CUR expected=$EXPECTED_BASE"; exit 3; }
          echo -n "$CUR" >/tmp/base-version
          pages='information about user-guide methodology privacy terms disclaimer affiliate-disclosure responsible-gambling cookies contact'
          for p in $pages;do curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/$p.html?before=${GITHUB_RUN_ID}-$p" -o "/tmp/before/$p.html";done
          curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/index.html?before=${GITHUB_RUN_ID}" -o /tmp/before/index.html
          LEGAL_STATUS=$(curl -sS -L -o /tmp/before/legal.css -w '%{http_code}' "$BALL46_URL/legal.css?before=${GITHUB_RUN_ID}")
          echo "LEGAL_CSS_BEFORE_STATUS:$LEGAL_STATUS"
          echo -n "$LEGAL_STATUS" >/tmp/legal-before-status
          curl -fsS "$BALL46_URL/api/engine/health?before=${GITHUB_RUN_ID}" -o /tmp/before/e.json
          curl -fsS "$BALL46_URL/api/full-market/health?before=${GITHUB_RUN_ID}" -o /tmp/before/f.json
          curl -fsS "$BALL46_URL/api/engine/statistics?before=${GITHUB_RUN_ID}" -o /tmp/before/s.json
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const e=require('/tmp/before/e.json'),f=require('/tmp/before/f.json'),s=require('/tmp/before/s.json');if(e.ok!==true||f.ok!==true||s.ok!==true)throw Error('BACKEND_NOT_OK_BEFORE');fs.writeFileSync('/tmp/backend-before.json',JSON.stringify({engine:e.version,fullMarket:f.version,settlementRevision:s.settlementRevision}));const h=fs.readFileSync('/tmp/before/index.html','utf8'),m=h.match(/<footer\b[^>]*id=["']b46-site-footer-v1["'][\s\S]*?<\/footer>/i);if(!m)throw Error('GLOBAL_FOOTER_MISSING_BEFORE');if(!m[0].includes('/signal.html')||!m[0].includes('/statistics.html'))throw Error('EXPECTED_OLD_LINKS_NOT_FOUND');const pages='information about user-guide methodology privacy terms disclaimer affiliate-disclosure responsible-gambling cookies contact'.split(' '),hashes={};for(const p of pages)hashes[p]=crypto.createHash('sha256').update(fs.readFileSync('/tmp/before/'+p+'.html')).digest('hex');fs.writeFileSync('/tmp/legal-page-hashes.json',JSON.stringify(hashes));console.log('BEFORE_CAPTURE_OK');
          NODE

      - name: Build exact source patch only for legal.css route and two Footer hrefs
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"; BASE=$(cat /tmp/base-version)
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/workers/$SCRIPT_NAME/versions/$BASE?include=modules" -H "$AUTH" -o /tmp/version.json
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');const j=require('/tmp/version.json');if(j.success!==true)throw Error('VERSION_FETCH_FAILED');const r=j.result;if(!r?.main_module||!r.modules?.length)throw Error('MODULES_MISSING');const meta=[];for(const m of r.modules){const b=Buffer.from(m.content_base64,'base64');const p=path.join('/tmp/modules',m.name);fs.mkdirSync(path.dirname(p),{recursive:true});fs.writeFileSync(p,b);meta.push({name:m.name,content_type:m.content_type,beforeSha:crypto.createHash('sha256').update(b).digest('hex')})}
          const css=`:root{--bg:#f4f7f5;--panel:#ffffff;--ink:#18211d;--muted:#66736c;--line:#dfe7e2;--green:#238a5a;--green2:#31b878;--soft:#eef7f2;--dark:#0d1210}*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}a{color:inherit}.site-header{background:#fff;border-bottom:1px solid var(--line)}.header-inner{max-width:1180px;margin:0 auto;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}.mark{width:58px;height:42px;border-radius:12px;background:#111714;color:#fff;display:grid;place-items:center;font-size:14px;font-weight:900;letter-spacing:.03em;box-shadow:0 6px 18px rgba(14,24,18,.12)}.mark b{color:var(--green2)}.brand-copy{display:flex;flex-direction:column;line-height:1.2}.brand-copy strong{font-size:15px;letter-spacing:.04em}.brand-copy small{margin-top:4px;color:var(--muted);font-size:11px}.header-note{font-size:12px;color:var(--muted);white-space:nowrap}.nav-wrap{background:#fff;border-bottom:1px solid var(--line);overflow:hidden}.nav{max-width:1180px;margin:0 auto;padding:0 18px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav a{flex:0 0 auto;padding:11px 10px 10px;text-decoration:none;color:#5b6861;font-size:12px;border-bottom:2px solid transparent}.nav a:hover{color:var(--green)}.nav a.active{color:#17201c;font-weight:800;border-bottom-color:var(--green2)}.hero{max-width:1180px;margin:26px auto 0;padding:0 22px}.hero-card{background:linear-gradient(135deg,#fff 0%,#f7fbf8 100%);border:1px solid var(--line);border-radius:18px;padding:30px 32px;box-shadow:0 12px 34px rgba(16,35,24,.06)}.eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--green);text-transform:uppercase}.dot{width:7px;height:7px;border-radius:50%;background:var(--green2);box-shadow:0 0 0 4px rgba(49,184,120,.12)}h1{margin:10px 0 8px;font-size:clamp(28px,4vw,42px);line-height:1.12;letter-spacing:-.025em}h2{margin:30px 0 10px;font-size:21px;line-height:1.25}h3{margin:18px 0 6px;font-size:16px}.hero-card>p{max-width:760px;margin:0;color:var(--muted)}.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.pill{display:inline-flex;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#536159;font-size:11px}main{max-width:1180px;margin:18px auto 40px;padding:0 22px}.article{background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 32px;box-shadow:0 10px 28px rgba(16,35,24,.045)}.article>h2:first-child{margin-top:0}.lead{font-size:16px;color:#445149}.article p,.article li{color:#46534c}.article a{color:#1f7850;text-decoration:none}.article a:hover{text-decoration:underline}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:14px 0 6px}.card{display:block;border:1px solid var(--line);border-radius:14px;padding:18px;background:#fff}.card-link{text-decoration:none;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}.card-link:hover{transform:translateY(-2px);border-color:#b8dcca;box-shadow:0 10px 24px rgba(28,82,53,.08);text-decoration:none}.card-kicker{font-size:10px;font-weight:900;letter-spacing:.09em;color:var(--green);text-transform:uppercase}.card h3{margin:6px 0 5px;color:#17201c}.card p{margin:0 0 10px;font-size:13px;line-height:1.55}.arrow{font-size:11px;font-weight:800;color:var(--green)}.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:14px 0 18px}.flow>div{min-height:72px;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:12px 10px;color:#34423a;font-size:12px;font-weight:700}.flow span{display:block;color:var(--green);font-size:17px;margin-bottom:3px}.callout{margin:20px 0;padding:16px 18px;border:1px solid #cfe4d8;border-left:4px solid var(--green2);border-radius:12px;background:#f3faf6;color:#34423a}.callout.warning{border-color:#eadfbe;border-left-color:#c8922b;background:#fffaf0}.callout.safe{border-color:#cfe4d8;border-left-color:var(--green2);background:#f3faf6}.meta-row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:30px;padding-top:16px;border-top:1px solid var(--line);color:#7a867f;font-size:11px}.site-footer{margin-top:34px;background:var(--dark);color:#c7d0ca;border-top:1px solid rgba(255,255,255,.08)}.footer-inner{max-width:1180px;margin:0 auto;padding:28px 22px 18px}.footer-top{display:flex;justify-content:space-between;gap:28px;align-items:flex-start}.footer-title{font-size:18px;font-weight:900;color:#f5f8f6;letter-spacing:.03em}.small{margin-top:5px;color:#8e9a92;font-size:12px}.footer-links{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px 14px;max-width:680px}.footer-links a{color:#aeb9b2;text-decoration:none;font-size:11px}.footer-links a:hover{color:var(--green2)}.footer-bottom{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-top:22px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);font-size:10px;color:#7f8c84}.footer-bottom a{color:#aeb9b2;text-decoration:none}@media(max-width:820px){.flow{grid-template-columns:repeat(3,minmax(0,1fr))}.footer-top{display:block}.footer-links{justify-content:flex-start;margin-top:16px}}@media(max-width:640px){body{font-size:14px}.header-inner,.hero,main,.footer-inner{padding-left:15px;padding-right:15px}.header-note{display:none}.hero{margin-top:16px}.hero-card,.article{padding:22px 18px;border-radius:14px}.grid{grid-template-columns:1fr}.flow{grid-template-columns:repeat(2,minmax(0,1fr))}.nav{padding:0 8px}.nav a{padding-left:8px;padding-right:8px}.footer-bottom{display:block}.footer-bottom span{display:block;margin-top:5px}}`;
          const main=r.main_module,p=path.join('/tmp/modules',main),orig=fs.readFileSync(p,'utf8');if(orig.includes('__B46_LEGAL_CSS_20261001__'))throw Error('PATCH_ALREADY_PRESENT');const footerStart=orig.indexOf('const __B46_FOOTER_HTML__='),footerEnd=orig.indexOf('const __B46_FOOTER_CSS__=',footerStart);if(footerStart<0||footerEnd<0)throw Error('FOOTER_ANCHORS_MISSING');let footerSlice=orig.slice(footerStart,footerEnd),sig=0,stat=0;footerSlice=footerSlice.replace('/signal.html',()=>{sig++;return '/index.html?view=signal'}).replace('/statistics.html',()=>{stat++;return '/index.html?view=statistics'});if(sig!==1||stat!==1)throw Error(`LINK_REPLACE_COUNT ${sig}/${stat}`);const cssDecl=`const __B46_LEGAL_CSS_20261001__=${JSON.stringify(css)};\n`;
          let patched=orig.slice(0,footerStart)+cssDecl+footerSlice+orig.slice(footerEnd);const routeAnchor="if(request.method==='GET'){if(url.pathname==='/ball46-footer.css')";const routeInsert="if(request.method==='GET'){if(url.pathname==='/legal.css')return __b46Text(__B46_LEGAL_CSS_20261001__,'text/css; charset=utf-8');if(url.pathname==='/ball46-footer.css')";let rc=0;patched=patched.replace(routeAnchor,()=>{rc++;return routeInsert});if(rc!==1)throw Error('LEGAL_CSS_ROUTE_ANCHOR_COUNT:'+rc);if(!patched.startsWith(orig.slice(0,footerStart)))throw Error('UNEXPECTED_PREFIX_CHANGE');if(!patched.endsWith(orig.slice(footerEnd).replace(routeAnchor,routeInsert)))throw Error('UNEXPECTED_SUFFIX_CHANGE');fs.writeFileSync(p,patched);const beforeSha=crypto.createHash('sha256').update(Buffer.from(orig)).digest('hex'),afterSha=crypto.createHash('sha256').update(Buffer.from(patched)).digest('hex');fs.writeFileSync('/tmp/main',main);fs.writeFileSync('/tmp/meta.json',JSON.stringify(meta));fs.writeFileSync('/tmp/main-after.sha',afterSha);fs.writeFileSync('/tmp/source-report.json',JSON.stringify({main,beforeSha,afterSha,plannedChanges:['serve /legal.css from scoped constant','Signals href -> /index.html?view=signal','Statistics href -> /index.html?view=statistics'],legalHtmlTemplatesChanged:false,backendCodeChanged:false,apiCodeChanged:false},null,2));console.log('SOURCE_PATCH_READY');
          NODE

      - name: Abort if Production changed during preparation
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"; BASE=$(cat /tmp/base-version)
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/recheck.json
          CUR=$(node -e "const j=require('/tmp/recheck.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))")
          [ "$CUR" = "$BASE" ] || { echo "ABORT_CONCURRENT_DEPLOY current=$CUR base=$BASE";exit 4; }

      - name: Upload exact modules with only planned source patch
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          node -e "const fs=require('fs');fs.writeFileSync('/tmp/upload-meta.json',JSON.stringify({main_module:fs.readFileSync('/tmp/main','utf8').trim()}))"
          mapfile -t args < <(node - <<'NODE'
          const fs=require('fs');for(const m of JSON.parse(fs.readFileSync('/tmp/meta.json','utf8')))console.log(`-F\n${m.name}=@/tmp/modules/${m.name};type=${m.content_type}`);
          NODE
          )
          CURL_ARGS=();i=0;while [ $i -lt ${#args[@]} ];do CURL_ARGS+=("${args[$i]}" "${args[$((i+1))]}");i=$((i+2));done
          curl -fsS -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/content" -H "$AUTH" -F 'metadata=</tmp/upload-meta.json;type=application/json' "${CURL_ARGS[@]}" -o /tmp/update.json
          node -e "const j=require('/tmp/update.json');if(j.success!==true)throw Error(JSON.stringify(j.errors||[]));console.log('UPLOAD_ACCEPTED')"

      - name: Verify exact source, legal styling, links, unchanged HTML/backend; rollback on failure
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"; BASE=$(cat /tmp/base-version)
          rollback(){ set +e;[ -s /tmp/our-version ]||return;OUR=$(cat /tmp/our-version);curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/current.json||return;CUR=$(node -e "const j=require('/tmp/current.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))");[ "$CUR" = "$OUR" ]||return;node -e "require('fs').writeFileSync('/tmp/rb.json',JSON.stringify({strategy:'percentage',versions:[{version_id:process.argv[1],percentage:100}],annotations:{'workers/message':'Rollback legal CSS/Footer source-only verification failure'}}))" "$BASE";curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments" -H "$AUTH" -H 'content-type: application/json' --data-binary @/tmp/rb.json -o /tmp/rb-resp.json||true;echo "ROLLBACK_TO:$BASE"; }
          trap 'rc=$?;rollback;exit $rc' ERR
          CAND='';for n in $(seq 1 15);do curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/d.json;CAND=$(node -e "const j=require('/tmp/d.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))");[ -n "$CAND" ]&&[ "$CAND" != "$BASE" ]&&break;sleep 2;done;[ -n "$CAND" ]&&[ "$CAND" != "$BASE" ];echo -n "$CAND" >/tmp/our-version
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/workers/$SCRIPT_NAME/versions/$CAND?include=modules" -H "$AUTH" -o /tmp/candidate.json
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),j=require('/tmp/candidate.json'),meta=require('/tmp/meta.json'),main=fs.readFileSync('/tmp/main','utf8').trim(),want=fs.readFileSync('/tmp/main-after.sha','utf8').trim();if(j.success!==true)throw Error('CANDIDATE_FETCH_FAILED');const a=new Map(j.result.modules.map(m=>[m.name,crypto.createHash('sha256').update(Buffer.from(m.content_base64,'base64')).digest('hex')]));for(const m of meta){const expected=m.name===main?want:m.beforeSha;if(a.get(m.name)!==expected)throw Error('MODULE_MISMATCH:'+m.name)}if(a.size!==meta.length)throw Error('MODULE_COUNT_CHANGED');console.log('SOURCE_IDENTITY_PASS');
          NODE
          visible=0;for n in $(seq 1 25);do K="${GITHUB_RUN_ID}-$n-$(date +%s%N)";curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/index.html?after=$K" -o /tmp/after/index.html;STATUS=$(curl -sS -L -o /tmp/after/legal.css -w '%{http_code}' -D /tmp/after/legal.headers "$BALL46_URL/legal.css?after=$K");if grep -Fq 'href="/index.html?view=signal"' /tmp/after/index.html && grep -Fq 'href="/index.html?view=statistics"' /tmp/after/index.html && [ "$STATUS" = 200 ] && grep -qi '^content-type: text/css' /tmp/after/legal.headers;then visible=1;break;fi;sleep 2;done;[ "$visible" = 1 ]||{ echo EDGE_VERIFY_TIMEOUT;false; }
          pages='information about user-guide methodology privacy terms disclaimer affiliate-disclosure responsible-gambling cookies contact';for p in $pages;do curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/$p.html?after=${GITHUB_RUN_ID}-$p-$(date +%s%N)" -o "/tmp/after/$p.html";done
          curl -fsS "$BALL46_URL/api/engine/health?after=${GITHUB_RUN_ID}" -o /tmp/after/e.json;curl -fsS "$BALL46_URL/api/full-market/health?after=${GITHUB_RUN_ID}" -o /tmp/after/f.json;curl -fsS "$BALL46_URL/api/engine/statistics?after=${GITHUB_RUN_ID}" -o /tmp/after/s.json
          node - <<'NODE'
