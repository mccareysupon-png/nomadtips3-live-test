name: VERIFY Ball46 restored after Footer V5 20261001

on:
  push:
    branches: [ops/ball46-footer-links-20261001]
    paths: ['.github/workflows/rollback-ball46-footer-v5-20261001.yml']

permissions:
  contents: read

env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  RESTORE_VERSION: d54d0bae-0bd7-4a36-beed-052aa69a3a5e
  BALL46_URL: https://ball46.com

jobs:
  verify-restored:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify restored version, edge, information page styles and backend
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/deploy.json
          CURRENT=$(node -e "const j=require('/tmp/deploy.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))")
          [ "$CURRENT" = "$RESTORE_VERSION" ] || { echo "PRODUCTION_MOVED:$CURRENT"; exit 2; }
          echo "RESTORED_VERSION_ACTIVE:$CURRENT"
          edge=0
          for n in $(seq 1 30); do
            K="${GITHUB_RUN_ID}-$n-$(date +%s%N)"
            curl -fsS -L -D /tmp/info.headers -H 'Cache-Control: no-cache' "$BALL46_URL/information.html?verifyrestore=$K" -o /tmp/info.html
            curl -fsS -L -D /tmp/index.headers -H 'Cache-Control: no-cache' "$BALL46_URL/index.html?verifyrestore=$K" -o /tmp/index.html
            if ! grep -qi '^x-ball46-footer-revision: footer-links-v5-20261001' /tmp/info.headers && ! grep -qi '^x-ball46-footer-revision: footer-links-v5-20261001' /tmp/index.headers; then edge=1; break; fi
            sleep 2
          done
          [ "$edge" = 1 ] || { echo EDGE_NOT_RESTORED; exit 3; }
          echo EDGE_RESTORED
          node - <<'NODE'
          const fs=require('fs');const h=fs.readFileSync('/tmp/info.html','utf8');
          const links=[...h.matchAll(/<link\b[^>]*href=["']([^"']+)["'][^>]*>/gi)].map(m=>m[1]);
          console.log('INFO_BYTES',Buffer.byteLength(h));
          console.log('INFO_LINKS',JSON.stringify(links));
          console.log('INFO_HAS_INLINE_STYLE',/<style\b/i.test(h));
          console.log('INFO_HAS_FOOTER',/b46-site-footer-v1/i.test(h));
          console.log('INFO_HEAD',h.slice(0,4500).replace(/\n/g,' '));
          NODE
          curl -fsS "$BALL46_URL/api/engine/health?verifyrestore=${GITHUB_RUN_ID}" -o /tmp/e.json
          curl -fsS "$BALL46_URL/api/full-market/health?verifyrestore=${GITHUB_RUN_ID}" -o /tmp/f.json
          curl -fsS "$BALL46_URL/api/engine/statistics?verifyrestore=${GITHUB_RUN_ID}" -o /tmp/s.json
          node - <<'NODE'
          const e=require('/tmp/e.json'),f=require('/tmp/f.json'),s=require('/tmp/s.json');if(e.ok!==true||f.ok!==true||s.ok!==true)throw Error('BACKEND_NOT_OK');console.log('BACKEND_OK',e.version,f.version,s.settlementRevision);
          NODE
