name: DEPLOY Ball46 Footer brand logo only 20261001

on:
  push:
    branches: [ops/ball46-footer-links-20261001]
    paths: ['.github/workflows/rollback-ball46-footer-v5-20261001.yml']

permissions:
  contents: write

env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  BALL46_URL: https://ball46.com

jobs:
  footer-brand-logo:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ball46-footer-links-20261001
          fetch-depth: 1

      - name: Lock exact current Production and capture Footer/UI baseline
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          mkdir -p /tmp/before /tmp/after /tmp/modules audit
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=3" -H "$AUTH" -o /tmp/deploy-before.json
          CUR=$(node -e "const j=require('/tmp/deploy-before.json');const d=j.result?.deployments?.[0];if(!d||d.versions?.length!==1||Number(d.versions[0].percentage)!==100)process.exit(2);process.stdout.write(String(d.versions[0].version_id||''))")
          [ -n "$CUR" ] || { echo NO_ACTIVE_VERSION; exit 2; }
          echo -n "$CUR" >/tmp/base-version
          K="${GITHUB_RUN_ID}-$(date +%s%N)"
          curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/index.html?brandbefore=$K" -o /tmp/before/index.html
          curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/legal.css?brandbefore=$K" -o /tmp/before/legal.css
          curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/ball46-footer.css?brandbefore=$K" -o /tmp/before/footer.css
          pages='information about user-guide methodology privacy terms disclaimer affiliate-disclosure responsible-gambling cookies contact'
          for p in $pages; do curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/$p.html?brandbefore=$K-$p" -o "/tmp/before/$p.html"; done
          curl -fsS "$BALL46_URL/api/engine/health?brandbefore=$K" -o /tmp/before/e.json
          curl -fsS "$BALL46_URL/api/full-market/health?brandbefore=$K" -o /tmp/before/f.json
          curl -fsS "$BALL46_URL/api/engine/statistics?brandbefore=$K" -o /tmp/before/s.json
          node - <<'NODE'
          const fs=require('fs');
          const idx=fs.readFileSync('/tmp/before/index.html','utf8');
          const foot=idx.match(/<footer\b[^>]*id=["']b46-site-footer-v1["'][\s\S]*?<\/footer>/i);
          if(!foot) throw Error('GLOBAL_FOOTER_MISSING');
          if(!foot[0].includes('/index.html?view=signal')||!foot[0].includes('/index.html?view=statistics')) throw Error('CURRENT_FOOTER_ROUTES_NOT_EXPECTED');
          const e=require('/tmp/before/e.json'),f=require('/tmp/before/f.json'),s=require('/tmp/before/s.json');
          if(e.ok!==true||f.ok!==true||s.ok!==true) throw Error('BACKEND_NOT_OK_BEFORE');
          fs.writeFileSync('/tmp/backend-before.json',JSON.stringify({engine:e.version,fullMarket:f.version,settlementRevision:s.settlementRevision}));
          fs.writeFileSync('/tmp/footer-before.html',foot[0]);
          console.log('BASE_LOCKED',fs.readFileSync('/tmp/base-version','utf8'));
          NODE

      - name: Clone exact active Worker and patch only Footer logo markup/CSS
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"; BASE=$(cat /tmp/base-version)
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/workers/$SCRIPT_NAME/versions/$BASE?include=modules" -H "$AUTH" -o /tmp/version.json
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const j=require('/tmp/version.json'); if(j.success!==true) throw Error('VERSION_FETCH_FAILED');
          const r=j.result; if(!r?.main_module||!r.modules?.length) throw Error('MODULES_MISSING');
          const meta=[];
          for(const m of r.modules){const b=Buffer.from(m.content_base64,'base64');const p=path.join('/tmp/modules',m.name);fs.mkdirSync(path.dirname(p),{recursive:true});fs.writeFileSync(p,b);meta.push({name:m.name,content_type:m.content_type,beforeSha:crypto.createHash('sha256').update(b).digest('hex')});}
          const main=r.main_module,p=path.join('/tmp/modules',main),orig=fs.readFileSync(p,'utf8');
          if(!orig.includes('__B46_LEGAL_CSS_20261001__')) throw Error('LEGAL_CSS_BASE_MARKER_MISSING');
          if(orig.includes('B46_FOOTER_BRAND_LOGO_20261001')) throw Error('BRAND_PATCH_ALREADY_PRESENT');

          const legalStart=orig.indexOf('const __B46_LEGAL_PAGES__=');
          const legalEnd=orig.indexOf('const __B46_LEGAL_CSS_20261001__=',legalStart);
          const footerStart=orig.indexOf('const __B46_FOOTER_HTML__=',legalEnd);
          const footerCssStart=orig.indexOf('const __B46_FOOTER_CSS__=',footerStart);
          const footerCssEnd=orig.indexOf('function __b46Text',footerCssStart);
          if([legalStart,legalEnd,footerStart,footerCssStart,footerCssEnd].some(x=>x<0)) throw Error('SOURCE_ANCHORS_MISSING');

          let legalSlice=orig.slice(legalStart,legalEnd);
          const oldLegal='class=\\"footer-title\\">BALL46</div>';
          const newLegal='class=\\"footer-title\\">ball<span>46</span></div>';
          const legalCount=legalSlice.split(oldLegal).length-1;
          if(legalCount!==11) throw Error('LEGAL_FOOTER_BRAND_COUNT:'+legalCount);
          legalSlice=legalSlice.split(oldLegal).join(newLegal);

          let footerHtmlSlice=orig.slice(footerStart,footerCssStart);
          const oldGlobal='BALL<span>46</span>';
          const newGlobal='ball<span>46</span>';
          const globalCount=footerHtmlSlice.split(oldGlobal).length-1;
          if(globalCount!==1) throw Error('GLOBAL_FOOTER_BRAND_COUNT:'+globalCount);
          footerHtmlSlice=footerHtmlSlice.replace(oldGlobal,newGlobal);

          function parseConst(src,name,startAt){
            const marker='const '+name+'='; const s=src.indexOf(marker,startAt); if(s<0)throw Error('CONST_MISSING:'+name);
            const valStart=s+marker.length; const semi=src.indexOf(';',valStart); if(semi<0)throw Error('CONST_END_MISSING:'+name);
            return {s,valStart,semi,value:JSON.parse(src.slice(valStart,semi))};
          }
          const lc=parseConst(orig,'__B46_LEGAL_CSS_20261001__',legalEnd);
          const fc=parseConst(orig,'__B46_FOOTER_CSS__',footerCssStart);
          const legalAdd='/* B46_FOOTER_BRAND_LOGO_20261001 */.footer-title{font-family:"Arial Black",Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:900;letter-spacing:-.055em;text-transform:none}.footer-title span{color:var(--green2)}@media(max-width:640px){.footer-title{width:76px;height:76px;border-radius:19px;background:#000;border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;line-height:.78;letter-spacing:-.06em;overflow:hidden}.footer-title span{display:block;font-size:42px;line-height:.82;letter-spacing:-.07em;margin-top:1px}}';
          const footerAdd='/* B46_FOOTER_BRAND_LOGO_20261001 */#b46-site-footer-v1 .b46f-brand{font-family:"Arial Black",Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:900;letter-spacing:-.055em;text-transform:none}#b46-site-footer-v1 .b46f-brand span{color:#31b878}@media(max-width:560px){#b46-site-footer-v1 .b46f-brand{width:76px;height:76px;border-radius:19px;background:#000;border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;line-height:.78;letter-spacing:-.06em;overflow:hidden}#b46-site-footer-v1 .b46f-brand span{display:block;font-size:42px;line-height:.82;letter-spacing:-.07em;margin-top:1px}}';
          if(lc.value.includes('B46_FOOTER_BRAND_LOGO_20261001')||fc.value.includes('B46_FOOTER_BRAND_LOGO_20261001')) throw Error('CSS_PATCH_ALREADY_PRESENT');
          const newLegalDecl='const __B46_LEGAL_CSS_20261001__='+JSON.stringify(lc.value+legalAdd)+';';
          const newFooterCssDecl='const __B46_FOOTER_CSS__='+JSON.stringify(fc.value+footerAdd)+';';

          let patched=orig;
          patched=patched.slice(0,legalStart)+legalSlice+patched.slice(legalEnd);
          const lc2=parseConst(patched,'__B46_LEGAL_CSS_20261001__',legalStart);
          patched=patched.slice(0,lc2.s)+newLegalDecl+patched.slice(lc2.semi+1);
          const fh2=patched.indexOf('const __B46_FOOTER_HTML__=',lc2.s);
          const fc2=patched.indexOf('const __B46_FOOTER_CSS__=',fh2);
          patched=patched.slice(0,fh2)+footerHtmlSlice+patched.slice(fc2);
          const fc3=parseConst(patched,'__B46_FOOTER_CSS__',fh2);
          patched=patched.slice(0,fc3.s)+newFooterCssDecl+patched.slice(fc3.semi+1);

          if(!patched.includes('/index.html?view=signal')||!patched.includes('/index.html?view=statistics')) throw Error('FOOTER_ROUTES_LOST');
          fs.writeFileSync(p,patched);
          const beforeSha=crypto.createHash('sha256').update(Buffer.from(orig)).digest('hex');
          const afterSha=crypto.createHash('sha256').update(Buffer.from(patched)).digest('hex');
          fs.writeFileSync('/tmp/main',main);fs.writeFileSync('/tmp/meta.json',JSON.stringify(meta));fs.writeFileSync('/tmp/main-after.sha',afterSha);
          fs.writeFileSync('/tmp/source-report.json',JSON.stringify({main,beforeSha,afterSha,scope:'Footer brand markup + scoped Footer CSS only',globalBrandChanges:1,legalFooterBrandChanges:11,legalCssAdditive:true,globalFooterCssAdditive:true,jsFetchAdded:false,apiCodeChanged:false,oddsCodeChanged:false},null,2));
          console.log('BRAND_PATCH_READY');
          NODE

      - name: Abort if Production moved during preparation
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"; BASE=$(cat /tmp/base-version)
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/recheck.json
          CUR=$(node -e "const j=require('/tmp/recheck.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))")
          [ "$CUR" = "$BASE" ] || { echo "ABORT_CONCURRENT_DEPLOY current=$CUR base=$BASE"; exit 4; }

      - name: Upload exact modules with Footer-logo-only patch
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          node -e "const fs=require('fs');fs.writeFileSync('/tmp/upload-meta.json',JSON.stringify({main_module:fs.readFileSync('/tmp/main','utf8').trim()}))"
          mapfile -t args < <(node - <<'NODE'
          const fs=require('fs');for(const m of JSON.parse(fs.readFileSync('/tmp/meta.json','utf8')))console.log(`-F\n${m.name}=@/tmp/modules/${m.name};type=${m.content_type}`);
          NODE
          )
          CURL_ARGS=();i=0;while [ $i -lt ${#args[@]} ];do CURL_ARGS+=("${args[$i]}" "${args[$((i+1))]}");i=$((i+2));done
          curl -fsS -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/content" -H "$AUTH" -F 'metadata=</tmp/upload-meta.json;type=application/json' "${CURL_ARGS[@]}" -o /tmp/update.json
          node -e "const j=require('/tmp/update.json');if(j.success!==true)throw Error(JSON.stringify(j.errors||[]));console.log('UPLOAD_ACCEPTED')"

      - name: Verify logo-only diff, pages, CSS and backend; rollback on failure
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"; BASE=$(cat /tmp/base-version)
          rollback(){ set +e;[ -s /tmp/our-version ]||return;OUR=$(cat /tmp/our-version);curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/current.json||return;CUR=$(node -e "const j=require('/tmp/current.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))");[ "$CUR" = "$OUR" ]||return;node -e "require('fs').writeFileSync('/tmp/rb.json',JSON.stringify({strategy:'percentage',versions:[{version_id:process.argv[1],percentage:100}],annotations:{'workers/message':'Rollback Footer brand logo verification failure'}}))" "$BASE";curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments" -H "$AUTH" -H 'content-type: application/json' --data-binary @/tmp/rb.json -o /tmp/rb-resp.json||true;echo "ROLLBACK_TO:$BASE"; }
          trap 'rc=$?;rollback;exit $rc' ERR
          CAND='';for n in $(seq 1 15);do curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/d.json;CAND=$(node -e "const j=require('/tmp/d.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))");[ -n "$CAND" ]&&[ "$CAND" != "$BASE" ]&&break;sleep 2;done;[ -n "$CAND" ]&&[ "$CAND" != "$BASE" ];echo -n "$CAND" >/tmp/our-version
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/workers/$SCRIPT_NAME/versions/$CAND?include=modules" -H "$AUTH" -o /tmp/candidate.json
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),j=require('/tmp/candidate.json'),meta=require('/tmp/meta.json'),main=fs.readFileSync('/tmp/main','utf8').trim(),want=fs.readFileSync('/tmp/main-after.sha','utf8').trim();if(j.success!==true)throw Error('CANDIDATE_FETCH_FAILED');const a=new Map(j.result.modules.map(m=>[m.name,crypto.createHash('sha256').update(Buffer.from(m.content_base64,'base64')).digest('hex')]));for(const m of meta){const expected=m.name===main?want:m.beforeSha;if(a.get(m.name)!==expected)throw Error('MODULE_MISMATCH:'+m.name)}if(a.size!==meta.length)throw Error('MODULE_COUNT_CHANGED');console.log('SOURCE_IDENTITY_PASS');
          NODE
          visible=0;for n in $(seq 1 25);do K="${GITHUB_RUN_ID}-$n-$(date +%s%N)";curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/index.html?brandafter=$K" -o /tmp/after/index.html;curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/information.html?brandafter=$K" -o /tmp/after/information.html;curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/legal.css?brandafter=$K" -o /tmp/after/legal.css;curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/ball46-footer.css?brandafter=$K" -o /tmp/after/footer.css;if grep -Fq 'ball<span>46</span>' /tmp/after/index.html && grep -Fq 'footer-title">ball<span>46</span>' /tmp/after/information.html && grep -Fq 'B46_FOOTER_BRAND_LOGO_20261001' /tmp/after/legal.css && grep -Fq 'B46_FOOTER_BRAND_LOGO_20261001' /tmp/after/footer.css;then visible=1;break;fi;sleep 2;done;[ "$visible" = 1 ]||{ echo EDGE_VERIFY_TIMEOUT;false; }
          pages='information about user-guide methodology privacy terms disclaimer affiliate-disclosure responsible-gambling cookies contact';for p in $pages;do curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/$p.html?brandafter=${GITHUB_RUN_ID}-$p-$(date +%s%N)" -o "/tmp/after/$p.html";done
          curl -fsS "$BALL46_URL/api/engine/health?brandafter=${GITHUB_RUN_ID}" -o /tmp/after/e.json;curl -fsS "$BALL46_URL/api/full-market/health?brandafter=${GITHUB_RUN_ID}" -o /tmp/after/f.json;curl -fsS "$BALL46_URL/api/engine/statistics?brandafter=${GITHUB_RUN_ID}" -o /tmp/after/s.json
          node - <<'NODE'
          const fs=require('fs');
          const b=require('/tmp/backend-before.json'),e=require('/tmp/after/e.json'),f=require('/tmp/after/f.json'),s=require('/tmp/after/s.json'),a={engine:e.version,fullMarket:f.version,settlementRevision:s.settlementRevision};if(JSON.stringify(a)!==JSON.stringify(b))throw Error('BACKEND_CHANGED');
          const beforeFoot=fs.readFileSync('/tmp/footer-before.html','utf8');const idx=fs.readFileSync('/tmp/after/index.html','utf8');const aft=idx.match(/<footer\b[^>]*id=["']b46-site-footer-v1["'][\s\S]*?<\/footer>/i);if(!aft)throw Error('GLOBAL_FOOTER_MISSING_AFTER');const normalized=aft[0].replace('ball<span>46</span>','BALL<span>46</span>');if(normalized!==beforeFoot)throw Error('GLOBAL_FOOTER_CHANGED_OUTSIDE_BRAND');if(!aft[0].includes('/index.html?view=signal')||!aft[0].includes('/index.html?view=statistics'))throw Error('FOOTER_LINKS_CHANGED');
          const pages='information about user-guide methodology privacy terms disclaimer affiliate-disclosure responsible-gambling cookies contact'.split(' ');for(const p of pages){const before=fs.readFileSync('/tmp/before/'+p+'.html','utf8');const after=fs.readFileSync('/tmp/after/'+p+'.html','utf8');const norm=after.replace('class="footer-title">ball<span>46</span></div>','class="footer-title">BALL46</div>');if(norm!==before)throw Error('LEGAL_PAGE_CHANGED_OUTSIDE_FOOTER_BRAND:'+p)}
          const legalBefore=fs.readFileSync('/tmp/before/legal.css','utf8'),legalAfter=fs.readFileSync('/tmp/after/legal.css','utf8'),footerBefore=fs.readFileSync('/tmp/before/footer.css','utf8'),footerAfter=fs.readFileSync('/tmp/after/footer.css','utf8');const lm='/* B46_FOOTER_BRAND_LOGO_20261001 */',fm=lm;const li=legalAfter.indexOf(lm),fi=footerAfter.indexOf(fm);if(li<0||fi<0)throw Error('LOGO_CSS_MARKER_MISSING');if(legalAfter.slice(0,li)!==legalBefore)throw Error('LEGAL_CSS_CHANGED_OUTSIDE_APPEND');if(footerAfter.slice(0,fi)!==footerBefore)throw Error('FOOTER_CSS_CHANGED_OUTSIDE_APPEND');
          const report={completedAt:new Date().toISOString(),baseVersion:fs.readFileSync('/tmp/base-version','utf8'),deployedVersion:fs.readFileSync('/tmp/our-version','utf8'),scope:'Footer brand logo only',desktop:'ball white + 46 green',mobile:'stacked rounded black icon via CSS',noImageRequest:true,noJavascriptAdded:true,noFetchAdded:true,backendUnchanged:true,source:require('/tmp/source-report.json'),backend:a};fs.writeFileSync('audit/ball46-footer-brand-logo-20261001.json',JSON.stringify(report,null,2)+'\n');console.log('VERIFY_PASS',report);
          NODE
          OUR=$(cat /tmp/our-version);curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/final.json;FINAL=$(node -e "const j=require('/tmp/final.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))");[ "$FINAL" = "$OUR" ]||{ echo "PRODUCTION_MOVED_AFTER_VERIFY:$FINAL";false; };trap - ERR

      - name: Save verified deployment report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git pull --rebase origin ops/ball46-footer-links-20261001;git add audit/ball46-footer-brand-logo-20261001.json;git commit -m 'verify(ball46): Footer brand logo-only deploy passed';git push origin HEAD:ops/ball46-footer-links-20261001
