name: BALL46 current Engine343 source read only
on:
  workflow_dispatch:
  push:
    branches:
      - prep/goaloo-final-result-20261017
    paths:
      - integrations/result-provider-router/audit-active-source.mjs
      - .github/workflows/ball46-engine343-source-readonly.yml
permissions:
  contents: read
jobs:
  audit-source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read current Worker code fingerprint only, no deploy
        run: node integrations/result-provider-router/audit-active-source.mjs
      - name: Upload sanitized fingerprints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine343-active-source-fingerprint
          path: engine343-active-source-audit.json
          retention-days: 7
          if-no-files-found: warn
