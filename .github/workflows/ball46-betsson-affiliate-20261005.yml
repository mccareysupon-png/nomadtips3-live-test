name: Ball46 Betsson affiliate surgical deploy
on:
  push:
    branches: [ops/ball46-betsson-affiliate-20261005]
    paths: [.github/workflows/ball46-betsson-affiliate-20261005.yml]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Lock current production, wrap one asset route, deploy and verify
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT" && test -n "$CF_TOKEN"
          ROOT=/tmp/b46-betsson; rm -rf "$ROOT"; mkdir -p "$ROOT"
          python3 - <<'PY'
          import os,json,base64,urllib.request,pathlib,hashlib
          r=pathlib.Path('/tmp/b46-betsson'); a=os.environ['CF_ACCOUNT']; t=os.environ['CF_TOKEN']; script='ball46-production'; api=f'https://api.cloudflare.com/client/v4/accounts/{a}'; h={'Authorization':f'Bearer {t}','Accept':'application/json'}
          def get(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=30) as x: j=json.load(x)
            if isinstance(j,dict) and j.get('success') is False: raise SystemExit('CF_API_FAIL:'+json.dumps(j)[:500])
            return j
          d=get(f'{api}/workers/scripts/{script}/deployments')['result']['deployments'][0]; vs=d.get('versions') or []; active=[v for v in vs if float(v.get('percentage',0))>=99.999]
          if len(active)!=1: raise SystemExit('ACTIVE_VERSION_AMBIGUOUS')
          vid=str(active[0]['version_id']); v=get(f'{api}/workers/workers/{script}/versions/{vid}?include=modules')['result']; mods=v.get('modules') or []; main=[m for m in mods if m.get('name')=='index.js' and m.get('content_base64')]
          if len(main)!=1: raise SystemExit('INDEX_MODULE_MISSING:'+repr([m.get('name') for m in mods]))
          src=base64.b64decode(main[0]['content_base64']).decode();
          if 'export default' not in src: raise SystemExit('DEFAULT_EXPORT_MISSING')
          bindings=v.get('bindings') or []; names={b.get('name'):b for b in bindings}
          exp={'ASSETS':('assets',None),'ENGINE':('service','nomadtips3-engine-343'),'FULL_MARKET':('service','nomadtips3-full-market-343-ball46'),'HUB':('service','nomadtips3-5usd-hub-343')}
          for n,(typ,svc) in exp.items():
            b=names.get(n) or {}
            if b.get('type')!=typ or (svc and b.get('service')!=svc): raise SystemExit('BINDING_MOVED:'+n+':'+repr(b))
          if v.get('compatibility_date')!='2026-09-09' or (v.get('compatibility_flags') or []): raise SystemExit('COMPAT_MOVED')
          ac=(v.get('assets') or {}).get('config') or {}; expected={'base_path':'/','html_handling':'none','not_found_handling':'none','run_worker_first':True}
          if {k:ac.get(k) for k in expected}!=expected: raise SystemExit('ASSET_CONFIG_MOVED:'+repr(ac))
          r.joinpath('pre-version').write_text(vid); r.joinpath('original.js').write_text(src)
          logo='https://raw.githubusercontent.com/mccareysupon-png/nomadtips3-live-test/ops/ball46-betsson-affiliate-20261005/assets/affiliate/betsson-logo.png'
          aff='https://record.betsson.com/_o1mNd-AGmETmaNxVyOS5PWNd7ZgqdRLk/1/'
          wrapper=f'''import original from './original.js';\nconst AFF={json.dumps(aff)}; const LOGO={json.dumps(logo)};\nfunction addMap(s,name,line){{const a=s.indexOf(`const ${{name}}=Object.freeze({{`);if(a<0)throw Error(name+'_MAP_MISSING');const z=s.indexOf('\n}});',a);if(z<0)throw Error(name+'_MAP_END_MISSING');const body=s.slice(a,z);if(body.includes("'betsson'"))return s;const comma=/,\\s*$/.test(body)?'':',';return s.slice(0,z)+comma+`\n  'betsson':${{JSON.stringify(line)}}`+s.slice(z)}}\nfunction patch(s){{if(s.includes('B46_BETSSON_AFFILIATE_20261005'))return s;s=addMap(s,'AFFILIATE_URLS',AFF);s=addMap(s,'BOOK_LOGO_URLS',LOGO);if(!s.includes("['betsson','Betsson']")){{const n="['1xbet','1xBet']";if(!s.includes(n))throw Error('BOOK_REGISTRY_ANCHOR_MISSING');s=s.replace(n,n+",['betsson','Betsson']")}}return `/* B46_BETSSON_AFFILIATE_20261005 */\n`+s}}\nexport default {{async fetch(request,env,ctx){{const u=new URL(request.url);if(u.pathname==='/full-market-bookmaker-343.js'){{const q=new Request(request);const res=await env.ASSETS.fetch(q);if(!res.ok)return res;let text=await res.text();text=patch(text);const h=new Headers(res.headers);h.set('cache-control','no-store, no-cache, must-revalidate');h.set('content-type','application/javascript; charset=utf-8');return new Response(text,{{status:res.status,headers:h}})}}return original.fetch(request,env,ctx)}},async scheduled(controller,env,ctx){{if(typeof original.scheduled==='function')return original.scheduled(controller,env,ctx)}}}};\n'''
          r.joinpath('index.js').write_text(wrapper)
          meta={'main_module':'index.js','keep_assets':True,'compatibility_date':v.get('compatibility_date'),'compatibility_flags':v.get('compatibility_flags') or [],'bindings':bindings}
          for k in ('observability','placement','limits','tail_consumers','logpush'):
            if v.get(k) is not None: meta[k]=v[k]
          r.joinpath('metadata.json').write_text(json.dumps(meta,separators=(',',':')))
          print('LOCK_OK',vid,'runtime_sha',hashlib.sha256(src.encode()).hexdigest())
          PY
          PRE=$(cat "$ROOT/pre-version")
          rollback(){ npx --yes wrangler@4.92.0 versions deploy "$PRE@100%" --name ball46-production -y --message "rollback Betsson affiliate $GITHUB_RUN_ID" || true; }
          trap 'rollback' ERR
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/ball46-production"
          curl -fsS -X PUT "$API" -H "Authorization: Bearer $CF_TOKEN" -F 'metadata=@/tmp/b46-betsson/metadata.json;type=application/json' -F 'index.js=@/tmp/b46-betsson/index.js;type=application/javascript+module' -F 'original.js=@/tmp/b46-betsson/original.js;type=application/javascript+module' > "$ROOT/upload.json"
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/b46-betsson/upload.json'))
          if j.get('success') is not True: raise SystemExit('UPLOAD_FAIL:'+json.dumps(j)[:1000])
          print('UPLOAD_OK')
          PY
          sleep 4
          nonce="$GITHUB_RUN_ID-$(date +%s)"
          curl -fsS -L --retry 4 --max-time 30 "https://ball46-production.mccarey-supon.workers.dev/full-market-bookmaker-343.js?betsson=$nonce" -o "$ROOT/live.js"
          grep -Fq 'B46_BETSSON_AFFILIATE_20261005' "$ROOT/live.js"
          grep -Fq "'betsson':'https://record.betsson.com/_o1mNd-AGmETmaNxVyOS5PWNd7ZgqdRLk/1/'" "$ROOT/live.js"
          grep -Fq "['betsson','Betsson']" "$ROOT/live.js"
          grep -Fq 'betsson-logo.png' "$ROOT/live.js"
          curl -fsSI -L --retry 3 --max-time 30 'https://raw.githubusercontent.com/mccareysupon-png/nomadtips3-live-test/ops/ball46-betsson-affiliate-20261005/assets/affiliate/betsson-logo.png' >/dev/null
          for ep in board signals statistics; do curl -fsS -L --retry 4 --max-time 30 "https://www.ball46.com/api/engine/$ep?betsson=$nonce" -o "$ROOT/$ep.json"; done
          node - <<'NODE'
          const fs=require('fs');for(const n of ['board','signals','statistics']){const j=JSON.parse(fs.readFileSync('/tmp/b46-betsson/'+n+'.json'));if(j?.ok!==true)throw Error(n+'_NOT_OK')}console.log('HEALTH_OK')
          NODE
          trap - ERR
          echo BETSSON_PRODUCTION_VERIFY_PASS