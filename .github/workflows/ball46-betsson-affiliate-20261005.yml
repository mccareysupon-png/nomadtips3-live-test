name: Ball46 Betsson production deploy final
on:
  push:
    branches:
      - ops/ball46-betsson-affiliate-20261005
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Add Betsson affiliate URL and logo to current production
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          p='.github/scripts/ball46_betsson_affiliate_20261005.py'
          s=open(p).read()
          old='if "[\'betsson\',\'Betsson\']" in text or \'B46_BETSSON_AFFILIATE_20261005\' in text:'
          new='if AFF in text and LOGO in text and \'B46_BETSSON_AFFILIATE_20261005\' in text:'
          if old not in s: raise SystemExit('LOCAL_GUARD_ANCHOR_MISSING')
          open(p,'w').write(s.replace(old,new,1))
          PY
          python3 .github/scripts/ball46_betsson_affiliate_20261005.py