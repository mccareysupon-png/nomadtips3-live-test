name: Ball46 Betsson production deploy
on:
  push:
    branches:
      - ops/ball46-betsson-affiliate-20261005
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Betsson affiliate surgically
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT"
          test -n "$CF_TOKEN"
          python3 .github/scripts/ball46_betsson_affiliate_20261005.py