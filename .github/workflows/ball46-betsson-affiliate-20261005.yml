name: Ball46 Betsson mapping inspect
on:
  push:
    branches:
      - ops/ball46-betsson-affiliate-20261005
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect live renderer mapping
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --retry 4 --max-time 30 "https://ball46-production.mccarey-supon.workers.dev/full-market-bookmaker-343.js?inspect=$GITHUB_RUN_ID" -o /tmp/fmb.js
          python3 - <<'PY'
          s=open('/tmp/fmb.js').read()
          for key in ['AFFILIATE_URLS','BOOK_LOGO_URLS','betsson','Betsson','record.betsson.com','raw.githubusercontent.com']:
              print('FLAG',key,key in s)
          for needle in ['AFFILIATE_URLS','BOOK_LOGO_URLS','betsson']:
              i=s.lower().find(needle.lower())
              if i>=0: print('SNIP',needle,repr(s[max(0,i-250):i+700]))
          PY