name: Restore Exact Ball46 0809 Production 20260923

on:
  push:
    branches: [work/ball46-event-flow-bars-20260922]
    paths:
      - '.github/workflows/rollback-ball46-logo-worker-version-20260923.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  BALL46_PUBLIC: https://www.ball46.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TARGET_VERSION: 5b0d75cc-e856-47f8-ab32-34c8420e94b6

jobs:
  rollback-exact-0809:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Confirm backend before rollback
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?pre0809=${GITHUB_RUN_ID}" -o /tmp/board.before.json
          node - <<'NODE'
          const fs=require('fs'); const b=JSON.parse(fs.readFileSync('/tmp/board.before.json'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures)) throw Error('PRE_BOARD_UNHEALTHY');
          console.log('PRE_OK',{fixtures:b.fixtures.length});
          NODE

      - name: Cloudflare rollback exact acknowledged 0809 version
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.136.3 rollback "$TARGET_VERSION" --message "Restore exact Ball46 state acknowledged good at 08:09 ICT before logo work" --config wrangler.ball46.jsonc

      - name: Verify exact morning UI and backend
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 20); do
            if curl -fsS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 "$BALL46_WORKER/index.html?verify0809=${GITHUB_RUN_ID}-${n}" -o /tmp/index.html \
              && grep -Fq 'data-workspace-panel="live"' /tmp/index.html \
              && grep -Fq 'data-workspace-panel="signal"' /tmp/index.html \
              && grep -Fq 'data-workspace-panel="statistics"' /tmp/index.html; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo 'MORNING_INDEX_NOT_AVAILABLE'; exit 1; }
          ! grep -Fq '343-team-palette-20260923' /tmp/index.html || { echo 'TODAY_PALETTE_PRESENT'; exit 1; }
          ! grep -Fq 'logo-size-343.css' /tmp/index.html || { echo 'TODAY_LOGO_PRESENT'; exit 1; }
          ! grep -Fq 'data-ball46-favicon="20260923-repair"' /tmp/index.html || { echo 'TODAY_FAVICON_REPAIR_PRESENT'; exit 1; }
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/dashboard-v2-tune.css?verify0809css=${GITHUB_RUN_ID}" -o /tmp/tune.css
          ! grep -Fq 'BALL46 LIVE MINUTE WHITE 20260923' /tmp/tune.css || { echo 'TODAY_MINUTE_OVERRIDE_PRESENT'; exit 1; }
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?post0809=${GITHUB_RUN_ID}" -o /tmp/board.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?post0809=${GITHUB_RUN_ID}" -o /tmp/signals.json
          node - <<'NODE'
          const fs=require('fs'); const b=JSON.parse(fs.readFileSync('/tmp/board.json')); const s=JSON.parse(fs.readFileSync('/tmp/signals.json'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures)) throw Error('POST_BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals)) throw Error('POST_SIGNALS_UNHEALTHY');
          console.log('EXACT_0809_RESTORE_OK',{fixtures:b.fixtures.length,signals:s.signals.length});
          NODE
          curl -fsS -L --retry 3 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_PUBLIC/?verify0809public=${GITHUB_RUN_ID}" -o /tmp/public.html
          grep -Fq 'data-workspace-panel="live"' /tmp/public.html
          ! grep -Fq 'logo-size-343.css' /tmp/public.html
          ! grep -Fq 'data-ball46-favicon="20260923-repair"' /tmp/public.html
          echo PUBLIC_0809_OK
