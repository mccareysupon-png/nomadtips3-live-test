name: BALL46 Statistics No Old UI Flash — Guarded Production Deploy
on:
  push:
    branches: [audit/ball46-statistics-ui-flash-20261022]
    paths:
      - '.github/workflows/ball46-stats-no-flash-prod-deploy-20261022.yml'
      - 'deploy-assets/statistics-flash-20261022/deploy-stats-no-flash.mjs'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks and browser dependencies
        working-directory: deploy-assets/statistics-flash-20261022
        run: |
          set -euo pipefail
          node --check deploy-stats-no-flash.mjs
          node --check stats-ready.js
          npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Guard live V12, verify candidate at 320,360,390,430,1440, deploy if safe and retest Production
        working-directory: deploy-assets/statistics-flash-20261022
        run: node deploy-stats-no-flash.mjs
      - name: Archive before and after evidence, Worker version and rollback state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-statistics-no-old-flash-production-20261022
          path: deploy-assets/statistics-flash-20261022/proof/
          retention-days: 30
          if-no-files-found: warn