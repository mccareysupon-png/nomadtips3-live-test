name: Ball46 Page Head Stability V1 Deploy 20260920

on:
  push:
    branches: [work/ball46-page-head-stability-v1-safe-20260920]
    paths:
      - '.github/workflows/ball46-page-head-stability-v1-deploy-20260920.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_URL: https://ball46.com
  TARGET_BASE_VERSION: c04eae08-c1a2-4e00-94ce-79d567069640
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-page-head-stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated presentation branch
        uses: actions/checkout@v4
        with:
          ref: work/ball46-page-head-stability-v1-safe-20260920
          fetch-depth: 0

      - name: Guard active production version
        shell: bash
        run: |
          set -euo pipefail
          test -s workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deployments list --config wrangler.ball46.jsonc --json > /tmp/deployments-before.json
          cd ../..
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/deployments-before.json','utf8'));
          const latest=d[d.length-1];
          const target=process.env.TARGET_BASE_VERSION;
          if(!latest||!Array.isArray(latest.versions)||!latest.versions.some(v=>v.version_id===target&&Number(v.percentage)===100)){
            console.error('ACTIVE_PRODUCTION_CHANGED',JSON.stringify(latest));
            process.exit(1);
          }
          console.log('BASE_VERSION_LOCKED',target);
          NODE

      - name: Mirror current production and capture invariants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod /tmp/hdr /tmp/checks
          : > /tmp/protected-manifest.tsv

          while IFS= read -r f; do
            name="${f#nomad-live-343/}"
            [ "$name" = "page-head-stability-v1.css" ] && continue
            case "$name" in *.html|*.js|*.css|*.svg|*.json|*.png|*.webp|*.jpg|*.jpeg|*.ico) ;; *) continue ;; esac
            safe="${name//\//_}"
            code=$(curl -sS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 25 -D "/tmp/hdr/$safe" -o "/tmp/prod/$safe" -w '%{http_code}' "$BALL46_URL/$name?headbase=${GITHUB_RUN_ID}") || true
            [ "$code" = 200 ] || continue
            ctype=$(tr -d '\r' < "/tmp/hdr/$safe" | awk 'BEGIN{IGNORECASE=1}/^content-type:/{print tolower($0)}' | tail -1)
            case "$name" in
              *.js) [[ "$ctype" == *javascript* || "$ctype" == *text/plain* ]] || continue ;;
              *.css) [[ "$ctype" == *text/css* || "$ctype" == *text/plain* ]] || continue ;;
              *.html) [[ "$ctype" == *text/html* || "$ctype" == *text/plain* ]] || continue ;;
            esac
            cp "/tmp/prod/$safe" "$f"
            case "$name" in index.html|signal.html|statistics.html) ;; *)
              printf '%s\t%s\n' "$(sha256sum "/tmp/prod/$safe" | awk '{print $1}')" "$name" >> /tmp/protected-manifest.tsv
            ;; esac
          done < <(find nomad-live-343 -maxdepth 1 -type f | sort)

          for f in index.html signal.html statistics.html v2-header.css dashboard-v2.css ball46-next.css ball46-product-pages-v1.css page2-workspace-v1.css; do
            test -s "/tmp/prod/$f" || { echo "PRODUCTION_BASE_MISSING:$f"; exit 1; }
          done
          cp /tmp/prod/index.html /tmp/index.original.html
          cp /tmp/prod/signal.html /tmp/signal.original.html
          cp /tmp/prod/statistics.html /tmp/statistics.original.html

          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_URL/api/engine/health?headbase=${GITHUB_RUN_ID}" -o /tmp/engine-before.json
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_URL/api/hub/health?headbase=${GITHUB_RUN_ID}" -o /tmp/hub-before.json
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_URL/api/full-market/health?headbase=${GITHUB_RUN_ID}" -o /tmp/full-before.json
          node - <<'NODE'
          const fs=require('fs');
          for(const [n,p] of [['engine','/tmp/engine-before.json'],['hub','/tmp/hub-before.json'],['full','/tmp/full-before.json']]){
            const x=JSON.parse(fs.readFileSync(p,'utf8'));
            if(!x.version) throw Error(n.toUpperCase()+'_VERSION_MISSING');
            fs.writeFileSync('/tmp/'+n+'-version',String(x.version));
          }
          NODE

      - name: Validate isolated page-head overlay
        shell: bash
        run: |
          set -euo pipefail
          test -s nomad-live-343/page-head-stability-v1.css
          grep -Fq 'body[data-page="live"] .dash-heading' nomad-live-343/page-head-stability-v1.css
          grep -Fq '.ball46-product-page .next-page-head' nomad-live-343/page-head-stability-v1.css
          grep -Fq 'width:calc(min(100vw, 1920px)' nomad-live-343/page-head-stability-v1.css
          ! grep -Fq 'fetch(' nomad-live-343/page-head-stability-v1.css
          ! grep -Fq '/api/' nomad-live-343/page-head-stability-v1.css
          ! grep -Eiq '(^|[^a-z])(odds|engine|signal-next|statistics-next|dashboard-v2-stage3)[[:space:]]*\{' nomad-live-343/page-head-stability-v1.css
          python3 - <<'PY'
          from pathlib import Path
          s=Path('nomad-live-343/page-head-stability-v1.css').read_text()
          if s.count('{') != s.count('}'):
              raise SystemExit('CSS_BRACE_MISMATCH')
          PY

      - name: Apply stylesheet loader to Page 1 2 3 only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          loader='<link rel="stylesheet" href="page-head-stability-v1.css?v=343-page-head-stability-v1-20260920a">'
          for name in ('index.html','signal.html','statistics.html'):
              p=Path('nomad-live-343')/name
              h=p.read_text()
              h=re.sub(r'\s*<link[^>]+page-head-stability-v1\.css[^>]*>','',h,flags=re.I)
              if '</head>' not in h: raise SystemExit('HEAD_ANCHOR_MISSING:'+name)
              h=h.replace('</head>',loader+'\n</head>',1)
              p.write_text(h)
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          def strip_loader(s):
              s=re.sub(r'\s*<link[^>]+page-head-stability-v1\.css[^>]*>','',s,flags=re.I)
              return re.sub(r'>\s+<','><',s).strip()
          for name in ('index','signal','statistics'):
              prod=Path(f'/tmp/{name}.original.html').read_text()
              now=Path(f'nomad-live-343/{name}.html').read_text()
              if strip_loader(prod)!=strip_loader(now):
                  raise SystemExit('NON_LOADER_HTML_CHANGED:'+name)
          print('PASS: only stylesheet loaders changed in Page 1/2/3 HTML')
          PY

      - name: Cloudflare dry run
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc --dry-run

      - name: Deploy presentation overlay
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify protected assets and backend invariants
        shell: bash
        run: |
          set -euo pipefail
          marker='page-head-stability-v1.css?v=343-page-head-stability-v1-20260920a'
          for p in index.html signal.html statistics.html; do
            ok=0
            for n in $(seq 1 15); do
              code=$(curl -sS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 -o "/tmp/$p.after" -w '%{http_code}' "$BALL46_URL/$p?headstable=${GITHUB_RUN_ID}-${n}") || code=000
              if [ "$code" = 200 ] && grep -Fq "$marker" "/tmp/$p.after"; then ok=1; break; fi
              sleep 2
            done
            [ "$ok" = 1 ] || { echo "PAGE_HEAD_LOADER_FAILED:$p"; exit 1; }
          done
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_URL/page-head-stability-v1.css?headstable=${GITHUB_RUN_ID}" -o /tmp/head.css.after
          grep -Fq 'body[data-page="live"] .dash-heading' /tmp/head.css.after
          grep -Fq '.ball46-product-page .next-page-head' /tmp/head.css.after

          while IFS=$'\t' read -r expected name; do
            [ -n "$name" ] || continue
            out="/tmp/protected-${name//\//_}"
            curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_URL/$name?headprotect=${GITHUB_RUN_ID}" -o "$out"
            actual=$(sha256sum "$out" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "PROTECTED_ASSET_CHANGED:$name"; exit 1; }
          done < /tmp/protected-manifest.tsv

          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_URL/api/engine/health?headstable=${GITHUB_RUN_ID}" -o /tmp/engine-after.json
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_URL/api/hub/health?headstable=${GITHUB_RUN_ID}" -o /tmp/hub-after.json
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_URL/api/full-market/health?headstable=${GITHUB_RUN_ID}" -o /tmp/full-after.json
          node - <<'NODE'
          const fs=require('fs');
          for(const [n,p] of [['engine','/tmp/engine-after.json'],['hub','/tmp/hub-after.json'],['full','/tmp/full-after.json']]){
            const x=JSON.parse(fs.readFileSync(p,'utf8'));
            const before=fs.readFileSync('/tmp/'+n+'-version','utf8');
            if(String(x.version||'')!==before) throw Error(n.toUpperCase()+'_CHANGED');
          }
          console.log('BACKEND_INVARIANTS_PASS');
          NODE

      - name: Measure Page 1 2 3 heading geometry in browser
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          [ -n "$CHROME" ] || { echo 'CHROME_NOT_FOUND'; exit 1; }
          npm install --no-save --no-package-lock puppeteer-core@24.16.0 >/dev/null 2>&1
          CHROME_BIN="$CHROME" node - <<'NODE'
          const puppeteer=require('puppeteer-core');
          const url=process.env.BALL46_URL;
          const exe=process.env.CHROME_BIN;
          const pages=[
            ['index.html','.dash-heading'],
            ['signal.html','.next-page-head'],
            ['statistics.html','.next-page-head']
          ];
          const viewports=[
            {width:1920,height:1080,name:'desktop-1920'},
            {width:1366,height:900,name:'desktop-1366'},
            {width:390,height:844,name:'mobile-390'}
          ];
          (async()=>{
            const browser=await puppeteer.launch({executablePath:exe,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              for(const vp of viewports){
                const rows=[];
                for(const [path,sel] of pages){
                  const page=await browser.newPage();
                  await page.setViewport({width:vp.width,height:vp.height,deviceScaleFactor:1});
                  await page.goto(`${url}/${path}?geom=${Date.now()}-${Math.random()}`,{waitUntil:'domcontentloaded',timeout:30000});
                  await page.waitForSelector(sel,{timeout:10000});
                  await new Promise(r=>setTimeout(r,350));
                  const m=await page.$eval(sel,el=>{
                    const q=s=>el.querySelector(s);
                    const rect=n=>{const r=n.getBoundingClientRect();return {left:r.left,top:r.top,width:r.width,height:r.height}};
                    const eyebrow=q('.eyebrow');
                    const h1=q('h1');
                    const desc=el.querySelector(':scope > div:first-child > p:last-child');
                    return {
                      head:rect(el),eyebrow:rect(eyebrow),h1:rect(h1),desc:rect(desc),
                      h1Size:parseFloat(getComputedStyle(h1).fontSize),
                      eyebrowSize:parseFloat(getComputedStyle(eyebrow).fontSize),
                      descSize:parseFloat(getComputedStyle(desc).fontSize)
                    };
                  });
                  rows.push({path,...m});
                  await page.close();
                }
                const spread=(key,axis)=>Math.max(...rows.map(r=>r[key][axis]))-Math.min(...rows.map(r=>r[key][axis]));
                for(const [key,axis,limit] of [['head','left',1.5],['head','top',1.5],['eyebrow','left',1.5],['eyebrow','top',1.5],['h1','left',1.5],['h1','top',1.5],['desc','left',1.5],['desc','top',1.5]]){
                  const s=spread(key,axis);
                  if(s>limit) throw Error(`GEOMETRY_MISMATCH:${vp.name}:${key}.${axis}:${s.toFixed(2)}px`);
                }
                const sizes=['h1Size','eyebrowSize','descSize'];
                for(const k of sizes){
                  const s=Math.max(...rows.map(r=>r[k]))-Math.min(...rows.map(r=>r[k]));
                  if(s>0.1) throw Error(`FONT_SIZE_MISMATCH:${vp.name}:${k}:${s}`);
                }
                console.log('GEOMETRY_PASS',vp.name,JSON.stringify(rows));
              }
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Final production version report
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deployments list --config wrangler.ball46.jsonc --json | tail -c 12000
