name: BALL46 O/U instant pricing active Worker source READONLY
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-ou-instant-price-active-source-readonly-20261123.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Inspect only TEST worker O/U issuance path and Full Market cache interface without API calls
        run: |
          node --input-type=module <<'JS'
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers';
          const h={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const name='ball46-prematch-only-test-20261120';
          const resp=await fetch(root+'/scripts/'+name+'/deployments?per_page=1',{headers:h}).then(r=>r.json());
          const id=resp.result.deployments[0].versions[0].version_id;
          const data=await fetch(root+'/workers/'+name+'/versions/'+id+'?include=modules',{headers:h}).then(r=>r.json());
          const m=data.result.modules.find(x=>x.name==='prematch-only-worker.mjs');
          const src=Buffer.from(m.content_base64,'base64').toString();
          console.log('OU_ACTIVE_TEST '+JSON.stringify({version:id,modules:data.result.modules.length,chars:src.length}));
          for(const text of ["if(path==='/ou-cycle-test'","if(path==='/ou-price-pickup","async runOuPricePickupTick","async runOu","async fetch(req)","const b=await stub.fetch","OU_2P5_PRICE_PICKUP_TEST"]){
           let i=src.indexOf(text);if(i>=0)console.log('OU_ACTIVE_MARK '+JSON.stringify({needle:text,index:i,fragment:src.slice(Math.max(i-500,0),i+1750)}).slice(0,4200));
          }
          JS
