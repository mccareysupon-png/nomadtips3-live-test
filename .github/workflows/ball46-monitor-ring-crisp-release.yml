name: BALL46 approved crisp monitor ring CSS release
on:
  push:
    branches: [codex/ball46-monitor-ring-crisp-20261101]
    paths: ['work/ball46-monitor-ring-crisp-20261101/release-request.json']
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: work/ball46-monitor-ring-crisp-20261101
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fresh Production source, complete current assets and restore point
        run: |
          node verify-source.mjs
          node preflight.mjs
          node build.mjs
      - name: Install verification tools
        run: |
          npm install --no-save --package-lock=false acorn@8.15.0 playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Stage approved CSS on exact current runtime without traffic change
        run: node release.mjs
      - name: Verify candidate PC/mobile, moving beam and stationary edges
        run: node release-browser.mjs
      - name: Activate only after candidate passes, verify both domains and live browser
        run: |
          cp browser-proof.json release-audit/candidate-browser-proof.json
          node -e "const fs=require('fs'),c=JSON.parse(fs.readFileSync('release-audit/candidate.json'));fs.writeFileSync('request.json',JSON.stringify({phase:'activate',base:c.base,candidate:c.candidate}))"
          node release.mjs
          cp release-audit/result.json release-audit/activation-result.json
          node release-browser.mjs https://ball46.com
      - name: Restore immediate baseline if post-activation browser check fails
        if: failure()
        run: |
          node -e "const fs=require('fs');if(fs.existsSync('release-audit/result.json')){const r=JSON.parse(fs.readFileSync('release-audit/result.json'));if(r.activated){fs.writeFileSync('request.json',JSON.stringify({phase:'restore',base:r.base,candidate:r.candidate}));fs.writeFileSync('restore-needed','yes')}}"
          if [ -f restore-needed ]; then node release.mjs; fi
      - name: Preserve sanitized release evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-audit/*.json
          if ls release-audit/*.png >/dev/null 2>&1; then git add release-audit/*.png; fi
          git commit -m "Record guarded crisp ring CSS release and rollback evidence [skip ci]"
          git push origin HEAD:codex/ball46-monitor-ring-crisp-20261101
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ring-crisp-release-${{ github.run_id }}
          path: work/ball46-monitor-ring-crisp-20261101/release-audit
