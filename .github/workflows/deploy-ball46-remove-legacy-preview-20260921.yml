name: Validate Ball46 Legacy Page Removal Preview 20260921

on:
  push:
    branches: [work/ball46-remove-legacy-pages-20260921]
    paths:
      - '.github/workflows/deploy-ball46-remove-legacy-preview-20260921.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BASE_SHA: 7c9e26118244dc14a676e7f887d97bdf899553fd
  PREVIEW: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard Page 1 Golden core
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            workers/nomadtips3-engine-343/src/index.js \
            workers/nomadtips3-343-preview/src/index.js \
            workers/nomadtips3-343-preview/wrangler.ball46.jsonc \
            nomad-live-343/index.html \
            nomad-live-343/dashboard-v2-stage3.js \
            nomad-live-343/bulk-odds-compat-343.js \
            nomad-live-343/full-market-bookmaker-343.js \
            nomad-live-343/live-summary-full-odds-343.js \
            nomad-live-343/expanded-match-343.js \
            nomad-live-343/signal-next.js \
            nomad-live-343/singlepage-workspace-343.js; do
            git diff --quiet "$BASE_SHA"..HEAD -- "$p" || { echo "FORBIDDEN CORE CHANGE: $p"; exit 1; }
          done

      - name: Validate legacy pages are physically removed
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            nomad-live-343/signal.html \
            nomad-live-343/statistics.html \
            nomad-live-343/signal-next.html \
            nomad-live-343/statistics-next.html \
            nomad-live-343/signal.js \
            nomad-live-343/statistics.js \
            nomad-live-343/statistics-next.js \
            nomad-live-343/signal-focus-343.js \
            nomad-live-343/signal-bettor-343.css \
            nomad-live-343/signal-compact-343.css \
            nomad-live-343/signal-v2-clean-343.css \
            nomad-live-343/statistics-page-343.css \
            nomad-live-343/statistics-v2-clean-343.css \
            nomad-live-343/content-rails-343.css \
            nomad-live-343/v2-header.css; do
            test ! -e "$p" || { echo "LEGACY FILE STILL EXISTS: $p"; exit 1; }
          done
          ! grep -Eq 'signal\.html|statistics\.html' nomad-live-343/sitemap.xml
          grep -Fq 'signal-next.js' nomad-live-343/index.html
          grep -Fq 'singlepage-workspace-343.js' nomad-live-343/index.html

      - name: Dry-run isolated preview
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc

      - name: Deploy isolated preview
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Verify Page 1 and Golden Odds remain healthy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 30 "$PREVIEW/?cleanup=$GITHUB_RUN_ID" -o /tmp/home.html
          grep -Fq 'signal-next.js' /tmp/home.html
          grep -Fq 'singlepage-workspace-343.js' /tmp/home.html
          curl -fsS --connect-timeout 8 --max-time 30 "$PREVIEW/api/engine/board?cleanup=$GITHUB_RUN_ID" -o /tmp/board.json
          node - <<'NODE'
          const fs=require('fs'),b=JSON.parse(fs.readFileSync('/tmp/board.json'));
          if(b?.ok!==true||!Array.isArray(b.fixtures)) throw Error('Board unhealthy');
          function has(v){if(Array.isArray(v))return v.length>0;if(!v||typeof v!=='object')return false;const c=[v.bookmakers,v.odds,v.markets,v?.data?.bookmakers,v?.data?.odds,v?.data?.markets];return c.some(x=>Array.isArray(x)?x.length>0:!!(x&&typeof x==='object'&&Object.keys(x).length))||Object.keys(v).some(k=>/bet365|pinnacle|crown|1xbet|12bet|interwetten|macauslot|18bet|vcbet|easybets|bookmaker/i.test(String(k)))}
          const odds=b.fixtures.filter(f=>has(f?.providerOdds)||has(f?.fullOdds)||has(f?.odds)).length;
          if(b.fixtures.length && odds===0) throw Error('Golden Odds missing');
          console.log('PREVIEW PAGE1 PASS',{fixtures:b.fixtures.length,odds});
          NODE

      - name: Verify legacy standalone URLs are dead
        shell: bash
        run: |
          set -euo pipefail
          for p in signal.html statistics.html signal-next.html statistics-next.html signal.js statistics.js statistics-next.js; do
            code=$(curl -sS --connect-timeout 8 --max-time 20 -o /dev/null -w '%{http_code}' "$PREVIEW/$p?cleanup=$GITHUB_RUN_ID")
            echo "$p -> $code"
            case "$code" in 404|410) ;; *) echo "LEGACY URL STILL LIVE: $p ($code)"; exit 1;; esac
          done
