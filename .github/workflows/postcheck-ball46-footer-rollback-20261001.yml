name: POSTCHECK Ball46 Footer Rollback 20261001

on:
  push:
    branches: [ops/ball46-footer-links-20261001]
    paths: ['.github/workflows/postcheck-ball46-footer-rollback-20261001.yml']

permissions:
  contents: write

env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  BALL46_URL: https://ball46.com

jobs:
  read-only-postcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ball46-footer-links-20261001
          fetch-depth: 1
      - name: Capture current production after rollback
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          mkdir -p audit /tmp/b46post
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=3" -H "$AUTH" -o /tmp/deployments.json
          nonce="${GITHUB_RUN_ID}-$(date +%s%N)"
          for p in index information contact; do curl -fsS -L --max-time 25 "$BALL46_URL/$p.html?post=$nonce" -o "/tmp/b46post/$p.html"; done
          curl -fsS --max-time 25 "$BALL46_URL/api/engine/health?post=$nonce" -o /tmp/engine.json
          curl -fsS --max-time 25 "$BALL46_URL/api/full-market/health?post=$nonce" -o /tmp/full.json
          curl -fsS --max-time 25 "$BALL46_URL/api/engine/statistics?post=$nonce" -o /tmp/stats.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8')).result?.deployments?.[0];
          const html=fs.readFileSync('/tmp/b46post/index.html','utf8');
          const footer=html.match(/<footer\b[^>]*id=["']b46-site-footer-v1["'][\s\S]*?<\/footer>/i)?.[0]||'';
          const links=[...footer.matchAll(/<a\b[^>]*href=["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi)].map(m=>({href:m[1],text:m[2].replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}));
          const e=JSON.parse(fs.readFileSync('/tmp/engine.json','utf8')),f=JSON.parse(fs.readFileSync('/tmp/full.json','utf8')),s=JSON.parse(fs.readFileSync('/tmp/stats.json','utf8'));
          const report={capturedAt:new Date().toISOString(),deployment:d?{id:d.id,created_on:d.created_on,versions:d.versions}:null,productLinks:links.filter(x=>/^(Live|Signals|Statistics)$/.test(x.text)),informationHasFooter:fs.readFileSync('/tmp/b46post/information.html','utf8').includes('b46-site-footer-v1'),contactHasFooter:fs.readFileSync('/tmp/b46post/contact.html','utf8').includes('b46-site-footer-v1'),backend:{engine:e.version,fullMarket:f.version,settlementRevision:s.settlementRevision}};
          fs.writeFileSync('audit/ball46-footer-postrollback-20261001.json',JSON.stringify(report,null,2)+'\n');
          NODE
      - name: Save postcheck
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/ball46-footer-postrollback-20261001.json
          git commit -m 'verify(ball46): record footer rollback state' || exit 0
          git push origin HEAD:ops/ball46-footer-links-20261001
