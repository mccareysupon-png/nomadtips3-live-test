name: BALL46 remove mistaken Sidebar firstpaint production change 20261122
on:
  push:
    branches: [ops/ball46-sidebar-firstpaint-rollback-20261122]
    paths:
      - '.github/workflows/b46-remove-mistaken-sidebar-firstpaint-20261122.yml'
      - 'qa/sidebar-firstpaint-rollback-20261122/rollback.mjs'
permissions: {contents: read}
concurrency:
  group: ball46-production-ui-release
  cancel-in-progress: false
jobs:
  guarded-rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Guard and revert only incorrect Sidebar firstpaint release
        run: node qa/sidebar-firstpaint-rollback-20261122/rollback.mjs
