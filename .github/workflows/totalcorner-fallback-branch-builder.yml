name: One-shot TotalCorner Fallback Branch Builder

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/totalcorner-fallback-branch-builder.yml"

permissions:
  contents: write

jobs:
  patch-test-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: totalcorner-ah-fallback-20260822
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply isolated TotalCorner fallback patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          price = 'nomad-live-engine/src/price-sources.js'
          replace_once(price,
          """export const PRICE_SOURCE_REGISTRY=Object.freeze([\n  Object.freeze({id:'source1',position:1,source:'Odds-API.io'}),\n  Object.freeze({id:'source2',position:2,source:'The Odds API'}),\n  Object.freeze({id:'source3',position:3,source:'API-Football'}),\n]);""",
          """export const PRICE_SOURCE_REGISTRY=Object.freeze([\n  Object.freeze({id:'source1',position:1,source:'Odds-API.io'}),\n  Object.freeze({id:'source2',position:2,source:'The Odds API'}),\n  Object.freeze({id:'source3',position:3,source:'API-Football'}),\n  Object.freeze({id:'source4',position:4,source:'TotalCorner'}),\n]);""")

          replace_once(price,
          """export function publicPriceSourceSnapshot(snapshot){""",
          """export function selectPriceSourceWithFallback(sources=[],fallbackId='source4'){\n  const primary=sources.filter(item=>item.id!==fallbackId);\n  const selectedPrimary=selectPriceSource(primary);\n  if(selectedPrimary) return selectedPrimary;\n  return sources.find(item=>item.id===fallbackId&&item.status==='PASS'&&item.market)||null;\n}\n\nexport function publicPriceSourceSnapshot(snapshot){""")

          index = 'nomad-live-engine/src/index.js'
          replace_once(index,
          "import {parseToday,parseLiveDetail,parseEnded} from './parser.js';",
          "import {parseToday,parseLiveDetail,parseEnded,parseBet365Asian,handicapPanelUrl} from './parser.js';")
          replace_once(index,
          "import {buildPriceSourceSnapshots,publicPriceSourceSnapshot,selectPriceSource} from './price-sources.js';",
          "import {buildPriceSourceSnapshots,publicPriceSourceSnapshot,selectPriceSource,selectPriceSourceWithFallback} from './price-sources.js';")
          replace_once(index,
          "const emptyState=()=>({lastCycle:null,lastSuccess:null,lastError:null,matches:[],signals:[],cycle:0,source:{today:false,ended:false,oddsApi:{status:'IDLE'},theOddsApi:{status:'IDLE'},apiFootball:{status:'IDLE'}}});",
          "const emptyState=()=>({lastCycle:null,lastSuccess:null,lastError:null,matches:[],signals:[],cycle:0,source:{today:false,ended:false,oddsApi:{status:'IDLE'},theOddsApi:{status:'IDLE'},apiFootball:{status:'IDLE'},totalCorner:{status:'IDLE'}}});")
          replace_once(index,
          "const marketState=(bookmaker,status,reason,extra={})=>({status,reason,source:'Odds-API.io',bookmaker:bookmakerLabel(bookmaker),...extra});",
          "const marketState=(bookmaker,status,reason,extra={})=>({status,reason,source:'Odds-API.io',bookmaker:bookmakerLabel(bookmaker),...extra});\nconst totalCornerMarketState=(status,reason,extra={})=>({status,reason,source:'TotalCorner',bookmaker:null,...extra});")
          replace_once(index,
          "const next={...previous,lastCycle:started,cycle:upcomingCycle,lastError:null,source:{today:false,ended:false,oddsApi:{status:'IDLE',checked:0,eligible:0,mapped:0,ready:0,readyByBookmaker:{'1xBet':0,'Bet365':0}},theOddsApi:{status:'IDLE',checked:0,mapped:0,ready:0},apiFootball:{status:'IDLE',checked:0,eligible:0,fixtureMapped:0,mapped:0,ready:0,recoveryCandidates:0,recoveredSignals:0}},configVersion:activeEnvelope.version};",
          "const next={...previous,lastCycle:started,cycle:upcomingCycle,lastError:null,source:{today:false,ended:false,oddsApi:{status:'IDLE',checked:0,eligible:0,mapped:0,ready:0,readyByBookmaker:{'1xBet':0,'Bet365':0}},theOddsApi:{status:'IDLE',checked:0,mapped:0,ready:0},apiFootball:{status:'IDLE',checked:0,eligible:0,fixtureMapped:0,mapped:0,ready:0,recoveryCandidates:0,recoveredSignals:0},totalCorner:{status:'IDLE',checked:0,ready:0,selected:0}},configVersion:activeEnvelope.version};")

          fallback_block = """
      const totalCornerMarketById=new Map();
      const fallbackCandidates=eligible.filter(match=>{
        const source1=marketById.get(match.id)||marketState(REAL_BOOKMAKER,'ODDS NOT READY','price_not_checked');
        const source2=theOddsMarketById.get(match.id)||theOddsApiUnavailable('price_not_checked');
        const source3=apiFootballMarketById.get(match.id)||apiFootballUnavailable('price_not_checked');
        const primarySnapshots=buildPriceSourceSnapshots(
          new Map([['source1',source1],['source2',source2],['source3',source3]]),config,started
        ).filter(source=>source.id!=='source4');
        return !selectPriceSource(primarySnapshots);
      });
      next.source.totalCorner.checked=fallbackCandidates.length;
      if(!fallbackCandidates.length){
        next.source.totalCorner.status='NOT_NEEDED';
      }else{
        const fetched=await Promise.all(fallbackCandidates.map(async match=>{
          try{
            const document=await getDocument(handicapPanelUrl(match.urls.odds),config,started);
            return [match.id,parseBet365Asian(document.html,document.sourceUpdatedAt)];
          }catch(error){
            return [match.id,totalCornerMarketState('AH UNAVAILABLE',`price_fetch_failed:${String(error?.message||error)}`)];
          }
        }));
        for(const [matchId,market] of fetched) totalCornerMarketById.set(matchId,market);
        next.source.totalCorner.status='READY';
        next.source.totalCorner.checkedAt=started;
      }

"""
          replace_once(index,"      const enriched=baseMatches.map(match=>{",fallback_block + "      const enriched=baseMatches.map(match=>{")
          replace_once(index,
          """        const source3Market=apiFootballMarketById.get(match.id)||apiFootballUnavailable('price_not_checked');\n        const marketComparison=marketComparisonById.get(match.id)||{oneXBet:source1Market,bet365:marketState(COMPARE_BOOKMAKER,'ODDS NOT READY','price_not_checked')};\n        const priceSourceSnapshots=buildPriceSourceSnapshots(new Map([['source1',source1Market],['source2',source2Market],['source3',source3Market]]),config,started);\n        const selectedPriceSnapshot=selectPriceSource(priceSourceSnapshots);""",
          """        const source3Market=apiFootballMarketById.get(match.id)||apiFootballUnavailable('price_not_checked');\n        const source4Market=totalCornerMarketById.get(match.id)||totalCornerMarketState('AH UNAVAILABLE',match.detectionPassed?'fallback_not_available':'fallback_not_needed');\n        const marketComparison=marketComparisonById.get(match.id)||{oneXBet:source1Market,bet365:marketState(COMPARE_BOOKMAKER,'ODDS NOT READY','price_not_checked')};\n        const priceSourceSnapshots=buildPriceSourceSnapshots(new Map([['source1',source1Market],['source2',source2Market],['source3',source3Market],['source4',source4Market]]),config,started);\n        const selectedPriceSnapshot=selectPriceSourceWithFallback(priceSourceSnapshots);""")
          replace_once(index,
          "      const source3Summary=summarizeApiFootballRecovery(enriched,apiFootballMarketById);",
          "      next.source.totalCorner.ready=enriched.filter(match=>match.priceSources?.find(source=>source.id==='source4')?.status==='PASS').length;\n      next.source.totalCorner.selected=enriched.filter(match=>match.selectedPrice?.id==='source4').length;\n      const source3Summary=summarizeApiFootballRecovery(enriched,apiFootballMarketById);")

          Path('nomad-live-engine/test/totalcorner-fallback.test.js').write_text("""import test from 'node:test';
import assert from 'node:assert/strict';
import {DEFAULT_CONFIG} from '../src/config.js';
import {PRICE_SOURCE_REGISTRY,buildPriceSourceSnapshots,selectPriceSourceWithFallback} from '../src/price-sources.js';

const observedAt=Date.parse('2026-08-22T01:00:40Z');
const ready=(source,bookmaker,line,odds,updatedAt)=>({status:'AH READY',source,bookmaker,line,homeOdds:odds,awayOdds:1.95,sourceUpdatedAt:updatedAt,market:'FULL MATCH LIVE AH'});
const unavailable=(source,reason='not_available')=>({status:'AH UNAVAILABLE',source,reason});

test('SOURCE 4 is TotalCorner and remains last in registry',()=>{
  assert.deepEqual(PRICE_SOURCE_REGISTRY.at(-1),{id:'source4',position:4,source:'TotalCorner'});
});

test('TotalCorner Bet365 is selected only when Sources 1-3 have no PASS market',()=>{
  const snapshots=buildPriceSourceSnapshots(new Map([
    ['source1',unavailable('Odds-API.io')],['source2',unavailable('The Odds API')],['source3',unavailable('API-Football')],
    ['source4',ready('Bet365 via TotalCorner','Bet365',-.5,1.88,observedAt-4_000)],
  ]),DEFAULT_CONFIG,observedAt);
  const selected=selectPriceSourceWithFallback(snapshots);
  assert.equal(selected.id,'source4'); assert.equal(selected.bookmaker,'Bet365'); assert.equal(selected.status,'PASS');
});

test('a valid primary source always beats TotalCorner even when TotalCorner is fresher and pays more',()=>{
  const snapshots=buildPriceSourceSnapshots(new Map([
    ['source1',ready('Odds-API.io','1xBet',-.5,1.80,observedAt-18_000)],['source2',unavailable('The Odds API')],['source3',unavailable('API-Football')],
    ['source4',ready('Bet365 via TotalCorner','Bet365',-.5,2.05,observedAt-1_000)],
  ]),DEFAULT_CONFIG,observedAt);
  const selected=selectPriceSourceWithFallback(snapshots);
  assert.equal(selected.id,'source1'); assert.equal(selected.bookmaker,'1xBet');
});

test('invalid TotalCorner fallback never creates a selected price',()=>{
  const snapshots=buildPriceSourceSnapshots(new Map([
    ['source1',unavailable('Odds-API.io')],['source2',unavailable('The Odds API')],['source3',unavailable('API-Football')],
    ['source4',{status:'AH INVALID',source:'TotalCorner',reason:'handicap_panel_missing'}],
  ]),DEFAULT_CONFIG,observedAt);
  assert.equal(selectPriceSourceWithFallback(snapshots),null);
});
""",encoding='utf-8')
          PY

      - name: Run full NOMAD live engine tests
        working-directory: nomad-live-engine
        run: |
          node --test
          node --check src/index.js
          node --check src/price-sources.js
          node --check src/parser.js

      - name: Commit tested patch to isolated branch
        shell: bash
        run: |
          rm -f .github/workflows/tmp-totalcorner-ah-fallback-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nomad-live-engine/src/index.js nomad-live-engine/src/price-sources.js nomad-live-engine/test/totalcorner-fallback.test.js .github/workflows/tmp-totalcorner-ah-fallback-patch.yml
          git diff --cached --check
          git commit -m "Add TotalCorner Bet365 AH fallback behind primary sources"
          git push origin HEAD:totalcorner-ah-fallback-20260822

      - name: Remove one-shot builder from main
        if: success()
        shell: bash
        run: |
          git fetch origin main
          git checkout -B cleanup-main origin/main
          rm -f .github/workflows/totalcorner-fallback-branch-builder.yml
          git add .github/workflows/totalcorner-fallback-branch-builder.yml
          git commit -m "Remove one-shot TotalCorner branch builder"
          git push origin HEAD:main
