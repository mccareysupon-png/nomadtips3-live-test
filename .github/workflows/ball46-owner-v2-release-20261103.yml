name: BALL46 approved isolated owner control V2 release
on:
  push:
    branches: [codex/ball46-owner-control-v2-20261103]
    paths: ['work/api-settings-v2/release-request.json']
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: work/ball46-5usd-latency-control-20261102
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false --prefix ../api-settings-v2 acorn@8.15.0 playwright@1.56.1
      - name: Fresh read-only Production capture
        run: node production-preflight.mjs
      - name: Prepare owner UI and test authenticated gateway
        run: |
          node ../api-settings-v2/prepare.mjs
          node --check ../api-settings-v2/owner-auth.mjs
          node --check ../api-settings-v2/owner-gateway.mjs
          node --check ../api-settings-v2/connected-client.js
          node --check ../api-settings-v2/release.mjs
          node ../api-settings-v2/gateway.test.mjs > production-audit/owner-v2-tests.txt
      - name: Verify connected PC/mobile UI against isolated local fixtures
        run: |
          ../api-settings-v2/node_modules/.bin/playwright install --with-deps chromium
          node ../api-settings-v2/browser-check.mjs
      - name: Release isolated owner page and minimal HUB gateway only
        run: node ../api-settings-v2/release.mjs
      - name: Preserve verification and rollback evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-audit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record owner V2 release and preservation checks [skip ci]"
          git push origin HEAD:codex/ball46-owner-control-v2-20261103
