name: DIAG Ball46 Find Unit Candles Source 20261012

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-ball46-find-unit-candles-source-20261012.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Find live source
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const puppeteer=require('puppeteer-core'),fs=require('fs');
          const exe=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);
          (async()=>{
            const b=await puppeteer.launch({headless:true,executablePath:exe,args:['--no-sandbox']});
            const p=await b.newPage(); await p.goto('https://ball46.com/?view=statistics&findUnitSource='+Date.now(),{waitUntil:'networkidle2',timeout:90000});
            const r=await p.evaluate(async()=>{
              const out=[];
              const urls=[...document.scripts].map(s=>s.src).filter(Boolean);
              for(const u of urls){
                try{
                  const s=await (await fetch(u,{cache:'no-store'})).text();
                  if(s.includes('UNIT CANDLES')||s.includes('b46-perf-unit-panel')||s.includes('b46-perf-unit-candles')){
                    const i=Math.max(s.indexOf('UNIT CANDLES'),s.indexOf('b46-perf-unit-panel'),s.indexOf('b46-perf-unit-candles'));
                    out.push({url:u,len:s.length,snip:s.slice(Math.max(0,i-10000),Math.min(s.length,i+30000))});
                  }
                }catch(e){}
              }
              return {urls,out};
            });
            console.log('UNIT_SOURCE '+JSON.stringify(r));
            await b.close();
          })().catch(e=>{console.error(e.stack);process.exit(1)});
          NODE
