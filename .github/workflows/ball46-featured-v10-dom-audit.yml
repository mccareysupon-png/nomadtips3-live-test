name: BALL46 Featured Approved V10 DOM Audit
on:
  push:
    branches: [fix/ball46-featured-sections-approved-v10-20261021]
    paths:
      - '.github/workflows/ball46-featured-v10-dom-audit.yml'
      - 'deploy-assets/featured-sections-v10/audit-dom.mjs'
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Observe current featured card DOM on PC and expanded mobile without changes
        working-directory: deploy-assets/featured-sections-v10
        run: |
          npm install --no-save --ignore-scripts puppeteer-core@24
          node audit-dom.mjs
      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-v10-dom-proof
          path: deploy-assets/featured-sections-v10/audit-proof/
          retention-days: 10
          if-no-files-found: warn