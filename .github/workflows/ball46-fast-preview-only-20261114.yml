name: BALL46 isolated first-page browser proof — NO deploy
on:
  push:
    branches: [test/ball46-statistics-read-model-v2-20261114]
    paths: ['.github/workflows/ball46-fast-preview-only-20261114.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse recorded Ledger evidence without live data API calls
        uses: actions/download-artifact@v4
        with:
          name: ball46-statistics-shadow-proof
          run-id: 43373832113
          github-token: ${{ github.token }}
          path: work/statistics-summary-shadow-20261113/reference/ui-proof
      - name: Verify current registry using only existing Worker control/static GETs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node work/statistics-summary-shadow-20261113/fresh-source.mjs
          node work/statistics-summary-shadow-20261113/capture-ui.mjs
          mkdir -p work/statistics-summary-shadow-20261113/reference/ui-proof/qa/ui-capture
          cp -r work/statistics-summary-shadow-20261113/qa/ui-capture/. work/statistics-summary-shadow-20261113/reference/ui-proof/qa/ui-capture/
          node work/statistics-summary-shadow-20261113/build-summary-formulas.mjs
      - name: Install isolated Playwright (no Cloudflare deployment credentials)
        run: |
          npm install --prefix work/statistics-summary-shadow-20261113/.runtime --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          work/statistics-summary-shadow-20261113/.runtime/node_modules/.bin/playwright install --with-deps chromium
      - name: Test first-50-row responsive browser and 30D/90D charts
        run: |
          mkdir -p work/statistics-read-model-v2-20261114/qa
          node work/statistics-read-model-v2-20261114/preview-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-fast-preview-browser-proof
          path: work/statistics-read-model-v2-20261114/qa/
