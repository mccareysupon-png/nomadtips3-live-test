name: BALL46 BTTS candidate crowding diagnosis real-browser TEST only
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-btts-candidate-layout-diagnostic-20261122.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install test-only Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Capture CSS and actual card geometry with representative viewport sizes
        run: |
          mkdir -p qa-artifacts
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const url='https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev/?b46pm=btts';
          function overlapping(a,b){
           if(!a||!b)return false;
           return Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left))*
             Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top))>4;
          }
          try {
            for(const v of [{n:'pc1440',w:1440,h:900,m:false},{n:'laptop1024',w:1024,h:768,m:false},
              {n:'mobile390',w:390,h:844,m:true},{n:'mobile320',w:320,h:700,m:true}]){
              const context=await browser.newContext({viewport:{width:v.w,height:v.h},isMobile:v.m,hasTouch:v.m});
              const page=await context.newPage();
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:55000});
              await page.waitForFunction(()=>document.querySelectorAll('[data-b46-btts-candidate-fixture]').length>=20,{timeout:50000});
              const m=await page.evaluate(()=>{
               const c=document.querySelector('[data-b46-btts-candidate-fixture]');
               const find=sel=>c?.querySelector(sel);
               const rect=e=>{if(!e)return null;const b=e.getBoundingClientRect();return {x:+b.x.toFixed(1),y:+b.y.toFixed(1),w:+b.width.toFixed(1),h:+b.height.toFixed(1),left:b.left,right:b.right,top:b.top,bottom:b.bottom}};
               const css=e=>{if(!e)return null;const z=getComputedStyle(e);return {
                 display:z.display,position:z.position,gap:z.gap,padding:z.padding,
                 margin:z.margin,fontSize:z.fontSize,fontWeight:z.fontWeight,
                 gridTemplateColumns:z.gridTemplateColumns,flexDirection:z.flexDirection,
                 flexWrap:z.flexWrap,whiteSpace:z.whiteSpace,
                 overflow:z.overflow,lineHeight:z.lineHeight,minWidth:z.minWidth,width:z.width
               }};
               const nodes={card:c,compact:find('.b46pm-premium-summary'),meta:find('.b46pm-premium-meta'),
                 league:find('.b46pm-premium-league'),date:find('.b46pm-premium-meta .b46pm-state'),
                 teams:find('.b46pm-premium-teams'),quick:find('.b46pm-premium-quick'),
                 status:find('.b46pm-premium-status'),section:document.querySelector('#b46pm-btts-candidates')};
               const box=Object.fromEntries(Object.entries(nodes).map(([k,e])=>[k,{rect:rect(e),css:css(e),scrollWidth:e?.scrollWidth,clientWidth:e?.clientWidth}]));
               const metrics=[...c.querySelectorAll('.b46pm-premium-quick-metric')].map(x=>({
                 title:x.querySelector('small')?.textContent,value:x.querySelector('strong')?.textContent,
                 metricRect:rect(x),titleRect:rect(x.querySelector('small')),valueRect:rect(x.querySelector('strong')),
                 scrollWidth:x.scrollWidth,clientWidth:x.clientWidth,css:css(x)}));
               const all=[...c.querySelectorAll('span,small,strong')].filter(x=>x.textContent.trim());
               const crowded=all.filter((a,i)=>all.some((b,j)=>{
                if(j<=i||a.contains(b)||b.contains(a))return false;
                const x=a.getBoundingClientRect(),y=b.getBoundingClientRect();
                return Math.max(0,Math.min(x.right,y.right)-Math.max(x.left,y.left))*
                   Math.max(0,Math.min(x.bottom,y.bottom)-Math.max(x.top,y.top))>6;
               })).map(x=>({text:x.textContent,cls:x.className}));
               return {count:document.querySelectorAll('[data-b46-btts-candidate-fixture]').length,
                 viewport:innerWidth,documentWidth:document.documentElement.scrollWidth,
                 box,metrics,crowded,html:c?.outerHTML?.slice(0,4400)};
              });
              console.log('B46_BTTS_LAYOUT_BEFORE '+JSON.stringify({viewport:v.n,...m}));
              await page.screenshot({path:'qa-artifacts/btts-layout-before-'+v.n+'.png',fullPage:false});
              await context.close();
            }
          }finally{await browser.close()}
          JS
      - name: Save browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b46-btts-crowding-before-20261122
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
