name: Verify BALL46 Compact Full Market Mobile 20261111
on:
  push:
    branches: [release/ball46-fullmarket-compact-20261111]
    paths: ['fullmarket-compact-prod-20261111/MOBILE_VERIFY_READY']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: release/ball46-fullmarket-compact-20261111}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node fullmarket-compact-prod-20261111/mobile-verify.mjs
