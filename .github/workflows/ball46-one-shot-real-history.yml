name: BALL46 one-shot real league history diagnostic
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-one-shot-real-history.yml']
permissions:
  contents: read
concurrency:
  group: ball46-one-shot-real-history-diagnostic
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One guarded provider request; no retry, no deployment, memory SQLite
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
        run: node qa/prematch-history-20261120/one-shot-real-history.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-shot-real-history
          path: evidence/
