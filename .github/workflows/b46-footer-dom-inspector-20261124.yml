name: BALL46 footer SEO DOM inspector
on:
  push:
    branches: [test/ball46-footer-seo-bottom-20261124]
    paths: ['.github/workflows/b46-footer-dom-inspector-20261124.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - run: node qa/footer-seo-bottom-20261124/dom-probe.mjs
