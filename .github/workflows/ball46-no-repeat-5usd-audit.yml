name: BALL46 native 5USD repeat-call read-only audit
on:
  push:
    branches: [stage/ball46-multisource-v5-20261017]
    paths: [.github/workflows/ball46-no-repeat-5usd-audit.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read exact deployed Engine source and inspect settlement-only API path
        run: |
          node - <<'NODE'
          (async()=>{
            const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ID+'/workers/scripts/nomadtips3-engine-343';
            const r=await fetch(url,{headers:{Authorization:'Bearer '+process.env.CF_TOKEN}});
            if(!r.ok)throw Error('CANNOT_READ_ACTIVE_ENGINE_'+r.status);
            const s=await r.text();
            function snippet(name,until=10000){
              const at=s.indexOf(name);
              if(at<0)return console.log('NOT_FOUND',name);
              let tail=s.slice(at,at+until);
              // Only print function-scope source; no long keys or literal auth.
              tail=tail.replace(/(['"])[A-Za-z0-9_-]{26,}\1/g,'[REDACTED]');
              console.log('ENGINE_SOURCE_'+name,tail.slice(0,until));
            }
            snippet('async autoReconcileMissingFinals()',8500);
            snippet('function phase2IsEarly(',1000);
            snippet('async fetchMissingFinal',3800);
            snippet('async scanIfDue(',1500);
            snippet('async reconcileExternalFinal(request)',4700);
          })().catch(e=>{console.error('READ_ONLY_AUDIT_FAILED',e.message);process.exit(1)});
          NODE
