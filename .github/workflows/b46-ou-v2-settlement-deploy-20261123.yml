name: BALL46 O/U V2 settled TEST guarded integration
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths:
      - .github/workflows/b46-ou-v2-settlement-deploy-20261123.yml
      - qa/prematch-history-20261120/deploy-ou-v2-settlement-test-20261123.mjs
permissions: {contents: read}
concurrency:
  group: ball46-prematch-only-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Pure settlement, EU Asian price and existing UI/1X2 regression with no provider calls
        run: |
          node --check qa/prematch-history-20261120/deploy-ou-v2-settlement-test-20261123.mjs
          node --check qa/prematch-history-20261120/patch-priced-ou-into-existing-prematch-ui-test-20261123.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-v2-settlement.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/patch-priced-ou-into-existing-prematch-ui.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/prematch-ou-engine-v1.test.mjs
      - name: Guarded TEST Worker only deploy with preserved original modules and cloud workers
        run: node qa/prematch-history-20261120/deploy-ou-v2-settlement-test-20261123.mjs
