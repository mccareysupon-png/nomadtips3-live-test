name: Ball46 Pending final recovery followup
on:
  push:
    branches: [audit/ball46-live-engine-corners-ou-20261010]
    paths: ['.github/workflows/recover-ball46-pending-followup-20261010.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finished-batch-followup:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
      BATCH_PAGES: '2,1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ball46-live-engine-corners-ou-20261010
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate recovery script
        run: node --check .github/scripts/recover_ball46_pending_batch_20261010.mjs
      - name: Verify and settle remaining finished matches from latest bulk result pages
        run: node .github/scripts/recover_ball46_pending_batch_20261010.mjs
      - name: Preserve recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-recovery-followup-${{ github.run_id }}
          path: |
            batch-recovery-baseline.json
            batch-recovery-report.json
          if-no-files-found: warn
