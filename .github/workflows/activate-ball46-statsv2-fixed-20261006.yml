name: Activate Ball46 Statistics V2 Fixed 20261006
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-ball46-statsv2-fixed-20261006.yml'
permissions:
  contents: read
jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ball46-activate-statsv2-fixed-20261006
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Activate fixed Statistics V2 candidate
        working-directory: deploy-assets/activate-statsv2-fixed-20261006
        run: node run.mjs
