name: DIAG Web Recovery Temp

on:
  push:
    branches: ['diag/web-recovery-20260905']
    paths:
      - '.github/workflows/diag-web-recovery-temp.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe NOMAD routing
        shell: bash
        run: |
          set +e
          echo '=== DNS ==='
          dig +short www.nomadtips3.com A || true
          dig +short www.nomadtips3.com AAAA || true
          dig +short www.nomadtips3.com CNAME || true
          echo '=== PROBES ==='
          for u in \
            'https://www.nomadtips3.com/' \
            'https://www.nomadtips3.com/__nomad_release' \
            'https://www.nomadtips3.com/nomad-live-342/index.html' \
            'https://www.nomadtips3.com/soccer-predictions/' \
            'https://www.nomadtips3.com/prediction2/' \
            'https://mccareysupon-png.github.io/nomadtips3-live-test/' \
            'https://mccareysupon-png.github.io/nomadtips3-live-test/nomad-live-342/index.html' \
            'https://nomadtips3-live-web-production-canary.mccarey-supon.workers.dev/__nomad_release' \
            'https://nomadtips3-live-engine.mccarey-supon.workers.dev/health'; do
            echo "--- $u"
            curl -sS -L --max-time 20 -o /tmp/body -D /tmp/headers -w 'HTTP=%{http_code} IP=%{remote_ip} TYPE=%{content_type} TIME=%{time_total}\n' "$u" || true
            head -c 220 /tmp/body 2>/dev/null | tr '\n' ' '; echo
          done
