name: BALL46 Featured and Flag Stable V13 — Guarded Deploy
on:
  push:
    branches: [fix/ball46-v13-flicker-guard-diagnostics-20261023]
    paths:
      - '.github/workflows/ball46-v13-stable-featured-deploy.yml'
      - 'deploy-assets/featured-flicker-v13/feature-stable-patch.mjs'
      - 'deploy-assets/featured-flicker-v13/hide-globe.css'
      - 'deploy-assets/featured-flicker-v13/deploy-v13.mjs'
permissions: {contents: read}
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check renderer transforms and browser dependencies
        working-directory: deploy-assets/featured-flicker-v13
        run: |
          set -euo pipefail
          node --check feature-stable-patch.mjs
          node --check deploy-v13.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Pin active Statistics Worker, test unchanged UI tree/flag and deploy if safe
        working-directory: deploy-assets/featured-flicker-v13
        run: node deploy-v13.mjs
      - name: Preserve before candidate and Production proof with rollback report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-featured-v13-flag-stable-production-proof
          path: deploy-assets/featured-flicker-v13/proof/
          retention-days: 30
          if-no-files-found: warn