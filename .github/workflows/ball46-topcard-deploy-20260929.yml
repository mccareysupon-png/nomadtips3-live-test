name: ONE SHOT - Ball46 Top Card Deploy 20260929

on:
  push:
    branches:
      - work/ball46-topcard-details-20260929
    paths:
      - '.github/workflows/ball46-topcard-deploy-20260929.yml'

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-topcard-details-20260929
      - uses: actions/download-artifact@v4
        with:
          name: ball46-topcard-predeploy-36510940761
          path: /tmp/b46-predeploy
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36510940761
      - name: Prepare browser verifier before any Production mutation
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Deploy exact three-file top-card patch with race guards
        shell: bash
        run: bash .github/scripts/ball46_topcard_deploy_20260929.sh
      - name: Verify actual Production in desktop tablet mobile and shared Statistics Signal views
        run: node .github/scripts/ball46_topcard_post_browser_20260929.js
      - name: Guarded rollback to exact predeploy 79-asset snapshot on any post-deploy failure
        if: failure()
        shell: bash
        run: bash .github/scripts/ball46_topcard_rollback_20260929.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-topcard-deploy-${{ github.run_id }}
          path: |
            /tmp/b46-topcard-deploy
            /tmp/b46-topcard-post-browser
            /tmp/b46-topcard-rollback
          if-no-files-found: ignore
          retention-days: 30
