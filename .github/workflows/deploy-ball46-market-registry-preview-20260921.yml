name: Deploy Ball46 Market Registry Preview 20260921

on:
  push:
    branches: [work/ball46-singlepage-workspace-20260921]
    paths:
      - '.github/workflows/deploy-ball46-market-registry-preview-20260921.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PREVIEW_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev
  BASELINE_SHA: 179eeec2d4aefb12592b036688ab42386bcfb609

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard odds and backend core
        run: |
          set -euo pipefail
          for p in workers/nomadtips3-343-preview/src/index.js workers/nomadtips3-engine-343/src/index.js nomad-live-343/dashboard-v2-tune.js nomad-live-343/bulk-odds-compat-343.js nomad-live-343/full-market-bookmaker-343.js nomad-live-343/live-summary-full-odds-343.js; do
            git diff --quiet "$BASELINE_SHA"..HEAD -- "$p" || { echo "FORBIDDEN CORE CHANGE: $p"; exit 1; }
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate complete static market registry
        run: |
          set -euo pipefail
          node --check nomad-live-343/market-registry-343.js
          node --check nomad-live-343/singlepage-workspace-343.js
          ! grep -Fq 'fetch(' nomad-live-343/market-registry-343.js
          ! grep -Fq 'setInterval' nomad-live-343/market-registry-343.js
          grep -Fq 'market-registry-343.js?v=343-market-registry-v1' nomad-live-343/index.html
          grep -Fq 'data-sp-variant-filters' nomad-live-343/index.html
          grep -Fq 'function renderVariants()' nomad-live-343/singlepage-workspace-343.js
          for k in ft_1x2 ft_ah ft_over ft_under ht_1x2 ht_ah ht_over ht_under ft_corner_over ft_corner_under ht_corner_over ht_corner_under ft_corner_ah ft_cards_over ft_cards_under ft_cards_ah ft_btts_yes ft_btts_no; do
            grep -Fq "$k" nomad-live-343/market-registry-343.js || { echo "MISSING MARKET $k"; exit 1; }
          done
          ! grep -Fq '/api/engine/signals' nomad-live-343/signal-next.js
          ! grep -Fq 'setInterval' nomad-live-343/signal-next.js
          grep -Fq 'LEFT RAIL GEOMETRY LOCK V3' nomad-live-343/singlepage-workspace-343.css

      - name: Dry-run preview
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc

      - name: Deploy preview
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Smoke registry preview
        run: |
          set -euo pipefail
          sleep 4
          curl -fsS --max-time 30 "$PREVIEW_URL/?registry=$GITHUB_RUN_ID" -o /tmp/home.html
          grep -Fq 'market-registry-343.js?v=343-market-registry-v1' /tmp/home.html
          grep -Fq 'data-sp-variant-filters' /tmp/home.html
          curl -fsS --max-time 30 "$PREVIEW_URL/market-registry-343.js?registry=$GITHUB_RUN_ID" -o /tmp/registry.js
          node --check /tmp/registry.js
          curl -fsS --max-time 30 "$PREVIEW_URL/api/engine/board?registry=$GITHUB_RUN_ID" -o /tmp/board.json
          curl -fsS --max-time 30 "$PREVIEW_URL/api/engine/statistics?registry=$GITHUB_RUN_ID" -o /tmp/stats.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/board.json','utf8'));
          const t=JSON.parse(fs.readFileSync('/tmp/stats.json','utf8'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures)) throw Error('board unhealthy');
          if(t?.ok!==true||!Array.isArray(t?.rows)) throw Error('stats unhealthy');
          console.log('MARKET REGISTRY PREVIEW PASS',{fixtures:b.fixtures.length,statistics:t.rows.length});
          NODE
