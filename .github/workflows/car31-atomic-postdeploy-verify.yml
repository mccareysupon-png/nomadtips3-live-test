name: CAR 3.1 Atomic Post-Deploy Verify

on:
  push:
    branches:
      - verify/car31-atomic-postdeploy-20260816
    paths:
      - .github/workflows/car31-atomic-postdeploy-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      WORKER: https://nomadtips3-car31-goaloo.mccarey-supon.workers.dev
      DEPLOYED_AT: 2026-08-16T07:25:00Z
    steps:
      - name: Wait for fresh post-PR74 Cron cycle
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            curl -fsS "$WORKER/health" -o /tmp/health.json
            if python - <<'PY'
          import json, os, sys
          from datetime import datetime
          h=json.load(open('/tmp/health.json', encoding='utf-8'))
          last=datetime.fromisoformat(h['lastCycle'].replace('Z','+00:00')) if h.get('lastCycle') else None
          deployed=datetime.fromisoformat(os.environ['DEPLOYED_AT'].replace('Z','+00:00'))
          pipe=h.get('coreStatsPipe') or {}
          fresh=bool(last and last>deployed)
          print('FRESH_CHECK', json.dumps({'lastCycle':h.get('lastCycle'),'fresh':fresh,'pipe':pipe.get('status')}))
          sys.exit(0 if fresh and pipe.get('status')=='DIRECT' else 1)
          PY
            then break; fi
            if [ "$i" = 12 ]; then exit 1; fi
            sleep 15
          done

      - name: Compare worker values with raw Goaloo detailIn
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$WORKER/health" -o /tmp/health.json
          curl -fsS "$WORKER/live" -o /tmp/live.json
          curl -fsS "https://live10.goaloo28.com/gf/data/detailIn.js?t=$(date +%s)" -o /tmp/detailIn.js
          python - <<'PY'
          import json,re
          h=json.load(open('/tmp/health.json',encoding='utf-8'))
          live=json.load(open('/tmp/live.json',encoding='utf-8'))
          src=open('/tmp/detailIn.js',encoding='utf-8',errors='replace').read()
          ids=['3066631','2960845','2960846','2960847']
          core={0:'corners',4:'shots',5:'shots_on_target',6:'attacks',7:'dangerous_attacks',11:'possession'}
          def detail(mid):
              m=re.search(r'tT_f\['+re.escape(mid)+r'\]\s*=\s*(\[[\s\S]*?\])\s*;',src)
              if not m:return None
              out={}
              for row in re.finditer(r"\[\s*(\d+)\s*,\s*['\"]([^'\"]*)['\"]\s*,\s*['\"]([^'\"]*)['\"]",m.group(1)):
                  code=int(row.group(1))
                  if code in core:
                      def n(v):
                          try:return float(v.replace('%',''))
                          except:return None
                      out[core[code]]={'home':n(row.group(2)),'away':n(row.group(3))}
              return out
          byid={str(m.get('sourceMatchId')):m for m in (live.get('matches') or [])}
          print('RAW_DETAILIN_COMPARISON')
          for mid in ids:
              m=byid.get(mid)
              print(json.dumps({
                  'id':mid,
                  'worker':((m or {}).get('stats') or {}),
                  'workerCoreSource':((m or {}).get('enrichment') or {}).get('coreStats'),
                  'rawDetailIn':detail(mid)
              },ensure_ascii=False))
          print('HEALTH_PIPE')
          print(json.dumps(h.get('coreStatsPipe'),indent=2,ensure_ascii=False))
          PY
