name: Ball46 Featured Match Force Restore 20261004

on:
  push:
    branches: [work/featured-signal-dark-card-20261004]
    paths:
      - '.github/workflows/ball46-featured-signal-dark-card-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-production-featured-match-force-restore
  cancel-in-progress: false

env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  BALL46_URL: https://ball46.com
  RESTORE_VERSION: 56d4c51f-2cba-4025-ac17-c9627c39d7d5

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Guard current Production is restore target
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=5" -H "$AUTH" -o /tmp/d-current.json
          node <<'NODE'
          const fs=require('fs'),j=JSON.parse(fs.readFileSync('/tmp/d-current.json','utf8')),d=j.result?.deployments?.[0];
          const active=String(d?.versions?.[0]?.version_id||'');
          if(j.success!==true||!d||d.versions?.length!==1||Number(d.versions[0].percentage)!==100) throw Error('PRODUCTION_LOCK_FAILED');
          if(active!==process.env.RESTORE_VERSION) throw Error('PRODUCTION_MOVED_ABORT active='+active);
          console.log('RESTORE_TARGET_ACTIVE='+active);
          NODE

      - name: Clone known-good restore version exactly
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          V="$RESTORE_VERSION"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/workers/$SCRIPT_NAME/versions/$V?include=modules" -H "$AUTH" -o /tmp/v-restore.json
          node <<'NODE'
          const fs=require('fs'),path=require('path'),v=JSON.parse(fs.readFileSync('/tmp/v-restore.json','utf8'));if(v.success!==true)throw Error('VERSION_FETCH_FAILED');const r=v.result;
          if(r.main_module!=='index.js'||!Array.isArray(r.modules)||!r.modules.length)throw Error('WORKER_LAYOUT_CHANGED');
          fs.mkdirSync('/tmp/modules',{recursive:true});
          for(const m of r.modules){if(!m.name||!m.content_base64||!m.content_type)throw Error('BAD_MODULE:'+m.name);const p=path.join('/tmp/modules',m.name);fs.mkdirSync(path.dirname(p),{recursive:true});fs.writeFileSync(p,Buffer.from(m.content_base64,'base64'));}
          fs.writeFileSync('/tmp/meta.json',JSON.stringify(r.modules.map(m=>({name:m.name,content_type:m.content_type}))));
          const src=fs.readFileSync('/tmp/modules/index.js','utf8');
          if(src.includes('B46_FEATURED_MATCH_CAMOUFLAGE_20261004')) throw Error('RESTORE_VERSION_CONTAINS_CAMOUFLAGE_STOP');
          if(!src.includes('B46_FEATURED_MATCH_COMPACT_40_20261004')) throw Error('KNOWN_GOOD_MARKER_MISSING');
          console.log('KNOWN_GOOD_MODULES='+r.modules.length);
          NODE
          node --check /tmp/modules/index.js

      - name: Re-publish known-good bytes as fresh Production version
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=5" -H "$AUTH" -o /tmp/d-race.json
          node <<'NODE'
          const fs=require('fs'),j=JSON.parse(fs.readFileSync('/tmp/d-race.json','utf8')),d=j.result?.deployments?.[0],active=String(d?.versions?.[0]?.version_id||'');
          if(j.success!==true||!d||d.versions?.length!==1||Number(d.versions[0].percentage)!==100||active!==process.env.RESTORE_VERSION) throw Error('PRODUCTION_MOVED_ABORT active='+active);
          console.log('RACE_GUARD_PASS='+active);
          NODE
          echo '{"main_module":"index.js"}' >/tmp/upload-meta.json
          mapfile -t args < <(node <<'NODE'
          const a=JSON.parse(require('fs').readFileSync('/tmp/meta.json','utf8'));for(const m of a)console.log(`-F\n${m.name}=@/tmp/modules/${m.name};type=${m.content_type}`);
          NODE
          )
          CURL_ARGS=();i=0;while [ $i -lt ${#args[@]} ];do CURL_ARGS+=("${args[$i]}" "${args[$((i+1))]}");i=$((i+2));done
          curl -fsS -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/content" -H "$AUTH" -F 'metadata=</tmp/upload-meta.json;type=application/json' "${CURL_ARGS[@]}" -o /tmp/update.json
          node -e "const j=require('/tmp/update.json');if(j.success!==true)throw Error('CONTENT_UPDATE_FAILED:'+JSON.stringify(j.errors||[]));console.log('CONTENT_UPDATE_OK')"
          candidate=''
          for n in $(seq 1 15); do
            curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=5" -H "$AUTH" -o /tmp/d-candidate.json
            candidate=$(node -e "const j=require('/tmp/d-candidate.json'),old=process.env.RESTORE_VERSION,v=String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||'');if(v&&v!==old)process.stdout.write(v)")
            [ -n "$candidate" ] && break
            sleep 1
          done
          [ -n "$candidate" ] || { echo NO_NEW_PRODUCTION_VERSION; false; }
          echo "$candidate" >/tmp/candidate-version

      - name: Verify Featured Match is back on live Production
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          candidate=$(cat /tmp/candidate-version)
          live=0
          for n in $(seq 1 24); do
            curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=5" -H "$AUTH" -o /tmp/d-live.json
            active=$(node -e "const j=require('/tmp/d-live.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))")
            [ "$active" = "$candidate" ] || { echo PRODUCTION_MOVED_DURING_VERIFY=$active; false; }
            nonce="${GITHUB_RUN_ID}-$n-$(date +%s%N)"
            curl -fsS -L --max-time 25 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$BALL46_URL/dashboard-v2-tune.css?force-restore=$nonce" -o /tmp/css-live.css
            if ! grep -Fq 'B46_FEATURED_MATCH_CAMOUFLAGE_20261004' /tmp/css-live.css && grep -Fq 'B46_FEATURED_MATCH_COMPACT_40_20261004' /tmp/css-live.css; then live=1; break; fi
            sleep 2
          done
          [ "$live" = 1 ] || { echo FEATURED_MATCH_NOT_RESTORED_LIVE; false; }
          nonce="${GITHUB_RUN_ID}-home-$(date +%s%N)"
          curl -fsS -L --max-time 25 -H 'Cache-Control: no-cache' "$BALL46_URL/?force-restore=$nonce" -o /tmp/home-live.html
          curl -fsS --max-time 25 "$BALL46_URL/api/engine/health?force-restore=$nonce" -o /tmp/engine.json
          curl -fsS --max-time 25 "$BALL46_URL/api/full-market/health?force-restore=$nonce" -o /tmp/full.json
          node <<'NODE'
          const fs=require('fs'),h=fs.readFileSync('/tmp/home-live.html','utf8'),e=JSON.parse(fs.readFileSync('/tmp/engine.json','utf8')),f=JSON.parse(fs.readFileSync('/tmp/full.json','utf8'));
          if(!h.includes('<section class="side-card featured-card" data-featured>')) throw Error('FEATURED_CARD_DOM_MISSING');
          if(e.ok!==true||f.ok!==true) throw Error('BACKEND_UNHEALTHY_AFTER_RESTORE');
          console.log('FEATURED_MATCH_RESTORED_LIVE');
          NODE
          echo FINAL_PRODUCTION=$candidate
          echo FORCE_RESTORE_SUCCESS
