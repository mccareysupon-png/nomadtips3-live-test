name: Ball46 Under-Search Scorebar Position Scout 20261005

on:
  push:
    branches: [work/featured-signal-dark-card-20261004]
    paths:
      - '.github/workflows/ball46-featured-signal-dark-card-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SCRIPT_NAME: ball46-production
    steps:
      - name: Prove exact DOM slot and owner for the card row below search
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=5" -H "$AUTH" -o /tmp/d.json
          V=$(node -e "const j=require('/tmp/d.json'),d=j.result?.deployments?.[0];if(j.success!==true||!d||d.versions?.length!==1||Number(d.versions[0].percentage)!==100)process.exit(2);process.stdout.write(String(d.versions[0].version_id))")
          echo CURRENT_PRODUCTION=$V
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/workers/$SCRIPT_NAME/versions/$V?include=modules" -H "$AUTH" -o /tmp/v.json
          node <<'NODE'
          const fs=require('fs');
          const v=JSON.parse(fs.readFileSync('/tmp/v.json','utf8'));if(v.success!==true)throw Error('VERSION_FETCH_FAILED');
          const texts=new Map((v.result?.modules||[]).map(m=>[m.name,Buffer.from(m.content_base64||'','base64').toString('utf8')]));
          const html=texts.get('assets/index.html')||'';
          const js=texts.get('index.js')||'';
          const slot='data-workspace-scorebar-slot';
          const p=html.indexOf(slot);
          if(p<0)throw Error('SCOREBAR_SLOT_NOT_FOUND');
          console.log('SCOREBAR_SLOT_HTML_INDEX='+p);
          console.log('=== SLOT_CONTEXT ===');
          console.log(html.slice(Math.max(0,p-5000),Math.min(html.length,p+4000)).replace(/>\s+</g,'><'));
          const patterns=['data-search','search-box','search-input','type="search"','placeholder="Search','placeholder="Find','data-query','workspace-search'];
          for(const t of patterns){let q=html.indexOf(t);if(q>=0){console.log('\n=== SEARCH_CONTEXT '+t+' @'+q+' ===');console.log(html.slice(Math.max(0,q-1800),Math.min(html.length,q+2600)).replace(/>\s+</g,'><'));}}
          const r=js.indexOf('function renderWorkspaceScorebar');
          if(r<0)throw Error('RENDER_OWNER_NOT_FOUND');
          console.log('\n=== RENDER_OWNER ===');
          console.log(js.slice(r,r+9000));
          NODE
