name: Ball46 Original Right Rail History Scout 20261004

on:
  push:
    branches: [work/featured-signal-dark-card-20261004]
    paths:
      - '.github/workflows/ball46-featured-signal-dark-card-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production

jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Scan known Production versions for original right rail
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          versions=(
            e0a999a4-4216-47e7-98ca-b6ff4c67ee31
            245b2da2-34fb-43fc-bdd2-926e7c7ac365
            0f4a94b4-d676-4d62-b4dd-aa409f23f678
            66a4aac0-58be-42bc-b981-0402f15ff6c4
            7b110a2c-e056-456c-a4d7-805b8c4a2de2
            ee9a5d17-c859-4126-8fba-b705fd41aba4
            2beef25a-5df6-427e-89bf-b68c545759c3
          )
          for V in "${versions[@]}"; do
            echo "=== VERSION $V ==="
            curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/workers/$SCRIPT_NAME/versions/$V?include=modules" -H "$AUTH" -o "/tmp/$V.json"
            V="$V" node <<'NODE'
          const fs=require('fs');
          const v=JSON.parse(fs.readFileSync(`/tmp/${process.env.V}.json`,'utf8'));
          if(v.success!==true){console.log('FETCH_FAILED');process.exit(0)}
          const mods=v.result?.modules||[];
          const terms=['right-rail','featured-card','data-featured','renderFeatured','FEATURED MATCH','LIVE PREDICTION','LIVE OVERVIEW'];
          console.log('MODULES='+mods.length+' MAIN='+v.result?.main_module);
          for(const m of mods){
            const s=Buffer.from(m.content_base64||'','base64').toString('utf8');
            const hits=terms.filter(t=>s.includes(t));
            if(hits.length){
              console.log('HIT module='+m.name+' terms='+hits.join(','));
              for(const t of hits){
                const i=s.indexOf(t),a=Math.max(0,i-220),b=Math.min(s.length,i+420);
                console.log('SNIP '+t+' :: '+s.slice(a,b).replace(/\s+/g,' ').slice(0,700));
              }
            }
          }
          NODE
          done
