name: Ball46 Featured Match Compact Scout 20261004

on:
  push:
    branches: [work/featured-signal-dark-card-20261004]
    paths:
      - '.github/workflows/ball46-featured-signal-dark-card-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-featured-match-compact-scout
  cancel-in-progress: false

env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  BALL46_URL: https://ball46.com

jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Inspect exact current Production card sizing rules
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=5" -H "$AUTH" -o /tmp/d.json
          node <<'NODE'
          const fs=require('fs'),j=JSON.parse(fs.readFileSync('/tmp/d.json','utf8')),d=j.result?.deployments?.[0];
          if(j.success!==true||!d||d.versions?.length!==1||Number(d.versions[0].percentage)!==100)throw Error('PRODUCTION_LOCK_FAILED');
          const v=String(d.versions[0].version_id);console.log('EXACT_ACTIVE_VERSION='+v);
          NODE
          nonce="${GITHUB_RUN_ID}-$(date +%s%N)"
          curl -fsS -L --max-time 25 "$BALL46_URL/?compact-scout=$nonce" -o /tmp/home.html
          node <<'NODE'
          const fs=require('fs'),h=fs.readFileSync('/tmp/home.html','utf8');
          const m=h.match(/<section class="side-card featured-card" data-featured>[\s\S]*?<\/section>/);
          if(!m)throw Error('FEATURED_CARD_DOM_NOT_FOUND');
          console.log('FEATURED_DOM='+m[0]);
          const hrefs=[...h.matchAll(/<link[^>]+rel=["']stylesheet["'][^>]+href=["']([^"']+)["']/gi)].map(x=>x[1]);
          console.log('STYLESHEETS='+JSON.stringify(hrefs));
          fs.writeFileSync('/tmp/hrefs.json',JSON.stringify(hrefs));
          NODE
          node <<'NODE'
          const fs=require('fs');const hs=JSON.parse(fs.readFileSync('/tmp/hrefs.json','utf8'));
          for(const [i,h] of hs.entries()){let u;try{u=new URL(h,'https://ball46.com').href}catch{continue}console.log(`${i}|${u}`)}
          NODE
          while IFS='|' read -r i url; do
            curl -fsS -L --max-time 25 "$url?compact-scout=$nonce-$i" -o "/tmp/css-$i.css" || true
          done < <(node -e "const h=require('/tmp/hrefs.json');h.forEach((x,i)=>console.log(i+'|'+new URL(x,'https://ball46.com').href))")
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const files=fs.readdirSync('/tmp').filter(x=>/^css-\d+\.css$/.test(x)).sort((a,b)=>+a.match(/\d+/)[0]-+b.match(/\d+/)[0]);
          const needles=['.side-card','.featured-card','[data-featured]','.card-title','.feature-score','.feature-facts','.feature-signal','.feature-stats','.feature-events','data-featured'];
          for(const f of files){const s=fs.readFileSync('/tmp/'+f,'utf8');console.log('\n=== '+f+' bytes='+s.length+' ===');
            const rules=s.match(/[^{}]+\{[^{}]*\}/g)||[];
            for(const r of rules){if(needles.some(n=>r.includes(n)))console.log(r.replace(/\s+/g,' ').trim());}
          }
          console.log('FEATURED_COMPACT_SCOUT_SUCCESS');
          NODE
