name: Ball46 Featured Match Emergency Rollback 20261004

on:
  push:
    branches: [work/featured-signal-dark-card-20261004]
    paths:
      - '.github/workflows/ball46-featured-signal-dark-card-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-production-featured-match-rollback
  cancel-in-progress: false

env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  BALL46_URL: https://ball46.com
  BAD_VERSION: e1715840-a7cf-473f-be7f-35721a4a5b6b
  RESTORE_VERSION: 56d4c51f-2cba-4025-ac17-c9627c39d7d5

jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Guard exact current Production
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=5" -H "$AUTH" -o /tmp/deployments.json
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          const d=j.result?.deployments?.[0];
          const active=String(d?.versions?.[0]?.version_id||'');
          if(j.success!==true||!d||d.versions?.length!==1||Number(d.versions[0].percentage)!==100) throw Error('PRODUCTION_LOCK_FAILED');
          if(active!==process.env.BAD_VERSION) throw Error('PRODUCTION_MOVED_ABORT active='+active);
          console.log('ROLLBACK_GUARD_PASS='+active);
          NODE

      - name: Restore previous Production version
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          node <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('/tmp/rollback.json', JSON.stringify({
            strategy:'percentage',
            versions:[{version_id:process.env.RESTORE_VERSION,percentage:100}],
            annotations:{'workers/message':'Emergency rollback: restore Featured Match card'}
          }));
          NODE
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments" \
            -H "$AUTH" -H 'content-type: application/json' --data-binary @/tmp/rollback.json -o /tmp/rollback-response.json
          node -e "const j=require('/tmp/rollback-response.json');if(j.success!==true)throw Error('ROLLBACK_POST_FAILED:'+JSON.stringify(j.errors||[]));console.log('ROLLBACK_POST_OK')"

      - name: Verify card restored and systems unchanged
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          ok=0
          for n in $(seq 1 20); do
            curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=5" -H "$AUTH" -o /tmp/live.json
            active=$(node -e "const j=require('/tmp/live.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))")
            if [ "$active" = "$RESTORE_VERSION" ]; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = 1 ] || { echo ROLLBACK_NOT_ACTIVE; false; }

          nonce="${GITHUB_RUN_ID}-$(date +%s%N)"
          curl -fsS -L --max-time 25 "$BALL46_URL/dashboard-v2-tune.css?rollback=$nonce" -o /tmp/css.css
          curl -fsS -L --max-time 25 "$BALL46_URL/?rollback=$nonce" -o /tmp/home.html
          curl -fsS --max-time 25 "$BALL46_URL/api/engine/health?rollback=$nonce" -o /tmp/engine.json
          curl -fsS --max-time 25 "$BALL46_URL/api/full-market/health?rollback=$nonce" -o /tmp/full.json
          node <<'NODE'
          const fs=require('fs');
          const css=fs.readFileSync('/tmp/css.css','utf8');
          const home=fs.readFileSync('/tmp/home.html','utf8');
          const e=JSON.parse(fs.readFileSync('/tmp/engine.json','utf8'));
          const f=JSON.parse(fs.readFileSync('/tmp/full.json','utf8'));
          if(css.includes('B46_FEATURED_MATCH_CAMOUFLAGE_20261004')) throw Error('CAMOUFLAGE_STILL_PRESENT');
          if(!css.includes('B46_FEATURED_MATCH_COMPACT_40_20261004')) throw Error('PREVIOUS_FEATURED_STYLE_NOT_RESTORED');
          if(!home.includes('<section class="side-card featured-card" data-featured>')) throw Error('FEATURED_CARD_DOM_MISSING');
          if(e.ok!==true||f.ok!==true) throw Error('BACKEND_UNHEALTHY_AFTER_ROLLBACK');
          console.log('FEATURED_MATCH_RESTORED');
          console.log('FINAL_PRODUCTION='+process.env.RESTORE_VERSION);
          NODE
