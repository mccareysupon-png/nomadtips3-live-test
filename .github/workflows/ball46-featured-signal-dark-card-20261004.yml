name: Ball46 Featured Horizontal Card DOM Scout 20261004

on:
  push:
    branches: [work/featured-signal-dark-card-20261004]
    paths:
      - '.github/workflows/ball46-featured-signal-dark-card-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  BALL46_URL: https://ball46.com

jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read exact current Production HTML around Featured Match
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=5" -H "$AUTH" -o /tmp/d.json
          node <<'NODE'
          const fs=require('fs'),j=JSON.parse(fs.readFileSync('/tmp/d.json','utf8')),d=j.result?.deployments?.[0];if(j.success!==true||!d||d.versions?.length!==1||Number(d.versions[0].percentage)!==100)throw Error('PRODUCTION_LOCK_FAILED');console.log('EXACT_ACTIVE_VERSION='+d.versions[0].version_id);
          NODE
          nonce="${GITHUB_RUN_ID}-$(date +%s%N)"
          curl -fsS -L --max-time 25 "$BALL46_URL/?featured-dom-scout=$nonce" -o /tmp/home.html
          curl -fsS -L --max-time 25 "$BALL46_URL/signal.html?featured-dom-scout=$nonce" -o /tmp/signal.html
          node <<'NODE'
          const fs=require('fs');
          for(const name of ['home','signal']){
            const s=fs.readFileSync('/tmp/'+name+'.html','utf8');const needles=['data-featured-home','data-featured-league','data-featured-signal'];
            for(const n of needles){const i=s.indexOf(n);if(i<0)continue;console.log(`===${name.toUpperCase()} ${n} CONTEXT===`);console.log(s.slice(Math.max(0,i-1800),Math.min(s.length,i+2600)));}
          }
          console.log('FEATURED_DOM_SCOUT_SUCCESS');
          NODE
