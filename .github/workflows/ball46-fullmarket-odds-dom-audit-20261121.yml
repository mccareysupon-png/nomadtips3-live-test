name: BALL46 Full Market Bookmaker DOM audit read-only
on:
  push:
    branches: [test/ball46-fullmarket-odds-v3-20261121]
    paths:
      - '.github/workflows/ball46-fullmarket-odds-dom-audit-20261121.yml'
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Identify actual Full Market controls/rows and quote identity without writing
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch();
          const bases=[['production','https://ball46.com/?view=live'],['existing-test','https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev/?view=live']];
          const summarize=()=>({
           url:location.pathname+location.search,view:document.body?.dataset.workspaceView,
           headings:[...document.querySelectorAll('h1,h2,h3,button,[role=button],.match-expanded,.expand-flow-card,[class*=bookmaker],[class*=full-market],[class*=fullmarket],[class*=odds]')].filter(e=>e.getBoundingClientRect().width>10).slice(0,95).map(e=>({tag:e.tagName,cls:String(e.className).slice(0,150),text:e.textContent?.trim().replace(/\s+/g,' ').slice(0,125),title:e.getAttribute('title'),data:[...e.attributes].filter(a=>a.name.startsWith('data-')).map(a=>[a.name,a.value]).slice(0,5)})),
           row:document.querySelector('.status-section[data-status-section="live"] .match-row')?.outerHTML.slice(0,1500),
           fullNodes:[...document.querySelectorAll('*')].filter(e=>e.getBoundingClientRect().width>80&&/bookmaker|full market|all odds|full odds/i.test((e.textContent||'').trim())&&e.textContent?.length<120).slice(0,30).map(e=>({tag:e.tagName,cls:String(e.className),text:e.textContent.trim().slice(0,120),html:e.outerHTML.slice(0,380)}))
          });
          try{
           for(const [name,url] of bases){
            const p=await browser.newPage({viewport:{width:1440,height:950},serviceWorkers:'block'});
            const responses=[];p.on('response',r=>{if(/full.market|odds|bookmaker|market/i.test(r.url()))responses.push({url:new URL(r.url()).pathname,status:r.status()})});
            await p.addInitScript(()=>{try{localStorage.setItem('nomad343_dashboard_theme_v1','dark')}catch{}});
            await p.route('**/*',r=>['GET','HEAD'].includes(r.request().method())?r.continue():r.abort());
            await p.goto(url,{waitUntil:'domcontentloaded',timeout:65000});
            await p.waitForFunction(()=>document.querySelectorAll('.status-section[data-status-section="live"] .match-row').length>0,null,{timeout:50000}).catch(()=>{});
            await p.waitForTimeout(1600);
            const before=await p.evaluate(summarize);
            console.log('B46_FULLMARKET_AUDIT '+JSON.stringify({name,phase:'before',before,responses}).slice(0,15000));
            const row=p.locator('.status-section[data-status-section="live"] .match-row').first();
            if(await row.count()){
             await row.click({position:{x:95,y:35},force:true}).catch(()=>{});
             await p.waitForTimeout(1000);
             const clicked=await p.evaluate(summarize);
             console.log('B46_FULLMARKET_AUDIT '+JSON.stringify({name,phase:'after-row-click',clicked,responses}).slice(0,18000));
             const fm=await p.evaluate(()=>[...document.querySelectorAll('button,[role=button],a')].filter(e=>/full market|all book|full odds|odds market/i.test((e.textContent||'').trim())&&e.getBoundingClientRect().width>10).map(e=>({tag:e.tagName,text:e.textContent.trim().slice(0,100),html:e.outerHTML.slice(0,700)})).slice(0,12));
             console.log('B46_FULLMARKET_CONTROLS '+JSON.stringify({name,fm}));
             if(fm.length){
              const btn=p.getByText(/full market|all book|full odds|odds market/i).first();
              await btn.click({force:true}).catch(()=>{});
              await p.waitForTimeout(1400);
              const opened=await p.evaluate(()=>{
               const a=[...document.querySelectorAll('[class*=bookmaker],[class*=full-market],[class*=fullmarket],[class*=odds-table],[class*=market-table],[class*=odd-row],[class*=quote-row]')].filter(e=>e.getBoundingClientRect().height>0);
               return {sample:a.slice(0,45).map(e=>({tag:e.tagName,cls:e.className,html:e.outerHTML.slice(0,2400)})),url:location.pathname+location.search,text:document.body.innerText.slice(-4500)}
              });
              console.log('B46_FULLMARKET_AUDIT '+JSON.stringify({name,phase:'after-full-market',opened,responses}).slice(0,21000));
             }
            }
            await p.close();
           }
          }finally{await browser.close()}
          NODE