name: BALL46 Mobile Featured Match Elevation
on:
  push:
    branches: [work/mobile-featured-elevation-20261020]
    paths: ['mobile-featured-elevation/**', '.github/workflows/mobile-featured-elevation-20261020.yml']
permissions:
  contents: read
concurrency:
  group: ball46-mobile-featured-production
  cancel-in-progress: false
jobs:
  mobile-panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts acorn@8 playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify mobile Featured Match, Desktop unchanged, deploy and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node mobile-featured-elevation/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-featured-elevation-proof
          path: audit/
          retention-days: 30
