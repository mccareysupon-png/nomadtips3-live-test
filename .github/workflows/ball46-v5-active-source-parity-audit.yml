name: BALL46 Engine343 active-source parity read only
on:
  workflow_dispatch:
  push:
    branches:
      - stage/ball46-multisource-v5-20261017
    paths:
      - workers/nomadtips3-engine-343/test/audit-active-parity.mjs
      - .github/workflows/ball46-v5-active-source-parity-audit.yml
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: GET current Worker version and architecture markers; no writes
        run: node workers/nomadtips3-engine-343/test/audit-active-parity.mjs
      - name: Upload safe audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine343-source-parity-readonly
          path: engine343-active-readonly-parity.json
          retention-days: 7
          if-no-files-found: warn
