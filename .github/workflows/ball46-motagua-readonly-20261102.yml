name: BALL46 Motagua signal READ ONLY diagnosis
on:
  push:
    branches: [codex/ball46-statistics-score-columns-20261102]
    paths: ['work/ball46-statistics-score-release-20261102/motagua-readonly-request.json']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: work/ball46-statistics-score-release-20261102
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node motagua-readonly.mjs
      - name: Preserve read-only diagnosis
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnosis/motagua-readonly.json
          git commit -m "Record read-only Motagua AH Away 0 settlement diagnosis [skip ci]"
          git push origin HEAD:codex/ball46-statistics-score-columns-20261102
