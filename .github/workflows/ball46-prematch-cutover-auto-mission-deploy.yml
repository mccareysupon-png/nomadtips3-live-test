name: BALL46 isolated five-trip cutover and automatic Bot deploy
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-prematch-cutover-auto-mission-deploy.yml']
permissions: {contents: read}
concurrency:
  group: ball46-prematch-only-test
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify cutoff mission, history budget and true price source
        run: |
          node --check qa/prematch-history-20261120/prematch-only-worker.mjs
          node --check qa/prematch-history-20261120/deploy-cutover-mission.mjs
          node --check qa/prematch-history-20261120/hub-upcoming-feed.mjs
          node --test qa/prematch-history-20261120/hub-upcoming-feed.test.mjs qa/prematch-history-20261120/history-five-rounds.test.mjs qa/prematch-history-20261120/london-cutoff.test.mjs qa/prematch-history-20261120/normal-hub-monitor.test.mjs qa/prematch-history-20261120/market-1x2.test.mjs qa/prematch-history-20261120/test-pick-ledger.test.mjs
      - name: Deploy only test Worker and verify 5x100 daily mission is serving
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node qa/prematch-history-20261120/deploy-cutover-mission.mjs

# Release final: after five completed history batches, future ticks only refresh Bot and match settlement.
