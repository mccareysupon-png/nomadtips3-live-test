name: TEMP CAR 3.1 Stale Detail Final

on:
  push:
    branches:
      - fix/car31-stale-detail-source-final-20260816

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply minimal stale-detail patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app=Path('car3-1-hybrid-live-engine/web/app.js')
          s=app.read_text()
          def rep(old,new,label):
              global s
              if old in s:
                  s=s.replace(old,new,1); return
              if new in s: return
              raise SystemExit(f'missing target: {label}')

          rep('matches=[],selected=0;','matches=[],selectedId=null;','selection state')
          rep("${i===selected?'active':''}","${m.id===selectedId?'active':''}",'candidate active id')
          rep("document.querySelectorAll('.candidate').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.index);render();});","document.querySelectorAll('.candidate').forEach(b=>b.onclick=()=>{selectedId=matches[Number(b.dataset.index)]?.id||null;render();});",'candidate click id')

          old="function render(){renderMetrics();renderCandidates();if(!matches.length)return;const m=matches[Math.min(selected,matches.length-1)],d=m.serverEngine||localDecision(m);"
          new="function clearDetail(){for(const [id,value] of Object.entries({homeTeam:'—',awayTeam:'—',matchMinute:'—',scoreText:'—',leagueText:'—',signalMinute:'—',liveClock:'—',finalDecision:'WATCH',finalReason:'—'})){const el=$('#'+id);if(el)el.textContent=value;}for(const id of ['sourceRow','statsGrid','pitchStats','evidenceGrid','oddsGrid','events','sourceTrace','gateList']){const el=$('#'+id);if(el)el.innerHTML='';}const p=$('#pressureChart'),d=$('#dangerChart');if(p)p.innerHTML='';if(d)d.innerHTML='';const tag=$('#possessionTag');if(tag)tag.textContent='WAITING FOR LIVE MATCH';const clock=$('#signalClockRow');if(clock)clock.hidden=true;}\nfunction render(){renderMetrics();renderCandidates();if(!matches.length){clearDetail();return;}const m=matches.find(x=>x.id===selectedId)||matches[0];selectedId=m.id;const d=m.serverEngine||localDecision(m);"
          rep(old,new,'clear stale detail')

          old="fetch(`${runtime.workerUrl}/live?t=${Date.now()}`,{cache:'no-store'}).then(r=>r.json())"
          new="fetch(`${runtime.workerUrl}/live?t=${Date.now()}`,{cache:'no-store'}).then(r=>r.json()).catch(()=>({ok:false,generatedAt:null,matches:[]}))"
          rep(old,new,'live fetch failure clears')

          old="snapshots=snaps.snapshots||[];const activeRows=(live.matches||[]).filter(row=>{const status=String(row?.status||'').toUpperCase();return status!=='FT'&&!status.includes('FINISH');});window.__CAR31_LIVE_ROWS__=activeRows;matches=activeRows.map(adapt);if(selected>=matches.length)selected=Math.max(0,matches.length-1);$('#lastUpdate').textContent=live.generatedAt?new Date(live.generatedAt).toLocaleTimeString():'live collector';render();window.dispatchEvent(new CustomEvent('car31:live-updated'));"
          new="snapshots=snaps.snapshots||[];const generated=Date.parse(live.generatedAt||'');const sourceFresh=Boolean(live?.ok)&&Number.isFinite(generated)&&Date.now()-generated<=90000;const activeRows=sourceFresh?(live.matches||[]).filter(row=>{const status=String(row?.status||'').toUpperCase();return status!=='FT'&&!status.includes('FINISH')&&status!=='SCHEDULED'&&status!=='NS';}):[];window.__CAR31_LIVE_ROWS__=activeRows;matches=activeRows.map(adapt);if(!matches.some(m=>m.id===selectedId))selectedId=matches[0]?.id||null;$('#lastUpdate').textContent=live.generatedAt?new Date(live.generatedAt).toLocaleTimeString():'live collector';render();window.dispatchEvent(new CustomEvent('car31:live-updated'));"
          rep(old,new,'fresh active rows stable id')
          app.write_text(s)

          for filename,prefix in [('car3-1-hybrid-live-engine/web/index.html','./'),('car3-1-hybrid-live-engine/monitor/index.html','../web/')]:
              p=Path(filename); html=p.read_text()
              pattern=r'src="'+re.escape(prefix)+r'app\.js(?:\?v=[^"]+)?"'
              html,n=re.subn(pattern,f'src="{prefix}app.js?v=20260816-stale-detail-final"',html,count=1)
              if n!=1: raise SystemExit(f'app cache target missing: {filename}')
              p.write_text(html)
          PY
      - name: Syntax check
        run: node --check car3-1-hybrid-live-engine/web/app.js
      - name: Guard exact source clock untouched
        run: |
          git diff --exit-code origin/main -- car3-1-hybrid-live-engine/web/signal-polish.js
          grep -q "goalooElapsedSeconds" car3-1-hybrid-live-engine/web/signal-polish.js
          grep -q "goalooClock?.verified" car3-1-hybrid-live-engine/web/signal-polish.js
      - name: Guard stale-state fix
        run: |
          grep -q "selectedId" car3-1-hybrid-live-engine/web/app.js
          grep -q "clearDetail" car3-1-hybrid-live-engine/web/app.js
          grep -q "sourceFresh" car3-1-hybrid-live-engine/web/app.js
          grep -q "90000" car3-1-hybrid-live-engine/web/app.js
          grep -q "window.__CAR31_LIVE_ROWS__=activeRows" car3-1-hybrid-live-engine/web/app.js
          grep -q "car31:live-updated" car3-1-hybrid-live-engine/web/app.js
      - name: Verify current source has no ended match leakage
        run: |
          curl -fsS --retry 3 --retry-delay 2 "https://nomadtips3-car31-goaloo.mccarey-supon.workers.dev/live?t=$(date +%s)" -o /tmp/live.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/live.json').read_text())
          rows=d.get('matches') or []
          ended=[r.get('sourceMatchId') for r in rows if str(r.get('status') or '').upper()=='FT' or 'FINISH' in str(r.get('status') or '').upper()]
          verified=sum(1 for r in rows if (r.get('goalooClock') or {}).get('verified') is True)
          print('ok=',d.get('ok'),'generatedAt=',d.get('generatedAt'),'matches=',len(rows),'ended=',ended,'verified=',verified)
          if ended: raise SystemExit('ended match leaked from /live')
          PY
      - name: Commit patch
        run: |
          git config user.name "NOMADTIPS3 verification"
          git config user.email "actions@users.noreply.github.com"
          git add car3-1-hybrid-live-engine/web/app.js car3-1-hybrid-live-engine/web/index.html car3-1-hybrid-live-engine/monitor/index.html
          git commit -m "CAR 3.1 clear stale finished match detail"
          git push origin HEAD:fix/car31-stale-detail-source-final-20260816
