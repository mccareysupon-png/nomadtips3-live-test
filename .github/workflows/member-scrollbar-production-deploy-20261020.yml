name: BALL46 MEMBER MARKETS Dark Scrollbar — Safe Production Deploy
on:
  push:
    branches:
      - work/member-market-scrollbar-dark-20261020
    paths:
      - '.github/workflows/member-scrollbar-production-deploy-20261020.yml'
      - 'ball46-member/scrollbar-dark-20261020/deploy-production.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ball46-member-production-deploy
  cancel-in-progress: false
jobs:
  guarded-member-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Export verified exact Member active source assets from existing Graphite Noir branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/design/member-graphite-noir-dark-20261015:refs/remotes/origin/member-graphite-20261015
          mkdir -p /tmp/ball46-member-live-tree
          git archive --format=tar refs/remotes/origin/member-graphite-20261015 ball46-member/public | tar xf - -C /tmp/ball46-member-live-tree
          test -s /tmp/ball46-member-live-tree/ball46-member/public/styles.css
          test -s /tmp/ball46-member-live-tree/ball46-member/public/member.js
      - name: Deploy exact Active Member CSS only, with candidate QA, secret inheritance and guarded rollback
        run: node ball46-member/scrollbar-dark-20261020/deploy-production.mjs
      - name: Archive production result and before-after browser checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-member-scrollbar-production-${{ github.run_id }}
          path: audit/member-scrollbar-production-deploy/
          retention-days: 14
