name: Member Isolation Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cloudflare-worker/src/member-*.js'
      - 'cloudflare-worker/src/shared-api-football.js'
      - 'cloudflare-worker/src/paper-entry.js'
      - 'test-system/member-0001/**'
      - 'scripts/check-member-isolation.mjs'
      - 'scripts/test-member-config-isolation.mjs'
      - 'scripts/test-member-live-evaluator.mjs'
      - 'scripts/test-member-ball-teng-ingest.mjs'
      - 'scripts/test-member-ball-teng-run-quota.mjs'
      - '.github/scripts/run_member_ball_teng_selector.py'
      - '.github/workflows/member-ball-teng-selector.yml'
      - 'docs/member-*.md'
      - '.github/workflows/member-isolation-check.yml'
  push:
    branches:
      - 'main'
      - 'feature/member-0001-rollout-20260807'
      - 'test/member-0001-config-isolation-20260807'
      - 'feature/member-live-evaluator-20260807'
      - 'feature/member-ball-teng-selector-20260807'
      - 'feature/member-ball-teng-run-quota-20260807'
    paths:
      - 'cloudflare-worker/src/member-*.js'
      - 'cloudflare-worker/src/shared-api-football.js'
      - 'cloudflare-worker/src/paper-entry.js'
      - 'test-system/member-0001/**'
      - 'scripts/check-member-isolation.mjs'
      - 'scripts/test-member-config-isolation.mjs'
      - 'scripts/test-member-live-evaluator.mjs'
      - 'scripts/test-member-ball-teng-ingest.mjs'
      - 'scripts/test-member-ball-teng-run-quota.mjs'
      - '.github/scripts/run_member_ball_teng_selector.py'
      - '.github/workflows/member-ball-teng-selector.yml'
      - 'docs/member-*.md'
      - '.github/workflows/member-isolation-check.yml'

permissions:
  contents: read

jobs:
  member-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check Worker member modules
        run: |
          node --check cloudflare-worker/src/member-config.js
          node --check cloudflare-worker/src/member-data.js
          node --check cloudflare-worker/src/member-live-evaluator.js
          node --check cloudflare-worker/src/member-live-shared-evaluator.js
          node --check cloudflare-worker/src/member-live-settlement.js
          node --check cloudflare-worker/src/shared-api-football.js
          node --check cloudflare-worker/src/member-ball-teng-ingest.js
          node --check cloudflare-worker/src/member-ball-teng-run.js
          node --check cloudflare-worker/src/paper-entry.js
      - name: Syntax check Member #0001 frontend
        run: node --check test-system/member-0001/member.js
      - name: Syntax check Member Ball Teng selector runner
        run: python3 -m py_compile .github/scripts/run_member_ball_teng_selector.py
      - name: Verify isolation contract
        run: node scripts/check-member-isolation.mjs
      - name: Verify dynamic Member #0001 config isolation
        run: node scripts/test-member-config-isolation.mjs
      - name: Verify Member #0001 live background evaluator
        run: node scripts/test-member-live-evaluator.mjs
      - name: Verify Member #0001 Ball Teng isolated ingest
        run: node scripts/test-member-ball-teng-ingest.mjs
      - name: Verify Member #0001 Ball Teng three-run quota
        run: node scripts/test-member-ball-teng-run-quota.mjs
