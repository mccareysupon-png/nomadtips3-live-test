name: Test BALL46 Pin V2 Cache Bust 20261111
on:
  push:
    branches: [test/ball46-pin-v2-cache-bust-20261111]
    paths: ['pinned-fixtures-v2-production/CACHE_BUST_TEST_READY']
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: test/ball46-pin-v2-cache-bust-20261111}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node pinned-fixtures-v2-production/cache-bust-test.mjs
