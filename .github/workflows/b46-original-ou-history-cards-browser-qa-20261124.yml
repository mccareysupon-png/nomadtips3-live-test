name: BALL46 TEST original OU public history cards 10 per page real-browser QA 20261124
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-original-ou-history-cards-browser-qa-20261124.yml]
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install isolated Chromium browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Verify old frontend cards, latest-first pages and new research table co-exist on PC and mobile
        run: node qa/prematch-history-20261120/b46-original-ou-history-cards-browser-qa-20261124.mjs
