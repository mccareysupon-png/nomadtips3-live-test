name: BALL46 Mobile Drawer and Footer SEO Production
on:
  push:
    branches: [release/ball46-mobile-drawer-footer-seo-20261124]
    paths:
      - '.github/workflows/b46-mobile-drawer-footer-seo-release-20261124.yml'
      - 'qa/ball46-mobile-footer-seo-20261124/**'
      - 'qa/ball46-seo-20261124/seo.mjs'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect the active production source and rollback
        run: node qa/ball46-mobile-footer-seo-20261124/audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b46-mobile-footer-seo-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/ball46-mobile-footer-*.json
          if-no-files-found: error
