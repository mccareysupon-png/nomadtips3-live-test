name: Verify 3.43 Ultra Shared Batch Runtime

on:
  push:
    branches:
      - work/nomad343-clean-bet365-ui
    paths:
      - .github/workflows/verify-343-ultra-batch-runtime.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Ultra page and Full Market card
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev'
          curl -fsS --max-time 30 "$BASE/index.html?verify=$RANDOM" -o /tmp/index.html
          grep -Fq 'full-odds-main-343.js?v=343-full-odds-batch-v1' /tmp/index.html
          grep -Fq 'bet365-board.js' /tmp/index.html
          curl -fsS --max-time 30 "$BASE/full-odds-main-343.js?verify=$RANDOM" -o /tmp/full.js
          node --check /tmp/full.js
          grep -Fq "343-full-odds-main-v6-shared-batch" /tmp/full.js
          grep -Fq 'SHARED BATCH' /tmp/full.js
          grep -Fq 'zero per-match API calls' /tmp/full.js
          if grep -Eq '/api/full-market/|/fixture-odds|fetchPayload\(|setInterval\(pollExpanded|visibilitychange|fetch\(' /tmp/full.js; then
            echo 'forbidden per-fixture behavior in Full Market runtime'
            exit 1
          fi

      - name: Verify Engine and board runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev'
          curl -fsS --max-time 30 "$BASE/api/engine/health?verify=$RANDOM" -o /tmp/health.json
          curl -fsS --max-time 30 "$BASE/api/engine/board?verify=$RANDOM" -o /tmp/board.json
          node - <<'NODE'
          const h=require('/tmp/health.json'), b=require('/tmp/board.json');
          if(h.component!=='NOMAD343_ENGINE') throw Error('engine health');
          if(b.ok!==true || !Array.isArray(b.fixtures)) throw Error('board');
          console.log('ENGINE_OK',h.version,'fixtures',b.fixtures.length);
          NODE
          code="$(curl -sS --max-time 30 -o /tmp/dead1 -w '%{http_code}' "$BASE/api/engine/fixture-odds?fixtureId=1&verify=$RANDOM")"
          test "$code" != '200'
          code="$(curl -sS --max-time 30 -o /tmp/dead2 -w '%{http_code}' "$BASE/api/full-market/fixture-odds?fixtureId=1&verify=$RANDOM")"
          test "$code" != '200'

      - name: Verify central HUB batch
        shell: bash
        run: |
          set -euo pipefail
          HUB='https://nomadtips3-5usd-hub-343.mccarey-supon.workers.dev'
          curl -fsS --max-time 30 "$HUB/snapshot?verify=$RANDOM" -o /tmp/hub.json
          node - <<'NODE'
          const j=require('/tmp/hub.json');
          if(j.ok!==true) throw Error('hub');
          const inc=String(j.include||'');
          for(const k of ['odds','events','stats']) if(!inc.includes(k)) throw Error('missing '+k);
          if(!Array.isArray(j.fixtures)) throw Error('fixtures');
          console.log('HUB_BATCH_OK',j.fixtures.length,inc);
          NODE
