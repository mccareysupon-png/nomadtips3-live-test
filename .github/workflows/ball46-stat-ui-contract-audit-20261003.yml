name: Ball46 Statistics UI Contract Audit 20261003

on:
  push:
    branches: ['ops/ball46-stat-ledger-20261003']
    paths:
      - '.github/workflows/ball46-stat-ui-contract-audit-20261003.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ball46-stat-ledger-20261003
          fetch-depth: 1
      - name: Capture current Production statistics assets read-only
        shell: bash
        run: |
          set -euo pipefail
          ROOT=.audit/ball46-stat-ui-contract-20261003
          rm -rf "$ROOT" && mkdir -p "$ROOT"
          BASE='https://ball46-production.mccarey-supon.workers.dev'
          nonce="${GITHUB_RUN_ID}-$(date +%s%N)"
          for p in statistics.html statistics.js statistics-next.js; do
            code=$(curl -sS -L --retry 4 --retry-all-errors --max-time 30 -H 'Cache-Control: no-cache' -o "$ROOT/$p" -w '%{http_code}' "$BASE/$p?audit=$nonce-$RANDOM" || true)
            echo "$p $code"
            if [ "$code" != 200 ]; then rm -f "$ROOT/$p"; fi
          done
          grep -RniE 'rows|result|SETTLED|PENDING|total|winRate|entryMinute|score|minute' "$ROOT" > "$ROOT/contract-grep.txt" || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT"
          git diff --cached --quiet && exit 0
          git commit -m "audit: snapshot Ball46 statistics frontend contract ${GITHUB_RUN_ID}"
          git push origin HEAD:ops/ball46-stat-ledger-20261003
