name: Temporary CAR 3.1 clock cache bust

on:
  push:
    branches:
      - fix/car31-goaloo-clock-cache-20260816

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/car31-goaloo-clock-cache-20260816
          fetch-depth: 0
      - name: Bump source clock script cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          paths=[
            Path('car3-1-hybrid-live-engine/web/index.html'),
            Path('car3-1-hybrid-live-engine/monitor/index.html'),
          ]
          old='signal-polish.js?v=20260816-per-match-clock-v2'
          new='signal-polish.js?v=20260816-goaloo-source-clock-v1'
          for path in paths:
            text=path.read_text()
            if old not in text:
              raise SystemExit(f'expected cache key not found: {path}')
            path.write_text(text.replace(old,new))
          PY
          git config user.name 'nomadtips3-clock-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add car3-1-hybrid-live-engine/web/index.html car3-1-hybrid-live-engine/monitor/index.html
          git commit -m 'CAR 3.1: refresh Goaloo source clock script cache key'
          git push origin HEAD:fix/car31-goaloo-clock-cache-20260816
