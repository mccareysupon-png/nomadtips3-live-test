name: Production Prematch Cycle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prematch-production.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-prematch-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare analysis runtime
        run: |
          git fetch origin agent/car11-goaloo-launch-20260816
          mkdir -p /tmp/prematch data
          git show origin/agent/car11-goaloo-launch-20260816:car1-1/scripts/settle_guard.mjs > /tmp/prematch/settle.mjs
          git show origin/agent/car11-goaloo-launch-20260816:car1-1/scripts/run_cycle.mjs > /tmp/prematch/select.mjs
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Seed first locked set when needed
        run: |
          if [ ! -f data/prematch-current.json ]; then
            git show origin/agent/car11-goaloo-launch-20260816:car1-1/data/public-selections.json > data/prematch-current.json
          fi
      - name: Settle current set and guard rollover
        env:
          CURRENT_PATH: data/prematch-current.json
          HISTORY_PATH: data/prematch-history.json
          ACTION_PATH: /tmp/prematch/action.txt
        run: node /tmp/prematch/settle.mjs
      - name: Select next set only after full settlement
        run: |
          if [ "$(tr -d '\r\n' < /tmp/prematch/action.txt)" = "SELECT" ]; then
            MAX_ANALYSIS=500 node /tmp/prematch/select.mjs
            cp car1-1/data/public-selections.json data/prematch-current.json
          else
            echo 'Current set remains locked while results are pending.'
          fi
      - name: Publish state
        run: |
          git config user.name 'nomadtips3-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/prematch-current.json
          if [ -f data/prematch-history.json ]; then git add data/prematch-history.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Production: refresh prematch state'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
