name: Production Prematch Cycle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prematch-production.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-prematch-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare analysis runtime
        run: |
          git fetch origin agent/car11-goaloo-launch-20260816
          mkdir -p .prematch-runtime data car1-1/data
          git show origin/agent/car11-goaloo-launch-20260816:car1-1/scripts/market_helpers.mjs > .prematch-runtime/market_helpers.mjs
          git show origin/agent/car11-goaloo-launch-20260816:car1-1/scripts/upgrade_locked_markets.mjs > .prematch-runtime/upgrade.mjs
          git show origin/agent/car11-goaloo-launch-20260816:car1-1/scripts/settle_guard.mjs > .prematch-runtime/settle.mjs
          git show origin/agent/car11-goaloo-launch-20260816:car1-1/scripts/run_cycle.mjs > .prematch-runtime/select.mjs
          git show origin/agent/car11-goaloo-launch-20260816:car1-1/data/public-selections.json > .prematch-runtime/latest-selections.json
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Seed first locked set when needed
        run: |
          if [ ! -f data/prematch-current.json ]; then
            cp .prematch-runtime/latest-selections.json data/prematch-current.json
          fi

      - name: Promote legacy capped set to today's all-qualified set
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const currentPath='data/prematch-current.json';
          const sourcePath='.prematch-runtime/latest-selections.json';
          const current=JSON.parse(fs.readFileSync(currentPath,'utf8'));
          const source=JSON.parse(fs.readFileSync(sourcePath,'utf8'));
          const curPublished=Number(current?.scan?.published||current?.matches?.length||0);
          const srcPublished=Number(source?.scan?.published||source?.matches?.length||0);
          const sameDay=String(current.selectionDate||'')===String(source.selectionDate||'');
          const sourceNewer=Date.parse(source.generatedAtUtc||0)>Date.parse(current.generatedAtUtc||0);
          const legacyCap=current?.rules?.maximumSelections===10 || current?.rules?.selectionPolicy!=='ALL_QUALIFIED';
          const allPending=(current.matches||[]).every(m=>String(m.status||'PENDING').toUpperCase()==='PENDING');
          const noneStarted=(source.matches||[]).every(m=>Date.parse(m.kickoffUtc||0)>Date.now());
          if(sameDay && sourceNewer && legacyCap && allPending && noneStarted && srcPublished>curPublished){
            for(const m of source.matches||[]){
              if(m.context?.market && Object.prototype.hasOwnProperty.call(m.context.market,'company')) delete m.context.market.company;
            }
            source.contextSchema=1;
            source.marketSchema=2;
            fs.writeFileSync(currentPath,JSON.stringify(source,null,2)+'\n');
            console.log(`PROMOTED same-day set ${curPublished} -> ${srcPublished} selections before kickoff.`);
          }else{
            console.log(`No promotion: sameDay=${sameDay} sourceNewer=${sourceNewer} legacyCap=${legacyCap} allPending=${allPending} noneStarted=${noneStarted} current=${curPublished} source=${srcPublished}`);
          }
          NODE

      - name: Hydrate locked set analysis context
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const currentPath='data/prematch-current.json';
          const sourcePath='.prematch-runtime/latest-selections.json';
          const current=JSON.parse(fs.readFileSync(currentPath,'utf8'));
          const source=JSON.parse(fs.readFileSync(sourcePath,'utf8'));
          const sourceById=new Map((source.matches||[]).map(m=>[String(m.fixtureId),m]));
          const lockedFields=['fixtureId','league','home','away','kickoffUtc','pick','pickSide','odds','confidence','predictedScore','status','finalScore','matchResult','settledAtUtc'];
          let hydrated=0;
          for(const match of current.matches||[]){
            const src=sourceById.get(String(match.fixtureId));
            if(!src) continue;
            const before=JSON.stringify({analysis:match.analysis,context:match.context,reason:match.reason});
            const preserved={};
            for(const key of lockedFields) if(Object.prototype.hasOwnProperty.call(match,key)) preserved[key]=match[key];
            match.analysis={...(src.analysis||{}),...(match.analysis||{})};
            if(src.context){
              const ctx=structuredClone(src.context);
              if(ctx.market && Object.prototype.hasOwnProperty.call(ctx.market,'company')) delete ctx.market.company;
              match.context=ctx;
            }
            if(!match.reason && src.reason) match.reason=src.reason;
            Object.assign(match,preserved);
            const after=JSON.stringify({analysis:match.analysis,context:match.context,reason:match.reason});
            if(before!==after) hydrated++;
          }
          if(hydrated){
            current.contextSchema=1;
            fs.writeFileSync(currentPath,JSON.stringify(current,null,2)+'\n');
          }
          console.log(`Hydrated ${hydrated} locked selections without changing locked record fields.`);
          NODE

      - name: Add multi-market predictions to locked set
        env:
          CURRENT_PATH: data/prematch-current.json
        run: node .prematch-runtime/upgrade.mjs

      - name: Settle current set and guard rollover
        env:
          CURRENT_PATH: data/prematch-current.json
          HISTORY_PATH: data/prematch-history.json
          ACTION_PATH: .prematch-runtime/action.txt
        run: node .prematch-runtime/settle.mjs

      - name: Select next set only after full settlement
        run: |
          ACTION="$(tr -d '\r\n' < .prematch-runtime/action.txt)"
          if [ "$ACTION" = "SELECT" ]; then
            MAX_ANALYSIS=0 node .prematch-runtime/select.mjs
            node -e "const fs=require('fs');const p='car1-1/data/public-selections.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));for(const m of d.matches||[]){if(m.context&&m.context.market)delete m.context.market.company;}d.contextSchema=1;d.marketSchema=2;fs.writeFileSync(p,JSON.stringify(d,null,2)+'\\n');"
            cp car1-1/data/public-selections.json data/prematch-current.json
          else
            echo 'Current set remains locked while results are pending.'
          fi

      - name: Publish state
        run: |
          git config user.name 'nomadtips3-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/prematch-current.json
          if [ -f data/prematch-history.json ]; then git add data/prematch-history.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Production: refresh prematch state'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main