name: BALL46 Goaloo kickoff read-only audit
on:
  workflow_dispatch:
  push:
    branches:
      - prep/goaloo-final-result-20261017
    paths:
      - integrations/result-provider-router/audit-goaloo-offset.mjs
      - .github/workflows/ball46-goaloo-offset-readonly.yml
permissions:
  contents: read
jobs:
  inspect-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit independently observed kickoff representations
        run: node integrations/result-provider-router/audit-goaloo-offset.mjs
      - name: Upload sanitized kickoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goaloo-kickoff-evidence
          path: goaloo-timezone-readonly.json
          retention-days: 7
          if-no-files-found: warn
