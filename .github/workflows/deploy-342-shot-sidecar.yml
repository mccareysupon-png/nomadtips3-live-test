name: Deploy 3.42 Shot Sidecar

on:
  push:
    branches:
      - work/nomad342-shot-sidecar
    paths:
      - 'workers/nomadtips3-shot-sidecar-342/**'
      - '.github/workflows/deploy-342-shot-sidecar.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
  SHOT_URL: https://nomadtips3-shot-sidecar-342.mccarey-supon.workers.dev
  NOMAD_URL: https://nomadtips3-live-score-feed-v3.mccarey-supon.workers.dev/feed
  FIVEDOLLAR_URL: https://api.5dollarfootballapi.com/v1/fixtures?status=live&include=stats&per_page=50&page=1

jobs:
  isolated-deploy-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify isolated scope
        run: |
          set -euo pipefail
          node --check workers/nomadtips3-shot-sidecar-342/src/index.js
          grep -Fq "mode:'DISPLAY_ONLY'" workers/nomadtips3-shot-sidecar-342/src/index.js
          grep -Fq 'detectorConnected:false' workers/nomadtips3-shot-sidecar-342/src/index.js
          grep -Fq "futureDetectorPort:'READY'" workers/nomadtips3-shot-sidecar-342/src/index.js
          unexpected="$(git diff --name-only origin/main...HEAD | grep -Ev '^(workers/nomadtips3-shot-sidecar-342/|nomad-live-342/shot-(stats|settings-status)-342\.js$|nomad-live-342/shot-sidecar-contract\.md$|\.github/workflows/(test-342-shot-sidecar|deploy-342-shot-sidecar)\.yml$)' || true)"
          if [ -n "$unexpected" ]; then echo "::error::Unexpected files outside shot sidecar scope"; printf '%s\n' "$unexpected"; exit 1; fi

      - name: Dry-run isolated worker bundle
        working-directory: workers/nomadtips3-shot-sidecar-342
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc

      - name: Validate deploy credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$FIVEDOLLAR_API_KEY" || { echo '::error::Missing FIVEDOLLAR_API_KEY repository secret'; exit 1; }

      - name: Probe upstreams read-only
        run: |
          set -euo pipefail
          nomad_code="$(curl -sS --max-time 20 -o /tmp/nomad-upstream.json -w '%{http_code}' "$NOMAD_URL?shot_probe=$RANDOM$RANDOM")"
          provider_code="$(curl -sS --max-time 20 -o /tmp/provider-upstream.json -w '%{http_code}' -H 'Accept: application/json' -H "Authorization: Bearer $FIVEDOLLAR_API_KEY" "$FIVEDOLLAR_URL")"
          echo "NOMAD upstream HTTP $nomad_code"
          echo "5Dollar upstream HTTP $provider_code"
          node - <<'NODE'
          const fs=require('fs');
          const safe=(path)=>{try{return JSON.parse(fs.readFileSync(path,'utf8'))}catch{return null}};
          const n=safe('/tmp/nomad-upstream.json');
          const p=safe('/tmp/provider-upstream.json');
          console.log('NOMAD:',JSON.stringify({ok:n?.ok,version:n?.version,component:n?.component,live:Array.isArray(n?.matches)?n.matches.length:null,error:n?.error??n?.lastError??null},null,2));
          console.log('5Dollar:',JSON.stringify({success:p?.success,live:Array.isArray(p?.data)?p.data.length:null,pagination:p?.pagination??null,error:p?.error??null},null,2));
          NODE
          test "$nomad_code" = "200" || exit 21
          test "$provider_code" = "200" || { echo '--- 5Dollar safe error body ---'; head -c 2000 /tmp/provider-upstream.json; echo; exit 22; }

      - name: Deploy isolated Shot Sidecar only
        working-directory: workers/nomadtips3-shot-sidecar-342
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Bind 5Dollar API key to isolated worker
        working-directory: workers/nomadtips3-shot-sidecar-342
        run: printf '%s' "$FIVEDOLLAR_API_KEY" | npx --yes wrangler@4.92.0 secret put FIVEDOLLAR_API_KEY --config wrangler.jsonc

      - name: Probe health contract
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$SHOT_URL/health?_=$RANDOM$RANDOM" -o /tmp/shot-health.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/shot-health.json','utf8'));
          console.log(JSON.stringify(j,null,2));
          if(j.ok!==true||j.mode!=='DISPLAY_ONLY'||j.detectorConnected!==false||j.futureDetectorPort!=='READY')process.exit(1);
          NODE

      - name: Probe live mapping and stats
        run: |
          set -euo pipefail
          curl -fsS --max-time 40 "$SHOT_URL/snapshot?force=1&_=$RANDOM$RANDOM" -o /tmp/shot-snapshot.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/shot-snapshot.json','utf8'));
          const sample=(Array.isArray(j.results)?j.results:[]).filter(x=>x.status==='MATCHED').slice(0,20).map(x=>({nomadMatchId:x.nomadMatchId,providerFixtureId:x.providerFixtureId,home:x.home,away:x.away,league:x.league,minute:x.minute,status:x.status,mapping:x.mapping,shotOnTarget:x.shotOnTarget,shotOffTarget:x.shotOffTarget}));
          console.log(JSON.stringify({ok:j.ok,error:j.error??null,mode:j.mode,detectorConnected:j.detectorConnected,counts:j.counts,provider:j.provider,nomad:j.nomad,sample},null,2));
          if(j.mode!=='DISPLAY_ONLY'||j.detectorConnected!==false)process.exit(1);
          if(j.ok!==true)process.exit(2);
          NODE
