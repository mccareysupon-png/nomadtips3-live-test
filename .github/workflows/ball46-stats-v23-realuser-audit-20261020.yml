name: BALL46 Statistics V2.3 Real User Read Only Browser Diagnosis
on:
  push:
    branches: [codex/ball46-stats-v23-real-user-diagnostic-20261020]
    paths:
      - '.github/workflows/ball46-stats-v23-realuser-audit-20261020.yml'
      - 'deploy-assets/stats-pc-v2-preview-20261020/production-dom-audit.mjs'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Real Production DOM diagnosis, no writes or deploy
        working-directory: deploy-assets/stats-pc-v2-preview-20261020
        run: |
          node --check production-dom-audit.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
          node production-dom-audit.mjs
