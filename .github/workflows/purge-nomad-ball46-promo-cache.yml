name: Purge NOMADTIPS3 BALL46 Promo Cache
on:
  push:
    branches: [work/nomad341-test-production-rail]
    paths: ['nomad-live-web-test/PURGE_BALL46_PROMO_CACHE_READY']
permissions: {contents: read}
jobs:
  purge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node nomad-live-web-test/purge-ball46-promo-cache.mjs
