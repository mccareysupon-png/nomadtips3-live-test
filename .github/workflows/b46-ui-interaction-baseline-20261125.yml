name: BALL46 test-only UI interaction baseline
on:
  push:
    branches: [test/ball46-ui-interaction-baseline-20261125]
    paths: [.github/workflows/b46-ui-interaction-baseline-20261125.yml]
permissions:
  contents: read
jobs:
  baseline:
    timeout-minutes: 8
    runs-on: ubuntu-24.04
    steps:
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install chromium --only-shell
      - name: Record event timing and DOM replacement on the public TEST page
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const host='ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev';
          (async()=>{
            const browser=await chromium.launch();
            try {
              for(const [label,width,height] of [['desktop',1440,900],['mobile',390,844]]){
                const c=await browser.newContext({viewport:{width,height},serviceWorkers:'block'});
                await c.addInitScript(()=>{
                  const logs=[]; let mark;
                  window.b46Audit={logs,start:()=>{logs.length=0;mark=performance.now();},since:()=>mark};
                  new PerformanceObserver(list=>{
                    for(const e of list.getEntries())if(e.name==='click'||e.entryType==='longtask') logs.push({
                      kind:e.entryType,start:Math.round(e.startTime),dur:e.duration,
                      input:e.processingStart==null?null:Math.round(e.processingStart-e.startTime),
                      processing:e.processingEnd==null?null:Math.round(e.processingEnd-e.processingStart)
                    });
                  }).observe({type:'event',durationThreshold:16,buffered:true});
                  new PerformanceObserver(list=>{
                    for(const e of list.getEntries())logs.push({kind:'longtask',start:Math.round(e.startTime),dur:Math.round(e.duration)});
                  }).observe({type:'longtask'});
                });
                const p=await c.newPage(),errors=[];
                let served=0;
                p.on('response',async res=>{
                  if(new URL(res.url()).hostname===host&&new URL(res.url()).pathname==='/dashboard-v2-stage3-featured-facts-20261013a.js'&&res.headers()['x-b46-test-hidden-board']==='v1')served++;
                });
                const cdp=await c.newCDPSession(p); await cdp.send('Profiler.enable');
                p.on('pageerror',e=>errors.push(e.message));
                await p.goto('https://'+host+'/?b46pm=ou',{waitUntil:'domcontentloaded',timeout:50000});
                assert.equal(new URL(p.url()).hostname,host);
                await p.locator('#b46-prematch-panel').waitFor({timeout:18000});
                const nav=p.getByRole('button',{name:'Open navigation'});
                const target=(name)=>p.getByRole('button',{name:name==='1x2'?/^1X2 \d+\.\d+%$/:name==='total'?/^Total /:/^Waiting \d+/});
                const reports=[];
                for(const n of (label==='desktop'?['total','1x2','total','1x2','total','1x2']:['waiting'])){
                  if(label==='mobile'&&await nav.isVisible())await nav.click();
                  if(reports.length===1)await p.waitForFunction(()=>document.querySelectorAll('.workspace-panel tr').length>=40,{},{timeout:35000});
                  const b=n==='waiting'?p.getByRole('button',{name:/^Waiting [0-9]+/}):p.locator('button[data-stat-market="'+(n==='total'?'all':'1x2')+'"]:visible');
                  await p.evaluate(()=>{
                    window.b46Audit.start();
                    const start=performance.now(),frames=[];
                    window.b46Audit.frames=frames;
                    const capture=()=>{
                      const e=document.querySelector('#b46-finance-chart-card .f46-card');
                      const q=e?.getBoundingClientRect(),t=performance.now()-start;
                      frames.push(q?[Math.round(t),Math.round(q.x),Math.round(q.y),Math.round(q.width),Math.round(q.height),window.scrollY]:[Math.round(t)]);
                      if(t<750)requestAnimationFrame(capture);
                    };capture();
                    window.b46Audit.refs=Array.from(document.querySelectorAll('main,.workspace-panel,.workspace-stats-card,#b46-finance-chart-card,[data-stat-market]')).slice(0,24);
                  });
                  await cdp.send('Profiler.start');
                  await b.click({timeout:8000});
                  if(n==='waiting')await p.getByRole('heading',{name:'Waiting Matches'}).waitFor({timeout:10000});
                  else await p.waitForURL(u=>u.searchParams.get('view')==='statistics'&&(n==='1x2'?u.searchParams.get('market')==='1x2':!u.searchParams.get('market')),{timeout:10000});
                  await p.evaluate(()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve))));
                  const {profile}=await cdp.send('Profiler.stop');
                  const nodes=new Map(profile.nodes.map(x=>[x.id,x.callFrame]));
                  const totals=new Map();
                  for(const [i,id] of (profile.samples||[]).entries()){
                    const node=nodes.get(id); if(!node||!node.url||!node.url.includes(host))continue;
                    const k=node.functionName+' '+node.url.split('?')[0].split('/').pop()+':'+(node.lineNumber+1);
                    totals.set(k,(totals.get(k)||0)+(profile.timeDeltas?.[i]||0));
                  }
                  console.log('B46_UI_HOT '+JSON.stringify({label,action:n,hot:[...totals].sort((a,b)=>b[1]-a[1]).slice(0,10).map(([frame,us])=>[frame,Math.round(us/1000)])}));
                  const obs=await p.evaluate(()=>({
                    events:window.b46Audit.logs.filter(e=>e.start>=window.b46Audit.since()-2),
                    kept:window.b46Audit.refs?.filter(e=>e.isConnected).length,
                    observed:window.b46Audit.refs?.length,
                    rows:document.querySelectorAll('.workspace-panel tr').length,
                    frames:window.b46Audit.frames.filter((f,i,a)=>i===0||f.slice(1).join()!==a[i-1].slice(1).join()).slice(0,12)
                  }));
                  reports.push({action:n,...obs});
                  console.log('B46_UI_SAMPLE '+JSON.stringify({label,action:n,...obs}));
                }
                assert(served>0,'DEPLOYED_TEST_HEADER_MISSING');
                assert.equal(errors.length,0,'BROWSER_ERRORS_'+label);
                console.log('B46_UI_BASELINE '+JSON.stringify({label,reports,errors}));
                await c.close();
              }
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
