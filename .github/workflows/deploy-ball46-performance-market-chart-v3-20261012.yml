name: Deploy Ball46 Performance Market Chart V3 20261012

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ball46-performance-market-chart-v3-20261012.yml'

permissions:
  contents: read

concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout isolated V3 chart patch
        uses: actions/checkout@v4
        with:
          ref: work/ball46-performance-chart-market-style-20261012
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts acorn@8 puppeteer-core@24
      - name: Deploy verified market chart V3
        working-directory: deploy-assets/performance-chart-market-style-v3-20261012
        run: node run.mjs
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-performance-market-chart-v3-${{ github.run_id }}
          path: deploy-assets/performance-chart-market-style-v3-20261012/audit
          if-no-files-found: warn
          retention-days: 30

# retry-2
