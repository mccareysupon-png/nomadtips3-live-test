name: BALL46 Full Market V3 sustained odds and Event Flow scroll stress QA
on:
  push:
    branches: [test/ball46-fullmarket-odds-v3-20261121]
    paths:
      - '.github/workflows/ball46-fullmarket-v3-scroll-stress-20261121.yml'
      - 'qa/fullmarket-odds-v3-20261121/scroll-stress-qa.mjs'
permissions: {contents: read}
jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-fund --no-audit playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Compare Production and isolated Full Market test with bulk odds, Event Flow and bookmaker stress
        run: node qa/fullmarket-odds-v3-20261121/scroll-stress-qa.mjs
