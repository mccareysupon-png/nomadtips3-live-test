name: BALL46 MEMBER — Combine Half Results Guarded Deploy
on:
  push:
    branches:
      - codex/ball46-member-win-loss-combined-20261021
    paths:
      - '.github/workflows/member-half-result-combined-safe-20261021.yml'
permissions:
  contents: read
concurrency:
  group: ball46-member-production-deploy
  cancel-in-progress: false
jobs:
  deploy-member-half-count:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser for preview and production
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate scope and pin immutable current Member source
        run: |
          set -euo pipefail
          node --check ball46-member/member-half-count-20261021/deploy.mjs
          node --check ball46-member/member-signal-v3-20261020/theme.mjs
          python3 -m py_compile ball46-member/member-loading-20261020/patch_member.py
          git fetch origin 05c276f7f76a6226b10b45bd85ac369e53167d2f
          git cat-file -e 05c276f7f76a6226b10b45bd85ac369e53167d2f^{commit}
          mkdir -p /tmp/ball46-member-live-tree
          git archive --format=tar 05c276f7f76a6226b10b45bd85ac369e53167d2f ball46-member/public | tar xf - -C /tmp/ball46-member-live-tree
          test -s /tmp/ball46-member-live-tree/ball46-member/public/member.js
          test -s /tmp/ball46-member-live-tree/ball46-member/public/member.html
      - name: Verify live 42 assets then deploy UI-only count patch with rollback guards
        run: node ball46-member/member-half-count-20261021/deploy.mjs
      - name: Preserve audit JSON and PC/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-member-half-results-counts-audit
          path: audit/member-win-loss-combined-20261021/
          retention-days: 30
          if-no-files-found: warn
