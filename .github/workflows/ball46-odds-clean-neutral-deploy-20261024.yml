name: BALL46 Desktop Clean Neutral Odds 20261024
on:
  push:
    branches: [codex/ball46-odds-clean-neutral-current-20261024]
    paths:
      - '.github/workflows/ball46-odds-clean-neutral-deploy-20261024.yml'
      - 'deploy-assets/odds-clean-neutral-deploy-20261024/run.mjs'
      - 'deploy-assets/odds-clean-neutral-deploy-20261024/patch.mjs'
      - 'deploy-assets/odds-clean-neutral-deploy-20261024/patch.test.mjs'
      - 'deploy-assets/odds-clean-neutral-deploy-20261024/cutover.mjs'
      - 'deploy-assets/odds-clean-neutral-deploy-20261024/cutover.test.mjs'
      - 'deploy-assets/odds-clean-neutral-deploy-20261024/provenance.json'
      - 'deploy-assets/odds-clean-neutral-deploy-20261024/resource-404.json'
      - 'deploy-assets/odds-clean-neutral-deploy-20261024/request.json'
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  clean-neutral:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scope and execute guarded phase
        working-directory: deploy-assets/odds-clean-neutral-deploy-20261024
        run: |
          node --check run.mjs
          node cutover.test.mjs
          node patch.test.mjs
          node run.mjs
          if [ -f audit/source-index.html ]; then node patch.test.mjs; fi
          if [ -f audit/candidate-runtime.mjs ]; then node --check audit/candidate-runtime.mjs; fi
      - name: Preserve audit on isolated branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-assets/odds-clean-neutral-deploy-20261024/audit-last
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Clean Neutral odds phase ${GITHUB_RUN_ID} [skip ci]"
          git push origin HEAD:codex/ball46-odds-clean-neutral-current-20261024
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-clean-neutral-${{ github.run_id }}
          path: deploy-assets/odds-clean-neutral-deploy-20261024/audit
          retention-days: 30
