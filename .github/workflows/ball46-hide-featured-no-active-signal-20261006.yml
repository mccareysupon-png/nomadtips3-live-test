name: Ball46 Hide Featured No Active Signal 20261006

on:
  push:
    branches: [work/ball46-hide-no-active-signal-20261006]
    paths:
      - '.github/workflows/ball46-hide-featured-no-active-signal-20261006.yml'
      - 'deploy-assets/match-status-svg-20261003/featured-no-active-signal-hide-run.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-production-featured-no-active-signal-hide
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  surgical-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install proven rail dependencies
        working-directory: deploy-assets/match-status-svg-20261003
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Hide Featured Match no-signal fallback
        working-directory: deploy-assets/match-status-svg-20261003
        run: node featured-no-active-signal-hide-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-featured-no-active-signal-hide-${{ github.run_id }}
          path: deploy-assets/match-status-svg-20261003/audit/
          if-no-files-found: error
          retention-days: 30
