name: BALL46 private owner control 30 only no HUB deployment
on:
  push:
    branches: [codex/ball46-owner-control-v2-20261103]
    paths: ['work/api-settings-v2/publish-request.json']
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: work/ball46-5usd-latency-control-20261102
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false --prefix ../api-settings-v2 playwright@1.56.1
      - name: Capture all current Active versions and modules
        run: node production-preflight.mjs
      - name: Test strict owner authentication and read-only HUB integration
        run: |
          node ../api-settings-v2/prepare.mjs
          node --check ../api-settings-v2/diagnose.mjs
          node --check ../api-settings-v2/owner-auth.mjs
          node --check ../api-settings-v2/owner-gateway.mjs
          node ../api-settings-v2/gateway.test.mjs > production-audit/owner-v2-tests.txt
      - name: Verify PC and mobile UI against isolated fixtures
        run: |
          ../api-settings-v2/node_modules/.bin/playwright install --with-deps chromium
          node ../api-settings-v2/browser-check.mjs
      - name: Publish owner Worker only, preserving all other services
        env:
          OWNER_PUBLISH_PHASE: 'true'
        run: node ../api-settings-v2/diagnose.mjs
      - name: Preserve verification and rollback evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-audit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record private owner release without HUB writes [skip ci]"
          git push origin HEAD:codex/ball46-owner-control-v2-20261103
