name: BALL46 sidebar statistics Win Rate read-only audit 20261121
on:
  push:
    branches: [test/ball46-sidebar-winrate-20261121]
    paths:
      - '.github/workflows/ball46-sidebar-winrate-audit-20261121.yml'
      - 'qa/sidebar-winrate-20261121/audit.mjs'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated read-only browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Inspect Production sidebar and existing statistics load timing (GET only)
        run: node qa/sidebar-winrate-20261121/audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-sidebar-winrate-audit
          path: sidebar-audit
          if-no-files-found: warn
          retention-days: 14
