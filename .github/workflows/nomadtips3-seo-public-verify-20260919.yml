name: NOMADTIPS3 SEO Public Verify 20260919

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nomadtips3-seo-public-verify-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify public core SEO essentials
        shell: bash
        run: |
          set -euo pipefail
          check_page() {
            url="$1"; canonical="$2"; out="$3"
            curl -fsSL --retry 5 --retry-delay 2 --connect-timeout 10 --max-time 30 "$url?seo_verify=${GITHUB_RUN_ID}" -o "$out"
            echo "CHECK $url"
            grep -o '<title>[^<]*</title>' "$out" | head -1
            grep -o '<meta name="description" content="[^"]*">' "$out" | head -1
            grep -o '<link rel="canonical" href="[^"]*">' "$out" | head -1
            grep -o '<meta name="robots" content="[^"]*">' "$out" | head -1
            grep -Eq '<title>[^<]*(Football|Soccer|NOMADTIPS3)[^<]*</title>' "$out"
            grep -Fq '<meta name="description" content=' "$out"
            grep -Fq "rel=\"canonical\" href=\"$canonical\"" "$out"
            grep -Fq 'content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"' "$out"
          }
          check_page 'https://www.nomadtips3.com/' 'https://www.nomadtips3.com/' /tmp/home.html
          check_page 'https://www.nomadtips3.com/statistics' 'https://www.nomadtips3.com/statistics' /tmp/stats.html
          check_page 'https://www.nomadtips3.com/soccer-predictions/' 'https://www.nomadtips3.com/soccer-predictions/' /tmp/picks.html
          curl -fsSL --max-time 30 'https://www.nomadtips3.com/robots.txt' -o /tmp/robots.txt
          curl -fsSL --max-time 30 'https://www.nomadtips3.com/sitemap.xml' -o /tmp/sitemap.xml
          grep -Fq 'Sitemap: https://www.nomadtips3.com/sitemap.xml' /tmp/robots.txt
          grep -Fq '<loc>https://www.nomadtips3.com/</loc>' /tmp/sitemap.xml
          grep -Fq '<loc>https://www.nomadtips3.com/statistics</loc>' /tmp/sitemap.xml
          grep -Fq '<loc>https://www.nomadtips3.com/soccer-predictions/</loc>' /tmp/sitemap.xml
          echo 'NOMADTIPS3_PUBLIC_CORE_SEO_PASS'
