name: NOMADTIPS3 SEO Public Verify 20260919

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nomadtips3-seo-public-verify-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify public crawl and metadata essentials
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          check_page() {
            url="$1"; canonical="$2"; out="$3"
            if ! curl -fsSL --retry 5 --retry-delay 2 --connect-timeout 10 --max-time 30 "$url?seo_verify=${GITHUB_RUN_ID}" -o "$out"; then
              echo "FETCH_FAIL $url"; failures=$((failures+1)); return
            fi
            echo "CHECK $url"
            grep -o '<title>[^<]*</title>' "$out" | head -1 || true
            grep -o '<meta name="description" content="[^"]*">' "$out" | head -1 || true
            grep -o '<link rel="canonical" href="[^"]*">' "$out" | head -1 || true
            grep -o '<meta name="robots" content="[^"]*">' "$out" | head -1 || true
            grep -Eq '<title>[^<]*(Football|Soccer|NOMADTIPS3)[^<]*</title>' "$out" || { echo "TITLE_SEO_FAIL $url"; failures=$((failures+1)); }
            grep -Fq '<meta name="description" content=' "$out" || { echo "DESCRIPTION_FAIL $url"; failures=$((failures+1)); }
            grep -Fq "rel=\"canonical\" href=\"$canonical\"" "$out" || { echo "CANONICAL_FAIL $url"; failures=$((failures+1)); }
            grep -Fq 'content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"' "$out" || { echo "ROBOTS_FAIL $url"; failures=$((failures+1)); }
          }
          check_page 'https://www.nomadtips3.com/' 'https://www.nomadtips3.com/' /tmp/home.html
          check_page 'https://www.nomadtips3.com/statistics' 'https://www.nomadtips3.com/statistics' /tmp/stats.html
          check_page 'https://www.nomadtips3.com/soccer-predictions/' 'https://www.nomadtips3.com/soccer-predictions/' /tmp/picks.html
          check_page 'https://www.nomadtips3.com/alerts' 'https://www.nomadtips3.com/alerts' /tmp/alerts.html
          curl -fsSL --max-time 30 'https://www.nomadtips3.com/robots.txt' -o /tmp/robots.txt || failures=$((failures+1))
          curl -fsSL --max-time 30 'https://www.nomadtips3.com/sitemap.xml' -o /tmp/sitemap.xml || failures=$((failures+1))
          grep -Fq 'Sitemap: https://www.nomadtips3.com/sitemap.xml' /tmp/robots.txt || { echo ROBOTS_SITEMAP_FAIL; failures=$((failures+1)); }
          grep -Fq '<loc>https://www.nomadtips3.com/statistics</loc>' /tmp/sitemap.xml || { echo STATS_SITEMAP_FAIL; failures=$((failures+1)); }
          grep -Fq '<loc>https://www.nomadtips3.com/soccer-predictions/</loc>' /tmp/sitemap.xml || { echo PICKS_SITEMAP_FAIL; failures=$((failures+1)); }
          grep -Fq '<loc>https://www.nomadtips3.com/alerts</loc>' /tmp/sitemap.xml || { echo ALERTS_SITEMAP_FAIL; failures=$((failures+1)); }
          echo "FAILURES=$failures"
          test "$failures" -eq 0
          echo 'NOMADTIPS3_PUBLIC_SEO_PASS'
