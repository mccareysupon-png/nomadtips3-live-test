name: ONE SHOT - Restore Ball46 Exact 18:50 2026-09-26

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-ball46-pre-k-mistake-20260927.yml'

permissions:
  contents: read

env:
  TARGET_VERSION: 8e95c148-ea19-4ed1-88a1-2f14565c6888
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  restore-exact-1850:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact 18:50 production version
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 rollback "$TARGET_VERSION" --name ball46-production --message "Restore exact Ball46 production 2026-09-26 18:50 ICT"
      - name: Verify production page and backend
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 25 "$BALL46_WORKER/?restore-check=${GITHUB_RUN_ID}" -o /tmp/index.html
          test -s /tmp/index.html
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 25 "$BALL46_WORKER/signal.html?restore-check=${GITHUB_RUN_ID}" -o /tmp/signal.html
          test -s /tmp/signal.html
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 25 "$BALL46_WORKER/statistics.html?restore-check=${GITHUB_RUN_ID}" -o /tmp/statistics.html
          test -s /tmp/statistics.html
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 25 "$BALL46_WORKER/api/engine/health?restore-check=${GITHUB_RUN_ID}" -o /tmp/health.json
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          if(h?.ok!==true) throw Error('HEALTH_NOT_OK');
          console.log('RESTORE_EXACT_1850_PASS');
          NODE
