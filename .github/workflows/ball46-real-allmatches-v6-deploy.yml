name: BALL46 Real Mobile All Matches V6 Production
on:
  push:
    branches: [fix/ball46-featured-expanded-only-20261021]
    paths:
      - '.github/workflows/ball46-real-allmatches-v6-deploy.yml'
      - 'deploy-assets/expanded-match-mobile-v4/mobile-allmatches-v6.css'
      - 'deploy-assets/expanded-match-mobile-v4/mobile-allmatches-v6-detail.js'
      - 'deploy-assets/expanded-match-mobile-v4/deploy-real-mobile-v6.mjs'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  real-mobile-allmatches:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check and browser
        working-directory: deploy-assets/expanded-match-mobile-v4
        run: |
          node --check deploy-real-mobile-v6.mjs
          node --check mobile-allmatches-v6-detail.js || true
          npm install --no-save --ignore-scripts puppeteer-core@24 pngjs@7
      - name: Verify original PC/Event Flow bytes, actual mobile click, candidate and Production
        working-directory: deploy-assets/expanded-match-mobile-v4
        run: node deploy-real-mobile-v6.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-real-allmatches-v6-proof
          path: deploy-assets/expanded-match-mobile-v4/proof/
          retention-days: 30
          if-no-files-found: warn