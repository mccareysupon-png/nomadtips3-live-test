name: READ ONLY - Ball46 Cloudflare Cache Route 20261004

on:
  push:
    branches:
      - audit/ball46-league-flags-readonly-20261004
    paths:
      - '.github/workflows/ball46-cloudflare-cache-route-readonly-20261004.yml'
      - 'deploy-assets/match-status-svg-20261003/cloudflare-cache-route-readonly.mjs'

permissions:
  contents: read

concurrency:
  group: ball46-cloudflare-cache-route-readonly
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect Cloudflare cache rules and worker routes read-only
        run: |
          cd deploy-assets/match-status-svg-20261003
          node cloudflare-cache-route-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-cloudflare-cache-route-${{ github.run_id }}
          path: deploy-assets/match-status-svg-20261003/audit/cloudflare-cache-route/
          if-no-files-found: error
          retention-days: 30
