name: BALL46 approved static speed Preview and guarded activation
on:
  push:
    branches: [codex/ball46-static-speed-20261110]
    paths: ['work/cloudflare-speed-audit-20261110/activate-request.json']
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated source and browser test tools
        run: |
          npm install --no-save --package-lock=false --prefix work/cloudflare-speed-audit-20261110 parse5@7.3.0 playwright@1.56.1
          cd work/cloudflare-speed-audit-20261110 && npx playwright install --with-deps chromium
      - name: Rebuild exact approved patch and verify existing candidate without traffic
        run: |
          node work/cloudflare-speed-audit-20261110/prepare.mjs
          node work/cloudflare-speed-audit-20261110/contracts.mjs
          node work/cloudflare-speed-audit-20261110/release.mjs verify
      - name: Real Worker Preview PC mobile dark and light with real cached LIVE data
        run: node work/cloudflare-speed-audit-20261110/release-browser.mjs candidate
      - name: Activate only after Preview and current-source preservation gates pass
        run: node work/cloudflare-speed-audit-20261110/release.mjs activate
      - name: Production PC mobile dark and light scores and original reader cadence
        run: node work/cloudflare-speed-audit-20261110/release-browser.mjs production
      - name: Final current version and configuration verification
        run: node work/cloudflare-speed-audit-20261110/release.mjs finish
      - name: Restore immediate baseline on any post-activation failure
        if: failure()
        run: node work/cloudflare-speed-audit-20261110/release.mjs rollback
      - name: Preserve sanitized release evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/cloudflare-speed-audit-20261110/release-audit/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record approved static cache activation and guarded preservation evidence [skip ci]"
          git push origin HEAD:codex/ball46-static-speed-20261110
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-static-speed-production-proof
          path: work/cloudflare-speed-audit-20261110/release-audit