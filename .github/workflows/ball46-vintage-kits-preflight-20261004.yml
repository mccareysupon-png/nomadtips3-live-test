name: READ ONLY - Ball46 Vintage Kits Preflight 20261004

on:
  push:
    branches:
      - work/ball46-vintage-kits-20261004
    paths:
      - '.github/workflows/ball46-vintage-kits-preflight-20261004.yml'
      - '.github/scripts/ball46_vintage_kits_preflight_20261004.sh'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read current Ball46 Production jersey rail only
        shell: bash
        run: bash .github/scripts/ball46_vintage_kits_preflight_20261004.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-vintage-kits-preflight-${{ github.run_id }}
          path: deploy-assets/match-status-svg-20261003/audit/vintage-kits-20261004/
          if-no-files-found: error
          retention-days: 14
