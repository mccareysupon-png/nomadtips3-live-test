name: Ball46 Event Flow Signal Annotation Scout 20261004

on:
  push:
    branches: [work/eventflow-signal-annotation-20261004]
    paths:
      - '.github/workflows/ball46-eventflow-signal-annotation-scout-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock current Production and inspect Event Flow route read only
        working-directory: deploy-assets/signal-detail-watch-20261003
        run: |
          node scout.mjs
          node route-scout.mjs
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-eventflow-signal-annotation-scout-${{ github.run_id }}
          path: deploy-assets/signal-detail-watch-20261003/audit/
          if-no-files-found: error
          retention-days: 14
