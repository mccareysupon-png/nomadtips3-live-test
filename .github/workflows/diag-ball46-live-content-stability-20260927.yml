name: Diagnose Ball46 LIVE Content Stability 20260927

on:
  push:
    branches: [ops/ball46-live-content-stability-20260927]
    paths:
      - '.github/workflows/diag-ball46-live-content-stability-20260927.yml'

permissions:
  contents: read

env:
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  inspect-live-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact current Production JS read-only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/dashboard-v2-stage3.js?live-stability-diag=${GITHUB_RUN_ID}" -o /tmp/dashboard.js
          sha256sum /tmp/dashboard.js
          node --check /tmp/dashboard.js
      - name: Read exact active runtime metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          hdr={'Authorization':f'Bearer {token}','Accept':'application/json'}
          dep=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/ball46-production/deployments'
          with urllib.request.urlopen(urllib.request.Request(dep,headers=hdr),timeout=30) as r: p=json.load(r)
          ds=(p.get('result') or {}).get('deployments') or []
          vid=ds[0]['versions'][0]['version_id']
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/workers/ball46-production/versions/{vid}?include=modules'
          with urllib.request.urlopen(urllib.request.Request(url,headers=hdr),timeout=30) as r: vp=json.load(r)
          result=vp.get('result') or {}
          print('ACTIVE_VERSION=',vid)
          for k in ['main_module','compatibility_date','usage_model','bindings','assets','annotations','env']:
              print(k.upper()+'=',json.dumps(result.get(k),sort_keys=True))
          for m in result.get('modules') or []:
              print('MODULE=',json.dumps({k:v for k,v in m.items() if k not in ('content','content_base64')},sort_keys=True))
          PY
