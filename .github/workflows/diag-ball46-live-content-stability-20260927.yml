name: Diagnose Ball46 Production Asset Union 20260927

on:
  push:
    branches: [ops/ball46-live-content-stability-20260927]
    paths:
      - '.github/workflows/diag-ball46-live-content-stability-20260927.yml'

permissions:
  contents: read

env:
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  GH_TOKEN: ${{ github.token }}

jobs:
  discover-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build Git path baseline and discover current Production references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          sha='a0024d01700e99aad7847c66ff54cc8ce065cf37'
          url=f'https://api.github.com/repos/mccareysupon-png/nomadtips3-live-test/git/trees/{sha}?recursive=1'
          req=urllib.request.Request(url,headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as r: p=json.load(r)
          prefix='nomad-live-343/'
          paths=sorted(x['path'][len(prefix):] for x in p.get('tree',[]) if x.get('type')=='blob' and x.get('path','').startswith(prefix))
          pathlib.Path('/tmp/git-paths.txt').write_text('\n'.join(paths)+'\n')
          print('GIT_PATHS=',len(paths))
          PY
          for page in index.html signal.html statistics.html; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/$page?asset-discovery=${GITHUB_RUN_ID}" -o "/tmp/$page"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          git=set(Path('/tmp/git-paths.txt').read_text().splitlines())
          refs=set()
          for page in ['index.html','signal.html','statistics.html']:
              text=Path('/tmp/'+page).read_text(errors='ignore')
              for raw in re.findall(r'''(?:src|href)=["']([^"']+)["']''',text,re.I):
                  x=raw.split('?',1)[0].split('#',1)[0].strip()
                  if not x or '://' in x or x.startswith('//') or x.startswith('data:') or x.startswith('mailto:') or x.startswith('tel:'): continue
                  x=x.lstrip('./').lstrip('/')
                  if not x or x.endswith('/'): continue
                  if re.search(r'\.(?:html|js|css|svg|json|png|webp|jpg|jpeg|ico)$',x,re.I): refs.add(x)
          union=git|refs|{'index.html','signal.html','statistics.html','dashboard-v2-stage3.js','singlepage-workspace-343.css'}
          print('PAGE_REFS=',len(refs))
          print('UNION_PATHS=',len(union))
          print('PRODUCTION_ONLY_CANDIDATES=')
          for x in sorted(union-git): print(x)
          print('ALL_UNION_PATHS=')
          for x in sorted(union): print(x)
          Path('/tmp/union-paths.txt').write_text('\n'.join(sorted(union))+'\n')
          PY
          echo 'CHECK_CURRENT_HTTP:'
          missing=0
          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            code=$(curl -sS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 -o /dev/null -w '%{http_code}' "$BALL46_WORKER/$rel?asset-discovery-check=${GITHUB_RUN_ID}") || true
            echo "$code $rel"
            [ "$code" = 200 ] || missing=$((missing+1))
          done < /tmp/union-paths.txt
          [ "$missing" = 0 ] || { echo "UNION_MISSING_HTTP=$missing"; exit 1; }
