name: BALL46 Prediction Vote V6 Issue367
on:
  push:
    branches: [codex/ball46-prediction-v6-20261024]
    paths:
      - '.github/workflows/ball46-prediction-v6-20261024.yml'
      - 'deploy-assets/prediction-v6-20261024/request.json'
      - 'deploy-assets/prediction-v6-20261024/run.mjs'
      - 'deploy-assets/prediction-v6-20261024/build/**'
      - 'deploy-assets/prediction-v6-20261024/vote-*.mjs'
      - 'deploy-assets/prediction-v6-20261024/core.mjs'
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  guarded-prediction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests and guarded phase
        working-directory: deploy-assets/prediction-v6-20261024
        run: |
          node --check run.mjs
          node --check build/browser.js
          node vote.test.mjs
          node run.mjs
          if [ -f audit/candidate-runtime.mjs ]; then node --check audit/candidate-runtime.mjs; fi
      - name: Preserve audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy-assets/prediction-v6-20261024/audit-last
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Prediction V6 phase ${GITHUB_RUN_ID} [skip ci]"
          git push origin HEAD:codex/ball46-prediction-v6-20261024
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-prediction-v6-${{ github.run_id }}
          path: deploy-assets/prediction-v6-20261024/audit
          retention-days: 30
