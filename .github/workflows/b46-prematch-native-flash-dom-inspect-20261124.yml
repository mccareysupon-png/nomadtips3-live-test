name: BALL46 TEST readonly native flash DOM inspection 20261124
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-prematch-native-flash-dom-inspect-20261124.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Chromium for readonly inspection
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Capture native pre-match first paint vs data-ready DOM without writes
        run: node qa/prematch-history-20261120/b46-prematch-native-flash-dom-inspect-20261124.mjs
