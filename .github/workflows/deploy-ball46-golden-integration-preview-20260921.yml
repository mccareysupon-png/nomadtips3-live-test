name: Deploy Ball46 Golden Integration Preview 20260921

on:
  push:
    branches: [work/ball46-golden-master-integration-20260921]
    paths:
      - 'nomad-live-343/index.html'
      - 'nomad-live-343/singlepage-workspace-343.js'
      - 'nomad-live-343/market-registry-343.js'
      - 'GOLDEN_MASTER_BALL46_20260921.md'
      - '.github/workflows/deploy-ball46-golden-integration-preview-20260921.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PREVIEW_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev
  GOLDEN_SHA: 2a992e9aae7bfa13909e9c5b3845a359bf1ec46c
  GOLDEN_URL: https://www.ball46.com
  GOLDEN_WORKER: https://ball46-production.mccarey-supon.workers.dev

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard Golden Master protected runtime
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$GOLDEN_SHA^{commit}"
          for p in \
            workers/nomadtips3-343-preview/src/index.js \
            workers/nomadtips3-343-preview/wrangler.ball46.jsonc \
            workers/nomadtips3-engine-343/src/index.js \
            nomad-live-343/dashboard-v2-stage3.js \
            nomad-live-343/dashboard-v2-tune.js \
            nomad-live-343/bulk-odds-compat-343.js \
            nomad-live-343/expanded-match-343.js \
            nomad-live-343/full-market-bookmaker-343.js \
            nomad-live-343/live-summary-full-odds-343.js \
            nomad-live-343/signal-next.js; do
            git diff --quiet "$GOLDEN_SHA"..HEAD -- "$p" || { echo "GOLDEN CORE CHANGED: $p"; exit 1; }
          done
          grep -Fq '"ENGINE", "service": "nomadtips3-engine-343"' workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          grep -Fq '"HUB", "service": "nomadtips3-5usd-hub-343"' workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          grep -Fq '"FULL_MARKET", "service": "nomadtips3-full-market-343-ball46"' workers/nomadtips3-343-preview/wrangler.ball46.jsonc

      - name: Prove index is Golden Master plus UI-only additions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          golden=subprocess.check_output(['git','show','2a992e9aae7bfa13909e9c5b3845a359bf1ec46c:nomad-live-343/index.html']).decode()
          current=Path('nomad-live-343/index.html').read_text()
          registry='<script src="market-registry-343.js?v=343-market-registry-v1" defer></script>'
          variant='<section class="sp-filters sp-variant-filters" data-sp-variant-filters hidden><div class="sp-filter-title"><span>MARKET TYPE</span><b>Engine registry</b></div><div class="sp-filter-chips" data-sp-variant-chips></div></section>'
          if current.count(registry)!=1: raise SystemExit('registry script count mismatch')
          if current.count(variant)!=1: raise SystemExit('variant panel count mismatch')
          sanitized=current.replace(registry,'',1).replace(variant,'',1)
          if sanitized!=golden: raise SystemExit('index differs from Golden Master outside approved additions')
          print('PASS: index is Golden Master + registry/variant UI only')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate zero-new-provider-call contract
        shell: bash
        run: |
          set -euo pipefail
          node --check nomad-live-343/market-registry-343.js
          node --check nomad-live-343/singlepage-workspace-343.js
          ! grep -Fq 'fetch(' nomad-live-343/market-registry-343.js
          ! grep -Fq 'setInterval' nomad-live-343/market-registry-343.js
          ! grep -Fq '/api/engine/board' nomad-live-343/singlepage-workspace-343.js
          ! grep -Fq '/api/engine/signals' nomad-live-343/singlepage-workspace-343.js
          test "$(grep -o '/api/engine/statistics' nomad-live-343/singlepage-workspace-343.js | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'fetch(' nomad-live-343/singlepage-workspace-343.js | wc -l | tr -d ' ')" = "1"
          ! grep -Fq 'setInterval' nomad-live-343/singlepage-workspace-343.js
          grep -Fq 'STAT_CACHE_MS=300000' nomad-live-343/singlepage-workspace-343.js
          grep -Fq 'function renderVariants()' nomad-live-343/singlepage-workspace-343.js
          grep -Fq 'data-sp-variant-filters' nomad-live-343/index.html
          for k in ft_1x2 ft_ah ft_over ft_under ht_1x2 ht_ah ht_over ht_under ft_corner_over ft_corner_under ht_corner_over ht_corner_under ft_corner_ah ft_cards_over ft_cards_under ft_cards_ah ft_btts_yes ft_btts_no; do
            grep -Fq "$k" nomad-live-343/market-registry-343.js || { echo "MISSING MARKET $k"; exit 1; }
          done
          git diff --check

      - name: Record Golden production odds health
        shell: bash
        run: |
          set -euo pipefail
          if ! curl -fsS --connect-timeout 8 --max-time 15 "$GOLDEN_URL/api/engine/board?golden=$GITHUB_RUN_ID" -o /tmp/golden-board.json; then
            echo 'www.ball46.com timed out; checking the same production worker directly.'
            curl -fsS --connect-timeout 8 --max-time 20 "$GOLDEN_WORKER/api/engine/board?golden=$GITHUB_RUN_ID" -o /tmp/golden-board.json
          fi
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/golden-board.json','utf8'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures)) throw Error('golden board unhealthy');
          function has(v){if(Array.isArray(v))return v.length>0;if(!v||typeof v!=='object')return false;const c=[v.bookmakers,v.odds,v.markets,v?.data?.bookmakers,v?.data?.odds,v?.data?.markets];return c.some(x=>Array.isArray(x)?x.length>0:!!(x&&typeof x==='object'&&Object.keys(x).length))||Object.keys(v).some(k=>/bet365|pinnacle|crown|1xbet|12bet|interwetten|macauslot|18bet|vcbet|easybets|bookmaker/i.test(String(k)))}
          const odds=b.fixtures.filter(f=>has(f?.providerOdds)||has(f?.fullOdds)||has(f?.odds)).length;
          fs.writeFileSync('/tmp/golden-counts.json',JSON.stringify({fixtures:b.fixtures.length,oddsFixtures:odds}));
          console.log('GOLDEN HEALTH',{fixtures:b.fixtures.length,oddsFixtures:odds});
          NODE

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Dry-run isolated preview
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc

      - name: Deploy isolated preview
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Smoke preview against Golden Master contract
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          curl -fsS --max-time 30 "$PREVIEW_URL/?goldenpreview=$GITHUB_RUN_ID" -o /tmp/home.html
          grep -Fq 'market-registry-343.js?v=343-market-registry-v1' /tmp/home.html
          grep -Fq 'data-sp-variant-filters' /tmp/home.html
          grep -Fq 'full-market-bookmaker-343.js' /tmp/home.html
          grep -Fq 'bulk-odds-compat-343.js' /tmp/home.html
          curl -fsS --max-time 30 "$PREVIEW_URL/market-registry-343.js?goldenpreview=$GITHUB_RUN_ID" -o /tmp/registry.js
          node --check /tmp/registry.js
          curl -fsS --max-time 30 "$PREVIEW_URL/api/engine/board?goldenpreview=$GITHUB_RUN_ID" -o /tmp/preview-board.json
          curl -fsS --max-time 30 "$PREVIEW_URL/api/engine/signals?goldenpreview=$GITHUB_RUN_ID" -o /tmp/signals.json
          curl -fsS --max-time 30 "$PREVIEW_URL/api/engine/statistics?goldenpreview=$GITHUB_RUN_ID" -o /tmp/stats.json
          node - <<'NODE'
          const fs=require('fs');
          const pre=JSON.parse(fs.readFileSync('/tmp/golden-counts.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/preview-board.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals.json','utf8'));
          const t=JSON.parse(fs.readFileSync('/tmp/stats.json','utf8'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures)) throw Error('preview board unhealthy');
          if(!Array.isArray(s?.signals)) throw Error('preview signals unhealthy');
          if(t?.ok!==true||!Array.isArray(t?.rows)) throw Error('preview statistics unhealthy');
          function has(v){if(Array.isArray(v))return v.length>0;if(!v||typeof v!=='object')return false;const c=[v.bookmakers,v.odds,v.markets,v?.data?.bookmakers,v?.data?.odds,v?.data?.markets];return c.some(x=>Array.isArray(x)?x.length>0:!!(x&&typeof x==='object'&&Object.keys(x).length))||Object.keys(v).some(k=>/bet365|pinnacle|crown|1xbet|12bet|interwetten|macauslot|18bet|vcbet|easybets|bookmaker/i.test(String(k)))}
          const odds=b.fixtures.filter(f=>has(f?.providerOdds)||has(f?.fullOdds)||has(f?.odds)).length;
          if(pre.fixtures>0&&b.fixtures.length===0) throw Error('preview fixtures dropped to zero');
          if(pre.oddsFixtures>0&&odds===0) throw Error(`preview odds continuity failed: golden ${pre.oddsFixtures}, preview 0`);
          console.log('GOLDEN INTEGRATION PREVIEW PASS',{golden:pre,preview:{fixtures:b.fixtures.length,oddsFixtures:odds},signals:s.signals.length,statistics:t.rows.length});
          NODE
