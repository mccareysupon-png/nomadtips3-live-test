name: AH Statistics Label Safe Fix

on:
  push:
    branches:
      - work/nomad342-ah-settings-safe
    paths:
      - .github/workflows/ah-safe-label-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nomad342-ah-settings-safe
          fetch-depth: 0
      - name: Fix Asian Handicap statistics row label only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('workers/nomadtips3-342-ledger/src/index.js')
          s=p.read_text()
          old="market:s.market==='1X2'?'1X2':`O/U ${Number(s.line).toFixed(Number.isInteger(Number(s.line))?1:2)}`,pick:s.pick,line:s.market==='1X2'?null:s.line"
          new="market:s.market==='1X2'?'1X2':s.market==='AH'?`Asian Handicap ${Number(s.line).toFixed(Number.isInteger(Number(s.line))?1:2)}`:`O/U ${Number(s.line).toFixed(Number.isInteger(Number(s.line))?1:2)}`,pick:s.pick,line:s.market==='1X2'?null:s.line"
          if s.count(old)!=1:
              raise SystemExit(f'expected one statistics label target, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Safety checks
        run: |
          node --check workers/nomadtips3-342-ledger/src/index.js
          (cd workers/nomadtips3-342-ledger && npm test)
          git diff --check
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$changed" = "workers/nomadtips3-342-ledger/src/index.js"
      - name: Commit tested label fix
        run: |
          rm -f .github/workflows/ah-safe-label-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Label Asian Handicap statistics rows correctly'
          git push origin HEAD:work/nomad342-ah-settings-safe
