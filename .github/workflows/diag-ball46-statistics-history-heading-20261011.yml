name: DIAG Ball46 Statistics History Heading 20261011

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-ball46-statistics-history-heading-20261011.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Inspect Settled Signal History DOM
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          const exe=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);
          if(!exe) throw new Error('NO_CHROME');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:exe,args:['--no-sandbox']});
            const page=await browser.newPage();
            await page.setViewport({width:1440,height:1000});
            await page.goto('https://ball46.com/?view=statistics&historydiag='+Date.now(),{waitUntil:'networkidle2',timeout:90000});
            await new Promise(r=>setTimeout(r,5000));
            const r=await page.evaluate(()=>{
              const all=[...document.querySelectorAll('h1,h2,h3,h4,p,div,section')];
              const h=all.find(e=>(e.textContent||'').trim()==='Settled Signal History');
              if(!h)return {ok:false};
              const chain=[]; let n=h;
              for(let i=0;i<5&&n;i++,n=n.parentElement) chain.push({tag:n.tagName,cls:n.className,id:n.id,text:(n.innerText||'').slice(0,500),html:n.outerHTML.slice(0,1800)});
              return {ok:true,tag:h.tagName,cls:h.className,id:h.id,chain};
            });
            console.log('HISTORY_DOM '+JSON.stringify(r,null,2));
            await browser.close();
          })().catch(e=>{console.error(e.stack);process.exit(1)});
          NODE
