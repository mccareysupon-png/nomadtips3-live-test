name: BALL46 TEST private KV auto refresh actual next Cron proof 20261125
on:
  push:
    branches: [feature/ball46-adaptive-manual-control-test-20261125]
    paths: [.github/workflows/b46-dot-kv-next-real-cron-proof-20261125.yml]
permissions: {contents: read}
jobs:
  prove-kv-from-real-cron:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Require next Cloudflare real */15 Cron plus small propagation buffer
        run: |
          now=$(date -u +%s)
          next=$(( (now / 900 + 1) * 900 + 90 ))
          delay=$((next - now))
          echo "Verifying the NEXT real Cloudflare 15m scheduled cycle; no manual POST"
          sleep "$delay"
      - name: Read snapshot through Cloudflare account KV REST API without owner browser or custom HTTP bearer
        run: |
          node --check qa/prematch-history-20261120/b46-adaptive-dot-kv-verify-next-cron-test-20261125.mjs
          node qa/prematch-history-20261120/b46-adaptive-dot-kv-verify-next-cron-test-20261125.mjs
