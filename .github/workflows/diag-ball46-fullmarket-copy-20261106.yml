name: Diagnose BALL46 Full Market Copy 20261106

on:
  push:
    branches: [test/ball46-fullmarket-copy-20261106]
    paths:
      - '.github/workflows/diag-ball46-fullmarket-copy-20261106.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate Full Market diagnostic strings in active Worker
        shell: bash
        run: |
          node <<'NODE'
          (async()=>{
          const assert=require('assert/strict');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          const script='ball46-production';
          const root=`https://api.cloudflare.com/client/v4/accounts/${account}/workers`;
          async function api(path,options={}){
            const r=await fetch(root+path,{...options,headers:{Authorization:`Bearer ${token}`,...(options.headers||{})}});
            const j=await r.json();assert(r.ok&&j.success===true,`CF_ERROR ${r.status} ${JSON.stringify(j.errors||j)}`);return j.result;
          }
          const deps=await api(`/scripts/${script}/deployments?per_page=3`);
          const active=deps.deployments?.[0]?.versions?.[0]?.version_id;assert(active,'ACTIVE_MISSING');
          const v=await api(`/workers/${script}/versions/${active}?include=modules`);
          const needles=['BULK SNAPSHOT','CLICK REQUESTS','books in snapshot','FULL MARKET · BOOKMAKERS','FULL MARKET','snapshot · DEC','in snapshot'];
          const hits=[];
          for(const m of v.modules||[]){
            if(!m.content_base64)continue;
            const t=Buffer.from(m.content_base64,'base64').toString('utf8');
            for(const n of needles){
              let pos=0,count=0;
              while(true){
                const i=t.toLowerCase().indexOf(n.toLowerCase(),pos);
                if(i<0)break;
                hits.push({module:m.name,needle:n,index:i,excerpt:t.slice(Math.max(0,i-1800),Math.min(t.length,i+4200))});
                pos=i+n.length;
                if(++count>=12)break;
              }
            }
          }
          console.log('ACTIVE_VERSION='+active);
          console.log('HITS='+JSON.stringify(hits));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
