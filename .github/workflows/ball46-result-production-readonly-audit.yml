name: BALL46 active settlement read-only audit
on:
  workflow_dispatch:
  push:
    branches:
      - prep/goaloo-final-result-20261017
    paths:
      - integrations/result-provider-router/audit-runtime.mjs
      - .github/workflows/ball46-result-production-readonly-audit.yml
permissions:
  contents: read
jobs:
  inspect-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: GET metadata and read-only Ball46 engine sources
        run: node integrations/result-provider-router/audit-runtime.mjs
      - name: Upload sanitized diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-settlement-owner-readonly
          path: ball46-settlement-owner-readonly.json
          retention-days: 7
          if-no-files-found: warn
