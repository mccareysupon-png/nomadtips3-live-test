name: NOMAD 3.42 Feed Diagnose

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nomad342-feed-diagnose.yml'
      - 'nomad-live-342/runtime-config.js'
      - 'nomad-live-web-production/src/index.js'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Compare upstream worker and canary same-origin feed
        shell: bash
        run: |
          set -u
          targets=(
            'https://nomadtips3-live-engine-342-test.mccarey-supon.workers.dev/feed?force=1'
            'https://nomadtips3-live-web-production-canary.mccarey-supon.workers.dev/nomad-live-342/feed?force=1'
          )
          rc=0
          for target in "${targets[@]}"; do
            echo "=== TARGET $target ==="
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl -sS --connect-timeout 10 --max-time 35 -D "$headers" -o "$body" -w '%{http_code}' "$target" || true)"
            echo "HTTP=$code"
            sed -n '1,40p' "$headers" || true
            echo '--- BODY PREFIX ---'
            head -c 3000 "$body" || true
            echo
            TARGET="$target" CODE="$code" BODY_PATH="$body" python - <<'PY'
          import json, os, sys
          target=os.environ['TARGET']; code=os.environ['CODE']; path=os.environ['BODY_PATH']
          raw=open(path,'rb').read().decode('utf-8','replace')
          print('TARGET=',target)
          print('HTTP_CODE=',code)
          try: data=json.loads(raw)
          except Exception as e:
              print('JSON_PARSE_ERROR=',repr(e)); sys.exit(1)
          matches=data.get('matches') if isinstance(data,dict) else None
          print('VERSION=',data.get('version') if isinstance(data,dict) else None)
          print('OK=',data.get('ok') if isinstance(data,dict) else None)
          print('MATCH_COUNT=',len(matches) if isinstance(matches,list) else 'NOT_LIST')
          if code!='200' or not isinstance(data,dict) or str(data.get('version'))!='3.42' or not isinstance(matches,list) or data.get('ok') is False:
              sys.exit(1)
          PY
            status=$?
            if [ "$status" -ne 0 ]; then rc=1; fi
            rm -f "$headers" "$body"
          done
          exit "$rc"
