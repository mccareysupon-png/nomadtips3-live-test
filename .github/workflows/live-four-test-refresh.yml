name: Central Live Refresh 15-30-60

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/live-four-test-refresh.yml"
      - "scripts/live_refresh.py"
  schedule:
    - cron: "*/5 10-16 3 8 *"

permissions:
  contents: write
  actions: write

concurrency:
  group: nomad-central-live-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      TARGET_DATE: "2026-08-03"
      RUN_SECONDS: "285"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure dynamic live matches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          active_files = [
              "live-data-cambodia-timor-leste.json",
              "live-data-drukpa-paro.json",
          ]
          Path("live-matches.json").write_text(
              json.dumps({"files": active_files}, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          seed_path = Path("live-data-drukpa-paro.json")
          if not seed_path.exists():
              seed = {
                  "source": "manual-live-seed",
                  "fetched_at_utc": "2026-08-03T12:20:00Z",
                  "http_status": 200,
                  "match": {
                      "id": None,
                      "sport": "football",
                      "league": "Premier League",
                      "country": "Bhutan",
                      "home": {"name": "Drukpa", "short_name": "Drukpa"},
                      "away": {"name": "Paro", "short_name": "Paro"},
                      "kickoff_utc": "2026-08-03T12:00:00Z",
                      "status": "1H",
                      "status_long": "First Half",
                      "elapsed": 18,
                      "score": {"home": 0, "away": 1},
                      "halftime_score": {"home": None, "away": None},
                      "fulltime_score": {"home": None, "away": None},
                      "pick": "Live System Test",
                      "confidence": None,
                      "predicted_score": None,
                      "stats": {},
                      "events": [],
                  },
                  "api_response": {},
                  "stored_response": {"mode": "fast-live-test", "cycle": 0},
                  "live_meta": {"score_updated_at": "2026-08-03T12:20:00Z"},
              }
              seed_path.write_text(json.dumps(seed, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          script_path = Path("scripts/live_refresh.py")
          script = script_path.read_text(encoding="utf-8")
          match_config = '''MATCHES = [
              ("live-data-cambodia-timor-leste.json", r"cambodia", r"timorleste|easttimor"),
              ("live-data-drukpa-paro.json", r"drukpa|drukpafc", r"parofc|paro"),
          ]

          LIVE_ALIASES = {
              "live-data-drukpa-paro.json": ["live-data-bss-sporting-east-bengal.json"],
          }

          '''
          script = re.sub(
              r"MATCHES = \[\n.*?\n\]\n\n(?:LIVE_ALIASES = \{.*?\}\n\n)?",
              match_config,
              script,
              count=1,
              flags=re.S,
          )
          if "Compatibility alias for already-open browser tabs" not in script:
              script = script.replace(
                  '        git_publish(changed_paths, f"Live refresh {timestamp}")',
                  '''        # Compatibility alias for already-open browser tabs that still know the old file list.
                  for entry in entries:
                      for alias_name in LIVE_ALIASES.get(entry["path"].name, []):
                          alias_path = Path(alias_name)
                          alias_text = json.dumps(entry["data"], ensure_ascii=False, indent=2) + "\\n"
                          if not alias_path.exists() or alias_path.read_text(encoding="utf-8") != alias_text:
                              alias_path.write_text(alias_text, encoding="utf-8")
                              changed_paths.append(alias_path)

                  manifest_path = Path("live-matches.json")
                  manifest = {
                      "files": [
                          entry["path"].name
                          for entry in entries
                          if str(entry["data"].get("match", {}).get("status") or "").upper() not in TERMINAL
                      ]
                  }
                  manifest_text = json.dumps(manifest, ensure_ascii=False, indent=2) + "\\n"
                  if not manifest_path.exists() or manifest_path.read_text(encoding="utf-8") != manifest_text:
                      manifest_path.write_text(manifest_text, encoding="utf-8")
                      changed_paths.append(manifest_path)

                  git_publish(changed_paths, f"Live refresh {timestamp}")'''
              )
          script_path.write_text(script, encoding="utf-8")

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          index = re.sub(
              r"    const sources=\[\n.*?\n\s*\];",
              "    const sourceRoots=new Map();",
              index,
              count=1,
              flags=re.S,
          )
          dynamic_boot = '''    const host=document.getElementById('matches');
              function updateVisibleCount(){const n=document.querySelectorAll('.shell').length;document.getElementById('matchCount').textContent=`LIVE SCORES BETA · ${n} ${n===1?'MATCH':'MATCHES'}`}
              async function syncSources(){
                try{
                  const response=await fetch(`${RAW}live-matches.json?t=${Date.now()}`,{cache:'no-store'});
                  if(!response.ok)throw new Error(`Manifest HTTP ${response.status}`);
                  const manifest=await response.json();
                  const files=Array.isArray(manifest.files)?manifest.files:[];
                  const wanted=new Set(files);
                  for(const [name,state] of sourceRoots){
                    if(!wanted.has(name)){
                      clearInterval(state.loadTimer);clearInterval(state.clockTimer);
                      state.root.remove();sourceRoots.delete(name);
                    }
                  }
                  for(const name of files){
                    if(sourceRoots.has(name))continue;
                    const src={file:`${RAW}${name}`,fallbackSource:'manual-live-seed'};
                    host.insertAdjacentHTML('beforeend',card(name));
                    const root=host.lastElementChild;
                    bindTabs(root);loadOne(root,src);
                    const loadTimer=setInterval(()=>loadOne(root,src),15000);
                    const clockTimer=setInterval(()=>refreshClock(root),15000);
                    sourceRoots.set(name,{root,loadTimer,clockTimer});
                  }
                  updateVisibleCount();
                }catch(error){console.error(error)}
              }
              syncSources();setInterval(syncSources,15000);'''
          index = re.sub(
              r"    document\.getElementById\('matchCount'\)\.textContent=.*?sources\.forEach\(.*?\);",
              dynamic_boot,
              index,
              count=1,
              flags=re.S,
          )
          index_path.write_text(index, encoding="utf-8")
          PY

          git add index.html scripts/live_refresh.py live-data-drukpa-paro.json live-matches.json
          if ! git diff --cached --quiet; then
            git commit -m "Enable dynamic live match manifest"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Run centralized live-data server loop
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_FOOTBALL_KEY:-}"
          python3 scripts/live_refresh.py

      - name: Start next cycle while a match is active
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ACTIVE=$(python3 - <<'PY'
          import json
          from pathlib import Path
          terminal = {"FT", "AET", "PEN", "CANC", "ABD", "AWD", "WO", "PST"}
          files = ["live-data-cambodia-timor-leste.json", "live-data-drukpa-paro.json"]
          active = False
          for name in files:
              path = Path(name)
              if not path.exists():
                  continue
              data = json.loads(path.read_text(encoding="utf-8"))
              status = str(data.get("match", {}).get("status") or "").upper()
              if status not in terminal:
                  active = True
                  break
          print("yes" if active else "no")
          PY
          )
          NOW=$(date -u +%s)
          END=$(date -u -d '2026-08-03 16:30:00' +%s)
          if [ "$ACTIVE" = "yes" ] && [ "$NOW" -lt "$END" ]; then
            curl --fail-with-body -L -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/live-four-test-refresh.yml/dispatches" \
              -d '{"ref":"main"}'
          else
            echo "No active matches remain; refresh chain stopped."
          fi
