name: Central Live Refresh 15-30-60

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/live-four-test-refresh.yml"
      - "scripts/live_refresh.py"
  schedule:
    - cron: "*/5 10-16 3 8 *"

permissions:
  contents: write
  actions: write

concurrency:
  group: nomad-central-live-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      TARGET_DATE: "2026-08-03"
      RUN_SECONDS: "285"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure current active matches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          seed_path = Path("live-data-drukpa-paro.json")
          if not seed_path.exists():
              seed = {
                  "source": "manual-live-seed",
                  "fetched_at_utc": "2026-08-03T12:20:00Z",
                  "http_status": 200,
                  "match": {
                      "id": None,
                      "sport": "football",
                      "league": "Bank of Bhutan Premier League",
                      "country": "Bhutan",
                      "home": {"name": "Drukpa", "short_name": "Drukpa"},
                      "away": {"name": "Paro FC", "short_name": "Paro"},
                      "kickoff_utc": "2026-08-03T12:00:00Z",
                      "status": "1H",
                      "status_long": "First Half",
                      "elapsed": 18,
                      "score": {"home": 0, "away": 1},
                      "halftime_score": {"home": None, "away": None},
                      "fulltime_score": {"home": None, "away": None},
                      "pick": "Live System Test",
                      "confidence": None,
                      "predicted_score": None,
                      "stats": {
                          "attacks": {"home": None, "away": None},
                          "dangerous_attacks": {"home": None, "away": None},
                          "expected_goals": {"home": None, "away": None},
                          "possession": {"home": None, "away": None},
                          "shots": {"home": None, "away": None},
                          "shots_on_target": {"home": None, "away": None},
                          "shots_off_target": {"home": None, "away": None},
                          "blocked_shots": {"home": None, "away": None},
                          "shots_inside_box": {"home": None, "away": None},
                          "shots_outside_box": {"home": None, "away": None},
                          "corners": {"home": None, "away": None},
                          "fouls": {"home": None, "away": None},
                          "offsides": {"home": None, "away": None},
                          "goalkeeper_saves": {"home": None, "away": None},
                          "total_passes": {"home": None, "away": None},
                          "accurate_passes": {"home": None, "away": None},
                          "pass_accuracy": {"home": None, "away": None},
                          "yellow_cards": {"home": 0, "away": 0},
                          "red_cards": {"home": 0, "away": 0},
                          "provider_all": {"home": {}, "away": {}},
                      },
                      "events": [],
                  },
                  "api_response": {},
                  "stored_response": {"mode": "fast-live-test", "cycle": 0, "details_refreshed": False},
                  "live_meta": {
                      "score_updated_at": "2026-08-03T12:20:00Z",
                      "events_updated_at": None,
                      "stats_updated_at": None,
                  },
              }
              seed_path.write_text(json.dumps(seed, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          script_path = Path("scripts/live_refresh.py")
          script = script_path.read_text(encoding="utf-8")
          matches = '''MATCHES = [
              ("live-data-cambodia-timor-leste.json", r"cambodia", r"timorleste|easttimor"),
              ("live-data-drukpa-paro.json", r"drukpa|drukpafc", r"parofc|paro"),
          ]

          '''
          script = re.sub(r"MATCHES = \[\n.*?\n\]\n\n", matches, script, count=1, flags=re.S)
          script_path.write_text(script, encoding="utf-8")

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          sources = '''    const sources=[
              {file:`${RAW}live-data-cambodia-timor-leste.json`,fallbackSource:'manual-live-seed'},
              {file:`${RAW}live-data-drukpa-paro.json`,fallbackSource:'manual-live-seed'}
            ];'''
          index = re.sub(r"    const sources=\[\n.*?\n    \];", sources, index, count=1, flags=re.S)
          index = index.replace("LIVE SCORES BETA · 4 MATCHES", "LIVE SCORES BETA · 2 MATCHES")
          index = index.replace("--lime:#b7f34a", "--yellow:#f2c94c")
          index = index.replace("var(--lime)", "var(--yellow)")
          index = index.replace(".tab.active{color:var(--green);background:#202020;box-shadow:inset 0 -2px 0 var(--green)}", ".tab.active{color:var(--yellow);background:#202020;box-shadow:inset 0 -2px 0 var(--yellow)}")
          index = index.replace(".main-nav a.active{color:var(--green)}", ".main-nav a.active{color:var(--yellow)}")
          index = index.replace(".fill{height:100%;background:var(--green)}", ".fill{height:100%;background:var(--yellow)}")
          index = index.replace(
              "    async function loadOne(root,src){try{const r=await fetch(`${src.file}?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const data=await r.json();if(!data.source)data.source=src.fallbackSource;render(root,data)}catch(e){node(root,'statusPill').textContent='LOAD ERROR';node(root,'statusPill').className='live-pill error';node(root,'updated').textContent=String(e.message||e)}}",
              "    function updateVisibleCount(){const n=document.querySelectorAll('.shell').length;document.getElementById('matchCount').textContent=`LIVE SCORES BETA · ${n} ${n===1?'MATCH':'MATCHES'}`}\n    async function loadOne(root,src){try{const r=await fetch(`${src.file}?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const data=await r.json();if(!data.source)data.source=src.fallbackSource;const status=String(data.match?.status||'').toUpperCase();if(['FT','AET','PEN','CANC','ABD','AWD','WO','PST'].includes(status)){root.remove();updateVisibleCount();return}render(root,data)}catch(e){node(root,'statusPill').textContent='LOAD ERROR';node(root,'statusPill').className='live-pill error';node(root,'updated').textContent=String(e.message||e)}}"
          )
          index_path.write_text(index, encoding="utf-8")
          PY

          git add index.html scripts/live_refresh.py live-data-drukpa-paro.json
          if ! git diff --cached --quiet; then
            git commit -m "Activate Drukpa vs Paro live match"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Run centralized live-data server loop
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_FOOTBALL_KEY:-}"
          python3 scripts/live_refresh.py

      - name: Start next cycle while a match is active
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ACTIVE=$(python3 - <<'PY'
          import json
          from pathlib import Path
          terminal = {"FT", "AET", "PEN", "CANC", "ABD", "AWD", "WO", "PST"}
          files = [
              "live-data-cambodia-timor-leste.json",
              "live-data-drukpa-paro.json",
          ]
          active = False
          for name in files:
              path = Path(name)
              if not path.exists():
                  continue
              data = json.loads(path.read_text(encoding="utf-8"))
              status = str(data.get("match", {}).get("status") or "").upper()
              if status not in terminal:
                  active = True
                  break
          print("yes" if active else "no")
          PY
          )
          NOW=$(date -u +%s)
          END=$(date -u -d '2026-08-03 16:30:00' +%s)
          if [ "$ACTIVE" = "yes" ] && [ "$NOW" -lt "$END" ]; then
            curl --fail-with-body -L -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/live-four-test-refresh.yml/dispatches" \
              -d '{"ref":"main"}'
          else
            echo "No active matches remain; refresh chain stopped."
          fi
