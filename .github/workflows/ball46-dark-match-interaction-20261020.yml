name: BALL46 Dark Match Interaction Audit 20261020
on:
  push:
    branches: [codex/ball46-dark-match-hover-active-20261020]
    paths:
      - '.github/workflows/ball46-dark-match-interaction-20261020.yml'
      - 'deploy-assets/match-interaction-20261020/audit.mjs'
permissions:
  contents: read
jobs:
  inspect-interaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only Production hover active inspection
        working-directory: deploy-assets/match-interaction-20261020
        run: |
          node --check audit.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
          node audit.mjs
