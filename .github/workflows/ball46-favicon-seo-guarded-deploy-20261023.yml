name: BALL46 favicon and Live Betting Tips guarded Production deploy 20261023
on:
  push:
    branches: [audit/ball46-favicon-seo-20261023]
    paths:
      - '.github/workflows/ball46-favicon-seo-guarded-deploy-20261023.yml'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  guarded-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate patch syntax before Cloudflare writes
        working-directory: deploy-assets/ball46-favicon-seo-20261023
        run: |
          node --check icon.mjs
          node --check patch.mjs
          node --check deploy.mjs
      - name: Verify current Worker source, test candidate, guarded cutover with rollback
        working-directory: deploy-assets/ball46-favicon-seo-20261023
        run: node deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-favicon-seo-proof-${{ github.run_id }}
          path: deploy-assets/ball46-favicon-seo-20261023/audit/result.json
          retention-days: 30
