name: One-off Odds-API.io Live AH Smoke Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/odds-api-smoke-test.yml"

permissions:
  contents: read
  statuses: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Probe live football and 1xBet Spread without exposing credential
        shell: bash
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          KEY="$ODDS_API_KEY"
          if [ -z "$KEY" ]; then
            git fetch --no-tags --depth=1 origin a1fd83c41dc3262dc1579f641552054979fd8fe7 >/dev/null 2>&1 || true
            KEY=$(git show a1fd83c41dc3262dc1579f641552054979fd8fe7:.github/workflows/car34-cloudflare-deploy.yml 2>/dev/null | sed -n 's/^[[:space:]]*TEMP_ODDS_API_KEY:[[:space:]]*//p' | head -n 1)
          fi

          RC=1
          DESC="ERROR Odds-API.io credential unavailable"
          if [ -n "$KEY" ]; then
            export ODDS_API_KEY="$KEY"
            set +e
            node <<'NODE'
          const fs=require('node:fs');
          const key=process.env.ODDS_API_KEY;
          const base='https://api.odds-api.io/v3';
          const finish=(description,code)=>{fs.writeFileSync('/tmp/odds-smoke-desc.txt',description);console.log(description);process.exit(code);};
          async function get(path,params={}){
            const url=new URL(base+path);
            url.searchParams.set('apiKey',key);
            for(const [k,v] of Object.entries(params)) url.searchParams.set(k,String(v));
            const r=await fetch(url,{headers:{accept:'application/json','user-agent':'NOMADTIPS3-ODDS-SMOKE/1.0'}});
            const text=await r.text();
            if(!r.ok) throw new Error(`${path} HTTP ${r.status}: ${text.slice(0,120)}`);
            return JSON.parse(text);
          }
          try{
            const live=await get('/events/live',{sport:'football'});
            if(!Array.isArray(live)) finish('ERROR live response is not an array',4);
            if(!live.length) finish('NO LIVE football events returned by Odds-API.io',2);
            const ids=live.map(x=>x?.id).filter(x=>x!=null).slice(0,50);
            let payloadCount=0,bookmakerCount=0,spreadCount=0,proof=null;
            for(let i=0;i<ids.length;i+=10){
              const odds=await get('/odds/multi',{eventIds:ids.slice(i,i+10).join(','),bookmakers:'1xbet'});
              if(!Array.isArray(odds)) continue;
              payloadCount+=odds.length;
              for(const payload of odds){
                const bookies=payload?.bookmakers||{};
                const keyName=Object.keys(bookies).find(k=>k.toLowerCase()==='1xbet');
                const markets=keyName&&Array.isArray(bookies[keyName])?bookies[keyName]:[];
                if(markets.length) bookmakerCount++;
                const spread=markets.find(m=>String(m?.name||'').toLowerCase()==='spread');
                const rows=Array.isArray(spread?.odds)?spread.odds:[];
                if(rows.length){
                  spreadCount++;
                  if(!proof){
                    const row=rows.find(r=>r?.hdp!=null&&r?.home!=null&&r?.away!=null)||rows[0];
                    proof={eventId:payload?.id,line:row?.hdp,home:row?.home,away:row?.away,updatedAt:spread?.updatedAt||null};
                  }
                }
              }
              if(proof) break;
            }
            if(proof) finish(`PASS live=${live.length} 1xbet=${bookmakerCount} spread=${spreadCount} line=${proof.line} homeOdds=${proof.home} awayOdds=${proof.away}`,0);
            finish(`NO 1xBet Spread live=${live.length} payloads=${payloadCount} 1xbet=${bookmakerCount}`,3);
          }catch(error){
            finish(`ERROR ${String(error?.message||error).slice(0,110)}`,5);
          }
          NODE
            RC=$?
            set -e
            DESC=$(cat /tmp/odds-smoke-desc.txt 2>/dev/null || echo "ERROR smoke test produced no summary")
          fi

          STATE=error
          if [ "$RC" -eq 0 ]; then STATE=success; fi
          SHORT_DESC=$(printf '%s' "$DESC" | cut -c1-140)
          TARGET_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions"
          PAYLOAD=$(jq -n --arg state "$STATE" --arg context "odds-api/live-ah-smoke" --arg description "$SHORT_DESC" --arg target_url "$TARGET_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$PAYLOAD" >/dev/null
          echo "$DESC"
          exit "$RC"
