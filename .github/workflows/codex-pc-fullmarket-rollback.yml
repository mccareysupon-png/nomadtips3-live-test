name: "[Codex PC] Roll back BALL46 Full Market V3"
on:
  push:
    branches: [codex-pc/rollback-ball46-fullmarket-v3-20261121]
    paths: [.github/workflows/codex-pc-fullmarket-rollback.yml]
permissions:
  contents: read
concurrency:
  group: ball46-production-ui-release
  cancel-in-progress: false
jobs:
  rollback:
    if: github.ref == 'refs/heads/codex-pc/rollback-ball46-fullmarket-v3-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Restore the saved version after Event Flow scroll QA
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const { CLOUDFLARE_API_TOKEN: token, CLOUDFLARE_ACCOUNT_ID: account } = process.env;
          assert(token && account);
          const path = '/scripts/ball46-production/deployments';
          const api = 'https://api.cloudflare.com/client/v4/accounts/' + account + '/workers';
          const candidate = '9952641a-e517-412b-9689-16dc442913c0';
          const rollback = '0797b888-ff90-42d1-af42-1f9d95844a2b';
          async function call(endpoint, body) {
            assert(body === undefined || endpoint === path);
            const response = await fetch(api + endpoint, {
              method: body === undefined ? 'GET' : 'POST',
              headers: { Authorization: 'Bearer ' + token, 'content-type': 'application/json' },
              body: body === undefined ? undefined : JSON.stringify(body), signal: AbortSignal.timeout(20000),
            });
            const result = await response.json();
            assert(response.ok && result.success, JSON.stringify(result.errors));
            return result.result;
          }
          async function active() {
            const current = (await call(path + '?per_page=1')).deployments[0];
            assert(current.versions.length === 1 && Number(current.versions[0].percentage) === 100);
            return { deploymentId: current.id, versionId: current.versions[0].version_id };
          }
          const before = await active();
          console.log('B46_PRODUCTION_BEFORE_ROLLBACK', JSON.stringify(before));
          if (before.versionId !== rollback) {
            assert.equal(before.versionId, candidate, 'Unrelated Production release is active');
            const saved = await call('/workers/ball46-production/versions/' + rollback + '?include=modules');
            assert(saved.modules?.length && saved.main_module);
            assert.deepEqual(await active(), before, 'Production moved during rollback preparation');
            await call(path, {
              strategy: 'percentage', versions: [{ version_id: rollback, percentage: 100 }],
              annotations: { 'workers/message': 'Codex PC | Restore saved version after Event Flow viewport QA' },
            });
          }
          let verified = false;
          for (let attempt = 0; attempt < 18; attempt++) {
            const state = await active();
            const response = await fetch('https://www.ball46.com/index.html?status=live', {
              headers: { 'cache-control': 'no-cache' }, signal: AbortSignal.timeout(12000),
            });
            const html = await response.text();
            if (state.versionId === rollback && response.ok && html.includes('codex-pc-right-sidebar') &&
                !html.includes('b46-fullmarket-odds-v3-style-production')) {
              console.log('B46_PRODUCTION_ROLLBACK_VERIFIED', JSON.stringify(state));
              verified = true;
              break;
            }
            await new Promise(resolve => setTimeout(resolve, 1800));
          }
          assert(verified, 'Rollback is not yet visible on the live website');
          NODE
