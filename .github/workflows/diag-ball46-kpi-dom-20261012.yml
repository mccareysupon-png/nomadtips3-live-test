name: DIAG Ball46 KPI DOM 20261012

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-ball46-kpi-dom-20261012.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Inspect live Statistics KPI DOM
        run: |
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          import {existsSync} from 'node:fs';
          const exe=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(existsSync);
          const browser=await puppeteer.launch({headless:true,executablePath:exe,args:['--no-sandbox']});
          try{
            const page=await browser.newPage();
            await page.setViewport({width:1440,height:1100});
            await page.goto('https://ball46.com/?view=statistics&kpiDom='+Date.now(),{waitUntil:'networkidle2',timeout:90000});
            await new Promise(r=>setTimeout(r,4500));
            const out=await page.evaluate(()=>{
              const all=[...document.querySelectorAll('body *')];
              const hit=all.find(e=>/Current sample/.test(e.textContent||'')&&/Awaiting settlement/.test(e.textContent||'')&&/Recorded entry/.test(e.textContent||''));
              if(!hit)return {found:false,bodyText:document.body.innerText.slice(0,10000)};
              let el=hit;for(let i=0;i<5&&el.parentElement;i++){if((el.innerText||'').length<5000)el=el.parentElement;else break}
              return {found:true,tag:hit.tagName,cls:hit.className,html:hit.outerHTML,ancestor:el.outerHTML.slice(0,30000)};
            });
            console.log(JSON.stringify(out,null,2));
          }finally{await browser.close()}
          NODE
