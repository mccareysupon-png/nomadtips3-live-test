name: ONE SHOT - Ball46 Leagues Reset 20260928

on:
  push:
    branches:
      - ops/ball46-leagues-reset-20260928-use
    paths:
      - '.github/workflows/ball46-leagues-reset-20260928.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reset stale LEAGUES filter safely
        shell: bash
        run: bash .github/scripts/ball46_leagues_reset_20260928.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-leagues-reset-${{ github.run_id }}
          path: /tmp/b46-leagues-reset
          if-no-files-found: ignore
          retention-days: 30
