name: Deploy NOMAD 3.43 Ultra Full Market Canary

on:
  push:
    branches: [work/nomad343-ultra-10book-full-market-ui-20260912]
    paths:
      - 'nomad-live-343/full-odds-main-343.js'
      - 'nomad-live-343/index.html'
      - 'workers/nomadtips3-343-full-market/**'
      - 'workers/nomadtips3-343-preview/**'
      - '.github/workflows/deploy-343-ultra-full-market-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
  CANARY_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev

jobs:
  deploy-ultra-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard isolated scope
        run: |
          set -euo pipefail
          git fetch origin work/nomad343-clean-bet365-ui:refs/remotes/origin/work/nomad343-clean-bet365-ui
          git diff --name-only refs/remotes/origin/work/nomad343-clean-bet365-ui...HEAD | tee /tmp/changed.txt
          if grep -Ev '^(nomad-live-343/(full-odds-main-343\.js|index\.html)|workers/nomadtips3-343-full-market/.*|workers/nomadtips3-343-preview/.*|\.github/workflows/deploy-343-ultra-full-market-preview\.yml)$' /tmp/changed.txt | grep -q .; then
            echo 'Unexpected file outside isolated Full Market scope'; exit 1
          fi
          if git diff --quiet refs/remotes/origin/work/nomad343-clean-bet365-ui...HEAD -- workers/nomadtips3-engine-343 workers/nomadtips3-5usd-hub-343; then
            echo 'Signal/Engine/HUB untouched: OK'
          else
            echo 'Signal/Engine/HUB changed unexpectedly'; exit 1
          fi

      - name: Validate Full Market code and locked contract
        run: |
          set -euo pipefail
          node --check nomad-live-343/full-odds-main-343.js
          node --check workers/nomadtips3-343-preview/src/index.js
          node --check workers/nomadtips3-343-full-market/src/index.js
          grep -Fq "const VERSION='343-full-odds-main-v5-ultra-10book'" nomad-live-343/full-odds-main-343.js
          grep -Fq "const API='/api/full-market/fixture-odds'" nomad-live-343/full-odds-main-343.js
          grep -Fq "home left · away right" nomad-live-343/full-odds-main-343.js
          grep -Fq "FULL MARKET · 10 BOOKS" nomad-live-343/full-odds-main-343.js
          grep -Fq "bookmakers=bet365" workers/nomadtips3-engine-343/src/index.js
          grep -Fq "signal.bookmaker='Bet365'" workers/nomadtips3-engine-343/src/index.js || grep -Fq "bookmaker:'Bet365'" workers/nomadtips3-engine-343/src/index.js
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('workers/nomadtips3-343-full-market/src/index.js','utf8');
          const expected=['bet365','pinnacle','crown','1xbet','12bet','interwetten','macauslot','18bet','vcbet','easybets'];
          let at=-1;
          for(const slug of expected){const i=s.indexOf(`slug: '${slug}'`);if(i<0||i<=at)throw Error(`book order ${slug}`);at=i}
          if(!s.includes('ACCOUNT_RATE_LIMIT_PER_MIN = 40'))throw Error('plan rate');
          if(!s.includes('SIDECAR_SOFT_LIMIT_PER_MIN = 24'))throw Error('soft rate');
          console.log('10-book order and 40/min guard: OK');
          NODE

      - name: Validate deploy credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$FIVEDOLLAR_API_KEY"

      - name: Dry-run Full Market sidecar
        working-directory: workers/nomadtips3-343-full-market
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.toml

      - name: Deploy Full Market sidecar
        working-directory: workers/nomadtips3-343-full-market
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.toml

      - name: Bind 5USD Ultra API key to Full Market sidecar
        working-directory: workers/nomadtips3-343-full-market
        run: printf '%s' "$FIVEDOLLAR_API_KEY" | npx --yes wrangler@4.92.0 secret put FIVEDOLLAR_API_KEY --config wrangler.toml

      - name: Dry-run isolated Ultra canary preview
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc

      - name: Deploy isolated Ultra canary preview
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Smoke Signal isolation and 10-book Full Market
        run: |
          set -euo pipefail
          sleep 5
          curl_retry() {
            curl -fsS --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 "$1" -o "$2"
          }

          curl_retry "$CANARY_URL/api/engine/registry?smoke=$RANDOM" /tmp/registry.json
          curl_retry "$CANARY_URL/api/engine/health?smoke=$RANDOM" /tmp/engine.json
          node -e 'const r=require("/tmp/registry.json"),j=require("/tmp/engine.json");if(r.version!=="nomad343-engine-v3-settlement-safe"||j.component!=="NOMAD343_ENGINE"||j.version!=="nomad343-engine-v3-settlement-safe")throw Error("engine changed");console.log("ENGINE UNCHANGED",j.version)'

          curl_retry "$CANARY_URL/api/full-market/health?smoke=$RANDOM" /tmp/full-health.json
          node -e 'const j=require("/tmp/full-health.json");if(j.ok!==true||j.component!=="NOMAD343_FULL_MARKET")throw Error("full market health");if(!Array.isArray(j.bookmakers)||j.bookmakers.length!==10)throw Error("10 books");if(j.rate?.accountLimitPerMinute!==40||j.rate?.sidecarSoftLimitPerMinute!==24)throw Error("rate policy");console.log("FULL MARKET",j.version,j.bookmakers.map(x=>x.slug).join(","))'

          curl_retry "$CANARY_URL/api/engine/board?smoke=$RANDOM" /tmp/board.json
          node - <<'NODE'
          const fs=require('fs'),j=require('/tmp/board.json');
          if(j.ok!==true) throw Error(j.error||'board not ready');
          const f=Array.isArray(j.fixtures)?j.fixtures:[];
          const live=f.find(x=>x?.fixtureId&&String(x.boardState||'').toLowerCase()==='live');
          const pick=live||f.find(x=>x?.fixtureId)||null;
          fs.writeFileSync('/tmp/fixture-id',pick?String(pick.fixtureId):'');
          console.log('SMOKE FIXTURE',pick?.fixtureId||'none');
          NODE
          FIXTURE_ID="$(cat /tmp/fixture-id)"
          if [ -n "$FIXTURE_ID" ]; then
            curl_retry "$CANARY_URL/api/full-market/fixture-odds?fixtureId=$FIXTURE_ID&smoke=$RANDOM" /tmp/full.json
            node -e 'const j=require("/tmp/full.json");if(j.ok!==true)throw Error(j.error||"full market request");if(!Array.isArray(j.requestedBookmakers)||j.requestedBookmakers.length!==10)throw Error("requested books");console.log("10-BOOK SNAPSHOT",j.fixtureId,"available",(j.availableBookmakers||[]).join(","),"source",j.source)'
          fi

          curl_retry "$CANARY_URL/?smoke=$RANDOM" /tmp/index.html
          curl_retry "$CANARY_URL/full-odds-main-343.js?smoke=$RANDOM" /tmp/full-ui.js
          grep -Fq '343-full-odds-main-v5-ultra-10book' /tmp/index.html
          grep -Fq "const VERSION='343-full-odds-main-v5-ultra-10book'" /tmp/full-ui.js
          grep -Fq 'FULL MARKET · 10 BOOKS' /tmp/full-ui.js
          echo "CANARY OK: $CANARY_URL"
