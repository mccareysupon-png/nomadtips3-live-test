name: Deploy Ball46 Search Card Black 20261007
on:
  push:
    branches:
      - work/ball46-search-card-black-20261007
    paths:
      - '.github/workflows/deploy-ball46-search-card-black-20261007.yml'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PATCH_SOURCE_BRANCH: work/ball46-search-card-black-20261007
      DEPLOY_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-search-card-black-20261007
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts acorn@8
      - name: Deploy guarded pure-black search card
        working-directory: deploy-assets/search-card-black-20261007
        run: node deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-search-card-black-deploy-${{ github.run_id }}
          path: deploy-assets/search-card-black-20261007/audit
          retention-days: 30
