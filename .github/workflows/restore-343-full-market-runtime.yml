name: Restore NOMAD 3.43 Full Market Runtime

on:
  push:
    branches: [work/nomad343-clean-bet365-ui]
    paths:
      - '.github/workflows/restore-343-full-market-runtime.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore Full Market worker
        working-directory: workers/nomadtips3-343-full-market
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.toml
      - name: Restore Full Market 5USD secret
        working-directory: workers/nomadtips3-343-full-market
        run: printf '%s' "$FIVEDOLLAR_API_KEY" | npx --yes wrangler@4.92.0 secret put FIVEDOLLAR_API_KEY --config wrangler.toml
      - name: Restore Engine 5USD secret
        working-directory: workers/nomadtips3-engine-343
        run: printf '%s' "$FIVEDOLLAR_API_KEY" | npx --yes wrangler@4.92.0 secret put FIVEDOLLAR_API_KEY --config wrangler.toml
