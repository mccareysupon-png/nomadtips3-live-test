name: BALL46 deployment check READ ONLY diagnosis
on:
  push:
    branches: [codex/ball46-football-icon-20261111]
    paths: ['work/menu-football-test-20261111/check-request.json']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Diagnose check and read zone rules only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node work/menu-football-test-20261111/check-audit.mjs
      - name: Preserve report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/menu-football-test-20261111/check-audit/report.json
          git commit -m "Record deployment check read-only diagnosis [skip ci]"
          git push origin HEAD:codex/ball46-football-icon-20261111
