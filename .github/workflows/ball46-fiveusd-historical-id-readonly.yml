name: BALL46 fiveUSD historical ID audit read only
on:
  workflow_dispatch:
  push:
    branches:
      - prep/goaloo-final-result-20261017
    paths:
      - integrations/result-provider-router/audit-fiveusd-history.mjs
      - .github/workflows/ball46-fiveusd-historical-id-readonly.yml
permissions:
  contents: read
jobs:
  inspect-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read official per-fixture history without any writes
        run: node integrations/result-provider-router/audit-fiveusd-history.mjs
      - name: Upload sanitized ID audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiveusd-historical-identity
          path: fiveusd-history-identity-readonly.json
          retention-days: 7
          if-no-files-found: warn
