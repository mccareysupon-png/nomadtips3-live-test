name: CAR 3.1 Atomic Core Stats Verify

on:
  push:
    branches:
      - fix/car31-detailin-atomic-pairs-20260816
    paths:
      - car3-1-hybrid-live-engine/worker/**
      - car3-1-hybrid-live-engine/test/**
      - .github/workflows/car31-atomic-pairs-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run CAR 3.1 tests
        working-directory: car3-1-hybrid-live-engine
        run: node --test
      - name: Check worker syntax
        working-directory: car3-1-hybrid-live-engine
        run: |
          node --check worker/src/index.js
          node --check worker/src/upgrade.js
          node --check worker/src/settlement-v2.js
          node --check worker/src/animation-v3-source.js
          node --check worker/src/main-v3.js
