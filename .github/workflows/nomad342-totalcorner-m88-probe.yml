name: NOMAD 3.42 M88 Probe Cleanup

on:
  push:
    branches:
      - 'feat/342-totalcorner-inlet'
    paths:
      - '.github/workflows/nomad342-totalcorner-m88-probe.yml'

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PROBE_NAME: nomadtips3-live-engine-342-m88-probe
  PROBE_URL: https://nomadtips3-live-engine-342-m88-probe.mccarey-supon.workers.dev

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate exact temporary target
        shell: bash
        run: |
          set -euo pipefail
          test "$PROBE_NAME" = 'nomadtips3-live-engine-342-m88-probe'
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"

      - name: Delete only isolated probe Worker
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$PROBE_NAME")
          cat /tmp/delete.json
          test "$code" = '200' || test "$code" = '404'

      - name: Verify probe URL is gone
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$PROBE_URL/" || true)
            if [ "$code" = '404' ] || [ "$code" = '000' ]; then exit 0; fi
            sleep 3
          done
          echo '::error::Temporary M88 probe Worker still responds'
          exit 1
