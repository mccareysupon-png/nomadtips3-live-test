name: BALL46 V13 Featured and Globe Overlap Audit Read Only
on:
  push:
    branches: [fix/ball46-featured-flag-flicker-v13-20261022]
    paths:
      - '.github/workflows/ball46-v13-flicker-audit.yml'
      - 'deploy-assets/featured-flicker-v13/audit.mjs'
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Compare live Featured DOM and flag containers on PC and mobile, without edits
        working-directory: deploy-assets/featured-flicker-v13
        run: |
          npm install --no-save --ignore-scripts puppeteer-core@24
          node audit.mjs
      - name: Preserve measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-v13-featured-globe-overlap-readonly
          path: deploy-assets/featured-flicker-v13/audit-proof/
          retention-days: 15
          if-no-files-found: warn