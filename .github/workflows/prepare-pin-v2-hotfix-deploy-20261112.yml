name: Prepare BALL46 Pin V2 Hotfix Deploy 20261112
on:
  push:
    branches: [test/ball46-pin-v2-mobile-fix-20261112]
    paths: ['pinned-fixtures-v2-production/DEPLOY_PREP_READY']
permissions: {contents: read}
jobs:
  prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: test/ball46-pin-v2-mobile-fix-20261112}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check pinned-fixtures-v2-production/deploy.mjs
      - run: node pinned-fixtures-v2-production/deploy-prep-check.mjs
