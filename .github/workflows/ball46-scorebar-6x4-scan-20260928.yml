name: STEP 1 - Ball46 Scorebar 6x4 Read Only Scan 20260928

on:
  push:
    branches:
      - ops/ball46-scorebar-6x4-surgical-20260928
    paths:
      - '.github/workflows/ball46-scorebar-6x4-scan-20260928.yml'
      - '.github/scripts/ball46_scorebar_6x4_scan_20260928.sh'

permissions:
  contents: read
  actions: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download exact current verified favicon production payload
        uses: actions/download-artifact@v4
        with:
          name: ball46-favicon-surgical-36362568908
          path: /tmp/b46-scorebar-base
          repository: mccareysupon-png/nomadtips3-live-test
          run-id: 36362568908
          github-token: ${{ github.token }}
      - name: Read only production lock and scorebar target scan
        shell: bash
        run: bash .github/scripts/ball46_scorebar_6x4_scan_20260928.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-scorebar-6x4-scan-${{ github.run_id }}
          path: /tmp/b46-scorebar-scan
          if-no-files-found: ignore
          retention-days: 30
