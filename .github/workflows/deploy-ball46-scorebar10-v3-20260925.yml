name: Restore Ball46 exact known-good 20:06 20260925

on:
  push:
    branches: [work/ball46-scorebar10-prod-safe-20260925]
    paths:
      - '.github/workflows/deploy-ball46-scorebar10-v3-20260925.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  KNOWN_GOOD_RUN: '36138906292'
  KNOWN_GOOD_COMMIT: '82f7aa9aea5e7f8dcd2731f7308725c095a96f14'
  KNOWN_GOOD_SHA256: '0550a8e5c77c9126ffa886cbfb712e3e2b73d3afdac51cc9969aaf8a8c2f60dc'

jobs:
  restore-dashboard-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download exact pre-change snapshot from successful 20:06 run
        uses: actions/download-artifact@v4
        with:
          name: ball46-pre-scorebar10-v3-36138906292
          path: /tmp/goodbase
          github-token: ${{ github.token }}
          repository: mccareysupon-png/nomadtips3-live-test
          run-id: 36138906292

      - name: Reconstruct exact post-change dashboard from original successful workflow
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/goodbase/dashboard-v2-stage3.js
          git show "$KNOWN_GOOD_COMMIT:.github/workflows/deploy-ball46-scorebar10-v3-20260925.yml" > /tmp/original-workflow.yml
          python3 - <<'PY'
          from pathlib import Path
          wf=Path('/tmp/original-workflow.yml').read_text()
          begin="          cat > /tmp/scorebar-snippet.js <<'JS'\n"
          end="\n          JS\n"
          a=wf.index(begin)+len(begin)
          b=wf.index(end,a)
          raw=wf[a:b]
          lines=[]
          for line in raw.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          snippet='\n'.join(lines)+'\n'
          Path('/tmp/scorebar-snippet.js').write_text(snippet)
          src=Path('/tmp/goodbase/dashboard-v2-stage3.js')
          s=src.read_text()
          anchor='function renderBoard(){'
          if s.count(anchor)!=1:
              raise SystemExit(f'RENDER_BOARD_ANCHOR_COUNT:{s.count(anchor)}')
          s=s.replace(anchor,snippet+anchor.replace('{','{renderScorebar10();'),1)
          Path('/tmp/known-good-dashboard.js').write_text(s)
          PY
          node --check /tmp/scorebar-snippet.js
          node --check /tmp/known-good-dashboard.js
          actual=$(sha256sum /tmp/known-good-dashboard.js | awk '{print $1}')
          [ "$actual" = "$KNOWN_GOOD_SHA256" ] || { echo "KNOWN_GOOD_RECONSTRUCTION_HASH_MISMATCH:$actual"; exit 1; }
          [ "$(grep -Fc 'fetch(' /tmp/goodbase/dashboard-v2-stage3.js)" = "$(grep -Fc 'fetch(' /tmp/known-good-dashboard.js)" ] || { echo FETCH_COUNT_CHANGED; exit 1; }
          grep -Fq 'BALL46_SCOREBAR10_20260925' /tmp/known-good-dashboard.js
          grep -Fq 'function renderBoard(){renderScorebar10();' /tmp/known-good-dashboard.js
          echo "KNOWN_GOOD_2006_RECONSTRUCTED:$actual"

      - name: Mirror current Production shell and create current rollback point
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod /tmp/current-rollback nomad-live-343
          fetch_required(){
            name="$1"; safe="${name//\//_}"
            code=$(curl -sS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 -o "/tmp/prod/$safe" -w '%{http_code}' "$BALL46_WORKER/$name?exact-2006-mirror=${GITHUB_RUN_ID}") || true
            [ "$code" = 200 ] || { echo "REQUIRED_PROD_ASSET_HTTP_${code}:$name"; exit 1; }
            test -s "/tmp/prod/$safe" || { echo "REQUIRED_PROD_ASSET_EMPTY:$name"; exit 1; }
            mkdir -p "$(dirname "nomad-live-343/$name")"
            cp "/tmp/prod/$safe" "nomad-live-343/$name"
          }
          fetch_required index.html
          python3 - <<'PY' > /tmp/index-assets.txt
          from pathlib import Path
          import re
          h=Path('nomad-live-343/index.html').read_text(errors='ignore')
          found=set()
          for x in re.findall(r'''(?:src|href)=["']([^"']+)["']''',h,re.I):
              x=x.split('?',1)[0].split('#',1)[0].strip().lstrip('./').lstrip('/')
              if not x or '://' in x or '/' in x: continue
              if re.search(r'\.(?:js|css|svg|json|png|webp|jpg|jpeg|ico)$',x,re.I): found.add(x)
          for x in sorted(found): print(x)
          PY
          while IFS= read -r name; do [ -n "$name" ] && fetch_required "$name"; done < /tmp/index-assets.txt
          fetch_required dashboard-v2-stage3.js
          cp nomad-live-343/dashboard-v2-stage3.js /tmp/current-rollback/dashboard-v2-stage3.js
          cp nomad-live-343/index.html /tmp/current-rollback/index.html
          sha256sum nomad-live-343/dashboard-v2-stage3.js | awk '{print $1}' > /tmp/current-target.sha
          sha256sum nomad-live-343/index.html | awk '{print $1}' > /tmp/current-index.sha
          grep -Fc 'fetch(' nomad-live-343/dashboard-v2-stage3.js > /tmp/current-fetch.count
          protected='dashboard-v2.css dashboard-v2-tune.js v2-shared.css v2-shared.js bulk-odds-compat-343.js expanded-match-343.js full-market-bookmaker-343.js live-summary-full-odds-343.js signal-next.js singlepage-workspace-343.js singlepage-workspace-343.css signal-shared-view-343.css ball46-next.css market-registry-343.js'
          : > /tmp/protected.sha
          for f in $protected; do
            fetch_required "$f"
            printf '%s  %s\n' "$(sha256sum "nomad-live-343/$f" | awk '{print $1}')" "$f" >> /tmp/protected.sha
          done
          cp /tmp/protected.sha /tmp/current-rollback/protected.sha
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?exact-2006-before=${GITHUB_RUN_ID}" -o /tmp/board-before.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?exact-2006-before=${GITHUB_RUN_ID}" -o /tmp/signals-before.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/statistics?exact-2006-before=${GITHUB_RUN_ID}" -o /tmp/stats-before.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/board-before.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals-before.json'));
          const t=JSON.parse(fs.readFileSync('/tmp/stats-before.json'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures))throw Error('PRE_BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals))throw Error('PRE_SIGNALS_UNHEALTHY');
          if(t?.ok!==true||!Array.isArray(t?.rows))throw Error('PRE_STATS_UNHEALTHY');
          console.log('PRE_BACKEND_OK',{fixtures:b.fixtures.length,signals:s.signals.length,settled:t.rows.length});
          NODE

      - name: Upload immediate pre-rollback target
        uses: actions/upload-artifact@v4
        with:
          name: ball46-before-exact-2006-restore-${{ github.run_id }}
          path: /tmp/current-rollback
          retention-days: 30

      - name: Replace dashboard target only with exact 20:06 state
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/known-good-dashboard.js nomad-live-343/dashboard-v2-stage3.js
          node --check nomad-live-343/dashboard-v2-stage3.js
          actual=$(sha256sum nomad-live-343/dashboard-v2-stage3.js | awk '{print $1}')
          [ "$actual" = "$KNOWN_GOOD_SHA256" ] || exit 1
          [ "$(sha256sum nomad-live-343/index.html | awk '{print $1}')" = "$(cat /tmp/current-index.sha)" ] || { echo INDEX_CHANGED; exit 1; }
          while read -r expected f; do
            actual=$(sha256sum "nomad-live-343/$f" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "PROTECTED_LOCAL_CHANGED:$f"; exit 1; }
          done < /tmp/protected.sha
          echo EXACT_2006_TARGET_READY

      - name: Race guard current Production target
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/dashboard-v2-stage3.js?exact-2006-race=${GITHUB_RUN_ID}" -o /tmp/race.js
          race=$(sha256sum /tmp/race.js | awk '{print $1}')
          [ "$race" = "$(cat /tmp/current-target.sha)" ] || { echo "PRODUCTION_TARGET_CHANGED_DURING_RESTORE:$race"; exit 1; }

      - name: Dry run current shell plus exact dashboard target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy exact 20:06 dashboard target
        id: deploy
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify exact target and backend continuity
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 20); do
            if curl -fsS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 "$BALL46_WORKER/dashboard-v2-stage3.js?exact-2006-after=${GITHUB_RUN_ID}-${n}" -o /tmp/target.after.js; then
              actual=$(sha256sum /tmp/target.after.js | awk '{print $1}')
              if [ "$actual" = "$KNOWN_GOOD_SHA256" ]; then ok=1; break; fi
            fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo EXACT_2006_TARGET_NOT_LIVE; exit 1; }
          grep -Fq 'BALL46_SCOREBAR10_20260925' /tmp/target.after.js
          grep -Fq 'function renderBoard(){renderScorebar10();' /tmp/target.after.js
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/index.html?exact-2006-index=${GITHUB_RUN_ID}" -o /tmp/index.after.html
          [ "$(sha256sum /tmp/index.after.html | awk '{print $1}')" = "$(cat /tmp/current-index.sha)" ] || { echo INDEX_CHANGED_UNEXPECTEDLY; exit 1; }
          while read -r expected f; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/$f?exact-2006-protected=${GITHUB_RUN_ID}" -o "/tmp/protected-${f//\//_}"
            actual=$(sha256sum "/tmp/protected-${f//\//_}" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "PROTECTED_DEPLOYED_CHANGED:$f"; exit 1; }
          done < /tmp/protected.sha
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?exact-2006-final=${GITHUB_RUN_ID}" -o /tmp/board-after.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?exact-2006-final=${GITHUB_RUN_ID}" -o /tmp/signals-after.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/statistics?exact-2006-final=${GITHUB_RUN_ID}" -o /tmp/stats-after.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/board-after.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals-after.json'));
          const t=JSON.parse(fs.readFileSync('/tmp/stats-after.json'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures))throw Error('POST_BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals))throw Error('POST_SIGNALS_UNHEALTHY');
          if(t?.ok!==true||!Array.isArray(t?.rows))throw Error('POST_STATS_UNHEALTHY');
          console.log('EXACT_2006_RESTORE_OK',{fixtures:b.fixtures.length,signals:s.signals.length,settled:t.rows.length});
          NODE

      - name: Restore only immediate pre-rollback target if post-deploy verification fails
        if: ${{ failure() && steps.deploy.outcome == 'success' && steps.verify.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/current-rollback/dashboard-v2-stage3.js nomad-live-343/dashboard-v2-stage3.js
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc
          echo RESTORED_IMMEDIATE_PRE_ROLLBACK_TARGET
