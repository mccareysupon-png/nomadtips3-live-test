name: Deploy NOMAD 3.43 Ultra Bulk Compat Once

on:
  push:
    branches: ['work/nomad343-clean-bet365-ui']
    paths:
      - '.github/workflows/deploy-343-ultra-bulk-compat-once.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-ultra-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nomad343-clean-bet365-ui

      - name: Validate Cloudflare deploy credentials only
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Assert ultra target is bulk-only and has no legacy provider path
        run: |
          set -euo pipefail
          TARGETS="workers/nomadtips3-343-preview nomad-live-343/full-odds-main-343.js"
          ! grep -R -n -E 'api\.5dollarfootballapi\.com|FIVEDOLLAR_API_KEY|ONE_FIXTURE_ONE_REQUEST|env\.FULL_MARKET|nomadtips3-343-full-market|full-market\.internal|setInterval\(pollExpanded|POLL_MS=15_000|FALLBACK_API' $TARGETS

      - name: Assert config keeps only allowed service bindings
        run: |
          set -euo pipefail
          grep -F '"name": "nomadtips3-343-ultra-preview"' workers/nomadtips3-343-preview/wrangler.jsonc
          grep -F '"binding": "ENGINE"' workers/nomadtips3-343-preview/wrangler.jsonc
          grep -F '"binding": "HUB"' workers/nomadtips3-343-preview/wrangler.jsonc
          ! grep -n -E 'FULL_MARKET|nomadtips3-343-full-market|FIVEDOLLAR_API_KEY' workers/nomadtips3-343-preview/wrangler.jsonc

      - name: Deploy ultra compat only
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Verify ultra compat, engine bulk-only, and JS polling removed
        run: |
          set -euo pipefail
          node <<'NODE'
          const checks = [
            ['full', 'https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev/api/full-market/health'],
            ['engine', 'https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev/api/engine/health'],
            ['hub', 'https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev/api/hub/health'],
            ['js', 'https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev/full-odds-main-343.js']
          ];
          const forbidden = ['api.5dollarfootballapi.com','FIVEDOLLAR_API_KEY','ONE_FIXTURE_ONE_REQUEST','env.FULL_MARKET','nomadtips3-343-full-market','full-market.internal','setInterval(pollExpanded','POLL_MS=15_000','FALLBACK_API','/api/full-market/fixture-odds','/api/engine/fixture-odds'];
          (async () => {
            for (const [name, url] of checks) {
              const res = await fetch(`${url}?verify=${Date.now()}`, { headers: { 'cache-control': 'no-cache' } });
              const text = await res.text();
              console.log(`${url} -> HTTP ${res.status}`);
              console.log(text.slice(0, 1200));
              if (name === 'full') {
                const json = JSON.parse(text);
                if (res.status !== 200 || json.component !== 'NOMAD343_FULL_MARKET_COMPAT' || json.mode !== 'BULK_SNAPSHOT_ONLY' || json.externalRequestsAdded !== 0) throw new Error('full compat health check failed');
              }
              if (name === 'engine') {
                const json = JSON.parse(text);
                if (res.status !== 200 || json.ok !== true || json.dataMode !== 'BULK_SNAPSHOT_ONLY' || json.externalOddsRequests !== 0) throw new Error('engine bulk-only check failed');
              }
              if (name === 'hub') {
                const json = JSON.parse(text);
                if (res.status !== 200 || json.ok !== true || json.component !== '5USD_HUB') throw new Error('hub route check failed');
              }
              if (name === 'js') {
                for (const marker of forbidden) if (text.includes(marker)) throw new Error(`js still contains ${marker}`);
              }
            }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
