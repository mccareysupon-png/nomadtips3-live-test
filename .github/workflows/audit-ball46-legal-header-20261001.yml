name: AUDIT Ball46 legal header 20261001

on:
  push:
    branches: [ops/ball46-footer-links-20261001]
    paths:
      - '.github/workflows/audit-ball46-legal-header-20261001.yml'

permissions:
  contents: read

env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  BALL46_URL: https://ball46.com

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect current Production legal header and CSS
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          curl -fsS "$BALL46_URL/information.html?audit=${GITHUB_RUN_ID}-$(date +%s%N)" -o /tmp/info.html
          curl -fsS "$BALL46_URL/legal.css?audit=${GITHUB_RUN_ID}-$(date +%s%N)" -o /tmp/legal.css
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('/tmp/info.html','utf8');
          const c=fs.readFileSync('/tmp/legal.css','utf8');
          for(const needle of ['Live signals','BALL46','brand','footer-brand-image']){
            const i=h.indexOf(needle); if(i>=0) console.log('\nHTML_AROUND_'+needle+'\n'+h.slice(Math.max(0,i-700),i+1200));
          }
          for(const needle of ['.brand','.logo','.brand-mark','.brand-copy','.footer-brand-image']){
            const i=c.indexOf(needle); if(i>=0) console.log('\nCSS_AROUND_'+needle+'\n'+c.slice(Math.max(0,i-500),i+1800));
          }
          NODE
