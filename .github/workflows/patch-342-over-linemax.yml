name: Patch 3.42 Over Line Max

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-342-over-linemax.yml'

permissions:
  contents: write

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  ENGINE_URL: https://nomadtips3-342-signal-engine.mccarey-supon.workers.dev

jobs:
  patch-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch only the 3.42 OVER max-line path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('workers/nomadtips3-342-signal-engine/src/index.js')
          s = p.read_text(encoding='utf-8')

          replacements = [
            (
              "over:{lineMin:0.5,oddsMin:1.01,shotOnTarget:1,shotOff:1,corner:1,dangerousAttackPct:50,attackPct:50,possessionPct:50,evidenceRequired:3,minuteFrom:0,minuteTo:120,rollingWindowMinutes:5}",
              "over:{lineMin:0.5,lineMax:10,oddsMin:1.01,shotOnTarget:1,shotOff:1,corner:1,dangerousAttackPct:50,attackPct:50,possessionPct:50,evidenceRequired:3,minuteFrom:0,minuteTo:120,rollingWindowMinutes:5}"
            ),
            (
              "    if(name!=='oneXtwo'&&name!=='ah'&&(c.lineMin<.5||c.lineMin>10||!Number.isInteger(c.lineMin*2)))errors.push(`${name}.lineMin`);",
              "    if(name!=='oneXtwo'&&name!=='ah'&&(c.lineMin<.5||c.lineMin>10||!Number.isInteger(c.lineMin*2)))errors.push(`${name}.lineMin`);\n    if(name==='over'&&(c.lineMax<.5||c.lineMax>10||!Number.isInteger(c.lineMax*2)||c.lineMin>c.lineMax))errors.push(`${name}.lineMax`);"
            ),
            (
              "function lineOk(value,min){const n=finite(value),m=finite(min);return n!==null&&m!==null&&n>=m&&n<=20&&Number.isInteger(n*4)}",
              "function lineOk(value,min){const n=finite(value),m=finite(min);return n!==null&&m!==null&&n>=m&&n<=20&&Number.isInteger(n*4)}\nfunction lineRangeOk(value,min,max){const n=finite(value),lo=finite(min),hi=finite(max);return n!==null&&lo!==null&&hi!==null&&n>=lo&&n<=hi&&n<=20&&Number.isInteger(n*4)}"
            ),
            (
              "    if(!lineOk(line,cfg.lineMin))reasons.push('เส้น Over ต่ำกว่าที่ตั้ง');if(!oddsOk(odds,cfg.oddsMin))reasons.push('ราคา odds ต่ำกว่าที่ตั้ง');",
              "    if(!lineRangeOk(line,cfg.lineMin,cfg.lineMax))reasons.push('เส้น Over ไม่อยู่ในช่วงที่ตั้ง');if(!oddsOk(odds,cfg.oddsMin))reasons.push('ราคา odds ต่ำกว่าที่ตั้ง');"
            ),
          ]

          for old, new in replacements:
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'expected exactly one match, found {count}: {old[:80]}')
            s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

          grep -Fq "over:{lineMin:0.5,lineMax:10" workers/nomadtips3-342-signal-engine/src/index.js
          grep -Fq "lineRangeOk(line,cfg.lineMin,cfg.lineMax)" workers/nomadtips3-342-signal-engine/src/index.js
          grep -Fq "name==='over'&&(c.lineMax<.5" workers/nomadtips3-342-signal-engine/src/index.js
          grep -Fq "lineMax:10" nomad-live-342/market-settings-v3.js
          grep -Fq "ensureOverLineMaxField" nomad-live-342/market-settings-v3.js
          node --check workers/nomadtips3-342-signal-engine/src/index.js
          node --check nomad-live-342/market-settings-v3.js

      - name: Commit only 3.42 patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-342-over-linemax.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/nomadtips3-342-signal-engine/src/index.js .github/workflows/patch-342-over-linemax.yml
          git diff --cached --check
          git commit -m "3.42: enforce maximum Over line"
          git push origin HEAD:main

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"

      - name: Deploy patched 3.42 signal engine
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: workers/nomadtips3-342-signal-engine
          wranglerVersion: '4.92.0'
          command: deploy

      - name: Verify live settings contract
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 20 "$ENGINE_URL/settings?t=$(date +%s)" -o /tmp/settings.json; then
              if node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/settings.json','utf8'));
          const max=Number(j?.snapshot?.settings?.over?.lineMax);
          if(j?.ok!==true||max!==10)process.exit(1);
          console.log(JSON.stringify({ok:j.ok,lineMin:j.snapshot.settings.over.lineMin,lineMax:max,run:j.snapshot.run.over},null,2));
          NODE
              then ok=1; break; fi
            fi
            sleep 5
          done
          test "$ok" = 1
