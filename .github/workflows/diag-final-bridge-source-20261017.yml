name: READ ONLY verify live settlement code and final bridge wiring
on:
  push:
    branches: [diag/ball46-settlement-pending-20261017]
    paths: [.github/workflows/diag-final-bridge-source-20261017.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Identify actual settlement source, final bridge route, and dependencies
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          const a=process.env.CLOUDFLARE_ACCOUNT_ID,t=process.env.CLOUDFLARE_API_TOKEN;
          const workers=[['nomadtips3-engine-343','9b363777-64fc-4a48-a10a-0fad822640cb'],['nomadtips3-5usd-hub-343','2b01dc85-a525-4283-959e-8f6db796c81e']];
          for(const [w,id] of workers){
            const url='https://api.cloudflare.com/client/v4/accounts/'+a+'/workers/workers/'+w+'/versions/'+id+'?include=modules';
            const r=await fetch(url,{headers:{Authorization:'Bearer '+t}});const j=await r.json();if(!j.success)throw Error('SOURCE_FAILED_'+w);
            const v=j.result,s=Buffer.from(v.modules.find(m=>m.name===v.main_module).content_base64,'base64').toString();
            const lines=s.split('\n');
            const re=w.includes('engine')?/(function|async|const|let|if|\breturn\b).*?(reconcil|settle|PENDING|externalFinal|bridge|finalBy|finalResult|finalGoals|finished|unresolved|full.?time)/i:/(finished|final|today-refresh|todayRefresh|continuityHeldFixtures|fetchTodayAndLive)/i;
            const hits=[];
            for(let i=0;i<lines.length;i++)if(re.test(lines[i]))hits.push({line:i+1,fragment:lines.slice(Math.max(0,i-2),Math.min(lines.length,i+5)).join('\n').slice(0,950)});
            const safe=hits.filter(x=>!/Authorization|FIVEDOLLAR_API_KEY|secret|token/i.test(x.fragment));
            console.log('SETTLEMENT_SOURCE '+JSON.stringify({worker:w,bytes:s.length,total:hits.length,hits:safe.slice(0,85)}).slice(0,26000));
            if(w.includes('engine')){
              for(const term of ['external-final-bridge-v1','/external-final','/settle','/final','/bridge','async scan(','async reconcile(','finishedByFixture','isFinished(','if (isFinished(','PENDING']){
                const i=s.indexOf(term);
                console.log('BRIDGE_MARK '+JSON.stringify({term,present:i>=0,offset:i,snippet:i<0?'':s.slice(Math.max(0,i-180),i+550)}).slice(0,1350));
              }
            }
          }
          NODE
