name: S8 Thin Port Builder

on:
  push:
    branches:
      - feature/nomad341-s8-thin-port
    paths:
      - ".github/workflows/s8-thin-port-builder.yml"

permissions:
  contents: write

jobs:
  guarded-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/nomad341-s8-thin-port
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Apply exact-anchor patch
        run: python tools/apply_s8_thin_port.py
      - name: Verify syntax and full engine tests before committing
        working-directory: nomad-live-engine
        run: |
          node --check src/index.js
          node --check src/price-sources.js
          node --check src/s8-external.js
          node --test
      - name: Confirm old source modules were not modified
        run: |
          git diff --exit-code HEAD -- nomad-live-engine/src/nowgoal.js nomad-live-engine/src/oddspedia.js nomad-live-engine/src/real-market.js nomad-live-engine/src/the-odds-api.js nomad-live-engine/src/api-football.js nomad-live-engine/src/parser.js nomad-live-engine/src/detector.js nomad-live-engine/src/settlement.js
      - name: Commit only guarded index integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nomad-live-engine/src/index.js
          git diff --cached --quiet && exit 0
          git commit -m "Connect external S8 through thin price port"
          git push origin HEAD:feature/nomad341-s8-thin-port
