name: Deploy Ball46 Classic Mobile Menu V2 20260922

on:
  push:
    branches: [work/ball46-mobile-menu-classic-20260922]
    paths:
      - '.github/workflows/deploy-ball46-mobile-menu-classic-v2-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_URL: https://www.ball46.com
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  GOLDEN_SHA: ad34452074b300787c91c7788c02d0e242854d0d

jobs:
  deploy-mobile-menu-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preflight source isolation
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$GOLDEN_SHA^{commit}"
          for p in \
            workers/nomadtips3-343-preview/src/index.js \
            workers/nomadtips3-343-preview/wrangler.ball46.jsonc \
            workers/nomadtips3-engine-343/src/index.js \
            nomad-live-343/dashboard-v2-stage3.js \
            nomad-live-343/dashboard-v2-tune.js \
            nomad-live-343/bulk-odds-compat-343.js \
            nomad-live-343/expanded-match-343.js \
            nomad-live-343/full-market-bookmaker-343.js \
            nomad-live-343/live-summary-full-odds-343.js \
            nomad-live-343/signal-next.js \
            nomad-live-343/singlepage-workspace-343.js; do
            git diff --quiet "$GOLDEN_SHA"..HEAD -- "$p" || { echo "PROTECTED_SOURCE_CHANGED:$p"; exit 1; }
          done
          node --check nomad-live-343/mobile-menu-classic-343.js
          grep -Fq '@media(max-width:760px)' nomad-live-343/mobile-menu-classic-343.css
          grep -Fq '.b46-mobile-workspace-nav{display:none}' nomad-live-343/mobile-menu-classic-343.css
          ! grep -Fq 'fetch(' nomad-live-343/mobile-menu-classic-343.js
          ! grep -Fq '/api/' nomad-live-343/mobile-menu-classic-343.js
          ! grep -Fq 'setInterval' nomad-live-343/mobile-menu-classic-343.js
          ! grep -Fq 'XMLHttpRequest' nomad-live-343/mobile-menu-classic-343.js
          git diff --check

      - name: Capture exact single-page Production baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod /tmp/hdr

          fetch_optional(){
            name="$1"; safe="${name//\//_}"
            code=$(curl -sS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 -D "/tmp/hdr/$safe" -o "/tmp/prod/$safe" -w '%{http_code}' "$BALL46_WORKER/$name?mobile-copy=${GITHUB_RUN_ID}") || true
            if [ "$code" != 200 ]; then return 0; fi
            mkdir -p "$(dirname "nomad-live-343/$name")"
            cp "/tmp/prod/$safe" "nomad-live-343/$name"
          }

          fetch_required(){
            name="$1"; safe="${name//\//_}"
            code=$(curl -sS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 -D "/tmp/hdr/$safe" -o "/tmp/prod/$safe" -w '%{http_code}' "$BALL46_WORKER/$name?mobile-required=${GITHUB_RUN_ID}") || true
            [ "$code" = 200 ] || { echo "REQUIRED_PROD_ASSET_HTTP_${code}:$name"; exit 1; }
            test -s "/tmp/prod/$safe" || { echo "REQUIRED_PROD_ASSET_EMPTY:$name"; exit 1; }
            mkdir -p "$(dirname "nomad-live-343/$name")"
            cp "/tmp/prod/$safe" "nomad-live-343/$name"
          }

          # Mirror all known static assets best-effort, but never overwrite our two new files.
          while IFS= read -r f; do
            name="${f#nomad-live-343/}"
            case "$name" in mobile-menu-classic-343.css|mobile-menu-classic-343.js) continue ;; esac
            case "$name" in *.html|*.js|*.css|*.svg|*.json|*.png|*.webp|*.jpg|*.jpeg|*.ico) fetch_optional "$name" ;; esac
          done < <(find nomad-live-343 -maxdepth 1 -type f | sort)

          # Current architecture is single-page. index.html is required; retired legacy routes are not.
          fetch_required index.html
          cp nomad-live-343/index.html /tmp/index.html.original

          # Pull every top-level asset referenced by current live index, including assets newer than this branch.
          python3 - <<'PY' > /tmp/index-assets.txt
          from pathlib import Path
          import re
          h=Path('/tmp/index.html.original').read_text(errors='ignore')
          found=set()
          for x in re.findall(r'''(?:src|href)=["']([^"']+)["']''',h,re.I):
              x=x.split('?',1)[0].split('#',1)[0].strip()
              if not x or '://' in x or x.startswith('//') or x.startswith('data:') or x.startswith('#'): continue
              x=x.lstrip('./').lstrip('/')
              if '/' in x: continue
              if re.search(r'\.(?:js|css|svg|json|png|webp|jpg|jpeg|ico)$',x,re.I): found.add(x)
          for x in sorted(found): print(x)
          PY
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            case "$name" in mobile-menu-classic-343.css|mobile-menu-classic-343.js) continue ;; esac
            fetch_required "$name"
          done < /tmp/index-assets.txt

          # Core files must be copied from live Production, never inherited stale from branch.
          protected='dashboard-v2.css dashboard-v2-stage3.js dashboard-v2-tune.js v2-shared.css v2-shared.js bulk-odds-compat-343.js expanded-match-343.js full-market-bookmaker-343.js live-summary-full-odds-343.js singlepage-workspace-343.js singlepage-workspace-343.css'
          : > /tmp/protected.sha
          for f in $protected; do
            fetch_required "$f"
            printf '%s  %s\n' "$(sha256sum "nomad-live-343/$f" | awk '{print $1}')" "$f" >> /tmp/protected.sha
          done

          cp -a nomad-live-343 /tmp/ball46-assets-before

          # Snapshot backend health before deployment.
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?mobile-before=${GITHUB_RUN_ID}" -o /tmp/board-before.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?mobile-before=${GITHUB_RUN_ID}" -o /tmp/signals-before.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/statistics?mobile-before=${GITHUB_RUN_ID}" -o /tmp/stats-before.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/board-before.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals-before.json','utf8'));
          const t=JSON.parse(fs.readFileSync('/tmp/stats-before.json','utf8'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures)) throw Error('PRE_BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals)) throw Error('PRE_SIGNALS_UNHEALTHY');
          if(t?.ok!==true||!Array.isArray(t?.rows)) throw Error('PRE_STATS_UNHEALTHY');
          function has(v){if(Array.isArray(v))return v.length>0;if(!v||typeof v!=='object')return false;const c=[v.bookmakers,v.odds,v.markets,v?.data?.bookmakers,v?.data?.odds,v?.data?.markets];return c.some(x=>Array.isArray(x)?x.length>0:!!(x&&typeof x==='object'&&Object.keys(x).length))||Object.keys(v).some(k=>/bet365|pinnacle|crown|1xbet|12bet|interwetten|macauslot|18bet|vcbet|easybets|bookmaker/i.test(String(k)))}
          const odds=b.fixtures.filter(f=>has(f?.providerOdds)||has(f?.fullOdds)||has(f?.odds)).length;
          const pre={fixtures:b.fixtures.length,oddsFixtures:odds,signals:s.signals.length,stats:t.rows.length};
          fs.writeFileSync('/tmp/pre-counts.json',JSON.stringify(pre)); console.log('PRE_MOBILE_MENU',pre);
          NODE

      - name: Inject only mobile presentation assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('nomad-live-343/index.html')
          h=p.read_text()
          h=re.sub(r'\s*<link[^>]+mobile-menu-classic-343\.css[^>]*>','',h,flags=re.I)
          h=re.sub(r'\s*<script[^>]+mobile-menu-classic-343\.js[^>]*></script>','',h,flags=re.I)
          css='<link rel="stylesheet" href="mobile-menu-classic-343.css?v=343-mobile-classic-20260922b">'
          js='<script src="mobile-menu-classic-343.js?v=343-mobile-classic-20260922b" defer></script>'
          if '</head>' not in h or '</body>' not in h: raise SystemExit('INDEX_ANCHOR_MISSING')
          h=h.replace('</head>',css+'\n</head>',1).replace('</body>',js+'\n</body>',1)
          p.write_text(h)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          def strip_ours(s):
              s=re.sub(r'\s*<link[^>]+mobile-menu-classic-343\.css[^>]*>','',s,flags=re.I)
              s=re.sub(r'\s*<script[^>]+mobile-menu-classic-343\.js[^>]*></script>','',s,flags=re.I)
              return re.sub(r'>\s+<','><',s).strip()
          before=Path('/tmp/index.html.original').read_text()
          after=Path('nomad-live-343/index.html').read_text()
          if strip_ours(after)!=strip_ours(before): raise SystemExit('NON_MOBILE_HTML_CHANGED')
          PY
          while read -r expected f; do
            actual=$(sha256sum "nomad-live-343/$f" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "PROTECTED_LOCAL_CHANGED:$f"; exit 1; }
          done < /tmp/protected.sha
          grep -Fq 'mobile-menu-classic-343.css?v=343-mobile-classic-20260922b' nomad-live-343/index.html
          grep -Fq 'mobile-menu-classic-343.js?v=343-mobile-classic-20260922b' nomad-live-343/index.html

      - name: Dry run production package
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy mobile presentation layer
        id: deploy
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify deployment and data continuity
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 15); do
            if curl -fsS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 "$BALL46_WORKER/index.html?mobile-v2=${GITHUB_RUN_ID}-${n}" -o /tmp/index-after.html \
              && grep -Fq 'mobile-menu-classic-343.css?v=343-mobile-classic-20260922b' /tmp/index-after.html \
              && grep -Fq 'mobile-menu-classic-343.js?v=343-mobile-classic-20260922b' /tmp/index-after.html; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo 'MOBILE_MARKER_NOT_PROPAGATED'; exit 1; }
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/mobile-menu-classic-343.css?verify=${GITHUB_RUN_ID}" -o /tmp/mobile.css
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/mobile-menu-classic-343.js?verify=${GITHUB_RUN_ID}" -o /tmp/mobile.js
          grep -Fq '@media(max-width:760px)' /tmp/mobile.css
          grep -Fq 'Mobile workspace navigation' /tmp/mobile.js
          ! grep -Fq 'fetch(' /tmp/mobile.js
          ! grep -Fq '/api/' /tmp/mobile.js
          while read -r expected f; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/$f?protected=${GITHUB_RUN_ID}" -o "/tmp/protected-$f"
            actual=$(sha256sum "/tmp/protected-$f" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "PROTECTED_DEPLOYED_CHANGED:$f"; exit 1; }
          done < /tmp/protected.sha
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?mobile-after=${GITHUB_RUN_ID}" -o /tmp/board-after.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?mobile-after=${GITHUB_RUN_ID}" -o /tmp/signals-after.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/statistics?mobile-after=${GITHUB_RUN_ID}" -o /tmp/stats-after.json
          node - <<'NODE'
          const fs=require('fs'); const pre=JSON.parse(fs.readFileSync('/tmp/pre-counts.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/board-after.json','utf8')); const s=JSON.parse(fs.readFileSync('/tmp/signals-after.json','utf8')); const t=JSON.parse(fs.readFileSync('/tmp/stats-after.json','utf8'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures)) throw Error('POST_BOARD_UNHEALTHY'); if(!Array.isArray(s?.signals)) throw Error('POST_SIGNALS_UNHEALTHY'); if(t?.ok!==true||!Array.isArray(t?.rows)) throw Error('POST_STATS_UNHEALTHY');
          function has(v){if(Array.isArray(v))return v.length>0;if(!v||typeof v!=='object')return false;const c=[v.bookmakers,v.odds,v.markets,v?.data?.bookmakers,v?.data?.odds,v?.data?.markets];return c.some(x=>Array.isArray(x)?x.length>0:!!(x&&typeof x==='object'&&Object.keys(x).length))||Object.keys(v).some(k=>/bet365|pinnacle|crown|1xbet|12bet|interwetten|macauslot|18bet|vcbet|easybets|bookmaker/i.test(String(k)))}
          const odds=b.fixtures.filter(f=>has(f?.providerOdds)||has(f?.fullOdds)||has(f?.odds)).length;
          if(pre.fixtures>0&&b.fixtures.length===0) throw Error('FIXTURES_DROPPED_TO_ZERO'); if(pre.oddsFixtures>0&&odds===0) throw Error(`ODDS_CONTINUITY_FAILED:${pre.oddsFixtures}->0`);
          console.log('MOBILE_MENU_BACKEND_PASS',{before:pre,after:{fixtures:b.fixtures.length,oddsFixtures:odds,signals:s.signals.length,stats:t.rows.length}});
          NODE

      - name: Verify WWW propagation
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 15); do
            if curl -fsS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 "$BALL46_URL/index.html?mobile-www=${GITHUB_RUN_ID}-${n}" -o /tmp/www.html \
              && grep -Fq 'mobile-menu-classic-343.css?v=343-mobile-classic-20260922b' /tmp/www.html \
              && grep -Fq 'mobile-menu-classic-343.js?v=343-mobile-classic-20260922b' /tmp/www.html; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo 'WWW_MOBILE_MARKER_NOT_PROPAGATED'; exit 1; }

      - name: Restore exact pre-change static shell on failure
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf nomad-live-343
          cp -a /tmp/ball46-assets-before nomad-live-343
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc
          sleep 6
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?mobile-rollback=${GITHUB_RUN_ID}" -o /tmp/rollback-board.json
          node - <<'NODE'
          const fs=require('fs'); const b=JSON.parse(fs.readFileSync('/tmp/rollback-board.json','utf8')); if(b?.ok!==true||!Array.isArray(b?.fixtures)) throw Error('ROLLBACK_BOARD_UNHEALTHY'); console.log('PRE_MOBILE_SHELL_RESTORED',{fixtures:b.fixtures.length});
          NODE
