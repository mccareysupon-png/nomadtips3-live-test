name: Ball46 mobile score hotfix deploy 2026-10-05
on:
  push:
    branches:
      - work/ball46-mobile-rebuild-20261005
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Guarded score/live-time mobile-only patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,base64,urllib.request,subprocess,time,pathlib,hashlib
          A=os.environ['CF_ACCOUNT'];T=os.environ['CF_TOKEN'];SCRIPT='ball46-production';API=f'https://api.cloudflare.com/client/v4/accounts/{A}'
          DIRECT='https://ball46-production.mccarey-supon.workers.dev';PUBLIC='https://www.ball46.com';H={'Authorization':f'Bearer {T}','Accept':'application/json'}
          ROOT=pathlib.Path('/tmp/b46-mobile-score-hotfix');ROOT.mkdir(exist_ok=True)
          PATCH=pathlib.Path('mobile-v3-score-layout-hotfix-20261005.css').read_text();MARK='B46_MOBILE_SCORE_LAYOUT_FIX_20261005'
          def get(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=30) as r:return json.load(r)
          def fetch(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers={'Cache-Control':'no-cache','User-Agent':'Ball46-Mobile-Score-Hotfix'}),timeout=35) as r:return r.status,dict(r.headers),r.read()
          def rollback(v):
            env=os.environ.copy();env['CLOUDFLARE_ACCOUNT_ID']=A;env['CLOUDFLARE_API_TOKEN']=T
            subprocess.run(['npx','--yes','wrangler@4.92.0','versions','deploy',f'{v}@100%','--name',SCRIPT,'-y','--message','Auto rollback Ball46 mobile score hotfix'],env=env,check=False)
          d=get(f'{API}/workers/scripts/{SCRIPT}/deployments')['result']['deployments'][0];active=[x for x in d.get('versions',[]) if float(x.get('percentage',0))>=99.999]
          if len(active)!=1:raise SystemExit('ACTIVE_VERSION_AMBIGUOUS')
          pre=str(active[0]['version_id']);pathlib.Path('/tmp/b46-score-pre-version').write_text(pre)
          v=get(f'{API}/workers/workers/{SCRIPT}/versions/{pre}?include=modules')['result'];mods=v.get('modules') or []
          main=[m for m in mods if m.get('name')=='index.js' and m.get('content_base64')]
          if len(main)!=1:raise SystemExit('INDEX_MODULE_MISSING')
          unknown=[m.get('name') for m in mods if m.get('name')!='index.js' and not str(m.get('name') or '').startswith('assets/')]
          if unknown:raise SystemExit('UNKNOWN_CODE_MODULES '+repr(unknown))
          src=base64.b64decode(main[0]['content_base64']).decode();bindings=v.get('bindings') or [];by={b.get('name'):b for b in bindings}
          expected={'ASSETS':('assets',None),'ENGINE':('service','nomadtips3-engine-343'),'FULL_MARKET':('service','nomadtips3-full-market-343-ball46'),'HUB':('service','nomadtips3-5usd-hub-343')}
          for n,(typ,svc) in expected.items():
            b=by.get(n) or {}
            if b.get('type')!=typ or (svc and b.get('service')!=svc):raise SystemExit('BINDING_MOVED '+n)
          ac=(v.get('assets') or {}).get('config') or {};want={'base_path':'/','html_handling':'none','not_found_handling':'none','run_worker_first':True}
          if {k:ac.get(k) for k in want}!=want:raise SystemExit('ASSET_CONFIG_MOVED')
          if v.get('compatibility_date')!='2026-09-09' or (v.get('compatibility_flags') or []):raise SystemExit('COMPAT_MOVED')
          if 'b46-mobile-v3-style' not in src or 'b46-mobile-v3-script' not in src:raise SystemExit('MOBILE_V3_WRAPPER_MISSING')
          if MARK in src:print('HOTFIX_ALREADY_PRESENT');raise SystemExit(0)
          anchor='</style><script id=\\"b46-mobile-v3-script\\">'
          if anchor not in src:raise SystemExit('STYLE_SCRIPT_ANCHOR_MISSING')
          esc=json.dumps(PATCH)[1:-1]
          patched=src.replace(anchor,esc+anchor,1)
          if MARK not in patched:raise SystemExit('PATCH_INSERT_FAILED')
          (ROOT/'index.js').write_text(patched);subprocess.run(['node','--check',str(ROOT/'index.js')],check=True)
          meta={'main_module':'index.js','keep_assets':True,'compatibility_date':v.get('compatibility_date'),'bindings':bindings}
          for k in ('observability','placement','limits','tail_consumers','logpush'):
            if v.get(k) is not None:meta[k]=v[k]
          (ROOT/'metadata.json').write_text(json.dumps(meta,separators=(',',':')))
          print('PREDEPLOY_LOCK_OK',pre,'patch_sha',hashlib.sha256(PATCH.encode()).hexdigest())
          deployed=False
          try:
            raw=subprocess.check_output(['curl','-fsS','-X','PUT',f'{API}/workers/scripts/{SCRIPT}','-H',f'Authorization: Bearer {T}','-F',f'metadata=@{ROOT}/metadata.json;type=application/json','-F',f'index.js=@{ROOT}/index.js;type=application/javascript+module']);j=json.loads(raw)
            if j.get('success') is not True:raise RuntimeError('UPLOAD_FAIL')
            deployed=True;print('UPLOAD_OK')
            ok=False
            for n in range(10):
              time.sleep(2)
              try:
                _,_,b=fetch(DIRECT+'/index.html?scorefix='+str(time.time_ns()));t=b.decode(errors='replace')
                if MARK in t:print('DIRECT_VERIFY_PASS',n+1);ok=True;break
              except Exception as e:print('DIRECT_RETRY',n+1,type(e).__name__)
            if not ok:raise RuntimeError('DIRECT_VERIFY_FAILED')
            pub=False
            for n in range(12):
              try:
                _,_,b=fetch(PUBLIC+'/index.html?scorefix='+str(time.time_ns()));t=b.decode(errors='replace')
                if MARK in t:print('PUBLIC_VERIFY_PASS',n+1);pub=True;break
              except Exception as e:print('PUBLIC_RETRY',n+1,type(e).__name__)
              time.sleep(2)
            if not pub:raise RuntimeError('PUBLIC_VERIFY_FAILED')
            for ep in ('board','signals','statistics'):
              _,_,b=fetch(PUBLIC+f'/api/engine/{ep}?scorefix={time.time_ns()}');q=json.loads(b)
              if q.get('ok') is not True:raise RuntimeError(ep+'_NOT_OK')
            nd=get(f'{API}/workers/scripts/{SCRIPT}/deployments')['result']['deployments'][0];av=[x for x in nd.get('versions',[]) if float(x.get('percentage',0))>=99.999]
            if len(av)!=1:raise RuntimeError('POST_ACTIVE_AMBIGUOUS')
            print('SCORE_HOTFIX_PRODUCTION_VERIFY_PASS',av[0]['version_id'])
          except Exception:
            if deployed:rollback(pre)
            raise
          PY
      - name: Visual DOM QA mobile and desktop
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"; test -n "$CHROME"
          npm install --no-save --silent playwright-core@latest
          CHROME_BIN="$CHROME" node <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const p=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            await p.goto('https://www.ball46.com/index.html?scorefixqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});await p.waitForTimeout(5000);
            const q=await p.evaluate(()=>{
              const vis=e=>!!e&&getComputedStyle(e).display!=='none'&&e.getBoundingClientRect().width>0&&e.getBoundingClientRect().height>0;
              const rows=[...document.querySelectorAll('.match-row')].slice(0,5).map(r=>{
                const teams=r.querySelector('.teams-cell');const scores=[...teams.querySelectorAll('.desktop-team-score')];const home=teams.querySelector('b.b46-home');const away=teams.querySelector('b.b46-away');const sc=r.querySelector('.score-cell');
                const clocks=[...r.querySelectorAll('.b46-live-clock,.mobile-clock')].filter(vis);const mobileClocks=[...r.querySelectorAll('.signal-cell .mobile-clock,.signal-inline-stack .mobile-clock')].filter(vis);const ds=[...r.querySelectorAll('.signal-cell .desktop-signal,.signal-inline-stack .desktop-signal')].filter(vis);
                const rb=e=>e?.getBoundingClientRect();return {scores:scores.map(vis),scoreCol:[...sc.querySelectorAll(':scope>strong')].map(vis),live:vis(sc.querySelector('.b46-live-time')),clockCount:clocks.length,mobileClockCount:mobileClocks.length,signalTextVisible:ds.length,homeY:rb(home)?.y,homeScoreY:rb(scores[0])?.y,awayY:rb(away)?.y,awayScoreY:rb(scores[1])?.y};
              });
              const perf=document.querySelector('.sp-trend.b46-perf-card,.b46-perf-card,.b46-perf-shell');return {rows,perf:perf?getComputedStyle(perf).display:'missing',sw:document.documentElement.scrollWidth,iw:innerWidth};
            });
            console.log('SCORE_LAYOUT_QA',JSON.stringify(q));
            if(q.perf!=='none'&&q.perf!=='missing')throw new Error('PERFORMANCE_VISIBLE');
            if(q.sw>q.iw+3)throw new Error('HORIZONTAL_OVERFLOW');
            for(const r of q.rows){if(r.scores.length!==2||!r.scores.every(Boolean))throw new Error('TEAM_SCORE_NOT_VISIBLE');if(r.scoreCol.some(Boolean))throw new Error('OLD_SCORE_COLUMN_VISIBLE');if(!r.live)throw new Error('LIVE_TIME_NOT_VISIBLE');if(r.mobileClockCount!==0)throw new Error('DUPLICATE_MOBILE_CLOCK');if(r.clockCount!==1)throw new Error('LIVE_CLOCK_COUNT_'+r.clockCount);if(Math.abs(r.homeY-r.homeScoreY)>8||Math.abs(r.awayY-r.awayScoreY)>8)throw new Error('SCORE_ROW_MISALIGN');}
            await p.setViewportSize({width:1440,height:1000});await p.goto('https://www.ball46.com/index.html?scorefixdesktop='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});await p.waitForTimeout(2500);
            const d=await p.evaluate(()=>({mobileAttr:document.documentElement.getAttribute('data-b46-mobile-v3'),patchVar:getComputedStyle(document.documentElement).getPropertyValue('--b46m-bg').trim(),sw:document.documentElement.scrollWidth,iw:innerWidth}));console.log('DESKTOP_SCORE_QA',JSON.stringify(d));
            if(d.mobileAttr!==null||d.patchVar!=='')throw new Error('MOBILE_LEAK_TO_DESKTOP');
            await browser.close();console.log('SCORE_LAYOUT_QA_PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Roll back if QA fails
        if: failure()
        shell: bash
        run: |
          set +e
          test -f /tmp/b46-score-pre-version || exit 0
          PRE="$(cat /tmp/b46-score-pre-version)";export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT" CLOUDFLARE_API_TOKEN="$CF_TOKEN"
          npx --yes wrangler@4.92.0 versions deploy "$PRE@100%" --name ball46-production -y --message "Auto rollback Ball46 mobile score QA"
