name: Activate Today's SJK HJK Pick

on:
  push:
    paths:
      - ".github/workflows/add-today-pick-sjk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Persist SJK HJK in live tracking
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          import json

          filename = "live-data-sjk-hjk-helsinki.json"
          sjk_tuple = '("live-data-sjk-hjk-helsinki.json", r"sjk|seinajoki", r"hjkhelsinki|hjk"),'

          script_path = Path("scripts/live_refresh.py")
          script = script_path.read_text(encoding="utf-8")
          if filename not in script:
              anchor = '("live-data-bukovyna-lnz-cherkasy.json", r"bukovyna|bukovina", r"lnzcherkasy|lnz"),'
              script = script.replace(anchor, anchor + '\n    ' + sjk_tuple)
              script_path.write_text(script, encoding="utf-8")

          manifest_path = Path("live-matches.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8")) if manifest_path.exists() else {"files": []}
          files = manifest.setdefault("files", [])
          if filename not in files:
              files.append(filename)
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          workflow_path = Path(".github/workflows/live-four-test-refresh.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          if filename not in workflow:
              tuple_anchor = '("live-data-bukovyna-lnz-cherkasy.json", r"bukovyna|bukovina", r"lnzcherkasy|lnz"),'
              workflow = workflow.replace(tuple_anchor, tuple_anchor + '\n              ' + sjk_tuple)

              list_anchor = '"live-data-bukovyna-lnz-cherkasy.json",'
              workflow = workflow.replace(
                  list_anchor,
                  list_anchor + '\n              "live-data-sjk-hjk-helsinki.json",'
              )

              compact_anchor = 'files = ["live-data-drukpa-paro.json", "live-data-bukovyna-lnz-cherkasy.json"]'
              workflow = workflow.replace(
                  compact_anchor,
                  'files = ["live-data-drukpa-paro.json", "live-data-bukovyna-lnz-cherkasy.json", "live-data-sjk-hjk-helsinki.json"]'
              )
              workflow_path.write_text(workflow, encoding="utf-8")
          PY

          git add scripts/live_refresh.py live-matches.json .github/workflows/live-four-test-refresh.yml
          if ! git diff --cached --quiet; then
            git commit -m "Persist SJK vs HJK in central live workflow"
            git pull --rebase origin main
            git push origin main
          fi
