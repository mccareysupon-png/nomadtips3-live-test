name: BALL46 hide statistics source annotation test only
on:
  push:
    branches: [test/ball46-stats-source-label-20261120]
    paths: ['.github/workflows/stats-source-test-20261120.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy isolated test only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --check qa/stats-source-label-20261120/worker.mjs
          cat > qa/stats-source-label-20261120/wrangler.toml <<'EOF'
          name = "ball46-stats-source-label-test-20261120"
          main = "worker.mjs"
          compatibility_date = "2026-11-20"
          workers_dev = true
          preview_urls = false
          [[services]]
          binding = "B46_PRODUCTION_READ"
          service = "ball46-production"
          EOF
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';import {writeFile} from 'node:fs/promises';
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/ball46-production/deployments?per_page=1',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});const j=await r.json();assert(j.success);await writeFile(process.env.RUNNER_TEMP+'/prod-before.json',JSON.stringify(j.result.deployments[0].versions));
          EOF
          npx --yes wrangler@4.50.0 deploy --config qa/stats-source-label-20261120/wrangler.toml --name ball46-stats-source-label-test-20261120
      - name: Verify all eight markets desktop and mobile
        run: |
          npm install --prefix qa/stats-source-label-20261120/.runtime --no-audit --no-fund playwright@1.55.0
          qa/stats-source-label-20261120/.runtime/node_modules/.bin/playwright install chromium --only-shell
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';import {createRequire} from 'node:module';
          const {chromium,devices}=createRequire(process.cwd()+'/qa/stats-source-label-20261120/.runtime/package.json')('playwright');
          const base='https://ball46-stats-source-label-test-20261120.mccarey-supon.workers.dev';
          let health;for(let i=0;i<15;i++){try{const r=await fetch(base+'/_stats_source_health');if(r.ok){health=await r.json();break}}catch{}await new Promise(r=>setTimeout(r,2000))}
          assert.equal(health?.scope,'TEST_ONLY_RESULT_SOURCE_LABEL');assert.equal((await fetch(base+'/_stats_source_health',{method:'POST'})).status,405);
          const browser=await chromium.launch();try{await Promise.all(['wide-dark','desktop-light','mobile-dark','mobile-light'].map(async mode=>{const mobile=mode.startsWith('mobile'),theme=mode.endsWith('dark')?'dark':'light';
          const p=await browser.newPage(mobile?{...devices['iPhone 13'],serviceWorkers:'block'}:{viewport:{width:mode.startsWith('wide')?1920:1440,height:950},serviceWorkers:'block'});
          await p.addInitScript(t=>localStorage.setItem('nomad343_dashboard_theme_v1',t),theme);
          await p.route('**/*',r=>['GET','HEAD'].includes(r.request().method())?r.continue():r.abort());
          await p.goto(base+'/index.html?view=statistics',{waitUntil:'domcontentloaded'});
          await p.waitForFunction(()=>[...document.querySelectorAll('[data-sp-table-body] tr')].some(r=>r.cells.length>=4),null,{timeout:90000});
          for(const market of ['all','1x2','ah','ou','btts','corners','cards','other','all']){
          if(!mobile)await p.locator('[data-stat-market="'+market+'"]').first().click();
          else{await p.locator('[data-stat-market="'+market+'"]').first().evaluate(e=>e.click())}
          await p.waitForFunction(m=>document.querySelector('[data-stat-market].active')?.dataset.statMarket===m&&document.querySelector('#b46-finance-chart-card')?.getBoundingClientRect().height>0&&document.querySelector('.sp-results')?.getBoundingClientRect().height>0,market,{timeout:15000});await p.waitForFunction(()=>document.querySelector('#b46-finance-chart-card .f46-card')?.getBoundingClientRect().height>0,null,{timeout:20000});await p.waitForTimeout(2000);
          const proof=await p.evaluate(()=>({labels:[...document.querySelectorAll('[data-sp-table-body] td.b46-sc-result-cell > small.sp-result-source')].map(e=>({text:e.textContent,display:getComputedStyle(e).display,rects:e.getClientRects().length})),badges:[...document.querySelectorAll('[data-sp-table-body] td.b46-sc-result-cell > .sp-result')].map(e=>({text:e.textContent,visible:!!e.getClientRects().length})),rows:document.querySelectorAll('[data-sp-table-body] tr').length,active:document.querySelector('[data-stat-market].active')?.dataset.statMarket}));
          console.log('SOURCE_HIDE_PASS '+JSON.stringify({mode,market,labels:proof.labels.length,visibleLabels:proof.labels.filter(e=>e.rects||e.display!=='none').length,badges:proof.badges.length,visibleBadges:proof.badges.filter(e=>e.visible).length,active:proof.active}));assert.equal(proof.active,market);assert(proof.labels.every(e=>e.display==='none'&&e.rects===0),'SOURCE_VISIBLE');if(market==='all'){assert(proof.labels.some(e=>/SOURCE 1/i.test(e.text)),'NO_REAL_SAMPLE');assert(proof.badges.some(e=>e.visible),'RESULT_BADGES_MISSING')}
          }await p.close()
          }))}finally{await browser.close()}
          EOF
      - name: Confirm Production unchanged
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';import {readFile} from 'node:fs/promises';
          const before=await readFile(process.env.RUNNER_TEMP+'/prod-before.json','utf8');const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/ball46-production/deployments?per_page=1',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});const j=await r.json();assert(j.success);assert.deepEqual(j.result.deployments[0].versions,JSON.parse(before));console.log('PRODUCTION_UNCHANGED')
          EOF
