name: BALL46 Sidebar Win Rate first paint isolated test 20261122
on:
  push:
    branches: [test/ball46-sidebar-initial-winrate-20261122]
    paths:
      - '.github/workflows/ball46-sidebar-initial-winrate-test-20261122.yml'
      - 'qa/sidebar-initial-winrate-20261122/**'
permissions: {contents: read}
concurrency:
  group: b46-sidebar-initial-winrate-isolated-test
  cancel-in-progress: true
jobs:
  test:
    if: github.ref == 'refs/heads/test/ball46-sidebar-initial-winrate-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate isolated test source
        run: |
          node --check qa/sidebar-initial-winrate-20261122/worker.mjs
          node --check qa/sidebar-initial-winrate-20261122/qa.mjs
      - name: Deploy standalone test Worker only
        run: npx --yes wrangler@4.50.0 deploy --config qa/sidebar-initial-winrate-20261122/wrangler.toml --name ball46-sidebar-initial-winrate-test-20261122
      - name: Verify first-paint without clicks and unchanged mobile
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.55.0
          npx playwright install chromium --only-shell
          node qa/sidebar-initial-winrate-20261122/qa.mjs

# Owner-requested restoration of existing tested Sidebar initial Win Rate Worker; no change to test logic.
