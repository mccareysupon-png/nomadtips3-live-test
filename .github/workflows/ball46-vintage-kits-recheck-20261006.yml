name: READ ONLY - Ball46 Vintage Kits Recheck 20261006

on:
  push:
    branches:
      - audit/ball46-vintage-kits-recheck-20261006
    paths:
      - '.github/workflows/ball46-vintage-kits-recheck-20261006.yml'
      - 'deploy-assets/vintage-kits-recheck-20261006/audit.mjs'

permissions:
  contents: read

concurrency:
  group: ball46-vintage-kits-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ball46-vintage-kits-recheck-20261006
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install read-only audit dependencies
        run: npm install --no-save --ignore-scripts acorn@8 playwright@1.55.0
      - name: Audit current Production only
        working-directory: deploy-assets/vintage-kits-recheck-20261006
        shell: bash
        run: |
          set -euo pipefail
          export PLAYWRIGHT_EXECUTABLE_PATH
          PLAYWRIGHT_EXECUTABLE_PATH=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$PLAYWRIGHT_EXECUTABLE_PATH"
          node audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-vintage-kits-readonly-${{ github.run_id }}
          path: deploy-assets/vintage-kits-recheck-20261006/audit
          if-no-files-found: warn
          retention-days: 30
