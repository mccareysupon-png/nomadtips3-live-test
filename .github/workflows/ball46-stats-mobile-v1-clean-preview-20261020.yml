name: BALL46 Statistics Mobile V1 — Clean Browser Preview (No Production)
on:
  push:
    branches: [codex/ball46-stats-mobile-v1-clean-browser-preview-20261020]
    paths:
      - '.github/workflows/ball46-stats-mobile-v1-clean-preview-20261020.yml'
      - 'deploy-assets/stats-mobile-v1-preview-20261020/preview-mobile.mjs'
      - 'deploy-assets/stats-mobile-v1-preview-20261020/mobile-clean.mjs'
      - 'deploy-assets/stats-mobile-v1-preview-20261020/mobile-clean.css'
permissions:
  contents: read
concurrency:
  group: ball46-statistics-mobile-clean-inactive-preview
  cancel-in-progress: false
jobs:
  preview-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check code and install browser
        working-directory: deploy-assets/stats-mobile-v1-preview-20261020
        run: |
          set -euo pipefail
          node --check preview-mobile.mjs
          node --check mobile-clean.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
      - name: Test inactive mobile candidate with REAL Statistics records and untouched PC
        working-directory: deploy-assets/stats-mobile-v1-preview-20261020
        run: node preview-mobile.mjs
      - name: Upload screenshots and Production unchanged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-statistics-mobile-v1-clean-preview-proof
          path: deploy-assets/stats-mobile-v1-preview-20261020/audit/
          retention-days: 30
          if-no-files-found: warn
