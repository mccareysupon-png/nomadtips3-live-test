name: BALL46 approved settings publication preflight READ ONLY
on:
  push:
    branches: [codex/ball46-5usd-latency-control-20261102]
    paths: ['work/ball46-5usd-latency-control-20261102/production-inspect-request.json']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: work/ball46-5usd-latency-control-20261102
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node production-preflight.mjs
      - name: Preserve read-only publication readiness evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-audit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Read-only latest Production settings and owner-access preflight [skip ci]"
          git push origin HEAD:codex/ball46-5usd-latency-control-20261102
