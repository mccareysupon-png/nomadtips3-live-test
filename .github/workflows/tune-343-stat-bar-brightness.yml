name: Tune 3.43 Stat Bar Brightness

on:
  push:
    branches: [work/nomad343-server-prewarm-20260914]
    paths:
      - '.github/workflows/tune-343-stat-bar-brightness.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CANARY_URL: https://nomadtips3-343-stable-preview.mccarey-supon.workers.dev
  PROD_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/nomad343-server-prewarm-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reduce stat bar brightness 10 percent
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          HOME_OLD='#52d985'; AWAY_OLD='#e6d45a'
          HOME='#4ac378'; AWAY='#cfbf51'

          p=Path('nomad-live-343/live-stable-343.css')
          s=p.read_text()
          s=s.replace(f'.home-track i{{background:{HOME_OLD}}}',f'.home-track i{{background:{HOME}}}')
          s=s.replace(f'.away-track i{{background:{AWAY_OLD}}}',f'.away-track i{{background:{AWAY}}}')
          p.write_text(s)

          p=Path('nomad-live-343/signal-compact-343.css')
          s=p.read_text()
          s=s.replace(f'.signal-mirror-half.home i{{background:{HOME_OLD}!important}}',f'.signal-mirror-half.home i{{background:{HOME}!important}}')
          s=s.replace(f'.signal-mirror-half.away i{{background:{AWAY_OLD}!important}}',f'.signal-mirror-half.away i{{background:{AWAY}!important}}')
          p.write_text(s)

          for name in ['index.html','signal.html','statistics.html']:
              p=Path('nomad-live-343')/name
              s=p.read_text()
              s=re.sub(r'live-stable-343\.css\?v=[^"\']+','live-stable-343.css?v=343-stat-bars-dim10-v1',s)
              s=re.sub(r'signal-compact-343\.css\?v=[^"\']+','signal-compact-343.css?v=343-stat-bars-dim10-v1',s)
              p.write_text(s)
          PY
          grep -Fq '.home-track i{background:#4ac378}' nomad-live-343/live-stable-343.css
          grep -Fq '.away-track i{background:#cfbf51}' nomad-live-343/live-stable-343.css
          grep -Fq '.signal-mirror-half.home i{background:#4ac378!important}' nomad-live-343/signal-compact-343.css
          grep -Fq '.signal-mirror-half.away i{background:#cfbf51!important}' nomad-live-343/signal-compact-343.css
          ! grep -Fq '.home-track i{background:#52d985}' nomad-live-343/live-stable-343.css
          ! grep -Fq '.away-track i{background:#e6d45a}' nomad-live-343/live-stable-343.css

      - name: Persist stat bar brightness only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nomad-live-343/live-stable-343.css nomad-live-343/signal-compact-343.css nomad-live-343/index.html nomad-live-343/signal.html nomad-live-343/statistics.html
          git commit -m 'style(343): dim home away stat bars ten percent'
          git push origin HEAD:work/nomad343-server-prewarm-20260914

      - name: Guard exact scope
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD | sort)"
          expected="$(printf '%s\n' nomad-live-343/index.html nomad-live-343/live-stable-343.css nomad-live-343/signal-compact-343.css nomad-live-343/signal.html nomad-live-343/statistics.html | sort)"
          [ "$changed" = "$expected" ] || { echo "UNEXPECTED_SCOPE: $changed"; exit 1; }
          git diff --quiet HEAD^ HEAD -- nomad-live-343/event-flow-343.css nomad-live-343/event-flow-343.js workers/nomadtips3-engine-343 workers/nomadtips3-5usd-hub-343 workers/nomadtips3-343-full-market workers/nomadtips3-343-full-market-central nomad-live-341

      - name: Dry run viewers
        run: |
          set -euo pipefail
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.stable.jsonc)
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc)

      - name: Deploy canary viewer
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.stable.jsonc

      - name: Verify canary stat bar colors
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          TARGET_URL="$CANARY_URL" node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1366,height:900}});
            await page.goto(process.env.TARGET_URL+'/?bars='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
            const live=await page.evaluate(()=>{const h=document.createElement('div');h.innerHTML='<div class="mirror-track home-track"><i></i></div><div class="mirror-track away-track"><i></i></div>';document.body.appendChild(h);const a=getComputedStyle(h.querySelector('.home-track i')).backgroundColor,b=getComputedStyle(h.querySelector('.away-track i')).backgroundColor;h.remove();return{home:a,away:b}});
            if(live.home!=='rgb(74, 195, 120)'||live.away!=='rgb(207, 191, 81)')throw Error('LIVE '+JSON.stringify(live));
            for(const path of ['/signal.html','/statistics.html']){
              await page.goto(process.env.TARGET_URL+path+'?bars='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
              const got=await page.evaluate(()=>{const h=document.createElement('div');h.innerHTML='<div class="signal-mirror-half home"><i></i></div><div class="signal-mirror-half away"><i></i></div>';document.body.appendChild(h);const a=getComputedStyle(h.querySelector('.home i')).backgroundColor,b=getComputedStyle(h.querySelector('.away i')).backgroundColor;h.remove();return{home:a,away:b}});
              if(got.home!=='rgb(74, 195, 120)'||got.away!=='rgb(207, 191, 81)')throw Error(path+' '+JSON.stringify(got));
            }
            console.log('CANARY STAT BAR DIM10 OK',live);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Deploy production viewer
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Verify production assets
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            live="$(curl -fsS "$PROD_URL/live-stable-343.css?x=$RANDOM$(date +%s)" || true)"
            sig="$(curl -fsS "$PROD_URL/signal-compact-343.css?x=$RANDOM$(date +%s)" || true)"
            if grep -Fq '#4ac378' <<<"$live" && grep -Fq '#cfbf51' <<<"$live" && grep -Fq '#4ac378' <<<"$sig" && grep -Fq '#cfbf51' <<<"$sig"; then
              echo 'PRODUCTION STAT BAR DIM10 ASSETS OK'
              exit 0
            fi
            sleep 2
          done
          exit 1
