name: Deploy Ball46 Legal Footer Home Links 20261002

on:
  push:
    branches: [ops/ball46-footer-legal-20260929]
    paths: ['.github/workflows/deploy-ball46-footer-legal-v5-20260929.yml']

permissions:
  contents: read

env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  BALL46_URL: https://ball46.com

jobs:
  surgical-legal-footer-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ball46-footer-legal-20260929
          fetch-depth: 1

      - name: Lock exact active production and backend identities
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=5" -H "$AUTH" -o /tmp/deployments-before.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/deployments-before.json','utf8'));
          if(j.success!==true) throw Error('DEPLOYMENT_LIST_FAILED');
          const d=j.result?.deployments?.[0];
          if(!d || !Array.isArray(d.versions) || d.versions.length!==1 || Number(d.versions[0].percentage)!==100) throw Error('PRODUCTION_NOT_SINGLE_VERSION');
          fs.writeFileSync('/tmp/rb-version',String(d.versions[0].version_id));
          console.log('PRODUCTION_LOCKED',{deployment:d.id,version:d.versions[0].version_id,created:d.created_on});
          NODE
          nonce="${GITHUB_RUN_ID}-pre-$(date +%s%N)"
          for f in index signal statistics; do
            curl -fsS -L --max-time 25 "$BALL46_URL/$f.html?$nonce" -o "/tmp/$f-before.html"
            grep -qi '<html' "/tmp/$f-before.html"
            grep -Fq 'b46-site-footer-v1' "/tmp/$f-before.html"
          done
          curl -fsS --max-time 25 "$BALL46_URL/api/engine/health?legal-footer-pre=$nonce" -o /tmp/engine-before.json
          curl -fsS --max-time 25 "$BALL46_URL/api/full-market/health?legal-footer-pre=$nonce" -o /tmp/full-before.json
          curl -fsS --max-time 25 "$BALL46_URL/api/engine/statistics?legal-footer-pre=$nonce" -o /tmp/stats-before.json
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/engine-before.json','utf8'));
          const f=JSON.parse(fs.readFileSync('/tmp/full-before.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/stats-before.json','utf8'));
          if(e.ok!==true||f.ok!==true||s.ok!==true) throw Error('PRE_DEPLOY_HEALTH_FAILED');
          fs.writeFileSync('/tmp/engine-version',String(e.version||''));
          fs.writeFileSync('/tmp/full-version',String(f.version||''));
          fs.writeFileSync('/tmp/stat-revision',String(s.settlementRevision||''));
          console.log('BACKEND_LOCKED',{engine:e.version,fullMarket:f.version,settlement:s.settlementRevision});
          NODE

      - name: Clone exact active Worker and patch only current legal-page footer HTML
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          RB_VERSION=$(cat /tmp/rb-version)
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/workers/$SCRIPT_NAME/versions/$RB_VERSION?include=modules" -H "$AUTH" -o /tmp/version-before.json
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const v=JSON.parse(fs.readFileSync('/tmp/version-before.json','utf8'));
          if(v.success!==true) throw Error('VERSION_FETCH_FAILED:'+JSON.stringify(v.errors||[]));
          const r=v.result;
          if(!r?.main_module||!Array.isArray(r.modules)||!r.modules.length) throw Error('VERSION_MODULES_MISSING');
          fs.mkdirSync('/tmp/modules',{recursive:true});
          for(const m of r.modules){
            if(!m?.name||!m?.content_base64||!m?.content_type) throw Error('BAD_MODULE_RECORD');
            const p=path.join('/tmp/modules',m.name);
            fs.mkdirSync(path.dirname(p),{recursive:true});
            fs.writeFileSync(p,Buffer.from(m.content_base64,'base64'));
          }
          const mainPath=path.join('/tmp/modules',r.main_module);
          const original=fs.readFileSync(mainPath,'utf8');
          if(!original.includes('__B46_FOOTER_LEGAL_20260929__')) throw Error('CURRENT_LEGAL_WRAPPER_NOT_FOUND');
          const anchor1='const __B46_LEGAL_PAGES__=';
          const anchor2=';\nconst __B46_FOOTER_HTML__=';
          const start=original.indexOf(anchor1);
          const end=original.indexOf(anchor2,start+anchor1.length);
          if(start<0||end<0) throw Error('LEGAL_PAGES_CONSTANT_NOT_FOUND');
          const jsonStart=start+anchor1.length;
          const oldJson=original.slice(jsonStart,end);
          const pages=JSON.parse(oldJson);
          const names=['information.html','about.html','user-guide.html','methodology.html','privacy.html','terms.html','disclaimer.html','affiliate-disclosure.html','responsible-gambling.html','cookies.html','contact.html'];
          const oldTitle='<div class="footer-title">BALL46</div>';
          const newTitle='<a class="b46-footer-brand-home" href="/" aria-label="Ball46 home" style="display:inline-block;text-decoration:none;color:inherit"><div class="footer-title"><span style="color:#fff">BALL</span><span style="color:#31b878">46</span></div></a>';
          const oldDomain='<a href="https://ball46.com/">ball46.com</a>';
          const newDomain='<a href="/">ball46.com</a>';
          let titleChanges=0,domainChanges=0;
          for(const f of names){
            const k='/'+f;
            if(typeof pages[k]!=='string') throw Error('LEGAL_PAGE_MISSING:'+k);
            const t=pages[k].split(oldTitle).length-1;
            const d=pages[k].split(oldDomain).length-1;
            if(t!==1) throw Error('FOOTER_TITLE_MATCH_COUNT:'+k+':'+t);
            if(d!==1) throw Error('FOOTER_DOMAIN_MATCH_COUNT:'+k+':'+d);
            pages[k]=pages[k].replace(oldTitle,newTitle).replace(oldDomain,newDomain);
            titleChanges+=t; domainChanges+=d;
          }
          if(titleChanges!==11||domainChanges!==11) throw Error('PATCH_COUNT_MISMATCH');
          const newJson=JSON.stringify(pages);
          const updated=original.slice(0,jsonStart)+newJson+original.slice(end);
          const restored=updated.slice(0,jsonStart)+oldJson+updated.slice(jsonStart+newJson.length);
          if(restored!==original) throw Error('SCOPE_GUARD_FAILED');
          fs.writeFileSync(mainPath,updated);
          fs.writeFileSync('/tmp/main-module-name',r.main_module);
          fs.writeFileSync('/tmp/module-meta.json',JSON.stringify(r.modules.map(m=>({name:m.name,content_type:m.content_type}))));
          console.log('LEGAL_FOOTER_PATCH_READY',{pages:names.length,titleChanges,domainChanges,main:r.main_module,modules:r.modules.length});
          NODE

      - name: Replace Worker script content only without changing configuration
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          node - <<'NODE'
          const fs=require('fs');
          const main=fs.readFileSync('/tmp/main-module-name','utf8').trim();
          fs.writeFileSync('/tmp/upload-metadata.json',JSON.stringify({main_module:main}));
          NODE
          mapfile -t args < <(node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/module-meta.json','utf8'));
          for(const m of a) console.log(`-F\n${m.name}=@/tmp/modules/${m.name};type=${m.content_type}`);
          NODE
          )
          CURL_ARGS=();i=0
          while [ $i -lt ${#args[@]} ]; do CURL_ARGS+=("${args[$i]}" "${args[$((i+1))]}"); i=$((i+2)); done
          curl -fsS -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/content" -H "$AUTH" -F 'metadata=</tmp/upload-metadata.json;type=application/json' "${CURL_ARGS[@]}" -o /tmp/content-update.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/content-update.json','utf8'));
          if(j.success!==true) throw Error('CONTENT_UPDATE_FAILED:'+JSON.stringify(j.errors||[]));
          console.log('SCRIPT_CONTENT_UPDATED');
          NODE

      - name: Verify exact legal footer change and backend identity or rollback
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          rollback(){
            RB_VERSION=$(cat /tmp/rb-version)
            echo "ROLLBACK_TO:$RB_VERSION"
            node -e "require('fs').writeFileSync('/tmp/rollback.json',JSON.stringify({strategy:'percentage',versions:[{version_id:process.argv[1],percentage:100}],annotations:{'workers/message':'Automatic rollback: Ball46 legal footer home-link verification failed'}}))" "$RB_VERSION"
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments" -H "$AUTH" -H 'content-type: application/json' --data-binary @/tmp/rollback.json -o /tmp/rollback-response.json || true
            cat /tmp/rollback-response.json || true
          }
          trap 'rollback' ERR
          for p in information about user-guide methodology privacy terms disclaimer affiliate-disclosure responsible-gambling cookies contact; do
            ok=0
            for n in $(seq 1 15); do
              nonce="${GITHUB_RUN_ID}-$p-$n-$(date +%s%N)"
              code=$(curl -sS -L --max-time 25 -o "/tmp/$p-after.html" -w '%{http_code}' "$BALL46_URL/$p.html?legalfooter=$nonce" || true)
              if [ "$code" = 200 ] \
                && grep -Fq 'class="b46-footer-brand-home" href="/"' "/tmp/$p-after.html" \
                && grep -Fq '<span style="color:#fff">BALL</span><span style="color:#31b878">46</span>' "/tmp/$p-after.html" \
                && grep -Fq '<a href="/">ball46.com</a>' "/tmp/$p-after.html"; then
                ok=1; echo "LEGAL_FOOTER_PASS:$p"; break
              fi
              sleep 2
            done
            [ "$ok" = 1 ] || { echo "LEGAL_FOOTER_FAILED:$p"; false; }
          done
          nonce="${GITHUB_RUN_ID}-main-post-$(date +%s%N)"
          for f in index signal statistics; do
            code=$(curl -sS -L --max-time 25 -o "/tmp/$f-after.html" -w '%{http_code}' "$BALL46_URL/$f.html?$nonce")
            [ "$code" = 200 ]
            grep -Fq 'b46-site-footer-v1' "/tmp/$f-after.html"
            ! grep -Fq 'b46-footer-brand-home' "/tmp/$f-after.html"
          done
          curl -fsS --max-time 25 "$BALL46_URL/api/engine/health?legal-footer-post=$nonce" -o /tmp/engine-after.json
          curl -fsS --max-time 25 "$BALL46_URL/api/full-market/health?legal-footer-post=$nonce" -o /tmp/full-after.json
          curl -fsS --max-time 25 "$BALL46_URL/api/engine/statistics?legal-footer-post=$nonce" -o /tmp/stats-after.json
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/engine-after.json','utf8'));
          const f=JSON.parse(fs.readFileSync('/tmp/full-after.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/stats-after.json','utf8'));
          if(e.ok!==true||f.ok!==true||s.ok!==true) throw Error('POST_HEALTH_FAILED');
          if(String(e.version||'')!==fs.readFileSync('/tmp/engine-version','utf8')) throw Error('ENGINE_VERSION_CHANGED');
          if(String(f.version||'')!==fs.readFileSync('/tmp/full-version','utf8')) throw Error('FULL_MARKET_VERSION_CHANGED');
          if(String(s.settlementRevision||'')!==fs.readFileSync('/tmp/stat-revision','utf8')) throw Error('STAT_SETTLEMENT_CHANGED');
          console.log('BALL46_LEGAL_FOOTER_HOME_DEPLOY_PASS',{engine:e.version,fullMarket:f.version,settlement:s.settlementRevision});
          NODE
          trap - ERR
