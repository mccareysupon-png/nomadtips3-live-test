name: Inspect Current Ball46 Legal Branding 20261002

on:
  push:
    branches: [ops/ball46-footer-legal-20260929]
    paths: ['.github/workflows/deploy-ball46-footer-legal-v5-20260929.yml']

permissions:
  contents: read

env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production

jobs:
  inspect-current-branding:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ball46-footer-legal-20260929
          fetch-depth: 1
      - name: Read active Worker branding only
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=10" -H "$AUTH" -o /tmp/deployments.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          if(j.success!==true) throw Error('DEPLOYMENT_LIST_FAILED');
          for(const d of (j.result?.deployments||[])) console.log('DEPLOYMENT',d.id,d.created_on,JSON.stringify(d.annotations||{}),JSON.stringify(d.versions||[]));
          const d=j.result?.deployments?.[0];
          if(!d?.versions?.[0]?.version_id) throw Error('ACTIVE_VERSION_MISSING');
          fs.writeFileSync('/tmp/version',String(d.versions[0].version_id));
          NODE
          V=$(cat /tmp/version)
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/workers/$SCRIPT_NAME/versions/$V?include=modules" -H "$AUTH" -o /tmp/version.json
          node - <<'NODE'
          const fs=require('fs');
          const v=JSON.parse(fs.readFileSync('/tmp/version.json','utf8'));
          if(v.success!==true) throw Error('VERSION_FETCH_FAILED');
          for(const m of v.result.modules||[]){
            if(!m.content_base64) continue;
            const s=Buffer.from(m.content_base64,'base64').toString('utf8');
            if(!s.includes('footer-brand-image')&&!s.includes('b46-header-logo-image')) continue;
            console.log('MODULE',m.name);
            for(const token of ['footer-brand-image','b46-header-logo-image','__B46_']){
              let from=0,n=0;
              while((from=s.indexOf(token,from))>=0 && n<20){
                console.log('MATCH',token,s.slice(Math.max(0,from-500),Math.min(s.length,from+1200)).replace(/\n/g,'\\n'));
                from+=token.length;n++;
              }
            }
          }
          NODE
