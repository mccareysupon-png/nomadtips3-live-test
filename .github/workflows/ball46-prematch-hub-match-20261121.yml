name: BALL46 correlate selected Pre-Match picks with normal HUB snapshot
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-prematch-hub-match-20261121.yml']
permissions: {contents: read}
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import crypto from 'node:crypto';
          const secret=crypto.createHmac('sha256',process.env.CLOUDFLARE_API_TOKEN).update('BALL46_PREMATCH_ONLY_V1').digest('hex');
          const base='https://ball46-prematch-only-test-20261120.mccarey-supon.workers.dev';
          const hub='https://nomadtips3-5usd-hub-343.mccarey-supon.workers.dev';
          const [r,s]=await Promise.all([fetch(base+'/test-ledger',{headers:{authorization:'Bearer '+secret},signal:AbortSignal.timeout(15000)}),fetch(hub+'/snapshot',{signal:AbortSignal.timeout(15000)})]);
          if(!r.ok||!s.ok)throw Error('read only fetch failed '+r.status+' '+s.status);
          const l=await r.json(), h=await s.json();
          console.log('PICKS_HUB_AUDIT '+JSON.stringify({hubFetchedAt:h.fetchedAt,hubAge:h.ageMs,hubCacheOnly:h.cacheOnly,hubCounts:h.counts,selected:l.rows.map(p=>{
            const f=h.fixtures.find(x=>String(x.fixtureId)===String(p.fixture_id));
            if(!f)return {id:p.fixture_id,home:p.home,away:p.away,storedStatus:p.status,hub:'NOT_IN_SNAPSHOT'};
            const kickoff=Date.parse(f.kickoffUtc)/1000;
            return {id:p.fixture_id,storedStatus:p.status,hubStatus:f.status,hubCode:f.statusCode,hubBoard:f.boardState,minute:f.minute,score:f.goals,kickoffSame:kickoff===p.kickoff,kickoff,homeSame:Number(f.home?.id)===p.home_id,awaySame:Number(f.away?.id)===p.away_id,leagueId:f.league?.id,providerOddsHeld:!!f.providerOddsHeld,home:p.home,away:p.away}
          })}));
          JS
