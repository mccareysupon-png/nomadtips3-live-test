name: ONE SHOT - Ball46 Scorebar Images Deploy 20260929

on:
  push:
    branches:
      - work/ball46-scorebar-images-20260929
    paths:
      - '.github/workflows/ball46-scorebar-images-deploy-20260929.yml'

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-scorebar-images-20260929
      - uses: actions/download-artifact@v4
        with:
          name: ball46-scorebar-images-predeploy-36529527284
          path: /tmp/b46-imgpre
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36529527284
      - name: Prepare browser verifier before any Production mutation
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Deploy four status images plus presentation CSS with race guards
        shell: bash
        run: bash .github/scripts/ball46_scorebar_images_deploy_20260929.sh
      - name: Verify actual Production backgrounds at 1920 1440 1000 and mobile behavior
        run: node .github/scripts/ball46_scorebar_images_post_browser_20260929.js
      - name: Guarded rollback to exact pre-image 79-asset snapshot on any failure
        if: failure()
        shell: bash
        run: bash .github/scripts/ball46_scorebar_images_rollback_20260929.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-scorebar-images-deploy-${{ github.run_id }}
          path: |
            /tmp/b46-scorebar-images-deploy
            /tmp/b46-scorebar-images-post-browser
            /tmp/b46-scorebar-images-rollback
          if-no-files-found: ignore
          retention-days: 30
