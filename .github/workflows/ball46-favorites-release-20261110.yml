name: BALL46 approved Favorites guarded release
on:
  push:
    branches: [codex/ball46-favorites-test-20261110]
    paths: ['work/favorites-test-20261110/release-request.json']
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated source and browser verification
        run: |
          npm install --no-save --package-lock=false --prefix work/favorites-test-20261110 acorn@8.15.0 parse5@7.3.0 playwright@1.56.1
          cd work/favorites-test-20261110 && npx playwright install --with-deps chromium
      - name: Build only the owner-approved tested Favorites patch
        run: |
          node work/favorites-test-20261110/build-release.mjs
          node --check work/favorites-test-20261110/stage/index.mjs
          node --check work/favorites-test-20261110/release-runtime.mjs
      - name: Fresh actual Production and guarded non-traffic candidate
        run: node work/favorites-test-20261110/release.mjs stage
      - name: Actual Worker Preview star navigation persistence history PC mobile light dark
        run: node work/favorites-test-20261110/release-browser.mjs candidate
      - name: Activate only after all Preview gates pass
        run: node work/favorites-test-20261110/release.mjs activate
      - name: Production PC mobile light dark Favorites and real scores
        run: node work/favorites-test-20261110/release-browser.mjs production
      - name: Final health version configuration and record preservation
        run: node work/favorites-test-20261110/release.mjs finish
      - name: Restore immediate baseline on any post-activation failure
        if: failure()
        run: node work/favorites-test-20261110/release.mjs rollback
      - name: Save scoped release evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/favorites-test-20261110/release-audit/*.json work/favorites-test-20261110/stage/build.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record approved Favorites release and current Production preservation [skip ci]"
          git push origin HEAD:codex/ball46-favorites-test-20261110
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-favorites-production-proof
          path: |
            work/favorites-test-20261110/release-audit
            work/favorites-test-20261110/stage/build.json