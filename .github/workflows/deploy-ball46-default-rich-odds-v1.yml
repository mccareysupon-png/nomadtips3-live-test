name: Deploy Ball46 NEXT Shared Live Evidence 20260919
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-ball46-default-rich-odds-v1.yml']
permissions:
  contents: write
env:
  SOURCE_BRANCH: work/ball46-live-prediction-percent-20260919
  BALL46_URL: https://ball46.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout Ball46 working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
      - name: Run presentation-only deploy script
        shell: bash
        run: |
          git fetch origin main --depth=1
          git show FETCH_HEAD:.github/scripts/ball46-next-shared-evidence-20260919.sh > /tmp/ball46-next-shared-evidence.sh
          chmod +x /tmp/ball46-next-shared-evidence.sh
          /tmp/ball46-next-shared-evidence.sh
