name: BALL46 Member Profile V2 - Guarded production deploy
on:
  push:
    branches: [feature/member-profile-v2-20261029]
    paths:
      - ball46-member/profile-v2/**
      - .github/workflows/member-profile-v2-candidate.yml
permissions:
  contents: read
concurrency:
  group: ball46-member-production-deploy
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROFILE_PROMOTE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Profile V2 modules and persistence security tests
        run: |
          node --check ball46-member/profile-v2/deploy.mjs
          node --check ball46-member/profile-v2/public/profile-v2.js
          node --check ball46-member/profile-v2/public/profile-bridge.js
          node --test --test-isolation=none ball46-member/profile-v2/profile-handler.test.mjs
      - name: Install browser test tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test profile save, avatar, preferences and responsive views
        run: node ball46-member/profile-v2/browser-tests.mjs
      - name: Restore immutable Member assets
        run: |
          set -euo pipefail
          git fetch origin 05c276f7f76a6226b10b45bd85ac369e53167d2f
          mkdir -p /tmp/ball46-member-live-tree
          git archive --format=tar 05c276f7f76a6226b10b45bd85ac369e53167d2f ball46-member/public | tar xf - -C /tmp/ball46-member-live-tree
      - name: Verify baseline, validate candidate and deploy Member Profile V2
        run: node ball46-member/profile-v2/deploy.mjs
      - name: Preserve Profile V2 verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-profile-v2-candidate-${{ github.run_id }}
          path: audit/member-profile-v2-20261029/
          retention-days: 14
          if-no-files-found: warn
