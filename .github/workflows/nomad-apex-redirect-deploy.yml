name: Deploy NOMADTIPS3 Apex Redirect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nomad-apex-redirect/**'
      - '.github/workflows/nomad-apex-redirect-deploy.yml'

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  APEX_HOST: nomadtips3.com
  CANONICAL_HOST: www.nomadtips3.com
  REDIRECT_SCRIPT: nomadtips3-apex-redirect
  ROUTE_PATTERN: nomadtips3.com/*

jobs:
  deploy-and-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate isolated redirect source
        run: |
          set -euo pipefail
          node --check nomad-apex-redirect/src/index.js
          grep -Fq "status: 308" nomad-apex-redirect/src/index.js
          grep -Fq "www.nomadtips3.com" nomad-apex-redirect/src/index.js
          grep -Fq '"name": "nomadtips3-apex-redirect"' nomad-apex-redirect/wrangler.jsonc
          grep -Fq '"workers_dev": false' nomad-apex-redirect/wrangler.jsonc
          if grep -Fq '"routes"' nomad-apex-redirect/wrangler.jsonc; then
            echo '::error::Apex redirect route must be managed explicitly after the isolated Worker deploy.'
            exit 1
          fi

      - name: Validate Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Deploy isolated redirect Worker only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: nomad-apex-redirect
          wranglerVersion: '4.92.0'
          command: deploy --config wrangler.jsonc

      - name: Resolve Cloudflare zone and snapshot existing apex route
        id: route
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')

          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/zones?name=${APEX_HOST}&account.id=${CF_ACCOUNT_ID}&status=active" \
            -o /tmp/zones.json

          ZONE_ID="$(jq -r '.result[0].id // empty' /tmp/zones.json)"
          test -n "$ZONE_ID" || { echo '::error::Could not resolve active Cloudflare zone for nomadtips3.com'; cat /tmp/zones.json; exit 1; }
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"

          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" \
            -o /tmp/routes-before.json

          jq --arg p "$ROUTE_PATTERN" '{captured_at:(now|todate), target_pattern:$p, exact_route:(.result[]? | select(.pattern==$p)), all_routes:.result}' \
            /tmp/routes-before.json > /tmp/apex-route-backup.json

          ROUTE_ID="$(jq -r --arg p "$ROUTE_PATTERN" '.result[]? | select(.pattern==$p) | .id' /tmp/routes-before.json | head -1)"
          OLD_SCRIPT="$(jq -r --arg p "$ROUTE_PATTERN" '.result[]? | select(.pattern==$p) | (.script // "")' /tmp/routes-before.json | head -1)"
          echo "route_id=$ROUTE_ID" >> "$GITHUB_OUTPUT"
          echo "old_script=$OLD_SCRIPT" >> "$GITHUB_OUTPUT"

          echo "### Apex route backup" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pattern: \`$ROUTE_PATTERN\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ROUTE_ID" ]; then
            echo "- Existing route id: \`$ROUTE_ID\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Previous script: \`${OLD_SCRIPT:-<none>}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No exact apex route existed; a new exact route will be created." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload rollback snapshot
        uses: actions/upload-artifact@v4
        with:
          name: nomadtips3-apex-route-backup-${{ github.run_id }}
          path: /tmp/apex-route-backup.json
          if-no-files-found: error
          retention-days: 30

      - name: Point only the exact apex route to redirect Worker
        shell: bash
        env:
          ZONE_ID: ${{ steps.route.outputs.zone_id }}
          ROUTE_ID: ${{ steps.route.outputs.route_id }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          payload="$(jq -nc --arg pattern "$ROUTE_PATTERN" --arg script "$REDIRECT_SCRIPT" '{pattern:$pattern,script:$script}')"

          if [ -n "$ROUTE_ID" ]; then
            curl -fsS "${auth[@]}" -X PUT \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes/${ROUTE_ID}" \
              --data "$payload" -o /tmp/route-change.json
          else
            curl -fsS "${auth[@]}" -X POST \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" \
              --data "$payload" -o /tmp/route-change.json
          fi

          test "$(jq -r '.success' /tmp/route-change.json)" = true || { cat /tmp/route-change.json; exit 1; }
          test "$(jq -r '.result.pattern' /tmp/route-change.json)" = "$ROUTE_PATTERN"
          test "$(jq -r '.result.script' /tmp/route-change.json)" = "$REDIRECT_SCRIPT"
          cat /tmp/route-change.json

      - name: Verify apex redirect and protect www production
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          probe="https://${APEX_HOST}/prediction3/?apex_fix_probe=${GITHUB_RUN_ID}"
          expected="https://${CANONICAL_HOST}/prediction3/?apex_fix_probe=${GITHUB_RUN_ID}"

          for attempt in $(seq 1 12); do
            code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$probe" || true)"
            location="$(curl -sS --max-time 20 -D - -o /dev/null "$probe" 2>/dev/null | awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,""); sub(/^[^:]*:[[:space:]]*/,""); print; exit}')"
            if [ "$code" = 308 ] && [ "$location" = "$expected" ]; then
              ok=1
              break
            fi
            sleep 3
          done

          test "$ok" = 1 || { echo "::error::Apex redirect verification failed code=$code location=$location"; exit 1; }

          curl -fsS --max-time 20 "https://${CANONICAL_HOST}/__nomad_release?apex_fix_probe=${GITHUB_RUN_ID}" -o /tmp/www-release.json
          grep -Fq 'nomadtips3-live-web-production' /tmp/www-release.json
          grep -Fq '"version":"3.41"' /tmp/www-release.json

          root_code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://${APEX_HOST}/")"
          test "$root_code" = 308

          echo "### Verification passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`nomadtips3.com/*\` returns HTTP 308 to \`www.nomadtips3.com\`." >> "$GITHUB_STEP_SUMMARY"
          echo "- Path and query are preserved." >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing \`www\` production release marker remains NOMAD Live 3.41." >> "$GITHUB_STEP_SUMMARY"
