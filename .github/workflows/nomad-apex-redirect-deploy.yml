name: Deploy NOMADTIPS3 Apex Redirect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nomad-apex-redirect/**'
      - '.github/workflows/nomad-apex-redirect-deploy.yml'

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  APEX_HOST: nomadtips3.com
  CANONICAL_HOST: www.nomadtips3.com
  REDIRECT_SCRIPT: nomadtips3-apex-redirect

jobs:
  deploy-and-bind:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate isolated redirect source
        run: |
          set -euo pipefail
          node --check nomad-apex-redirect/src/index.js
          grep -Fq "status: 308" nomad-apex-redirect/src/index.js
          grep -Fq "www.nomadtips3.com" nomad-apex-redirect/src/index.js
          grep -Fq '"name": "nomadtips3-apex-redirect"' nomad-apex-redirect/wrangler.jsonc
          grep -Fq '"workers_dev": false' nomad-apex-redirect/wrangler.jsonc
          if grep -Fq '"routes"' nomad-apex-redirect/wrangler.jsonc; then
            echo '::error::Redirect Worker must stay isolated from the main production route config.'
            exit 1
          fi

      - name: Validate Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Deploy isolated redirect Worker only
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: nomad-apex-redirect
          wranglerVersion: '4.92.0'
          command: deploy --config wrangler.jsonc

      - name: Snapshot existing Workers custom-domain bindings
        id: before
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')

          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/domains" \
            -o /tmp/domains-before.json

          test "$(jq -r '.success' /tmp/domains-before.json)" = true || { cat /tmp/domains-before.json; exit 1; }

          jq --arg apex "$APEX_HOST" --arg canonical "$CANONICAL_HOST" \
            '{captured_at:(now|todate),apex_domain:([.result[]? | select(.hostname==$apex)][0] // null),canonical_domain:([.result[]? | select(.hostname==$canonical)][0] // null)}' \
            /tmp/domains-before.json > /tmp/apex-domain-backup.json

          OLD_SERVICE="$(jq -r --arg apex "$APEX_HOST" '[.result[]? | select(.hostname==$apex)][0].service // empty' /tmp/domains-before.json)"
          OLD_DOMAIN_ID="$(jq -r --arg apex "$APEX_HOST" '[.result[]? | select(.hostname==$apex)][0].id // empty' /tmp/domains-before.json)"
          echo "old_service=$OLD_SERVICE" >> "$GITHUB_OUTPUT"
          echo "old_domain_id=$OLD_DOMAIN_ID" >> "$GITHUB_OUTPUT"

          echo "### Apex custom-domain backup" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hostname: \`$APEX_HOST\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$OLD_SERVICE" ]; then
            echo "- Previous Worker: \`$OLD_SERVICE\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Previous domain id: \`$OLD_DOMAIN_ID\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No previous Workers custom-domain binding was present for the apex hostname." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload rollback snapshot
        uses: actions/upload-artifact@v4
        with:
          name: nomadtips3-apex-domain-backup-${{ github.run_id }}
          path: /tmp/apex-domain-backup.json
          if-no-files-found: error
          retention-days: 30

      - name: Attach only nomadtips3.com to isolated redirect Worker
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          payload="$(jq -nc --arg hostname "$APEX_HOST" --arg service "$REDIRECT_SCRIPT" '{hostname:$hostname,service:$service}')"

          curl -fsS "${auth[@]}" -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/domains" \
            --data "$payload" -o /tmp/domain-change.json

          test "$(jq -r '.success' /tmp/domain-change.json)" = true || { cat /tmp/domain-change.json; exit 1; }
          test "$(jq -r '.result.hostname' /tmp/domain-change.json)" = "$APEX_HOST"
          test "$(jq -r '.result.service' /tmp/domain-change.json)" = "$REDIRECT_SCRIPT"
          cat /tmp/domain-change.json

      - name: Verify apex binding, redirect and www production
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')

          curl -fsS "${auth[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/domains" \
            -o /tmp/domains-after.json

          bound_service="$(jq -r --arg apex "$APEX_HOST" '[.result[]? | select(.hostname==$apex)][0].service // empty' /tmp/domains-after.json)"
          test "$bound_service" = "$REDIRECT_SCRIPT" || { echo "::error::Apex custom domain is bound to '$bound_service', expected '$REDIRECT_SCRIPT'"; exit 1; }

          ok=0
          probe="https://${APEX_HOST}/prediction3/?apex_fix_probe=${GITHUB_RUN_ID}"
          expected="https://${CANONICAL_HOST}/prediction3/?apex_fix_probe=${GITHUB_RUN_ID}"

          for attempt in $(seq 1 12); do
            code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "$probe" || true)"
            location="$(curl -sS --max-time 20 -D - -o /dev/null "$probe" 2>/dev/null | awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,""); sub(/^[^:]*:[[:space:]]*/,""); print; exit}')"
            if [ "$code" = 308 ] && [ "$location" = "$expected" ]; then
              ok=1
              break
            fi
            sleep 3
          done

          test "$ok" = 1 || { echo "::error::Apex redirect verification failed code=$code location=$location"; exit 1; }

          root_location="$(curl -sS --max-time 20 -D - -o /dev/null "https://${APEX_HOST}/" | awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,""); sub(/^[^:]*:[[:space:]]*/,""); print; exit}')"
          test "$root_location" = "https://${CANONICAL_HOST}/"

          curl -fsS --max-time 20 "https://${CANONICAL_HOST}/__nomad_release?apex_fix_probe=${GITHUB_RUN_ID}" -o /tmp/www-release.json
          grep -Fq 'nomadtips3-live-web-production' /tmp/www-release.json
          grep -Fq '"version":"3.41"' /tmp/www-release.json

          echo "### Verification passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`nomadtips3.com\` is bound only to \`nomadtips3-apex-redirect\`." >> "$GITHUB_STEP_SUMMARY"
          echo "- HTTP 308 redirects to \`www.nomadtips3.com\` and preserves path/query." >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing \`www\` production release marker remains NOMAD Live 3.41." >> "$GITHUB_STEP_SUMMARY"
