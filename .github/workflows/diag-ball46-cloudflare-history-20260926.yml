name: Diagnose Ball46 Cloudflare History 20260926

# Read-only exact-version inspection. Never deploys or rolls back production.
on:
  push:
    branches:
      - ops/ball46-recovery-history-20260926
    paths:
      - .github/workflows/diag-ball46-cloudflare-history-20260926.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Read exact Cloudflare version metadata and official version URLs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          versions=[
            '6f62755e-6610-447e-b41b-7214041d0594',
            '59dca686-a0b3-4419-b809-5c80fd8acae2',
            '8e95c148-ea19-4ed1-88a1-2f14565c6888',
            '9958e030-d54d-4bca-8ac5-e1cb5507a56b',
            '1c002b58-317e-408e-a64e-84c3db83b6d7',
          ]
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/workers/ball46-production/versions/'
          hdr={'Authorization':f'Bearer {token}','Accept':'application/json'}
          for v in versions:
              req=urllib.request.Request(base+v+'?include=modules',headers=hdr)
              with urllib.request.urlopen(req, timeout=30) as r:
                  payload=json.load(r)
              result=payload.get('result') or {}
              print('===',v,'===')
              print('created_on=',result.get('created_on'))
              print('number=',result.get('number'))
              print('urls=',json.dumps(result.get('urls') or []))
              print('annotations=',json.dumps(result.get('annotations') or {}))
              assets=result.get('assets') or {}
              print('assets_config=',json.dumps(assets.get('config') or {}))
              modules=result.get('modules') or []
              print('modules=',json.dumps([{'name':m.get('name'),'content_type':m.get('content_type'),'size':len(m.get('content','')) if isinstance(m.get('content'),str) else None} for m in modules]))
          PY
