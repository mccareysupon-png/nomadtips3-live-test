name: Diagnose Ball46 Cloudflare History 20260926

on:
  push:
    branches:
      - ops/ball46-recovery-history-20260926
    paths:
      - .github/workflows/diag-ball46-cloudflare-history-20260926.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wrangler info
        run: |
          set -u
          npx --yes wrangler@4.92.0 --version
          echo '=== deployments list ==='
          npx --yes wrangler@4.92.0 deployments list --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc || true
          echo '=== versions list ==='
          npx --yes wrangler@4.92.0 versions list --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc || true
          echo '=== rollback help ==='
          npx --yes wrangler@4.92.0 rollback --help || true
          echo '=== versions deploy help ==='
          npx --yes wrangler@4.92.0 versions deploy --help || true
