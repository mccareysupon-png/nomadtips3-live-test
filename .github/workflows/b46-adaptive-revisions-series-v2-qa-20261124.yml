name: BALL46 Adaptive 42 formula FT revisions and 30D90D snapshot QA
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-adaptive-revisions-series-v2-qa-20261124.yml]
permissions: {contents: read}
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check qa/prematch-history-20261120/b46-adaptive-ou-ledger-v1-test.mjs
          node --check qa/prematch-history-20261120/b46-adaptive-ou-events-v2-test.mjs
          node --check qa/prematch-history-20261120/b46-adaptive-ou-series-v2-test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/b46-adaptive-ou-research-v1.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-value-screener-v2.test.mjs
