name: BALL46 Featured Flashing — Production/Preview Read Only Audit
on:
  push:
    branches: [codex/ball46-featured-match-clean-preview-20261021]
    paths:
      - '.github/workflows/ball46-featured-flash-readonly-20261021.yml'
      - 'deploy-assets/featured-match-clean-preview-20261021/audit-flashing.mjs'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit actual mobile Featured Match duplicates every 450ms
        working-directory: deploy-assets/featured-match-clean-preview-20261021
        run: |
          node --check audit-flashing.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
          node audit-flashing.mjs
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-featured-mobile-flash-readonly-proof
          path: deploy-assets/featured-match-clean-preview-20261021/audit-featured/flash/
          retention-days: 7
          if-no-files-found: warn
