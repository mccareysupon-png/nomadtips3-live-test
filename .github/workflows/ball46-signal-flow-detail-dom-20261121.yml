name: BALL46 Signal and Event Flow detail read-only diagnostic
on:
  push:
    branches: [test/ball46-premium-match-colors-20261120]
    paths: ['.github/workflows/ball46-signal-flow-detail-dom-20261121.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Inspect Signal latest time, Event Flow click and scroll behavior
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const b=await chromium.launch();
          const p=await b.newPage({viewport:{width:1440,height:950},serviceWorkers:'block'});
          await p.addInitScript(()=>localStorage.setItem('nomad343_dashboard_theme_v1','dark'));
          const requests=[];
          p.on('response',r=>{if(/api\/|signal|match/i.test(r.url())&&requests.length<60)requests.push({status:r.status(),url:r.url().slice(0,250)});});
          await p.goto('https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev/?view=signal',{waitUntil:'domcontentloaded',timeout:65000});
          await p.waitForTimeout(3300);
          const before=await p.evaluate(()=>{
            const signal=document.querySelector('[data-workspace-view="signal"]');
            const sections=[...document.querySelectorAll('section.league-block')].map((s,i)=>({i,outer:s.outerHTML.slice(0,850),parent:s.parentElement?.outerHTML.slice(0,500),header:s.querySelector('.league-head')?.innerText?.slice(0,140),ids:[...s.querySelectorAll('.match-row')].map(r=>r.dataset.matchId)}));
            const rows=[...document.querySelectorAll('[data-match-id].match-row')].slice(0,5).map(r=>({id:r.dataset.matchId,html:r.outerHTML.slice(-5000),signals:[...r.querySelectorAll('[class*=signal],[class*=prediction],[data-signal]')].map(x=>({c:String(x.className),text:x.innerText?.slice(0,160),html:x.outerHTML.slice(0,900)})).slice(0,15)}));
            const globals=Object.keys(window).filter(k=>/signal|prediction|match|event|flow|render|state/i.test(k)).slice(0,90);
            const htmlNodes=[...document.querySelectorAll('section,main,div')].filter(e=>e.querySelectorAll('.match-row').length>=3).slice(-8).map(x=>({tag:x.tagName,id:x.id,cls:String(x.className),cnt:x.querySelectorAll('.match-row').length,tagChild:x.children[0]?.tagName,firstChildClass:x.children[0]?.className,scroll:x.scrollTop,overflow:getComputedStyle(x).overflowY}));
            return {signalBody:signal?.outerHTML.slice(0,700),sections,rows,globals,htmlNodes,viewportScroll:scrollY};
          });
          console.log('B46_SIGNAL_DETAIL_BEFORE '+JSON.stringify(before));
          const first=p.locator('[data-match-id].match-row').first();await first.scrollIntoViewIfNeeded();
          await first.click({position:{x:120,y:25}});
          await p.waitForTimeout(850);
          const after=await p.evaluate(()=>{
            const rows=[...document.querySelectorAll('[data-match-id].match-row')];
            const selected=rows.filter(r=>r.classList.contains('active')).map(r=>({id:r.dataset.matchId,html:r.outerHTML.slice(-4500),parent:r.parentElement?.outerHTML.slice(-1300)}));
            const classes=[...document.querySelectorAll('[class*=flow],[id*=flow],[class*=detail],[id*=detail],[class*=event],[id*=event]')].filter(e=>e.getBoundingClientRect().width>15&&e.getBoundingClientRect().height>15).slice(0,24).map(e=>({c:String(e.className).slice(0,120),id:e.id,text:(e.innerText||'').slice(0,230),html:e.outerHTML.slice(0,950)}));
            return {selected,classes,scrollY,bodyH:document.body.scrollHeight,focus:document.activeElement?.outerHTML.slice(0,220)};
          });
          console.log('B46_SIGNAL_DETAIL_AFTER_CLICK '+JSON.stringify(after));
          console.log('B46_SIGNAL_FETCH_URLS '+JSON.stringify(requests));
          await b.close();
          NODE