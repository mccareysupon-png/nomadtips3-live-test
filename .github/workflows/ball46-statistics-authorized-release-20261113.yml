name: BALL46 Statistics authorized release preflight
on:
  push:
    branches: [test/ball46-statistics-content-revision-20261113]
    paths: ['.github/workflows/ball46-statistics-authorized-release-20261113.yml','work/statistics-content-revision-20261113/release-*.mjs','work/statistics-content-revision-20261113/website-release-entry.mjs']
permissions:
  contents: read
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read active sources and current static Website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node work/statistics-summary-shadow-20261113/fresh-source.mjs
          node work/statistics-summary-shadow-20261113/capture-ui.mjs
          mkdir -p work/statistics-summary-shadow-20261113/reference/ui-proof/qa/ui-capture
          cp -r work/statistics-summary-shadow-20261113/qa/ui-capture/. work/statistics-summary-shadow-20261113/reference/ui-proof/qa/ui-capture/
      - name: Production read-only safety and size preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: B46_STAGE_ONLY=1 node work/statistics-content-revision-20261113/release-preflight.mjs
      - uses: actions/download-artifact@v4
        with:
          name: ball46-statistics-shadow-proof
          run-id: 43373832113
          github-token: ${{ github.token }}
          path: work/statistics-content-revision-20261113/reference
      - name: Build verified release source and install browser checks
        run: |
          cp work/statistics-content-revision-20261113/reference/qa/verified-full-ledger.json work/statistics-summary-shadow-20261113/reference/ui-proof/qa/verified-full-ledger.json
          node work/statistics-summary-shadow-20261113/build-summary-formulas.mjs
          node work/statistics-content-revision-20261113/build-engine.mjs
          node work/statistics-content-revision-20261113/prepare-summary.mjs
          node work/statistics-content-revision-20261113/menu-single-owner-test.mjs
          node work/statistics-content-revision-20261113/engine-reader-test.mjs
          npm install --prefix work/statistics-summary-shadow-20261113/.runtime --no-save --package-lock=false --no-audit --no-fund esbuild playwright@1.56.1
          work/statistics-summary-shadow-20261113/.runtime/node_modules/.bin/playwright install --with-deps chromium
      - name: Stage and verify isolated hosted candidate before Production changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node work/statistics-content-revision-20261113/release-stage.mjs
      - name: Activate authorized release with automatic rollback on verification failure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node work/statistics-content-revision-20261113/release-activate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-statistics-release-audit
          path: |
            work/statistics-content-revision-20261113/qa/release
            work/statistics-summary-shadow-20261113/source/active.json
