name: DEPLOY Ball46 Footer Links V5 20261001

on:
  push:
    branches: [ops/ball46-footer-links-20261001]
    paths: ['.github/workflows/deploy-ball46-footer-links-v5-20261001.yml']

permissions:
  contents: write

env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  BALL46_URL: https://ball46.com

jobs:
  footer-current-pages-cache-safe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ball46-footer-links-20261001
          fetch-depth: 1

      - name: Lock exact current Production and prepare Footer from live index
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          mkdir -p /tmp/before /tmp/after /tmp/modules-before /tmp/modules-patched audit
          BEFORE_KEY="${GITHUB_RUN_ID}-before-$(date +%s%N)"
          echo "$BEFORE_KEY" >/tmp/before-key
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=5" -H "$AUTH" -o /tmp/deployments-before.json
          node - <<'NODE'
          const fs=require('fs'),j=JSON.parse(fs.readFileSync('/tmp/deployments-before.json','utf8')),d=j.result?.deployments?.[0];
          if(j.success!==true||!d||d.versions?.length!==1||Number(d.versions[0].percentage)!==100) throw Error('PRODUCTION_NOT_SINGLE_VERSION');
          fs.writeFileSync('/tmp/rb-version',String(d.versions[0].version_id));
          fs.writeFileSync('/tmp/rb-deployment',String(d.id));
          console.log('LOCKED_ACTIVE',{deployment:d.id,version:d.versions[0].version_id,created:d.created_on});
          NODE
          KEY=$(cat /tmp/before-key)
          curl -fsS -L -H 'Cache-Control: no-cache' --max-time 25 "$BALL46_URL/index.html?footerbefore=$KEY" -o /tmp/before/index.html
          curl -fsS -L -H 'Cache-Control: no-cache' --max-time 25 "$BALL46_URL/ball46-footer.css?footerbefore=$KEY" -o /tmp/before/footer.css
          curl -fsS -H 'Cache-Control: no-cache' --max-time 25 "$BALL46_URL/api/engine/health?footerbefore=$KEY" -o /tmp/before/engine.json
          curl -fsS -H 'Cache-Control: no-cache' --max-time 25 "$BALL46_URL/api/full-market/health?footerbefore=$KEY" -o /tmp/before/full.json
          curl -fsS -H 'Cache-Control: no-cache' --max-time 25 "$BALL46_URL/api/engine/statistics?footerbefore=$KEY" -o /tmp/before/stats.json
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('/tmp/before/index.html','utf8');
          const m=html.match(/<footer\b[^>]*id=["']b46-site-footer-v1["'][\s\S]*?<\/footer>/i);
          if(!m) throw Error('CURRENT_FOOTER_MISSING');
          let footer=m[0],s=0,t=0;
          footer=footer.replace(/href=["']\/signal\.html["']/g,()=>{s++;return 'href="/index.html?view=signal"'});
          footer=footer.replace(/href=["']\/statistics\.html["']/g,()=>{t++;return 'href="/index.html?view=statistics"'});
          if(s!==1||t!==1) throw Error(`FOOTER_LINK_COUNT signal=${s} statistics=${t}`);
          fs.writeFileSync('/tmp/footer-new.html',footer);
          const css=fs.readFileSync('/tmp/before/footer.css','utf8');
          if(!/#b46-site-footer-v1/.test(css)) throw Error('FOOTER_CSS_NOT_SCOPED');
          const e=JSON.parse(fs.readFileSync('/tmp/before/engine.json','utf8')),f=JSON.parse(fs.readFileSync('/tmp/before/full.json','utf8')),st=JSON.parse(fs.readFileSync('/tmp/before/stats.json','utf8'));
          if(e.ok!==true||f.ok!==true||st.ok!==true) throw Error('BACKEND_NOT_OK_BEFORE');
          fs.writeFileSync('/tmp/backend-before.json',JSON.stringify({engine:e.version,fullMarket:f.version,settlementRevision:st.settlementRevision}));
          console.log('FOOTER_PATCH_READY',{live:'/index.html',signals:'/index.html?view=signal',statistics:'/index.html?view=statistics'});
          NODE

      - name: Clone exact locked Worker modules and construct Footer-only wrapper
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"; RB=$(cat /tmp/rb-version)
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/workers/$SCRIPT_NAME/versions/$RB?include=modules" -H "$AUTH" -o /tmp/version-before.json
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto'),j=JSON.parse(fs.readFileSync('/tmp/version-before.json','utf8'));
          if(j.success!==true) throw Error('VERSION_FETCH_FAILED');
          const r=j.result;if(!r?.main_module||!Array.isArray(r.modules)||!r.modules.length) throw Error('MODULES_MISSING');
          const meta=[];
          for(const m of r.modules){
            if(!m.name||!m.content_base64||!m.content_type) throw Error('BAD_MODULE');
            const buf=Buffer.from(m.content_base64,'base64');
            for(const dir of ['/tmp/modules-before','/tmp/modules-patched']){const p=path.join(dir,m.name);fs.mkdirSync(path.dirname(p),{recursive:true});fs.writeFileSync(p,buf)}
            meta.push({name:m.name,content_type:m.content_type,beforeSha256:crypto.createHash('sha256').update(buf).digest('hex')});
          }
          const main=r.main_module,p=path.join('/tmp/modules-patched',main);const original=fs.readFileSync(p,'utf8');
          if(original.includes('__B46_FOOTER_LINKS_V5_20261001__')) throw Error('PATCH_ALREADY_PRESENT');
          let src=original,mode='';
          const direct=/export\s+default\s*\{/;
          if(direct.test(src)){src=src.replace(direct,'const __B46_FOOTER_BASE_V5_20261001__ = {');mode='direct';}
          else {const re=/export\s*\{\s*([A-Za-z_$][\w$]*)\s+as\s+default\s*\};?\s*$/m,m=src.match(re);if(!m) throw Error('DEFAULT_EXPORT_ANCHOR_MISSING');src=src.replace(re,'')+`\nconst __B46_FOOTER_BASE_V5_20261001__=${m[1]};\n`;mode='bundled';}
          const footer=fs.readFileSync('/tmp/footer-new.html','utf8');
          const wrapper=`\n/* __B46_FOOTER_LINKS_V5_20261001__ */\nconst __B46_FOOTER_NEW_V5_20261001__=${JSON.stringify(footer)};\nconst __B46_FOOTER_LEGAL_V5_20261001__=new Set(['/information.html','/about.html','/user-guide.html','/methodology.html','/privacy.html','/terms.html','/disclaimer.html','/affiliate-disclosure.html','/responsible-gambling.html','/cookies.html','/contact.html']);\nconst __B46_FOOTER_TARGET_V5_20261001__=new Set(['/','/index.html',...__B46_FOOTER_LEGAL_V5_20261001__]);\nasync function __b46FooterOnlyV5_20261001(response,pathname){if(!response||response.status!==200)return response;const ct=String(response.headers.get('content-type')||'').toLowerCase();if(!ct.includes('text/html'))return response;let html=await response.text();const re=/<footer\\b[^>]*id=[\\"']b46-site-footer-v1[\\"'][\\s\\S]*?<\\/footer>/i;let changed=false;if(re.test(html)){html=html.replace(re,__B46_FOOTER_NEW_V5_20261001__);changed=true}else if(__B46_FOOTER_LEGAL_V5_20261001__.has(pathname)){if(!/ball46-footer\\.css/i.test(html)){const link='<link rel=\\"stylesheet\\" href=\\"/ball46-footer.css?v=20260929\\">';html=/<\\/head>/i.test(html)?html.replace(/<\\/head>/i,link+'</head>'):link+html}html=/<\\/body>/i.test(html)?html.replace(/<\\/body>/i,__B46_FOOTER_NEW_V5_20261001__+'</body>'):html+__B46_FOOTER_NEW_V5_20261001__;changed=true}if(!changed)return response;const h=new Headers(response.headers);h.delete('content-length');h.set('cache-control','no-store, no-cache, must-revalidate, max-age=0');h.set('x-ball46-footer-revision','footer-links-v5-20261001');return new Response(html,{status:response.status,statusText:response.statusText,headers:h})}\nexport default {...__B46_FOOTER_BASE_V5_20261001__,async fetch(request,env,ctx){const response=await __B46_FOOTER_BASE_V5_20261001__.fetch(request,env,ctx);if(request.method!=='GET')return response;const pathname=new URL(request.url).pathname;if(!__B46_FOOTER_TARGET_V5_20261001__.has(pathname))return response;return __b46FooterOnlyV5_20261001(response,pathname)}};\n`;
          src+=wrapper;fs.writeFileSync(p,src);
          const originalSha=crypto.createHash('sha256').update(Buffer.from(original)).digest('hex'),patchedSha=crypto.createHash('sha256').update(Buffer.from(src)).digest('hex');
          fs.writeFileSync('/tmp/main-module',main);fs.writeFileSync('/tmp/meta.json',JSON.stringify(meta));fs.writeFileSync('/tmp/patched-main.sha256',patchedSha);
          fs.writeFileSync('/tmp/source.json',JSON.stringify({main,mode,originalMainSha256:originalSha,patchedMainSha256:patchedSha,originalBytes:Buffer.byteLength(original),patchedBytes:Buffer.byteLength(src),wrapperBytes:Buffer.byteLength(wrapper),nonMainModules:meta.filter(x=>x.name!==main)},null,2));
          console.log('PATCH_SOURCE_READY',{main,mode,modules:meta.length,originalSha,patchedSha});
          NODE

      - name: Abort if Production moved during preparation
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"; LOCKED=$(cat /tmp/rb-version)
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/recheck.json
          NOW=$(node -e "const j=require('/tmp/recheck.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))")
          [ "$NOW" = "$LOCKED" ] || { echo "ABORT_CONCURRENT_DEPLOY locked=$LOCKED current=$NOW";exit 1; }
          echo "PRODUCTION_LOCK_CONFIRMED:$NOW"

      - name: Upload exact locked modules with Footer wrapper only
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          node -e "const fs=require('fs');fs.writeFileSync('/tmp/upload-meta.json',JSON.stringify({main_module:fs.readFileSync('/tmp/main-module','utf8').trim()}))"
          mapfile -t args < <(node - <<'NODE'
          const fs=require('fs');for(const m of JSON.parse(fs.readFileSync('/tmp/meta.json','utf8')))console.log(`-F\n${m.name}=@/tmp/modules-patched/${m.name};type=${m.content_type}`);
          NODE
          )
          CURL_ARGS=();i=0;while [ $i -lt ${#args[@]} ];do CURL_ARGS+=("${args[$i]}" "${args[$((i+1))]}");i=$((i+2));done
          curl -fsS -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/content" -H "$AUTH" -F 'metadata=</tmp/upload-meta.json;type=application/json' "${CURL_ARGS[@]}" -o /tmp/update.json
          node -e "const j=require('/tmp/update.json');if(j.success!==true)throw Error(JSON.stringify(j.errors||[]));console.log('UPLOAD_ACCEPTED')"

      - name: Verify exact source and fresh live responses; rollback only our version on failure
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"; RB=$(cat /tmp/rb-version)
          rollback_if_ours(){
            set +e
            [ -s /tmp/our-version ] || { echo 'ROLLBACK_SKIP:no_verified_our_version';return; }
            OUR=$(cat /tmp/our-version)
            curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/current-error.json || return
            CUR=$(node -e "const j=require('/tmp/current-error.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))")
            if [ "$CUR" != "$OUR" ];then echo "ROLLBACK_SKIP:production_moved current=$CUR ours=$OUR";return;fi
            node -e "require('fs').writeFileSync('/tmp/rollback.json',JSON.stringify({strategy:'percentage',versions:[{version_id:process.argv[1],percentage:100}],annotations:{'workers/message':'Automatic rollback: Ball46 Footer V5 verification failed'}}))" "$RB"
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments" -H "$AUTH" -H 'content-type: application/json' --data-binary @/tmp/rollback.json -o /tmp/rollback-response.json || true
            echo "ROLLBACK_TO:$RB"
          }
          trap 'rc=$?; rollback_if_ours; exit $rc' ERR

          CAND=''
          for n in $(seq 1 15);do
            curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=3" -H "$AUTH" -o /tmp/after-upload.json
            CAND=$(node -e "const j=require('/tmp/after-upload.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))")
            [ -n "$CAND" ] && [ "$CAND" != "$RB" ] && break
            sleep 2
          done
          [ -n "$CAND" ] && [ "$CAND" != "$RB" ]
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/workers/$SCRIPT_NAME/versions/$CAND?include=modules" -H "$AUTH" -o /tmp/candidate.json
          CANDIDATE_VERSION="$CAND" node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),j=JSON.parse(fs.readFileSync('/tmp/candidate.json','utf8')),exp=JSON.parse(fs.readFileSync('/tmp/meta.json','utf8')),main=fs.readFileSync('/tmp/main-module','utf8').trim(),patched=fs.readFileSync('/tmp/patched-main.sha256','utf8').trim();
          if(j.success!==true) throw Error('CANDIDATE_FETCH_FAILED');
          const mods=j.result.modules,a=new Map(mods.map(m=>[m.name,crypto.createHash('sha256').update(Buffer.from(m.content_base64,'base64')).digest('hex')]));
          for(const m of exp){const want=m.name===main?patched:m.beforeSha256;if(a.get(m.name)!==want)throw Error('DEPLOYED_MODULE_MISMATCH:'+m.name)}
          if(a.size!==exp.length) throw Error('MODULE_COUNT_CHANGED');
          const src=Buffer.from(mods.find(m=>m.name===main).content_base64,'base64').toString('utf8');if(!src.includes('__B46_FOOTER_LINKS_V5_20261001__'))throw Error('CANDIDATE_NOT_OURS');
          fs.writeFileSync('/tmp/our-version',process.env.CANDIDATE_VERSION);console.log('SOURCE_IDENTITY_PASS',{version:process.env.CANDIDATE_VERSION,modules:a.size});
          NODE

          pages='index information about user-guide methodology privacy terms disclaimer affiliate-disclosure responsible-gambling cookies contact'
          all_visible=0
          for round in $(seq 1 20);do
            missing=0
            for p in $pages;do
              curl -fsS -L -H 'Cache-Control: no-cache' -D "/tmp/probe-$p.headers" --max-time 25 "$BALL46_URL/$p.html?footerprop=${GITHUB_RUN_ID}-$round-$p-$(date +%s%N)" -o "/tmp/probe-$p.html"
              if ! grep -qi '^x-ball46-footer-revision: footer-links-v5-20261001' "/tmp/probe-$p.headers";then missing=$((missing+1));echo "EDGE_PENDING round=$round page=$p";fi
            done
            if [ "$missing" -eq 0 ];then all_visible=1;echo "EDGE_REVISION_VISIBLE_ALL round=$round";break;fi
            sleep 2
          done
          [ "$all_visible" = 1 ] || { echo 'EDGE_PROPAGATION_TIMEOUT';false; }

          # Fresh one-shot URLs only. Never reuse a pre-deploy URL, avoiding stale cache artifacts.
          AFTER_KEY="${GITHUB_RUN_ID}-after-$(date +%s%N)"
          for p in $pages;do
            curl -fsS -L -H 'Cache-Control: no-cache' -D "/tmp/after/$p.headers" --max-time 25 "$BALL46_URL/$p.html?footerafter=$AFTER_KEY-$p" -o "/tmp/after/$p.html"
            grep -qi '^x-ball46-footer-revision: footer-links-v5-20261001' "/tmp/after/$p.headers" || { echo "REVISION_MISSING_AFTER page=$p";false; }
          done
          curl -fsS -L -H 'Cache-Control: no-cache' --max-time 25 "$BALL46_URL/ball46-footer.css?footerafter=$AFTER_KEY" -o /tmp/after/footer.css
          curl -fsS -H 'Cache-Control: no-cache' --max-time 25 "$BALL46_URL/api/engine/health?footerafter=$AFTER_KEY" -o /tmp/after/engine.json
          curl -fsS -H 'Cache-Control: no-cache' --max-time 25 "$BALL46_URL/api/full-market/health?footerafter=$AFTER_KEY" -o /tmp/after/full.json
          curl -fsS -H 'Cache-Control: no-cache' --max-time 25 "$BALL46_URL/api/engine/statistics?footerafter=$AFTER_KEY" -o /tmp/after/stats.json

          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const names='index information about user-guide methodology privacy terms disclaimer affiliate-disclosure responsible-gambling cookies contact'.split(' ');
          const footerRe=/<footer\b[^>]*id=["']b46-site-footer-v1["'][\s\S]*?<\/footer>/i;
          let baseline=null;const rows=[];
          for(const n of names){
            const html=fs.readFileSync('/tmp/after/'+n+'.html','utf8'),m=html.match(footerRe);if(!m)throw Error('FOOTER_MISSING:'+n);
            const f=m[0].replace(/\s+/g,' ').trim();if(!baseline)baseline=f;if(f!==baseline)throw Error('FOOTER_NOT_IDENTICAL:'+n);
            if(!f.includes('href="/index.html"'))throw Error('LIVE_LINK_BAD:'+n);
            if(!f.includes('href="/index.html?view=signal"'))throw Error('SIGNAL_LINK_BAD:'+n);
            if(!f.includes('href="/index.html?view=statistics"'))throw Error('STAT_LINK_BAD:'+n);
            if(f.includes('href="/signal.html"')||f.includes('href="/statistics.html"'))throw Error('OLD_PRODUCT_LINK_REMAINS:'+n);
            if(!/ball46-footer\.css/i.test(html))throw Error('FOOTER_CSS_LINK_MISSING:'+n);
            rows.push({page:n,footer:true,productLinksCorrect:true,sharedFooterCss:true});
          }
          const cssBefore=fs.readFileSync('/tmp/before/footer.css','utf8'),cssAfter=fs.readFileSync('/tmp/after/footer.css','utf8');if(cssBefore!==cssAfter)throw Error('FOOTER_CSS_CHANGED');
          const b=JSON.parse(fs.readFileSync('/tmp/backend-before.json','utf8')),e=JSON.parse(fs.readFileSync('/tmp/after/engine.json','utf8')),f=JSON.parse(fs.readFileSync('/tmp/after/full.json','utf8')),s=JSON.parse(fs.readFileSync('/tmp/after/stats.json','utf8')),a={engine:e.version,fullMarket:f.version,settlementRevision:s.settlementRevision};if(JSON.stringify(a)!==JSON.stringify(b))throw Error('BACKEND_IDENTITY_CHANGED');
          const source=JSON.parse(fs.readFileSync('/tmp/source.json','utf8'));
          const report={completedAt:new Date().toISOString(),deploymentBefore:fs.readFileSync('/tmp/rb-deployment','utf8').trim(),rollbackVersion:fs.readFileSync('/tmp/rb-version','utf8').trim(),deployedVersion:fs.readFileSync('/tmp/our-version','utf8').trim(),scope:'Footer-only on current index + 11 information/legal pages; legacy signal.html/statistics.html untouched',links:{live:'/index.html',signals:'/index.html?view=signal',statistics:'/index.html?view=statistics'},footerIdenticalAcrossCurrentPages:true,footerCssUnchanged:true,backendUnchanged:true,deployedSourceIdentityVerified:true,edgeRevisionVerifiedAllCurrentPages:true,legacySignalStatisticsUntouched:true,source,backend:a,pages:rows,footerSha256:crypto.createHash('sha256').update(baseline).digest('hex')};
          fs.writeFileSync('audit/ball46-footer-deploy-v5-20261001.json',JSON.stringify(report,null,2)+'\n');console.log('LIVE_VERIFY_PASS',report);
          NODE

          # Verify the two current SPA destinations on fresh URLs.
          curl -fsS -L -H 'Cache-Control: no-cache' --max-time 25 "$BALL46_URL/index.html?view=signal&routeprobe=${GITHUB_RUN_ID}-$(date +%s%N)" -o /tmp/route-signal.html
          curl -fsS -L -H 'Cache-Control: no-cache' --max-time 25 "$BALL46_URL/index.html?view=statistics&routeprobe=${GITHUB_RUN_ID}-$(date +%s%N)" -o /tmp/route-stats.html
          grep -Fq 'data-workspace-view="signal"' /tmp/route-signal.html
          grep -Fq 'data-workspace-panel="statistics"' /tmp/route-stats.html

          OUR=$(cat /tmp/our-version)
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/final.json
          FINAL=$(node -e "const j=require('/tmp/final.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))")
          [ "$FINAL" = "$OUR" ] || { echo "PRODUCTION_MOVED_AFTER_VERIFY current=$FINAL ours=$OUR";false; }
          echo "FINAL_PRODUCTION_VERSION:$FINAL"
          trap - ERR

      - name: Save verified deployment report
        shell: bash
        run: |
          set -euo pipefail
          test -f audit/ball46-footer-deploy-v5-20261001.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/ball46-footer-deploy-v5-20261001.json
          git commit -m 'verify(ball46): Footer V5 production patch passed'
          git push origin HEAD:ops/ball46-footer-links-20261001
