name: BALL46 mobile Event Flow current-source read-only diagnosis
on:
  push:
    branches: [codex/ball46-member-promo-20261104]
    paths: ['work/mobile-event-flow-restore-20261110/audit-request.json']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node work/mobile-event-flow-restore-20261110/audit.mjs
      - name: Preserve sanitized read-only evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/mobile-event-flow-restore-20261110/audit work/mobile-event-flow-restore-20261110/source
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record current mobile Event Flow read-only source diagnosis [skip ci]"
          git push origin HEAD:codex/ball46-member-promo-20261104
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-event-flow-read-only
          path: work/mobile-event-flow-restore-20261110/audit
