name: BALL46 3.43 / John - monitor only (no deploy)
on:
  push:
    branches: [monitor/ball46-343-john-20261027]
    paths:
      - 'operations/ball46-343-monitor/**'
      - '.github/workflows/ball46-343-monitor-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ball46-343-readonly-monitor
  cancel-in-progress: true
jobs:
  observe:
    name: Observe active production without changes
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check operations/ball46-343-monitor/monitor.mjs
      - name: Inspect default-branch push trigger risks
        run: node operations/ball46-343-monitor/trigger-audit.mjs
      - name: Read-only 3.43 health and analytics
        run: node operations/ball46-343-monitor/monitor.mjs
      - name: Full Market and Member exception triage (sanitized)
        run: |
          node --check operations/ball46-343-monitor/error-triage.mjs
          node operations/ball46-343-monitor/error-triage.mjs
      - name: Focused error and exception telemetry (read-only)
        run: |
          node --check operations/ball46-343-monitor/error-focus.mjs
          node operations/ball46-343-monitor/error-focus.mjs
      - name: Save sanitized observation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-343-health-observation
          path: reports/ball46-343-observation.json
          if-no-files-found: warn
          retention-days: 14
