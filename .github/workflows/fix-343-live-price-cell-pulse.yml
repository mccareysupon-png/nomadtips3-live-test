name: Fix 3.43 Live Price Cell Pulse

on:
  push:
    branches: [work/nomad343-server-prewarm-20260914]
    paths:
      - '.github/workflows/fix-343-live-price-cell-pulse.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CANARY_URL: https://nomadtips3-343-stable-preview.mccarey-supon.workers.dev
  PROD_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/nomad343-server-prewarm-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch only Full Market price UI
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def remove_balanced(text, token):
              start=text.find(token)
              if start < 0: return text
              brace=text.find('{', start)
              if brace < 0: return text
              depth=0
              for i in range(brace, len(text)):
                  if text[i]=='{': depth+=1
                  elif text[i]=='}':
                      depth-=1
                      if depth==0:
                          return text[:start]+text[i+1:]
              raise SystemExit(f'unbalanced block: {token}')

          bulk=Path('nomad-live-343/full-odds-bulk-343.js')
          s=bulk.read_text()

          # LIVE row class: exact stage rows only.
          s=s.replace('fom-price-row cols-ah','${rowClass} cols-ah')
          s=s.replace('fom-price-row cols-1x2','${rowClass} cols-1x2')
          s=s.replace('fom-price-row cols-total','${rowClass} cols-total')

          # Remove wrong whole-board sweep completely.
          s=remove_balanced(s,'.fom-board.fom-refresh-sweep::after')
          s=remove_balanced(s,'@keyframes fomRefreshSweep')

          # Keep LIVE numbers green. Refresh = soft flow inside price cell; changed = stronger flash.
          base='.fom-price-row.live .fom-price{color:#69df8d;font-weight:900;text-shadow:0 0 8px rgba(105,223,141,.36);border-radius:4px}'
          s=re.sub(r'\.fom-price-row\.live \.fom-price\{[^}]*\}',base,s,count=1)
          if base not in s:
              marker='.fom-price{text-align:center;font-size:9px;font-variant-numeric:tabular-nums}'
              if marker not in s: raise SystemExit('price style marker missing')
              s=s.replace(marker,marker+base,1)

          fx=(
            '.fom-price-row.live .fom-price.fom-price-refresh{background:linear-gradient(90deg,rgba(40,255,110,0),rgba(40,255,110,.18),rgba(40,255,110,0));background-size:220% 100%;animation:fomPriceRefresh .58s ease-out 1}'
            '.fom-price-row.live .fom-price.fom-price-change{background:rgba(55,255,120,.22);box-shadow:0 0 12px rgba(55,255,120,.38);animation:fomPriceChange .78s ease-out 1}'
            '@keyframes fomPriceRefresh{0%{background-position:120% 0;text-shadow:0 0 4px rgba(105,223,141,.25)}45%{background-position:50% 0;text-shadow:0 0 13px rgba(105,223,141,.8)}100%{background-position:-120% 0;text-shadow:0 0 8px rgba(105,223,141,.36)}}'
            '@keyframes fomPriceChange{0%{transform:scale(1);filter:brightness(1)}25%{transform:scale(1.035);filter:brightness(1.65)}55%{transform:scale(1);filter:brightness(1.25)}100%{filter:brightness(1)}}'
          )
          if 'fom-price-refresh' not in s:
              s=s.replace(base,base+fx,1)

          assert '${rowClass} cols-ah' in s
          assert '${rowClass} cols-1x2' in s
          assert '${rowClass} cols-total' in s
          assert 'fom-refresh-sweep' not in s
          assert 'fomRefreshSweep' not in s
          assert 'fom-price-refresh' in s and 'fom-price-change' in s
          bulk.write_text(s)

          cache=Path('nomad-live-343/full-odds-10book-343.js')
          s=cache.read_text()
          s=remove_balanced(s,'function sweepExpanded()')
          s=s.replace('\n\nasync function load()','\nasync function load()')

          helpers="""function livePriceSnapshot(){const out=new Map();document.querySelectorAll('.match-card[data-match-id][aria-expanded=\"true\"]').forEach(card=>out.set(fixtureId(card),[...card.querySelectorAll('.fom-price-row.live .fom-price')].map(el=>el.textContent.trim())));return out}\nfunction pulseLivePrices(before){document.querySelectorAll('.match-card[data-match-id][aria-expanded=\"true\"]').forEach(card=>{const old=before.get(fixtureId(card))||[],cells=[...card.querySelectorAll('.fom-price-row.live .fom-price')];cells.forEach((cell,i)=>{cell.classList.remove('fom-price-refresh','fom-price-change');void cell.offsetWidth;cell.classList.add(old[i]!==undefined&&old[i]!==cell.textContent.trim()?'fom-price-change':'fom-price-refresh')})})}\n"""
          if 'function livePriceSnapshot()' not in s:
              marker='async function load(){'
              if marker not in s: raise SystemExit('load marker missing')
              s=s.replace(marker,helpers+marker,1)

          marker='if(!r.ok||j?.ok!==true||!Array.isArray(j.fixtures))return;'
          if 'const before=livePriceSnapshot();' not in s:
              if marker not in s: raise SystemExit('response marker missing')
              s=s.replace(marker,marker+'const before=livePriceSnapshot();',1)

          s=s.replace('repaintExpanded();sweepExpanded()','repaintExpanded();pulseLivePrices(before)')
          if 'repaintExpanded();pulseLivePrices(before)' not in s:
              s=s.replace('lastLoadedAt=Date.now();repaintExpanded()','lastLoadedAt=Date.now();repaintExpanded();pulseLivePrices(before)',1)

          assert 'sweepExpanded' not in s
          assert 'livePriceSnapshot' in s
          assert 'pulseLivePrices(before)' in s
          cache.write_text(s)

          index=Path('nomad-live-343/index.html')
          h=index.read_text().replace('343-live-green-sweep-v1','343-live-price-cell-pulse-v2')
          index.write_text(h)
          PY

          node --check nomad-live-343/full-odds-bulk-343.js
          node --check nomad-live-343/full-odds-10book-343.js

      - name: Persist exact UI fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nomad-live-343/full-odds-bulk-343.js nomad-live-343/full-odds-10book-343.js nomad-live-343/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix(343): pulse only live price cells'
            git push origin HEAD:work/nomad343-server-prewarm-20260914
          fi

      - name: Guard scope
        run: |
          set -euo pipefail
          git diff --quiet HEAD^ HEAD -- workers/nomadtips3-engine-343 || { echo ENGINE_CHANGED; exit 1; }
          git diff --quiet HEAD^ HEAD -- workers/nomadtips3-343-full-market || { echo FULL_MARKET_WORKER_CHANGED; exit 1; }
          git diff --quiet HEAD^ HEAD -- workers/nomadtips3-343-full-market-central || { echo CENTRAL_CHANGED; exit 1; }
          git diff --quiet HEAD^ HEAD -- workers/nomadtips3-5usd-hub-343 || { echo HUB_CHANGED; exit 1; }
          git diff --quiet HEAD^ HEAD -- nomad-live-341 || { echo 341_CHANGED; exit 1; }

      - name: Dry run viewers
        run: |
          set -euo pipefail
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.stable.jsonc)
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc)

      - name: Deploy canary viewer
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.stable.jsonc

      - name: Canary request safety
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          TARGET_URL="$CANARY_URL" node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1366,height:768}});
            let detailCalls=0;
            page.on('request',r=>{if(r.url().includes('/api/full-market/fixture-odds'))detailCalls++});
            await page.goto(process.env.TARGET_URL+'/?fx='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForSelector('.match-card[data-match-id]',{timeout:45000});
            const cards=page.locator('.match-card[data-match-id]');
            const n=Math.min(await cards.count(),8);
            let liveCells=0;
            for(let i=0;i<n&&!liveCells;i++){
              const card=cards.nth(i);
              await card.locator('.match-row.scoreboard-default').click();
              await page.waitForTimeout(250);
              liveCells=await card.locator('.fom-price-row.live .fom-price').count();
              if(!liveCells)await card.locator('.match-row.scoreboard-default').click();
            }
            await page.evaluate(()=>window.NOMAD343_FULL_ODDS_10BOOK?.refresh?.());
            await page.waitForTimeout(800);
            const boardSweep=await page.locator('.fom-refresh-sweep').count();
            if(boardSweep!==0)throw Error('BOARD_SWEEP_PRESENT');
            if(detailCalls!==0)throw Error('VIEWER_DETAIL_CALLS='+detailCalls);
            console.log('CANARY PRICE CELL PULSE OK',{detailCalls,liveCells,boardSweep});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Deploy production viewer
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Verify production assets
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            stamp="$RANDOM$(date +%s)"
            curl -fsS "$PROD_URL/full-odds-bulk-343.js?x=$stamp" -o /tmp/bulk.js || true
            curl -fsS "$PROD_URL/full-odds-10book-343.js?x=$stamp" -o /tmp/cache.js || true
            if grep -Fq 'fom-price-refresh' /tmp/bulk.js && grep -Fq 'fom-price-change' /tmp/bulk.js && grep -Fq 'pulseLivePrices' /tmp/cache.js && ! grep -Fq 'fom-refresh-sweep' /tmp/bulk.js; then
              echo 'PRODUCTION LIVE PRICE CELL PULSE OK'
              exit 0
            fi
            sleep 3
          done
          exit 1
