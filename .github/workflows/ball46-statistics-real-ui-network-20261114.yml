name: BALL46 original Statistics UI real network staging — no Production deploy
on:
  push:
    branches: [test/ball46-statistics-real-ui-network-20261114]
    paths:
      - '.github/workflows/ball46-statistics-real-ui-network-20261114.yml'
      - 'work/statistics-read-model-v2-20261114/native-stage-ui.mjs'
      - 'work/statistics-read-model-v2-20261114/hosted-stage-*.mjs'
      - 'work/statistics-read-model-v2-20261114/persisted-read-store.mjs'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: b46-real-ui-network-staging
  cancel-in-progress: true
jobs:
  private-real-network-stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source syntax and no Production endpoint in writer
        run: |
          node --check work/statistics-read-model-v2-20261114/native-stage-ui.mjs
          node --check work/statistics-read-model-v2-20261114/persisted-read-store.mjs
          node --check work/statistics-read-model-v2-20261114/hosted-stage-worker.mjs
          node --check work/statistics-read-model-v2-20261114/hosted-stage-deploy.mjs
          node --check work/statistics-read-model-v2-20261114/hosted-stage-benchmark.mjs
          node --check work/statistics-read-model-v2-20261114/hosted-stage-disable.mjs
      - name: Retrieve verified recorded Ledger artifact only (no live Ledger requests)
        uses: actions/download-artifact@v4
        with:
          name: ball46-statistics-shadow-proof
          run-id: 43373832113
          github-token: ${{ github.token }}
          path: work/statistics-summary-shadow-20261113/reference/ui-proof
      - name: Read and pin current original website assets and formula source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node work/statistics-summary-shadow-20261113/fresh-source.mjs
          node work/statistics-summary-shadow-20261113/capture-ui.mjs
          mkdir -p work/statistics-summary-shadow-20261113/reference/ui-proof/qa/ui-capture
          cp -r work/statistics-summary-shadow-20261113/qa/ui-capture/. work/statistics-summary-shadow-20261113/reference/ui-proof/qa/ui-capture/
          node work/statistics-summary-shadow-20261113/build-summary-formulas.mjs
          node work/statistics-read-model-v2-20261114/native-stage-ui.mjs
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {Script} from 'node:vm'; new Script(readFileSync('work/statistics-read-model-v2-20261114/qa/real-workspace.txt','utf8')); console.log('ORIGINAL_STATISTICS_UI_SCRIPT_PARSE_OK')"
      - name: Install independent runner browser and server bundler
        run: |
          npm install --prefix work/statistics-summary-shadow-20261113/.runtime --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1 esbuild
          work/statistics-summary-shadow-20261113/.runtime/node_modules/.bin/playwright install --with-deps chromium
      - name: Create unique private Cloudflare staging Worker; upload 14998-row derived dataset only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node --max-old-space-size=4096 work/statistics-read-model-v2-20261114/hosted-stage-deploy.mjs
      - name: Measure actual Statistics native UI across public network on PC and simulated mobile 4G
        run: node work/statistics-read-model-v2-20261114/hosted-stage-benchmark.mjs
      - name: Disable staging subdomain even after a failed test
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node work/statistics-read-model-v2-20261114/hosted-stage-disable.mjs
      - name: Upload network timings and snapshots only (no private tokens)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b46-native-statistics-hosted-network-proof
          path: |
            work/statistics-read-model-v2-20261114/qa/hosted-stage.json
            work/statistics-read-model-v2-20261114/qa/hosted-real-ui-network.json
            work/statistics-read-model-v2-20261114/qa/stage-disabled.json
            work/statistics-read-model-v2-20261114/qa/hosted-real-ui-*.png
