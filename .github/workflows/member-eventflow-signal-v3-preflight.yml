name: BALL46 MEMBER Event Flow Signal V3 — Read Only Preflight
on:
  push:
    branches: [codex/ball46-member-eventflow-signal-v3-20261020]
    paths:
      - 'ball46-member/member-signal-v3-20261020/**'
      - '.github/workflows/member-eventflow-signal-v3-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and scoped patch contract
        working-directory: ball46-member/member-signal-v3-20261020
        run: |
          set -euo pipefail
          node --check theme.mjs
          node --check deploy.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {patch,MARKER,GRADIENT_ID} from './theme.mjs';
          const source={
            html:'<html>kpiV7=desktop-nine-in-one-row-20261020 b46-member-loading <link href="/styles.css?v=latest"><script src="/member.js?v=latest"></script></html>',
            js:"const defs=svgNode('defs'); const gh=1,ga=2; defs.append(gh,ga); svg.append(defs); class:'member-flow-signal-plate' class:'member-flow-signal-connector' ball46:member-data-ready ball46:member-data-error",
            css:'BALL46 MEMBER — Desktop KPI V7: nine live-data summary cards'
          };
          const p=patch(source);
          assert(p.html.includes('b46MemberSignalV3=20261020'));
          assert(p.js.includes(GRADIENT_ID));
          assert(p.css.includes(MARKER));
          assert(p.js.replace(/const __b46MemberSignalV3=[\s\S]*?defs\.append\(gh,ga,__b46MemberSignalV3\); svg\.append\(defs\);/,'defs.append(gh,ga); svg.append(defs);')===source.js);
          console.log('MEMBER_V3_VISUAL_ONLY_PATCH_CONTRACT_PASS');
          JS
      - name: Read only current Member worker and asset versions
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN;
          assert(A&&T,'CLOUDFLARE_CREDENTIALS_MISSING');
          const root='https://api.cloudflare.com/client/v4/accounts/'+A;
          const d=await fetch(root+'/workers/scripts/ball46-member-production/deployments?per_page=1',{headers:{Authorization:'Bearer '+T}}).then(r=>r.json());
          assert(d.success,'CLOUDFLARE_READ_FAILURE');
          const dep=d.result.deployments[0];assert(dep.versions.length===1&&Number(dep.versions[0].percentage)===100,'MULTI_VERSION_ACTIVE');
          const ver=dep.versions[0].version_id;
          assert.equal(ver,'65d4ef55-3656-409d-89de-615388817d0c','MEMBER_ACTIVE_VERSION_MOVED_ABORT');
          const h=x=>createHash('sha256').update(x).digest('hex');
          for(const [p,sha] of [['/styles.css','bcff14935bd652d70209fb7996fd7034ad3009d109eae8e1f89a0e9002520f40'],['/member.js','58a580302fe247fce4c98d2fe06f185dddacb5fadd632d724e5633da026f562a']]){
           const u=new URL(p,'https://member.ball46.com');u.searchParams.set('preflight',Date.now());
           const r=await fetch(u,{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(20000)});
           assert.equal(r.status,200,'PUBLIC_ASSET_NOT_200 '+p);
           const hash=h(Buffer.from(await r.arrayBuffer()));
           assert.equal(hash,sha,'LIVE_MEMBER_FILE_HASH_DRIFT '+p);
          }
          console.log('MEMBER_SIGNAL_V3_PREFLIGHT_READONLY_PASS',JSON.stringify({worker:'ball46-member-production',activeVersion:ver,sourceAssetsHashGuarded:true}));
          JS
