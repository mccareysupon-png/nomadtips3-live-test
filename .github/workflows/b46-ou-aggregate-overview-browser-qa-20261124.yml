name: BALL46 TEST browser verify OU combined WIN LOSS cumulative ROI chart 20261124
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-ou-aggregate-overview-browser-qa-20261124.yml]
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Chromium test-only
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Verify native OU cards, cumulative plot, all metrics and separate formula table on PC and mobile
        run: node qa/prematch-history-20261120/b46-ou-aggregate-overview-browser-qa-20261124.mjs
