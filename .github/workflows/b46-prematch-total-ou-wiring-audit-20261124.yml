name: BALL46 PREMATCH TOTAL O/U wiring audit read only 20261124
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-prematch-total-ou-wiring-audit-20261124.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Inspect actual TEST Total ledger, stats wiring and frontend selectors, zero paid calls
        run: |
          node --input-type=module <<'JS'
          import crypto from 'node:crypto';
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const root='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers';
          async function cf(p){const r=await fetch(root+p,{headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(22000)});
           const j=await r.json();if(!r.ok||!j.success)throw Error('CF_FAIL_'+p);return j.result}
          const backend='ball46-prematch-only-test-20261120';
          const front='ball46-premium-match-colors-test-20261120';
          async function source(name){
           const id=(await cf('/scripts/'+name+'/deployments?per_page=1')).deployments[0].versions[0].version_id;
           const obj=await cf('/workers/'+name+'/versions/'+id+'?include=modules');
           const code=Buffer.from(obj.modules.find(m=>m.name===obj.main_module).content_base64,'base64').toString();
           return {id,code,modules:obj.modules.map(m=>m.name)};
          }
          const [back,ui]=await Promise.all([source(backend),source(front)]);
          const snippets=(code,terms,limit=3,before=4,after=9)=>{
           const lines=code.split('\n');
           return Object.fromEntries(terms.map(term=>[term,lines.map((x,i)=>({x,i})).filter(z=>z.x.includes(term))
            .slice(0,limit).map(({i})=>lines.slice(Math.max(i-before,0),i+after)
             .map((t,j)=>String(Math.max(i-before,0)+j+1)+': '+t.slice(0,950)).join('\n'))]));
          };
          console.log('B46_PRE_TOTAL_BACK '+JSON.stringify({version:back.id,modules:back.modules,
           snippets:snippets(back.code,[
            'const registry=readPreMarketStatsRegistry','allRaw=combinedPrematchLedgers',
            'allLedger:allLedgerNow','marketDailyBooks:dailyMarkets',
            'bttsDailySeries:registry.dailySeries','const pricedV2Ui=',
            "prematch-stats-registry-test",
            'const dailyMarkets=','statsRegistry:{','statsRegistry='],4)
          }).slice(0,29000));
          let client=null;
          const m=ui.code.match(/var prematchClientScript = ("(?:\\.|[^"\\])*");/);
          if(m)client=JSON.parse(m[1]);
          console.log('B46_PRE_TOTAL_FRONT '+JSON.stringify({version:ui.id,hasClient:!!client,
           snippets:snippets(client??ui.code,[
            "mode==='all'","mode==='ou'","allLedger",
            "marketDailyBooks","allDailySeries","bttsDailySeries","statsRegistry",
            "function prematchMarketLabel","if(modeNext==='ou-predictions')return;",
            "const allRows","market==='O/U'"],4,4,7)
          }).slice(0,36000));
          const host='https://'+backend+'.mccarey-supon.workers.dev';
          const hdr={authorization:'Bearer '+crypto.createHmac('sha256',token).update('BALL46_PREMATCH_ONLY_V1').digest('hex')};
          async function g(url,headers={}){const r=await fetch(url,{headers,cache:'no-store',signal:AbortSignal.timeout(22000)});
           return {code:r.status,data:await r.json().catch(()=>null)}}
          const [direct,reg,settle,visible]=await Promise.all([
           g(host+'/preview-data',hdr),g(host+'/prematch-stats-registry-test?days=90',hdr),
           g(host+'/ou-v2-settlement-state',hdr),
           g('https://'+front+'.mccarey-supon.workers.dev/__b46_prematch_data')
          ]);
          const d=direct.data??{},s=reg.data??{},o=settle.data??{},v=visible.data??{};
          console.log('B46_PRE_TOTAL_DATA '+JSON.stringify({
           http:{direct:direct.code,reg:reg.code,settle:settle.code,frontend:visible.code},
           keys:Object.keys(d),allCount:d.allLedger?.rows?.length,
           allSample:(d.allLedger?.rows??[]).slice(-3).map(x=>({id:x.fixture_id,market:x.market,pick:x.pick,status:x.status,units:x.units})),
           totals:{all:d.allLedger?.stats,registry:d.statsRegistry},
           marketStats:s.markets,days:s.dailyBooks,
           seriesKeys:Object.keys(s.dailySeries??{}),
           latestAllSeries:s.dailySeries?.TOTAL?.slice(-3),
           ou:o.stats,ouLatestSeries:o.dailySeries?.slice(-3),
           frontendAll:v.allLedger?.stats,frontendOu:v.ouLedger?.stats,
           marketDailyBooks:d.marketDailyBooks
          }).slice(0,21000));
          console.log('B46_PRE_TOTAL_READONLY_NO_5USD_NO_WRITES');
          JS
