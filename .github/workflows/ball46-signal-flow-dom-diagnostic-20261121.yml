name: BALL46 read-only Signal/Event Flow DOM map
on:
  push:
    branches: [test/ball46-premium-match-colors-20261120]
    paths: ['.github/workflows/ball46-signal-flow-dom-diagnostic-20261121.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Inspect actual test Signal and Event Flow structure without changing data
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch(),BASE='https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev';
          try{
            const p=await browser.newPage({viewport:{width:1440,height:960},serviceWorkers:'block'});
            await p.addInitScript(()=>localStorage.setItem('nomad343_dashboard_theme_v1','dark'));
            const logs=[];p.on('pageerror',e=>logs.push(e.message.slice(0,200)));
            for(const view of ['signal','live']){
              await p.goto(BASE+'/?view='+view,{waitUntil:'domcontentloaded',timeout:70000});
              await p.waitForTimeout(3800);
              const state=await p.evaluate(()=>{
                const isVisible=e=>e.getBoundingClientRect().width>50&&e.getBoundingClientRect().height>10&&getComputedStyle(e).visibility!=='hidden';
                const candidates=[...document.querySelectorAll('button,a,[role="tab"],[data-workspace-view]')].filter(isVisible).map(e=>({tag:e.tagName,text:(e.textContent||'').trim().slice(0,90),cls:e.className?.toString().slice(0,150),id:e.id,href:e.getAttribute('href'),workspace:e.getAttribute('data-workspace-view'),aria:e.getAttribute('aria-label')})).filter(e=>/signal|prediction|live|matches|event|flow/i.test(JSON.stringify(e))).slice(0,35);
                const rows=[...document.querySelectorAll('[data-match-id]')].filter(isVisible).slice(0,7).map(e=>({matchId:e.getAttribute('data-match-id'),cls:String(e.className),text:(e.innerText||'').slice(0,190),parent:e.parentElement?.outerHTML.slice(0,650),outer:e.outerHTML.slice(0,900)}));
                const selectors=['[data-workspace-view]','[data-match-id]','.match-row','.match-list','.signal-list','.signal-card','.event-flow','.event-flow-panel','.event-flow-container','.ef-panel','#event-flow','[id*=event]','[class*=event]','[id*=signal]','[class*=signal]'];
                const counts=Object.fromEntries(selectors.map(s=>[s,document.querySelectorAll(s).length]));
                const eventish=[...document.querySelectorAll('[class*=flow],[id*=flow],[class*=event],[id*=event]')].filter(isVisible).slice(0,12).map(e=>({tag:e.tagName,id:e.id,cls:String(e.className).slice(0,120),text:(e.innerText||'').slice(0,100),parent:String(e.parentElement?.className).slice(0,100)}));
                return {title:document.title,url:location.href,bodyClass:document.body.className,viewAttrs:[...document.body.attributes].filter(a=>/view|page|workspace/.test(a.name)).map(a=>[a.name,a.value]),nav:candidates,counts,rows,eventish,scroll:{y:scrollY,h:document.documentElement.scrollHeight}};
              });
              console.log('B46_SIGNAL_FLOW_DOM_VIEW_'+view+' '+JSON.stringify(state));
            }
            const targets=await p.evaluate(()=>[...document.querySelectorAll('[data-match-id].match-row')].filter(e=>e.getBoundingClientRect().width>100).slice(0,10).map(e=>({id:e.dataset.matchId,cls:e.className,text:(e.innerText||'').slice(0,150)})));
            console.log('B46_FLOW_DIAG_ERRORS '+JSON.stringify(logs));
          }finally{await browser.close()}
          NODE