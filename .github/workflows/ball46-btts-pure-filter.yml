name: BALL46 pure BTTS and 1X2 filter test
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-btts-pure-filter.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test qa/prematch-history-20261120/evaluate-btts-signal.test.mjs qa/prematch-history-20261120/evaluate-1x2-signal.test.mjs
      - run: node qa/prematch-history-20261120/compare-pure-signals.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prematch-pure-real-comparison
          path: evidence/

# Re-run after absolute goal difference guard correction.
