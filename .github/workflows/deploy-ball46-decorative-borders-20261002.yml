name: DEPLOY Ball46 decorative border cleanup 20261002

on:
  push:
    branches: [work/ball46-scorebar-bg-currentprod-20261002]
    paths:
      - '.github/workflows/deploy-ball46-decorative-borders-20261002.yml'
      - 'deploy-assets/decorative-borders-20261002/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-production-decorative-borders
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  BALL46_URL: https://ball46.com
  DEPLOY_ENABLED: 'true'
  EXPECTED_BASE_VERSION: 'bb69215a-e0c5-45b6-ba0e-cbfdb0d5be0d'

jobs:
  guarded-css:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned audit dependencies
        working-directory: deploy-assets/decorative-borders-20261002
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test CSS-only patch and workflow syntax
        working-directory: deploy-assets/decorative-borders-20261002
        run: npm test
      - name: Install Chromium for responsive verification
        working-directory: deploy-assets/decorative-borders-20261002
        run: npx playwright install --with-deps chromium
      - name: Exact Active Production CSS-only patch, preview, and guarded publish
        working-directory: deploy-assets/decorative-borders-20261002
        run: node run.mjs
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-decorative-borders-${{ github.run_id }}
          path: deploy-assets/decorative-borders-20261002/audit/
          if-no-files-found: error
          retention-days: 14
