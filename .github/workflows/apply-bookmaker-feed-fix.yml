name: Apply Verified Bookmaker Feed Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-bookmaker-feed-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Patch and test verified 1xBet Goaloo XML feed
        run: |
          python .github/scripts/apply_bookmaker_feed_fix.py
          node --check car3-1-hybrid-live-engine/worker/src/upgrade.js
          cd car3-1-hybrid-live-engine
          node --test test/bookmaker-goalxml.test.js
      - name: Commit verified patch
        run: |
          git config user.name 'mccareysupon-png'
          git config user.email 'mccarey.supon@gmail.com'
          git add car3-1-hybrid-live-engine/worker/src/upgrade.js car3-1-hybrid-live-engine/test/bookmaker-goalxml.test.js
          git commit -m 'CAR 3.1: use verified Goaloo goal50 XML feed for 1xBet'
          git push origin HEAD:main
