name: BALL46 TEST shared FT detector end-to-end audit
on:
  push:
    branches: [feature/ball46-adaptive-manual-control-test-20261125]
    paths: ['.github/workflows/b46-ft-detector-audit-live-test-20261126.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: ball46-ft-phase1-phase2-guarded-oneoff-20261126
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Activate prepared TEST audit only after import finishes, verify, and roll back on failure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const {CLOUDFLARE_API_TOKEN:token,CLOUDFLARE_ACCOUNT_ID:account,GH_TOKEN}=process.env;
          const worker='ball46-prematch-only-test-20261120',old='777a95ab-719a-495d-9d84-7f88c4afae4b',next='40c146b5-3c92-474d-9a70-146574d855f9';
          const base='https://'+worker+'.mccarey-supon.workers.dev', auth='Bearer '+crypto.createHmac('sha256',token).update('BALL46_PREMATCH_ONLY_V1').digest('hex');
          const cf='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/';
          const other=['ball46-production','nomadtips3-5usd-hub-343','nomadtips3-engine-343','ball46-premium-match-colors-test-20261120'];
          const stats={status:'NOT_STARTED',providerCalls:0,productionWrites:0};
          let activated=false;
          async function api(url,{method='GET',headers={},body}={}){
           const r=await fetch(url,{method,headers,body:body===undefined?undefined:JSON.stringify(body),redirect:'error',signal:AbortSignal.timeout(25000)});
           if(!r.ok)throw Error(method+' '+new URL(url).pathname+' HTTP '+r.status);
           return r.json();
          }
          function cfGet(w,p){return api(cf+w+p,{headers:{authorization:'Bearer '+token}})}
          function get(p){return api(base+p,{headers:{authorization:auth}})}
          async function active(name){const a=(await cfGet(name,'/deployments')).result.deployments[0].versions;assert(a.length===1&&a[0].percentage===100,'EXPECTED_SINGLE_ACTIVE_WORKER');return a[0].version_id}
          async function protectedVersions(){return Object.fromEntries(await Promise.all(other.map(async n=>[n,await active(n)])))}
          async function activate(id,msg){const a=await api(cf+worker+'/deployments',{method:'POST',headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:{strategy:'percentage',versions:[{version_id:id,percentage:100}],annotations:{'workers/message':msg}}});assert(a.success===true,'CLOUDFLARE_TEST_DEPLOYMENT_FAILED');return a.result.id;}
          async function poll(){for(let n=0;n<14;n++){if(await active(worker)===next)break;await new Promise(r=>setTimeout(r,1000));}
           for(let n=0;n<6;n++)try{const z=await get('/ft-detectors-audit-test?fixtures=205122048');if(z.code==='B46_SHARED_FT_DETECTORS_AUDIT_V1')return z;}catch{await new Promise(r=>setTimeout(r,1700));}
           throw Error('OWNER_READONLY_AUDIT_NOT_REACHABLE');}
          try{
           assert.equal(process.env.GITHUB_RUN_ATTEMPT,'1','DONT_REPLAY_TEST_DEPLOY');
           const w=await api('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs/45725405632',{headers:{authorization:'Bearer '+GH_TOKEN,accept:'application/vnd.github+json'}});
           assert.equal(w.status,'completed','IMPORT_STILL_RUNNING_NO_DEPLOY');stats.importConclusion=w.conclusion;
           const [activeOld,baseVersion,candidate]=await Promise.all([active(worker),cfGet(worker,'/versions/'+old),cfGet(worker,'/versions/'+next)]);
           assert.equal(activeOld,old,'TEST_BASELINE_CHANGED_NO_DEPLOY');
           const a=baseVersion.result.resources,b=candidate.result.resources;
           assert.deepEqual(a.bindings,b.bindings,'SECRET_BINDINGS_CHANGED');assert.deepEqual(a.script_runtime,b.script_runtime,'WORKER_RUNTIME_CHANGED');
           assert.deepEqual(a.script.handlers,b.script.handlers);assert.deepEqual(a.script.named_handlers,b.script.named_handlers);
           const [p,cohort,archive]=await Promise.all([protectedVersions(),get('/ou-history-per-fixture-audit-test'),get('/ou-history-ft-state')]);
           stats.before={versions:p,archiveFt:archive.archive.ft,upcoming:cohort.counts.upcoming,ready:cohort.counts.ready3};
           assert(archive.archive.ft>=754,'KNOWN_TEST_FT_NOT_PRESENT');
           assert.equal(await active(worker),old);
           stats.deployment=await activate(next,'Verify shared FT data across 1X2 OU BTTS in owner-only TEST audit');activated=true;
           const z=await poll();assert.equal(await active(worker),next,'CANDIDATE_NOT_ACTIVE');
           const matched=z.rows.find(k=>k.fixtureId===205122048);
           assert(matched,'PILOT_READBACK_FIXTURE_NO_LONGER_UPCOMING');
           assert(matched.ft[0].filter(x=>[194533541,194432263,194040220].includes(x)).length>=1,'REAL_PROVIDER_FT_NOT_IN_INPUT');
           assert.deepEqual(matched.oneX2.after,matched.btts.after); assert.deepEqual(matched.oneX2.after,matched.overUnder.history);
           assert(matched.oneX2.after[0]>=3);
           const requested=[...new Set([205122048,...cohort.fixtures.filter(f=>f.ready3).slice(0,10).map(f=>f.fixtureId)])];
           const breadth=await get('/ft-detectors-audit-test?fixtures='+requested.join(','));
           assert(breadth.rows.length>0&&breadth.rows.every(r=>JSON.stringify(r.oneX2.after)===JSON.stringify(r.btts.after)&&JSON.stringify(r.oneX2.after)===JSON.stringify(r.overUnder.history)),'DETECTOR_INPUTS_DISAGREE');
           assert.equal(breadth.providerCalls,0);assert.equal(breadth.published,0);
           const denied=await fetch(base+'/ft-detectors-audit-test?fixtures=205122048',{signal:AbortSignal.timeout(10000)});
           assert.equal(denied.status,404,'AUTH_REQUIRED');
           const [after,closed]=await Promise.all([protectedVersions(),get('/btts-bulk-v2-state')]);
           assert.deepEqual(after,p,'PROTECTED_VERSIONS_CHANGED_CONCURRENTLY');
           assert.equal(closed.config.mode,'CLOSED','BTTS_MUST_REMAIN_CLOSED');
           stats.status='TEST_DETECTORS_READBACK_PASSED';stats.knownRealTeam=matched;stats.sample={fixtures:breadth.rows.length,oneX2Priced:breadth.rows.filter(r=>r.oneX2.pricePresent).length,oneX2ModelRead:breadth.rows.filter(r=>r.oneX2.historyCountsUsed!==null).length,ouWithPatterns:breadth.rows.filter(r=>r.overUnder.patterns>0).length,bttsPriced:breadth.rows.filter(r=>r.btts.pricePresent).length,bttsStates:breadth.rows.reduce((a,r)=>(a[r.btts.state]=(a[r.btts.state]??0)+1,a),{})};stats.versionsAfter=after;stats.bttsMode=closed.config.mode;
          }catch(e){
           stats.status='FAILED';stats.reason=String(e.message).split('\n')[0].slice(0,160);process.exitCode=1;
           if(activated)try{if(await active(worker)===next){await activate(old,'Rollback TEST FT audit after verification failure');stats.rollback=await active(worker);}}catch{stats.rollback='UNVERIFIED'}
          }
          fs.writeFileSync('detector-audit-result.json',JSON.stringify(stats,null,2));console.log('FT_DETECTOR_AUDIT '+JSON.stringify(stats));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detector-audit-result
          path: detector-audit-result.json
          retention-days: 30
