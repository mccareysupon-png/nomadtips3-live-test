name: Deploy Ball46 Statistics Green Live Minute 20261011

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ball46-statistics-live-minute-green-20261011.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-statistics-live-minute-green-20261011
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PATCH_SOURCE_BRANCH: work/ball46-statistics-live-minute-green-20261011
      DEPLOY_ENABLED: 'true'
    steps:
      - name: Checkout isolated green minute patch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PATCH_SOURCE_BRANCH }}
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install parser dependency only
        run: npm install --no-save --ignore-scripts acorn@8
      - name: Deploy green live minute in Statistics PENDING rows
        working-directory: deploy-assets/statistics-live-minute-green-20261011
        run: node run.mjs
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-statistics-green-minute-${{ github.run_id }}
          path: deploy-assets/statistics-live-minute-green-20261011/audit
          if-no-files-found: warn
          retention-days: 30
