      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ball46-card-step6-deploy-36372784763
          path: /tmp/b46-current
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36372784763
      - name: Verify exact current Production and horizontal-card candidate
        shell: bash
        run: bash .github/scripts/ball46_horizontal_card_predeploy_20260928.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-horizontal-card-predeploy-${{ github.run_id }}
          path: /tmp/b46-horizontal-predeploy
          if-no-files-found: ignore
          retention-days: 30
