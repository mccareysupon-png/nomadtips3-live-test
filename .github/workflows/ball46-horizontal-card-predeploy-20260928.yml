name: READ ONLY - Ball46 Horizontal Card Predeploy 20260928

on:
  push:
    branches:
      - work/ball46-horizontal-card-20260928
    paths:
      - '.github/workflows/ball46-horizontal-card-predeploy-20260928.yml'

permissions:
  contents: read
  actions: read

jobs:
