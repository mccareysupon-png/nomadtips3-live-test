name: READ ONLY - Ball46 Scorebar Height70 Inspect 20260928
on:
  push:
    branches:
      - work/ball46-scorebar-height70-20260928
    paths:
      - '.github/workflows/ball46-scorebar-height70-inspect-20260928.yml'
      - '.github/scripts/ball46_scorebar_height70_inspect_20260928.sh'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live scorebar height only
        run: bash .github/scripts/ball46_scorebar_height70_inspect_20260928.sh
      - name: Upload inspect proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-scorebar-height70-inspect-${{ github.run_id }}
          path: /tmp/b46-height70-inspect
          if-no-files-found: ignore
          retention-days: 7
