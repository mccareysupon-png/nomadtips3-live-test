name: TEMP CAR 3.1 Stale Detail V2

on:
  push:
    branches:
      - fix/car31-stale-detail-source-v2-20260816

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Patch stale detail only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('car3-1-hybrid-live-engine/web/app.js'); s=p.read_text()
          def r(old,new,name):
              global s
              if old not in s: raise SystemExit('missing '+name)
              s=s.replace(old,new,1)
          r('matches=[],selected=0;','matches=[],selectedId=null;','selection')
          r("${i===selected?'active':''}","${m.id===selectedId?'active':''}",'active id')
          r("document.querySelectorAll('.candidate').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.index);render();});","document.querySelectorAll('.candidate').forEach(b=>b.onclick=()=>{selectedId=matches[Number(b.dataset.index)]?.id||null;render();});",'click id')
          r("function render(){renderMetrics();renderCandidates();if(!matches.length)return;const m=matches[Math.min(selected,matches.length-1)],d=m.serverEngine||localDecision(m);","function clearDetail(){for(const [id,value] of Object.entries({homeTeam:'—',awayTeam:'—',matchMinute:'—',scoreText:'—',leagueText:'—',signalMinute:'—',liveClock:'—',finalDecision:'WATCH',finalReason:'—'})){const el=$('#'+id);if(el)el.textContent=value;}for(const id of ['sourceRow','statsGrid','pitchStats','evidenceGrid','oddsGrid','events','sourceTrace','gateList']){const el=$('#'+id);if(el)el.innerHTML='';}const p=$('#pressureChart'),d=$('#dangerChart');if(p)p.innerHTML='';if(d)d.innerHTML='';const tag=$('#possessionTag');if(tag)tag.textContent='WAITING FOR LIVE MATCH';const clock=$('#signalClockRow');if(clock)clock.hidden=true;}\nfunction render(){renderMetrics();renderCandidates();if(!matches.length){clearDetail();return;}const m=matches.find(x=>x.id===selectedId)||matches[0];selectedId=m.id;const d=m.serverEngine||localDecision(m);",'clear detail')
          r("fetch(`${runtime.workerUrl}/live?t=${Date.now()}`,{cache:'no-store'}).then(r=>r.json())","fetch(`${runtime.workerUrl}/live?t=${Date.now()}`,{cache:'no-store'}).then(r=>r.json()).catch(()=>({ok:false,generatedAt:null,matches:[]}))",'live fetch fallback')
          old="snapshots=snaps.snapshots||[];const activeRows=(live.matches||[]).filter(row=>{const status=String(row?.status||'').toUpperCase();return status!=='FT'&&!status.includes('FINISH');});window.__CAR31_LIVE_ROWS__=activeRows;matches=activeRows.map(adapt);if(selected>=matches.length)selected=Math.max(0,matches.length-1);$('#lastUpdate').textContent=live.generatedAt?new Date(live.generatedAt).toLocaleTimeString():'live collector';render();window.dispatchEvent(new CustomEvent('car31:live-updated'));"
          new="snapshots=snaps.snapshots||[];const generated=Date.parse(live.generatedAt||'');const sourceFresh=Boolean(live?.ok)&&Number.isFinite(generated)&&Date.now()-generated<=90000;const activeRows=sourceFresh?(live.matches||[]).filter(row=>{const status=String(row?.status||'').toUpperCase();return status!=='FT'&&!status.includes('FINISH')&&status!=='SCHEDULED'&&status!=='NS';}):[];window.__CAR31_LIVE_ROWS__=activeRows;matches=activeRows.map(adapt);if(!matches.some(m=>m.id===selectedId))selectedId=matches[0]?.id||null;$('#lastUpdate').textContent=live.generatedAt?new Date(live.generatedAt).toLocaleTimeString():'live collector';render();window.dispatchEvent(new CustomEvent('car31:live-updated'));"
          r(old,new,'active rows')
          p.write_text(s)
          for fn,prefix in [('car3-1-hybrid-live-engine/web/index.html','./'),('car3-1-hybrid-live-engine/monitor/index.html','../web/')]:
              q=Path(fn); h=q.read_text(); h,n=re.subn(r'src="'+re.escape(prefix)+r'app\.js(?:\?v=[^"]+)?"',f'src="{prefix}app.js?v=20260816-stale-detail-v2"',h,count=1)
              if n!=1: raise SystemExit('cache target '+fn)
              q.write_text(h)
          PY
      - name: Verify syntax and scope
        run: |
          node --check car3-1-hybrid-live-engine/web/app.js
          git diff --exit-code origin/main -- car3-1-hybrid-live-engine/web/signal-polish.js
          grep -q 'selectedId' car3-1-hybrid-live-engine/web/app.js
          grep -q 'clearDetail' car3-1-hybrid-live-engine/web/app.js
          grep -q 'sourceFresh' car3-1-hybrid-live-engine/web/app.js
          grep -q 'window.__CAR31_LIVE_ROWS__=activeRows' car3-1-hybrid-live-engine/web/app.js
      - name: Verify real live source
        run: |
          curl -fsS --retry 3 --retry-delay 2 "https://nomadtips3-car31-goaloo.mccarey-supon.workers.dev/live?t=$(date +%s)" -o /tmp/live.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/live.json'))
          rows=d.get('matches') or []
          ended=[r.get('sourceMatchId') for r in rows if str(r.get('status') or '').upper()=='FT' or 'FINISH' in str(r.get('status') or '').upper()]
          verified=sum(1 for r in rows if (r.get('goalooClock') or {}).get('verified') is True)
          print('ok=',d.get('ok'),'matches=',len(rows),'ended=',ended,'verified=',verified)
          if ended: raise SystemExit(1)
          PY
      - name: Commit patch
        run: |
          git config user.name 'NOMADTIPS3 verification'
          git config user.email 'actions@users.noreply.github.com'
          git add car3-1-hybrid-live-engine/web/app.js car3-1-hybrid-live-engine/web/index.html car3-1-hybrid-live-engine/monitor/index.html
          git commit -m 'CAR 3.1 clear stale finished match detail v2'
          git push origin HEAD:fix/car31-stale-detail-source-v2-20260816
