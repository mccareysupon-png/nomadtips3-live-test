name: Ball46 Page Head Stability V1 Current Deploy 20260920

on:
  push:
    branches: [work/ball46-page-head-stability-v1-current-20260920]
    paths:
      - '.github/workflows/ball46-page-head-stability-v1-current-deploy-20260920.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_URL: https://ball46.com
  SOURCE_BRANCH: work/ball46-page-head-stability-v1-current-20260920
  TARGET_BASE_VERSION: 9019cd81-673d-488d-b36d-7ae15d4cc6cc
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-page-head-stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout current production-derived branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Guard current production and protected worker files
        shell: bash
        run: |
          set -euo pipefail
          test -s workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          git diff --quiet d0f5787c401d158d10c58b279117ede9d94d2bca..HEAD -- workers/nomadtips3-343-preview/src/index.js
          git diff --quiet d0f5787c401d158d10c58b279117ede9d94d2bca..HEAD -- workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deployments list --config wrangler.ball46.jsonc --json > /tmp/deployments-before.json
          cd ../..
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/deployments-before.json','utf8'));
          const latest=d[d.length-1];
          const target=process.env.TARGET_BASE_VERSION;
          if(!latest||!Array.isArray(latest.versions)||!latest.versions.some(v=>v.version_id===target&&Number(v.percentage)===100)){
            console.error('ACTIVE_PRODUCTION_CHANGED',JSON.stringify(latest));
            process.exit(1);
          }
          console.log('BASE_VERSION_LOCKED',target);
          NODE

      - name: Mirror live production before touching Page 1 2 3 loaders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod /tmp/hdr
          : > /tmp/protected-manifest.tsv

          while IFS= read -r f; do
            name="${f#nomad-live-343/}"
            [ "$name" = "page-head-stability-v1.css" ] && continue
            case "$name" in *.html|*.js|*.css|*.svg|*.json|*.txt|*.xml|*.png|*.webp|*.jpg|*.jpeg|*.ico) ;; *) continue ;; esac
            safe="${name//\//_}"
            code=$(curl -sS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 25 -D "/tmp/hdr/$safe" -o "/tmp/prod/$safe" -w '%{http_code}' "$BALL46_URL/$name?headbase=${GITHUB_RUN_ID}") || true
            [ "$code" = 200 ] || continue
            ctype=$(tr -d '\r' < "/tmp/hdr/$safe" | awk 'BEGIN{IGNORECASE=1}/^content-type:/{print tolower($0)}' | tail -1)
            case "$name" in
              *.js) [[ "$ctype" == *javascript* || "$ctype" == *text/plain* ]] || continue ;;
              *.css) [[ "$ctype" == *text/css* || "$ctype" == *text/plain* ]] || continue ;;
              *.html) [[ "$ctype" == *text/html* || "$ctype" == *text/plain* ]] || continue ;;
            esac
            cp "/tmp/prod/$safe" "$f"
            case "$name" in index.html|signal.html|statistics.html) ;; *)
              printf '%s\t%s\n' "$(sha256sum "/tmp/prod/$safe" | awk '{print $1}')" "$name" >> /tmp/protected-manifest.tsv
            ;; esac
          done < <(find nomad-live-343 -maxdepth 1 -type f | sort)

          for f in index.html signal.html statistics.html v2-header.css dashboard-v2.css ball46-next.css ball46-product-pages-v1.css page2-workspace-v1.css statistics-refine-v2.css; do
            test -s "/tmp/prod/$f" || { echo "PRODUCTION_BASE_MISSING:$f"; exit 1; }
          done
          cp /tmp/prod/index.html /tmp/index.original.html
          cp /tmp/prod/signal.html /tmp/signal.original.html
          cp /tmp/prod/statistics.html /tmp/statistics.original.html

          python3 - <<'PY'
          from pathlib import Path
          import re, urllib.request, urllib.parse, hashlib
          root=Path('nomad-live-343')
          base='https://ball46.com/'
          manifest=Path('/tmp/protected-manifest.tsv')
          seen=set()
          if manifest.exists():
              for line in manifest.read_text().splitlines():
                  if '\t' in line: seen.add(line.split('\t',1)[1])
          for page in ('index.html','signal.html','statistics.html'):
              h=(root/page).read_text(errors='ignore')
              refs=re.findall(r'(?:src|href)=["\']([^"\']+)["\']',h,re.I)
              for ref in refs:
                  ref=ref.split('#',1)[0]
                  if not ref or ref.startswith(('http:','https:','//','data:','mailto:','#','/api/')):
                      continue
                  path=ref.split('?',1)[0].lstrip('./')
                  if path=='page-head-stability-v1.css' or not re.search(r'\.(?:css|js|svg|png|webp|jpg|jpeg|ico)$',path,re.I):
                      continue
                  try:
                      data=urllib.request.urlopen(base+urllib.parse.quote(path),timeout=15).read()
                      if not data: continue
                      dst=root/path; dst.parent.mkdir(parents=True,exist_ok=True); dst.write_bytes(data)
                      if path not in seen:
                          manifest.write_text(manifest.read_text()+hashlib.sha256(data).hexdigest()+'\t'+path+'\n')
                          seen.add(path)
                      print('mirrored referenced asset',path)
                  except Exception as e:
                      raise SystemExit(f'REFERENCED_ASSET_MIRROR_FAILED:{path}:{e}')
          PY

          for ep in engine hub full-market; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/api/$ep/health?headbase=$GITHUB_RUN_ID" -o "/tmp/$ep-before.json"
          done
          node - <<'NODE'
          const fs=require('fs'); const out={};
          for(const n of ['engine','hub','full-market']){
            const j=JSON.parse(fs.readFileSync(`/tmp/${n}-before.json`,'utf8'));
            if(j?.ok!==true || !j.version) throw Error('PREFLIGHT_'+n+'_FAIL');
            out[n]={version:String(j.version||''),component:String(j.component||''),staleCachePolicy:String(j.staleCachePolicy||'')};
          }
          fs.writeFileSync('/tmp/backend-before.json',JSON.stringify(out));
          console.log('BACKEND_BEFORE',JSON.stringify(out));
          NODE

      - name: Validate presentation-only overlay
        shell: bash
        run: |
          set -euo pipefail
          test -s nomad-live-343/page-head-stability-v1.css
          grep -Fq 'body[data-page="live"] .dash-heading' nomad-live-343/page-head-stability-v1.css
          grep -Fq '.ball46-product-page .next-page-head' nomad-live-343/page-head-stability-v1.css
          grep -Fq 'width:calc(min(100vw, 1920px)' nomad-live-343/page-head-stability-v1.css
          ! grep -Fq 'fetch(' nomad-live-343/page-head-stability-v1.css
          ! grep -Fq '/api/' nomad-live-343/page-head-stability-v1.css
          python3 - <<'PY'
          from pathlib import Path
          s=Path('nomad-live-343/page-head-stability-v1.css').read_text()
          if s.count('{')!=s.count('}'): raise SystemExit('CSS_BRACE_MISMATCH')
          PY

      - name: Add one stylesheet loader to Page 1 2 3 only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          loader='<link rel="stylesheet" href="page-head-stability-v1.css?v=343-page-head-stability-v1-20260920a">'
          for name in ('index.html','signal.html','statistics.html'):
              p=Path('nomad-live-343')/name
              h=p.read_text()
              h=re.sub(r'\s*<link[^>]+page-head-stability-v1\.css[^>]*>','',h,flags=re.I)
              if '</head>' not in h: raise SystemExit('HEAD_ANCHOR_MISSING:'+name)
              p.write_text(h.replace('</head>',loader+'\n</head>',1))
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          def strip_loader(s):
              s=re.sub(r'\s*<link[^>]+page-head-stability-v1\.css[^>]*>','',s,flags=re.I)
              return re.sub(r'>\s+<','><',s).strip()
          for name in ('index','signal','statistics'):
              before=Path(f'/tmp/{name}.original.html').read_text()
              after=Path(f'nomad-live-343/{name}.html').read_text()
              if strip_loader(before)!=strip_loader(after): raise SystemExit('NON_LOADER_HTML_CHANGED:'+name)
          print('PASS_ONLY_LOADER_CHANGED')
          PY

      - name: Browser geometry gate BEFORE production deploy
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          [ -n "$CHROME" ] || { echo 'CHROME_NOT_FOUND'; exit 1; }
          npm install --no-save --no-package-lock puppeteer-core@24.16.0 >/dev/null 2>&1
          python3 -m http.server 4173 --directory nomad-live-343 >/tmp/head-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for n in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break || sleep .25; done
          CHROME_BIN="$CHROME" BASE_URL="http://127.0.0.1:4173" node - <<'NODE'
          const puppeteer=require('puppeteer-core');
          const pages=[['index.html','.dash-heading'],['signal.html','.next-page-head'],['statistics.html','.next-page-head']];
          const viewports=[{width:1920,height:1080,name:'desktop-1920'},{width:1366,height:900,name:'desktop-1366'},{width:390,height:844,name:'mobile-390'}];
          const rect=r=>({left:r.left,top:r.top,width:r.width,height:r.height});
          (async()=>{const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});try{
            for(const vp of viewports){const rows=[];for(const [path,sel] of pages){const page=await browser.newPage();await page.setJavaScriptEnabled(false);await page.setViewport({width:vp.width,height:vp.height,deviceScaleFactor:1});await page.goto(`${process.env.BASE_URL}/${path}`,{waitUntil:'networkidle0',timeout:30000});const m=await page.$eval(sel,el=>{const R=n=>{const r=n.getBoundingClientRect();return {left:r.left,top:r.top,width:r.width,height:r.height}};const eyebrow=el.querySelector('.eyebrow'),h1=el.querySelector('h1'),desc=el.querySelector(':scope > div:first-child > p:last-child');return {head:R(el),eyebrow:R(eyebrow),h1:R(h1),desc:R(desc),h1Size:parseFloat(getComputedStyle(h1).fontSize),eyebrowSize:parseFloat(getComputedStyle(eyebrow).fontSize),descSize:parseFloat(getComputedStyle(desc).fontSize)}});rows.push({path,...m});await page.close()}
              const spread=(k,a)=>Math.max(...rows.map(r=>r[k][a]))-Math.min(...rows.map(r=>r[k][a]));
              for(const [k,a] of [['head','left'],['head','top'],['eyebrow','left'],['eyebrow','top'],['h1','left'],['h1','top'],['desc','left'],['desc','top']]){const s=spread(k,a);if(s>1.5)throw Error(`PREDEPLOY_GEOMETRY_MISMATCH:${vp.name}:${k}.${a}:${s.toFixed(2)}px`)}
              for(const k of ['h1Size','eyebrowSize','descSize']){const s=Math.max(...rows.map(r=>r[k]))-Math.min(...rows.map(r=>r[k]));if(s>0.1)throw Error(`PREDEPLOY_FONT_MISMATCH:${vp.name}:${k}:${s}`)}
              console.log('PREDEPLOY_GEOMETRY_PASS',vp.name,JSON.stringify(rows));
            }
          }finally{await browser.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Cloudflare dry run
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc --dry-run

      - name: Recheck production version immediately before deploy
        shell: bash
        run: |
          set -euo pipefail
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deployments list --config wrangler.ball46.jsonc --json > /tmp/deployments-predeploy.json
          cd ../..
          node - <<'NODE'
          const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/deployments-predeploy.json','utf8'));const x=d[d.length-1];const t=process.env.TARGET_BASE_VERSION;
          if(!x||!x.versions?.some(v=>v.version_id===t&&Number(v.percentage)===100)){console.error('PRODUCTION_CHANGED_DURING_TEST',JSON.stringify(x));process.exit(1)}
          console.log('PREDEPLOY_VERSION_STILL_LOCKED',t);
          NODE

      - name: Deploy heading overlay only
        working-directory: workers/nomadtips3-343-preview
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc | tee /tmp/deploy-output.txt
          touch /tmp/our-deploy-ran

      - name: Verify protected assets and backend after deploy
        shell: bash
        run: |
          set -euo pipefail
          marker='page-head-stability-v1.css?v=343-page-head-stability-v1-20260920a'
          for p in index.html signal.html statistics.html; do
            ok=0
            for n in $(seq 1 15); do
              code=$(curl -sS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 -o "/tmp/$p.after" -w '%{http_code}' "$BALL46_URL/$p?headstable=$GITHUB_RUN_ID-$n") || code=000
              if [ "$code" = 200 ] && grep -Fq "$marker" "/tmp/$p.after"; then ok=1; break; fi
              sleep 2
            done
            [ "$ok" = 1 ] || { echo "PAGE_HEAD_LOADER_FAILED:$p"; exit 1; }
          done
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_URL/page-head-stability-v1.css?headstable=$GITHUB_RUN_ID" -o /tmp/head.after.css
          grep -Fq 'body[data-page="live"] .dash-heading' /tmp/head.after.css
          grep -Fq '.ball46-product-page .next-page-head' /tmp/head.after.css

          while IFS=$'\t' read -r expected name; do
            [ -n "$name" ] || continue
            out="/tmp/protected-${name//\//_}"
            curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_URL/$name?headprotect=$GITHUB_RUN_ID" -o "$out"
            actual=$(sha256sum "$out" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "PROTECTED_ASSET_CHANGED:$name"; exit 1; }
          done < /tmp/protected-manifest.tsv

          mkdir -p /tmp/backend-after
          for ep in engine hub full-market; do curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/api/$ep/health?headstable=$GITHUB_RUN_ID" -o "/tmp/backend-after/$ep.json"; done
          node - <<'NODE'
          const fs=require('fs');const b=JSON.parse(fs.readFileSync('/tmp/backend-before.json','utf8'));
          for(const n of ['engine','hub','full-market']){const j=JSON.parse(fs.readFileSync(`/tmp/backend-after/${n}.json`,'utf8'));if(j?.ok!==true)throw Error('POST_'+n+'_FAIL');for(const k of ['version','component','staleCachePolicy']){const now=String(j[k]||'');if(b[n][k]&&now!==b[n][k])throw Error(`${n}_${k}_CHANGED`)}}
          console.log('BACKEND_INVARIANTS_PASS');
          NODE

      - name: Browser geometry verification on live Ball46
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          [ -n "$CHROME" ] || { echo 'CHROME_NOT_FOUND'; exit 1; }
          CHROME_BIN="$CHROME" BASE_URL="$BALL46_URL" node - <<'NODE'
          const puppeteer=require('puppeteer-core');
          const pages=[['index.html','.dash-heading'],['signal.html','.next-page-head'],['statistics.html','.next-page-head']];
          const viewports=[{width:1920,height:1080,name:'desktop-1920'},{width:1366,height:900,name:'desktop-1366'},{width:390,height:844,name:'mobile-390'}];
          (async()=>{const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});try{
            for(const vp of viewports){const rows=[];for(const [path,sel] of pages){const page=await browser.newPage();await page.setJavaScriptEnabled(false);await page.setViewport({width:vp.width,height:vp.height,deviceScaleFactor:1});await page.goto(`${process.env.BASE_URL}/${path}?geom=${Date.now()}-${Math.random()}`,{waitUntil:'networkidle0',timeout:30000});const m=await page.$eval(sel,el=>{const R=n=>{const r=n.getBoundingClientRect();return {left:r.left,top:r.top,width:r.width,height:r.height}};const eyebrow=el.querySelector('.eyebrow'),h1=el.querySelector('h1'),desc=el.querySelector(':scope > div:first-child > p:last-child');return {head:R(el),eyebrow:R(eyebrow),h1:R(h1),desc:R(desc),h1Size:parseFloat(getComputedStyle(h1).fontSize),eyebrowSize:parseFloat(getComputedStyle(eyebrow).fontSize),descSize:parseFloat(getComputedStyle(desc).fontSize)}});rows.push({path,...m});await page.close()}
              const spread=(k,a)=>Math.max(...rows.map(r=>r[k][a]))-Math.min(...rows.map(r=>r[k][a]));
              for(const [k,a] of [['head','left'],['head','top'],['eyebrow','left'],['eyebrow','top'],['h1','left'],['h1','top'],['desc','left'],['desc','top']]){const s=spread(k,a);if(s>1.5)throw Error(`LIVE_GEOMETRY_MISMATCH:${vp.name}:${k}.${a}:${s.toFixed(2)}px`)}
              for(const k of ['h1Size','eyebrowSize','descSize']){const s=Math.max(...rows.map(r=>r[k]))-Math.min(...rows.map(r=>r[k]));if(s>0.1)throw Error(`LIVE_FONT_MISMATCH:${vp.name}:${k}:${s}`)}
              console.log('LIVE_GEOMETRY_PASS',vp.name,JSON.stringify(rows));
            }
          }finally{await browser.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Final deployment report
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deployments list --config wrangler.ball46.jsonc --json | tail -c 12000

      - name: Emergency rollback if a post-deploy verification failed
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /tmp/our-deploy-ran ]; then echo 'NO_DEPLOY_OCCURRED_NO_ROLLBACK_NEEDED'; exit 0; fi
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 rollback "$TARGET_BASE_VERSION" --config wrangler.ball46.jsonc --message "Auto rollback: Ball46 page-head verification failed"
          echo "AUTO_ROLLBACK_COMPLETE:$TARGET_BASE_VERSION"
