name: The King — Direct Settlement Repair Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/the-king-direct-repair-once.yml'

permissions:
  contents: write

concurrency:
  group: the-king-selection-wheel-default-40-188
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install direct-feed dependencies
        run: python3 -m pip install --disable-pip-version-check requests beautifulsoup4 playwright

      - name: Restore official 2026-09-04 selection snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          feed_path = Path('the-king-feed.json')
          state_path = Path('the-king-state.json')
          feed_snap_path = Path('the-king-archive/the-king-feed-pre-stats-v3-20260904.json')
          state_snap_path = Path('the-king-archive/the-king-state-pre-stats-v3-20260904.json')
          official_date = '2026-09-04'

          feed = json.loads(feed_path.read_text(encoding='utf-8'))
          state = json.loads(state_path.read_text(encoding='utf-8'))
          snap = json.loads(feed_snap_path.read_text(encoding='utf-8'))
          state_snap = json.loads(state_snap_path.read_text(encoding='utf-8'))

          official = copy.deepcopy(snap.get('today') or [])
          if len(official) != 93:
              raise SystemExit(f'official snapshot expected 93 picks, got {len(official)}')
          if any(str(rec.get('date')) != official_date for rec in official):
              raise SystemExit('official snapshot contains a wrong date')

          for rec in official:
              rec['result'] = 'PENDING'
              rec['ft'] = None
              for key in ('settlement_source','goaloo_terminal_state','settled_at','settlement_verified_at'):
                  rec.pop(key, None)

          # 2026-09-04 history was contaminated by the retired page parser.
          # Rebuild this date only from direct-index settlement below.
          feed['today'] = official
          feed['selection_date'] = official_date
          feed['history'] = [item for item in (feed.get('history') or []) if str(item.get('date') or '') != official_date]
          feed['updated_at'] = datetime.now(timezone.utc).isoformat().replace('+00:00','Z')

          selection_keys = (
              'engine','policy','status','last_selection_run','selection_date','fixtures_seen','qualified',
              'max_daily_picks','no_pick','primary_source','decision_layer','selection_profile','rejected',
              'rejection_reasons','rejection_samples','near_gate_top','source_health','policy_limits','transition_notes'
          )
          for key in selection_keys:
              if key in state_snap:
                  state[key] = copy.deepcopy(state_snap[key])
          state['pending'] = 93
          state['official_selection_restore'] = {
              'date': official_date,
              'source': str(feed_snap_path),
              'picks': 93,
              'reason': 'restore immutable morning selection after unintended push-trigger rerun',
              'restored_at': feed['updated_at'],
          }

          feed_path.write_text(json.dumps(feed, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'restored_official_picks': 93, 'date': official_date}))
          PY

      - name: Direct reconciler self-test
        run: python3 .github/scripts/the_king_direct_reconcile.py self-test

      - name: Reconcile official TODAY from Goaloo direct index only
        run: python3 .github/scripts/the_king_direct_reconcile.py reconcile

      - name: Publish restored and repaired KING feed and state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add the-king-feed.json the-king-state.json
          if git diff --cached --quiet; then
            echo 'No KING repair change.'
            exit 0
          fi
          git commit -m "Restore official KING picks and reconcile Goaloo direct $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
