name: BALL46 TEST O/U true opening OR closing 2.5 payout deploy
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-ou-opening-closing-parser-deploy-test-20261123.yml]
permissions: {contents: read}
concurrency:
  group: ball46-prematch-only-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Offline QA — real opening or closing prices, exact 2.5, no fake inplay prices
        run: |
          node --check qa/prematch-history-20261120/deploy-ou-opening-or-closing-test-20261123.mjs
          node --check qa/prematch-history-20261120/ou-verified-price-ingest-v1-test.mjs
          node --test qa/prematch-history-20261120/ou-verified-price-ingest-v1.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-price-pickup-v1.test.mjs
      - name: Deploy ONLY parser module to isolated TEST Worker; no paid calls
        run: node qa/prematch-history-20261120/deploy-ou-opening-or-closing-test-20261123.mjs
