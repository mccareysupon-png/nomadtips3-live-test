name: Inspect Ball46 Pre0500 Version 20260926

on:
  push:
    branches:
      - ops/ball46-find-pre0500-20260926
    paths:
      - .github/workflows/inspect-ball46-pre0500-version-20260926.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      WORKER_NAME: ball46-production
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ball46-find-pre0500-20260926
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture Cloudflare versions and deployments read only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ops
          npx --yes wrangler@4.92.0 versions list --name "$WORKER_NAME" --json > .ops/ball46-versions.json
          npx --yes wrangler@4.92.0 deployments list --name "$WORKER_NAME" --json > .ops/ball46-deployments.json
      - name: Save read-only history on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ops/ball46-versions.json .ops/ball46-deployments.json
          git commit -m "ops(ball46): capture Cloudflare history for pre-0500 restore" || exit 0
          git push origin HEAD:ops/ball46-find-pre0500-20260926
