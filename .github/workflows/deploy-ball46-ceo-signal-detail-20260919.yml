name: Deploy Ball46 CEO Signal Detail 20260919

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ball46-ceo-signal-detail-20260919.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_BRANCH: work/ball46-ceo-signal-ui-live-20260919b
  BALL46_URL: https://ball46.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-ceo-signal-detail:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated Signal UI branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Mirror current Production Signal assets and protect Odds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod
          for name in signal.html signal-next.js ball46-next.css full-market-bookmaker-343.js bulk-odds-compat-343.js live-summary-full-odds-343.js; do
            curl -fsS -L --max-time 30 "$BALL46_URL/$name?ceo-ui=${GITHUB_RUN_ID}" -o "/tmp/prod/$name"
          done
          cp /tmp/prod/signal.html nomad-live-343/signal.html
          cp /tmp/prod/signal-next.js nomad-live-343/signal-next.js
          cp /tmp/prod/ball46-next.css nomad-live-343/ball46-next.css
          sha256sum /tmp/prod/full-market-bookmaker-343.js > /tmp/full-market-asset.sha
          sha256sum /tmp/prod/bulk-odds-compat-343.js > /tmp/bulk-compat.sha
          sha256sum /tmp/prod/live-summary-full-odds-343.js > /tmp/live-summary.sha
          grep -o 'fetch(' /tmp/prod/signal-next.js | wc -l > /tmp/fetch-count
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/health?ceo-ui=${GITHUB_RUN_ID}" -o /tmp/engine-before.json
          curl -fsS --max-time 30 "$BALL46_URL/api/full-market/health?ceo-ui=${GITHUB_RUN_ID}" -o /tmp/full-before.json
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/engine-before.json','utf8'));
          const f=JSON.parse(fs.readFileSync('/tmp/full-before.json','utf8'));
          if(e.version!=='nomad343-engine-v6-ceo-auto-v1') throw Error(`UNEXPECTED_ENGINE:${e.version}`);
          fs.writeFileSync('/tmp/engine-version',String(e.version||''));
          fs.writeFileSync('/tmp/full-version',String(f.version||''));
          console.log('CEO_SIGNAL_UI_BASELINE',JSON.stringify({engine:e.version,fullMarket:f.version}));
          NODE

      - name: Apply presentation-only CEO Signal detail
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_ball46_ceo_signal_detail_20260919.py
          node --check nomad-live-343/signal-next.js
          grep -Fq "343-signal-ceo-detail-v1" nomad-live-343/signal-next.js
          grep -Fq "CEO Decision · Add K" nomad-live-343/signal-next.js
          grep -Fq "CEO · ADD K" nomad-live-343/signal-next.js
          grep -Fq "ceo-signal-detail.css?v=343-signal-ceo-detail-v1" nomad-live-343/signal.html
          test -s nomad-live-343/ceo-signal-detail.css
          test "$(grep -o 'fetch(' nomad-live-343/signal-next.js | wc -l)" = "$(cat /tmp/fetch-count)"
          ! grep -Fq '/api/full-market' nomad-live-343/signal-next.js
          ! grep -Fq 'fixture-odds' nomad-live-343/signal-next.js
          ! grep -Fq 'fetch(' nomad-live-343/ceo-signal-detail.css
          echo CEO_SIGNAL_PRESENTATION_GUARD_PASS

      - name: Commit Signal UI source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nomad-live-343/signal.html nomad-live-343/signal-next.js nomad-live-343/ball46-next.css nomad-live-343/ceo-signal-detail.css
          mapfile -t changed < <(git diff --cached --name-only)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          for f in "${changed[@]}"; do
            case "$f" in
              nomad-live-343/signal.html|nomad-live-343/signal-next.js|nomad-live-343/ball46-next.css|nomad-live-343/ceo-signal-detail.css) ;;
              *) echo "UNEXPECTED_FILE:$f"; exit 1;;
            esac
          done
          git commit -m 'feat(ball46): show isolated CEO decision detail on Signals' || true
          git push origin HEAD:${SOURCE_BRANCH}

      - name: Deploy Ball46 wrapper assets only
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify CEO detail and protected services
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 20); do
            curl -fsS -L --max-time 30 "$BALL46_URL/signal.html?ceo-ui=${GITHUB_RUN_ID}-${n}" -o /tmp/signal-after.html || true
            curl -fsS -L --max-time 30 "$BALL46_URL/signal-next.js?ceo-ui=${GITHUB_RUN_ID}-${n}" -o /tmp/signal-after.js || true
            curl -fsS -L --max-time 30 "$BALL46_URL/ceo-signal-detail.css?ceo-ui=${GITHUB_RUN_ID}-${n}" -o /tmp/ceo-after.css || true
            if grep -Fq '343-signal-ceo-detail-v1' /tmp/signal-after.html && grep -Fq '343-signal-ceo-detail-v1' /tmp/signal-after.js && grep -Fq '.ceo-decision' /tmp/ceo-after.css; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ]
          node --check /tmp/signal-after.js
          grep -Fq 'CEO Decision · Add K' /tmp/signal-after.js
          grep -Fq 'Decision score · not win probability' /tmp/signal-after.js
          test "$(grep -o 'fetch(' /tmp/signal-after.js | wc -l)" = "$(cat /tmp/fetch-count)"
          curl -fsS -L --max-time 30 "$BALL46_URL/full-market-bookmaker-343.js?ceo-ui=${GITHUB_RUN_ID}-after" -o /tmp/fm-asset-after.js
          curl -fsS -L --max-time 30 "$BALL46_URL/bulk-odds-compat-343.js?ceo-ui=${GITHUB_RUN_ID}-after" -o /tmp/bulk-after.js
          curl -fsS -L --max-time 30 "$BALL46_URL/live-summary-full-odds-343.js?ceo-ui=${GITHUB_RUN_ID}-after" -o /tmp/live-summary-after.js
          test "$(sha256sum /tmp/fm-asset-after.js | awk '{print $1}')" = "$(awk '{print $1}' /tmp/full-market-asset.sha)"
          test "$(sha256sum /tmp/bulk-after.js | awk '{print $1}')" = "$(awk '{print $1}' /tmp/bulk-compat.sha)"
          test "$(sha256sum /tmp/live-summary-after.js | awk '{print $1}')" = "$(awk '{print $1}' /tmp/live-summary.sha)"
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/health?ceo-ui=${GITHUB_RUN_ID}-after" -o /tmp/engine-after.json
          curl -fsS --max-time 30 "$BALL46_URL/api/full-market/health?ceo-ui=${GITHUB_RUN_ID}-after" -o /tmp/full-after.json
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/signals?ceo-ui=${GITHUB_RUN_ID}" -o /tmp/signals.json
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/engine-after.json','utf8'));
          const f=JSON.parse(fs.readFileSync('/tmp/full-after.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals.json','utf8'));
          if(String(e.version||'')!==fs.readFileSync('/tmp/engine-version','utf8')) throw Error('ENGINE_CHANGED');
          if(String(f.version||'')!==fs.readFileSync('/tmp/full-version','utf8')) throw Error('FULL_MARKET_CHANGED');
          if(!Array.isArray(s?.signals)) throw Error('SIGNALS_UNHEALTHY');
          const ceo=s.signals.filter(x=>String(x?.strategy||'').toUpperCase()==='CEO').length;
          console.log('CEO_SIGNAL_UI_DEPLOY_PASS',JSON.stringify({engine:e.version,fullMarket:f.version,pendingSignals:s.signals.length,pendingCEO:ceo}));
          NODE
