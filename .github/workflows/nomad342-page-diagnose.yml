name: NOMAD 3.42 Real Tabs UI Diagnose

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'nomad-live-342/index.html'
      - 'nomad-live-342/signal.html'
      - 'nomad-live-342/statistics.html'
      - 'nomad-live-342/nomad342-tabs.css'
      - 'nomad-live-342/nomad342-tabs.js'
      - 'nomad-live-342/ledger-pages.css'
      - '.github/workflows/nomad342-page-diagnose.yml'
  push:
    branches: [main]
    paths:
      - 'nomad-live-342/index.html'
      - 'nomad-live-342/signal.html'
      - 'nomad-live-342/statistics.html'
      - 'nomad-live-342/nomad342-tabs.css'
      - 'nomad-live-342/nomad342-tabs.js'
      - 'nomad-live-342/ledger-pages.css'
      - '.github/workflows/nomad342-page-diagnose.yml'

jobs:
  real-tabs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate tab script syntax and markup contract
        shell: bash
        run: |
          set -euo pipefail
          node --check nomad-live-342/nomad342-tabs.js
          grep -Fq 'role="tablist"' nomad-live-342/index.html
          grep -Fq 'data-tab="live-score"' nomad-live-342/index.html
          grep -Fq 'data-tab="signal"' nomad-live-342/index.html
          grep -Fq 'data-tab="statistics"' nomad-live-342/index.html
          grep -Fq 'data-panel="live-score"' nomad-live-342/index.html
          grep -Fq 'data-panel="signal"' nomad-live-342/index.html
          grep -Fq 'data-panel="statistics"' nomad-live-342/index.html
          grep -Fq "location.replace('./#signal')" nomad-live-342/signal.html
          grep -Fq "location.replace('./#statistics')" nomad-live-342/statistics.html
      - name: Prove tabs switch content without page navigation
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock jsdom@26 >/dev/null 2>&1
          node - <<'NODE'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          const html=fs.readFileSync('nomad-live-342/index.html','utf8');
          const js=fs.readFileSync('nomad-live-342/nomad342-tabs.js','utf8');
          const dom=new JSDOM(html,{url:'https://www.nomadtips3.com/nomad-live-342/#live-score',runScripts:'outside-only'});
          const {window}=dom;
          const check=(ok,msg)=>{if(!ok)throw new Error(msg)};
          window.eval(js);
          window.document.dispatchEvent(new window.Event('DOMContentLoaded'));
          const tabs=[...window.document.querySelectorAll('.nomad342-tab[role="tab"]')];
          const panels=[...window.document.querySelectorAll('.nomad342-tab-panel[role="tabpanel"]')];
          check(tabs.length===3,'expected exactly 3 tabs');
          check(panels.length===3,'expected exactly 3 tab panels');
          check(tabs.map(x=>x.dataset.tab).join('|')==='live-score|signal|statistics','tab order must be Live Score -> Signal -> Statistics');
          const path=window.location.pathname;
          const visible=()=>panels.filter(p=>!p.hidden).map(p=>p.dataset.panel);
          check(visible().join('|')==='live-score','Live Score must be default visible tab');
          tabs[1].click();
          check(window.location.pathname===path,'Signal click navigated away from page');
          check(window.location.hash==='#signal','Signal hash not updated');
          check(visible().join('|')==='signal','Signal panel did not become the only visible panel');
          tabs[2].click();
          check(window.location.pathname===path,'Statistics click navigated away from page');
          check(window.location.hash==='#statistics','Statistics hash not updated');
          check(visible().join('|')==='statistics','Statistics panel did not become the only visible panel');
          tabs[0].click();
          check(window.location.pathname===path,'Live Score click navigated away from page');
          check(visible().join('|')==='live-score','Live Score panel did not restore');
          console.log('NOMAD342_REAL_TABS_OK');
          NODE
