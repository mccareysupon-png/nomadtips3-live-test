name: NOMAD 3.42 Page Diagnose

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nomad-live-342/event-graph-live.js'
      - 'nomad-live-342/index.html'
      - '.github/workflows/nomad342-page-diagnose.yml'

jobs:
  diagnose-page:
    runs-on: ubuntu-latest
    steps:
      - name: Open deployed 3.42 page in Chrome
        shell: bash
        run: |
          set -e
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "CHROME=${chrome:-missing}"
          test -n "$chrome" || exit 0
          url="https://mccareysupon-png.github.io/nomadtips3-live-test/nomad-live-342/index.html?v=${GITHUB_SHA}"
          ready=0
          for attempt in $(seq 1 12); do
            "$chrome" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=26000 --enable-logging=stderr --dump-dom "$url" >/tmp/nomad342-dom.html 2>/tmp/nomad342-chrome.log || true
            cards="$(grep -o 'class=\"signal-card event-compact' /tmp/nomad342-dom.html | wc -l)"
            topnav="$(grep -o 'class=\"topnav' /tmp/nomad342-dom.html | wc -l)"
            mobile="$(grep -o '<nav class=\"mobile-nav' /tmp/nomad342-dom.html | wc -l)"
            echo "ATTEMPT=$attempt EVENT_CARDS=$cards TOPNAV_COUNT=$topnav MOBILE_NAV_COUNT=$mobile"
            if [ "$cards" -gt 0 ] && [ "$topnav" -eq 1 ] && [ "$mobile" -eq 1 ]; then
              ready=1
              break
            fi
            sleep 10
          done
          echo '--- BROWSER ERRORS ---'
          grep -Ei 'error|failed|cors|uncaught|exception|ERR_' /tmp/nomad342-chrome.log | tail -120 || true
          echo '--- SCRIPT REFS ---'
          grep -oE '<script[^>]+src="[^"]+"' /tmp/nomad342-dom.html | tail -30 || true
          test "$ready" -eq 1

      - name: Verify unified header and card interaction
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          node - <<'NODE'
          const puppeteer=require('puppeteer-core');
          const executablePath=process.env.CHROME_PATH||'/usr/bin/google-chrome-stable';
          const base='https://mccareysupon-png.github.io/nomadtips3-live-test';
          const urls={
            signal:`${base}/nomad-live/index.html?v=${Date.now()}`,
            statistics:`${base}/nomad-live/statistics.html?v=${Date.now()}`,
            liveScore:`${base}/nomad-live-342/index.html?v=${Date.now()}`
          };
          const comparableKeys=[
            'topbarHeight','innerHeight','innerMaxWidth','innerPaddingLeft','innerPaddingRight',
            'brandFontSize','brandFontWeight','brandLetterSpacing','brandLineHeight',
            'brandX','brandY','navFontSize','navFontWeight','navLineHeight','navGap',
            'navX','navY','navWidth','backgroundImage'
          ];
          const closeEnough=(a,b)=>typeof a==='number'&&typeof b==='number'?Math.abs(a-b)<=0.5:a===b;
          (async()=>{
            const browser=await puppeteer.launch({executablePath,headless:true,args:['--no-sandbox','--disable-gpu']});
            try{
              const page=await browser.newPage();
              await page.setViewport({width:1280,height:900,deviceScaleFactor:1});
              const capture=async(url,waitForCards=false)=>{
                await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
                await page.waitForSelector('.topbar .brand',{timeout:30000});
                await page.waitForSelector('.topbar .topnav',{timeout:30000});
                if(waitForCards)await page.waitForSelector('.event-compact',{timeout:45000});
                return await page.evaluate(()=>{
                  const topbar=document.querySelector('.topbar');
                  const inner=document.querySelector('.topbar-inner.public-four-nav');
                  const brand=inner?.querySelector('.brand');
                  const nav=inner?.querySelector('.topnav');
                  const link=nav?.querySelector('a');
                  const topbarStyle=getComputedStyle(topbar);
                  const innerStyle=getComputedStyle(inner);
                  const brandStyle=getComputedStyle(brand);
                  const navStyle=getComputedStyle(nav);
                  const linkStyle=getComputedStyle(link);
                  const brandRect=brand.getBoundingClientRect();
                  const navRect=nav.getBoundingClientRect();
                  return {
                    topbarLinks:document.querySelectorAll('.topbar .topnav a').length,
                    mobileNavs:document.querySelectorAll('.mobile-nav.public-four-nav').length,
                    activeLinks:document.querySelectorAll('.topnav a.active').length,
                    cards:document.querySelectorAll('.event-compact').length,
                    topbarHeight:parseFloat(topbarStyle.height),
                    innerHeight:parseFloat(innerStyle.height),
                    innerMaxWidth:innerStyle.maxWidth,
                    innerPaddingLeft:innerStyle.paddingLeft,
                    innerPaddingRight:innerStyle.paddingRight,
                    brandFontSize:brandStyle.fontSize,
                    brandFontWeight:brandStyle.fontWeight,
                    brandLetterSpacing:brandStyle.letterSpacing,
                    brandLineHeight:brandStyle.lineHeight,
                    brandX:brandRect.x,
                    brandY:brandRect.y,
                    navFontSize:linkStyle.fontSize,
                    navFontWeight:linkStyle.fontWeight,
                    navLineHeight:linkStyle.lineHeight,
                    navGap:navStyle.gap,
                    navX:navRect.x,
                    navY:navRect.y,
                    navWidth:navRect.width,
                    backgroundImage:topbarStyle.backgroundImage
                  };
                });
              };

              const snapshots={};
              snapshots.signal=await capture(urls.signal,false);
              snapshots.statistics=await capture(urls.statistics,false);
              snapshots.liveScore=await capture(urls.liveScore,true);
              console.log('HEADER_SNAPSHOTS',JSON.stringify(snapshots,null,2));

              for(const [name,snapshot] of Object.entries(snapshots)){
                if(snapshot.topbarLinks!==4)throw new Error(`${name}: expected 4 topbar links, got ${snapshot.topbarLinks}`);
                if(snapshot.mobileNavs!==1)throw new Error(`${name}: expected 1 mobile nav, got ${snapshot.mobileNavs}`);
                if(snapshot.activeLinks!==1)throw new Error(`${name}: expected 1 active topbar link, got ${snapshot.activeLinks}`);
                if(snapshot.topbarHeight!==64)throw new Error(`${name}: expected 64px topbar, got ${snapshot.topbarHeight}`);
                if(snapshot.innerHeight!==64)throw new Error(`${name}: expected 64px inner header, got ${snapshot.innerHeight}`);
                if(snapshot.innerMaxWidth!=='1120px')throw new Error(`${name}: expected 1120px max-width, got ${snapshot.innerMaxWidth}`);
                if(snapshot.brandFontSize!=='24px')throw new Error(`${name}: expected 24px logo, got ${snapshot.brandFontSize}`);
                if(snapshot.navFontSize!=='13px')throw new Error(`${name}: expected 13px menu text, got ${snapshot.navFontSize}`);
                if(snapshot.navFontWeight!=='900')throw new Error(`${name}: expected menu weight 900, got ${snapshot.navFontWeight}`);
                if(snapshot.navGap!=='2px')throw new Error(`${name}: expected 2px nav gap, got ${snapshot.navGap}`);
                if(!snapshot.backgroundImage.includes('linear-gradient'))throw new Error(`${name}: expected shared green gradient topbar`);
              }
              if(snapshots.liveScore.cards<1)throw new Error('liveScore: expected live TotalCorner cards');

              for(const key of comparableKeys){
                const a=snapshots.signal[key];
                for(const name of ['statistics','liveScore']){
                  const b=snapshots[name][key];
                  if(!closeEnough(a,b))throw new Error(`${key} mismatch: signal=${a}, ${name}=${b}`);
                }
              }

              await page.goto(urls.liveScore,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForSelector('.event-compact',{timeout:45000});
              const id=await page.$eval('.event-compact',el=>el.dataset.matchId);
              const safeId=String(id).replace(/\\/g,'\\\\').replace(/"/g,'\\"');
              const selector=`.event-compact[data-match-id="${safeId}"]`;
              await page.click(selector);
              await page.waitForFunction(sel=>document.querySelector(sel)?.classList.contains('expanded'),{},selector);
              const expandedAfterOpen=await page.$$eval('.event-compact.expanded',els=>els.length);
              if(expandedAfterOpen!==1)throw new Error(`expected 1 expanded card after open, got ${expandedAfterOpen}`);
              await page.click(`${selector} .event-details`);
              await page.waitForFunction(sel=>!document.querySelector(sel)?.classList.contains('expanded'),{},selector);
              await new Promise(r=>setTimeout(r,550));
              const result=await page.evaluate(sel=>({
                originalExpanded:document.querySelector(sel)?.classList.contains('expanded')||false,
                expandedIds:[...document.querySelectorAll('.event-compact.expanded')].map(el=>el.dataset.matchId)
              }),selector);
              console.log(JSON.stringify({testedMatchId:id,...result},null,2));
              if(result.originalExpanded)throw new Error('original card stayed expanded');
              if(result.expandedIds.length!==0)throw new Error(`click-through opened another card: ${result.expandedIds.join(',')}`);
            }finally{await browser.close();}
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
