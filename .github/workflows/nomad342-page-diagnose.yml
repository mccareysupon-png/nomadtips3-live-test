name: NOMAD 3.42 Page Diagnose

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nomad-live-342/event-graph-live.js'
      - 'nomad-live-342/index.html'
      - '.github/workflows/nomad342-page-diagnose.yml'

jobs:
  diagnose-page:
    runs-on: ubuntu-latest
    steps:
      - name: Open deployed standalone 3.42 page in Chrome
        shell: bash
        run: |
          set -e
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "CHROME=${chrome:-missing}"
          test -n "$chrome" || exit 0
          url='https://mccareysupon-png.github.io/nomadtips3-live-test/nomad-live-342/index.html?v=20260831-standalone342-v2'
          "$chrome" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=26000 --enable-logging=stderr --dump-dom "$url" >/tmp/nomad342-dom.html 2>/tmp/nomad342-chrome.log
          rc=$?
          echo "CHROME_RC=$rc"
          cards="$(grep -o 'class=\"signal-card event-compact' /tmp/nomad342-dom.html | wc -l)"
          echo "EVENT_CARDS=$cards"
          echo "SIGNAL_CARDS=$(grep -o 'class=\"signal-card' /tmp/nomad342-dom.html | wc -l)"
          echo "TOPNAV_COUNT=$(grep -o 'class=\"topnav' /tmp/nomad342-dom.html | wc -l)"
          echo "MOBILE_NAV_COUNT=$(grep -o '<nav class=\"mobile-nav' /tmp/nomad342-dom.html | wc -l)"
          echo '--- BROWSER ERRORS ---'
          grep -Ei 'error|failed|cors|uncaught|exception|ERR_' /tmp/nomad342-chrome.log | tail -120 || true
          echo '--- SCRIPT REFS ---'
          grep -oE '<script[^>]+src="[^"]+"' /tmp/nomad342-dom.html | tail -30 || true
          test "$rc" -eq 0
          test "$cards" -gt 0
          test "$(grep -o 'class=\"topnav' /tmp/nomad342-dom.html | wc -l)" -eq 0
          test "$(grep -o '<nav class=\"mobile-nav' /tmp/nomad342-dom.html | wc -l)" -eq 0

      - name: Verify standalone header and card interaction
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          node - <<'NODE'
          const puppeteer=require('puppeteer-core');
          const executablePath=process.env.CHROME_PATH||'/usr/bin/google-chrome-stable';
          (async()=>{
            const browser=await puppeteer.launch({executablePath,headless:true,args:['--no-sandbox','--disable-gpu']});
            try{
              const page=await browser.newPage();
              await page.goto('https://mccareysupon-png.github.io/nomadtips3-live-test/nomad-live-342/index.html?toggle-regression=1&v=20260831-standalone342-v2',{waitUntil:'networkidle2',timeout:60000});
              await page.waitForSelector('.event-compact',{timeout:45000});
              const ui=await page.evaluate(()=>({
                topbarLinks:document.querySelectorAll('.topbar a').length,
                mobileNavs:document.querySelectorAll('.mobile-nav').length,
                topbarBackground:getComputedStyle(document.querySelector('.topbar')).backgroundColor,
                cards:document.querySelectorAll('.event-compact').length
              }));
              console.log('STANDALONE_UI',JSON.stringify(ui));
              if(ui.topbarLinks!==0)throw new Error(`expected no topbar links, got ${ui.topbarLinks}`);
              if(ui.mobileNavs!==0)throw new Error(`expected no mobile nav, got ${ui.mobileNavs}`);
              if(ui.cards<1)throw new Error('expected live TotalCorner cards');
              if(ui.topbarBackground!=='rgb(22, 24, 23)')throw new Error(`unexpected topbar background ${ui.topbarBackground}`);

              const id=await page.$eval('.event-compact',el=>el.dataset.matchId);
              const safeId=String(id).replace(/\\/g,'\\\\').replace(/"/g,'\\"');
              const selector=`.event-compact[data-match-id="${safeId}"]`;
              await page.click(selector);
              await page.waitForFunction(sel=>document.querySelector(sel)?.classList.contains('expanded'),{},selector);
              const expandedAfterOpen=await page.$$eval('.event-compact.expanded',els=>els.length);
              if(expandedAfterOpen!==1)throw new Error(`expected 1 expanded card after open, got ${expandedAfterOpen}`);
              await page.click(`${selector} .event-details`);
              await page.waitForFunction(sel=>!document.querySelector(sel)?.classList.contains('expanded'),{},selector);
              await new Promise(r=>setTimeout(r,550));
              const result=await page.evaluate(sel=>({
                originalExpanded:document.querySelector(sel)?.classList.contains('expanded')||false,
                expandedIds:[...document.querySelectorAll('.event-compact.expanded')].map(el=>el.dataset.matchId)
              }),selector);
              console.log(JSON.stringify({testedMatchId:id,...result},null,2));
              if(result.originalExpanded)throw new Error('original card stayed expanded');
              if(result.expandedIds.length!==0)throw new Error(`click-through opened another card: ${result.expandedIds.join(',')}`);
            }finally{await browser.close();}
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
