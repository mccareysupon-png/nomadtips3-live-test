name: NOMAD 3.42 Navigation UI Diagnose

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'nomad-live-342/index.html'
      - 'nomad-live-342/signal.html'
      - 'nomad-live-342/statistics.html'
      - 'nomad-live-342/nomad342-tabs.css'
      - 'nomad-live-342/chassis-341.css'
      - '.github/workflows/nomad342-page-diagnose.yml'
  push:
    branches: [main]
    paths:
      - 'nomad-live-342/index.html'
      - 'nomad-live-342/signal.html'
      - 'nomad-live-342/statistics.html'
      - 'nomad-live-342/nomad342-tabs.css'
      - 'nomad-live-342/chassis-341.css'
      - '.github/workflows/nomad342-page-diagnose.yml'

jobs:
  responsive-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Verify repository 3.42 navigation contract
        shell: bash
        run: |
          set -euo pipefail
          for file in nomad-live-342/index.html nomad-live-342/signal.html nomad-live-342/statistics.html; do
            grep -Fq 'data-nomad342-nav="1"' "$file"
            grep -Fq 'href="index.html"' "$file"
            grep -Fq 'href="signal.html"' "$file"
            grep -Fq 'href="statistics.html"' "$file"
            count="$(grep -o 'nomad342-tab-label' "$file" | wc -l | tr -d ' ')"
            test "$count" = 6 || { echo "::error::$file must contain three desktop and three mobile 3.42 tab labels"; exit 1; }
          done
          echo 'Repository contract OK: Live Score -> Signal -> Statistics.'
      - name: Verify production 3.42 navigation across viewports
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          node - <<'NODE'
          const puppeteer=require('puppeteer-core');
          const executablePath=process.env.CHROME_PATH||'/usr/bin/google-chrome-stable';
          const widths=[360,390,412,700,701,768,1024,1280,1440];
          const urls={
            liveScore:'https://www.nomadtips3.com/nomad-live-342/',
            signal:'https://www.nomadtips3.com/nomad-live-342/signal.html',
            statistics:'https://www.nomadtips3.com/nomad-live-342/statistics.html'
          };
          const expected=['Live Score','Signal','Statistics'];
          const close=(a,b,t=.9)=>Math.abs(Number(a)-Number(b))<=t;
          const check=(ok,msg)=>{if(!ok)throw new Error(msg)};
          (async()=>{
            const browser=await puppeteer.launch({executablePath,headless:true,args:['--no-sandbox','--disable-gpu']});
            try{
              const page=await browser.newPage();
              const capture=async(url,width)=>{
                await page.setViewport({width,height:900,deviceScaleFactor:1});
                await page.goto(`${url}${url.includes('?')?'&':'?'}ui=${Date.now()}-${width}`,{waitUntil:'domcontentloaded',timeout:60000});
                await page.waitForSelector('.topbar .brand',{timeout:30000});
                return page.evaluate(()=>{
                  const topbar=document.querySelector('.topbar');
                  const brand=document.querySelector('.topbar-inner.public-four-nav>.brand');
                  const desktop=document.querySelector('.topnav.nomad342-nav');
                  const mobile=document.querySelector('.mobile-nav.nomad342-nav');
                  if(!topbar||!brand||!desktop||!mobile)throw new Error('3.42 navigation chassis missing');
                  const visible=nav=>[...nav.querySelectorAll('a')].filter(a=>getComputedStyle(a).display!=='none');
                  const labels=links=>links.map(a=>(a.querySelector('.nomad342-tab-label')?.textContent||'').replace(/\s+/g,' ').trim());
                  const dlinks=visible(desktop),mlinks=visible(mobile);
                  const br=brand.getBoundingClientRect(),dr=desktop.getBoundingClientRect(),mr=mobile.getBoundingClientRect();
                  return {
                    labelsDesktop:labels(dlinks),labelsMobile:labels(mlinks),
                    desktopCount:dlinks.length,mobileCount:mlinks.length,
                    desktopActive:dlinks.filter(a=>a.classList.contains('active')).length,
                    mobileActive:mlinks.filter(a=>a.classList.contains('active')).length,
                    desktopIcons:dlinks.filter(a=>a.querySelector('.nomad342-tab-icon svg')).length,
                    mobileIcons:mlinks.filter(a=>a.querySelector('.nomad342-tab-icon svg')).length,
                    desktopDisplay:getComputedStyle(desktop).display,
                    mobileDisplay:getComputedStyle(mobile).display,
                    topbarHeight:topbar.getBoundingClientRect().height,
                    brandX:br.x,brandY:br.y,desktopX:dr.x,desktopY:dr.y,desktopWidth:dr.width,
                    mobileX:mr.x,mobileY:mr.y,mobileWidth:mr.width,mobileHeight:mr.height,
                    scrollWidth:document.documentElement.scrollWidth,viewport:innerWidth
                  };
                });
              };
              for(const width of widths){
                const s={};
                for(const [name,url] of Object.entries(urls))s[name]=await capture(url,width);
                console.log('NOMAD342_UI',width,JSON.stringify(s));
                const mobile=width<=700;
                for(const [name,x] of Object.entries(s)){
                  check(x.desktopCount===3&&x.mobileCount===3,`${name}/${width}: expected exactly three 3.42 links`);
                  check(JSON.stringify(x.labelsDesktop)===JSON.stringify(expected),`${name}/${width}: desktop order ${JSON.stringify(x.labelsDesktop)}`);
                  check(JSON.stringify(x.labelsMobile)===JSON.stringify(expected),`${name}/${width}: mobile order ${JSON.stringify(x.labelsMobile)}`);
                  check(x.desktopActive===1&&x.mobileActive===1,`${name}/${width}: expected one active tab`);
                  check(x.desktopIcons===3&&x.mobileIcons===3,`${name}/${width}: vintage tab icon missing`);
                  check(x.scrollWidth<=x.viewport+1,`${name}/${width}: horizontal overflow`);
                  if(mobile){
                    check(x.desktopDisplay==='none',`${name}/${width}: desktop nav visible on mobile`);
                    check(x.mobileDisplay==='grid',`${name}/${width}: mobile nav not grid`);
                  }else{
                    check(x.desktopDisplay==='flex',`${name}/${width}: desktop nav not flex`);
                    check(x.mobileDisplay==='none',`${name}/${width}: mobile rail visible on desktop`);
                  }
                }
                const ref=s.liveScore;
                for(const name of ['signal','statistics']){
                  const x=s[name];
                  check(close(x.topbarHeight,ref.topbarHeight),`${name}/${width}: topbar mismatch`);
                  check(close(x.brandX,ref.brandX)&&close(x.brandY,ref.brandY),`${name}/${width}: brand geometry mismatch`);
                  if(mobile){
                    check(close(x.mobileX,ref.mobileX)&&close(x.mobileY,ref.mobileY)&&close(x.mobileWidth,ref.mobileWidth,1)&&close(x.mobileHeight,ref.mobileHeight),`${name}/${width}: mobile navigation geometry mismatch`);
                  }else{
                    check(close(x.desktopX,ref.desktopX)&&close(x.desktopY,ref.desktopY)&&close(x.desktopWidth,ref.desktopWidth,1),`${name}/${width}: desktop navigation geometry mismatch`);
                  }
                }
              }
              console.log('NOMAD342_RESPONSIVE_NAV_OK');
            } finally { await browser.close(); }
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
