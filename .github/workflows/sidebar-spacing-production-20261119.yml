name: BALL46 approved desktop spacing and route Active V3
on:
  push:
    branches: [test/ball46-sidebar-spacing-20261119]
    paths: ['.github/workflows/sidebar-spacing-production-20261119.yml']
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --prefix "$RUNNER_TEMP/b46qa" --no-save --no-package-lock puppeteer-core
          echo "PUPPETEER_ENTRY=$(node -p "require.resolve('puppeteer-core',{paths:['$RUNNER_TEMP/b46qa']})")" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Guarded approved V3 release
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --check qa/sidebar-spacing-20261119/production-browser.mjs
          node --check qa/sidebar-spacing-20261119/deploy-production.mjs
          node qa/sidebar-spacing-20261119/deploy-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidebar-spacing-production-evidence
          path: evidence/
          retention-days: 7
