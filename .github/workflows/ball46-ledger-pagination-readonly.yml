name: BALL46 read-only ledger pagination interface
on:
  push:
    branches: [stage/ball46-multisource-v5-20261017]
    paths: [.github/workflows/ball46-ledger-pagination-readonly.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact native contracts only
        env:
          CF_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node - <<'NODE'
          (async()=>{
            const u='https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ID+'/workers/scripts/nomadtips3-engine-343';
            const r=await fetch(u,{headers:{Authorization:'Bearer '+process.env.CF_TOKEN}});
            if(!r.ok)throw Error('HTTP_'+r.status);
            const s=await r.text();
            for(const k of ['STAT_LEDGER_PREFIX =','async statisticsLedgerResponse(','function secureTokenOk(','function normalizeFinalFixture(','/reconcile-final']){
              let i=s.indexOf(k);console.log('FUNCTION_OFFSET',k,i);
              if(i>=0)console.log('CODE_EXCERPT',k,s.slice(i,i+2400));
            }
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
