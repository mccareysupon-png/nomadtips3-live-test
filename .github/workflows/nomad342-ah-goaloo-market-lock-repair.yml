name: Repair NOMAD 3.42 AH Goaloo market-lock patch

on:
  push:
    branches:
      - work/nomad342-ah-goaloo-market-lock
    paths:
      - '.github/workflows/nomad342-ah-goaloo-market-lock-repair.yml'

permissions:
  contents: write

jobs:
  repair-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: work/nomad342-ah-goaloo-market-lock
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply and repair isolated 3.42 patch
        run: python3 .github/scripts/nomad342_ah_goaloo_repair.py
      - name: Run full focused regression suite
        shell: bash
        run: |
          set -euo pipefail
          npm test --prefix workers/nomadtips3-342-signal-engine
          npm test --prefix workers/nomadtips3-342-ledger
          node --check nomad-live-342/signal-ledger.js
          node --check nomad-live-342/statistics-ledger.js
          grep -Fq 'signal-ledger.js?v=20260908-ah-market-lock-v2' nomad-live-342/index.html
          grep -Fq '1X2 + O/U + AH' nomad-live-342/index.html
          grep -Fq 'const out=1+n' workers/nomadtips3-342-signal-engine/src/index.js
          grep -Fq 'priceAudit' workers/nomadtips3-342-ledger/src/index.js
          grep -Fq "status:ack?.appended?'APPENDED'" workers/nomadtips3-342-signal-engine/src/index.js
      - name: Verify strict isolation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          changed="$(git diff --name-only origin/main)"
          echo "$changed"
          test -n "$changed"
          if echo "$changed" | grep -Eq '^nomad-live/'; then
            echo '::error::3.41 file changed'; exit 1
          fi
          unexpected="$(echo "$changed" | grep -Ev '^(workers/nomadtips3-342-signal-engine/(src/index\.js|package\.json|test/ah-goaloo\.test\.mjs)|workers/nomadtips3-342-ledger/(src/index\.js|test/market-append\.test\.mjs)|nomad-live-342/(signal-ledger\.js|index\.html))$' || true)"
          if [ -n "$unexpected" ]; then
            echo '::error::Unexpected files changed'; echo "$unexpected"; exit 1
          fi
      - name: Commit tested patch to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix 3.42 AH Goaloo price and market-level locks [skip ci]'
          git push origin HEAD:work/nomad342-ah-goaloo-market-lock
