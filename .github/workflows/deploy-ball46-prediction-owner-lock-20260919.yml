name: Deploy Ball46 NEXT Shared Live Evidence 20260919

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ball46-prediction-owner-lock-20260919.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_BRANCH: work/ball46-live-prediction-percent-20260919
  BALL46_URL: https://ball46.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-next-shared-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Ball46 working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0
      - name: Run scoped presentation deploy
        shell: bash
        run: |
          git show origin/main:.github/scripts/ball46-next-shared-evidence-20260919.sh > /tmp/ball46-next-shared-evidence.sh
          chmod +x /tmp/ball46-next-shared-evidence.sh
          /tmp/ball46-next-shared-evidence.sh
