name: BALL46 verify and start existing test ledger
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-test-ledger-verify.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ball46-frozen-1x2-test-picks
          run-id: 44766282517
          github-token: ${{ github.token }}
          path: frozen
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import crypto from 'node:crypto';import assert from 'node:assert/strict';
          const secret=crypto.createHmac('sha256',process.env.CLOUDFLARE_API_TOKEN).update('BALL46_PREMATCH_ONLY_V1').digest('hex');
          const host='https://ball46-prematch-only-test-20261120.mccarey-supon.workers.dev',ui='https://ball46-prematch-ui-test-v5-20261120.mccarey-supon.workers.dev';
          const req=async(p,body)=>{const r=await fetch(host+p,{method:body?'POST':'GET',headers:{authorization:'Bearer '+secret,'content-type':'application/json'},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(12000)});return {status:r.status,body:await r.text()}};
          const frozen=JSON.parse(fs.readFileSync('frozen/1x2-test-picks.json','utf8'));assert.equal(frozen.picks.length,8);assert.equal(frozen.source,'ACTIVE_TEST_BOT');
          let l;for(let i=0;i<20;i++){const r=await req('/test-ledger');console.log('LEDGER_GET '+r.status);if(r.status===200){l=JSON.parse(r.body);break}await new Promise(r=>setTimeout(r,2000))}
          assert(l,'LEDGER_NOT_ACTIVE');
          const seeded=await req('/test-ledger-start',{picks:frozen.picks});assert.equal(seeded.status,200,seeded.body);const s=JSON.parse(seeded.body);assert(!s.error&&s.stats.total>=8);console.log('LEDGER_STARTED '+JSON.stringify({recorded:s.recorded,stats:s.stats,rows:s.rows.map(r=>({id:r.fixture_id,status:r.status,home:r.home,away:r.away}))}));
          const run=await req('/bot-run',{});assert.equal(run.status,200);assert.equal(JSON.parse(run.body).autoVersion,'auto-shadow-market-1x2-v1');
          const page=await fetch(ui);const html=await page.text();const d=await(await fetch(ui+'/prematch-data')).json();assert(page.ok&&html.includes('pm-ledger-client')&&d.testLedger?.stats?.total>=8,'UI_LEDGER_NOT_ACTIVE');console.log('UI_LEDGER_VERIFIED '+JSON.stringify({url:ui,stats:d.testLedger.stats,providerCalls:0,published:0}));
          JS
