name: Release BALL46 Pinned Fixtures V2 20261111
on:
  push:
    branches: [release/ball46-pinned-fixtures-v2-20261111]
    paths: ['pinned-fixtures-v2-production/RELEASE_READY']
permissions: {contents: read}
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: release/ball46-pinned-fixtures-v2-20261111}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Preflight source syntax
        run: |
          node --check pinned-fixtures-v2-production/audit.mjs
          node --check pinned-fixtures-v2-production/deploy.mjs
          node --check pinned-fixtures-v2-production/verify.mjs
          node --check pinned-fixtures-v2-production/rollback.mjs
      - name: Re-audit active Production immediately before release
        run: node pinned-fixtures-v2-production/audit.mjs
      - name: Install browser QA
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Deploy guarded Pinned Fixtures V2
        run: node pinned-fixtures-v2-production/deploy.mjs
      - name: Verify Pinned Fixtures V2 desktop mobile and lifecycle
        run: node pinned-fixtures-v2-production/verify.mjs
      - name: Verify Full Market patches preserved
        run: node fullmarket-dark10-yellow-dot-20261111/verify.mjs
      - name: Upload Production QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-fixtures-v2-production-${{ github.run_id }}
          path: pinned-fixtures-v2-production/*-production.png
          retention-days: 7
      - name: Roll back if any post-deploy step failed
        if: failure()
        run: node pinned-fixtures-v2-production/rollback.mjs
