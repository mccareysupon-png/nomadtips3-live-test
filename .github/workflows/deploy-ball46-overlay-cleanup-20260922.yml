name: Deploy Ball46 Overlay Cleanup 20260922

on:
  push:
    branches: [fix/ball46-overlay-cleanup-20260922]
    paths:
      - 'nomad-live-343/ui-sync-fixes-343.js'
      - 'nomad-live-343/ui-sync-fixes-343.css'
      - 'nomad-live-343/event-flow-icons-343.js'
      - 'nomad-live-343/workspace-route-guard-343.js'
      - '.github/workflows/deploy-ball46-overlay-cleanup-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  GOLDEN_SHA: ad34452074b300787c91c7788c02d0e242854d0d

jobs:
  cleanup-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Preflight exact scope
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$GOLDEN_SHA^{commit}"
          for p in \
            workers/nomadtips3-343-preview/src/index.js \
            workers/nomadtips3-343-preview/wrangler.ball46.jsonc \
            workers/nomadtips3-engine-343/src/index.js \
            nomad-live-343/dashboard-v2-stage3.js \
            nomad-live-343/dashboard-v2-tune.js \
            nomad-live-343/bulk-odds-compat-343.js \
            nomad-live-343/expanded-match-343.js \
            nomad-live-343/full-market-bookmaker-343.js \
            nomad-live-343/live-summary-full-odds-343.js \
            nomad-live-343/signal-next.js \
            nomad-live-343/singlepage-workspace-343.js; do
            git diff --quiet "$GOLDEN_SHA"..HEAD -- "$p" || { echo "PROTECTED_SOURCE_CHANGED:$p"; exit 1; }
          done
          node --check nomad-live-343/ui-sync-fixes-343.js
          node --check nomad-live-343/event-flow-icons-343.js
          node --check nomad-live-343/workspace-route-guard-343.js
          ! grep -Fq 'HISTORY_API' nomad-live-343/ui-sync-fixes-343.js
          ! grep -Fq 'renderSignalFlow' nomad-live-343/ui-sync-fixes-343.js
          ! grep -Fq 'data-b46-signal-flow' nomad-live-343/ui-sync-fixes-343.js
          ! grep -Fq 'next-signal-card' nomad-live-343/event-flow-icons-343.js
          ! grep -Fq 'ball46:signals-snapshot' nomad-live-343/event-flow-icons-343.js
          ! grep -Fq 'fetch(' nomad-live-343/event-flow-icons-343.js
          ! grep -Fq '/api/' nomad-live-343/event-flow-icons-343.js
          ! grep -Fq 'fetch(' nomad-live-343/workspace-route-guard-343.js
          grep -Fq '.stat-track.away i{background:#e2c94c!important}' nomad-live-343/ui-sync-fixes-343.css
          grep -Fq '.next-bar.away i{background:#e2c94c!important}' nomad-live-343/ui-sync-fixes-343.css
          ! grep -Fq 'b46-signal-flow-card' nomad-live-343/ui-sync-fixes-343.css
          git diff --check

      - name: Mirror exact current Production baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod
          fetch_optional(){
            name="$1"; safe="${name//\//_}"
            code=$(curl -sS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 -o "/tmp/prod/$safe" -w '%{http_code}' "$BALL46_WORKER/$name?cleanup-copy=${GITHUB_RUN_ID}") || true
            [ "$code" = 200 ] || return 0
            test -s "/tmp/prod/$safe" || return 0
            mkdir -p "$(dirname "nomad-live-343/$name")"
            cp "/tmp/prod/$safe" "nomad-live-343/$name"
          }
          fetch_required(){
            name="$1"; safe="${name//\//_}"
            code=$(curl -sS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 -o "/tmp/prod/$safe" -w '%{http_code}' "$BALL46_WORKER/$name?cleanup-required=${GITHUB_RUN_ID}") || true
            [ "$code" = 200 ] || { echo "REQUIRED_PROD_ASSET_HTTP_${code}:$name"; exit 1; }
            test -s "/tmp/prod/$safe" || { echo "REQUIRED_PROD_ASSET_EMPTY:$name"; exit 1; }
            mkdir -p "$(dirname "nomad-live-343/$name")"
            cp "/tmp/prod/$safe" "nomad-live-343/$name"
          }
          while IFS= read -r f; do
            name="${f#nomad-live-343/}"
            case "$name" in ui-sync-fixes-343.js|ui-sync-fixes-343.css|event-flow-icons-343.js|workspace-route-guard-343.js|event-flow-bars-343.js|event-flow-bars-343.css) continue ;; esac
            case "$name" in *.html|*.js|*.css|*.svg|*.json|*.png|*.webp|*.jpg|*.jpeg|*.ico) fetch_optional "$name" ;; esac
          done < <(find nomad-live-343 -maxdepth 1 -type f | sort)
          fetch_required index.html
          cp nomad-live-343/index.html /tmp/index.before.html
          python3 - <<'PY' > /tmp/index-assets.txt
          from pathlib import Path
          import re
          h=Path('/tmp/index.before.html').read_text(errors='ignore')
          found=set()
          for x in re.findall(r'''(?:src|href)=["']([^"']+)["']''',h,re.I):
              x=x.split('?',1)[0].split('#',1)[0].strip().lstrip('./').lstrip('/')
              if not x or '://' in x or '/' in x: continue
              if re.search(r'\.(?:js|css|svg|json|png|webp|jpg|jpeg|ico)$',x,re.I): found.add(x)
          for x in sorted(found): print(x)
          PY
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            case "$name" in ui-sync-fixes-343.js|ui-sync-fixes-343.css|event-flow-icons-343.js|workspace-route-guard-343.js|event-flow-bars-343.js|event-flow-bars-343.css) continue ;; esac
            fetch_required "$name"
          done < /tmp/index-assets.txt
          protected='dashboard-v2.css dashboard-v2-stage3.js dashboard-v2-tune.js v2-shared.css v2-shared.js bulk-odds-compat-343.js expanded-match-343.js full-market-bookmaker-343.js live-summary-full-odds-343.js signal-next.js singlepage-workspace-343.js singlepage-workspace-343.css'
          : > /tmp/protected.sha
          for f in $protected; do
            fetch_required "$f"
            printf '%s  %s\n' "$(sha256sum "nomad-live-343/$f" | awk '{print $1}')" "$f" >> /tmp/protected.sha
          done
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?cleanup-before=${GITHUB_RUN_ID}" -o /tmp/board-before.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?cleanup-before=${GITHUB_RUN_ID}" -o /tmp/signals-before.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/statistics?cleanup-before=${GITHUB_RUN_ID}" -o /tmp/stats-before.json
          node - <<'NODE'
          const fs=require('fs'),b=JSON.parse(fs.readFileSync('/tmp/board-before.json')),s=JSON.parse(fs.readFileSync('/tmp/signals-before.json')),t=JSON.parse(fs.readFileSync('/tmp/stats-before.json'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures))throw Error('PRE_BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals))throw Error('PRE_SIGNALS_UNHEALTHY');
          if(t?.ok!==true||!Array.isArray(t?.rows))throw Error('PRE_STATS_UNHEALTHY');
          NODE

      - name: Remove conflicting overlays and inject clean scoped set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('nomad-live-343/index.html'); h=p.read_text()
          names=['event-flow-bars-343.css','event-flow-bars-343.js','event-flow-icons-343.js','ui-sync-fixes-343.css','ui-sync-fixes-343.js','workspace-route-guard-343.js']
          for name in names:
              h=re.sub(r'\s*<link[^>]+(?:href=["\'][^"\']*'+re.escape(name)+r'[^"\']*["\'])[^>]*>','',h,flags=re.I)
              h=re.sub(r'\s*<script[^>]+(?:src=["\'][^"\']*'+re.escape(name)+r'[^"\']*["\'])[^>]*></script>','',h,flags=re.I)
          if '</head>' not in h or '</body>' not in h: raise SystemExit('INDEX_ANCHOR_MISSING')
          head='<script src="workspace-route-guard-343.js?v=343-route-guard-20260922b"></script>\n<link rel="stylesheet" href="ui-sync-fixes-343.css?v=343-ui-sync-20260922b">'
          body='<script src="event-flow-icons-343.js?v=343-event-icons-page1-20260922b" defer></script>\n<script src="ui-sync-fixes-343.js?v=343-ui-sync-20260922b" defer></script>'
          h=h.replace('</head>',head+'\n</head>',1).replace('</body>',body+'\n</body>',1)
          p.write_text(h)
          PY
          for f in ui-sync-fixes-343.js event-flow-icons-343.js workspace-route-guard-343.js; do node --check "nomad-live-343/$f"; done
          while read -r expected f; do
            actual=$(sha256sum "nomad-live-343/$f" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "PROTECTED_LOCAL_CHANGED:$f"; exit 1; }
          done < /tmp/protected.sha
          test "$(grep -o 'workspace-route-guard-343.js' nomad-live-343/index.html | wc -l)" -eq 1
          test "$(grep -o 'event-flow-icons-343.js' nomad-live-343/index.html | wc -l)" -eq 1
          test "$(grep -o 'ui-sync-fixes-343.js' nomad-live-343/index.html | wc -l)" -eq 1
          test "$(grep -o 'ui-sync-fixes-343.css' nomad-live-343/index.html | wc -l)" -eq 1
          ! grep -Fq 'event-flow-bars-343' nomad-live-343/index.html

      - name: Dry run Production package
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy cleanup
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify exact Production result
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 15); do
            if curl -fsS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 "$BALL46_WORKER/index.html?cleanup-after=${GITHUB_RUN_ID}-${n}" -o /tmp/index.after.html \
              && grep -Fq 'workspace-route-guard-343.js?v=343-route-guard-20260922b' /tmp/index.after.html \
              && grep -Fq 'event-flow-icons-343.js?v=343-event-icons-page1-20260922b' /tmp/index.after.html \
              && grep -Fq 'ui-sync-fixes-343.js?v=343-ui-sync-20260922b' /tmp/index.after.html; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo 'CLEANUP_MARKERS_NOT_PROPAGATED'; exit 1; }
          test "$(grep -o 'workspace-route-guard-343.js' /tmp/index.after.html | wc -l)" -eq 1
          test "$(grep -o 'event-flow-icons-343.js' /tmp/index.after.html | wc -l)" -eq 1
          test "$(grep -o 'ui-sync-fixes-343.js' /tmp/index.after.html | wc -l)" -eq 1
          test "$(grep -o 'ui-sync-fixes-343.css' /tmp/index.after.html | wc -l)" -eq 1
          ! grep -Fq 'event-flow-bars-343' /tmp/index.after.html
          for f in ui-sync-fixes-343.js event-flow-icons-343.js workspace-route-guard-343.js; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/$f?cleanup-verify=${GITHUB_RUN_ID}" -o "/tmp/$f"
            node --check "/tmp/$f"
          done
          ! grep -Fq 'renderSignalFlow' /tmp/ui-sync-fixes-343.js
          ! grep -Fq 'HISTORY_API' /tmp/ui-sync-fixes-343.js
          ! grep -Fq 'next-signal-card' /tmp/event-flow-icons-343.js
          ! grep -Fq 'ball46:signals-snapshot' /tmp/event-flow-icons-343.js
          while read -r expected f; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/$f?cleanup-protected=${GITHUB_RUN_ID}" -o "/tmp/protected-$f"
            actual=$(sha256sum "/tmp/protected-$f" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "PROTECTED_DEPLOYED_CHANGED:$f"; exit 1; }
          done < /tmp/protected.sha
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?cleanup-final=${GITHUB_RUN_ID}" -o /tmp/board-after.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?cleanup-final=${GITHUB_RUN_ID}" -o /tmp/signals-after.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/statistics?cleanup-final=${GITHUB_RUN_ID}" -o /tmp/stats-after.json
          node - <<'NODE'
          const fs=require('fs'),b=JSON.parse(fs.readFileSync('/tmp/board-after.json')),s=JSON.parse(fs.readFileSync('/tmp/signals-after.json')),t=JSON.parse(fs.readFileSync('/tmp/stats-after.json'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures))throw Error('POST_BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals))throw Error('POST_SIGNALS_UNHEALTHY');
          if(t?.ok!==true||!Array.isArray(t?.rows))throw Error('POST_STATS_UNHEALTHY');
          console.log('BALL46_OVERLAY_CLEANUP_OK',{fixtures:b.fixtures.length,signals:s.signals.length,stats:t.rows.length});
          NODE
