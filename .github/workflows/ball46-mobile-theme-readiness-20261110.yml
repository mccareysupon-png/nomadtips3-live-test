name: BALL46 mobile deploy readiness READ ONLY
on:
  push:
    branches: [codex/ball46-favorites-test-20261110]
    paths: ['work/mobile-theme-fix-test-20261110/readiness-request.json']
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read active versions and existing Engine memory logs only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node work/mobile-theme-fix-test-20261110/readiness.mjs
      - name: Store readiness proof only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/mobile-theme-fix-test-20261110/readiness/report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record current mobile deploy readiness without Production changes [skip ci]"
          git push origin HEAD:codex/ball46-favorites-test-20261110
