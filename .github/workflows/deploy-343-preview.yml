name: Deploy NOMAD 3.43 Preview — QUARANTINED

on:
  push:
    branches: [work/nomad343-clean-bet365-ui]
    paths:
      - 'nomad-live-343/**'
      - 'workers/nomadtips3-5usd-hub-343/**'
      - 'workers/nomadtips3-engine-343/**'
      - 'workers/nomadtips3-343-preview/**'
      - '.github/workflows/deploy-343-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked-legacy-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Block superseded 3.43 deployment path
        run: |
          echo 'BLOCKED: work/nomad343-clean-bet365-ui is a superseded 3.43 deployment branch.'
          echo 'Reason: this branch deploys legacy Engine v3, binds the provider key to the Engine referee, and restores FULL_MARKET wiring.'
          echo 'Use fix/343-bulk-only-standard-20260915 for runtime deployment and work/nomad343-dashboard-v2-bulk-20260915 for Dashboard V2 preview.'
          exit 1
