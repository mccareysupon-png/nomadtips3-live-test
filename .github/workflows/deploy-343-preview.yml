name: Deploy NOMAD 3.43 Preview

on:
  push:
    branches: [work/nomad343-clean-bet365-ui]
    paths:
      - 'nomad-live-343/**'
      - 'workers/nomadtips3-5usd-hub-343/**'
      - 'workers/nomadtips3-engine-343/**'
      - 'workers/nomadtips3-343-preview/**'
      - '.github/workflows/deploy-343-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
  PREVIEW_URL: https://nomadtips3-343-preview.mccarey-supon.workers.dev
  HUB_URL: https://nomadtips3-5usd-hub-343.mccarey-supon.workers.dev

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate 3.43 isolated scope
        run: |
          set -euo pipefail
          node --check nomad-live-343/ui.js
          node --check nomad-live-343/live.js
          node --check nomad-live-343/event-flow-343.js
          node --check nomad-live-343/bet365-board.js
          node --check nomad-live-343/signal.js
          node --check nomad-live-343/statistics.js
          node --check nomad-live-343/settings.js
          node --check workers/nomadtips3-5usd-hub-343/src/index-v2.js
          node --check workers/nomadtips3-engine-343/src/market-core.js
          node --check workers/nomadtips3-engine-343/src/index.js
          node --check workers/nomadtips3-343-preview/src/index.js
          node workers/nomadtips3-engine-343/test/market-core.test.mjs
          test -s nomad-live-343/index.html
          test -s nomad-live-343/event-flow-343.js
          test -s nomad-live-343/event-flow-343.css
          test -s nomad-live-343/signal.html
          test -s nomad-live-343/signal-compact-343.css
          test -s nomad-live-343/statistics.html
          grep -Fq '/api/engine/history' nomad-live-343/event-flow-343.js
          grep -Fq "const VERSION='343-flow-v3-stable-momentum'" nomad-live-343/event-flow-343.js
          grep -Fq 'const EMA_ALPHA=.48' nomad-live-343/event-flow-343.js
          grep -Fq 'const MOMENTUM_CAPS_5=' nomad-live-343/event-flow-343.js
          grep -Fq 'points.map((p,i)=>num(p.at)??i)' nomad-live-343/event-flow-343.js
          grep -Fq 'data-event-flow-fixture' nomad-live-343/live.js
          grep -Fq 'data-event-flow-fixture' nomad-live-343/signal.js
          grep -Fq 'groupMatches' nomad-live-343/signal.js
          grep -Fq 'const HISTORY_MS=180*60_000' workers/nomadtips3-engine-343/src/index.js
          grep -Fq 'const MAX_HISTORY_ROWS=180' workers/nomadtips3-engine-343/src/index.js
          grep -Fq "u.pathname==='/history'" workers/nomadtips3-engine-343/src/index.js
          grep -Fq "'/history'" workers/nomadtips3-engine-343/src/index.js
          grep -Fq 'main = "src/index.js"' workers/nomadtips3-engine-343/wrangler.toml
          grep -Fq "engineRequest(request, '/signals')" workers/nomadtips3-343-preview/src/index.js
          grep -Fq "engineRequest(request, '/board')" workers/nomadtips3-343-preview/src/index.js
          if grep -Fq "engineRequest(request, '/statistics')" workers/nomadtips3-343-preview/src/index.js; then exit 1; fi
          grep -Fq "mirrorState: 'LIVE'" workers/nomadtips3-343-preview/src/index.js

      - name: Validate deploy credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$FIVEDOLLAR_API_KEY"

      - name: Dry-run HUB
        working-directory: workers/nomadtips3-5usd-hub-343
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.toml
      - name: Deploy 5USD HUB
        working-directory: workers/nomadtips3-5usd-hub-343
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.toml
      - name: Bind 5USD API key to HUB
        working-directory: workers/nomadtips3-5usd-hub-343
        run: printf '%s' "$FIVEDOLLAR_API_KEY" | npx --yes wrangler@4.92.0 secret put FIVEDOLLAR_API_KEY --config wrangler.toml

      - name: Dry-run 3.43 Engine
        working-directory: workers/nomadtips3-engine-343
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.toml
      - name: Deploy 3.43 Engine
        working-directory: workers/nomadtips3-engine-343
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.toml
      - name: Bind 5USD API key to Engine referee
        working-directory: workers/nomadtips3-engine-343
        run: printf '%s' "$FIVEDOLLAR_API_KEY" | npx --yes wrangler@4.92.0 secret put FIVEDOLLAR_API_KEY --config wrangler.toml

      - name: Dry-run 3.43 preview
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc
      - name: Deploy 3.43 preview
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Smoke full 3.43 flow
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$HUB_URL/snapshot?smoke=$RANDOM" -o /tmp/hub.json
          node -e 'const j=require("/tmp/hub.json");if(j.ok!==true||j.version!=="nomad343-5usd-hub-v3")throw Error("HUB mismatch");console.log("HUB",j.fixtureCount,j.counts,j.include)'

          curl -fsS --max-time 30 "$PREVIEW_URL/api/engine/registry?smoke=$RANDOM" -o /tmp/registry.json
          curl -fsS --max-time 30 "$PREVIEW_URL/api/engine/board?smoke=$RANDOM" -o /tmp/board.json
          curl -fsS --max-time 30 "$PREVIEW_URL/api/engine/health?smoke=$RANDOM" -o /tmp/engine.json
          curl -fsS --max-time 30 "$PREVIEW_URL/api/engine/signals?smoke=$RANDOM" -o /tmp/signals.json
          node -e 'const fs=require("fs"),r=require("/tmp/registry.json"),b=require("/tmp/board.json"),h=require("/tmp/engine.json"),s=require("/tmp/signals.json");if(r.ok!==true||!Array.isArray(r.marketKeys)||r.marketKeys.length!==18)throw Error("registry");if(b.ok!==true)throw Error("board");if(h.component!=="NOMAD343_ENGINE"||h.version!=="nomad343-engine-v2-all-markets")throw Error("health");if(s.ok!==true||!Array.isArray(s.signals))throw Error("signals");const ids=new Set();for(const x of s.signals){if(String(x.status||"").toUpperCase()==="SETTLED")throw Error("settled leak");if(x.mirrorState!=="LIVE"||x.mirrorSource!=="ENGINE_BOARD_LIVE")throw Error("non-live leak");ids.add(String(x.fixtureId))}if(Number(s.mirror?.activeSignals)!==s.signals.length||Number(s.mirror?.activeMatches)!==ids.size)throw Error("active counts");const f=Array.isArray(b.fixtures)?b.fixtures:[],live=f.find(x=>x?.fixtureId&&String(x.boardState||"").toLowerCase()==="live"),pick=live||f.find(x=>x?.fixtureId)||null;fs.writeFileSync("/tmp/fixture-id",pick?String(pick.fixtureId):"");console.log("ENGINE",h.fixtureCount,h.liveCount,h.signalCount,"markets",r.marketKeys.length);console.log("ACTIVE_SIGNAL_BOARD",ids.size,"matches",s.signals.length,"signals","hidden stale",s.mirror?.hiddenPendingSignals||0)'

          FIXTURE_ID="$(cat /tmp/fixture-id)"
          if [ -n "$FIXTURE_ID" ]; then
            curl -fsS --max-time 30 "$PREVIEW_URL/api/engine/history?fixtureId=$FIXTURE_ID&window=10&smoke=$RANDOM" -o /tmp/history.json
            node -e 'const j=require("/tmp/history.json");if(j.ok!==true||j.version!=="nomad343-flow-history-v1")throw Error("history");if(!Array.isArray(j.rows)||!Array.isArray(j.pressure))throw Error("shape");if(j.retainedMinutes!==180||j.maxRows!==180)throw Error("retention");console.log("EVENT_FLOW_HISTORY",j.fixtureId,j.rows.length,"raw rows")'
          fi

          for path in / /signal.html /signal-compact-343.css /event-flow-343.js /event-flow-343.css /statistics.html /statistics-page-343.css /settings.html /live.js /bet365-board.js /signal.js /statistics.js /settings.js /api/engine/settings /api/engine/registry /api/engine/signals /api/engine/statistics; do
            code="$(curl -L -sS --max-time 30 -o /tmp/page -w '%{http_code}' "$PREVIEW_URL$path?smoke=$RANDOM$RANDOM")"
            echo "$path -> HTTP $code"
            test "$code" = "200"
          done

      - name: Verify Active Signal Board and Event Flow
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -D /tmp/live.headers "$PREVIEW_URL/?verify=$RANDOM" -o /tmp/live.html
          grep -Fqi 'x-nomad-live-revision: 343-live-flow-v3' /tmp/live.headers
          grep -Fq 'event-flow-343.css?v=343-flow-v3' /tmp/live.html
          grep -Fq 'event-flow-343.js?v=343-flow-v3' /tmp/live.html
          grep -Fq 'live.js?v=343-public-v3-flow' /tmp/live.html

          curl -fsS --max-time 30 -D /tmp/flow.headers "$PREVIEW_URL/event-flow-343.js?verify=$RANDOM" -o /tmp/flow.js
          grep -Fqi 'cache-control: no-store, no-cache, must-revalidate, max-age=0' /tmp/flow.headers
          grep -Fq '/api/engine/history' /tmp/flow.js
          grep -Fq '343-flow-v3-stable-momentum' /tmp/flow.js
          grep -Fq 'ATTACK MOMENTUM' /tmp/flow.js
          grep -Fq 'EMA_ALPHA=.48' /tmp/flow.js
          grep -Fq 'MOMENTUM_CAPS_5' /tmp/flow.js
          grep -Fq 'points.map((p,i)=>num(p.at)??i)' /tmp/flow.js
          curl -fsS --max-time 30 "$PREVIEW_URL/event-flow-343.css?verify=$RANDOM" -o /tmp/flow.css
          grep -Fq 'stroke-width:.48' /tmp/flow.css
          grep -Fq '@keyframes nomad-flow-pulse' /tmp/flow.css
          grep -Fq 'background:#020302' /tmp/flow.css

          curl -fsS --max-time 30 -D /tmp/signal.headers "$PREVIEW_URL/signal.html?verify=$RANDOM" -o /tmp/signal.html
          grep -Fqi 'x-nomad-signal-revision: 343-signal-flow-v3' /tmp/signal.headers
          grep -Fq 'name="nomad-signal-revision" content="343-signal-flow-v3"' /tmp/signal.html
          grep -Fq 'event-flow-343.js?v=343-flow-v3' /tmp/signal.html
          grep -Fq 'signal.js?v=343-signal-flow-v3' /tmp/signal.html
          grep -Fq 'ไม่มี Active Signal = ไม่มีการ์ดค้าง' /tmp/signal.html
          curl -fsS --max-time 30 "$PREVIEW_URL/signal.js?verify=$RANDOM" -o /tmp/signal.js
          grep -Fq 'groupMatches' /tmp/signal.js
          grep -Fq 'LIVE NOW' /tmp/signal.js
          grep -Fq 'ENTRY SNAPSHOT' /tmp/signal.js
          grep -Fq 'data-event-flow-fixture' /tmp/signal.js
          if grep -Fq 'FT' /tmp/signal.js; then exit 1; fi

          curl -fsS --max-time 30 "$PREVIEW_URL/statistics.html?verify=$RANDOM" -o /tmp/stat.html
          if grep -Fq 'MATCH EVIDENCE' /tmp/stat.html; then exit 1; fi

          curl -fsS --max-time 30 "$PREVIEW_URL/api/engine/signals?verify=$RANDOM" -o /tmp/active.json
          node -e 'const j=require("/tmp/active.json");if(j.ok!==true||!Array.isArray(j.signals))throw Error("signal API");const ids=new Set();for(const s of j.signals){if(s.mirrorState!=="LIVE"||String(s.status||"").toUpperCase()==="SETTLED")throw Error("page2 state");if(!("liveStatistics" in s)||!("liveEvents" in s))throw Error("live payload");ids.add(String(s.fixtureId))}if(Number(j.mirror?.activeMatches)!==ids.size)throw Error("match count");console.log("ACTIVE_SIGNAL_BOARD_VERIFIED",ids.size,"MATCHES",j.signals.length,"SIGNALS","HIDDEN_PENDING",j.mirror?.hiddenPendingSignals||0)'

          echo 'EVENT_FLOW_DEPLOY_VERIFIED 343-flow-v3-stable-momentum SIGNAL=343-signal-flow-v3'