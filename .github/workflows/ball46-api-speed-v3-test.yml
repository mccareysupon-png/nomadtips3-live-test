name: BALL46 real manual Bulk control V3 tests no deployment
on:
  push:
    branches: [codex/ball46-owner-control-v2-20261103]
    paths: ['work/api-speed-v3/test-request.json']
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: work/ball46-5usd-latency-control-20261102
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false --prefix ../api-speed-v3 playwright@1.56.1
      - run: node production-preflight.mjs
      - run: node ../api-speed-v3/capture-owner.mjs
      - name: Build only against exact current Production source
        run: |
          node ../api-settings-v2/prepare.mjs
          node ../api-speed-v3/build.mjs
          node ../api-speed-v3/build-ui.mjs
          node --check ../api-speed-v3/stage/hub.mjs
          node --check ../api-speed-v3/stage/admin-entry.mjs
          node ../api-speed-v3/policy.test.mjs > production-audit/api-speed-v3-policy-tests.txt
          node ../api-speed-v3/integration.test.mjs > production-audit/api-speed-v3-integration-tests.txt
      - name: Verify manual modes, DEFAULT, quota and recovery on PC/mobile
        run: |
          ../api-speed-v3/node_modules/.bin/playwright install --with-deps chromium
          node ../api-speed-v3/browser-check.mjs
      - name: Preserve sanitized tests and restore points
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-audit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record manual Bulk controller tests and exact current restore points [skip ci]"
          git push origin HEAD:codex/ball46-owner-control-v2-20261103
