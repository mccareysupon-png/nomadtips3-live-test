name: BALL46 Event Flow lanes preflight
on:
  push:
    branches: [codex/ball46-event-flow-lanes-20261027]
    paths: ['deploy-assets/event-flow-lanes-20261027/probe.mjs']
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node probe.mjs
        working-directory: deploy-assets/event-flow-lanes-20261027
      - if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy-assets/event-flow-lanes-20261027/audit-last
          git commit -m 'Record Event Flow read-only preflight [skip ci]'
          git push
