name: Patch 3.43 OVER Score Gap Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-343-over-gap-once.yml'

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
  ENGINE_URL: https://nomadtips3-343-auto-engine.mccarey-supon.workers.dev

jobs:
  patch-test-deploy-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch 3.43 OVER gap only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              count=s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:140]!r}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # 3.43 Settings UI: fixed Over ceiling -> score-aware line gap.
          replace_one(
              'nomad-live-343/settings.html',
              '      <label><span>เส้น Over ไม่เกิน</span><input name="lineMax" type="number" min="0.5" max="10" step="0.5" required></label>',
              '      <label><span>ระยะห่าง Over Line จากสกอร์รวม ไม่เกิน</span><select name="lineGapMax" required><option value="0.5">0.5</option><option value="1">1.0</option><option value="1.5">1.5</option><option value="2">2.0</option><option value="2.5">2.5</option><option value="999">ไม่จำกัด</option></select><small>ระบบคำนวณ Over Line − ประตูรวมปัจจุบันอัตโนมัติ · เช่น 3-1 / O4.5 = ระยะห่าง 0.5</small></label>'
          )
          replace_one(
              'nomad-live-343/settings.html',
              'settings.js?v=20260910-343-server-v1',
              'settings.js?v=20260911-343-over-gap-v1'
          )

          # Browser settings/defaults/migration/validation.
          replace_one(
              'nomad-live-343/settings.js',
              ' over:{lineMin:0.5,lineMax:10,oddsMin:1.50,shotOnTarget:1,shotOff:1,corner:1,dangerousAttackPct:55,attackPct:55,possessionPct:50,evidenceRequired:3,minuteFrom:55,minuteTo:88,rollingWindowMinutes:10},',
              ' over:{lineMin:0.5,lineGapMax:0.5,oddsMin:1.50,shotOnTarget:1,shotOff:1,corner:1,dangerousAttackPct:55,attackPct:55,possessionPct:50,evidenceRequired:3,minuteFrom:55,minuteTo:88,rollingWindowMinutes:10},'
          )
          replace_one(
              'nomad-live-343/settings.js',
              "function mergeSettings(raw){const out={};for(const m of MARKETS)out[m]={...clone(DEFAULTS[m]),...(raw?.[m]||{})};return out}",
              "function mergeSettings(raw){const out={};for(const m of MARKETS){out[m]={...clone(DEFAULTS[m]),...(raw?.[m]||{})};if(m==='over')delete out[m].lineMax}return out}"
          )
          replace_one(
              'nomad-live-343/settings.js',
              "if(m==='over'&&c.lineMin>c.lineMax)e.push('เส้น Over ตั้งแต่ ต้องไม่มากกว่า เส้น Over ไม่เกิน');return e}",
              "if(m==='over'&&![0.5,1,1.5,2,2.5,999].includes(Number(c.lineGapMax)))e.push('ระยะห่าง Over Line จากสกอร์รวม ต้องเลือก 0.5, 1.0, 1.5, 2.0, 2.5 หรือไม่จำกัด');return e}"
          )

          # Pure helper so score/line gap math is independently testable.
          helper=Path('workers/nomadtips3-343-auto-engine/src/over-gap.js')
          helper.write_text("""const finite=value=>value!==null&&value!==undefined&&value!==''&&Number.isFinite(Number(value))?Number(value):null;

export function currentGoalTotal(score){
  const home=finite(score?.home??score?.[0]),away=finite(score?.away??score?.[1]);
  return home===null||away===null?null:home+away;
}

export function overLineGap(line,score){
  const n=finite(line),total=currentGoalTotal(score);
  if(n===null||total===null||!Number.isInteger(n*4))return null;
  const gap=Number((n-total).toFixed(2));
  return gap<0?null:gap;
}

export function overGapPass(line,score,maxGap){
  const gap=overLineGap(line,score),limit=finite(maxGap);
  return gap!==null&&limit!==null&&(limit===999||gap<=limit);
}
""",encoding='utf-8')

          # 3.43 server engine: use gap at pre-filter and Bet365 referee gate.
          replace_one(
              'workers/nomadtips3-343-auto-engine/src/index.js',
              "import { DurableObject } from 'cloudflare:workers';",
              "import { DurableObject } from 'cloudflare:workers';\nimport { overLineGap, overGapPass } from './over-gap.js';"
          )
          replace_one(
              'workers/nomadtips3-343-auto-engine/src/index.js',
              '  over:{lineMin:0.5,lineMax:10,oddsMin:1.50,shotOnTarget:1,shotOff:1,corner:1,dangerousAttackPct:55,attackPct:55,possessionPct:50,evidenceRequired:3,minuteFrom:55,minuteTo:88,rollingWindowMinutes:10},',
              '  over:{lineMin:0.5,lineGapMax:0.5,oddsMin:1.50,shotOnTarget:1,shotOff:1,corner:1,dangerousAttackPct:55,attackPct:55,possessionPct:50,evidenceRequired:3,minuteFrom:55,minuteTo:88,rollingWindowMinutes:10},'
          )
          replace_one(
              'workers/nomadtips3-343-auto-engine/src/index.js',
              "  if(market==='over'&&(line<Number(cfg.lineMin)||line>Number(cfg.lineMax)))return {pass:false,stage:'LINE',side,evidence:ev,line};",
              "  if(market==='over'){if(line<Number(cfg.lineMin))return {pass:false,stage:'LINE_MIN',side,evidence:ev,line};const lineGap=overLineGap(line,f.goals);if(!overGapPass(line,f.goals,cfg.lineGapMax))return {pass:false,stage:lineGap===null?'LINE_GAP_UNAVAILABLE':'LINE_GAP',side,evidence:ev,line,lineGap};return {pass:true,stage:'PREPASS',side,evidence:ev,line,lineGap};}"
          )
          replace_one(
              'workers/nomadtips3-343-auto-engine/src/index.js',
              "function pricePass(market,cfg,price){if(price?.odds===null||price?.odds===undefined||price.odds<Number(cfg.oddsMin))return false;if(market==='over')return price.line!==null&&price.line>=Number(cfg.lineMin)&&price.line<=Number(cfg.lineMax);if(market==='under'||market==='ah')return price.line!==null&&price.line>=Number(cfg.lineMin);return true}",
              "function pricePass(market,cfg,price,score){if(price?.odds===null||price?.odds===undefined||price.odds<Number(cfg.oddsMin))return false;if(market==='over')return price.line!==null&&price.line>=Number(cfg.lineMin)&&overGapPass(price.line,score,cfg.lineGapMax);if(market==='under'||market==='ah')return price.line!==null&&price.line>=Number(cfg.lineMin);return true}"
          )
          replace_one(
              'workers/nomadtips3-343-auto-engine/src/index.js',
              "function sanitizeSettings(input,current=DEFAULT_SETTINGS){const out=clone(current);for(const market of Object.keys(DEFAULT_SETTINGS))if(input?.[market]&&typeof input[market]==='object')out[market]={...out[market],...input[market]};return out}",
              "function sanitizeSettings(input,current=DEFAULT_SETTINGS){const out=clone(current);for(const market of Object.keys(DEFAULT_SETTINGS))if(input?.[market]&&typeof input[market]==='object')out[market]={...out[market],...input[market]};delete out.over.lineMax;return out}"
          )
          replace_one(
              'workers/nomadtips3-343-auto-engine/src/index.js',
              "if(best)preCandidates.push({fixtureId:f.fixtureId,market,side:best.side,minute:f.minute,home:f.home.name,away:f.away.name,league:f.league.name,score:f.goals,evidence:best.evidence,price:best.price??null,line:best.line??null,observedAt:t});",
              "if(best)preCandidates.push({fixtureId:f.fixtureId,market,side:best.side,minute:f.minute,home:f.home.name,away:f.away.name,league:f.league.name,score:f.goals,evidence:best.evidence,price:best.price??null,line:best.line??null,lineGap:best.lineGap??null,observedAt:t});"
          )
          replace_one(
              'workers/nomadtips3-343-auto-engine/src/index.js',
              "        if(!pricePass(c.market,cfg,price)){candidates.push({...c,stage:'PRICE_REJECT',price});continue}\n        const candidate={...c,stage:'PASS',price};candidates.push(candidate);",
              "        const lineGap=c.market==='over'?overLineGap(price?.line,c.score):c.lineGap??null;\n        if(!pricePass(c.market,cfg,price,c.score)){candidates.push({...c,stage:'PRICE_REJECT',price,lineGap});continue}\n        const candidate={...c,stage:'PASS',price,lineGap};candidates.push(candidate);"
          )

          # Unit tests lock the agreed 3-1 examples and stale-line behavior.
          test=Path('workers/nomadtips3-343-auto-engine/test/over-gap.test.mjs')
          test.parent.mkdir(parents=True,exist_ok=True)
          test.write_text("""import test from 'node:test';
import assert from 'node:assert/strict';
import {currentGoalTotal,overLineGap,overGapPass} from '../src/over-gap.js';

test('score 3-1 with max gap 0.5 accepts O4.25 and O4.5',()=>{
  const score={home:3,away:1};
  assert.equal(currentGoalTotal(score),4);
  assert.equal(overLineGap(4.25,score),0.25);
  assert.equal(overLineGap(4.5,score),0.5);
  assert.equal(overGapPass(4.25,score,0.5),true);
  assert.equal(overGapPass(4.5,score,0.5),true);
});

test('score 3-1 with max gap 0.5 rejects O4.75 and O5.0',()=>{
  const score={home:3,away:1};
  assert.equal(overLineGap(4.75,score),0.75);
  assert.equal(overLineGap(5.0,score),1);
  assert.equal(overGapPass(4.75,score,0.5),false);
  assert.equal(overGapPass(5.0,score,0.5),false);
});

test('configured gap options and unlimited mode behave deterministically',()=>{
  const score={home:2,away:1};
  assert.equal(overGapPass(4.5,score,1.5),true);
  assert.equal(overGapPass(5.5,score,2.5),true);
  assert.equal(overGapPass(9.75,score,999),true);
});

test('negative/stale line and missing score are rejected',()=>{
  assert.equal(overLineGap(3.5,{home:3,away:1}),null);
  assert.equal(overGapPass(3.5,{home:3,away:1},0.5),false);
  assert.equal(overGapPass(4.5,null,0.5),false);
});
""",encoding='utf-8')
          PY

          node --check nomad-live-343/settings.js
          node --check workers/nomadtips3-343-auto-engine/src/over-gap.js
          node --check workers/nomadtips3-343-auto-engine/src/index.js
          node --test workers/nomadtips3-343-auto-engine/test/over-gap.test.mjs
          grep -Fq 'name="lineGapMax"' nomad-live-343/settings.html
          grep -Fq 'lineGapMax:0.5' nomad-live-343/settings.js
          grep -Fq 'lineGapMax:0.5' workers/nomadtips3-343-auto-engine/src/index.js
          grep -Fq 'overGapPass(price.line,score,cfg.lineGapMax)' workers/nomadtips3-343-auto-engine/src/index.js
          ! grep -Fq 'lineMax' nomad-live-343/settings.html
          ! grep -Fq 'lineMax' nomad-live-343/settings.js
          changed="$(git diff --name-only)"
          if echo "$changed" | grep -Eq '^(nomad-live/|nomad-live-342/|workers/nomadtips3-342-|nomad-live-341/)'; then
            echo '::error::3.41/3.42 file changed'; echo "$changed"; exit 1
          fi
          git diff --check

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$FIVEDOLLAR_API_KEY"

      - name: Dry run isolated 3.43 Worker
        working-directory: workers/nomadtips3-343-auto-engine
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc

      - name: Deploy isolated 3.43 Worker
        working-directory: workers/nomadtips3-343-auto-engine
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Re-bind 5Dollar API key
        working-directory: workers/nomadtips3-343-auto-engine
        run: printf '%s' "$FIVEDOLLAR_API_KEY" | npx --yes wrangler@4.92.0 secret put FIVEDOLLAR_API_KEY --config wrangler.jsonc

      - name: Smoke test 3.43 gap contract
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl -fsS --max-time 25 "$ENGINE_URL/api/state?_=$RANDOM$RANDOM" -o /tmp/state.json
          cat /tmp/state.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/state.json','utf8'));
          if(j.ok!==true) throw new Error('state not ok');
          const over=j.settings?.over||{};
          if(![0.5,1,1.5,2,2.5,999].includes(Number(over.lineGapMax))) throw new Error('lineGapMax missing/invalid: '+JSON.stringify(over));
          if(Object.prototype.hasOwnProperty.call(over,'lineMax')) throw new Error('obsolete lineMax still exposed');
          console.log('3.43 OVER gap state PASS',{lineGapMax:over.lineGapMax,lineMin:over.lineMin});
          NODE
          curl -fsS --max-time 45 -X POST "$ENGINE_URL/scan" -o /tmp/scan.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/scan.json','utf8'));
          if(j.ok!==true) throw new Error('scan not ok: '+JSON.stringify(j));
          console.log('3.43 scan PASS',{state:j.engineState,skipped:j.skipped||null,newSignals:j.newSignals?.length});
          NODE

      - name: Commit tested 3.43 patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-343-over-gap-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nomad-live-343/settings.html \
                  nomad-live-343/settings.js \
                  workers/nomadtips3-343-auto-engine/src/index.js \
                  workers/nomadtips3-343-auto-engine/src/over-gap.js \
                  workers/nomadtips3-343-auto-engine/test/over-gap.test.mjs \
                  .github/workflows/patch-343-over-gap-once.yml
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          if echo "$changed" | grep -Eq '^(nomad-live/|nomad-live-342/|workers/nomadtips3-342-|nomad-live-341/)'; then
            echo '::error::3.41/3.42 staged'; echo "$changed"; exit 1
          fi
          git commit -m "3.43: gate OVER by line gap from current score"
          git push origin HEAD:main
