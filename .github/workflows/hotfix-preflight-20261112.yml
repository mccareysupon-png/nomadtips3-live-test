name: BALL46 Hotfix Preflight 20261112
on:
  push:
    branches: [test/ball46-pin-v2-mobile-fix-20261112]
    paths: ['pinned-fixtures-v2-production/HOTFIX_PREFLIGHT_READY']
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: test/ball46-pin-v2-mobile-fix-20261112}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node pinned-fixtures-v2-production/hotfix-preflight.mjs
