name: BALL46 test-only league label grid layout probe
on:
  push:
    branches: [test/ball46-premium-match-colors-20261120]
    paths: ['.github/workflows/ball46-signal-league-grid-probe-20261121.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Mock reserved league line inside native team cell on PC and mobile
        run: |
          node --input-type=module <<'NODE'
          import {chromium,devices} from 'playwright';
          const b=await chromium.launch();
          const css=`body[data-workspace-view="signal"] .board-sections[data-b46-signal-sort-ready="1"] .match-row .teams-cell{grid-template-rows:11px 22px 22px!important;row-gap:0!important;align-content:center!important;min-height:55px!important}
          body[data-workspace-view="signal"] .board-sections[data-b46-signal-sort-ready="1"] .match-row .teams-cell>.b46-signal-league-chip{grid-row:1!important;grid-column:1/-1!important;position:static!important;justify-self:start!important;align-self:center!important;display:block!important;max-width:100%!important;width:100%!important;min-width:0!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important;padding:0!important;margin:0!important;font:600 9px/11px "IBM Plex Sans",Inter,Arial,sans-serif!important;opacity:.9!important;color:rgba(184,212,197,.84)!important;}
          body[data-workspace-view="signal"] .board-sections[data-b46-signal-sort-ready="1"] .match-row .teams-cell>b:first-of-type{grid-row:2!important;grid-column:1!important}
          body[data-workspace-view="signal"] .board-sections[data-b46-signal-sort-ready="1"] .match-row .teams-cell>b:nth-of-type(2){grid-row:3!important;grid-column:1!important}
          body[data-workspace-view="signal"] .board-sections[data-b46-signal-sort-ready="1"] .match-row .teams-cell>strong:first-of-type{grid-row:2!important;grid-column:2!important}
          body[data-workspace-view="signal"] .board-sections[data-b46-signal-sort-ready="1"] .match-row .teams-cell>strong:nth-of-type(2){grid-row:3!important;grid-column:2!important}
          @media(max-width:760px){body[data-workspace-view="signal"] .board-sections[data-b46-signal-sort-ready="1"] .match-row .teams-cell{grid-template-rows:11px 30px 30px!important;min-height:71px!important}body[data-workspace-view="signal"] .board-sections[data-b46-signal-sort-ready="1"] .match-row .teams-cell>.b46-signal-league-chip{font:600 9px/11px "IBM Plex Sans",Inter,Arial,sans-serif!important}}`;
          const rect=e=>{const r=e.getBoundingClientRect();return {x:r.left,y:r.top,right:r.right,bottom:r.bottom,w:r.width,h:r.height}};
          const overlap=(a,b)=>Math.max(0,Math.min(a.right,b.right)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.y,b.y));
          for(const mode of ['desktop','mobile']){
            const p=await b.newPage(mode==='desktop'?{viewport:{width:1440,height:960},serviceWorkers:'block'}:{...devices['iPhone 13'],viewport:{width:390,height:844},serviceWorkers:'block'});
            await p.addInitScript(()=>localStorage.setItem('nomad343_dashboard_theme_v1','dark'));
            await p.goto('https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev/?view=signal',{waitUntil:'domcontentloaded',timeout:65000});
            await p.waitForFunction(()=>document.querySelector('.board-sections[data-b46-signal-sort-ready="1"] .b46-signal-league-chip'),null,{timeout:40000});
            const before=await p.evaluate(()=>{
              const row=document.querySelector('.status-section .match-row'),cell=row.querySelector('.teams-cell'),chip=cell.querySelector('.b46-signal-league-chip');
              return {rowH:row.getBoundingClientRect().height,cellH:cell.getBoundingClientRect().height,chipText:chip.textContent,docW:document.documentElement.scrollWidth}
            });
            await p.addStyleTag({content:css});
            await p.waitForTimeout(450);
            const after=await p.evaluate(()=>{
              const rr=e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,right:r.right,bottom:r.bottom,w:r.width,h:r.height}};
              const row=document.querySelector('.status-section .match-row'),cell=row.querySelector('.teams-cell'),chip=cell.querySelector('.b46-signal-league-chip');
              const targets=[...cell.children].filter(e=>e.matches('b,strong')),boxes=targets.map(e=>({text:e.textContent.trim().slice(0,45),r:rr(e)}));
              const intersects=(a,b)=>Math.max(0,Math.min(a.right,b.right)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.y,b.y));
              const cr=rr(chip),rowR=rr(row);
              return {row:rowR,cell:rr(cell),chip:cr,chipWithNames:boxes.map(x=>({name:x.text,overlap:intersects(cr,x.r)})),nameScoreOverlap:intersects(boxes[0].r,boxes[1].r)+intersects(boxes[2].r,boxes[3].r),targets:boxes,docW:document.documentElement.scrollWidth,viewport:innerWidth};
            });
            console.log('BALL46_GRID_LEAGUE_PROBE_'+mode+' '+JSON.stringify({before,after}));
            if(after.chipWithNames.some(x=>x.overlap>0.1))throw Error('LEAGUE_OVERLAP_'+mode);
            if(after.row.w>after.viewport)throw Error('CARD_WIDTH_OVERFLOW_'+mode);
            if(after.chip.y<after.row.y-2||after.chip.bottom>after.row.bottom+2)throw Error('LEAGUE_OUTSIDE_CARD_'+mode);
            if(after.docW>after.viewport+1)throw Error('DOCUMENT_HORIZONTAL_OVERFLOW_'+mode);
            await p.close();
          }
          await b.close();
          console.log('BALL46_GRID_LEAGUE_PROBE_PASS');
          NODE