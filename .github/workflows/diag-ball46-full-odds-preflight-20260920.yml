name: Diagnose Ball46 Full Odds Preflight 20260920

on:
  push:
    branches:
      - work/ball46-full-odds-19book-restore-v1-20260920
    paths:
      - .github/workflows/diag-ball46-full-odds-preflight-20260920.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_URL: https://ball46.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Read current production signatures only
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/d
          for page in index.html signal.html statistics.html live-summary-full-odds-343.js; do
            code=$(curl -sS -L --max-time 30 -o "/tmp/d/$page" -w '%{http_code}' "$BALL46_URL/$page?diagfo=$GITHUB_RUN_ID") || code=000
            size=$(wc -c < "/tmp/d/$page" 2>/dev/null || echo 0)
            echo ASSET name=$page status=$code bytes=$size
          done
          f=/tmp/d/live-summary-full-odds-343.js
          for sig in BALL46_VIEWER_READONLY_LOCK_V1 CENTRAL_CACHE_READ_ONLY board-cache VIEWER_PROVIDER_FETCH_DISABLED BALL46_FULL_ODDS_19BOOK_RESTORE_V1 applyRichOdds requestRich; do
            if grep -Fq "$sig" "$f"; then echo JS_SIG "$sig"=YES; else echo JS_SIG "$sig"=NO; fi
          done
          echo JS_HEAD_BEGIN
          head -c 1200 "$f" | tr '\n' ' '
          echo
          echo JS_HEAD_END
          for url in "/api/full-market/fixture-odds" "/api/engine/scan" "/api/engine/fixture-odds"; do
            safe=$(echo "$url" | tr '/?' '__')
            code=$(curl -sS -L --max-time 25 -o "/tmp/d/$safe.json" -w '%{http_code}' "$BALL46_URL$url?diagfo=$GITHUB_RUN_ID") || code=000
            echo ROUTE path=$url status=$code body=$(head -c 500 "/tmp/d/$safe.json" | tr '\n' ' ')
          done
          for ep in engine hub full-market; do
            code=$(curl -sS -L --max-time 25 -o "/tmp/d/$ep-health.json" -w '%{http_code}' "$BALL46_URL/api/$ep/health?diagfo=$GITHUB_RUN_ID") || code=000
            echo HEALTH endpoint=$ep status=$code body=$(head -c 700 "/tmp/d/$ep-health.json" | tr '\n' ' ')
          done
          npx --yes wrangler@4.92.0 deployments list --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc --json > /tmp/d/deployments.json
          current=$(node -e "const r=require('/tmp/d/deployments.json'); const x=r[r.length-1]; console.log(x?.versions?.find(v=>Number(v.percentage)===100)?.version_id||'')")
          echo CURRENT_PROD_VERSION=$current
          echo DIAG_DONE
