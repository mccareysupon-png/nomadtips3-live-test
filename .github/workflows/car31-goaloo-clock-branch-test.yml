name: CAR 3.1 Goaloo Clock Branch Test

on:
  push:
    branches:
      - fix/car31-goaloo-source-clock-20260816

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check car3-1-hybrid-live-engine/worker/src/goaloo-clock.js
          node --check car3-1-hybrid-live-engine/worker/src/main-v3.js
          node --check car3-1-hybrid-live-engine/web/signal-polish.js
      - name: Goaloo clock unit tests
        working-directory: car3-1-hybrid-live-engine/worker
        run: node --test test/goaloo-clock.test.js
