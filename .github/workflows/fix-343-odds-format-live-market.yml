name: Fix 3.43 Odds Format Live Market

on:
  push:
    branches: [work/nomad343-server-prewarm-20260914]
    paths:
      - '.github/workflows/fix-343-odds-format-live-market.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CANARY_URL: https://nomadtips3-343-stable-preview.mccarey-supon.workers.dev
  PROD_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/nomad343-server-prewarm-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch odds converter for current Full Market DOM
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('nomad-live-343/odds-format-343.js')
          s=p.read_text()
          s=s.replace("const VERSION='343-odds-format-v4-topbar-fixed';","const VERSION='343-odds-format-v5-full-market-price';",1)
          old="if(!strong.closest('.fom-chip'))return;"
          new="if(!strong.closest('.fom-chip,.fom-price-row'))return;"
          if old not in s and new not in s:
              raise SystemExit('FULL_MARKET_CONVERTER_GUARD_NOT_FOUND')
          s=s.replace(old,new,1)
          oldq="root.querySelectorAll?.('.fom-chip strong').forEach(convertFullOddsChip);"
          newq="root.querySelectorAll?.('.fom-chip strong,.fom-price-row .fom-price').forEach(convertFullOddsChip);"
          if oldq not in s and newq not in s:
              raise SystemExit('FULL_MARKET_SELECTOR_NOT_FOUND')
          s=s.replace(oldq,newq,1)
          p.write_text(s)

          for html in Path('nomad-live-343').glob('*.html'):
              t=html.read_text()
              if 'odds-format-343.js?v=' in t:
                  import re
                  t=re.sub(r'odds-format-343\.js\?v=[^"\']+', 'odds-format-343.js?v=343-odds-format-v5-full-market-price', t)
                  html.write_text(t)
          PY
          node --check nomad-live-343/odds-format-343.js
          grep -Fq ".fom-chip strong,.fom-price-row .fom-price" nomad-live-343/odds-format-343.js
          grep -Fq "closest('.fom-chip,.fom-price-row')" nomad-live-343/odds-format-343.js

      - name: Persist exact converter fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nomad-live-343/odds-format-343.js nomad-live-343/*.html
          if ! git diff --cached --quiet; then
            git commit -m 'fix(343): convert current full market price cells'
            git push origin HEAD:work/nomad343-server-prewarm-20260914
          fi

      - name: Guard scope
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD)"
          echo "$changed"
          echo "$changed" | grep -Ev '^(nomad-live-343/odds-format-343\.js|nomad-live-343/[^/]+\.html)$' && { echo UNEXPECTED_SCOPE; exit 1; } || true
          git diff --quiet HEAD^ HEAD -- workers/nomadtips3-engine-343 workers/nomadtips3-5usd-hub-343 workers/nomadtips3-343-full-market workers/nomadtips3-343-full-market-central nomad-live-341

      - name: Dry run viewers
        run: |
          set -euo pipefail
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.stable.jsonc)
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc)

      - name: Deploy canary viewer
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.stable.jsonc

      - name: Verify converter on canary
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          TARGET_URL="$CANARY_URL" node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1366,height:768}});
            let detailCalls=0;
            page.on('request',r=>{if(r.url().includes('/api/full-market/fixture-odds'))detailCalls++});
            await page.goto(process.env.TARGET_URL+'/?oddsfmt='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>window.NOMAD343_ODDS?.setFormat,{timeout:30000});
            const result=await page.evaluate(()=>{
              const host=document.createElement('div');
              host.innerHTML='<div class="fom-price-row live cols-total"><strong class="fom-price">2.5 @ 1.91</strong><strong class="fom-price">1.80</strong></div>';
              document.body.appendChild(host);
              window.NOMAD343_ODDS.refresh();
              window.NOMAD343_ODDS.setFormat('american');
              const am=[...host.querySelectorAll('.fom-price')].map(x=>x.textContent.trim());
              window.NOMAD343_ODDS.setFormat('decimal');
              const dec=[...host.querySelectorAll('.fom-price')].map(x=>x.textContent.trim());
              host.remove();
              return {am,dec,version:window.NOMAD343_ODDS.version};
            });
            if(result.am[0]!=='2.5 @ -110'||result.am[1]!=='-125')throw Error('AM_CONVERT_FAIL '+JSON.stringify(result));
            if(result.dec[0]!=='2.5 @ 1.91'||result.dec[1]!=='1.8')throw Error('DEC_RESTORE_FAIL '+JSON.stringify(result));
            if(detailCalls!==0)throw Error('VIEWER_DETAIL_CALLS='+detailCalls);
            console.log('CANARY ODDS FORMAT OK',result,{detailCalls});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Deploy production viewer
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Verify production assets
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            js="$(curl -fsS "$PROD_URL/odds-format-343.js?x=$RANDOM$(date +%s)" || true)"
            if grep -Fq "343-odds-format-v5-full-market-price" <<<"$js" && grep -Fq ".fom-price-row .fom-price" <<<"$js"; then
              echo 'PRODUCTION ODDS FORMAT ASSET OK'
              exit 0
            fi
            sleep 2
          done
          exit 1
