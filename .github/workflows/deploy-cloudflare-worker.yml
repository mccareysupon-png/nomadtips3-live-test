name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloudflare-worker.yml
      - cloudflare-worker/src/**
      - cloudflare-worker/package.json
      - cloudflare-worker/wrangler.jsonc

concurrency:
  group: deploy-nomadtips3-test-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run 429 shield regression test
        run: node scripts/test-api-football-rate-guard.mjs

      - name: Deploy nomadtips3-test-api
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.120.0
          command: deploy --config cloudflare-worker/wrangler.jsonc

      - name: Verify Car 3 deployed status route
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://nomadtips3-test-api.mccarey-supon.workers.dev/car3/auto-scan-status';
          let lastError = null;
          for (let attempt = 1; attempt <= 6; attempt += 1) {
            try {
              const response = await fetch(`${url}?deploy_check=${Date.now()}`, {
                headers: { 'Accept': 'application/json' }
              });
              const payload = await response.json().catch(() => null);
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              if (!payload?.apiGuard) throw new Error('apiGuard diagnostics missing');
              if (Number(payload.apiGuard.minGapMs) !== 9000) {
                throw new Error(`unexpected guard gap ${payload.apiGuard.minGapMs}`);
              }
              console.log(JSON.stringify({
                route: 'car3/auto-scan-status',
                deployed: true,
                scannerOnline: Boolean(payload.online),
                generatedAt: payload.generatedAt || null,
                scannerError: payload.error || null,
                apiGuard: payload.apiGuard
              }, null, 2));
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.log(`Car 3 deploy check attempt ${attempt} failed: ${error.message}`);
              if (attempt < 6) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          throw lastError || new Error('Car 3 deploy verification failed');
          NODE
