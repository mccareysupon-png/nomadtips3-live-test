name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloudflare-worker.yml
      - cloudflare-worker/src/**
      - cloudflare-worker/package.json
      - cloudflare-worker/wrangler.jsonc

concurrency:
  group: deploy-nomadtips3-test-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JENG_LINE_USER_ID: ${{ secrets.LINE_TARGET_ID || secrets.LINE_USER_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run 429 shield regression test
        run: node scripts/test-api-football-rate-guard.mjs

      - name: Deploy nomadtips3-test-api
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.120.0
          command: deploy --config cloudflare-worker/wrangler.jsonc
          secrets: |
            JENG_LINE_USER_ID
        env:
          JENG_LINE_USER_ID: ${{ env.JENG_LINE_USER_ID }}

      - name: Verify Car 3, Auto Mechanic V2, and Condition Audit auto-repair
        run: |
          node --input-type=module <<'NODE'
          const statusUrl = 'https://nomadtips3-test-api.mccarey-supon.workers.dev/car3/auto-scan-status';
          const configUrl = 'https://nomadtips3-test-api.mccarey-supon.workers.dev/condition-config';
          const healthUrl = 'https://nomadtips3-test-api.mccarey-supon.workers.dev/engine-health';
          let lastError = null;
          for (let attempt = 1; attempt <= 6; attempt += 1) {
            try {
              const statusResponse = await fetch(`${statusUrl}?deploy_check=${Date.now()}`, {
                headers: { 'Accept': 'application/json' }
              });
              const statusPayload = await statusResponse.json().catch(() => null);
              if (!statusResponse.ok) throw new Error(`status HTTP ${statusResponse.status}`);
              if (!statusPayload?.apiGuard) throw new Error('apiGuard diagnostics missing');
              if (!statusPayload?.conditionAudit?.status) throw new Error('Condition Audit diagnostics missing from status route');
              if (statusPayload.conditionAudit.autoRepairEnabled !== true) {
                throw new Error('Condition Audit auto-repair is not enabled on status route');
              }
              if (Number(statusPayload.conditionAudit.maxAutoRepairAttempts) !== 2) {
                throw new Error(`unexpected Condition Audit repair limit ${statusPayload.conditionAudit.maxAutoRepairAttempts}`);
              }
              if (Number(statusPayload.apiGuard.minGapMs) !== 9000) {
                throw new Error(`unexpected base guard gap ${statusPayload.apiGuard.minGapMs}`);
              }
              if (!Number.isFinite(Number(statusPayload.apiGuard.effectiveGapMs))) {
                throw new Error('adaptive effectiveGapMs missing');
              }

              const configResponse = await fetch(`${configUrl}?deploy_check=${Date.now()}`, {
                headers: { 'Accept': 'application/json' }
              });
              const configPayload = await configResponse.json().catch(() => null);
              if (!configResponse.ok) throw new Error(`config HTTP ${configResponse.status}`);
              if (typeof configPayload?.defaults?.attackEvidenceEnabled !== 'boolean') {
                throw new Error('Attack evidence toggle is not live in Worker config');
              }

              const healthResponse = await fetch(`${healthUrl}?deploy_check=${Date.now()}`, {
                headers: { 'Accept': 'application/json' }
              });
              const healthPayload = await healthResponse.json().catch(() => null);
              if (!healthResponse.ok) throw new Error(`engine health HTTP ${healthResponse.status}`);
              if (!healthPayload?.ok || !healthPayload?.control?.mode) {
                throw new Error('engine health/control diagnostics missing');
              }
              if (Number(healthPayload?.mechanicVersion) !== 2) {
                throw new Error(`Auto Mechanic V2 missing: ${healthPayload?.mechanicVersion}`);
              }
              if (Number(healthPayload?.watchdog?.intervalMinutes) !== 15) {
                throw new Error(`unexpected watchdog interval ${healthPayload?.watchdog?.intervalMinutes}`);
              }
              if (!Array.isArray(healthPayload?.blackBox)) {
                throw new Error('watchdog black box missing');
              }
              if (!healthPayload?.conditionAudit?.status) {
                throw new Error('Condition Audit diagnostics missing from engine health');
              }
              if (healthPayload.conditionAudit.autoRepairEnabled !== true) {
                throw new Error('Condition Audit auto-repair is not enabled in engine health');
              }
              if (Number(healthPayload.conditionAudit.maxAutoRepairAttempts) !== 2) {
                throw new Error(`unexpected engine health repair limit ${healthPayload.conditionAudit.maxAutoRepairAttempts}`);
              }

              console.log(JSON.stringify({
                route: 'car3/auto-scan-status',
                deployed: true,
                scannerOnline: Boolean(statusPayload.online),
                generatedAt: statusPayload.generatedAt || null,
                scannerError: statusPayload.error || null,
                apiGuard: statusPayload.apiGuard,
                attackEvidenceToggleLive: true,
                attackEvidenceActive: configPayload.active?.attackEvidenceEnabled,
                mechanicVersion: healthPayload.mechanicVersion,
                engineState: healthPayload.state,
                engineMode: healthPayload.control.mode,
                mechanicAction: healthPayload.watchdog?.currentAction,
                watchdogMinutes: healthPayload.watchdog.intervalMinutes,
                conditionAudit: healthPayload.conditionAudit,
                lastSuccessfulScanAt: healthPayload.liveScan?.lastSuccessfulScanAt || null,
                blackBoxEvents: healthPayload.blackBox.length
              }, null, 2));
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.log(`Auto Mechanic deploy check attempt ${attempt} failed: ${error.message}`);
              if (attempt < 6) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          throw lastError || new Error('Auto Mechanic V2 / Condition Audit auto-repair deploy verification failed');
          NODE