name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-cloudflare-worker.yml
      - cloudflare-worker/src/**
      - cloudflare-worker/package.json
      - cloudflare-worker/wrangler.jsonc

concurrency:
  group: deploy-nomadtips3-test-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run 429 shield regression test
        run: node scripts/test-api-football-rate-guard.mjs

      - name: Deploy nomadtips3-test-api
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.120.0
          command: deploy --config cloudflare-worker/wrangler.jsonc

      - name: Verify Car 3 deployed status and config routes
        run: |
          node --input-type=module <<'NODE'
          const statusUrl = 'https://nomadtips3-test-api.mccarey-supon.workers.dev/car3/auto-scan-status';
          const configUrl = 'https://nomadtips3-test-api.mccarey-supon.workers.dev/condition-config';
          let lastError = null;
          for (let attempt = 1; attempt <= 6; attempt += 1) {
            try {
              const statusResponse = await fetch(`${statusUrl}?deploy_check=${Date.now()}`, {
                headers: { 'Accept': 'application/json' }
              });
              const statusPayload = await statusResponse.json().catch(() => null);
              if (!statusResponse.ok) throw new Error(`status HTTP ${statusResponse.status}`);
              if (!statusPayload?.apiGuard) throw new Error('apiGuard diagnostics missing');
              if (Number(statusPayload.apiGuard.minGapMs) !== 9000) {
                throw new Error(`unexpected guard gap ${statusPayload.apiGuard.minGapMs}`);
              }

              const configResponse = await fetch(`${configUrl}?deploy_check=${Date.now()}`, {
                headers: { 'Accept': 'application/json' }
              });
              const configPayload = await configResponse.json().catch(() => null);
              if (!configResponse.ok) throw new Error(`config HTTP ${configResponse.status}`);
              if (typeof configPayload?.defaults?.attackEvidenceEnabled !== 'boolean') {
                throw new Error('Attack evidence toggle is not live in Worker config');
              }

              console.log(JSON.stringify({
                route: 'car3/auto-scan-status',
                deployed: true,
                scannerOnline: Boolean(statusPayload.online),
                generatedAt: statusPayload.generatedAt || null,
                scannerError: statusPayload.error || null,
                apiGuard: statusPayload.apiGuard,
                attackEvidenceToggleLive: true,
                attackEvidenceActive: configPayload.active?.attackEvidenceEnabled
              }, null, 2));
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.log(`Car 3 deploy check attempt ${attempt} failed: ${error.message}`);
              if (attempt < 6) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          throw lastError || new Error('Car 3 deploy verification failed');
          NODE
