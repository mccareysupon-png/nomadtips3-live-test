name: Verify BALL46 Dark10 Full Market 20261111
on:
  push:
    branches: [release/ball46-fullmarket-dark10-yellow-dot-20261111]
    paths: ['fullmarket-dark10-yellow-dot-20261111/DARK_VERIFY_READY']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: release/ball46-fullmarket-dark10-yellow-dot-20261111}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node fullmarket-dark10-yellow-dot-20261111/verify-dark.mjs
