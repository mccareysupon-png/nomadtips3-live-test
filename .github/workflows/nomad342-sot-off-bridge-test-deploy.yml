name: NOMAD 3.42 SOT OFF Bridge Test Deploy

on:
  push:
    branches:
      - work/342-settings-clean-rebuild
    paths:
      - 'workers/nomadtips3-342-sot-off-bridge/**'
      - 'nomad-live-342/diagnostics/nowgoal-event-stats-probe.mjs'
      - 'nomad-live-342/runtime-config.js'
      - '.github/workflows/nomad342-sot-off-bridge-test-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BRIDGE_URL: https://nomadtips3-342-sot-off-bridge-test.mccarey-supon.workers.dev
  TC_URL: https://nomadtips3-live-score-feed-v3.mccarey-supon.workers.dev/feed

jobs:
  validate-source-and-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate bridge and Nowgoal source code
        run: |
          node --check workers/nomadtips3-342-sot-off-bridge/src/nowgoal-stats.js
          node --check workers/nomadtips3-342-sot-off-bridge/src/index.js
          node --test workers/nomadtips3-342-sot-off-bridge/test/*.test.mjs

      - name: Probe Nowgoal live SOT OFF source read only
        run: node nomad-live-342/diagnostics/nowgoal-event-stats-probe.mjs

      - name: Dry-run isolated bridge
        working-directory: workers/nomadtips3-342-sot-off-bridge
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.toml

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CF_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Deploy isolated bridge test Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: workers/nomadtips3-342-sot-off-bridge
          wranglerVersion: '4.92.0'
          command: deploy --config wrangler.toml

      - name: Smoke bridge contract and feed
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 --max-time 25 "$BRIDGE_URL/health?_=$RANDOM" -o /tmp/health.json
          node - <<'NODE'
          const j=require('/tmp/health.json');
          if(j.ok!==true||j.mode!=='SOT_OFF_ONLY') throw new Error('bridge health contract mismatch');
          if(!Array.isArray(j.changes)||j.changes.join(',')!=='event.snapshots[].sot,event.snapshots[].off') throw new Error('bridge changed fields mismatch');
          const untouched=['minute','score','attacks','dangerous','corner','markets','settlement'];
          for(const k of untouched) if(!j.untouched?.includes(k)) throw new Error(`untouched contract missing ${k}`);
          NODE

          curl -fsS --retry 2 --max-time 30 "$TC_URL?_=$RANDOM" -o /tmp/tc.json
          curl -fsS --retry 2 --max-time 45 "$BRIDGE_URL/feed?_=$RANDOM" -o /tmp/bridge.json
          node - <<'NODE'
          const fs=require('fs');
          const tc=JSON.parse(fs.readFileSync('/tmp/tc.json','utf8'));
          const br=JSON.parse(fs.readFileSync('/tmp/bridge.json','utf8'));
          if(br.ok!==true||!Array.isArray(br.matches)||!br.bridge) throw new Error('bridge feed invalid');
          const byId=new Map((tc.matches||[]).map(m=>[String(m.id),m]));
          let compared=0;
          for(const m of br.matches||[]){
            const base=byId.get(String(m.id)); if(!base) continue;
            compared++;
            for(const k of ['home','away','minute']) if(String(m[k]??'')!==String(base[k]??'')) throw new Error(`${k} changed ${m.id}`);
            if(JSON.stringify(m.score)!==JSON.stringify(base.score)) throw new Error(`score changed ${m.id}`);
            const a=(base.event?.snapshots||[]).at(-1),b=(m.event?.snapshots||[]).at(-1);
            if(a&&b) for(const k of ['attacks','dangerous','corner']) if(JSON.stringify(a[k])!==JSON.stringify(b[k])) throw new Error(`${k} changed ${m.id}`);
          }
          if(compared===0) throw new Error('no comparable TotalCorner matches');
          console.log(JSON.stringify({totalCorner:(tc.matches||[]).length,bridge:(br.matches||[]).length,matched:br.bridge.matched,withSot:br.bridge.withSot,withOff:br.bridge.withOff,unmatched:br.bridge.unmatched,ambiguous:br.bridge.ambiguous},null,2));
          NODE

      - name: Validate clean 3.42 runtime wiring when present
        run: |
          set -euo pipefail
          if grep -Fq "nomadtips3-342-sot-off-bridge-test.mccarey-supon.workers.dev" nomad-live-342/runtime-config.js; then
            grep -Fq "const LIVE_SCORE_ENGINE='https://nomadtips3-342-sot-off-bridge-test.mccarey-supon.workers.dev'" nomad-live-342/runtime-config.js
            grep -Fq "const LIVE_SCORE_FALLBACK='https://nomadtips3-live-score-feed-v3.mccarey-supon.workers.dev'" nomad-live-342/runtime-config.js
            if grep -Fq 'goaloo-stats-layer.js' nomad-live-342/runtime-config.js; then
              echo '::error::Old page-side Goaloo supplement still active'; exit 1
            fi
          fi

      - name: Confirm production and 3.41 paths untouched
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD)"
          if echo "$changed" | grep -E '^(nomad-live-score-feed-v3/|nomad-live-engine/|nomad-live/)' >/dev/null; then
            echo '::error::Production or 3.41 path changed in source-rail task'; echo "$changed"; exit 1
          fi
          echo 'Nowgoal SOT/OFF bridge remains isolated to clean 3.42.'
