name: NOMAD 3.42 SOT OFF Bridge Test Deploy

on:
  push:
    branches:
      - work/342-settings-clean-rebuild
    paths:
      - 'workers/nomadtips3-342-sot-off-bridge/**'
      - 'nomad-live-342/diagnostics/nowgoal-event-stats-probe.mjs'
      - '.github/workflows/nomad342-sot-off-bridge-test-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  validate-source-and-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate bridge and Nowgoal source code
        run: |
          node --check workers/nomadtips3-342-sot-off-bridge/src/nowgoal-stats.js
          node --check workers/nomadtips3-342-sot-off-bridge/src/index.js
          node --test workers/nomadtips3-342-sot-off-bridge/test/*.test.mjs

      - name: Probe Nowgoal live SOT OFF source read only
        run: node nomad-live-342/diagnostics/nowgoal-event-stats-probe.mjs

      - name: Dry-run isolated bridge
        working-directory: workers/nomadtips3-342-sot-off-bridge
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.toml

      - name: Confirm production paths untouched
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD)"
          if echo "$changed" | grep -E '^(nomad-live-score-feed-v3/|nomad-live-engine/|nomad-live/)' >/dev/null; then
            echo '::error::Production or 3.41 path changed in source-rail task'; echo "$changed"; exit 1
          fi
          echo 'Nowgoal source rail is isolated to the 3.42 clean branch bridge.'
