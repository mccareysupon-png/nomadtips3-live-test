name: Inspect designated BALL46 full-site test Worker (read only)
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-main-test-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers',headers={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const cf=async p=>{const r=await fetch(root+p,{headers});const j=await r.json();if(!r.ok||!j.success)throw Error(p+' '+r.status);return j.result};
          for(const name of ['ball46-ui-work-test','ball46-premium-match-colors-test-20261120']){
            try{const d=(await cf('/scripts/'+name+'/deployments?per_page=1')).deployments[0];const v=await cf('/workers/'+name+'/versions/'+d.versions[0].version_id+'?include=modules');const s=await cf('/scripts/'+name+'/settings');const m=v.modules.map(x=>{const t=Buffer.from(x.content_base64||'','base64').toString();return {name:x.name,bytes:t.length,hasPrematch:/prematch-stat-1x2|pm-ledger-client|PREMATCH_STORE/.test(t),hasNativeSidebar:/data-b46-sidebar|b46-sidebar/.test(t),hasProxy:/B46_PRODUCTION_READ|\.fetch\(new Request/.test(t),entry:x.name===v.main_module}});console.log('FULL_SITE_INSPECT '+JSON.stringify({name,version:d.versions[0].version_id,modules:m,bindings:s.bindings?.map(b=>({name:b.name,type:b.type,service:b.service})),compatibilityDate:s.compatibility_date,compatibilityFlags:s.compatibility_flags}));}
            catch(e){console.log('FULL_SITE_INSPECT '+JSON.stringify({name,error:e.message}))}
          }
          JS
