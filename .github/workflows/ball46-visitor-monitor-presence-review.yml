# Reviewed inactive versions are from the stopped2f57eb3 upload; no activation occurred.
name: BALL46 Visitor Monitor consented presence (isolated release)
on:
  push:
    branches: [work/ball46-traffic-intelligence-isolated-20261020]
    paths: ['.github/workflows/ball46-visitor-monitor-presence-review.yml']
permissions:
  contents: read
concurrency:
  group: b46-visitor-monitor-deploy-only
  cancel-in-progress: false
jobs:
  presence-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: traffic-intelligence/isolated-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify generated script, syntax and privacy regressions
        run: |
          node build-tracker-assets.mjs
          git diff --exit-code -- tracker-assets.mjs
          node --check worker.mjs
          node --check collector.mjs
          node --check tracker.js
          node --check presence.mjs
          node --check presence-preflight.mjs
          node --check deploy-presence.mjs
          node --test worker.test.mjs analytics.test.mjs web-analytics.test.mjs request-logs.test.mjs presence.test.mjs tracker.test.mjs
      - name: Read-only production baseline, Access and dedicated bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node presence-preflight.mjs
      - name: Verify two-Worker release or activate exact reviewed source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRESENCE_OWNER_APPROVED: 20261021-main-public-opt-in
          ACTION: ${{ github.event.head_commit.message == 'Activate verified consented BALL46 presence [visitor-presence-deploy-v1]' && 'deploy' || 'audit' }}
        run: node deploy-presence.mjs "$ACTION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visitor-monitor-presence-readonly-review
          path: traffic-intelligence/isolated-deploy/deployment-evidence/
          retention-days: 30
