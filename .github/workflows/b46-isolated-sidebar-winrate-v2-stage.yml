name: B46 isolated Sidebar Win Rate V2 — staging only
on:
  push:
    branches: [chatgpt/ball46-new-ledger-clean-v1]
    paths: ['.github/workflows/b46-isolated-sidebar-winrate-v2-stage.yml']
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9ac139f3e27f30955470a3eba68ffa084676f8fd
          persist-credentials: false
      - run: |
          node --check chatgpt-statistics-ui/sidebar-rate-isolated-v2.mjs
          node --check chatgpt-statistics-ui/sidebar-rate-isolated-v2-test.mjs
          npm install --prefix chatgpt-statistics-ui/.runtime --no-audit --no-fund playwright@1.55.0
          chatgpt-statistics-ui/.runtime/node_modules/.bin/playwright install chromium --only-shell
          node chatgpt-statistics-ui/sidebar-rate-isolated-v2-test.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: isolated-sidebar-winrate-v2-stage-screenshots
          path: ${{ runner.temp }}/isolated-rate-v2/
          if-no-files-found: ignore
          retention-days: 14
