name: BALL46 FT team-first read-only preflight
on:
  push:
    branches: [feature/ball46-adaptive-manual-control-test-20261125]
    paths: ['.github/workflows/b46-ft-team-first-preflight-20261126.yml']
permissions:
  contents: read
  actions: read
jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Retrieve previous audit evidence without rerunning it
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 45720882591 --repo "$GITHUB_REPOSITORY" -n b46-ft-phase1-phase2-guarded-20261126 --dir prior-ft
      - name: Read existing history data and HUB health only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const token=process.env.CLOUDFLARE_API_TOKEN;
          assert(token,'OWNER_ACCESS_UNAVAILABLE');
          const authorization='Bearer '+crypto.createHmac('sha256',token).update('BALL46_PREMATCH_ONLY_V1').digest('hex');
          const host='https://ball46-prematch-only-test-20261120.mccarey-supon.workers.dev';
          async function get(url,headers={}){const r=await fetch(url,{headers,redirect:'error',signal:AbortSignal.timeout(25000)});if(!r.ok)throw Error(new URL(url).pathname+' HTTP '+r.status);return r.json()}
          const [a,b,c,h]=await Promise.all(['/ou-history-per-fixture-audit-test','/history-cargo-registry?detail=0','/ou-history-ft-state'].map(p=>get(host+p,{authorization})).concat(get('https://nomadtips3-5usd-hub-343.mccarey-supon.workers.dev/health')));
          const p=b.supplyPlanning??{};
          const hist=(a.fixtures??[]).reduce((t,f)=>{const k=f.homeHistory+'/'+f.awayHistory;t[k]=(t[k]??0)+1;return t},{});
          const health=Object.fromEntries(Object.entries(h).filter(([k])=>/rate|quota|stale|error|age|retry|bulk|status|^ok$/i.test(k)).map(([k,v])=>[k,k==='lastError'?Boolean(v):v]));
          console.log('NOW_FT '+JSON.stringify({checkedAt:a.checkedAtUTC,counts:a.counts,historyBySide:hist,archive:c.archive,plan:{upcoming:p.upcomingFixtures,ready:p.readyFixtures,teamCount:p.uniqueTeams,missingTeams:p.uniqueTeamsNeedingHistory,target:p.targetHistoryPerTeam,priorityTeamsCount:p.priorityTeams?.length,priorityTeamsSample:p.priorityTeams?.slice(0,2),priorityFixturesCount:p.highestPriority?.length,priorityFixtureSample:p.highestPriority?.slice(0,1)},health,providerRequests:0}));
          const f='prior-ft/REPORT.json';if(fs.existsSync(f)){const x=JSON.parse(fs.readFileSync(f));console.log('PREVIOUS_FT '+JSON.stringify({stopped:x.stopped,reason:String(x.problem??'').split('\n')[0].replace(/[\da-f]{40,}/gi,'[redacted]').slice(0,160),before:x.begin,after:x.end,providerCalls:x.providerCalls,providerRateRemaining:x.providerRateRemaining,productionVersionsUnchanged:x.productionVersionsUnchanged,oldOuPricePreserved:x.oldOuPricePreserved}));}
          JS
