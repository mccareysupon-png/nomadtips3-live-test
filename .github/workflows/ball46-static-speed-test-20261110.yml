name: BALL46 content-addressed static speed TEST ONLY
on:
  push:
    branches: [codex/ball46-static-speed-20261110]
    paths: ['work/cloudflare-speed-audit-20261110/test-request.json']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node work/cloudflare-speed-audit-20261110/prepare.mjs
          node --check work/cloudflare-speed-audit-20261110/candidate/index.mjs
          node work/cloudflare-speed-audit-20261110/contracts.mjs
      - name: Install test browser
        run: |
          npm install --no-save --package-lock=false --prefix work/cloudflare-speed-audit-20261110 playwright@1.56.1
          cd work/cloudflare-speed-audit-20261110 && npx playwright install --with-deps chromium
      - run: node work/cloudflare-speed-audit-20261110/browser-test.mjs
      - name: Save bounded test evidence; no Cloudflare token available
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/cloudflare-speed-audit-20261110/qa/*.json work/cloudflare-speed-audit-20261110/candidate/boundary.json work/cloudflare-speed-audit-20261110/candidate/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record static speed test-only preservation and cache results [skip ci]"
          git push origin HEAD:codex/ball46-static-speed-20261110
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-static-speed-test-proof
          path: |
            work/cloudflare-speed-audit-20261110/qa
            work/cloudflare-speed-audit-20261110/candidate/boundary.json