name: BALL46 bridge credential availability check
on:
  push:
    branches: [stage/ball46-multisource-v5-20261017]
    paths: [.github/workflows/ball46-bridge-secret-availability.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check only whether a managed compatible credential exists
        env:
          BRIDGE: ${{ secrets.ENGINE_BRIDGE_TOKEN }}
          FIVE: ${{ secrets.FIVEDOLLAR_API_KEY }}
          ALT: ${{ secrets.FIVE_DOLLAR_API_KEY }}
        run: |
          if [ -n "$BRIDGE" ]; then echo "DEDICATED_ENGINE_TOKEN_PRESENT"; else echo "DEDICATED_ENGINE_TOKEN_ABSENT"; fi
          if [ -n "$FIVE" ] || [ -n "$ALT" ]; then echo "GITHUB_PROVIDER_TOKEN_PRESENT"; else echo "GITHUB_PROVIDER_TOKEN_ABSENT"; fi
