name: Ball46 1xBet V2 Readonly Verify 20260928

on:
  push:
    branches:
      - ops/ball46-1xbet-affiliate-20260928
    paths:
      - '.github/workflows/ball46-1xbet-v2-readonly-verify-20260928.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify live 1xBet v2 behavior without deployment
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/b46-1xbet-v2-verify
          mkdir -p "$ROOT"
          curl -fsS -L -H 'Cache-Control: no-cache' "https://ball46-production.mccarey-supon.workers.dev/odds-format-343.js?verify=${GITHUB_RUN_ID}" -o "$ROOT/odds-format-343.js"
          grep -Fq 'B46_1XBET_AFFILIATE_V2_20260928' "$ROOT/odds-format-343.js"
          sed -n '/B46_1XBET_AFFILIATE_V2_20260928/,$p' "$ROOT/odds-format-343.js" | grep -Fq 'MutationObserver' && { echo V2_UNEXPECTED_MUTATION_OBSERVER; exit 1; } || true
          chrome=$(command -v google-chrome || command -v chromium)
          "$chrome" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9230 --user-data-dir="$ROOT/chrome" "https://www.ball46.com/index.html?status=live&verify=${GITHUB_RUN_ID}" >"$ROOT/chrome.log" 2>&1 & CPID=$!
          trap 'kill $CPID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9230/json > "$ROOT/pages.json" 2>/dev/null && break; sleep 1; done
          sleep 6
          node - <<'NODE'
          const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/b46-1xbet-v2-verify/pages.json')).find(x=>x.type==='page');if(!p)throw Error('NO_PAGE');const ws=new WebSocket(p.webSocketDebuggerUrl);let id=0,m=new Map();ws.onmessage=e=>{const x=JSON.parse(e.data);if(x.id&&m.has(x.id)){const q=m.get(x.id);m.delete(x.id);x.error?q[1](Error(JSON.stringify(x.error))):q[0](x.result)}};const call=(method,params={})=>new Promise((a,b)=>{const n=++id;m.set(n,[a,b]);ws.send(JSON.stringify({id:n,method,params}))});(async()=>{await new Promise((a,b)=>{ws.onopen=a;ws.onerror=b});const ev=async e=>(await call('Runtime.evaluate',{expression:e,returnByValue:true,awaitPromise:true})).result.value;const r=await ev(`(()=>{const host=document.createElement('div');host.className='match-expanded';host.style.display='none';host.innerHTML='<div data-full-market-card><button type="button" class="fmb-tab active" data-fmb-book="1xbet"><b>1xBet</b></button><div data-fmb-panel><table><thead><tr><th>STAGE</th><th>LINE</th><th>HOME</th><th>AWAY</th></tr></thead><tbody><tr><th>LIVE</th><td>-0.5</td><td>1.91</td><td>2.05</td></tr></tbody></table></div></div>';document.body.appendChild(host);const tab=host.querySelector('[data-fmb-book="1xbet"]');window.BALL46_1XBET_AFFILIATE.decorateTab(tab);const tds=[...host.querySelectorAll('tbody td')],ha=tds[1].querySelector('a'),aa=tds[2].querySelector('a');const out={version:window.BALL46_1XBET_AFFILIATE.version,menuLinks:tab.querySelectorAll('a').length,logo:!!tab.querySelector('img'),lineLinked:!!tds[0].querySelector('a'),homeLinked:!!ha,awayLinked:!!aa,homeHref:ha?.href||'',awayHref:aa?.href||''};host.remove();return out})()`);console.log('READONLY_V2_TEST',r);if(!r.version.includes('v2')||r.menuLinks!==0||!r.logo||r.lineLinked||!r.homeLinked||!r.awayLinked||!r.homeHref.includes('reffpa.com')||!r.awayHref.includes('reffpa.com'))throw Error('READONLY_V2_TEST_FAILED');ws.close();process.exit(0)})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          echo BALL46_1XBET_V2_READONLY_VERIFY_PASS
