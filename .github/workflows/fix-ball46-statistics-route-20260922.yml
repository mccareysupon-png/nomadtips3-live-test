name: Fix Ball46 Statistics Route 20260922

on:
  push:
    branches: [fix/ball46-statistics-route-20260922]
    paths:
      - '.github/workflows/fix-ball46-statistics-route-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  fix-statistics-route:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Mirror exact Production baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod
          fetch_required(){
            name="$1"; safe="${name//\//_}"
            code=$(curl -sS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 -o "/tmp/prod/$safe" -w '%{http_code}' "$BALL46_WORKER/$name?stat-route-copy=${GITHUB_RUN_ID}") || true
            [ "$code" = 200 ] || { echo "REQUIRED_PROD_ASSET_HTTP_${code}:$name"; exit 1; }
            test -s "/tmp/prod/$safe" || { echo "REQUIRED_PROD_ASSET_EMPTY:$name"; exit 1; }
            mkdir -p "$(dirname "nomad-live-343/$name")"
            cp "/tmp/prod/$safe" "nomad-live-343/$name"
          }
          fetch_required index.html
          python3 - <<'PY' > /tmp/assets.txt
          from pathlib import Path
          import re
          h=Path('nomad-live-343/index.html').read_text(errors='ignore')
          found=set()
          for x in re.findall(r'''(?:src|href)=["']([^"']+)["']''',h,re.I):
              x=x.split('?',1)[0].split('#',1)[0].strip().lstrip('./').lstrip('/')
              if not x or '://' in x or '/' in x: continue
              if re.search(r'\.(?:js|css|svg|json|png|webp|jpg|jpeg|ico)$',x,re.I): found.add(x)
          for x in sorted(found): print(x)
          PY
          while IFS= read -r name; do [ -n "$name" ] && fetch_required "$name"; done < /tmp/assets.txt
          fetch_required singlepage-workspace-343.js
          grep -Fq "/api/engine/statistics-lite" nomad-live-343/singlepage-workspace-343.js
          protected='dashboard-v2-stage3.js dashboard-v2-tune.js bulk-odds-compat-343.js expanded-match-343.js full-market-bookmaker-343.js live-summary-full-odds-343.js signal-next.js mobile-menu-classic-343.js event-flow-icons-343.js signal-event-flow-line-343.js'
          : > /tmp/protected.sha
          for f in $protected; do
            fetch_required "$f"
            printf '%s  %s\n' "$(sha256sum "nomad-live-343/$f" | awk '{print $1}')" "$f" >> /tmp/protected.sha
          done
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/statistics?stat-route-before=${GITHUB_RUN_ID}" -o /tmp/stats-before.json
          node - <<'NODE'
          const fs=require('fs'),s=JSON.parse(fs.readFileSync('/tmp/stats-before.json'));
          if(s?.ok!==true||!Array.isArray(s?.rows)||s.rows.length<1)throw Error('STATISTICS_BACKEND_UNHEALTHY');
          console.log('STATS_BACKEND_OK',{rows:s.rows.length,total:s.total});
          NODE

      - name: Patch only statistics endpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('nomad-live-343/singlepage-workspace-343.js')
          s=p.read_text()
          old="/api/engine/statistics-lite"
          new="/api/engine/statistics"
          count=s.count(old)
          if count != 1: raise SystemExit(f'EXPECTED_ONE_STATISTICS_LITE_REFERENCE_GOT_{count}')
          p.write_text(s.replace(old,new,1))
          PY
          node --check nomad-live-343/singlepage-workspace-343.js
          ! grep -Fq "/api/engine/statistics-lite" nomad-live-343/singlepage-workspace-343.js
          grep -Fq "const STAT_API='/api/engine/statistics'" nomad-live-343/singlepage-workspace-343.js
          while read -r expected f; do
            actual=$(sha256sum "nomad-live-343/$f" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "PROTECTED_LOCAL_CHANGED:$f"; exit 1; }
          done < /tmp/protected.sha

      - name: Dry run Production package
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy statistics route fix
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify route, PC and mobile rendering
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 25 "$BALL46_WORKER/singlepage-workspace-343.js?stat-route-after=${GITHUB_RUN_ID}" -o /tmp/workspace-after.js
          node --check /tmp/workspace-after.js
          ! grep -Fq "/api/engine/statistics-lite" /tmp/workspace-after.js
          grep -Fq "const STAT_API='/api/engine/statistics'" /tmp/workspace-after.js
          while read -r expected f; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/$f?stat-route-protected=${GITHUB_RUN_ID}" -o "/tmp/protected-$f"
            actual=$(sha256sum "/tmp/protected-$f" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "PROTECTED_DEPLOYED_CHANGED:$f"; exit 1; }
          done < /tmp/protected.sha
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/statistics?stat-route-final=${GITHUB_RUN_ID}" -o /tmp/stats-after.json
          node - <<'NODE'
          const fs=require('fs'),s=JSON.parse(fs.readFileSync('/tmp/stats-after.json'));
          if(s?.ok!==true||!Array.isArray(s?.rows)||s.rows.length<1)throw Error('STATISTICS_BACKEND_POST_UNHEALTHY');
          console.log('STATISTICS_ROUTE_FIXED',{rows:s.rows.length,total:s.total});
          NODE
          CHROME=$(command -v google-chrome || command -v chromium)
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1440,1000 --virtual-time-budget=12000 --dump-dom 'https://www.ball46.com/?view=statistics&verify-stat-pc=1' > /tmp/pc.html 2>/tmp/pc.err || true
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,844 --virtual-time-budget=12000 --dump-dom 'https://www.ball46.com/?view=statistics&verify-stat-mobile=1' > /tmp/mobile.html 2>/tmp/mobile.err || true
          for f in /tmp/pc.html /tmp/mobile.html; do
            grep -Eq 'data-sp-kpi="total">[0-9]+' "$f" || { echo "STAT_TOTAL_NOT_RENDERED:$f"; exit 1; }
            grep -Eq 'Updated · [0-9]+ settled' "$f" || { echo "STAT_FEED_NOT_RENDERED:$f"; exit 1; }
          done
          echo 'STATISTICS_PC_MOBILE_OK'
