name: BALL46 SIGNAL INCIDENT — Browser Chrome PC Mobile READ ONLY
on:
  push:
    branches: [audit/ball46-signal-loss-20261023]
    paths:
      - .github/workflows/ball46-signal-browser-readonly.yml
      - deploy-assets/signal-loss-20261023/browser.mjs
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core
          command -v google-chrome
          node --check deploy-assets/signal-loss-20261023/browser.mjs
          node deploy-assets/signal-loss-20261023/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-browser-readonly-${{ github.run_id }}
          path: audit/signal-browser.json
          retention-days: 14
