name: BALL46 sidebar colors published verification
on:
  push:
    branches: [test/ball46-sidebar-colors-20261119]
    paths: ['.github/workflows/sidebar-colors-verify-20261119.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --prefix "$RUNNER_TEMP/b46qa" --no-save --no-package-lock puppeteer-core
          echo "PUPPETEER_ENTRY=$(node -p "require.resolve('puppeteer-core',{paths:['$RUNNER_TEMP/b46qa']})")" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Verify published preview only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node qa/sidebar-colors-20261119/verify-published.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidebar-colors-published-evidence
          path: evidence/
          retention-days: 7

# Mobile visibility diagnostics.
