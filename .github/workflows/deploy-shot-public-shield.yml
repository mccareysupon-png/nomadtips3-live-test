name: Deploy Shot Public Shield

on:
  push:
    branches:
      - work/nomad-shot-public-shield
    paths:
      - 'workers/nomadtips3-shot-public-shield/**'
      - '.github/workflows/deploy-shot-public-shield.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  SHIELD_URL: https://nomadtips3-shot-public-shield.mccarey-supon.workers.dev

jobs:
  isolated-shield-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify isolated scope
        run: |
          set -euo pipefail
          node --check workers/nomadtips3-shot-public-shield/src/index.js
          unexpected="$(git diff --name-only origin/main...HEAD | grep -Ev '^(workers/nomadtips3-shot-public-shield/|\.github/workflows/deploy-shot-public-shield\.yml$)' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected files outside standalone public shield scope"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Dry-run shield bundle
        working-directory: workers/nomadtips3-shot-public-shield
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc

      - name: Validate deploy credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Deploy standalone public shield only
        working-directory: workers/nomadtips3-shot-public-shield
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Probe shield health
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            code="$(curl -sS --max-time 20 -o /tmp/shield-health.json -w '%{http_code}' "$SHIELD_URL/health?_=$RANDOM$RANDOM" || true)"
            echo "health attempt $i -> HTTP $code"
            if [ "$code" = "200" ] && node - <<'NODE'
          const fs=require('fs');
          try {
            const j=JSON.parse(fs.readFileSync('/tmp/shield-health.json','utf8'));
            console.log(JSON.stringify(j,null,2));
            process.exit(j.ok===true&&j.mode==='PUBLIC_SHIELD'?0:1);
          } catch { process.exit(1); }
          NODE
            then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"

      - name: Verify public force and probe are blocked
        run: |
          set -euo pipefail
          force_code="$(curl -sS --max-time 20 -o /tmp/force.json -w '%{http_code}' "$SHIELD_URL/snapshot?force=1")"
          probe_code="$(curl -sS --max-time 20 -o /tmp/probe.json -w '%{http_code}' "$SHIELD_URL/probe")"
          echo "force=1 -> HTTP $force_code"
          echo "/probe -> HTTP $probe_code"
          test "$force_code" = "403"
          test "$probe_code" = "404"

      - name: Verify safe snapshot proxy
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 40 -o /tmp/snapshot.json -w '%{http_code}' "$SHIELD_URL/snapshot?_=$RANDOM$RANDOM")"
          echo "/snapshot -> HTTP $code"
          test "$code" = "200"
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/snapshot.json','utf8'));
          console.log(JSON.stringify({ok:j.ok,version:j.version,counts:j.counts,error:j.error??null},null,2));
          if(!Array.isArray(j.results))process.exit(1);
          NODE
