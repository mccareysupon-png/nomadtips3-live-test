name: Test 3.42 Event Monitor

on:
  push:
    branches: [main]
    paths:
      - 'nomad-live-342/runtime-config.js'
      - 'nomad-live-342/event-config.js'
      - 'nomad-live-342/event-monitor.js'
      - 'nomad-live-342/event-analytics.js'
      - 'nomad-live-342/event-analytics.css'
      - 'nomad-live-342/event-graph-live.js'
      - 'nomad-live-342/event-graph-live.css'
      - 'nomad-live-342/event-market-1x2.js'
      - 'nomad-live-342/event-market-1x2.css'
      - 'nomad-live-342/index.html'
      - 'nomad-live-342/app.js'
      - 'nomad-live-342/settings.html'
      - 'nomad-live-342/health.html'
      - '.github/workflows/test-342-event-monitor.yml'
  pull_request:
    paths:
      - 'nomad-live-342/runtime-config.js'
      - 'nomad-live-342/event-config.js'
      - 'nomad-live-342/event-monitor.js'
      - 'nomad-live-342/event-analytics.js'
      - 'nomad-live-342/event-analytics.css'
      - 'nomad-live-342/event-graph-live.js'
      - 'nomad-live-342/event-graph-live.css'
      - 'nomad-live-342/event-market-1x2.js'
      - 'nomad-live-342/event-market-1x2.css'
      - 'nomad-live-342/index.html'
      - 'nomad-live-342/app.js'
      - 'nomad-live-342/settings.html'
      - 'nomad-live-342/health.html'
      - '.github/workflows/test-342-event-monitor.yml'

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check nomad-live-342/runtime-config.js
          node --check nomad-live-342/event-config.js
          node --check nomad-live-342/event-monitor.js
          node --check nomad-live-342/event-analytics.js
          node --check nomad-live-342/event-graph-live.js
          node --check nomad-live-342/event-market-1x2.js
          node --check nomad-live-342/app.js
      - name: Event monitor contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          const context = {window:{}};
          vm.runInNewContext(fs.readFileSync('nomad-live-342/event-config.js','utf8'), context);
          const config = context.window.NOMAD342_CONFIG;
          assert(config && config.defaults, 'shared 3.42 config must initialize');
          assert.strictEqual(config.settingsKey, 'nomadSettings342', 'shared settings key must stay stable');
          assert.strictEqual(config.defaults.minuteFrom, 55, 'minuteFrom default must be 55');
          assert.strictEqual(config.defaults.minuteTo, 88, 'minuteTo default must be 88');
          assert.strictEqual(config.defaults.rollingWindowMinutes, 5, 'rolling window default must be 5');
          assert.strictEqual(config.defaults.scoreDifferenceFilterEnabled, false, 'score difference filter default must be OFF');
          assert.strictEqual(config.defaults.attackWeight, 1, 'attack weight default must be 1');
          assert.strictEqual(config.defaults.dangerousAttackWeight, 2, 'dangerous attack weight default must be 2');
          assert.strictEqual(config.defaults.homePressureShareMinimum, 54, 'HOME pressure default must be 54%');
          assert.strictEqual(config.defaults.trendConditionsRequired, 2, 'trend default must be 2/3');
          assert.strictEqual(config.defaults.evidenceMode, 'ANY', 'evidence mode default must be ANY');

          const index = fs.readFileSync('nomad-live-342/index.html','utf8');
          const settings = fs.readFileSync('nomad-live-342/settings.html','utf8');
          const health = fs.readFileSync('nomad-live-342/health.html','utf8');
          const monitor = fs.readFileSync('nomad-live-342/event-monitor.js','utf8');
          const analytics = fs.readFileSync('nomad-live-342/event-analytics.js','utf8');
          const analyticsCss = fs.readFileSync('nomad-live-342/event-analytics.css','utf8');
          const graphLive = fs.readFileSync('nomad-live-342/event-graph-live.js','utf8');
          const graphLiveCss = fs.readFileSync('nomad-live-342/event-graph-live.css','utf8');
          const market1x2 = fs.readFileSync('nomad-live-342/event-market-1x2.js','utf8');
          const market1x2Css = fs.readFileSync('nomad-live-342/event-market-1x2.css','utf8');
          const app = fs.readFileSync('nomad-live-342/app.js','utf8');

          const indexConfig = index.indexOf('event-config.js');
          const indexMonitor = index.indexOf('event-monitor.js');
          const indexAnalytics = index.indexOf('event-analytics.js');
          const indexGraphLive = index.indexOf('event-graph-live.js');
          const indexMarket1x2 = index.indexOf('event-market-1x2.js');
          assert(indexConfig >= 0 && indexMonitor > indexConfig, 'Live must load shared config before event monitor');
          assert(indexAnalytics > indexMonitor, 'expanded analytics layer must load after core event monitor');
          assert(indexGraphLive > indexAnalytics, 'Attack Flow visual layer must load after analytics');
          assert(indexMarket1x2 > indexGraphLive, 'LIVE 1X2 sidecar must load after existing graph layer');
          assert(index.includes('event-analytics.css'), 'Live must load isolated expanded analytics styles');
          assert(index.includes('event-graph-live.css'), 'Live must load isolated Attack Flow visual styles');
          assert(index.includes('event-market-1x2.css'), 'Live must load isolated LIVE 1X2 styles');
          assert(!index.includes('fivedollar-live.js'), 'Live Event Monitor must not load 5Dollar evaluator');
          assert(!index.includes('ui-5dollar-source.js'), 'Live Event Monitor must not load 5Dollar UI');
          assert(!index.includes('bet365-observer.js'), 'Live Event Monitor must not load browser Bet365 observer');
          assert(!index.includes('m88-observer.js'), 'Live Event Monitor must not load M88 observer');
          assert(monitor.includes('NOMAD342_CONFIG'), 'event monitor must consume shared config');
          assert(analytics.includes('nomad-analytics-layer'), 'analytics layer must remain isolated from core renderer');
          assert(analytics.includes('MATCH PULSE'), 'analytics layer must expose Match Pulse');
          assert(analytics.includes('MOMENTUM PULSE'), 'analytics layer must expose Momentum Pulse');
          assert(analytics.includes('RADAR COMPARISON'), 'analytics layer must expose Radar Comparison');
          assert(!analyticsCss.toLowerCase().includes('#f2d21b'), 'analytics layer must not use legacy yellow');
          assert(graphLive.includes('attack-endpoint-home'), 'Attack Flow live layer must add HOME endpoint guide');
          assert(graphLive.includes('attack-endpoint-away'), 'Attack Flow live layer must add AWAY endpoint guide');
          assert(graphLiveCss.includes('background:#000'), 'Attack Flow live layer must keep graph background black');
          assert(graphLiveCss.includes('chart-grid-mid'), 'Attack Flow live layer must style a reference midline');
          assert(!index.includes('50%'), 'Live UI must not label the reference midline as 50%');

          assert(market1x2.includes('/nomad-live-342-market/1x2'), 'LIVE 1X2 sidecar must use isolated market endpoint');
          assert(market1x2.includes('LIVE 1X2'), 'LIVE 1X2 sidecar must render the approved compact strip');
          assert(!market1x2.includes('eventCheck'), 'LIVE 1X2 sidecar must not enter Event Gate logic');
          assert(!market1x2.includes('homePressureShareMinimum'), 'LIVE 1X2 sidecar must not alter pressure logic');
          for(const selector of ['attack-line','attack-home','attack-away','chart-grid','chart-grid-mid']){
            assert(!market1x2Css.includes(selector), `LIVE 1X2 CSS must not style graph selector ${selector}`);
          }
          const marketFontSizes=[...market1x2Css.matchAll(/font-size:\s*([0-9.]+)px/g)].map(m=>Number(m[1]));
          assert(marketFontSizes.length>0 && Math.max(...marketFontSizes)<=11, 'LIVE 1X2 typography must never exceed 11px desktop team-name ceiling');
          assert(app.includes('NOMAD342_CONFIG'), 'settings/health app must consume shared config');

          for (const [name, html] of [['Settings',settings],['Health',health]]) {
            const configPos = html.indexOf('event-config.js');
            const appPos = html.indexOf('app.js');
            assert(configPos >= 0 && appPos > configPos, `${name} must load shared config before app.js`);
          }
          console.log('3.42 Event Monitor contract OK');
          NODE
      - name: Probe live 3.42 event worker
        shell: bash
        run: |
          set +e
          base='https://nomadtips3-live-engine-342-test.mccarey-supon.workers.dev'
          for path in /health /feed; do
            echo "=== PROBE ${path} ==="
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl -sS --connect-timeout 10 --max-time 25 -D "$headers" -o "$body" -w '%{http_code}' "${base}${path}")"
            rc=$?
            echo "curl_rc=${rc} http=${code}"
            echo '--- headers ---'
            sed -n '1,40p' "$headers" || true
            echo '--- body ---'
            head -c 12000 "$body" || true
            echo
            rm -f "$headers" "$body"
          done
          exit 0
      - name: Probe deployed Live page in Chrome
        shell: bash
        run: |
          set +e
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "chrome=${chrome:-missing}"
          if [ -z "$chrome" ]; then exit 0; fi
          url='https://mccareysupon-png.github.io/nomadtips3-live-test/nomad-live-342/index.html'
          "$chrome" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=16000 --enable-logging=stderr --dump-dom "$url" >/tmp/nomad342-dom.html 2>/tmp/nomad342-chrome.log
          rc=$?
          echo "chrome_rc=$rc"
          echo '--- live status DOM ---'
          grep -oE 'TotalCorner LIVE[^<]*|3\.42 EVENT FEED WAIT[^<]*|Waiting for isolated 3\.42 TotalCorner event engine\.|Connecting TotalCorner event feed…' /tmp/nomad342-dom.html | head -20 || true
          echo '--- rendered cards ---'
          count="$(grep -o 'class="signal-card event-compact' /tmp/nomad342-dom.html | wc -l)"
          echo "rendered_cards=$count"
          echo '--- browser errors ---'
          grep -Ei 'error|failed|cors|uncaught|exception' /tmp/nomad342-chrome.log | tail -80 || true
          exit 0
