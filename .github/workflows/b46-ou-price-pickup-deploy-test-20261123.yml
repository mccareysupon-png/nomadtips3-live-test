name: BALL46 O/U 2.5 verified prices - TEST worker run 2026-11-23
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-ou-price-pickup-deploy-test-20261123.yml]
permissions: {contents: read}
concurrency:
  group: ball46-prematch-only-test-20261120
  cancel-in-progress: false
jobs:
  deploy-and-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: O/U real price parser and durable pickup SQLite QA
        run: |
          node --check qa/prematch-history-20261120/ou-price-pickup-v1-test.mjs
          node --check qa/prematch-history-20261120/ou-verified-price-ingest-v1-test.mjs
          node --check qa/prematch-history-20261120/patch-ou-priced-ft-settlement-test.mjs
          node --check qa/prematch-history-20261120/patch-ou-verified-price-main-test-20261123.mjs
          node --check qa/prematch-history-20261120/deploy-ou-verified-price-pickup-test-20261123.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-price-pickup-v1.test.mjs
          node --test qa/prematch-history-20261120/ou-verified-price-ingest-v1.test.mjs
          node --test qa/prematch-history-20261120/ou-math-v1.test.mjs
      - name: Deploy protected TEST-only backend and run one guarded 5USD quote cycle
        run: node qa/prematch-history-20261120/deploy-ou-verified-price-pickup-test-20261123.mjs
