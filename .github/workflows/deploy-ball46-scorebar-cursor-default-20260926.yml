name: Deploy Ball46 Signal Count Exact Production 20260927

on:
  push:
    branches: [work/ball46-scorebar-readonly-safe-20260926]
    paths:
      - '.github/workflows/deploy-ball46-scorebar-cursor-default-20260926.yml'

permissions:
  contents: read

env:
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  patch-signal-count-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Mirror exact current Production and create rollback point
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod /tmp/rollback nomad-live-343
          fetch_required(){
            name="$1"; safe="${name//\//_}"
            code=$(curl -sS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 -o "/tmp/prod/$safe" -w '%{http_code}' "$BALL46_WORKER/$name?signal-count-mirror=${GITHUB_RUN_ID}") || true
            [ "$code" = 200 ] || { echo "REQUIRED_PROD_ASSET_HTTP_${code}:$name"; exit 1; }
            test -s "/tmp/prod/$safe" || { echo "REQUIRED_PROD_ASSET_EMPTY:$name"; exit 1; }
            mkdir -p "$(dirname "nomad-live-343/$name")"
            cp "/tmp/prod/$safe" "nomad-live-343/$name"
          }
          fetch_required index.html
          python3 - <<'PY' > /tmp/index-assets.txt
          from pathlib import Path
          import re
          h=Path('nomad-live-343/index.html').read_text(errors='ignore')
          found=set()
          for x in re.findall(r'''(?:src|href)=["']([^"']+)["']''',h,re.I):
              x=x.split('?',1)[0].split('#',1)[0].strip().lstrip('./').lstrip('/')
              if not x or '://' in x or '/' in x: continue
              if re.search(r'\.(?:js|css|svg|json|png|webp|jpg|jpeg|ico)$',x,re.I): found.add(x)
          for x in sorted(found): print(x)
          PY
          while IFS= read -r f; do [ -n "$f" ] && fetch_required "$f"; done < /tmp/index-assets.txt
          fetch_required dashboard-v2-stage3.js
          fetch_required singlepage-workspace-343.css
          cp nomad-live-343/dashboard-v2-stage3.js /tmp/rollback/dashboard-v2-stage3.js
          cp nomad-live-343/index.html /tmp/rollback/index.html
          cp nomad-live-343/singlepage-workspace-343.css /tmp/rollback/singlepage-workspace-343.css
          sha256sum nomad-live-343/dashboard-v2-stage3.js | awk '{print $1}' > /tmp/js-before.sha
          sha256sum nomad-live-343/index.html | awk '{print $1}' > /tmp/index-before.sha
          sha256sum nomad-live-343/singlepage-workspace-343.css | awk '{print $1}' > /tmp/css-before.sha
          grep -Fq 'BALL46_SCOREBAR_READONLY_20260926' nomad-live-343/dashboard-v2-stage3.js
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?signal-count-before=${GITHUB_RUN_ID}" -o /tmp/signals-before.json
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/signals-before.json','utf8'));
          if(!Array.isArray(s?.signals)) throw Error('PRE_SIGNALS_UNHEALTHY');
          console.log('PRE_LIVE_SIGNAL_COUNT='+s.signals.length);
          NODE

      - name: Upload immediate pre-change rollback snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ball46-pre-signal-count-${{ github.run_id }}
          path: /tmp/rollback
          retention-days: 30

      - name: Patch only menu signal count source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('nomad-live-343/dashboard-v2-stage3.js')
          s=p.read_text()
          pat=r'activeSignals\s*=\s*mirror\.activeSignals\s*\?\?\s*signalMap\.size'
          matches=list(re.finditer(pat,s))
          if len(matches)!=1:
              raise SystemExit(f'SIGNAL_COUNT_TARGET_COUNT:{len(matches)}')
          s=re.sub(pat,'activeSignals=signalMap.size',s,count=1)
          p.write_text(s)
          PY
          grep -Fq 'activeSignals=signalMap.size' nomad-live-343/dashboard-v2-stage3.js
          if grep -Eq 'activeSignals\s*=\s*mirror\.activeSignals\s*\?\?\s*signalMap\.size' nomad-live-343/dashboard-v2-stage3.js; then echo OLD_SIGNAL_COUNT_SOURCE_REMAINS; exit 1; fi
          [ "$(sha256sum nomad-live-343/index.html | awk '{print $1}')" = "$(cat /tmp/index-before.sha)" ] || { echo INDEX_CHANGED; exit 1; }
          [ "$(sha256sum nomad-live-343/singlepage-workspace-343.css | awk '{print $1}')" = "$(cat /tmp/css-before.sha)" ] || { echo CSS_CHANGED; exit 1; }
          sha256sum nomad-live-343/dashboard-v2-stage3.js | awk '{print $1}' > /tmp/js-after.sha
          [ "$(cat /tmp/js-after.sha)" != "$(cat /tmp/js-before.sha)" ] || { echo JS_NOT_CHANGED; exit 1; }
          node --check nomad-live-343/dashboard-v2-stage3.js
          echo SIGNAL_COUNT_ONLY_PATCH_READY

      - name: Race guard exact Production assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/dashboard-v2-stage3.js?signal-count-race=${GITHUB_RUN_ID}" -o /tmp/race.js
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/index.html?signal-count-race=${GITHUB_RUN_ID}" -o /tmp/race.index
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/singlepage-workspace-343.css?signal-count-race=${GITHUB_RUN_ID}" -o /tmp/race.css
          [ "$(sha256sum /tmp/race.js | awk '{print $1}')" = "$(cat /tmp/js-before.sha)" ] || { echo PRODUCTION_JS_CHANGED_DURING_PATCH; exit 1; }
          [ "$(sha256sum /tmp/race.index | awk '{print $1}')" = "$(cat /tmp/index-before.sha)" ] || { echo PRODUCTION_INDEX_CHANGED_DURING_PATCH; exit 1; }
          [ "$(sha256sum /tmp/race.css | awk '{print $1}')" = "$(cat /tmp/css-before.sha)" ] || { echo PRODUCTION_CSS_CHANGED_DURING_PATCH; exit 1; }

      - name: Dry run exact current package
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy signal-count-only patch
        id: deploy
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify only JS changed and live signals stay healthy
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 20); do
            if curl -fsS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 "$BALL46_WORKER/dashboard-v2-stage3.js?signal-count-after=${GITHUB_RUN_ID}-${n}" -o /tmp/js.after; then
              if [ "$(sha256sum /tmp/js.after | awk '{print $1}')" = "$(cat /tmp/js-after.sha)" ]; then ok=1; break; fi
            fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo JS_PATCH_NOT_LIVE; exit 1; }
          grep -Fq 'activeSignals=signalMap.size' /tmp/js.after
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/index.html?signal-count-index-after=${GITHUB_RUN_ID}" -o /tmp/index.after
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/singlepage-workspace-343.css?signal-count-css-after=${GITHUB_RUN_ID}" -o /tmp/css.after
          [ "$(sha256sum /tmp/index.after | awk '{print $1}')" = "$(cat /tmp/index-before.sha)" ] || { echo DEPLOYED_INDEX_CHANGED; exit 1; }
          [ "$(sha256sum /tmp/css.after | awk '{print $1}')" = "$(cat /tmp/css-before.sha)" ] || { echo DEPLOYED_CSS_CHANGED; exit 1; }
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?signal-count-final=${GITHUB_RUN_ID}" -o /tmp/board-after.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?signal-count-final=${GITHUB_RUN_ID}" -o /tmp/signals-after.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/statistics?signal-count-final=${GITHUB_RUN_ID}" -o /tmp/stats-after.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/board-after.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals-after.json','utf8'));
          const t=JSON.parse(fs.readFileSync('/tmp/stats-after.json','utf8'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures)) throw Error('POST_BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals)) throw Error('POST_SIGNALS_UNHEALTHY');
          if(t?.ok!==true||!Array.isArray(t?.rows)) throw Error('POST_STATS_UNHEALTHY');
          console.log('SIGNAL_COUNT_PATCH_OK',{fixtures:b.fixtures.length,signals:s.signals.length,settled:t.rows.length});
          NODE

      - name: Restore immediate pre-change JS if verification fails
        if: ${{ failure() && steps.deploy.outcome == 'success' && steps.verify.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/rollback/dashboard-v2-stage3.js nomad-live-343/dashboard-v2-stage3.js
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc
          echo RESTORED_IMMEDIATE_PRE_CHANGE_JS
