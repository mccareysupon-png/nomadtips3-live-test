name: Diagnose Ball46 Signal Count Logic 20260927

on:
  push:
    branches: [work/ball46-scorebar-readonly-safe-20260926]
    paths:
      - '.github/workflows/deploy-ball46-scorebar-cursor-default-20260926.yml'

permissions:
  contents: read

env:
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev

jobs:
  inspect-signal-count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact live dashboard and signal API read-only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/dashboard-v2-stage3.js?signal-count-diag=${GITHUB_RUN_ID}" -o /tmp/dashboard.js
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?signal-count-diag=${GITHUB_RUN_ID}" -o /tmp/signals.json
          sha256sum /tmp/dashboard.js
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/signals.json','utf8'));
          console.log('API_SIGNALS=',Array.isArray(j.signals)?j.signals.length:'BAD');
          NODE
      - name: Print exact count/filter contexts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/dashboard.js').read_text(errors='ignore')
          needles=['activeSignals','signalMap','renderCounts','signals.filter','filterSignal','data-signal-count','workspace-signal','signal-count','signalRows','visibleSignals']
          for n in needles:
              print('\n===',n,'===')
              start=0
              shown=0
              while True:
                  i=s.find(n,start)
                  if i<0: break
                  print(s[max(0,i-500):min(len(s),i+900)].replace('\n',' '))
                  shown+=1
                  if shown>=8: break
                  start=i+len(n)
              if shown==0: print('NOT_FOUND')
          PY
