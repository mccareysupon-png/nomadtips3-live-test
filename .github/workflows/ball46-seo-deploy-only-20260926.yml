name: Ball46 SEO Deploy Only 20260926

on:
  push:
    branches:
      - ops/ball46-seo-deploy-20260926
    paths:
      - '.github/workflows/ball46-seo-deploy-only-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BALL46_URL: https://www.ball46.com
  SEO_COMMIT: 345645a8b9eae0db932cc012f1473cc8e5bdf87b

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact approved production source
        uses: actions/checkout@v4
        with:
          ref: 345645a8b9eae0db932cc012f1473cc8e5bdf87b
          fetch-depth: 0

      - name: Guard exact source and SEO payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SEO_COMMIT"
          grep -Fq '<!-- BALL46 SEO START -->' nomad-live-343/index.html
          grep -Fq 'Football Predictions Today | Verified Win Rate & Results | Ball46' nomad-live-343/index.html
          grep -Fq '<h1>Football Predictions Today</h1>' nomad-live-343/index.html
          grep -Fq 'verified win-rate statistics' nomad-live-343/index.html
          git diff --quiet HEAD -- nomad-live-343
          git diff --quiet HEAD -- workers/nomadtips3-343-preview
          echo 'PASS: exact approved SEO source; no working-tree modifications.'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dry-run exact Ball46 production package
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy exact Ball46 production package
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify production SEO and engine health
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          q="seo_deploy=${GITHUB_RUN_ID}"
          curl -fsS --max-time 30 "$BALL46_URL/?$q" -o /tmp/home.html
          grep -Fq '<!-- BALL46 SEO START -->' /tmp/home.html
          grep -Fq 'Football Predictions Today | Verified Win Rate & Results | Ball46' /tmp/home.html
          grep -Fq '<h1>Football Predictions Today</h1>' /tmp/home.html
          grep -Fq 'verified win-rate statistics' /tmp/home.html
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/health?$q" -o /tmp/health.json
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/board?$q" -o /tmp/board.json
          node -e 'const j=require("/tmp/health.json"); if(j?.ok!==true) throw Error("ENGINE_UNHEALTHY")'
          node -e 'const j=require("/tmp/board.json"); if(j?.ok!==true || !Array.isArray(j?.fixtures)) throw Error("BOARD_UNHEALTHY")'
          echo 'BALL46_SEO_DEPLOY_PASS'
