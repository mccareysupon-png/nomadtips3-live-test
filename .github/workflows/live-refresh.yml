name: Refresh BigBalls Live Match

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-refresh.yml"
      - "scripts/refresh_bigballs.py"
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: bigballs-live-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BIGBALLS_API_KEY: ${{ secrets.BIGBALLS_API_KEY }}
      MATCH_ID: f1236384-4184-46ff-b168-bdb638126682
      WINDOW_START_UTC: "2026-08-01T22:20:00Z"
      WINDOW_END_UTC: "2026-08-02T04:30:00Z"
      HOME_NAME: "Inter Miami CF"
      AWAY_NAME: "Columbus Crew"
      KICKOFF_UTC: "2026-08-01T23:30:00.000Z"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check match window and API key
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BIGBALLS_API_KEY:-}"

          now="$(date -u +%s)"
          start="$(date -u -d "$WINDOW_START_UTC" +%s)"
          end="$(date -u -d "$WINDOW_END_UTC" +%s)"

          if [ "$now" -ge "$start" ] && [ "$now" -le "$end" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Outside BigBalls match window."
          fi

      - name: Fetch and normalize BigBalls live data
        if: steps.guard.outputs.run == 'true'
        run: python scripts/refresh_bigballs.py

      - name: Commit refreshed BigBalls data
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-data-bigballs.json

          if git diff --cached --quiet; then
            echo "No BigBalls data changes."
            exit 0
          fi

          git commit -m "Refresh BigBalls live match"
          git pull --rebase origin main
          git push origin main
