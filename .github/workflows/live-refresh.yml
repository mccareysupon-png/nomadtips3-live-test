name: Refresh BigBalls Live Match

on:
  workflow_dispatch:
  schedule:
    # Multiple start chances around 05:25–05:55 Thailand time.
    # The first run stays alive and polls continuously; later runs queue and exit.
    - cron: "25,35,45,55 22 1 8 *"

permissions:
  contents: write

concurrency:
  group: bigballs-live-continuous
  cancel-in-progress: false

jobs:
  refresh-until-window-ends:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      BIGBALLS_API_KEY: ${{ secrets.BIGBALLS_API_KEY }}
      MATCH_ID: f1236384-4184-46ff-b168-bdb638126682
      WINDOW_START_UTC: "2026-08-01T22:30:00Z"
      WINDOW_END_UTC: "2026-08-02T04:30:00Z"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Poll BigBalls every ten minutes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BIGBALLS_API_KEY"

          start_epoch="$(date -u -d "$WINDOW_START_UTC" +%s)"
          end_epoch="$(date -u -d "$WINDOW_END_UTC" +%s)"
          now_epoch="$(date -u +%s)"

          if [ "$now_epoch" -gt "$end_epoch" ]; then
            echo "Match window already ended."
            exit 0
          fi

          if [ "$now_epoch" -lt "$start_epoch" ]; then
            wait_seconds=$((start_epoch - now_epoch))
            echo "Waiting $wait_seconds seconds for BigBalls match window."
            sleep "$wait_seconds"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cycle=0

          while [ "$(date -u +%s)" -le "$end_epoch" ]; do
            cycle=$((cycle + 1))
            echo "BigBalls refresh cycle $cycle at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

            git pull --rebase origin main || true

            DETAIL_HTTP="$(curl --silent --show-error \
              --output /tmp/detail.json \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer $BIGBALLS_API_KEY" \
              "https://api.bigballsdata.com/v1/matches/${MATCH_ID}?sport=football&fields=scores%2Cstats%2Cevents%2Codds")"

            STORED_HTTP="$(curl --silent --show-error \
              --output /tmp/stored.json \
              --write-out '%{http_code}' \
              -H "Authorization: Bearer $BIGBALLS_API_KEY" \
              "https://api.bigballsdata.com/v1/stored/matches/${MATCH_ID}")"

            for file in /tmp/detail.json /tmp/stored.json; do
              if ! jq -e . "$file" >/dev/null 2>&1; then
                jq -n --rawfile raw "$file" '{raw:$raw}' > "${file}.fixed"
                mv "${file}.fixed" "$file"
              fi
            done

            jq -n \
              --arg fetched_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              --arg detail_http "$DETAIL_HTTP" \
              --arg stored_http "$STORED_HTTP" \
              --argjson cycle "$cycle" \
              --slurpfile detail /tmp/detail.json \
              --slurpfile stored /tmp/stored.json \
              '{
                source:"bigballs",
                fetched_at_utc:$fetched_at,
                http_status:($detail_http|tonumber),
                stored_http_status:($stored_http|tonumber),
                match:{
                  id:"f1236384-4184-46ff-b168-bdb638126682",
                  sport:"football",
                  league:"MLS",
                  country:"USA",
                  home:{name:"Inter Miami CF",short_name:"MIA"},
                  away:{name:"Columbus Crew",short_name:"CLB"},
                  kickoff_utc:"2026-08-01T23:30:00.000Z",
                  status:($detail[0].data.status // $detail[0].status // $stored[0].data.status // "scheduled"),
                  elapsed:($detail[0].data.elapsed // $detail[0].elapsed // null),
                  score:{
                    home:($detail[0].data.score.home // $detail[0].data.scores.home // $detail[0].score.home // null),
                    away:($detail[0].data.score.away // $detail[0].data.scores.away // $detail[0].score.away // null)
                  },
                  stats:{},
                  events:[]
                },
                api_response:$detail[0],
                stored_response:{payload:$stored[0],mode:"continuous-ten-minute",cycle:$cycle}
              }' > live-data-bigballs.json

            git add live-data-bigballs.json
            if ! git diff --cached --quiet; then
              git commit -m "Refresh BigBalls live match"
              git pull --rebase origin main
              git push origin main
            fi

            sleep 600
          done
