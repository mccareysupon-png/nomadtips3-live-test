name: Deploy 3.43 Three-Factorial Navigation
on:
  push:
    branches:
      - work/nomad343-nav-3factorial-20260914
    paths:
      - .github/workflows/deploy-343-nav-3factorial.yml
jobs:
  verify-promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CANARY_URL: https://nomadtips3-343-stable-preview.mccarey-supon.workers.dev
      PROD_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev
      ACTIVE_BRANCH: work/nomad343-server-prewarm-20260914
      ROLLBACK_REF: backup/pre-343-nav-3factorial-20260914
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nomad343-nav-3factorial-20260914
          fetch-depth: 40
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify rollback and scope
        run: |
          set -euo pipefail
          git fetch origin "$ROLLBACK_REF" "$ACTIVE_BRANCH" --depth=40
          test "$(git rev-parse origin/$ROLLBACK_REF)" = "e4122f0fd9f2a4f013cf331a93d77828e04797f9"
          test "$(git rev-parse origin/$ACTIVE_BRANCH)" = "$(git rev-parse origin/$ROLLBACK_REF)"
          git diff --name-only "origin/$ROLLBACK_REF"..HEAD | tee /tmp/changed.txt
          if grep -Ev '^(nomad-live-343/(statistics.html|statistics-page-343.css)|\.github/scripts/test-343-nav-3factorial.js|\.github/workflows/deploy-343-nav-3factorial.yml)$' /tmp/changed.txt | grep -q .; then
            echo UNEXPECTED_SCOPE_CHANGE
            exit 1
          fi
          grep -Fq '<nav class="topnav">' nomad-live-343/index.html
          grep -Fq '<nav class="topnav">' nomad-live-343/signal.html
          grep -Fq '<nav class="topnav">' nomad-live-343/statistics.html
          grep -Fq '<nav class="mobile-nav">' nomad-live-343/index.html
          grep -Fq '<nav class="mobile-nav">' nomad-live-343/signal.html
          grep -Fq '<nav class="mobile-nav">' nomad-live-343/statistics.html
          ! grep -Fq 'statistics-nav' nomad-live-343/statistics.html
          ! grep -Fq '.statistics-nav' nomad-live-343/statistics-page-343.css
          git diff --quiet -- workers/nomadtips3-engine-343 workers/nomadtips3-5usd-hub-343 workers/nomadtips3-343-full-market-central workers/nomadtips3-343-full-market nomad-live-341
      - name: Dry run viewers
        run: |
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.stable.jsonc)
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc)
      - name: Install browser test
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Deploy canary viewer
        run: |
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.stable.jsonc
      - name: Wait for canary assets
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            html="$(curl -fsS "$CANARY_URL/statistics.html?asset=$RANDOM$(date +%s)" || true)"
            if grep -Fq '343-stat-nav-unified-v2' <<<"$html"; then echo "CANARY READY attempt=$i"; exit 0; fi
            sleep 2
          done
          exit 1
      - name: Test canary all six permutations
        run: TARGET_URL="$CANARY_URL" node .github/scripts/test-343-nav-3factorial.js
      - name: Verify active branch unchanged
        run: |
          set -euo pipefail
          git fetch origin "$ACTIVE_BRANCH" "$ROLLBACK_REF" --depth=1
          test "$(git rev-parse origin/$ACTIVE_BRANCH)" = "$(git rev-parse origin/$ROLLBACK_REF)"
      - name: Deploy production viewer
        id: prod_deploy
        run: |
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc
      - name: Wait for production assets
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            html="$(curl -fsS "$PROD_URL/statistics.html?asset=$RANDOM$(date +%s)" || true)"
            if grep -Fq '343-stat-nav-unified-v2' <<<"$html"; then echo "PRODUCTION READY attempt=$i"; exit 0; fi
            sleep 2
          done
          exit 1
      - name: Test production all six permutations
        run: TARGET_URL="$PROD_URL" node .github/scripts/test-343-nav-3factorial.js
      - name: Promote active branch
        run: |
          set -euo pipefail
          git fetch origin "$ACTIVE_BRANCH" --depth=40
          git merge-base --is-ancestor "origin/$ACTIVE_BRANCH" HEAD
          git push origin HEAD:"$ACTIVE_BRANCH"
      - name: Roll back production viewer on failure after deploy
        if: failure() && steps.prod_deploy.outcome == 'success'
        run: |
          set -euo pipefail
          git fetch origin "$ROLLBACK_REF" --depth=1
          git checkout --detach "origin/$ROLLBACK_REF"
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc
