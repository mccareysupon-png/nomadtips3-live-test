name: BALL46 PreMatch BTTS Human Website TEST Deploy
on:
  push:
    branches: [fix/ball46-prematch-btts-human-web-test-20261122]
    paths:
      - .github/workflows/b46-prematch-btts-human-web-deploy-test-20261122.yml
permissions:
  contents: read
concurrency:
  group: ball46-prematch-only-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate visible BTTS test screen and unchanged 1X2 archive
        run: |
          node --check qa/prematch-history-20261120/deploy-btts-human-web-test-20261122.mjs
          node --test qa/prematch-history-20261120/btts-human-web.test.mjs qa/prematch-history-20261120/btts-ultra-shadow.test.mjs qa/prematch-history-20261120/test-pick-ledger.test.mjs qa/prematch-history-20261120/history-cargo-registry.test.mjs
      - name: Deploy human-readable BTTS page to isolated TEST Worker only
        run: node qa/prematch-history-20261120/deploy-btts-human-web-test-20261122.mjs
