name: Deploy CAR 3.4 Real Market AH Audit

on:
  push:
    branches: [main]
    paths:
      - "car3-4-real-market-audit/**"
      - ".github/workflows/car34-cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CAR34_WORKER_URL: https://nomadtips3-car34-real-market-audit.mccarey-supon.workers.dev
  CAR31_WORKER_URL: https://nomadtips3-car31-goaloo.mccarey-supon.workers.dev

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate CAR 3.4 source
        working-directory: car3-4-real-market-audit
        run: |
          node --test
          node --check worker/src/index.js
          node --check worker/src/real-market.js
          node --check worker/src/upgrade.js
          node --check worker/src/settlement-v2.js
          node --check worker/src/main-v3.js
          node --check web/car34.js

      - name: Validate Cloudflare credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy isolated CAR 3.4 worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: car3-4-real-market-audit/worker
          wranglerVersion: "4"
          command: deploy

      - name: Configure Odds API secret when available
        working-directory: car3-4-real-market-audit/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -n "$ODDS_API_KEY" ]; then
            printf '%s' "$ODDS_API_KEY" | npx --yes wrangler@4 secret put ODDS_API_KEY --name nomadtips3-car34-real-market-audit
            echo "Odds API secret configured."
          else
            echo "::warning::ODDS_API_KEY repository secret is not configured. CAR 3.4 may use its stored Durable Object key."
          fi

      - name: Bootstrap Odds API key into active CAR 3.4 state
        env:
          TEMP_ODDS_API_KEY: 0e6ee951b97668104d5ef259b6c3e72e4f91eed4f7dcc0696997f2b36f7628e6
        run: |
          PROOF=$(printf 'car34-bootstrap:%s' "$TEMP_ODDS_API_KEY" | sha256sum | awk '{print $1}')
          curl -fsS --get --data-urlencode "key=$TEMP_ODDS_API_KEY" "$CAR34_WORKER_URL/bootstrap/odds-api-key/$PROOF" -o /tmp/car34-bootstrap.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/car34-bootstrap.json'))
          assert p.get('ok') is True and p.get('keyConfigured') is True, p
          print(json.dumps({k:v for k,v in p.items() if k!='key'},indent=2))
          PY

      - name: Copy CAR 3.1 conditions into CAR 3.4 and lock AH
        shell: bash
        run: |
          curl -fsS "$CAR31_WORKER_URL/config" -o /tmp/car31-config.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/car31-config.json'))
          c=dict(p.get('config') or {})
          c['market']='AH'
          c.setdefault('engineEnabled', True)
          c.setdefault('realMarketMaxAgeSeconds', 120)
          json.dump(c,open('/tmp/car34-config.json','w'))
          print(json.dumps(c,indent=2))
          PY
          curl -fsS -X POST -H 'content-type: application/json' --data-binary @/tmp/car34-config.json "$CAR34_WORKER_URL/config"

      - name: Run one audit cycle and inspect status
        shell: bash
        run: |
          curl -fsS -X POST "$CAR34_WORKER_URL/scan" -o /tmp/car34-scan.json || true
          cat /tmp/car34-scan.json | head -c 12000 || true
          echo
          HEALTH=$(curl -fsS "$CAR34_WORKER_URL/health")
          echo "$HEALTH" | head -c 12000
          echo
          printf '%s' "$HEALTH" | grep -q '"CAR 3.4 REAL MARKET AUDIT"' || { echo "::error::CAR 3.4 health identity missing"; exit 1; }
          printf '%s' "$HEALTH" | grep -q '"BET365_V4"' || { echo "::error::BET365_V4 settlement contract missing"; exit 1; }

      - name: Show test URLs
        run: |
          echo "Worker: $CAR34_WORKER_URL"
          echo "Detector: https://mccareysupon-png.github.io/nomadtips3-live-test/car3-4-real-market-audit/web/"
          echo "Statistics: https://mccareysupon-png.github.io/nomadtips3-live-test/car3-4-real-market-audit/web/statistics.html"
          echo "Settings: https://mccareysupon-png.github.io/nomadtips3-live-test/car3-4-real-market-audit/web/settings.html"
