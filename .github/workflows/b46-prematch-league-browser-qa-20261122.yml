name: BALL46 PreMatch League Browser QA PC Mobile READ ONLY
on:
  push:
    branches:
      - fix/ball46-prematch-league-all-phases-20261122
    paths:
      - .github/workflows/b46-prematch-league-browser-qa-20261122.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser
        run: |
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Verify real test league names, FT badges and missing-data ages on PC and mobile
        run: |
          node --input-type=module <<'JS'
          import {chromium,devices} from 'playwright';
          import assert from 'node:assert/strict';
          const base='https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev';
          const r=await fetch(base+'/__b46_prematch_data',{cache:'no-store',signal:AbortSignal.timeout(25000)});
          assert(r.ok);
          const j=await r.json(),rows=j.testLedger.rows,mon=j.testMonitor.monitor;
          const now=Date.now()/1000;
          const ages={future:0,last24h:0,days1to3:0,days3to7:0,older:0};
          const missing=rows.filter(x=>!mon[x.fixture_id]?.leagueName);
          for(const item of missing){
            const delta=now-Number(item.kickoff);
            ages[delta<0?'future':delta<86400?'last24h':delta<259200?'days1to3':delta<604800?'days3to7':'older']++;
          }
          console.log('B46_UNNAMED_FIXTURE_AGE_READ_ONLY '+JSON.stringify({missing:missing.length,ages,all:rows.length}));
          const browser=await chromium.launch();
          try{
            for(const mobile of [false,true]){
              const p=await browser.newPage(mobile?{...devices['iPhone 13'],serviceWorkers:'block'}:{viewport:{width:1440,height:900},serviceWorkers:'block'});
              await p.addInitScript(()=>localStorage.setItem('nomad343_dashboard_theme_v1','dark'));
              await p.goto(base+'/?b46pm=predictions',{waitUntil:'domcontentloaded',timeout:60000});
              await p.waitForFunction(()=>document.querySelectorAll('#b46-prematch-panel .b46pm-live-mirror-fixture[data-b46-pm-mirror-fixture]').length>0,null,{timeout:65000});
              await p.waitForTimeout(3000);
              const got=await p.evaluate(()=>{
                const found=[];
                for(const block of document.querySelectorAll('#b46-prematch-panel .b46pm-live-mirror-fixture[data-b46-pm-mirror-fixture]')){
                  const id=block.dataset.b46PmMirrorFixture;
                  let header=block.previousElementSibling;
                  while(header&&!header.matches('.b46pm-clean-league-head'))header=header.previousElementSibling;
                  found.push({id,league:header?.querySelector('.b46pm-league-name')?.textContent?.trim()||block.querySelector('.b46gn-league')?.textContent?.trim()||'',
                    badge:block.querySelector('.b46pm-result-badge')?.textContent?.trim()||null});
                }
                return found;
              });
              const displayed=new Map(got.map(x=>[String(x.id),x]));
              let verified=0,notReady=0,badges=0;
              for(const item of rows){
                const actual=displayed.get(String(item.fixture_id));
                assert(actual,'MISSING_PREMATCH_CARD_'+item.fixture_id+'_'+(mobile?'mobile':'desktop'));
                const verifiedName=mon[item.fixture_id]?.leagueName;
                if(typeof verifiedName==='string'&&verifiedName){
                  assert.equal(actual.league,verifiedName,'VERIFIED_LEAGUE_NOT_DISPLAYED_'+item.fixture_id);
                  verified++;
                }else notReady++;
                if(['WIN','LOSS'].includes(item.status)){
                  assert.equal(actual.badge,item.status,'FT_LEDGER_RESULT_BADGE_MISSING_'+item.fixture_id);
                  badges++;
                }else assert(!actual.badge,'WRONG_PENDING_RESULT_BADGE_'+item.fixture_id);
              }
              console.log('B46_PREMATCH_LEAGUE_BROWSER_PASS '+JSON.stringify({mobile,rendered:got.length,verified,notReady,badges}));
              await p.close();
            }
          }finally{await browser.close()}
          JS
