name: BALL46 Featured Mobile V2 Visual Correction
on:
  push:
    branches: [fix/ball46-featured-mobile-native-card-20261021]
    paths:
      - 'deploy-assets/featured-mobile-native-20261021/native-mobile-v2.css'
      - 'deploy-assets/featured-mobile-native-20261021/deploy-native-v2.mjs'
      - '.github/workflows/ball46-featured-mobile-v2-visual-20261021.yml'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  visual-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preflight and screenshot pixel tester
        working-directory: deploy-assets/featured-mobile-native-20261021
        run: |
          set -euo pipefail
          node --check deploy-native-v2.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 pngjs@7
      - name: Active version guard, safe candidate, visual QA, production verify
        working-directory: deploy-assets/featured-mobile-native-20261021
        run: node deploy-native-v2.mjs
      - name: Proof images and rollback detail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-mobile-v2-visual-proof
          path: deploy-assets/featured-mobile-native-20261021/proof/
          retention-days: 30
          if-no-files-found: warn