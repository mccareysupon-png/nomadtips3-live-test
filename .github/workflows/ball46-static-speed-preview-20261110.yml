name: BALL46 static speed guarded Worker Preview
on:
  push:
    branches: [codex/ball46-static-speed-20261110]
    paths: ['work/cloudflare-speed-audit-20261110/stage-request.json']
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false --prefix work/cloudflare-speed-audit-20261110 parse5@7.3.0
      - name: Build only the approved tested patch
        run: |
          node work/cloudflare-speed-audit-20261110/prepare.mjs
          node --check work/cloudflare-speed-audit-20261110/candidate/index.mjs
          node work/cloudflare-speed-audit-20261110/contracts.mjs
      - name: Fresh Production health and source then non-traffic Worker Preview
        run: node work/cloudflare-speed-audit-20261110/release.mjs stage
      - name: Save scoped Preview evidence only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/cloudflare-speed-audit-20261110/release-audit/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record current source and guarded static-cache Preview [skip ci]"
          git push origin HEAD:codex/ball46-static-speed-20261110
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-static-speed-preview
          path: work/cloudflare-speed-audit-20261110/release-audit