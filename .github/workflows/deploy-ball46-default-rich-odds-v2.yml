name: Diagnose Ball46 Current Cloudflare Deployment 20260926

on:
  push:
    branches:
      - diag/ball46-current-deploy-map-20260926
    paths:
      - .github/workflows/deploy-ball46-default-rich-odds-v2.yml

permissions:
  contents: read

jobs:
  inspect-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read current deployment only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -f wrangler.ball46.jsonc
          echo '=== CONFIG ==='
          sed -n '1,120p' wrangler.ball46.jsonc
          echo '=== VERSIONS ==='
          npx --yes wrangler@4.92.0 versions list --config wrangler.ball46.jsonc
          echo '=== DEPLOYMENTS ==='
          npx --yes wrangler@4.92.0 deployments list --config wrangler.ball46.jsonc
          echo '=== LIVE HASH ==='
          curl -fsS --max-time 30 'https://www.ball46.com/singlepage-workspace-343.css?diag=deploy-map' -o /tmp/live.css
          curl -fsS --max-time 30 'https://www.ball46.com/dashboard-v2-stage3.js?diag=deploy-map' -o /tmp/live.js
          sha256sum /tmp/live.css /tmp/live.js
          grep -n 'BALL46_WORKSPACE_SCOREBAR_20260926' /tmp/live.css || true
          grep -n 'renderWorkspaceScorebar' /tmp/live.js | head -5 || true
