name: BALL46 offline market probability audit
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-market-probability-audit.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-archive-merge
          run-id: 44741440475
          github-token: ${{ github.token }}
          path: merged
      - uses: actions/download-artifact@v4
        with:
          name: real-finished-history
          run-id: 44723780062
          github-token: ${{ github.token }}
          path: daily
      - uses: actions/download-artifact@v4
        with:
          name: real-prematch-raw-and-progress
          run-id: 44759126984
          github-token: ${{ github.token }}
          path: scheduled
      - uses: actions/download-artifact@v4
        with:
          name: one-x-two-history-progress
          run-id: 44760845081
          github-token: ${{ github.token }}
          path: history
      - run: python3 qa/prematch-history-20261120/market-probability-audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: market-probability-audit
          path: evidence/market-probability.json
