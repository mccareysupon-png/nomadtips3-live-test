name: BALL46 PreMatch TOTAL 1X2 BTTS O/U TEST guarded end-to-end deploy
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths:
      - qa/prematch-history-20261120/deploy-prematch-total-ou-v2-test-20261124.mjs
      - .github/workflows/b46-prematch-total-ou-deploy-20261124.yml
permissions: {contents: read}
concurrency:
  group: ball46-prematch-only-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Pure 3-market snapshot and O/U settlement and no-double-count UI regression
        run: |
          node --check qa/prematch-history-20261120/deploy-prematch-total-ou-v2-test-20261124.mjs
          node --test qa/prematch-history-20261120/patch-prematch-total-ou-client.test.mjs
          node --test qa/prematch-history-20261120/prematch-total-priced-ou-v2.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/prematch-stats-registry-test.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-v2-settlement.test.mjs
      - name: Guarded and verified TEST backend and frontend deployment with rollback on failure
        run: node qa/prematch-history-20261120/deploy-prematch-total-ou-v2-test-20261124.mjs
