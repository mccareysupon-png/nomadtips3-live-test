name: BALL46 inspect native Full Market and Event Flow CPU hotspot source read-only
on:
  push:
    branches: [test/ball46-fullmarket-odds-v3-20261121]
    paths:
      - '.github/workflows/ball46-native-jitter-hotspot-inspect-20261121.yml'
      - 'qa/fullmarket-odds-v3-20261121/native-source-inspect.mjs'
permissions: {contents: read}
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Inspect native JS public served source for CPU hotspots
        run: node qa/fullmarket-odds-v3-20261121/native-source-inspect.mjs
