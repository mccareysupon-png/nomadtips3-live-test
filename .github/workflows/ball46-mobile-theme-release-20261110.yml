name: BALL46 approved mobile theme guarded release
on:
  push:
    branches: [codex/ball46-favorites-test-20261110]
    paths: ['work/mobile-theme-fix-test-20261110/release-request.json']
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated verification tools
        run: |
          npm install --no-save --package-lock=false --prefix work/mobile-theme-fix-test-20261110 acorn@8.15.0 parse5@7.3.0 playwright@1.56.1
          if command -v google-chrome >/dev/null; then
            google-chrome --version
            echo "PLAYWRIGHT_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            cd work/mobile-theme-fix-test-20261110 && npx playwright install --with-deps chromium
          fi
      - name: Build mobile theme only from current Production existing payload
        run: node work/mobile-theme-fix-test-20261110/build-release.mjs
      - name: Preserve current modules resources configuration and records; zero-traffic Preview
        run: node work/mobile-theme-fix-test-20261110/release.mjs stage
      - name: Verify real Preview scores themes drawer PC mobile
        run: node work/mobile-theme-fix-test-20261110/release-browser.mjs candidate
      - name: Activate verified mobile theme only
        run: node work/mobile-theme-fix-test-20261110/release.mjs activate
      - name: Verify public Production themes and real scores
        run: node work/mobile-theme-fix-test-20261110/release-browser.mjs production
      - name: Final version health configuration and records
        run: node work/mobile-theme-fix-test-20261110/release.mjs finish
      - name: Restore immediate baseline after any activation failure
        if: failure()
        run: node work/mobile-theme-fix-test-20261110/release.mjs rollback
      - name: Save scoped release proof
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/mobile-theme-fix-test-20261110/release-audit/*.json work/mobile-theme-fix-test-20261110/stage/report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record mobile-only Production release preservation [skip ci]"
          git push origin HEAD:codex/ball46-favorites-test-20261110
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-mobile-theme-production-proof
          path: |
            work/mobile-theme-fix-test-20261110/release-audit
            work/mobile-theme-fix-test-20261110/stage/report.json
