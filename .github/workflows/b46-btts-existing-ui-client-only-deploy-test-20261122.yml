name: BALL46 BTTS Existing Predictions UI Client ONLY Deploy TEST
on:
  push:
    branches: [fix/ball46-btts-issuance-statistics-test-20261122]
    paths: [.github/workflows/b46-btts-existing-ui-client-only-deploy-test-20261122.yml]
permissions:
  contents: read
concurrency:
  group: ball46-premium-match-colors-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check existing TEST UI integration exact syntax (no CSS/layout redesign)
        run: |
          node --check qa/prematch-history-20261120/deploy-btts-existing-ui-client-only-test-20261122.mjs
          node --check qa/prematch-history-20261120/patch-existing-btts-client-test.mjs
          node --test qa/prematch-history-20261120/btts-pick-ledger-test.test.mjs qa/prematch-history-20261120/test-pick-ledger.test.mjs
      - name: Deploy only existing PreMatch TEST client BTTS data routing, protect all other Workers
        run: node qa/prematch-history-20261120/deploy-btts-existing-ui-client-only-test-20261122.mjs
