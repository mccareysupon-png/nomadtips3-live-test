name: BALL46 all Cloudflare 5USD consumer inventory READ ONLY
on:
  push:
    branches: [codex/ball46-5usd-latency-control-20261102]
    paths: ['work/ball46-5usd-latency-control-20261102/connection/inventory-request.json']
permissions:
  contents: write
concurrency:
  group: ball46-bulk-owner-connection
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: work/ball46-5usd-latency-control-20261102
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node connection/provider-inventory.mjs
      - name: Preserve metadata only, never deploy or call provider
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-audit/provider-consumer-inventory.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record account-wide 5USD binding and cron inventory without secrets or provider calls [skip ci]"
          git push origin HEAD:codex/ball46-5usd-latency-control-20261102
