name: Test BALL46 Pin V2 Preserve Status 20261111
on:
  push:
    branches: [test/ball46-pin-v2-preserve-status-20261111]
    paths: ['pinned-fixtures-v2-production/STATUS_PRESERVE_TEST_READY']
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: test/ball46-pin-v2-preserve-status-20261111}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node pinned-fixtures-v2-production/status-preserve-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pin-v2-status-preserve-${{ github.run_id }}
          path: pinned-fixtures-v2-production/status-preserve-*.png
          retention-days: 7
