name: BALL46 current Production read-only photo audit 20261109
on:
  push:
    branches: [codex/ball46-member-promo-20261104]
    paths: ['work/member-promo-sharp-20261104/audit-request-20261109.json']
permissions:
  contents: write
jobs:
  read-only-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false --prefix work/member-promo-sharp-20261104 acorn@8.15.0
      - name: Read active version modules configuration routes and public health without any Production writes
        run: node work/member-promo-sharp-20261104/audit-20261109.mjs
      - name: Preserve audit
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/member-promo-sharp-20261104/release-audit/audit-20261109.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record fresh read-only Production photo audit [skip ci]"
          git push origin HEAD:codex/ball46-member-promo-20261104
