name: BALL46 TEST BTTS automated Bet365 odds delivery to bot guarded deploy
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-btts-automatic-bet365-price-to-bot-deploy-test-20261122.yml]
permissions: {contents: read}
concurrency:
  group: ball46-prematch-only-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Recheck BTTS quote selection and strict no-price blocker
        run: |
          node --check qa/prematch-history-20261120/btts-priced-fixture-pickup-test.mjs
          node --check qa/prematch-history-20261120/patch-btts-price-bridge-into-existing-test-worker.mjs
          node --check qa/prematch-history-20261120/deploy-btts-automated-bet365-price-to-bot-test-20261122.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/btts-priced-fixture-pickup.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/btts-ultra-shadow.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/btts-pick-ledger-test.test.mjs
      - name: Deploy ONLY TEST backend BTTS quote pickup + inspect a single capped real price pickup
        run: node qa/prematch-history-20261120/deploy-btts-automated-bet365-price-to-bot-test-20261122.mjs
