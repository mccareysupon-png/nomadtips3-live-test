name: CAR 3.4 Goaloo Bet365 Scout

on:
  push:
    branches:
      - scout-goaloo-bet365-34-20260824

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run CAR 3.4 tests
        working-directory: car3-4-real-market-audit/worker
        run: npm test
      - name: Syntax check fallback wrapper
        working-directory: car3-4-real-market-audit/worker
        run: |
          node --check src/goaloo-bet365-fallback.js
          node --check src/main-v4.js
      - name: Probe Goaloo Bet365 live AH feed
        working-directory: car3-4-real-market-audit/worker
        run: |
          node --input-type=module <<'NODE'
          import {fetchGoalooBet365RunOdds} from './src/goaloo-bet365-fallback.js';
          const result=await fetchGoalooBet365RunOdds({timeoutMs:10000,cacheSeconds:1});
          console.log(`Goaloo Bet365 quotes: ${result.quotes.size}`);
          if(result.quotes.size<1)throw new Error('GOALOO_BET365_FEED_EMPTY');
          NODE
