name: Deploy Ball46 Legacy Tombstones Production 20260921

on:
  push:
    branches: [work/ball46-remove-legacy-pages-20260921]
    paths:
      - '.github/workflows/deploy-ball46-legacy-tombstone-production-20260921.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BASE_SHA: 7c9e26118244dc14a676e7f887d97bdf899553fd
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  BALL46_WWW: https://www.ball46.com
  BALL46_APEX: https://ball46.com

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record Performance V1 Board and Odds baseline
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 8 --max-time 30 "$BALL46_WORKER/api/engine/board?before=$GITHUB_RUN_ID" -o /tmp/before.json
          node - <<'NODE'
          const fs=require('fs'),b=JSON.parse(fs.readFileSync('/tmp/before.json'));
          if(b?.ok!==true||!Array.isArray(b.fixtures)) throw Error('Board unhealthy before tombstone deploy');
          function has(v){if(Array.isArray(v))return v.length>0;if(!v||typeof v!=='object')return false;const c=[v.bookmakers,v.odds,v.markets,v?.data?.bookmakers,v?.data?.odds,v?.data?.markets];return c.some(x=>Array.isArray(x)?x.length>0:!!(x&&typeof x==='object'&&Object.keys(x).length))||Object.keys(v).some(k=>/bet365|pinnacle|crown|1xbet|12bet|interwetten|macauslot|18bet|vcbet|easybets|bookmaker/i.test(String(k)))}
          const odds=b.fixtures.filter(f=>has(f?.providerOdds)||has(f?.fullOdds)||has(f?.odds)).length;
          fs.writeFileSync('/tmp/pre.json',JSON.stringify({fixtures:b.fixtures.length,odds}));
          console.log('PRE TOMBSTONE',{fixtures:b.fixtures.length,odds});
          NODE

      - name: Guard Golden Page 1 and prove worker change is route-only
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            workers/nomadtips3-engine-343/src/index.js \
            workers/nomadtips3-343-preview/wrangler.ball46.jsonc \
            nomad-live-343/index.html \
            nomad-live-343/dashboard-v2-stage3.js \
            nomad-live-343/bulk-odds-compat-343.js \
            nomad-live-343/full-market-bookmaker-343.js \
            nomad-live-343/live-summary-full-odds-343.js \
            nomad-live-343/expanded-match-343.js \
            nomad-live-343/signal-next.js \
            nomad-live-343/singlepage-workspace-343.js; do
            git diff --quiet "$BASE_SHA"..HEAD -- "$p" || { echo "FORBIDDEN PAGE1 CHANGE: $p"; exit 1; }
          done
          python - <<'PY'
          import subprocess,re
          from pathlib import Path
          path='workers/nomadtips3-343-preview/src/index.js'
          base=subprocess.check_output(['git','show',f'{__import__("os").environ["BASE_SHA"]}:{path}'],text=True)
          cur=Path(path).read_text()
          block=re.compile(r"\n\n// Ball46 legacy standalone Page 2/3 shutdown\..*?function legacyStandaloneGone\(\) \{\n\s*return new Response\('Gone', \{ status:410, headers:\{'cache-control':'no-store','x-ball46-legacy':'standalone-gone'\} \}\);\n\s*\}\n",re.S)
          stripped,n=block.subn('',cur,count=1)
          if n!=1: raise SystemExit('legacy tombstone block missing or changed')
          guard="\n    if ((request.method === 'GET' || request.method === 'HEAD') && LEGACY_STANDALONE_PATHS.has(url.pathname)) return legacyStandaloneGone();"
          if guard not in stripped: raise SystemExit('legacy tombstone guard missing')
          stripped=stripped.replace(guard,'',1)
          if stripped!=base: raise SystemExit('worker contains changes beyond isolated legacy tombstone')
          print('WORKER ROUTE-ONLY PROOF PASS')
          PY
          node --check workers/nomadtips3-343-preview/src/index.js

      - name: Validate physical removal and sitemap cleanup
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            signal.html statistics.html signal-next.html statistics-next.html \
            signal.js statistics.js statistics-next.js signal-focus-343.js \
            signal-bettor-343.css signal-compact-343.css signal-v2-clean-343.css \
            statistics-page-343.css statistics-v2-clean-343.css content-rails-343.css v2-header.css; do
            test ! -e "nomad-live-343/$p" || { echo "LEGACY FILE STILL EXISTS: $p"; exit 1; }
          done
          ! grep -Eq 'signal\.html|statistics\.html' nomad-live-343/sitemap.xml
          grep -Fq 'signal-next.js' nomad-live-343/index.html
          grep -Fq 'singlepage-workspace-343.js' nomad-live-343/index.html
          grep -Fq 'LEGACY_STANDALONE_PATHS' workers/nomadtips3-343-preview/src/index.js
          git diff --check

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Dry-run production tombstone package
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy production tombstones
        id: deploy
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify Worker Page 1 Odds APIs and legacy 410
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 15); do
            if curl -fsS --connect-timeout 8 --max-time 20 "$BALL46_WORKER/?tombstone=$GITHUB_RUN_ID-$n" -o /tmp/home.html \
              && grep -Fq 'signal-next.js' /tmp/home.html \
              && grep -Fq 'singlepage-workspace-343.js' /tmp/home.html; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          curl -fsS --connect-timeout 8 --max-time 30 "$BALL46_WORKER/api/engine/board?after=$GITHUB_RUN_ID" -o /tmp/board.json
          curl -fsS --connect-timeout 8 --max-time 30 "$BALL46_WORKER/api/engine/statistics-lite?after=$GITHUB_RUN_ID" -o /tmp/stats.json
          node - <<'NODE'
          const fs=require('fs'),pre=JSON.parse(fs.readFileSync('/tmp/pre.json')),b=JSON.parse(fs.readFileSync('/tmp/board.json')),t=JSON.parse(fs.readFileSync('/tmp/stats.json'));
          function has(v){if(Array.isArray(v))return v.length>0;if(!v||typeof v!=='object')return false;const c=[v.bookmakers,v.odds,v.markets,v?.data?.bookmakers,v?.data?.odds,v?.data?.markets];return c.some(x=>Array.isArray(x)?x.length>0:!!(x&&typeof x==='object'&&Object.keys(x).length))||Object.keys(v).some(k=>/bet365|pinnacle|crown|1xbet|12bet|interwetten|macauslot|18bet|vcbet|easybets|bookmaker/i.test(String(k)))}
          if(b?.ok!==true||!Array.isArray(b.fixtures)) throw Error('Worker Board unhealthy');
          const odds=b.fixtures.filter(f=>has(f?.providerOdds)||has(f?.fullOdds)||has(f?.odds)).length;
          if(pre.fixtures>0&&b.fixtures.length===0) throw Error('fixtures dropped to zero');
          if(pre.odds>0&&odds===0) throw Error(`GOLDEN ODDS LOST ${pre.odds}->0`);
          if(t?.ok!==true||t?.compact!==true||!Array.isArray(t.rows)) throw Error('statistics-lite unhealthy');
          console.log('WORKER TOMBSTONE PASS',{before:pre,after:{fixtures:b.fixtures.length,odds},statsRows:t.rows.length});
          NODE
          for p in signal.html statistics.html signal-next.html statistics-next.html signal.js statistics.js statistics-next.js signal-focus-343.js v2-header.css; do
            code=$(curl -sS --connect-timeout 8 --max-time 20 -o /dev/null -w '%{http_code}' "$BALL46_WORKER/$p?tombstone=$GITHUB_RUN_ID")
            echo "worker $p -> $code"
            test "$code" = 410
          done

      - name: Verify WWW and Apex Page 1 Odds and legacy 410
        shell: bash
        run: |
          set -euo pipefail
          for base in "$BALL46_WWW" "$BALL46_APEX"; do
            ok=0
            for n in $(seq 1 25); do
              home=$(curl -sS --connect-timeout 8 --max-time 20 -o /tmp/site.html -w '%{http_code}' "$base/?tombstone=$GITHUB_RUN_ID-$n")
              sig=$(curl -sS --connect-timeout 8 --max-time 20 -o /dev/null -w '%{http_code}' "$base/signal.html?tombstone=$GITHUB_RUN_ID-$n")
              sta=$(curl -sS --connect-timeout 8 --max-time 20 -o /dev/null -w '%{http_code}' "$base/statistics.html?tombstone=$GITHUB_RUN_ID-$n")
              if [ "$home" = 200 ] && grep -Fq 'singlepage-workspace-343.js' /tmp/site.html && [ "$sig" = 410 ] && [ "$sta" = 410 ]; then ok=1; break; fi
              sleep 3
            done
            test "$ok" = 1
          done
          curl -fsS --connect-timeout 8 --max-time 30 "$BALL46_WWW/api/engine/board?final=$GITHUB_RUN_ID" -o /tmp/www-board.json
          node - <<'NODE'
          const fs=require('fs'),pre=JSON.parse(fs.readFileSync('/tmp/pre.json')),b=JSON.parse(fs.readFileSync('/tmp/www-board.json'));
          function has(v){if(Array.isArray(v))return v.length>0;if(!v||typeof v!=='object')return false;const c=[v.bookmakers,v.odds,v.markets,v?.data?.bookmakers,v?.data?.odds,v?.data?.markets];return c.some(x=>Array.isArray(x)?x.length>0:!!(x&&typeof x==='object'&&Object.keys(x).length))||Object.keys(v).some(k=>/bet365|pinnacle|crown|1xbet|12bet|interwetten|macauslot|18bet|vcbet|easybets|bookmaker/i.test(String(k)))}
          if(b?.ok!==true||!Array.isArray(b.fixtures)) throw Error('WWW Board unhealthy');
          const odds=b.fixtures.filter(f=>has(f?.providerOdds)||has(f?.fullOdds)||has(f?.odds)).length;
          if(pre.odds>0&&odds===0) throw Error(`WWW GOLDEN ODDS LOST ${pre.odds}->0`);
          console.log('WWW TOMBSTONE PASS',{fixtures:b.fixtures.length,odds});
          NODE

      - name: Automatic rollback to Performance V1 on any failure
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'Tombstone validation failed. Restoring Performance V1 baseline...'
          git worktree add --detach /tmp/ball46-tombstone-rollback "$BASE_SHA"
          cd /tmp/ball46-tombstone-rollback/workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc
          sleep 5
          curl -fsS --connect-timeout 8 --max-time 30 "$BALL46_WORKER/api/engine/board?rollback=$GITHUB_RUN_ID" -o /tmp/rollback.json
          node - <<'NODE'
          const fs=require('fs'),b=JSON.parse(fs.readFileSync('/tmp/rollback.json'));if(b?.ok!==true||!Array.isArray(b.fixtures))throw Error('Rollback Board unhealthy');console.log('PERFORMANCE V1 RESTORED',{fixtures:b.fixtures.length});
          NODE
