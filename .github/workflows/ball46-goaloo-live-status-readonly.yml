name: BALL46 Goaloo live status read only
on:
  push:
    branches: [stage/ball46-multisource-v5-20261017]
    paths: [.github/workflows/ball46-goaloo-live-status-readonly.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CF_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Retrieve Cloudflare invocation error details read-only
        run: |
          node - <<'NODE'
          const id=process.env.CF_ID,token=process.env.CF_TOKEN;
          (async()=>{
            const from=Date.parse('2026-10-18T10:09:54Z'),to=Date.now();
            const query={queryId:'ball46-goaloo-status-only',dry:true,
              view:'events',limit:20,timeframe:{from,to},
              parameters:{datasets:['cloudflare-workers'],
               filters:[{key:'$metadata.service',operation:'eq',type:'string',
                value:'ball46-multisource-shadow-20261018'}]}};
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+id+
               '/workers/observability/telemetry/query',{method:'POST',
               headers:{Authorization:'Bearer '+token,'content-type':'application/json'},
               body:JSON.stringify(query),signal:AbortSignal.timeout(20000)});
            const d=await r.json().catch(()=>({}));
            console.log('CF_WORKER_ERRORS_READONLY',JSON.stringify({
              http:r.status,success:d.success===true,
              errors:d.errors?.map(x=>x.message).slice(0,3),
              count:d.result?.events?.count??null,
              recent:(d.result?.events?.events||[]).slice(0,15).map(x=>({
               error:String(x?.$metadata?.error||x?.$metadata?.message||'').slice(0,150),
               timestamp:x.timestamp,
               outcome:x.$workers?.outcome,
               eventType:x.$workers?.eventType}))
            }));
          })().catch(e=>{console.error('CF_WORKER_ERRORS_UNAVAILABLE',e.message)});
          NODE
      - name: Break down Cloudflare scheduled invocation status without writes
        run: |
          node - <<'NODE'
          const id=process.env.CF_ID,token=process.env.CF_TOKEN;
          const query='query Q($tag:string,$since:string,$name:string){viewer{accounts(filter:{accountTag:$tag}){workersInvocationsAdaptive(limit:50,filter:{scriptName:$name,datetime_geq:$since}){dimensions{status datetime}sum{requests errors subrequests}}}}}';
          (async()=>{
           const r=await fetch('https://api.cloudflare.com/client/v4/graphql',{
            method:'POST',headers:{Authorization:'Bearer '+token,'content-type':'application/json'},
            body:JSON.stringify({query,variables:{tag:id,since:'2026-10-18T10:09:54Z',
             name:'ball46-multisource-shadow-20261018'}})});
           const x=await r.json();
           const rows=x?.data?.viewer?.accounts?.[0]?.workersInvocationsAdaptive||[];
           const groups={};let total=0,errors=0,subrequests=0;
           for(const p of rows){
            const key=p.dimensions?.status||'UNKNOWN';
            groups[key]=(groups[key]||0)+p.sum.requests;total+=p.sum.requests;
            errors+=p.sum.errors;subrequests+=p.sum.subrequests||0;
           }
           console.log('BALL46_WORKER_CRON_OUTCOMES_READONLY',JSON.stringify({
            totalSampled:total,errors,subrequests,byRuntimeStatus:groups,
            graphqlErrors:x.errors?.map(e=>e.message)||[]}));
          })().catch(e=>console.error('WORKER_STATUS_UNAVAILABLE',e.message));
          NODE
      - name: Inspect deployed settings, cron, ledger and Worker invocation counts without writes
        run: |
          node - <<'NODE'
          const id=process.env.CF_ID,token=process.env.CF_TOKEN;
          const name='ball46-multisource-shadow-20261018';
          const base='https://api.cloudflare.com/client/v4/accounts/'+id+'/workers/scripts/'+name;
          const header={Authorization:'Bearer '+token};
          const start='2026-10-18T10:09:54Z';
          const now=new Date().toISOString(), report={now,liveReleaseAt:start,readsOnly:true};
          async function get(u){
            const r=await fetch(u,{headers:header,signal:AbortSignal.timeout(17000)});
            const d=await r.json().catch(()=>({}));
            if(!r.ok||d.success===false)throw Error('CF_READ_HTTP_'+r.status+':'+u.split('/').at(-1));
            return d.result;
          }
          function ms(x){
            if(typeof x==='number')return x<1e11?x*1000:x;
            if(typeof x==='string'&&/^\d{10,13}$/.test(x))return ms(Number(x));
            const n=Date.parse(String(x||''));return Number.isFinite(n)?n:NaN;
          }
          (async()=>{
            const [dep,settings,schedule]=await Promise.all([
              get(base+'/deployments'),get(base+'/settings'),get(base+'/schedules')]);
            const active=dep.deployments?.[0];
            const bindings=settings.bindings||settings.settings?.bindings||[];
            const vars=Object.fromEntries(bindings.filter(x=>[
              'GOALOO_POLL_ENABLED','GOALOO_UTC_CERTIFIED','GOALOO_FT_CERTIFIED',
              'ENABLE_NATIVE_FORWARD','GOALOO_OFFSET_MINUTES','CANONICAL_CAPTURE_ENABLED',
              'PENDING_LEDGER_READONLY_ENABLED','GOALOO_APPROVED_LEAGUES',
              'GOALOO_APPROVED_TEAMS'
            ].includes(x.name)).map(x=>[x.name,x.text??x.value??null]));
            const crons=schedule.schedules??schedule??[];
            report.worker={version:active?.versions?.[0]?.version_id,
              assignedPercent:active?.versions?.[0]?.percentage,
              config:vars,cron:Array.isArray(crons)?crons.map(x=>x.cron):[],
              nativeTokenPresent:bindings.some(x=>x.name==='NATIVE_SETTLEMENT_TOKEN'),
              hasEngineBinding:bindings.some(x=>x.name==='ENGINE')};
            const api='https://nomadtips3-engine-343.mccarey-supon.workers.dev';
            const ledger=await fetch(api+'/ledger-health',{signal:AbortSignal.timeout(15000)});
            if(!ledger.ok)throw Error('LEDGER_HEALTH_'+ledger.status);
            const status=await ledger.json();
            report.ledger={total:status.ledgerTotal,pending:status.pending,
              settled:status.settledTotal,version:status.version};
            const seen=new Set();let cursor='stat:v2:row:9999999999999:~';
            let total=0,ext=0,extSince=0,recent=0,latest=null,source2Marker=0;
            const bySource={};
            for(let i=0;i<40;i++){
              if(seen.has(cursor))throw Error('CURSOR_LOOP');seen.add(cursor);
              const url=api+'/statistics?cursor='+encodeURIComponent(cursor)+'&paged=1';
              const r=await fetch(url,{signal:AbortSignal.timeout(15000)});
              if(!r.ok)throw Error('LEDGER_PAGE_'+r.status);
              const d=await r.json();
              if(d.ok!==true||d.statisticsSource!=='LEDGER_V2_ONLY')
               throw Error('LEDGER_NOT_AUTHORITATIVE');
              for(const row of d.rows||[]){
                total++;
                const src=String(row.settlementSource??'MISSING');
                bySource[src]=(bySource[src]||0)+1;
                if(src==='EXTERNAL_FINAL_BRIDGE')ext++;
                const t=ms(row.settledAt);
                if(Number.isFinite(t)&&t>=Date.parse(start)){
                  recent++;
                  if(src==='EXTERNAL_FINAL_BRIDGE')extSince++;
                  latest=Math.max(latest||0,t);
                }
                if(/goaloo|gaoloo/i.test(JSON.stringify([
                   row.settlementProvider,row.resultProvider,row.finalSource,row.provider
                ])))source2Marker++;
              }
              if(!d.nextCursor){report.ledgerRowsComplete=true;break;}
              if(d.nextCursor>=cursor)throw Error('INVALID_CURSOR');
              cursor=d.nextCursor;
            }
            report.results={scanned:total,bySettlementSource:bySource,
              externalBridgeOverall:ext,externalBridgeAfterRelease:extSince,
              settlementsAfterRelease:recent,latestSettledAt:latest?new Date(latest).toISOString():null,
              explicitGoalooProviderFields:source2Marker};
            // Read-only Cloudflare Workers invocation aggregates. If API shape
            // differs, log a non-fatal diagnostic rather than inventing usage.
            try{
              const query='query WorkerUsage($accountTag: string!, $since: Time!) { viewer { accounts(filter: {accountTag: $accountTag}) { workersInvocationsAdaptive(filter: {scriptName: "ball46-multisource-shadow-20261018", datetime_geq: $since}, limit: 1) { sum { requests errors } } } } }';
              const g=await fetch('https://api.cloudflare.com/client/v4/graphql',{
                method:'POST',headers:{...header,'content-type':'application/json'},
                body:JSON.stringify({query,variables:{accountTag:id,since:start}}),
                signal:AbortSignal.timeout(15000)});
              const d=await g.json();
              const row=d?.data?.viewer?.accounts?.[0]?.workersInvocationsAdaptive?.[0];
              report.workerUsage=row?.sum||null;
              if(d.errors?.length)report.workerUsageError=d.errors.map(x=>x.message).slice(0,2);
            }catch(e){report.workerUsageError=String(e.message).slice(0,140)}
            console.log('BALL46_LIVE_GOALOO_STATUS_READONLY',JSON.stringify(report));
          })().catch(e=>{console.error('BALL46_LIVE_STATUS_ERROR',e.message);process.exit(1)});
          NODE
