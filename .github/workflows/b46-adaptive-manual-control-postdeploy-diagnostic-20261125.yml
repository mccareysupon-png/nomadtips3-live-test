name: BALL46 TEST manual control 25 Nov read-only post-deploy diagnosis
on:
  push:
    branches: [feature/ball46-adaptive-manual-control-test-20261125]
    paths: [.github/workflows/b46-adaptive-manual-control-postdeploy-diagnostic-20261125.yml]
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Owner auth API GET only and public page no state changes
        run: |
          node --input-type=module <<'JS'
          import {createHmac} from 'node:crypto';
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const auth='Bearer '+createHmac('sha256',token).update('BALL46_PREMATCH_ONLY_V1').digest('hex');
          const base='https://ball46-prematch-only-test-20261120.mccarey-supon.workers.dev';
          for(const path of ['/adaptive-control-test','/adaptive-control-api-test','/adaptive-control-active-test','/ou-adaptive-research-state-test','/prematch-ou-engine-state']){
            try{
              const r=await fetch(base+path,{headers:{authorization:auth,accept:'application/json'},cache:'no-store',signal:AbortSignal.timeout(25000)});
              const text=await r.text();
              let j;try{j=JSON.parse(text)}catch{}
              console.log('B46_READONLY_DIAG '+JSON.stringify({path,http:r.status,contentType:r.headers.get('content-type'),
                error:j?.error,details:j?{code:j.code,formulas:j.formulas?.length,summary:j.summary,kind:j.kind}:undefined,
                textHead:j?undefined:text.slice(0,180)}));
            }catch(e){console.log('B46_READONLY_DIAG_ERROR '+JSON.stringify({path,error:String(e)}))}
          }
          JS
