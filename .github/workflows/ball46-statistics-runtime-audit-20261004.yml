name: Ball46 Statistics Runtime DOM Audit
on:
  push:
    branches: ['safe/ball46-statistics-runtime-total-20261004']
    paths: ['.github/workflows/ball46-statistics-runtime-audit-20261004.yml']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: deploy-assets/match-status-svg-20261003
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          node runtime-trace.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-statistics-runtime-${{ github.run_id }}
          path: deploy-assets/match-status-svg-20261003/audit/
          retention-days: 7
