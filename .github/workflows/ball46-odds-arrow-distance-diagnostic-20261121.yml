name: BALL46 odds arrow-to-number distance read-only TEST diagnostic
on:
  push:
    branches: [test/ball46-premium-match-colors-20261120]
    paths: ['.github/workflows/ball46-odds-arrow-distance-diagnostic-20261121.yml']
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Read actual odds text and arrow positions without modifying website or backend
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch();
          const p=await browser.newPage({viewport:{width:1440,height:950},serviceWorkers:'block'});
          await p.addInitScript(()=>localStorage.setItem('nomad343_dashboard_theme_v1','dark'));
          try{
            await p.goto('https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev/',{waitUntil:'domcontentloaded',timeout:70000});
            await p.waitForFunction(()=>[...document.querySelectorAll('[data-match-id].match-row .market-cell .b46-v3-quote strong[data-nomad-odds-raw]')].some(e=>e.getBoundingClientRect().width>0),null,{timeout:45000});
            const result=await p.evaluate(()=>{
              const candidates=[...document.querySelectorAll('[data-match-id].match-row .market-cell .b46-v3-quote strong[data-nomad-odds-raw]')].filter(e=>e.getBoundingClientRect().width>0);
              const samples=[], seen=new Set();
              for(const strong of candidates){
                const q=strong.closest('.b46-v3-quote'),rect=q.getBoundingClientRect(),num=strong.getBoundingClientRect();
                const type=q.closest('.market-cell')?.className||'';
                const key=type+'|'+(strong.textContent.trim().length>=4?'long':'short');
                if(seen.has(key))continue;
                seen.add(key);
                q.style.setProperty('--b46-odds-arrow-price-center',(num.top+num.height/2-rect.top).toFixed(2)+'px');
                q.setAttribute('data-b46-odds-move','up');
                const arrow=getComputedStyle(q,'::after');
                const arrowWidth=parseFloat(arrow.width),arrowLeft=rect.right-parseFloat(arrow.right)-arrowWidth;
                samples.push({market:type,price:strong.textContent.trim(),quote:{x:rect.x,width:rect.width},numeral:{x:num.x,width:num.width,right:num.right},arrow:{left:arrowLeft,width:arrowWidth,right:arrowLeft+arrowWidth},gap:arrowLeft-num.right,availableQuoteRoom:rect.right-num.right,cardOverflow:(arrowLeft+arrowWidth)-rect.right});
                q.removeAttribute('data-b46-odds-move');q.style.removeProperty('--b46-odds-arrow-price-center');
                if(samples.length>=20)break;
              }
              return samples;
            });
            console.log('REAL_ODDS_ARROW_TEXT_GAPS '+JSON.stringify(result));
            if(!result.length)throw new Error('NO_LIVE_ODDS_GEOMETRY');
          }finally{await p.close();await browser.close()}
          NODE