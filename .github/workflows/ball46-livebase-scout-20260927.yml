name: SCOUT ONLY - Ball46 exact current production base 20260927

on:
  push:
    branches: [ops/ball46-livebase-scout-20260927]
    paths:
      - '.github/workflows/ball46-livebase-scout-20260927.yml'

permissions:
  contents: read

jobs:
  scout-current-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      REFERENCE_SOURCE: ac7229ca7f521f8627bd66d5fbb939b970118571
    steps:
      - name: Checkout reference file map only
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REFERENCE_SOURCE }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read current Cloudflare deployment metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/scout
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/ball46-production/deployments" \
            -o /tmp/scout/deployments.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/scout/deployments.json','utf8'));
          if(j.success!==true) throw new Error('DEPLOYMENTS_API_NOT_OK');
          const rows=Array.isArray(j.result?.deployments)?j.result.deployments:Array.isArray(j.result)?j.result:[];
          console.log('DEPLOYMENT_ROWS', rows.slice(0,5).map(x=>({id:x.id,created_on:x.created_on,versions:x.versions}))); 
          NODE

          curl -fsS -D /tmp/scout/worker-content.headers \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/ball46-production/content" \
            -o /tmp/scout/worker-content.bin
          echo "WORKER_CONTENT_SHA256=$(sha256sum /tmp/scout/worker-content.bin | awk '{print $1}')"
          echo "WORKER_CONTENT_BYTES=$(wc -c < /tmp/scout/worker-content.bin)"
          sed -n '1,20p' /tmp/scout/worker-content.headers

      - name: Capture exact current public assets without modifying Production
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/scout/current-assets
          mkdir -p /tmp/scout/current-assets
          cd nomad-live-343
          find . -type f -printf '%P\n' | LC_ALL=C sort > /tmp/scout/reference-files.txt
          cd - >/dev/null
          echo "REFERENCE_FILE_COUNT=$(wc -l < /tmp/scout/reference-files.txt)"

          missing=0
          while IFS= read -r name; do
            mkdir -p "/tmp/scout/current-assets/$(dirname "$name")"
            code=$(curl -sS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 \
              -H 'Cache-Control: no-cache' -o "/tmp/scout/current-assets/$name" \
              -w '%{http_code}' "$BALL46_WORKER/$name?scout=${GITHUB_RUN_ID}")
            if [ "$code" != "200" ] || [ ! -s "/tmp/scout/current-assets/$name" ]; then
              echo "MISSING_OR_BAD $name http=$code"
              missing=$((missing+1))
            fi
          done < /tmp/scout/reference-files.txt
          [ "$missing" = 0 ] || { echo "SCOUT_STOP_MISSING_FILES=$missing"; exit 1; }

          (cd /tmp/scout/current-assets && find . -type f -printf '%P\n' | LC_ALL=C sort | while read -r f; do sha256sum "$f"; done) > /tmp/scout/current-assets.sha256
          echo "CURRENT_CAPTURE_COUNT=$(wc -l < /tmp/scout/current-assets.sha256)"
          sha256sum /tmp/scout/current-assets/index.html /tmp/scout/current-assets/dashboard-v2-stage3.js /tmp/scout/current-assets/dashboard-v2-tune.css

      - name: Inspect exact current UI targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/scout/current-assets')
          idx=(root/'index.html').read_text(errors='replace')
          js=(root/'dashboard-v2-stage3.js').read_text(errors='replace')
          css=(root/'dashboard-v2-tune.css').read_text(errors='replace')
          print('INDEX_BYTES',len(idx),'JS_BYTES',len(js),'CSS_BYTES',len(css))
          print('INDEX_MARKERS',{
            'mobile_parity': 'BALL46-MOBILE-PARITY' in idx,
            'row_balance': '20260927-row-balance' in idx,
            'stage3_ref': 'dashboard-v2-stage3.js' in idx,
            'tune_ref': 'dashboard-v2-tune.css' in idx,
          })
          p=js.find('function rowHtml')
          if p<0: raise SystemExit('ROW_HTML_NOT_FOUND')
          print('---CURRENT_ROW_HTML---')
          print(js[p:p+2200])
          print('---END_CURRENT_ROW_HTML---')
          for needle in ('@media(min-width:901px)','@media(min-width:761px) and (max-width:900px)'):
            q=css.find(needle)
            print('CSS_NEEDLE',needle,'AT',q)
            if q>=0: print(css[q:q+2200])
          PY

      - name: Verify current backend remains healthy read-only
        shell: bash
        run: |
          set -euo pipefail
          for ep in health board signals statistics; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 \
              "$BALL46_WORKER/api/engine/$ep?scout=${GITHUB_RUN_ID}" -o "/tmp/scout/$ep.json"
          done
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/scout/health.json'));
          const b=JSON.parse(fs.readFileSync('/tmp/scout/board.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/scout/signals.json'));
          const t=JSON.parse(fs.readFileSync('/tmp/scout/statistics.json'));
          if(h?.ok!==true) throw new Error('HEALTH_BAD');
          if(b?.ok!==true || !Array.isArray(b.fixtures)) throw new Error('BOARD_BAD');
          if(!Array.isArray(s.signals)) throw new Error('SIGNALS_BAD');
          if(t?.ok!==true || !Array.isArray(t.rows)) throw new Error('STATS_BAD');
          console.log('SCOUT_BACKEND_PASS',{fixtures:b.fixtures.length,signals:s.signals.length,settled:t.rows.length});
          NODE

      - name: Save exact live-base artifact
        uses: actions/upload-artifact@v4
        with:
          name: ball46-livebase-${{ github.run_id }}
          path: |
            /tmp/scout/current-assets
            /tmp/scout/current-assets.sha256
            /tmp/scout/reference-files.txt
            /tmp/scout/deployments.json
            /tmp/scout/worker-content.headers
            /tmp/scout/worker-content.bin
          retention-days: 7
          if-no-files-found: error
