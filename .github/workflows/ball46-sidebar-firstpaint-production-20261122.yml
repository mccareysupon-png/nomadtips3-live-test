name: BALL46 owner-approved Sidebar Win Rate first-paint production release 20261122
on:
  push:
    branches: [release/ball46-sidebar-firstpaint-20261122]
    paths:
      - '.github/workflows/ball46-sidebar-firstpaint-production-20261122.yml'
      - 'qa/sidebar-firstpaint-release-20261122/**'
permissions: {contents: read}
concurrency:
  group: ball46-production-ui-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/release/ball46-sidebar-firstpaint-20261122'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scoped release modules
        run: |
          node --check qa/sidebar-firstpaint-release-20261122/client.mjs
          node --check qa/sidebar-firstpaint-release-20261122/wrapper.mjs
          node --check qa/sidebar-firstpaint-release-20261122/release.mjs
          npm install --prefix qa/sidebar-firstpaint-release-20261122/.runtime --no-fund --no-audit playwright@1.55.0
          qa/sidebar-firstpaint-release-20261122/.runtime/node_modules/.bin/playwright install chromium --only-shell
      - name: Inactive candidate, preview QA, Production activation and automatic rollback on failure
        run: node qa/sidebar-firstpaint-release-20261122/release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-sidebar-firstpaint-production-proof
          path: ${{ runner.temp }}/ball46-sidebar-firstpaint-release-proof
          if-no-files-found: ignore
