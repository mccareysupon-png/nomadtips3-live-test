name: BALL46 Adaptive read-only standalone page TEST Deploy + browser QA
on:
  push:
    branches: [release/b46-adaptive-readonly-page-20261125]
    paths: ['.github/workflows/b46-adaptive-readonly-page-test-20261125.yml']
permissions: {contents: read}
concurrency:
  group: b46-adaptive-readonly-test-20261125
  cancel-in-progress: false
jobs:
  test-page:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check syntax of isolated page and stage route
        run: |
          node --check qa/adaptive-readonly-production-20261125/b46-adaptive-readonly-page-20261125.mjs
          node --check qa/adaptive-readonly-production-20261125/worker.mjs
      - name: Deploy only standalone stage Worker (no production write)
        working-directory: qa/adaptive-readonly-production-20261125
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.toml
      - name: Install browser QA
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: QA read-only data, PC/mobile no-flicker, click speed, no POST
        run: node qa/adaptive-readonly-production-20261125/qa.mjs

# patched verified A-E formula families, staging integration QA rerun
