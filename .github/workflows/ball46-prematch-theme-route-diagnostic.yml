name: BALL46 Pre-Match TEST theme navigation diagnostic
on:
  push:
    branches: [test/ball46-premium-match-colors-20261120]
    paths: ['.github/workflows/ball46-prematch-theme-route-diagnostic.yml', 'qa/prematch-native-ui-20261121/prematch-client.mjs']
permissions: { contents: read }
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Diagnose real theme click with Pre-Match open, desktop and mobile
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { chromium,devices } from 'playwright';
          const browser=await chromium.launch();
          const base='https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev';
          try{
            for(let i=0;i<80;i++){
              const r=await fetch(base+'/__b46_prematch_client.js?version=theme-route',{cache:'no-store'});
              const t=r.ok?await r.text():'';
              if(t.includes('Theme toggles change appearance only'))break;
              if(i===79)throw Error('TEST_WORKER_NOT_UPDATED_WITH_THEME_GUARD');
              await new Promise(res=>setTimeout(res,2000));
            }
            for(const mobile of [false,true]){
              const p=await browser.newPage(mobile?{...devices['iPhone 13'],serviceWorkers:'block'}:{viewport:{width:1440,height:920},serviceWorkers:'block'});
              const errs=[];p.on('pageerror',e=>errs.push(String(e.message).slice(0,220)));
              // Initialize this browser profile ONCE. An initScript would
              // reset light->dark on EVERY reload and falsely fail persistence.
              await p.goto(base+'/?themeProfileInit=1',{waitUntil:'domcontentloaded',timeout:60000});
              await p.evaluate(()=>localStorage.setItem('nomad343_dashboard_theme_v1','dark'));
              await p.goto(base+'/?b46pm=all&b46pmPeriod=all&themeRouteDiagnostic=1',{waitUntil:'domcontentloaded',timeout:60000});
              await p.waitForFunction(()=>document.body.dataset.b46PrematchView==='1'&&!!document.querySelector('#b46-prematch-panel .b46pm-performance'),null,{timeout:20000});
              const openMobileTheme=async()=>{
                if(!mobile)return;
                const themeButton=p.locator('button[data-b46-mobile-theme-toggle]');
                if(!await themeButton.isVisible()){
                  await p.locator('[data-b46m-open]').first().click({timeout:8000});
                }
                await themeButton.waitFor({state:'visible',timeout:10000});
              };
              await openMobileTheme();
              const examine=()=>p.evaluate(()=>{
                const shape=()=>({
                  url:location.href,pathname:location.pathname,search:location.search,hash:location.hash,
                  theme:document.documentElement.dataset.theme,storageTheme:localStorage.getItem('nomad343_dashboard_theme_v1'),
                  mode:document.body.dataset.b46PrematchView,visible:!!document.querySelector('#b46-prematch-panel:not([hidden])'),
                  preMatchCount:document.querySelectorAll('[data-b46-prematch-route]').length,
                  sidebarCount:document.querySelectorAll('aside.left-rail').length,
                  mainCount:document.querySelectorAll('section.workspace.singlepage').length,
                  nativeView:document.querySelector('[data-workspace-heading]')?.textContent,
                  activePreMatch:[...document.querySelectorAll('[data-b46-prematch-route].active')].map(x=>x.dataset.b46PrematchRoute),
                  pageScripts:[...document.scripts].map(x=>x.src).filter(x=>x.includes('prematch')).slice(0,10)
                });
                const items=[...document.querySelectorAll('button,[role="button"],input[type="checkbox"],select')];
                const clickable=items.filter(e=>{
                  const a=[e.outerHTML.slice(0,420),e.ariaLabel,e.getAttribute('title'),e.textContent?.slice(0,120)].join(' ').toLowerCase();
                  return /theme|dark|light|สว่าง|มืด|mode|sun|moon|appearance|สี/.test(a);
                }).slice(0,30).map(e=>({html:e.outerHTML.slice(0,450),visible:!!e.getClientRects().length,label:e.getAttribute('aria-label'),text:e.textContent?.trim().slice(0,75),title:e.getAttribute('title')}));
                return {shape:shape(),clickable};
              });
              const before=await examine();console.log('PREMATCH_THEME_DIAG_BEFORE '+JSON.stringify({mobile,...before}));
              const candidates=mobile?['button[data-b46-mobile-theme-toggle]']:['button[data-theme-toggle]'];
              let clicked=null;
              for(const c of candidates){const nodes=p.locator(c);for(let i=0;i<Math.min(await nodes.count(),5);i++){
                const node=nodes.nth(i);if(await node.isVisible().catch(()=>false)){
                  try{const tag=await node.evaluate(x=>x.outerHTML.slice(0,450));await node.click({timeout:2500});clicked={selector:c,index:i,html:tag};break}catch(e){console.log('THEME_DIAG_CLICK_ERROR '+JSON.stringify({selector:c,error:String(e).slice(0,220)}))}
                }
              }if(clicked)break}
              assert(clicked,'THEME_CONTROL_NOT_CLICKED '+(mobile?'MOBILE':'DESKTOP'));
              await p.waitForTimeout(750);
              const after=await examine();
              console.log('PREMATCH_THEME_DIAG_AFTER '+JSON.stringify({mobile,clicked,...after,errors:errs}));
              const assertScene=(v,theme,label)=>{
                assert.equal(v.shape.theme,theme,label+'_THEME');
                assert.equal(v.shape.mode,'1',label+'_MODE');
                assert.equal(v.shape.visible,true,label+'_PANEL_NOT_VISIBLE');
                assert(new URL(v.shape.url).searchParams.get('b46pm')==='all',label+'_ROUTE_LOST');
                assert.equal(new URL(v.shape.url).hostname,'ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev',label+'_LEFT_TEST_ORIGIN');
                assert(v.shape.nativeView==='Pre-Match Statistics',label+'_PRODUCTION_VIEW_SHOWING');
                assert(v.shape.activePreMatch.every(x=>x==='all')&&v.shape.activePreMatch.length>0,label+'_ACTIVE_NOT_RESTORED');
              };
              assertScene(after,'light','TO_LIGHT');
              await p.reload({waitUntil:'domcontentloaded',timeout:60000});
              await p.waitForFunction(()=>document.body.dataset.b46PrematchView==='1'&&!!document.querySelector('#b46-prematch-panel .b46pm-performance'),null,{timeout:20000});
              const lightReload=await examine();
              console.log('PREMATCH_THEME_DIAG_LIGHT_REFRESH '+JSON.stringify({mobile,...lightReload,errors:errs}));
              assertScene(lightReload,'light','LIGHT_AFTER_REFRESH');
              await openMobileTheme();
              const backButton=p.locator(candidates[0]);
              await backButton.click({timeout:6000});
              await p.waitForTimeout(550);
              const reversed=await examine();
              console.log('PREMATCH_THEME_DIAG_DARK_RETURN '+JSON.stringify({mobile,...reversed,errors:errs}));
              assertScene(reversed,'dark','BACK_TO_DARK');
              await p.reload({waitUntil:'domcontentloaded',timeout:60000});
              await p.waitForFunction(()=>document.body.dataset.b46PrematchView==='1'&&!!document.querySelector('#b46-prematch-panel .b46pm-performance'),null,{timeout:20000});
              const reloaded=await examine();
              console.log('PREMATCH_THEME_DIAG_AFTER_REFRESH '+JSON.stringify({mobile,...reloaded,errors:errs}));
              assertScene(reloaded,'dark','AFTER_REFRESH');
              // A theme switch must not drop us back into the native
              // production-origin view when selecting another Pre-Match tab.
              const navRoot=mobile?'#b46m-drawer':'aside.left-rail';
              const switchPrematch=async route=>{
                const nav=p.locator(navRoot+' [data-b46-prematch-route="'+route+'"]');
                if(mobile&&!await nav.isVisible()){
                  await p.locator('[data-b46m-open]').first().click({timeout:7000});
                }
                await nav.waitFor({state:'visible',timeout:12000});
                await nav.evaluate(x=>x.click());
                await p.waitForFunction(route=>{
                  const p=new URL(location.href).searchParams;
                  return document.body.dataset.b46PrematchView==='1'
                    &&p.get('b46pm')===route
                    &&!!document.querySelector('#b46-prematch-panel:not([hidden])');
                },route,{timeout:15000});
              };
              await switchPrematch('predictions');
              assert.equal(await p.locator('#b46-prematch-panel .b46pm-stats-board').count(),1,'RETURN_TO_PREMATCH_PREDICTIONS_DID_NOT_LOAD');
              const predictions=await examine();
              assert(predictions.shape.nativeView==='Pre-Match Predictions','PREDICTIONS_ARE_NATIVE_PAGE');
              await switchPrematch('all');
              await p.waitForFunction(()=>document.querySelector('#b46-prematch-panel .b46pm-performance-provenance')?.textContent.includes('Pre-Match Receiver'),null,{timeout:15000});
              const graphResponse=await p.request.get(base+'/__b46_prematch_graph?market=1X2&variant=all&filter=all&range=all');
              assert.equal(graphResponse.ok(),true,'TEST_RECEIVER_NOT_CONNECTED_AFTER_THEME');
              const graph=await graphResponse.json();
              assert.equal(graph.scope,'PREMATCH_TEST_ONLY','PRODUCTION_RECEIVER_EXPOSED_AFTER_THEME');
              assert.equal(graph.source,'RECEIVER','PREMATCH_RECEIVER_SOURCE_CHANGED');
              console.log('PREMATCH_THEME_NAV_ROUNDTRIP_PASS '+JSON.stringify({mobile,predictions:predictions.shape.url,statsRoute:(await examine()).shape.url,graphScope:graph.scope,receiverSequence:graph.sequence}));
              assert.deepEqual(errs,[],'UNHANDLED_PAGE_ERRORS');
              console.log('PREMATCH_THEME_ROUTING_PASS '+JSON.stringify({mobile,modes:['dark','light','dark','refresh'],keptTestOrigin:true,route:'all'}));
              await p.close();
            }
          }finally{await browser.close()}
          JS
