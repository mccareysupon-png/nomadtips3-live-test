name: Start CAR 3 Engine Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/start-car3-engine-once.yml"

permissions:
  contents: read

jobs:
  start-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start CAR 3 old Cloudflare engine
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://nomadtips3-test-api.mccarey-supon.workers.dev'
          echo 'CONTROL BEFORE:'
          curl -fsS "$BASE/engine-control"
          echo
          echo 'START:'
          curl -fsS -X POST "$BASE/engine-control" \
            -H 'Content-Type: application/json' \
            --data '{"mode":"RUNNING"}'
          echo
          sleep 12
          echo 'HEALTH:'
          curl -fsS "$BASE/engine-health"
          echo
          echo 'CAR3 STATUS:'
          curl -fsS "$BASE/car3/auto-scan-status"
          echo
