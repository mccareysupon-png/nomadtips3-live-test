name: Ball46 Mobile Focus Production ONLY

on:
  push:
    branches: [work/ball46-mobile-match-focus-20260918]
    paths:
      - '.github/workflows/ball46-mobile-focus-production-once.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BALL46_WORKER_URL: https://ball46-production.mccarey-supon.workers.dev
  BALL46_URL: https://ball46.com

jobs:
  deploy-ball46-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Ball46-only UI scope
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -s nomad-live-343/mobile-match-focus-343.js
          test -s nomad-live-343/mobile-match-focus-343.css
          grep -Fq 'mobile-match-focus-343.css?v=343-mobile-match-focus-v1' nomad-live-343/index.html
          grep -Fq 'mobile-match-focus-343.js?v=343-mobile-match-focus-v1' nomad-live-343/index.html
          node --check nomad-live-343/mobile-match-focus-343.js
          node --check workers/nomadtips3-343-preview/src/index.js
          grep -Fq '"name": "ball46-production"' workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          grep -Fq '"ENGINE", "service": "nomadtips3-engine-343"' workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          grep -Fq '"HUB", "service": "nomadtips3-5usd-hub-343"' workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          ! grep -Fq 'nomadtips3-live-web-production' workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          ! grep -Fq 'routes' workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          echo 'BALL46_ONLY_SCOPE_OK'

      - name: Dry-run Ball46 bundle
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy Ball46 production service only
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify Ball46 UI assets and existing data bindings
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 20); do
            code=$(curl -sS --max-time 25 -o /tmp/home.html -w '%{http_code}' "$BALL46_WORKER_URL/index.html?verify=${GITHUB_RUN_ID}-${n}" || true)
            if [ "$code" = 200 ] && grep -Fq 'mobile-match-focus-343.js?v=343-mobile-match-focus-v1' /tmp/home.html; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          curl -fsS --max-time 25 "$BALL46_WORKER_URL/mobile-match-focus-343.js?verify=${GITHUB_RUN_ID}" -o /tmp/mobile.js
          curl -fsS --max-time 25 "$BALL46_WORKER_URL/mobile-match-focus-343.css?verify=${GITHUB_RUN_ID}" -o /tmp/mobile.css
          grep -Fq "343-mobile-match-focus-v1" /tmp/mobile.js
          grep -Fq '@media(max-width:900px)' /tmp/mobile.css
          for endpoint in /api/hub/health /api/engine/board /api/engine/signals; do
            curl -fsS --max-time 30 "$BALL46_WORKER_URL$endpoint?verify=${GITHUB_RUN_ID}" -o /tmp/check.json
            node -e 'const j=require("/tmp/check.json");if(j.ok!==true)throw Error(JSON.stringify(j));'
          done
          curl -fsS --max-time 25 "$BALL46_URL/index.html?verify=${GITHUB_RUN_ID}" -o /tmp/domain.html
          grep -Fq 'mobile-match-focus-343.js?v=343-mobile-match-focus-v1' /tmp/domain.html
          echo 'BALL46_MOBILE_FOCUS_PRODUCTION_PASS'
