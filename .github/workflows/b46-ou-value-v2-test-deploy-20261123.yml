name: BALL46 O/U all-market EV V2 TEST shadow deploy
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-ou-value-v2-test-deploy-20261123.yml]
permissions: {contents: read}
concurrency:
  group: ball46-prematch-only-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prove all O/U 10-example, Asian quarter, bookies, source & legacy regression
        run: |
          node --check qa/prematch-history-20261120/deploy-ou-value-v2-shadow-test-20261123.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-value-screener-v2.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-instant-full-market-issue-v1.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-pending-price-completion-v1.test.mjs
      - name: Guarded deploy exactly isolated TEST worker; no 5USD and no production edits
        run: node qa/prematch-history-20261120/deploy-ou-value-v2-shadow-test-20261123.mjs
