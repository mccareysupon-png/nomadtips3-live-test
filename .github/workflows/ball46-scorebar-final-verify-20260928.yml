name: READ ONLY - Ball46 Scorebar Final Verify 20260928
on:
  push:
    branches:
      - work/ball46-scorebar-background-pending-20260928
    paths:
      - '.github/workflows/ball46-scorebar-final-verify-20260928.yml'
      - '.github/scripts/ball46_scorebar_final_verify_20260928.sh'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify live scorebar without deploy
        run: bash .github/scripts/ball46_scorebar_final_verify_20260928.sh
      - name: Upload verification proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-scorebar-final-verify-${{ github.run_id }}
          path: /tmp/b46-scorebar-final-verify
          if-no-files-found: ignore
          retention-days: 30
