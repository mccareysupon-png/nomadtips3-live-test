name: Test BALL46 Fresh Pinned Fixtures V2 20261111
on:
  push:
    branches: [test/ball46-pinned-fixtures-v2-20261111]
    paths: ['pinned-fixtures-v2/TEST_READY']
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: test/ball46-pinned-fixtures-v2-20261111}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Assemble fresh test harness
        run: |
          cat pinned-fixtures-v2/short.b64.part0 pinned-fixtures-v2/short.b64.part1 pinned-fixtures-v2/short.b64.part2 pinned-fixtures-v2/short.b64.part3 pinned-fixtures-v2/short.b64.part4 pinned-fixtures-v2/short.b64.part5 | base64 -d > pinned-fixtures-v2/test.mjs
          sed -i "s#pathname.startsWith('/api/')#pathname.startsWith('/api/full-market/')#g" pinned-fixtures-v2/test.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('pinned-fixtures-v2/test.mjs')
          s=p.read_text()
          s=s.replace(",.match-row[aria-expanded=\\\\\\\"true\\\\\\\"]","")
          lines=s.splitlines()
          out=[]
          changed={'desktop':0,'mobile':0}
          for line in lines:
              st=line.strip()
              if st.startswith("const original=await rows.first().getAttribute('data-match-id'),target=await rows.nth(5).getAttribute('data-match-id'),before=api;"):
                  out.append("  const original=await rows.first().getAttribute('data-match-id'),target=await rows.nth(5).getAttribute('data-match-id');")
                  changed['desktop']+=1
              elif st=="await rows.nth(5).locator('[data-b46-pin-v2]').click();await page.waitForTimeout(300);":
                  out.append("  const syncFetch=await rows.nth(5).locator('[data-b46-pin-v2]').evaluate(el=>{let n=0;const f=window.fetch;window.fetch=(...a)=>{n++;return f(...a)};try{el.click();return n}finally{window.fetch=f}});await page.waitForTimeout(300);")
                  changed['desktop']+=1
              elif st=="if(api!==before)throw new Error('DESKTOP_API_DELTA');":
                  out.append("  if(syncFetch!==0)throw new Error('DESKTOP_API_DELTA_'+syncFetch);")
                  changed['desktop']+=1
              elif st.startswith("const original=await cards.first().getAttribute('data-b46gn-fixture'),target=await cards.nth(5).getAttribute('data-b46gn-fixture'),before=api;"):
                  out.append("  const original=await cards.first().getAttribute('data-b46gn-fixture'),target=await cards.nth(5).getAttribute('data-b46gn-fixture');")
                  changed['mobile']+=1
              elif st=="await cards.nth(5).locator('[data-b46-pin-mobile]').click();await page.waitForTimeout(500);":
                  out.append("  const syncFetch=await cards.nth(5).locator('[data-b46-pin-mobile]').evaluate(el=>{let n=0;const f=window.fetch;window.fetch=(...a)=>{n++;return f(...a)};try{el.click();return n}finally{window.fetch=f}});await page.waitForTimeout(500);")
                  changed['mobile']+=1
              elif st=="if(api!==before)throw new Error('MOBILE_API_DELTA');":
                  out.append("  if(syncFetch!==0)throw new Error('MOBILE_API_DELTA_'+syncFetch);")
                  changed['mobile']+=1
              else:
                  out.append(line)
          assert changed=={'desktop':3,'mobile':3}, changed
          s='\n'.join(out)+'\n'
          s=s.replace("  if(await cards.first().getAttribute('data-b46gn-fixture')!==target)throw new Error('MOBILE_NOT_TOP');",
            "  console.log('MOBILE_DIAG='+JSON.stringify(await page.evaluate(target=>({target,pinned:window.BALL46_PIN_V2_TEST?.isPinned?.(target),pins:window.BALL46_PIN_V2_TEST?.getIds?.(),native:[...document.querySelectorAll('[data-board-sections] .match-row[data-match-id]')].slice(0,8).map(x=>({id:x.dataset.matchId,kind:x.dataset.b46Kind,section:x.closest('[data-status-section]')?.dataset.statusSection})),cards:[...document.querySelectorAll('#b46gn-cards [data-b46gn-fixture]')].slice(0,8).map(x=>x.dataset.b46gnFixture)})),target));\n  if(await cards.first().getAttribute('data-b46gn-fixture')!==target)throw new Error('MOBILE_NOT_TOP');")
          # Fresh mobile bridge: use the same shared pin state and explicitly wake the Green Noir renderer.
          s=s.replace("window.BALL46_PINNED_V2_TEST?.isPinned?.(x.id)","window.BALL46_PIN_V2_TEST?.isPinned?.(x.id)")
          mobile_anchor="const search=$('[data-search]');search?.addEventListener('input',schedule);const paneObs=new MutationObserver(schedule);paneObs.observe(document.body,{attributes:true,attributeFilter:['data-workspace-view']});"
          mobile_repl="const search=$('[data-search]');search?.addEventListener('input',schedule);document.addEventListener('ball46:pin-v2-test',schedule);const paneObs=new MutationObserver(schedule);paneObs.observe(document.body,{attributes:true,attributeFilter:['data-workspace-view']});"
          assert s.count(mobile_anchor)==1, s.count(mobile_anchor)
          s=s.replace(mobile_anchor,mobile_repl)
          assert "BALL46_PINNED_V2_TEST" not in s
          assert "document.addEventListener('ball46:pin-v2-test',schedule)" in s
          assert "if(api!==before)" not in s
          assert ",.match-row[aria-expanded=" not in s
          p.write_text(s)
          PY
          node --check pinned-fixtures-v2/test.mjs
          ! grep -q "ball46_favorites_v1" pinned-fixtures-v2/test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Run fresh V2 browser tests
        run: node pinned-fixtures-v2/test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-fixtures-v2-test-${{ github.run_id }}
          path: pinned-fixtures-v2/*-pinned.png
          retention-days: 7
