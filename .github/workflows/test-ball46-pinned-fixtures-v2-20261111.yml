name: Test BALL46 Fresh Pinned Fixtures V2 20261111
on:
  push:
    branches: [test/ball46-pinned-fixtures-v2-20261111]
    paths: ['pinned-fixtures-v2/TEST_READY']
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: test/ball46-pinned-fixtures-v2-20261111}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Assemble fresh test harness
        run: |
          cat pinned-fixtures-v2/short.b64.part0 pinned-fixtures-v2/short.b64.part1 pinned-fixtures-v2/short.b64.part2 pinned-fixtures-v2/short.b64.part3 pinned-fixtures-v2/short.b64.part4 pinned-fixtures-v2/short.b64.part5 | base64 -d > pinned-fixtures-v2/test.mjs
          sed -i "s#pathname.startsWith('/api/')#pathname.startsWith('/api/full-market/')#g" pinned-fixtures-v2/test.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('pinned-fixtures-v2/test.mjs')
          s=p.read_text()
          s=s.replace(",.match-row[aria-expanded=\\\\\\\"true\\\\\\\"]","")
          lines=s.splitlines()
          out=[]
          changed={'desktop':0,'mobile':0}
          for line in lines:
              st=line.strip()
              if st.startswith("const original=await rows.first().getAttribute('data-match-id'),target=await rows.nth(5).getAttribute('data-match-id'),before=api;"):
                  out.append("  const original=await rows.first().getAttribute('data-match-id'),target=await rows.nth(5).getAttribute('data-match-id');")
                  changed['desktop']+=1
              elif st=="await rows.nth(5).locator('[data-b46-pin-v2]').click();await page.waitForTimeout(300);":
                  out.append("  const syncFetch=await rows.nth(5).locator('[data-b46-pin-v2]').evaluate(el=>{let n=0;const f=window.fetch;window.fetch=(...a)=>{n++;return f(...a)};try{el.click();return n}finally{window.fetch=f}});await page.waitForTimeout(300);")
                  changed['desktop']+=1
              elif st=="if(api!==before)throw new Error('DESKTOP_API_DELTA');":
                  out.append("  if(syncFetch!==0)throw new Error('DESKTOP_API_DELTA_'+syncFetch);")
                  changed['desktop']+=1
              elif st.startswith("const original=await cards.first().getAttribute('data-b46gn-fixture'),target=await cards.nth(5).getAttribute('data-b46gn-fixture'),before=api;"):
                  out.append("  const original=await cards.first().getAttribute('data-b46gn-fixture'),target=await cards.nth(5).getAttribute('data-b46gn-fixture');")
                  changed['mobile']+=1
              elif st=="await cards.nth(5).locator('[data-b46-pin-mobile]').click();await page.waitForTimeout(500);":
                  out.append("  const syncFetch=await cards.nth(5).locator('[data-b46-pin-mobile]').evaluate(el=>{let n=0;const f=window.fetch;window.fetch=(...a)=>{n++;return f(...a)};try{el.click();return n}finally{window.fetch=f}});await page.waitForTimeout(500);")
                  changed['mobile']+=1
              elif st=="if(api!==before)throw new Error('MOBILE_API_DELTA');":
                  out.append("  if(syncFetch!==0)throw new Error('MOBILE_API_DELTA_'+syncFetch);")
                  changed['mobile']+=1
              else:
                  out.append(line)
          assert changed=={'desktop':3,'mobile':3}, changed
          s='\n'.join(out)+'\n'
          s=s.replace("  if(await cards.first().getAttribute('data-b46gn-fixture')!==target)throw new Error('MOBILE_NOT_TOP');",
            "  console.log('MOBILE_DIAG='+JSON.stringify(await page.evaluate(target=>({target,pinned:window.BALL46_PIN_V2_TEST?.isPinned?.(target),pins:window.BALL46_PIN_V2_TEST?.getIds?.(),native:[...document.querySelectorAll('[data-board-sections] .match-row[data-match-id]')].slice(0,8).map(x=>({id:x.dataset.matchId,kind:x.dataset.b46Kind,section:x.closest('[data-status-section]')?.dataset.statusSection})),cards:[...document.querySelectorAll('#b46gn-cards [data-b46gn-fixture]')].slice(0,8).map(x=>x.dataset.b46gnFixture)})),target));\n  if(await cards.first().getAttribute('data-b46gn-fixture')!==target)throw new Error('MOBILE_NOT_TOP');")
          # Keep pinned fixtures in BALL46's native visible order (status -> league -> row), not raw fixture-source order.
          helper_anchor="\"function b46PinHas(id){return b46Pins.has(String(id||''))}\"+"
          helper_repl="\"function b46PinHas(id){return b46Pins.has(String(id||''))}\"+\"function b46PinNativeOrder(rows){const out=[];for(const key of ['live','scheduled','unknown','finished']){const all=rows.filter(f=>classify(f)===key);for(const [,list] of groupByLeague(all))out.push(...list)}return out}\"+"
          assert s.count(helper_anchor)==1, s.count(helper_anchor)
          s=s.replace(helper_anchor,helper_repl)
          freeze_anchor="\"function b46PinExpanded(){return !!document.querySelector('.match-expanded[data-expanded-match]')}\"+"
          freeze_repl=freeze_anchor+"\"let b46PinFrozen=null;function b46PinRenderHas(id){id=String(id||'');if(b46PinExpanded()){if(!b46PinFrozen){b46PinFrozen=new Set([...document.querySelectorAll('.b46-pin-v2-section .match-row[data-match-id]')].map(r=>String(r.dataset.matchId||'')).filter(Boolean))}return b46PinFrozen.has(id)}b46PinFrozen=null;return b46PinHas(id)}\"+"
          assert s.count(freeze_anchor)==1, s.count(freeze_anchor)
          s=s.replace(freeze_anchor,freeze_repl)
          render_old="const rows=visibleRows(),pinOK=!b46PinExpanded(),pinned=pinOK?rows.filter(f=>b46PinHas(fixtureKey(f))):[],normal=pinOK?rows.filter(f=>!b46PinHas(fixtureKey(f))):rows"
          render_new="const rows=visibleRows(),nativeOrder=b46PinNativeOrder(rows),pinned=nativeOrder.filter(f=>b46PinRenderHas(fixtureKey(f))),normal=rows.filter(f=>!b46PinRenderHas(fixtureKey(f)))"
          assert s.count(render_old)==1, s.count(render_old)
          s=s.replace(render_old,render_new)
          assert "b46PinNativeOrder(rows)" in s
          assert "b46PinRenderHas" in s
          # Left action rail: star centered vertically, visually separated from team crests/names.
          desktop_css_old=".match-row[data-match-id]{position:relative}.b46-pin-v2-star{position:absolute;z-index:8;left:3px;top:4px;width:24px;height:24px;"
          desktop_css_new=".match-row[data-match-id]{position:relative}.match-row[data-match-id]>.teams-cell{padding-left:32px!important;box-sizing:border-box}.b46-pin-v2-star{position:absolute;z-index:2;left:6px;right:auto;top:50%;transform:translateY(-50%);width:22px;height:22px;"
          assert s.count(desktop_css_old)==1, s.count(desktop_css_old)
          s=s.replace(desktop_css_old,desktop_css_new)
          mobile_css_old="#b46gn-cards .b46-pin-v2-mobile{position:absolute;z-index:9;right:32px;top:8px;width:30px;height:30px;"
          mobile_css_new="#b46gn-cards .b46-pin-v2-mobile{position:absolute;z-index:1;left:12px;right:auto;top:50%;transform:translateY(-50%);width:24px;height:24px;"
          assert s.count(mobile_css_old)==1, s.count(mobile_css_old)
          s=s.replace(mobile_css_old,mobile_css_new)
          assert "padding-left:32px!important" in s
          assert "left:6px;right:auto;top:50%;transform:translateY(-50%)" in s
          assert "z-index:1;left:12px;right:auto;top:50%;transform:translateY(-50%)" in s
          # Current Expanded Match controller uses document capture. Add a narrow V2 guard there,
          # instead of legacy-style global pointer traps.
          install_anchor="async function install(page){"
          expanded_fn=("function patchExpanded(src){\n"
            "  if(src.includes('B46_PIN_V2_EXPANDED_GUARD_TEST_20261111'))return src;\n"
            "  src=one(src,\n"
            "    \"document.addEventListener('click',e=>{if(handleMobileFlowSelect(e))return;\",\n"
            "    \"document.addEventListener('click',e=>{/* B46_PIN_V2_EXPANDED_GUARD_TEST_20261111 */if(e.target.closest?.('[data-b46-pin-v2]'))return;if(handleMobileFlowSelect(e))return;\",\n"
            "    'EXPANDED_CLICK_GUARD');\n"
            "  src=one(src,\n"
            "    \"document.addEventListener('keydown',e=>{if(e.key==='Escape'\",\n"
            "    \"document.addEventListener('keydown',e=>{if(e.target.closest?.('[data-b46-pin-v2]'))return;if(e.key==='Escape'\",\n"
            "    'EXPANDED_KEY_GUARD');\n"
            "  return src;\n"
            "}\n\n")
          assert s.count(install_anchor)==1, s.count(install_anchor)
          s=s.replace(install_anchor,expanded_fn+install_anchor)
          dash_route="  await page.route(u=>u.hostname==='ball46.com'&&u.pathname===DASH,async route=>{const r=await route.fetch();await route.fulfill({response:r,body:patchDash(await r.text())})});"
          expanded_route="  await page.route(u=>u.hostname==='ball46.com'&&u.pathname==='/expanded-match-343.js',async route=>{const r=await route.fetch();await route.fulfill({response:r,body:patchExpanded(await r.text())})});"
          assert s.count(dash_route)==1, s.count(dash_route)
          s=s.replace(dash_route,dash_route+"\n"+expanded_route)
          assert "B46_PIN_V2_EXPANDED_GUARD_TEST_20261111" in s
          # Fresh mobile bridge: use the same shared pin state.
          s=s.replace("window.BALL46_PINNED_V2_TEST?.isPinned?.(x.id)","window.BALL46_PIN_V2_TEST?.isPinned?.(x.id)")
          # Patch the *runtime HTML patcher* so Green Noir's own schedule() is explicitly woken on pin changes.
          insert_anchor="    'MOBILE_SIG');\n\n  const style="
          mobile_anchor="const search=$('[data-search]');search?.addEventListener('input',schedule);const paneObs=new MutationObserver(schedule);paneObs.observe(document.body,{attributes:true,attributeFilter:['data-workspace-view']});"
          mobile_repl="const search=$('[data-search]');search?.addEventListener('input',schedule);document.addEventListener('ball46:pin-v2-test',schedule);const paneObs=new MutationObserver(schedule);paneObs.observe(document.body,{attributes:true,attributeFilter:['data-workspace-view']});"
          injected="    'MOBILE_SIG');\n  html=one(html,\n    "+repr(mobile_anchor)+",\n    "+repr(mobile_repl)+",\n    'MOBILE_WAKE');\n\n  const style="
          assert s.count(insert_anchor)==1, s.count(insert_anchor)
          s=s.replace(insert_anchor,injected)
          assert "BALL46_PINNED_V2_TEST" not in s
          assert "'MOBILE_WAKE'" in s
          assert "if(api!==before)" not in s
          assert ",.match-row[aria-expanded=" not in s
          p.write_text(s)
          PY
          node --check pinned-fixtures-v2/test.mjs
          ! grep -q "ball46_favorites_v1" pinned-fixtures-v2/test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Run fresh V2 browser tests
        run: node pinned-fixtures-v2/test.mjs
      - name: Build stress harness from the same fresh V2 patcher
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('pinned-fixtures-v2/test.mjs').read_text()
          marker="const browser=await chromium.launch({headless:true});"
          assert marker in src
          prefix=src.split(marker,1)[0]
          tail=Path('pinned-fixtures-v2/stress-tail.mjs').read_text()
          Path('pinned-fixtures-v2/stress.mjs').write_text(prefix+tail)
          PY
          node --check pinned-fixtures-v2/stress.mjs
          ! grep -q "ball46_favorites_v1" pinned-fixtures-v2/stress.mjs
      - name: Run expanded and multi-pin stress tests
        run: node pinned-fixtures-v2/stress.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pinned-fixtures-v2-test-${{ github.run_id }}
          path: pinned-fixtures-v2/*-pinned.png
          retention-days: 7
