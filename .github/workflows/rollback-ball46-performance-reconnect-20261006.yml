name: Rollback Ball46 Performance Reconnect 20261006

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rollback-ball46-performance-reconnect-20261006.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-production-performance-reconnect-rollback
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact reconnect rollback branch
        uses: actions/checkout@v4
        with:
          ref: work/ball46-performance-reconnect-rollback-20261006
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore exact pre-reconnect Production
        working-directory: deploy-assets/performance-reconnect-rollback-20261006
        run: node run.mjs
