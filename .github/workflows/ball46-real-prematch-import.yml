name: BALL46 real prematch import and shadow evaluation
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-real-prematch-import.yml']
permissions:
  contents: read
concurrency:
  group: ball46-direct-finished-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate script and pull approved isolated batch
        env:
          FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --check qa/prematch-history-20261120/real-prematch-import.mjs
          node qa/prematch-history-20261120/real-prematch-import.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-prematch-raw-and-progress
          path: evidence/real-prematch/
          if-no-files-found: warn
          retention-days: 90
