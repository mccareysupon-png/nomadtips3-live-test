name: BALL46 3.43 health monitor - READ ONLY
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'operations/ball46-343-monitor/monitor.mjs'
      - '.github/workflows/ball46-343-health-monitor.yml'
permissions:
  contents: read
concurrency:
  group: ball46-343-periodic-readonly-monitor
  cancel-in-progress: false
jobs:
  inspect:
    name: Inspect current BALL46 production (never deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate monitor script
        run: node --check operations/ball46-343-monitor/monitor.mjs
      - name: Collect sanitized HTTP and Cloudflare 3.43 telemetry
        run: node operations/ball46-343-monitor/monitor.mjs
      - name: Save sanitized observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-343-health
          path: |
            reports/ball46-343-observation.json
            reports/ball46-343-summary.md
          if-no-files-found: warn
          retention-days: 7
