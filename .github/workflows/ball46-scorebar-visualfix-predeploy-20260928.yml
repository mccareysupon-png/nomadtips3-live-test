        with:
          name: ball46-scorebar-bg-pending-rebased-36394898597
          path: /tmp/b46-seed
          github-token: ${{ github.token }}
          run-id: 36394898597
          repository: mccareysupon-png/nomadtips3-live-test
      - name: Build and verify visualfix candidate without deploy
        run: bash .github/scripts/ball46_scorebar_visualfix_predeploy_20260928.sh
      - name: Upload verified candidate and proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-scorebar-visualfix-predeploy-${{ github.run_id }}
          path: /tmp/b46-visualfix
          if-no-files-found: ignore
