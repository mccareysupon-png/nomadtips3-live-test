name: READ ONLY - Ball46 Scorebar Visualfix Predeploy 20260928
on:
  push:
    branches:
      - work/ball46-scorebar-background-pending-20260928
    paths:
      - '.github/workflows/ball46-scorebar-visualfix-predeploy-20260928.yml'
      - '.github/scripts/ball46_scorebar_visualfix_predeploy_20260928.sh'
