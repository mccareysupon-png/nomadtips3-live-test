name: BALL46 FEATURED SCORE Short Dash Guarded Production Deploy
on:
  push:
    branches: [fix/ball46-featured-score-dash-20261023]
    paths:
      - .github/workflows/ball46-featured-score-dash-deploy.yml
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  patch-test-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all patch and verification syntax
        working-directory: deploy-assets/featured-score-dash-20261023
        run: |
          node --check patch.mjs
          node --check candidate.mjs
          node --check browser.mjs
          node --check activate.mjs
      - name: Create isolated candidate from exact active Production
        working-directory: deploy-assets/featured-score-dash-20261023
        run: node candidate.mjs
      - name: Install Chromium for PC/mobile score separator QA
        working-directory: deploy-assets/featured-score-dash-20261023
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify short hyphen in real CSS on PC/mobile light/dark, no changed scores
        working-directory: deploy-assets/featured-score-dash-20261023
        run: node browser.mjs
      - name: Guarded Cloudflare cutover and rollback on failed production checks
        working-directory: deploy-assets/featured-score-dash-20261023
        run: node activate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-featured-score-dash-proof-${{ github.run_id }}
          path: deploy-assets/featured-score-dash-20261023/audit/
          retention-days: 30
