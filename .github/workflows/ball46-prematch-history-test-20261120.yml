name: BALL46 Pre-Match history phase 2 isolation
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-prematch-history-test-20261120.yml']
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SQLite regression tests (no network)
        run: node --test qa/prematch-history-20261120/history.test.mjs
      - name: Read-only HUB inventory and isolated SQLite Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node qa/prematch-history-20261120/deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prematch-history-evidence
          path: evidence/
          retention-days: 7
