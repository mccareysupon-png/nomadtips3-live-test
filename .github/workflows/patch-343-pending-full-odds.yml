name: Patch 3.43 Pending Full Odds

on:
  push:
    branches:
      - work/nomad343-clean-bet365-ui
    paths:
      - .github/workflows/patch-343-pending-full-odds.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nomad343-clean-bet365-ui
          fetch-depth: 0

      - name: Patch pending Signal Full Odds backfill only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('workers/nomadtips3-engine-343/src/index.js')
          s = p.read_text()
          old = "fixtureCandidates.sort((a,b)=>b.maxStrength-a.maxStrength);const selected=fixtureCandidates.slice(0,MAX_ODDS_FIXTURES_PER_SCAN),selectedIds=new Set(selected.map(x=>String(x.fixture.fixtureId)));let refereeRequests=0,refereeErrors=[];"
          new = "fixtureCandidates.sort((a,b)=>b.maxStrength-a.maxStrength);const backfill=board.filter(b=>isLive(b)&&pendingFixtureIds.has(String(b.fixtureId))&&!b.fullOdds).map(b=>({fixture:b})),backfillSelected=backfill.slice(0,MAX_ODDS_FIXTURES_PER_SCAN),backfillIds=new Set(backfillSelected.map(x=>String(x.fixture.fixtureId))),remaining=Math.max(0,MAX_ODDS_FIXTURES_PER_SCAN-backfillSelected.length),selected=fixtureCandidates.filter(x=>!backfillIds.has(String(x.fixture.fixtureId))).slice(0,remaining),selectedIds=new Set(selected.map(x=>String(x.fixture.fixtureId)));let refereeRequests=0,refereeErrors=[];for(const item of backfillSelected){const id=String(item.fixture.fixtureId);try{const root=await fetchFullOdds(id,this.env);refereeRequests++;const b=board.find(x=>String(x.fixtureId)===id);if(b){b.fullOdds=clone(root);b.fullOddsFetchedAt=now();b.fullOddsSource='ENGINE_REFEREE_BACKFILL'}}catch(e){refereeErrors.push({fixtureId:id,error:String(e?.message||e),scope:'PENDING_BACKFILL'})}}"
          assert old in s, 'pending backfill anchor not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          node --check workers/nomadtips3-engine-343/src/index.js
          grep -Fq "const MAX_ODDS_FIXTURES_PER_SCAN=4" workers/nomadtips3-engine-343/src/index.js
          grep -Fq "ENGINE_REFEREE_BACKFILL" workers/nomadtips3-engine-343/src/index.js
          grep -Fq "remaining=Math.max(0,MAX_ODDS_FIXTURES_PER_SCAN-backfillSelected.length)" workers/nomadtips3-engine-343/src/index.js
          grep -Fq "const VERSION='nomad343-engine-v3-settlement-safe'" workers/nomadtips3-engine-343/src/index.js

      - name: Commit isolated backfill patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'nomad343-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add workers/nomadtips3-engine-343/src/index.js
          git rm .github/workflows/patch-343-pending-full-odds.yml
          git commit -m '3.43: backfill Full Odds for active pending signals'
          git push origin HEAD:work/nomad343-clean-bet365-ui
