name: Release BALL46 Member Promo Image 20261106

on:
  push:
    branches: [test/ball46-favorite-analysis-20261106]
    paths:
      - 'deploy-assets/member-promo-image-20261106/assets/ball46-member-promo-20261106.jpg'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/ball46-favorite-analysis-20261106
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Replace member promo image only
        working-directory: deploy-assets/member-promo-image-20261106
        run: node deploy.mjs
