name: Rollback Ball46 EasyBet Size120 20261006
# retry after active changed
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rollback-ball46-easybet-size120-20261006.yml'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ball46-rollback-easybet-size120-20261006
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rollback EasyBet size patch only
        working-directory: deploy-assets/rollback-easybet-size120-20261006
        run: node run.mjs
