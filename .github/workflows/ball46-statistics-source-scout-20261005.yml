name: Ball46 Statistics Source Scout 20261005
on:
  push:
    branches: [work/ball46-daily-performance-20261005]
    paths: ['.github/workflows/ball46-statistics-source-scout-20261005.yml']
permissions:
  contents: read
concurrency:
  group: ball46-production-daily-performance
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts acorn@8
      - run: node scout.mjs
        working-directory: deploy-assets/statistics-no-cap-20261005
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-statistics-source-scout-${{ github.run_id }}
          path: deploy-assets/statistics-no-cap-20261005/audit-statistics-scout
          retention-days: 7
