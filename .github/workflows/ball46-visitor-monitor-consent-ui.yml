# Collector-only: English public consent, no floating control after either choice.
name: BALL46 Visitor Monitor consent UI (Collector only)
on:
  push:
    branches: [work/ball46-traffic-intelligence-isolated-20261020]
    paths: ['.github/workflows/ball46-visitor-monitor-consent-ui.yml']
permissions:
  contents: read
concurrency:
  group: b46-visitor-monitor-deploy-only
  cancel-in-progress: false
jobs:
  consent-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: traffic-intelligence/isolated-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check exact generated source and regressions
        run: |
          node build-tracker-assets.mjs
          git diff --exit-code -- tracker-assets.mjs
          node --check deploy-consent-ui.mjs
          node --check tracker.js
          node --test worker.test.mjs analytics.test.mjs web-analytics.test.mjs request-logs.test.mjs presence.test.mjs tracker.test.mjs
      - name: Audit or release only the Collector
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRESENCE_OWNER_APPROVED: 20261021-main-public-opt-in
          ACTION: ${{ github.event.head_commit.message == 'Deploy English dismissible consent [visitor-consent-ui-v1]' && 'deploy' || 'audit' }}
        run: node deploy-consent-ui.mjs "$ACTION"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visitor-monitor-consent-ui-evidence
          path: traffic-intelligence/isolated-deploy/deployment-evidence/
          retention-days: 30
