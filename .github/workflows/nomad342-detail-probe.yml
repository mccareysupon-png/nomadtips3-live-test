name: NOMAD 3.42 Detail Fetch Probe

on:
  push:
    branches:
      - 'feat/342-totalcorner-inlet'
    paths:
      - '.github/workflows/nomad342-detail-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Read TEST Worker detail diagnostics
        shell: bash
        env:
          TEST_URL: https://nomadtips3-live-engine-342-test.mccarey-supon.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const base=process.env.TEST_URL;
          const r=await fetch(`${base}/feed?force=1&probe=${Date.now()}`,{headers:{accept:'application/json'}});
          const j=await r.json();
          console.log(JSON.stringify({status:r.status,ok:j.ok,version:j.version,counts:j.counts,detailErrors:j.detailErrors,lastError:j.lastError,updatedAt:j.updatedAt},null,2));
          if(r.status!==200||j.version!=='3.42'||j.ok!==true) process.exitCode=1;
          NODE
