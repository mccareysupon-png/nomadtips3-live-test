name: NOMAD 3.42 TotalCorner Odds Probe

on:
  push:
    branches:
      - 'feat/342-totalcorner-inlet'
    paths:
      - '.github/workflows/nomad342-detail-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Probe TotalCorner odds pages for M88
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const headers={
            'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64 x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
            'accept':'text/html,application/xhtml+xml',
            'accept-language':'en-US,en;q=0.9'
          };
          const today='https://www.totalcorner.com/match/today/';
          const r=await fetch(today,{headers,redirect:'follow'});
          const html=await r.text();
          const refs=[];
          for(const m of html.matchAll(/href=["']([^"']*\/(?:live|stats|odds)\/([^"'?#/]+)\/(\d+)[^"']*)["']/gi)){
            const [,href,slug,id]=m;
            if(!refs.some(x=>x.id===id)) refs.push({id,slug,href});
          }
          console.log(JSON.stringify({todayStatus:r.status,todayBytes:html.length,matchRefs:refs.length},null,2));
          if(r.status!==200||html.length<300) process.exitCode=1;
          const targets=refs.slice(0,5);
          if(!targets.length){
            console.log('NO_MATCH_REFS');
            process.exitCode=1;
          }
          for(const x of targets){
            const url=`https://www.totalcorner.com/odds/${x.slug}/${x.id}`;
            try{
              const rr=await fetch(url,{headers:{...headers,referer:today},redirect:'follow'});
              const body=await rr.text();
              const hasM88=/\bM\s*88\b|M88\.com|Mansion\s*88/i.test(body);
              const names=[...body.matchAll(/(?:Bet\s*365|Bet365|Pinnacle|1xBet|12bet|18Bet|10BET|Crown|M88(?:\.com)?)/gi)]
                .map(m=>m[0]);
              console.log(JSON.stringify({id:x.id,slug:x.slug,status:rr.status,bytes:body.length,hasM88,knownBookmakers:[...new Set(names)].slice(0,20)},null,2));
            }catch(e){
              console.log(JSON.stringify({id:x.id,slug:x.slug,error:String(e?.message||e)},null,2));
            }
          }
          NODE
