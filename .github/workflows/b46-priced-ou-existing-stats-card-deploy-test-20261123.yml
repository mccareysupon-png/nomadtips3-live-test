name: BALL46 existing TEST PreMatch Over Under statistics card real-price display fix
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-priced-ou-existing-stats-card-deploy-test-20261123.yml]
permissions: {contents: read}
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check existing O/U Statistics card patch for scoped mutation
        run: |
          node --check qa/prematch-history-20261120/patch-priced-ou-existing-stats-card-test-20261123.mjs
          node --check qa/prematch-history-20261120/deploy-priced-ou-existing-stats-card-test-20261123.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/patch-priced-ou-into-existing-prematch-ui.test.mjs
      - name: Guarded deploy ONLY original TEST UI source for accurate O/U bookmaker and formatted Under 2.5
        run: node qa/prematch-history-20261120/deploy-priced-ou-existing-stats-card-test-20261123.mjs
