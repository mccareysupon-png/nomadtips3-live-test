name: BALL46 isolated history gateway contract
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-history-gateway-test.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test history, queue and mock quota gateway
        run: node --test qa/prematch-history-20261120/*.test.mjs

# End-to-end integration against simulated shared quota and provider; no API keys.
