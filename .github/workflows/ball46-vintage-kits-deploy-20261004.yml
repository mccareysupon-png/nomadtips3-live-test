name: ONE SHOT - Ball46 Vintage Kits 20261004

on:
  push:
    branches:
      - work/ball46-vintage-kits-20261004
    paths:
      - '.github/workflows/ball46-vintage-kits-deploy-20261004.yml'
      - '.github/scripts/ball46_vintage_kits_deploy_20261004.sh'
      - 'deploy-assets/match-status-svg-20261003/vintage-kits-run.mjs'
      - 'deploy-assets/match-status-svg-20261003/team-kits-vintage-24.asset.js'

permissions:
  contents: read

concurrency:
  group: ball46-production-surgical
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vintage kits surgical rail
        shell: bash
        run: bash .github/scripts/ball46_vintage_kits_deploy_20261004.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-vintage-kits-${{ github.run_id }}
          path: deploy-assets/match-status-svg-20261003/audit/vintage-kits-deploy/
          if-no-files-found: error
          retention-days: 30
