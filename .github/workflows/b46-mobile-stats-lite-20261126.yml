name: BALL46 Mobile first-screen experiment TEST
on:
  push:
    branches: [feature/ball46-adaptive-manual-control-test-20261125]
    paths: ['.github/workflows/b46-mobile-stats-lite-20261126.yml']
permissions:
  contents: read
concurrency:
  group: ball46-ft-phase1-phase2-guarded-oneoff-20261126
  cancel-in-progress: false
jobs:
  qa-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install Chromium
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Measure cold mobile baseline, verify and compare TEST accounts only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'B46_MOBILE_LITE'
          function patchLite(src,experience){
           const single=(s,a,b)=>{if(s.split(a).length!==2)throw Error('Unexpected anchor: '+a.slice(0,90));return s.replace(a,()=>b)};
           const k='var prematchTimelineTestScript = ',i=src.indexOf(k)+k.length,j=src.indexOf('\n',i);
           if(i<k.length||j<i)throw Error('Missing timeline asset');
           const original=JSON.parse(src.slice(i,j).replace(/;$/,''));
           // Reuse exactly the same quote validity, market dedupe and 1U settlement logic.
           const modelStart=original.indexOf(" const marketTags={'1X2'"),modelEnd=original.indexOf(' const CSS=`',modelStart);
           if(modelStart<0||modelEnd<modelStart)throw Error('Portfolio model anchor');
           const shared=original.slice(modelStart,modelEnd);
           const portfolioEngine="const b46SharedMobilePortfolio=(()=>{\n"+shared+"\nreturn portfolio;\n})();\n";
           let edited=single(original,'  function draw(pageOnly=false){',experience+'\n  function draw(pageOnly=false){');
           edited=single(edited,"    const title=mode==='predictions'?",`    if(b46LiteEnabled&&mode==='all'&&(!b46LiteDetails||!getPublishedStats())){
                content.append(b46LitePanel());finish();return;
              }
              const title=mode==='predictions'?`);
           edited=single(edited,"  async function load(){\n    if(loading)return;loading=true;",`  async function load(){
              if(b46LiteEnabled&&!b46LiteDetails&&(mode==='all'||(!mode&&!b46LiteStarted&&new URLSearchParams(location.search).get('b46pm')==='all'))){
                if(mode==='all'){b46LiteStarted=true;return b46LiteRead();}
                return;
              }
              if(loading)return;loading=true;
              // After an explicit request, fetch the existing full data in parallel.
              const liteArchive=b46LiteEnabled&&b46LiteDetails&&mode==='all'?loadPublishedArchive(true):null;`);
           edited=single(edited,"if(mode==='all'){await loadPublishedArchive();}","if(mode==='all'){await (liteArchive??loadPublishedArchive());}");
           src=src.slice(0,i)+JSON.stringify(edited)+';'+src.slice(j);
           src=single(src,'// worker.mjs\nvar worker_default',portfolioEngine+'\n// worker.mjs\nvar worker_default');
           src=single(src,"  if(u.pathname==='/__b46_pm_ou_formula_timeline_test'){",`  if(u.pathname==='/__b46_pm_stats_lite_test'){
             if(!poissonTest||req.method!=='GET')return new Response('Not found',{status:404});
             const headers={'cache-control':'no-store','x-robots-tag':'noindex,nofollow'};
             try{
              const signal=AbortSignal.timeout(11000);
              const read=(path,extra={})=>env.PREMATCH_STORE.fetch(new Request('https://prematch.internal'+path,{headers:{accept:'application/json',...extra},signal})).then(r=>{if(!r.ok)throw Error('Unavailable');return r.json()});
              const [j,a]=await Promise.all([read('/preview-data'),read('/ou-formula-timeline-test?scope=published-archive',{'x-b46-ou-formula-surface':'TEST_PREDICTIONS_FACADE'})]);
              const l=j.allLedger,w=j.dailyBook?.window;
              if(l?.mode!=='TEST_ONLY'||!Array.isArray(l.rows)||l.rows.length!==l.stats?.total||!w||
                 a.scope!=='PUBLISHED_ARCHIVE_TEST_V1'||a.status!=='OK'||!a.testOnly||a.truncated||!Number.isSafeInteger(a.range?.before)||!Array.isArray(a.rows)||!Array.isArray(a.poisson))throw Error('Incomplete');
              const p=b46SharedMobilePortfolio(l.rows,a,w),{daily,...all}=p.all;
              return Response.json({scope:'B46_PUBLISHED_MOBILE_LITE_V1',window:{businessDay:w.businessDay},all,today:p.today},{headers});
             }catch{return Response.json({status:'UNAVAILABLE'},{status:503,headers});}
            }
            if(u.pathname==='/__b46_pm_ou_formula_timeline_test'){`);
           return {source:src,edited,original};
          }
          
          const experience="  // Opt-in mobile experiment only; the usual All Matches remains the control.\n  const b46LiteEnabled=new URLSearchParams(location.search).get('b46statsLite')==='1'&&matchMedia('(max-width:760px)').matches;\n  let b46LiteStarted=false,b46LiteDetails=false,b46LiteSnap=null,b46LiteError=false,b46LiteBusy=null,b46LiteAt=0;\n  function b46LiteRead(force=false){\n    if(b46LiteBusy)return b46LiteBusy;\n    if(!force&&Date.now()-b46LiteAt<60000)return;\n    b46LiteBusy=fetch('/__b46_pm_stats_lite_test',{cache:'no-store',signal:AbortSignal.timeout(14000)})\n      .then(async r=>{\n        if(!r.ok)throw Error('HTTP '+r.status);\n        const s=await r.json();\n        if(s.scope!=='B46_PUBLISHED_MOBILE_LITE_V1'||!s.all||!s.today||!s.window||\n           !['all','today'].every(k=>['total','settled','pending','win','loss','draw','staked'].every(f=>Number.isSafeInteger(s[k][f])&&s[k][f]>=0)&&Number.isFinite(s[k].units)))throw Error('Invalid summary');\n        b46LiteSnap=s;b46LiteError=false;\n      }).catch(()=>{b46LiteSnap=null;b46LiteError=true;})\n      .finally(()=>{b46LiteBusy=null;b46LiteAt=Date.now();if(mode==='all'&&!b46LiteDetails)draw();});\n    return b46LiteBusy;\n  }\n  function b46LitePanel(){\n    const card=el('section','b46pm-performance-summary');card.id='b46pm-mobile-lite';\n    card.setAttribute('aria-label','Pre-Match Statistics · All Matches');\n    const buttons=el('div','b46pm-period-switch');buttons.setAttribute('role','group');buttons.setAttribute('aria-label','Statistics period');\n    const period=statsPeriod==='today'?'today':'all';\n    for(const [p,label] of [['today','Today'],['all','All time']]){\n      const b=el('button','b46pm-period-btn'+(p===period?' selected':''),label);\n      b.type='button';b.dataset.b46PmPeriod=p;b.setAttribute('aria-pressed',String(p===period));buttons.append(b);\n    }\n    card.append(el('div','b46pm-performance-kicker','PRE-MATCH · ALL MATCHES'),buttons);\n    if(!b46LiteSnap){\n      const state=el('p','b46pm-performance-meta',b46LiteError?'Summary not available.':'Loading verified statistics…');\n      state.setAttribute('role','status');card.append(state);\n      if(b46LiteError){\n        const b=el('button','b46pm-inline-retry','Retry summary');b.type='button';\n        b.addEventListener('click',()=>{b46LiteError=false;draw();b46LiteRead(true);});card.append(b);\n      }\n    }else{\n      const s=b46LiteSnap[period];\n      card.dataset.b46LiteReady='1';card.dataset.settled=String(s.settled);card.dataset.units=String(s.units);\n      card.append(el('div','b46pm-performance-meta',period==='today'?'Today · '+b46LiteSnap.window.businessDay+' · 06:00 London cutoff':'All time · settled picks · 1 unit each'),\n        el('strong','b46pm-performance-hero b46pm-tone '+resultTone(s.units),s.settled?perfSigned(s.units):'—'));\n      const g=el('div','b46pm-performance-grid');\n      const roi=s.staked?100*s.units/s.staked:null;\n      for(const [label,value] of [['Picks',s.total],['Settled',s.settled],['Pending',s.pending],['W · D · L',[s.win,s.draw,s.loss].join(' · ')],['Win rate',s.winRate==null?'—':perfFormat(s.winRate,1)+'%'],['ROI',roi===null?'—':perfFormat(roi,1)+'%']]){\n        const n=el('div','b46pm-performance-item');n.append(el('small','',label),el('strong','',String(value)));g.append(n);\n      }\n      card.append(g);\n    }\n    const b=el('button','b46pm-perf-button',b46LiteDetails?(loading?'Loading chart and history…':'Retry chart and history'):'Show chart and history');\n    b.type='button';b.disabled=b46LiteDetails&&loading;b.dataset.b46LiteDetails='1';\n    b.addEventListener('click',()=>{b46LiteDetails=true;const p=load();draw();void p;});\n    card.append(b);return card;\n  }\n";
          import A from 'node:assert/strict';
          import vm from 'node:vm';
          import crypto from 'node:crypto';
          import {chromium,devices} from 'playwright';
          const w='ball46-premium-match-colors-test-20261120',old='9557142a-649c-4779-8301-5673849b0a24';
          const F='https://'+w+'.mccarey-supon.workers.dev',P='https://ball46.com';
          const path='/?b46pm=all&b46pmPeriod=all',opt='&b46statsLite=1',lite='/__b46_pm_stats_lite_test',asset='/__b46_prematch_timeline_test.js',L='/__b46_prematch_data',archive='/__b46_pm_ou_formula_timeline_test?scope=published-archive';
          const {CLOUDFLARE_API_TOKEN:t,CLOUDFLARE_ACCOUNT_ID:a}=process.env;
          const H=s=>crypto.createHash('sha256').update(s).digest('hex');
          const req=(u,init={})=>fetch(u,{...init,signal:AbortSignal.timeout(25000)});
          const read=async u=>{const r=await req(u);A(r.ok,u+' '+r.status);return r.text()};
          const cf=async(name,p,init={})=>{
           const r=await req('https://api.cloudflare.com/client/v4/accounts/'+a+'/workers/scripts/'+name+p,{...init,headers:{authorization:'Bearer '+t,...init.headers}});
           if(!r.ok)throw Error(name+p+' '+r.status);return p==='/content/v2'?r.text():(await r.json()).result;
          };
          const active=async n=>{const v=(await cf(n,'/deployments')).deployments[0].versions;A.equal(v.length,1);A.equal(v[0].percentage,100);return v[0].version_id};
          const guard=()=>Promise.all(['ball46-production','ball46-prematch-only-test-20261120','nomadtips3-engine-343','nomadtips3-5usd-hub-343','nomadtips3-full-market-343-ball46'].map(active));
          const activate=async(id,message)=>(await cf(w,'/deployments',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({strategy:'percentage',code_update_strategy:{mode:'deferred',max_delay:25},versions:[{version_id:id,percentage:100}],annotations:{'workers/message':message}})})).id;
          const approx=async fn=>{for(let k=0;k<15;k++){try{if(await fn())return true;}catch{}await new Promise(r=>setTimeout(r,2000))}return false};
          const mobile={...devices['Pixel 7'],timezoneId:'Asia/Bangkok'};
          const heroFull='#b46-prematch-panel .b46pm-performance-summary[data-total] .b46pm-performance-hero';
          const heroLite='#b46pm-mobile-lite[data-b46-lite-ready] .b46pm-performance-hero';
          const report={status:'FAILED',before:[],control:[],pilot:[],checks:[]};
          let browser,next,switched=false;
          async function measure(test){
           const c=await browser.newContext(mobile),p=await c.newPage();
           try{
            const cdp=await c.newCDPSession(p);
            await cdp.send('Network.enable');await cdp.send('Network.setCacheDisabled',{cacheDisabled:true});
            await cdp.send('Network.emulateNetworkConditions',{offline:false,latency:75,downloadThroughput:200000,uploadThroughput:90000});
            await cdp.send('Emulation.setCPUThrottlingRate',{rate:4});
            const urls=[];
            p.on('request',r=>{const u=new URL(r.url());if(u.origin===F)urls.push(u.pathname+u.search)});
            await p.addInitScript(sel=>{
             const seen=()=>{const e=document.querySelector(sel);if(!e||!e.textContent.trim()||!e.getClientRects().length)return;obs.disconnect();requestAnimationFrame(()=>requestAnimationFrame(()=>{window.b46FirstTotals=performance.now();}));};
             const obs=new MutationObserver(seen);obs.observe(document,{subtree:true,childList:true,characterData:true});
            },test?heroLite:heroFull);
            await p.goto(F+path+(test?opt:''),{waitUntil:'domcontentloaded',timeout:40000});
            await p.waitForFunction(()=>window.b46FirstTotals>0,{},{timeout:29000}).catch(async e=>{console.log('BROWSER_DIAG '+JSON.stringify({test,urls:urls.filter(x=>x===lite||x===L||x===archive),seen:await p.locator('#b46-prematch-panel').innerText({timeout:1000}).then(x=>x.slice(0,500)).catch(()=>null)}));throw e;});
            const row=await p.evaluate(paths=>{
             const p=performance.getEntriesByType('resource').filter(x=>paths.includes(new URL(x.name).pathname));
             return {ms:Math.round(window.b46FirstTotals),bytes:p.reduce((n,x)=>n+x.encodedBodySize,0),sources:p.length};
            },[lite,L,archive.split('?')[0]]);
            if(test){
             A(urls.includes(lite));A(!urls.includes(L)&&!urls.includes(archive),'EAGER_FULL_DATA');
            }else A(urls.includes(L)&&urls.includes(archive)&&!urls.includes(lite),'INVALID_CONTROL');
            return row;
           }finally{await c.close();}
          }
          try{
           A(t&&a);A.equal(process.env.GITHUB_RUN_ATTEMPT,'1');A.equal(await active(w),old);
           const [raw,v,hold,native]=await Promise.all([cf(w,'/content/v2'),cf(w,'/versions/'+old),guard(),read(F+'/__b46_prematch_client.js')]);
           const oldAsset=await read(F+asset);
           const newHash='455bec1df01c1e54e5f5b7f01fce06d1d5ac57ca57dfddf89561685f43d7ad2c';
           A.equal(H(oldAsset),'05f42825499cdaaaecdd3392e1f354035b2924d8367335771d2cf9b5a0b17b5e');
           const edited=JSON.parse(raw.slice(raw.indexOf('var prematchTimelineTestScript = ')+'var prematchTimelineTestScript = '.length,raw.indexOf('\n',raw.indexOf('var prematchTimelineTestScript = '))).replace(/;$/,''));
           A.equal(H(edited),newHash);
           next='70b64fac-bf79-4aae-813b-19137017db25';report.next=next;
           const nv=(await cf(w,'/versions/'+next)).resources;
           for(const k of ['bindings','script_runtime'])A.deepEqual(nv[k],v.resources[k]);
           A.deepEqual(nv.script.handlers,v.resources.script.handlers);
           A.equal(await active(w),old);A.deepEqual(await guard(),hold);
           report.deployment=await activate(next,'TEST mobile summary live edge diagnostic');switched=true;
           A(await approx(async()=>await active(w)===next&&H(await read(F+asset))===newHash));
           const rr=await req(F+lite);console.log('LIVE_SUMMARY_HTTP '+JSON.stringify({status:rr.status,type:rr.headers.get('content-type'),body:(await rr.text()).slice(0,900)}));
           A.equal(rr.status,200,'SUMMARY_API_FAILED_ON_EDGE');
           browser=await chromium.launch();
           report.before=[{"ms":9335,"bytes":47304,"sources":2},{"ms":13474,"bytes":47326,"sources":2},{"ms":8768,"bytes":47244,"sources":2}];
           report.checks.push('Confirmed prior parity/retry tests and exact approved candidate digest; checked real endpoint before browser run');
           for(let i=0;i<5;i++){
            if(i%2){report.pilot.push(await measure(true));report.control.push(await measure(false));}
            else{report.control.push(await measure(false));report.pilot.push(await measure(true));}
           }
           const c=await browser.newContext({viewport:{width:1360,height:900}}),p=await c.newPage();
           try{
            const asked=[];p.on('request',r=>asked.push(new URL(r.url()).pathname));
            await p.goto(F+path+opt,{waitUntil:'domcontentloaded'});
            await p.locator(heroFull).waitFor({timeout:25000});
            A(!asked.includes(lite));
           }finally{await c.close()}
           A.equal(await read(F+'/__b46_prematch_client.js'),native);
           A.equal((await req(F+lite+'?__b46_original_ui_shell=1')).status,404);
           A(!(await read(P+'/?b46pm=ou')).includes(lite));A.deepEqual(await guard(),hold);
           const mid=(x,k)=>[...x].map(y=>y[k]).sort((a,b)=>a-b)[Math.floor(x.length/2)];
           report.median=Object.fromEntries(['before','control','pilot'].map(k=>[k,{ms:mid(report[k],'ms'),bytes:mid(report[k],'bytes')}]));
           report.status='PASSED';
          }catch(e){
           console.error(e.stack);
           if(switched&&await active(w)===next)report.rollback=await activate(old,'Rollback TEST mobile stats experiment');
           throw e;
          }finally{await browser?.close();console.log('B46_MOBILE_LITE_QA '+JSON.stringify(report));}
          B46_MOBILE_LITE
