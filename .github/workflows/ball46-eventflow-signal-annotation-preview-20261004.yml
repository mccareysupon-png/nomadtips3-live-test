name: Ball46 Event Flow Signal Annotation Preview 20261004

on:
  push:
    branches: [work/eventflow-signal-annotation-20261004]
    paths:
      - '.github/workflows/ball46-eventflow-signal-annotation-preview-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preview current Production, annotation patch and convergence guard without deploy
        working-directory: deploy-assets/eventflow-signal-annotation-20261004
        run: node run-convergent.mjs
      - name: Retain preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-eventflow-signal-annotation-preview-${{ github.run_id }}
          path: deploy-assets/eventflow-signal-annotation-20261004/audit/
          if-no-files-found: error
          retention-days: 14
