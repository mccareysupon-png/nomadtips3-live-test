name: Deploy Engine343 Best19 Production B

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-engine343-best19-production-20260925b.yml'

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORK_BRANCH: work/343-best-price-19book-20260918
  PROD_URL: https://nomadtips3-engine-343.mccarey-supon.workers.dev

jobs:
  deploy-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WORK_BRANCH }}
          fetch-depth: 1
      - name: Validate exact production target
        run: |
          set -euo pipefail
          node --check workers/nomadtips3-engine-343/src/index-bulk.js
          grep -Fq "nomad343-engine-v5-best19-referee" workers/nomadtips3-engine-343/src/index-bulk.js
          grep -Fq "BEST_OF_19_INPLAY" workers/nomadtips3-engine-343/src/index-bulk.js
          grep -Fq "BEST19_CONSENSUS_LINE" workers/nomadtips3-engine-343/src/index-bulk.js
          grep -Fq 'name = "nomadtips3-engine-343"' workers/nomadtips3-engine-343/wrangler.toml
      - name: Deploy engine only
        working-directory: workers/nomadtips3-engine-343
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.toml
          npx --yes wrangler@4.92.0 deploy --config wrangler.toml
      - name: Verify v5 Best19
        run: |
          set -euo pipefail
          sleep 4
          curl -fsS --max-time 20 "$PROD_URL/health?_=$RANDOM$RANDOM" -o /tmp/health.json
          cat /tmp/health.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          if(!String(j.version||'').includes('v5-best19-referee')) throw new Error('wrong version: '+j.version);
          console.log('BEST19_PRODUCTION_PASS');
          NODE
