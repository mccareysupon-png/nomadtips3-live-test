name: Deploy NOMAD 3.43 Full Market v4 Canary

on:
  push:
    branches: [work/nomad343-full-market-v4-clean-20260914]
    paths:
      - 'workers/nomadtips3-343-full-market/src/index-v4.js'
      - 'workers/nomadtips3-343-full-market/wrangler.canary.toml'
      - '.github/workflows/deploy-343-full-market-v4-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
  CANARY_URL: https://nomadtips3-343-full-market-v4-canary.mccarey-supon.workers.dev
  HUB_URL: https://nomadtips3-5usd-hub-343.mccarey-supon.workers.dev

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard isolated scope
        run: |
          set -euo pipefail
          git fetch origin work/nomad343-api-mixer-20260914:refs/remotes/origin/work/nomad343-api-mixer-20260914
          git diff --name-only refs/remotes/origin/work/nomad343-api-mixer-20260914...HEAD | tee /tmp/changed.txt
          if grep -Ev '^(workers/nomadtips3-343-full-market/(src/index-v4\.js|wrangler\.toml|wrangler\.canary\.toml)|\.github/workflows/deploy-343-full-market-v4-canary\.yml)$' /tmp/changed.txt | grep -q .; then
            echo 'Unexpected file outside isolated Full Market v4 scope'; exit 1
          fi
          if ! git diff --quiet refs/remotes/origin/work/nomad343-api-mixer-20260914...HEAD -- workers/nomadtips3-engine-343 workers/nomadtips3-5usd-hub-343 nomad-live-343; then
            echo 'Engine/HUB/UI changed unexpectedly'; exit 1
          fi
          echo 'ISOLATED SCOPE: OK'

      - name: Syntax and dry-run
        working-directory: workers/nomadtips3-343-full-market
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check src/index-v4.js
          grep -Fq "nomad343-full-market-v4-account-orchestrator" src/index-v4.js
          grep -Fq "ACCOUNT_RATE_LIMIT_PER_MIN = 40" src/index-v4.js
          grep -Fq "ACCOUNT_RESERVE = 4" src/index-v4.js
          grep -Fq "BULK_FIRST_DETAIL_QUEUE" src/index-v4.js
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.canary.toml

      - name: Validate credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$FIVEDOLLAR_API_KEY"

      - name: Deploy isolated canary
        working-directory: workers/nomadtips3-343-full-market
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.canary.toml

      - name: Bind Ultra key to canary
        working-directory: workers/nomadtips3-343-full-market
        run: printf '%s' "$FIVEDOLLAR_API_KEY" | npx --yes wrangler@4.92.0 secret put FIVEDOLLAR_API_KEY --config wrangler.canary.toml

      - name: Smoke canary health and burst guard
        run: |
          set -euo pipefail
          sleep 5
          curl_retry() {
            curl -fsS --retry 6 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 "$1" -o "$2"
          }

          curl_retry "$CANARY_URL/health?smoke=$RANDOM" /tmp/health.json
          node - <<'NODE'
          const j=require('/tmp/health.json');
          if(j.ok!==true) throw Error(j.error||'health failed');
          if(j.version!=='nomad343-full-market-v4-account-orchestrator') throw Error(`wrong version ${j.version}`);
          if(j.orchestration?.mode!=='BULK_FIRST_DETAIL_QUEUE') throw Error('orchestration mode');
          if(j.orchestration?.globalQueue!==true||j.orchestration?.oneProviderRequestAtATime!==true) throw Error('queue guard');
          if(j.rate?.accountLimitPerMinute!==40||j.rate?.accountReserve!==4) throw Error('rate policy');
          console.log('HEALTH OK',j.version,j.orchestration);
          NODE

          curl_retry "$CANARY_URL/monitor?smoke=$RANDOM" /tmp/monitor-before.json
          curl_retry "$HUB_URL/snapshot?smoke=$RANDOM" /tmp/hub.json
          node - <<'NODE'
          const fs=require('fs'); const j=require('/tmp/hub.json');
          const f=Array.isArray(j.fixtures)?j.fixtures:[];
          const ids=[...new Set(f.map(x=>x?.fixtureId).filter(Boolean).map(String))].slice(0,8);
          fs.writeFileSync('/tmp/ids',ids.join('\n'));
          console.log('FIXTURES',ids.length,ids.join(','));
          NODE

          COUNT=0
          while IFS= read -r ID; do
            [ -n "$ID" ] || continue
            COUNT=$((COUNT+1))
            curl_retry "$CANARY_URL/fixture-odds?fixtureId=$ID&smoke=$RANDOM" "/tmp/f$COUNT.json"
            node -e 'const j=require(process.argv[1]);if(j.ok!==true)throw Error(j.error||"fixture odds failed");if(j.version!=="nomad343-full-market-v4-account-orchestrator")throw Error("wrong version");console.log("FIXTURE",j.fixtureId,"source",j.source,"cached",j.cached,"queued",j.queued,"limited",j.limited,"providerRemaining",j.rate?.providerRemaining)' "/tmp/f$COUNT.json"
          done < /tmp/ids

          sleep 8
          curl_retry "$CANARY_URL/monitor?smoke=$RANDOM" /tmp/monitor-after.json
          node - <<'NODE'
          const j=require('/tmp/monitor-after.json');
          if(j.version!=='nomad343-full-market-v4-account-orchestrator') throw Error('monitor version');
          if(j.controller?.mode!=='BULK_FIRST_DETAIL_QUEUE') throw Error('monitor mode');
          if(j.controller?.globalQueue!==true||j.controller?.oneProviderRequestAtATime!==true) throw Error('monitor queue');
          if((j.total?.provider429||0)>0) throw Error(`provider429=${j.total.provider429}`);
          if((j.controller?.trackedAccountUsed60s||0)>36) throw Error(`tracked rate too high ${j.controller.trackedAccountUsed60s}`);
          console.log('CANARY MONITOR OK',JSON.stringify(j.controller));
          NODE

          echo "CANARY PASS: no 429, serialized detail queue, account guard active"
