name: BALL46 Approved Featured Match Sections V10 - Safe Deploy
on:
  push:
    branches: [fix/ball46-featured-sections-approved-v10-20261021]
    paths:
      - '.github/workflows/ball46-featured-approved-sections-v10-deploy.yml'
      - 'deploy-assets/featured-sections-v10/approved-sections.css'
      - 'deploy-assets/featured-sections-v10/deploy-approved-v10.mjs'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks and browser dependencies
        working-directory: deploy-assets/featured-sections-v10
        run: |
          set -euo pipefail
          node --check deploy-approved-v10.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Compare exact latest Production, browser QA candidate then guarded Production promotion
        working-directory: deploy-assets/featured-sections-v10
        run: node deploy-approved-v10.mjs
      - name: Preserve PC/mobile dark/light proof and guarded rollback report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-featured-approved-v10-production-evidence
          path: deploy-assets/featured-sections-v10/proof/
          retention-days: 30
          if-no-files-found: warn