name: BALL46 exact Statistics production chart source owner audit
on:
  push:
    branches: [fix/b46-production-statistics-range-no-flicker-20261125]
    paths: ['.github/workflows/b46-production-statistics-source-audit-20261125.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node qa/statistics-no-flicker-20261125/source.mjs

