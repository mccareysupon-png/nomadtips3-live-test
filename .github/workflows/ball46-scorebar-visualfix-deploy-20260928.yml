name: DEPLOY - Ball46 Scorebar Visualfix 20260928
on:
  push:
    branches:
      - work/ball46-scorebar-background-pending-20260928
    paths:
      - '.github/workflows/ball46-scorebar-visualfix-deploy-20260928.yml'
      - '.github/scripts/ball46_scorebar_visualfix_deploy_20260928.sh'
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ball46-scorebar-visualfix-predeploy-36397864768
          path: /tmp/b46-visualfix
          github-token: ${{ github.token }}
          run-id: 36397864768
          repository: mccareysupon-png/nomadtips3-live-test
      - name: Deploy verified two-file visualfix candidate
        run: bash .github/scripts/ball46_scorebar_visualfix_deploy_20260928.sh
      - name: Upload deploy proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-scorebar-visualfix-deploy-${{ github.run_id }}
          path: /tmp/b46-visualfix-deploy
          if-no-files-found: ignore
          retention-days: 30
