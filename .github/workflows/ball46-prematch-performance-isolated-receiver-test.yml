name: BALL46 independent Pre-Match TEST Receiver and DO
on:
  push:
    branches: [test/ball46-premium-match-colors-20261120]
    paths:
      - '.github/workflows/ball46-prematch-performance-isolated-receiver-test.yml'
      - 'qa/prematch-performance-20261121/performance-core.mjs'
      - 'qa/prematch-performance-20261121/test-ledger-import.mjs'
      - 'qa/prematch-performance-20261121/test-receiver-worker.mjs'
      - 'qa/prematch-performance-20261121/wrangler.test.toml'
concurrency:
  group: b46-pre-performance-isolated-test-deploy
  cancel-in-progress: true
permissions: {contents: read}
jobs:
  isolated-receiver:
    if: github.ref == 'refs/heads/test/ball46-premium-match-colors-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify source isolation and code
        run: |
          node --check qa/prematch-performance-20261121/test-receiver-worker.mjs
          node --check qa/prematch-performance-20261121/test-ledger-import.mjs
          node --test qa/prematch-performance-20261121/performance-core.test.mjs qa/prematch-performance-20261121/test-ledger-import.test.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const c=fs.readFileSync('qa/prematch-performance-20261121/wrangler.test.toml','utf8');
          assert(c.includes('name = "ball46-prematch-performance-test-20261121"'));
          assert(c.includes('service = "ball46-prematch-only-test-20261120"'));
          assert(c.includes('class_name = "PrematchPerformanceIsolatedDO"'));
          assert(!/ball46-production|nomadtips3-engine|5usd|goaloo|B46_PRODUCTION_READ|production\.com/i.test(c));
          console.log('ISOLATED_RECEIVER_BINDINGS_PASS');
          NODE
      - name: Deploy standalone test Worker with its own DO
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.50.0 deploy --config qa/prematch-performance-20261121/wrangler.test.toml
      - name: Smoke GET test graph from independently persisted receiver
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base='https://ball46-prematch-performance-test-20261121.mccarey-supon.workers.dev';
          let h;
          for(let i=0;i<20;i++){
            try{const r=await fetch(base+'/health',{cache:'no-store',signal:AbortSignal.timeout(20000)});if(r.ok){h=await r.json();if(h.ok&&h.scope==='PREMATCH_TEST_ONLY')break;console.log('HEALTH_RETRY',r.status,h)}}catch(e){console.log('HEALTH_RETRY_ERROR',String(e).slice(0,170))}
            await new Promise(r=>setTimeout(r,3000));
          }
          assert.equal(h?.scope,'PREMATCH_TEST_ONLY');
          assert.equal(h?.storage,'INDEPENDENT_DURABLE_OBJECT');
          assert.equal(h?.source,'TEST_ONLY_PREMATCH_STORE');
          assert(h.picks>=8&&h.settled>=4&&h.pending>=0);
          assert.equal(h.picks,h.settled+h.pending);
          const q={market:'1X2',variant:'all',filter:'all',range:'all'};
          const u=base+'/graph?'+new URLSearchParams(q);
          const r=await fetch(u,{cache:'no-store',signal:AbortSignal.timeout(20000)});
          assert(r.ok,'GRAPH_HTTP_'+r.status);
          const g=await r.json();
          assert.equal(g.ok,true);assert.equal(g.source,'RECEIVER');assert.equal(g.scope,'PREMATCH_TEST_ONLY');
          assert.equal(g.schema,1);assert.equal(g.market,'1X2');assert.equal(g.sequence,h.sequence);
          assert.equal(g.summary.rows,h.settled);assert.equal(g.summary.net,h.units);
          assert.deepEqual(g.series.units.map(p=>Object.keys(p)),g.series.units.map(()=>['date','value']));
          assert(g.series.units.length>=1);
          for(const range of ['d7','d30','d90']){
            const rr=await fetch(base+'/graph?'+new URLSearchParams({...q,range}));
            assert(rr.ok,range+'_HTTP_'+rr.status);
            const v=await rr.json();assert.equal(v.range,range);assert(v.summary.rows<=g.summary.rows);
          }
          const again=await(await fetch(base+'/health',{cache:'no-store'})).json();
          assert.equal(again.sequence,h.sequence,'GET_MUST_NOT_RECOUNT_LEDGER');
          const noPost=await fetch(base+'/graph',{method:'POST'});
          assert.equal(noPost.status,405,'EXTERNAL_WRITES_MUST_BE_BLOCKED');
          console.log('PREMATCH_INDEPENDENT_RECEIVER_PASS',JSON.stringify({
            scope:h.scope,source:h.source,sequence:h.sequence,picks:h.picks,settled:h.settled,
            pending:h.pending,netUnits:h.units,days:h.dailyPoints,query:q,graphRows:g.summary.rows,
            graphPoints:g.series.units.length,providerApiCallsAdded:0,productionModified:false
          }));
          NODE
