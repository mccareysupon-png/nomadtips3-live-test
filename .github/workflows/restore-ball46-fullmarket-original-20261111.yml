name: Restore BALL46 Full Market Original 20261111
on:
  push:
    branches: [ops/ball46-fullmarket-restore-original-20261111]
    paths: ['fullmarket-restore-original-20261111/RELEASE_READY']
permissions: {contents: read}
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: ops/ball46-fullmarket-restore-original-20261111}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node fullmarket-restore-original-20261111/restore.mjs
