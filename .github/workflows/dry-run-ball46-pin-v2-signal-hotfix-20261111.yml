name: Dry Run BALL46 Pin V2 Signal Badge Hotfix 20261111
on:
  push:
    branches: [test/ball46-pin-v2-signal-preserve-20261111]
    paths: ['pinned-fixtures-v2-production/SIGNAL_HOTFIX_DRY_RUN_READY']
permissions: {contents: read}
jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: test/ball46-pin-v2-signal-preserve-20261111}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node pinned-fixtures-v2-production/signal-badge-hotfix-dry-run.mjs
