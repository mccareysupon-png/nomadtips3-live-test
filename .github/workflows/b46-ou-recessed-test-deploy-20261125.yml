name: BALL46 OU premium borderless recessed TEST only
on:
  push:
    branches: [fix/ball46-ou-premium-recessed-test-20261125]
    paths: [.github/workflows/b46-ou-recessed-test-deploy-20261125.yml]
permissions: {contents: read}
concurrency:
  group: ball46-prematch-frontend-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
