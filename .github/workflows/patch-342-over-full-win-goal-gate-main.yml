name: Patch 3.42 OVER Full Win Goal Gate Main

on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/patch-342-over-full-win-goal-gate-main.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Patch and test 3.42 OVER only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              count=s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          replace_one('nomad-live-342/settings.html','<label><span>เส้น Over ไม่เกิน</span><input name="lineMax" type="number" min="0.5" max="10" step="0.5" required></label>','<label><span>ยิงเพิ่มเพื่อชนะเต็ม ไม่เกิน</span><select name="maxGoalsToFullWin" required><option value="1">1 ลูก</option><option value="2">2 ลูก</option><option value="3">3 ลูก</option><option value="999">ไม่จำกัด</option></select><small>เทียบสกอร์ปัจจุบันกับ Over Line อัตโนมัติ · เช่น 3-1 / O4.5 ต้องเพิ่ม 1 ลูก = ผ่านเมื่อเลือก 1 ลูก</small></label>')
          replace_one('nomad-live-342/settings.html','market-settings-v3.js?v=20260906-th-v1-ah1-overmax-static-20260911','market-settings-v3.js?v=20260906-th-v1-ah1-overmax-static-20260911-fullwin-v1')
          replace_one('nomad-live-342/settings.html','market-settings-server-sync.js?v=20260908-server-v1-ah1-overmax-sync-20260911','market-settings-server-sync.js?v=20260908-server-v1-ah1-overmax-sync-20260911-fullwin-v1')

          replace_one('nomad-live-342/market-settings-v3.js','over:{lineMin:0.5,lineMax:10,oddsMin:1.01,shotOnTarget:1,shotOff:1,corner:1,dangerousAttackPct:50,attackPct:50,possessionPct:50,evidenceRequired:3,minuteFrom:0,minuteTo:120,rollingWindowMinutes:5}','over:{lineMin:0.5,maxGoalsToFullWin:1,oddsMin:1.01,shotOnTarget:1,shotOff:1,corner:1,dangerousAttackPct:50,attackPct:50,possessionPct:50,evidenceRequired:3,minuteFrom:0,minuteTo:120,rollingWindowMinutes:5}')
          replace_one('nomad-live-342/market-settings-v3.js',"  const base=clone(DEFAULTS[name]);const out={...base,...(input||{})};\n  if(name!=='over')out.sideMode=['HOME','AWAY','BOTH'].includes(String(out.sideMode||'').toUpperCase())?String(out.sideMode).toUpperCase():'BOTH';","  const base=clone(DEFAULTS[name]);const out={...base,...(input||{})};\n  if(name==='over')delete out.lineMax;\n  if(name!=='over')out.sideMode=['HOME','AWAY','BOTH'].includes(String(out.sideMode||'').toUpperCase())?String(out.sideMode).toUpperCase():'BOTH';")
          replace_one('nomad-live-342/market-settings-v3.js',"  if(name==='over'){\n    if(finite(cfg.lineMax)===null||cfg.lineMax<0.5||cfg.lineMax>10||!Number.isInteger(cfg.lineMax*2))e.push('เส้น Over ไม่เกินต้องอยู่ระหว่าง 0.5–10.0 เพิ่มทีละ 0.5');\n    if(finite(cfg.lineMin)!==null&&finite(cfg.lineMax)!==null&&Number(cfg.lineMin)>Number(cfg.lineMax))e.push('เส้น Over ตั้งแต่ต้องไม่มากกว่าเส้น Over ไม่เกิน');\n  }","  if(name==='over'&&![1,2,3,999].includes(Number(cfg.maxGoalsToFullWin)))e.push('ยิงเพิ่มเพื่อชนะเต็มต้องเลือก 1, 2, 3 ลูก หรือไม่จำกัด');")

          p=Path('nomad-live-342/market-settings-v3.js')
          s=p.read_text(encoding='utf-8')
          old='\n'.join([
              'function ensureOverLineMaxField(){',
              '  const form=document.querySelector(\'form[data-market-form="over"]\');if(!form||form.elements.namedItem(\'lineMax\'))return;',
              '  const lineMin=form.elements.namedItem(\'lineMin\'),anchor=lineMin?.closest(\'label\');if(!anchor)return;',
              '  const label=document.createElement(\'label\');',
              '  label.innerHTML=\'<span>เส้น Over ไม่เกิน</span><input name="lineMax" type="number" min="0.5" max="10" step="0.5" required>\';',
              '  anchor.insertAdjacentElement(\'afterend\',label);',
              '}',
              ''
          ])
          if s.count(old)!=1:
              raise SystemExit(f'market-settings-v3.js: ensureOverLineMaxField block count={s.count(old)}')
          s=s.replace(old,'',1)
          if s.count('  ensureOverLineMaxField();\n')!=1:
              raise SystemExit('market-settings-v3.js: ensureOverLineMaxField call missing')
          s=s.replace('  ensureOverLineMaxField();\n','',1)
          p.write_text(s,encoding='utf-8')

          replace_one('nomad-live-342/market-settings-server-sync.js',"function verifyServerEcho(localSnapshot,serverSnapshot){\n  const wanted=finite(localSnapshot?.settings?.over?.lineMax),received=finite(serverSnapshot?.settings?.over?.lineMax);\n  if(wanted>0&&received!==wanted)throw new Error(`OVER_MAX_SYNC_MISMATCH:${wanted}->${received}`);\n}","function verifyServerEcho(localSnapshot,serverSnapshot){\n  const wanted=finite(localSnapshot?.settings?.over?.maxGoalsToFullWin),received=finite(serverSnapshot?.settings?.over?.maxGoalsToFullWin);\n  if(wanted>0&&received!==wanted)throw new Error(`OVER_FULL_WIN_GOALS_SYNC_MISMATCH:${wanted}->${received}`);\n}")

          replace_one('workers/nomadtips3-342-signal-engine/src/index.js','over:{lineMin:0.5,lineMax:10,oddsMin:1.01,shotOnTarget:1,shotOff:1,corner:1,dangerousAttackPct:50,attackPct:50,possessionPct:50,evidenceRequired:3,minuteFrom:0,minuteTo:120,rollingWindowMinutes:5}','over:{lineMin:0.5,maxGoalsToFullWin:1,oddsMin:1.01,shotOnTarget:1,shotOff:1,corner:1,dangerousAttackPct:50,attackPct:50,possessionPct:50,evidenceRequired:3,minuteFrom:0,minuteTo:120,rollingWindowMinutes:5}')
          replace_one('workers/nomadtips3-342-signal-engine/src/index.js',"  const base=clone(DEFAULTS[name]),out={...base,...(input||{})};\n  if(name!=='over')out.sideMode=['HOME','AWAY','BOTH'].includes(String(out.sideMode||'').toUpperCase())?String(out.sideMode).toUpperCase():'BOTH';","  const base=clone(DEFAULTS[name]),out={...base,...(input||{})};\n  if(name==='over')delete out.lineMax;\n  if(name!=='over')out.sideMode=['HOME','AWAY','BOTH'].includes(String(out.sideMode||'').toUpperCase())?String(out.sideMode).toUpperCase():'BOTH';")
          replace_one('workers/nomadtips3-342-signal-engine/src/index.js',"    if(name==='over'&&(c.lineMax<.5||c.lineMax>10||!Number.isInteger(c.lineMax*2)||c.lineMin>c.lineMax))errors.push(`${name}.lineMax`);","    if(name==='over'&&![1,2,3,999].includes(Number(c.maxGoalsToFullWin)))errors.push(`${name}.maxGoalsToFullWin`);")
          replace_one('workers/nomadtips3-342-signal-engine/src/index.js','function lineRangeOk(value,min,max){const n=finite(value),lo=finite(min),hi=finite(max);return n!==null&&lo!==null&&hi!==null&&n>=lo&&n<=hi&&n<=20&&Number.isInteger(n*4)}',"function goalsNeededForFullOverWin(line,score){const n=finite(line),h=finite(score?.[0]),a=finite(score?.[1]);if(n===null||h===null||a===null||!Number.isInteger(n*4))return null;const minimumFullWinTotal=Math.floor(n+.25)+1;return Math.max(0,minimumFullWinTotal-h-a)}\nfunction fullWinGoalLimitOk(line,score,maxGoals){const needed=goalsNeededForFullOverWin(line,score),limit=finite(maxGoals);return needed!==null&&limit!==null&&(limit===999||needed<=limit)}")
          replace_one('workers/nomadtips3-342-signal-engine/src/index.js',"    if(!lineRangeOk(line,cfg.lineMin,cfg.lineMax))reasons.push('เส้น Over ไม่อยู่ในช่วงที่ตั้ง');if(!oddsOk(odds,cfg.oddsMin))reasons.push('ราคา odds ต่ำกว่าที่ตั้ง');","    if(!lineOk(line,cfg.lineMin))reasons.push('เส้น Over ต่ำกว่าที่ตั้ง');const goalsToFullWin=goalsNeededForFullOverWin(line,m.score);if(!fullWinGoalLimitOk(line,m.score,cfg.maxGoalsToFullWin))reasons.push(goalsToFullWin===null?'คำนวณจำนวนประตูเพื่อชนะเต็มไม่ได้':`ต้องยิงเพิ่ม ${goalsToFullWin} ลูกเพื่อชนะเต็ม เกินค่าที่ตั้ง`);if(!oddsOk(odds,cfg.oddsMin))reasons.push('ราคา odds ต่ำกว่าที่ตั้ง');")
          replace_one('workers/nomadtips3-342-signal-engine/src/index.js','export {hkToDecimal,parseAsianHandicapQuotes,ahSideQuote,signalFamily,lockedFamilies,filterNewSignals,normalizeFiveDollarShotRow,fiveDollarShotEvidence,mergeShotEvidence};','export {hkToDecimal,parseAsianHandicapQuotes,ahSideQuote,signalFamily,lockedFamilies,filterNewSignals,normalizeFiveDollarShotRow,fiveDollarShotEvidence,mergeShotEvidence,goalsNeededForFullOverWin,fullWinGoalLimitOk};')

          test_lines=[
              "import test from 'node:test';",
              "import assert from 'node:assert/strict';",
              "import {goalsNeededForFullOverWin,fullWinGoalLimitOk} from '../src/index.js';",
              '',
              "test('score 3-1 accepts O4.25 and O4.5 with one-goal full-win limit',()=>{",
              '  assert.equal(goalsNeededForFullOverWin(4.25,[3,1]),1);',
              '  assert.equal(goalsNeededForFullOverWin(4.5,[3,1]),1);',
              '  assert.equal(fullWinGoalLimitOk(4.25,[3,1],1),true);',
              '  assert.equal(fullWinGoalLimitOk(4.5,[3,1],1),true);',
              '});',
              '',
              "test('score 3-1 rejects O4.75 with one-goal limit because one more is only half-win',()=>{",
              '  assert.equal(goalsNeededForFullOverWin(4.75,[3,1]),2);',
              '  assert.equal(fullWinGoalLimitOk(4.75,[3,1],1),false);',
              '  assert.equal(fullWinGoalLimitOk(4.75,[3,1],2),true);',
              '});',
              '',
              "test('quarter-line full-win math and unlimited mode remain deterministic',()=>{",
              '  assert.equal(goalsNeededForFullOverWin(5.0,[3,1]),2);',
              '  assert.equal(goalsNeededForFullOverWin(5.25,[3,1]),2);',
              '  assert.equal(goalsNeededForFullOverWin(5.75,[3,1]),3);',
              '  assert.equal(fullWinGoalLimitOk(9.75,[3,1],999),true);',
              '  assert.equal(fullWinGoalLimitOk(4.5,null,1),false);',
              '});',
              ''
          ]
          Path('workers/nomadtips3-342-signal-engine/test/over-full-win-goals.test.mjs').write_text('\n'.join(test_lines),encoding='utf-8')
          PY

          grep -Fq 'name="maxGoalsToFullWin"' nomad-live-342/settings.html
          grep -Fq 'maxGoalsToFullWin:1' nomad-live-342/market-settings-v3.js
          grep -Fq 'maxGoalsToFullWin:1' workers/nomadtips3-342-signal-engine/src/index.js
          grep -Fq 'fullWinGoalLimitOk(line,m.score,cfg.maxGoalsToFullWin)' workers/nomadtips3-342-signal-engine/src/index.js
          ! grep -Fq 'lineRangeOk(line,cfg.lineMin,cfg.lineMax)' workers/nomadtips3-342-signal-engine/src/index.js
          node --check nomad-live-342/market-settings-v3.js
          node --check nomad-live-342/market-settings-server-sync.js
          npm --prefix workers/nomadtips3-342-signal-engine test

      - name: Commit tested 3.42 patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-342-over-full-win-goal-gate-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nomad-live-342/settings.html nomad-live-342/market-settings-v3.js nomad-live-342/market-settings-server-sync.js workers/nomadtips3-342-signal-engine/src/index.js workers/nomadtips3-342-signal-engine/test/over-full-win-goals.test.mjs .github/workflows/patch-342-over-full-win-goal-gate-main.yml
          git diff --cached --check
          git commit -m "3.42: gate OVER by goals needed for full win"
          git push origin HEAD:main
