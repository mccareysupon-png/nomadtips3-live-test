name: Audit Ball46 John Existing Rich Odds Fanout Paths
on:
  push:
    branches: [incident/ball46-signal-silent-20261011]
    paths: [.github/workflows/audit-ball46-john-fanout-source-20261011.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read HUB source path 520-705 and quota only - do not call provider
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const acc=process.env.CLOUDFLARE_ACCOUNT_ID,tok=process.env.CLOUDFLARE_API_TOKEN,base='https://api.cloudflare.com/client/v4/accounts/'+acc+'/workers';
          const get=async p=>{const r=await fetch(base+p,{headers:{Authorization:'Bearer '+tok},signal:AbortSignal.timeout(25000)}),j=await r.json();if(!r.ok||!j.success)throw Error('CF_'+r.status);return j.result};
          const ds=await get('/scripts/nomadtips3-5usd-hub-343/deployments'),id=ds.deployments?.[0]?.versions?.find(x=>Number(x.percentage)===100)?.version_id;
          const v=await get('/workers/nomadtips3-5usd-hub-343/versions/'+id+'?include=modules'),s=Buffer.from(v.modules.find(x=>x.name===v.main_module).content_base64,'base64').toString('utf8'),l=s.split('\n');
          for(const [from,to] of [[195,247],[520,585],[598,690],[690,750]]){
            console.log('JOHN_HUB_SOURCE',JSON.stringify({version:id,from,to,code:l.slice(from-1,to).map((x,i)=>String(from+i)+': '+x).join('\n').slice(0,12500)}));
          }
          NODE
