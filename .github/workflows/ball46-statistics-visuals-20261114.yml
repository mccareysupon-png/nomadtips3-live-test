name: BALL46 Statistics two approved visual changes
on:
  push:
    branches: [test/ball46-statistics-visuals-20261114]
    paths: ['work/statistics-visual-release-20261114/**','.github/workflows/ball46-statistics-visuals-20261114.yml']
permissions:
  contents: read
jobs:
  guarded-visual-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser checks
        run: |
          npm install --prefix work/statistics-visual-release-20261114/.runtime --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          work/statistics-visual-release-20261114/.runtime/node_modules/.bin/playwright install --with-deps chromium
      - name: Fresh source, isolated candidate, visual QA and guarded activation
        env:
          B46_VISUAL_CANDIDATE: 474dce9c-f809-4a8b-abda-2ada8063b9ef
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node work/statistics-visual-release-20261114/release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-statistics-two-visuals-proof
          path: work/statistics-visual-release-20261114/qa
