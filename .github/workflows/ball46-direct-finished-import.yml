name: BALL46 direct finished result import
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-direct-finished-import.yml']
permissions:
  contents: read
concurrency:
  group: ball46-direct-finished-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import real completed matches into SQLite
        env:
          FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
        run: node qa/prematch-history-20261120/direct-finished-import.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-finished-history
          path: evidence/history/
          retention-days: 90
