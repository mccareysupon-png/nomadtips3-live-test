name: BALL46 ACTIVE SIGNALS Atomic V11 fix guarded production deploy
on:
  push:
    branches: [fix/ball46-active-signals-atomic-v11-20261023]
    paths:
      - '.github/workflows/ball46-active-signals-atomic-deploy.yml'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  verify-candidate-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check before any production write
        working-directory: deploy-assets/active-signals-atomic-20261023
        run: |
          node --check patch.mjs
          node --check candidate.mjs
          node --check browser.mjs
          node --check activate.mjs
      - name: Guard live Worker source/assets, upload isolated candidate, test protected routes
        working-directory: deploy-assets/active-signals-atomic-20261023
        run: node candidate.mjs
      - name: Install browser test dependencies
        working-directory: deploy-assets/active-signals-atomic-20261023
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser regression - 30 successive updates; desktop/mobile light/dark
        working-directory: deploy-assets/active-signals-atomic-20261023
        run: node browser.mjs
      - name: Guarded production activation with rollback
        working-directory: deploy-assets/active-signals-atomic-20261023
        run: node activate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-active-signals-atomic-proof-${{ github.run_id }}
          path: deploy-assets/active-signals-atomic-20261023/audit/
          retention-days: 30
