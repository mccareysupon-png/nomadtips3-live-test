name: BALL46 screen refresh 5s read-only inspect
on:
  push:
    branches: [codex/ball46-screen-refresh-5s-20261104]
    paths: ['work/screen-refresh-5s-20261104/inspect-request.json']
permissions:
  contents: write
concurrency:
  group: ball46-screen-refresh-inspect
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false --prefix work/screen-refresh-5s-20261104 acorn@8.15.0
      - run: node work/screen-refresh-5s-20261104/inspect.mjs
      - name: Preserve public source and read-only evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/screen-refresh-5s-20261104/audit work/screen-refresh-5s-20261104/stage
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record live source and cache-only route contracts [skip ci]"
          git push origin HEAD:codex/ball46-screen-refresh-5s-20261104
