name: Ball46 Cloudflare History Probe 20260926

on:
  push:
    branches:
      - ops/ball46-seo-deploy-20260926
    paths:
      - '.github/workflows/ball46-cloudflare-history-probe-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show Ball46 deployment and version history
        shell: bash
        run: |
          set -euo pipefail
          echo '=== deployments list ==='
          npx --yes wrangler@4.92.0 deployments list --name ball46-production || true
          echo '=== versions list ==='
          npx --yes wrangler@4.92.0 versions list --name ball46-production || true
