name: Statistics offline PACKAGE QA (NO deployment)
on:
  push:
    branches: [test/ball46-statistics-runtime-isolated-20261114]
    paths: ['.github/workflows/statistics-package-qa-20261114.yml', 'work/statistics-release-package-20261114/**']
permissions:
  contents: read
jobs:
  package-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated test tools
        run: npm install --prefix work/statistics-read-model-v2-20261114/.runtime --no-audit --no-fund miniflare@4.20260730.0 esbuild@0.28.2 playwright@1.65.1
      - name: Install isolated Chromium
        run: work/statistics-read-model-v2-20261114/.runtime/node_modules/.bin/playwright install --with-deps chromium
      - name: Fresh captured real data and source locks
        run: node work/statistics-read-model-v2-20261114/capture-ci-input.mjs
      - name: Build offline package from exact current Active modules (GET only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node work/statistics-release-package-20261114/build-package.mjs
      - name: Execute exact packaged Workers and PC/mobile UI without live bindings
        run: node work/statistics-release-package-20261114/package-runtime-test.mjs
      - name: Reread Active identity, no mutations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node qa-readonly/statistics-active.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: statistics-offline-release-package-DO-NOT-DEPLOY
          path: |
            work/statistics-release-package-20261114/output/
            qa-readonly/result/active.json
          retention-days: 7
