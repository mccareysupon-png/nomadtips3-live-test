name: BALL46 Production PC Remove Top Result Ticker 20261020
on:
  push:
    branches: [codex/ball46-pc-ticker-camouflage-20261020]
    paths:
      - '.github/workflows/ball46-pc-ticker-hide-deploy-20261020.yml'
      - 'deploy-assets/pc-ticker-hide-20261020/deploy.mjs'
      - 'deploy-assets/pc-ticker-hide-20261020/theme.mjs'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  guarded-desktop-ticker-hide:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and Browser Setup
        working-directory: deploy-assets/pc-ticker-hide-20261020
        run: |
          set -euo pipefail
          node --check theme.mjs
          node --check deploy.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
      - name: Preview and production test, gated deployment, automatic rollback
        working-directory: deploy-assets/pc-ticker-hide-20261020
        run: node deploy.mjs
      - name: Preserve before-after desktop and mobile screenshots and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-pc-top-results-ticker-removal-audit
          path: deploy-assets/pc-ticker-hide-20261020/audit/
          retention-days: 30
          if-no-files-found: warn
