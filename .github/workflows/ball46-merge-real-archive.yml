name: BALL46 merge verified isolated archives
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-merge-real-archive.yml']
permissions:
  contents: read
concurrency:
  group: ball46-prematch-only-test
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node qa/prematch-history-20261120/merge-real-archive.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-archive-merge
          path: evidence/

# Retry with active version route verification.
