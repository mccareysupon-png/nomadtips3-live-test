name: BALL46 Search dark light surface - candidate QA
on:
  push:
    branches: [fix/ball46-search-surface-dualmode-20261024]
    paths:
      - .github/workflows/b46-search-surface-candidate.yml
      - deploy-assets/search-surface-20261024/candidate.mjs
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core
          node --check deploy-assets/search-surface-20261024/patch.mjs
          node --check deploy-assets/search-surface-20261024/candidate.mjs
          node deploy-assets/search-surface-20261024/candidate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b46-search-surface-candidate-${{ github.run_id }}
          path: deploy-assets/search-surface-20261024/audit/
          retention-days: 14
