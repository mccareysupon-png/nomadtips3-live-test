name: DIAG Ball46 Active Before Away Fix 20261013

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-ball46-active-before-away-fix-20261013.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-performance-chart-market-style-20261012
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts acorn@8
      - working-directory: deploy-assets/performance-chart-market-style-20261012
        run: |
          node --input-type=module <<'NODE'
          import {inspect,publicFile} from '../daily-performance-20261005/production.mjs';
          const cur=await inspect();
          console.log('ACTIVE='+cur.restore.version);
          const css=(await publicFile('/color-semantics-343.css')).toString('utf8');
          const m=css.match(/\[data-featured-away\]\s*\{[^}]*\}/g)||[];
          console.log('AWAY_RULES='+JSON.stringify(m));
          console.log('HAS_8A6A00='+css.includes('--b46-away:#8a6a00'));
          NODE
