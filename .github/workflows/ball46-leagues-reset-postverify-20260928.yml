# trigger post-propagation verification
name: READ ONLY - Ball46 Leagues Reset Postverify 20260928

on:
  push:
    branches:
      - ops/ball46-leagues-reset-20260928-use
    paths:
      - '.github/workflows/ball46-leagues-reset-postverify-20260928.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify current Production dashboard after propagation
        shell: bash
        run: |
          set -euo pipefail
          DIRECT='https://ball46-production.mccarey-supon.workers.dev'
          WWW='https://www.ball46.com'
          nonce="${GITHUB_RUN_ID}-$(date +%s%N)"
          for base in "$DIRECT" "$WWW"; do
            f="/tmp/$(echo "$base" | tr -cd 'a-zA-Z0-9').js"
            code=$(curl -sS -L --retry 5 --retry-all-errors --max-time 30 -H 'Cache-Control: no-cache' -o "$f" -w '%{http_code}' "$base/dashboard-v2-stage3.js?leaguepost=$nonce-${RANDOM}") || true
            echo "FETCH $base HTTP=$code SIZE=$(wc -c < "$f" 2>/dev/null || echo 0)"
            [ "$code" = 200 ] || exit 1
            if grep -Fq "function resetLeagueOnWorkspaceView(){leagueFilter='all';rerenderWorkspaceMode()}" "$f" && grep -Fq "leagueFilter='all';statusFilter=btn.dataset.statusFilter" "$f"; then
              echo "LEAGUE_RESET_PRESENT $base"
            else
              echo "LEAGUE_RESET_MISSING $base"
              grep -n "function initControls\|ball46:workspace-view" "$f" | tail -6 || true
              exit 2
            fi
          done
          curl -fsS -L --retry 3 --max-time 30 "$WWW/api/engine/board?leaguepost=$nonce" -o /tmp/board.json
          curl -fsS -L --retry 3 --max-time 30 "$WWW/api/engine/signals?leaguepost=$nonce" -o /tmp/signals.json
          curl -fsS -L --retry 3 --max-time 30 "$WWW/api/engine/statistics?leaguepost=$nonce" -o /tmp/stats.json
          node - <<'NODE'
          const fs=require('fs');const b=JSON.parse(fs.readFileSync('/tmp/board.json')),s=JSON.parse(fs.readFileSync('/tmp/signals.json')),t=JSON.parse(fs.readFileSync('/tmp/stats.json'));if(b?.ok!==true||!Array.isArray(b.fixtures)||!Array.isArray(s.signals)||t?.ok!==true||!Array.isArray(t.rows))throw Error('FLOW_BAD');console.log('POSTVERIFY_FLOW_OK',{fixtures:b.fixtures.length,signals:s.signals.length,stats:t.rows.length});
          NODE
