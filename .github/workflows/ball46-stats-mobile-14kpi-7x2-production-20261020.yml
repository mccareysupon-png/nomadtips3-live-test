name: BALL46 Statistics Mobile 14 KPIs 7x2 — Guarded Production
on:
  push:
    branches: [codex/ball46-stats-mobile-14-kpi-7x2-prod-20261020]
    paths:
      - '.github/workflows/ball46-stats-mobile-14kpi-7x2-production-20261020.yml'
      - 'deploy-assets/stats-mobile-v1-preview-20261020/deploy-mobile14.mjs'
      - 'deploy-assets/stats-mobile-v1-preview-20261020/mobile-kpi14.mjs'
      - 'deploy-assets/stats-mobile-v1-preview-20261020/mobile-kpi14.css'
      - 'deploy-assets/stats-mobile-v1-preview-20261020/mobile-clean.mjs'
      - 'deploy-assets/stats-mobile-v1-preview-20261020/mobile-clean.css'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  guarded-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scripts and install browser
        working-directory: deploy-assets/stats-mobile-v1-preview-20261020
        run: |
          set -euo pipefail
          node --check deploy-mobile14.mjs
          node --check mobile-kpi14.mjs
          node --check mobile-clean.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
      - name: Test candidate, guarded Production deploy, verify real browsers and rollback on failure
        working-directory: deploy-assets/stats-mobile-v1-preview-20261020
        run: node deploy-mobile14.mjs
      - name: Archive PC/mobile screenshots and deployment proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-stats-mobile-14-kpi-7x2-production-evidence
          path: deploy-assets/stats-mobile-v1-preview-20261020/audit/
          retention-days: 30
          if-no-files-found: warn
