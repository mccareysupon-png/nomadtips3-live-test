name: Inspect Ball46 Full Live Chain 20260921
on:
  push:
    paths:
      - '.github/workflows/inspect-ball46-worker-history-20260920.yml'
jobs:
  inspect-only:
    runs-on: ubuntu-latest
    env:
      CONFIG_REF: af999592ea6e84fe72cb984670723d52673a5b5e
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout known-good configs only
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONFIG_REF }}
          fetch-depth: 1
      - name: Inspect Worker deployment and version histories
        shell: bash
        run: |
          set -euo pipefail
          for item in 'WRAPPER|workers/nomadtips3-343-preview/wrangler.ball46.jsonc' 'ENGINE|workers/nomadtips3-engine-343/wrangler.toml' 'HUB|workers/nomadtips3-5usd-hub-343/wrangler.toml' 'FULL_MARKET|workers/nomadtips3-full-market-343-ball46/wrangler.toml'; do
            IFS='|' read -r label cfg <<< "$item"
            echo "===== $label DEPLOYMENTS ====="
            npx --yes wrangler@4.92.0 deployments list --config "$cfg" --json || true
            echo "===== $label VERSIONS ====="
            npx --yes wrangler@4.92.0 versions list --config "$cfg" --json || true
          done
      - name: Inspect Ball46 live endpoints twice
        shell: bash
        run: |
          set -euo pipefail
          for round in 1 2; do
            echo "######## ROUND $round $(date -u +%FT%TZ) ########"
            for url in 'https://ball46.com/api/hub/snapshot' 'https://ball46.com/api/engine/board' 'https://ball46.com/api/engine/signals'; do
              echo "===== $url ====="
              curl -sS --connect-timeout 10 --max-time 30 -D /tmp/headers "$url" -o /tmp/body || true
              sed -n '1,40p' /tmp/headers || true
              echo "bytes=$(wc -c </tmp/body 2>/dev/null || echo 0)"
              jq -c '{ok,version,fetchedAt,hubFetchedAt,ageMs,hubAgeMs,stale,fixtureCount:((.fixtures//[])|length),signalCount:((.signals//[])|length)}' /tmp/body 2>/dev/null || head -c 1200 /tmp/body || true
              jq -c '(.fixtures//[])[:40][] | {fixtureId,homeName,awayName,status,statusCode,boardState,minute,goals}' /tmp/body 2>/dev/null || true
            done
            if [ "$round" = 1 ]; then sleep 12; fi
          done
