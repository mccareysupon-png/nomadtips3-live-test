name: Ball46 MATCH STATUS SVG Current Production

on:
  push:
    branches: [work/ball46-match-status-svg-currentprod-20261003]
    paths:
      - '.github/workflows/ball46-match-status-svg-20261003.yml'
      - 'deploy-assets/match-status-svg-20261003/**'

permissions:
  contents: read

concurrency:
  group: ball46-production-match-status-svg
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  status-icons:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        working-directory: deploy-assets/match-status-svg-20261003
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Confirm Exact Active Production and restore point (read only)
        working-directory: deploy-assets/match-status-svg-20261003
        run: node scout.mjs
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-match-status-svg-${{ github.run_id }}
          path: deploy-assets/match-status-svg-20261003/audit/
          if-no-files-found: error
          retention-days: 14
