name: B46 remove obsolete statistics UI source gates READ ONLY
on:
  push:
    branches: [chatgpt/ball46-statistics-ui-v1]
    paths: ['.github/workflows/b46-remove-obsolete-ui-source-gate-20261116.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Validate exact current source, no writes
        run: node deploy-assets/ball46-statistics-fast-v1-20261116/test-remove-obsolete-stats-ui.mjs
