name: KING V2 — Unlock Daily Pick Cap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/king-v10-unlimited-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Unlock KING V2 daily pick cap only
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/scripts/the_king_engine_v10.py')
          s=p.read_text(encoding='utf-8')
          old=s
          s=s.replace('MAX_PICKS = 2\n', 'MAX_PICKS = None\n', 1)
          s=s.replace('    qualified = qualified[:MAX_PICKS]\n', '    # Publish every candidate that passes all KING V2 gates; no daily count cap.\n', 1)
          s=s.replace('    assert MAX_PICKS == 2 and MIN_MARKET_EDGE == 0.05 and MIN_EV == 0.05 and MAX_ODDS == 3.0\n', '    assert MAX_PICKS is None and MIN_MARKET_EDGE == 0.05 and MIN_EV == 0.05 and MAX_ODDS == 3.0\n', 1)
          note='            "No daily pick-count cap: every candidate passing all KING V2 gates is published.",\n'
          anchor='        "transition_notes": [\n'
          if note not in s:
              s=s.replace(anchor, anchor+note, 1)
          if s == old:
              print('KING V2 daily cap already unlimited.')
          else:
              p.write_text(s, encoding='utf-8')
              print('KING V2 daily cap unlocked; all other gates preserved.')
      - name: Verify KING V2 self-test
        run: python3 .github/scripts/the_king_engine_v10.py self-test
      - name: Commit unlocked KING V2 default
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/the_king_engine_v10.py
          if git diff --cached --quiet; then
            echo 'No KING V2 cap change.'
            exit 0
          fi
          git commit -m 'Unlock KING V2 daily qualified pick cap'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
