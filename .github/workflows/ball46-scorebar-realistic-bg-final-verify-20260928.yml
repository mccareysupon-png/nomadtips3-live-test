name: READ ONLY - Ball46 Scorebar Realistic BG Final Verify 20260928
on:
  push:
    branches:
      - work/ball46-scorebar-realistic-bg-20260928
    paths:
      - '.github/workflows/ball46-scorebar-realistic-bg-final-verify-20260928.yml'
      - '.github/scripts/ball46_scorebar_realistic_bg_final_verify_20260928.sh'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify live Production in browser, no deploy
        run: bash .github/scripts/ball46_scorebar_realistic_bg_final_verify_20260928.sh
      - name: Upload final verification proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-realistic-scorebar-bg-final-verify-${{ github.run_id }}
          path: /tmp/b46-realistic-bg-final-verify
          if-no-files-found: ignore
          retention-days: 30
