name: BALL46 Corner Entry — READ ONLY
on:
  push:
    branches: [audit/ball46-corner-entry-20261024]
    paths:
      - .github/workflows/ball46-corner-entry-audit-20261024.yml
      - deploy-assets/corner-entry-20261024/**
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check deploy-assets/corner-entry-20261024/inspect.mjs
          node deploy-assets/corner-entry-20261024/inspect.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-corner-entry-audit-${{ github.run_id }}
          path: audit/production-corner-entry.json
          retention-days: 10
