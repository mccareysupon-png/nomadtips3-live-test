name: ONE SHOT - Ball46 Card Step5 Approved Deploy 20260928

on:
  push:
    branches:
      - work/ball46-card-rebuild-step5-20260928
    paths:
      - '.github/workflows/ball46-card-step5-deploy-approved-20260928.yml'
      - '.github/scripts/ball46_card_step5_deploy_approved_20260928.sh'

permissions:
  contents: read
  actions: read

jobs:
  deploy-approved-step5:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download exact user-approved Step5 predeploy package
        uses: actions/download-artifact@v4
        with:
          name: ball46-card-step5-predeploy-36366786529
          path: /tmp/b46-step5-approved
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36366786529
      - name: Re-lock Production, deploy one CSS asset, and verify
        shell: bash
        run: bash .github/scripts/ball46_card_step5_deploy_approved_20260928.sh
      - name: Upload deployment verification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-card-step5-deploy-${{ github.run_id }}
          path: /tmp/b46-step5-deploy
          if-no-files-found: warn
          retention-days: 30
