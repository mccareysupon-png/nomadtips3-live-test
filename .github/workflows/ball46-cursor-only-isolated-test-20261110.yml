name: BALL46 cursor-only remaining tests ISOLATED
on:
  push:
    branches: [codex/ball46-favorites-test-20261110]
    paths: ['work/statistics-cursor-only-test-20261110/request.json']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser tools
        run: |
          npm install --no-save --package-lock=false --prefix work/statistics-cursor-only-test-20261110 playwright@1.56.1
          cd work/statistics-cursor-only-test-20261110 && npx playwright install --with-deps chromium
      - name: Cursor completeness fault cache and coalescing tests
        run: node work/statistics-cursor-only-test-20261110/core-test.mjs
      - name: Recorded score and synthetic ledger UI PC mobile dark light
        run: node work/statistics-cursor-only-test-20261110/browser-test.mjs
      - name: Save isolated test reports only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/statistics-cursor-only-test-20261110/qa/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record isolated cursor-only validation without Production calls [skip ci]"
          git push origin HEAD:codex/ball46-favorites-test-20261110
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-cursor-only-isolated-proof
          path: work/statistics-cursor-only-test-20261110/qa
