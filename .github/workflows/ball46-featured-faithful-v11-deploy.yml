name: BALL46 Featured V11 Faithful Approved Design - Safe Deploy
on:
  push:
    branches: [fix/ball46-featured-match-faithful-v11-20261021]
    paths:
      - '.github/workflows/ball46-featured-faithful-v11-deploy.yml'
      - 'deploy-assets/featured-faithful-v11/faithful-v11.css'
      - 'deploy-assets/featured-faithful-v11/faithful-v11.js'
      - 'deploy-assets/featured-faithful-v11/deploy-faithful-v11.mjs'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks and Browser QA dependencies
        working-directory: deploy-assets/featured-faithful-v11
        run: |
          set -euo pipefail
          node --check faithful-v11.js
          node --check deploy-faithful-v11.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Guard SEO-current Production, test real match and synthetic 2-signal QA, safe promotion and rollback
        working-directory: deploy-assets/featured-faithful-v11
        run: node deploy-faithful-v11.mjs
      - name: Preserve PC/mobile original-match screenshots, dark/light, sample signal cards and deployment proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-v11-faithful-featured-comparison-production
          path: deploy-assets/featured-faithful-v11/proof/
          retention-days: 30
          if-no-files-found: warn