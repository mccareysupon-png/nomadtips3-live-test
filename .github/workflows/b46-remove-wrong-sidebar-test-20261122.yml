name: BALL46 remove mistakenly created Sidebar firstpaint TEST Worker
on:
  push:
    branches: [ops/ball46-sidebar-firstpaint-rollback-20261122]
    paths:
      - '.github/workflows/b46-remove-wrong-sidebar-test-20261122.yml'
      - 'qa/sidebar-firstpaint-rollback-20261122/remove-test.mjs'
permissions: {contents: read}
jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node qa/sidebar-firstpaint-rollback-20261122/remove-test.mjs
