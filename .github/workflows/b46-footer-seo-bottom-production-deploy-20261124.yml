name: BALL46 guarded production SEO guide footer-bottom deploy 20261124
on:
  push:
    branches: [test/ball46-footer-seo-bottom-20261124]
    paths: ['.github/workflows/b46-footer-seo-bottom-production-deploy-20261124.yml']
permissions: {contents: read}
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  guarded-production-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: qa/footer-seo-bottom-20261124
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate footer-only code and install browser QA tools
        run: |
          node --check production-deploy.mjs
          node --check footer-module.mjs
          node --check footer-style.mjs
          cd ../..
          npm install --no-save --no-audit --no-fund acorn@8 playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Deploy exact current production worker and existing assets with footer-only HTML injection
        run: node production-deploy.mjs
      - name: Upload release proof, rollback point and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-footer-seo-bottom-production-${{ github.run_id }}
          path: qa/footer-seo-bottom-20261124/audit
          if-no-files-found: warn
          retention-days: 30

# rerun source drift diagnosis before touching production
