name: Deploy ADD K AH Detector

on:
  push:
    branches: [main]
    paths:
      - "workers/add-k-ah-detector/**"
      - ".github/workflows/add-k-ah-detector-deploy.yml"
  workflow_dispatch:

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY || secrets.APISPORTS_KEY || secrets.API_SPORTS_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: โหลดตัวตรวจสอบ Owner key เดิมของ NOMAD
        shell: bash
        run: |
          OWNER_ADMIN_TOKEN=$(node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('car3-1-hybrid-live-engine/worker/src/main-v3.js','utf8');
          const m=s.match(/OWNER_KEY_SHA256='([0-9a-f]{64})'/);
          if(!m)process.exit(2);
          process.stdout.write(m[1]);
          NODE
          )
          echo "::add-mask::$OWNER_ADMIN_TOKEN"
          echo "OWNER_ADMIN_TOKEN=$OWNER_ADMIN_TOKEN" >> "$GITHUB_ENV"

      - name: ตรวจสอบกฎ โค้ด และเส้นทาง Cron
        working-directory: workers/add-k-ah-detector
        run: npm test && node --check src/index.js && node --check src/rules.js

      - name: ตรวจสอบ credential ที่จำเป็น
        shell: bash
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$API_FOOTBALL_KEY" || { echo "::error::Missing API_FOOTBALL_KEY/APISPORTS_KEY/API_SPORTS_KEY"; exit 1; }
          test -n "$OWNER_ADMIN_TOKEN" || { echo "::error::Missing OWNER_ADMIN_TOKEN verifier"; exit 1; }

      - name: Deploy รอบแรกโดยปิดระบบ
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: workers/add-k-ah-detector
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc
          secrets: |
            API_FOOTBALL_KEY
            OWNER_ADMIN_TOKEN
        env:
          API_FOOTBALL_KEY: ${{ env.API_FOOTBALL_KEY }}
          OWNER_ADMIN_TOKEN: ${{ env.OWNER_ADMIN_TOKEN }}

      - name: รอ Worker พร้อมและยืนยันว่ารอบแรกปิดอยู่
        shell: bash
        run: |
          BASE="https://add-k-ah-detector.mccarey-supon.workers.dev"
          : > /tmp/add-k-disabled.json
          READY=0
          for i in $(seq 1 18); do
            BODY=$(curl -sS --max-time 12 "$BASE/config" || true)
            printf '%s' "$BODY" > /tmp/add-k-disabled.json
            if printf '%s' "$BODY" | grep -q '"config"' && printf '%s' "$BODY" | grep -q '"enabled":false'; then
              READY=1
              printf '%s\n' "$BODY"
              break
            fi
            echo "รอ Worker propagation รอบ $i/18"
            sleep 5
          done
          test "$READY" = "1" || { echo "::error::Worker /config ยังไม่พร้อมหรือไม่ได้ปิด"; cat /tmp/add-k-disabled.json; exit 1; }

      - name: Production smoke API-Football, TotalCorner และ NowGoal AH จริง
        shell: bash
        env:
          NOMAD_FEED_URL: https://www.nomadtips3.com/nomad-live-342/feed?force=1
        run: |
          node --input-type=module <<'NODE'
          import {fetchNowgoal1xBetMarkets} from './nomad-live-engine/src/nowgoal.js';

          const apiResponse=await fetch('https://v3.football.api-sports.io/fixtures?live=all',{
            headers:{'x-apisports-key':process.env.API_FOOTBALL_KEY},cache:'no-store'
          });
          const apiBody=await apiResponse.json();
          if(!apiResponse.ok||(apiBody.errors&&Object.keys(apiBody.errors).length))throw new Error('API-Football smoke failed: '+JSON.stringify(apiBody.errors||apiResponse.status));

          const feedResponse=await fetch(process.env.NOMAD_FEED_URL,{cache:'no-store'});
          const feed=await feedResponse.json();
          if(!feedResponse.ok||feed?.ok===false||!Array.isArray(feed?.matches))throw new Error('TotalCorner smoke failed');
          const targets=feed.matches.filter(m=>m?.id&&m?.home&&m?.away&&!m?.freshness?.stale).slice(0,12).map(m=>({
            id:String(m.id),home:String(m.home),away:String(m.away),
            score:Array.isArray(m.score)?{home:Number(m.score[0]),away:Number(m.score[1])}:m.score
          }));
          if(!targets.length)throw new Error('ไม่มีคู่ TotalCorner สดสำหรับตรวจ NowGoal AH จริง');

          const nowgoal=await fetchNowgoal1xBetMarkets(targets,{requestTimeoutMs:9000,maximumPriceAgeSeconds:90},Date.now(),{});
          const summary={
            apiFootball:{ok:true,live:Array.isArray(apiBody.response)?apiBody.response.length:0},
            totalCorner:{ok:true,matches:feed.matches.length,targets:targets.length},
            nowgoal:{status:nowgoal.status,checked:nowgoal.checked||0,mapped:nowgoal.mapped||0,ready:nowgoal.ready||0,events:nowgoal.events||0}
          };
          console.log(JSON.stringify(summary));
          if(nowgoal.status!=='READY'||Number(nowgoal.ready||0)<1)throw new Error('NowGoal AH smoke failed: '+JSON.stringify(summary.nowgoal));
          NODE

      - name: เตรียมเปิด production หลัง smoke ผ่าน
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='workers/add-k-ah-detector/wrangler.jsonc';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          j.vars.PRODUCTION_ENABLED='true';
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE

      - name: Deploy รอบสองและเปิดระบบ
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: workers/add-k-ah-detector
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc
          secrets: |
            API_FOOTBALL_KEY
            OWNER_ADMIN_TOKEN
        env:
          API_FOOTBALL_KEY: ${{ env.API_FOOTBALL_KEY }}
          OWNER_ADMIN_TOKEN: ${{ env.OWNER_ADMIN_TOKEN }}

      - name: ยืนยัน production config, signals และ status endpoint
        shell: bash
        run: |
          BASE="https://add-k-ah-detector.mccarey-supon.workers.dev"
          READY=0
          for i in $(seq 1 18); do
            BODY=$(curl -sS --max-time 12 "$BASE/config" || true)
            printf '%s' "$BODY" > /tmp/add-k-final-config.json
            if printf '%s' "$BODY" | grep -q '"enabled":true' && printf '%s' "$BODY" | grep -q '"schedule":\[70,74,78,82\]'; then
              READY=1
              printf '%s\n' "$BODY"
              break
            fi
            echo "รอ production propagation รอบ $i/18"
            sleep 5
          done
          test "$READY" = "1" || { echo "::error::Production config ยังไม่พร้อม"; cat /tmp/add-k-final-config.json; exit 1; }
          curl --fail -sS "$BASE/signals"
          curl --fail -sS "$BASE/status"

      - name: ตรวจหน้า ADD K จริงทั้งโครง PC และ mobile
        shell: bash
        run: |
          PAGE=$(curl --fail --retry 8 --retry-all-errors --retry-delay 5 -sS https://www.nomadtips3.com/add-k-ah/)
          printf '%s' "$PAGE" | grep -q 'lang="th"'
          printf '%s' "$PAGE" | grep -q 'ผลตรวจจับ'
          printf '%s' "$PAGE" | grep -q 'ตั้งค่า'
          printf '%s' "$PAGE" | grep -q 'viewport-fit=cover'
          printf '%s' "$PAGE" | grep -q '@media(max-width:700px)'
          printf '%s' "$PAGE" | grep -q '@media(max-width:430px)'
          printf '%s' "$PAGE" | grep -q 'ราคาเอเชียนแฮนดิแคปจาก NowGoal เท่านั้น'
