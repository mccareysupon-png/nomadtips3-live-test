name: Deploy ADD K AH Detector

on:
  push:
    branches: [main]
    paths:
      - "workers/add-k-ah-detector/**"
      - ".github/workflows/add-k-ah-detector-deploy.yml"
  workflow_dispatch:

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY || secrets.APISPORTS_KEY || secrets.API_SPORTS_KEY }}
  OWNER_ADMIN_TOKEN: ${{ secrets.OWNER_ADMIN_TOKEN || secrets.OWNER_PAIR_SECRET }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: ตรวจสอบระบบ
        working-directory: workers/add-k-ah-detector
        run: npm test && node --check src/index.js && node --check src/rules.js

      - name: ตรวจสอบ secret ที่จำเป็น
        shell: bash
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$API_FOOTBALL_KEY" || { echo "::error::Missing API_FOOTBALL_KEY/APISPORTS_KEY/API_SPORTS_KEY"; exit 1; }
          test -n "$OWNER_ADMIN_TOKEN" || { echo "::error::Missing OWNER_ADMIN_TOKEN or OWNER_PAIR_SECRET"; exit 1; }

      - name: Deploy Worker พร้อม Cron, Durable Object และ secret
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: workers/add-k-ah-detector
          wranglerVersion: "4"
          command: deploy --config wrangler.jsonc
          secrets: |
            API_FOOTBALL_KEY
            OWNER_ADMIN_TOKEN
        env:
          API_FOOTBALL_KEY: ${{ env.API_FOOTBALL_KEY }}
          OWNER_ADMIN_TOKEN: ${{ env.OWNER_ADMIN_TOKEN }}

      - name: บังคับปิดระบบก่อน Production smoke
        shell: bash
        run: |
          BASE="https://add-k-ah-detector.mccarey-supon.workers.dev"
          curl --fail --retry 8 --retry-delay 5 -sS "$BASE/"
          CURRENT=$(curl --fail --retry 8 --retry-delay 5 -sS "$BASE/config")
          DISABLED=$(printf '%s' "$CURRENT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);j.config.enabled=false;process.stdout.write(JSON.stringify(j.config))})")
          SAVED=$(curl --fail -sS -X POST "$BASE/config" -H 'content-type: application/json' -H "x-owner-key: $OWNER_ADMIN_TOKEN" --data "$DISABLED")
          printf '%s\n' "$SAVED" | tee /tmp/add-k-disabled.json
          printf '%s' "$SAVED" | grep -q '"enabled":false'

      - name: Production smoke ตรวจ API-Football, TotalCorner และ NowGoal AH จริง
        shell: bash
        run: |
          BASE="https://add-k-ah-detector.mccarey-supon.workers.dev"
          BODY=$(curl --fail --retry 3 --retry-delay 3 -sS -X POST "$BASE/smoke" -H "x-owner-key: $OWNER_ADMIN_TOKEN")
          printf '%s\n' "$BODY" | tee /tmp/add-k-smoke.json
          printf '%s' "$BODY" | grep -q '"ok":true'
          printf '%s' "$BODY" | grep -q '"apiFootball":{"ok":true'
          printf '%s' "$BODY" | grep -q '"totalCorner":{"ok":true'
          printf '%s' "$BODY" | grep -q '"nowgoal":{"ok":true'

      - name: เปิดระบบเมื่อ Production smoke ผ่านเท่านั้น
        shell: bash
        run: |
          BASE="https://add-k-ah-detector.mccarey-supon.workers.dev"
          CURRENT=$(curl --fail -sS "$BASE/config")
          ENABLED=$(printf '%s' "$CURRENT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);j.config.enabled=true;process.stdout.write(JSON.stringify(j.config))})")
          SAVED=$(curl --fail -sS -X POST "$BASE/config" -H 'content-type: application/json' -H "x-owner-key: $OWNER_ADMIN_TOKEN" --data "$ENABLED")
          printf '%s\n' "$SAVED"
          printf '%s' "$SAVED" | grep -q '"enabled":true'

      - name: ยืนยัน config, cycle, signals, cron state และ status
        shell: bash
        run: |
          BASE="https://add-k-ah-detector.mccarey-supon.workers.dev"
          curl --fail -sS "$BASE/config" | tee /tmp/add-k-final-config.json
          grep -q '"enabled":true' /tmp/add-k-final-config.json
          CYCLE=$(curl --fail -sS -X POST "$BASE/cycle" -H "x-owner-key: $OWNER_ADMIN_TOKEN")
          printf '%s\n' "$CYCLE"
          printf '%s' "$CYCLE" | grep -q '"ok":true'
          curl --fail -sS "$BASE/signals"
          curl --fail -sS "$BASE/status"
