name: BALL46 approved mobile Event Flow bars release
on:
  push:
    branches: [codex/ball46-mobile-event-flow-bars-20261102]
    paths: ['work/ball46-mobile-event-flow-bars-20261102/release-request.json']
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: work/ball46-mobile-event-flow-bars-20261102
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture exact current Production, assets and rollback version
        run: |
          node preflight-release.mjs
          node build-component.mjs
          node unit.mjs
          node --check stage/b46-mobile-event-flow-bars-20261102.js
          node --check stage/expanded-match-343.js
      - name: Install verification tooling
        run: |
          npm install --no-save --package-lock=false acorn@8.15.0 playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify 42 component cases, legacy cloning and real signal schema
        run: node component-check.mjs
      - name: Stage narrow mobile hook over exact latest runtime without traffic change
        run: node release.mjs
      - name: Compare real cached source data, PC graph and request counts
        run: node release-browser.mjs
      - name: Activate only verified candidate and verify live PC/mobile
        run: |
          cp browser-proof.json release-audit/candidate-browser-proof.json
          node -e "const fs=require('fs'),c=JSON.parse(fs.readFileSync('release-audit/candidate.json'));fs.writeFileSync('request.json',JSON.stringify({phase:'activate',base:c.base,candidate:c.candidate}))"
          node release.mjs
          cp release-audit/result.json release-audit/activation-result.json
          node release-browser.mjs https://ball46.com
      - name: Restore immediate baseline if live browser verification fails
        if: failure()
        run: |
          node -e "const fs=require('fs');if(fs.existsSync('release-audit/result.json')){const r=JSON.parse(fs.readFileSync('release-audit/result.json'));if(r.activated){fs.writeFileSync('request.json',JSON.stringify({phase:'restore',base:r.base,candidate:r.candidate}));fs.writeFileSync('restore-needed','yes')}}"
          if [ -f restore-needed ]; then node release.mjs; fi
      - name: Preserve sanitized release proof
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ls release-audit/*.json >/dev/null 2>&1; then git add release-audit/*.json; fi
          if ls release-audit/*.png >/dev/null 2>&1; then git add release-audit/*.png; fi
          if ls qa/*.json >/dev/null 2>&1; then git add qa/*.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record guarded mobile Event Flow verification and rollback evidence [skip ci]"
          git push origin HEAD:codex/ball46-mobile-event-flow-bars-20261102
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-flow-release-${{ github.run_id }}
          path: |
            work/ball46-mobile-event-flow-bars-20261102/release-audit/*.json
            work/ball46-mobile-event-flow-bars-20261102/release-audit/*.png
            work/ball46-mobile-event-flow-bars-20261102/qa/*.json
