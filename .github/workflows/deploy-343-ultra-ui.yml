name: Deploy NOMAD 3.43 Ultra Preview UI

on:
  push:
    branches: [work/ball46-mobile-match-focus-20260918]
    paths:
      - 'nomad-live-343/**'
      - 'workers/nomadtips3-343-preview/**'
      - '.github/workflows/deploy-343-ultra-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  ULTRA_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev

jobs:
  deploy-ultra-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate isolated Ultra UI scope
        run: |
          set -euo pipefail
          test -s nomad-live-343/api-monitor.html
          grep -Fq '5DollarFootballAPI Monitor' nomad-live-343/api-monitor.html
          grep -Fq '/api/hub/health' nomad-live-343/api-monitor.html
          grep -Fq '/api/hub/control' nomad-live-343/api-monitor.html
          grep -Fq 'APPLY TO 5USD HUB' nomad-live-343/api-monitor.html
          node --check workers/nomadtips3-343-preview/src/index.js
          grep -Fq 'nomadtips3-343-ultra-preview' workers/nomadtips3-343-preview/wrangler.jsonc
          grep -Fq '"HUB", "service": "nomadtips3-5usd-hub-343"' workers/nomadtips3-343-preview/wrangler.jsonc

      - name: Validate Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Dry-run Ultra Preview UI
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc

      - name: Deploy Ultra Preview UI only
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Smoke API monitor and existing HUB binding
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$ULTRA_URL/api-monitor.html?verify=$RANDOM" -o /tmp/api-monitor.html
          grep -Fq '5DollarFootballAPI Monitor' /tmp/api-monitor.html
          grep -Fq 'APPLY TO 5USD HUB' /tmp/api-monitor.html
          curl -fsS --max-time 30 "$ULTRA_URL/api/hub/health?verify=$RANDOM" -o /tmp/hub-health.json
          node -e 'const j=require("/tmp/hub-health.json");if(j.component!=="5USD_HUB")throw Error("HUB binding mismatch");if(!j.control||!Number(j.control.liveRefreshSeconds))throw Error("HUB control missing");console.log("HUB",j.ok,"cycle",j.control.liveRefreshSeconds,"rpm",j.estimatedBulkRequestsPerMinute,"limit",j.accountLimitPerMinute)'
          curl -fsS --max-time 30 "$ULTRA_URL/api/hub/control?verify=$RANDOM" -o /tmp/hub-control.json
          node -e 'const j=require("/tmp/hub-control.json");if(j.ok!==true||!Array.isArray(j.presets)||!j.presets.includes(120)||!j.presets.includes(2))throw Error("HUB control API mismatch");console.log("CONTROL presets",j.presets.join(","))'
          echo "Ultra API monitor PASS: $ULTRA_URL/api-monitor.html"
