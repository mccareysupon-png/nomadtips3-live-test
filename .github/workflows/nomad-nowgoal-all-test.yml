name: NOMAD 3.41 Nowgoal All Bookmakers Test

on:
  push:
    branches: [nowgoal-all-bookmakers-341-20260823]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run complete NOMAD 3.41 regression suite
        working-directory: nomad-live-engine
        run: node --test
      - name: Syntax-check production engine modules
        working-directory: nomad-live-engine
        run: |
          node --check src/index.js
          node --check src/nowgoal.js
          node --check src/price-sources.js
          node --check src/detector.js
          node --check src/settlement.js
          node --check src/real-market.js
          node --check src/the-odds-api.js
          node --check src/api-football.js
          node --check src/oddspedia.js
      - name: Publish test-only commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE=failure
          DESCRIPTION="NOMAD 3.41 Nowgoal all-bookmaker tests failed"
          if [ "$JOB_STATUS" = "success" ]; then
            STATE=success
            DESCRIPTION="NOMAD 3.41 Nowgoal all-bookmaker tests passed"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            STATE=error
            DESCRIPTION="NOMAD 3.41 Nowgoal all-bookmaker tests cancelled"
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"nomad-341-nowgoal-all/test\",\"description\":\"${DESCRIPTION}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions\"}"
