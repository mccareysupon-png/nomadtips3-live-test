name: DIAG Ball46 Active Workflow Owner 20261011
# trigger-2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-ball46-active-workflow-owner-20261011.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts acorn@8
      - name: Print active Ball46 Production version and asset hash
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {activeVersion,publicFile,directOrigin,sha} from './deploy-assets/daily-performance-20261005/production.mjs';
          const v=await activeVersion();
          const pub=await publicFile('/singlepage-workspace-343.js');
          const direct=await publicFile('/singlepage-workspace-343.js',undefined,directOrigin);
          console.log('ACTIVE_VERSION',v);
          console.log('PUBLIC_SHA',sha(pub));
          console.log('DIRECT_SHA',sha(direct));
          NODE
