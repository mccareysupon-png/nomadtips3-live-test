name: Diagnose Member Snapshot KV
on:
  push:
    branches: [member/snapshot-readonly-20261011]
    paths: ['.github/workflows/diagnose-member-snapshot-kv.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Probe KV, scheduled worker and source HTTP without mutations
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base?per_page=100" > /tmp/namespaces.json
          id="$(jq -r '.result[] | select(.title=="BALL46_MEMBER_DAILY_SNAPSHOT_STAGING") | .id' /tmp/namespaces.json | head -n1)"
          test -n "$id"
          echo "KV_PRESENT=YES"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/$id/keys?prefix=member%3Adaily%3Av1%3A" >/tmp/keys.json
          echo "KV_KEY_COUNT=$(jq '.result|length' /tmp/keys.json)"
          jq -r '.result[]?.name' /tmp/keys.json | head -n 10 | sed 's/^/KV_KEY=/'
          curl -sS -o /tmp/health -w 'STAGE_HEALTH_HTTP=%{http_code}\n' "https://ball46-member-snapshot-staging.mccarey-supon.workers.dev/api/health"
          for path in '/api/engine/statistics?paged=1' '/api/engine/board'; do
            code="$(curl -sS --max-time 20 -o /tmp/upstream -w '%{http_code}' "https://www.ball46.com$path" || true)"
            echo "UPSTREAM $path HTTP=$code"
            head -c 180 /tmp/upstream | tr '\n' ' '
            echo
          done
          python3 - <<'PY'
import requests
base='https://www.ball46.com/api/engine/statistics'
cursor=None
for page in range(1,33):
    params={'paged':'1'}
    if cursor: params['cursor']=cursor
    try:
        r=requests.get(base,params=params,timeout=15)
        j=r.json()
    except Exception as e:
        print('PAGINATION_ERROR',page,str(e)[:120]);break
    rows=j.get('rows',[])
    print('PAGE',page,'http',r.status_code,'rows',len(rows),'hasMore',j.get('hasMore'),'nextCursor',bool(j.get('nextCursor')),'error',j.get('error'))
    if r.status_code!=200 or not j.get('hasMore') or not j.get('nextCursor'):break
    cursor=j['nextCursor']
PY
