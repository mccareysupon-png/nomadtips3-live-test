name: BALL46 Signal long-open league header ghost DOM READ ONLY audit
on:
  push:
    branches: [test/ball46-premium-match-colors-20261120]
    paths: ['.github/workflows/ball46-signal-header-aging-diagnostic-20261121.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install test browser
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Inspect real production and Test Signal headers over native refreshes and safe local redraw
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const b=await chromium.launch();const domains=[
            ['production','https://ball46.com/?view=signal'],['test','https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev/?view=signal']
          ];
          const snapshots=[];
          for(const [name,url] of domains){
            const p=await b.newPage({viewport:{width:1440,height:950},serviceWorkers:'block'});
            await p.addInitScript(()=>{try{localStorage.setItem('nomad343_dashboard_theme_v1','dark')}catch{}});
            await p.goto(url,{waitUntil:'domcontentloaded',timeout:70000});
            await p.waitForFunction(()=>window.__b46SignalStableStatus?.seenSource===true,null,{timeout:55000});
            await p.waitForTimeout(450);
            const scan=()=>p.evaluate(()=>{
              const stat=document.querySelector('.status-section[data-status-section="live"]');
              const info=window.__b46SignalStableQA?.state?.();
              if(!stat)return {missing:true,info};
              const box=e=>{const r=e.getBoundingClientRect();return {x:Math.round(r.x),y:Math.round(r.y),right:Math.round(r.right),bottom:Math.round(r.bottom),w:Math.round(r.width),h:Math.round(r.height)}};
              const heads=[...stat.querySelectorAll('.league-block > .b46-signal-native-head')];
              const rows=[...stat.querySelectorAll('.league-block > .match-row[data-match-id]')];
              const native=[...stat.querySelectorAll('.league-block > .league-head:not(.b46-signal-native-head)')];
              const issues=[];
              const samples=rows.map(row=>{
                const block=row.closest('.league-block'),matched=heads.filter(h=>h.dataset.b46SignalNativeFor===row.dataset.matchId),prev=row.previousElementSibling;
                const header=matched[0],rt=box(row),bt=header?box(header):null;
                const label=header?.querySelector('.league-label')||header?.querySelector('strong');
                const labelBox=label?box(label):null;
                const flag=header?.querySelector('.league-flag');
                const visible=bt?.h>5;
                if(matched.length!==1||prev!==header)issues.push({id:row.dataset.matchId,clones:matched.length,prev:prev?.className||null});
                if(visible&&bt.bottom>rt.y+1)issues.push({id:row.dataset.matchId,collision:Math.round(bt.bottom-rt.y)});
                if(visible&&labelBox&&(labelBox.y<bt.y-2||labelBox.bottom>bt.bottom+2))issues.push({id:row.dataset.matchId,labelEscapesHeader:{header:bt,label:labelBox}});
                return {id:row.dataset.matchId,nativeName:block.querySelector(':scope > .league-head:not(.b46-signal-native-head) .league-label')?.textContent,headName:label?.textContent,hidden:!visible,box:bt,row:rt,labelBox,flagLoaded:!!flag?.complete&&flag?.naturalWidth>0,order:row.style.order,skip:header?.dataset.b46Skip,clones:matched.length};
              }).sort((a,b)=>a.row.y-b.row.y);
              const orphans=heads.filter(h=>!rows.some(row=>row.dataset.matchId===h.dataset.b46SignalNativeFor)).map(h=>h.dataset.b46SignalNativeFor);
              return {at:Math.round(performance.now()),rows:rows.length,heads:heads.length,native:native.length,orphans,issues,info,examples:samples.slice(0,12),bodyScrollWidth:document.documentElement.scrollWidth,windowWidth:innerWidth};
            });
            for(const [phase,ms] of [['load',0],['10s',10000],['25s',15000],['45s',20000]]){
              if(ms)await p.waitForTimeout(ms);
              const rec={name,phase,proof:await scan()};snapshots.push(rec);console.log('SIGNAL_HEADER_AGE '+JSON.stringify(rec).slice(0,14000));
            }
            const simulation=await p.evaluate(()=>{
              const status=document.querySelector('.status-section[data-status-section="live"]'),block=status?.querySelector('.league-block');
              const source=block?.querySelector(':scope > .league-head:not(.b46-signal-native-head)');
              const rows=[...block?.querySelectorAll(':scope > .match-row')||[]];
              if(!source||!rows.length)return 'NO_ROWS';
              // Browser-only native header recreation (no network writes).
              for(let n=0;n<5;n++){
                const current=block.querySelector(':scope > .league-head:not(.b46-signal-native-head)');
                current.replaceWith(current.cloneNode(true));
                const first=rows[0];first.parentElement.insertBefore(first,first.parentElement.firstElementChild);
              }
              window.__b46SignalStableQA?.forceSync?.();
              return {rows:rows.map(r=>r.dataset.matchId),children:[...block.children].map(e=>e.className).slice(0,15)};
            });
            await p.waitForTimeout(950);
            const post={name,phase:'browser-local-rerenders',simulation,proof:await scan()};snapshots.push(post);console.log('SIGNAL_HEADER_AGE '+JSON.stringify(post).slice(0,14000));
            await p.screenshot({path:name+'-signal-aged.png',fullPage:false});await p.close();
          }
          await b.close();
          const totals=snapshots.map(x=>({name:x.name,phase:x.phase,rows:x.proof?.rows,heads:x.proof?.heads,issues:x.proof?.issues?.length,orphans:x.proof?.orphans?.length}));
          console.log('SIGNAL_HEADER_AGE_SUMMARY '+JSON.stringify(totals));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-signal-header-aging
          path: '*-signal-aged.png'
          if-no-files-found: ignore