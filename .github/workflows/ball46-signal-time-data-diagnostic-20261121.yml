name: BALL46 read-only Signal timestamps and Event Flow state
on:
  push:
    branches: [test/ball46-premium-match-colors-20261120]
    paths: ['.github/workflows/ball46-signal-time-data-diagnostic-20261121.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Inspect existing hydrated data, score timestamps and native expand state
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch(),origin='https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev';
          const p=await browser.newPage({viewport:{width:1440,height:950},serviceWorkers:'block'});
          await p.addInitScript(()=>localStorage.setItem('nomad343_dashboard_theme_v1','dark'));
          const responseUrls=[];
          p.on('response',r=>{if(/api\/|snapshot|signal|live/i.test(r.url())&&responseUrls.length<70)responseUrls.push({status:r.status(),url:r.url().slice(0,240)});});
          await p.goto(origin+'/?view=signal',{waitUntil:'domcontentloaded',timeout:65000});
          await p.waitForTimeout(2800);
          const before=await p.evaluate(()=>{
            const t=window.__B46_PREDICTION_V8;
            const expanded=window.NOMAD343_EXPANDED_MATCH;
            const source=['window.__B46_PREDICTION_V8','window.NOMAD343_EXPANDED_MATCH'].map(key=>({key,type:typeof eval(key),value:String(eval(key)).slice(0,240)}));
            const section=document.querySelector('.board-sections'),status=document.querySelector('.status-section');
            const visibleRows=[...document.querySelectorAll('.status-section .match-row')];
            const keySample=visibleRows.map(r=>({id:r.dataset.matchId,renderKey:r.dataset.b46RenderKey,outerDate:[...r.attributes].filter(a=>/time|created|signal|date|stamp|minute/i.test(a.name)).map(a=>[a.name,a.value]),timestampEls:[...r.querySelectorAll('time,[datetime],[data-created-at],[data-timestamp],[data-signal-time]')].map(x=>x.outerHTML.slice(0,450))}));
            return {source,predictionKeys:t&&typeof t==='object'?Object.keys(t).slice(0,40):null,expanded,rows:keySample,boardScroll:section?{clientHeight:section.clientHeight,scrollHeight:section.scrollHeight,scrollTop:section.scrollTop,css:{height:getComputedStyle(section).height,overflow:getComputedStyle(section).overflowY}}:null,statusChildren:[...status.children].map(x=>({tag:x.tagName,cls:String(x.className),cnt:x.querySelectorAll('.match-row').length})),globalStateKeys:Object.keys(window).filter(x=>/signal|prediction|hub|store|snapshot|view|match|fixture|cache|state/i.test(x)).slice(0,140)};
          });
          console.log('B46_SIGNAL_TIME_BEFORE '+JSON.stringify(before));
          await p.locator('.status-section .match-row').first().click({position:{x:120,y:25}});
          await p.waitForTimeout(600);
          const after=await p.evaluate(()=>{
            const chart=document.querySelector('[data-b46-flow]');
            let data=null;try{data=JSON.parse(chart.getAttribute('data-b46-flow'))}catch{}
            const selected=document.querySelector('.match-row.active'),expanded=window.NOMAD343_EXPANDED_MATCH;
            const root=selected?.parentElement,block=root?.parentElement;
            return {chartKeys:data?Object.keys(data):null,signalSample:data?.signals?.slice(0,9),allKeys:data?Object.entries(data).map(([k,v])=>({k,type:typeof v,len:Array.isArray(v)?v.length:null,sample:Array.isArray(v)?v.slice(0,2):typeof v==='object'?Object.keys(v):String(v).slice(0,150)})):null,expanded,rootStructure:root?.outerHTML.slice(0,1200),blockStructure:block?.outerHTML.slice(0,1200),panel:[...document.querySelectorAll('.expand-card,.match-expand,.expanded-row,.match-detail,[data-eventflow-viewport]')].map(x=>({cls:x.className,html:x.outerHTML.slice(0,900),par:x.parentElement?.className,prev:x.previousElementSibling?.className})),scrollTop:document.querySelector('.board-sections')?.scrollTop};
          });
          console.log('B46_SIGNAL_TIME_AFTER '+JSON.stringify(after));
          console.log('B46_SIGNAL_RESPONSE_URLS '+JSON.stringify(responseUrls));
          const html=await (await fetch(origin+'/?view=signal')).text();
          const needles=['signalCreatedAt','created_at','createdAt','signal_at','signalTime','signal_ts','settled_at','activeSignals','signalRows','data-status-section','NOMAD343_EXPANDED_MATCH','board-sections','renderLive','signalList','signalCount'];
          const snippets=Object.fromEntries(needles.map(n=>{const at=html.indexOf(n);return [n,at<0?null:{at,excerpt:html.slice(Math.max(0,at-100),at+240)}]}));
          console.log('B46_SIGNAL_SOURCE_SEARCH '+JSON.stringify(snippets));
          await browser.close();
          NODE