name: BALL46 Statistics Mobile V1 Read Only DOM Audit
on:
  push:
    branches: [codex/ball46-stats-mobile-v1-browser-preview-20261020]
    paths:
      - '.github/workflows/ball46-stats-mobile-v1-audit-20261020.yml'
      - 'deploy-assets/stats-mobile-v1-preview-20261020/audit.mjs'
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read existing mobile Statistics and settlement table geometry
        working-directory: deploy-assets/stats-mobile-v1-preview-20261020
        run: |
          node --check audit.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
          node audit.mjs
