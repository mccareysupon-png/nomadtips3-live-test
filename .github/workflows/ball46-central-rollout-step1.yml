name: BALL46 guarded central rollout step 1
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-central-rollout-step1.yml']
permissions:
  contents: read
concurrency:
  group: ball46-central-rollout-step1
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare exact old/new transport, activate additive HUB only if Live idle
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node qa/prematch-history-20261120/central-rollout-step1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: central-rollout
          path: evidence/
