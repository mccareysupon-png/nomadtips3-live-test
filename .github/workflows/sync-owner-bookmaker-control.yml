name: Sync Owner Bookmaker Control

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-owner-bookmaker-control.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Copy only verified Owner Control from Preview branch
        run: |
          git fetch origin work/car3-5-live-soccer-analysis
          git show origin/work/car3-5-live-soccer-analysis:car3-5-live-soccer-analysis/web/owner-control.html > car3-5-live-soccer-analysis/web/owner-control.html
          grep -q 'name="bookmakerCompanyId"' car3-5-live-soccer-analysis/web/owner-control.html
          grep -q '1xBet · Goaloo ID 50' car3-5-live-soccer-analysis/web/owner-control.html
          grep -q 'Bet365 · Goaloo ID 8' car3-5-live-soccer-analysis/web/owner-control.html
      - name: Commit only Owner Control
        run: |
          git config user.name 'mccareysupon-png'
          git config user.email 'mccarey.supon@gmail.com'
          git add car3-5-live-soccer-analysis/web/owner-control.html
          git diff --cached --quiet && exit 0
          git commit -m 'CAR 3.5 production: add owner-selectable Bet365 and 1xBet source'
          git push origin HEAD:main
