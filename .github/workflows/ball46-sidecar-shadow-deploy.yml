name: BALL46 independent shadow Worker — deploy disabled safely
on:
  push:
    branches:
      - stage/ball46-multisource-v5-20261017
    paths:
      - .github/workflows/ball46-sidecar-shadow-deploy.yml
      - workers/ball46-result-sidecar/src/worker.mjs
      - integrations/multisource/cross-source-fixture-mapper.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-shadow-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: ""
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enforce strict stage-only target, no native bridge or cron
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'name = "ball46-multisource-shadow-20261018"' workers/ball46-result-sidecar/wrangler.stage.toml
          grep -Fxq 'GOALOO_POLL_ENABLED = "0"' workers/ball46-result-sidecar/wrangler.stage.toml
          grep -Fxq 'GOALOO_UTC_CERTIFIED = "0"' workers/ball46-result-sidecar/wrangler.stage.toml
          grep -Fxq 'ENABLE_NATIVE_FORWARD = "0"' workers/ball46-result-sidecar/wrangler.stage.toml
          ! grep -Eq '(^\[\[services\]\]|^\[triggers\]|^routes =|^workers_dev = true)' workers/ball46-result-sidecar/wrangler.stage.toml
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'Stage deploy credentials missing'; exit 1
          fi
          echo "Stage protection verified. Does not bind Engine/Hub, no production route, no cron."
      - name: Deploy brand new isolated shadow Worker only
        working-directory: workers/ball46-result-sidecar
        run: npx --yes wrangler@4 deploy --config wrangler.stage.toml
      - name: Verify isolated Worker exists using GET only
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const id=process.env.CLOUDFLARE_ACCOUNT_ID,t=process.env.CLOUDFLARE_API_TOKEN; fetch("https://api.cloudflare.com/client/v4/accounts/"+id+"/workers/scripts/ball46-multisource-shadow-20261018",{headers:{Authorization:"Bearer "+t}}).then(r=>{if(!r.ok)throw Error("ISOLATED_WORKER_VERIFY_"+r.status);console.log("ISOLATED_SHADOW_DEPLOYED_NO_PRODUCTION_TRAFFIC")}).catch(e=>{console.error(e.message);process.exit(1)})'
