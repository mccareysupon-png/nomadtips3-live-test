name: BALL46 isolated canonical registry — shadow only
on:
  push:
    branches:
      - stage/ball46-multisource-v5-20261017
    paths:
      - .github/workflows/ball46-sidecar-shadow-deploy.yml
      - workers/ball46-result-sidecar/src/worker.mjs
      - workers/ball46-result-sidecar/src/pending-ledger-reader.mjs
      - workers/ball46-result-sidecar/test/pending-ledger-reader.test.mjs
      - workers/ball46-result-sidecar/wrangler.stage.toml
      - integrations/multisource/cross-source-fixture-mapper.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ball46-canonical-shadow-deploy
  cancel-in-progress: false
jobs:
  shadow-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce isolated GET-only canonical intake and disable all result forwarding
        shell: bash
        run: |
          set -euo pipefail
          conf=workers/ball46-result-sidecar/wrangler.stage.toml
          grep -Fxq 'name = "ball46-multisource-shadow-20261018"' "$conf"
          grep -Fxq 'GOALOO_POLL_ENABLED = "0"' "$conf"
          grep -Fxq 'GOALOO_UTC_CERTIFIED = "0"' "$conf"
          grep -Fxq 'GOALOO_FT_CERTIFIED = "0"' "$conf"
          grep -Fxq 'ENABLE_NATIVE_FORWARD = "0"' "$conf"
          grep -Fxq 'CANONICAL_CAPTURE_ENABLED = "1"' "$conf"
          grep -Fxq 'crons = ["*/5 * * * *"]' "$conf"
          grep -Fxq 'binding = "HUB"' "$conf"
          grep -Fxq 'service = "nomadtips3-5usd-hub-343"' "$conf"
          grep -Fxq 'PENDING_LEDGER_READONLY_ENABLED = "1"' "$conf"
          grep -Fxq 'binding = "ENGINE"' "$conf"
          grep -Fxq 'service = "nomadtips3-engine-343"' "$conf"
          ! grep -Eq '^routes? =|^workers_dev = true' "$conf"
          ! grep -q 'ENABLE_NATIVE_FORWARD = "1"' "$conf"
          grep -Fq "const url='https://engine.internal/statistics?cursor='" workers/ball46-result-sidecar/src/pending-ledger-reader.mjs
          ! grep -Fq "method:'POST'" workers/ball46-result-sidecar/src/pending-ledger-reader.mjs
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          echo 'SHADOW_SOURCE_GATES_PASS_LEDGER_V2_GET_ONLY'
      - name: Test native Ledger V2 read-only paged cursor
        run: |
          node --test workers/ball46-result-sidecar/test/*.test.mjs
          node --test integrations/multisource/test/*.test.mjs
      - name: Run real local Durable Object regression before deployment
        working-directory: workers/ball46-result-sidecar
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 dev --local --config wrangler.local-test.toml --ip 127.0.0.1 --port 8793 --persist-to /tmp/ball46-deploy-gated-do > /tmp/ball46-workerd-8793.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            if curl --silent --max-time 2 http://127.0.0.1:8793/ -o /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/ball46-workerd-8793.log; exit 1; fi
          for path in selftest stress canonical-only; do
            curl --fail --silent --show-error --max-time 40 "http://127.0.0.1:8793/$path" -o "/tmp/ball46-$path.json"
            node -e 'const x=require(process.argv[1]);if(!x.ok||x.nativeEngineCalls>0||x.engineWrites>0)process.exit(1);console.log("SHADOW_REAL_DO_PASS",process.argv[1])' "/tmp/ball46-$path.json"
          done
      - name: Deploy isolated Shadow Worker with existing 5USD Hub read-only service binding
        working-directory: workers/ball46-result-sidecar
        run: npx --yes wrangler@4 deploy --config wrangler.stage.toml
      - name: Create independent high-entropy secret for internal scheduled event
        working-directory: workers/ball46-result-sidecar
        shell: bash
        run: |
          set -euo pipefail
          node -e 'process.stdout.write(require("node:crypto").randomBytes(48).toString("base64url"))' |
            npx --yes wrangler@4 secret put SIDECAR_ADMIN_TOKEN --config wrangler.stage.toml
          echo 'SHADOW_CRON_SECRET_INSTALLED'
      - name: Verify separate Worker deployment with Cloudflare GET
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const id=process.env.CLOUDFLARE_ACCOUNT_ID,t=process.env.CLOUDFLARE_API_TOKEN;
          async function get(name){
            const u='https://api.cloudflare.com/client/v4/accounts/'+id+'/workers/scripts/'+name+'/deployments';
            const r=await fetch(u,{headers:{Authorization:'Bearer '+t}});
            if(!r.ok)throw Error('READ_'+name+'_'+r.status);
            const d=(await r.json()).result?.deployments?.[0];if(!d?.id)throw Error('EMPTY_'+name);
            return {deploymentId:d.id,versions:(d.versions||[]).map(v=>({id:v.version_id,percentage:v.percentage}))};
          }
          (async()=>{
            const [main,shadow]=await Promise.all([get('nomadtips3-engine-343'),get('ball46-multisource-shadow-20261018')]);
            if(main.deploymentId===shadow.deploymentId)throw Error('DEPLOYMENT_COLLISION');
            if(shadow.versions.every(v=>Number(v.percentage)!==100))throw Error('SHADOW_NOT_100');
            console.log('SHADOW_CANONICAL_CAPTURE_DEPLOYED',JSON.stringify({main,shadow}));
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
