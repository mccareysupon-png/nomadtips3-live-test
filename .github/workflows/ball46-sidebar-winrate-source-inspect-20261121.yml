name: BALL46 sidebar win rate source read-only inspection 20261121
on:
  push:
    branches: [test/ball46-sidebar-winrate-20261121]
    paths:
      - '.github/workflows/ball46-sidebar-winrate-source-inspect-20261121.yml'
      - 'qa/sidebar-winrate-20261121/source-inspect.mjs'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node qa/sidebar-winrate-20261121/source-inspect.mjs
