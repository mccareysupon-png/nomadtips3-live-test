name: Deploy Ball46 Finished Clone Signal 20261008
on:
  push:
    branches:
      - work/ball46-finished-clone-signal-20261008
    paths:
      - '.github/workflows/deploy-ball46-finished-clone-signal-20261008.yml'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PATCH_SOURCE_BRANCH: work/ball46-finished-clone-signal-20261008
      DEPLOY_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-finished-clone-signal-20261008
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts acorn@8
      - name: Deploy guarded Finished Signal typography clone
        working-directory: deploy-assets/finished-clone-signal-20261008
        run: node deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-finished-clone-signal-deploy-${{ github.run_id }}
          path: deploy-assets/finished-clone-signal-20261008/audit
          retention-days: 30
