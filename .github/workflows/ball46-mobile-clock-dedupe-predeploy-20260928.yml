name: READ ONLY - Ball46 Mobile Clock Dedupe Predeploy 20260928
on:
  push:
    branches:
      - work/ball46-mobile-clock-dedupe-20260928
    paths:
      - '.github/workflows/ball46-mobile-clock-dedupe-predeploy-20260928.yml'
      - '.github/scripts/ball46_mobile_clock_dedupe_predeploy_20260928.sh'
permissions:
  contents: read
jobs:
  predeploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Run read-only guarded predeploy
        run: bash .github/scripts/ball46_mobile_clock_dedupe_predeploy_20260928.sh
      - name: Upload predeploy proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-mobile-clock-dedupe-predeploy-${{ github.run_id }}
          path: /tmp/b46-mobile-clock-dedupe
          if-no-files-found: ignore
          retention-days: 30
