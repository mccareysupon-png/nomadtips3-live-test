name: BALL46 odds movement arrow spacing 6px guarded production release
on:
  push:
    branches: [release/ball46-odds-arrow-spacing-20261121]
    paths:
      - '.github/workflows/ball46-odds-arrow-spacing-production-20261121.yml'
      - 'deploy-assets/odds-arrow-spacing-20261121/deploy.mjs'
      - 'deploy-assets/odds-arrow-spacing-20261121/odds-movement.mjs'
      - 'deploy-assets/odds-arrow-spacing-20261121/odds-movement-baseline.mjs'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  guarded-release:
    if: github.ref == 'refs/heads/release/ball46-odds-arrow-spacing-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mark production release pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/statuses/${{ github.sha }} -f state=pending -f context=ball46-odds-arrow-spacing-production -f description='Guarded Candidate preview before production activation' -f target_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Verify release code and install browser
        run: |
          node --check deploy-assets/odds-arrow-spacing-20261121/deploy.mjs
          npm install --no-audit --no-fund acorn@8 playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Candidate upload preview then production cutover with rollback
        working-directory: deploy-assets/odds-arrow-spacing-20261121
        run: node deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-odds-arrow-spacing-production-audit-${{ github.run_id }}
          path: deploy-assets/odds-arrow-spacing-20261121/audit
          if-no-files-found: warn
          retention-days: 30
      - name: Publish final release verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          if [ "$RESULT" = cancelled ]; then state=error; fi
          gh api --method POST repos/${{ github.repository }}/statuses/${{ github.sha }} -f state="$state" -f context=ball46-odds-arrow-spacing-production -f description="Guarded release: $RESULT" -f target_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
