name: BALL46 Statistics red transparent live clock
on:
  push:
    branches: [test/ball46-statistics-red-clock-20261114]
    paths: ['work/statistics-red-clock-release-20261114/**','.github/workflows/ball46-statistics-red-clock-20261114.yml']
permissions:
  contents: read
jobs:
  guarded-clock-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser verification
        run: |
          npm install --prefix work/statistics-red-clock-release-20261114/.runtime --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          work/statistics-red-clock-release-20261114/.runtime/node_modules/.bin/playwright install --with-deps chromium
      - name: Read latest Production, verify CSS candidate and activate with rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node work/statistics-red-clock-release-20261114/release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-statistics-red-clock-proof
          path: work/statistics-red-clock-release-20261114/qa
