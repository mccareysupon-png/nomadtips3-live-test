name: BALL46 test five historical archive rounds per London day
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-prematch-five-rounds-test.yml']
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static and SQLite safety tests
        run: |
          node --check qa/prematch-history-20261120/history-five-rounds.mjs
          node --check qa/prematch-history-20261120/prematch-only-worker.mjs
          node --test qa/prematch-history-20261120/history-five-rounds.test.mjs qa/prematch-history-20261120/london-cutoff.test.mjs qa/prematch-history-20261120/normal-hub-monitor.test.mjs qa/prematch-history-20261120/test-pick-ledger.test.mjs
          ! grep -q 'api.5dollarfootballapi.com' qa/prematch-history-20261120/prematch-only-worker.mjs
