name: Deploy NOMAD 3.43 Production Cutover

on:
  workflow_dispatch:
  push:
    branches: [release/nomad343-production-20260917]
    paths:
      - 'workers/nomadtips3-343-preview/wrangler.production.jsonc'
      - 'workers/nomadtips3-343-preview/wrangler.cutover.jsonc'
      - '.github/workflows/deploy-343-production-cutover.yml'

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PROD_URL: https://nomadtips3-343-production.mccarey-supon.workers.dev
  CUSTOM_URL: https://www.nomadtips3.com

jobs:
  deploy-cutover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate release source and credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          test -s nomad-live-343/index.html
          test -s workers/nomadtips3-343-preview/src/index.js
          test -s workers/nomadtips3-343-preview/wrangler.production.jsonc
          test -s workers/nomadtips3-343-preview/wrangler.cutover.jsonc
          grep -Fq '"name": "nomadtips3-343-production"' workers/nomadtips3-343-preview/wrangler.production.jsonc
          grep -Fq '"name": "nomadtips3-live-web-production"' workers/nomadtips3-343-preview/wrangler.cutover.jsonc
          grep -Fq '"ENGINE", "service": "nomadtips3-engine-343"' workers/nomadtips3-343-preview/wrangler.cutover.jsonc
          grep -Fq '"HUB", "service": "nomadtips3-5usd-hub-343"' workers/nomadtips3-343-preview/wrangler.cutover.jsonc
          node --check workers/nomadtips3-343-preview/src/index.js

      - name: Dry-run isolated and cutover bundles
        working-directory: workers/nomadtips3-343-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.production.jsonc
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.cutover.jsonc

      - name: Deploy isolated 3.43 production Worker
        working-directory: workers/nomadtips3-343-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.production.jsonc

      - name: Smoke-test isolated 3.43 before cutover
        shell: bash
        run: |
          set -euo pipefail
          retry_page() {
            for n in $(seq 1 20); do
              code="$(curl -sS --max-time 25 -D /tmp/h -o /tmp/body -w '%{http_code}' "$PROD_URL/?precutover=${GITHUB_RUN_ID}-${n}" || true)"
              rev="$(awk 'BEGIN{IGNORECASE=1} /^x-nomad-ui-revision:/{gsub(/\r/,"");sub(/^[^:]*:[[:space:]]*/,"");print;exit}' /tmp/h)"
              echo "page attempt=$n code=$code revision=$rev"
              if [ "$code" = 200 ] && [ "$rev" = '343-bulk-only-v1' ]; then return 0; fi
              sleep 2
            done
            return 1
          }
          retry_json() {
            local path="$1" outfile="$2"
            for n in $(seq 1 20); do
              code="$(curl -sS --max-time 30 -o "$outfile" -w '%{http_code}' "$PROD_URL$path?verify=${GITHUB_RUN_ID}&attempt=$n" || true)"
              echo "api $path attempt=$n code=$code"
              if [ "$code" = 200 ] && node -e 'const fs=require("fs");JSON.parse(fs.readFileSync(process.argv[1],"utf8"))' "$outfile" 2>/dev/null; then return 0; fi
              sleep 2
            done
            return 1
          }
          retry_page || { echo '::error::3.43 UI not ready; production service untouched'; exit 1; }
          retry_json '/api/hub/health' /tmp/hub.json || { echo '::error::HUB not ready; production service untouched'; exit 1; }
          node -e 'const j=require("/tmp/hub.json");if(j.component!=="5USD_HUB"||j.ok!==true)throw Error("HUB unhealthy");console.log("HUB_OK refreshMs",j.refreshMs,"fixtures",j.fixtureCount)'
          retry_json '/api/engine/board' /tmp/board.json || { echo '::error::ENGINE not ready; production service untouched'; exit 1; }
          node -e 'const j=require("/tmp/board.json");if(j.ok!==true||!Array.isArray(j.fixtures))throw Error("ENGINE unhealthy");console.log("ENGINE_OK fixtures",j.fixtures.length,"age",j.hubAgeMs)'
          retry_json '/api/engine/signals' /tmp/signals.json || { echo '::error::SIGNALS not ready; production service untouched'; exit 1; }
          node -e 'const j=require("/tmp/signals.json");if(j.ok!==true||!Array.isArray(j.signals))throw Error("SIGNALS unhealthy");console.log("SIGNALS_OK",j.signals.length)'

      - name: Cut over existing production Worker service to 3.43
        id: cutover
        working-directory: workers/nomadtips3-343-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          npx --yes wrangler@4.92.0 deploy --config wrangler.cutover.jsonc
          echo 'CUTOVER deployed 3.43 into existing nomadtips3-live-web-production service'

      - name: Verify www is 3.43 and flow is alive
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for n in $(seq 1 30); do
            code="$(curl -sS --max-time 25 -D /tmp/www-h -o /tmp/www-home -w '%{http_code}' "$CUSTOM_URL/?cutover=${GITHUB_RUN_ID}-${n}" || true)"
            rev="$(awk 'BEGIN{IGNORECASE=1} /^x-nomad-ui-revision:/{gsub(/\r/,"");sub(/^[^:]*:[[:space:]]*/,"");print;exit}' /tmp/www-h)"
            echo "www attempt=$n code=$code revision=$rev"
            if [ "$code" = 200 ] && [ "$rev" = '343-bulk-only-v1' ]; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          retry_api() {
            local path="$1" outfile="$2"
            for n in $(seq 1 20); do
              code="$(curl -sS --max-time 30 -o "$outfile" -w '%{http_code}' "$CUSTOM_URL$path?verify=${GITHUB_RUN_ID}&attempt=$n" || true)"
              echo "www api $path attempt=$n code=$code"
              if [ "$code" = 200 ] && node -e 'const fs=require("fs");JSON.parse(fs.readFileSync(process.argv[1],"utf8"))' "$outfile" 2>/dev/null; then return 0; fi
              sleep 2
            done
            return 1
          }
          retry_api '/api/hub/health' /tmp/www-hub.json
          node -e 'const j=require("/tmp/www-hub.json");if(j.component!=="5USD_HUB"||j.ok!==true)throw Error("www HUB unhealthy");console.log("WWW_HUB_OK refreshMs",j.refreshMs,"fixtures",j.fixtureCount)'
          retry_api '/api/engine/board' /tmp/www-board.json
          node -e 'const j=require("/tmp/www-board.json");if(j.ok!==true||!Array.isArray(j.fixtures))throw Error("www ENGINE unhealthy");console.log("WWW_ENGINE_OK fixtures",j.fixtures.length,"age",j.hubAgeMs)'
          retry_api '/api/engine/signals' /tmp/www-signals.json
          node -e 'const j=require("/tmp/www-signals.json");if(j.ok!==true||!Array.isArray(j.signals))throw Error("www SIGNALS unhealthy");console.log("WWW_SIGNALS_OK",j.signals.length)'
          for page in index.html signal.html statistics.html settings.html api-monitor.html; do
            curl -fsS --max-time 25 "$CUSTOM_URL/$page?verify=${GITHUB_RUN_ID}" -o "/tmp/$page"
            test -s "/tmp/$page"
          done
          echo 'NOMAD 3.43 production cutover PASS'

      - name: Inspect Ball46 Cloudflare state
        if: ${{ success() }}
        continue-on-error: true
        shell: bash
        run: |
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          echo 'BALL46_ZONE_QUERY'
          curl -sS -w '\nHTTP=%{http_code}\n' "${auth[@]}" 'https://api.cloudflare.com/client/v4/zones?name=ball46.com' -o /tmp/ball46-zone.json
          cat /tmp/ball46-zone.json | jq '{success,errors,result:[.result[]? | {id,name,status,account_id:.account.id}]}' || cat /tmp/ball46-zone.json
          echo 'BALL46_WORKERS_DOMAINS'
          curl -sS -w '\nHTTP=%{http_code}\n' "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/domains" -o /tmp/ball46-domains.json
          cat /tmp/ball46-domains.json | jq '{success,errors,result:[.result[]? | select(.hostname|contains("ball46.com")) | {id,hostname,service,environment,zone_id,zone_name}]}' || cat /tmp/ball46-domains.json

      - name: Roll back existing production Worker service to 3.41 if verification fails
        if: ${{ failure() && steps.cutover.outputs.attempted == 'true' }}
        working-directory: nomad-live-web-production
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --config wrangler.production.jsonc
          echo 'ROLLBACK restored repository 3.41 production Worker bundle'
