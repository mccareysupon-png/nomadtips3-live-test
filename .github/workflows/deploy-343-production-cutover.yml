name: Deploy 3.43 Production

on:
  workflow_dispatch:
  push:
    branches: [release/nomad343-production-20260917]
    paths:
      - 'workers/nomadtips3-343-preview/wrangler.production.jsonc'
      - 'workers/nomadtips3-343-preview/wrangler.cutover.jsonc'
      - 'workers/nomadtips3-343-preview/wrangler.ball46.jsonc'
      - '.github/workflows/deploy-343-production-cutover.yml'

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-nomad:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PROD_URL: https://nomadtips3-343-production.mccarey-supon.workers.dev
      CUSTOM_URL: https://www.nomadtips3.com
    steps:
      - uses: actions/checkout@v4

      - name: Validate NOMAD 3.43 source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          test -s nomad-live-343/index.html
          test -s workers/nomadtips3-343-preview/src/index.js
          test -s workers/nomadtips3-343-preview/wrangler.production.jsonc
          test -s workers/nomadtips3-343-preview/wrangler.cutover.jsonc
          grep -Fq '"name": "nomadtips3-343-production"' workers/nomadtips3-343-preview/wrangler.production.jsonc
          grep -Fq '"name": "nomadtips3-live-web-production"' workers/nomadtips3-343-preview/wrangler.cutover.jsonc
          grep -Fq '"ENGINE", "service": "nomadtips3-engine-343"' workers/nomadtips3-343-preview/wrangler.cutover.jsonc
          grep -Fq '"HUB", "service": "nomadtips3-5usd-hub-343"' workers/nomadtips3-343-preview/wrangler.cutover.jsonc
          node --check workers/nomadtips3-343-preview/src/index.js

      - name: Dry-run NOMAD bundles
        working-directory: workers/nomadtips3-343-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.production.jsonc
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.cutover.jsonc

      - name: Deploy isolated NOMAD 3.43 Worker
        working-directory: workers/nomadtips3-343-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.production.jsonc

      - name: Smoke-test isolated NOMAD 3.43
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 20); do
            code="$(curl -sS --max-time 25 -D /tmp/h -o /tmp/body -w '%{http_code}' "$PROD_URL/?verify=${GITHUB_RUN_ID}-${n}" || true)"
            rev="$(awk 'BEGIN{IGNORECASE=1} /^x-nomad-ui-revision:/{gsub(/\r/,"");sub(/^[^:]*:[[:space:]]*/,"");print;exit}' /tmp/h)"
            if [ "$code" = 200 ] && [ "$rev" = '343-bulk-only-v1' ]; then ready=1; break; fi
            sleep 2
          done
          test "${ready:-0}" = 1
          for path in /api/hub/health /api/engine/board /api/engine/signals; do
            curl -fsS --max-time 30 "$PROD_URL$path?verify=${GITHUB_RUN_ID}" -o /tmp/check.json
            node -e 'const j=require("/tmp/check.json");if(j.ok!==true)throw Error(JSON.stringify(j));'
          done

      - name: Cut over existing NOMAD production Worker service to 3.43
        id: nomad_cutover
        working-directory: workers/nomadtips3-343-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          npx --yes wrangler@4.92.0 deploy --config wrangler.cutover.jsonc

      - name: Verify NOMAD production
        id: verify_nomad
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for n in $(seq 1 30); do
            code="$(curl -sS --max-time 25 -D /tmp/h -o /tmp/home -w '%{http_code}' "$CUSTOM_URL/?verify=${GITHUB_RUN_ID}-${n}" || true)"
            rev="$(awk 'BEGIN{IGNORECASE=1} /^x-nomad-ui-revision:/{gsub(/\r/,"");sub(/^[^:]*:[[:space:]]*/,"");print;exit}' /tmp/h)"
            if [ "$code" = 200 ] && [ "$rev" = '343-bulk-only-v1' ]; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          for path in /api/hub/health /api/engine/board /api/engine/signals; do
            curl -fsS --max-time 30 "$CUSTOM_URL$path?verify=${GITHUB_RUN_ID}" -o /tmp/check.json
            node -e 'const j=require("/tmp/check.json");if(j.ok!==true)throw Error(JSON.stringify(j));'
          done
          echo 'NOMAD_343_PRODUCTION_PASS'

      - name: Roll back NOMAD to repository 3.41 bundle
        if: ${{ failure() && steps.nomad_cutover.outputs.attempted == 'true' }}
        working-directory: nomad-live-web-production
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --config wrangler.production.jsonc
          echo 'NOMAD_ROLLBACK_COMPLETE'

  deploy-ball46:
    needs: deploy-nomad
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BALL46_SERVICE: ball46-production
      BALL46_WORKER_URL: https://ball46-production.mccarey-supon.workers.dev
      BALL46_APEX: https://ball46.com
      BALL46_WWW: https://www.ball46.com
      BALL46_ZONE_ID: d491ee30b7a87a6c37e6a4dacf00ae8d
      BALL46_ZONE_NAME: ball46.com
    steps:
      - uses: actions/checkout@v4

      - name: Validate Ball46 3.43 source
        shell: bash
        run: |
          set -euo pipefail
          test -s workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          grep -Fq '"name": "ball46-production"' workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          grep -Fq '"ENGINE", "service": "nomadtips3-engine-343"' workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          grep -Fq '"HUB", "service": "nomadtips3-5usd-hub-343"' workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          node --check workers/nomadtips3-343-preview/src/index.js

      - name: Dry-run Ball46 production bundle
        working-directory: workers/nomadtips3-343-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy isolated Ball46 production Worker
        working-directory: workers/nomadtips3-343-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Smoke-test Ball46 Worker before domain cutover
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for n in $(seq 1 20); do
            code="$(curl -sS --max-time 25 -D /tmp/h -o /tmp/home -w '%{http_code}' "$BALL46_WORKER_URL/?verify=${GITHUB_RUN_ID}-${n}" || true)"
            rev="$(awk 'BEGIN{IGNORECASE=1} /^x-nomad-ui-revision:/{gsub(/\r/,"");sub(/^[^:]*:[[:space:]]*/,"");print;exit}' /tmp/h)"
            echo "worker attempt=$n code=$code revision=$rev"
            if [ "$code" = 200 ] && [ "$rev" = '343-bulk-only-v1' ]; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          curl -fsS --max-time 30 "$BALL46_WORKER_URL/api/hub/health?verify=${GITHUB_RUN_ID}" -o /tmp/hub.json
          node -e 'const j=require("/tmp/hub.json");if(j.ok!==true||j.component!=="5USD_HUB")throw Error(JSON.stringify(j));console.log("BALL46_HUB_OK",j.fixtureCount,j.refreshMs)'
          curl -fsS --max-time 30 "$BALL46_WORKER_URL/api/engine/board?verify=${GITHUB_RUN_ID}" -o /tmp/board.json
          node -e 'const j=require("/tmp/board.json");if(j.ok!==true||!Array.isArray(j.fixtures))throw Error(JSON.stringify(j));console.log("BALL46_ENGINE_OK",j.fixtures.length)'
          curl -fsS --max-time 30 "$BALL46_WORKER_URL/api/engine/signals?verify=${GITHUB_RUN_ID}" -o /tmp/signals.json
          node -e 'const j=require("/tmp/signals.json");if(j.ok!==true||!Array.isArray(j.signals))throw Error(JSON.stringify(j));console.log("BALL46_SIGNALS_OK",j.signals.length)'

      - name: Snapshot current Ball46 custom-domain owners
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/domains" -o /tmp/domains.json
          test "$(jq -r '.success' /tmp/domains.json)" = true
          OLD_APEX_SERVICE="$(jq -r '.result[] | select(.hostname=="ball46.com") | .service' /tmp/domains.json)"
          OLD_APEX_ENV="$(jq -r '.result[] | select(.hostname=="ball46.com") | .environment' /tmp/domains.json)"
          OLD_WWW_SERVICE="$(jq -r '.result[] | select(.hostname=="www.ball46.com") | .service' /tmp/domains.json)"
          OLD_WWW_ENV="$(jq -r '.result[] | select(.hostname=="www.ball46.com") | .environment' /tmp/domains.json)"
          test -n "$OLD_APEX_SERVICE"
          test -n "$OLD_WWW_SERVICE"
          echo "OLD_APEX_SERVICE=$OLD_APEX_SERVICE" >> "$GITHUB_ENV"
          echo "OLD_APEX_ENV=${OLD_APEX_ENV:-production}" >> "$GITHUB_ENV"
          echo "OLD_WWW_SERVICE=$OLD_WWW_SERVICE" >> "$GITHUB_ENV"
          echo "OLD_WWW_ENV=${OLD_WWW_ENV:-production}" >> "$GITHUB_ENV"
          echo "BALL46_BACKUP apex=$OLD_APEX_SERVICE www=$OLD_WWW_SERVICE"

      - name: Cut over Ball46 custom domains to 3.43
        id: ball46_attach
        shell: bash
        run: |
          set -euo pipefail
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          attach() {
            local host="$1"
            payload="$(jq -nc --arg hostname "$host" --arg service "$BALL46_SERVICE" --arg zone_id "$BALL46_ZONE_ID" --arg zone_name "$BALL46_ZONE_NAME" '{environment:"production",hostname:$hostname,service:$service,zone_id:$zone_id,zone_name:$zone_name,override_existing_origin:true}')"
            code="$(curl -sS "${auth[@]}" -X PUT "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/domains" --data "$payload" -o /tmp/attach.json -w '%{http_code}')"
            cat /tmp/attach.json
            test "$code" = 200
            test "$(jq -r '.success' /tmp/attach.json)" = true
          }
          attach ball46.com
          attach www.ball46.com
          echo 'BALL46_DOMAIN_CUTOVER_SENT'

      - name: Verify Ball46 production and flow
        id: verify_ball46
        shell: bash
        run: |
          set -euo pipefail
          verify_host() {
            local base="$1" label="$2"
            local ready=0
            for n in $(seq 1 30); do
              code="$(curl -sS --max-time 25 -D /tmp/h -o /tmp/home -w '%{http_code}' "$base/?verify=${GITHUB_RUN_ID}-${n}" || true)"
              rev="$(awk 'BEGIN{IGNORECASE=1} /^x-nomad-ui-revision:/{gsub(/\r/,"");sub(/^[^:]*:[[:space:]]*/,"");print;exit}' /tmp/h)"
              echo "$label attempt=$n code=$code revision=$rev"
              if [ "$code" = 200 ] && [ "$rev" = '343-bulk-only-v1' ]; then ready=1; break; fi
              sleep 2
            done
            test "$ready" = 1
          }
          verify_host "$BALL46_APEX" APEX
          verify_host "$BALL46_WWW" WWW
          curl -fsS --max-time 30 "$BALL46_APEX/api/hub/health?verify=${GITHUB_RUN_ID}" -o /tmp/hub.json
          node -e 'const j=require("/tmp/hub.json");if(j.ok!==true||j.component!=="5USD_HUB")throw Error(JSON.stringify(j));console.log("BALL46_DOMAIN_HUB_OK",j.fixtureCount,j.refreshMs)'
          curl -fsS --max-time 30 "$BALL46_APEX/api/engine/board?verify=${GITHUB_RUN_ID}" -o /tmp/board.json
          node -e 'const j=require("/tmp/board.json");if(j.ok!==true||!Array.isArray(j.fixtures))throw Error(JSON.stringify(j));console.log("BALL46_DOMAIN_ENGINE_OK",j.fixtures.length,j.hubAgeMs)'
          curl -fsS --max-time 30 "$BALL46_APEX/api/engine/signals?verify=${GITHUB_RUN_ID}" -o /tmp/signals.json
          node -e 'const j=require("/tmp/signals.json");if(j.ok!==true||!Array.isArray(j.signals))throw Error(JSON.stringify(j));console.log("BALL46_DOMAIN_SIGNALS_OK",j.signals.length)'
          for page in index.html signal.html statistics.html settings.html api-monitor.html; do
            curl -fsS --max-time 25 "$BALL46_APEX/$page?verify=${GITHUB_RUN_ID}" -o "/tmp/$page"
            test -s "/tmp/$page"
          done
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/domains" -o /tmp/domains-after.json
          test "$(jq -r '.result[] | select(.hostname=="ball46.com") | .service' /tmp/domains-after.json)" = "$BALL46_SERVICE"
          test "$(jq -r '.result[] | select(.hostname=="www.ball46.com") | .service' /tmp/domains-after.json)" = "$BALL46_SERVICE"
          echo 'BALL46_343_PRODUCTION_PASS'

      - name: Roll back Ball46 domains to previous service if verification fails
        if: ${{ failure() && steps.ball46_attach.outputs.attempted == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          restore() {
            local host="$1" service="$2" environment="$3"
            payload="$(jq -nc --arg hostname "$host" --arg service "$service" --arg environment "$environment" --arg zone_id "$BALL46_ZONE_ID" --arg zone_name "$BALL46_ZONE_NAME" '{environment:$environment,hostname:$hostname,service:$service,zone_id:$zone_id,zone_name:$zone_name,override_existing_origin:true}')"
            curl -fsS "${auth[@]}" -X PUT "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/domains" --data "$payload" -o /tmp/restore.json
            cat /tmp/restore.json
            test "$(jq -r '.success' /tmp/restore.json)" = true
          }
          restore ball46.com "$OLD_APEX_SERVICE" "$OLD_APEX_ENV"
          restore www.ball46.com "$OLD_WWW_SERVICE" "$OLD_WWW_ENV"
          echo 'BALL46_ROLLBACK_COMPLETE'
