name: Deploy NOMAD 3.43 Production Cutover

on:
  workflow_dispatch:
  push:
    branches: [release/nomad343-production-20260917]
    paths:
      - 'workers/nomadtips3-343-preview/wrangler.production.jsonc'
      - '.github/workflows/deploy-343-production-cutover.yml'

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  ZONE_ID: 35badb923b6451ed5109276f20b6c749
  ZONE_NAME: nomadtips3.com
  WWW_HOST: www.nomadtips3.com
  PROD_SERVICE: nomadtips3-343-production
  PROD_URL: https://nomadtips3-343-production.mccarey-supon.workers.dev
  CUSTOM_URL: https://www.nomadtips3.com

jobs:
  deploy-cutover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate release source and Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -s nomad-live-343/index.html
          test -s workers/nomadtips3-343-preview/src/index.js
          test -s workers/nomadtips3-343-preview/wrangler.production.jsonc
          grep -Fq '"name": "nomadtips3-343-production"' workers/nomadtips3-343-preview/wrangler.production.jsonc
          grep -Fq '"ENGINE", "service": "nomadtips3-engine-343"' workers/nomadtips3-343-preview/wrangler.production.jsonc
          grep -Fq '"HUB", "service": "nomadtips3-5usd-hub-343"' workers/nomadtips3-343-preview/wrangler.production.jsonc
          grep -Fq "343-bulk-only-v1" workers/nomadtips3-343-preview/src/index.js
          node --check workers/nomadtips3-343-preview/src/index.js

      - name: Dry-run production bundle
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}

      - name: Deploy isolated 3.43 production Worker
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}

      - name: Smoke-test isolated 3.43 before domain cutover
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 15); do
            code="$(curl -sS --max-time 25 -D /tmp/prod-h -o /tmp/prod-home -w '%{http_code}' "$PROD_URL/?precutover=${GITHUB_RUN_ID}-${n}" || true)"
            marker="$(awk 'BEGIN{IGNORECASE=1} /^x-nomad-ui-revision:/{gsub(/\r/,"");sub(/^[^:]*:[[:space:]]*/,"");print;exit}' /tmp/prod-h)"
            echo "attempt=$n code=$code marker=$marker"
            if [ "$code" = 200 ] && [ "$marker" = "343-bulk-only-v1" ]; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1 || { echo '::error::Isolated 3.43 production Worker failed smoke test; www left untouched'; exit 1; }

          curl -fsS --max-time 30 "$PROD_URL/api/hub/health?verify=${GITHUB_RUN_ID}" -o /tmp/hub.json
          node -e 'const j=require("/tmp/hub.json");if(j.component!=="5USD_HUB")throw Error("HUB binding mismatch");console.log("HUB_OK",j.ok,"cycle",j.control?.liveRefreshSeconds)'

          curl -fsS --max-time 30 "$PROD_URL/api/engine/board?verify=${GITHUB_RUN_ID}" -o /tmp/board.json
          node -e 'const j=require("/tmp/board.json");if(j.ok!==true)throw Error("ENGINE board not ready: "+JSON.stringify(j));if(!Array.isArray(j.fixtures))throw Error("ENGINE fixtures missing");console.log("ENGINE_OK fixtures",j.fixtures.length,"age",j.hubAgeMs)'

          curl -fsS --max-time 30 "$PROD_URL/api/engine/signals?verify=${GITHUB_RUN_ID}" -o /tmp/signals.json
          node -e 'const j=require("/tmp/signals.json");if(j.ok!==true)throw Error("SIGNALS not ready: "+JSON.stringify(j));if(!Array.isArray(j.signals))throw Error("signals missing");console.log("SIGNALS_OK",j.signals.length)'

      - name: Snapshot current www custom-domain owner
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/domains" -o /tmp/domains-before.json
          jq --arg h "$WWW_HOST" '[.result[]? | select(.hostname==$h)][0] // null' /tmp/domains-before.json | tee /tmp/www-before.json
          OLD_SERVICE="$(jq -r '.service // empty' /tmp/www-before.json)"
          test -n "$OLD_SERVICE" || { echo '::error::Could not identify existing www Worker owner; refusing cutover'; exit 1; }
          echo "OLD_SERVICE=$OLD_SERVICE" >> "$GITHUB_ENV"
          echo "Rollback owner captured: $OLD_SERVICE"

      - name: Cut over www.nomadtips3.com to 3.43
        id: cutover
        shell: bash
        run: |
          set +e
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          payload="$(jq -nc --arg hostname "$WWW_HOST" --arg service "$PROD_SERVICE" --arg zone_id "$ZONE_ID" --arg zone_name "$ZONE_NAME" '{hostname:$hostname,service:$service,zone_id:$zone_id,zone_name:$zone_name}')"
          code="$(curl -sS "${auth[@]}" -X PUT "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/domains" --data "$payload" -o /tmp/cutover.json -w '%{http_code}')"
          cat /tmp/cutover.json
          if [ "$code" != 200 ] || [ "$(jq -r '.success' /tmp/cutover.json)" != true ]; then
            echo "::error::Cloudflare www cutover failed HTTP=$code"
            exit 1
          fi

      - name: Verify production domain is 3.43 and flow is alive
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 20); do
            code="$(curl -sS --max-time 25 -D /tmp/www-h -o /tmp/www-home -w '%{http_code}' "$CUSTOM_URL/?cutover=${GITHUB_RUN_ID}-${n}" || true)"
            marker="$(awk 'BEGIN{IGNORECASE=1} /^x-nomad-ui-revision:/{gsub(/\r/,"");sub(/^[^:]*:[[:space:]]*/,"");print;exit}' /tmp/www-h)"
            echo "attempt=$n code=$code marker=$marker"
            if [ "$code" = 200 ] && [ "$marker" = "343-bulk-only-v1" ]; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1 || { echo '::error::www did not become healthy NOMAD 3.43'; exit 1; }

          curl -fsS --max-time 30 "$CUSTOM_URL/api/hub/health?verify=${GITHUB_RUN_ID}" -o /tmp/www-hub.json
          node -e 'const j=require("/tmp/www-hub.json");if(j.component!=="5USD_HUB")throw Error("www HUB mismatch");console.log("WWW_HUB_OK",j.ok,"cycle",j.control?.liveRefreshSeconds)'

          curl -fsS --max-time 30 "$CUSTOM_URL/api/engine/board?verify=${GITHUB_RUN_ID}" -o /tmp/www-board.json
          node -e 'const j=require("/tmp/www-board.json");if(j.ok!==true||!Array.isArray(j.fixtures))throw Error("www ENGINE board failed");console.log("WWW_ENGINE_OK fixtures",j.fixtures.length,"age",j.hubAgeMs)'

          curl -fsS --max-time 30 "$CUSTOM_URL/api/engine/signals?verify=${GITHUB_RUN_ID}" -o /tmp/www-signals.json
          node -e 'const j=require("/tmp/www-signals.json");if(j.ok!==true||!Array.isArray(j.signals))throw Error("www signals failed");console.log("WWW_SIGNALS_OK",j.signals.length)'

          for page in index.html signal.html statistics.html settings.html api-monitor.html; do
            curl -fsS --max-time 25 "$CUSTOM_URL/$page?verify=${GITHUB_RUN_ID}" -o "/tmp/$page"
            test -s "/tmp/$page"
          done
          echo 'NOMAD 3.43 production cutover PASS'

      - name: Roll back www to previous Worker if cutover verification fails
        if: ${{ failure() && steps.cutover.outputs.attempted == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${OLD_SERVICE:-}" || { echo '::error::Rollback owner missing'; exit 1; }
          auth=(-H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json')
          payload="$(jq -nc --arg hostname "$WWW_HOST" --arg service "$OLD_SERVICE" --arg zone_id "$ZONE_ID" --arg zone_name "$ZONE_NAME" '{hostname:$hostname,service:$service,zone_id:$zone_id,zone_name:$zone_name}')"
          curl -fsS "${auth[@]}" -X PUT "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/domains" --data "$payload" -o /tmp/rollback.json
          cat /tmp/rollback.json
          test "$(jq -r '.success' /tmp/rollback.json)" = true
          echo "Rollback completed: www -> $OLD_SERVICE"
