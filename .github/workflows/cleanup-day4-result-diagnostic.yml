name: Cleanup Day 4 Result Diagnostic

on:
  push:
    paths:
      - ".github/workflows/cleanup-day4-result-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove one-time result diagnostic
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fetch-day4-remaining-results.yml day4-remaining-results.json
          rm -f .github/workflows/cleanup-day4-result-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-time Day 4 result diagnostic"
          git pull --rebase origin main
          git push
