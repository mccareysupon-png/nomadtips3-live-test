name: BALL46 1x2 incumbent and Poisson Control TEST
on:
  push:
    branches: [feature/ball46-adaptive-manual-control-test-20261125]
    paths: ['.github/workflows/b46-1x2-incumbent-control-test-deploy-20261126.yml']
permissions:
  contents: read
concurrency:
  group: ball46-ft-phase1-phase2-guarded-oneoff-20261126
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Install browser QA
        run: |
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
      - name: Deploy isolated TEST, verify E01 and owner access, roll back on failure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'E01_JS'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import {chromium,devices} from 'playwright';
          const worker='ball46-prematch-only-test-20261120', candidate='a9851595-511d-4e1a-9e7b-d98d4c1ca559', prior='e568b27b-7d69-47e7-80ac-38248aeb71e6';
          const {CLOUDFLARE_API_TOKEN:token,CLOUDFLARE_ACCOUNT_ID:account}=process.env;
          assert(token&&account);
          const base='https://'+worker+'.mccarey-supon.workers.dev';
          const cf='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/';
          const protectedNames=['ball46-production','nomadtips3-5usd-hub-343','nomadtips3-engine-343','ball46-premium-match-colors-test-20261120'];
          const owner='Bearer '+crypto.createHmac('sha256',token).update('BALL46_PREMATCH_ONLY_V1').digest('hex');
          let activated=false, stats={status:'FAILED',candidate,prior,providerCalls:0,productionWrites:0};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function request(url,init={}){return fetch(url,{...init,redirect:'error',signal:AbortSignal.timeout(20000)});}
          async function cloud(w,path,init={}){
           const r=await request(cf+w+path,{...init,headers:{authorization:'Bearer '+token,...init.headers}});
           const d=await r.json(); if(!r.ok||d.success!==true)throw Error((init.method??'GET')+' '+path+' HTTP '+r.status);
           return d.result;
          }
          async function active(w){const v=(await cloud(w,'/deployments')).deployments[0].versions;assert.equal(v.length,1);assert.equal(v[0].percentage,100);return v[0].version_id;}
          async function activate(id,msg){
           return (await cloud(worker,'/deployments',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({strategy:'percentage',code_update_strategy:{mode:'deferred',max_delay:25},versions:[{version_id:id,percentage:100}],annotations:{'workers/message':msg}})})).id;
          }
          const protectedVersions=()=>Promise.all(protectedNames.map(active));
          async function control(){const r=await request(base+'/adaptive-control-api-test',{headers:{authorization:owner,accept:'application/json'}});assert.equal(r.status,200,'AUTHORIZED_CONTROL_GET');return r.json();}
          try {
           assert.equal(process.env.GITHUB_RUN_ATTEMPT,'1','ONE_TIME_DEPLOY_ONLY');
           assert.equal(await active(worker),prior,'BASELINE_DRIFT');
           const [a,b,guards,dash]=await Promise.all([cloud(worker,'/versions/'+prior),cloud(worker,'/versions/'+candidate),protectedVersions(),control()]);
           assert.equal(dash.formulas.length,42,'OLD_CONTROL_COUNT');
           for(const field of ['bindings','script_runtime'])assert.deepEqual(a.resources[field],b.resources[field]);
           for(const field of ['handlers','named_handlers'])assert.deepEqual(a.resources.script[field],b.resources.script[field]);
           stats.deployment=await activate(candidate,'BALL46 Control TEST add existing 1x2 stats next to Poisson');activated=true;
           let live;
           for(let i=0;i<17;i++){
             try{const d=await control();if(d?.extraFormula?.formula==='E01'&&d.formulas?.length===42&&d.incumbent1x2?.model==='market-anchored-1x2-v1'){live=d;break;}}catch(e){}
             await sleep(3500);
           }
           assert(live,'E01_CONTROL_DID_NOT_UPDATE');
           const [page,denied,guardAfter]=await Promise.all([request(base+'/adaptive-control-test'),request(base+'/adaptive-control-api-test'),protectedVersions()]);
           assert.equal(page.status,200);
           const html=await page.text();for(const mark of ['b46-e01-panel','b46-e01-run','b46-e01-pause','b46-e01-metrics','ทุก 42 สูตร','pm-legacy1x2-stats','pm-1x2-paired-rows','pm-p01-run'])assert(html.includes(mark),'UI_MISSING_'+mark);
           assert.equal(denied.status,401,'OWNER_AUTH_REGRESSION');
           assert.deepEqual(guardAfter,guards,'PROTECTED_DEPLOYMENT_DRIFT');
           assert.equal(await active(worker),candidate,'NEW_TEST_NOT_ACTIVE');
           const e=live.extraFormula;
           assert(['RUN','PAUSED_MANUAL'].includes(e.mode));assert.equal(e.formula,'E01');
          const m=live.incumbent1x2;assert(m.total>0&&m.pricedSettled>0&&m.win+m.loss===m.settled&&m.avgOdds>1);
          assert.equal(live.poissonFormula.formula,'P01');
          const browser=await chromium.launch({headless:true});
          try{
            for(const [name,opts] of [['PC',{viewport:{width:1440,height:900}}],['mobile',{...devices['Pixel 7'],defaultBrowserType:'chromium'}]]){
              const ctx=await browser.newContext(opts);const p=await ctx.newPage();
              await p.addInitScript(k=>{if(location.hostname.includes('ball46-prematch-only-test-20261120'))sessionStorage.setItem('b46_ac_key',k);},owner.slice('Bearer '.length));
              await p.goto(base+'/adaptive-control-test',{waitUntil:'domcontentloaded',timeout:35000});
              await p.getByRole('button',{name:'1×2',exact:true}).click({timeout:15000});
              await p.locator('#pm-legacy1x2-stats .card').first().waitFor({state:'visible',timeout:12000});
              assert.equal(await p.locator('#pm-legacy1x2-stats .card').count(),8);
              assert.equal(await p.locator('#pm-1x2-paired-rows tr').count(),2);
              assert(await p.locator('#pm-p01-panel').isVisible());
              await p.getByRole('button',{name:'Over/Under',exact:true}).click();assert(await p.locator('#b46-wld-totals').isVisible());
              (stats.browser??=[]).push(name);await ctx.close();
            }
          } finally {await browser.close();}
          stats.incumbent={total:m.total,settled:m.settled,mode:m.mode};stats.poissonMode=live.poissonFormula.mode;
           assert.equal(live.summary.total,42);assert.equal(live.providerCalls,0);assert.equal(live.productionWrites,0);
           stats={...stats,status:'PASS',e01:e,legacyControlCount:live.formulas.length,ownerAuthVerified:true,protectedVersionsUnchanged:true};
          } catch(e){
           stats.error=e.message;
           if(activated&&await active(worker)===candidate){
            stats.rollback=await activate(prior,'Rollback E01 TEST verification failure');
            stats.previousRestored=await active(worker)===prior;
           }
           process.exitCode=1;
          }
          console.log('B46_1X2_INC_CONTROL_DEPLOY '+JSON.stringify(stats));
          E01_JS
