name: Test BALL46 Pin V2 Mobile Star Fix 20261112
on:
  push:
    branches: [test/ball46-pinned-fixtures-v2-20261111]
    paths: ['pinned-fixtures-v2/MOBILE_STAR_FIX_READY']
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: test/ball46-pinned-fixtures-v2-20261111}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install chromium
      - run: node pinned-fixtures-v2/mobile-star-fix-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-star-fix-${{ github.run_id }}
          path: pinned-fixtures-v2/mobile-star-green-fix.png
          retention-days: 7
