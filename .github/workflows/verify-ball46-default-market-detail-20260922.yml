name: Verify Ball46 Default Market Detail 20260922

on:
  push:
    branches: [work/ball46-default-market-detail-20260922]
    paths:
      - '.github/workflows/verify-ball46-default-market-detail-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  BALL46_PUBLIC: https://www.ball46.com

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify worker HTML and assets
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          echo 'CHECK:index markers'
          curl -fsS -L --retry 6 --retry-all-errors --retry-delay 2 --max-time 35 "$BALL46_WORKER/index.html?verify-market-detail=$stamp" -o /tmp/index.html
          grep -Fq 'dashboard-v2-stage3.js?v=343-market-detail-20260922a' /tmp/index.html
          grep -Fq 'dashboard-v2.css?v=343-market-detail-20260922a' /tmp/index.html
          echo 'CHECK:asset fetch'
          curl -fsS -L --retry 6 --retry-all-errors --retry-delay 2 --max-time 35 "$BALL46_WORKER/dashboard-v2-stage3.js?verify-market-detail=$stamp" -o /tmp/dashboard.js
          curl -fsS -L --retry 6 --retry-all-errors --retry-delay 2 --max-time 35 "$BALL46_WORKER/dashboard-v2.css?verify-market-detail=$stamp" -o /tmp/dashboard.css
          echo 'CHECK:javascript syntax'
          node --check /tmp/dashboard.js
          echo 'CHECK:structured market renderer'
          grep -Fq 'market-prices-1x2' /tmp/dashboard.js
          grep -Fq 'market-prices-ah' /tmp/dashboard.js
          grep -Fq 'market-prices-ou' /tmp/dashboard.js
          grep -Fq "kind:'1X2'" /tmp/dashboard.js
          grep -Fq "kind:'AH'" /tmp/dashboard.js
          grep -Fq "kind:'OU'" /tmp/dashboard.js
          echo 'CHECK:layout marker'
          grep -Fq 'BALL46_DEFAULT_MARKET_DETAIL_20260922' /tmp/dashboard.css
          grep -Fq '.market-price-row' /tmp/dashboard.css
          grep -Fq 'overflow:hidden' /tmp/dashboard.css
          echo 'WORKER_MARKET_DETAIL_OK'

      - name: Verify engine APIs
        shell: bash
        run: |
          set -euo pipefail
          stamp="${GITHUB_RUN_ID}-$(date +%s)"
          curl -fsS -L --retry 6 --retry-all-errors --retry-delay 2 --max-time 35 "$BALL46_WORKER/api/engine/board?verify-market-detail=$stamp" -o /tmp/board.json
          curl -fsS -L --retry 6 --retry-all-errors --retry-delay 2 --max-time 35 "$BALL46_WORKER/api/engine/signals?verify-market-detail=$stamp" -o /tmp/signals.json
          curl -fsS -L --retry 6 --retry-all-errors --retry-delay 2 --max-time 35 "$BALL46_WORKER/api/engine/statistics?verify-market-detail=$stamp" -o /tmp/stats.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/board.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals.json','utf8'));
          const t=JSON.parse(fs.readFileSync('/tmp/stats.json','utf8'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures))throw Error('BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals))throw Error('SIGNALS_UNHEALTHY');
          if(t?.ok!==true||!Array.isArray(t?.rows))throw Error('STATISTICS_UNHEALTHY');
          console.log('BALL46_MARKET_DETAIL_API_OK',{fixtures:b.fixtures.length,signals:s.signals.length,stats:t.rows.length});
          NODE

      - name: Verify public propagation
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 15); do
            if curl -fsS -L --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 "$BALL46_PUBLIC/?verify-market-detail=${GITHUB_RUN_ID}-$n" -o /tmp/public.html \
              && grep -Fq 'dashboard-v2-stage3.js?v=343-market-detail-20260922a' /tmp/public.html \
              && grep -Fq 'dashboard-v2.css?v=343-market-detail-20260922a' /tmp/public.html; then
              ok=1
              break
            fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo 'PUBLIC_PROPAGATION_FAILED'; exit 1; }
          echo 'PUBLIC_MARKET_DETAIL_OK'
