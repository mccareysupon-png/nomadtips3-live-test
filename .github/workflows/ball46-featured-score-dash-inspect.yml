name: BALL46 Featured Score Dash READ ONLY
on:
  push:
    branches: [fix/ball46-featured-score-dash-20261023]
    paths:
      - .github/workflows/ball46-featured-score-dash-inspect.yml
      - deploy-assets/featured-score-dash-20261023/inspect.mjs
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read live Worker source and rendered featured score rules
        run: |
          node --check deploy-assets/featured-score-dash-20261023/inspect.mjs
          node deploy-assets/featured-score-dash-20261023/inspect.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: featured-score-dash-readonly-${{ github.run_id }}
          path: deploy-assets/featured-score-dash-20261023/audit/
          retention-days: 14
