name: BALL46 BTTS Team Fallback Backend TEST Deploy ONLY
on:
  push:
    branches: [fix/ball46-btts-backend-only-test-20261122]
    paths: [.github/workflows/b46-btts-team-fallback-only-deploy-test-20261122.yml]
permissions:
  contents: read
concurrency:
  group: ball46-prematch-only-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify strict BTTS-only team fallback and original markets
        run: |
          node --check qa/prematch-history-20261120/deploy-btts-team-fallback-only-test-20261122.mjs
          node --check qa/prematch-history-20261120/prematch-only-worker.mjs
          node --test qa/prematch-history-20261120/btts-history-private.test.mjs qa/prematch-history-20261120/btts-ultra-shadow.test.mjs qa/prematch-history-20261120/market-1x2.test.mjs qa/prematch-history-20261120/test-pick-ledger.test.mjs qa/prematch-history-20261120/history-cargo-registry.test.mjs
      - name: Deploy only two BTTS backend modules, preserve frontend/HCR/1X2
        run: node qa/prematch-history-20261120/deploy-btts-team-fallback-only-test-20261122.mjs
