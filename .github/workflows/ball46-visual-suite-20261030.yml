name: BALL46 visual suite guarded release
on:
  push:
    branches: [codex/ball46-visual-suite-20261030]
    paths: ['deploy-assets/visual-suite-20261030/request.json']
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run approved guarded phase
        working-directory: deploy-assets/visual-suite-20261030
        run: |
          phase=$(node -p "JSON.parse(require('fs').readFileSync('request.json')).phase")
          if [ "$phase" = "preflight" ]; then node preflight.mjs; else node run.mjs; fi
      - name: Commit sanitized audit
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy-assets/visual-suite-20261030/audit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record visual suite release audit [skip ci]"
          git fetch origin codex/ball46-visual-suite-20261030
          git rebase FETCH_HEAD
          git push origin HEAD:codex/ball46-visual-suite-20261030
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-suite-${{ github.run_id }}
          path: deploy-assets/visual-suite-20261030/audit
