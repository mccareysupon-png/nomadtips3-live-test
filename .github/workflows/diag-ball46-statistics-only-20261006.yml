name: DIAG Ball46 Statistics Only 20261006

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-ball46-statistics-only-20261006.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Capture current public Statistics assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ball46-statistics-current
          curl -fsS -L --max-time 30 'https://ball46.com/statistics-next.js?capture='${GITHUB_RUN_ID} -o /tmp/ball46-statistics-current/statistics-next.js
          curl -fsS -L --max-time 30 'https://ball46.com/statistics.html?capture='${GITHUB_RUN_ID} -o /tmp/ball46-statistics-current/statistics.html
          sha256sum /tmp/ball46-statistics-current/statistics-next.js /tmp/ball46-statistics-current/statistics.html

      - name: Upload current Statistics assets
        uses: actions/upload-artifact@v4
        with:
          name: ball46-statistics-current-${{ github.run_id }}
          path: /tmp/ball46-statistics-current
          if-no-files-found: error
          retention-days: 7

      - name: Inspect Statistics only read-only
        shell: bash
        run: |
          set -euo pipefail
          echo "STATISTICS_ONLY_DIAG_START"

          node - <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const engine='nomadtips3-engine-343';
          const root=`https://api.cloudflare.com/client/v4/accounts/${account}/workers`;

          async function cf(path){
            const r=await fetch(root+path,{headers:{Authorization:`Bearer ${token}`},signal:AbortSignal.timeout(30000)});
            const j=await r.json();
            if(!r.ok||j.success!==true) throw new Error(`CF_${r.status}:${JSON.stringify(j.errors||[])}`);
            return j.result;
          }
          async function get(url){
            const u=new URL(url);u.searchParams.set('_diag',Date.now());
            const r=await fetch(u,{cache:'no-store',headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(30000)});
            const text=await r.text();
            let json=null;try{json=JSON.parse(text)}catch{}
            return {url:String(u),status:r.status,bytes:text.length,text,json};
          }

          const deployments=await cf(`/scripts/${engine}/deployments`);
          const versions=deployments.deployments?.[0]?.versions||[];
          console.log('ENGINE_ACTIVE',JSON.stringify(versions));

          const urls=[
            ['PUBLIC_STATS','https://ball46.com/api/engine/statistics'],
            ['DIRECT_STATS','https://nomadtips3-engine-343.mccarey-supon.workers.dev/statistics'],
            ['PUBLIC_SUMMARY','https://ball46.com/api/engine/statistics?view=summary'],
            ['PUBLIC_STATS_PAGE','https://ball46.com/statistics.html'],
            ['PUBLIC_STATS_JS','https://ball46.com/statistics-next.js']
          ];
          for(const [name,url] of urls){
            const x=await get(url);
            const j=x.json;
            console.log(name,'HTTP',x.status,'BYTES',x.bytes);
            if(j){
              console.log(name,'JSON',JSON.stringify({
                ok:j.ok,
                version:j.version,
                total:j.total,
                ledgerTotal:j.ledgerTotal,
                pending:j.pending,
                unresolved:j.unresolved,
                win:j.win,
                loss:j.loss,
                push:j.push,
                rows:Array.isArray(j.rows)?j.rows.length:null,
                returned:j.returned,
                statisticsPagination:j.statisticsPagination,
                statisticsSummary:j.statisticsSummary,
                statisticsRows:j.statisticsRows,
                nextCursor:!!j.nextCursor
              }));
            }else{
              console.log(name,'HEAD',JSON.stringify(x.text.slice(0,1200)));
              if(name==='PUBLIC_STATS_PAGE'){
                const assets=[...x.text.matchAll(/(?:src|href)=["']([^"'?#]+)(?:\?[^"']*)?["']/g)].map(m=>m[1]).filter(v=>/statistics|\.js$|\.css$/i.test(v));
                console.log('STATS_PAGE_ASSETS',JSON.stringify([...new Set(assets)]));
              }
            }
          }
          const page=await get('https://ball46.com/statistics.html');
          const js=await get('https://ball46.com/statistics-next.js');
          const crypto=await import('node:crypto');
          const digest=s=>crypto.createHash('sha256').update(s).digest('hex');
          console.log('PUBLIC_STATS_ASSET_SHA',JSON.stringify({html:digest(page.text),js:digest(js.text),htmlBytes:page.text.length,jsBytes:js.text.length}));
          const selectors=['data-next-total','data-next-win','data-next-loss','data-next-win-rate','data-next-avg-odds','data-next-stat-markets','data-next-stat-body','data-next-stat-state'];
          console.log('STATS_HTML_SELECTORS',JSON.stringify(Object.fromEntries(selectors.map(s=>[s,page.text.includes(s)]))));
          const patterns=['view=summary','view=rows','paged=1','STAT_CACHE_KEY','lastStatsPayload','fetch(\`\${STAT_API}?_=',"const SIGNAL_API='/api/engine/signals'",'renderStats(sj)','Statistics feed unavailable'];
          console.log('STATS_JS_PATTERNS2',JSON.stringify(Object.fromEntries(patterns.map(s=>[s,js.text.includes(s)]))));
          try{new Function(js.text);console.log('STATS_JS_SYNTAX','PASS')}catch(e){console.log('STATS_JS_SYNTAX','FAIL',String(e))}
          console.log('STATISTICS_ONLY_DIAG_DONE');
          NODE
