name: Goaloo Odds Mapping Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goaloo-odds-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate one-day candidate sanity guards
        shell: python
        run: |
          import json, re, requests

          feed_url='https://raw.githubusercontent.com/mccareysupon-png/nomadtips3-live-test/9d0a581215a2f6a5f394040fc0b0b5c0d55579f6/the-king-feed.json'
          odds_url='https://live10.goaloo28.com/gf/data/odds/en/goal50.xml'
          headers={'User-Agent':'Mozilla/5.0'}
          feed=requests.get(feed_url,timeout=20,headers=headers).json()
          text=requests.get(odds_url,timeout=20,headers=headers).text

          odds={}
          for m in re.finditer(r'<m>([^<]+)</m>',text):
              row=[x.strip() for x in m.group(1).split(',')]
              if len(row)<9 or not row[0].isdigit():
                  continue
              try:
                  h,d,a=float(row[6]),float(row[7]),float(row[8])
              except Exception:
                  continue
              odds[row[0]]={'home':h,'draw':d,'away':a}

          picks=feed.get('today') or []
          print('snapshot picks',len(picks))

          def model_edge(p):
              model=p.get('model') or {}
              vals=[float(model.get(k) or 0) for k in ('home_win','draw','away_win')]
              vals.sort(reverse=True)
              return vals[0]-vals[1] if len(vals)>=2 else 0

          def base_guard(p):
              q=p.get('data_quality') or {}
              return (
                  float(p.get('confidence') or 0)>=0.40 and
                  1.88<=float(p.get('odds') or 0)<=3.00 and
                  int(q.get('home_recent') or 0)>=8 and
                  int(q.get('away_recent') or 0)>=8
              )

          variants={
              'A_base_40_1.88_to_3_recent8': [],
              'B_base_plus_model_edge12': [],
              'C_base_plus_market_favorite': [],
              'D_base_plus_edge12_plus_market_favorite': [],
          }

          for p in picks:
              if not base_guard(p):
                  continue
              variants['A_base_40_1.88_to_3_recent8'].append(p)
              if model_edge(p)>=0.12:
                  variants['B_base_plus_model_edge12'].append(p)
              m=odds.get(str(p.get('goaloo_id') or ''))
              selected=p.get('side')
              is_favorite=bool(m and selected in ('home','away') and m[selected]==min(m.values()))
              if is_favorite:
                  variants['C_base_plus_market_favorite'].append(p)
              if is_favorite and model_edge(p)>=0.12:
                  variants['D_base_plus_edge12_plus_market_favorite'].append(p)

          for name,items in variants.items():
              print('\n',name,'COUNT',len(items))
              for p in items[:30]:
                  print(f"  {p['home']} vs {p['away']} | {p['pick']} | conf={float(p['confidence'])*100:.1f}% | odds={p['odds']:.2f} | modelEdge={model_edge(p)*100:.1f}pp | id={p['goaloo_id']}")
