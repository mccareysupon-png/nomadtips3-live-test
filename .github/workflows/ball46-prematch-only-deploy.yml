name: BALL46 isolated prematch store deployment
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-prematch-only-deploy.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: ball46-prematch-only-test
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: real-finished-history
          path: evidence/history
          run-id: 44723780062
          github-token: ${{ github.token }}
      - name: Deploy isolated store and persist actual results
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node qa/prematch-history-20261120/prematch-only-deploy.mjs
