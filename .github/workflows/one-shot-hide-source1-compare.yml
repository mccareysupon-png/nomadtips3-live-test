name: One-shot hide Source 1 compare row

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-hide-source1-compare.yml"

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Hide compare row only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('nomad-live/runtime.js')
          s=p.read_text(encoding='utf-8')
          old="  const sourceOneComparison=bet365?.status?`<div class=\"check\"><span>SOURCE 1 compare · Bet365</span><b class=\"${bet365.status==='AH READY'?'ok':'wait'}\">${bookmakerPriceLine(bet365,'Bet365')} · ${bet365.sourceUpdatedAt?when(bet365.sourceUpdatedAt):'—'}</b></div>`:'';"
          new="  const sourceOneComparison='';"
          if s.count(old) != 1:
              raise SystemExit(f'expected one compare-row renderer, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check nomad-live/runtime.js
          git diff --check
      - name: Commit presentation-only change
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-hide-source1-compare.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nomad-live/runtime.js .github/workflows/one-shot-hide-source1-compare.yml
          git commit -m "Hide duplicate Bet365 compare row from live card"
          git push origin HEAD:main
