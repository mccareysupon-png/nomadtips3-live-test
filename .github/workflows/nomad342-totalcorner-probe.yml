name: NOMAD 3.42 TotalCorner Probe

on:
  push:
    branches:
      - 'feat/342-totalcorner-inlet'
    paths:
      - '.github/workflows/nomad342-totalcorner-probe.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch raw Today HTML
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --compressed --max-time 30 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64 x64) AppleWebKit/537.36 Chrome/151 Safari/537.36' \
            -H 'Accept: text/html,application/xhtml+xml' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            'https://www.totalcorner.com/match/today/' -o /tmp/today.html
          echo "bytes=$(wc -c </tmp/today.html)"
          echo '--- CUSTOM COLUMN CONTEXT ---'
          grep -Ein -C 6 'Shots on Target|Shots off Target|Possession|Events with chart|Customize Columns|Save Default' /tmp/today.html | head -n 260 || true
          echo '--- INPUTS / COLUMN NAMES ---'
          grep -Eio '<input[^>]+>|<select[^>]+>|<option[^>]+>' /tmp/today.html | grep -Ei 'shot|possession|event|column|custom|display|show' | head -n 240 || true
          echo '--- FORM TAGS ---'
          grep -Eio '<form[^>]*>' /tmp/today.html | head -n 120 || true
          echo '--- SCRIPT SRCS ---'
          grep -Eio '<script[^>]+src=["'"'][^"'"']+["'"'][^>]*>' /tmp/today.html | head -n 120 || true
          echo '--- AJAX / STORAGE HINTS ---'
          grep -Ein -C 3 'ajax|XMLHttpRequest|fetch\(|localStorage|cookie|column|customize' /tmp/today.html | tail -n 320 || true
