name: NOMAD 3.42 TotalCorner Probe

on:
  push:
    branches:
      - 'feat/342-totalcorner-inlet'
    paths:
      - '.github/workflows/nomad342-totalcorner-probe.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe TotalCorner public hosts
        shell: bash
        run: |
          set -u
          ua='Mozilla/5.0 (Windows NT 10.0; Win64 x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          probe(){
            name="$1"; url="$2"; file="/tmp/${name}.html"
            echo "=== ${name} ${url} ==="
            code="$(curl -sSL --compressed --max-time 30 -A "$ua" -H 'Accept: text/html,application/xhtml+xml' -H 'Accept-Language: en-US,en;q=0.9' -o "$file" -w '%{http_code}' "$url" || true)"
            echo "http=${code} bytes=$(wc -c <"$file" 2>/dev/null || echo 0)"
            if [ -s "$file" ]; then
              grep -Ein -m 8 'Live Events|Shoot on target|Shots on Target|Possession|Customize Columns|Access denied|Forbidden' "$file" || true
              echo 'scripts:'
              grep -Eio '<script[^>]+src=["'"'][^"'"']+["'"'][^>]*>' "$file" | head -n 40 || true
            fi
          }
          probe www_today 'https://www.totalcorner.com/match/today/'
          probe publift_today 'https://publift.totalcorner.com/match/today/'
          probe www_stats 'https://www.totalcorner.com/stats/shelbourne-vs-ajax/198821835'
          probe publift_stats 'https://publift.totalcorner.com/stats/shelbourne-vs-ajax/198821835'
