name: NOMAD 3.42 TotalCorner Probe

on:
  push:
    branches:
      - 'feat/342-totalcorner-inlet'
    paths:
      - '.github/workflows/nomad342-totalcorner-probe.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe deployed 3.42 Worker
        shell: bash
        run: |
          set -u
          base='https://nomadtips3-live-engine-342-test.mccarey-supon.workers.dev'
          for path in '/health' '/contract' '/feed?force=1'; do
            echo "=== WORKER ${path} ==="
            body=/tmp/worker.json
            code="$(curl -sS --max-time 40 -o "$body" -w '%{http_code}' "${base}${path}" || true)"
            echo "http=${code} bytes=$(wc -c <"$body" 2>/dev/null || echo 0)"
            if [ -s "$body" ]; then
              node - "$path" "$body" <<'NODE' || { head -c 4000 "$body"; echo; }
          const fs=require('fs');
          const path=process.argv[2],file=process.argv[3];
          const j=JSON.parse(fs.readFileSync(file,'utf8'));
          if(path.startsWith('/feed')){
            const matches=Array.isArray(j.matches)?j.matches:[];
            const sample=matches.slice(0,5).map(m=>({id:m.id,home:m.home,away:m.away,minute:m.minute,score:m.score,source:m.source,last:m.event?.snapshots?.at?.(-1)}));
            console.log(JSON.stringify({ok:j.ok,version:j.version,updatedAt:j.updatedAt,source:j.source,counts:j.counts,detailErrors:j.detailErrors,lastError:j.lastError,sample},null,2));
          }else console.log(JSON.stringify(j,null,2).slice(0,12000));
          NODE
            fi
          done
