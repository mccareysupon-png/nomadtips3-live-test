name: Diagnose Ball46 Signal Asset Graph 20260919

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ball46-three-fix-20260919.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_URL: https://ball46.com

jobs:
  diagnose-production-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect live Page 2 and Page 3 assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L "$BALL46_URL/signal.html?diag=${GITHUB_RUN_ID}" -o /tmp/signal.html
          curl -fsS -L "$BALL46_URL/statistics.html?diag=${GITHUB_RUN_ID}" -o /tmp/statistics.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in ['/tmp/signal.html','/tmp/statistics.html']:
              text=Path(path).read_text(errors='replace')
              print('\n===',Path(path).name,'===')
              refs=re.findall(r'(?:href|src)=["\']([^"\']+)["\']',text,re.I)
              for ref in refs:
                  if '.css' in ref or '.js' in ref: print(ref)
              print('HAS_LIVE_MATCH_STATISTICS=', 'LIVE MATCH STATISTICS' in text)
              print('HAS_LIVE_SIGNAL_TRACKER=', 'Live Signal Tracker' in text)
          PY
          echo '=== CANDIDATE HTTP ==='
          for f in signal.js event-flow-343.js event-flow-343.css team-sides-343.css signal-compact-343.css signal-v2-clean-343.css statistics-v2-clean-343.css; do
            code=$(curl -sS -L -o "/tmp/${f//\//_}" -w '%{http_code}' "$BALL46_URL/$f?diag=${GITHUB_RUN_ID}") || true
            ctype=$(curl -sSI -L "$BALL46_URL/$f?diag=${GITHUB_RUN_ID}" | tr -d '\r' | awk 'BEGIN{IGNORECASE=1}/^content-type:/{print $0}' | tail -1 || true)
            echo "$f | $code | $ctype"
          done
          echo '=== SIGNAL BAR SELECTORS IN LIVE CSS CANDIDATES ==='
          for f in /tmp/*.css; do
            [ -f "$f" ] || continue
            if grep -Eq 'signal-mirror-row|signal-mirror-half|nomad-flow-line|team-away-name' "$f"; then
              echo "--- $(basename "$f") ---"
              grep -Eo '.{0,90}(signal-mirror-row|signal-mirror-half|nomad-flow-line|team-away-name).{0,160}' "$f" | head -20 || true
            fi
          done
