name: ONE SHOT - Ball46 Long-Term Realtime Statistics Ledger V2 20261003

on:
  push:
    branches: ['ops/ball46-stat-ledger-20261003']
    paths:
      - '.github/workflows/ball46-stat-ledger-v2-deploy-20261003.yml'

permissions:
  contents: read

concurrency:
  group: ball46-engine-production
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}

jobs:
  deploy-ledger-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ball46-stat-ledger-20261003
          fetch-depth: 1
      - name: Deploy and verify realtime long-term statistics ledger
        shell: bash
        run: bash .github/scripts/ball46_stat_ledger_v2_deploy_20261003.sh
