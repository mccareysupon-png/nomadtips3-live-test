name: Deploy S8 Sidecar Canary

on:
  push:
    branches: [feature/s8-external-sidecar-canary]
    paths:
      - "workers/nomadtips3-s8-sidecar/**"
      - ".github/workflows/s8-sidecar-canary-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}

jobs:
  deploy-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify sidecar source only
        id: sourcecheck
        working-directory: workers/nomadtips3-s8-sidecar
        run: |
          node --check src/index.js
          test "$(node -e "const c=require('./package.json'); process.stdout.write(c.name)")" = "nomadtips3-s8-sidecar"

      - name: Validate canary secrets
        id: validate
        shell: bash
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$FIVEDOLLAR_API_KEY" || { echo "::error::Missing FIVEDOLLAR_API_KEY in GitHub Actions secrets"; exit 1; }

      - name: Deploy isolated S8 Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: workers/nomadtips3-s8-sidecar
          wranglerVersion: "4"
          command: deploy
          secrets: |
            FIVEDOLLAR_API_KEY
        env:
          FIVEDOLLAR_API_KEY: ${{ env.FIVEDOLLAR_API_KEY }}

      - name: Verify isolated health contract
        id: health
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL" || { echo "::error::No deployment URL"; exit 1; }
          BODY=$(curl -fsS --max-time 10 "$DEPLOYMENT_URL/health")
          printf '%s\n' "$BODY"
          printf '%s' "$BODY" | grep -q '"sourceId":"source8"'
          printf '%s' "$BODY" | grep -q '"isolated":true'
          printf '%s' "$BODY" | grep -q '"touchesLegacySources":false'
          printf '%s' "$BODY" | grep -q '"keyConfigured":true'

      - name: Record canary result on test branch
        if: ${{ always() }}
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          SOURCECHECK: ${{ steps.sourcecheck.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          HEALTH: ${{ steps.health.outcome }}
        run: |
          mkdir -p canary-status
          CF_TOKEN_PRESENT=false; [ -n "$CF_API_TOKEN" ] && CF_TOKEN_PRESENT=true
          CF_ACCOUNT_PRESENT=false; [ -n "$CF_ACCOUNT_ID" ] && CF_ACCOUNT_PRESENT=true
          FD_KEY_PRESENT=false; [ -n "$FIVEDOLLAR_API_KEY" ] && FD_KEY_PRESENT=true
          cat > canary-status/s8-deploy.json <<EOF
          {
            "worker": "nomadtips3-s8-sidecar",
            "branch": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "utc": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')",
            "sourceCheck": "${SOURCECHECK:-unknown}",
            "secretValidation": "${VALIDATE:-unknown}",
            "cloudflareTokenPresent": ${CF_TOKEN_PRESENT},
            "cloudflareAccountPresent": ${CF_ACCOUNT_PRESENT},
            "fiveDollarKeyPresent": ${FD_KEY_PRESENT},
            "deploy": "${DEPLOY:-not-run}",
            "health": "${HEALTH:-not-run}",
            "deploymentUrl": "${DEPLOYMENT_URL:-}",
            "touchesLegacySources": false
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canary-status/s8-deploy.json
          git commit -m "Record S8 canary deploy status [skip ci]" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Safety notice
        if: ${{ success() }}
        run: |
          echo "S8 canary deployed as a separate Worker only."
          echo "NOMAD 3.41 legacy Worker and S1-S7 were not deployed or modified by this workflow."
