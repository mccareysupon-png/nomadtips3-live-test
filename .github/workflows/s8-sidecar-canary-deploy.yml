name: Deploy S8 Sidecar Canary

on:
  push:
    branches: [feature/s8-external-sidecar-canary]
    paths:
      - "workers/nomadtips3-s8-sidecar/**"
      - ".github/workflows/s8-sidecar-canary-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "workers/nomadtips3-s8-sidecar/**"
      - ".github/workflows/s8-sidecar-canary-deploy.yml"
  workflow_dispatch:

concurrency:
  group: s8-sidecar-canary
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}

jobs:
  deploy-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify sidecar source only
        id: sourcecheck
        working-directory: workers/nomadtips3-s8-sidecar
        run: |
          node --check src/index.js
          test "$(node -e "const c=require('./package.json'); process.stdout.write(c.name)")" = "nomadtips3-s8-sidecar"

      - name: Validate canary secrets
        id: validate
        shell: bash
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$FIVEDOLLAR_API_KEY" || { echo "::error::Missing FIVEDOLLAR_API_KEY in GitHub Actions secrets"; exit 1; }

      - name: Deploy isolated S8 Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: workers/nomadtips3-s8-sidecar
          wranglerVersion: "4"
          command: deploy
          secrets: |
            FIVEDOLLAR_API_KEY
        env:
          FIVEDOLLAR_API_KEY: ${{ env.FIVEDOLLAR_API_KEY }}

      - name: Wait for isolated health contract
        id: health
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL" || { echo "::error::No deployment URL"; exit 1; }
          : > /tmp/s8-health.json
          sleep 5
          for i in $(seq 1 30); do
            HTTP=$(curl -sS -o /tmp/s8-health.json -w '%{http_code}' --max-time 10 "$DEPLOYMENT_URL/health" || true)
            if [ "$HTTP" = "200" ] && \
               grep -q '"sourceId":"source8"' /tmp/s8-health.json && \
               grep -q '"isolated":true' /tmp/s8-health.json && \
               grep -q '"touchesLegacySources":false' /tmp/s8-health.json && \
               grep -q '"keyConfigured":true' /tmp/s8-health.json && \
               grep -q '"batchMaxMatches":2' /tmp/s8-health.json && \
               grep -q '"maxVendorRequestsPerBatchWindow":3' /tmp/s8-health.json; then
              echo "S8 health PASS on attempt $i"
              cat /tmp/s8-health.json
              exit 0
            fi
            echo "health not ready: attempt=$i http=$HTTP"
            sleep 3
          done
          echo "::error::S8 health contract did not become ready"
          cat /tmp/s8-health.json || true
          exit 1

      - name: Run bounded S8 live probe
        id: probe
        if: ${{ steps.health.outcome == 'success' }}
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          HTTP=$(curl -sS -o /tmp/s8-probe.json -w '%{http_code}' --max-time 30 "$DEPLOYMENT_URL/probe" || true)
          echo "probe http=$HTTP"
          cat /tmp/s8-probe.json || true
          test "$HTTP" = "200" || { echo "::error::S8 probe endpoint HTTP $HTTP"; exit 1; }
          grep -q '"sourceId":"source8"' /tmp/s8-probe.json
          grep -q '"isolated":true' /tmp/s8-probe.json
          grep -q '"touchesLegacySources":false' /tmp/s8-probe.json
          grep -q '"maxVendorRequestsPerProbeWindow":2' /tmp/s8-probe.json

      - name: Verify bounded POST quotes contract
        id: batch
        if: ${{ steps.probe.outcome == 'success' }}
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const probe=JSON.parse(fs.readFileSync('/tmp/s8-probe.json','utf8'));
          const sample=Array.isArray(probe.samples)?probe.samples[0]:null;
          const matches=sample?.home&&sample?.away?[{clientId:'canary-1',home:sample.home,away:sample.away}]:[];
          fs.writeFileSync('/tmp/s8-batch-request.json',JSON.stringify({matches}));
          NODE
          HTTP=$(curl -sS -o /tmp/s8-batch.json -w '%{http_code}' --max-time 30 \
            -H "content-type: application/json" \
            -X POST "$DEPLOYMENT_URL/quotes" \
            --data-binary @/tmp/s8-batch-request.json || true)
          echo "batch http=$HTTP"
          cat /tmp/s8-batch.json || true
          test "$HTTP" = "200" || { echo "::error::S8 batch endpoint HTTP $HTTP"; exit 1; }
          grep -q '"sourceId":"source8"' /tmp/s8-batch.json
          grep -q '"isolated":true' /tmp/s8-batch.json
          grep -q '"touchesLegacySources":false' /tmp/s8-batch.json
          grep -q '"maxBatch":2' /tmp/s8-batch.json
          grep -q '"maxVendorRequestsPerBatchWindow":3' /tmp/s8-batch.json

      - name: Report canary evidence to PR 160
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          SOURCECHECK: ${{ steps.sourcecheck.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          HEALTH: ${{ steps.health.outcome }}
          PROBE: ${{ steps.probe.outcome }}
          BATCH: ${{ steps.batch.outcome }}
        run: |
          [ -s /tmp/s8-health.json ] || printf '%s\n' '{"status":"not_available"}' > /tmp/s8-health.json
          [ -s /tmp/s8-probe.json ] || printf '%s\n' '{"status":"not_available"}' > /tmp/s8-probe.json
          [ -s /tmp/s8-batch.json ] || printf '%s\n' '{"status":"not_available"}' > /tmp/s8-batch.json
          HEALTH_JSON=$(cat /tmp/s8-health.json)
          PROBE_JSON=$(cat /tmp/s8-probe.json)
          BATCH_JSON=$(cat /tmp/s8-batch.json)
          BODY=$(cat <<EOF
          S8 CANARY EVIDENCE

          sourceCheck=${SOURCECHECK:-unknown}
          secretValidation=${VALIDATE:-unknown}
          deploy=${DEPLOY:-unknown}
          health=${HEALTH:-unknown}
          probe=${PROBE:-unknown}
          batch=${BATCH:-unknown}
          deploymentUrl=${DEPLOYMENT_URL:-}
          touchesLegacySources=false

          healthPayload:
          ${HEALTH_JSON}

          probePayload:
          ${PROBE_JSON}

          batchPayload:
          ${BATCH_JSON}
          EOF
          )
          jq -n --arg body "$BODY" '{body:$body}' > /tmp/pr-comment.json
          curl -fsS --max-time 20 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/160/comments" \
            -d @/tmp/pr-comment.json || true

      - name: Safety notice
        if: ${{ success() }}
        run: |
          echo "S8 canary stayed isolated."
          echo "Batch port is capped at two matches and three vendor requests per uncached batch window."
          echo "NOMAD 3.41 legacy Worker and S1-S7 were not deployed or modified by this workflow."
