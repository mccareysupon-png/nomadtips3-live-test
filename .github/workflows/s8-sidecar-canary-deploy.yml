name: Deploy S8 Sidecar Canary

on:
  push:
    branches: [feature/s8-external-sidecar-canary]
    paths:
      - "workers/nomadtips3-s8-sidecar/**"
      - ".github/workflows/s8-sidecar-canary-deploy.yml"
  workflow_dispatch:

concurrency:
  group: s8-sidecar-canary
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}

jobs:
  deploy-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify sidecar source only
        id: sourcecheck
        working-directory: workers/nomadtips3-s8-sidecar
        run: |
          node --check src/index.js
          test "$(node -e "const c=require('./package.json'); process.stdout.write(c.name)")" = "nomadtips3-s8-sidecar"

      - name: Validate canary secrets
        id: validate
        shell: bash
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$FIVEDOLLAR_API_KEY" || { echo "::error::Missing FIVEDOLLAR_API_KEY in GitHub Actions secrets"; exit 1; }

      - name: Deploy isolated S8 Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: workers/nomadtips3-s8-sidecar
          wranglerVersion: "4"
          command: deploy
          secrets: |
            FIVEDOLLAR_API_KEY
        env:
          FIVEDOLLAR_API_KEY: ${{ env.FIVEDOLLAR_API_KEY }}

      - name: Wait for isolated health contract
        id: health
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL" || { echo "::error::No deployment URL"; exit 1; }
          : > /tmp/s8-health.json
          for i in $(seq 1 20); do
            HTTP=$(curl -sS -o /tmp/s8-health.json -w '%{http_code}' --max-time 10 "$DEPLOYMENT_URL/health" || true)
            if [ "$HTTP" = "200" ] && \
               grep -q '"sourceId":"source8"' /tmp/s8-health.json && \
               grep -q '"isolated":true' /tmp/s8-health.json && \
               grep -q '"touchesLegacySources":false' /tmp/s8-health.json && \
               grep -q '"keyConfigured":true' /tmp/s8-health.json; then
              cat /tmp/s8-health.json
              exit 0
            fi
            echo "health not ready yet: attempt=$i http=$HTTP"
            sleep 3
          done
          echo "::error::S8 health contract did not become ready"
          cat /tmp/s8-health.json || true
          exit 1

      - name: Run bounded S8 live probe
        id: probe
        if: ${{ steps.health.outcome == 'success' }}
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          HTTP=$(curl -sS -o /tmp/s8-probe.json -w '%{http_code}' --max-time 30 "$DEPLOYMENT_URL/probe" || true)
          echo "probe http=$HTTP"
          cat /tmp/s8-probe.json || true
          test "$HTTP" = "200" || { echo "::error::S8 probe endpoint HTTP $HTTP"; exit 1; }
          grep -q '"sourceId":"source8"' /tmp/s8-probe.json
          grep -q '"isolated":true' /tmp/s8-probe.json
          grep -q '"touchesLegacySources":false' /tmp/s8-probe.json

      - name: Persist latest canary evidence
        if: ${{ always() }}
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          SOURCECHECK: ${{ steps.sourcecheck.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          HEALTH: ${{ steps.health.outcome }}
          PROBE: ${{ steps.probe.outcome }}
        run: |
          mkdir -p canary-status
          [ -s /tmp/s8-health.json ] || printf '%s\n' '{"status":"not_available"}' > /tmp/s8-health.json
          [ -s /tmp/s8-probe.json ] || printf '%s\n' '{"status":"not_available"}' > /tmp/s8-probe.json
          cp /tmp/s8-health.json canary-status/s8-health.json
          cp /tmp/s8-probe.json canary-status/s8-probe.json
          cat > canary-status/s8-run.txt <<EOF
          worker=nomadtips3-s8-sidecar
          branch=${GITHUB_REF_NAME}
          sourceCheck=${SOURCECHECK:-unknown}
          secretValidation=${VALIDATE:-unknown}
          deploy=${DEPLOY:-unknown}
          health=${HEALTH:-unknown}
          probe=${PROBE:-unknown}
          deploymentUrl=${DEPLOYMENT_URL:-}
          touchesLegacySources=false
          utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canary-status/s8-health.json canary-status/s8-probe.json canary-status/s8-run.txt
          git commit -m "Record latest S8 canary evidence [skip ci]" || exit 0
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME" || { git rebase --abort || true; echo "status write skipped due branch movement"; exit 0; }
          git push origin HEAD:"$GITHUB_REF_NAME" || echo "status write skipped; runtime was not changed"

      - name: Report canary evidence to PR 160
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          SOURCECHECK: ${{ steps.sourcecheck.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          HEALTH: ${{ steps.health.outcome }}
          PROBE: ${{ steps.probe.outcome }}
        run: |
          [ -s /tmp/s8-health.json ] || printf '%s\n' '{"status":"not_available"}' > /tmp/s8-health.json
          [ -s /tmp/s8-probe.json ] || printf '%s\n' '{"status":"not_available"}' > /tmp/s8-probe.json
          HEALTH_JSON=$(cat /tmp/s8-health.json)
          PROBE_JSON=$(cat /tmp/s8-probe.json)
          BODY=$(cat <<EOF
          S8 CANARY EVIDENCE

          sourceCheck=${SOURCECHECK:-unknown}
          secretValidation=${VALIDATE:-unknown}
          deploy=${DEPLOY:-unknown}
          health=${HEALTH:-unknown}
          probe=${PROBE:-unknown}
          deploymentUrl=${DEPLOYMENT_URL:-}
          touchesLegacySources=false

          healthPayload:
          ${HEALTH_JSON}

          probePayload:
          ${PROBE_JSON}
          EOF
          )
          jq -n --arg body "$BODY" '{body:$body}' > /tmp/pr-comment.json
          curl -fsS --max-time 20 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/160/comments" \
            -d @/tmp/pr-comment.json || true

      - name: Safety notice
        if: ${{ success() }}
        run: |
          echo "S8 canary stayed isolated."
          echo "NOMAD 3.41 legacy Worker and S1-S7 were not deployed or modified by this workflow."
