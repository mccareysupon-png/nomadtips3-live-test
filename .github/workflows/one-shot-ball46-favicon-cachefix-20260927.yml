name: ONE SHOT - Ball46 Favicon Cachefix 20260927

on:
  push:
    branches:
      - ops/ball46-favicon-cachefix-20260927
    paths:
      - '.github/scripts/ball46_favicon_cachefix_20260927.sh'
      - '.github/workflows/one-shot-ball46-favicon-cachefix-20260927.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mirror live Production, patch only favicon cache URL, deploy with race guard
        shell: bash
        run: bash .github/scripts/ball46_favicon_cachefix_20260927.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-favicon-cachefix-${{ github.run_id }}
          path: /tmp/b46-favicon-fix
          if-no-files-found: ignore
          retention-days: 30
