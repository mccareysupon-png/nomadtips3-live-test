name: READ ONLY - Ball46 Top Card Predeploy 20260929

on:
  push:
    branches:
      - work/ball46-topcard-details-20260929
    paths:
      - '.github/workflows/ball46-topcard-predeploy-20260929.yml'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-topcard-details-20260929
      - uses: actions/download-artifact@v4
        with:
          name: ball46-horizontal-card-predeploy-36374800695
          path: /tmp/b46-seed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36374800695
      - name: Remove Cloudflare edge-injected analytics beacon from captured candidate index
        shell: python
        run: |
          from pathlib import Path
          p=Path('ball46-topcard-candidate-20260929/index.html')
          s=p.read_text(encoding='utf-8')
          lines=s.splitlines(True)
          hits=[i for i,x in enumerate(lines) if 'static.cloudflareinsights.com/beacon.min.js' in x]
          if len(hits)!=1:
              raise SystemExit(f'EDGE_BEACON_COUNT_BAD:{len(hits)}')
          del lines[hits[0]]
          p.write_text(''.join(lines),encoding='utf-8')
          print('EDGE_BEACON_REMOVED_FROM_RUNNER_COPY_ONLY')
      - name: Verify current Production and build exact fresh 79-asset candidate
        shell: bash
        run: bash .github/scripts/ball46_topcard_predeploy_20260929.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-topcard-predeploy-${{ github.run_id }}
          path: /tmp/b46-topcard-predeploy
          if-no-files-found: ignore
          retention-days: 30
