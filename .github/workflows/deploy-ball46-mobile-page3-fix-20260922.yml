name: Deploy Ball46 Mobile Page3 Fix 20260922

on:
  push:
    branches: [work/ball46-mobile-menu-classic-20260922]
    paths:
      - '.github/workflows/deploy-ball46-mobile-page3-fix-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_URL: https://www.ball46.com
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  GOLDEN_SHA: ad34452074b300787c91c7788c02d0e242854d0d

jobs:
  deploy-mobile-page3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard protected source
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            workers/nomadtips3-343-preview/src/index.js \
            workers/nomadtips3-343-preview/wrangler.ball46.jsonc \
            workers/nomadtips3-engine-343/src/index.js \
            nomad-live-343/dashboard-v2-stage3.js \
            nomad-live-343/dashboard-v2-tune.js \
            nomad-live-343/bulk-odds-compat-343.js \
            nomad-live-343/expanded-match-343.js \
            nomad-live-343/full-market-bookmaker-343.js \
            nomad-live-343/live-summary-full-odds-343.js \
            nomad-live-343/signal-next.js \
            nomad-live-343/singlepage-workspace-343.js; do
            git diff --quiet "$GOLDEN_SHA"..HEAD -- "$p" || { echo "PROTECTED_SOURCE_CHANGED:$p"; exit 1; }
          done
          node --check nomad-live-343/mobile-menu-classic-343.js
          grep -Fq 'nativeStatisticsRoute' nomad-live-343/mobile-menu-classic-343.js
          grep -Fq 'Page 3 / Statistics mobile visibility hardening' nomad-live-343/mobile-menu-classic-343.css
          ! grep -Fq 'fetch(' nomad-live-343/mobile-menu-classic-343.js
          ! grep -Fq '/api/' nomad-live-343/mobile-menu-classic-343.js
          ! grep -Fq 'setInterval' nomad-live-343/mobile-menu-classic-343.js
          ! grep -Fq 'XMLHttpRequest' nomad-live-343/mobile-menu-classic-343.js
          git diff --check

      - name: Capture exact Production shell
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod /tmp/hdr
          fetch_required(){
            name="$1"; safe="${name//\//_}"
            code=$(curl -sS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 -D "/tmp/hdr/$safe" -o "/tmp/prod/$safe" -w '%{http_code}' "$BALL46_WORKER/$name?page3-pre=${GITHUB_RUN_ID}") || true
            [ "$code" = 200 ] || { echo "PROD_HTTP_${code}:$name"; exit 1; }
            test -s "/tmp/prod/$safe" || { echo "PROD_EMPTY:$name"; exit 1; }
            cp "/tmp/prod/$safe" "nomad-live-343/$name"
          }
          fetch_optional(){
            name="$1"; safe="${name//\//_}"
            code=$(curl -sS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 -o "/tmp/prod/$safe" -w '%{http_code}' "$BALL46_WORKER/$name?page3-copy=${GITHUB_RUN_ID}") || true
            [ "$code" = 200 ] || return 0
            cp "/tmp/prod/$safe" "nomad-live-343/$name"
          }
          while IFS= read -r f; do
            name="${f#nomad-live-343/}"
            case "$name" in mobile-menu-classic-343.css|mobile-menu-classic-343.js) continue ;; esac
            case "$name" in *.html|*.js|*.css|*.svg|*.json|*.png|*.webp|*.jpg|*.jpeg|*.ico) fetch_optional "$name" ;; esac
          done < <(find nomad-live-343 -maxdepth 1 -type f | sort)
          fetch_required index.html
          cp nomad-live-343/index.html /tmp/index-before.html
          python3 - <<'PY' > /tmp/index-assets.txt
          from pathlib import Path
          import re
          h=Path('/tmp/index-before.html').read_text(errors='ignore')
          found=set()
          for x in re.findall(r'''(?:src|href)=["']([^"']+)["']''',h,re.I):
              x=x.split('?',1)[0].split('#',1)[0].strip().lstrip('./').lstrip('/')
              if not x or '://' in x or x.startswith('data:') or '/' in x: continue
              if re.search(r'\.(?:js|css|svg|json|png|webp|jpg|jpeg|ico)$',x,re.I): found.add(x)
          for x in sorted(found): print(x)
          PY
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            case "$name" in mobile-menu-classic-343.css|mobile-menu-classic-343.js) continue ;; esac
            fetch_required "$name"
          done < /tmp/index-assets.txt
          protected='dashboard-v2.css dashboard-v2-stage3.js dashboard-v2-tune.js v2-shared.css v2-shared.js bulk-odds-compat-343.js expanded-match-343.js full-market-bookmaker-343.js live-summary-full-odds-343.js singlepage-workspace-343.js singlepage-workspace-343.css'
          : > /tmp/protected.sha
          for f in $protected; do
            fetch_required "$f"
            printf '%s  %s\n' "$(sha256sum "nomad-live-343/$f"|awk '{print $1}')" "$f" >> /tmp/protected.sha
          done
          cp -a nomad-live-343 /tmp/ball46-assets-before
          curl -fsS -L --retry 4 --max-time 25 "$BALL46_WORKER/api/engine/board?page3-before=${GITHUB_RUN_ID}" -o /tmp/board-before.json
          curl -fsS -L --retry 4 --max-time 25 "$BALL46_WORKER/api/engine/statistics?page3-before=${GITHUB_RUN_ID}" -o /tmp/stats-before.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/board-before.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/stats-before.json','utf8'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures)) throw Error('PRE_BOARD_BAD');
          if(s?.ok!==true||!Array.isArray(s?.rows)) throw Error('PRE_STATS_BAD');
          function has(v){if(Array.isArray(v))return v.length>0;if(!v||typeof v!=='object')return false;return [v.bookmakers,v.odds,v.markets,v?.data?.bookmakers,v?.data?.odds,v?.data?.markets].some(x=>Array.isArray(x)?x.length>0:!!(x&&typeof x==='object'&&Object.keys(x).length))||Object.keys(v).some(k=>/bet365|pinnacle|1xbet|bookmaker/i.test(k))}
          const odds=b.fixtures.filter(f=>has(f?.providerOdds)||has(f?.fullOdds)||has(f?.odds)).length;
          const pre={fixtures:b.fixtures.length,oddsFixtures:odds,stats:s.rows.length};
          fs.writeFileSync('/tmp/pre.json',JSON.stringify(pre)); console.log('PAGE3_PRE',pre);
          NODE

      - name: Inject mobile Page3 assets only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('nomad-live-343/index.html'); h=p.read_text()
          h=re.sub(r'\s*<link[^>]+mobile-menu-classic-343\.css[^>]*>','',h,flags=re.I)
          h=re.sub(r'\s*<script[^>]+mobile-menu-classic-343\.js[^>]*></script>','',h,flags=re.I)
          h=h.replace('</head>','<link rel="stylesheet" href="mobile-menu-classic-343.css?v=343-mobile-page3-20260922c">\n</head>',1)
          h=h.replace('</body>','<script src="mobile-menu-classic-343.js?v=343-mobile-page3-20260922c" defer></script>\n</body>',1)
          p.write_text(h)
          PY
          while read -r expected f; do
            [ "$(sha256sum "nomad-live-343/$f"|awk '{print $1}')" = "$expected" ] || { echo "PROTECTED_LOCAL_CHANGED:$f"; exit 1; }
          done < /tmp/protected.sha

      - name: Dry run
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy
        id: deploy
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify Page3 and backend continuity
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 15); do
            if curl -fsS -L --max-time 20 "$BALL46_WORKER/index.html?page3=${GITHUB_RUN_ID}-${n}" -o /tmp/index-after.html \
              && grep -Fq '343-mobile-page3-20260922c' /tmp/index-after.html; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = 1 ] || exit 1
          curl -fsS -L --max-time 25 "$BALL46_WORKER/mobile-menu-classic-343.js?verify=${GITHUB_RUN_ID}" -o /tmp/mobile.js
          curl -fsS -L --max-time 25 "$BALL46_WORKER/mobile-menu-classic-343.css?verify=${GITHUB_RUN_ID}" -o /tmp/mobile.css
          grep -Fq 'nativeStatisticsRoute' /tmp/mobile.js
          grep -Fq 'Page 3 / Statistics mobile visibility hardening' /tmp/mobile.css
          while read -r expected f; do
            curl -fsS -L --max-time 25 "$BALL46_WORKER/$f?guard=${GITHUB_RUN_ID}" -o "/tmp/guard-$f"
            [ "$(sha256sum "/tmp/guard-$f"|awk '{print $1}')" = "$expected" ] || { echo "PROTECTED_DEPLOYED_CHANGED:$f"; exit 1; }
          done < /tmp/protected.sha
          curl -fsS -L --max-time 25 "$BALL46_WORKER/api/engine/board?page3-after=${GITHUB_RUN_ID}" -o /tmp/board-after.json
          curl -fsS -L --max-time 25 "$BALL46_WORKER/api/engine/statistics?page3-after=${GITHUB_RUN_ID}" -o /tmp/stats-after.json
          node - <<'NODE'
          const fs=require('fs'),pre=JSON.parse(fs.readFileSync('/tmp/pre.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/board-after.json','utf8')),s=JSON.parse(fs.readFileSync('/tmp/stats-after.json','utf8'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures)||s?.ok!==true||!Array.isArray(s?.rows)) throw Error('POST_BACKEND_BAD');
          function has(v){if(Array.isArray(v))return v.length>0;if(!v||typeof v!=='object')return false;return [v.bookmakers,v.odds,v.markets,v?.data?.bookmakers,v?.data?.odds,v?.data?.markets].some(x=>Array.isArray(x)?x.length>0:!!(x&&typeof x==='object'&&Object.keys(x).length))||Object.keys(v).some(k=>/bet365|pinnacle|1xbet|bookmaker/i.test(k))}
          const odds=b.fixtures.filter(f=>has(f?.providerOdds)||has(f?.fullOdds)||has(f?.odds)).length;
          if(pre.fixtures&& !b.fixtures.length) throw Error('FIXTURES_ZERO');
          if(pre.oddsFixtures&& !odds) throw Error('ODDS_ZERO');
          if(pre.stats&& !s.rows.length) throw Error('STATS_ZERO');
          console.log('PAGE3_BACKEND_PASS',{before:pre,after:{fixtures:b.fixtures.length,oddsFixtures:odds,stats:s.rows.length}});
          NODE
          ok=0
          for n in $(seq 1 15); do
            if curl -fsS -L --max-time 20 "$BALL46_URL/index.html?page3-www=${GITHUB_RUN_ID}-${n}" -o /tmp/www.html \
              && grep -Fq '343-mobile-page3-20260922c' /tmp/www.html; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = 1 ]

      - name: Restore exact pre-change shell on failure
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test -d /tmp/ball46-assets-before
          rm -rf nomad-live-343
          cp -a /tmp/ball46-assets-before nomad-live-343
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc
