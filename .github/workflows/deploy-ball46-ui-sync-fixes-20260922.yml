name: Deploy Ball46 Event Icons Complete 20260922

on:
  push:
    branches: [work/ball46-event-icons-complete-20260922]
    paths:
      - 'nomad-live-343/ui-sync-fixes-343-v2.js'
      - 'nomad-live-343/ui-sync-fixes-343.css'
      - '.github/workflows/deploy-ball46-ui-sync-fixes-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  GOLDEN_SHA: ad34452074b300787c91c7788c02d0e242854d0d

jobs:
  deploy-event-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Preflight strict isolation
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$GOLDEN_SHA^{commit}"
          for p in \
            workers/nomadtips3-343-preview/src/index.js \
            workers/nomadtips3-343-preview/wrangler.ball46.jsonc \
            workers/nomadtips3-engine-343/src/index.js \
            nomad-live-343/dashboard-v2-stage3.js \
            nomad-live-343/dashboard-v2-tune.js \
            nomad-live-343/bulk-odds-compat-343.js \
            nomad-live-343/expanded-match-343.js \
            nomad-live-343/full-market-bookmaker-343.js \
            nomad-live-343/live-summary-full-odds-343.js \
            nomad-live-343/signal-next.js \
            nomad-live-343/singlepage-workspace-343.js; do
            git diff --quiet "$GOLDEN_SHA"..HEAD -- "$p" || { echo "PROTECTED_SOURCE_CHANGED:$p"; exit 1; }
          done
          node --check nomad-live-343/ui-sync-fixes-343-v2.js
          ! grep -Fq 'HISTORY_API' nomad-live-343/ui-sync-fixes-343-v2.js
          ! grep -Fq 'data-b46-signal-flow' nomad-live-343/ui-sync-fixes-343-v2.js
          ! grep -Fq 'setInterval' nomad-live-343/ui-sync-fixes-343-v2.js
          ! grep -Fq 'MutationObserver' nomad-live-343/ui-sync-fixes-343-v2.js
          grep -Fq "const HOME='#31b878'" nomad-live-343/ui-sync-fixes-343-v2.js
          grep -Fq "const AWAY='#e2c94c'" nomad-live-343/ui-sync-fixes-343-v2.js
          grep -Fq '.expand-flow-line.home' nomad-live-343/ui-sync-fixes-343-v2.js
          grep -Fq '.expand-flow-line.away' nomad-live-343/ui-sync-fixes-343-v2.js
          grep -Fq 'pointAtX' nomad-live-343/ui-sync-fixes-343-v2.js
          grep -Fq '.stat-track.away i{background:#e2c94c!important}' nomad-live-343/ui-sync-fixes-343.css
          grep -Fq '.next-bar.away i{background:#e2c94c!important}' nomad-live-343/ui-sync-fixes-343.css
          git diff --check

      - name: Mirror exact current Production baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod
          fetch_optional(){
            name="$1"; safe="${name//\//_}"
            code=$(curl -sS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 -o "/tmp/prod/$safe" -w '%{http_code}' "$BALL46_WORKER/$name?efi2-copy=${GITHUB_RUN_ID}") || true
            [ "$code" = 200 ] || return 0
            test -s "/tmp/prod/$safe" || return 0
            mkdir -p "$(dirname "nomad-live-343/$name")"
            cp "/tmp/prod/$safe" "nomad-live-343/$name"
          }
          fetch_required(){
            name="$1"; safe="${name//\//_}"
            code=$(curl -sS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 -o "/tmp/prod/$safe" -w '%{http_code}' "$BALL46_WORKER/$name?efi2-required=${GITHUB_RUN_ID}") || true
            [ "$code" = 200 ] || { echo "REQUIRED_PROD_ASSET_HTTP_${code}:$name"; exit 1; }
            test -s "/tmp/prod/$safe" || { echo "REQUIRED_PROD_ASSET_EMPTY:$name"; exit 1; }
            mkdir -p "$(dirname "nomad-live-343/$name")"
            cp "/tmp/prod/$safe" "nomad-live-343/$name"
          }
          while IFS= read -r f; do
            name="${f#nomad-live-343/}"
            case "$name" in ui-sync-fixes-343.js|ui-sync-fixes-343-v2.js|ui-sync-fixes-343.css) continue ;; esac
            case "$name" in *.html|*.js|*.css|*.svg|*.json|*.png|*.webp|*.jpg|*.jpeg|*.ico) fetch_optional "$name" ;; esac
          done < <(find nomad-live-343 -maxdepth 1 -type f | sort)
          fetch_required index.html
          cp nomad-live-343/index.html /tmp/index.before.html
          python3 - <<'PY' > /tmp/index-assets.txt
          from pathlib import Path
          import re
          h=Path('/tmp/index.before.html').read_text(errors='ignore')
          found=set()
          for x in re.findall(r'''(?:src|href)=["']([^"']+)["']''',h,re.I):
              x=x.split('?',1)[0].split('#',1)[0].strip().lstrip('./').lstrip('/')
              if not x or '://' in x or '/' in x: continue
              if re.search(r'\.(?:js|css|svg|json|png|webp|jpg|jpeg|ico)$',x,re.I): found.add(x)
          for x in sorted(found): print(x)
          PY
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            case "$name" in ui-sync-fixes-343.js|ui-sync-fixes-343-v2.js|ui-sync-fixes-343.css) continue ;; esac
            fetch_required "$name"
          done < /tmp/index-assets.txt
          protected='dashboard-v2.css dashboard-v2-stage3.js dashboard-v2-tune.js v2-shared.css v2-shared.js bulk-odds-compat-343.js expanded-match-343.js full-market-bookmaker-343.js live-summary-full-odds-343.js signal-next.js singlepage-workspace-343.js singlepage-workspace-343.css'
          : > /tmp/protected.sha
          for f in $protected; do
            fetch_required "$f"
            printf '%s  %s\n' "$(sha256sum "nomad-live-343/$f" | awk '{print $1}')" "$f" >> /tmp/protected.sha
          done
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?efi2-before=${GITHUB_RUN_ID}" -o /tmp/board-before.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?efi2-before=${GITHUB_RUN_ID}" -o /tmp/signals-before.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/statistics?efi2-before=${GITHUB_RUN_ID}" -o /tmp/stats-before.json
          node - <<'NODE'
          const fs=require('fs'),b=JSON.parse(fs.readFileSync('/tmp/board-before.json')),s=JSON.parse(fs.readFileSync('/tmp/signals-before.json')),t=JSON.parse(fs.readFileSync('/tmp/stats-before.json'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures))throw Error('PRE_BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals))throw Error('PRE_SIGNALS_UNHEALTHY');
          if(t?.ok!==true||!Array.isArray(t?.rows))throw Error('PRE_STATS_UNHEALTHY');
          NODE

      - name: Inject one consolidated overlay only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('nomad-live-343/index.html'); h=p.read_text()
          h=re.sub(r'\s*<link[^>]+ui-sync-fixes-343\.css[^>]*>','',h,flags=re.I)
          for pat in [r'\s*<script[^>]+ui-sync-fixes-343\.js[^>]*></script>',r'\s*<script[^>]+ui-sync-fixes-343-v2\.js[^>]*></script>',r'\s*<script[^>]+event-flow-icons-343\.js[^>]*></script>',r'\s*<script[^>]+event-flow-bars-343\.js[^>]*></script>',r'\s*<link[^>]+event-flow-bars-343\.css[^>]*>']:
              h=re.sub(pat,'',h,flags=re.I)
          css='<link rel="stylesheet" href="ui-sync-fixes-343.css?v=343-ui-sync-20260922b">'
          js='<script src="ui-sync-fixes-343-v2.js?v=343-event-icons-line-20260922b" defer></script>'
          if '</head>' not in h or '</body>' not in h: raise SystemExit('INDEX_ANCHOR_MISSING')
          p.write_text(h.replace('</head>',css+'\n</head>',1).replace('</body>',js+'\n</body>',1))
          PY
          node --check nomad-live-343/ui-sync-fixes-343-v2.js
          while read -r expected f; do
            actual=$(sha256sum "nomad-live-343/$f" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "PROTECTED_LOCAL_CHANGED:$f"; exit 1; }
          done < /tmp/protected.sha

      - name: Dry run Production package
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy consolidated event-icon overlay
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify overlay and backend continuity
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 15); do
            if curl -fsS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 "$BALL46_WORKER/index.html?efi2-after=${GITHUB_RUN_ID}-${n}" -o /tmp/index.after.html \
              && grep -Fq 'ui-sync-fixes-343-v2.js?v=343-event-icons-line-20260922b' /tmp/index.after.html \
              && grep -Fq 'ui-sync-fixes-343.css?v=343-ui-sync-20260922b' /tmp/index.after.html; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo 'EVENT_ICON_V2_MARKER_NOT_PROPAGATED'; exit 1; }
          ! grep -Fq 'event-flow-icons-343.js' /tmp/index.after.html
          ! grep -Fq 'event-flow-bars-343.js' /tmp/index.after.html
          ! grep -Fq 'event-flow-bars-343.css' /tmp/index.after.html
          ! grep -Fq 'ui-sync-fixes-343.js?v=' /tmp/index.after.html
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/ui-sync-fixes-343-v2.js?verify=${GITHUB_RUN_ID}" -o /tmp/uis2.js
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/ui-sync-fixes-343.css?verify=${GITHUB_RUN_ID}" -o /tmp/uis.css
          node --check /tmp/uis2.js
          ! grep -Fq 'HISTORY_API' /tmp/uis2.js
          ! grep -Fq 'data-b46-signal-flow' /tmp/uis2.js
          grep -Fq '.expand-flow-line.home' /tmp/uis2.js
          grep -Fq '.expand-flow-line.away' /tmp/uis2.js
          grep -Fq 'pointAtX' /tmp/uis2.js
          grep -Fq '.stat-track.away i{background:#e2c94c!important}' /tmp/uis.css
          grep -Fq '.next-bar.away i{background:#e2c94c!important}' /tmp/uis.css
          while read -r expected f; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/$f?efi2-protected=${GITHUB_RUN_ID}" -o "/tmp/protected-$f"
            actual=$(sha256sum "/tmp/protected-$f" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "PROTECTED_DEPLOYED_CHANGED:$f"; exit 1; }
          done < /tmp/protected.sha
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?efi2-final=${GITHUB_RUN_ID}" -o /tmp/board-after.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?efi2-final=${GITHUB_RUN_ID}" -o /tmp/signals-after.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/statistics?efi2-final=${GITHUB_RUN_ID}" -o /tmp/stats-after.json
          node - <<'NODE'
          const fs=require('fs'),b=JSON.parse(fs.readFileSync('/tmp/board-after.json')),s=JSON.parse(fs.readFileSync('/tmp/signals-after.json')),t=JSON.parse(fs.readFileSync('/tmp/stats-after.json'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures))throw Error('POST_BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals))throw Error('POST_SIGNALS_UNHEALTHY');
          if(t?.ok!==true||!Array.isArray(t?.rows))throw Error('POST_STATS_UNHEALTHY');
          console.log('EVENT_ICON_V2_DEPLOY_OK',{fixtures:b.fixtures.length,signals:s.signals.length,stats:t.rows.length});
          NODE
