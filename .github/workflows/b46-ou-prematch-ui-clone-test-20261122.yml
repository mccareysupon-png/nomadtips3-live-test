name: BALL46 Over Under Pre-Match UI clone TEST only
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-ou-prematch-ui-clone-test-20261122.yml]
permissions: {contents: read}
jobs:
  isolated-test-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate new O-U UI code without touching 1X2
        run: |
          node --check qa/prematch-history-20261120/patch-ou-prematch-ui-clone-test-20261122.mjs
          node --check qa/prematch-history-20261120/deploy-ou-prematch-ui-clone-test-20261122.mjs
      - name: Clone existing Predictions and PRE-MATCH 1X2 UI in TEST frontend only
        run: node qa/prematch-history-20261120/deploy-ou-prematch-ui-clone-test-20261122.mjs
