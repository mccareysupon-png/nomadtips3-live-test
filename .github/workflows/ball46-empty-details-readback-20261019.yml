name: BALL46 Empty Details Post Deploy Readback
on:
  push:
    branches: [fix/ball46-mobile-hide-empty-details-trio-20261019]
    paths: ['.github/workflows/ball46-empty-details-readback-20261019.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Compare active deployment with public index (read-only)
        run: |
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          if(!token||account!=='62cb0db544160e6591342abd6b4f35cc')throw Error('AUTH_OR_ACCOUNT');
          const endpoint='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/ball46-production/deployments?per_page=4';
          for(let attempt=0;attempt<3;attempt++){
            const res=await fetch(endpoint,{headers:{authorization:'Bearer '+token}}),json=await res.json();
            const p=await fetch('https://ball46.com/index.html?detailReadback='+Date.now());
            const html=await p.text();
            console.log('POST_DEPLOY_READBACK',JSON.stringify({
              attempt,status:res.status,cfSuccess:json.success,
              deployments:json.result?.deployments?.slice(0,3).map(d=>({id:d.id,created_on:d.created_on,versions:d.versions?.map(v=>({id:v.version_id,percentage:v.percentage}))})),
              htmlStatus:p.status,htmlSha:createHash('sha256').update(html).digest('hex'),
              cssPresent:html.includes('b46-hide-empty-detail-tiles-style-20261019')
            }));
            if(attempt<2)await new Promise(r=>setTimeout(r,5000));
          }
          JS
