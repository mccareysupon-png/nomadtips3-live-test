name: Inspect Ball46 Member Source

on:
  push:
    branches:
      - member/ball46-member-v1-20261008
    paths:
      - '.github/workflows/inspect-ball46-member-source-20261008.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Read live Production APIs
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://www.ball46.com"
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$BASE/api/engine/signals?member_probe=${GITHUB_RUN_ID}" -o /tmp/signals.json
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$BASE/api/engine/board?member_probe=${GITHUB_RUN_ID}" -o /tmp/board.json
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$BASE/api/engine/statistics?member_probe=${GITHUB_RUN_ID}" -o /tmp/statistics.json
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$BASE/api/engine/statistics?limit=100&member_probe=${GITHUB_RUN_ID}" -o /tmp/statistics100.json
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$BASE/api/engine/statistics?view=summary&member_probe=${GITHUB_RUN_ID}" -o /tmp/stat-summary.json
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$BASE/api/engine/statistics?view=rows&limit=100&member_probe=${GITHUB_RUN_ID}" -o /tmp/stat-rows.json
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "$BASE/api/engine/statistics?paged=1&limit=100&member_probe=${GITHUB_RUN_ID}" -o /tmp/stat-paged.json
          CURSOR="$(jq -r '.nextCursor // empty' /tmp/stat-paged.json)"
          if [ -n "$CURSOR" ]; then
            curl -fsS --max-time 30 -G -H 'Cache-Control: no-cache'               --data-urlencode 'paged=1'               --data-urlencode "cursor=$CURSOR"               --data-urlencode "member_probe=${GITHUB_RUN_ID}"               "$BASE/api/engine/statistics" -o /tmp/stat-paged2.json
          else
            echo '{"rows":[]}' > /tmp/stat-paged2.json
          fi

          echo "=== SIGNAL TOP LEVEL ==="
          jq -c 'keys' /tmp/signals.json
          echo "=== SIGNAL COUNT ==="
          jq -c '{ok, count:(.signals|length), mirror}' /tmp/signals.json
          echo "=== SIGNAL SAMPLE KEYS ==="
          jq -c '.signals[0] // {} | keys' /tmp/signals.json
          echo "=== SIGNAL SAMPLE SANITIZED ==="
          jq -c '.signals[0] // {} | {
            fixtureId,id,createdAt,entryMinute,minute,entryScore,scoreAt,
            mirrorMinute,mirrorScore,market,providerMarket,marketLabel,
            selection,line,odds,price,bookmaker,home,away,league,
            liveStatistics,liveCorners,result,status
          }' /tmp/signals.json

          echo "=== STATISTICS TOP LEVEL ==="
          jq -c 'keys' /tmp/statistics.json
          echo "=== STATISTICS COUNTS ==="
          jq -c '{ok,total,win,loss,push,halfWin,halfLoss,unresolved,winRate,rowCount:(.rows|length)}' /tmp/statistics.json
          echo "=== STATISTICS PAGINATION DEFAULT ==="
          jq -c '{returned,hasMore,nextCursor,statisticsPagination,retention,statisticsSource,ledgerTotal,ledgerUpdatedAt}' /tmp/statistics.json
          echo "=== STATISTICS LIMIT 100 ==="
          jq -c '{returned,rowCount:(.rows|length),hasMore,nextCursor,statisticsPagination,statisticsSource,firstCreatedAt:(.rows[0].createdAt // null),lastCreatedAt:(.rows[-1].createdAt // null)}' /tmp/statistics100.json
          echo "=== STATISTICS VIEW SUMMARY ==="
          jq -c '{keys:keys,rowCount:(.rows|length? // null),returned,hasMore,nextCursor,total,win,loss,push,halfWin,halfLoss,pending,statisticsSource,statisticsPagination}' /tmp/stat-summary.json
          echo "=== STATISTICS VIEW ROWS ==="
          jq -c '{keys:keys,rowCount:(.rows|length? // null),returned,hasMore,nextCursor,total,pending,statisticsSource,statisticsPagination,firstCreatedAt:(.rows[0].createdAt // null),lastCreatedAt:(.rows[-1].createdAt // null)}' /tmp/stat-rows.json
          echo "=== STATISTICS PAGED ==="
          jq -c '{keys:keys,rowCount:(.rows|length? // null),returned,hasMore,nextCursor,total,pending,statisticsSource,statisticsPagination,firstCreatedAt:(.rows[0].createdAt // null),lastCreatedAt:(.rows[-1].createdAt // null)}' /tmp/stat-paged.json
          echo "=== STATISTICS CURSOR PAGE 2 ==="
          jq -c '{returned,rowCount:(.rows|length? // null),hasMore,nextCursor,firstCreatedAt:(.rows[0].createdAt // null),lastCreatedAt:(.rows[-1].createdAt // null)}' /tmp/stat-paged2.json
          echo "=== STATISTICS STATUS COUNTS ==="
          jq -c '[.rows[].status] | group_by(.) | map({status:.[0],count:length})' /tmp/statistics.json
          echo "=== STATISTICS LATEST ROW KEYS ==="
          jq -c '.rows[0] // {} | keys' /tmp/statistics.json
          echo "=== STATISTICS LATEST ROW SANITIZED ==="
          jq -c '.rows[0] // {} | {
            id,fixtureId,createdAt,entryMinute,minute,entryScore,scoreAt,
            market,providerMarket,marketLabel,selection,line,odds,bookmaker,
            home,away,league,entryCorners,entryCards,entryStats,statisticsAtEntry,
            eventHistory,status,result,finalScore,finalCorners,finalCards,settledAt
          }' /tmp/statistics.json

          echo "=== BOARD TOP LEVEL ==="
          jq -c 'keys' /tmp/board.json
          echo "=== BOARD COUNT ==="
          jq -c '{ok, count:(.fixtures|length), hubAgeMs, version, hubVersion}' /tmp/board.json
          echo "=== BOARD FIXTURE SAMPLE KEYS ==="
          jq -c '.fixtures[0] // {} | keys' /tmp/board.json
          echo "=== BOARD MATCHED SIGNAL FIXTURE SAMPLE ==="
          FIXTURE="$(jq -r '.signals[0].fixtureId // empty' /tmp/signals.json)"
          if [ -n "$FIXTURE" ]; then
            jq -c --arg id "$FIXTURE" '.fixtures[] | select((.fixtureId|tostring)==$id) | {
              fixtureId,minute,status,home,away,score,corners,cards,statistics,events,
              providerOddsUpdatedAt
            }' /tmp/board.json | head -n 1
          fi

          echo "BALL46_MEMBER_SOURCE_INSPECTION_COMPLETE"
