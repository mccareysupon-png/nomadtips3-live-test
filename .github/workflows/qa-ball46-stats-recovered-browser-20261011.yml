name: QA Ball46 Statistics Legacy Route Recovered Browser 20261011
on:
  push:
    branches: [audit/ball46-corner-live-price-20261011]
    paths: [.github/workflows/qa-ball46-stats-recovered-browser-20261011.yml]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Check legacy route after restore against actual working Stats
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          for(const path of ['/statistics.html','/index.html?view=statistics','/api/engine/statistics?paged=1']){
            const r=await fetch('https://www.ball46.com'+path,{cache:'no-store',redirect:'manual',signal:AbortSignal.timeout(20000)});
            const s=await r.text();let j={};try{j=JSON.parse(s)}catch{}
            console.log('REPAIRED_STATISTICS_URL',JSON.stringify({path,http:r.status,bytes:s.length,location:r.headers.get('location'),legacyScript:s.includes('statistics-next.js'),redirectSnippet:s.match(/(?:location\.replace|http-equiv=["']refresh|index\.html\?view=statistics)[^\n]{0,200}/i)?.[0]??null,ledger:j.ledgerTotal??null,settled:j.total??null,rows:j.rows?.length??null,win:j.win??null,loss:j.loss??null}));
          }
          NODE
          command -v google-chrome || true
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1365,1000 --virtual-time-budget=16000 --dump-dom 'https://www.ball46.com/statistics.html?stat_route_browser_qa=20261011' >/tmp/stats.html 2>/tmp/chrome.log
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('/tmp/stats.html','utf8');
          const strip=x=>x.replace(/<script[\s\S]*?<\/script>/g,'').replace(/<style[\s\S]*?<\/style>/g,'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
          const body=strip(s).slice(0,3500);
          const checks={inMainWorkspace:s.includes('singlepage-workspace-343.js'),hasSettled:body.includes('SETTLED'),hasWin:body.includes('WIN'),hasLoss:body.includes('LOSS'),hasData:/(?:6,2\d\d|627\d|6,4\d\d|64\d\d)/.test(body),feedUnavailable:body.includes('Statistics feed unavailable')};
          console.log('REPAIRED_STATS_BROWSER',JSON.stringify({url:s.match(/<title>([^<]+)/)?.[1],bytes:s.length,checks,body:body.slice(0,900)}));
          if(!checks.inMainWorkspace||!checks.hasSettled||!checks.hasData||checks.feedUnavailable)process.exitCode=1;
          NODE
