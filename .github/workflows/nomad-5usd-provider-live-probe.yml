name: NOMAD 5USD Provider + Central Hub Live Gate

on:
  push:
    branches: [work/nomad341-5usd-central-rewire]
    paths:
      - '.github/workflows/nomad-5usd-provider-live-probe.yml'
      - 'workers/nomadtips3-5usd-central-hub/**'
      - 'rewire-341-5usd/validate-hub-gate.mjs'
  workflow_dispatch:

permissions:
  contents: read

env:
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
  API_BASE: https://api.5dollarfootballapi.com/v1
  HUB_URL: http://127.0.0.1:8787

jobs:
  live-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate inputs and hub code
        run: |
          set -euo pipefail
          test -n "$FIVEDOLLAR_API_KEY" || { echo 'Missing FIVEDOLLAR_API_KEY'; exit 1; }
          node --check workers/nomadtips3-5usd-central-hub/src/index.js
          node --check rewire-341-5usd/validate-hub-gate.mjs
          node --test workers/nomadtips3-5usd-central-hub/test/contract.test.js

      - name: Start isolated ephemeral hub
        run: |
          set -euo pipefail
          npx --yes wrangler@4.131.1 dev --local --config workers/nomadtips3-5usd-central-hub/wrangler.jsonc --port 8787 --var "FIVEDOLLAR_API_KEY:$FIVEDOLLAR_API_KEY" --var "CENTRAL_HUB_TOKEN:$FIVEDOLLAR_API_KEY" >/tmp/hub.log 2>&1 &
          echo $! >/tmp/hub.pid
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 "$HUB_URL/health" >/tmp/health.json 2>/dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 "$HUB_URL/health" >/tmp/health.json || { cat /tmp/hub.log; exit 1; }
          node -e "const j=require('/tmp/health.json'); if(j.ok!==true||j.service!=='nomadtips3-5usd-central-hub') throw new Error(JSON.stringify(j)); console.log('HUB_HEALTH_PASS', {version:j.version,mode:j.mode});"
          code=$(curl -sS -o /tmp/unauth.json -w '%{http_code}' --max-time 5 "$HUB_URL/live")
          test "$code" = "401" || { echo "expected 401 without token, got $code"; cat /tmp/unauth.json; exit 1; }

      - name: Round 1 live parity + market buses
        run: |
          set -euo pipefail
          curl -fsS --max-time 45 -H "x-central-hub-token: $FIVEDOLLAR_API_KEY" "$HUB_URL/live" -o /tmp/hub-live-1.json
          curl -fsS --max-time 45 -H "Authorization: Bearer $FIVEDOLLAR_API_KEY" "$API_BASE/fixtures?status=live&include=odds,events,stats&per_page=50&page=1" -o /tmp/direct-live-1.json
          node rewire-341-5usd/validate-hub-gate.mjs live /tmp/hub-live-1.json /tmp/direct-live-1.json /tmp/fixture-id
          if [ -s /tmp/fixture-id ]; then
            ID=$(cat /tmp/fixture-id)
            curl -fsS --max-time 30 -H "x-central-hub-token: $FIVEDOLLAR_API_KEY" "$HUB_URL/odds?fixtureId=$ID" -o /tmp/hub-odds.json
            curl -fsS --max-time 30 -H "x-central-hub-token: $FIVEDOLLAR_API_KEY" "$HUB_URL/referees?fixtureId=$ID" -o /tmp/hub-refs.json
            node rewire-341-5usd/validate-hub-gate.mjs markets /tmp/hub-odds.json /tmp/hub-refs.json
          fi

      - name: Round 2 cache and refresh behavior
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 -H "x-central-hub-token: $FIVEDOLLAR_API_KEY" "$HUB_URL/live" -o /tmp/hub-cache.json
          node rewire-341-5usd/validate-hub-gate.mjs cache-hit /tmp/hub-cache.json
          sleep 56
          curl -fsS --max-time 45 -H "x-central-hub-token: $FIVEDOLLAR_API_KEY" "$HUB_URL/live" -o /tmp/hub-refresh.json
          node rewire-341-5usd/validate-hub-gate.mjs cache-refresh /tmp/hub-refresh.json

      - name: Final gate summary
        if: always()
        run: |
          if [ -f /tmp/hub.log ]; then tail -n 80 /tmp/hub.log; fi
          if [ -f /tmp/hub.pid ]; then kill $(cat /tmp/hub.pid) 2>/dev/null || true; fi
