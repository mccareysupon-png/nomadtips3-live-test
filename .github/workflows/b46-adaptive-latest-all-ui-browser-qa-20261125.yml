name: BALL46 Adaptive latest O/U all 4 TEST pages browser QA 20261125
on:
  push:
    branches: [feature/ball46-adaptive-manual-control-test-20261125]
    paths: [.github/workflows/b46-adaptive-latest-all-ui-browser-qa-20261125.yml]
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install real Chromium browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Verify latest actual O/U pairs, price evidence, opposing formulas across 4 pages on Desktop and Mobile
        run: node qa/prematch-history-20261120/b46-adaptive-latest-all-ui-browser-qa-20261125.mjs
      - name: Save screenshots from each view
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-adaptive-latest-all-ui-20261125
          path: /tmp/b46-latest-all-ui-browser-qa/*.png
          if-no-files-found: ignore

