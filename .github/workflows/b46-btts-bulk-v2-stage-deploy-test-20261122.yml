name: BALL46 BTTS Bulk Truck V2 TEST staged deploy ZERO paid calls
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-btts-bulk-v2-stage-deploy-test-20261122.yml]
permissions: {contents: read}
concurrency:
  group: b46-prematch-worker-deploy-v2-test-only
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Bulk V2 and original transport QA
        run: |
          node --test qa/prematch-history-20261120/btts-bulk-truck-v2.test.mjs qa/prematch-history-20261120/btts-history-private.test.mjs qa/prematch-history-20261120/history-five-rounds.test.mjs
      - name: Stage EXACT existing PreMatch TEST worker and new Bulk V2 module without activating
        run: node qa/prematch-history-20261120/deploy-btts-bulk-v2-test-20261122.mjs
