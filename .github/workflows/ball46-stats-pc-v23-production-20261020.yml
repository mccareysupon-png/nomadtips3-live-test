name: BALL46 Statistics PC V2.3 Guarded Production
on:
  push:
    branches: [codex/ball46-stats-pc-v23-guarded-production-20261020]
    paths:
      - '.github/workflows/ball46-stats-pc-v23-production-20261020.yml'
      - 'deploy-assets/stats-pc-v2-preview-20261020/production-v23.mjs'
      - 'deploy-assets/stats-pc-v2-preview-20261020/preview.css'
      - 'deploy-assets/stats-pc-v2-preview-20261020/compact-v21.css'
      - 'deploy-assets/stats-pc-v2-preview-20261020/compact-v22.css'
      - 'deploy-assets/stats-pc-v2-preview-20261020/single-row-v23.css'
      - 'deploy-assets/stats-pc-v2-preview-20261020/ribbon-v23.mjs'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script, install browser tools
        working-directory: deploy-assets/stats-pc-v2-preview-20261020
        run: |
          node --check production-v23.mjs
          node --check ribbon-v23.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
      - name: Validate production then deploy only approved PC statistics
        working-directory: deploy-assets/stats-pc-v2-preview-20261020
        run: node production-v23.mjs
      - name: Archive browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-statistics-pc-v23-production-proof
          path: deploy-assets/stats-pc-v2-preview-20261020/audit/
          retention-days: 30
          if-no-files-found: warn
