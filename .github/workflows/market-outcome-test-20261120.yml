name: BALL46 unified market outcome bar test only
on:
  push:
    branches: [test/ball46-market-outcome-bar-20261120]
    paths: ['.github/workflows/market-outcome-test-20261120.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy isolated test only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --check qa/market-outcome-bar-20261120/worker.mjs
          cat > qa/market-outcome-bar-20261120/wrangler.toml <<'EOF'
          name = "ball46-market-outcome-bar-test-20261120"
          main = "worker.mjs"
          compatibility_date = "2026-11-20"
          workers_dev = true
          preview_urls = false
          [[services]]
          binding = "B46_PRODUCTION_READ"
          service = "ball46-production"
          EOF
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';import {writeFile} from 'node:fs/promises';
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/ball46-production/deployments?per_page=1',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});const j=await r.json();assert(j.success);await writeFile(process.env.RUNNER_TEMP+'/prod-before.json',JSON.stringify(j.result.deployments[0].versions));
          EOF
          for attempt in 1 2 3; do
            if npx --yes wrangler@4.50.0 deploy --config qa/market-outcome-bar-20261120/wrangler.toml --name ball46-market-outcome-bar-test-20261120; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Verify all eight markets desktop and mobile
        run: |
          npm install --prefix qa/market-outcome-bar-20261120/.runtime --no-audit --no-fund playwright@1.55.0
          qa/market-outcome-bar-20261120/.runtime/node_modules/.bin/playwright install chromium --only-shell
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';import {createRequire} from 'node:module';
          const {chromium,devices}=createRequire(process.cwd()+'/qa/market-outcome-bar-20261120/.runtime/package.json')('playwright');
          const base='https://ball46-market-outcome-bar-test-20261120.mccarey-supon.workers.dev';
          let health;for(let i=0;i<15;i++){try{const r=await fetch(base+'/_market_outcome_health');if(r.ok){health=await r.json();break}}catch{}await new Promise(r=>setTimeout(r,2000))}
          assert.equal(health?.scope,'TEST_ONLY_MARKET_OUTCOME_BAR');assert.equal(health?.revision,'MARKET_OUTCOME_V2');assert.equal((await fetch(base+'/_market_outcome_health',{method:'POST'})).status,405);
          const browser=await chromium.launch();try{await Promise.all(['wide-dark','desktop-light','mobile-dark','mobile-light'].map(async mode=>{const mobile=mode.startsWith('mobile'),theme=mode.endsWith('dark')?'dark':'light';
          const p=await browser.newPage(mobile?{...devices['iPhone 13'],serviceWorkers:'block'}:{viewport:{width:mode.startsWith('wide')?1920:1440,height:950},serviceWorkers:'block'});
          await p.addInitScript(t=>localStorage.setItem('nomad343_dashboard_theme_v1',t),theme);
          await p.route('**/*',r=>['GET','HEAD'].includes(r.request().method())?r.continue():r.abort());
          await p.goto(base+'/index.html?view=statistics',{waitUntil:'domcontentloaded'});
          for(const path of ['/longterm-performance-343.js','/b46-statistics-fast-v1-20261116.js']){const res=await p.request.get(base+path);assert.equal(res.status(),200);new Function(await res.text())}
          await p.waitForFunction(()=>[...document.querySelectorAll('[data-sp-table-body] tr')].some(r=>r.cells.length>=4),null,{timeout:90000});
          for(const market of ['all','1x2','ah','ou','btts','corners','cards','other','all']){
          if(!mobile)await p.locator('[data-stat-market="'+market+'"]').first().click();
          else{await p.locator('[data-stat-market="'+market+'"]').first().evaluate(e=>e.click())}
          await p.waitForFunction(m=>document.querySelector('[data-stat-market].active')?.dataset.statMarket===m&&document.querySelector('#b46-finance-chart-card')?.getBoundingClientRect().height>0&&document.querySelector('.sp-results')?.getBoundingClientRect().height>0,market,{timeout:15000});await p.waitForFunction(()=>document.querySelector('#b46-finance-chart-card .f46-card')?.getBoundingClientRect().height>0,null,{timeout:20000});await p.waitForTimeout(2000);
          const proof=await p.evaluate(()=>{const c=document.querySelector('#b46-finance-chart-card'),v=e=>!!e?.getClientRects().length;const metric=[...c.querySelectorAll('.f46-metrics > div')].find(x=>x.querySelector('span')?.textContent==='SETTLED');const settled=Number(metric?.querySelector('b')?.textContent.replace(/,/g,''));const wdl=[...c.querySelectorAll('.b46-perf-kpi')].find(x=>x.querySelector('span')?.textContent==='W · D · L')?.querySelector('b')?.textContent.split('·').map(x=>Number(x.trim().replace(/,/g,'')));const sections=[...c.querySelectorAll('.b46-stage-outcomes,.b46-market-unified-outcomes')].filter(v).map(e=>{const track=e.querySelector('[class$="-outcomes-track"]'),cs=getComputedStyle(track),rect=track.getBoundingClientRect();return {kind:e.className,shadow:cs.boxShadow,bg:cs.backgroundColor,outline:cs.outlineStyle,height:rect.height,width:rect.width,overflow:e.getBoundingClientRect().right>c.getBoundingClientRect().right+1,rects:{section:e.getBoundingClientRect().toJSON(),overview:e.parentElement.getBoundingClientRect().toJSON(),card:c.getBoundingClientRect().toJSON()},segments:[...track.children].map(x=>({result:x.dataset.result,count:Number(x.dataset.count),width:x.getBoundingClientRect().width,bg:getComputedStyle(x).backgroundColor,shadow:getComputedStyle(x).boxShadow})),legend:[...e.querySelectorAll('[class$="-legend-item"]')].map(x=>({label:x.querySelector('span')?.textContent,pct:x.querySelector('b')?.textContent}))}});return {active:document.querySelector('[data-stat-market].active')?.dataset.statMarket,theme:document.documentElement.dataset.theme,settled,wdl,sections,oldVisible:[...c.querySelectorAll('.b46-v1-market-outcomes')].filter(v).length,style:!!document.getElementById('b46-market-outcome-bar-20261120')}});
          console.log('MARKET_OUTCOME_PROOF '+JSON.stringify({mode,market,...proof}));assert.equal(proof.active,market);assert(proof.style);assert.equal(proof.sections.length,1,'BAR_MISSING_OR_DUPLICATE');assert.equal(proof.oldVisible,0,'OLD_BAR_VISIBLE');const t=proof.sections[0];assert.equal(t.shadow,'none');assert.equal(t.bg,'rgba(0, 0, 0, 0)');assert.equal(t.outline,'none');assert(!t.overflow&&t.width>100&&t.height>0,'BAR_LAYOUT');assert.deepEqual(t.segments.map(x=>x.result),['win','push','loss']);assert.deepEqual(t.segments.map(x=>x.count),proof.wdl);assert.equal(proof.wdl.reduce((a,b)=>a+b,0),proof.settled);assert.deepEqual(t.legend.map(x=>x.pct),proof.wdl.map(n=>proof.settled?(100*n/proof.settled).toFixed(1)+'%':'—'));const colors=proof.theme==='dark'?['rgb(55, 212, 154)','rgb(230, 188, 113)','rgb(255, 103, 121)']:['rgb(8, 124, 80)','rgb(135, 87, 10)','rgb(199, 54, 73)'];for(let i=0;i<3;i++){const x=t.segments[i];assert.equal(x.bg,colors[i]);assert.equal(x.shadow,'none');assert(x.count===0?x.width===0:x.width>0,'ZERO_OR_POSITIVE_WIDTH')}
          }await p.close()
          }))}finally{await browser.close()}
          EOF
      - name: Confirm Production unchanged
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';import {readFile} from 'node:fs/promises';
          const before=await readFile(process.env.RUNNER_TEMP+'/prod-before.json','utf8');const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/ball46-production/deployments?per_page=1',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});const j=await r.json();assert(j.success);assert.deepEqual(j.result.deployments[0].versions,JSON.parse(before));console.log('PRODUCTION_UNCHANGED')
          EOF
