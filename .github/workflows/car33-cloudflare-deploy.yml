name: Deploy CAR 3.3 Fresh Live Engine

on:
  push:
    branches: [main]
    paths:
      - "car3-3-live-engine/worker/**"
      - "car3-3-live-engine/web/**"
      - ".github/workflows/car33-cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate CAR 3.3 fresh code
        working-directory: car3-3-live-engine/worker
        run: |
          node --check src/index.js
          node --check src/entry.js
          node --check src/animation-source.js
          node --check src/live-clock-source.js
          node --test
          node --check ../web/app.js
          node --check ../web/clock-sync.js
          node --check ../web/settings.js
          node --check ../web/history.js
          node --check ../web/statistics.js

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy isolated CAR 3.3 worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: car3-3-live-engine/worker
          wranglerVersion: "4"
          command: deploy

      - name: Start and verify live cycle
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL" || { echo "::error::Deployment URL unavailable"; exit 1; }
          echo "Worker: $DEPLOYMENT_URL"
          code=000
          for attempt in 1 2 3 4; do
            code=$(curl -sS -o /tmp/car33-scan.json -w '%{http_code}' "$DEPLOYMENT_URL/scan" || true)
            cat /tmp/car33-scan.json || true
            if [ "$code" = "200" ]; then break; fi
            if grep -q "Durable Object reset because its code was updated" /tmp/car33-scan.json 2>/dev/null; then
              echo "Transient Durable Object reset; retry $attempt/4"
              sleep 2
              continue
            fi
            break
          done
          test "$code" = "200" || { echo "::error::CAR 3.3 scan HTTP $code"; exit 1; }
          curl -fsS "$DEPLOYMENT_URL/health" | tee /tmp/car33-health.json
          python - <<'PY'
          import json
          scan=json.load(open('/tmp/car33-scan.json'))
          health=json.load(open('/tmp/car33-health.json'))
          assert scan.get('ok') is True, scan
          assert health.get('engine')=='CAR 3.3', health
          assert health.get('ok') is True, health
          print('CAR 3.3 health PASS')
          PY

      - name: Verify live payload contract
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          curl -fsS "$DEPLOYMENT_URL/live" > /tmp/car33-live.json
          curl -fsS "$DEPLOYMENT_URL/config" > /tmp/car33-config-final.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/car33-live.json'))
          c=json.load(open('/tmp/car33-config-final.json'))
          assert p.get('engine')=='CAR 3.3', p
          assert isinstance(p.get('matches'),list), p
          assert isinstance(p.get('activeSignals'),list), p
          assert c.get('config',{}).get('market') in ('WIN','AH','OU'), c
          for m in p['matches'][:25]:
              assert 'sourceClock' in m
              assert 'elapsedSeconds' in m
              assert 'score' in m
          print('CAR 3.3 live contract PASS; matches=',len(p['matches']),'signals=',len(p['activeSignals']),'market=',c.get('config',{}).get('market'))
          PY

      - name: Verify statistics page and history contract
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          curl -fsS "$DEPLOYMENT_URL/statistics.html" > /tmp/car33-statistics.html
          grep -q "STATISTICS" /tmp/car33-statistics.html
          grep -q "statistics.js" /tmp/car33-statistics.html
          curl -fsS "$DEPLOYMENT_URL/history?page=1&limit=25" > /tmp/car33-history.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/car33-history.json'))
          assert isinstance(p.get('records'),list), p
          assert isinstance(p.get('summary'),dict), p
          s=p['summary']
          for key in ('total','win','loss','draw','pending','winRate','averageOdds'):
              assert key in s, (key,s)
          assert p.get('total')==s.get('total'), p
          print('CAR 3.3 statistics PASS; records=',len(p['records']),'total=',p['total'],'pending=',s['pending'],'winRate=',s['winRate'],'averageOdds=',s['averageOdds'])
          PY

      - name: Verify direct Goaloo clock contract
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          curl -fsS "$DEPLOYMENT_URL/clock" > /tmp/car33-clock.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/car33-clock.json'))
          assert p.get('ok') is True, p
          assert p.get('source')=='GOALOO_BF_US_FIELDS_6_7_8', p
          assert p.get('mode')=='SOURCE_SNAPSHOT_ONLY', p
          assert isinstance(p.get('clocks'),list), p
          for c in p['clocks'][:25]:
              assert 'sourceClock' in c
              assert 'elapsedSeconds' in c
              assert c.get('status') in ('LIVE','HT'), c
          print('CAR 3.3 direct Goaloo clock PASS; clocks=',len(p['clocks']))
          PY

      - name: Verify source-driven animation contract
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          invalid_code=$(curl -sS -o /tmp/car33-animation-invalid.json -w '%{http_code}' "$DEPLOYMENT_URL/animation?id=not-a-match")
          test "$invalid_code" = "400" || { cat /tmp/car33-animation-invalid.json; echo "::error::Animation invalid-id contract failed: HTTP $invalid_code"; exit 1; }
          MATCH_ID=$(python - <<'PY'
          import json
          p=json.load(open('/tmp/car33-live.json'))
          print(str((p.get('matches') or [{}])[0].get('id') or ''))
          PY
          )
          if [ -z "$MATCH_ID" ]; then
            echo "No live match available; animation route validation passed with invalid-id contract."
            exit 0
          fi
          code=$(curl -sS -o /tmp/car33-animation.json -w '%{http_code}' "$DEPLOYMENT_URL/animation?id=$MATCH_ID")
          cat /tmp/car33-animation.json
          test "$code" = "200" || { echo "::error::Animation live route HTTP $code"; exit 1; }
          python - <<'PY'
          import json
          p=json.load(open('/tmp/car33-animation.json'))
          assert p.get('fallback')=='HOLD_LAST_SOURCE_POSITION', p
          if p.get('ok'):
              assert p.get('sourceTransport')=='GOALOO_PUBLIC_FLASHDATA_HTTP', p
              assert p.get('sourceCoordinateSystem')=='NORMALIZED_0_1', p
              for e in p.get('events') or []:
                  for pt in e.get('points') or []:
                      assert 0 <= float(pt['x']) <= 1, pt
                      assert 0 <= float(pt['y']) <= 1, pt
              print('CAR 3.3 source animation PASS; events=',len(p.get('events') or []),'current=',(p.get('current') or {}).get('type'))
          else:
              assert p.get('reason') in ('ANIMATION_SOURCE_UNAVAILABLE','ANIMATION_SOURCE_PARSE_INCOMPLETE'), p
              print('CAR 3.3 animation route PASS with source hold:',p.get('reason'))
          PY
