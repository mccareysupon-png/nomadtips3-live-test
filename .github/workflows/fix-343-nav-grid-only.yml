name: Fix 3.43 Header Nav Grid Only
on:
  push:
    branches:
      - work/nomad343-menu-structure-v2-20260914
    paths:
      - .github/workflows/fix-343-nav-grid-only.yml
jobs:
  verify-promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CANARY_URL: https://nomadtips3-343-stable-preview.mccarey-supon.workers.dev
      PROD_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev
      ACTIVE_BRANCH: work/nomad343-server-prewarm-20260914
      BASE_SHA: c0b789354ff706eead21c4c37a4d27b2add728a0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nomad343-menu-structure-v2-20260914
          fetch-depth: 60
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply header-only patch
        run: |
          set -euo pipefail
          python .github/scripts/patch-343-nav-grid-only.py
          grep -Fq '343 HEADER NAV GRID ONLY V1' nomad-live-343/app.css
          grep -Fq -- '--content-max:none' nomad-live-343/app.css
          grep -Fq 'scrollbar-gutter:auto' nomad-live-343/app.css
          grep -Fq '.shell{width:100%;max-width:none' nomad-live-343/app.css
          grep -Fq '343-live-signal-summary-v2-tight' nomad-live-343/index.html
          grep -Fq 'signalSummaryText' nomad-live-343/live-stable-343.js
          for f in index.html signal.html statistics.html; do grep -Fq 'app.css?v=343-full-width-v3-nav-grid' "nomad-live-343/$f"; done
          grep -Fq '<nav class="topnav"><a data-nav="live"' nomad-live-343/statistics.html
          grep -Fq '<nav class="mobile-nav"><a data-nav="live"' nomad-live-343/statistics.html
      - name: Verify runtime scope
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA"..HEAD; git diff --name-only)"
          printf '%s\n' "$changed" | sed '/^$/d' | sort -u | tee /tmp/changed.txt
          if grep -Ev '^(nomad-live-343/(app.css|index.html|signal.html|statistics.html)|\.github/(scripts/(test-343-nav6.js|patch-343-nav-grid-only.py)|workflows/(fix-343-menu-structure-v2.yml|fix-343-menu-structure-v2-rerun.yml|fix-343-nav-grid-only.yml)))$' /tmp/changed.txt | grep -q .; then
            echo UNEXPECTED_SCOPE_CHANGE
            exit 1
          fi
          git diff --quiet "$BASE_SHA" -- workers/nomadtips3-engine-343 workers/nomadtips3-5usd-hub-343 workers/nomadtips3-343-full-market-central workers/nomadtips3-343-full-market nomad-live-341 nomad-live-343/live-stable-343.js nomad-live-343/signal.js nomad-live-343/statistics.js
      - name: Dry run viewers
        run: |
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.stable.jsonc)
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc)
      - name: Install browser test
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Commit exact runtime patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nomad-live-343/app.css nomad-live-343/index.html nomad-live-343/signal.html nomad-live-343/statistics.html
          if ! git diff --cached --quiet; then
            git commit -m "fix(343): standardize three-page header navigation"
            git push origin HEAD:work/nomad343-menu-structure-v2-20260914
          fi
      - name: Deploy canary
        run: |
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.stable.jsonc
      - name: Wait for canary assets
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            ok=1
            for f in index.html signal.html statistics.html; do
              html="$(curl -fsS "$CANARY_URL/$f?nav=$RANDOM$(date +%s)" || true)"
              grep -Fq '343-full-width-v3-nav-grid' <<<"$html" || ok=0
            done
            if [ "$ok" = 1 ]; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Test canary all six permutations
        run: TARGET_URL="$CANARY_URL" node .github/scripts/test-343-nav6.js
      - name: Test canary full width and signal-lock markers
        run: |
          cat > /tmp/scope.js <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});for(const [w,h] of [[1366,900],[1920,1000],[390,844]]){const p=await b.newPage({viewport:{width:w,height:h}});await p.goto(process.env.TARGET_URL+'/index.html?scope='+Date.now(),{waitUntil:'load'});const x=await p.evaluate(()=>({shell:document.querySelector('.shell')?.getBoundingClientRect().width,client:document.documentElement.clientWidth,summary:document.querySelector('[data-field="signal-summary"]')!==null||document.documentElement.innerHTML.includes('343-live-signal-summary-v2-tight')}));if(!x.summary||!x.shell||x.shell<x.client-30)throw new Error(JSON.stringify({w,x}));await p.close()}await b.close();console.log('FULL_WIDTH_AND_SIGNAL_LOCK_OK')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          TARGET_URL="$CANARY_URL" node /tmp/scope.js
      - name: Verify active branch unchanged before prod
        run: |
          set -euo pipefail
          git fetch origin "$ACTIVE_BRANCH" --depth=1
          test "$(git rev-parse origin/$ACTIVE_BRANCH)" = "$BASE_SHA"
      - name: Deploy production
        id: prod
        run: |
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc
      - name: Wait for production assets
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            ok=1
            for f in index.html signal.html statistics.html; do
              html="$(curl -fsS "$PROD_URL/$f?nav=$RANDOM$(date +%s)" || true)"
              grep -Fq '343-full-width-v3-nav-grid' <<<"$html" || ok=0
            done
            if [ "$ok" = 1 ]; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Test production all six permutations
        run: TARGET_URL="$PROD_URL" node .github/scripts/test-343-nav6.js
      - name: Test production full width and signal-lock markers
        run: TARGET_URL="$PROD_URL" node /tmp/scope.js
      - name: Promote tested branch
        run: |
          set -euo pipefail
          git fetch origin "$ACTIVE_BRANCH" --depth=1
          test "$(git rev-parse origin/$ACTIVE_BRANCH)" = "$BASE_SHA"
          git push origin HEAD:"$ACTIVE_BRANCH"
      - name: Roll back production on failure
        if: failure() && steps.prod.outcome == 'success'
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc
