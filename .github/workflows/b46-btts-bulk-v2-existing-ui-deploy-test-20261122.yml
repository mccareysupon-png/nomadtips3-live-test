name: BALL46 BTTS Bulk V2 Existing PreMatch UI Readiness TEST Deploy
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-btts-bulk-v2-existing-ui-deploy-test-20261122.yml]
permissions:
  contents: read
concurrency:
  group: ball46-premium-match-colors-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure QA for existing UI BTTS-only readiness without paid calls
        run: |
          node --check qa/prematch-history-20261120/patch-existing-btts-bulk-v2-readiness-ui-20261122.mjs
          node --check qa/prematch-history-20261120/deploy-existing-btts-v2-ui-readiness-test-20261122.mjs
          node --test qa/prematch-history-20261120/patch-existing-btts-bulk-v2-readiness-ui.test.mjs qa/prematch-history-20261120/btts-bulk-truck-v2.test.mjs qa/prematch-history-20261120/btts-ultra-shadow.test.mjs
      - name: Deploy only original TEST UI BTTS readiness view and safe service proxy
        run: node qa/prematch-history-20261120/deploy-existing-btts-v2-ui-readiness-test-20261122.mjs
