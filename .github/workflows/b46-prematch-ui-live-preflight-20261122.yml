name: BALL46 Pre-Match TEST UI live module preflight READ ONLY
on:
  push:
    branches: [fix/ball46-prematch-league-result-badges-20261122]
    paths: ['.github/workflows/b46-prematch-ui-live-preflight-20261122.yml']
permissions: {contents: read}
jobs:
  inspect-test-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read active TEST worker modules and bindings without mutation
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          assert(token&&account,'MISSING_TEST_WORKER_CREDENTIALS');
          const worker='ball46-premium-match-colors-test-20261120';
          const root='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers';
          async function cf(url){
            const r=await fetch(url,{headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(30000)});
            const j=await r.json();
            assert(r.ok&&j.success,'CF_READ_FAILED_'+r.status+'_'+JSON.stringify(j.errors||[]));
            return j.result;
          }
          const active=await cf(root+'/scripts/'+worker+'/deployments?per_page=1');
          const version=active.deployments?.[0]?.versions?.[0]?.version_id;
          assert(version,'NO_CURRENT_TEST_VERSION');
          const script=await cf(root+'/workers/'+worker+'/versions/'+version+'?include=modules');
          const settings=await cf(root+'/scripts/'+worker+'/settings');
          const modules=(script.modules||[]).map(m=>({
            name:m.name,content_type:m.content_type||null,
            base64:typeof m.content_base64==='string',size:typeof m.content_base64==='string'?Math.round(m.content_base64.length*.75):null
          }));
          const names=(settings.bindings||[]).map(b=>({name:b.name,type:b.type}));
          const summary={worker,version,main:script.main_module,compatibility_date:script.compatibility_date,modules,bindings:names};
          console.log('B46_PREMATCH_TEST_ACTIVE_READONLY '+JSON.stringify(summary));
          assert(modules.some(m=>m.name==='prematch-client.mjs'&&m.base64),'MISSING_UI_CLIENT_MODULE');
          assert(modules.some(m=>m.name==='prematch-live-score-mirror.mjs'&&m.base64),'MISSING_UI_MIRROR_MODULE');
          JS
