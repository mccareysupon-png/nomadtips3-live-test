name: BALL46 Pre-Match TEST live bundle exact-source gate READ ONLY
on:
  push:
    branches: [fix/ball46-prematch-league-result-badges-20261122]
    paths: ['.github/workflows/b46-prematch-ui-live-preflight-20261122.yml']
permissions: {contents: read}
jobs:
  inspect-test-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Verify exact deployed UI scripts vs original source (NO WRITES)
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import vm from 'node:vm';
          import {execFileSync} from 'node:child_process';
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          assert(token&&account,'MISSING_TEST_CREDENTIALS');
          const root='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers';
          const worker='ball46-premium-match-colors-test-20261120';
          async function cf(url){
            const r=await fetch(url,{headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(30000)});
            const j=await r.json();assert(r.ok&&j.success,'CF_READ_FAILED_'+r.status+' '+JSON.stringify(j.errors||[]));return j.result;
          }
          const active=await cf(root+'/scripts/'+worker+'/deployments?per_page=1');
          const version=active.deployments?.[0]?.versions?.[0]?.version_id;
          assert(version,'NO_ACTIVE_WORKER_VERSION');
          const script=await cf(root+'/workers/'+worker+'/versions/'+version+'?include=modules');
          assert(script.modules?.length===1&&script.modules[0].name==='worker.js','MODULE_SHAPE_CHANGED');
          const source=Buffer.from(script.modules[0].content_base64,'base64').toString('utf8');
          function extract(name){
            const prefix='var '+name+' = ',start=source.indexOf(prefix);
            assert(start>=0&&source.indexOf(prefix,start+1)<0,'MISSING_OR_AMBIGUOUS_'+name);
            const at=start+prefix.length;
            assert(source[at]==='\u0060','EXPECTED_TEMPLATE_LITERAL_'+name);
            let end=-1;
            for(let i=at+1;i<source.length;i++){
              if(source[i]==='\\'){i++;continue}
              if(source[i]==='\u0060'){end=i;break}
            }
            assert(end>at&&source[end+1]===';','UNCLOSED_SCRIPT_LITERAL_'+name);
            return vm.runInNewContext('('+source.slice(at,end+1)+')',Object.create(null),{timeout:1500});
          }
          const baseline='a748f226e0b371c4616778864af0309ea201cfec';
          const modules=[['prematchClientScript','prematch-client.mjs'],['prematchMirrorClientScript','prematch-live-score-mirror.mjs']];
          const state=[];
          for(const [symbol,filename] of modules){
            const path='qa/prematch-native-ui-20261121/'+filename;
            const moduleText=execFileSync('git',['show',baseline+':'+path],{encoding:'utf8'});
            const old=(await import('data:text/javascript;base64,'+Buffer.from(moduleText).toString('base64')))[symbol];
            const actual=extract(symbol);
            const at=[...old].findIndex((v,i)=>v!==actual[i]);
            const same=actual===old;
            state.push({symbol,same,sourceLength:old.length,liveLength:actual.length,firstDiff:at,
              oldHash:crypto.createHash('sha256').update(old).digest('hex').slice(0,16),
              liveHash:crypto.createHash('sha256').update(actual).digest('hex').slice(0,16)});
          }
          console.log('B46_PREMATCH_EXACT_SOURCE_GATE '+JSON.stringify({worker,version,state}));
          assert(state.every(x=>x.same),'TEST_LIVE_UI_DRIFT_NO_DEPLOY_ALLOWED');
          JS
