name: BALL46 Featured Match read only current-version audit
on:
  push:
    branches: [codex/ball46-featured-ad-20261102]
    paths:
      - '.github/workflows/ball46-featured-live-audit-20261102.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read currently deployed Worker only; do not alter production
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {writeFileSync,mkdirSync} from 'node:fs';
          const id=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN,script='ball46-production';
          if(!id || !token)throw Error('CLOUDFLARE_SECRETS_NOT_CONFIGURED');
          const api=async p=>{
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+id+'/workers'+p,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(55000)});
            const j=await r.json();if(!r.ok||!j.success)throw Error('CF_API_'+r.status+':'+JSON.stringify(j.errors));return j.result;
          };
          const deps=await api('/scripts/'+script+'/deployments?per_page=3');
          const live=deps.deployments?.[0];if(live?.versions?.length!==1||Number(live.versions[0].percentage)!==100)throw Error('NOT_SINGLE_ACTIVE_100PCT');
          const version=live.versions[0].version_id;
          const v=await api('/workers/'+script+'/versions/'+version+'?include=modules');
          const sha=buf=>createHash('sha256').update(buf).digest('hex');
          const evidence={at:new Date().toISOString(),worker:script,version,modules:v.modules?.length,readOnly:true,writes:0,files:{},matches:{}};
          const needles=['featured-card','featured-match','featuredCard','FEATURED MATCH','feature-score','feature-facts','feature-header','featuredMatch'];
          for(const name of ['assets/index.html','assets/singlepage-workspace-343.js','assets/singlepage-workspace-343.css','index.js']){
            const part=v.modules.find(m=>m.name===name);if(!part)continue;
            const b=Buffer.from(part.content_base64,'base64'),s=b.toString('utf8');
            evidence.files[name]={bytes:b.length,sha256:sha(b)};
            evidence.matches[name]={};
            for(const n of needles){let from=0,hits=[];while(hits.length<5){const i=s.indexOf(n,from);if(i<0)break;hits.push({at:i,context:s.slice(Math.max(0,i-125),Math.min(s.length,i+200)).replace(/data:image[^"')]+/g,'[image omitted]')});from=i+n.length}if(hits.length)evidence.matches[name][n]=hits}
          }
          const check=await api('/scripts/'+script+'/deployments?per_page=3');
          evidence.afterVersion=check.deployments?.[0]?.versions?.[0]?.version_id;
          if(evidence.afterVersion!==version)throw Error('LIVE_CHANGED_DURING_AUDIT');
          mkdirSync('audit',{recursive:true});writeFileSync('audit/featured-live.json',JSON.stringify(evidence,null,2));
          console.log('READ_ONLY_FEATURED_EVIDENCE='+JSON.stringify(evidence).slice(0,19000));
          NODE
      - name: Store sanitized audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-featured-live-audit-${{ github.run_id }}
          path: audit/featured-live.json
          if-no-files-found: warn
          retention-days: 14
