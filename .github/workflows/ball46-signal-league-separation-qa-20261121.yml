name: BALL46 Signal league strip no-overlap TEST QA
on:
  push:
    branches: [test/ball46-premium-match-colors-20261120]
    paths:
      - '.github/workflows/ball46-signal-league-separation-qa-20261121.yml'
      - 'qa/signal-stable-20261121/signal-stable.mjs'
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check qa/signal-stable-20261121/signal-stable.mjs
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Verify separate league line and preserve native team sizes on PC/mobile
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {chromium,devices} from 'playwright';
          const base='https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev';
          let ready=false;for(let i=0;i<42;i++){
            try{const r=await fetch(base+'/_premium_health',{signal:AbortSignal.timeout(18000)});const h=await r.json();
              if(h.signalStableStyles?.includes('b46-signal-league-strip')&&!h.signalStableStyles.includes('position:absolute;right:3px;bottom:1px')){ready=true;break}
            }catch{}
            await new Promise(r=>setTimeout(r,1900));
          }
          assert(ready,'LATEST_SIGNAL_LEAGUE_STRIP_NOT_DEPLOYED');
          const b=await chromium.launch();
          for(const mode of ['desktop','mobile']){
            const p=await b.newPage(mode==='desktop'?{viewport:{width:1440,height:960},serviceWorkers:'block'}:{...devices['iPhone 13'],viewport:{width:390,height:844},serviceWorkers:'block'});
            await p.addInitScript(()=>localStorage.setItem('nomad343_dashboard_theme_v1','dark'));
            await p.goto(base+'/?view=signal',{waitUntil:'domcontentloaded',timeout:70000});
            await p.waitForFunction(()=>window.__b46SignalStableStatus?.seenSource===true&&document.querySelector('.status-section .b46-signal-league-strip'),null,{timeout:45000});
            await p.waitForTimeout(550);
            const proof=await p.evaluate(()=>{
              const status=document.querySelector('.status-section[data-status-section="live"]');
              const boxes=e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,right:r.right,bottom:r.bottom,width:r.width,height:r.height}};
              const rows=[...status.querySelectorAll('.league-block > .match-row')].map(r=>{
                const strip=r.previousElementSibling?.matches('.b46-signal-league-strip')?r.previousElementSibling:null;
                const cell=r.querySelector('.teams-cell');
                const names=cell?[...cell.querySelectorAll(':scope > b')]:[];
                const scores=cell?[...cell.querySelectorAll(':scope > strong')]:[];
                return {id:r.dataset.matchId,row:boxes(r),strip:strip?{text:strip.textContent.trim(),id:strip.dataset.b46SignalLeagueFor,box:boxes(strip)}:null,oldChip:!!cell?.querySelector('.b46-signal-league-chip'),names:names.map(boxes),scores:scores.map(boxes),cell:cell?boxes(cell):null,order:getComputedStyle(r).order};
              }).sort((a,b)=>a.row.y-b.row.y);
              const hdr=[...status.querySelectorAll('.league-head')].filter(e=>e.getBoundingClientRect().height>0);
              return {rows,viewport:innerWidth,docWidth:document.documentElement.scrollWidth,headerCount:hdr.length,signalState:window.__b46SignalStableQA.state()};
            });
            console.log('B46_SIGNAL_LEAGUE_ROW_GEOMETRY_'+mode+' '+JSON.stringify(proof));
            assert(proof.rows.length>=1,'NO_PREDICTIONS_'+mode);
            assert.equal(proof.headerCount,1,'LEAGUE_HEADING_REPEATED_'+mode);
            assert(proof.docWidth<=proof.viewport+1,'HORIZONTAL_OVERFLOW_'+mode);
            for(let i=0;i<proof.rows.length;i++){
              const x=proof.rows[i];assert(x.strip,'LEAGUE_LABEL_MISSING_'+x.id);assert.equal(x.strip.id,x.id,'LEAGUE_MISMATCH_'+x.id);
              assert(x.strip.text&&x.strip.text!==x.id,'LEAGUE_TEXT_INVALID_'+x.id);
              assert(!x.oldChip,'OLD_OVERLAY_CHIP_PERSISTS_'+x.id);
              assert(x.strip.box.bottom<=x.row.y+1,'LEAGUE_STRIP_OVERLAPS_CARD_'+x.id);
              assert(x.row.width<=proof.viewport+1,'CARD_TOO_WIDE_'+x.id);
              assert(x.names.length===2&&x.scores.length===2,'TEAM_DETAILS_LOST_'+x.id);
              for(const b of [...x.names,...x.scores])assert(b.y>=x.row.y-7&&b.bottom<=x.row.bottom+7,'TEAM_OVERFLOWS_CARD_'+x.id);
              if(i>0)assert(x.strip.box.y>=proof.rows[i-1].row.bottom-1,'LEAGUE_LABEL_CLIPS_PRIOR_MATCH_'+x.id);
            }
            await p.locator('.status-section .match-row').first().click({position:{x:70,y:25},force:true});
            await p.waitForFunction(()=>!!document.querySelector('.status-section .expand-flow-card'),null,{timeout:20000});
            const liveOrder=await p.evaluate(()=>({frozen:window.__b46SignalStableQA.state().frozen,flow:!!document.querySelector('.status-section .expand-flow-card'),strips:document.querySelectorAll('.status-section .b46-signal-league-strip').length}));
            assert(liveOrder.flow&&liveOrder.frozen,'EVENT_FLOW_BROKEN_'+mode);
            console.log('BALL46_SIGNAL_LEAGUE_NO_OVERLAP_PASS_'+mode+' '+JSON.stringify({matches:proof.rows.length,headerCount:proof.headerCount,liveOrder}));
            await p.close();
          }
          await b.close();
          NODE