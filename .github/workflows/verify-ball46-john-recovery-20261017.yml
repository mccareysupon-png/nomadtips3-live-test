name: Verify John pricing recovery after duplicate cron repair
on:
  push:
    branches: [fix/ball46-john-single-pricing-cron-20261017]
    paths: [.github/workflows/verify-ball46-john-recovery-20261017.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Observe two new live pricing cycles without generating scans
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          const base='https://ball46-production.mccarey-supon.workers.dev';
          async function read(url){const r=await fetch(url+'?post_repair='+Date.now(),{signal:AbortSignal.timeout(17000),headers:{'cache-control':'no-cache'}});const d=await r.json();return{ok:r.ok&&d.ok===true,status:r.status,data:d}}
          for(let i=0;i<3;i++){
            const [h,p,e,s]=await Promise.all([
              read('https://nomadtips3-5usd-hub-343.mccarey-supon.workers.dev/health'),
              read(base+'/api/full-market/health'),
              read('https://nomadtips3-engine-343.mccarey-supon.workers.dev/health'),
              read(base+'/api/engine/signals')]);
            const errs=e.data.refereeErrors||[],count=errs.filter(x=>String(x.error||'').includes('CACHE_MISS')).length;
            console.log('JOHN_PRICE_RECOVERY_SAMPLE '+JSON.stringify({sample:i,at:new Date().toISOString(),
              status:[h.status,p.status,e.status,s.status],liveCount:e.data.liveCount,
              queue:e.data.refereeQueued,cacheMiss:count,
              prewarm:p.data.prewarmMeta&&{requested:p.data.prewarmMeta.requested,attempted:p.data.prewarmMeta.attempted,warmed:p.data.prewarmMeta.warmed,cacheHits:p.data.prewarmMeta.cacheHits,errorCount:p.data.prewarmMeta.errors?.length},
              provider:p.data.providerMeta&&{status:p.data.providerMeta.lastStatus,remaining:p.data.providerMeta.remaining,limit:p.data.providerMeta.limit},
              hubError:h.data.lastError,
              signals:s.data.signals?.length,hiddenPending:s.data.mirror?.hiddenPendingSignals}));
            if(i!==2)await new Promise(resolve=>setTimeout(resolve,36000));
          }
          const a=process.env.CLOUDFLARE_ACCOUNT_ID,t=process.env.CLOUDFLARE_API_TOKEN;
          for(const name of ['ball46-production','nomadtips3-343-central-cache','nomadtips3-engine-343','nomadtips3-5usd-hub-343','nomadtips3-full-market-343-ball46']){
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+a+'/workers/scripts/'+name+'/schedules',{headers:{Authorization:'Bearer '+t}});
            const j=await r.json();if(!j.success)throw Error('CRON_AUDIT_FAILED_'+name);
            console.log('JOHN_CRON_VERIFY '+JSON.stringify({worker:name,crons:j.result.schedules.map(x=>x.cron)}));
          }
          NODE
