name: BALL46 HCR Inspect ALL Stored Fields for Fixture 203963222
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-prematch-five-trip-factual-report-20261122.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read-only inspect complete existing raw FT fixture, no external API
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          const token=process.env.CLOUDFLARE_API_TOKEN;assert(token);
          const host='https://ball46-prematch-only-test-20261120.mccarey-supon.workers.dev';
          const auth='Bearer '+crypto.createHmac('sha256',token).update('BALL46_PREMATCH_ONLY_V1').digest('hex');
          async function get(path) {
            const r=await fetch(host+path,{headers:{authorization:auth},cache:'no-store',signal:AbortSignal.timeout(25000)});
            assert(r.ok,'TEST_WORKER_GET_'+path+'_HTTP_'+r.status);
            return r.json();
          }
          const [full,hcr]=await Promise.all([
            get('/history-cargo-full?day=2026-11-22&round=4&fixture=203963222&detail=1'),
            get('/history-cargo-registry?day=2026-11-22&detail=1')
          ]);
          assert.equal(full.registry,'HISTORY-CARGO-FULL-V1');
          const fixture=full.fixture;
          assert(fixture,'MISSING_RAW_FIXTURE');
          assert.equal(String(fixture.fixtureId),'203963222');
          const trip=hcr.rounds.find(x=>x.businessDay==='2026-11-22'&&x.roundNo===4);
          assert(trip&&trip.manifestStatus==='TRACKED','MISSING_TRACKED_TRIP');
          const item=trip.items.find(x=>String(x.fixtureId)==='203963222');
          assert(item&&item.archiveStatus==='FINISHED','MISSING_ARCHIVED_FT');
          assert.equal(String(fixture.home.id),String(item.homeTeamId));
          assert.equal(String(fixture.away.id),String(item.awayTeamId));
          assert.equal(fixture.goals.home,item.homeGoals);
          assert.equal(fixture.goals.away,item.awayGoals);
          console.log('B46_HCR_ALL_FIELDS_META '+JSON.stringify({id:fixture.fixtureId,round:4,day:'2026-11-22',archive:item,fieldCount:Object.keys(fixture).length,fields:Object.keys(fixture),upstreamCalls:0,prodWrites:0}));
          for(const [field,value] of Object.entries(fixture)) {
            console.log('B46_HCR_ALL_FIELDS '+JSON.stringify({field,value}));
          }
          JS
