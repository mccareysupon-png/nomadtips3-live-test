name: DIAG Ball46 Featured Card Style 20261013

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-ball46-featured-card-style-20261013.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-performance-chart-market-style-20261012
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts acorn@8
      - name: Inspect current Featured card CSS
        working-directory: deploy-assets/performance-chart-market-style-20261012
        run: |
          node --input-type=module <<'NODE'
          import {publicFile} from '../daily-performance-20261005/production.mjs';
          const css=(await publicFile('/singlepage-workspace-343.css')).toString('utf8');
          for(const needle of ['.featured-card','.feature-score','.feature-facts','.feature-status','.feature-signal']){
            let from=0,n=0;while(true){const i=css.indexOf(needle,from);if(i<0)break;console.log('\n=== '+needle+' #'+(++n)+' @ '+i+' ===\n'+css.slice(Math.max(0,i-1200),Math.min(css.length,i+5000)));from=i+needle.length;if(n>=12)break}
          }
          NODE
