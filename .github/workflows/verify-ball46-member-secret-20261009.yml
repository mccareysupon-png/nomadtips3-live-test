name: Verify Ball46 Member Stripe Secret
on:
  push:
    branches: [member/ball46-member-v1-20261008]
    paths: ['.github/workflows/verify-ball46-member-secret-20261009.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secret binding and safety gates only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          assert(account&&token,'CLOUDFLARE_CI_CREDENTIALS_MISSING');
          const base='https://api.cloudflare.com/client/v4/accounts/'+account;
          async function get(path){
            const r=await fetch(base+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(15000)});
            const j=await r.json();
            assert(r.ok&&j.success===true,'CF_REQUEST_FAILED '+r.status+' '+path);
            return j.result;
          }
          const worker='ball46-member-production';
          const secrets=await get('/workers/scripts/'+worker+'/secrets');
          const secretNames=['STRIPE_SECRET_KEY','CF_ACCESS_TEAM_DOMAIN','CF_ACCESS_AUD'];
          for(const name of secretNames){
            const present=secrets.some(s=>s.name===name&&s.type==='secret_text');
            console.log('WORKER_SECRET_PRESENT '+name+' '+present);
            assert(present,'REQUIRED_SECRET_MISSING '+name);
          }
          const settings=await get('/workers/scripts/'+worker+'/settings');
          const prices=(settings.bindings||[]).filter(b=>b.name==='STRIPE_PRICE_ID'&&b.type==='plain_text');
          assert(prices.length===1&&prices[0].text==='price_1UOGIkFXmKSSVxQdhVjI9ml6','STRIPE_PRICE_MISMATCH');
          console.log('BALL46_STRIPE_PRICE_CORRECT');
          const apps=await get('/access/apps?per_page=100');
          assert(apps.some(a=>a.name==='Ball46 Member'&&JSON.stringify(a).includes('member.ball46.com')),'ACCESS_APP_MISSING');
          for(const app of apps.filter(a=>a.name==='Ball46 Member'||JSON.stringify(a).includes('member.ball46.com'))){
            const domains=(app.self_hosted_domains||[]).map(d=>d.hostname+(d.path||''));
            const targets=[...(app.domain?[app.domain]:[]),...(app.path?[app.path]:[]),...domains];
            console.log('ACCESS_APP_ROUTES '+JSON.stringify({id:app.id,name:app.name,targets,policiesOnApp:(app.policies||[]).length}));
            let policies=[];
            try{policies=await get('/access/apps/'+app.id+'/policies?per_page=100');}
            catch{policies=app.policies||[];}
            for(const p of policies){
              console.log('ACCESS_POLICY_SUMMARY '+JSON.stringify({
                decision:p.decision,name:p.name,includeEveryone:(p.include||[]).some(x=>!!x.everyone),
                includeEmailCount:(p.include||[]).reduce((n,x)=>n+(Array.isArray(x.email)?x.email.length:(x.email?1:0)),0),
                requireCount:(p.require||[]).length,excludeCount:(p.exclude||[]).length
              }));
            }
          }
          const root='https://member.ball46.com';
          const pricing=await fetch(root+'/pricing',{redirect:'manual',signal:AbortSignal.timeout(15000)});
          assert.equal(pricing.status,200,'PRICING_NOT_PUBLIC');await pricing.body?.cancel();
          const member=await fetch(root+'/member',{redirect:'manual',signal:AbortSignal.timeout(15000)});
          assert([302,303,307,308,401,403].includes(member.status),'UNAUTHENTICATED_MEMBER_NOT_BLOCKED');
          console.log('ANONYMOUS_MEMBER_GATE_HTTP '+member.status);await member.body?.cancel();
          const checkout=await fetch(root+'/api/stripe/checkout',{method:'POST',redirect:'manual',signal:AbortSignal.timeout(15000)});
          assert.equal(checkout.status,503,'CHECKOUT_NOT_DISABLED');
          const cj=await checkout.json();
          assert.equal(cj.error,'CHECKOUT_DISABLED_UNTIL_VERIFIED_ENTITLEMENTS','CHECKOUT_GATE_CHANGED');
          console.log('BALL46_MEMBER_STRIPE_SECRET_BINDING_AND_SAFETY_GATES_VERIFIED');
          console.log('NOTICE: Secret existence verified; Stripe credential validity and paid-customer happy path not tested.');
          NODE
