name: BALL46 approved Motagua Ledger reconciliation
on:
  push:
    branches: [codex/ball46-ledger-reconcile-motagua-20261102]
    paths: ['work/ball46-ledger-reconcile-motagua-20261102/deploy-request.json']
permissions:
  contents: write
concurrency:
  group: ball46-motagua-approved-ledger-repair
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      B46_APPROVED_OPERATION: B46_MOTAGUA_DUPLICATE_20261102_V1
    defaults:
      run:
        working-directory: work/ball46-ledger-reconcile-motagua-20261102
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false acorn@8.15.0 miniflare@5.20261101.0-beta
      - run: node prepare.mjs
      - run: node build.mjs
      - run: node --experimental-vm-modules test.mjs
      - run: node runtime-test.mjs
      - name: Preserve exact modules and settings, activate approved Engine patch and verify normal Cron reconciliation
        run: node deploy.mjs
      - name: Preserve sanitized evidence only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repair-audit
          git diff --cached --quiet || git commit -m "Approved Motagua Engine deployment and data preservation evidence [skip ci]"
          git push origin HEAD:codex/ball46-ledger-reconcile-motagua-20261102
