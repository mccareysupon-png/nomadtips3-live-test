name: BALL46 approved compact member promotion release
on:
  push:
    branches: [codex/ball46-member-promo-20261104]
    paths: ['work/member-promo-card-20261104/release-request.json']
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install source parsing and isolated browser verification
        run: |
          npm install --no-save --package-lock=false --prefix work/member-promo-card-20261104 acorn@8.15.0 parse5@7.3.0 playwright@1.56.1
          cd work/member-promo-card-20261104 && npx playwright install --with-deps chromium
      - name: Validate approved assets, no data requests, read-only theme and original photo composition
        run: |
          node work/member-promo-card-20261104/build-release.mjs
          node --check work/member-promo-card-20261104/release.mjs
      - name: Fresh Production capture and non-traffic candidate preserving all current modules and assets
        run: node work/member-promo-card-20261104/release.mjs stage
      - name: Candidate PC and mobile in both light and dark with real data and existing 5s reader
        run: node work/member-promo-card-20261104/release-browser.mjs candidate
      - name: Activate only the owner-approved member promotion
        run: node work/member-promo-card-20261104/release.mjs activate
      - name: Verify Production PC and mobile light and dark, image, link, scores and no duplicate cards
        run: node work/member-promo-card-20261104/release-browser.mjs production
      - name: Restore immediate baseline on post-activation verification failure
        if: failure()
        run: node work/member-promo-card-20261104/release-rollback.mjs
      - name: Preserve release evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/member-promo-card-20261104/release-audit/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record guarded member promotion release and preserved Production [skip ci]"
          git push origin HEAD:codex/ball46-member-promo-20261104
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: member-promo-release-proof
          path: work/member-promo-card-20261104/release-audit
