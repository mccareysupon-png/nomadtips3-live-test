name: Deploy Ball46 Signal Scorebar Rebuild 20260926

on:
  push:
    branches:
      - work/ball46-scorebar10-prod-safe-20260925
    paths:
      - .github/workflows/deploy-ball46-scorebar10-20260925.yml
      - ops/rebuild-signal-scorebar-20260926.sh

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild Signal scorebar from current Production
        shell: bash
        run: bash ops/rebuild-signal-scorebar-20260926.sh
