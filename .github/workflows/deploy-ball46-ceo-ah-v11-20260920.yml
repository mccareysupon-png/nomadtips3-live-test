name: Deploy Ball46 CEO AH v1.1 20260920

on:
  push:
    branches:
      - work/ball46-ceo-ah-tuning-20260920
    paths:
      - .github/workflows/deploy-ball46-ceo-ah-v11-20260920.yml
      - .github/scripts/apply_ball46_ceo_ah_v11_20260920.py

permissions:
  contents: write

env:
  ENGINE_DIR: workers/nomadtips3-engine-343
  BALL46_URL: https://ball46.com

jobs:
  deploy-ceo-ah-v11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tuning branch
        uses: actions/checkout@v4
        with:
          ref: work/ball46-ceo-ah-tuning-20260920
          fetch-depth: 0

      - name: Freeze current Production and source baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cp "$ENGINE_DIR/src/ceo-condition.js" /tmp/ceo-before.js
          cp "$ENGINE_DIR/src/index.js" /tmp/index-before.js
          cp "$ENGINE_DIR/src/market-core.js" /tmp/market-core-before.js
          cp "$ENGINE_DIR/test/ceo-condition.test.mjs" /tmp/ceo-test-before.mjs
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/health?v11=${GITHUB_RUN_ID}" -o /tmp/engine-before.json
          curl -fsS --max-time 30 "$BALL46_URL/api/full-market/health?v11=${GITHUB_RUN_ID}" -o /tmp/full-before.json
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/statistics?v11=${GITHUB_RUN_ID}" -o /tmp/stats-before.json
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/engine-before.json','utf8'));
          const f=JSON.parse(fs.readFileSync('/tmp/full-before.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/stats-before.json','utf8'));
          if(e.version!=='nomad343-engine-v6-ceo-auto-v1') throw Error(`PRODUCTION_MOVED:${e.version}`);
          if(!f.version) throw Error('FULL_MARKET_HEALTH_MISSING');
          if(s?.ok!==true||!Array.isArray(s.rows)) throw Error('STATISTICS_UNHEALTHY');
          const oldV1=s.rows.filter(r=>String(r?.strategy||'').toUpperCase()==='CEO'&&String(r?.strategyVersion||'')==='1.0').length;
          fs.writeFileSync('/tmp/full-version',String(f.version));
          fs.writeFileSync('/tmp/v1-history-count',String(oldV1));
          console.log('CEO_AH_V11_BASELINE',JSON.stringify({engine:e.version,fullMarket:f.version,ceoV1History:oldV1,totalSettled:s.rows.length}));
          NODE

      - name: Apply CEO AH v1.1 only
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_ball46_ceo_ah_v11_20260920.py
          node --check "$ENGINE_DIR/src/ceo-condition.js"
          node --check "$ENGINE_DIR/src/index.js"

      - name: Guard OWNER Odds Referee Settlement and scope
        run: |
          set -euo pipefail
          cmp /tmp/market-core-before.js "$ENGINE_DIR/src/market-core.js"
          python3 - <<'PY'
          from pathlib import Path
          before=Path('/tmp/index-before.js').read_text()
          after=Path('workers/nomadtips3-engine-343/src/index.js').read_text()
          old="const VERSION='nomad343-engine-v6-ceo-auto-v1';"
          new="const VERSION='nomad343-engine-v6-ceo-auto-v1.1-ah-guard';"
          if after.replace(new,old,1)!=before:
              raise SystemExit('INDEX_CHANGED_BEYOND_VERSION')
          cb=Path('/tmp/ceo-before.js').read_text()
          ca=Path('workers/nomadtips3-engine-343/src/ceo-condition.js').read_text()
          if ca.count('fetch(')!=cb.count('fetch('):
              raise SystemExit('CEO_PATCH_ADDED_NETWORK_FETCH')
          required=["CEO_VERSION='1.1'","lineMin:-.5,lineMax:.5","key==='ft_ah'&&minute!==null&&minute<60&&trail<0","best.market==='ft_ah'&&line!==null&&Math.abs(line)>.5","mode:'CEO_AUTO_V1_1'"]
          for x in required:
              if x not in ca: raise SystemExit('MISSING_V11_RULE:'+x)
          PY
          mapfile -t changed < <(git diff --name-only)
          printf 'Runtime changed files:\n%s\n' "${changed[*]}"
          for f in "${changed[@]}"; do
            case "$f" in
              workers/nomadtips3-engine-343/src/ceo-condition.js|workers/nomadtips3-engine-343/src/index.js|workers/nomadtips3-engine-343/test/ceo-condition.test.mjs) ;;
              *) echo "UNEXPECTED_RUNTIME_CHANGE:$f"; exit 1;;
            esac
          done
          echo CEO_AH_V11_SCOPE_GUARD_PASS

      - name: Run CEO and settlement regressions
        run: |
          set -euo pipefail
          node --test "$ENGINE_DIR"/test/*.test.mjs
          echo CEO_AH_V11_REGRESSION_PASS

      - name: Commit versioned CEO source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ENGINE_DIR/src/ceo-condition.js" "$ENGINE_DIR/src/index.js" "$ENGINE_DIR/test/ceo-condition.test.mjs"
          git commit -m 'feat(ball46): tune CEO FT AH v1.1 with live-state guard'
          git push origin HEAD:work/ball46-ceo-ah-tuning-20260920

      - name: Deploy Engine only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --config "$ENGINE_DIR/wrangler.toml"

      - name: Verify Production or rollback engine
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          verify_prod() {
            ok=0
            for n in $(seq 1 20); do
              if curl -fsS --max-time 30 "$BALL46_URL/api/engine/health?v11=${GITHUB_RUN_ID}-${n}" -o /tmp/engine-after.json && \
                 node -e "const j=require('/tmp/engine-after.json');process.exit(j.version==='nomad343-engine-v6-ceo-auto-v1.1-ah-guard'?0:1)"; then ok=1; break; fi
              sleep 2
            done
            [ "$ok" = 1 ] || return 1
            curl -fsS --max-time 30 "$BALL46_URL/api/full-market/health?v11=${GITHUB_RUN_ID}-after" -o /tmp/full-after.json || return 1
            curl -fsS --max-time 30 "$BALL46_URL/api/engine/board?v11=${GITHUB_RUN_ID}-after" -o /tmp/board-after.json || return 1
            curl -fsS --max-time 30 "$BALL46_URL/api/engine/signals?v11=${GITHUB_RUN_ID}-after" -o /tmp/signals-after.json || return 1
            curl -fsS --max-time 30 "$BALL46_URL/api/engine/statistics?v11=${GITHUB_RUN_ID}-after" -o /tmp/stats-after.json || return 1
            node - <<'NODE'
            const fs=require('fs');
            const e=JSON.parse(fs.readFileSync('/tmp/engine-after.json','utf8'));
            const f=JSON.parse(fs.readFileSync('/tmp/full-after.json','utf8'));
            const b=JSON.parse(fs.readFileSync('/tmp/board-after.json','utf8'));
            const g=JSON.parse(fs.readFileSync('/tmp/signals-after.json','utf8'));
            const s=JSON.parse(fs.readFileSync('/tmp/stats-after.json','utf8'));
            if(e.version!=='nomad343-engine-v6-ceo-auto-v1.1-ah-guard') throw Error('ENGINE_VERSION_BAD');
            if(String(f.version||'')!==fs.readFileSync('/tmp/full-version','utf8')) throw Error('FULL_MARKET_CHANGED');
            if(!Array.isArray(b.fixtures)) throw Error('BOARD_UNHEALTHY');
            if(!Array.isArray(g.signals)) throw Error('SIGNALS_UNHEALTHY');
            if(s?.ok!==true||!Array.isArray(s.rows)) throw Error('STATS_UNHEALTHY');
            const before=Number(fs.readFileSync('/tmp/v1-history-count','utf8'));
            const oldV1=s.rows.filter(r=>String(r?.strategy||'').toUpperCase()==='CEO'&&String(r?.strategyVersion||'')==='1.0').length;
            if(oldV1<before) throw Error(`CEO_V1_HISTORY_DROPPED:${before}->${oldV1}`);
            console.log('CEO_AH_V11_PRODUCTION_PASS',JSON.stringify({engine:e.version,fullMarket:f.version,board:b.fixtures.length,signals:g.signals.length,settled:s.rows.length,ceoV1History:oldV1}));
            NODE
          }
          if verify_prod; then
            exit 0
          fi
          echo 'VERIFY_FAILED_ROLLING_BACK_ENGINE_V1'
          cp /tmp/ceo-before.js "$ENGINE_DIR/src/ceo-condition.js"
          cp /tmp/index-before.js "$ENGINE_DIR/src/index.js"
          cp /tmp/market-core-before.js "$ENGINE_DIR/src/market-core.js"
          npx --yes wrangler@4.92.0 deploy --config "$ENGINE_DIR/wrangler.toml"
          exit 1
