name: BALL46 Statistics PC V2 Browser Preview (No Production Deploy)
on:
  push:
    branches: [codex/ball46-stats-pc-v2-browser-preview-20261020]
    paths:
      - '.github/workflows/ball46-stats-pc-v2-preview-20261020.yml'
      - 'deploy-assets/stats-pc-v2-preview-20261020/preview.mjs'
      - 'deploy-assets/stats-pc-v2-preview-20261020/preview.css'
permissions:
  contents: read
concurrency:
  group: ball46-statistics-pc-v2-inactive-preview
  cancel-in-progress: false
jobs:
  inactive-browser-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check preview code syntax
        working-directory: deploy-assets/stats-pc-v2-preview-20261020
        run: |
          set -euo pipefail
          node --check preview.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
      - name: Publish INACTIVE preview version and test desktop and mobile
        working-directory: deploy-assets/stats-pc-v2-preview-20261020
        run: node preview.mjs
      - name: Save browser screenshots and no-production-deployment proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-statistics-pc-v2-browser-preview-proof
          path: deploy-assets/stats-pc-v2-preview-20261020/audit/
          retention-days: 30
          if-no-files-found: warn
