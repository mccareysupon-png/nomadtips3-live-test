name: BALL46 combined sidebar and league toggle preview
on:
  push:
    branches: [test/ball46-sidebar-leagues-20261119]
    paths: ['.github/workflows/sidebar-leagues-test-20261119.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --prefix "$RUNNER_TEMP/b46qa" --no-save --no-package-lock puppeteer-core
          echo "PUPPETEER_ENTRY=$(node -p "require.resolve('puppeteer-core',{paths:['$RUNNER_TEMP/b46qa']})")" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Verify and deploy isolated combined sidebar preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --check qa/sidebar-leagues-20261119/leagues-toggle.js
          node --check qa/sidebar-leagues-20261119/test.mjs
          node qa/sidebar-leagues-20261119/test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidebar-leagues-test-evidence
          path: evidence/
          retention-days: 7
