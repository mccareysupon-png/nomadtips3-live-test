name: Ball46 Preserve Statistics Refresh Route 20261011
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ball46-preserve-statistics-refresh-20261011.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  route-fix-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ball46-easybet-crossdevice-fix-20261007
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install AST parser dependency
        run: npm install --no-save --ignore-scripts acorn@8
      - name: Patch only Worker-embedded dashboard tune UI from active Production
        working-directory: deploy-assets/ball46-member-nav-20261009
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {writeFileSync,mkdirSync} from 'node:fs';
          import {parse} from 'acorn';
          import {inspect,api,script,activeVersion,getVersion,publicFile,sha,canonical,directOrigin,literals,manifest} from '../daily-performance-20261005/production.mjs';
          import {schedules,stageCurrentRail,verifyRailBase,wrangler} from '../daily-performance-20261005/rail.mjs';
          const target='dashboard-v2-tune.js',literalName='__B46_THEME_TOOLBAR_JS__';
          const marker='B46_STATS_REFRESH_PRESERVE_NONLIVE_20261011';
          const oldAnchor='function chooseCompactDefault(){\n  if(autoStatusChosen||userStatusChosen)return;';
          const newAnchor=[
          'function chooseCompactDefault(){',
          '  // B46_STATS_REFRESH_PRESERVE_NONLIVE_20261011: do not auto-select Live over Statistics or Signal.',
          "  const requestedView=new URLSearchParams(location.search).get('view');",
          '  const currentView=document.body?.dataset?.workspaceView;',
          "  if(requestedView==='statistics'||requestedView==='signal'||currentView==='statistics'||currentView==='signal')return;",
          '  if(autoStatusChosen||userStatusChosen)return;'
          ].join('\n');
          const report={scope:'Only modify embedded Worker UI string __B46_THEME_TOOLBAR_JS__ so its automatic Live default cannot override Statistics/Signal. Keep all Engine logic, other Worker literals, all static assets, settings and crons unchanged.',startedAt:new Date().toISOString()};
          mkdirSync('audit-stats-refresh',{recursive:true});
          const save=()=>writeFileSync('audit-stats-refresh/report.json',JSON.stringify(report,null,2));
          const delay=ms=>new Promise(r=>setTimeout(r,ms));
          let original=null,candidate=null;
          function patch(t){
           assert(!t.includes(marker),'PATCH_ALREADY_PRESENT_STOP');
           assert.equal(t.split(oldAnchor).length-1,1,'COMPACT_CHOOSER_SHAPE_CHANGED_STOP');
           assert(t.includes("const VERSION='343-dashboard-v2-ui-tune-v3-mobile-status-loop-safe'"),'TUNE_VERSION_CHANGED_STOP');
           assert(t.includes('function sync(){decorateRows();chooseCompactDefault()}'),'COMPACT_SYNC_CHANGED_STOP');
           const after=t.replace(oldAnchor,newAnchor);
           assert.equal(after.replace(newAnchor,oldAnchor),t,'UNRELATED_UI_CODE_CHANGED');
           parse(after,{ecmaVersion:'latest',sourceType:'script'});
           return after;
          }
          async function rollback(){
           if(!original)return;
           const active=await activeVersion();
           if(active===original)return;
           if(!candidate||active!==candidate)throw Error('FOREIGN_VERSION_STOP_NO_ROLLBACK');
           await api('/scripts/'+script+'/deployments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({strategy:'percentage',versions:[{version_id:original,percentage:100}],annotations:{'workers/message':'Rollback isolated Statistics refresh Worker UI literal'}})});
           assert.equal(await activeVersion(),original,'ROLLBACK_NOT_CONFIRMED');
          }
          try{
           const current=await inspect();original=current.restore.version;
           const lit=literals(current.source).get(literalName);
           assert(lit&&typeof lit.value==='string','WORKER_UI_LITERAL_NOT_FOUND_STOP');
           const publicOld=await publicFile('/'+target,undefined,directOrigin);
           assert.equal(sha(Buffer.from(lit.value)),sha(publicOld),'UI_LITERAL_NOT_EQUAL_LIVE_JS_STOP');
           assert.equal(sha(await publicFile('/'+target)),sha(publicOld),'JS_PUBLIC_DIRECT_HOSTS_DIFFER_STOP');
           const afterJS=patch(lit.value),jsSha=sha(Buffer.from(afterJS));
           const patchedSource=current.source.slice(0,lit.start)+JSON.stringify(afterJS)+current.source.slice(lit.end);
           parse(patchedSource,{ecmaVersion:'latest',sourceType:'module'});
           assert.equal(patchedSource.slice(0,lit.start),current.source.slice(0,lit.start),'WORKER_PREFIX_CHANGED');
           assert.equal(patchedSource.slice(lit.start+JSON.stringify(afterJS).length),current.source.slice(lit.end),'WORKER_SUFFIX_CHANGED');
           const afterLiterals=literals(patchedSource);
           const beforeLiterals=literals(current.source);
           assert.equal(afterLiterals.size,beforeLiterals.size,'WORKER_LITERAL_COUNT_CHANGED');
           for(const [key,v] of beforeLiterals)if(key!==literalName)assert.equal(afterLiterals.get(key)?.value,v.value,'UNRELATED_WORKER_LITERAL_CHANGED:'+key);
           assert.equal(afterLiterals.get(literalName)?.value,afterJS,'WORKER_UI_PATCH_NOT_PRESERVED');
           const updatedWorkerSha=sha(Buffer.from(patchedSource));
           const originalMain=manifest(current.version).filter(m=>m.name!==current.version.main_module);
           const settings=await api('/scripts/'+script+'/settings'),crons=await schedules();
           const settingsSha=sha(canonical(settings));
           const workspace=(await publicFile('/singlepage-workspace-343.js')).toString('utf8');
           assert(workspace.includes('function parseRoute()'),'WORKSPACE_ROUTER_MISSING');
           const staged=await stageCurrentRail(current.version,settings,crons,patchedSource);
           await verifyRailBase(staged);
           assert.equal(staged.hashes[target],sha(publicOld),'STATIC_ASSET_INPUT_NOT_CURRENT');
           assert.equal(await activeVersion(),original,'PRODUCTION_CHANGED_DURING_STAGE');
           report.beforeVersion=original;report.onlyWorkerLiteral=literalName;report.originalJS=sha(publicOld);report.newJS=jsSha;report.newWorkerSha=updatedWorkerSha;save();
           wrangler(staged,true);
           assert.equal(await activeVersion(),original,'PRODUCTION_CHANGED_BEFORE_DEPLOY');
           await verifyRailBase(staged);
           wrangler(staged,false);
           for(let i=0;i<30;i++){const v=await activeVersion();if(v!==original){candidate=v;break}await delay(1200)}
           assert(candidate,'NEW_VERSION_NOT_OBSERVED');report.deployedCandidate=candidate;save();
           let directOk=false,publicOk=false;
           for(let i=0;i<35;i++){
            assert.equal(await activeVersion(),candidate,'PRODUCTION_CHANGED_DURING_VERIFY');
            try{
             directOk=sha(await publicFile('/'+target,undefined,directOrigin))===jsSha;
             publicOk=sha(await publicFile('/'+target))===jsSha;
             if(directOk&&publicOk)break;
            }catch{}
            await delay(1200);
           }
           assert(directOk&&publicOk,'ACTUAL_WORKER_UI_JS_NOT_VERIFIED');
           for(const [file,expected] of Object.entries(staged.hashes)){
            if(file===target)continue;
            assert.equal(sha(await publicFile('/'+file)),expected,'UNRELATED_ASSET_CHANGED:'+file);
           }
           const ver=await getVersion(candidate),main=ver.modules.find(m=>m.name===ver.main_module);
           assert(main,'WORKER_MAIN_MISSING');
           assert.equal(sha(Buffer.from(main.content_base64,'base64')),updatedWorkerSha,'WORKER_SOURCE_NOT_EXACT_PATCH');
           assert.deepEqual(manifest(ver).filter(m=>m.name!==ver.main_module),originalMain,'OTHER_WORKER_MODULES_CHANGED');
           assert.equal(sha(canonical(await api('/scripts/'+script+'/settings'))),settingsSha,'SETTINGS_CHANGED');
           assert.equal(canonical(await schedules()),canonical(crons),'CRONS_CHANGED');
           report.result='SUCCESS';report.deployedVersion=candidate;report.completedAt=new Date().toISOString();save();
           console.log('BALL46_STATISTICS_REFRESH_GUARD_WORKER_LITERAL_SUCCESS',JSON.stringify({original,candidate,changedLiteral:literalName,unchangedStaticFiles:Object.keys(staged.hashes).length,unchangedOtherLiterals:beforeLiterals.size-1}));
          }catch(e){
           report.result='FAIL_STOPPED';report.error=String(e.message||e);save();
           try{await rollback();report.rolledBack=true;save()}catch(rb){report.rollbackError=String(rb.message||rb);save()}
           console.error(e.stack);process.exitCode=1;
          }
          NODE
      - name: Save audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-preserve-refresh-${{ github.run_id }}
          path: deploy-assets/ball46-member-nav-20261009/audit-stats-refresh
          retention-days: 30
