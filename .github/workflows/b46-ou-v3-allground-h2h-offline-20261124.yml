name: BALL46 O/U V3 three all-ground FT optional H2H offline QA 20261124
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths:
      - .github/workflows/b46-ou-v3-allground-h2h-offline-20261124.yml
      - qa/prematch-history-20261120/ou-target-history-ft-v1.test.mjs
permissions: {contents: read}
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify full FT union, 3-all-grounds gate, H2H optional/no-double-weight, old Asian O/U price and EV
        run: |
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-v3-history-math.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-target-history-ft-v1.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-value-screener-v2.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/prematch-ou-engine-v1.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/history-cargo-registry.test.mjs
          echo B46_OU_V3_HISTORY_AND_PRICE_OFFLINE_PASS
