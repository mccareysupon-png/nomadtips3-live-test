name: BALL46 Signal expanded Event Flow scroll anchor stress TEST
on:
  push:
    branches: [test/ball46-premium-match-colors-20261120]
    paths: ['.github/workflows/ball46-signal-eventflow-scroll-stress-20261121.yml']
permissions: {contents: read}
jobs:
  scroll-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Verify anchored flow with many incoming matches and native-style displacement
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {chromium} from 'playwright';
          const origin='https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev';
          const b=await chromium.launch();const p=await b.newPage({viewport:{width:1440,height:950},serviceWorkers:'block'});
          await p.addInitScript(()=>localStorage.setItem('nomad343_dashboard_theme_v1','dark'));
          try{
            await p.goto(origin+'/?view=signal',{waitUntil:'domcontentloaded',timeout:65000});
            await p.waitForFunction(()=>window.__b46SignalStableStatus?.seenSource&&document.querySelector('.board-sections[data-b46-signal-sort-ready="1"] .match-row'),null,{timeout:40000});
            const real=await p.evaluate(()=>document.querySelector('.status-section[data-status-section="live"] .match-row[data-match-id]')?.dataset.matchId);
            assert(real,'NO_LIVE_PREDICTIONS');
            await p.evaluate(()=>{
              const style=document.createElement('style');style.id='b46-test-scrollback';
              style.textContent='body[data-workspace-view="signal"] .status-section[data-status-section="live"]::after{content:"";display:block!important;order:999999!important;flex:0 0 900px!important;height:900px!important;width:100%!important;pointer-events:none!important;}';
              document.head.append(style);
              window.__b46SignalStableQA.forceSync();
            });
            await p.waitForTimeout(350);
            const picked=p.locator('.status-section[data-status-section="live"] .match-row[data-match-id="'+real+'"]');
            await picked.click({position:{x:90,y:20},force:true});
            await p.waitForFunction(()=>document.querySelector('.status-section[data-status-section="live"] .expand-flow-card')&&window.__b46SignalStableStatus?.frozen?.id,null,{timeout:20000});
            const calc=()=>p.evaluate(id=>{
              const board=document.querySelector('.board-sections'),row=[...document.querySelectorAll('.status-section .match-row')].find(e=>e.dataset.matchId===id);
              return {scroll:board.scrollTop,maximum:board.scrollHeight-board.clientHeight,top:row.getBoundingClientRect().top-board.getBoundingClientRect().top,flow:!!document.querySelector('.status-section .expand-flow-card'),frozen:window.__b46SignalStableQA.state().frozen};
            },real);
            await p.evaluate(()=>{const el=document.querySelector('.board-sections');el.dispatchEvent(new WheelEvent('wheel',{bubbles:true,deltaY:180}));el.scrollTop=180});
            await p.waitForTimeout(180);const before=await calc();
            console.log('FLOW_SCROLL_STRESS_BEFORE '+JSON.stringify(before));
            assert(before.maximum>220,'NOT_ENOUGH_TEST_SCROLL_SPACE');assert(before.scroll>170,'USER_SCROLL_NOT_PRESERVED');
            await p.evaluate(()=>{
              const style=document.createElement('style');style.id='b46-test-layout-bump';
              style.textContent='body[data-workspace-view="signal"] .status-section[data-status-section="live"]::before{content:"";display:block!important;order:-199998!important;flex:0 0 45px!important;height:45px!important;width:100%!important;pointer-events:none!important;}';
              document.head.append(style);
              window.__b46SignalStableQA.forceSync();
            });
            await p.waitForTimeout(550);const after=await calc();
            console.log('FLOW_SCROLL_STRESS_AFTER_INSERT '+JSON.stringify(after));
            assert(after.flow&&after.frozen===real,'EXPANDED_FLOW_LOST_ON_INSERT');
            assert(Math.abs(after.top-before.top)<1.5,'FLOW_ANCHOR_SHIFTED_ON_HEIGHT_INSERT');
            await p.evaluate(()=>{document.getElementById('b46-test-layout-bump')?.remove();window.__b46SignalStableQA.forceSync()});
            await p.waitForTimeout(550);const restored=await calc();
            console.log('FLOW_SCROLL_STRESS_AFTER_REMOVE '+JSON.stringify(restored));
            assert(restored.flow&&restored.frozen===real,'FLOW_LOST_AFTER_REMOVAL');
            assert(Math.abs(restored.top-before.top)<1.5,'FLOW_ANCHOR_SHIFTED_ON_HEIGHT_REMOVE');
            await p.evaluate(()=>document.getElementById('b46-test-scrollback')?.remove());
            console.log('BALL46_EVENTFLOW_SCROLL_STRESS_PASS '+JSON.stringify({visibleStable:true,flowStable:true,addedAndRemovedHeight:true}));
          }finally{await b.close()}
          NODE