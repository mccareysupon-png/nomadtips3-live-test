name: BALL46 John Original League One-Shot 5-Page TEST Recovery
on:
  push:
    branches: [fix/ball46-prematch-original-league-restore-20261122]
    paths:
      - .github/workflows/b46-prematch-john-five-page-league-restore-20261122.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: ball46-prematch-john-league-one-shot-20261122
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: real-prematch-raw-and-progress
          run-id: 44759126984
          github-token: ${{ github.token }}
          path: prior
      - name: Validate original ID-based league restoration and unchanged 1X2
        run: |
          node --check qa/prematch-history-20261120/restore-league-from-provider-once-20261122.mjs
          node --test qa/prematch-history-20261120/league-original-restore.test.mjs qa/prematch-history-20261120/league-id-catalog.test.mjs qa/prematch-history-20261120/test-pick-ledger.test.mjs
      - name: Recover missing league names by rate-paced 5USD bulk fixture windows (max 5 calls)
        run: node qa/prematch-history-20261120/restore-league-from-provider-once-20261122.mjs
