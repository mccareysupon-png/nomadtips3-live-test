name: BALL46 Featured Mobile Wells V3 Production
on:
  push:
    branches: [fix/ball46-featured-mobile-visible-wells-v3-20261021]
    paths:
      - 'deploy-assets/featured-mobile-native-20261021/native-mobile-v3.css'
      - 'deploy-assets/featured-mobile-native-20261021/deploy-native-v3.mjs'
      - '.github/workflows/ball46-featured-mobile-v3-20261021.yml'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  featured-mobile-wells:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script and install screenshot QA
        working-directory: deploy-assets/featured-mobile-native-20261021
        run: |
          set -euo pipefail
          node --check deploy-native-v3.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 pngjs@7
      - name: Verify original Production, candidate, and deploy only if all pass
        working-directory: deploy-assets/featured-mobile-native-20261021
        run: node deploy-native-v3.mjs
      - name: Save screenshots and rollback report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-featured-mobile-visible-wells-v3-proof
          path: deploy-assets/featured-mobile-native-20261021/proof/
          retention-days: 30
          if-no-files-found: warn