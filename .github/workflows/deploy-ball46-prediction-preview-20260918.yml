name: Deploy Ball46 Prediction Preview 20260918
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ball46-prediction-preview-20260918.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_REF: work/ball46-live-prediction-v1-current
      BASE_REF: work/ball46-full-market-20260918
      PREVIEW_URL: https://nomadtips3-343-prediction-preview.mccarey-supon.workers.dev
    steps:
      - name: Checkout prediction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - name: Safety boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          git fetch origin "$BASE_REF" --depth=1
          changed="$(git diff --name-only "origin/$BASE_REF"...HEAD)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(nomad-live-343/index.html|nomad-live-343/live-prediction-v1.js|nomad-live-343/live-prediction-v1.css|workers/nomadtips3-343-preview/wrangler.prediction-preview.jsonc)$' || true)"
          test -z "$bad" || { echo "PROTECTED_CHANGE_DETECTED"; printf '%s\n' "$bad"; exit 1; }
          git diff --quiet "origin/$BASE_REF"...HEAD -- workers/nomadtips3-5usd-hub-343 workers/nomadtips3-engine-343 workers/add-k-ah-detector nomad-live-343/signal.html nomad-live-343/signal.js nomad-live-343/statistics.html nomad-live-343/statistics.js nomad-live-343/dashboard-v2-stage3.js
          echo SAFE_BOUNDARY_PASS

      - name: Validate prediction market logic
        shell: bash
        run: |
          set -euo pipefail
          node --check nomad-live-343/live-prediction-v1.js
          grep -Fq "343-live-prediction-v1-readonly-market-ht-safe" nomad-live-343/live-prediction-v1.js
          grep -Fq "READ_ONLY_SHARED_BOARD" nomad-live-343/live-prediction-v1.js
          grep -Fq "networkRequestsAdded:0" nomad-live-343/live-prediction-v1.js
          ! grep -Fq "clamp(p,0.50" nomad-live-343/live-prediction-v1.js
          grep -Fq "const probability=clamp(p,0.01,0.99)" nomad-live-343/live-prediction-v1.js
          grep -Fq "key==='corner_asian')candidates.push(...evalAsian" nomad-live-343/live-prediction-v1.js
          grep -Fq "key==='card_asian')candidates.push(...evalAsian" nomad-live-343/live-prediction-v1.js
          grep -Fq "key==='1x2_half')candidates.push(...eval1x2" nomad-live-343/live-prediction-v1.js
          grep -Fq "key==='asian_handicap_half')candidates.push(...evalAsian" nomad-live-343/live-prediction-v1.js
          grep -Fq "key==='goal_line_half')candidates.push(...evalTotal" nomad-live-343/live-prediction-v1.js
          grep -Fq "key==='corner_line_half')candidates.push(...evalTotal" nomad-live-343/live-prediction-v1.js
          grep -Fq "key==='corner_asian_half')candidates.push(...evalAsian" nomad-live-343/live-prediction-v1.js
          grep -Fq "key==='card_line_half')candidates.push(...evalTotal" nomad-live-343/live-prediction-v1.js
          grep -Fq "key==='card_asian_half')candidates.push(...evalAsian" nomad-live-343/live-prediction-v1.js
          grep -Fq "function firstHalfClosed" nomad-live-343/live-prediction-v1.js
          grep -Fq "sit.minute>45" nomad-live-343/live-prediction-v1.js
          grep -Fq "half.?time" nomad-live-343/live-prediction-v1.js
          grep -Fq "marketEligible(key,f,sit,kind)" nomad-live-343/live-prediction-v1.js
          grep -Fq "MATCH FINISHED" nomad-live-343/live-prediction-v1.js
          grep -Fq "MODEL PROBABILITY" nomad-live-343/live-prediction-v1.js
          grep -Fq "live-prediction-v1.js" nomad-live-343/index.html
          grep -Fq "live-prediction-v1.css" nomad-live-343/index.html
          python3 - <<'PY'
          from pathlib import Path
          h=Path('nomad-live-343/index.html').read_text()
          a=h.index('bulk-odds-compat-343.js')
          p=h.index('live-prediction-v1.js')
          d=h.index('dashboard-v2-stage3.js')
          assert a < p < d, (a,p,d)
          print('SCRIPT_ORDER_PASS')
          PY
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          global.location={href:'https://preview.test/'};
          global.document={readyState:'loading',addEventListener(){},querySelector(){return null;}};
          global.MutationObserver=class{observe(){}};
          global.window={fetch:async()=>{throw new Error('NETWORK_NOT_EXPECTED')}};
          vm.runInThisContext(fs.readFileSync('nomad-live-343/live-prediction-v1.js','utf8'));
          const evaluate=window.NOMAD343_LIVE_PREDICTION.evaluateFixture;
          const stats={shotsOnTarget:{home:2,away:1},shotsOffTarget:{home:3,away:2},attacks:{home:40,away:30},dangerousAttacks:{home:20,away:12},possession:{home:55,away:45}};
          const oneHalf={bookmakers:[{name:'Bet365',slug:'bet365',odds:{'1x2_half':{inplay:{home:1.90,draw:3.20,away:4.10}}}}]};
          const ftOnly={bookmakers:[{name:'Bet365',slug:'bet365',odds:{'1x2':{inplay:{home:1.90,draw:3.20,away:4.10}}}}]};
          const base={fixtureId:'guard',boardState:'live',minute:45,goals:{home:0,away:0},corners:{home:2,away:1},statistics:stats};
          const first=evaluate({...base,status:'First Half',statusCode:'1H',providerOdds:oneHalf});
          if(!first.best||first.best.market!=='1X2 1H') throw new Error('FIRST_HALF_45_SHOULD_ALLOW_1H');
          const ht=evaluate({...base,status:'Half Time',statusCode:'HT',providerOdds:oneHalf});
          if(ht.best) throw new Error('HT_SHOULD_BLOCK_1H');
          const second=evaluate({...base,minute:46,status:'Second Half',statusCode:'2H',providerOdds:oneHalf});
          if(second.best) throw new Error('SECOND_HALF_SHOULD_BLOCK_1H');
          const htFt=evaluate({...base,status:'Half Time',statusCode:'HT',providerOdds:ftOnly});
          if(!htFt.best||htFt.best.market!=='1X2') throw new Error('HT_SHOULD_KEEP_FULL_TIME_MARKETS');
          if(window.NOMAD343_LIVE_PREDICTION.networkRequestsAdded!==0) throw new Error('NETWORK_REQUEST_REGRESSION');
          console.log('HALFTIME_GUARD_PASS');
          NODE
          echo PREDICTION_MARKET_LOGIC_PASS

      - name: Dry-run isolated preview
        working-directory: workers/nomadtips3-343-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.prediction-preview.jsonc

      - name: Deploy isolated preview only
        working-directory: workers/nomadtips3-343-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.prediction-preview.jsonc

      - name: Verify preview assets and shared board
        shell: bash
        run: |
          set -euo pipefail
          asset_ok=0
          board_ok=0
          for i in $(seq 1 30); do
            code="$(curl -sS --max-time 20 -o /tmp/pred.js -w '%{http_code}' "$PREVIEW_URL/live-prediction-v1.js?_=$GITHUB_RUN_ID-$i" || true)"
            if [ "$code" = 200 ] && grep -Fq "343-live-prediction-v1-readonly-market-ht-safe" /tmp/pred.js; then asset_ok=1; break; fi
            sleep 2
          done
          test "$asset_ok" = 1
          for i in $(seq 1 30); do
            code="$(curl -sS --max-time 25 -o /tmp/board.json -w '%{http_code}' "$PREVIEW_URL/api/engine/board?_=$GITHUB_RUN_ID-$i" || true)"
            if [ "$code" = 200 ] && node -e 'const j=require("/tmp/board.json");process.exit(j.ok===true&&Array.isArray(j.fixtures)&&j.fixtures.length>0?0:1)'; then board_ok=1; break; fi
            sleep 2
          done
          test "$board_ok" = 1
          node - <<'NODE'
          const j=require('/tmp/board.json');
          const live=j.fixtures.filter(f=>String(f?.boardState||'').toLowerCase()==='live').length;
          const withOdds=j.fixtures.filter(f=>f?.providerOdds&&typeof f.providerOdds==='object').length;
          console.log('PREDICTION_PREVIEW_BOARD_PASS',JSON.stringify({fixtures:j.fixtures.length,live,withOdds,hubVersion:j.hubVersion,stale:j.stale}));
          NODE
          curl -fsS --max-time 20 "$PREVIEW_URL/?_=$GITHUB_RUN_ID" -o /tmp/index.html
          grep -Fq 'live-prediction-v1.css' /tmp/index.html
          grep -Fq 'live-prediction-v1.js' /tmp/index.html
          echo PREDICTION_PREVIEW_PASS
