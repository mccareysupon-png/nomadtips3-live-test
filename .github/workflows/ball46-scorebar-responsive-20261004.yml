name: Ball46 Existing Scorebar Responsive Surgical Deploy
on:
  push:
    branches: ['safe/ball46-scorebar-responsive-20261004']
    paths: ['.github/workflows/ball46-scorebar-responsive-20261004.yml']
permissions:
  contents: read
concurrency:
  group: ball46-production-spa-statistics-total
  cancel-in-progress: false
jobs:
  presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: deploy-assets/match-status-svg-20261003
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Capture exact current Production scorebar CSS
        working-directory: deploy-assets/match-status-svg-20261003
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node current-scorebar-css-scout.mjs
      - name: Verify current Production source, test responsive cards, deploy through existing Production rail
        working-directory: deploy-assets/match-status-svg-20261003
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scorebar-responsive-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-scorebar-responsive-${{ github.run_id }}
          path: deploy-assets/match-status-svg-20261003/audit/
          retention-days: 7
