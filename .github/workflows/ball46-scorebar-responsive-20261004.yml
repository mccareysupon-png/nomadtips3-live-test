name: Ball46 Right Signal Stability Surgical 20261005
on:
  push:
    branches: ['safe/ball46-scorebar-responsive-20261004']
    paths: ['.github/workflows/ball46-scorebar-responsive-20261004.yml']
permissions:
  contents: read
concurrency:
  group: ball46-production-spa-statistics-total
  cancel-in-progress: false
jobs:
  presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact latest-rail dependencies
        working-directory: deploy-assets/match-status-svg-20261003
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify current Production and deploy right signal DOM stability
        working-directory: deploy-assets/match-status-svg-20261003
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node right-signal-stability-latest-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-right-signal-stability-${{ github.run_id }}
          path: deploy-assets/match-status-svg-20261003/audit/
          retention-days: 30
