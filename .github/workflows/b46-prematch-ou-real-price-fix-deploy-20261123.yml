name: BALL46 fix current O/U PreMatch real Full Market price TEST deployment
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-prematch-ou-real-price-fix-deploy-20261123.yml]
permissions: {contents: read}
concurrency:
  group: ball46-prematch-only-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify code, 4/day combined limiter, no-quote, stale, LIVE stop and all V2/legacy market tests
        run: |
          node --check qa/prematch-history-20261120/deploy-prematch-ou-real-price-fix-test-20261123.mjs
          node --check qa/prematch-history-20261120/prematch-ou-engine-v1-test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/prematch-ou-engine-v1.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-value-screener-v2.test.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-value-v2-provider-bridge.test.mjs
      - name: Guarded surgical deploy ONLY existing Prematch TEST Worker, no paid calls at deploy
        run: node qa/prematch-history-20261120/deploy-prematch-ou-real-price-fix-test-20261123.mjs
