name: Deploy CAR 3 Cloudflare V6

on:
  push:
    branches: [main]
    paths:
      - "car3-cloudflare/**"
      - ".github/workflows/car3-cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY || secrets.APISPORTS_KEY || secrets.API_SPORTS_KEY }}
  LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN || secrets.LINE_ACCESS_TOKEN }}
  LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID || secrets.LINE_USER_ID }}

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Offline logic tests
        id: tests
        working-directory: car3-cloudflare
        run: node --test

      - name: Validate required runtime secrets
        id: validate
        shell: bash
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$API_FOOTBALL_KEY" || { echo "::error::Missing API_FOOTBALL_KEY/APISPORTS_KEY/API_SPORTS_KEY"; exit 1; }
          test -n "$LINE_CHANNEL_ACCESS_TOKEN" || { echo "::error::Missing LINE_CHANNEL_ACCESS_TOKEN/LINE_ACCESS_TOKEN"; exit 1; }
          test -n "$LINE_TARGET_ID" || { echo "::error::Missing LINE_TARGET_ID/LINE_USER_ID"; exit 1; }

      - name: Deploy Worker, Cron, Durable Object, and encrypted secrets
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: car3-cloudflare
          wranglerVersion: "4"
          command: deploy
          secrets: |
            API_FOOTBALL_KEY
            LINE_CHANNEL_ACCESS_TOKEN
            LINE_TARGET_ID
        env:
          API_FOOTBALL_KEY: ${{ env.API_FOOTBALL_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ env.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_ID: ${{ env.LINE_TARGET_ID }}

      - name: Wait for first Cron cycle and read health
        id: health
        if: ${{ success() }}
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          : > /tmp/car3-health.json
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo '{"error":"deployment_url_unavailable"}' > /tmp/car3-health.json
            exit 0
          fi
          for i in $(seq 1 22); do
            BODY=$(curl -fsS "$DEPLOYMENT_URL/health" || true)
            if [ -n "$BODY" ]; then
              printf '%s' "$BODY" > /tmp/car3-health.json
              if ! printf '%s' "$BODY" | grep -q '"lastCycle":null'; then
                exit 0
              fi
            fi
            sleep 30
          done
          exit 0

      - name: Record deployment status back to repository
        if: ${{ always() }}
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        run: |
          HEALTH='not-run'
          if [ -f /tmp/car3-health.json ]; then HEALTH=$(cat /tmp/car3-health.json); fi
          cat > car3-cloudflare/DEPLOY_STATUS.md <<EOF
          # CAR 3 Cloudflare V6 — Last Deploy Status

          - Commit: $GITHUB_SHA
          - UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')
          - Offline tests: ${TESTS_OUTCOME:-unknown}
          - Secret validation: ${VALIDATE_OUTCOME:-unknown}
          - Cloudflare deploy: ${DEPLOY_OUTCOME:-unknown}
          - Health check step: ${HEALTH_OUTCOME:-unknown}
          - Deployment URL: ${DEPLOYMENT_URL:-unavailable}

          Health payload:
          
          \`\`\`json
          $HEALTH
          \`\`\`
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add car3-cloudflare/DEPLOY_STATUS.md
          git commit -m "Record CAR 3 Cloudflare deployment status [skip ci]" || exit 0
          git push
