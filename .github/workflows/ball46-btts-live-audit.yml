name: BALL46 BTTS live prices and signal gates — READ ONLY
on:
  push:
    branches: [audit/ball46-btts-live-readonly-20261023]
    paths:
      - .github/workflows/ball46-btts-live-audit.yml
      - deploy-assets/btts-live-audit-20261023/deep.mjs
      - deploy-assets/btts-live-audit-20261023/trace.mjs
      - deploy-assets/btts-live-audit-20261023/count.mjs
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observe BTTS prices, signal market keys, and code path without writes
        run: |
          node --check deploy-assets/btts-live-audit-20261023/inspect.mjs
          node --check deploy-assets/btts-live-audit-20261023/deep.mjs
          node --check deploy-assets/btts-live-audit-20261023/trace.mjs
          node --check deploy-assets/btts-live-audit-20261023/count.mjs
          node deploy-assets/btts-live-audit-20261023/count.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-btts-live-readonly-${{ github.run_id }}
          path: deploy-assets/btts-live-audit-20261023/audit/
          retention-days: 14
