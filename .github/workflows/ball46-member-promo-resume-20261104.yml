name: BALL46 member promotion resume with raw owner setting verification
on:
  push:
    branches: [codex/ball46-member-promo-20261104]
    paths: ['work/member-promo-card-20261104/resume-request.json']
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install source parsing and browser verification
        run: |
          npm install --no-save --package-lock=false --prefix work/member-promo-card-20261104 acorn@8.15.0 parse5@7.3.0 playwright@1.56.1
          cd work/member-promo-card-20261104 && npx playwright install --with-deps chromium
      - name: Revalidate unchanged approved assets
        run: node work/member-promo-card-20261104/build-release.mjs
      - name: Fresh immutable module and raw owner setting verification, then reuse the four-case verified candidate
        run: node work/member-promo-card-20261104/release.mjs activate
      - name: Verify Production PC/mobile light/dark, real data, assets, link and existing 5s reader
        run: node work/member-promo-card-20261104/release-browser.mjs production
      - name: Restore immediate baseline on verification failure
        if: failure()
        run: node work/member-promo-card-20261104/release-rollback.mjs
      - name: Preserve guarded activation and verification evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/member-promo-card-20261104/release-audit/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record member promotion verification using persisted owner configuration [skip ci]"
          git push origin HEAD:codex/ball46-member-promo-20261104
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: member-promo-production-proof
          path: work/member-promo-card-20261104/release-audit
