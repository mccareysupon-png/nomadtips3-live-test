name: Audit Ball46 Production Statistics 404 Route 20261011
on:
  push:
    branches: [audit/ball46-corner-live-price-20261011]
    paths: [.github/workflows/audit-ball46-production-statistics-route-20261011.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect active web Worker and legacy statistics dependencies (read only)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          const b='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers',header={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const get=async p=>{const r=await fetch(b+p,{headers:header,signal:AbortSignal.timeout(25000)}),j=await r.json();if(!r.ok||!j.success)throw Error('CF_READ_'+r.status);return j.result};
          const worker='ball46-production',ds=await get('/scripts/'+worker+'/deployments'),id=ds.deployments?.[0]?.versions?.find(x=>Number(x.percentage)===100)?.version_id;
          if(id){
            const v=await get('/workers/'+worker+'/versions/'+id+'?include=modules');
            const main=v.modules?.find(x=>x.name===v.main_module);
            if(main?.content_base64){
              const src=Buffer.from(main.content_base64,'base64').toString('utf8');
              const lines=src.split('\n');
              console.log('UI_WORKER_ACTIVE',JSON.stringify({id,created:ds.deployments?.[0]?.created_on,sha:createHash('sha256').update(src).digest('hex'),main:v.main_module,bytes:src.length,moduleCount:v.modules.length,modules:v.modules.map(m=>({name:m.name,type:m.content_type,bytes:m.content_base64?.length||null})).slice(0,20)}));
              for(const term of ['statistics.html','/statistics','index.html','async fetch(','fetch(request','ASSETS.fetch','env.ASSETS','serveStatic','new URL(request.url)']){
                const matches=lines.flatMap((x,i)=>x.includes(term)?[i]:[]).slice(0,10);
                console.log('UI_SOURCE_MATCH',JSON.stringify({term,count:matches.length,contexts:matches.map(i=>({line:i+1,code:lines.slice(Math.max(0,i-2),i+5).join('\n').slice(0,1400)}))}));
              }
              console.log('UI_SOURCE_TAIL',JSON.stringify(lines.slice(-40).join('\n').slice(0,7500)));
            }else console.log('UI_WORKER_ACTIVE',JSON.stringify({id,created:ds.deployments[0].created_on,main:v.main_module,modules:v.modules.map(m=>({name:m.name,contentType:m.content_type}))}));
          }
          const url='https://www.ball46.com/statistics.html?broken_route_audit='+Date.now();
          const r=await fetch(url,{cache:'no-store'}),html=await r.text();
          const refs=[...html.matchAll(/(?:src|href)=["']([^"'#?]+(?:\?[^"']*)?)["']/gi)].map(x=>x[1]).filter(x=>/\.(?:js|css)(?:\?|$)/i.test(x));
          console.log('STATS_HTML_DEPS',JSON.stringify({http:r.status,bytes:html.length,scripts:refs}));
          for(const ref of refs.slice(0,25)){
            try{const u=new URL(ref,url),x=await fetch(u,{cache:'no-store',signal:AbortSignal.timeout(15000)});const t=await x.text();console.log('STATS_DEP_STATUS',JSON.stringify({resource:u.href,http:x.status,bytes:t.length,contentType:x.headers.get('content-type')}))}
            catch(e){console.log('STATS_DEP_ERROR',JSON.stringify({resource:ref,error:String(e)}))}
          }
          NODE
