name: BALL46 Adaptive Formula Control WLD totals original TEST deploy
on:
  push:
    branches: [feature/b46-adaptive-control-wld-totals-20261125]
    paths: ['.github/workflows/b46-adaptive-control-wld-totals-test-deploy.yml']
permissions: {contents: read}
concurrency:
  group: ball46-prematch-only-test-20261120-control-wld
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify WLD totals and production-safe source diff
        run: |
          node --check qa/prematch-history-20261120/patch-adaptive-control-wld-totals.mjs
          node --check qa/prematch-history-20261120/deploy-adaptive-control-wld-totals-test.mjs
          node --check qa/prematch-history-20261120/control-wld-browser-qa.mjs
          node qa/prematch-history-20261120/patch-adaptive-control-wld-totals.test.mjs
      - name: Deploy only current TEST control page with guarded module hash checks
        run: node qa/prematch-history-20261120/deploy-adaptive-control-wld-totals-test.mjs
      - name: Install headless Chromium
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Verify real TEST login page with mocked read-only 42 formula stats
        run: node qa/prematch-history-20261120/control-wld-browser-qa.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b46-control-wld-${{ github.run_id }}
          path: qa/prematch-history-20261120/audit-control-wld-20261125/
          if-no-files-found: warn
