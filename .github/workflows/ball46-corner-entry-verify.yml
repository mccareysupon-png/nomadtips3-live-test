name: BALL46 Corner ENTRY — independent live browser verification
on:
  push:
    branches: [fix/ball46-corner-entry-20261024]
    paths:
      - .github/workflows/ball46-corner-entry-verify.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core
          node --check deploy-assets/corner-entry-20261024/verify.mjs
          node deploy-assets/corner-entry-20261024/verify.mjs
