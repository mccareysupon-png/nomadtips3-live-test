name: BALL46 owner control V2 fresh read-only inspection
on:
  push:
    branches: [codex/ball46-owner-control-v2-20261103]
    paths: ['work/ball46-5usd-latency-control-20261102/owner-v2/preflight.mjs']
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: work/ball46-5usd-latency-control-20261102
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false acorn@8.15.0
      - run: node production-preflight.mjs
      - run: node owner-v2/preflight.mjs
      - name: Preserve read-only evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-audit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture fresh Production and owner V2 control contract [skip ci]"
          git push origin HEAD:codex/ball46-owner-control-v2-20261103
