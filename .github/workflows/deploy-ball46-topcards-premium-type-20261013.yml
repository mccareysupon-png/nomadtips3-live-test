name: Deploy Ball46 Topcards Premium Type 20261013

on:
  push:
    branches: [work/ball46-topcards-premium-type-20261013]
    paths:
      - '.github/workflows/deploy-ball46-topcards-premium-type-20261013.yml'
      - 'deploy-assets/topcards-premium-type-20261013/run.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout isolated topcard typography patch
        uses: actions/checkout@v4
        with:
          ref: work/ball46-topcards-premium-type-20261013
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification dependencies
        run: npm install --no-save --ignore-scripts acorn@8 puppeteer-core@24
      - name: Deploy premium clean typography only
        working-directory: deploy-assets/topcards-premium-type-20261013
        run: node run.mjs
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-topcards-premium-type-${{ github.run_id }}
          path: deploy-assets/topcards-premium-type-20261013/audit
          if-no-files-found: warn
          retention-days: 30
