name: BALL46 full Ledger V2 PENDING live dry run
on:
  push:
    branches: [stage/ball46-multisource-v5-20261017]
    paths: [.github/workflows/ball46-ledger-pending-full-dry-run.yml]
permissions: {contents: read}
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sweep all Ledger V2 pages via safe cursor; no Engine POST or 5USD scan
        run: |
          node --input-type=module - <<'NODE'
          import {readPendingFromLedgerV2,pendingMarketEligible} from './workers/ball46-result-sidecar/src/pending-ledger-reader.mjs';
          const engine={fetch:(u,opts)=>fetch(u.replace('https://engine.internal','https://nomadtips3-engine-343.mccarey-supon.workers.dev'),opts)};
          const result=await readPendingFromLedgerV2(engine,{maxPages:30});
          console.log('LEDGER_V2_LIVE_PENDING_DRY_RUN',JSON.stringify({
            ok:result.ok,state:result.state,pages:result.pages,
            rowsScanned:result.rowsScanned,ledgerTotal:result.ledgerTotal,
            pendingTotal:result.pendingTotal,readPending:result.rows?.length,
            eligible:result.eligible?.length,goalsMarkets:result.eligible?.reduce((x,r)=>(x[r.market]=(x[r.market]||0)+1,x),{}),
            nativeWrites:0}));
          const distribution=(key)=>result.rows?.reduce((m,r)=>{const v=String(r[key]??'MISSING');m[v]=(m[v]||0)+1;return m;},{});
          console.log('LEDGER_PENDING_FIELD_DISTRIBUTION',JSON.stringify({market:distribution('market'),period:distribution('period'),status:distribution('status')}));
          if(!result.ok)process.exitCode=1;
          NODE
