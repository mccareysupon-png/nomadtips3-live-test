name: DEPLOY - Ball46 Scorebar Background Pending 20260928
on:
  push:
    branches:
      - work/ball46-scorebar-background-pending-20260928
    paths:
      - '.github/workflows/ball46-scorebar-bg-pending-deploy-20260928.yml'
      - '.github/scripts/ball46_scorebar_bg_pending_deploy_20260928.sh'
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ball46-scorebar-bg-pending-rebased-36394898597
          path: /tmp/b46-bg-pending
          github-token: ${{ github.token }}
          run-id: 36394898597
          repository: mccareysupon-png/nomadtips3-live-test
      - name: Surgical deploy three scorebar assets
        run: bash .github/scripts/ball46_scorebar_bg_pending_deploy_20260928.sh
      - name: Upload deploy proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-scorebar-bg-pending-deploy-${{ github.run_id }}
          path: /tmp/b46-bg-pending-deploy
          if-no-files-found: ignore
          retention-days: 30
