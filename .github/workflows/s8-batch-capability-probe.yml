name: S8 Batch Capability Probe

on:
  push:
    branches: [feature/s8-external-sidecar-canary]
    paths:
      - ".github/workflows/s8-batch-capability-probe.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/s8-batch-capability-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}

jobs:
  probe-one-request:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate secret without printing it
        shell: bash
        run: test -n "$FIVEDOLLAR_API_KEY" || { echo "::error::Missing FIVEDOLLAR_API_KEY"; exit 1; }

      - name: Fetch live fixtures with embedded odds exactly once
        shell: bash
        run: |
          HTTP=$(curl -sS -o /tmp/s8-batch.json -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $FIVEDOLLAR_API_KEY" \
            -H "Accept: application/json" \
            "https://api.5dollarfootballapi.com/v1/fixtures?status=live&include=odds&per_page=500")
          echo "vendor_http=$HTTP"
          test "$HTTP" = "200" || { echo "::error::5Dollar batch HTTP $HTTP"; exit 1; }

      - name: Summarize embedded Bet365 Asian Handicap capability
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/s8-batch.json','utf8'));
          const fixtures=Array.isArray(payload?.data)
            ? payload.data
            : Array.isArray(payload?.data?.fixtures)
              ? payload.data.fixtures
              : [];

          function bet365Book(data){
            const arrays=[data?.bookmakers,data?.odds?.bookmakers,data?.odds];
            for(const candidate of arrays){
              if(!Array.isArray(candidate)) continue;
              const found=candidate.find(b=>String(b?.slug||'').toLowerCase()==='bet365'||/bet\s*365/i.test(String(b?.name||'')));
              if(found) return found;
            }
            return null;
          }
          function asian(data){
            const book=bet365Book(data);
            const market=book?.asian_handicap||book?.odds?.asian_handicap||data?.asian_handicap||data?.odds?.asian_handicap||null;
            const inplay=market?.inplay||market?.in_play||null;
            const line=Number(inplay?.line),home=Number(inplay?.home),away=Number(inplay?.away);
            if(Number.isFinite(line)&&Number.isFinite(home)) return {line,home,away:Number.isFinite(away)?away:null};
            return null;
          }
          function teams(f){
            const name=t=>t?.name||t?.team_name||t?.title||'';
            return {
              home:name(f?.teams?.home)||f?.home_team||f?.home||'',
              away:name(f?.teams?.away)||f?.away_team||f?.away||''
            };
          }

          const decoded=fixtures.map(f=>({fixtureId:f?.id??null,...teams(f),ah:asian(f)}));
          const ready=decoded.filter(x=>x.ah);
          const sample=decoded.slice(0,5).map((x,i)=>({
            fixtureId:x.fixtureId,home:x.home,away:x.away,hasEmbeddedBet365LiveAH:Boolean(x.ah),
            line:x.ah?.line??null,homeOdds:x.ah?.home??null,awayOdds:x.ah?.away??null,
            fixtureKeys:Object.keys(fixtures[i]||{}).sort().slice(0,30),
            oddsKeys:fixtures[i]?.odds&&typeof fixtures[i].odds==='object'&&!Array.isArray(fixtures[i].odds)
              ?Object.keys(fixtures[i].odds).sort().slice(0,30):[]
          }));
          console.log(JSON.stringify({
            sourceId:'source8',source:'5DollarFootballAPI',requestCount:1,
            liveFixtureCount:fixtures.length,embeddedBet365LiveAHCount:ready.length,
            singleRequestUsable:ready.length>0,sample
          },null,2));
          NODE
