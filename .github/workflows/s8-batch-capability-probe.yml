name: S8 Batch Capability Probe

on:
  push:
    branches: [feature/s8-external-sidecar-canary]
    paths:
      - ".github/workflows/s8-batch-capability-probe.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/s8-batch-capability-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}

jobs:
  probe-one-request:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate secret without printing it
        shell: bash
        run: test -n "$FIVEDOLLAR_API_KEY" || { echo "::error::Missing FIVEDOLLAR_API_KEY"; exit 1; }

      - name: Fetch live fixtures with embedded odds exactly once
        shell: bash
        run: |
          HTTP=$(curl -sS -o /tmp/s8-batch.json -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer $FIVEDOLLAR_API_KEY" \
            -H "Accept: application/json" \
            "https://api.5dollarfootballapi.com/v1/fixtures?status=live&include=odds&per_page=500")
          echo "vendor_http=$HTTP"
          test "$HTTP" = "200" || { echo "::error::5Dollar batch HTTP $HTTP"; exit 1; }

      - name: Inspect Asian Handicap shape for two fixtures
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/s8-batch.json','utf8'));
          const fixtures=Array.isArray(payload?.data)
            ? payload.data
            : Array.isArray(payload?.data?.fixtures)
              ? payload.data.fixtures
              : [];

          const teamName=t=>t?.name||t?.team_name||t?.title||'';
          const teams=f=>({
            home:teamName(f?.teams?.home)||f?.home_team||f?.home||'',
            away:teamName(f?.teams?.away)||f?.away_team||f?.away||''
          });

          function safeShape(value,depth=0){
            if(depth>4) return '[depth-limit]';
            if(value===null) return null;
            if(Array.isArray(value)) return {type:'array',length:value.length,sample:value.slice(0,2).map(v=>safeShape(v,depth+1))};
            if(typeof value==='object'){
              const out={};
              for(const [k,v] of Object.entries(value).slice(0,30)) out[k]=safeShape(v,depth+1);
              return out;
            }
            if(typeof value==='number'||typeof value==='boolean') return value;
            if(typeof value==='string') return value.length>80?`${value.slice(0,80)}…`:value;
            return typeof value;
          }

          const samples=fixtures.slice(0,2).map(f=>({
            fixtureId:f?.id??null,
            ...teams(f),
            asianHandicapShape:safeShape(f?.odds?.asian_handicap??null),
            asianHandicapHalfShape:safeShape(f?.odds?.asian_handicap_half??null)
          }));
          console.log(JSON.stringify({
            sourceId:'source8',source:'5DollarFootballAPI',requestCount:1,
            liveFixtureCount:fixtures.length,samples
          },null,2));
          NODE
