name: Deploy 3.43 Statistics Entry Donuts
on:
  push:
    branches:
      - work/nomad343-server-prewarm-20260914
    paths:
      - .github/workflows/deploy-343-statistics-entry-donut.yml
jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CANARY_URL: https://nomadtips3-343-stable-preview.mccarey-supon.workers.dev
      PROD_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nomad343-server-prewarm-20260914
          fetch-depth: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Statistics mirror source and scope
        run: |
          set -euo pipefail
          grep -Fq 'signal-entry-donut-343.css?v=343-entry-donut-v1' nomad-live-343/statistics.html
          grep -Fq 'signal-entry-donut-343.js?v=343-entry-donut-v1' nomad-live-343/statistics.html
          grep -Fq 'signal.js?v=343-signal-stable-refresh-v1' nomad-live-343/statistics.html
          node --check .github/scripts/test-343-statistics-entry-donut.js
          changed="$(git diff --name-only HEAD~5..HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Ev '^(nomad-live-343/statistics.html|\.github/scripts/test-343-statistics-entry-donut.js|\.github/workflows/deploy-343-statistics-entry-donut.yml|\.github/scripts/test-343-signal-entry-donut.js|\.github/workflows/deploy-343-signal-entry-donut.yml)$' | grep -q .; then
            echo UNEXPECTED_SCOPE_CHANGE
            exit 1
          fi
      - name: Dry run viewers
        run: |
          set -euo pipefail
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.stable.jsonc)
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc)
      - name: Install browser test
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Deploy canary viewer
        run: |
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.stable.jsonc
      - name: Wait for canary Statistics assets
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            html="$(curl -fsS "$CANARY_URL/statistics.html?asset=$RANDOM$(date +%s)" || true)"
            if grep -Fq 'signal-entry-donut-343.js?v=343-entry-donut-v1' <<<"$html" && grep -Fq 'signal.js?v=343-signal-stable-refresh-v1' <<<"$html"; then echo "CANARY STATISTICS ASSETS READY attempt=$i"; exit 0; fi
            sleep 2
          done
          echo CANARY_STATISTICS_ASSET_NOT_READY
          exit 1
      - name: Verify canary Statistics entry donuts
        run: TARGET_URL="$CANARY_URL" node .github/scripts/test-343-statistics-entry-donut.js
      - name: Deploy production viewer
        run: |
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc
      - name: Wait for production Statistics assets
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            html="$(curl -fsS "$PROD_URL/statistics.html?asset=$RANDOM$(date +%s)" || true)"
            if grep -Fq 'signal-entry-donut-343.js?v=343-entry-donut-v1' <<<"$html" && grep -Fq 'signal.js?v=343-signal-stable-refresh-v1' <<<"$html"; then echo "PRODUCTION STATISTICS ASSETS READY attempt=$i"; exit 0; fi
            sleep 2
          done
          echo PRODUCTION_STATISTICS_ASSET_NOT_READY
          exit 1
      - name: Verify production Statistics entry donuts
        run: TARGET_URL="$PROD_URL" node .github/scripts/test-343-statistics-entry-donut.js
