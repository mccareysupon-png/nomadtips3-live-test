name: Preflight Ball46 Live Clone Signal 20261007
on:
  push:
    branches:
      - work/ball46-live-clone-signal-20261007
    paths:
      - '.github/workflows/preflight-ball46-live-clone-signal-20261007.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PATCH_SOURCE_BRANCH: work/ball46-live-clone-signal-20261007
      DEPLOY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-live-clone-signal-20261007
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts acorn@8
      - name: Preflight Live Signal typography clone
        working-directory: deploy-assets/live-clone-signal-20261007
        run: node deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-live-clone-signal-preflight-${{ github.run_id }}
          path: deploy-assets/live-clone-signal-20261007/audit
          retention-days: 30
