name: BALL46 SPECIAL 6-WHEEL ONE Trip 100 History TEST REAL 5USD
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-special-six-wheel-100-real-20261122.yml]
permissions:
  contents: read
concurrency:
  group: ball46-special-six-wheel-one-trip-100-20261122
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate single-run special truck; immutable BTTS ledger/HCR tests
        run: |
          node --check qa/prematch-history-20261120/b46-special-six-wheel-truck-100-real-20261122.mjs
          node --test qa/prematch-history-20261120/btts-history-private.test.mjs qa/prematch-history-20261120/btts-pick-ledger-test.test.mjs qa/prematch-history-20261120/history-cargo-registry.test.mjs
      - name: Special truck ONE REAL Ultra trip (max 100 historical rows; 12 provider calls total)
        run: node qa/prematch-history-20261120/b46-special-six-wheel-truck-100-real-20261122.mjs
      - name: Preserve original provider replies and full structured report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-special-six-wheel-100-raw-20261122
          path: evidence/b46-special-truck-100/
          if-no-files-found: warn
          retention-days: 30
