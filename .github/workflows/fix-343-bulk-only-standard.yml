name: Fix 3.43 Bulk Only Standard

on:
  push:
    branches: [fix/343-bulk-only-standard-20260915]
    paths:
      - 'nomad-live-343/**'
      - 'workers/nomadtips3-engine-343/**'
      - 'workers/nomadtips3-343-preview/**'
      - '.github/workflows/fix-343-bulk-only-standard.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BASE_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate bulk-only invariant
        run: |
          set -euo pipefail
          node --check workers/nomadtips3-engine-343/src/index-bulk.js
          node --check workers/nomadtips3-343-preview/src/index.js
          node --check nomad-live-343/live.js
          node --check nomad-live-343/full-odds-main-343.js
          node --check nomad-live-343/utility-bar-343.js
          node --check nomad-live-343/team-sides-343.js
          grep -Fq 'main = "src/index-bulk.js"' workers/nomadtips3-engine-343/wrangler.toml
          grep -Fq "dataMode:'BULK_SNAPSHOT_ONLY'" workers/nomadtips3-engine-343/src/index-bulk.js
          grep -Fq "externalOddsRequests:0" workers/nomadtips3-engine-343/src/index-bulk.js
          grep -Fq "priceSource:'bulk-snapshot'" workers/nomadtips3-engine-343/src/index-bulk.js
          if grep -Fq 'api.5dollarfootballapi.com' workers/nomadtips3-engine-343/src/index-bulk.js; then
            echo 'ERROR: bulk-only engine contains direct provider URL'; exit 1
          fi
          grep -Fq 'full-odds-main-343.js?v=' nomad-live-343/index.html
          grep -Fq "const API='/api/full-market/fixture-odds'" nomad-live-343/full-odds-main-343.js
          grep -Fq "const FALLBACK_API='/api/engine/fixture-odds'" nomad-live-343/full-odds-main-343.js
          if grep -Fq 'api.5dollarfootballapi.com' nomad-live-343/full-odds-main-343.js; then
            echo 'ERROR: Full Market UI contains a direct provider URL'; exit 1
          fi
          if grep -Fq 'env.FULL_MARKET' workers/nomadtips3-343-preview/src/index.js; then
            echo 'ERROR: preview still calls FULL_MARKET binding'; exit 1
          fi
          if grep -Fq '"FULL_MARKET"' workers/nomadtips3-343-preview/wrangler.jsonc; then
            echo 'ERROR: preview still binds FULL_MARKET service'; exit 1
          fi

      - name: Dry-run engine
        working-directory: workers/nomadtips3-engine-343
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.toml

      - name: Dry-run preview
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc

      - name: Deploy bulk-only engine
        working-directory: workers/nomadtips3-engine-343
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.toml

      - name: Deploy bulk-only preview
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Smoke bulk-only runtime with cached Full Market
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -X POST "$BASE_URL/api/engine/scan?smoke=$RANDOM" -o /tmp/scan.json
          node -e "const s=require('/tmp/scan.json');if(s.ok!==true||s.dataMode!=='BULK_SNAPSHOT_ONLY'||Number(s.externalOddsRequests)!==0)throw Error('fresh bulk scan failed');console.log('SCAN_OK',s.fixtureCount,'fixtures')"
          curl -fsS --max-time 30 "$BASE_URL/api/engine/health?smoke=$RANDOM" -o /tmp/health.json
          curl -fsS --max-time 30 "$BASE_URL/api/engine/board?smoke=$RANDOM" -o /tmp/board.json
          curl -fsS --max-time 30 "$BASE_URL/api/full-market/health?smoke=$RANDOM" -o /tmp/fullmarket.json
          curl -fsS --max-time 30 "$BASE_URL/?smoke=$RANDOM" -o /tmp/index.html
          node -e "const fs=require('fs'),h=require('/tmp/health.json'),b=require('/tmp/board.json'),fm=require('/tmp/fullmarket.json');if(h.ok!==true)throw Error('engine health not ok');if(h.version!=='nomad343-engine-v4-bulk-only')throw Error('wrong engine version');if(h.dataMode!=='BULK_SNAPSHOT_ONLY'||Number(h.externalOddsRequests)!==0)throw Error('engine not bulk-only');if(b.ok!==true||!Array.isArray(b.fixtures))throw Error('board not ready');if(b.dataMode!=='BULK_SNAPSHOT_ONLY'||Number(b.referee?.externalRequestsAdded)!==0)throw Error('board referee not bulk-only');if(fm.ok!==true||fm.mode!=='BULK_SNAPSHOT_ONLY'||Number(fm.externalRequestsAdded)!==0)throw Error('full-market compat not isolated');const pick=b.fixtures.find(x=>x?.fixtureId)||null;fs.writeFileSync('/tmp/fixture-id',pick?String(pick.fixtureId):'');console.log('BULK_ONLY_OK',b.fixtures.length,'fixtures',b.counts,'signals',h.signalCount||0)"
          grep -Fq 'full-odds-main-343.js?v=' /tmp/index.html
          grep -Fq 'nav-clean-343.css?v=' /tmp/index.html
          grep -Fq 'utility-bar-343.js?v=' /tmp/index.html
          FIXTURE_ID="$(cat /tmp/fixture-id)"
          if [ -n "$FIXTURE_ID" ]; then
            code="$(curl -sS --max-time 30 -o /tmp/fixture-odds.json -w '%{http_code}' "$BASE_URL/api/full-market/fixture-odds?fixtureId=$FIXTURE_ID&smoke=$RANDOM")"
            test "$code" = "200" -o "$code" = "404"
            node -e "const j=require('/tmp/fixture-odds.json');if(Number(j.externalRequestsAdded)!==0)throw Error('Full Market added provider requests');if(j.ok===true&&(j.source!=='BULK_SNAPSHOT'||j.cached!==true))throw Error('Full Market is not reading cached bulk snapshot');if(j.ok!==true&&j.error!=='ODDS_UNAVAILABLE_IN_BULK_SNAPSHOT')throw Error('unexpected Full Market response');console.log('FULL_MARKET_CACHE_OK',j.ok===true?'ODDS_READY':'NO_ODDS_IN_SNAPSHOT')"
          fi
          echo 'BULK_ONLY_WITH_CACHED_FULL_MARKET_OK'
