name: READ ONLY Identify missing BULK finished fixtures in settlement
on:
  push:
    branches: [diag/ball46-bulk-settlement-gaps-20261017]
    paths: [.github/workflows/audit-bulk-final-loss-20261017.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Compare all pending IDs to 5USD HUB and inspect page cap
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const acct=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          const hub='https://nomadtips3-5usd-hub-343.mccarey-supon.workers.dev';
          const eng='https://nomadtips3-engine-343.mccarey-supon.workers.dev';
          async function read(url){const res=await fetch(url+'?diag='+Date.now(),{signal:AbortSignal.timeout(16000),headers:{'cache-control':'no-cache'}});const body=await res.json();return{http:res.status,body}}
          const [health,hubData,signalData,engineBoard]=await Promise.all([
            read(hub+'/health'),read(hub+'/snapshot'),read(eng+'/signals'),read(eng+'/board')
          ]);
          const data=hubData.body,healthState=health.body,fixtures=data.fixtures||[],pending=signalData.body.signals||[];
          const hm=new Map(fixtures.map(f=>[String(f.fixtureId),f]));
          const missing=pending.filter(s=>!hm.has(String(s.fixtureId)));
          const today=new Date(Date.now()+7*3600e3).toISOString().slice(0,10);
          const summaries=missing.map(s=>({fixtureId:s.fixtureId,market:s.market,creation:new Date(s.createdAt).toISOString(),
            kickoff:s.kickoffUtc||s.kickoffAt||s.kickoff||null,league:typeof s.league==='object'?s.league?.name:s.league,
            home:typeof s.home==='object'?s.home?.name:s.home,away:typeof s.away==='object'?s.away?.name:s.away}));
          const finished=fixtures.filter(f=>f.boardState==='finished');
          console.log('BULK_SETTLEMENT_TRUTH '+JSON.stringify({
            at:new Date().toISOString(),todayBangkok:today,
            health:{fixtureCount:healthState.fixtureCount,counts:healthState.counts,todayRequests:healthState.todayRequests,
              liveRequests:healthState.liveRequests,guardHit:healthState.guardHit,todayWindow:healthState.todayWindow,
              todayFetchedAt:healthState.todayFetchedAt,liveFetchedAt:healthState.liveFetchedAt,providerBudget:healthState.providerRequestBudget,
              error:healthState.lastError,refreshKind:healthState.refreshKind},
            snapshot:{total:fixtures.length,counts:data.counts,fetchedAt:data.fetchedAt,ageMs:data.ageMs,
              finishedCount:finished.length,firstFinished:finished.slice(0,4).map(f=>({id:f.fixtureId,kickoffUtc:f.kickoffUtc,status:f.status,score:f.goals}))},
            pending:{count:pending.length,missing:missing.length,present:pending.length-missing.length,examples:summaries.slice(0,35)}
          }).slice(0,15000));
          const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+acct+
            '/workers/workers/nomadtips3-5usd-hub-343/versions/2b01dc85-a525-4283-959e-8f6db796c81e?include=modules',
            {headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
          const payload=await response.json();
          if(!payload.success)throw Error('HUB_SOURCE_FETCH_FAIL');
          const v=payload.result,src=Buffer.from(v.modules.find(m=>m.name===v.main_module).content_base64,'base64').toString();
          for(const term of ['TODAY_PAGE_SIZE','TODAY_MAX_PAGES','function bangkokWindow','async function fetchTodayAndLive','async refreshToday()',
           'async refreshLive()','async refresh()','function merge(base, extra)','this.saveRows','async saveSnapshot','async snapshot()']){
            const i=src.indexOf(term);
            console.log('HUB_SOURCE_SPOT '+JSON.stringify({term,found:i>=0,code:i<0?null:src.slice(Math.max(0,i-150),i+2300)}).slice(0,5300))
          }
          const er=await fetch('https://api.cloudflare.com/client/v4/accounts/'+acct+
            '/workers/workers/nomadtips3-engine-343/versions/9b363777-64fc-4a48-a10a-0fad822640cb?include=modules',
            {headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
          const ej=await er.json();if(!ej.success)throw Error('ENGINE_SOURCE_FAIL');
          const e=ej.result,es=Buffer.from(e.modules.find(m=>m.name===e.main_module).content_base64,'base64').toString();
          for(const term of ['for (const s of signals) {\n        if (s.status !== "PENDING")','async reconcileExternalFinal','/reconcile-final',
            'async function readWorkingSignals','async function fetchFinal']){
            const i=es.indexOf(term);
            console.log('ENGINE_SOURCE_SPOT '+JSON.stringify({term,found:i>=0,code:i<0?null:es.slice(Math.max(0,i-220),i+2600)}).slice(0,6400));
          }
          NODE
