name: ONE SHOT - Ball46 Card Step6 Deploy 20260928
on:
  push:
    branches:
      - work/ball46-card-rebuild-step5-20260928
    paths:
      - '.github/scripts/ball46_card_step6_deploy_20260928.sh'
      - '.github/workflows/ball46-card-step6-deploy-20260928.yml'
permissions:
  contents: read
  actions: read
jobs:
  deploy-step6:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download 79-path production inventory
        uses: actions/download-artifact@v4
        with:
          name: ball46-card-step5-predeploy-36366786529
          path: /tmp/b46-step6-base
          github-token: ${{ github.token }}
          repository: mccareysupon-png/nomadtips3-live-test
          run-id: 36366786529
      - name: Download exact Step6 verified preview
        uses: actions/download-artifact@v4
        with:
          name: ball46-card-step6-preview-36372604145
          path: /tmp/b46-step6-preview
          github-token: ${{ github.token }}
          repository: mccareysupon-png/nomadtips3-live-test
          run-id: 36372604145
      - name: Deploy two UI assets with runtime and flow guards
        run: bash .github/scripts/ball46_card_step6_deploy_20260928.sh
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-card-step6-deploy-${{ github.run_id }}
          path: /tmp/b46-step6-deploy
          if-no-files-found: ignore
          retention-days: 30
