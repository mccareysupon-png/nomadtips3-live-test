name: Deploy CAR 3.5 Preview

on:
  push:
    branches:
      - work/car3-5-live-soccer-analysis
    paths:
      - 'car3-5-live-soccer-analysis/**'
      - '.github/workflows/car35-preview-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PREVIEW_URL: https://nomadtips3-car35-preview.mccarey-supon.workers.dev
  MEMBERSHIP_URL: https://nomadtips3-test-api.mccarey-supon.workers.dev

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate CAR 3.5 direct Goaloo engine and frontend
        run: |
          node --check car3-5-live-soccer-analysis/web/app.js
          node --check car3-5-live-soccer-analysis/web/goaloo-animation.js
          node --check car3-5-live-soccer-analysis/src/index.js
          node --check car3-5-live-soccer-analysis/src/goaloo-direct.js
          node --check car3-5-live-soccer-analysis/src/car35-engine.js
          test -s car3-5-live-soccer-analysis/web/index.html
          test -s car3-5-live-soccer-analysis/web/statistics.html
          test -s car3-5-live-soccer-analysis/web/alerts.html
          test -s car3-5-live-soccer-analysis/web/payment.html
          test -s car3-5-live-soccer-analysis/web/owner-control.html
          test -s car3-5-live-soccer-analysis/web/styles.css
          grep -q 'GOALOO_DIRECT' car3-5-live-soccer-analysis/web/runtime.json
          grep -q 'CAR35_STATE' car3-5-live-soccer-analysis/wrangler.jsonc
          grep -q 'goaloo28.com/gf/data/bf_us.js' car3-5-live-soccer-analysis/src/goaloo-direct.js
          grep -q 'goaloo28.com/gf/data/detailIn.js' car3-5-live-soccer-analysis/src/goaloo-direct.js
          grep -q 'runOddsData_8.txt' car3-5-live-soccer-analysis/src/goaloo-direct.js
          grep -q 'm.goaloo.com/flashdata/get' car3-5-live-soccer-analysis/src/goaloo-direct.js
          grep -q 'owner-control.html' car3-5-live-soccer-analysis/src/index.js
          grep -q 'ราคาต่อรอง Asian Handicap' car3-5-live-soccer-analysis/web/owner-control.html
          grep -q 'id="ahMin"' car3-5-live-soccer-analysis/web/owner-control.html
          grep -q 'name="oddsMin"' car3-5-live-soccer-analysis/web/owner-control.html
          grep -q 'payment.html' car3-5-live-soccer-analysis/web/alerts.html
          grep -q 'nomadtips3-test-api.mccarey-supon.workers.dev/membership/start' car3-5-live-soccer-analysis/web/payment.html

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CF_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Verify Stripe and LINE membership readiness
        run: |
          curl -fsS "$MEMBERSHIP_URL/membership/health" -o /tmp/membership-health.json
          python - <<'PY'
          import json
          with open('/tmp/membership-health.json', encoding='utf-8') as f:
              d=json.load(f)
          assert d.get('ok') is True, 'membership health is not OK'
          assert d.get('stripeWebhookConfigured') is True, 'Stripe webhook is not configured'
          assert d.get('lineConfigured') is True, 'LINE messaging is not configured'
          assert d.get('lineAddFriendConfigured') is True, 'LINE add-friend URL is not configured'
          assert d.get('paymentLinkConfigured') is True, 'Stripe payment link is not configured'
          print('Stripe + LINE membership readiness: OK')
          PY

      - name: Deploy isolated CAR 3.5 preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: car3-5-live-soccer-analysis
          wranglerVersion: '4'
          command: deploy

      - name: Smoke test direct Goaloo preview
        run: |
          node --input-type=module <<'NODE'
          const base=process.env.PREVIEW_URL;
          const pages=[
            ['root','/',['nomadtips3']],
            ['statistics','/statistics.html',['Statistics']],
            ['alerts','/alerts.html',['Live alerts','payment.html']],
            ['payment','/payment.html',['Continue to Stripe','nomadtips3-test-api.mccarey-supon.workers.dev/membership/start']],
            ['owner legacy route','/owner-settings',['ราคาต่อรอง Asian Handicap','id="ahMin"']],
            ['owner direct','/owner-control.html',['ราคาต่อรอง Asian Handicap','id="ahMin"']]
          ];
          for(const [name,path,needles] of pages){
            const response=await fetch(`${base}${path}?smoke=${Date.now()}`,{redirect:'follow',headers:{'cache-control':'no-cache'}});
            const text=await response.text();
            console.log(`${name}: HTTP ${response.status}`);
            if(!response.ok)throw new Error(`${name}: HTTP ${response.status}`);
            for(const needle of needles)if(!text.includes(needle))throw new Error(`${name}: missing ${needle}`);
          }
          const health=await fetch(`${base}/health?t=${Date.now()}`,{cache:'no-store'}).then(r=>r.json());
          if(!health.ok||health.mode!=='DIRECT_GOALOO')throw new Error(`health not direct Goaloo: ${JSON.stringify(health)}`);
          const live=await fetch(`${base}/live?t=${Date.now()}`,{cache:'no-store'}).then(r=>r.json());
          if(!live.ok||live.source!=='GOALOO_DIRECT'||!Array.isArray(live.matches))throw new Error(`live contract failed: ${JSON.stringify(live).slice(0,800)}`);
          const bad=await fetch(`${base}/animation?id=not-a-match`);
          if(bad.status!==400)throw new Error(`animation validation expected 400, got ${bad.status}`);
          console.log(`CAR 3.5 direct Goaloo preview OK: ${base}`);
          NODE
