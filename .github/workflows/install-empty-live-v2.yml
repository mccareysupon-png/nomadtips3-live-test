name: Install Empty Live Stadium Media V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-empty-live-v2.yml'
      - '.empty-live-v2/READY'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nomadtips3-install-empty-live-v2
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode image
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .empty-live-v2/READY ]; then exit 0; fi
          mkdir -p assets
          cat .empty-live-v2/part*.b64 | tr -d '\n\r ' | base64 --decode > assets/empty-live-stadium.webp
          test -s assets/empty-live-stadium.webp
          file assets/empty-live-stadium.webp | grep -qi 'Web/P image'
          rm -rf .empty-live-v2
      - name: Commit image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets/empty-live-stadium.webp .empty-live-v2
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Install empty live stadium image'
          git pull --rebase origin main
          git push origin main
