name: BALL46 TEST Signal newest-first and Event Flow stable scroll QA
on:
  push:
    branches: [test/ball46-premium-match-colors-20261120]
    paths:
      - '.github/workflows/ball46-signal-stable-20261121-qa.yml'
      - 'qa/signal-stable-20261121/signal-stable.mjs'
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check qa/signal-stable-20261121/signal-stable.mjs
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Browser check actual Signal order, frozen Event Flow and unchanged Live view
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const base='https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev';
          let deployed=false;
          for(let i=0;i<36;i++){
            try{const r=await fetch(base+'/_premium_health');const h=await r.json();
              if(h.signalStable==='SIGNAL_CREATEDAT_SORT_AND_FLOW_FREEZE_TEST'&&h.signalStableScript?.includes('signal-latest-freeze-test-20261121')){deployed=true;break}
            }catch{}
            await new Promise(r=>setTimeout(r,2000));
          }
          assert(deployed,'SIGNAL_TEST_WORKER_RELEASE_NOT_LIVE');
          const browser=await chromium.launch();const p=await browser.newPage({viewport:{width:1440,height:960},serviceWorkers:'block'});
          const errors=[];p.on('pageerror',e=>errors.push(e.message.slice(0,350)));
          await p.addInitScript(()=>localStorage.setItem('nomad343_dashboard_theme_v1','dark'));
          try{
            await p.goto(base+'/?view=signal',{waitUntil:'domcontentloaded',timeout:75000});
            await p.waitForFunction(()=>window.__b46SignalStableStatus?.seenSource===true&&document.querySelector('.board-sections[data-b46-signal-sort-ready="1"] .status-section[data-status-section="live"] .match-row'),null,{timeout:45000});
            await p.waitForTimeout(400);
            const read=()=>p.evaluate(()=>{
              const board=document.querySelector('.board-sections');
              const status=board?.querySelector('.status-section[data-status-section="live"]');
              const rows=[...status?.querySelectorAll('.league-block > .match-row[data-match-id]')||[]];
              const visible=rows.map(r=>({id:r.dataset.matchId,top:r.getBoundingClientRect().top,order:getComputedStyle(r).order,style:r.style.order,league:r.getAttribute('data-b46-signal-league'),height:r.getBoundingClientRect().height,w:r.getBoundingClientRect().width})).sort((a,b)=>a.top-b.top);
              const info=window.__b46SignalStableQA.state(),list=window.__b46SignalStableQA.latest();
              const headers=[...status?.querySelectorAll('.league-head')||[]].map(x=>({text:(x.innerText||'').slice(0,100),height:x.getBoundingClientRect().height,visibility:getComputedStyle(x).display}));
              const flow=status?.querySelector('.expand-flow-card');
              const active=status?.querySelector('.match-row.active');
              return {info,visible,api:list,headers,flow:!!flow,activeId:active?.dataset.matchId||null,board:{top:board?.scrollTop,height:board?.scrollHeight,client:board?.clientHeight},bodyHeight:document.documentElement.scrollHeight};
            });
            const first=await read();
            console.log('SIGNAL_INITIAL_TEST '+JSON.stringify(first));
            assert(first.info.seenSource&&first.visible.length>1,'NO_REAL_SIGNALS_FOR_SORT');
            assert(first.headers.some(x=>x.text.includes('LATEST LIVE PREDICTIONS')&&x.height>10),'ONE_GLOBAL_HEADER_MISSING');
            assert.equal(first.headers.filter(x=>x.height>10).length,1,'DUPLICATE_LEAGUE_HEADERS_SHOWN');
            const expected=[...first.visible].sort((a,b)=>{
              const at=id=>first.api.find(t=>t.id===id)?.at||0;
              return at(b.id)-at(a.id)||0;
            });
            assert.deepEqual(first.visible.map(x=>x.id),expected.map(x=>x.id),'NOT_SORTED_BY_SIGNAL_CREATEDAT');
            const last=first.visible.at(-1).id;
            const synthetic=first.visible.map((x,i)=>({fixtureId:x.id,createdAt:1795245000000+i*1000}));
            // Last in current visual order becomes highest priority, through a browser-local Engine feed.
            await p.evaluate(signals=>window.__b46SignalStableQA.applySignals({signals}),synthetic);
            await p.waitForTimeout(500);
            const reordered=await read();
            console.log('SIGNAL_REORDER_TEST '+JSON.stringify({before:first.visible.map(x=>x.id),after:reordered.visible.map(x=>x.id),expected:last}));
            assert.equal(reordered.visible[0].id,last,'NEWEST_PREDICTION_NOT_AT_TOP');
            const selected=p.locator('.status-section[data-status-section="live"] .match-row[data-match-id="'+last+'"]');
            await selected.click({position:{x:95,y:25},force:true});
            await p.waitForFunction(()=>!!document.querySelector('.status-section[data-status-section="live"] .expand-flow-card'),null,{timeout:22000});
            await p.waitForTimeout(300);
            const opened=await read();
            assert.equal(opened.info.frozen,last,'EVENT_FLOW_NOT_FROZEN');
            assert(opened.flow,'EVENT_FLOW_NOT_OPEN');
            const frozenTop=opened.visible.map(x=>x.id).join('|');
            // New signal on a different match must not reorder the viewport while event detail is open.
            const alternative=opened.visible.at(-1).id;
            const advanced=opened.visible.map(x=>({fixtureId:x.id,createdAt:x.id===alternative?1795249999999:1795245000000}));
            await p.evaluate(signals=>window.__b46SignalStableQA.applySignals({signals}),advanced);
            await p.waitForTimeout(500);
            const whileOpen=await read();
            console.log('SIGNAL_EVENTFLOW_FROZEN_TEST '+JSON.stringify({opened:{order:opened.visible.map(x=>x.id),scroll:opened.board.top,active:opened.activeId},whileOpen:{order:whileOpen.visible.map(x=>x.id),scroll:whileOpen.board.top,active:whileOpen.activeId,pending:whileOpen.info.pendingChanges}}));
            assert.equal(whileOpen.visible.map(x=>x.id).join('|'),frozenTop,'EVENT_FLOW_REORDERED_WHILE_OPEN');
            assert(whileOpen.flow&&whileOpen.activeId===last,'OPEN_EVENT_FLOW_CHANGED_MATCH');
            assert(Math.abs(whileOpen.board.top-opened.board.top)<3,'EVENT_FLOW_SCROLL_JUMPED_ON_NEW_PREDICTION');
            await selected.click({position:{x:95,y:25},force:true});
            await p.waitForTimeout(1100);
            const closed=await read();
            console.log('SIGNAL_EVENTFLOW_CLOSED_TEST '+JSON.stringify({closed:{flow:closed.flow,frozen:closed.info.frozen,order:closed.visible.map(x=>x.id)},newest:alternative}));
            assert(!closed.flow,'EVENT_FLOW_DID_NOT_CLOSE');
            assert.equal(closed.info.frozen,null,'FLOW_FREEZE_NOT_RELEASED');
            assert.equal(closed.visible[0].id,alternative,'NEWEST_NOT_SORTED_AFTER_CLOSE');
            await p.goto(base+'/?view=live',{waitUntil:'domcontentloaded',timeout:70000});
            await p.waitForTimeout(2400);
            const live=await p.evaluate(()=>({
              view:document.body.dataset.workspaceView,
              sorted:document.querySelector('.board-sections')?.getAttribute('data-b46-signal-sort-ready')||null,
              statusDisplay:getComputedStyle(document.querySelector('.status-section')||document.body).display,
              leagueHeaders:[...document.querySelectorAll('.status-section .league-head')].filter(e=>e.getBoundingClientRect().height>10).length,
              codeLoaded:!!window.__b46SignalStableV1
            }));
            console.log('SIGNAL_LIVE_SCOPE_TEST '+JSON.stringify(live));
            assert.equal(live.view,'live','NOT_ON_LIVE');
            assert.equal(live.sorted,null,'LIVE_SORTED_UNEXPECTEDLY');
            assert(live.leagueHeaders>=1,'LIVE_LEAGUE_HEADERS_HIDDEN');
            assert.deepEqual(errors,[],'PAGE_ERRORS_'+JSON.stringify(errors));
            console.log('BALL46_SIGNAL_STABLE_TEST_PASS '+JSON.stringify({newestFirst:true,flowFrozen:true,closeRestoresOrder:true,liveUntouched:true,apiCallsAdded:0}));
          }finally{await browser.close()}
          NODE