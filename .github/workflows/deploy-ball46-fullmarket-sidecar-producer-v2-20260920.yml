name: Deploy Ball46 Full Market Sidecar Producer V2 20260920

on:
  push:
    branches:
      - work/ball46-fullmarket-sidecar-producer-v1-20260920
    paths:
      - '.github/workflows/deploy-ball46-fullmarket-sidecar-producer-v2-20260920.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_URL: https://ball46.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WRAPPER_CFG: workers/nomadtips3-343-preview/wrangler.ball46.jsonc
  FULL_CFG: workers/nomadtips3-full-market-343-ball46/wrangler.toml

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static safety checks
        shell: bash
        run: |
          set -euo pipefail
          node --check workers/nomadtips3-full-market-343-ball46/src/index.js
          node --check workers/nomadtips3-343-preview/src/index.js
          node --check nomad-live-343/full-market-sidecar-343.js
          node --check nomad-live-343/live-summary-full-odds-343.js
          grep -Fq 'nomad343-ball46-full-market-v6-central-producer-cache-only' workers/nomadtips3-full-market-343-ball46/src/index.js
          grep -Fq 'return this.readOnly(id)' workers/nomadtips3-full-market-343-ball46/src/index.js
          grep -Fq 'PRODUCER_ROUTE_PRIVATE' workers/nomadtips3-full-market-343-ball46/src/index.js
          ! grep -Fq 'mergeFullOdds' workers/nomadtips3-full-market-343-ball46/src/index.js
          grep -Fq '/api/full-market/board-cache' nomad-live-343/full-market-sidecar-343.js
          grep -Fq 'providerRequestsPerViewer:0' nomad-live-343/full-market-sidecar-343.js
          grep -Fq 'DISPLAY_ALL_RETURNED_BOOKMAKERS' nomad-live-343/full-market-sidecar-343.js
          grep -Fq 'DISPLAY_ALL_RETURNED_MARKETS' nomad-live-343/full-market-sidecar-343.js
          ! grep -Fq '/api/full-market/fixture-odds' nomad-live-343/full-market-sidecar-343.js
          ! grep -Fq '/api/full-market/fixture-odds' nomad-live-343/live-summary-full-odds-343.js
          ! grep -Fq 'visibility:hidden!important' nomad-live-343/live-summary-full-odds-343.js

      - name: Capture rollback points and protected backend versions
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deployments list --config "$WRAPPER_CFG" --json > /tmp/wrapper-before.json
          npx --yes wrangler@4.92.0 deployments list --config "$FULL_CFG" --json > /tmp/full-before.json
          node - <<'NODE'
          const fs=require('fs');
          function active(path){const r=JSON.parse(fs.readFileSync(path,'utf8')); const x=r[r.length-1]; return x?.versions?.find(v=>Number(v.percentage)===100)?.version_id||''}
          fs.writeFileSync('/tmp/wrapper-version',active('/tmp/wrapper-before.json'));
          fs.writeFileSync('/tmp/full-version',active('/tmp/full-before.json'));
          NODE
          curl -fsS -L --max-time 30 "$BALL46_URL/api/engine/health?pre=${GITHUB_RUN_ID}" -o /tmp/engine-before.json
          curl -fsS -L --max-time 30 "$BALL46_URL/api/hub/health?pre=${GITHUB_RUN_ID}" -o /tmp/hub-before.json
          node - <<'NODE'
          const fs=require('fs'),e=require('/tmp/engine-before.json'),h=require('/tmp/hub-before.json');
          if(!e.version||!h.version) throw Error('PROTECTED_VERSION_MISSING');
          fs.writeFileSync('/tmp/engine-version',String(e.version)); fs.writeFileSync('/tmp/hub-version',String(h.version));
          console.log('ROLLBACK_WRAPPER='+fs.readFileSync('/tmp/wrapper-version','utf8'));
          console.log('ROLLBACK_FULL='+fs.readFileSync('/tmp/full-version','utf8'));
          console.log('ENGINE='+e.version); console.log('HUB='+h.version);
          NODE

      - name: Dry run both workers
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --dry-run --config "$FULL_CFG"
          npx --yes wrangler@4.92.0 deploy --dry-run --config "$WRAPPER_CFG"

      - name: Deploy Full Market producer then Ball46 wrapper
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --config "$FULL_CFG"
          npx --yes wrangler@4.92.0 deploy --config "$WRAPPER_CFG"
          echo POST_DEPLOY_PROPAGATION_WAIT
          sleep 8

      - name: Verify Full Market health v6
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 20); do
            curl -fsS -L --max-time 30 "$BALL46_URL/api/full-market/health?v2h=${GITHUB_RUN_ID}-${n}" -o /tmp/full-health.json || true
            if node -e "const j=require('/tmp/full-health.json');process.exit(j.ok===true&&j.version==='nomad343-ball46-full-market-v6-central-producer-cache-only'&&j.cacheOnlyViewer===true&&j.viewerRefreshEnabled===false&&Number(j.bookmakerRequestCount)===19?0:1)" 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          cat /tmp/full-health.json
          [ "$ok" = 1 ]

      - name: Verify board cache propagation and zero upstream
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 20); do
            code=$(curl -sS -L --max-time 30 -H 'content-type: application/json' -d '{"fixtureIds":[]}' -o /tmp/board-cache.json -w '%{http_code}' "$BALL46_URL/api/full-market/board-cache?v2b=${GITHUB_RUN_ID}-${n}" || true)
            echo "BOARD_CACHE_ATTEMPT=$n HTTP=$code"
            cat /tmp/board-cache.json || true; echo
            if [ "$code" = 200 ] && node -e "const j=require('/tmp/board-cache.json');process.exit(j.ok===true&&j.cacheOnly===true&&j.viewerRefreshEnabled===false&&Number(j.externalRequestsAdded)===0?0:1)" 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ]

      - name: Verify fixture cache miss cannot trigger provider
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 15); do
            PROBE="ci-probe-${GITHUB_RUN_ID}-${n}"
            code=$(curl -sS -L --max-time 30 -o /tmp/fixture-cache.json -w '%{http_code}' "$BALL46_URL/api/full-market/fixture-odds?fixtureId=${PROBE}&v2f=${GITHUB_RUN_ID}-${n}" || true)
            echo "FIXTURE_CACHE_ATTEMPT=$n HTTP=$code"
            cat /tmp/fixture-cache.json || true; echo
            if [ "$code" = 404 ] && node -e "const j=require('/tmp/fixture-cache.json');process.exit(j.error==='FULL_MARKET_CACHE_MISS'&&j.cacheOnly===true&&j.viewerRefreshEnabled===false&&Number(j.externalRequestsAdded)===0?0:1)" 2>/dev/null; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ]

      - name: Verify UI sidecar propagation
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 20); do
            curl -fsS -L --max-time 30 "$BALL46_URL/live-summary-full-odds-343.js?v2ui=${GITHUB_RUN_ID}-${n}" -o /tmp/live-summary.js || true
            curl -fsS -L --max-time 30 "$BALL46_URL/full-market-sidecar-343.js?v2ui=${GITHUB_RUN_ID}-${n}" -o /tmp/sidecar.js || true
            if grep -Fq '343-live-summary-central-cache-sidecar-v5' /tmp/live-summary.js && grep -Fq '/api/full-market/board-cache' /tmp/sidecar.js && grep -Fq 'providerRequestsPerViewer:0' /tmp/sidecar.js && grep -Fq 'DISPLAY_ALL_RETURNED_BOOKMAKERS' /tmp/sidecar.js && grep -Fq 'DISPLAY_ALL_RETURNED_MARKETS' /tmp/sidecar.js && ! grep -Fq '/api/full-market/fixture-odds' /tmp/live-summary.js && ! grep -Fq 'visibility:hidden!important' /tmp/live-summary.js; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ]
          node --check /tmp/live-summary.js
          node --check /tmp/sidecar.js

      - name: Verify Engine and HUB unchanged
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --max-time 30 "$BALL46_URL/api/engine/health?v2post=${GITHUB_RUN_ID}" -o /tmp/engine-after.json
          curl -fsS -L --max-time 30 "$BALL46_URL/api/hub/health?v2post=${GITHUB_RUN_ID}" -o /tmp/hub-after.json
          node - <<'NODE'
          const fs=require('fs'),e=require('/tmp/engine-after.json'),h=require('/tmp/hub-after.json');
          if(String(e.version)!==fs.readFileSync('/tmp/engine-version','utf8')) throw Error('ENGINE_CHANGED');
          if(String(h.version)!==fs.readFileSync('/tmp/hub-version','utf8')) throw Error('HUB_CHANGED');
          console.log('PROTECTED_BACKENDS_PASS',JSON.stringify({engine:e.version,hub:h.version}));
          NODE

      - name: Wait for scheduled producer cycle
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 18); do
            curl -fsS -L --max-time 30 "$BALL46_URL/api/full-market/health?producer=${GITHUB_RUN_ID}-${n}" -o /tmp/producer-health.json || true
            node - <<'NODE' >/tmp/producer-check 2>/dev/null || true
          const j=require('/tmp/producer-health.json'); const p=j.producer;
          if(p&&p.cycleId){console.log(JSON.stringify({cycleId:p.cycleId,liveFixtures:p.liveFixtures,candidates:p.candidates,attempted:p.attempted,providerCalls:p.providerCalls,refreshed:p.refreshed,held:p.held,errors:p.errors,queued:p.queued,stopReason:p.stopReason}));process.exit(0)}
          process.exit(1)
          NODE
            if [ -s /tmp/producer-check ]; then cat /tmp/producer-check; ok=1; break; fi
            sleep 10
          done
          [ "$ok" = 1 ]

      - name: Verify live Full Market cache if live fixtures exist
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --max-time 30 "$BALL46_URL/api/engine/board?v2live=${GITHUB_RUN_ID}" -o /tmp/board.json
          node - <<'NODE'
          const fs=require('fs'),j=require('/tmp/board.json'); const a=Array.isArray(j.fixtures)?j.fixtures:[];
          const live=a.filter(f=>String(f.boardState||'').toLowerCase()==='live'||/in_play|live|half/.test(String(f.status||'').toLowerCase()));
          const ids=[...new Set(live.map(f=>String(f.fixtureId||'').trim()).filter(Boolean))].slice(0,32);
          fs.writeFileSync('/tmp/live-ids.json',JSON.stringify({fixtureIds:ids})); console.log('LIVE_IDS',ids.length,ids.join(','));
          NODE
          count=$(node -e "console.log(require('/tmp/live-ids.json').fixtureIds.length)")
          if [ "$count" = 0 ]; then echo NO_LIVE_FIXTURES_CACHE_CHECK_SKIPPED; exit 0; fi
          curl -fsS -L --max-time 30 -H 'content-type: application/json' --data-binary @/tmp/live-ids.json "$BALL46_URL/api/full-market/board-cache?v2livecache=${GITHUB_RUN_ID}" -o /tmp/live-cache.json
          node - <<'NODE'
          const j=require('/tmp/live-cache.json'),e=j.entries||{},rows=Object.values(e);
          console.log('LIVE_CACHE_SUMMARY',JSON.stringify({requested:j.requested,returned:j.returned,entries:rows.map(x=>({fixtureId:x.fixtureId,bookmakerCount:x.bookmakerCount,marketCount:x.marketCount,numericValueCount:x.numericValueCount,held:x.held,ageMs:x.ageMs}))}));
          if(j.ok!==true||j.cacheOnly!==true||Number(j.externalRequestsAdded)!==0) throw Error('LIVE_CACHE_NOT_READ_ONLY');
          if(!rows.length) throw Error('NO_LIVE_FULL_MARKET_CACHE_AFTER_PRODUCER');
          for(const x of rows){const books=Array.isArray(x?.fullOdds?.bookmakers)?x.fullOdds.bookmakers:[];if(books.length&&Number(x.bookmakerCount)!==books.length)throw Error('BOOKMAKER_COUNT_MISMATCH')}
          NODE

      - name: Roll back both workers on any failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo VERIFY_FAILED_ROLLBACK
          W=$(cat /tmp/wrapper-version 2>/dev/null); F=$(cat /tmp/full-version 2>/dev/null)
          [ -n "$W" ] && npx --yes wrangler@4.92.0 rollback "$W" --config "$WRAPPER_CFG"
          [ -n "$F" ] && npx --yes wrangler@4.92.0 rollback "$F" --config "$FULL_CFG"
