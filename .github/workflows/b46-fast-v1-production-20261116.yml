name: BALL46 FAST V1 owner approved candidate and conditional Production release
on:
  push:
    branches: [chatgpt/ball46-statistics-ui-v1]
    paths:
      - 'deploy-assets/ball46-statistics-fast-v1-20261116/**'
      - '.github/workflows/b46-fast-v1-production-20261116.yml'
permissions: {contents: read}
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  validated-fast-v1:
    if: contains(github.event.head_commit.message, '[owner-approved-ball46-fast-v1-candidate]') || contains(github.event.head_commit.message, '[owner-approved-ball46-fast-v1-activate]')
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      B46_APPROVED_FAST_V1: 'YES'
      B46_V1_MODE: ${{ contains(github.event.head_commit.message, '[owner-approved-ball46-fast-v1-activate]') && 'activate' || 'candidate' }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Strict V1 release input and scope validation
        run: |
          set -euo pipefail
          ROOT="deploy-assets/ball46-statistics-fast-v1-20261116"
          node --check "$ROOT/deploy.mjs"
          node --check "$ROOT/verify-fast-browser.mjs"
          node --check "$ROOT/prod-lazy-patch.mjs"
          node --check "$ROOT/fast-client.js"
          node --check "$ROOT/snapshot-worker.mjs"
          test "$B46_APPROVED_FAST_V1" = 'YES'
          test "$B46_V1_MODE" = 'candidate' -o "$B46_V1_MODE" = 'activate'
          grep -Fq "EXPECTED='828ddb27-bec4-47f8-a41f-fc7469b0152a'" "$ROOT/deploy.mjs"
          grep -Fq "SNAPSHOT_SERVICE='b46-stats-fast-v1-snapshot-20261116'" "$ROOT/deploy.mjs"
          grep -Fq "CANDIDATE_VERIFIED_INACTIVE" "$ROOT/deploy.mjs"
          if grep -Eq 'nomadtips3-engine-343.*versions' "$ROOT/snapshot-worker.mjs"; then
            echo 'ABORT: engine version writes are forbidden'; exit 1
          fi
      - name: Compile CURRENT public native statistics loader after source-guarded V1 patches
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {patchProdStatistics,patchProdChart} from './deploy-assets/ball46-statistics-fast-v1-20261116/prod-lazy-patch.mjs';
          const base='https://www.ball46.com';
          for(const [path,fn,status] of [
            ['/singlepage-workspace-343.js',patchProdStatistics,'PATCHED_FULL_LEDGER_LAZY'],
            ['/longterm-performance-343.js',patchProdChart,'PATCHED_GRAPH_LEDGER_LAZY']
          ]){
            const r=await fetch(base+path,{signal:AbortSignal.timeout(25000)});
            assert.equal(r.status,200,'SOURCE_HTTP_'+path);
            const source=await r.text();
            const modified=fn(source);
            assert.equal(modified.status,status,'LIVE_ANCHOR_DRIFT_'+path);
            new Function(modified.source);
            if(path.includes('singlepage')){
              assert(modified.source.includes('async function pageOnce(params = {}) {'),'CURSOR_RETRY_MISSING');
              assert(modified.source.includes('async function readAllOnce() {'),'REVISION_RETRY_MISSING');
              const i=modified.source.indexOf('function signature(data) {');
              const end=modified.source.indexOf('\nasync function page(params',i);
              assert(i>=0&&end>i,'SIGNATURE_BOUNDARY_MISSING');
              const sig=new Function(modified.source.slice(i,end)+';return signature')();
              const x={ledgerTotal:10,total:8,pending:2,unresolved:0,win:4,loss:3,push:1,halfWin:0,halfLoss:0,
                ledgerUpdatedAt:100,version:'a',settlementRevision:'v1',statisticsLedgerVersion:'v1',byMarket:{ah:5}};
              assert.equal(sig(x),sig({...x,ledgerUpdatedAt:200}),'SYNC_CLOCK_CAUSES_FALSE_REVISION');
              assert.notEqual(sig(x),sig({...x,win:5}),'REAL_SETTLEMENT_CHANGE_UNDETECTED');
            }
            console.log('B46_FAST_V1_LIVE_SOURCE_PATCH='+JSON.stringify({path,status,bytes:modified.source.length,syntax:'PASS'}));
          }
          NODE
      - name: Install isolated headless Chromium for inactive and live QA
        run: |
          npm install --prefix deploy-assets/ball46-statistics-fast-v1-20261116/.runtime --no-audit --no-fund playwright@1.65.1
          deploy-assets/ball46-statistics-fast-v1-20261116/.runtime/node_modules/.bin/playwright install --with-deps chromium
      - name: Immutable current Production baseline to inactive candidate to QA; activate only in activation mode
        run: node deploy-assets/ball46-statistics-fast-v1-20261116/deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-fast-v1-audit-artifacts
          path: deploy-assets/ball46-statistics-fast-v1-20261116/audit/
          if-no-files-found: ignore
          retention-days: 21
