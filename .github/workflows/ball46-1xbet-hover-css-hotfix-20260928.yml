name: ONE SHOT - Ball46 1xBet Hover CSS Hotfix 20260928

on:
  push:
    branches:
      - ops/ball46-1xbet-affiliate-20260928
    paths:
      - '.github/workflows/ball46-1xbet-hover-css-hotfix-20260928.yml'
      - '.github/scripts/ball46_1xbet_hover_css_hotfix_20260928.sh'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply 1xBet odds hover CSS only
        shell: bash
        run: bash .github/scripts/ball46_1xbet_hover_css_hotfix_20260928.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-1xbet-hover-css-${{ github.run_id }}
          path: /tmp/b46-1xbet-hover-css/verify
          if-no-files-found: ignore
          retention-days: 30
