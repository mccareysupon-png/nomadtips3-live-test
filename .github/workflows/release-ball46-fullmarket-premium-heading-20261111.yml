name: Release BALL46 Premium Full Market Heading 20261111\non:\n  push:\n    branches: [release/ball46-fullmarket-premium-heading-20261111]\n    paths: ['fullmarket-premium-heading-20261111/RELEASE_READY']\npermissions: {contents: read}\nconcurrency:\n  group: ball46-production-deploy\n  cancel-in-progress: false\njobs:\n  release:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 20\n    env:\n      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}\n      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}\n    steps:\n      - uses: actions/checkout@v4\n        with: {ref: release/ball46-fullmarket-premium-heading-20261111}\n      - uses: actions/setup-node@v4\n        with: {node-version: '22'}\n      - name: Deploy guarded premium heading\n        run: node fullmarket-premium-heading-20261111/deploy.mjs\n      - name: Install browser QA\n        run: |\n          npm install --no-save --package-lock=false playwright@1.56.1\n          npx playwright install --with-deps chromium\n      - name: Verify heading typography desktop and mobile\n        run: node fullmarket-premium-heading-20261111/verify.mjs\n