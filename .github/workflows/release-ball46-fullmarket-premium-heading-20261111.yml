name: Release BALL46 Premium Full Market Heading 20261111
on:
  push:
    branches: [release/ball46-fullmarket-premium-heading-20261111]
    paths: ['fullmarket-premium-heading-20261111/RELEASE_READY']
permissions: {contents: read}
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: release/ball46-fullmarket-premium-heading-20261111}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Deploy guarded premium heading
        run: node fullmarket-premium-heading-20261111/deploy.mjs
      - name: Install browser QA
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify heading typography desktop and mobile
        run: node fullmarket-premium-heading-20261111/verify.mjs
