name: Deploy Ball46 Event Flow Signal Entry V2 20261002

on:
  push:
    branches: [work/eventflow-signal-20261002]
    paths: ['.github/workflows/deploy-ball46-eventflow-signal-entry-v2-20261002.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  BALL46_URL: https://ball46.com
  EXPECTED_EXPANDED_SHA256: 2c5302480b7ea4c7f504e0aab1d3b8ed388e0e69204346c98209483f46f9575f

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/eventflow-signal-20261002
          fetch-depth: 1

      - name: Lock production, capture baseline, build patch
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          mkdir -p /tmp/b46/modules /tmp/b46/report /tmp/b46/before /tmp/b46/after
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=5" -H "$AUTH" -o /tmp/b46/deployments-before.json
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/versions?per_page=30" -H "$AUTH" -o /tmp/b46/versions-before.json
          node -e "const fs=require('fs'),j=require('/tmp/b46/deployments-before.json'),d=j.result?.deployments?.[0]||j.result?.[0];if(j.success!==true||!d||d.versions?.length!==1||Number(d.versions[0].percentage)!==100)throw Error('PRODUCTION_NOT_SINGLE_VERSION');fs.writeFileSync('/tmp/b46/rb-version',String(d.versions[0].version_id));fs.writeFileSync('/tmp/b46/report/checkpoint.json',JSON.stringify({deploymentId:d.id,versionId:d.versions[0].version_id,createdOn:d.created_on},null,2));console.log('PRODUCTION_LOCKED',d.versions[0].version_id)"
          node -e "const fs=require('fs'),j=require('/tmp/b46/versions-before.json'),a=Array.isArray(j.result)?j.result:(j.result?.versions||[]);fs.writeFileSync('/tmp/b46/versions-before-ids.json',JSON.stringify(a.map(x=>String(x.id)).filter(Boolean)))"
          nonce="${GITHUB_RUN_ID}-pre-$(date +%s%N)"
          for f in index.html signal.html statistics.html dashboard-v2-stage3.js expanded-match-343.js expanded-match-343.css; do curl -fsSL --retry 4 --retry-all-errors --max-time 30 "$BALL46_URL/$f?$nonce" -o "/tmp/b46/before/$f"; done
          actual=$(sha256sum /tmp/b46/before/expanded-match-343.js | awk '{print $1}')
          [ "$actual" = "$EXPECTED_EXPANDED_SHA256" ] || { echo "EXPANDED_ASSET_CHANGED_ABORT:$actual"; exit 21; }
          grep -Fq '343-expanded-match-v4-stable-lifecycle' /tmp/b46/before/expanded-match-343.js
          ! grep -Fq 'B46_EVENTFLOW_SIGNAL_ENTRY_20261002' /tmp/b46/before/expanded-match-343.js
          grep -Fq 'ball46:signals-snapshot' /tmp/b46/before/dashboard-v2-stage3.js
          curl -fsS "$BALL46_URL/api/engine/health?pre=$nonce" -o /tmp/b46/engine-before.json
          curl -fsS "$BALL46_URL/api/full-market/health?pre=$nonce" -o /tmp/b46/full-before.json
          curl -fsS "$BALL46_URL/api/engine/statistics?pre=$nonce" -o /tmp/b46/stats-before.json
          curl -fsS "$BALL46_URL/api/engine/signals?pre=$nonce" -o /tmp/b46/signals-before.json
          node -e "const fs=require('fs'),e=require('/tmp/b46/engine-before.json'),f=require('/tmp/b46/full-before.json'),s=require('/tmp/b46/stats-before.json'),g=require('/tmp/b46/signals-before.json');if(e.ok!==true||f.ok!==true||s.ok!==true||g.ok!==true)throw Error('PRE_HEALTH_FAILED');fs.writeFileSync('/tmp/b46/report/backend-before.json',JSON.stringify({engine:e.version||null,fullMarket:f.version||null,settlementRevision:s.settlementRevision||null,signalCount:Array.isArray(g.signals)?g.signals.length:0},null,2))"
          node ops/ball46-eventflow/patch-expanded-match-signal-20261002.js /tmp/b46/before/expanded-match-343.js /tmp/b46/expanded-patched.js | tee /tmp/b46/report/patch-result.json
          node --check /tmp/b46/expanded-patched.js
          grep -Fq 'B46_EVENTFLOW_SIGNAL_ENTRY_20261002' /tmp/b46/expanded-patched.js
          grep -Fq 'ball46:signals-snapshot' /tmp/b46/expanded-patched.js
          ! grep -Fq '/api/engine/signals' /tmp/b46/expanded-patched.js
          [ "$(grep -o 'fetch(' /tmp/b46/before/expanded-match-343.js | wc -l)" = "$(grep -o 'fetch(' /tmp/b46/expanded-patched.js | wc -l)" ]

      - name: Clone active Worker and inject only expanded-match route
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          RB=$(cat /tmp/b46/rb-version)
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/workers/$SCRIPT_NAME/versions/$RB?include=modules" -H "$AUTH" -o /tmp/b46/version-before.json
          node <<'NODE'
          const fs=require('fs'),path=require('path'),v=require('/tmp/b46/version-before.json');
          if(v.success!==true)throw Error('VERSION_FETCH_FAILED');const r=v.result;if(!r?.main_module||!Array.isArray(r.modules)||!r.modules.length)throw Error('MODULES_MISSING');
          for(const m of r.modules){const p=path.join('/tmp/b46/modules',m.name);fs.mkdirSync(path.dirname(p),{recursive:true});fs.writeFileSync(p,Buffer.from(m.content_base64,'base64'))}
          const p=path.join('/tmp/b46/modules',r.main_module);let src=fs.readFileSync(p,'utf8');if(src.includes('__B46_EVENTFLOW_SIGNAL_JS_20261002__'))throw Error('ALREADY_PATCHED');
          const fn='async function noStoreUiAsset(request, env) {', pa='  const path = new URL(request.url).pathname;';if(src.split(fn).length-1!==1||src.split(pa).length-1!==1)throw Error('ROUTER_ANCHOR_BAD');
          const asset=fs.readFileSync('/tmp/b46/expanded-patched.js','utf8');src=src.replace(fn,'const __B46_EVENTFLOW_SIGNAL_JS_20261002__='+JSON.stringify(asset)+';\n'+fn);
          src=src.replace(pa,pa+'\n  if (path === "/expanded-match-343.js") {\n    const headers = new Headers({"content-type":"application/javascript; charset=utf-8","cache-control":"no-store, no-cache, must-revalidate, max-age=0","pragma":"no-cache","expires":"0","x-ball46-ui-revision":"eventflow-signal-entry-20261002"});\n    return new Response(__B46_EVENTFLOW_SIGNAL_JS_20261002__, { status: 200, headers });\n  }');
          if((src.match(/__B46_EVENTFLOW_SIGNAL_JS_20261002__/g)||[]).length!==2)throw Error('PATCH_COUNT_BAD');fs.writeFileSync(p,src);fs.writeFileSync('/tmp/b46/main-module',r.main_module);fs.writeFileSync('/tmp/b46/module-meta.json',JSON.stringify(r.modules.map(m=>({name:m.name,content_type:m.content_type}))));
          NODE
          node --check "/tmp/b46/modules/$(cat /tmp/b46/main-module)"

      - name: Upload version, activate 100 percent, verify, auto rollback on failure
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          RB=$(cat /tmp/b46/rb-version)
          rollback(){ echo "ROLLBACK_TO:$RB"; node -e "require('fs').writeFileSync('/tmp/b46/rollback.json',JSON.stringify({strategy:'percentage',versions:[{version_id:process.argv[1],percentage:100}],annotations:{'workers/message':'Automatic rollback Event Flow Signal Entry'}}))" "$RB"; curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?force=true" -H "$AUTH" -H 'content-type: application/json' --data-binary @/tmp/b46/rollback.json -o /tmp/b46/rollback-response.json || true; }
          trap 'rollback' ERR
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/b46/recheck.json
          CURRENT=$(node -e "const j=require('/tmp/b46/recheck.json'),d=j.result?.deployments?.[0]||j.result?.[0];if(!d||d.versions?.length!==1)process.exit(2);process.stdout.write(String(d.versions[0].version_id))")
          [ "$CURRENT" = "$RB" ] || { echo "CONCURRENT_CHANGE:$RB->$CURRENT"; exit 22; }
          node -e "const fs=require('fs');fs.writeFileSync('/tmp/b46/meta.json',JSON.stringify({main_module:fs.readFileSync('/tmp/b46/main-module','utf8').trim()}))"
          mapfile -t A < <(node -e "const a=require('/tmp/b46/module-meta.json');for(const m of a)console.log('-F\\n'+m.name+'=@/tmp/b46/modules/'+m.name+';type='+m.content_type)")
          CURL_ARGS=(); i=0; while [ $i -lt ${#A[@]} ]; do CURL_ARGS+=("${A[$i]}" "${A[$((i+1))]}"); i=$((i+2)); done
          curl -fsS -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/content" -H "$AUTH" -F 'metadata=</tmp/b46/meta.json;type=application/json' "${CURL_ARGS[@]}" -o /tmp/b46/content-update.json
          node -e "const j=require('/tmp/b46/content-update.json');if(j.success!==true)throw Error('CONTENT_UPDATE_FAILED:'+JSON.stringify(j.errors||[]));console.log('CONTENT_UPLOAD_OK')"
          NEW=''
          for n in $(seq 1 15); do
            curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/versions?per_page=30" -H "$AUTH" -o /tmp/b46/versions-after.json
            NEW=$(node -e "const fs=require('fs'),old=new Set(require('/tmp/b46/versions-before-ids.json')),j=require('/tmp/b46/versions-after.json'),a=Array.isArray(j.result)?j.result:(j.result?.versions||[]),f=a.filter(x=>x?.id&&!old.has(String(x.id))).sort((x,y)=>String(y?.metadata?.created_on||'').localeCompare(String(x?.metadata?.created_on||'')));if(f[0])process.stdout.write(String(f[0].id))")
            [ -n "$NEW" ] && break; sleep 1
          done
          [ -n "$NEW" ] || { echo NEW_VERSION_NOT_FOUND; false; }
          echo "$NEW" | tee /tmp/b46/report/new-version-id.txt
          node -e "require('fs').writeFileSync('/tmp/b46/deploy.json',JSON.stringify({strategy:'percentage',versions:[{version_id:process.argv[1],percentage:100}],annotations:{'workers/message':'Ball46 Event Flow Signal Entry 20261002'}}))" "$NEW"
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments" -H "$AUTH" -H 'content-type: application/json' --data-binary @/tmp/b46/deploy.json -o /tmp/b46/deploy-response.json
          node -e "const j=require('/tmp/b46/deploy-response.json');if(j.success!==true)throw Error('DEPLOY_FAILED:'+JSON.stringify(j.errors||[]));console.log('DEPLOYED',j.result?.id||'')"
          ok=0
          for n in $(seq 1 30); do
            nonce="${GITHUB_RUN_ID}-$n-$(date +%s%N)"; code=$(curl -sSL --max-time 25 -D /tmp/b46/live.headers -o /tmp/b46/live.js -w '%{http_code}' "$BALL46_URL/expanded-match-343.js?$nonce" || true)
            if [ "$code" = 200 ] && grep -Fq 'B46_EVENTFLOW_SIGNAL_ENTRY_20261002' /tmp/b46/live.js && grep -Fiq 'x-ball46-ui-revision: eventflow-signal-entry-20261002' /tmp/b46/live.headers; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo MARKER_NOT_LIVE; false; }
          node --check /tmp/b46/live.js
          grep -Fq 'ball46:signals-snapshot' /tmp/b46/live.js
          ! grep -Fq '/api/engine/signals' /tmp/b46/live.js
          nonce="${GITHUB_RUN_ID}-scope-$(date +%s%N)"
          for f in index.html signal.html statistics.html dashboard-v2-stage3.js expanded-match-343.css; do curl -fsSL "$BALL46_URL/$f?$nonce" -o "/tmp/b46/after/$f"; [ "$(sha256sum /tmp/b46/before/$f|awk '{print $1}')" = "$(sha256sum /tmp/b46/after/$f|awk '{print $1}')" ] || { echo "UNEXPECTED_SCOPE_CHANGE:$f"; false; }; done
          curl -fsS "$BALL46_URL/api/engine/health?post=$nonce" -o /tmp/b46/engine-after.json
          curl -fsS "$BALL46_URL/api/full-market/health?post=$nonce" -o /tmp/b46/full-after.json
          curl -fsS "$BALL46_URL/api/engine/statistics?post=$nonce" -o /tmp/b46/stats-after.json
          curl -fsS "$BALL46_URL/api/engine/signals?post=$nonce" -o /tmp/b46/signals-after.json
          node -e "const fs=require('fs'),b=require('/tmp/b46/report/backend-before.json'),e=require('/tmp/b46/engine-after.json'),f=require('/tmp/b46/full-after.json'),s=require('/tmp/b46/stats-after.json'),g=require('/tmp/b46/signals-after.json');if(e.ok!==true||f.ok!==true||s.ok!==true||g.ok!==true)throw Error('POST_HEALTH_FAILED');if(String(e.version||'')!==String(b.engine||'')||String(f.version||'')!==String(b.fullMarket||'')||String(s.settlementRevision||'')!==String(b.settlementRevision||''))throw Error('BACKEND_IDENTITY_CHANGED');fs.writeFileSync('/tmp/b46/report/verification.json',JSON.stringify({ok:true,engine:e.version,fullMarket:f.version,settlementRevision:s.settlementRevision,signalCount:Array.isArray(g.signals)?g.signals.length:0,marker:'B46_EVENTFLOW_SIGNAL_ENTRY_20261002'},null,2))"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/b46/final.json
          node -e "const fs=require('fs'),j=require('/tmp/b46/final.json'),d=j.result?.deployments?.[0]||j.result?.[0],wanted=fs.readFileSync('/tmp/b46/report/new-version-id.txt','utf8').trim();if(!d||d.versions?.length!==1||String(d.versions[0].version_id)!==wanted)throw Error('FINAL_VERSION_NOT_ACTIVE');fs.writeFileSync('/tmp/b46/report/deployment-after.json',JSON.stringify({deploymentId:d.id,versionId:d.versions[0].version_id,createdOn:d.created_on},null,2));console.log('EVENTFLOW_SIGNAL_ENTRY_PRODUCTION_PASS',wanted)"
          trap - ERR

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-eventflow-signal-entry-v2-${{ github.run_id }}
          path: /tmp/b46/report
          if-no-files-found: warn
          retention-days: 14
