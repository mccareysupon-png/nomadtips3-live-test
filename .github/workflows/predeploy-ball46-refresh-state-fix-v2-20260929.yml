name: PREDEPLOY Ball46 Refresh State Fix V2 20260929
on:
  push:
    branches: [work/ball46-refresh-state-fix-20260929]
    paths: ['.github/workflows/predeploy-ball46-refresh-state-fix-v2-20260929.yml']
permissions:
  contents: read
  actions: read
env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  DIRECT: https://ball46-production.mccarey-supon.workers.dev
  EXPECT_VERSION: d54d0bae-0bd7-4a36-beed-052aa69a3a5e
  EXPECT_RUNTIME_SHA: 0c2cd4b167f23e581acd69946a4b56740832d5c0f9388d6aa007c25d9ff31980
jobs:
  predeploy-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ball46-scorebar-divider-predeploy-36554072800
          path: /tmp/b46snapshot
          github-token: ${{ github.token }}
          run-id: 36554072800
          repository: mccareysupon-png/nomadtips3-live-test
      - name: Re-lock current Production and mirror exact 83 assets
        shell: bash
        run: |
          set -euo pipefail
          R=/tmp/b46fix2; rm -rf "$R"; mkdir -p "$R/base" "$R/candidate" "$R/live" "$R/runtime" "$R/verify"
          SRC=$(find /tmp/b46snapshot -type d -name candidate | while read -r d; do [ "$(find "$d" -type f | wc -l | tr -d ' ')" = 83 ] && [ -s "$d/index.html" ] && echo "$d"; done | head -1)
          test -n "$SRC"; cp -a "$SRC/." "$R/base/"; [ "$(find "$R/base" -type f | wc -l | tr -d ' ')" = 83 ]
          AUTH="Authorization: Bearer $API_TOKEN"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=5" -H "$AUTH" -o "$R/verify/deployments.json"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/workers/$SCRIPT_NAME/versions/$EXPECT_VERSION?include=modules" -H "$AUTH" -o "$R/verify/version.json"
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const R='/tmp/b46fix2';
          const d=JSON.parse(fs.readFileSync(R+'/verify/deployments.json')),x=d.result?.deployments?.[0],vs=x?.versions||[];
          if(d.success!==true||vs.length!==1||Number(vs[0].percentage)!==100)throw Error('MIXED_PRODUCTION');
          if(vs[0].version_id!==process.env.EXPECT_VERSION)throw Error('PRODUCTION_MOVED:'+vs[0].version_id);
          const v=JSON.parse(fs.readFileSync(R+'/verify/version.json')).result,m=(v.modules||[]).find(z=>z.name===v.main_module&&z.content_base64);if(!m)throw Error('MAIN_MISSING');
          const b=Buffer.from(m.content_base64,'base64'),sha=crypto.createHash('sha256').update(b).digest('hex');if(sha!==process.env.EXPECT_RUNTIME_SHA)throw Error('RUNTIME_MOVED:'+sha);if(!b.toString().includes('__B46_FOOTER_LEGAL_20260929__'))throw Error('FOOTER_MISSING');
          const got=(v.bindings||[]).map(z=>[z.name,z.type,z.service||null,z.environment||null]).sort(),want=[['ASSETS','assets',null,null],['ENGINE','service','nomadtips3-engine-343','production'],['FULL_MARKET','service','nomadtips3-full-market-343-ball46','production'],['HUB','service','nomadtips3-5usd-hub-343','production']].sort();if(JSON.stringify(got)!==JSON.stringify(want))throw Error('BINDINGS_MOVED');
          fs.writeFileSync(R+'/runtime/index.js',b);console.log('V2_LOCK_PASS',JSON.stringify({version:vs[0].version_id,sha,created:x.created_on}));
          NODE
          find "$R/base" -type f -printf '%P\n' | LC_ALL=C sort > "$R/verify/paths.txt"; [ "$(wc -l < "$R/verify/paths.txt" | tr -d ' ')" = 83 ]
          nonce="${GITHUB_RUN_ID}-$(date +%s%N)"
          while IFS= read -r rel; do mkdir -p "$R/live/$(dirname "$rel")"; code=$(curl -sS -L --retry 4 --retry-all-errors --max-time 30 -H 'Cache-Control: no-cache' -o "$R/live/$rel" -w '%{http_code}' "$DIRECT/$rel?v2=$nonce-$RANDOM")||true; [ "$code" = 200 ]||{ echo FETCH_FAIL:$rel:$code;exit 1;}; done < "$R/verify/paths.txt"
          node - <<'NODE'
          const fs=require('fs');const R='/tmp/b46fix2',rt=fs.readFileSync(R+'/runtime/index.js','utf8'),m=rt.match(/const __B46_FOOTER_HTML__=(.*?);\nconst __B46_FOOTER_CSS__/s);if(!m)throw Error('FOOTER_CONST');const footer=JSON.parse(m[1]),link='<link rel="stylesheet" href="/ball46-footer.css?v=20260929">',hs=new Set(['index.html','signal.html','statistics.html']);const ps=fs.readFileSync(R+'/verify/paths.txt','utf8').trim().split('\n'),bad=[];for(const p of ps){let a=fs.readFileSync(R+'/base/'+p),b=fs.readFileSync(R+'/live/'+p);if(hs.has(p))b=Buffer.from(b.toString().replace(link,'').replace(footer,''));if(!a.equals(b))bad.push(p)}console.log('V2_RACE_MISMATCH',bad);if(bad.length)throw Error('ASSETS_MOVED:'+bad.join(','));console.log('V2_RACE_83_PASS');
          NODE
      - name: Build exact two-asset patch
        shell: bash
        run: |
          set -euo pipefail
          R=/tmp/b46fix2; cp -a "$R/base/." "$R/candidate/"
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib
          R=Path('/tmp/b46fix2'); C=R/'candidate'; B=R/'base'
          p=C/'index.html';s=p.read_text();anchor='<section class="workspace-stage">';assert s.count(anchor)==1,s.count(anchor);assert 'data-workspace-scorebar-slot' not in s
          s=s.replace(anchor,anchor+'<section class="workspace-scorebar-slot" data-workspace-scorebar-slot></section>',1)
          pat=r'workspace-route-guard-343\.js(?:\?[^"\']*)?';hits=re.findall(pat,s);assert len(hits)==1,hits;s=re.sub(pat,'workspace-route-guard-343.js?v=343-refresh-state-20260929a',s,count=1);p.write_text(s)
          p=C/'workspace-route-guard-343.js';g=p.read_text();assert 'BALL46_REFRESH_ROUTE_GUARD_20260929' not in g
          marker='function cleanLiveRoute(){';assert g.count(marker)==1,g.count(marker)
          helper="/* BALL46_REFRESH_ROUTE_GUARD_20260929 */\nfunction hasExplicitNonLiveRoute(){const v=new URLSearchParams(location.search).get('view');return v==='statistics'||v==='signal'}\n"
          g=g.replace(marker,helper+marker,1)
          g,n=re.subn(r"if\s*\(\s*navType\(\)\s*===\s*'reload'\s*&&\s*last\s*===\s*'live'\s*\)\s*cleanLiveRoute\(\)\s*;","if(navType()==='reload'&&last==='live'&&!hasExplicitNonLiveRoute())cleanLiveRoute();",g,count=1);assert n==1,n
          g,n=re.subn(r"if\s*\(\s*view\s*===\s*'live'\s*\)\s*cleanLiveRoute\(\)\s*;","if(view==='live'&&!hasExplicitNonLiveRoute())cleanLiveRoute();",g,count=1);assert n==1,n
          p.write_text(g)
          def h(x):return hashlib.sha256(x.read_bytes()).hexdigest()
          changed=[str(x.relative_to(B)) for x in sorted(B.rglob('*')) if x.is_file() and h(x)!=h(C/x.relative_to(B))];extra=[str(x.relative_to(C)) for x in C.rglob('*') if x.is_file() and not (B/x.relative_to(C)).exists()]
          print('V2_CHANGED_ASSETS',changed,'EXTRA',extra);assert changed==['index.html','workspace-route-guard-343.js'] and not extra
          (R/'verify/changed-assets.txt').write_text('\n'.join(changed)+'\n')
          PY
          node --check "$R/candidate/workspace-route-guard-343.js"
      - name: Test candidate in Chrome with delayed Production APIs
        shell: bash
        run: |
          set -euo pipefail
          R=/tmp/b46fix2
          cat > "$R/server.js" <<'NODE'
          const http=require('http'),fs=require('fs'),path=require('path'),base='/tmp/b46fix2/candidate';const ct={'.html':'text/html; charset=utf-8','.js':'application/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.svg':'image/svg+xml','.png':'image/png','.json':'application/json'};http.createServer(async(q,s)=>{try{let u=new URL(q.url,'http://127.0.0.1');if(u.pathname.startsWith('/api/')){await new Promise(r=>setTimeout(r,700));let x=await fetch('https://ball46.com'+u.pathname+u.search,{headers:{'cache-control':'no-cache'}});s.writeHead(x.status,{'content-type':x.headers.get('content-type')||'application/json','cache-control':'no-store'});s.end(Buffer.from(await x.arrayBuffer()));return}let rel=decodeURIComponent(u.pathname.slice(1))||'index.html',f=path.join(base,rel);if(!f.startsWith(base)||!fs.existsSync(f)){s.writeHead(404);s.end();return}s.writeHead(200,{'content-type':ct[path.extname(f)]||'application/octet-stream','cache-control':'no-store'});s.end(fs.readFileSync(f))}catch(e){s.writeHead(500);s.end(String(e.stack||e))}}).listen(8765,'127.0.0.1');
          NODE
          node "$R/server.js" >"$R/verify/server.log" 2>&1 & SPID=$!; trap 'kill $SPID 2>/dev/null||true' EXIT
          for i in $(seq 1 40);do curl -fsS http://127.0.0.1:8765/index.html >/dev/null&&break;sleep .1;done
          chrome=$(command -v google-chrome||command -v chromium||command -v chromium-browser);test -n "$chrome"
          "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --remote-debugging-port=9555 --user-data-dir="$R/chrome" 'http://127.0.0.1:8765/index.html?view=statistics' >"$R/verify/chrome.log" 2>&1 & CPID=$!; trap 'kill $CPID $SPID 2>/dev/null||true' EXIT
          for i in $(seq 1 80);do curl -fsS http://127.0.0.1:9555/json >"$R/pages.json" 2>/dev/null&&break;sleep .1;done;test -s "$R/pages.json"
          cat > "$R/check.js" <<'NODE'
          const fs=require('fs'),pages=JSON.parse(fs.readFileSync('/tmp/b46fix2/pages.json')),pg=pages.find(x=>x.type==='page');if(!pg)throw Error('NO_PAGE');const ws=new WebSocket(pg.webSocketDebuggerUrl);let id=0,M=new Map();ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.id&&M.has(m.id)){let z=M.get(m.id);M.delete(m.id);m.error?z.j(Error(JSON.stringify(m.error))):z.r(m.result)}};const call=(method,params={})=>new Promise((r,j)=>{let n=++id;M.set(n,{r,j});ws.send(JSON.stringify({id:n,method,params}))}),sl=m=>new Promise(r=>setTimeout(r,m));async function ev(x){let z=await call('Runtime.evaluate',{expression:x,returnByValue:true,awaitPromise:true});if(z.exceptionDetails)throw Error(JSON.stringify(z.exceptionDetails));return z.result.value}async function wait(x,t=30000){let s=Date.now();while(Date.now()-s<t){try{if(await ev(x))return}catch{}await sl(100)}throw Error('WAIT:'+x)}const A=(x,m)=>{if(!x)throw Error(m)};(async()=>{await new Promise((r,j)=>{ws.onopen=r;ws.onerror=j});await call('Runtime.enable');await call('Page.enable');await wait(`document.readyState==='complete'||document.readyState==='interactive'`);let first=await ev(`(()=>{let s=document.querySelector('[data-workspace-scorebar-slot]');return{slots:document.querySelectorAll('[data-workspace-scorebar-slot]').length,h:s?.getBoundingClientRect().height||0,url:location.href}})()`);A(first.slots===1&&first.h>0,'STATIC_SHELL_FAIL:'+JSON.stringify(first));await wait(`document.body.dataset.workspaceView==='statistics'`);await sl(1300);let before=await ev(`(()=>({url:location.href,view:document.body.dataset.workspaceView,total:document.querySelector('[data-stat-market="all"]')?.classList.contains('active'),slots:document.querySelectorAll('[data-workspace-scorebar-slot]').length,h:document.querySelector('[data-workspace-scorebar-slot]')?.getBoundingClientRect().height||0}))()`);A(before.view==='statistics'&&before.total&&new URL(before.url).searchParams.get('view')==='statistics','TOTAL_BEFORE_BAD:'+JSON.stringify(before));await call('Page.reload',{ignoreCache:true});await wait(`document.readyState==='complete'||document.readyState==='interactive'`);let early=await ev(`(()=>({slots:document.querySelectorAll('[data-workspace-scorebar-slot]').length,h:document.querySelector('[data-workspace-scorebar-slot]')?.getBoundingClientRect().height||0,url:location.href}))()`);A(early.slots===1&&early.h>0,'RELOAD_SHELL_FAIL:'+JSON.stringify(early));await wait(`document.body.dataset.workspaceView==='statistics'`);await sl(1300);let after=await ev(`(()=>({url:location.href,view:document.body.dataset.workspaceView,total:document.querySelector('[data-stat-market="all"]')?.classList.contains('active'),slots:document.querySelectorAll('[data-workspace-scorebar-slot]').length,h:document.querySelector('[data-workspace-scorebar-slot]')?.getBoundingClientRect().height||0}))()`);A(after.view==='statistics'&&after.total&&new URL(after.url).searchParams.get('view')==='statistics','TOTAL_REFRESH_BAD:'+JSON.stringify(after));A(after.slots===1&&Math.abs(after.h-before.h)<=1,'SCOREBAR_GEOMETRY_BAD:'+JSON.stringify({before,after}));await ev(`location.href='/index.html?view=statistics&market=ah';true`);await wait(`document.body.dataset.workspaceView==='statistics'`);await sl(400);await call('Page.reload',{ignoreCache:true});await wait(`document.body.dataset.workspaceView==='statistics'`);let ah=await ev(`(()=>({url:location.href,a:document.querySelector('[data-stat-market="ah"]')?.classList.contains('active')}))()`);A(new URL(ah.url).searchParams.get('market')==='ah'&&ah.a,'AH_REFRESH_BAD:'+JSON.stringify(ah));await ev(`location.href='/index.html?view=signal';true`);await wait(`document.body.dataset.workspaceView==='signal'`);await call('Page.reload',{ignoreCache:true});await wait(`document.body.dataset.workspaceView==='signal'`);let sig=await ev(`(()=>({url:location.href,v:document.body.dataset.workspaceView}))()`);A(new URL(sig.url).searchParams.get('view')==='signal','SIGNAL_REFRESH_BAD:'+JSON.stringify(sig));console.log('V2_BROWSER_PASS',JSON.stringify({first,before,early,after,ah,sig}));ws.close();process.exit(0)})().catch(e=>{console.error('V2_BROWSER_FAIL',e);try{ws.close()}catch{}process.exit(1)});
          NODE
          node "$R/check.js"
          kill $CPID $SPID 2>/dev/null||true;trap - EXIT
      - name: Dry-run exact current runtime with 83-asset candidate
        shell: bash
        run: |
          set -euo pipefail
          R=/tmp/b46fix2
          cat > "$R/runtime/wrangler.jsonc" <<EOF
          {"name":"ball46-production","main":"./index.js","compatibility_date":"2026-09-09","no_bundle":true,"services":[{"binding":"ENGINE","service":"nomadtips3-engine-343","environment":"production"},{"binding":"FULL_MARKET","service":"nomadtips3-full-market-343-ball46","environment":"production"},{"binding":"HUB","service":"nomadtips3-5usd-hub-343","environment":"production"}],"assets":{"directory":"$R/candidate","binding":"ASSETS","html_handling":"none","not_found_handling":"none","run_worker_first":true},"triggers":{"crons":["* * * * *"]}}
          EOF
          cd "$R/runtime";npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc 2>&1|tee "$R/verify/dry.log";grep -Fq 'Read 83 files from the assets directory' "$R/verify/dry.log";! grep -Fq 'Attaching additional modules:' "$R/verify/dry.log";echo V2_PREDEPLOY_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: ball46-refresh-state-fix-v2-${{ github.run_id }}
          path: /tmp/b46fix2
          retention-days: 30
