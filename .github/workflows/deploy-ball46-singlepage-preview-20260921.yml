name: Deploy Ball46 Single Page Workspace Preview 20260921

on:
  push:
    branches: [work/ball46-singlepage-workspace-20260921]
    paths:
      - 'nomad-live-343/index.html'
      - 'nomad-live-343/singlepage-workspace-343.css'
      - 'nomad-live-343/singlepage-workspace-343.js'
      - 'nomad-live-343/signal-next.js'
      - 'nomad-live-343/dashboard-v2-stage3.js'
      - '.github/workflows/deploy-ball46-singlepage-preview-20260921.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PREVIEW_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev
  BASELINE_SHA: 179eeec2d4aefb12592b036688ab42386bcfb609

jobs:
  deploy-singlepage-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard engine and odds scope
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            workers/nomadtips3-343-preview/src/index.js \
            nomad-live-343/dashboard-v2-tune.js \
            nomad-live-343/bulk-odds-compat-343.js \
            nomad-live-343/full-market-bookmaker-343.js \
            nomad-live-343/live-summary-full-odds-343.js; do
            git diff --quiet "$BASELINE_SHA"..HEAD -- "$p" || { echo "FORBIDDEN CORE CHANGE: $p"; exit 1; }
          done
          grep -Fq '"name": "nomadtips3-343-ultra-preview"' workers/nomadtips3-343-preview/wrangler.jsonc
          echo 'PASS: Engine, Hub, bookmaker and odds runtime are unchanged.'

      - name: Verify dashboard change is signal bridge only
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASELINE_SHA:nomad-live-343/dashboard-v2-stage3.js" > /tmp/dash-base.js
          cp nomad-live-343/dashboard-v2-stage3.js /tmp/dash-current.js
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/dash-current.js').read_text()
          s=s.replace('\nlet signalRows=[];','',1)
          s=s.replace("signalMap=next;signalRows=rows;signalMirror=j?.mirror&&typeof j.mirror==='object'?j.mirror:{};window.dispatchEvent(new CustomEvent('ball46:signals-snapshot',{detail:{signals:signalRows.slice(),mirror:signalMirror}}))", "signalMap=next;signalMirror=j?.mirror&&typeof j.mirror==='object'?j.mirror:{}",1)
          s=s.replace(",getSignals:()=>signalRows.slice(),getSignalMirror:()=>signalMirror",'',1)
          Path('/tmp/dash-sanitized.js').write_text(s)
          PY
          cmp -s /tmp/dash-base.js /tmp/dash-sanitized.js || { echo 'FORBIDDEN DASHBOARD CHANGE OUTSIDE SIGNAL BRIDGE'; diff -u /tmp/dash-base.js /tmp/dash-sanitized.js | head -120; exit 1; }
          grep -Fq "ball46:signals-snapshot" nomad-live-343/dashboard-v2-stage3.js
          grep -Fq "getSignals:()=>signalRows.slice()" nomad-live-343/dashboard-v2-stage3.js

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate sidebar-only single-page workspace
        shell: bash
        run: |
          set -euo pipefail
          node --check nomad-live-343/dashboard-v2-stage3.js
          node --check nomad-live-343/singlepage-workspace-343.js
          node --check nomad-live-343/signal-next.js
          grep -Fq 'data-workspace-panel="live"' nomad-live-343/index.html
          grep -Fq 'data-workspace-panel="signal"' nomad-live-343/index.html
          grep -Fq 'data-workspace-panel="statistics"' nomad-live-343/index.html
          grep -Fq 'PERFORMANCE TREND' nomad-live-343/index.html
          grep -Fq 'workspace-brand-card' nomad-live-343/index.html
          grep -Fq 'data-theme-toggle' nomad-live-343/index.html
          ! grep -Fq 'href="signal.html"' nomad-live-343/index.html
          ! grep -Fq 'href="statistics.html"' nomad-live-343/index.html
          ! grep -Fq '<header class="v2-topbar"' nomad-live-343/index.html
          ! grep -Fq '<nav class="mobile-nav"' nomad-live-343/index.html
          ! grep -Fq 'v2-header.css' nomad-live-343/index.html
          ! grep -Fq 'v2-shared.js' nomad-live-343/index.html
          grep -Fq 'ball46:workspace-view' nomad-live-343/singlepage-workspace-343.js
          grep -Fq 'ball46:workspace-view' nomad-live-343/signal-next.js
          grep -Fq 'ball46:signals-snapshot' nomad-live-343/signal-next.js
          ! grep -Fq '/api/engine/signals' nomad-live-343/signal-next.js
          ! grep -Fq 'setInterval' nomad-live-343/signal-next.js
          grep -Fq 'STAT_CACHE_MS=300000' nomad-live-343/singlepage-workspace-343.js
          ! grep -Fq 'statsTimer' nomad-live-343/singlepage-workspace-343.js
          grep -Fq 'LEFT RAIL GEOMETRY LOCK V3' nomad-live-343/singlepage-workspace-343.css
          git diff --check

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Dry-run isolated preview worker
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc

      - name: Deploy isolated preview worker
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Smoke single-page workspace and feeds
        shell: bash
        run: |
          set -euo pipefail
          sleep 4
          curl -fsS --max-time 30 "$PREVIEW_URL/?verify=$GITHUB_RUN_ID" -o /tmp/home.html
          grep -Fq 'data-workspace-panel="live"' /tmp/home.html
          grep -Fq 'data-workspace-panel="signal"' /tmp/home.html
          grep -Fq 'data-workspace-panel="statistics"' /tmp/home.html
          grep -Fq 'singlepage-workspace-343.js?v=343-singlepage-20260921-3' /tmp/home.html
          grep -Fq 'signal-next.js?v=343-singlepage-signal-3' /tmp/home.html
          grep -Fq 'workspace-brand-card' /tmp/home.html
          ! grep -Fq '<header class="v2-topbar"' /tmp/home.html
          ! grep -Fq '<nav class="mobile-nav"' /tmp/home.html
          curl -fsS --max-time 30 "$PREVIEW_URL/dashboard-v2-stage3.js?verify=$GITHUB_RUN_ID" -o /tmp/dashboard.js
          curl -fsS --max-time 30 "$PREVIEW_URL/singlepage-workspace-343.js?verify=$GITHUB_RUN_ID" -o /tmp/sp.js
          curl -fsS --max-time 30 "$PREVIEW_URL/signal-next.js?verify=$GITHUB_RUN_ID" -o /tmp/signal-next.js
          node --check /tmp/dashboard.js
          node --check /tmp/sp.js
          node --check /tmp/signal-next.js
          grep -Fq 'ball46:signals-snapshot' /tmp/dashboard.js
          ! grep -Fq '/api/engine/signals' /tmp/signal-next.js
          curl -fsS --max-time 30 "$PREVIEW_URL/api/engine/board?verify=$GITHUB_RUN_ID" -o /tmp/board.json
          curl -fsS --max-time 30 "$PREVIEW_URL/api/engine/signals?verify=$GITHUB_RUN_ID" -o /tmp/signals.json
          curl -fsS --max-time 30 "$PREVIEW_URL/api/engine/statistics?verify=$GITHUB_RUN_ID" -o /tmp/stats.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/board.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals.json','utf8'));
          const t=JSON.parse(fs.readFileSync('/tmp/stats.json','utf8'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures))throw Error('board unhealthy');
          if(!Array.isArray(s?.signals))throw Error('signals unhealthy');
          if(t?.ok!==true||!Array.isArray(t?.rows))throw Error('statistics unhealthy');
          console.log('SINGLEPAGE V3 PREVIEW PASS',{fixtures:b.fixtures.length,signals:s.signals.length,statistics:t.rows.length});
          NODE
