name: Ball46 Event Flow Expanded Current Scout 20261004

on:
  push:
    branches: [work/eventflow-expanded-mode-20261004]
    paths:
      - '.github/workflows/ball46-eventflow-expanded-current-scout-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Capture current Production Event Flow read only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/eventflow-current
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/ball46-production/deployments?per_page=3" -H "$AUTH" -o /tmp/eventflow-current/deployments.json
          node -e "const j=require('/tmp/eventflow-current/deployments.json'),d=j.result.deployments[0]; console.log('ACTIVE='+d.versions[0].version_id); require('fs').writeFileSync('/tmp/eventflow-current/active.txt',d.versions[0].version_id)"
          curl -fsSL -H 'Cache-Control: no-cache' "https://ball46.com/expanded-match-343.js?scout=${GITHUB_RUN_ID}-$(date +%s%N)" -o /tmp/eventflow-current/expanded-match-343.js
          sha256sum /tmp/eventflow-current/expanded-match-343.js
          grep -o 'B46_EVENTFLOW_[A-Z0-9_]*' /tmp/eventflow-current/expanded-match-343.js | sort -u || true
          grep -o 'eventflow-[a-z0-9-]*202610[0-9]*' /tmp/eventflow-current/expanded-match-343.js | sort -u || true
      - uses: actions/upload-artifact@v4
        with:
          name: ball46-eventflow-current-${{ github.run_id }}
          path: /tmp/eventflow-current/
          if-no-files-found: error
          retention-days: 7
