name: BALL46 approved frontend speed narrow release
on:
  push:
    branches: [codex/ball46-frontend-speed-cache-proof-20261101]
    paths: ['work/ball46-frontend-speed-v1-20261101/request.json']
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: work/ball46-frontend-speed-v1-20261101
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fresh read-only Production identity, assets, config and health gates
        run: |
          node fresh-production.mjs
          node final-check.mjs
      - name: Rebuild exact tested frontend candidate and source proofs
        run: |
          node patch.mjs --build
          node source-test.mjs
          node prepare-runtime.mjs
          node --check candidate/worker-runtime.mjs
          node runtime-test.mjs
      - name: Install browser verification
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Stage non-traffic candidate preserving all current modules and assets
        run: node release.mjs
      - name: Verify candidate desktop, mobile, current monitor and Event Flow
        run: node release-browser.mjs
      - name: Activate owner-approved patch only after all gates pass
        run: |
          cp browser-proof.json release-audit/candidate-browser-proof.json
          node -e "const fs=require('fs'),c=JSON.parse(fs.readFileSync('release-audit/candidate.json'));fs.writeFileSync('request.json',JSON.stringify({phase:'activate',base:c.base,candidate:c.candidate}))"
          node release.mjs
          node release-browser.mjs https://ball46.com
      - name: Restore immediate baseline if post-activation verification fails
        if: failure()
        run: |
          node -e "const fs=require('fs');if(fs.existsSync('release-audit/result.json')){const r=JSON.parse(fs.readFileSync('release-audit/result.json'));if(r.activated){fs.writeFileSync('request.json',JSON.stringify({phase:'restore',base:r.base,candidate:r.candidate}));fs.writeFileSync('restore-needed','yes')}}"
          if [ -f restore-needed ]; then node release.mjs; fi
      - name: Preserve release and rollback evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-audit/*.json release-audit/*.png
          git restore -- request.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record guarded frontend speed candidate, activation and verification evidence [skip ci]"
          git push origin HEAD:codex/ball46-frontend-speed-cache-proof-20261101
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-speed-release-${{ github.run_id }}
          path: work/ball46-frontend-speed-v1-20261101/release-audit
