name: BALL46 Frontend Speed V1 baseline ONLY
on:
  push:
    branches: [codex/ball46-frontend-speed-v1-20261101]
    paths: ['work/ball46-frontend-speed-v1-20261101/baseline-request.json']
permissions:
  contents: write
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: work/ball46-frontend-speed-v1-20261101
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cloudflare GET-only baseline and exact assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node capture.mjs
      - name: Record live browser timings and frozen request replay data
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node diagnose.mjs
      - name: Commit reviewable baseline (NO DEPLOY)
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit
          git commit -m "Record Frontend Speed live baseline and request waterfall [skip ci]"
          git push origin HEAD:codex/ball46-frontend-speed-v1-20261101
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-speed-baseline-${{ github.run_id }}
          path: work/ball46-frontend-speed-v1-20261101/audit
