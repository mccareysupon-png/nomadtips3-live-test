name: BALL46 odds flash production read-only after-cutover audit
on:
  push:
    branches: [release/ball46-odds-flash-2s-20261121]
    paths:
      - '.github/workflows/ball46-odds-flash-readonly-audit-20261121.yml'
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check active Cloudflare version and actually served BALL46 pages without mutation
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers';
          async function get(path){
            const r=await fetch(root+path,{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(45000)});
            const j=await r.json();if(!r.ok||!j.success)throw Error('READ_ONLY_CF_ERROR:'+r.status+':'+JSON.stringify(j.errors));return j.result;
          }
          const dep=await get('/scripts/ball46-production/deployments?per_page=5');
          const versions=dep.deployments?.[0]?.versions||[];
          console.log('PRODUCTION_ACTIVE_VERSION_READONLY',JSON.stringify({versions,latestDeploymentId:dep.deployments?.[0]?.id,deploymentCount:dep.deployments?.length}));
          if(versions.length===1&&versions[0].version_id){
            const v=await get('/workers/ball46-production/versions/'+versions[0].version_id+'?include=modules');
            const main=v.modules?.find(x=>x.name===v.main_module);
            const src=main?Buffer.from(main.content_base64,'base64').toString('utf8'):'';
            console.log('PRODUCTION_SOURCE_MARKERS_READONLY',JSON.stringify({versionId:versions[0].version_id,hasOddsFlash:src.includes('B46_ODDS_FLASH_2S_20261121'),hasPriorPremium:src.includes('B46_PREMIUM_MATCH_CARDS_20261121'),len:src.length,mainModule:v.main_module}));
          }
          for(const u of ['https://ball46.com/index.html','https://ball46-production.mccarey-supon.workers.dev/index.html']){
            const url=new URL(u);url.searchParams.set('oddsReadOnlyAudit',Date.now()+'');
            const r=await fetch(url,{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(45000)});
            const h=await r.text();
            console.log('PRODUCTION_SERVED_HTML_READONLY',JSON.stringify({origin:url.origin,status:r.status,oddsStyle:h.includes('b46-odds-flash-production'),oddsRuntime:h.includes('b46-odds-flash-runtime-production'),premiumCard:h.includes('b46-premium-match-production'),bytes:h.length}));
          }
          NODE
