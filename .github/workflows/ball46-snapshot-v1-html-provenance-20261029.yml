name: BALL46 Snapshot V1 HTML Provenance GET ONLY
on:
  push:
    branches:
      - work/ball46-performance-snapshot-v1-20261029
    paths:
      - .github/workflows/ball46-snapshot-v1-html-provenance-20261029.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit syntax
        run: node --check isolated-labs/ball46-performance-snapshot-v1/provenance-audit.mjs
      - name: Read current HTML origin and module provenance
        run: node isolated-labs/ball46-performance-snapshot-v1/provenance-audit.mjs
      - name: Upload only sanitized provenance analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-html-provenance-readonly
          path: reports/ball46-performance-html-provenance.json
          retention-days: 7
          if-no-files-found: warn
