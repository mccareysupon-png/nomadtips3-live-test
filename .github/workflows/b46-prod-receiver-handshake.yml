name: B46 approved Receiver generation-validated Pending cache (NO SITE CUTOVER)
on:
  push:
    branches: [chatgpt/ball46-new-ledger-clean-v1]
    paths: ['.github/workflows/b46-prod-receiver-handshake.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b46-prod-receiver-only
  cancel-in-progress: false
jobs:
  receiver:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 49c950e936658a4b27ea29bcab08ed832db97ae4
          persist-credentials: false
      - name: Verify local durable projection and production data parity BEFORE any deployment
        working-directory: chatgpt-statistics-ui
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 49c950e936658a4b27ea29bcab08ed832db97ae4
          test "$(git hash-object shadow-production-receiver.mjs)" = 7bfc2e9bb61f3f73e533e82a05996104d921eb4b
          node --check shadow-production-receiver.mjs
          node --check shadow-receiver-projection-v1.mjs
          node shadow-receiver-projection-install.mjs local
          npx --yes esbuild@0.25.12 shadow-production-receiver.mjs --bundle --format=esm --platform=neutral --target=es2022 --external:cloudflare:workers --outfile="$RUNNER_TEMP/receiver.mjs"
          node --check "$RUNNER_TEMP/receiver.mjs"
      - name: Deploy only Receiver; inherit all bindings and retain existing projection
        working-directory: chatgpt-statistics-ui
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash,createHmac} from 'node:crypto';
          
          const receiver='ball46-shadow-receiver-production',engine='nomadtips3-engine-343',site='ball46-production';
          const old='4af23d2f-8ff8-4ecb-bf5e-691bbfbb5d7d',engineOld='db65134e-a12d-4084-937e-3ce6e986c251',siteOld='f5d9cf21-4b41-46da-bdd8-a841fa733d82';
          const root='https://api.cloudflare.com/client/v4/accounts/62cb0db544160e6591342abd6b4f35cc',headers={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'content-type':'application/json'};
          const key=createHmac('sha256',process.env.CLOUDFLARE_API_TOKEN).update('ball46/receiver/https-audit/v1/20261118').digest('hex');
          console.log('::add-mask::'+key);
          const api=async(p,method='GET',body)=>{
           if(method!=='GET'&&!(method==='POST'&&(p==='/workers/workers/'+receiver+'/versions?deploy=false'||p==='/workers/scripts/'+receiver+'/deployments')))throw Error('WRITE_SCOPE');
           const r=await fetch(root+p,{method,headers,body:body===undefined?undefined:JSON.stringify(body),signal:AbortSignal.timeout(30000)}),j=await r.json();if(!r.ok||!j.success)throw Error('CF_'+method+'_'+r.status+'_'+(j.errors??[]).map(e=>e.code).join('_'));return j.result;
          };
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const active=async n=>(await api('/workers/scripts/'+n+'/deployments?per_page=1')).deployments?.[0]?.versions;
          const equal=(a,id)=>a?.length===1&&a[0].version_id===id&&Number(a[0].percentage)===100;
          const ensure=async(n,id)=>{if(!equal(await active(n),id))throw Error('ACTIVE_VERSION_DRIFT_'+n)};
          const checks=async id=>{await ensure(engine,engineOld);await ensure(site,siteOld);await ensure(receiver,id);const d=await api('/workers/scripts/'+receiver+'/subdomain');if(d.enabled!==true||d.previews_enabled===true)throw Error('RECEIVER_ROUTE_DRIFT')};
          const version=id=>api('/workers/workers/'+receiver+'/versions/'+id+'?include=modules');
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const assign=id=>api('/workers/scripts/'+receiver+'/deployments','POST',{strategy:'percentage',versions:[{version_id:id,percentage:100}],code_update_strategy:{mode:'immediate'},annotations:{'workers/message':'Receiver Pending cache and batch read; no site/engine change'}});
          const waitActive=async id=>{for(let i=0;i<15;i++){if(equal(await active(receiver),id))return;await sleep(2000)}throw Error('ACTIVE_VERSION_NOT_CONFIRMED')};
          const base='https://ball46-shadow-receiver-production.mccarey-supon.workers.dev';
          const get=async (path,token=key)=>{
           try{
            const r=await fetch(base+path,{method:'GET',headers:{accept:'application/json','cache-control':'no-cache','user-agent':'Mozilla/5.0 B46-Projection-QA',...(token?{authorization:'Bearer '+token}:{})},redirect:'manual',signal:AbortSignal.timeout(25000)});
            const body=await r.text(),ct=r.headers.get('content-type')??'';let data=null;try{if(ct.includes('application/json'))data=JSON.parse(body)}catch{}
            if(!data)console.log('PROJECTION_NON_JSON_DIAG='+JSON.stringify({path,http:r.status,contentType:ct,cfMitigated:r.headers.get('cf-mitigated'),location:r.headers.get('location')?new URL(r.headers.get('location'),base).hostname:null,bytes:body.length}));
            return {status:r.status,data,contentType:ct,json:!!data};
           }catch(e){return {status:0,data:null,error:String(e.message).slice(0,100),json:false}}
          };
          await checks(old);
          console.log('DURABLE_CODE_UPDATE_STRATEGY=immediate; existing migration and namespace retained');
          const before=await get('/audit-statistics-summary-v1');
          if(before.status!==200||!before.data?.ok||before.data.total<16074)throw Error('LIVE_BOOK_NOT_READY');
          const v=await version(old),settings=await api('/workers/scripts/'+receiver+'/settings');
          if(v.modules?.length!==1||v.main_module!==v.modules[0].name||hash(Buffer.from(v.modules[0].content_base64,'base64'))!=='29e278ef330ae95a427a4fe353fed9f46be3054b4c612af5fea9c82112c6eb12')throw Error('MODULE_SHAPE_DRIFT');
          const bindings=v.bindings??[];
          for(const type of ['AUDIT_TOKEN','SHADOW_HEALTH_TOKEN','SEED_TOKEN','REPLAY_TOKEN','PROJECTION_SEED_TOKEN'])if(!bindings.some(x=>x.name===type&&x.type==='secret_text'))throw Error('EXISTING_SECRET_BINDING_DRIFT');
          if(!bindings.some(x=>x.name==='SHADOW_STORE'&&x.type==='durable_object_namespace'&&x.class_name==='ShadowProductionStore'))throw Error('NAMESPACE_OR_PROJECTION_BINDING_DRIFT');
          const candidate=readFileSync(process.env.RUNNER_TEMP+'/receiver.mjs');
          const payload={main_module:v.main_module,modules:[{name:v.main_module,content_type:v.modules[0].content_type,content_base64:candidate.toString('base64')}],bindings:bindings.map(b=>({name:b.name,type:'inherit',version_id:old})),compatibility_date:v.compatibility_date,compatibility_flags:settings.compatibility_flags??[],annotations:{'workers/message':'Bounded Pending RAM cache; existing Book and graph retained'}};
          if(v.usage_model)payload.usage_model=v.usage_model;if(v.migration_tag)payload.migration_tag=v.migration_tag;
          const up=await api('/workers/workers/'+receiver+'/versions?deploy=false','POST',payload),id=up.id;if(!id||id===old)throw Error('INVALID_CANDIDATE');
          const next=await version(id);if(next.modules?.length!==1||hash(Buffer.from(next.modules[0].content_base64,'base64'))!==hash(candidate))throw Error('UPLOADED_HASH_DRIFT');
          if((next.bindings??[]).length!==bindings.length||!next.bindings.some(x=>x.name==='PROJECTION_SEED_TOKEN'&&x.type==='secret_text'))throw Error('PROJECTION_BINDING_DRIFT');
          for(const x of bindings){const y=next.bindings.find(z=>z.name===x.name);if(!y||y.type!==x.type)throw Error('BINDING_TYPE_DRIFT');for(const k of ['service','class_name','namespace_id','script_name','environment','text'])if(x.type!=='secret_text'&&x[k]!==undefined&&x[k]!==y[k])throw Error('BINDING_RESOURCE_DRIFT')}
          console.log('PROJECTION_CANDIDATE_VERIFIED='+JSON.stringify({id,rollback:old,source:'49c950e',sha256:hash(candidate),existingBindingsPreserved:true}));
          await checks(old);
          try{
           await assign(id);await waitActive(id);await checks(id);
           let j,a,bad,graph,pending,passed=false;
           for(let i=1;i<=24;i++){
            [j,a,bad,graph,pending]=await Promise.all([get('/audit-projection-status-v1'),get('/audit-statistics-summary-v1'),get('/audit-projection-pending-v1',null),get('/audit-projection-graph-v1'),get('/audit-projection-pending-v1?limit=50')]);
            console.log('PENDING_STATE_ACTIVATION_GATE='+JSON.stringify({attempt:i,status:j.status,summary:a.status,unauth:bad.status,graph:graph.status,pending:pending.status,readMode:pending.data?.readMode??null,coverageVerified:pending.data?.coverageVerified??null,bookTotal:a.data?.total??null,pendingTotal:pending.data?.total??null,bookSequence:j.data?.bookSequence??null,projectionSequence:j.data?.projection?.sequence??null,lastError:j.data?.projection?.lastError??null,cacheHit:pending.data?.cacheHit??null}));
            if(bad.status===200)throw Error('UNEXPECTED_UNAUTHORIZED_READ');
            if(j.json&&a.json&&bad.json&&graph.json&&pending.json&&j.status===200&&j.data.graphReady&&j.data.pendingReadReady&&a.status===200&&a.data.total>=before.data.total&&j.data.bookAggregate?.total===a.data.total&&graph.status===200&&graph.data?.summary?.rows===a.data.total&&bad.status===403&&pending.status===200&&pending.data.readMode==='DURABLE_OBJECT_STATE_ONLY'&&pending.data.source==='RECEIVER_PENDING_STATE'&&typeof pending.data.cacheHit==='boolean'&&Array.isArray(pending.data.rows)){passed=true;break}
            if(i<24)await sleep(4500);
           }
           if(!passed)throw Error('STATE_ONLY_PENDING_ACTIVATION_FAILED');
           console.log('PENDING_STATE_RECEIVER_DEPLOYED='+JSON.stringify({id,rollback:old,engine:engineOld,website:siteOld,bookBefore:before.data.total,bookAfter:a.data.total,sequence:j.data.bookSequence,pending:pending.data.total,allBindingsInherited:true,bookReset:false,reseed:false,websiteSourceChanged:false}));
          }catch(e){if(equal(await active(receiver),id)){await assign(old);await waitActive(old);console.log('PROJECTION_RECEIVER_ROLLBACK='+old)}throw e}
          await checks(id);
          JS
      - name: Independent full-history graph and advanced-filter verification (no production writes)
        working-directory: chatgpt-statistics-ui
        run: node shadow-receiver-projection-install.mjs audit
      - name: Pending cache live acceptance (strict latency and exact source parity)
        working-directory: chatgpt-statistics-ui
        run: node shadow-pending-final-audit.mjs
      - name: Read-only test named Service Binding on existing inactive website candidate
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'JS'
          import {createHmac} from 'node:crypto';
          const token=process.env.CLOUDFLARE_API_TOKEN,key=createHmac('sha256',token).update('ball46/site/binding-preflight/v1/20261118').digest('hex');console.log('::add-mask::'+key);
          const host='https://01f044ab-ball46-production.mccarey-supon.workers.dev',path='/_b46/internal/receiver-preflight-v1';
          for(let i=1;i<=4;i++){
           const r=await fetch(host+path,{headers:{authorization:'Bearer '+key,accept:'application/json','user-agent':'Mozilla/5.0 B46-Preflight'},signal:AbortSignal.timeout(20000)}),body=await r.text();let d;try{d=JSON.parse(body)}catch{}
           console.log('TIE_REPAIR_SITE_PROBE='+JSON.stringify({attempt:i,http:r.status,json:!!d,error:d?.error??null,settled:d?.settled,pending:d?.pending,source:d?.source,publicSourceChanged:d?.publicSourceChanged}));
           if(r.status===200&&d?.ok&&d.source==='B46_MARKET_READER')break;
           if(i<4)await new Promise(r=>setTimeout(r,2000));
          }
          JS
