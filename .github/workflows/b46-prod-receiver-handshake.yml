name: B46 approved historical cutoff and seed (Receiver only)
on:
  push:
    branches: [chatgpt/ball46-new-ledger-clean-v1]
    paths: ['.github/workflows/b46-prod-receiver-handshake.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b46-prod-receiver-only
  cancel-in-progress: false
jobs:
  receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bc5ba2d478cfd2a5e1beffb3a14342d888705b68
          persist-credentials: false
      - name: Validate approved source then upload and activate only Receiver with inherited bindings
        working-directory: chatgpt-statistics-ui
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bc5ba2d478cfd2a5e1beffb3a14342d888705b68
          test "$(git hash-object shadow-production-receiver.mjs)" = 2b5210717f0a27ffed6bf6cd1e826a1a7955d42c
          node --check shadow-production-receiver.mjs
          npx --yes esbuild@0.25.12 shadow-production-receiver.mjs --bundle --format=esm --platform=neutral --target=es2022 --external:cloudflare:workers --outfile="$RUNNER_TEMP/receiver.mjs"
          node --check "$RUNNER_TEMP/receiver.mjs"
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const source=readFileSync(process.env.RUNNER_TEMP+'/receiver.mjs','utf8').replace(/import\s*\{\s*WorkerEntrypoint\s*\}\s*from\s*["']cloudflare:workers["'];?/, 'class WorkerEntrypoint { constructor(ctx,env) {this.env=env;} }');
          if(source.includes('from "cloudflare:workers"')||source.includes("from 'cloudflare:workers'"))throw Error('LOCAL_RUNTIME_STUB_FAILED');
          const {default:worker,AuditReader}=await import('data:text/javascript;base64,'+Buffer.from(source).toString('base64'));
          for(const host of ['shadow.internal','example.com']){
            const r=await worker.fetch(new Request('https://'+host+'/audit-snapshot'),{});
            if(r.status!==403)throw Error('DEFAULT_ENTRYPOINT_MUST_DENY');
          }
          const env={SHADOW_STORE:{idFromName:n=>n,get:n=>({fetch:async(url,init)=>{if(new URL(url).pathname!=='/audit-snapshot'||init.headers['x-audit-object']!==(n==='inbox-v1'?'inbox':'book'))throw Error('UNEXPECTED_STORAGE_CALL');return Response.json(n==='inbox-v1'?{total_received:0,duplicate_count:0,pending_retry_queue:0}:{settled_count:0,recent_5_signals:[],total_pnl:0,win_rate:0})}})}};
          const reader=new AuditReader({},env);
          const r=await reader.fetch(new Request('https://shadow.internal/audit-snapshot'));
          if(r.status!==200||!(await r.json()).readOnly)throw Error('PRIVATE_ENTRYPOINT_TEST_FAILED');
          if((await reader.fetch(new Request('https://shadow.internal/audit-snapshot',{method:'POST'}))).status!==405)throw Error('PRIVATE_POST_MUST_DENY');
          const {ShadowProductionStore}=await import('data:text/javascript;base64,'+Buffer.from(source).toString('base64'));
          const rows=new Map([['composite:receipt:a',{signal_id:'a',settled_at:100,result:'WIN',market_type:'ft_ah',odds:2}],['composite:receipt:z',{signal_id:'z',settled_at:100,result:'HALF_LOSS',market_type:'ft_ah',odds:2}]]);
          const obj=new ShadowProductionStore({storage:{list:async()=>rows,get:async()=>null}},{});
          const detail=await obj.fetch(new Request('https://store.internal/audit-snapshot?from=1&until=1000&detail=1',{headers:{'x-audit-object':'book'}}));
          const d=await detail.json();
          if(detail.status!==200||d.recent_5_signals[0].signal_id!=='z'||d.raw_counts.WIN!==1||d.raw_counts.HALF_LOSS!==1||d.audit_rows.length!==2||d.total_pnl!==0.5)throw Error('LOCAL_DEEP_DIFF_TEST_FAILED');
          const makeStore=()=>{const m=new Map();let alarm=null;const x={get:async k=>structuredClone(m.get(k)),put:async(k,v)=>{m.set(k,structuredClone(v))},delete:async k=>m.delete(k),list:async(o={})=>new Map([...m].filter(([k])=>k.startsWith(o.prefix??'')&&(!o.startAfter||k>o.startAfter)).sort(([a],[b])=>a.localeCompare(b)).slice(0,o.limit??1000).map(([k,v])=>[k,structuredClone(v)])),getAlarm:async()=>alarm,setAlarm:async n=>{alarm=n},transaction:async fn=>fn(x)};return x};
          const bookStore=makeStore(),inboxStore=makeStore();
          const objects={};
          const liveEnv={AUDIT_TOKEN:'a'.repeat(64),REPLAY_TOKEN:'b'.repeat(64),SHADOW_STORE:{idFromName:n=>n,get:n=>({fetch:async(url,init)=>objects[n].fetch(new Request(url,init))})}};
          objects['book-v1']=new ShadowProductionStore({storage:bookStore},liveEnv);
          objects['inbox-v1']=new ShadowProductionStore({storage:inboxStore},liveEnv);
          const book=objects['book-v1'],inbox=objects['inbox-v1'];
          const mk=(id,time,result,odds=2.06)=>({signal_id:id,settled_at:time,result,market_type:'ft_over',odds});
          const post=(obj,path,body)=>obj.fetch(new Request('https://store.internal'+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}));
          const assert=(v,m)=>{if(!v)throw Error(m)};
          const first=mk('a',100,'WIN'),correct=mk('a',200,'HALF_LOSS');
          await bookStore.put('composite:receipt:a',first);
          await bookStore.put('composite:state',{cursor:{signal_id:'a',settled_at:100},WIN:1,LOSS:0,HALF_WIN:0,HALF_LOSS:0,PUSH:0,total:1,winRate:100});
          let r1=await post(book,'/book-post',correct);assert(r1.ok&&(await r1.json()).corrected,'LOCAL_CORRECTION_FAILED');
          let state=await bookStore.get('composite:state');
          assert(state.total===1&&state.WIN===0&&state.HALF_LOSS===1&&state.total_pnl===-0.5&&state.winRate===0&&state.corrections===1,'LOCAL_REVERSAL_FAILED');
          assert((await (await post(book,'/book-post',correct)).json()).duplicate,'LOCAL_RETRY_NOT_IDEMPOTENT');
          assert((await (await post(book,'/book-post',first)).json()).stale,'LOCAL_STALE_ACCEPTED');
          assert((await post(book,'/book-post',mk('a',200,'WIN'))).status===409,'LOCAL_EQUAL_TIME_CONFLICT_NOT_QUARANTINED');
          assert((await bookStore.get('composite:state')).total_pnl===-0.5,'LOCAL_RETRY_CHANGED_PNL');
          assert((await bookStore.get('composite:revision:a:100')).result==='WIN','LOCAL_REVISION_NOT_PRESERVED');
          const events=Array.from({length:9},(_,i)=>({row:mk('q'+i,300+i,'PUSH'),fingerprint:String(i+1).padStart(64,'0')}));
          for(const e of events)await inboxStore.put('inbox:quarantine:'+e.fingerprint,e);
          await inboxStore.put('inbox:state',{received:9,pending:0,duplicates:0,delivered:0,quarantined:9});
          const url='https://ball46-shadow-receiver-production.mccarey-supon.workers.dev/replay-quarantined-v1';
          for(const token of [null,'a'.repeat(64)]){const r=await worker.fetch(new Request(url,{method:'POST',headers:token?{authorization:'Bearer '+token}:{},body:'{}'}),liveEnv);assert(r.status===403,'LOCAL_REPLAY_AUTH_FAILED')}
          let replay=await post(inbox,'/replay-quarantined-v1',{fingerprints:events.map(e=>e.fingerprint)});
          assert(replay.ok&&(await replay.json()).requeued===9,'LOCAL_REPLAY_FAILED');
          replay=await post(inbox,'/replay-quarantined-v1',{fingerprints:events.map(e=>e.fingerprint)});
          assert(replay.ok&&(await replay.json()).already,'LOCAL_REPLAY_NOT_IDEMPOTENT');
          await inbox.alarm();const q=await inboxStore.get('inbox:state');
          assert(q.pending===0&&q.quarantined===0&&q.received===9&&q.delivered===9,'LOCAL_REPLAY_QUEUE_INVARIANT');
          console.log('LOCAL_UPSERT_REVERSAL_STALE_RETRY_QUARANTINE_REPLAY_PASS=true');
          const {createHash}=await import('node:crypto');
          const sha=x=>createHash('sha256').update(JSON.stringify(x)).digest('hex');
          const seedStore=makeStore(),seedBook=new ShadowProductionStore({storage:seedStore},liveEnv);
          const fixture=Array.from({length:1000},(_,i)=>mk('s'+String(i).padStart(4,'0'),1000+i,'PUSH'));
          for(let i=0;i<122;i++){
           const prior=i===0?{...fixture[i],settled_at:999,result:'WIN'}:i===1?{...fixture[i],settled_at:9000,result:'HALF_WIN'}:fixture[i];
           assert((await post(seedBook,'/book-post',prior)).ok,'SEED_LOCAL_BASELINE_FAILED');
          }
          const chunks=Array.from({length:10},(_,i)=>fixture.slice(i*100,(i+1)*100));
          const manifest={hash:sha(fixture),sourceSignature:'a'.repeat(64),sourceRevision:'local-only',cutoff:10000,total:1000,batchSize:100,batchHashes:chunks.map(sha)};
          const seedPost=x=>post(seedBook,'/seed-history-v1',x);
          assert((await seedPost({action:'begin',manifest})).ok,'LOCAL_SEED_BEGIN_FAILED');
          assert((await seedPost({action:'batch',snapshot_hash:manifest.hash,index:0,rows:chunks[1]})).status===409,'LOCAL_WRONG_BATCH_NOT_REJECTED');
          for(let i=0;i<10;i++){
           const payload={action:'batch',snapshot_hash:manifest.hash,index:i,rows:chunks[i]};
           const r=await seedPost(payload);assert(r.ok,'LOCAL_SEED_BATCH_FAILED_'+i);
           if(i===0)assert((await (await seedPost(payload)).json()).already_processed,'LOCAL_SEED_RETRY_FAILED');
          }
          const seeded=await seedStore.get('composite:state');
          assert(seeded.total===1000&&seeded.PUSH===999&&seeded.HALF_WIN===1&&seeded.total_pnl===0.53,'LOCAL_SEED_BALANCE_DRIFT');
          assert((await seedPost({action:'begin',manifest:{...manifest,hash:'b'.repeat(64)}})).status===409,'LOCAL_SECOND_SNAPSHOT_ALLOWED');
          const p1=await seedBook.fetch(new Request('https://store.internal/audit-book-page-v1'));
          const page=await p1.json();assert(p1.ok&&page.rows.length===500&&page.seed.status==='loaded'&&page.seed.inserted===878&&page.seed.already_present===120&&page.seed.corrected===1&&page.seed.superseded===1,'LOCAL_SEED_CHECKPOINT_OR_PAGINATION_FAILED');
          const p2=await seedBook.fetch(new Request('https://store.internal/audit-book-page-v1?cursor='+page.next_cursor));assert((await p2.json()).rows.length===500,'LOCAL_SEED_PAGE2_FAILED');
          const seedUrl='https://ball46-shadow-receiver-production.mccarey-supon.workers.dev/seed-history-v1';
          for(const token of [null,liveEnv.AUDIT_TOKEN,liveEnv.REPLAY_TOKEN])assert((await worker.fetch(new Request(seedUrl,{method:'POST',headers:token?{authorization:'Bearer '+token}:{},body:'{}'}),liveEnv)).status===403,'SEED_WRITE_AUTH_DENIED_EXPECTED');
          console.log('LOCAL_HISTORY_SEED_1000_ROWS_OVERLAP_REVERSAL_STALE_RETRY_PAGES_PASS=true');


          JS
          node shadow-seed-snapshot.mjs
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {readFullBook,compare} from './shadow-seed-audit.mjs';
          import {fingerprint} from './shadow-seed-snapshot.mjs';
          import {createHash,createHmac,randomBytes} from 'node:crypto';
          const seedKey=randomBytes(32).toString('hex');console.log('::add-mask::'+seedKey);
          const auditKey=createHmac('sha256',process.env.CLOUDFLARE_API_TOKEN).update('ball46/receiver/https-audit/v1/20261118').digest('hex');console.log('::add-mask::'+auditKey);
          const root='https://api.cloudflare.com/client/v4/accounts/62cb0db544160e6591342abd6b4f35cc';
          const receiver='ball46-shadow-receiver-production',engine='nomadtips3-engine-343',site='ball46-production';
          const old='3e84e401-167d-45d4-8a54-430f0a857def',engineOld='db65134e-a12d-4084-937e-3ce6e986c251',siteOld='f5d9cf21-4b41-46da-bdd8-a841fa733d82';
          const headers={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'content-type':'application/json'};
          const api=async(p,method='GET',body)=>{
            if(method!=='GET'&&!(method==='POST'&&(p==='/workers/workers/'+receiver+'/versions?deploy=false'||p==='/workers/scripts/'+receiver+'/deployments')))throw Error('WRITE_GUARD');
            const r=await fetch(root+p,{method,headers,body:body===undefined?undefined:JSON.stringify(body),signal:AbortSignal.timeout(30000)});
            const j=await r.json();if(!r.ok||!j.success)throw Error('CF_'+method+'_'+r.status+'_'+(j.errors??[]).map(e=>e.code).join('_'));return j.result;
          };
          const active=async n=>(await api('/workers/scripts/'+n+'/deployments?per_page=1')).deployments?.[0]?.versions;
          const equal=(a,id)=>a?.length===1&&a[0].version_id===id&&Number(a[0].percentage)===100;
          const ensure=async(n,id)=>{if(!equal(await active(n),id))throw Error('ACTIVE_VERSION_DRIFT_'+n)};
          const privateCheck=async()=>{const s=await api('/workers/scripts/'+receiver+'/subdomain');if(s.enabled!==true||s.previews_enabled===true)throw Error('RECEIVER_SUBDOMAIN_DRIFT')};
          const version=id=>api('/workers/workers/'+receiver+'/versions/'+id+'?include=modules');
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const match=(a,b)=>{if(a.length!==b.length)throw Error('BINDING_COUNT_DRIFT');for(const x of a){const y=b.find(z=>z.name===x.name);if(!y||y.type!==x.type)throw Error('BINDING_TYPE_DRIFT');for(const k of ['service','class_name','namespace_id','script_name','environment','text'])if(x.type!=='secret_text'&&x[k]!==undefined&&x[k]!==y[k])throw Error('BINDING_RESOURCE_DRIFT')}};
          const checks=async id=>{await ensure(engine,engineOld);await ensure(site,siteOld);await ensure(receiver,id);await privateCheck()};
          const assign=id=>api('/workers/scripts/'+receiver+'/deployments','POST',{strategy:'percentage',versions:[{version_id:id,percentage:100}],annotations:{'workers/message':'Approved bc5ba2d historical cutoff seed only'}});
          const wait=async id=>{for(let i=0;i<15;i++){if(equal(await active(receiver),id))return;await new Promise(r=>setTimeout(r,2000))}throw Error('RECEIVER_ACTIVE_VERSION_NOT_CONFIRMED')};
          await checks(old);
          const v=await version(old),settings=await api('/workers/scripts/'+receiver+'/settings');
          if(v.modules?.length!==1||v.main_module!==v.modules[0].name||hash(Buffer.from(v.modules[0].content_base64,'base64'))!=='773a09dd16ce9aa64ec851d19d2aaf305fc28de22b18c21daa8da07581091c80')throw Error('OLD_RECEIVER_HASH_DRIFT');
          const bindings=v.bindings??[];
