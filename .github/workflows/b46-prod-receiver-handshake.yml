name: B46 approved Receiver compact read API preparation
on:
  push:
    branches: [chatgpt/ball46-new-ledger-clean-v1]
    paths: ['.github/workflows/b46-prod-receiver-handshake.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b46-prod-receiver-only
  cancel-in-progress: false
jobs:
  receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 99e1de58ed637a185da4e7846dde07cee6aed1e2
          persist-credentials: false
      - name: Test constant size read and deploy Receiver only, preserving existing bindings
        working-directory: chatgpt-statistics-ui
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 99e1de58ed637a185da4e7846dde07cee6aed1e2
          test "$(git hash-object shadow-production-receiver.mjs)" = 8879dfa34d7b13bca64c88485375b511e2b289ea
          node --check shadow-production-receiver.mjs
          npx --yes esbuild@0.25.12 shadow-production-receiver.mjs --bundle --format=esm --platform=neutral --target=es2022 --external:cloudflare:workers --outfile="$RUNNER_TEMP/receiver.mjs"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const source=readFileSync(process.env.RUNNER_TEMP+'/receiver.mjs','utf8').replace(/import\s*\{\s*WorkerEntrypoint\s*\}\s*from\s*["']cloudflare:workers["'];?/, 'class WorkerEntrypoint { constructor(ctx,env) {this.env=env;} }');
          const {default:worker,ShadowProductionStore,StatisticsReader}=await import('data:text/javascript;base64,'+Buffer.from(source).toString('base64'));
          let calls=[],loaded=true;
          const state={pnl_schema:1,unknown_pnl:0,total:4,WIN:2,LOSS:1,HALF_WIN:0,HALF_LOSS:0,PUSH:1,total_pnl:1.2,winRate:200/3,cursor:{settled_at:1000,signal_id:'a'},corrections:1};
          const storage={get:async k=>{calls.push(k);if(k==='composite:state')return state;if(k==='composite:historical-seed:20261118-v1')return {status:loaded?'loaded':'loading'};throw Error('UNEXPECTED_STORAGE_KEY')},list:async()=>{throw Error('HISTORICAL_LIST_FORBIDDEN')}};
          const book=new ShadowProductionStore({storage},{});
          const env={AUDIT_TOKEN:'a'.repeat(64),SHADOW_STORE:{idFromName:n=>n,get:n=>{assert.equal(n,'book-v1');return {fetch:(url,init)=>book.fetch(new Request(url,init))}}}};
          const endpoint='https://ball46-shadow-receiver-production.mccarey-supon.workers.dev/audit-statistics-summary-v1';
          for(const auth of [null,'Bearer '+'b'.repeat(64)]){const r=await worker.fetch(new Request(endpoint,{headers:auth?{authorization:auth}:{}}),env);assert.equal(r.status,403)}
          assert.equal(calls.length,0);
          const reader=new StatisticsReader({},env);
          const r=await reader.fetch(new Request('https://shadow.internal/statistics-summary-v1'));
          const d=await r.json();assert.equal(r.status,200);assert.equal(d.total,4);assert.equal(d.total_pnl,1.2);assert.equal(d.roi,30);assert.equal(d.scope,'SETTLED_TOTALS_ONLY');assert.equal(calls.length,2);
          assert.equal((await reader.fetch(new Request('https://shadow.internal/statistics-summary-v1',{method:'POST'}))).status,405);
          assert.equal((await worker.fetch(new Request(endpoint,{method:'POST',headers:{authorization:'Bearer '+env.AUDIT_TOKEN}}),env)).status,403);
          const good=await worker.fetch(new Request(endpoint,{headers:{authorization:'Bearer '+env.AUDIT_TOKEN}}),env);assert.equal(good.status,200);
          loaded=false;assert.equal((await reader.fetch(new Request('https://shadow.internal/statistics-summary-v1'))).status,503);
          console.log('LOCAL_COMPACT_READ_TWO_GETS_NO_SCAN_AUTH_READY_GATE_PASS=true');
          JS
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash,createHmac} from 'node:crypto';
          import {performance} from 'node:perf_hooks';
          const root='https://api.cloudflare.com/client/v4/accounts/62cb0db544160e6591342abd6b4f35cc';
          const receiver='ball46-shadow-receiver-production',engine='nomadtips3-engine-343',site='ball46-production';
          const old='4e4966a1-3772-4867-bdd4-628315dcacb3',engineOld='db65134e-a12d-4084-937e-3ce6e986c251',siteOld='f5d9cf21-4b41-46da-bdd8-a841fa733d82';
          const headers={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'content-type':'application/json'};
          const api=async(p,method='GET',body)=>{
            if(method!=='GET'&&!(method==='POST'&&(p==='/workers/workers/'+receiver+'/versions?deploy=false'||p==='/workers/scripts/'+receiver+'/deployments')))throw Error('WRITE_SCOPE');
            const r=await fetch(root+p,{method,headers,body:body===undefined?undefined:JSON.stringify(body),signal:AbortSignal.timeout(30000)});const j=await r.json();if(!r.ok||!j.success)throw Error('CF_'+method+'_'+r.status+'_'+(j.errors??[]).map(e=>e.code).join('_'));return j.result;
          };
          const active=async n=>(await api('/workers/scripts/'+n+'/deployments?per_page=1')).deployments?.[0]?.versions;
          const equal=(a,id)=>a?.length===1&&a[0].version_id===id&&Number(a[0].percentage)===100;
          const ensure=async(n,id)=>{if(!equal(await active(n),id))throw Error('ACTIVE_VERSION_DRIFT_'+n)};
          const checks=async id=>{await ensure(engine,engineOld);await ensure(site,siteOld);await ensure(receiver,id);const d=await api('/workers/scripts/'+receiver+'/subdomain');if(d.enabled!==true||d.previews_enabled===true)throw Error('RECEIVER_ROUTE_DRIFT')};
          const version=id=>api('/workers/workers/'+receiver+'/versions/'+id+'?include=modules');
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const assign=id=>api('/workers/scripts/'+receiver+'/deployments','POST',{strategy:'percentage',versions:[{version_id:id,percentage:100}],annotations:{'workers/message':'Approved Receiver read API preparation only; no website switch'}});
          const wait=async id=>{for(let i=0;i<15;i++){if(equal(await active(receiver),id))return;await new Promise(r=>setTimeout(r,2000))}throw Error('ACTIVE_VERSION_NOT_CONFIRMED')};
          await checks(old);
          const v=await version(old),settings=await api('/workers/scripts/'+receiver+'/settings');
          if(v.modules?.length!==1||v.main_module!==v.modules[0].name||hash(Buffer.from(v.modules[0].content_base64,'base64'))!=='d3616dc7846ed31bc8d4396f5067f72a67fc18f0d3bd80ad20be0fe0b77bff07')throw Error('OLD_RECEIVER_HASH_DRIFT');
          const bindings=v.bindings??[];
          if(!bindings.some(x=>x.name==='AUDIT_TOKEN'&&x.type==='secret_text')||!bindings.some(x=>x.name==='SHADOW_STORE'&&x.type==='durable_object_namespace'&&x.class_name==='ShadowProductionStore'))throw Error('BINDING_DRIFT');
          const candidate=readFileSync(process.env.RUNNER_TEMP+'/receiver.mjs');
          const payload={main_module:v.main_module,modules:[{name:v.main_module,content_type:v.modules[0].content_type,content_base64:candidate.toString('base64')}],bindings:bindings.map(b=>({name:b.name,type:'inherit',version_id:old})),compatibility_date:v.compatibility_date,compatibility_flags:settings.compatibility_flags??[],annotations:{'workers/message':'Compact read-only summary; no changes to ingestion, data or source'}};
          if(v.usage_model)payload.usage_model=v.usage_model;if(v.migration_tag)payload.migration_tag=v.migration_tag;
          const up=await api('/workers/workers/'+receiver+'/versions?deploy=false','POST',payload),id=up.id;if(!id||id===old)throw Error('INVALID_CANDIDATE');
          const next=await version(id);if(next.modules?.length!==1||hash(Buffer.from(next.modules[0].content_base64,'base64'))!==hash(candidate))throw Error('UPLOADED_HASH_DRIFT');
          if((next.bindings??[]).length!==bindings.length)throw Error('BINDING_COUNT_DRIFT');
          for(const x of bindings){const y=next.bindings.find(z=>z.name===x.name);if(!y||y.type!==x.type)throw Error('BINDING_TYPE_DRIFT');for(const k of ['service','class_name','namespace_id','script_name','environment','text'])if(x.type!=='secret_text'&&x[k]!==undefined&&x[k]!==y[k])throw Error('BINDING_RESOURCE_DRIFT')}
          await checks(old);
          const key=createHmac('sha256',process.env.CLOUDFLARE_API_TOKEN).update('ball46/receiver/https-audit/v1/20261118').digest('hex');console.log('::add-mask::'+key);
          const base='https://ball46-shadow-receiver-production.mccarey-supon.workers.dev';
          async function get(path,token){
            const start=performance.now(),r=await fetch(base+path,{headers:{'user-agent':'Mozilla/5.0 B46-Audit',...(token?{authorization:'Bearer '+token}:{})},redirect:'manual',signal:AbortSignal.timeout(20000)}),t=await r.text();
            return {status:r.status,ms:Math.round(performance.now()-start),bytes:Buffer.byteLength(t),data:JSON.parse(t)};
          }
          try{
            await assign(id);await wait(id);await checks(id);
            let good;
            for(let i=0;i<6;i++){good=await get('/audit-statistics-summary-v1',key);if(good.status===200)break;await new Promise(r=>setTimeout(r,1000))}
            const no=await get('/audit-statistics-summary-v1'),wrong=await get('/audit-statistics-summary-v1','0'.repeat(64));
            if(no.status!==403||wrong.status!==403||good.status!==200||good.data.scope!=='SETTLED_TOTALS_ONLY')throw Error('LIVE_SUMMARY_AUTH_OR_SCOPE');
            const timings=[];
            for(let i=0;i<5;i++){const x=await get('/audit-statistics-summary-v1',key);if(x.status!==200||!x.data.ok)throw Error('LIVE_SUMMARY_READ');timings.push({ms:x.ms,bytes:x.bytes});good=x}
            const other=await get('/audit-book-page-v1',key);
            if(other.status!==200||!other.data.ok||!other.data.aggregate)throw Error('BOOK_READBACK');
            const a=other.data.aggregate,b=good.data;
            if(a.total!==b.total||a.total_pnl!==b.total_pnl||Math.abs(a.win_rate-b.win_rate)>1e-9||Object.keys(a.raw_counts).some(k=>a.raw_counts[k]!==b.raw_counts[k]))throw Error('SUMMARY_PARITY_OR_LIVE_REVISION_CHANGED');
            await checks(id);
            console.log('RECEIVER_COMPACT_READ_VERIFIED='+JSON.stringify({id,rollback:old,engine:engineOld,website:siteOld,secretInherited:true,auth:{missing:no.status,wrong:wrong.status,valid:good.status},summary:b,timings,parity:true,websiteSourceChanged:false}));
          }catch(e){if(equal(await active(receiver),id)){await assign(old);await wait(old);console.log('RECEIVER_ROLLBACK_CONFIRMED='+old)}throw e}
          JS
