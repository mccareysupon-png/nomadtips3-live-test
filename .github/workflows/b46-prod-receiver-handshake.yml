          for(const token of [null,auditKey]){const r=await apiSeed({action:'begin',manifest},token);if(r.status!==403)throw Error('SEED_AUTH_GATE_FAILED')}
          async function send(body){
           for(let attempt=1;attempt<=4;attempt++){
