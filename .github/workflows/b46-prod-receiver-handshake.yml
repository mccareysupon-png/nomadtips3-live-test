name: B46 one-time approved private Receiver audit deployment
on:
  push:
    branches: [chatgpt/ball46-new-ledger-clean-v1]
    paths: ['.github/workflows/b46-prod-receiver-handshake.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b46-prod-receiver-only
  cancel-in-progress: false
jobs:
  receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 338875d80c8939ebe290bd2562ee2c5cbd72b4fb
          persist-credentials: false
      - name: Validate approved source then upload and activate only Receiver with inherited bindings
        working-directory: chatgpt-statistics-ui
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 338875d80c8939ebe290bd2562ee2c5cbd72b4fb
          test "$(git hash-object shadow-production-receiver.mjs)" = 7e6ca789f0835671c6623256604b547483e52ce5
          node --check shadow-production-receiver.mjs
          npx --yes esbuild@0.25.12 shadow-production-receiver.mjs --bundle --format=esm --platform=neutral --target=es2022 --external:cloudflare:workers --outfile="$RUNNER_TEMP/receiver.mjs"
          node --check "$RUNNER_TEMP/receiver.mjs"
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const source=readFileSync(process.env.RUNNER_TEMP+'/receiver.mjs','utf8').replace(/import\s*\{\s*WorkerEntrypoint\s*\}\s*from\s*["']cloudflare:workers["'];?/, 'class WorkerEntrypoint { constructor(ctx,env) {this.env=env;} }');
          if(source.includes('from "cloudflare:workers"')||source.includes("from 'cloudflare:workers'"))throw Error('LOCAL_RUNTIME_STUB_FAILED');
          const {default:worker,AuditReader}=await import('data:text/javascript;base64,'+Buffer.from(source).toString('base64'));
          for(const host of ['shadow.internal','example.com']){
            const r=await worker.fetch(new Request('https://'+host+'/audit-snapshot'),{});
            if(r.status!==403)throw Error('DEFAULT_ENTRYPOINT_MUST_DENY');
          }
          const env={SHADOW_STORE:{idFromName:n=>n,get:n=>({fetch:async(url,init)=>{if(new URL(url).pathname!=='/audit-snapshot'||init.headers['x-audit-object']!==(n==='inbox-v1'?'inbox':'book'))throw Error('UNEXPECTED_STORAGE_CALL');return Response.json(n==='inbox-v1'?{total_received:0,duplicate_count:0,pending_retry_queue:0}:{settled_count:0,recent_5_signals:[],total_pnl:0,win_rate:0})}})}};
          const reader=new AuditReader({},env);
          const r=await reader.fetch(new Request('https://shadow.internal/audit-snapshot'));
          if(r.status!==200||!(await r.json()).readOnly)throw Error('PRIVATE_ENTRYPOINT_TEST_FAILED');
          if((await reader.fetch(new Request('https://shadow.internal/audit-snapshot',{method:'POST'}))).status!==405)throw Error('PRIVATE_POST_MUST_DENY');
          const {ShadowProductionStore}=await import('data:text/javascript;base64,'+Buffer.from(source).toString('base64'));
          const rows=new Map([['composite:receipt:a',{signal_id:'a',settled_at:100,result:'WIN',market_type:'ft_ah',odds:2}],['composite:receipt:z',{signal_id:'z',settled_at:100,result:'HALF_LOSS',market_type:'ft_ah',odds:2}]]);
          const obj=new ShadowProductionStore({storage:{list:async()=>rows}},{});
          const detail=await obj.fetch(new Request('https://store.internal/audit-snapshot?from=1&until=1000&detail=1',{headers:{'x-audit-object':'book'}}));
          const d=await detail.json();
          if(detail.status!==200||d.recent_5_signals[0].signal_id!=='z'||d.raw_counts.WIN!==1||d.raw_counts.HALF_LOSS!==1||d.audit_rows.length!==2||d.total_pnl!==0.5)throw Error('LOCAL_DEEP_DIFF_TEST_FAILED');
          const makeStore=()=>{const m=new Map();let alarm=null;const x={get:async k=>structuredClone(m.get(k)),put:async(k,v)=>{m.set(k,structuredClone(v))},delete:async k=>m.delete(k),list:async(o={})=>new Map([...m].filter(([k])=>k.startsWith(o.prefix??'')&&(!o.startAfter||k>o.startAfter)).sort(([a],[b])=>a.localeCompare(b)).slice(0,o.limit??1000).map(([k,v])=>[k,structuredClone(v)])),getAlarm:async()=>alarm,setAlarm:async n=>{alarm=n},transaction:async fn=>fn(x)};return x};
          const bookStore=makeStore(),inboxStore=makeStore();
          const objects={};
          const liveEnv={AUDIT_TOKEN:'a'.repeat(64),REPLAY_TOKEN:'b'.repeat(64),SHADOW_STORE:{idFromName:n=>n,get:n=>({fetch:async(url,init)=>objects[n].fetch(new Request(url,init))})}};
          objects['book-v1']=new ShadowProductionStore({storage:bookStore},liveEnv);
          objects['inbox-v1']=new ShadowProductionStore({storage:inboxStore},liveEnv);
          const book=objects['book-v1'],inbox=objects['inbox-v1'];
