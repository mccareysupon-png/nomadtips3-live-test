          console.log('SEED_COMPLETE='+JSON.stringify({seed:after.seed,originalSnapshot:snapshot.totals,receiverTotals:after.totals,sourceExact:diff.exact,snapshotRowsExact:resolved,snapshotRowsAdvanced:advanced,postSnapshotRows:diff.extra,bookHash:after.hash,sourceHash:snapshot.hash}));
          await checks(id);
