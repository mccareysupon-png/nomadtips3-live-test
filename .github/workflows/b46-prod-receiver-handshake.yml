          if(!(next.bindings??[]).some(x=>x.name==='SEED_TOKEN'&&x.type==='secret_text'))throw Error('SEED_BINDING_NOT_VERIFIED');
          match(bindings,(next.bindings??[]).filter(x=>x.name!=='SEED_TOKEN'));
          await checks(old);
          console.log('RECEIVER_CANDIDATE_VERIFIED='+JSON.stringify({id,rollback:old,source:'bc5ba2d',sha256:hash(candidate),secretInherited:true}));
          let attempted=false;
