          const latest=new Map(before.book.audit_rows.map(x=>[x.signal_id,x]));
          for(const e of quarantine){const old=latest.get(e.row.signal_id);if(!old)throw Error('QUARANTINE_UNKNOWN_SIGNAL');if(e.row.settled_at>old.settled_at)latest.set(e.row.signal_id,e.row);else if(e.row.settled_at===old.settled_at&&(e.row.result!==old.result||Number(e.row.odds)!==Number(old.odds)||e.row.market_type!==old.market_type))throw Error('SAME_TIME_CONFLICT_STOP');}
          const source=new Map(),ids=new Set(quarantine.map(e=>e.row.signal_id));let cursor=null;
          for(let i=0;i<8;i++){
            const u=new URL('https://www.ball46.com/api/engine/statistics');u.searchParams.set('paged','1');if(cursor)u.searchParams.set('cursor',cursor);
            const r=await fetch(u,{headers:{accept:'application/json','cache-control':'no-cache'},signal:AbortSignal.timeout(25000)});const d=await r.json();
            if(!r.ok||!d.ok||!Array.isArray(d.rows))throw Error('LEGACY_REPLAY_PREFLIGHT_FAILED');
            for(const x of d.rows)if(ids.has(String(x.id))&&x.status==='SETTLED')source.set(String(x.id),x);
            if(source.size===ids.size||!d.nextCursor||cursor===d.nextCursor)break;cursor=d.nextCursor;
          }
          for(const id of ids){const a=source.get(id),b=latest.get(id);if(!a||a.result!==b.result||Number(a.settledAt)!==b.settled_at||String(a.market??'')!==b.market_type||String(a.odds??'')!==String(b.odds??''))throw Error('QUARANTINE_SOURCE_REVISION_MISMATCH_'+id)}
          console.log('REPLAY_PREFLIGHT='+JSON.stringify({quarantine:quarantine.length,verifiedSignalIds:ids.size,pending:before.inbox.pending_retry_queue}));
          const replayUrl=endpoint+'/replay-quarantined-v1';
          const send=async token=>fetch(replayUrl,{method:'POST',headers:{'content-type':'application/json','user-agent':'Mozilla/5.0 B46-Replay',...(token?{authorization:'Bearer '+token}:{})},body:JSON.stringify({fingerprints:quarantine.map(e=>e.fingerprint)}),redirect:'manual',signal:AbortSignal.timeout(20000)});
          const no=await send(null),wrong=await send(auditKey);
