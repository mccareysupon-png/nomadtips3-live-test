name: Deploy Ball46 Dashboard Preserve Partial 20261006
on:
  push:
    branches: [deploy/ball46-dashboard-preserve-partial-20261006]
    paths:
      - '.github/workflows/deploy-ball46-dashboard-preserve-partial-20261006.yml'
      - 'deploy-assets/dashboard-preserve-partial-20261006/**'
permissions:
  contents: read
concurrency:
  group: ball46-production-dashboard-preserve-partial
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/ball46-dashboard-preserve-partial-20261006
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts acorn@8
      - name: Deploy dashboard asset only with full guards
        working-directory: deploy-assets/dashboard-preserve-partial-20261006
        run: node run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-dashboard-preserve-partial-${{ github.run_id }}
          path: deploy-assets/dashboard-preserve-partial-20261006/audit
          if-no-files-found: warn
          retention-days: 14
