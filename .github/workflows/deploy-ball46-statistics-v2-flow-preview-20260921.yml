name: Deploy Ball46 Statistics V2 Flow Preview 20260921

on:
  push:
    branches: [work/ball46-statistics-v2-clean-preview-20260921]
    paths:
      - 'nomad-live-343/statistics-v2-preview.html'
      - 'nomad-live-343/statistics-v2-preview.css'
      - 'nomad-live-343/statistics-v2-preview.js'
      - 'nomad-live-343/statistics-v2-balance.css'
      - 'nomad-live-343/statistics-flow-343.css'
      - 'nomad-live-343/statistics-flow-343.js'
      - 'nomad-live-343/index-flow-preview.html'
      - 'nomad-live-343/signal-flow-preview.html'
      - '.github/workflows/deploy-ball46-statistics-v2-flow-preview-20260921.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PREVIEW_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev
  BASE_SHA: 179eeec2d4aefb12592b036688ab42386bcfb609

jobs:
  deploy-flow-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard preview-only scope
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_SHA^{commit}"
          mapfile -t CHANGED < <(git diff --name-only "$BASE_SHA"..HEAD)
          printf 'Changed files:\n%s\n' "${CHANGED[*]}"
          for p in "${CHANGED[@]}"; do
            case "$p" in
              nomad-live-343/statistics-v2-preview.html|\
              nomad-live-343/statistics-v2-preview.css|\
              nomad-live-343/statistics-v2-preview.js|\
              nomad-live-343/statistics-v2-balance.css|\
              nomad-live-343/statistics-flow-343.css|\
              nomad-live-343/statistics-flow-343.js|\
              nomad-live-343/index-flow-preview.html|\
              nomad-live-343/signal-flow-preview.html|\
              .github/workflows/deploy-ball46-statistics-v2-flow-preview-20260921.yml) ;;
              *) echo "FORBIDDEN CHANGE: $p"; exit 1 ;;
            esac
          done
          for p in nomad-live-343/index.html nomad-live-343/signal.html nomad-live-343/statistics.html nomad-live-343/dashboard-v2-stage3.js nomad-live-343/bulk-odds-compat-343.js nomad-live-343/full-market-bookmaker-343.js workers/nomadtips3-343-preview/src/index.js; do
            git diff --quiet "$BASE_SHA"..HEAD -- "$p" || { echo "CORE FILE CHANGED: $p"; exit 1; }
          done
          echo 'PASS: connected workspace remains isolated; production pages and engine bridge untouched.'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate connected workspace files
        shell: bash
        run: |
          set -euo pipefail
          node --check nomad-live-343/statistics-v2-preview.js
          node --check nomad-live-343/statistics-flow-343.js
          grep -Fq 'statistics-v2-preview.html?market=ah' nomad-live-343/index-flow-preview.html
          grep -Fq 'signal-flow-preview.html' nomad-live-343/signal-flow-preview.html
          grep -Fq 'data-flow-count="live"' nomad-live-343/signal-flow-preview.html
          grep -Fq 'v2-shared.js' nomad-live-343/statistics-v2-preview.html
          grep -Fq 'data-theme-toggle' nomad-live-343/statistics-v2-preview.html
          grep -Fq "const STAT_API='/api/engine/statistics'" nomad-live-343/statistics-v2-preview.js
          grep -Fq "const BOARD_API='/api/engine/board'" nomad-live-343/statistics-v2-preview.js
          grep -Fq 'Promise.allSettled' nomad-live-343/statistics-v2-preview.js
          grep -Fq 'signal-flow-preview.html?fixture=' nomad-live-343/statistics-flow-343.js
          if grep -Fq 'fallbackRows' nomad-live-343/statistics-v2-preview.js; then
            echo 'Synthetic statistics fallback is forbidden in connected mode'; exit 1
          fi

      - name: Validate Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Dry-run isolated preview worker
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc

      - name: Deploy isolated preview worker
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Smoke connected flow and live APIs
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          for page in index-flow-preview.html signal-flow-preview.html statistics-v2-preview.html; do
            curl -fsS --max-time 30 "$PREVIEW_URL/$page?verify=$GITHUB_RUN_ID" -o "/tmp/$page"
          done
          grep -Fq 'CONNECTED WORKSPACE' /tmp/index-flow-preview.html
          grep -Fq 'Active Signals' /tmp/signal-flow-preview.html
          grep -Fq 'PERFORMANCE TREND' /tmp/statistics-v2-preview.html
          curl -fsS --max-time 30 "$PREVIEW_URL/api/engine/board?verify=$GITHUB_RUN_ID" -o /tmp/board.json
          curl -fsS --max-time 30 "$PREVIEW_URL/api/engine/signals?verify=$GITHUB_RUN_ID" -o /tmp/signals.json
          curl -fsS --max-time 30 "$PREVIEW_URL/api/engine/statistics?verify=$GITHUB_RUN_ID" -o /tmp/statistics.json
          node - <<'NODE'
          const fs=require('fs');
          const board=JSON.parse(fs.readFileSync('/tmp/board.json','utf8'));
          const signals=JSON.parse(fs.readFileSync('/tmp/signals.json','utf8'));
          const stats=JSON.parse(fs.readFileSync('/tmp/statistics.json','utf8'));
          if(board?.ok!==true||!Array.isArray(board?.fixtures)) throw Error('board unhealthy');
          if(!Array.isArray(signals?.signals)) throw Error('signals unhealthy');
          if(stats?.ok!==true||!Array.isArray(stats?.rows)) throw Error('statistics unhealthy');
          console.log('PASS board=',board.fixtures.length,'signals=',signals.signals.length,'stats=',stats.rows.length);
          NODE
          echo "CONNECTED FLOW PASS: $PREVIEW_URL/index-flow-preview.html"
