name: Cleanup NOMAD 3.43 Per-Fixture Odds

on:
  push:
    branches:
      - work/nomad343-remove-per-fixture-full-market
    paths:
      - .github/workflows/rollback-343-per-fixture-cleanup.yml
      - .github/scripts/cleanup_343_per_fixture.py
      - workers/nomadtips3-engine-343/wrangler.toml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nomad343-remove-per-fixture-full-market
          fetch-depth: 0

      - name: Apply deterministic cleanup
        run: python .github/scripts/cleanup_343_per_fixture.py

      - name: Keep deploy workflow unchanged in automation commit
        run: git checkout -- .github/workflows/deploy-343-preview.yml

      - name: Remove obsolete per-fixture Full Market files
        run: |
          set -euo pipefail
          git rm -f nomad-live-343/full-odds-main-343.js
          git rm -rf workers/nomadtips3-343-full-market

      - name: Validate zero per-fixture odds calls in active 3.43
        run: |
          set -euo pipefail
          node --check workers/nomadtips3-engine-343/src/index.js
          node --check workers/nomadtips3-343-preview/src/index.js
          node --check nomad-live-343/bet365-board.js
          grep -Fq "source='5USD batch · round feed'" nomad-live-343/bet365-board.js
          grep -Fq "priceSource:'hub-batch'" workers/nomadtips3-engine-343/src/index.js
          grep -Fq "externalRequests:0" workers/nomadtips3-engine-343/src/index.js
          if grep -R -n -E '/api/full-market|/fixture-odds|full-odds-main-343|nomadtips3-343-full-market|fetchFullOdds|fixtures/.*/odds\?bookmakers=' nomad-live-343 workers/nomadtips3-engine-343 workers/nomadtips3-343-preview; then
            echo 'Per-fixture odds code still exists in active 3.43 path'
            exit 1
          fi
          if grep -Fq 'FIVEDOLLAR_API_KEY' workers/nomadtips3-engine-343/src/index.js; then
            echo 'Engine still has direct provider credentials/code'
            exit 1
          fi
          git diff --check

      - name: Commit cleanup to staging branch
        run: |
          set -euo pipefail
          git config user.name 'nomad343-cleanup-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'rollback(343): remove per-fixture odds API paths'
          git push origin HEAD:work/nomad343-remove-per-fixture-full-market
