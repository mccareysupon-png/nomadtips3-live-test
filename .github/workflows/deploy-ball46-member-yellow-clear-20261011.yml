name: Ball46 MEMBER Yellow Transparent No Hover 20261011
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ball46-member-yellow-clear-20261011.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  member-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ball46-easybet-crossdevice-fix-20261007
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install parser dependency
        run: npm install --no-save --ignore-scripts acorn@8
      - name: Patch only live MEMBER CSS with collision guards
        working-directory: deploy-assets/ball46-member-nav-20261009
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs';
          import {resolve} from 'node:path';
          import {inspect,api,script,activeVersion,getVersion,publicFile,sha,canonical} from '../daily-performance-20261005/production.mjs';
          import {schedules,stageCurrentRail,verifyRailBase,wrangler} from '../daily-performance-20261005/rail.mjs';
          
          const report={scope:'ONLY change MEMBER link gold card to transparent, label+star to yellow, remove hover effects; preserve same location and 1,011 mock members',startedAt:new Date().toISOString()};
          mkdirSync('audit-member-yellow',{recursive:true});
          const save=()=>writeFileSync('audit-member-yellow/report.json',JSON.stringify(report,null,2));
          const delay=ms=>new Promise(r=>setTimeout(r,ms));
          let original=null,candidate=null;
          const scope='a[data-b46-member-entry="rail"]';
          const guard=(x,s,why)=>{assert(x.includes(s),why);assert.equal(x.split(s).length-1,1,'NOT_EXACTLY_ONE:'+why);return x};
          function changeOnlyMemberCSS(html) {
            assert.equal((html.match(/<a\b(?=[^>]*data-b46-member-entry="rail")[^>]*>/g)||[]).length,1,'RAIL_MEMBER_ANCHOR_NOT_ONE');
            assert.equal((html.match(/class="b46-premium-detail"/g)||[]).length,1,'MEMBER_DETAIL_CHANGED');
            assert.equal((html.match(/>1,011<\/strong>/g)||[]).length,1,'MOCK_COUNT_CHANGED');
            const styles=[...html.matchAll(/<style id="b46-member-gold-1011">[\s\S]*?<\/style>/g)];
            assert.equal(styles.length,1,'CURRENT_PREMIUM_STYLE_NOT_FOUND');
            const before=styles[0][0];
            const lines=before.split('\n');
            const changes=[
              {
                prefix:scope+'{',
                old:['background:linear-gradient(125deg,#ffe7a8 0%,#e6be68 65%,#c99437 100%)!important','color:#192538!important','border:1px solid #ffeca8!important','box-shadow:0 2px 9px #00000022,inset 0 1px 0 #ffffff99!important'],
                new:['background:transparent!important','color:#ffe57c!important','border:1px solid transparent!important','box-shadow:none!important']
              },
              {
                prefix:scope+':hover,'+scope+':focus-visible{',
                old:['background:linear-gradient(125deg,#fff0be,#efcf82 65%,#d6a64d)!important','color:#182335!important'],
                new:['background:transparent!important','color:#ffe57c!important']
              },
              {
                prefix:scope+' .b46-premium-name{',
                old:['color:#192538!important'],
                new:['color:#ffe57c!important']
              },
              {
                prefix:scope+' .b46-premium-star{',
                old:['color:#765116!important'],
                new:['color:#ffe57c!important']
              }
            ];
            for(const change of changes){
              const matches=lines.map((v,i)=>v.trim().startsWith(change.prefix)?i:-1).filter(i=>i>=0);
              assert.equal(matches.length,1,'CSS_SELECTOR_NOT_EXACT:'+change.prefix);
              let line=lines[matches[0]];
              for(let i=0;i<change.old.length;i++){
                guard(line,change.old[i],'EXPECTED_CURRENT_CSS_CHANGED:'+change.prefix);
                line=line.replace(change.old[i],change.new[i]);
              }
              if(change.prefix.includes(':hover,')){
                // Same appearance for normal, hover, active, and focus-visible; keep keyboard focus outline.
                line=line.replace(':hover,'+scope+':focus-visible{',':hover,'+scope+':active,'+scope+':focus-visible{');
                line=line.replace(/}$/, ';border-color:transparent!important;box-shadow:none!important;transform:none!important;filter:none!important}');
              }
              lines[matches[0]]=line;
            }
            const after=lines.join('\n');
            assert.notEqual(after,before,'NO_CHANGE');
            const output=html.replace(before,after);
            assert.equal(output.length-html.length,after.length-before.length,'UNRELATED_HTML_LENGTH_CHANGE');
            assert.equal((output.match(/<a\b(?=[^>]*data-b46-member-entry="rail")[^>]*>/g)||[]).length,1,'NAV_CHANGED');
            assert.equal((output.match(/>1,011<\/strong>/g)||[]).length,1,'COUNT_CHANGED');
            return output;
          }
          async function rollback(){
            if(!original)return;
            const active=await activeVersion();
            if(active===original)return;
            if(!candidate||active!==candidate)throw Error('FOREIGN_PRODUCTION_VERSION_STOP_NO_ROLLBACK');
            await api('/scripts/'+script+'/deployments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({strategy:'percentage',versions:[{version_id:original,percentage:100}],annotations:{'workers/message':'Rollback MEMBER yellow transparent UI only'}})});
            assert.equal(await activeVersion(),original,'ROLLBACK_NOT_CONFIRMED');
          }
          try{
            const current=await inspect();original=current.restore.version;
            const settings=await api('/scripts/'+script+'/settings'),crons=await schedules();
            const settingsSha=sha(canonical(settings)),workerSha=sha(Buffer.from(current.source));
            const staged=await stageCurrentRail(current.version,settings,crons,current.source);
            await verifyRailBase(staged);
            assert.equal(await activeVersion(),original,'PRODUCTION_MOVED_WHILE_STAGING');
            const path=resolve(staged.runtime,'assets/index.html');
            const before=readFileSync(path,'utf8');
            assert.equal(sha(Buffer.from(before)),staged.hashes['index.html'],'STAGED_HTML_NOT_LIVE');
            const after=changeOnlyMemberCSS(before);
            const updatedHash=sha(Buffer.from(after));
            writeFileSync(path,after);
            report.beforeVersion=original;report.onlyChangedAsset='index.html';report.oldSha=staged.hashes['index.html'];report.newSha=updatedHash;save();
            wrangler(staged,true);
            assert.equal(await activeVersion(),original,'PRODUCTION_CHANGED_BEFORE_DEPLOY');
            wrangler(staged,false);
            for(let i=0;i<25;i++){const v=await activeVersion();if(v!==original){candidate=v;break}await delay(1200)}
            assert(candidate,'DEPLOYED_VERSION_NOT_OBSERVED');
            let verified=false;
            for(let i=0;i<25;i++){
              assert.equal(await activeVersion(),candidate,'PRODUCTION_CHANGED_DURING_VERIFY');
              try{verified=sha(await publicFile('/index.html','html'))===updatedHash;if(verified)break}catch{}
              await delay(1200);
            }
            assert(verified,'PUBLIC_HTML_NOT_VERIFIED');
            for(const [file,hash] of Object.entries(staged.hashes)){
              if(file==='index.html')continue;
              assert.equal(sha(await publicFile('/'+file)),hash,'UNRELATED_ASSET_CHANGED:'+file);
            }
            const deployed=await getVersion(candidate),main=deployed.modules.find(x=>x.name===deployed.main_module);
            assert(main,'MAIN_MISSING');
            assert.equal(sha(Buffer.from(Buffer.from(main.content_base64,'base64').toString('utf8'))),workerSha,'WORKER_ENGINE_CHANGED');
            assert.equal(sha(canonical(await api('/scripts/'+script+'/settings'))),settingsSha,'SETTINGS_CHANGED');
            assert.equal(canonical(await schedules()),canonical(crons),'CRONS_CHANGED');
            report.result='SUCCESS';report.deployedVersion=candidate;report.completedAt=new Date().toISOString();save();
            console.log('BALL46_MEMBER_YELLOW_CLEAR_SUCCESS',JSON.stringify({previous:original,deployed:candidate,unchangedAssets:Object.keys(staged.hashes).length-1}));
          }catch(e){
            report.result='FAIL_STOPPED';report.error=String(e?.message||e);save();
            try{await rollback();report.rolledBack=true;save()}catch(rb){report.rollbackError=String(rb?.message||rb);save()}
            console.error(e.stack);process.exitCode=1;
          }
          NODE
      - name: Save production audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-member-yellow-${{ github.run_id }}
          path: deploy-assets/ball46-member-nav-20261009/audit-member-yellow
          retention-days: 30
