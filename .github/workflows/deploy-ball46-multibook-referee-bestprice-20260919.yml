name: Deploy Ball46 MultiBook Referee BestPrice 20260919

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ball46-multibook-referee-bestprice-20260919.yml'

permissions:
  contents: write

env:
  SOURCE_BRANCH: work/ball46-multibook-referee-bestprice-20260919
  BALL46_URL: https://ball46.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-referee:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated referee branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Capture protected production identities
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 25 "$BALL46_URL/api/full-market/health?mr=${GITHUB_RUN_ID}" -o /tmp/full-before.json
          curl -fsS --max-time 25 "$BALL46_URL/api/engine/health?mr=${GITHUB_RUN_ID}" -o /tmp/engine-before.json
          node - <<'NODE'
          const fs=require('fs');
          const fm=JSON.parse(fs.readFileSync('/tmp/full-before.json','utf8'));
          const en=JSON.parse(fs.readFileSync('/tmp/engine-before.json','utf8'));
          fs.writeFileSync('/tmp/full-version',String(fm.version||''));
          console.log('BEFORE',JSON.stringify({fullMarket:fm.version,engine:en.version,engineOk:en.ok}));
          NODE

      - name: Apply MultiBook referee patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_ball46_multibook_referee_20260919.py
          node --check workers/nomadtips3-engine-343/src/index.js
          node --test workers/nomadtips3-engine-343/test/market-core.test.mjs workers/nomadtips3-engine-343/test/settlement-30000.test.mjs
          grep -Fq "nomad343-engine-v5-multibook-referee-bestprice" workers/nomadtips3-engine-343/src/index.js
          grep -Fq "MULTI_BOOK_BEST_PRICE_SOFT_CONSENSUS" workers/nomadtips3-engine-343/src/index.js
          grep -Fq 'binding = "FULL_MARKET"' workers/nomadtips3-engine-343/wrangler.toml
          grep -Fq 'service = "nomadtips3-full-market-343-ball46"' workers/nomadtips3-engine-343/wrangler.toml
          echo MULTIBOOK_SOURCE_GUARD_PASS

      - name: Guard scope and commit source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fxq 'workers/nomadtips3-engine-343/src/index.js'
          printf '%s\n' "${changed[@]}" | grep -Fxq 'workers/nomadtips3-engine-343/wrangler.toml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/nomadtips3-engine-343/src/index.js workers/nomadtips3-engine-343/wrangler.toml
          git commit -m 'feat(ball46): multi-book referee selects consensus best price'
          git push origin HEAD:${SOURCE_BRANCH}

      - name: Deploy Engine only
        working-directory: workers/nomadtips3-engine-343
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.toml

      - name: Verify Engine and protected Full Market
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 20); do
            curl -fsS --max-time 25 "$BALL46_URL/api/engine/health?mr=${GITHUB_RUN_ID}-${n}" -o /tmp/engine-after.json || true
            if grep -Fq 'nomad343-engine-v5-multibook-referee-bestprice' /tmp/engine-after.json; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ]
          curl -fsS --max-time 25 "$BALL46_URL/api/full-market/health?mr=${GITHUB_RUN_ID}-after" -o /tmp/full-after.json
          curl -fsS --max-time 25 "$BALL46_URL/api/engine/board?mr=${GITHUB_RUN_ID}" -o /tmp/board.json
          curl -fsS --max-time 25 "$BALL46_URL/api/engine/signals?mr=${GITHUB_RUN_ID}" -o /tmp/signals.json
          node - <<'NODE'
          const fs=require('fs');
          const en=JSON.parse(fs.readFileSync('/tmp/engine-after.json','utf8'));
          const fm=JSON.parse(fs.readFileSync('/tmp/full-after.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/board.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals.json','utf8'));
          if(en.version!=='nomad343-engine-v5-multibook-referee-bestprice') throw Error('ENGINE_VERSION_MISMATCH');
          if(String(fm.version||'')!==fs.readFileSync('/tmp/full-version','utf8')) throw Error('FULL_MARKET_VERSION_CHANGED');
          if(b?.ok!==true||!Array.isArray(b.fixtures)) throw Error('BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals)) throw Error('SIGNALS_UNHEALTHY');
          console.log('MULTIBOOK_REFEREE_DEPLOY_PASS',JSON.stringify({engine:en.version,fullMarket:fm.version,fixtures:b.fixtures.length,signals:s.signals.length,referee:b.referee||null}));
          NODE
