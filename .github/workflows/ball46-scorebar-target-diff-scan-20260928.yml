name: READ ONLY - Ball46 Scorebar Target Diff Scan 20260928
on:
  push:
    branches:
      - work/ball46-scorebar-background-pending-20260928
    paths:
      - '.github/workflows/ball46-scorebar-target-diff-scan-20260928.yml'
      - '.github/scripts/ball46_scorebar_target_diff_scan_20260928.sh'
permissions:
  contents: read
  actions: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ball46-signal-settlement-predeploy-v5-36379588125
          path: /tmp/b46-template
          github-token: ${{ github.token }}
          run-id: 36379588125
          repository: mccareysupon-png/nomadtips3-live-test
      - name: Read latest target-file diffs only
        run: bash .github/scripts/ball46_scorebar_target_diff_scan_20260928.sh
      - name: Upload diff proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-scorebar-target-diff-${{ github.run_id }}
          path: /tmp/b46-target-diff
          if-no-files-found: ignore
          retention-days: 30
