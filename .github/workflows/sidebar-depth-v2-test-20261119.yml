name: BALL46 light sidebar depth V2 preview
on:
  push:
    branches: [test/ball46-sidebar-depth-20261119]
    paths: ['.github/workflows/sidebar-depth-v2-test-20261119.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --prefix "$RUNNER_TEMP/b46qa" --no-save --no-package-lock puppeteer-core
          echo "PUPPETEER_ENTRY=$(node -p "require.resolve('puppeteer-core',{paths:['$RUNNER_TEMP/b46qa']})")" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Test and publish light-only refinement
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --check qa/sidebar-depth-20261119/test-v2.mjs
          node qa/sidebar-depth-20261119/test-v2.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidebar-depth-v2-evidence
          path: evidence/
          retention-days: 7
