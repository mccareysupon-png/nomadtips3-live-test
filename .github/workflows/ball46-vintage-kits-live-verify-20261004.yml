name: READ ONLY - Ball46 Vintage Kits Live Verify 20261004

on:
  push:
    branches:
      - work/ball46-vintage-kits-20261004
    paths:
      - '.github/workflows/ball46-vintage-kits-live-verify-20261004.yml'
      - '.github/scripts/ball46_vintage_kits_live_verify_20261004.sh'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify vintage kits on real Production cards
        shell: bash
        run: bash .github/scripts/ball46_vintage_kits_live_verify_20261004.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-vintage-kits-live-verify-${{ github.run_id }}
          path: deploy-assets/match-status-svg-20261003/audit/vintage-kits-live-verify/
          if-no-files-found: error
          retention-days: 14
