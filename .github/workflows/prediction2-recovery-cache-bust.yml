name: Prediction2 — Recovery Cache Bust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prediction2-recovery-cache-bust.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Bust recovered inline script cache
        shell: python
        run: |
          from pathlib import Path
          p = Path('nomad-live/prediction2.html')
          s = p.read_text(encoding='utf-8')
          old = 'prediction2-inline-analysis.js?v=20260903-inline-v1'
          new = 'prediction2-inline-analysis.js?v=20260903-recovery-v2'
          if old not in s:
              raise SystemExit('inline script tag not found; aborting')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit cache bust
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nomad-live/prediction2.html
          git commit -m 'Bust Prediction2 recovered interaction cache'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
