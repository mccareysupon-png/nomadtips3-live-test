name: Deploy Ball46 Statistics Sidebar Parity V2 20260920

on:
  push:
    branches: [work/ball46-statistics-workspace-v2-20260920]
    paths:
      - '.github/workflows/deploy-ball46-statistics-sidebar-parity-v2-20260920.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_URL: https://ball46.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  SOURCE_SHA: 927d133c3f43c0c73effcf3afa1e9760a93c5ee7
  PATCH_CSS: statistics-workspace-v2.css
  PATCH_JS: statistics-workspace-v2.js
  PATCH_VER: 343-stat-sidebar-parity-v2-20260920a
  EXPECT_ENGINE: nomad343-engine-v6.2-viewer-readonly-cron-referee-lock-v1
  EXPECT_HUB: nomad343-5usd-hub-v6-viewer-cache-only
  EXPECT_FULL_MARKET: nomad343-ball46-full-market-v6-server-prewarm-cache

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight current Production and lock runtime behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod /tmp/before /tmp/patch

          for page in index.html signal.html statistics.html; do
            curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/$page?sidebar-v2-before=$GITHUB_RUN_ID" -o "/tmp/prod/$page"
            test -s "/tmp/prod/$page"
          done
          grep -Fq 'data-next-stat-markets' /tmp/prod/statistics.html
          grep -Fq 'Results History' /tmp/prod/statistics.html

          cp "nomad-live-343/$PATCH_CSS" "/tmp/patch/$PATCH_CSS"
          cp "nomad-live-343/$PATCH_JS" "/tmp/patch/$PATCH_JS"
          grep -Fq 'BALL46_STAT_WORKSPACE_V2' "/tmp/patch/$PATCH_CSS"
          grep -Fq 'BALL46_STAT_WORKSPACE_V2' "/tmp/patch/$PATCH_JS"
          grep -Fq 'grid-template-columns: 190px minmax(0, 1fr)' "/tmp/patch/$PATCH_CSS"
          grep -Fq 'min-height: 34px' "/tmp/patch/$PATCH_CSS"
          grep -Fq 'grid-template-columns: repeat(2, minmax(0, 1fr))' "/tmp/patch/$PATCH_CSS"
          ! grep -Fq 'Statistics Center' "/tmp/patch/$PATCH_JS"
          ! grep -Eq 'fetch[[:space:]]*\(|XMLHttpRequest|/api/' "/tmp/patch/$PATCH_JS"

          for ep in engine hub full-market; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/api/$ep/health?sidebar-v2-before=$GITHUB_RUN_ID" -o "/tmp/before/$ep.json"
          done
          node - <<'NODE'
          const fs=require('fs');
          const exp={engine:process.env.EXPECT_ENGINE,hub:process.env.EXPECT_HUB,'full-market':process.env.EXPECT_FULL_MARKET};
          const out={};
          for(const n of ['engine','hub','full-market']){
            const j=JSON.parse(fs.readFileSync(`/tmp/before/${n}.json`,'utf8'));
            if(j?.ok!==true) throw Error(`PREFLIGHT_${n}_FAIL`);
            out[n]={version:String(j.version||''),component:String(j.component||''),staleCachePolicy:String(j.staleCachePolicy||'')};
            if(out[n].version!==exp[n]) throw Error(`${n}_BASE_CHANGED:${out[n].version}`);
          }
          fs.writeFileSync('/tmp/backend-before.json',JSON.stringify(out,null,2));
          console.log('BACKEND_BEFORE',JSON.stringify(out));
          NODE

          scan_code=$(curl -sS -L --max-time 25 -o /tmp/before/engine-scan.json -w '%{http_code}' "$BALL46_URL/api/engine/scan?sidebar-v2-lock=$GITHUB_RUN_ID")
          [ "$scan_code" = 403 ] || { echo "ENGINE_SCAN_BEHAVIOR_CHANGED:$scan_code"; cat /tmp/before/engine-scan.json; exit 1; }
          grep -Eq 'BALL46_VIEWER_READONLY_LOCK_V1|VIEWER_ENGINE_TRIGGER_DISABLED' /tmp/before/engine-scan.json || { echo ENGINE_SCAN_LOCK_MARKER_MISSING; cat /tmp/before/engine-scan.json; exit 1; }

          engine_odds_code=$(curl -sS -L --max-time 25 -o /tmp/before/engine-fixture-odds.json -w '%{http_code}' "$BALL46_URL/api/engine/fixture-odds?sidebar-v2-lock=$GITHUB_RUN_ID")
          [ "$engine_odds_code" = 403 ] || { echo "ENGINE_FIXTURE_ODDS_BEHAVIOR_CHANGED:$engine_odds_code"; cat /tmp/before/engine-fixture-odds.json; exit 1; }

          fm_code=$(curl -sS -L --max-time 25 -o /tmp/before/fullmarket-fixture-odds.json -w '%{http_code}' "$BALL46_URL/api/full-market/fixture-odds?sidebar-v2-lock=$GITHUB_RUN_ID")
          [ "$fm_code" = 400 ] || { echo "FULLMARKET_FIXTURE_ODDS_BEHAVIOR_CHANGED:$fm_code"; cat /tmp/before/fullmarket-fixture-odds.json; exit 1; }
          grep -Fq 'INVALID_FIXTURE_ID' /tmp/before/fullmarket-fixture-odds.json
          echo 'SIDEBAR_V2_PREFLIGHT_PASS'

      - name: Pin exact known Production wrapper source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_SHA" --no-tags
          git show "$SOURCE_SHA":workers/nomadtips3-343-preview/src/index.js > /tmp/pinned-index.js
          git show "$SOURCE_SHA":workers/nomadtips3-343-preview/wrangler.ball46.jsonc > /tmp/pinned-wrangler.jsonc

          grep -Fq "if (path === '/fixture-odds') return env.FULL_MARKET.fetch(fullMarketRequest(request, '/fixture-odds'));" /tmp/pinned-index.js
          grep -Fq "if (url.pathname.startsWith('/api/engine/'))" /tmp/pinned-index.js
          ! grep -Fq 'VIEWER_PROVIDER_FETCH_DISABLED' /tmp/pinned-index.js
          grep -Fq '"name": "ball46-production"' /tmp/pinned-wrangler.jsonc
          grep -Fq '"binding": "ENGINE", "service": "nomadtips3-engine-343"' /tmp/pinned-wrangler.jsonc
          grep -Fq '"binding": "HUB", "service": "nomadtips3-5usd-hub-343"' /tmp/pinned-wrangler.jsonc
          grep -Fq '"binding": "FULL_MARKET", "service": "nomadtips3-full-market-343-ball46"' /tmp/pinned-wrangler.jsonc

          cp /tmp/pinned-index.js workers/nomadtips3-343-preview/src/index.js
          cp /tmp/pinned-wrangler.jsonc workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          cmp -s /tmp/pinned-index.js workers/nomadtips3-343-preview/src/index.js
          cmp -s /tmp/pinned-wrangler.jsonc workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          echo 'PINNED_WRAPPER_GUARD_PASS'

      - name: Build static staging from current Production bytes only
        shell: bash
        run: |
          set -euo pipefail
          mv nomad-live-343 /tmp/repo-assets
          mkdir -p nomad-live-343 /tmp/names

          find /tmp/repo-assets -maxdepth 1 -type f -printf '%f\n' > /tmp/names/workspace.txt
          git ls-tree -r --name-only "$SOURCE_SHA" nomad-live-343/ | sed 's#^nomad-live-343/##' | awk 'index($0,"/")==0' > /tmp/names/source.txt
          python3 - <<'PY' > /tmp/names/htmlrefs.txt
          from pathlib import Path
          import re
          names=set()
          for p in Path('/tmp/prod').glob('*.html'):
              s=p.read_text(errors='ignore')
              for ref in re.findall(r'(?:src|href)=["\']([^"\']+)["\']',s,re.I):
                  x=ref.split('#',1)[0].split('?',1)[0].lstrip('/')
                  if x and '/' not in x and re.search(r'\.(?:html|js|css|svg|json|txt|xml|png|webp|jpg|jpeg|ico|woff|woff2)$',x,re.I): names.add(x)
          print('\n'.join(sorted(names)))
          PY
          cat /tmp/names/workspace.txt /tmp/names/source.txt /tmp/names/htmlrefs.txt | sort -u > /tmp/names/all.txt

          while IFS= read -r name; do
            [ -n "$name" ] || continue
            [ "$name" = "$PATCH_CSS" ] && continue
            [ "$name" = "$PATCH_JS" ] && continue
            case "$name" in *.html|*.js|*.css|*.svg|*.json|*.txt|*.xml|*.png|*.webp|*.jpg|*.jpeg|*.ico|*.woff|*.woff2) ;; *) continue ;; esac
            tmp="/tmp/prod-file-${name//\//_}"
            code=$(curl -sS -L --retry 3 --retry-all-errors --retry-delay 1 --max-time 20 -o "$tmp" -w '%{http_code}' "$BALL46_URL/$name?sidebar-v2-mirror=$GITHUB_RUN_ID") || code=000
            if [ "$code" = 200 ] && [ -s "$tmp" ]; then cp "$tmp" "nomad-live-343/$name"; fi
          done < /tmp/names/all.txt

          cp /tmp/prod/index.html nomad-live-343/index.html
          cp /tmp/prod/signal.html nomad-live-343/signal.html
          cp /tmp/prod/statistics.html nomad-live-343/statistics.html

          for f in signal-next.js statistics-next.js bulk-odds-compat-343.js odds-format-343.js full-market-bookmaker-343.js full-odds-main-343.js live-summary-full-odds-343.js dashboard-v2-stage3.js; do
            tmp="/tmp/protected-$f"
            code=$(curl -sS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 -o "$tmp" -w '%{http_code}' "$BALL46_URL/$f?sidebar-v2-protected=$GITHUB_RUN_ID") || code=000
            if [ "$code" = 200 ] && [ -s "$tmp" ]; then cp "$tmp" "nomad-live-343/$f"; fi
          done

          test -s nomad-live-343/index.html
          test -s nomad-live-343/signal.html
          test -s nomad-live-343/statistics.html
          count=$(find nomad-live-343 -maxdepth 1 -type f | wc -l)
          echo "PRODUCTION_STAGING_FILES=$count"
          [ "$count" -ge 100 ] || { echo STAGING_ASSET_COUNT_TOO_LOW; exit 1; }
          cp -a nomad-live-343 /tmp/sidebar-v2-before

      - name: Apply compact Page3 sidebar overlay only
        shell: bash
        run: |
          set -euo pipefail
          cp "/tmp/patch/$PATCH_CSS" "nomad-live-343/$PATCH_CSS"
          cp "/tmp/patch/$PATCH_JS" "nomad-live-343/$PATCH_JS"
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          p=Path('nomad-live-343/statistics.html')
          s=p.read_text()
          css=os.environ['PATCH_CSS']; js=os.environ['PATCH_JS']; ver=os.environ['PATCH_VER']
          s=re.sub(r'\s*<link[^>]+href=["\'][^"\']*statistics-workspace-v2\.css[^"\']*["\'][^>]*>','',s,flags=re.I)
          s=re.sub(r'\s*<script[^>]+src=["\'][^"\']*statistics-workspace-v2\.js[^"\']*["\'][^>]*>\s*</script>','',s,flags=re.I)
          if '</head>' not in s.lower() or '</body>' not in s.lower(): raise SystemExit('STATISTICS_HTML_STRUCTURE_INVALID')
          s=re.sub(r'</head>',f'\n<link rel="stylesheet" href="{css}?v={ver}" data-ball46-phase="statistics-sidebar-parity-v2">\n</head>',s,count=1,flags=re.I)
          s=re.sub(r'</body>',f'\n<script src="{js}?v={ver}" defer data-ball46-phase="statistics-sidebar-parity-v2"></script>\n</body>',s,count=1,flags=re.I)
          p.write_text(s)
          PY
          grep -Fq "$PATCH_CSS?v=$PATCH_VER" nomad-live-343/statistics.html
          grep -Fq "$PATCH_JS?v=$PATCH_VER" nomad-live-343/statistics.html
          echo 'SIDEBAR_V2_PATCH_APPLIED'

      - name: Scope guard - Page3 overlay only
        shell: bash
        run: |
          set -euo pipefail
          diff -qr /tmp/sidebar-v2-before nomad-live-343 > /tmp/sidebar-v2.diff || true
          cat /tmp/sidebar-v2.diff
          [ -s /tmp/sidebar-v2.diff ]
          if grep -Ev 'statistics\.html|statistics-workspace-v2\.css|statistics-workspace-v2\.js' /tmp/sidebar-v2.diff | grep -q .; then
            echo 'UNEXPECTED_SIDEBAR_V2_DIFF'; exit 1
          fi
          cmp -s /tmp/prod/index.html nomad-live-343/index.html || { echo PAGE1_HTML_CHANGED; exit 1; }
          cmp -s /tmp/prod/signal.html nomad-live-343/signal.html || { echo PAGE2_HTML_CHANGED; exit 1; }
          echo 'SIDEBAR_V2_SCOPE_GUARD_PASS'

      - name: Protected runtime guard
        shell: bash
        run: |
          set -euo pipefail
          for f in signal-next.js statistics-next.js bulk-odds-compat-343.js odds-format-343.js full-market-bookmaker-343.js full-odds-main-343.js live-summary-full-odds-343.js dashboard-v2-stage3.js; do
            [ -f "nomad-live-343/$f" ] || continue
            tmp="/tmp/runtime-check-$f"
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_URL/$f?sidebar-v2-guard=$GITHUB_RUN_ID" -o "$tmp"
            cmp -s "$tmp" "nomad-live-343/$f" || { echo "PROTECTED_RUNTIME_DIFF:$f"; exit 1; }
          done
          cmp -s /tmp/pinned-index.js workers/nomadtips3-343-preview/src/index.js
          cmp -s /tmp/pinned-wrangler.jsonc workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          echo 'SIDEBAR_V2_RUNTIME_GUARD_PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and dry-run
        shell: bash
        run: |
          set -euo pipefail
          node --check "nomad-live-343/$PATCH_JS"
          node --check workers/nomadtips3-343-preview/src/index.js
          ! grep -Eq 'fetch[[:space:]]*\(|XMLHttpRequest|/api/' "nomad-live-343/$PATCH_JS"
          npx --yes wrangler@4.92.0 deploy --dry-run --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc

      - name: Race guard immediately before deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/race
          for page in index.html signal.html statistics.html; do
            curl -fsS -L --retry 3 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_URL/$page?sidebar-v2-race=$GITHUB_RUN_ID" -o "/tmp/race/$page"
            cmp -s "/tmp/prod/$page" "/tmp/race/$page" || { echo "PRODUCTION_CHANGED_DURING_PREP:$page"; exit 1; }
          done
          for ep in engine hub full-market; do
            curl -fsS -L --max-time 25 "$BALL46_URL/api/$ep/health?sidebar-v2-race=$GITHUB_RUN_ID" -o "/tmp/race/$ep.json"
          done
          node - <<'NODE'
          const fs=require('fs'); const before=JSON.parse(fs.readFileSync('/tmp/backend-before.json','utf8'));
          for(const n of ['engine','hub','full-market']){
            const j=JSON.parse(fs.readFileSync(`/tmp/race/${n}.json`,'utf8'));
            if(j?.ok!==true || String(j.version||'')!==before[n].version) throw Error(`RACE_${n}_CHANGED`);
          }
          NODE
          fm_code=$(curl -sS -L --max-time 25 -o /tmp/race/fm.json -w '%{http_code}' "$BALL46_URL/api/full-market/fixture-odds?sidebar-v2-race=$GITHUB_RUN_ID")
          [ "$fm_code" = 400 ] && grep -Fq 'INVALID_FIXTURE_ID' /tmp/race/fm.json
          scan_code=$(curl -sS -L --max-time 25 -o /tmp/race/scan.json -w '%{http_code}' "$BALL46_URL/api/engine/scan?sidebar-v2-race=$GITHUB_RUN_ID")
          [ "$scan_code" = 403 ]
          echo 'SIDEBAR_V2_RACE_GUARD_PASS'

      - name: Deploy compact sidebar parity only
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config workers/nomadtips3-343-preview/wrangler.ball46.jsonc

      - name: Post-deploy verify UI and system invariants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/after
          for n in $(seq 1 15); do
            if curl -fsS -L --max-time 25 "$BALL46_URL/statistics.html?sidebar-v2-after=$GITHUB_RUN_ID-$n" -o /tmp/after/statistics.html && grep -Fq "$PATCH_CSS?v=$PATCH_VER" /tmp/after/statistics.html && grep -Fq "$PATCH_JS?v=$PATCH_VER" /tmp/after/statistics.html; then break; fi
            sleep 2
          done
          grep -Fq "$PATCH_CSS?v=$PATCH_VER" /tmp/after/statistics.html
          grep -Fq "$PATCH_JS?v=$PATCH_VER" /tmp/after/statistics.html
          curl -fsS -L --max-time 25 "$BALL46_URL/$PATCH_CSS?v=$PATCH_VER" -o /tmp/after/$PATCH_CSS
          curl -fsS -L --max-time 25 "$BALL46_URL/$PATCH_JS?v=$PATCH_VER" -o /tmp/after/$PATCH_JS
          grep -Fq 'grid-template-columns: 190px minmax(0, 1fr)' /tmp/after/$PATCH_CSS
          grep -Fq 'min-height: 34px' /tmp/after/$PATCH_CSS
          grep -Fq 'grid-template-columns: repeat(2, minmax(0, 1fr))' /tmp/after/$PATCH_CSS
          ! grep -Fq 'Statistics Center' /tmp/after/$PATCH_JS

          curl -fsS -L --max-time 25 "$BALL46_URL/index.html?sidebar-v2-page1=$GITHUB_RUN_ID" -o /tmp/after/index.html
          curl -fsS -L --max-time 25 "$BALL46_URL/signal.html?sidebar-v2-page2=$GITHUB_RUN_ID" -o /tmp/after/signal.html
          cmp -s /tmp/prod/index.html /tmp/after/index.html || { echo PAGE1_POSTDEPLOY_CHANGED; exit 1; }
          cmp -s /tmp/prod/signal.html /tmp/after/signal.html || { echo PAGE2_POSTDEPLOY_CHANGED; exit 1; }

          for f in signal-next.js statistics-next.js bulk-odds-compat-343.js odds-format-343.js full-market-bookmaker-343.js full-odds-main-343.js live-summary-full-odds-343.js dashboard-v2-stage3.js; do
            [ -f "nomad-live-343/$f" ] || continue
            curl -fsS -L --max-time 25 "$BALL46_URL/$f?sidebar-v2-runtime-after=$GITHUB_RUN_ID" -o "/tmp/after/$f"
            cmp -s "nomad-live-343/$f" "/tmp/after/$f" || { echo "POST_RUNTIME_CHANGED:$f"; exit 1; }
          done

          for ep in engine hub full-market; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/api/$ep/health?sidebar-v2-after=$GITHUB_RUN_ID" -o "/tmp/after/$ep.json"
          done
          node - <<'NODE'
          const fs=require('fs'); const before=JSON.parse(fs.readFileSync('/tmp/backend-before.json','utf8'));
          for(const n of ['engine','hub','full-market']){
            const j=JSON.parse(fs.readFileSync(`/tmp/after/${n}.json`,'utf8'));
            if(j?.ok!==true) throw Error(`POST_${n}_FAIL`);
            for(const k of ['version','component','staleCachePolicy']){
              if(String(j[k]||'')!==before[n][k]) throw Error(`${n}_${k}_CHANGED`);
            }
          }
          NODE

          scan_code=$(curl -sS -L --max-time 25 -o /tmp/after/engine-scan.json -w '%{http_code}' "$BALL46_URL/api/engine/scan?sidebar-v2-lock-after=$GITHUB_RUN_ID")
          [ "$scan_code" = 403 ]
          grep -Eq 'BALL46_VIEWER_READONLY_LOCK_V1|VIEWER_ENGINE_TRIGGER_DISABLED' /tmp/after/engine-scan.json
          engine_odds_code=$(curl -sS -L --max-time 25 -o /tmp/after/engine-fixture-odds.json -w '%{http_code}' "$BALL46_URL/api/engine/fixture-odds?sidebar-v2-lock-after=$GITHUB_RUN_ID")
          [ "$engine_odds_code" = 403 ]
          fm_code=$(curl -sS -L --max-time 25 -o /tmp/after/fullmarket-fixture-odds.json -w '%{http_code}' "$BALL46_URL/api/full-market/fixture-odds?sidebar-v2-lock-after=$GITHUB_RUN_ID")
          [ "$fm_code" = 400 ]
          grep -Fq 'INVALID_FIXTURE_ID' /tmp/after/fullmarket-fixture-odds.json

          echo 'BALL46_STAT_SIDEBAR_PARITY_V2_PASS'
