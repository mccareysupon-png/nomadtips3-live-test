name: Engine343 Best19 Canary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-engine343-best19-20260918.yml'

permissions:
  contents: write

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  WORK_BRANCH: work/343-best-price-19book-20260918
  CANARY_URL: https://nomadtips3-engine-343-best19-canary.mccarey-supon.workers.dev

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORK_BRANCH }}
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Apply deterministic Best19 patch
        run: |
          set -euo pipefail
          python scripts/patch_engine343_best19.py
          node --check workers/nomadtips3-engine-343/src/index-bulk.js
          grep -Fq "nomad343-engine-v5-best19-referee" workers/nomadtips3-engine-343/src/index-bulk.js
          grep -Fq "BEST_OF_19_INPLAY" workers/nomadtips3-engine-343/src/index-bulk.js
          grep -Fq 'binding = "FULL_MARKET"' workers/nomadtips3-engine-343/wrangler.toml

      - name: Save patched work branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workers/nomadtips3-engine-343
          git commit -m 'feat(343): add 19-book same-line best-price referee' || true
          git push origin HEAD:${WORK_BRANCH}

      - name: Dry-run canary
        working-directory: workers/nomadtips3-engine-343
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.canary.toml

      - name: Deploy isolated canary
        working-directory: workers/nomadtips3-engine-343
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.canary.toml

      - name: Verify Best19 live price referee
        run: |
          set -euo pipefail
          sleep 3
          curl -fsS --max-time 30 "$CANARY_URL/referee?market=ft_1x2&selection=HOME" -o /tmp/one.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/one.json'));
          if(j.ok!==true) throw Error(JSON.stringify(j));
          if(Number(j.bookmakerCount)!==19) throw Error(`books=${j.bookmakerCount}`);
          const valid=(j.offers||[]).filter(x=>x.pass&&Number(x.odds)>0);
          if(!valid.length||!j.best) throw Error('No valid 1X2 offers');
          const max=Math.max(...valid.map(x=>Number(x.odds)));
          if(Math.abs(Number(j.best.odds)-max)>1e-9) throw Error(`best=${j.best.odds} max=${max}`);
          fs.writeFileSync('/tmp/id',String(j.fixtureId));
          console.log('BEST19_1X2_PASS',j.fixtureId,j.best.bookmaker,j.best.odds,j.offerCount,j.fullMarket);
          NODE
          ID="$(cat /tmp/id)"
          for item in "ft_ah HOME" "ft_over OVER"; do
            market="${item%% *}"; selection="${item##* }"
            code="$(curl -sS --max-time 30 -o /tmp/line.json -w '%{http_code}' "$CANARY_URL/referee?fixtureId=$ID&market=$market&selection=$selection")"
            if [ "$code" = 409 ]; then echo "${market}: canonical line unavailable on sample; skipped"; continue; fi
            test "$code" = 200
            MARKET="$market" node - <<'NODE'
            const fs=require('fs');
            const j=JSON.parse(fs.readFileSync('/tmp/line.json'));
            const market=process.env.MARKET;
            if(j.ok!==true||Number(j.bookmakerCount)!==19) throw Error(JSON.stringify(j));
            const valid=(j.offers||[]).filter(x=>x.pass&&Number(x.odds)>0);
            if(valid.length){
              const max=Math.max(...valid.map(x=>Number(x.odds)));
              if(!j.best||Math.abs(Number(j.best.odds)-max)>1e-9) throw Error(`${market}: best price is not maximum`);
              for(const x of valid){
                if(Math.abs(Number(x.providerLine)-Number(j.canonicalProviderLine))>0.001) throw Error(`${market}: mixed market lines`);
              }
            }
            console.log('BEST19_SAME_LINE_PASS',market,j.canonicalProviderLine,j.best,j.offerCount,j.fullMarket);
            NODE
          done
          echo 'ENGINE343_BEST19_CANARY_PASS'
