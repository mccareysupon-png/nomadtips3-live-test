name: BALL46 MEMBER Half Results — READ ONLY Live Audit
on:
  push:
    branches: [deploy/member-fold-half-20261021]
    paths:
      - '.github/workflows/member-half-results-audit-20261021.yml'
permissions:
  contents: read
jobs:
  live-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect exact active Cloudflare Worker and current public assets, no writes
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const A=process.env.CLOUDFLARE_ACCOUNT_ID,T=process.env.CLOUDFLARE_API_TOKEN;
          assert(A&&T,'CLOUDFLARE_CREDENTIALS_MISSING');
          const api='https://api.cloudflare.com/client/v4/accounts/'+A;
          async function cf(path){
            const r=await fetch(api+path,{headers:{Authorization:'Bearer '+T},signal:AbortSignal.timeout(25000)});
            const j=await r.json();assert(r.ok&&j.success,'CLOUDFLARE_READ_FAILED '+path+' '+r.status);
            return j.result;
          }
          const sha=bytes=>createHash('sha256').update(bytes).digest('hex');
          const worker='ball46-member-production';
          const deployments=await cf('/workers/scripts/'+worker+'/deployments?per_page=1');
          const dep=deployments.deployments?.[0];
          assert(dep?.versions?.length===1&&Number(dep.versions[0].percentage)===100,'ACTIVE_VERSION_NOT_SINGLE_100');
          const version=dep.versions[0].version_id;
          const detail=await cf('/workers/workers/'+worker+'/versions/'+version+'?include=modules');
          const publicFiles={};
          for (const path of ['/member.js','/styles.css','/member.html','/member-loading.js','/member-loading.css']){
            const url=new URL(path,'https://member.ball46.com');
            url.searchParams.set('_halfAudit',Date.now().toString(36));
            const r=await fetch(url,{headers:{'cache-control':'no-cache'},redirect:'manual',signal:AbortSignal.timeout(25000)});
            const bytes=Buffer.from(await r.arrayBuffer());
            publicFiles[path]={status:r.status,sha256:sha(bytes),size:bytes.length};
            if(path==='/member.js'){
              const js=bytes.toString('utf8');
              const matches=(js.match(/\['WIN',s\.win,'win'\]/g)||[]).length;
              const losses=(js.match(/\['LOSS',s\.loss,'loss'\]/g)||[]).length;
              const target=js.indexOf('function renderSummary()');
              publicFiles[path].countSource={winOld:matches,lossOld:losses,summaryPresent:target>=0,
                alreadyMerged:js.includes("Number(s.win||0)+Number(s.halfWin||0)"),
                safeExcerpt:target<0?'MISSING':js.slice(target,target+650).replaceAll('\n',' ').slice(0,650),
                hasSignalV3:js.includes('b46-member-eventflow-signal-v3-20261020'),
                hasDataReady:js.includes('ball46:member-data-ready')};
            }
            if(path==='/styles.css')publicFiles[path].hasSignalV3=bytes.includes(Buffer.from('B46_MEMBER_EVENTFLOW_SIGNAL_V3_20261020'));
          }
          const h=await fetch('https://member.ball46.com/api/health',{signal:AbortSignal.timeout(25000)});
          const hb=await h.text();
          console.log('BALL46_MEMBER_READONLY_AUDIT',JSON.stringify({
            activeVersion:version,deploymentId:dep.id,
            runtime:detail.modules?.map(m=>({name:m.name,sha256:sha(Buffer.from(m.content_base64,'base64'))})),
            bindings:detail.bindings?.map(b=>({name:b.name,type:b.type})),
            assetsConfig:detail.assets?.config,
            health:{status:h.status,sample:hb.slice(0,300)},
            publicFiles
          }));
          JS
