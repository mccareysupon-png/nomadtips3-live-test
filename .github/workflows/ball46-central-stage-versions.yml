name: BALL46 stage central transport versions without activation
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-central-stage-versions.yml']
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test qa/prematch-history-20261120/*.test.mjs
      - name: Validate exact active source and upload inactive versions
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node qa/prematch-history-20261120/central-stage-versions.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: central-staged-versions
          path: evidence/

# Verify staged version read propagation, never activate a deployment.
