name: NOMAD 3.41 Match Scout Registry

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'nomad341-match-scout-registry/**'
      - '.github/workflows/nomad341-match-scout-registry-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'nomad341-match-scout-registry/**'
      - '.github/workflows/nomad341-match-scout-registry-deploy.yml'

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  REGISTRY_URL: https://nomad341-match-scout-registry.mccarey-supon.workers.dev

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nomad341-match-scout-registry
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax check
        run: npm run check
      - name: Registry tests
        run: npm test
      - name: Wrangler dry run
        if: github.event_name != 'pull_request' || env.CF_API_TOKEN != ''
        run: npx --yes wrangler@4.92.0 deploy --dry-run

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate Cloudflare credentials
        run: |
          test -n "$CF_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Deploy isolated Match Scout Registry
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: nomad341-match-scout-registry
          wranglerVersion: '4.92.0'
          command: deploy
      - name: Smoke-test registry health
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 20 "$REGISTRY_URL/health?t=$(date +%s)" -o /tmp/registry-health.json \
              && grep -Fq '"ok":true' /tmp/registry-health.json \
              && grep -Fq 'nomad341-match-scout-registry' /tmp/registry-health.json; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1 || { echo '::error::Match Scout Registry health check failed'; exit 1; }
          echo 'Match Scout Registry is healthy and isolated from Core 3.41.'
