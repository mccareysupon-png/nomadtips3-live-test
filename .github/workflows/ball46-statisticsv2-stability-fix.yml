name: Ball46 StatisticsV2 Stability Fix
on:
  push:
    branches: [work/ball46-current-production-fallback-fix-20261006]
    paths:
      - '.github/workflows/ball46-statisticsv2-stability-fix.yml'
      - 'deploy-assets/match-status-svg-20261003/statisticsv2-stability-fix.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ball46-statisticsv2-stability-fix
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: deploy-assets/match-status-svg-20261003
        run: npm ci --ignore-scripts --no-audit --no-fund
      - working-directory: deploy-assets/match-status-svg-20261003
        run: node statisticsv2-stability-fix.mjs
