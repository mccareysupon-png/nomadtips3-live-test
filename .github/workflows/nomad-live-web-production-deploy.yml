name: Deploy NOMAD Live 3.41 Web Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nomad-live/**'
      - 'nomad-live-web-production/**'
      - '.github/workflows/nomad-live-web-production-deploy.yml'

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PROD_WORKER_URL: https://nomadtips3-live-web-production.mccarey-supon.workers.dev
  CUSTOM_URL: https://www.nomadtips3.com
  BACKUP_URL: https://mccareysupon-png.github.io/nomadtips3-live-test

jobs:
  validate-preview-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate 3.41 production web source
        run: |
          set -euo pipefail
          node --check nomad-live-web-production/src/index.js
          test -f nomad-live/index.html
          test -f nomad-live/statistics.html
          test -f nomad-live/runtime-config.js
          grep -q 'NOMAD LIVE 3.41' nomad-live/index.html
          grep -q 'Live Asian Handicap scanner' nomad-live/index.html
          grep -q "'www.nomadtips3.com','nomadtips3.com'" nomad-live/runtime-config.js
          grep -q 'nomadtips3-live-engine.mccarey-supon.workers.dev' nomad-live/runtime-config.js
          grep -q '"service": "nomadtips3-live-engine"' nomad-live-web-production/wrangler.production.jsonc
          grep -q '"pattern": "www.nomadtips3.com/\*"' nomad-live-web-production/wrangler.production.jsonc
          grep -q '"zone_name": "nomadtips3.com"' nomad-live-web-production/wrangler.production.jsonc
          echo '3.41 production web source validated'

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CF_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Dry-run preview and production bundles
        working-directory: nomad-live-web-production
        run: |
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.preview.jsonc
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.production.jsonc

      - name: Record old web backup before cutover
        shell: bash
        run: |
          set +e
          echo "Old web remains preserved at: $BACKUP_URL"
          curl -fsSL --max-time 20 "$BACKUP_URL/?precutover=$(date +%s)" -o /tmp/old-web.html
          if grep -q 'Live soccer analysis' /tmp/old-web.html 2>/dev/null; then
            echo 'Old GitHub Pages web backup confirmed before cutover.'
          else
            echo '::warning::Old GitHub Pages marker was not confirmed; no files will be deleted.'
          fi

      - name: Deploy 3.41 production Worker to workers.dev first
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: nomad-live-web-production
          wranglerVersion: '4.92.0'
          command: deploy --config wrangler.preview.jsonc

      - name: Smoke-test production Worker before touching www route
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 20 "$PROD_WORKER_URL/__nomad_release?t=$(date +%s)" -o /tmp/release.json \
              && grep -q 'nomadtips3-live-web-production' /tmp/release.json \
              && grep -q '"version":"3.41"' /tmp/release.json; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1 || { echo '::error::Production Worker preview did not become healthy; www route left untouched'; exit 1; }

          curl -fsS --max-time 20 "$PROD_WORKER_URL/?t=$(date +%s)" -o /tmp/home.html
          grep -q 'NOMAD LIVE 3.41' /tmp/home.html
          grep -q 'Live Asian Handicap scanner' /tmp/home.html

          curl -fsS --max-time 20 "$PROD_WORKER_URL/api/health?t=$(date +%s)" -o /tmp/engine-health.json
          test -s /tmp/engine-health.json
          echo 'Production Worker + static assets + Production Engine binding passed before cutover.'

      - name: Cut over www route to NOMAD Live 3.41
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: nomad-live-web-production
          wranglerVersion: '4.92.0'
          command: deploy --config wrangler.production.jsonc

      - name: Verify www now serves 3.41
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 20 "$CUSTOM_URL/__nomad_release?t=$(date +%s)" -o /tmp/custom-release.json \
              && grep -q 'nomadtips3-live-web-production' /tmp/custom-release.json \
              && grep -q '"version":"3.41"' /tmp/custom-release.json; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1 || { echo '::error::www route did not verify as NOMAD Live 3.41'; exit 1; }

          curl -fsS --max-time 20 "$CUSTOM_URL/?t=$(date +%s)" -o /tmp/custom-home.html
          grep -q 'NOMAD LIVE 3.41' /tmp/custom-home.html
          grep -q 'Live Asian Handicap scanner' /tmp/custom-home.html

          curl -fsS --max-time 20 "$CUSTOM_URL/statistics.html?t=$(date +%s)" -o /tmp/custom-statistics.html
          grep -q 'Statistics' /tmp/custom-statistics.html

          curl -fsS --max-time 20 "$CUSTOM_URL/api/health?t=$(date +%s)" -o /tmp/custom-engine-health.json
          test -s /tmp/custom-engine-health.json
          echo 'NOMAD Live 3.41 is active on www.nomadtips3.com.'
          echo "Old web remains preserved off the production route at: $BACKUP_URL"
