name: Deploy NOMAD Live 3.41 Web Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nomad-live/**'
      - 'nomad-live-342/runtime-config.js'
      - 'nomad-live-web-production/**'
      - '.github/workflows/nomad-live-web-production-deploy.yml'

permissions:
  contents: read

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CANARY_URL: https://nomadtips3-live-web-production-canary.mccarey-supon.workers.dev
  CUSTOM_URL: https://www.nomadtips3.com
  BACKUP_URL: https://mccareysupon-png.github.io/nomadtips3-live-test

jobs:
  validate-canary-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate 3.41 production web source
        run: |
          set -euo pipefail
          node --check nomad-live-web-production/src/index.js
          node --check nomad-live/runtime.js
          node --check nomad-live/live-filter-lock.js
          node --check nomad-live-342/runtime-config.js
          test -f nomad-live/index.html
          test -f nomad-live/statistics.html
          test -f nomad-live/runtime-config.js
          test -f nomad-live-342/index.html
          grep -Fq 'src="runtime-config.js' nomad-live/index.html
          grep -Fq 'Live Asian Handicap scanner' nomad-live/index.html
          grep -Fq 'live-filter-lock.js?v=20260828-default-all-v1' nomad-live/index.html
          grep -Fq 'Live Score & Event Monitor' nomad-live-342/index.html
          grep -Fq "'www.nomadtips3.com'" nomad-live/runtime-config.js
          grep -Fq "'nomadtips3.com'" nomad-live/runtime-config.js
          grep -Fq "'nomadtips3-live-web-production-canary.mccarey-supon.workers.dev'" nomad-live/runtime-config.js
          grep -Fq "'mccareysupon-png.github.io'" nomad-live/runtime-config.js
          grep -Fq "transport:directProduction?'direct':'service-binding'" nomad-live/runtime-config.js
          grep -Fq 'nomadtips3-live-engine.mccarey-supon.workers.dev' nomad-live/runtime-config.js
          grep -Fq "'www.nomadtips3.com'" nomad-live-342/runtime-config.js
          grep -Fq "'nomadtips3.com'" nomad-live-342/runtime-config.js
          grep -Fq "transport:sameOriginProduction?'same-origin':'direct-worker'" nomad-live-342/runtime-config.js
          grep -Fq "NOMAD342_PREFIX+'/feed'" nomad-live-web-production/src/index.js
          grep -Fq 'env.EVENT_ENGINE.fetch' nomad-live-web-production/src/index.js
          grep -Fq '"name": "nomadtips3-live-web-production-canary"' nomad-live-web-production/wrangler.preview.jsonc
          grep -Fq '"binding": "EVENT_ENGINE"' nomad-live-web-production/wrangler.preview.jsonc
          grep -Fq '"service": "nomadtips3-live-engine-342-test"' nomad-live-web-production/wrangler.preview.jsonc
          grep -Fq '"service": "nomadtips3-live-engine"' nomad-live-web-production/wrangler.production.jsonc
          grep -Fq '"binding": "EVENT_ENGINE"' nomad-live-web-production/wrangler.production.jsonc
          grep -Fq '"service": "nomadtips3-live-engine-342-test"' nomad-live-web-production/wrangler.production.jsonc
          grep -Fq '"workers_dev": false' nomad-live-web-production/wrangler.production.jsonc
          if grep -Fq '"routes"' nomad-live-web-production/wrangler.production.jsonc; then
            echo '::error::Production routes must stay dashboard-managed; remove routes from Wrangler config.'
            exit 1
          fi
          echo '3.41 production web + isolated 3.42 same-origin feed transport validated'

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CF_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Dry-run canary and production bundles
        working-directory: nomad-live-web-production
        run: |
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.preview.jsonc
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.production.jsonc

      - name: Record old web backup before cutover
        shell: bash
        run: |
          set +e
          echo "Old web remains preserved at: $BACKUP_URL"
          curl -fsSL --max-time 20 "$BACKUP_URL/?precutover=$(date +%s)" -o /tmp/old-web.html
          if grep -Fq 'Live soccer analysis' /tmp/old-web.html 2>/dev/null; then
            echo 'Old GitHub Pages web backup confirmed before cutover.'
          else
            echo '::warning::Old GitHub Pages marker was not confirmed; no files will be deleted.'
          fi

      - name: Deploy isolated 3.41 production canary
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: nomad-live-web-production
          wranglerVersion: '4.92.0'
          command: deploy --config wrangler.preview.jsonc

      - name: Smoke-test canary before touching Production Worker
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 20 "$CANARY_URL/__nomad_release?t=$(date +%s)" -o /tmp/release.json \
              && grep -Fq 'nomadtips3-live-web-production' /tmp/release.json \
              && grep -Fq '"version":"3.41"' /tmp/release.json; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1 || { echo '::error::Production canary did not become healthy; Production Worker left untouched'; exit 1; }

          curl -fsS --max-time 20 "$CANARY_URL/?t=$(date +%s)" -o /tmp/home.html
          grep -Fq 'src="runtime-config.js' /tmp/home.html
          grep -Fq 'Live Asian Handicap scanner' /tmp/home.html

          for endpoint in health feed statistics config; do
            curl -fsS --max-time 20 "$CANARY_URL/api/$endpoint?t=$(date +%s)" -o "/tmp/canary-$endpoint.json"
            test -s "/tmp/canary-$endpoint.json"
          done

          curl -fsSL --max-time 20 "$CANARY_URL/nomad-live-342/?t=$(date +%s)" -o /tmp/canary-342.html
          grep -Fq 'Live Score & Event Monitor' /tmp/canary-342.html
          grep -Fq 'event-monitor.js?v=' /tmp/canary-342.html

          curl -fsS --max-time 35 "$CANARY_URL/nomad-live-342/feed?force=1&t=$(date +%s)" -o /tmp/canary-342-feed.json
          FEED_FILE=/tmp/canary-342-feed.json python - <<'PY'
          import json, os
          data=json.load(open(os.environ['FEED_FILE'],encoding='utf-8'))
          assert str(data.get('version'))=='3.42', data.get('version')
          assert isinstance(data.get('matches'),list), type(data.get('matches')).__name__
          assert data.get('ok') is not False, data.get('lastError') or data.get('error')
          print('CANARY_342_FEED_OK matches=',len(data['matches']))
          PY
          echo 'Canary + 3.41 assets/API + 3.42 same-origin feed passed before Production deploy.'

      - name: Deploy Production Worker with dashboard-managed www route
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: nomad-live-web-production
          wranglerVersion: '4.92.0'
          command: deploy --config wrangler.production.jsonc

      - name: Verify www now serves 3.41 and isolated 3.42 route
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 12); do
            if curl -fsS --max-time 20 "$CUSTOM_URL/__nomad_release?t=$(date +%s)" -o /tmp/custom-release.json \
              && grep -Fq 'nomadtips3-live-web-production' /tmp/custom-release.json \
              && grep -Fq '"version":"3.41"' /tmp/custom-release.json; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1 || { echo '::error::www route did not verify as NOMAD Live 3.41'; exit 1; }

          curl -fsS --max-time 20 "$CUSTOM_URL/?t=$(date +%s)" -o /tmp/custom-home.html
          grep -Fq 'src="runtime-config.js' /tmp/custom-home.html
          grep -Fq 'Live Asian Handicap scanner' /tmp/custom-home.html

          curl -fsSL --max-time 20 "$CUSTOM_URL/statistics.html?t=$(date +%s)" -o /tmp/custom-statistics.html
          grep -Fq 'Statistics' /tmp/custom-statistics.html

          for endpoint in health feed statistics config; do
            curl -fsS --max-time 20 "$CUSTOM_URL/api/$endpoint?t=$(date +%s)" -o "/tmp/custom-$endpoint.json"
            test -s "/tmp/custom-$endpoint.json"
          done

          curl -fsSL --max-time 20 "$CUSTOM_URL/nomad-live-342/?t=$(date +%s)" -o /tmp/custom-342.html
          grep -Fq 'Live Score & Event Monitor' /tmp/custom-342.html
          grep -Fq 'event-monitor.js?v=' /tmp/custom-342.html

          feed_ok=0
          for attempt in $(seq 1 8); do
            if curl -fsS --max-time 35 "$CUSTOM_URL/nomad-live-342/feed?force=1&t=$(date +%s)" -o /tmp/custom-342-feed.json; then
              if FEED_FILE=/tmp/custom-342-feed.json python - <<'PY'
          import json, os, sys
          try:
              data=json.load(open(os.environ['FEED_FILE'],encoding='utf-8'))
          except Exception as e:
              print('FEED_JSON_ERROR',repr(e)); sys.exit(1)
          if str(data.get('version'))!='3.42' or not isinstance(data.get('matches'),list) or data.get('ok') is False:
              print('FEED_CONTRACT_BAD',data.get('version'),type(data.get('matches')).__name__,data.get('lastError') or data.get('error')); sys.exit(1)
          print('WWW_342_FEED_OK matches=',len(data['matches']))
          PY
              then
                feed_ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$feed_ok" = 1 || { echo '::error::www 3.42 same-origin feed did not become healthy'; exit 1; }

          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome" || { echo '::error::Chrome missing for 3.42 browser transport verification'; exit 1; }
          browser_ok=0
          for attempt in $(seq 1 8); do
            "$chrome" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=18000 --dump-dom "$CUSTOM_URL/nomad-live-342/?transport=$(date +%s)" >/tmp/custom-342-dom.html 2>/tmp/custom-342-browser.log || true
            if grep -Fq 'event pass' /tmp/custom-342-dom.html && ! grep -Fq '3.42 EVENT FEED WAIT' /tmp/custom-342-dom.html; then
              browser_ok=1
              break
            fi
            sleep 5
          done
          if [ "$browser_ok" != 1 ]; then
            echo '--- 3.42 BROWSER ERRORS ---'
            grep -Ei 'error|failed|cors|uncaught|exception|ERR_' /tmp/custom-342-browser.log | tail -120 || true
            echo '::error::www browser did not consume the 3.42 same-origin feed'
            exit 1
          fi

          echo 'NOMAD Live 3.41 remains active on www.nomadtips3.com.'
          echo 'NOMAD Live 3.42 same-origin feed transport is healthy at /nomad-live-342/feed.'
          echo 'NOMAD Live 3.42 browser consumed the production feed without EVENT FEED WAIT.'
          echo "Old web remains preserved off the production route at: $BACKUP_URL"
