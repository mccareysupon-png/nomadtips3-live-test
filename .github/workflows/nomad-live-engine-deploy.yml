name: Deploy NOMAD Live Engine

on:
  push:
    branches: [main]
    paths:
      - "nomad-live-engine/**"
      - ".github/workflows/nomad-live-engine-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  ENGINE_URL: https://nomadtips3-live-engine.mccarey-supon.workers.dev

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Offline parser detector and settlement tests
        working-directory: nomad-live-engine
        run: node --test
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Deploy isolated Worker and Cron
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: nomad-live-engine
          wranglerVersion: "4"
          command: deploy
      - name: Wake engine and verify first live cycle
        shell: bash
        run: |
          curl -fsS "$ENGINE_URL/health" >/tmp/health.json || true
          for i in $(seq 1 24); do
            BODY=$(curl -fsS "$ENGINE_URL/health" || true)
            printf '%s\n' "$BODY"
            if printf '%s' "$BODY" | grep -Eq '"lastSuccess":"[^"]+"'; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Worker deployed but no successful source cycle was observed"
          exit 1
      - name: Publish deploy commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE=error
          DESCRIPTION="NOMAD live engine deploy failed"
          if [ "$JOB_STATUS" = "success" ]; then
            STATE=success
            DESCRIPTION="Worker deployed and first live cycle succeeded"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            DESCRIPTION="NOMAD live engine deploy cancelled"
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"nomad-live-engine/deploy\",\"description\":\"${DESCRIPTION}\"}"
