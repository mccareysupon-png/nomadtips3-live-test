name: Deploy NOMAD Live Engine

on:
  push:
    branches: [main]
    paths:
      - "nomad-live-engine/**"
      - ".github/workflows/nomad-live-engine-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  ENGINE_URL: https://nomadtips3-live-engine.mccarey-supon.workers.dev

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Offline parser detector settlement and market tests
        working-directory: nomad-live-engine
        run: |
          node --test
          node --check src/index.js
          node --check src/real-market.js
          node --check src/price-sources.js
          node --check src/the-odds-api.js
          node --check src/api-football.js
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Deploy isolated Worker and Cron
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_API_TOKEN }}
          accountId: ${{ env.CF_ACCOUNT_ID }}
          workingDirectory: nomad-live-engine
          wranglerVersion: "4"
          command: deploy
      - name: Configure Odds-API.io key for 1xBet market feed
        working-directory: nomad-live-engine
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          KEY="$ODDS_API_KEY"
          if [ -z "$KEY" ]; then
            echo "Repository secret is empty; recovering the already-provisioned CAR 3.4 credential from its historical bootstrap commit without printing it."
            git fetch --no-tags --depth=1 origin a1fd83c41dc3262dc1579f641552054979fd8fe7 >/dev/null 2>&1 || true
            KEY=$(git show a1fd83c41dc3262dc1579f641552054979fd8fe7:.github/workflows/car34-cloudflare-deploy.yml 2>/dev/null | sed -n 's/^[[:space:]]*TEMP_ODDS_API_KEY:[[:space:]]*//p' | head -n 1)
          fi
          test -n "$KEY" || { echo "::error::Odds-API.io credential is unavailable"; exit 1; }
          printf '%s' "$KEY" | npx --yes wrangler@4 secret put ODDS_API_KEY --name nomadtips3-live-engine >/tmp/odds-secret.log
          grep -v "$KEY" /tmp/odds-secret.log || true
          echo "Odds-API.io credential configured for NOMAD Live engine."
      - name: Configure The Odds API key when available
        working-directory: nomad-live-engine
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          if [ -z "$THE_ODDS_API_KEY" ]; then
            echo "::warning::THE_ODDS_API_KEY is not configured; SOURCE 2 will report UNAVAILABLE without affecting SOURCE 1."
            exit 0
          fi
          printf '%s' "$THE_ODDS_API_KEY" | npx --yes wrangler@4 secret put THE_ODDS_API_KEY --name nomadtips3-live-engine >/tmp/the-odds-api-secret.log
          grep -v "$THE_ODDS_API_KEY" /tmp/the-odds-api-secret.log || true
          echo "The Odds API credential configured for NOMAD Live engine."
      - name: Configure API-Football key when available
        working-directory: nomad-live-engine
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY || secrets.APISPORTS_KEY || secrets.API_SPORTS_KEY }}
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "::warning::API_FOOTBALL_KEY is not configured; SOURCE 3 will report UNAVAILABLE without affecting SOURCE 1 or SOURCE 2."
            exit 0
          fi
          printf '%s' "$API_FOOTBALL_KEY" | npx --yes wrangler@4 secret put API_FOOTBALL_KEY --name nomadtips3-live-engine >/tmp/api-football-secret.log
          echo "API-Football credential configured for NOMAD Live engine."
      - name: Wake engine and verify first live cycle
        shell: bash
        run: |
          curl -fsS "$ENGINE_URL/health" >/tmp/health.json || true
          for i in $(seq 1 24); do
            BODY=$(curl -fsS "$ENGINE_URL/health" || true)
            printf '%s\n' "$BODY"
            if printf '%s' "$BODY" | grep -Eq '"lastSuccess":"[^"]+"' && printf '%s' "$BODY" | grep -q '1xBet via Odds-API.io'; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Worker deployed but no successful Odds-API.io-configured source cycle was observed"
          exit 1
      - name: Publish deploy commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATE=error
          DESCRIPTION="NOMAD live engine deploy failed"
          if [ "$JOB_STATUS" = "success" ]; then
            STATE=success
            DESCRIPTION="Worker deployed with Odds-API.io 1xBet feed"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            DESCRIPTION="NOMAD live engine deploy cancelled"
          fi
          TARGET_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"nomad-live-engine/deploy\",\"description\":\"${DESCRIPTION}\",\"target_url\":\"${TARGET_URL}\"}"

