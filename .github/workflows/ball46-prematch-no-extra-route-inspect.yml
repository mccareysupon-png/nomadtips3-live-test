name: BALL46 inspect no extra result route
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-prematch-no-extra-route-inspect.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import crypto from 'node:crypto';
          const host='https://ball46-prematch-only-test-20261120.mccarey-supon.workers.dev';
          const secret=crypto.createHmac('sha256',process.env.CLOUDFLARE_API_TOKEN).update('BALL46_PREMATCH_ONLY_V1').digest('hex');
          for(const [method,path,auth] of [['GET','/health',true],['GET','/test-ledger',true],['GET','/preview-data',false],['POST','/daily-run',true],['GET','/bot-state',true]]){
           try{const r=await fetch(host+path,{method,headers:auth?{authorization:'Bearer '+secret}:{},signal:AbortSignal.timeout(12000)});const t=await r.text();console.log('NO_EXTRA_ROUTE_DIAG '+JSON.stringify({method,path,status:r.status,body:t.slice(0,450),type:r.headers.get('content-type')}))}
           catch(e){console.log('NO_EXTRA_ROUTE_DIAG '+JSON.stringify({method,path,error:String(e)}))}
          }
          JS
