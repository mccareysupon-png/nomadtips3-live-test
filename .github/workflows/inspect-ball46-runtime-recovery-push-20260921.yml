name: Inspect Ball46 runtime recovery push

on:
  push:
    branches:
      - diag/ball46-runtime-recovery-20260921

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g wrangler@latest
      - name: Inspect exact Ball46 runtime services
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          wrangler --version
          for svc in nomadtips3-engine-343 nomadtips3-5usd-hub-343 nomadtips3-full-market-343-ball46; do
            cfg="/tmp/${svc}.jsonc"
            printf '{"name":"%s","main":"/tmp/dummy.js","compatibility_date":"2026-09-21"}\n' "$svc" > "$cfg"
            echo 'export default {fetch(){return new Response("diag")}}' > /tmp/dummy.js
            echo "=== SERVICE: $svc ==="
            echo '--- deployments ---'
            wrangler deployments list --config "$cfg" || true
            echo '--- versions ---'
            wrangler versions list --config "$cfg" || true
          done
      - name: Inspect historical Ball46 wrapper deployment history
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          HIST=af999592ea6e84fe72cb984670723d52673a5b5e
          git show "$HIST:workers/nomadtips3-343-preview/wrangler.ball46.jsonc" > /tmp/wrangler.ball46.jsonc 2>/dev/null
          echo '=== WRAPPER ==='
          wrangler deployments list --config /tmp/wrangler.ball46.jsonc || true
          wrangler versions list --config /tmp/wrangler.ball46.jsonc || true
