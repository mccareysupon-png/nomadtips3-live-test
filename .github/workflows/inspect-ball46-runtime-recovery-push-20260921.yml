name: Recover Ball46 live board

on:
  push:
    branches:
      - diag/ball46-runtime-recovery-20260921

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BALL46_URL: https://ball46.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRAPPER_CFG: workers/nomadtips3-343-preview/wrangler.ball46.jsonc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ball46-production-source
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Preflight and capture exact current UI plus rollback point
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --max-time 30 "$BALL46_URL/" -o /tmp/ui-before.html
          curl -fsS -L --max-time 30 "$BALL46_URL/live.js" -o /tmp/live-before.js
          curl -fsS -L --max-time 30 "$BALL46_URL/api/engine/board?pre=$GITHUB_RUN_ID" -o /tmp/e.json
          curl -fsS -L --max-time 30 "$BALL46_URL/api/hub/snapshot?pre=$GITHUB_RUN_ID" -o /tmp/h.json
          node - <<'NODE'
          const e=require('/tmp/e.json'),h=require('/tmp/h.json'),now=Date.now();
          const ea=now-Number(e.hubFetchedAt||e.fetchedAt||0),ha=now-Number(h.fetchedAt||h.hubFetchedAt||0);
          console.log('PRE',JSON.stringify({engineAgeMs:ea,hubAgeMs:ha,engine:e.version,hub:h.version}));
          if(e?.ok!==true||h?.ok!==true||!(ea>120000)||!(ha>=0&&ha<120000)) throw Error('PREFLIGHT_FRESHNESS_NOT_MATCHED');
          NODE
          npx --yes wrangler@4.92.0 deployments list --config "$WRAPPER_CFG" --json >/tmp/d.json
          node - <<'NODE'
          const fs=require('fs'),r=require('/tmp/d.json'),x=r[r.length-1];
          const id=x?.versions?.find(v=>Number(v.percentage)===100)?.version_id||x?.versions?.[0]?.version_id||'';
          if(!id) throw Error('NO_ACTIVE_WRAPPER'); fs.writeFileSync('/tmp/old-wrapper',id); console.log('ROLLBACK_POINT',id);
          NODE
          cp /tmp/ui-before.html nomad-live-343/index.html
          echo "PRESERVED_UI=$(sha256sum nomad-live-343/index.html|cut -d' ' -f1)"

      - name: Patch stale ENGINE board to fresh HUB state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('workers/nomadtips3-343-preview/src/index.js')
          s=p.read_text()
          marker='async function engineBoardResponse(request, env) {'
          helper='''function boardTimestampMs(board) {\n  for (const raw of [board?.hubFetchedAt, board?.fetchedAt, board?.updatedAt, board?.generatedAt, board?.timestamp]) {\n    if (raw === null || raw === undefined || raw === '') continue;\n    const n=Number(raw); if (Number.isFinite(n)&&n>0) return n<1e12?n*1000:n;\n    const d=Date.parse(String(raw)); if (Number.isFinite(d)) return d;\n  }\n  return null;\n}\nfunction boardLooksStale(board,maxAgeMs=120000){ const t=boardTimestampMs(board); return t!==null && Date.now()-t>maxAgeMs; }\nfunction mergeLastGood(oldValue,freshValue){ return oddsContainerHasData(freshValue) ? freshValue : (oldValue ?? freshValue ?? null); }\nfunction mergeFreshHubState(engineBoard,hub){\n  const oldById=new Map((Array.isArray(engineBoard?.fixtures)?engineBoard.fixtures:[]).map(f=>[String(f?.fixtureId??f?.id??''),f]));\n  const fixtures=(Array.isArray(hub?.fixtures)?hub.fixtures:[]).map(fresh=>{\n    const old=oldById.get(String(fresh?.fixtureId??fresh?.id??'')); if(!old) return fresh;\n    return {...old,...fresh,providerOdds:mergeLastGood(old?.providerOdds,fresh?.providerOdds),fullOdds:mergeLastGood(old?.fullOdds,fresh?.fullOdds),odds:mergeLastGood(old?.odds,fresh?.odds)};\n  });\n  return {...engineBoard,...hub,fixtures,version:'ball46-board-live-recovery-v1',engineBoardFallback:true,engineBoardFallbackReason:'ENGINE_BOARD_STALE',engineBoardStatus:200,engineBoardHasOdds:boardHasBookmakerOdds(engineBoard),hubBoardHasOdds:boardHasBookmakerOdds(hub),hubVersion:hub?.version??null,hubFetchedAt:hub?.fetchedAt??hub?.hubFetchedAt??null,hubAgeMs:hub?.ageMs??null,stale:false,referee:{mode:'FRESH_HUB_STATE_WITH_LAST_GOOD_ODDS',externalRequestsAdded:0,requests:0,queued:0,errors:[]}};\n}\n\n'''
          if marker not in s: raise SystemExit('missing engineBoardResponse')
          s=s.replace(marker,helper+marker,1)
          needle='  const engineHasOdds = boardHasBookmakerOdds(engineBoard);\n'
          recovery='''\n  if (engineResponse.ok && engineBoard?.ok === true && boardLooksStale(engineBoard)) {\n    const hr=await env.HUB.fetch(hubRequest(request,'/snapshot'));\n    if(hr.ok){\n      const hub=await hr.json().catch(()=>null);\n      if(hub?.ok===true && Array.isArray(hub.fixtures) && !boardLooksStale(hub)){\n        const recovered=mergeFreshHubState(engineBoard,hub);\n        return Response.json(recovered,{headers:{'cache-control':'no-store, no-cache, must-revalidate, max-age=0','pragma':'no-cache','x-ball46-board-source':'hub-live-recovery'}});\n      }\n    }\n  }\n'''
          if needle not in s: raise SystemExit('missing insertion point')
          s=s.replace(needle,needle+recovery,1)
          p.write_text(s)
          PY
          node --check workers/nomadtips3-343-preview/src/index.js

      - name: Deploy Ball46 wrapper only with exact current UI preserved
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --config "$WRAPPER_CFG"

      - name: Verify live board and exact UI preservation
        shell: bash
        run: |
          set -euo pipefail
          rollback(){ old=$(cat /tmp/old-wrapper); echo "ROLLBACK=$old"; npx --yes wrangler@4.92.0 rollback "$old" --config "$WRAPPER_CFG" || true; }
          pass=0
          for n in 1 2 3; do
            sleep 5
            codeb=$(curl -sS -L --max-time 30 -D /tmp/bh -o /tmp/b.json -w '%{http_code}' "$BALL46_URL/api/engine/board?post=$GITHUB_RUN_ID-$n" || true)
            codeh=$(curl -sS -L --max-time 30 -o /tmp/h2.json -w '%{http_code}' "$BALL46_URL/api/hub/snapshot?post=$GITHUB_RUN_ID-$n" || true)
            echo "BOARD_HTTP=$codeb HUB_HTTP=$codeh"
            [ "$codeb" = 200 ] && [ "$codeh" = 200 ] || continue
            if node - <<'NODE'
          const b=require('/tmp/b.json'),h=require('/tmp/h2.json'),now=Date.now();
          const ba=now-Number(b.hubFetchedAt||b.fetchedAt||0),ha=now-Number(h.fetchedAt||h.hubFetchedAt||0);
          const live=x=>(x.fixtures||[]).filter(f=>String(f.boardState||'').toLowerCase()==='live'||/in_play|live|playing|first|second/i.test(String(f.status||f.statusCode||''))).length;
          const odds=(b.fixtures||[]).some(f=>f.providerOdds||f.fullOdds||f.odds);
          console.log('CORE_POST',JSON.stringify({version:b.version,reason:b.engineBoardFallbackReason,boardAgeMs:ba,hubAgeMs:ha,boardLive:live(b),hubLive:live(h),odds}));
          if(b?.ok!==true||h?.ok!==true||b.engineBoardFallbackReason!=='ENGINE_BOARD_STALE'||ba<0||ba>=120000||ha<0||ha>=120000||live(b)!==live(h)||!odds) process.exit(1);
          NODE
            then pass=1; break; fi
          done
          if [ "$pass" -ne 1 ]; then rollback; exit 1; fi
          grep -Eiq '^x-ball46-board-source:.*hub-live-recovery' /tmp/bh || { echo 'MISSING_RECOVERY_HEADER'; rollback; exit 1; }
          curl -fsS -L --max-time 30 "$BALL46_URL/" -o /tmp/ui-after.html
          curl -fsS -L --max-time 30 "$BALL46_URL/live.js" -o /tmp/live-after.js
          before_ui=$(sha256sum /tmp/ui-before.html|cut -d' ' -f1); after_ui=$(sha256sum /tmp/ui-after.html|cut -d' ' -f1)
          before_live=$(sha256sum /tmp/live-before.js|cut -d' ' -f1); after_live=$(sha256sum /tmp/live-after.js|cut -d' ' -f1)
          echo "UI_HASH $before_ui $after_ui"
          echo "LIVEJS_HASH $before_live $after_live"
          [ "$before_ui" = "$after_ui" ] && [ "$before_live" = "$after_live" ] || { echo 'UI_CHANGED'; rollback; exit 1; }

      - name: Verify signals and record active wrapper
        shell: bash
        run: |
          set -euo pipefail
          codes=$(curl -sS -L --max-time 30 -o /tmp/s.json -w '%{http_code}' "$BALL46_URL/api/engine/signals?diag=$GITHUB_RUN_ID")
          echo "SIGNALS_HTTP=$codes"
          [ "$codes" = 200 ]
          node - <<'NODE'
          const s=require('/tmp/s.json');
          console.log('SIGNALS',JSON.stringify({ok:s.ok,count:Array.isArray(s.signals)?s.signals.length:null,mirror:s.mirror,error:s.error||null}));
          if(s?.ok!==true||!Array.isArray(s.signals)) process.exit(1);
          const t=Number(s?.mirror?.hubFetchedAt||0); if(t && Date.now()-t>=120000) process.exit(1);
          NODE
          for ep in engine hub full-market; do
            code=$(curl -sS -L --max-time 30 -o "/tmp/$ep-health.json" -w '%{http_code}' "$BALL46_URL/api/$ep/health?diag=$GITHUB_RUN_ID" || true)
            echo "HEALTH_$ep HTTP=$code"
          done
          npx --yes wrangler@4.92.0 deployments list --config "$WRAPPER_CFG" --json >/tmp/final.json
          node - <<'NODE'
          const r=require('/tmp/final.json'),x=r[r.length-1]; console.log('ACTIVE_WRAPPER',JSON.stringify(x));
          NODE
          echo BALL46_RECOVERY_PASS
