name: ONE SHOT - Ball46 Favicon Cachefix 6 20260927

on:
  push:
    branches:
      - ops/ball46-favicon-cachefix3-20260927
    paths:
      - '.github/workflows/one-shot-ball46-favicon-cachefix6-20260927.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Direct-Worker mirror and guarded favicon-only deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/mccareysupon-png/nomadtips3-live-test/3aec613148e618b36af7d39f33ed0bff9e021b40/.github/scripts/ball46_favicon_cachefix_v3_20260927.sh -o /tmp/favicon-v6.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/favicon-v6.sh'); s=p.read_text()
          replacements=[
            ("WWW=\"https://www.ball46.com\"\nWORKER=\"ball46-production\"", "WWW=\"https://www.ball46.com\"\nDIRECT=\"https://ball46-production.mccarey-supon.workers.dev\"\nWORKER=\"ball46-production\""),
            ("    schedules=s.get('result') or []", "    raw_schedules=s.get('result') or []\n    schedules=raw_schedules.get('schedules',[]) if isinstance(raw_schedules,dict) else raw_schedules"),
            ("paths=set(root.joinpath('live-paths.txt').read_text().splitlines()); nonce=os.environ.get('GITHUB_RUN_ID','run')+'-crawl-'+str(time.time_ns())", "paths=set(root.joinpath('live-paths.txt').read_text().splitlines()); known_missing=set(); nonce=os.environ.get('GITHUB_RUN_ID','run')+'-crawl-'+str(time.time_ns())"),
            ("    new=sorted(refs-paths)", "    new=sorted(refs-paths-known_missing)"),
            ("    paths|=added\n    # A referenced local file that does not exist in Production is a hard stop.\n    if failed: raise SystemExit('REFERENCED_LIVE_ASSET_MISSING:'+repr(failed))", "    paths|=added\n    # Preserve references already 404 on the locked Production baseline; never resurrect old files.\n    known_missing|=set(failed)\n    root.joinpath('baseline-404-references.txt').write_text('\\n'.join(sorted(known_missing))+'\\n')"),
            ("missing=sorted(refs-paths);print('FINAL_REFERENCED_MISSING=',missing)\nif missing:raise SystemExit('REFERENCE_CLOSURE_FAILED')", "missing=sorted(refs-paths); unexpected=sorted(set(missing)-known_missing); print('FINAL_BASELINE_404_REFERENCES=',missing); print('FINAL_UNEXPECTED_MISSING=',unexpected)\nif unexpected:raise SystemExit('REFERENCE_CLOSURE_FAILED')"),
            ("ui-sync-fixes-343.js ui-sync-fixes-343.css", "ui-sync-fixes-343-v2.js ui-sync-fixes-343.css")
          ]
          for old,new in replacements:
              n=s.count(old)
              if n!=1: raise SystemExit('PATCH_TARGET_COUNT_'+str(n)+':'+old[:90])
              s=s.replace(old,new,1)
          # Both Python mirror/crawl blocks use this literal base. Point both at direct Worker.
          old="base='https://www.ball46.com/'"
          n=s.count(old)
          if n!=2: raise SystemExit('DIRECT_BASE_TARGET_COUNT:'+str(n))
          s=s.replace(old,"base='https://ball46-production.mccarey-supon.workers.dev/'")
          # Race checks and full byte verification must also use direct Worker, not edge-injected www HTML.
          old='"$WWW/$rel?favicon-race=${GITHUB_RUN_ID}-${RANDOM}"'
          if s.count(old)!=1: raise SystemExit('RACE_URL_TARGET_BAD')
          s=s.replace(old,'"$DIRECT/$rel?favicon-race=${GITHUB_RUN_ID}-${RANDOM}"',1)
          old='"$WWW/$rel?favicon-verify=${GITHUB_RUN_ID}-${pass}-${RANDOM}"'
          if s.count(old)!=1: raise SystemExit('VERIFY_URL_TARGET_BAD')
          s=s.replace(old,'"$DIRECT/$rel?favicon-verify=${GITHUB_RUN_ID}-${pass}-${RANDOM}"',1)
          p.write_text(s)
          print('RUNNER_V6_PATCH_OK')
          PY
          bash -n /tmp/favicon-v6.sh
          bash /tmp/favicon-v6.sh
          # Custom-domain check after all exact Worker-byte and API guards passed.
          nonce="${GITHUB_RUN_ID}-$(date +%s%N)"
          curl -fsS -L --retry 4 --retry-all-errors --max-time 30 -H 'Cache-Control: no-cache' "https://www.ball46.com/index.html?favicon-public=$nonce" -o /tmp/b46-favicon-v3/public-index.html
          grep -Fq '<link rel="icon" href="/ball46-logo.svg?v=ball46-tab-logo-20260927c" type="image/svg+xml">' /tmp/b46-favicon-v3/public-index.html
          count=$(grep -Eio '<link[^>]+rel=["'"'](shortcut[[:space:]]+)?icon["'"'][^>]*>' /tmp/b46-favicon-v3/public-index.html | wc -l)
          [ "$count" -eq 1 ] || { echo "PUBLIC_ICON_TAG_COUNT=$count"; exit 1; }
          echo BALL46_PUBLIC_FAVICON_VERIFIED
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-favicon-cachefix6-${{ github.run_id }}
          path: /tmp/b46-favicon-v3
          if-no-files-found: ignore
          retention-days: 30
