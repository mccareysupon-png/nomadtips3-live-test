name: Ball46 Goals O-U Verified Live Odds Referee ONLY
on:
  push:
    branches: [work/ball46-goals-live-referee-20261011]
    paths:
      - '.github/workflows/deploy-ball46-goals-live-referee-20261011.yml'
permissions:
  contents: read
concurrency:
  group: ball46-engine343-goals-live-referee-20261011
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check deploy script
        run: node --check deploy-assets/ball46-goals-live-referee-20261011/deploy.mjs
      - name: Strict goal-line fixture unit tests and active Worker preflight (NO WRITES)
        env:
          GOALS_DRY_RUN: '1'
        run: node deploy-assets/ball46-goals-live-referee-20261011/deploy.mjs
      - name: Deploy Goals O-U verifier from latest active Worker with rollback on failure
        env:
          GOALS_DRY_RUN: '0'
        run: node deploy-assets/ball46-goals-live-referee-20261011/deploy.mjs
      - name: Store audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-goals-live-referee-${{ github.run_id }}
          path: audit/
          if-no-files-found: warn
          retention-days: 30
