name: BALL46 HTTP 599 read-only diagnosis
on:
  push:
    branches: [codex/ball46-favorites-test-20261110]
    paths: ['work/favorites-test-20261110/diagnosis-request.json']
permissions:
  contents: write
jobs:
  diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read current and preview cached board only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node work/favorites-test-20261110/diagnosis.mjs
      - name: Save diagnosis evidence only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/favorites-test-20261110/diagnosis/report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record HTTP 599 read-only diagnosis [skip ci]"
          git push origin HEAD:codex/ball46-favorites-test-20261110
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-http-599-diagnosis
          path: work/favorites-test-20261110/diagnosis/report.json
