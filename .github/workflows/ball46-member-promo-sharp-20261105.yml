name: BALL46 approved sharper member photograph release
on:
  push:
    branches: [codex/ball46-member-promo-20261104]
    paths: ['work/member-promo-sharp-20261104/release-request.json']
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --no-save --package-lock=false --prefix work/member-promo-sharp-20261104 parse5@7.3.0 playwright@1.56.1
          cd work/member-promo-sharp-20261104 && npx playwright install --with-deps chromium
      - name: Read current Cloudflare Production and stage exact current bundle with photo payload change only
        run: node work/member-promo-sharp-20261104/release.mjs stage
      - name: Candidate PC mobile light dark, exact PNG hash and original 5s display
        run: node work/member-promo-sharp-20261104/release-browser.mjs candidate
      - name: Actual-origin browser-only preview PC mobile light dark
        run: node work/member-promo-sharp-20261104/release-browser.mjs shadow
      - name: Activate only after all eight browser cases and unchanged live source checks
        run: node work/member-promo-sharp-20261104/release.mjs activate
      - name: Verify actual Production PC mobile light dark
        run: node work/member-promo-sharp-20261104/release-browser.mjs production
      - name: Restore immediate Production baseline on any activation failure
        if: failure()
        run: node work/member-promo-sharp-20261104/release-rollback.mjs
      - name: Save narrow deployment audit
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/member-promo-sharp-20261104/release-audit/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record sharper member photograph preservation and verification [skip ci]"
          git push origin HEAD:codex/ball46-member-promo-20261104
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sharper-member-photo-release-proof
          path: work/member-promo-sharp-20261104/release-audit
