name: BALL46 restricted provider bridge contract
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-provider-bridge-test.yml', 'qa/prematch-history-20261120/account-egress.test.mjs']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test qa/prematch-history-20261120/*.test.mjs
      - name: Refresh actual read-only account caller evidence
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node qa/prematch-history-20261120/legacy-account-gate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-egress-audit
          path: evidence/
