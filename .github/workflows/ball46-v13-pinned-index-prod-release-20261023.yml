name: BALL46 V13 Featured + Real Flags — Guarded Production Release 20261023
on:
  push:
    branches: [release/ball46-v13-featured-flag-stable-20261023]
    paths:
      - '.github/workflows/ball46-v13-pinned-index-prod-release-20261023.yml'
      - 'deploy-assets/featured-flicker-v13/deploy-v13.mjs'
      - 'deploy-assets/featured-flicker-v13/feature-stable-patch.mjs'
      - 'deploy-assets/featured-flicker-v13/hide-globe.css'
permissions: {contents: read}
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 29
    env:
      B46_V13_PRODUCTION_RELEASE: 'APPROVED_20261023'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax check guarded release
        working-directory: deploy-assets/featured-flicker-v13
        run: |
          set -euo pipefail
          node --check deploy-v13.mjs
          node --check feature-stable-patch.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Verify pinned Worker, preview featured + statistics, release then prove Production or rollback
        working-directory: deploy-assets/featured-flicker-v13
        run: node deploy-v13.mjs
      - name: Preserve worker versions, screenshots and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-v13-real-flags-prod-release-proof-20261023
          path: deploy-assets/featured-flicker-v13/proof/
          retention-days: 30
          if-no-files-found: warn
