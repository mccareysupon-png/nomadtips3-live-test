name: BALL46 approved football icon Preview and guarded deploy
on:
  push:
    branches: [codex/ball46-football-icon-20261111]
    paths: ['work/menu-football-test-20261111/release-request.json']
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated validation tools
        run: |
          npm install --no-save --package-lock=false --prefix work/menu-football-test-20261111 acorn@8.15.0 parse5@7.3.0 playwright@1.56.1
          if command -v google-chrome >/dev/null; then
            echo "PLAYWRIGHT_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            cd work/menu-football-test-20261111 && npx playwright install --with-deps chromium
          fi
      - name: Read actual Active Production and build one payload patch only
        run: node work/menu-football-test-20261111/build-release.mjs
      - name: Preserve baseline and upload guarded candidate without traffic
        run: node work/menu-football-test-20261111/release.mjs stage
      - name: Preview PC mobile dark light real cached scores and icons
        run: node work/menu-football-test-20261111/release-browser.mjs candidate
      - name: Activate only after all preservation and Preview gates
        run: node work/menu-football-test-20261111/release.mjs activate
      - name: Production PC mobile dark light real scores and icons
        run: node work/menu-football-test-20261111/release-browser.mjs production
      - name: Final active version and health verification
        run: node work/menu-football-test-20261111/release.mjs finish
      - name: Restore immediate baseline on post-activation failure
        if: failure()
        run: node work/menu-football-test-20261111/release.mjs rollback
      - name: Preserve sanitized evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/menu-football-test-20261111/release-audit/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record menu icon deployment preservation evidence [skip ci]"
          git push origin HEAD:codex/ball46-football-icon-20261111
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-football-production-proof
          path: work/menu-football-test-20261111/release-audit
