name: BALL46 Native All Matches Expanded V5 Production
on:
  push:
    branches: [fix/ball46-featured-expanded-only-20261021]
    paths:
      - '.github/workflows/ball46-native-expanded-v5-deploy.yml'
      - 'deploy-assets/expanded-match-mobile-v4/native-core-v5-patch.mjs'
      - 'deploy-assets/expanded-match-mobile-v4/native-core-v5.css'
      - 'deploy-assets/expanded-match-mobile-v4/deploy-native-v5.mjs'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  guarded-native-expanded:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks and browser
        working-directory: deploy-assets/expanded-match-mobile-v4
        run: |
          set -euo pipefail
          node --check native-core-v5-patch.mjs
          node --check deploy-native-v5.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 pngjs@7
      - name: Verify exact active Worker, native source, live fixture, Event Flow then deploy
        working-directory: deploy-assets/expanded-match-mobile-v4
        run: node deploy-native-v5.mjs
      - name: Preserve screenshots and before-candidate-production report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-native-expanded-v5-evidence
          path: deploy-assets/expanded-match-mobile-v4/proof/
          retention-days: 30
          if-no-files-found: warn