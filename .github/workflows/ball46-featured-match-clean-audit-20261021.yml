name: BALL46 Featured Match — Read Only PC Mobile Audit
on:
  push:
    branches: [codex/ball46-featured-match-clean-preview-20261021]
    paths:
      - '.github/workflows/ball46-featured-match-clean-audit-20261021.yml'
      - 'deploy-assets/featured-match-clean-preview-20261021/audit-featured.mjs'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome tools and run production readonly audit
        working-directory: deploy-assets/featured-match-clean-preview-20261021
        run: |
          set -euo pipefail
          node --check audit-featured.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
          node audit-featured.mjs
      - name: Save featured card DOM and screenshot for both sizes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-featured-match-pc-mobile-before-20261021
          path: deploy-assets/featured-match-clean-preview-20261021/audit-featured/
          retention-days: 21
          if-no-files-found: warn
