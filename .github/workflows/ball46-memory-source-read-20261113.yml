name: BALL46 memory source read only
on:
  push:
    branches: [test/ball46-memory-bound-20261113]
    paths: ['work/engine-memory-diagnosis-20261113/request.json']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node work/engine-memory-diagnosis-20261113/capture.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/engine-memory-diagnosis-20261113
          git commit -m 'Record actual Engine and Website source for memory fix [skip ci]'
          git push origin HEAD:test/ball46-memory-bound-20261113
