name: Ball46 Phase2 Active Worker Read-only Preflight v2
on:
  push:
    branches: [work/ball46-early-over-stage2-20261011]
    paths: ['.github/workflows/ball46-stage2-preflight-20261011.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts acorn@8
      - run: node deploy-assets/ball46-early-over-20261011/preflight.mjs
