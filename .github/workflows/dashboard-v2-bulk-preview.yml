name: NOMAD 3.43 V2 Full Market

on:
  push:
    branches: [work/nomad343-v2-primary-20260915]
    paths:
      - 'nomad-live-343/index.html'
      - 'nomad-live-343/dashboard-v2*'
      - 'nomad-live-343/expanded-match-343.*'
      - 'nomad-live-343/full-market-bookmaker-343.*'
      - 'workers/nomadtips3-343-full-market/**'
      - 'workers/nomadtips3-343-preview/**'
      - '.github/workflows/dashboard-v2-bulk-preview.yml'
  workflow_dispatch:

concurrency:
  group: nomad343-v2-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BASE_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate architecture and syntax
        run: |
          set -euo pipefail
          node --check nomad-live-343/dashboard-v2-stage3.js
          node --check nomad-live-343/expanded-match-343.js
          node --check nomad-live-343/full-market-bookmaker-343.js
          node --check workers/nomadtips3-343-full-market/src/index.js
          node --check workers/nomadtips3-343-preview/src/index.js
          grep -Fq "const ODDS_RENDER_OWNER='full-market-bookmaker-only'" nomad-live-343/expanded-match-343.js
          grep -Fq "const FULL_API='/api/full-market/fixture-odds'" nomad-live-343/full-market-bookmaker-343.js
          grep -Fq '343-full-market-bookmaker-v2-one-request' nomad-live-343/full-market-bookmaker-343.js
          grep -Fq '343-fmb-v2-one-request' nomad-live-343/index.html
          grep -Fq 'nomad343-full-market-v2-one-request-19book' workers/nomadtips3-343-full-market/src/index.js
          grep -Fq '"binding": "FULL_MARKET"' workers/nomadtips3-343-preview/wrangler.jsonc
          grep -Fq 'service": "nomadtips3-343-full-market"' workers/nomadtips3-343-preview/wrangler.jsonc
          if grep -Eq 'expanded-odds-complete-343|full-odds-main-343' nomad-live-343/index.html; then echo 'ERROR old renderer restored'; exit 1; fi
          if grep -Fq 'api.5dollarfootballapi.com' nomad-live-343/full-market-bookmaker-343.js; then echo 'ERROR browser calls provider directly'; exit 1; fi
          grep -Fq 'bookmakers=${encodeURIComponent(BOOKMAKER_QUERY)}' workers/nomadtips3-343-full-market/src/index.js
          grep -Fq 'main = "src/index-bulk.js"' workers/nomadtips3-engine-343/wrangler.toml
          if grep -Fq 'api.5dollarfootballapi.com' workers/nomadtips3-engine-343/src/index-bulk.js; then echo 'ERROR Engine direct provider call restored'; exit 1; fi
          echo ARCHITECTURE_OK

      - name: Full Market rich-price parser regression
        run: |
          set -euo pipefail
          node - <<'NODE'
          global.window={};global.document={readyState:'complete',addEventListener:()=>{},querySelector:()=>null};global.CSS={escape:v=>String(v)};
          global.fetch=()=>Promise.reject(new Error('network disabled in parser test'));
          require('./nomad-live-343/full-market-bookmaker-343.js');
          const api=window.NOMAD343_FULL_MARKET_BOOKMAKER;
          const fixture={fixtureId:'x',fullMarket:{data:{bookmakers:[
            {slug:'bet365',name:'Bet 365',odds:{
              '1x2':{opening:{home:1.8,draw:3.4,away:4.2},closing:{home:1.75,draw:3.5,away:4.4},inplay:{home:1.5,draw:4.1,away:6}},
              asian_handicap:{opening:{line:-0.25,home:1.95,away:1.85},closing:{line:-0.5,home:2.02,away:1.78},inplay:{line:-1,home:1.90,away:1.90}},
              goal_line:{opening:{line:2.5,over:1.90,under:1.90},closing:{line:2.75,over:1.85,under:1.95},inplay:{line:3,over:2.05,under:1.75}},
              corner_line:{opening:{line:9.5,over:1.85,under:1.85}},card_line:{opening:{line:4.5,over:1.95,under:1.75}},btts:{opening:{yes:1.80,no:1.95}}
            }},
            {slug:'pinnacle',name:'Pinnacle',odds:{asian_handicap:{closing:{line:-0.5,home:1.97,away:1.91}},goal_line:{closing:{line:2.75,over:1.91,under:1.97}}}}
          ]}}};
          const d=api.inspectFixture(fixture),bet=api.renderBookHtml(fixture,'bet365'),pin=api.renderBookHtml(fixture,'pinnacle');
          if(d.books.length!==19)throw Error(`expected 19 slots got ${d.books.length}`);
          if(!d.found.includes('bet365')||!d.found.includes('pinnacle'))throw Error('full-market bookmaker discovery failed');
          for(const t of ['-0.5','2.02','1.78','2.75','1.85','1.95'])if(!bet.includes(t))throw Error(`Bet365 rich price lost ${t}`);
          for(const t of ['1.97','1.91'])if(!pin.includes(t))throw Error(`Pinnacle rich price lost ${t}`);
          console.log('RICH_PRICE_PARSER_OK',JSON.stringify({found:d.found,markets:d.markets}));
          NODE

      - name: Deploy Full Market source
        working-directory: workers/nomadtips3-343-full-market
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.toml

      - name: Deploy Preview
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Verify live one-request data path
        run: |
          set -euo pipefail
          get() { n="$1"; u="$2"; o="$3"; for i in $(seq 1 20); do c=$(curl -sS -L --max-time 30 -w '%{http_code}' -o "$o" "$u" || true); if [ "$c" = 200 ]; then echo "$n HTTP 200"; return; fi; sleep 2; done; echo "ERROR $n HTTP $c"; exit 1; }
          get INDEX "$BASE_URL/index.html?verify=$RANDOM" /tmp/index.html
          get BOARD "$BASE_URL/api/engine/board?verify=$RANDOM" /tmp/board.json
          get FM_HEALTH "$BASE_URL/api/full-market/health?verify=$RANDOM" /tmp/fm-health.json
          FIXTURE_ID=$(node -e "const b=require('/tmp/board.json'); const f=(b.fixtures||[]).find(x=>x.fixtureId); if(!f)process.exit(2); process.stdout.write(String(f.fixtureId))")
          get FULL_MARKET "$BASE_URL/api/full-market/fixture-odds?fixtureId=$FIXTURE_ID&verify=$RANDOM" /tmp/full.json
          node - <<'NODE'
          const h=require('/tmp/fm-health.json'),f=require('/tmp/full.json'),b=require('/tmp/board.json');
          if(h.version!=='nomad343-full-market-v2-one-request-19book')throw Error(`wrong Full Market version ${h.version}`);
          if(h.bookmakerCount!==19)throw Error(`expected 19 bookmakers, got ${h.bookmakerCount}`);
          if(f.ok!==true||f.requestedBookmakers?.length!==19)throw Error('one-request 19-book response incomplete');
          if(![0,1].includes(Number(f.providerRequestsAdded)))throw Error(`unexpected provider request count ${f.providerRequestsAdded}`);
          const rows=f.fullOdds?.data?.bookmakers||f.fullOdds?.bookmakers||[];
          if(!Array.isArray(rows)||!rows.length)throw Error('provider returned no bookmaker rows');
          const bet=rows.find(x=>String(x.slug||'').toLowerCase()==='bet365');
          if(!bet?.odds)throw Error('Bet365 full odds missing');
          const rich=['asian_handicap','goal_line','corner_line','corner_asian','card_line','card_asian','asian_handicap_half','goal_line_half','corner_line_half'].some(k=>{
            const m=bet.odds[k]; if(!m)return false; return ['opening','closing','inplay'].some(s=>{const v=m[s]; return v&&typeof v==='object'&&('line' in v)&&(('home' in v&&'away' in v)||('over' in v&&'under' in v));});
          if(!rich)throw Error('Bet365 response has no Line + side prices');
          if(b.dataMode!=='BULK_SNAPSHOT_ONLY'||Number(b.referee?.externalRequestsAdded)!==0)throw Error('main board John path changed');
          console.log('LIVE_ONE_REQUEST_FULL_MARKET_OK',JSON.stringify({fixtureId:f.fixtureId,providerRequestsAdded:f.providerRequestsAdded,available:f.availableBookmakers?.map(x=>x.slug),betMarkets:Object.keys(bet.odds)}));
          NODE

      - name: Browser render smoke
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"; test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=12000 --dump-dom "$BASE_URL/index.html?browser=$RANDOM" >/tmp/index-rendered.html
          grep -Fq 'class="match-row' /tmp/index-rendered.html
          if grep -Fq "Loading today's match board" /tmp/index-rendered.html; then echo 'ERROR index still loading'; exit 1; fi
          echo BROWSER_RENDER_OK
