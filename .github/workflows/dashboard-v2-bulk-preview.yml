name: Dashboard V2 Bulk Preview

on:
  push:
    branches: [work/nomad343-dashboard-v2-bulk-20260915]
    paths:
      - 'nomad-live-343/dashboard-v2*'
      - 'workers/nomadtips3-343-preview/**'
      - '.github/workflows/dashboard-v2-bulk-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BASE_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev

jobs:
  validate-deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Dashboard V2 bulk-only contract
        run: |
          set -euo pipefail
          node --check nomad-live-343/dashboard-v2-stage3.js
          node --check nomad-live-343/dashboard-v2.js
          grep -Fq "const API='/api/engine/board'" nomad-live-343/dashboard-v2-stage3.js
          grep -Fq "const SIGNALS_API='/api/engine/signals'" nomad-live-343/dashboard-v2-stage3.js
          if grep -Eq 'fixture-odds|api\.5dollarfootballapi\.com|/api/full-market/' nomad-live-343/dashboard-v2-stage3.js; then
            echo 'ERROR: Dashboard V2 contains a forbidden per-fixture/provider caller'; exit 1
          fi
          if grep -Fq '"FULL_MARKET"' workers/nomadtips3-343-preview/wrangler.jsonc; then
            echo 'ERROR: Preview worker restored FULL_MARKET binding'; exit 1
          fi

      - name: Dry-run preview
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc

      - name: Deploy Dashboard V2 preview assets
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Smoke Dashboard V2 on bulk-only runtime
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$BASE_URL/dashboard-v2.html?smoke=$RANDOM" -o /tmp/dashboard.html
          curl -fsS --max-time 30 "$BASE_URL/dashboard-v2-stage3.js?smoke=$RANDOM" -o /tmp/dashboard.js
          curl -fsS --max-time 30 "$BASE_URL/api/engine/health?smoke=$RANDOM" -o /tmp/health.json
          curl -fsS --max-time 30 "$BASE_URL/api/engine/board?smoke=$RANDOM" -o /tmp/board.json
          grep -Fq 'dashboard-v2-stage3.js' /tmp/dashboard.html
          grep -Fq "const API='/api/engine/board'" /tmp/dashboard.js
          grep -Fq "const SIGNALS_API='/api/engine/signals'" /tmp/dashboard.js
          if grep -Eq 'fixture-odds|api\.5dollarfootballapi\.com|/api/full-market/' /tmp/dashboard.js; then
            echo 'ERROR: deployed Dashboard V2 contains per-fixture/provider caller'; exit 1
          fi
          node - <<'NODE'
          const h=require('/tmp/health.json');
          const b=require('/tmp/board.json');
          if(h.ok!==true||h.dataMode!=='BULK_SNAPSHOT_ONLY'||Number(h.externalOddsRequests)!==0) throw Error('engine is not bulk-only');
          if(b.ok!==true||!Array.isArray(b.fixtures)||b.dataMode!=='BULK_SNAPSHOT_ONLY'||Number(b.referee?.externalRequestsAdded)!==0) throw Error('board is not bulk-only');
          console.log('DASHBOARD_V2_BULK_OK', b.fixtures.length, 'fixtures', b.counts);
          NODE
