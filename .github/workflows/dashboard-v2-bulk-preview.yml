name: Dashboard V2 Bulk Preview

on:
  push:
    branches: [work/nomad343-dashboard-v2-bulk-20260915]
    paths:
      - 'nomad-live-343/dashboard-v2*'
      - 'workers/nomadtips3-343-preview/**'
      - '.github/workflows/dashboard-v2-bulk-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BASE_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev

jobs:
  validate-deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Dashboard V2 bulk-only contract
        run: |
          set -euo pipefail
          node --check nomad-live-343/dashboard-v2-stage3.js
          node --check nomad-live-343/dashboard-v2.js
          node --check nomad-live-343/dashboard-v2-tune.js
          grep -Fq "const API='/api/engine/board'" nomad-live-343/dashboard-v2-stage3.js
          grep -Fq "const SIGNALS_API='/api/engine/signals'" nomad-live-343/dashboard-v2-stage3.js
          grep -Fq 'dashboard-v2-tune.js' nomad-live-343/dashboard-v2.html
          grep -Fq 'dashboard-v2-tune.css' nomad-live-343/dashboard-v2.html
          if grep -Eq 'fixture-odds|api\.5dollarfootballapi\.com|/api/full-market/' nomad-live-343/dashboard-v2-stage3.js; then
            echo 'ERROR: Dashboard V2 contains a forbidden per-fixture/provider caller'; exit 1
          fi
          if grep -Eq 'fetch\(|XMLHttpRequest|fixture-odds|api\.5dollarfootballapi\.com|/api/' nomad-live-343/dashboard-v2-tune.js; then
            echo 'ERROR: Dashboard tune layer must be presentation-only'; exit 1
          fi
          if grep -Fq '"FULL_MARKET"' workers/nomadtips3-343-preview/wrangler.jsonc; then
            echo 'ERROR: Preview worker restored FULL_MARKET binding'; exit 1
          fi

      - name: Dry-run preview
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc

      - name: Deploy Dashboard V2 preview assets
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Smoke Dashboard V2 on bulk-only runtime
        run: |
          set -euo pipefail
          get() {
            name="$1"; url="$2"; out="$3"
            echo "CHECK $name $url"
            code=$(curl -sS -L --retry 6 --retry-delay 2 --retry-all-errors --max-time 30 -w '%{http_code}' -o "$out" "$url")
            echo "$name HTTP $code"
            test "$code" = "200"
          }
          post() {
            name="$1"; url="$2"; out="$3"
            echo "CHECK $name $url"
            code=$(curl -sS -L -X POST --retry 3 --retry-delay 1 --retry-all-errors --max-time 30 -w '%{http_code}' -o "$out" "$url")
            echo "$name HTTP $code"
            test "$code" = "200"
          }
          get DASHBOARD "$BASE_URL/dashboard-v2.html?smoke=$RANDOM" /tmp/dashboard.html
          get DASHBOARD_JS "$BASE_URL/dashboard-v2-stage3.js?smoke=$RANDOM" /tmp/dashboard.js
          get TUNE_JS "$BASE_URL/dashboard-v2-tune.js?smoke=$RANDOM" /tmp/tune.js
          get TUNE_CSS "$BASE_URL/dashboard-v2-tune.css?smoke=$RANDOM" /tmp/tune.css
          post ENGINE_SCAN "$BASE_URL/api/engine/scan?smoke=$RANDOM" /tmp/scan.json
          get ENGINE_HEALTH "$BASE_URL/api/engine/health?smoke=$RANDOM" /tmp/health.json
          get ENGINE_BOARD "$BASE_URL/api/engine/board?smoke=$RANDOM" /tmp/board.json
          grep -Fq 'dashboard-v2-stage3.js' /tmp/dashboard.html
          grep -Fq 'dashboard-v2-tune.js' /tmp/dashboard.html
          grep -Fq 'dashboard-v2-tune.css' /tmp/dashboard.html
          grep -Fq "const API='/api/engine/board'" /tmp/dashboard.js
          grep -Fq "const SIGNALS_API='/api/engine/signals'" /tmp/dashboard.js
          grep -Fq 'mobile-clock' /tmp/tune.js
          grep -Fq 'mobile-clock' /tmp/tune.css
          if grep -Eq 'fixture-odds|api\.5dollarfootballapi\.com|/api/full-market/' /tmp/dashboard.js; then
            echo 'ERROR: deployed Dashboard V2 contains per-fixture/provider caller'; exit 1
          fi
          if grep -Eq 'fetch\(|XMLHttpRequest|fixture-odds|api\.5dollarfootballapi\.com|/api/' /tmp/tune.js; then
            echo 'ERROR: deployed tune layer is not presentation-only'; exit 1
          fi
          node - <<'NODE'
          const s=require('/tmp/scan.json');
          const h=require('/tmp/health.json');
          const b=require('/tmp/board.json');
          if(s.ok!==true||s.dataMode!=='BULK_SNAPSHOT_ONLY'||Number(s.externalOddsRequests)!==0) throw Error('fresh scan is not bulk-only');
          if(h.ok!==true||h.dataMode!=='BULK_SNAPSHOT_ONLY'||Number(h.externalOddsRequests)!==0) throw Error('engine is not bulk-only after fresh scan');
          if(b.ok!==true||!Array.isArray(b.fixtures)||b.dataMode!=='BULK_SNAPSHOT_ONLY'||Number(b.referee?.externalRequestsAdded)!==0) throw Error('board is not bulk-only');
          console.log('DASHBOARD_V2_TUNED_BULK_OK', b.fixtures.length, 'fixtures', b.counts);
          NODE
