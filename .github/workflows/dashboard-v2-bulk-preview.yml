name: NOMAD 3.43 V2 Bulk UI

on:
  push:
    branches: [work/nomad343-dashboard-v2-bulk-20260915]
    paths:
      - 'nomad-live-343/index.html'
      - 'nomad-live-343/dashboard-v2*'
      - 'nomad-live-343/signal.html'
      - 'nomad-live-343/statistics.html'
      - 'nomad-live-343/settings.html'
      - 'nomad-live-343/v2-shared.*'
      - 'nomad-live-343/signal.js'
      - 'nomad-live-343/statistics.js'
      - 'nomad-live-343/settings.js'
      - 'workers/nomadtips3-343-preview/**'
      - '.github/workflows/dashboard-v2-bulk-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BASE_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev

jobs:
  validate-deploy-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate V2 UI and bulk-only contract
        run: |
          set -euo pipefail
          node --check nomad-live-343/dashboard-v2-stage3.js
          node --check nomad-live-343/dashboard-v2.js
          node --check nomad-live-343/dashboard-v2-tune.js
          node --check nomad-live-343/signal.js
          node --check nomad-live-343/statistics.js
          node --check nomad-live-343/settings.js
          node --check nomad-live-343/v2-shared.js
          node --check workers/nomadtips3-343-preview/src/index.js
          grep -Fq "const API='/api/engine/board'" nomad-live-343/dashboard-v2-stage3.js
          grep -Fq "const SIGNALS_API='/api/engine/signals'" nomad-live-343/dashboard-v2-stage3.js
          grep -Fq "const API='/api/engine/signals'" nomad-live-343/signal.js
          grep -Fq "const API='/api/engine/statistics'" nomad-live-343/statistics.js
          grep -Fq "const API='/api/engine/settings'" nomad-live-343/settings.js
          grep -Fq 'NOMAD LIVE 3.43 · BULK DASHBOARD' nomad-live-343/index.html
          grep -Fq 'BULK SNAPSHOT' nomad-live-343/signal.html
          grep -Fq 'BULK SNAPSHOT' nomad-live-343/statistics.html
          grep -Fq '0 per-fixture provider requests' nomad-live-343/settings.html
          grep -Fq '5USD ULTRA · API CONTROL + MONITOR' nomad-live-343/dashboard-v2-api-monitor.html
          grep -Fq "get('/api/hub/control')" nomad-live-343/dashboard-v2-api-monitor.html
          grep -Fq "get('/api/hub/health')" nomad-live-343/dashboard-v2-api-monitor.html
          grep -Fq "get('/api/engine/health')" nomad-live-343/dashboard-v2-api-monitor.html
          grep -Fq "get('/api/full-market/health')" nomad-live-343/dashboard-v2-api-monitor.html
          grep -Fq "req('/api/hub/control'" nomad-live-343/dashboard-v2-api-monitor.html
          grep -Fq 'location.replace' nomad-live-343/dashboard-v2-api-control.html
          if grep -Fqi 'Owner token' nomad-live-343/dashboard-v2-api-monitor.html nomad-live-343/dashboard-v2-api-control.html; then
            echo 'ERROR: unified API center must not ask user for token'; exit 1
          fi
          if grep -Fq 'x-nomad-owner-token' nomad-live-343/dashboard-v2-api-monitor.html; then
            echo 'ERROR: owner token header leaked into browser UI'; exit 1
          fi
          grep -Fq "'x-nomad-internal-control': 'preview-binding-v1'" workers/nomadtips3-343-preview/src/index.js
          grep -Fq "url.pathname === '/dashboard-v2-api-control.html'" workers/nomadtips3-343-preview/src/index.js
          if grep -Eq 'api\.5dollarfootballapi\.com|fixture-odds|/api/full-market/' nomad-live-343/dashboard-v2-stage3.js nomad-live-343/signal.js nomad-live-343/statistics.js nomad-live-343/settings.js nomad-live-343/v2-shared.js; then
            echo 'ERROR: V2 public UI restored forbidden provider/per-fixture caller'; exit 1
          fi
          if grep -Eq 'fetch\(|XMLHttpRequest|/api/' nomad-live-343/dashboard-v2-tune.js nomad-live-343/v2-shared.js; then
            echo 'ERROR: presentation-only UI layer contains network caller'; exit 1
          fi
          if grep -Fq '"FULL_MARKET"' workers/nomadtips3-343-preview/wrangler.jsonc; then
            echo 'ERROR: Preview worker restored FULL_MARKET binding'; exit 1
          fi
          grep -Fq 'main = "src/index-bulk.js"' workers/nomadtips3-engine-343/wrangler.toml
          if grep -Fq 'api.5dollarfootballapi.com' workers/nomadtips3-engine-343/src/index-bulk.js; then
            echo 'ERROR: bulk engine contains direct provider URL'; exit 1
          fi

      - name: Dry-run preview
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc

      - name: Deploy V2 UI assets
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: HTTP smoke unified control and all V2 pages
        run: |
          set -euo pipefail
          get() {
            name="$1"; url="$2"; out="$3"
            echo "CHECK $name $url"
            code="000"
            for attempt in $(seq 1 12); do
              code=$(curl -sS -L --max-time 30 -w '%{http_code}' -o "$out" "$url" || true)
              echo "$name attempt $attempt HTTP $code"
              [ "$code" = "200" ] && break
              sleep 2
            done
            test "$code" = "200"
          }
          get INDEX "$BASE_URL/index.html?smoke=$RANDOM" /tmp/index.html
          get SIGNAL "$BASE_URL/signal.html?smoke=$RANDOM" /tmp/signal.html
          get STATISTICS "$BASE_URL/statistics.html?smoke=$RANDOM" /tmp/statistics.html
          get SETTINGS "$BASE_URL/settings.html?smoke=$RANDOM" /tmp/settings.html
          get API_CENTER "$BASE_URL/dashboard-v2-api-monitor.html?smoke=$RANDOM" /tmp/api-center.html
          get LEGACY_CONTROL "$BASE_URL/dashboard-v2-api-control.html?smoke=$RANDOM" /tmp/legacy-control.html
          get HUB_HEALTH "$BASE_URL/api/hub/health?smoke=$RANDOM" /tmp/hub-health.json
          get HUB_CONTROL "$BASE_URL/api/hub/control?smoke=$RANDOM" /tmp/hub-control.json
          get FULL_MARKET_HEALTH "$BASE_URL/api/full-market/health?smoke=$RANDOM" /tmp/full-market-health.json
          get ENGINE_HEALTH "$BASE_URL/api/engine/health?smoke=$RANDOM" /tmp/engine-health.json
          get ENGINE_BOARD "$BASE_URL/api/engine/board?smoke=$RANDOM" /tmp/board.json
          grep -Fq 'NOMAD LIVE 3.43 · BULK DASHBOARD' /tmp/index.html
          grep -Fq '343-signal-v2-bulk-ui' /tmp/signal.html
          grep -Fq '343-stat-v2-bulk-ui' /tmp/statistics.html
          grep -Fq 'BULK PRICE REFEREE' /tmp/settings.html
          grep -Fq '5USD ULTRA · API CONTROL + MONITOR' /tmp/api-center.html
          grep -Fq '5USD ULTRA · API CONTROL + MONITOR' /tmp/legacy-control.html
          if grep -Fqi 'Owner token' /tmp/api-center.html /tmp/legacy-control.html; then echo 'ERROR: deployed page asks for token'; exit 1; fi
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/hub-health.json','utf8'));
          const c=JSON.parse(fs.readFileSync('/tmp/hub-control.json','utf8'));
          const e=JSON.parse(fs.readFileSync('/tmp/engine-health.json','utf8'));
          const fm=JSON.parse(fs.readFileSync('/tmp/full-market-health.json','utf8'));
          if(h.version!=='nomad343-5usd-hub-v7-live-core-500'||h.architecture!=='LIVE_CORE_1_CALL_PER_CYCLE'||Number(h.livePageSize)!==500) throw Error('HUB v7 not live');
          const m3=(c.modes||[]).find(x=>Number(x.intervalSec)===3),m2=(c.modes||[]).find(x=>Number(x.intervalSec)===2);
          if(!m3||m3.allowed!==true||Number(m3.projectedTotalRequestsPerMinute)!==22.5) throw Error('3s not available');
          if(!m2||m2.allowed!==true||Number(m2.projectedTotalRequestsPerMinute)!==32.5) throw Error('2s not available');
          if(e.version!=='nomad343-engine-v4-bulk-only'||e.dataMode!=='BULK_SNAPSHOT_ONLY'||Number(e.externalOddsRequests)!==0) throw Error('engine bulk-only guard');
          if(fm.mode!=='BULK_SNAPSHOT_ONLY'||Number(fm.externalRequestsAdded)!==0) throw Error('full-market bulk-only guard');
          fs.writeFileSync('/tmp/control-body.json',JSON.stringify({enabled:c.enabled!==false,intervalSec:Number(c.intervalSec)}));
          console.log('API_CENTER_RUNTIME',c.intervalSec,'sec','3s',m3.projectedTotalRequestsPerMinute,'2s',m2.projectedTotalRequestsPerMinute);
          NODE
          code=$(curl -sS --max-time 30 -o /tmp/control-write.json -w '%{http_code}' -X POST -H 'content-type: application/json' --data-binary @/tmp/control-body.json "$BASE_URL/api/hub/control")
          test "$code" = "200"
          node - <<'NODE'
          const a=require('/tmp/hub-control.json'),b=require('/tmp/control-write.json');
          if(b.ok!==true||b.version!=='nomad343-5usd-hub-v7-live-core-500') throw Error('no-token internal control failed');
          if(Number(a.intervalSec)!==Number(b.intervalSec)||Boolean(a.enabled)!==Boolean(b.enabled)) throw Error('smoke changed control state');
          console.log('NO_TOKEN_CONTROL_OK',b.intervalSec,b.enabled);
          NODE

      - name: Browser render smoke main UI and unified API center
        if: always()
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          render() {
            path="$1"; out="$2"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom "$BASE_URL/$path?browser=$RANDOM" > "$out"
          }
          render index.html /tmp/index-rendered.html
          render signal.html /tmp/signal-rendered.html
          render statistics.html /tmp/stat-rendered.html
          render settings.html /tmp/settings-rendered.html
          render dashboard-v2-api-monitor.html /tmp/api-rendered.html
          render dashboard-v2-api-control.html /tmp/legacy-rendered.html
          grep -Fq 'class="match-row' /tmp/index-rendered.html
          if grep -Fq "Loading today's match board" /tmp/index-rendered.html; then echo 'ERROR: index still loading'; exit 1; fi
          grep -Fq 'data-v2="ready"' /tmp/signal-rendered.html
          grep -Fq 'data-v2="ready"' /tmp/stat-rendered.html
          grep -Fq 'data-v2="ready"' /tmp/settings-rendered.html
          grep -Fq 'data-api-unified-ready="1"' /tmp/api-rendered.html
          grep -Fq 'CONTROL + MONITOR ONLINE' /tmp/api-rendered.html
          grep -Fq '3s</strong>' /tmp/api-rendered.html
          grep -Fq '2s</strong>' /tmp/api-rendered.html
          if grep -Fqi 'Owner token' /tmp/api-rendered.html; then echo 'ERROR: rendered page asks for token'; exit 1; fi
          grep -Fq 'data-api-unified-ready="1"' /tmp/legacy-rendered.html
          echo 'V2_UNIFIED_API_CENTER_BROWSER_OK'
