name: NOMAD 3.43 V2 Bulk UI

on:
  push:
    branches: [work/nomad343-v2-primary-20260915]
    paths:
      - 'nomad-live-343/index.html'
      - 'nomad-live-343/dashboard-v2*'
      - 'nomad-live-343/expanded-match-343.*'
      - 'nomad-live-343/full-market-bookmaker-343.*'
      - 'nomad-live-343/expanded-odds-complete-343.*'
      - 'nomad-live-343/ODDS_*'
      - 'nomad-live-343/signal.html'
      - 'nomad-live-343/statistics.html'
      - 'nomad-live-343/settings.html'
      - 'nomad-live-343/v2-shared.*'
      - 'nomad-live-343/v2-header.css'
      - 'nomad-live-343/signal.js'
      - 'nomad-live-343/statistics.js'
      - 'nomad-live-343/settings.js'
      - 'workers/nomadtips3-343-preview/**'
      - '.github/workflows/dashboard-v2-bulk-preview.yml'
  workflow_dispatch:

concurrency:
  group: nomad343-v2-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BASE_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev

jobs:
  validate-deploy-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate V2 UI and John bulk-only contract
        run: |
          set -euo pipefail
          for f in \
            nomad-live-343/dashboard-v2-stage3.js \
            nomad-live-343/dashboard-v2.js \
            nomad-live-343/dashboard-v2-tune.js \
            nomad-live-343/expanded-match-343.js \
            nomad-live-343/full-market-bookmaker-343.js \
            nomad-live-343/signal.js \
            nomad-live-343/statistics.js \
            nomad-live-343/settings.js \
            nomad-live-343/v2-shared.js; do
            node --check "$f"
          done
          grep -Fq "const BOARD_API='/api/engine/board'" nomad-live-343/expanded-match-343.js
          grep -Fq "const HISTORY_API='/api/engine/history'" nomad-live-343/expanded-match-343.js
          grep -Fq "const ODDS_RENDER_OWNER='full-market-bookmaker-only'" nomad-live-343/expanded-match-343.js
          grep -Fq '343-expanded-match-v3-stable-lifecycle' nomad-live-343/expanded-match-343.js
          grep -Fq '343-full-market-bookmaker-v1-bulk-stable' nomad-live-343/full-market-bookmaker-343.js
          grep -Fq 'full-market-bookmaker-343.js?v=343-fmb-v1-bulk-stable' nomad-live-343/index.html
          grep -Fq 'expanded-match-343.js?v=343-expand-v3-stable-lifecycle' nomad-live-343/index.html
          if grep -Eq 'expanded-odds-complete-343|full-odds-main-343' nomad-live-343/index.html; then echo 'ERROR old Full Market renderer restored in index'; exit 1; fi
          if grep -Eq 'fetch\(|XMLHttpRequest|/api/' nomad-live-343/full-market-bookmaker-343.js; then echo 'ERROR Full Market renderer must remain network-free'; exit 1; fi
          if grep -Eq 'api\.5dollarfootballapi\.com|fixture-odds|/api/full-market/' nomad-live-343/dashboard-v2-stage3.js nomad-live-343/expanded-match-343.js nomad-live-343/full-market-bookmaker-343.js nomad-live-343/signal.js nomad-live-343/statistics.js nomad-live-343/settings.js nomad-live-343/v2-shared.js; then echo 'ERROR active V2 restored provider/per-fixture caller'; exit 1; fi
          if grep -Fq '"FULL_MARKET"' workers/nomadtips3-343-preview/wrangler.jsonc; then echo 'ERROR Preview restored FULL_MARKET binding'; exit 1; fi
          grep -Fq 'main = "src/index-bulk.js"' workers/nomadtips3-engine-343/wrangler.toml
          if grep -Fq 'api.5dollarfootballapi.com' workers/nomadtips3-engine-343/src/index-bulk.js; then echo 'ERROR bulk Engine contains direct provider URL'; exit 1; fi
          echo 'STATIC_JOHN_GUARDS_OK'

      - name: Full Market regression self-test
        run: |
          set -euo pipefail
          node - <<'NODE'
          global.window={};
          global.document={readyState:'complete',addEventListener:()=>{},querySelector:()=>null};
          global.CSS={escape:v=>String(v)};
          require('./nomad-live-343/full-market-bookmaker-343.js');
          const api=global.window.NOMAD343_FULL_MARKET_BOOKMAKER;
          if(!api||typeof api.renderBookHtml!=='function')throw Error('Full Market API missing');
          const fixture={fixtureId:'selftest',providerOdds:{
            odds:{
              '1x2':{opening:{home:1.8,draw:3.4,away:4.2},closing:{home:1.75,draw:3.5,away:4.4},inplay:{home:1.5,draw:4.1,away:6}},
              asian_handicap:{opening:-0.25,closing:-0.5,inplay:-0.75},
              goal_line:{opening:2.5,closing:2.75,inplay:3},
              corner_line:{opening:9.5,closing:10,inplay:10.5},
              corner_asian:{opening:-1,closing:-1.5,inplay:-2},
              card_line:{opening:4.5,closing:5,inplay:null},
              card_asian:{opening:-0.5,closing:-0.5,inplay:null},
              asian_handicap_half:{opening:-0.25,closing:-0.25,inplay:null},
              goal_line_half:{opening:1,closing:1.25,inplay:1.5},
              corner_line_half:{opening:4.5,closing:4.5,inplay:5},
              mystery_market:{opening:{alpha:1.23,beta:4.56},closing:null,inplay:null}
            },
            bookmakers:[{slug:'pinnacle',name:'Pinnacle',odds:{
              asian_handicap:{opening:{line:-0.25,home:1.95,away:1.85},closing:{line:-0.5,home:2.02,away:1.78},inplay:{line:-1,home:1.9,away:1.9}},
              goal_line:{opening:{line:2.5,over:1.9,under:1.9},closing:{line:2.75,over:1.85,under:1.95},inplay:{line:3,over:2.05,under:1.75}}
            }}]
          }};
          const diag=api.inspectFixture(fixture);
          if(diag.books.length!==19)throw Error(`expected 19 bookmaker slots, got ${diag.books.length}`);
          if(!diag.found.includes('bet365')||!diag.found.includes('pinnacle'))throw Error('bookmaker discovery failed');
          for(const k of ['1x2','asian_handicap','goal_line','corner_line','corner_asian','card_line','card_asian','asian_handicap_half','goal_line_half','corner_line_half'])if(!diag.markets.includes(k))throw Error(`market lost: ${k}`);
          if(!diag.markets.some(k=>k.startsWith('other:')))throw Error('dynamic unknown market was discarded');
          const bet=api.renderBookHtml(fixture,'bet365'),pin=api.renderBookHtml(fixture,'pinnacle'),empty=api.renderBookHtml(fixture,'crown');
          for(const token of ['Main Match','Asian Handicap','Goal O/U','Corners','Cards','First Half','-0.5','—'])if(!bet.includes(token))throw Error(`bet365 render missing ${token}`);
          for(const token of ['-0.5','2.02','1.78','2.75','1.85','1.95'])if(!pin.includes(token))throw Error(`rich price render missing ${token}`);
          if(!empty.includes('No odds data'))throw Error('missing bookmaker did not remain blank');
          if(bet.length>30000)throw Error(`Full Market output too heavy: ${bet.length}`);
          console.log('FULL_MARKET_SELFTEST_OK',JSON.stringify({books:diag.books.length,found:diag.found,markets:diag.markets.length,bet365Bytes:bet.length}));
          NODE

      - name: Dry-run preview
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc

      - name: Deploy V2 UI assets
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: HTTP smoke and real Board Full Market coverage
        run: |
          set -euo pipefail
          get() { name="$1"; url="$2"; out="$3"; code="000"; for attempt in $(seq 1 18); do code=$(curl -sS -L --max-time 30 -w '%{http_code}' -o "$out" "$url" || true); echo "$name attempt $attempt HTTP $code"; [ "$code" = "200" ] && break; sleep 2; done; [ "$code" = "200" ] || { echo "ERROR HTTP $name=$code"; exit 1; }; }
          get_contains() { name="$1"; url="$2"; out="$3"; pattern="$4"; for attempt in $(seq 1 18); do code=$(curl -sS -L --max-time 30 -w '%{http_code}' -o "$out" "$url" || true); if [ "$code" = "200" ] && grep -Fq "$pattern" "$out"; then echo "$name version ready attempt $attempt"; return 0; fi; echo "$name waiting version attempt $attempt HTTP $code"; sleep 2; done; echo "ERROR $name propagated version missing [$pattern]"; exit 1; }
          get_contains INDEX "$BASE_URL/index.html?smoke=$RANDOM" /tmp/index.html 'full-market-bookmaker-343.js?v=343-fmb-v1-bulk-stable'
          get_contains EXPAND_JS "$BASE_URL/expanded-match-343.js?smoke=$RANDOM" /tmp/expand.js '343-expanded-match-v3-stable-lifecycle'
          get_contains FULL_MARKET_JS "$BASE_URL/full-market-bookmaker-343.js?smoke=$RANDOM" /tmp/full-market.js '343-full-market-bookmaker-v1-bulk-stable'
          get FULL_MARKET_CSS "$BASE_URL/full-market-bookmaker-343.css?smoke=$RANDOM" /tmp/full-market.css
          get ENGINE_HEALTH "$BASE_URL/api/engine/health?smoke=$RANDOM" /tmp/health.json
          get ENGINE_BOARD "$BASE_URL/api/engine/board?smoke=$RANDOM" /tmp/board.json
          get DASHBOARD_JS "$BASE_URL/dashboard-v2-stage3.js?smoke=$RANDOM" /tmp/dashboard.js
          grep -Fq '.fmb-panel' /tmp/full-market.css
          if grep -Eq 'expanded-odds-complete-343|full-odds-main-343' /tmp/index.html; then echo 'ERROR deployed index contains old Full Market'; exit 1; fi
          if grep -Eq 'fetch\(|XMLHttpRequest|/api/' /tmp/full-market.js; then echo 'ERROR deployed Full Market performs network call'; exit 1; fi
          if grep -Eq 'api\.5dollarfootballapi\.com|fixture-odds|/api/full-market/' /tmp/dashboard.js /tmp/expand.js /tmp/full-market.js; then echo 'ERROR deployed active UI contains forbidden caller'; exit 1; fi
          node - <<'NODE'
          const h=require('/tmp/health.json'),b=require('/tmp/board.json'),fixtures=Array.isArray(b.fixtures)?b.fixtures:[];
          console.log('ENGINE_RUNTIME',JSON.stringify({version:h.version,dataMode:h.dataMode,externalOddsRequests:h.externalOddsRequests,boardMode:b.dataMode,externalRequestsAdded:b.referee?.externalRequestsAdded,fixtureCount:fixtures.length}));
          if(h.version!=='nomad343-engine-v4-bulk-only'||h.dataMode!=='BULK_SNAPSHOT_ONLY'||Number(h.externalOddsRequests)!==0)throw Error('runtime architecture is not bulk-only');
          if(b.ok===true&&(b.dataMode!=='BULK_SNAPSHOT_ONLY'||Number(b.referee?.externalRequestsAdded)!==0))throw Error('current board is not bulk-only');
          NODE
          node - <<'NODE'
          global.window={};global.document={readyState:'complete',addEventListener:()=>{},querySelector:()=>null};global.CSS={escape:v=>String(v)};
          require('./nomad-live-343/full-market-bookmaker-343.js');
          const api=global.window.NOMAD343_FULL_MARKET_BOOKMAKER,b=require('/tmp/board.json'),fixtures=Array.isArray(b.fixtures)?b.fixtures:[],f=fixtures.find(x=>x?.providerOdds?.odds||x?.fullOdds);
          if(!f)throw Error('no real priced fixture found');
          const diag=api.inspectFixture(f),html=api.renderBookHtml(f,'bet365');
          const required=['1x2','asian_handicap','goal_line','corner_line','corner_asian','asian_handicap_half','goal_line_half','corner_line_half','card_line','card_asian'];
          for(const k of required)if(!diag.markets.includes(k))throw Error(`REAL_BOARD parser lost ${k}`);
          if(diag.books.length<19)throw Error('bookmaker slots incomplete');
          if(html.length>30000)throw Error(`REAL_BOARD Full Market too heavy: ${html.length}`);
          console.log('REAL_BOARD_FULL_MARKET_OK',JSON.stringify({fixtureId:f.fixtureId,found:diag.found,markets:diag.markets,htmlBytes:html.length}));
          NODE
          echo 'HTTP_REAL_BOARD_GUARDS_OK'

      - name: Browser click and refresh stability smoke
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/nomad343-chrome "$BASE_URL/index.html?stability=$RANDOM" >/tmp/chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9222/json/list >/tmp/cdp-tabs.json && break; sleep 1; done
          node - <<'NODE'
          (async()=>{
            const sleep=ms=>new Promise(r=>setTimeout(r,ms));
            const tabs=await fetch('http://127.0.0.1:9222/json/list').then(r=>r.json()),tab=tabs.find(x=>x.type==='page');
            if(!tab)throw Error('CDP page not found');
            const ws=new WebSocket(tab.webSocketDebuggerUrl);await new Promise((res,rej)=>{ws.onopen=res;ws.onerror=rej});let id=0,pending=new Map();
            ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(Error(JSON.stringify(m.error))):p.resolve(m.result)}};
            const send=(method,params={})=>new Promise((resolve,reject)=>{const n=++id;pending.set(n,{resolve,reject});ws.send(JSON.stringify({id:n,method,params}))});
            const ev=async expression=>{const r=await send('Runtime.evaluate',{expression,returnByValue:true,awaitPromise:true});if(r.exceptionDetails)throw Error(r.exceptionDetails.text||'Runtime exception');return r.result?.result?.value};
            for(let i=0;i<30;i++){if(await ev("Boolean(document.querySelector('.match-row[data-match-id]'))"))break;await sleep(500)}
            const clicked=await ev("(()=>{const r=document.querySelector('.match-row[data-match-id]');if(!r)return false;r.click();return true})()");if(!clicked)throw Error('no match row to click');
            await sleep(2500);
            const before=await ev("(()=>{const e=document.querySelector('.match-expanded'),f=e?.querySelector('[data-full-market-card]');if(!e||!f)return null;e.__nomadStableProbe='keep-me';return{count:document.querySelectorAll('.match-expanded').length,id:e.dataset.expandedMatch,owner:e.dataset.oddsRenderOwner,flow:Boolean(e.querySelector('.expand-flow-card')),full:Boolean(f),tabs:f.querySelectorAll('[data-fmb-book]').length,panelBytes:f.querySelector('[data-fmb-panel]')?.innerHTML.length||0}})()");
            if(!before||before.count!==1||!before.flow||!before.full||before.tabs<19)throw Error(`bad expanded card before refresh ${JSON.stringify(before)}`);
            if(before.panelBytes>35000)throw Error(`expanded Full Market too heavy ${before.panelBytes}`);
            await sleep(33000);
            const after=await ev("(()=>{const e=document.querySelector('.match-expanded'),f=e?.querySelector('[data-full-market-card]');return e&&f?{count:document.querySelectorAll('.match-expanded').length,id:e.dataset.expandedMatch,probe:e.__nomadStableProbe,flow:Boolean(e.querySelector('.expand-flow-card')),tabs:f.querySelectorAll('[data-fmb-book]').length}:null})()");
            if(!after||after.count!==1||after.id!==before.id||after.probe!=='keep-me'||!after.flow||after.tabs<19)throw Error(`expanded card was recreated/lost across poll ${JSON.stringify({before,after})}`);
            console.log('EXPANDED_REFRESH_STABILITY_OK',JSON.stringify({before,after}));ws.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Browser render smoke all pages
        if: always()
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"; test -n "$CHROME"
          render() { "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom "$BASE_URL/$1?browser=$RANDOM" > "$2"; }
          render index.html /tmp/index-rendered.html; render signal.html /tmp/signal-rendered.html; render statistics.html /tmp/stat-rendered.html; render settings.html /tmp/settings-rendered.html
          grep -Fq 'class="match-row' /tmp/index-rendered.html
          if grep -Fq "Loading today's match board" /tmp/index-rendered.html; then echo 'ERROR index still loading'; exit 1; fi
          grep -Fq 'data-v2="ready"' /tmp/signal-rendered.html; grep -Fq 'data-v2="ready"' /tmp/stat-rendered.html; grep -Fq 'data-v2="ready"' /tmp/settings-rendered.html
          echo 'V2_BROWSER_ALL_PAGES_OK'
