name: Read-only statistics paint and stacking inspection
on:
  push:
    branches: [test/ball46-stats-clean-filters-20261120]
    paths: ['.github/workflows/stats-clean-inspect-20261120.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
          node <<'EOF'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch();try{const p=await b.newPage({viewport:{width:1920,height:1000},serviceWorkers:'block'});await p.addInitScript(()=>localStorage.setItem('nomad343_dashboard_theme_v1','dark'));await p.route('**/*',r=>['GET','HEAD'].includes(r.request().method())?r.continue():r.abort());await p.goto('https://ball46-stats-clean-filters-test-20261120.mccarey-supon.workers.dev/index.html?view=statistics',{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>document.querySelector('#b46-finance-chart-card .f46-card')?.getBoundingClientRect().height>0,null,{timeout:60000});
          for(const market of ['all','1x2','ah','ou','btts','corners','cards','other']){
          await p.locator('[data-stat-market="'+market+'"]').first().click();await p.waitForTimeout(2800);
          const v=await p.evaluate(()=>{const g=document.querySelector('#b46-finance-chart-card'),f=g.querySelector('.f46-card'),res=document.querySelector('.sp-results');const info=(e,pseudo)=>{const s=getComputedStyle(e,pseudo),r=e.getBoundingClientRect();return {cls:e.className,pseudo:pseudo||'',t:r.top,b:r.bottom,position:s.position,z:s.zIndex,overflow:s.overflow,transform:s.transform,shadow:s.boxShadow,filter:s.filter,bg:s.background,content:s.content,inset:s.inset,radius:s.borderRadius,clip:s.clipPath,pointer:s.pointerEvents}};const els=[g,g.querySelector('.b46-perf-shell'),f,...f.children,res,...Array.from(res.children).slice(0,2),g.parentElement];return {gap:res.getBoundingClientRect().top-f.getBoundingClientRect().bottom,els:els.filter(Boolean).flatMap(e=>[info(e),info(e,'::before'),info(e,'::after')]).filter(x=>!x.pseudo||x.content!=='none'&&x.content!=='normal'),hit:[-5,0,5,12,20,24,28,35].map(n=>({n,stack:document.elementsFromPoint(f.getBoundingClientRect().left+100,f.getBoundingClientRect().bottom+n).slice(0,5).map(e=>String(e.className))}))}});
          console.log('PAINT '+JSON.stringify({market,...v}));
          if(market==='all'||market==='1x2'){const clip=await p.evaluate(()=>{const r=document.querySelector('#b46-finance-chart-card .f46-card').getBoundingClientRect();return {x:r.left,y:r.bottom-80,width:r.width,height:155}});const jpg=await p.screenshot({type:'jpeg',quality:70,clip});console.log('CROP '+market+' '+jpg.toString('base64'))}
          }await p.close()}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)})
          EOF
