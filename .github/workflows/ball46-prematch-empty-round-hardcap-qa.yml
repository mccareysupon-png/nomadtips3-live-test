name: BALL46 history empty trips and 500 cap verification
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-prematch-empty-round-hardcap-qa.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --test qa/prematch-history-20261120/history-five-rounds.test.mjs qa/prematch-history-20261120/london-cutoff.test.mjs
          node --check qa/prematch-history-20261120/prematch-only-worker.mjs
          ! grep -q 'api.5dollarfootballapi.com' qa/prematch-history-20261120/prematch-only-worker.mjs
