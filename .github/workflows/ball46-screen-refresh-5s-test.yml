name: BALL46 5s cache-only screen refresh tests
on:
  push:
    branches: [codex/ball46-screen-refresh-5s-20261104]
    paths: ['work/screen-refresh-5s-20261104/test-request.json']
permissions:
  contents: write
concurrency:
  group: ball46-screen-refresh-tests
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false --prefix work/screen-refresh-5s-20261104 playwright@1.56.1
      - run: cd work/screen-refresh-5s-20261104 && npx playwright install --with-deps chromium
      - run: node work/screen-refresh-5s-20261104/build.mjs
      - run: node work/screen-refresh-5s-20261104/tests.mjs
      - run: node work/screen-refresh-5s-20261104/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-refresh-5s-preview-proof
          path: |
            work/screen-refresh-5s-20261104/audit
            work/screen-refresh-5s-20261104/stage/dashboard-after.js
      - name: Preserve test evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/screen-refresh-5s-20261104/audit/*.json work/screen-refresh-5s-20261104/stage/dashboard-after.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record 5s display test results; no deployment [skip ci]"
          git push origin HEAD:codex/ball46-screen-refresh-5s-20261104
