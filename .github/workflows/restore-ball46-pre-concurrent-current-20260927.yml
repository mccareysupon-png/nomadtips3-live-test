name: ONE SHOT - Restore Ball46 Pre-Concurrent Current Front 20260927

on:
  push:
    branches: [ops/ball46-undo-concurrent-old-rollback-20260927]
    paths:
      - '.github/workflows/restore-ball46-pre-concurrent-current-20260927.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TARGET_FRONT_VERSION: dae0283d-ce00-4730-8ba4-cf51745f926f
  BALL46_URL: https://ball46-production.mccarey-supon.workers.dev

jobs:
  restore-front-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Restore only Ball46 front to exact pre-concurrent version
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 rollback "$TARGET_FRONT_VERSION" --name ball46-production --message "Undo unintended rollback to rejected old front; restore exact current front from 18:39 ICT"

      - name: Verify exact active front and engine continuity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          a=os.environ['CLOUDFLARE_ACCOUNT_ID']; t=os.environ['CLOUDFLARE_API_TOKEN']; want=os.environ['TARGET_FRONT_VERSION']
          h={'Authorization':f'Bearer {t}','Accept':'application/json'}
          u=f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/scripts/ball46-production/deployments'
          with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=30) as r: p=json.load(r)
          cur=((p.get('result') or {}).get('deployments') or [])[0]['versions'][0]['version_id']
          print('ACTIVE_BALL46_VERSION='+cur)
          if cur!=want: raise SystemExit('FRONT_VERSION_MISMATCH')
          PY
          for ep in health board signals statistics; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_URL/api/engine/$ep?frontrestore=${GITHUB_RUN_ID}-$(date +%s%N)" -o "/tmp/$ep.json"
          done
          node - <<'NODE'
          const fs=require('fs');const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const h=read('/tmp/health.json'),b=read('/tmp/board.json'),s=read('/tmp/signals.json'),t=read('/tmp/statistics.json');
          if(h?.ok!==true||b?.ok!==true||!Array.isArray(b.fixtures)||!Array.isArray(s.signals)||t?.ok!==true||!Array.isArray(t.rows)) throw Error('ENGINE_CONTINUITY_FAIL');
          console.log('FRONT_RESTORE_CONTINUITY_OK',{fixtures:b.fixtures.length,signals:s.signals.length,statistics:t.rows.length,engine:h.version});
          NODE
