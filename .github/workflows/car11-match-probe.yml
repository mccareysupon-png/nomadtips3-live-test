name: CAR 1.1 Match Detail Probe

on:
  push:
    branches: [agent/car11-goaloo-launch-20260816]
    paths:
      - 'car1-1/scripts/probe_match.mjs'
      - '.github/workflows/car11-match-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/car11-goaloo-launch-20260816
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probe match detail routes
        run: node car1-1/scripts/probe_match.mjs
      - name: Commit result
        run: |
          git config user.name 'nomadtips3-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add car1-1/data/match-route-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'car1.1: capture match detail route probe'
          git push origin HEAD:agent/car11-goaloo-launch-20260816
