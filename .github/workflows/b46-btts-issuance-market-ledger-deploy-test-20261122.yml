name: BALL46 BTTS Issuance and Market Ledger Deploy TEST ONLY
on:
  push:
    branches: [fix/ball46-btts-issuance-statistics-test-20261122]
    paths: [.github/workflows/b46-btts-issuance-market-ledger-deploy-test-20261122.yml]
permissions:
  contents: read
concurrency:
  group: ball46-prematch-only-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify BTTS only selection, settlement, daily totals and no 1X2/HCR regressions
        run: |
          node --check qa/prematch-history-20261120/deploy-btts-market-ledger-test-20261122.mjs
          node --test qa/prematch-history-20261120/btts-pick-ledger-test.test.mjs qa/prematch-history-20261120/btts-ultra-shadow.test.mjs qa/prematch-history-20261120/test-pick-ledger.test.mjs qa/prematch-history-20261120/history-cargo-registry.test.mjs
      - name: Install BTTS ledger on existing PreMatch TEST Worker, no frontend modification
        run: node qa/prematch-history-20261120/deploy-btts-market-ledger-test-20261122.mjs
