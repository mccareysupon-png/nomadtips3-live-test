name: Restore Ball46 Statistics flow 20260927

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-ball46-statistics-flow-20260927.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: ball46-statistics-settlement-flow
  cancel-in-progress: false

env:
  REPAIR_REF: c8de65e48f35aaf6c27593a56de7941747a0318a
  BASE_REF: 15ee059599d6dadd2a88669a3c239f588a5e1560
  ENGINE_URL: https://nomadtips3-engine-343.mccarey-supon.workers.dev
  BALL46_URL: https://ball46-production.mccarey-supon.workers.dev
  PUBLIC_URL: https://ball46.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}

jobs:
  restore-and-reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact proven settlement bridge source
        if: github.event_name != 'schedule'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REPAIR_REF }}
          fetch-depth: 0

      - name: Capture exact live state before touching settlement path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b46-flow
          nonce="${GITHUB_RUN_ID}-pre-$(date +%s%N)"
          curl -fsS -L --retry 4 --max-time 25 "$ENGINE_URL/health?flow=$nonce" -o /tmp/b46-flow/health.pre.json
          curl -fsS -L --retry 4 --max-time 25 "$ENGINE_URL/signals?flow=$nonce" -o /tmp/b46-flow/signals.pre.json
          curl -fsS -L --retry 4 --max-time 25 "$ENGINE_URL/statistics?flow=$nonce" -o /tmp/b46-flow/stats.pre.json
          curl -fsS -L --retry 4 --max-time 25 "$BALL46_URL/index.html?flow=$nonce" -o /tmp/b46-flow/index.pre
          curl -fsS -L --retry 4 --max-time 25 "$BALL46_URL/signal.html?flow=$nonce" -o /tmp/b46-flow/signal.pre
          curl -fsS -L --retry 4 --max-time 25 "$BALL46_URL/statistics.html?flow=$nonce" -o /tmp/b46-flow/statistics.pre
          curl -fsS -L --retry 4 --max-time 25 "$BALL46_URL/ball46-logo.svg?flow=$nonce" -o /tmp/b46-flow/logo.pre
          echo "INDEX_SHA=$(sha256sum /tmp/b46-flow/index.pre | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "SIGNAL_SHA=$(sha256sum /tmp/b46-flow/signal.pre | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "STATISTICS_SHA=$(sha256sum /tmp/b46-flow/statistics.pre | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "LOGO_SHA=$(sha256sum /tmp/b46-flow/logo.pre | awk '{print $1}')" >> "$GITHUB_ENV"
          node - <<'NODE' >> "$GITHUB_ENV"
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/b46-flow/health.pre.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/b46-flow/signals.pre.json','utf8'));
          const t=JSON.parse(fs.readFileSync('/tmp/b46-flow/stats.pre.json','utf8'));
          if(h?.ok!==true || s?.ok!==true || t?.ok!==true || !Array.isArray(s?.signals) || !Array.isArray(t?.rows)) throw Error('PRE_STATE_UNHEALTHY');
          console.log('PRE_STATS='+t.rows.length);
          console.log('PRE_PENDING='+s.signals.length);
          console.error('PRE_FLOW_STATE',{engine:h.version||h.engineVersion||null,settled:t.rows.length,pending:s.signals.length});
          NODE

      - name: Lock active Engine version for rollback
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deployments status --name nomadtips3-engine-343 --json > /tmp/b46-flow/deployment.pre.json
          node - <<'NODE' >> "$GITHUB_ENV"
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/b46-flow/deployment.pre.json','utf8'));
          const hits=[];
          function walk(x){
            if(!x||typeof x!=='object')return;
            if(Array.isArray(x)){for(const v of x)walk(v);return;}
            const id=x.version_id??x.versionId??null;
            const pct=Number(x.percentage??x.percent??x.traffic_percent??x.traffic??NaN);
            if(id&&Number.isFinite(pct)&&pct>=99.999)hits.push(String(id));
            for(const v of Object.values(x))walk(v);
          }
          walk(j);
          const unique=[...new Set(hits)];
          if(unique.length!==1)throw Error('ACTIVE_VERSION_NOT_UNAMBIGUOUS:'+JSON.stringify(unique));
          console.log('PRE_ENGINE_VERSION='+unique[0]);
          console.error('LOCKED_ACTIVE_ENGINE_VERSION',unique[0]);
          NODE

      - name: Guard exact repair scope and syntax
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REPAIR_REF"
          node --check workers/nomadtips3-engine-343/src/index-bulk.js
          node --check workers/nomadtips3-engine-343/src/index-bulk-recovery.js
          node --check workers/nomadtips3-engine-343/src/market-core.js
          git diff --exit-code "$BASE_REF" -- workers/nomadtips3-engine-343/src/index-bulk.js workers/nomadtips3-engine-343/src/market-core.js
          changed=$(git diff --name-only "$BASE_REF" -- workers/nomadtips3-engine-343 | sort)
          printf '%s\n' "$changed"
          [ "$changed" = $'workers/nomadtips3-engine-343/src/index-bulk-recovery.js\nworkers/nomadtips3-engine-343/wrangler.toml' ]
          grep -Fq 'external-final-bridge-v1' workers/nomadtips3-engine-343/src/index-bulk-recovery.js
          grep -Fq "'/reconcile-final'" workers/nomadtips3-engine-343/src/index-bulk-recovery.js
          grep -Fq 'main = "src/index-bulk-recovery.js"' workers/nomadtips3-engine-343/wrangler.toml

      - name: Dry run Engine bridge only
        if: github.event_name != 'schedule'
        working-directory: workers/nomadtips3-engine-343
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.toml

      - name: Restore exact proven Engine settlement bridge only
        if: github.event_name != 'schedule'
        id: deploy
        working-directory: workers/nomadtips3-engine-343
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.toml

      - name: Verify bridge and prove no frontend or core-route regression
        id: verify_bridge
        shell: bash
        run: |
          set -euo pipefail
          pass=0
          for n in 1 2 3 4 5 6; do
            nonce="${GITHUB_RUN_ID}-bridge-${n}-$(date +%s%N)"
            if curl -fsS -L --max-time 20 "$ENGINE_URL/bridge-health?flow=$nonce" -o /tmp/b46-flow/bridge.json && grep -Fq 'external-final-bridge-v1' /tmp/b46-flow/bridge.json; then pass=1; break; fi
            sleep 5
          done
          [ "$pass" = 1 ] || { echo 'BRIDGE_NOT_LIVE'; exit 1; }
          nonce="${GITHUB_RUN_ID}-guard-$(date +%s%N)"
          curl -fsS -L --retry 4 --max-time 25 "$BALL46_URL/index.html?flow=$nonce" -o /tmp/b46-flow/index.guard
          curl -fsS -L --retry 4 --max-time 25 "$BALL46_URL/signal.html?flow=$nonce" -o /tmp/b46-flow/signal.guard
          curl -fsS -L --retry 4 --max-time 25 "$BALL46_URL/statistics.html?flow=$nonce" -o /tmp/b46-flow/statistics.guard
          curl -fsS -L --retry 4 --max-time 25 "$BALL46_URL/ball46-logo.svg?flow=$nonce" -o /tmp/b46-flow/logo.guard
          [ "$(sha256sum /tmp/b46-flow/index.guard | awk '{print $1}')" = "$INDEX_SHA" ] || { echo 'INDEX_CHANGED'; exit 1; }
          [ "$(sha256sum /tmp/b46-flow/signal.guard | awk '{print $1}')" = "$SIGNAL_SHA" ] || { echo 'SIGNAL_PAGE_CHANGED'; exit 1; }
          [ "$(sha256sum /tmp/b46-flow/statistics.guard | awk '{print $1}')" = "$STATISTICS_SHA" ] || { echo 'STATISTICS_PAGE_CHANGED'; exit 1; }
          [ "$(sha256sum /tmp/b46-flow/logo.guard | awk '{print $1}')" = "$LOGO_SHA" ] || { echo 'LOGO_CHANGED'; exit 1; }
          for ep in health board signals statistics; do
            curl -fsS -L --retry 4 --max-time 25 "$PUBLIC_URL/api/engine/$ep?flow=$nonce" -o "/tmp/b46-flow/public-$ep.json"
          done
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/b46-flow/public-health.json'));
          const b=JSON.parse(fs.readFileSync('/tmp/b46-flow/public-board.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/b46-flow/public-signals.json'));
          const t=JSON.parse(fs.readFileSync('/tmp/b46-flow/public-statistics.json'));
          if(h?.ok!==true||b?.ok!==true||s?.ok!==true||t?.ok!==true)throw Error('PUBLIC_CORE_ROUTE_FAIL');
          if(!Array.isArray(b.fixtures)||!Array.isArray(s.signals)||!Array.isArray(t.rows))throw Error('PUBLIC_CORE_SHAPE_FAIL');
          console.log('BRIDGE_GUARD_PASS',{fixtures:b.fixtures.length,pending:s.signals.length,settled:t.rows.length});
          NODE

      - name: Roll back Engine if bridge deployment itself fails verification
        if: failure() && github.event_name != 'schedule' && steps.deploy.outcome == 'success' && steps.verify_bridge.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${PRE_ENGINE_VERSION:-}" ]
          npx --yes wrangler@4.92.0 versions deploy "$PRE_ENGINE_VERSION@100%" --name nomadtips3-engine-343 -y --message "Auto rollback failed Ball46 settlement bridge verification ${GITHUB_RUN_ID}"

      - name: Fetch finished fixtures in bulk and reconcile only pending IDs
        id: reconcile
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [ -n "${FIVEDOLLAR_API_KEY:-}" ]
          node - <<'NODE'
          const fs=require('fs');
          const pendingPayload=JSON.parse(fs.readFileSync('/tmp/b46-flow/signals.pre.json','utf8'));
          const pending=Array.isArray(pendingPayload?.signals)?pendingPayload.signals:[];
          const pendingIds=new Set(pending.map(x=>String(x.fixtureId)).filter(Boolean));
          const event=process.env.EVENT_NAME||'';
          const windowHours=event==='schedule'?4:24;
          const end=Math.floor(Date.now()/1000);
          const start=end-windowHours*3600;
          const key=process.env.FIVEDOLLAR_API_KEY;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function getJson(url){
            let last='';
            for(let attempt=1;attempt<=5;attempt++){
              const r=await fetch(url,{headers:{Authorization:`Bearer ${key}`,Accept:'application/json'}});
              const text=await r.text();
              if(r.ok){const j=JSON.parse(text);if(Number(j?.success??1)!==1)throw Error('PROVIDER_SUCCESS_FALSE');return j;}
              last=`HTTP_${r.status}:${text.slice(0,180)}`;
              if(r.status!==429&&r.status<500)throw Error(last);
              const retry=Number(r.headers.get('retry-after'));
              await sleep(Number.isFinite(retry)&&retry>0?retry*1000:attempt*2500);
            }
            throw Error('PROVIDER_RETRY_EXHAUSTED:'+last);
          }
          (async()=>{
            const matches=new Map();let page=1,totalRows=0;
            if(pendingIds.size===0){fs.writeFileSync('/tmp/b46-flow/finished-matches.json','[]');fs.writeFileSync('/tmp/b46-flow/provider-summary.json',JSON.stringify({windowHours,pendingFixtures:0,pages:0,totalRows:0,matched:0},null,2));return;}
            while(page<=30){
              const u=new URL('https://api.5dollarfootballapi.com/v1/fixtures');
              u.searchParams.set('status','finished');u.searchParams.set('start_time',String(start));u.searchParams.set('end_time',String(end));u.searchParams.set('page',String(page));u.searchParams.set('per_page','100');
              const j=await getJson(u.toString());
              const rows=Array.isArray(j?.data)?j.data:[];totalRows+=rows.length;
              for(const f of rows){if(String(f?.status)==='finished'&&pendingIds.has(String(f?.id)))matches.set(String(f.id),f);}
              if(!j?.pagination?.has_more)break;
              page++;await sleep(250);
            }
            if(page>30)throw Error('PROVIDER_PAGINATION_SAFETY_LIMIT');
            const arr=[...matches.values()];
            fs.writeFileSync('/tmp/b46-flow/finished-matches.json',JSON.stringify(arr));
            fs.writeFileSync('/tmp/b46-flow/provider-summary.json',JSON.stringify({windowHours,start,end,pendingFixtures:pendingIds.size,pages:page,totalRows,matched:arr.length,matchedFixtureIds:arr.map(x=>String(x.id))},null,2));
            console.log('PROVIDER_BULK_MATCH',{windowHours,pendingFixtures:pendingIds.size,pages:page,totalRows,matched:arr.length});
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          cat /tmp/b46-flow/provider-summary.json

          node - <<'NODE'
          const fs=require('fs');
          const fixtures=JSON.parse(fs.readFileSync('/tmp/b46-flow/finished-matches.json','utf8'));
          const key=process.env.FIVEDOLLAR_API_KEY;
          const engine=process.env.ENGINE_URL;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            let settled=0;const rows=[];const errors=[];
            for(const f of fixtures){
              let response=null;
              for(let attempt=1;attempt<=3;attempt++){
                try{
                  const r=await fetch(engine+'/reconcile-final',{method:'POST',headers:{'content-type':'application/json','x-settlement-token':key},body:JSON.stringify(f)});
                  const text=await r.text();
                  if(!r.ok)throw Error(`HTTP_${r.status}:${text.slice(0,160)}`);
                  response=JSON.parse(text);break;
                }catch(e){if(attempt===3)throw e;await sleep(attempt*1000);}
              }
              if(response?.ok!==true){errors.push({fixtureId:String(f.id),error:response?.error||'RECONCILE_NOT_OK'});continue;}
              settled+=Number(response?.settled||0);
              for(const x of response?.rows||[])rows.push({fixtureId:String(f.id),id:x.id,market:x.market,result:x.result,finalScore:x.finalScore,finalCorners:x.finalCorners});
            }
            fs.writeFileSync('/tmp/b46-flow/reconcile-summary.json',JSON.stringify({fixturesSent:fixtures.length,settled,rows,errors},null,2));
            console.log('RECONCILE_COMPLETE',{fixturesSent:fixtures.length,settled,errors:errors.length});
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          cat /tmp/b46-flow/reconcile-summary.json

      - name: Prove real Statistics growth and preserve Ball46 frontend
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          nonce="${GITHUB_RUN_ID}-post-$(date +%s%N)"
          curl -fsS -L --retry 4 --max-time 25 "$ENGINE_URL/signals?flow=$nonce" -o /tmp/b46-flow/signals.post.json
          curl -fsS -L --retry 4 --max-time 25 "$ENGINE_URL/statistics?flow=$nonce" -o /tmp/b46-flow/stats.post.json
          curl -fsS -L --retry 4 --max-time 25 "$BALL46_URL/index.html?flow=$nonce" -o /tmp/b46-flow/index.post
          curl -fsS -L --retry 4 --max-time 25 "$BALL46_URL/signal.html?flow=$nonce" -o /tmp/b46-flow/signal.post
          curl -fsS -L --retry 4 --max-time 25 "$BALL46_URL/statistics.html?flow=$nonce" -o /tmp/b46-flow/statistics.post
          curl -fsS -L --retry 4 --max-time 25 "$BALL46_URL/ball46-logo.svg?flow=$nonce" -o /tmp/b46-flow/logo.post
          [ "$(sha256sum /tmp/b46-flow/index.post | awk '{print $1}')" = "$INDEX_SHA" ] || { echo 'INDEX_CHANGED_AFTER_RECONCILE'; exit 1; }
          [ "$(sha256sum /tmp/b46-flow/signal.post | awk '{print $1}')" = "$SIGNAL_SHA" ] || { echo 'SIGNAL_CHANGED_AFTER_RECONCILE'; exit 1; }
          [ "$(sha256sum /tmp/b46-flow/statistics.post | awk '{print $1}')" = "$STATISTICS_SHA" ] || { echo 'STATISTICS_CHANGED_AFTER_RECONCILE'; exit 1; }
          [ "$(sha256sum /tmp/b46-flow/logo.post | awk '{print $1}')" = "$LOGO_SHA" ] || { echo 'LOGO_CHANGED_AFTER_RECONCILE'; exit 1; }
          node - <<'NODE'
          const fs=require('fs');
          const pre=JSON.parse(fs.readFileSync('/tmp/b46-flow/stats.pre.json','utf8'));
          const post=JSON.parse(fs.readFileSync('/tmp/b46-flow/stats.post.json','utf8'));
          const spre=JSON.parse(fs.readFileSync('/tmp/b46-flow/signals.pre.json','utf8'));
          const spost=JSON.parse(fs.readFileSync('/tmp/b46-flow/signals.post.json','utf8'));
          const rec=JSON.parse(fs.readFileSync('/tmp/b46-flow/reconcile-summary.json','utf8'));
          if(post?.ok!==true||spost?.ok!==true||!Array.isArray(post?.rows)||!Array.isArray(spost?.signals))throw Error('POST_STATE_BAD');
          const preIds=new Set((pre.rows||[]).map(x=>String(x.id)));
          const newRows=post.rows.filter(x=>!preIds.has(String(x.id)));
          const bad=newRows.filter(x=>x.status!=='SETTLED'||!x.result||!x.finalScore||!Number.isFinite(Number(x.settledAt)));
          if(bad.length)throw Error('NEW_STATS_INCOMPLETE:'+bad.map(x=>x.id).join(','));
          const growth=post.rows.length-(pre.rows||[]).length;
          const pendingDrop=(spre.signals||[]).length-spost.signals.length;
          console.log('BALL46_STATISTICS_FLOW_RESULT',{before:(pre.rows||[]).length,after:post.rows.length,growth,pendingBefore:(spre.signals||[]).length,pendingAfter:spost.signals.length,pendingDrop,reconciled:rec.settled,newRows:newRows.slice(0,20).map(x=>({id:x.id,fixtureId:x.fixtureId,result:x.result,score:x.finalScore,settledAt:x.settledAt,source:x.settlementSource}))});
          if(process.env.EVENT_NAME!=='schedule' && growth<=0)throw Error('NO_REAL_STATISTICS_GROWTH_ON_RESTORE_RUN');
          if(process.env.EVENT_NAME!=='schedule' && newRows.length<=0)throw Error('NO_NEW_SETTLED_ROWS_ON_RESTORE_RUN');
          NODE

          curl -fsS -L --retry 4 --max-time 25 "$PUBLIC_URL/api/engine/statistics?flow=$nonce" -o /tmp/b46-flow/public-stats.post.json
          node - <<'NODE'
          const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/b46-flow/public-stats.post.json','utf8'));
          if(j?.ok!==true||!Array.isArray(j?.rows))throw Error('PUBLIC_STATS_NOT_LIVE');
          console.log('PUBLIC_BALL46_STATISTICS_LIVE',{total:j.rows.length,latest:j.rows.slice(0,5).map(x=>({id:x.id,fixtureId:x.fixtureId,result:x.result,score:x.finalScore,settledAt:x.settledAt,source:x.settlementSource}))});
          NODE
