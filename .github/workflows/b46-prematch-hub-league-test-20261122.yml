name: BALL46 Pre-Match cached league name TEST offline regressions
on:
  push:
    branches: [fix/ball46-prematch-hub-league-name-20261122]
    paths:
      - qa/prematch-history-20261120/normal-hub-monitor.mjs
      - qa/prematch-history-20261120/normal-hub-monitor.test.mjs
      - .github/workflows/b46-prematch-hub-league-test-20261122.yml
permissions: {contents: read}
jobs:
  test-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Regression tests: league metadata and HCR unaffected
        run: |
          node --check qa/prematch-history-20261120/normal-hub-monitor.mjs
          node --test qa/prematch-history-20261120/normal-hub-monitor.test.mjs qa/prematch-history-20261120/history-cargo-registry.test.mjs qa/prematch-history-20261120/history-five-rounds.test.mjs qa/prematch-history-20261120/hub-upcoming-feed.test.mjs qa/prematch-history-20261120/stored-prematch-feed.test.mjs
      - name: Confirm no deploy or API provider actions
        run: echo 'PASS - offline only, no Cloudflare mutation or provider call'
