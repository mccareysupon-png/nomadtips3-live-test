name: "[Codex PC] Ball46 statistics market icons production"

on:
  push:
    branches:
      - codex-pc/release-ball46-stats-market-icons
    paths:
      - .github/workflows/codex-pc-market-icons-production.yml
      - qa/codex-pc-market-icons-release/**

permissions:
  contents: read

concurrency:
  group: ball46-production-ui-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/codex-pc/release-ball46-stats-market-icons'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser and validate release source
        run: |
          node --check qa/codex-pc-market-icons-release/entry.mjs
          node --check qa/codex-pc-market-icons-release/release.mjs
          npm install --prefix "$RUNNER_TEMP/codex-pc-icons-runtime" --no-package-lock --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/codex-pc-icons-runtime/node_modules/.bin/playwright" install chromium --only-shell
      - name: Verify inactive version and release market icons
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node qa/codex-pc-market-icons-release/release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-pc-market-icons-production-evidence
          path: ${{ runner.temp }}/codex-pc-market-icons-production-proof
          if-no-files-found: ignore
