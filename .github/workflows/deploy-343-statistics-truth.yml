name: Deploy 3.43 Statistics Truth

on:
  push:
    branches:
      - work/nomad343-statistics-truth-final-20260914
    paths:
      - .github/workflows/deploy-343-statistics-truth.yml

permissions:
  contents: write

concurrency:
  group: nomad343-statistics-truth-final
  cancel-in-progress: false

jobs:
  verify-deploy-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASE_SHA: 2650618d373199ce136abbdc4ebd2d2f8c592aa3
      ACTIVE_BRANCH: work/nomad343-server-prewarm-20260914
      ROLLBACK_REF: rollback/pre-343-statistics-truth-prod-20260914
      PROD_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev
      ENGINE_URL: https://nomadtips3-engine-343.mccarey-supon.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nomad343-statistics-truth-final-20260914
          fetch-depth: 80

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lock production base and rollback
        run: |
          set -euo pipefail
          git fetch origin "$ACTIVE_BRANCH" "$ROLLBACK_REF" --depth=20
          test "$(git rev-parse origin/$ACTIVE_BRANCH)" = "$BASE_SHA"
          test "$(git rev-parse origin/$ROLLBACK_REF)" = "$BASE_SHA"

      - name: Verify patched source and exact scope
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA"..HEAD | sort > /tmp/changed.txt
          cat >/tmp/expected.txt <<'EOF'
          .github/scripts/patch-343-statistics-truth.py
          .github/workflows/deploy-343-statistics-truth.yml
          nomad-live-343/statistics.html
          nomad-live-343/statistics.js
          workers/nomadtips3-5usd-hub-343/src/index-v5.js
          workers/nomadtips3-engine-343/src/index.js
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          grep -Fq "const VERSION='nomad343-5usd-hub-v6-settlement-bridge';" workers/nomadtips3-5usd-hub-343/src/index-v5.js
          grep -Fq 'status=finished' workers/nomadtips3-5usd-hub-343/src/index-v5.js
          grep -Fq 'settlement_pending' workers/nomadtips3-5usd-hub-343/src/index-v5.js
          grep -Fq "const VERSION='nomad343-engine-v5-10book-referee-finished-settlement';" workers/nomadtips3-engine-343/src/index.js
          grep -Fq "const SETTLEMENT_REVISION='bet365-rules-v3-finished-only';" workers/nomadtips3-engine-343/src/index.js
          grep -Fq "function periodCompleteForSignal(s,f){return Boolean(MARKET_RULES[s?.market])&&isFinished(f)}" workers/nomadtips3-engine-343/src/index.js
          grep -Fq 'REFEREE_BOOKS=Object.freeze' workers/nomadtips3-engine-343/src/index.js
          grep -Fq 'data-push' nomad-live-343/statistics.html
          grep -Fq '<th>#</th>' nomad-live-343/statistics.html
          grep -Fq 'statistics.js?v=343-stat-truth-v1' nomad-live-343/statistics.html
          node --check workers/nomadtips3-5usd-hub-343/src/index-v5.js
          node --check workers/nomadtips3-engine-343/src/index.js
          node --check nomad-live-343/statistics.js
          node --input-type=module - <<'NODE'
          import {settleOu,settleAh} from './workers/nomadtips3-engine-343/src/market-core.js';
          if(settleOu(2,2,'OVER')!=='PUSH')process.exit(11);
          if(settleAh(1,1,0,'HOME')!=='PUSH')process.exit(12);
          if(settleAh(1,0,-0.75,'HOME')!=='HALF_WIN')process.exit(13);
          console.log('settlement unit checks passed');
          NODE

      - name: Verify active branch immediately before deployment
        run: |
          set -euo pipefail
          git fetch origin "$ACTIVE_BRANCH" --depth=5
          test "$(git rev-parse origin/$ACTIVE_BRANCH)" = "$BASE_SHA"

      - name: Dry run existing workers only
        run: |
          set -euo pipefail
          (cd workers/nomadtips3-5usd-hub-343 && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.toml)
          (cd workers/nomadtips3-engine-343 && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.toml)
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc)

      - name: Deploy existing production workers only
        id: prod_deploy
        run: |
          set -euo pipefail
          (cd workers/nomadtips3-5usd-hub-343 && npx --yes wrangler@4.92.0 deploy --config wrangler.toml)
          (cd workers/nomadtips3-engine-343 && npx --yes wrangler@4.92.0 deploy --config wrangler.toml)
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc)

      - name: Retry smoke until new revisions are actually live
        run: |
          set -euo pipefail
          verified=0
          for attempt in $(seq 1 24); do
            stamp="${RANDOM}$(date +%s)"
            curl -fsS "$ENGINE_URL/registry?_=$stamp" -o /tmp/registry.json || echo '{}' >/tmp/registry.json
            curl -fsS "$PROD_URL/api/live/snapshot?_=$stamp" -o /tmp/hub.json || echo '{}' >/tmp/hub.json
            curl -fsS "$PROD_URL/api/engine/statistics?_=$stamp" -o /tmp/stats.json || echo '{}' >/tmp/stats.json
            curl -fsS "$PROD_URL/statistics.html?_=$stamp" -o /tmp/statistics.html || :
            echo "SMOKE ATTEMPT $attempt"
            if node - <<'NODE'
          const fs=require('fs');
          const read=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return {}}};
          const r=read('/tmp/registry.json'),h=read('/tmp/hub.json'),s=read('/tmp/stats.json');
          const html=(()=>{try{return fs.readFileSync('/tmp/statistics.html','utf8')}catch{return''}})();
          const summary={registry:{ok:r.ok,version:r.version,revision:r.settlementRevision},hub:{ok:h.ok,version:h.version,requests:h.providerRequestCount,budget:h.providerRequestBudget},stats:{ok:s.ok,version:s.version,revision:s.settlementRevision,total:s.total,win:s.win,loss:s.loss,push:s.push,halfWin:s.halfWin,halfLoss:s.halfLoss,rows:Array.isArray(s.rows)},html:{push:html.includes('data-push'),ordinal:html.includes('<th>#</th>'),script:html.includes('statistics.js?v=343-stat-truth-v1')}};
          console.log(JSON.stringify(summary));
          const sum=Number(s.win||0)+Number(s.loss||0)+Number(s.push||0)+Number(s.halfWin||0)+Number(s.halfLoss||0);
          const ok=
            r.ok===true&&r.version==='nomad343-engine-v5-10book-referee-finished-settlement'&&r.settlementRevision==='bet365-rules-v3-finished-only'&&
            h.ok===true&&h.version==='nomad343-5usd-hub-v6-settlement-bridge'&&Number(h.providerRequestCount||0)<=Number(h.providerRequestBudget||5)&&
            s.ok===true&&s.version==='nomad343-engine-v5-10book-referee-finished-settlement'&&s.settlementRevision==='bet365-rules-v3-finished-only'&&typeof s.push==='number'&&Array.isArray(s.rows)&&sum===Number(s.total||0)&&
            html.includes('data-push')&&html.includes('<th>#</th>')&&html.includes('statistics.js?v=343-stat-truth-v1');
          process.exit(ok?0:1);
          NODE
            then
              verified=1
              echo "SMOKE VERIFIED ON ATTEMPT $attempt"
              break
            fi
            sleep 5
          done
          test "$verified" = 1

      - name: Remove temporary deployment files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/deploy-343-statistics-truth.yml .github/scripts/patch-343-statistics-truth.py
          git commit -m 'chore(343): remove temporary statistics deployment files [skip ci]'
          git push origin HEAD:work/nomad343-statistics-truth-final-20260914

      - name: Promote verified source to active production branch
        run: |
          set -euo pipefail
          git fetch origin "$ACTIVE_BRANCH" --depth=5
          test "$(git rev-parse origin/$ACTIVE_BRANCH)" = "$BASE_SHA"
          git diff --name-only "$BASE_SHA"..HEAD | sort > /tmp/final.txt
          cat >/tmp/final-expected.txt <<'EOF'
          nomad-live-343/statistics.html
          nomad-live-343/statistics.js
          workers/nomadtips3-5usd-hub-343/src/index-v5.js
          workers/nomadtips3-engine-343/src/index.js
          EOF
          sort -o /tmp/final-expected.txt /tmp/final-expected.txt
          diff -u /tmp/final-expected.txt /tmp/final.txt
          git push origin HEAD:"$ACTIVE_BRANCH"

      - name: Roll back production workers on any post-deploy failure
        if: failure() && steps.prod_deploy.outcome == 'success'
        run: |
          set -euo pipefail
          git fetch origin "$ROLLBACK_REF" --depth=1
          git checkout --detach "origin/$ROLLBACK_REF"
          (cd workers/nomadtips3-5usd-hub-343 && npx --yes wrangler@4.92.0 deploy --config wrangler.toml)
          (cd workers/nomadtips3-engine-343 && npx --yes wrangler@4.92.0 deploy --config wrangler.toml)
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc)
