name: ONE SHOT - Ball46 Affiliate Price Only 20260928

on:
  push:
    branches:
      - ops/ball46-affiliate-price-only-20260928
    paths:
      - '.github/workflows/ball46-affiliate-price-only-20260928.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply price-only affiliate links from current Production
        shell: bash
        run: bash .github/scripts/ball46_affiliate_price_only_20260928.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-affiliate-price-only-${{ github.run_id }}
          path: /tmp/b46-affiliate-price-only/verify
          if-no-files-found: ignore
          retention-days: 30
