name: BALL46 inspect normal HUB result depot read-only
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-inspect-normal-depot-20261121.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const acct=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          const root='https://api.cloudflare.com/client/v4/accounts/'+acct+'/workers';
          const cf=async p=>{const r=await fetch(root+p,{headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(15000)});const v=await r.json();assert(r.ok&&v.success,p+' '+r.status);return v.result};
          const sampleIds=new Set([204790068,204790070,204790077]);
          for(const name of ['nomadtips3-5usd-hub-343','nomadtips3-engine-343','ball46-prematch-only-test-20261120']){
            const dep=(await cf('/scripts/'+name+'/deployments?per_page=1')).deployments[0];
            const v=await cf('/workers/'+name+'/versions/'+dep.versions[0].version_id+'?include=modules');
            const settings=await cf('/scripts/'+name+'/settings');
            const mods=v.modules.map(x=>{const s=Buffer.from(x.content_base64||'','base64').toString();
              const paths=[...new Set([...s.matchAll(/(?:pathname\s*===?\s*|path\s*===?\s*|case\s*|\.get\s*\(|\.post\s*\(|\.put\s*\()(?:['"])(\/[^'"]{1,70})(?:['"])/g)].map(m=>m[1]))].slice(0,150);
              const calls=[...new Set([...s.matchAll(/https?:\/\/[^\s'"<>\\]{8,160}/g)].map(m=>m[0].split('?')[0]))].filter(x=>!x.includes('5dollarfootballapi.com')).slice(0,30);
              return {name:x.name,size:s.length,paths,hasFinished:/full.?time|final|finished|FT/.test(s),hasSnapshot:/snapshot/.test(s),hasRecent:/recent|archive|history/i.test(s),hasProviderFetch:/5dollarfootballapi/.test(s),hasDurableWrites:/storage\.put|\.sql\.exec/.test(s),calls};
            });
            console.log('DEPOT_CODE '+JSON.stringify({name,version:dep.versions[0].version_id,bindings:settings.bindings?.map(x=>({name:x.name,type:x.type,service:x.service,class:x.class_name})),modules:mods}));
          }
          const hub='https://nomadtips3-5usd-hub-343.mccarey-supon.workers.dev';
          for(const path of ['/health','/snapshot','/recent','/results','/fixtures','/settled','/history']){
            try{const r=await fetch(hub+path,{headers:{accept:'application/json'},signal:AbortSignal.timeout(12000)});
             let o={path,status:r.status,type:r.headers.get('content-type')};
             if(r.ok&&String(o.type).includes('json')){
               const j=await r.json(),data=Array.isArray(j)?j:(j.fixtures??j.rows??j.results??j.matches??[]);
               const st={};for(const x of (Array.isArray(data)?data:[])){const k=String(x.boardState??x.statusCode??x.status??'').toLowerCase();st[k]=(st[k]||0)+1}
               o={...o,keys:Object.keys(j).slice(0,30),length:Array.isArray(data)?data.length:null,statuses:st,sample:Array.isArray(data)?data.slice(0,1).map(x=>({keys:Object.keys(x),fixtureId:x.fixtureId??x.id,status:x.status,statusCode:x.statusCode,boardState:x.boardState,goals:x.goals,kickoffUtc:x.kickoffUtc,home:x.home,away:x.away})):null,selected:Array.isArray(data)?data.filter(x=>sampleIds.has(Number(x.fixtureId??x.id))).map(x=>({fixtureId:x.fixtureId??x.id,status:x.status,goals:x.goals})):[]}
             }else o.body=(await r.text()).slice(0,130);
             console.log('DEPOT_ENDPOINT '+JSON.stringify(o));
            }catch(e){console.log('DEPOT_ENDPOINT '+JSON.stringify({path,error:String(e).slice(0,120)}))}
          }
          JS
