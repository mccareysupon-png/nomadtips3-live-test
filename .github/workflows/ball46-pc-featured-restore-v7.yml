name: BALL46 PC Featured Facts Restore V7
on:
  push:
    branches: [fix/ball46-pc-featured-facts-restore-v7-20261021]
    paths:
      - '.github/workflows/ball46-pc-featured-restore-v7.yml'
      - 'deploy-assets/allmatches-detail-v6/pc-featured-v7.css'
      - 'deploy-assets/allmatches-detail-v6/deploy-pc-featured-v7.mjs'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax validation and screenshots browser
        working-directory: deploy-assets/allmatches-detail-v6
        run: |
          node --check deploy-pc-featured-v7.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 pngjs@7
      - name: Guard V6, measure PC and mobile, promote exact tested Worker version, verify production
        working-directory: deploy-assets/allmatches-detail-v6
        run: node deploy-pc-featured-v7.mjs
      - name: Retain before, candidate and production evidence with rollback report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-pc-featured-restore-v7-evidence
          path: deploy-assets/allmatches-detail-v6/proof/
          retention-days: 30
          if-no-files-found: warn