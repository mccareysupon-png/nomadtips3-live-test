name: NOMAD 3.41 5USD staged self-test
on:
  push:
    branches:
      - work/341-ui-clone-5usd-staged-runtime
    paths:
      - 'nomad-live-341-5usd/**'
      - '.github/workflows/nomad341-5usd-staged-selftest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deploy-ready one-click safety
        run: |
          set -euo pipefail
          grep -q "mode:'CENTRAL_SNAPSHOT'" nomad-live-341-5usd/runtime-config.js
          grep -q "liveProviderEnabled:true" nomad-live-341-5usd/runtime-config.js
          grep -q '"NOMAD341_LIVE_PROVIDER_ENABLED": "true"' nomad-live-341-5usd/server/wrangler.staged.jsonc
          grep -q '"NOMAD341_MACHINE_ID": "341-STAGED-A"' nomad-live-341-5usd/server/wrangler.staged.jsonc
          grep -q '"\* \* \* \* \*"' nomad-live-341-5usd/server/wrangler.staged.jsonc
          grep -q 'apiArmed:false' nomad-live-341-5usd/server/worker-staged.js
          grep -q '/api/nomad341/master' nomad-live-341-5usd/server/worker-staged.js
          grep -q 'ONE_FULL_BOARD_PER_CYCLE' nomad-live-341-5usd/server/worker-staged.js
          grep -q 'priceRefereeProviderRequests:0' nomad-live-341-5usd/server/worker-staged.js
          grep -q 'RUNTIME_CHUNK_PREFIX' nomad-live-341-5usd/server/worker-staged.js
          grep -q 'OPEN API' nomad-live-341-5usd/server/control-page.js
          node --check nomad-live-341-5usd/server/worker-staged.js
          node --check nomad-live-341-5usd/server/control-page.js
      - name: Run zero-provider central runtime self-test
        working-directory: nomad-live-341-5usd/server
        run: node offline-selftest.mjs
      - name: Run one-click switch and machine-lock self-test
        working-directory: nomad-live-341-5usd/server
        run: node control-selftest.mjs
      - name: Dry-run Cloudflare Worker bundle only
        working-directory: nomad-live-341-5usd/server
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.staged.jsonc --outdir .wrangler-dry-run
