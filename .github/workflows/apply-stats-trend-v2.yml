name: Apply Stats Trend Chart V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-stats-trend-v2.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-stats-trend-chart-v2
  cancel-in-progress: false

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply trend patch
        run: python scripts/apply_stats_trend.py

      - name: Syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          for x in ['HISTORICAL OUTCOME TREND','outcomeChart','drawOutcomeChart','coreOutcome']:
            if x not in s: raise SystemExit('missing '+x)
          Path('/tmp/ui.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/ui.js

      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser smoke trend chart
        run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          node scripts/smoke_stats_trend.mjs

      - name: Commit tested chart
        run: |
          git config user.name 'nomadtips3-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/prematch-ui-smoke.yml
          if git diff --cached --quiet; then echo 'No chart changes to commit'; exit 0; fi
          git commit -m 'Stats: add responsive historical outcome trend chart'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Dispatch permanent UI smoke
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/prematch-ui-smoke.yml/dispatches \
            -d '{"ref":"main"}'
