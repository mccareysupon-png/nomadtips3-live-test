name: BALL46 start 1X2 test predictions
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-start-1x2-test-picks.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: ball46-start-1x2-test-picks
  cancel-in-progress: false
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: real-prematch-raw-and-progress
          run-id: 44759126984
          github-token: ${{ github.token }}
          path: scheduled
      - uses: actions/download-artifact@v4
        with:
          name: market-probability-audit
          run-id: 44763476390
          github-token: ${{ github.token }}
          path: audit
      - name: Select only future fixtures and freeze prediction evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node qa/prematch-history-20261120/start-1x2-test-picks.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-frozen-1x2-test-picks
          path: evidence/1x2-test-picks.json
          if-no-files-found: error
          retention-days: 90
