name: BALL46 statistics cleanup isolated preview
on:
  push:
    branches: [test/ball46-statistics-cleanup-20261119]
    paths: ['.github/workflows/statistics-cleanup-test-20261119.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated QA browser
        run: |
          npm install --prefix "$RUNNER_TEMP/b46qa" --no-save --no-package-lock puppeteer-core
          echo "PUPPETEER_ENTRY=$(node -p "require.resolve('puppeteer-core',{paths:['$RUNNER_TEMP/b46qa']})")" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Read-only real page check and deploy isolated snapshot Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --check qa/statistics-cleanup-20261119/test-worker.mjs
          node qa/statistics-cleanup-20261119/test-worker.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: statistics-cleanup-test-evidence
          path: evidence/
          retention-days: 7

