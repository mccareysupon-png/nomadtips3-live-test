name: BALL46 Member Desktop Statistics Compact V3 — Safe Production Deploy
on:
  push:
    branches:
      - work/member-desktop-statistics-compact-v3-20261020
    paths:
      - '.github/workflows/member-statistics-compact-v3-deploy.yml'
      - 'ball46-member/statistics-compact-v3/deploy-production.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ball46-member-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate safe patch and deployment scripts
        run: |
          python3 -m py_compile ball46-member/statistics-compact-v3/patch_active_statistics.py
          node --check ball46-member/statistics-compact-v3/deploy-production.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Export exact verified static asset tree without changing active Worker
        run: |
          set -euo pipefail
          git fetch origin refs/heads/design/member-graphite-noir-dark-20261015:refs/remotes/origin/member-graphite-20261015
          mkdir -p /tmp/ball46-member-live-tree
          git archive --format=tar refs/remotes/origin/member-graphite-20261015 ball46-member/public | tar xf - -C /tmp/ball46-member-live-tree
      - name: Candidate browser QA, verify preserved Member settings and deploy with guarded rollback
        run: node ball46-member/statistics-compact-v3/deploy-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-member-statistics-v3-production-${{ github.run_id }}
          path: audit/member-statistics-v3-production-deploy
          retention-days: 14
