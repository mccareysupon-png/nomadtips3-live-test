name: BALL46 TEST inspect Pre-Match Total BTTS mixing READONLY
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-total-1x2-btts-readonly-inspect-20261122.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read active TEST client and exact Total statistic source
        run: |
          node --input-type=module <<'JS'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          const script='ball46-premium-match-colors-test-20261120';
          const root='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers';
          const headers={authorization:'Bearer '+token};
          const d=await fetch(root+'/scripts/'+script+'/deployments?per_page=1',{headers}).then(r=>r.json());
          if(!d.success)throw Error('VERSION_FETCH_FAILED');
          const version=d.result.deployments?.[0]?.versions?.[0]?.version_id;
          const worker=await fetch(root+'/workers/'+script+'/versions/'+version+'?include=modules',{headers}).then(r=>r.json());
          if(!worker.success)throw Error('ACTIVE_SOURCE_FETCH_FAILED');
          const source=Buffer.from(worker.result.modules[0].content_base64,'base64').toString('utf8');
          const m=source.match(/var prematchClientScript = ("(?:\\.|[^"\\])*");/);
          if(!m)throw Error('EMBEDDED_CLIENT_MISSING');
          const client=JSON.parse(m[1]);
          console.log('B46_TOTAL_INSPECT_VERSION '+version);
          const needles=['Pre-Match · Total (1X2 + BTTS)','1X2 + BTTS','1X2+BTTS','allLedger','bttsLedger','function performancePanel','function stats','function summary','function compute','function totals','renderPreMatch','function render','mode===','marketDaily','function build','function aggregate','function market','BTTS Statistics'];
          const lines=client.split('\n');
          for(const needle of needles){
            const found=[];
            for(let i=0;i<lines.length;i++){
              if(!lines[i].includes(needle))continue;
              const lo=Math.max(0,i-12),hi=Math.min(lines.length,i+21);
              found.push({line:i+1,context:lines.slice(lo,hi).map((s,j)=>(lo+j+1)+': '+s).join('\n')});
              if(found.length>=5)break;
            }
            if(found.length)console.log('B46_TOTAL_SOURCE '+JSON.stringify({needle,found}));
          }
          const data=await fetch('https://'+script+'.mccarey-supon.workers.dev/__b46_prematch_data',{cache:'no-store'}).then(r=>r.json());
          const describe=o=>o&&typeof o==='object'?{keys:Object.keys(o),rows:o.rows?.length,markets:o.rows?.reduce((a,x)=>(a[String(x.market??x.market_type??'?')]=(a[String(x.market??x.market_type??'?')]??0)+1,a),{})}:null;
          console.log('B46_TOTAL_DATA_KEYS '+JSON.stringify(Object.fromEntries(Object.entries(data).map(([k,v])=>[k,describe(v)]))));
          JS
