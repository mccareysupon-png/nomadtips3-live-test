name: BALL46 TEST Manual Control latest odds provenance fix 20261125
on:
  push:
    branches: [feature/ball46-adaptive-manual-control-test-20261125]
    paths: [.github/workflows/b46-adaptive-manual-provenance-fix-20261125.yml]
permissions: {contents: read}
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate module patcher and single-module deploy
        run: |
          node --check qa/prematch-history-20261120/b46-adaptive-manual-control-page-test.mjs
          node --check qa/prematch-history-20261120/deploy-adaptive-manual-provenance-test-20261125.mjs
      - name: Preflight target only; refuse unexpected source version
        run: node qa/prematch-history-20261120/deploy-adaptive-manual-provenance-test-20261125.mjs --dry-run
      - name: Deploy protected manual TEST page provenance fix
        run: node qa/prematch-history-20261120/deploy-adaptive-manual-provenance-test-20261125.mjs
