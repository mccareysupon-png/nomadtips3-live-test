name: DIAG Ball46 Longterm Renderer Source 20261012

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-ball46-longterm-renderer-source-20261012.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-performance-chart-market-style-20261012
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts acorn@8
      - name: Inspect renderer
        working-directory: deploy-assets/performance-chart-market-style-20261012
        run: node inspect.mjs

