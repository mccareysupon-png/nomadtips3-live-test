name: BALL46 premium match colors isolated QA
on:
  push:
    branches: [test/ball46-premium-match-colors-20261120]
    paths: ['.github/workflows/premium-match-colors-test.yml']
permissions:
  contents: read
jobs:
  stage:
    if: github.ref == 'refs/heads/test/ball46-premium-match-colors-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover actual match palette and create CSS only
        run: |
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
          mkdir -p premium-qa "$RUNNER_TEMP/premium-proof"
          node --input-type=module <<'EOF'
          import {chromium,devices} from 'playwright';
          import assert from 'node:assert/strict';
          import {writeFile} from 'node:fs/promises';
          const browser=await chromium.launch();
          const rules=new Map();
          try{
            for(const mobile of [false,true]){
              const p=await browser.newPage(mobile?{...devices['iPhone 13'],serviceWorkers:'block'}:{viewport:{width:1440,height:950},serviceWorkers:'block'});
              await p.addInitScript(()=>localStorage.setItem('nomad343_dashboard_theme_v1','dark'));
              await p.route('**/*',r=>['GET','HEAD'].includes(r.request().method())?r.continue():r.abort());
              await p.goto('https://ball46.com/',{waitUntil:'domcontentloaded'});
              await p.waitForFunction(()=>[...document.querySelectorAll('[data-match-id]')].some(e=>e.getBoundingClientRect().width>100),null,{timeout:60000});
              const data=await p.evaluate(()=>{
                const rows=[...document.querySelectorAll('[data-match-id]')].filter(e=>e.getBoundingClientRect().width>100);
                const out=[];
                const cls=e=>[...e.classList].find(c=>/match|league|odds|market|b46gn|price/i.test(c)&&!/active|selected|hover|live$|row-selected/i.test(c));
                const collect=(e,scope)=>{
                  const r=e.getBoundingClientRect(),s=getComputedStyle(e),rgb=s.backgroundColor.match(/\d+/g)?.map(Number),c=cls(e);
                  if(!c||!rgb||r.width<40||r.height<18||rgb[1]<rgb[0]+9||rgb[1]<rgb[2]+4||rgb[1]>145||rgb[1]<55||rgb[3]===0)return;
                  const type=scope==='header'?'header':scope==='row'?'row':'odds';
                  out.push({selector:(scope==='header'?'':scope==='row'?'[data-match-id]':'[data-match-id] ') +'.'+CSS.escape(c),type,color:s.backgroundColor});
                };
                for(const row of rows.slice(0,12)){
                  collect(row,'row');
                  for(const e of row.querySelectorAll('*'))if(/odds|market|price/i.test(e.className?.toString()||'')&&!/badge|signal|prediction/i.test(e.className?.toString()||''))collect(e,'odds');
                  let a=row.parentElement;for(let i=0;a&&i<4;i++,a=a.parentElement)for(const e of a.children)if(/league.*(head|bar|title)|(?:head|bar).*league/i.test(e.className?.toString()||''))collect(e,'header');
                }
                return {theme:document.documentElement.dataset.theme,rows:rows.length,out};
              });
              console.log('DISCOVERED',JSON.stringify({mobile,...data}));
              assert(data.theme==='dark','DARK_THEME_NOT_CONFIRMED');
              assert(data.out.some(x=>x.type==='row'),'ROW_PALETTE_NOT_FOUND');
              for(const x of data.out)rules.set(x.selector,x.type);
              await p.screenshot({path:process.env.RUNNER_TEMP+'/premium-proof/before-'+mobile+'.png'});
              await p.close();
            }
          }finally{await browser.close()}
          assert([...rules.values()].includes('odds')&&[...rules.values()].includes('header'),'SOURCE_SELECTORS_NOT_CONFIRMED');
          const colors={row:'background:linear-gradient(135deg,#24443e,#192f2b)!important;border-color:#31544b!important',header:'background:#25453e!important;border-color:#375b52!important',odds:'background:linear-gradient(135deg,#294b43,#1c3530)!important;border-color:#365b51!important;box-shadow:inset 0 0 0 1px #365b51!important'};
          const css=[...rules].map(([s,t])=>'html:root[data-theme="dark"] body '+s+'{'+colors[t]+'}').join('\n');
          await writeFile('premium-qa/palette.json',JSON.stringify({css,rules:[...rules]}));
          EOF
      - name: Deploy only isolated CSS test worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > premium-qa/worker.mjs <<'EOF'
          import palette from './palette.json';
          export default {async fetch(req,env){
            const u=new URL(req.url);
            if(!['GET','HEAD'].includes(req.method))return new Response('READ_ONLY',{status:405});
            if(u.pathname==='/_premium_health')return Response.json({ok:true,scope:'TEST_ONLY_CSS',...palette});
            if(/^\/(admin|internal)(\/|$)/i.test(u.pathname))return new Response('Forbidden',{status:403});
            const headers=new Headers();for(const k of ['accept','accept-language','user-agent','sec-ch-ua-mobile']){const v=req.headers.get(k);if(v)headers.set(k,v);}
            const r=await env.B46_PRODUCTION_READ.fetch(new Request(new URL(u.pathname+u.search,'https://ball46.com'),{method:req.method,headers,redirect:'manual'}));
            const h=new Headers(r.headers);h.delete('set-cookie');h.set('x-robots-tag','noindex, nofollow');
            const loc=h.get('location');if(loc){const d=new URL(loc,'https://ball46.com');if(['ball46.com','www.ball46.com'].includes(d.hostname))h.set('location',new URL(d.pathname+d.search+d.hash,req.url).toString())}
            if(req.method!=='GET'||!r.ok||!['/','/index','/index.html'].includes(u.pathname)||!h.get('content-type')?.includes('text/html'))return new Response(req.method==='HEAD'?null:r.body,{status:r.status,headers:h});
            for(const k of ['content-length','content-encoding','etag','last-modified'])h.delete(k);
            h.set('cache-control','no-store');
            return new HTMLRewriter().on('head',{element(e){e.append('<style id="b46-premium-match-test">'+palette.css+'</style>',{html:true})}}).transform(new Response(r.body,{status:r.status,headers:h}));
          }};
          EOF
          cat > premium-qa/wrangler.toml <<'EOF'
          name = "ball46-premium-match-colors-test-20261120"
          main = "worker.mjs"
          compatibility_date = "2026-11-20"
          workers_dev = true
          preview_urls = false
          [[services]]
          binding = "B46_PRODUCTION_READ"
          service = "ball46-production"
          EOF
          node --check premium-qa/worker.mjs
          npx --yes wrangler@4.50.0 deploy --config premium-qa/wrangler.toml --name ball46-premium-match-colors-test-20261120
      - name: Verify PC and mobile dark and light
        run: |
          node --input-type=module <<'EOF'
          import {chromium,devices} from 'playwright';
          import assert from 'node:assert/strict';
          const base='https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev';
          let h;for(let i=0;i<15;i++){try{const r=await fetch(base+'/_premium_health');if(r.ok){h=await r.json();break}}catch{}await new Promise(r=>setTimeout(r,2000))}
          assert.equal(h?.scope,'TEST_ONLY_CSS');
          const browser=await chromium.launch();
          try{for(const mobile of [false,true])for(const theme of ['dark','light']){
            const p=await browser.newPage(mobile?{...devices['iPhone 13'],serviceWorkers:'block'}:{viewport:{width:1440,height:950},serviceWorkers:'block'});
            await p.addInitScript(t=>localStorage.setItem('nomad343_dashboard_theme_v1',t),theme);
            await p.route('**/*',r=>['GET','HEAD'].includes(r.request().method())?r.continue():r.abort());
            await p.goto(base+'/',{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>[...document.querySelectorAll('[data-match-id]')].some(e=>e.getBoundingClientRect().width>100),null,{timeout:60000});
            const proof=await p.evaluate(({rules,theme})=>{
              const rows=[...document.querySelectorAll('[data-match-id]')].filter(e=>e.getBoundingClientRect().width>100);
              const e=rows.find(e=>rules.some(([s,t])=>t==='row'&&e.matches(s)));
              if(!e)return null;
              const before={w:e.offsetWidth,h:e.offsetHeight,bg:getComputedStyle(e).backgroundImage};
              const style=document.getElementById('b46-premium-match-test');style.disabled=true;
              const original={w:e.offsetWidth,h:e.offsetHeight,bg:getComputedStyle(e).backgroundImage};
              style.disabled=false;
              return {before,original,theme:document.documentElement.dataset.theme};
            },{rules:h.rules,theme});
            assert(proof);assert.equal(proof.theme,theme);assert.equal(proof.before.w,proof.original.w);assert.equal(proof.before.h,proof.original.h);
            if(theme==='dark')assert(proof.before.bg.includes('linear-gradient')&&proof.before.bg!==proof.original.bg);else assert.equal(proof.before.bg,proof.original.bg);
            console.log('PALETTE_PASS',JSON.stringify({mobile,theme,proof}));
            await p.screenshot({path:process.env.RUNNER_TEMP+'/premium-proof/after-'+mobile+'-'+theme+'.png'});
            await p.close();
          }}finally{await browser.close()}
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-match-proof
          path: ${{ runner.temp }}/premium-proof
          if-no-files-found: ignore
