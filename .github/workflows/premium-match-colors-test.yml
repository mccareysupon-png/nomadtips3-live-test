name: BALL46 premium match colors isolated QA
on:
  push:
    branches: [test/ball46-premium-match-colors-20261120]
    paths: ['.github/workflows/premium-match-colors-test.yml']
concurrency:
  group: ball46-premium-match-colors-test-20261120
  cancel-in-progress: true
permissions:
  contents: read
  statuses: write
jobs:
  stage:
    if: github.ref == 'refs/heads/test/ball46-premium-match-colors-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish test status
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/statuses/${{ github.sha }} -f state=pending -f context=ball46-premium-worker -f description='Reading reference palette and testing Worker' -f target_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Discover actual match palette and create CSS only
        run: |
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
          mkdir -p premium-qa "$RUNNER_TEMP/premium-proof"
          node --input-type=module <<'EOF'
          import {chromium,devices} from 'playwright';
          import assert from 'node:assert/strict';
          import {writeFile} from 'node:fs/promises';
          const browser=await chromium.launch();
          const rules=[['[data-match-id]','row'],['.league-head','header'],['[data-match-id] .market-cell','odds']];
          let reference;
          try{
            const p=await browser.newPage({viewport:{width:1440,height:950},serviceWorkers:'block'});
            await p.addInitScript(()=>localStorage.setItem('nomad343_dashboard_theme_v1','dark'));
            await p.route('**/*',r=>['GET','HEAD'].includes(r.request().method())?r.continue():r.abort());
            await p.goto('https://ball46.com/index.html?view=statistics',{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>{const c=document.querySelector('#b46-finance-chart-card');return c&&[...c.querySelectorAll('.b46-stage-outcomes')].some(e=>e.getBoundingClientRect().width>100)&&[...c.querySelectorAll('.b46-perf-kpi')].some(e=>e.getBoundingClientRect().width>0)},null,{timeout:90000});
            reference=await p.evaluate(()=>{
              const c=document.querySelector('#b46-finance-chart-card'),visible=e=>e&&e.getBoundingClientRect().width>0&&e.getBoundingClientRect().height>0;
              const outcome=[...c.querySelectorAll('.b46-stage-outcomes')].find(visible);
              const rate=[...c.querySelectorAll('.b46-perf-kpi')].find(e=>visible(e)&&/WIN RATE/i.test(e.textContent))||[...c.querySelectorAll('.b46-perf-kpi')].find(e=>visible(e)&&/ROI/i.test(e.textContent));
              const surface=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return {className:e.className,backgroundColor:s.backgroundColor,backgroundImage:s.backgroundImage,borderColor:s.borderTopColor,width:r.width,height:r.height}};
              let cum=null;for(let e=outcome?.parentElement;e&&c.contains(e);e=e.parentElement){const x=surface(e);if(x.width>300&&x.height>130&&(x.backgroundImage!=='none'||!['transparent','rgba(0, 0, 0, 0)'].includes(x.backgroundColor))){cum=x;break}}
              return {theme:document.documentElement.dataset.theme,cum,rate:rate?surface(rate):null,outcome:outcome?surface(outcome):null};
            });
            console.log('EXACT_STATS_REFERENCE',JSON.stringify(reference));
            assert.equal(reference.theme,'dark');
            assert(reference.cum&&reference.rate&&reference.outcome,'STATS_REFERENCE_SURFACE_MISSING');
            await p.screenshot({path:process.env.RUNNER_TEMP+'/premium-proof/stats-reference.png'});
            await p.close();
          }finally{await browser.close()}
          const colors={row:reference.cum,header:reference.outcome,odds:reference.rate};
          const css='@layer b46PremiumMatch{@media (min-width:1024px){'+rules.map(([sel,t])=>{const v=colors[t];return 'html:root[data-theme="dark"] body :is(#b46-premium-specificity#b46-premium-specificity#b46-premium-specificity,'+sel+'){background-color:'+v.backgroundColor+'!important;background-image:'+v.backgroundImage+'!important;border-color:'+v.borderColor+'!important}'}).join('\n')+'}}';
          await writeFile('premium-qa/palette.json',JSON.stringify({css,rules,reference}));
          EOF
      - name: Deploy only isolated CSS test worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > premium-qa/worker.mjs <<'EOF'
          import palette from './palette.json';
          export default {async fetch(req,env){
            const u=new URL(req.url);
            if(!['GET','HEAD'].includes(req.method))return new Response('READ_ONLY',{status:405});
            if(u.pathname==='/_premium_health')return Response.json({ok:true,scope:'TEST_ONLY_CSS',revision:'STAT_CARD_EXACT_V3',...palette});
            if(/^\/(admin|internal)(\/|$)/i.test(u.pathname))return new Response('Forbidden',{status:403});
            const headers=new Headers();for(const k of ['accept','accept-language','user-agent','sec-ch-ua-mobile']){const v=req.headers.get(k);if(v)headers.set(k,v);}
            const r=await env.B46_PRODUCTION_READ.fetch(new Request(new URL(u.pathname+u.search,'https://ball46.com'),{method:req.method,headers,redirect:'manual'}));
            const h=new Headers(r.headers);h.delete('set-cookie');h.set('x-robots-tag','noindex, nofollow');
            const loc=h.get('location');if(loc){const d=new URL(loc,'https://ball46.com');if(['ball46.com','www.ball46.com'].includes(d.hostname))h.set('location',new URL(d.pathname+d.search+d.hash,req.url).toString())}
            if(req.method!=='GET'||!r.ok||!['/','/index','/index.html'].includes(u.pathname)||!h.get('content-type')?.includes('text/html'))return new Response(req.method==='HEAD'?null:r.body,{status:r.status,headers:h});
            for(const k of ['content-length','content-encoding','etag','last-modified'])h.delete(k);
            h.set('cache-control','no-store');
            return new HTMLRewriter().on('head',{element(e){e.prepend('<style id="b46-premium-match-test">'+palette.css+'</style>',{html:true})}}).transform(new Response(r.body,{status:r.status,headers:h}));
          }};
          EOF
          cat > premium-qa/wrangler.toml <<'EOF'
          name = "ball46-premium-match-colors-test-20261120"
          main = "worker.mjs"
          compatibility_date = "2026-11-20"
          workers_dev = true
          preview_urls = false
          [[services]]
          binding = "B46_PRODUCTION_READ"
          service = "ball46-production"
          EOF
          node --check premium-qa/worker.mjs
          npx --yes wrangler@4.50.0 deploy --config premium-qa/wrangler.toml --name ball46-premium-match-colors-test-20261120
      - name: Verify PC dark and light
        run: |
          node --input-type=module <<'EOF'
          import {chromium,devices} from 'playwright';
          import assert from 'node:assert/strict';
          const base='https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev';
          let h;for(let i=0;i<15;i++){try{const r=await fetch(base+'/_premium_health');if(r.ok){const candidate=await r.json();if(candidate.revision==='STAT_CARD_EXACT_V3'){h=candidate;break}}}catch{}await new Promise(r=>setTimeout(r,2000))}
          assert.equal(h?.scope,'TEST_ONLY_CSS');assert.equal(h?.revision,'STAT_CARD_EXACT_V3');
          const browser=await chromium.launch();
          try{for(const mobile of [false])for(const theme of ['dark','light']){
            const p=await browser.newPage(mobile?{...devices['iPhone 13'],serviceWorkers:'block'}:{viewport:{width:1440,height:950},serviceWorkers:'block'});
            await p.addInitScript(t=>localStorage.setItem('nomad343_dashboard_theme_v1',t),theme);
            await p.route('**/*',r=>['GET','HEAD'].includes(r.request().method())?r.continue():r.abort());
            await p.goto(base+'/',{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>[...document.querySelectorAll('[data-match-id]')].some(e=>e.getBoundingClientRect().width>100),null,{timeout:60000});
            const proof=await p.evaluate(({rules,theme})=>{
              const visible=e=>e.getBoundingClientRect().width>40&&e.getBoundingClientRect().height>15;
              const targets=rules.map(([selector,type])=>({type,e:[...document.querySelectorAll(selector)].find(visible)}));
              if(targets.some(x=>!x.e))return null;
              const surface=e=>{const s=getComputedStyle(e);return {w:e.offsetWidth,h:e.offsetHeight,bg:s.backgroundImage,color:s.backgroundColor,border:s.borderTopColor}};
              const style=document.getElementById('b46-premium-match-test');
              const applied=targets.map(({type,e})=>({type,...surface(e)}));
              style.sheet.disabled=true;
              const original=targets.map(({type,e})=>({type,...surface(e)}));
              style.sheet.disabled=false;
              return {applied,original,theme:document.documentElement.dataset.theme};
            },{rules:h.rules,theme});
            console.log('COMPUTED_PROOF',JSON.stringify(proof));await p.screenshot({path:process.env.RUNNER_TEMP+'/premium-proof/actual-'+theme+'.png'});assert(proof);assert.equal(proof.theme,theme);
            const refs={row:h.reference.cum,header:h.reference.outcome,odds:h.reference.rate};
            for(let i=0;i<proof.applied.length;i++){const x=proof.applied[i],o=proof.original[i];assert.equal(x.w,o.w);assert.equal(x.h,o.h);if(theme==='dark'){assert.equal(x.bg,refs[x.type].backgroundImage);assert.equal(x.color,refs[x.type].backgroundColor);assert.equal(x.border,refs[x.type].borderColor)}else assert.deepEqual(x,o)}
            console.log('PALETTE_PASS',JSON.stringify({mobile,theme,proof}));
            await p.screenshot({path:process.env.RUNNER_TEMP+'/premium-proof/after-'+mobile+'-'+theme+'.png'});
            await p.close();
          }}finally{await browser.close()}
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-match-proof
          path: ${{ runner.temp }}/premium-proof
          if-no-files-found: ignore

      - name: Publish final Worker verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          if [ "$JOB_STATUS" = cancelled ]; then state=error; fi
          gh api --method POST repos/${{ github.repository }}/statuses/${{ github.sha }} -f state="$state" -f context=ball46-premium-worker -f description="Worker verification: $JOB_STATUS" -f target_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
