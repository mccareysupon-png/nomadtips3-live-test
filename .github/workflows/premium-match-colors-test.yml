name: BALL46 premium match colors isolated QA
on:
  push:
    branches: [test/ball46-premium-match-colors-20261120]
    paths: ['.github/workflows/premium-match-colors-test.yml']
concurrency:
  group: ball46-premium-match-colors-test-20261120
  cancel-in-progress: true
permissions:
  contents: read
  statuses: write
jobs:
  stage:
    if: github.ref == 'refs/heads/test/ball46-premium-match-colors-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish test status
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/statuses/${{ github.sha }} -f state=pending -f context=ball46-premium-worker -f description='Reading reference palette and testing Worker' -f target_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Discover actual match palette and create CSS only
        run: |
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
          mkdir -p premium-qa "$RUNNER_TEMP/premium-proof"
          node --input-type=module <<'EOF'
          import {chromium,devices} from 'playwright';
          import assert from 'node:assert/strict';
          import {writeFile} from 'node:fs/promises';
          const browser=await chromium.launch();
          const rules=[['[data-match-id]','row'],['.league-head','header'],['[data-match-id] .market-cell','odds']];
          let reference;
          try{
            const p=await browser.newPage({viewport:{width:1920,height:1080},serviceWorkers:'block'});
            await p.addInitScript(()=>localStorage.setItem('nomad343_dashboard_theme_v1','dark'));
            await p.route('**/*',r=>['GET','HEAD'].includes(r.request().method())?r.continue():r.abort());
            await p.goto('https://ball46.com/index.html?view=statistics',{waitUntil:'domcontentloaded',timeout:60000});
            const visible=e=>e.getBoundingClientRect().width>0&&e.getBoundingClientRect().height>0;
            const nav=p.locator('[data-workspace-view="statistics"]');
            if(await nav.count()&&await nav.first().isVisible())await nav.first().click().catch(()=>{});
            const total=p.locator('[data-stat-market="all"]');
            if(await total.count()&&await total.first().isVisible())await total.first().click().catch(()=>{});
            await p.waitForFunction(()=>[...document.querySelectorAll('body *')].some(e=>e.childElementCount===0&&e.textContent.trim().toUpperCase()==='CUMULATIVE UNITS'&&e.getBoundingClientRect().width>0),null,{timeout:60000}).catch(()=>{});
            await p.waitForTimeout(6500);
            reference=await p.evaluate(()=>{
              const card=[...document.querySelectorAll('.f46-overview')].find(e=>e.getBoundingClientRect().width>0&&/CUMULATIVE UNITS/i.test(e.innerText));
              if(!card)return {error:'EXACT_CARD_NOT_FOUND'};
              const get=(e,p=null)=>{const s=getComputedStyle(e,p);return {backgroundColor:s.backgroundColor,backgroundImage:s.backgroundImage,backgroundBlendMode:s.backgroundBlendMode,backgroundSize:s.backgroundSize,backgroundPosition:s.backgroundPosition,borderColor:s.borderTopColor,boxShadow:s.boxShadow,content:s.content,display:s.display,opacity:s.opacity}};
              const sourceRules=[];const crawl=(rules,origin)=>{for(const r of rules){if(r.selectorText&&/f46-overview|f46-card|b46-perf-shell|b46-finance-chart-card/.test(r.selectorText)&&/background|shadow|border-color/i.test(r.style?.cssText||''))sourceRules.push({selector:r.selectorText,css:r.style.cssText,origin});if(r.cssRules)try{crawl(r.cssRules,origin)}catch{}}};
              for(const sheet of document.styleSheets)try{crawl(sheet.cssRules,sheet.href||sheet.ownerNode?.id||'inline')}catch{}
              const cardRect=card.getBoundingClientRect();
              const layers=[];
              for(let e=card;e&&e!==document.body;e=e.parentElement){
                if(!e.matches('.f46-overview,.f46-card,.b46-perf-shell,#b46-finance-chart-card'))continue;
                const rect=e.getBoundingClientRect();
                for(const pseudo of [null,'::before','::after']){
                  const s=getComputedStyle(e,pseudo);
                  const value=get(e,pseudo);
                  const w=pseudo?parseFloat(s.width):rect.width,h=pseudo?parseFloat(s.height):rect.height;
                  const left=Number.isFinite(parseFloat(s.left))?parseFloat(s.left):rect.width-w-parseFloat(s.right||'0');
                  const x=pseudo?rect.left+left:rect.left;
                  const top=Number.isFinite(parseFloat(s.top))?parseFloat(s.top):0;
                  const y=pseudo?rect.top+top:rect.top;
                  layers.push({className:String(e.className),pseudo,value,rect:{x,y,w,h},position:s.position,z:s.zIndex,right:s.right,left:s.left,top:s.top});
                }
              }
              const similar=l=>Math.abs(l.rect.x-cardRect.x)<24&&Math.abs(l.rect.w-cardRect.width)<40&&Math.abs(l.rect.h-cardRect.height)<40;
              const paint=layers.filter(l=>similar(l)&&l.value.backgroundImage.includes('gradient')&&(!l.pseudo||l.value.content!=='none'));
              return {theme:document.documentElement.dataset.theme,selector:'.f46-overview',actual:get(card),before:get(card,'::before'),after:get(card,'::after'),sourceRules,layers,paint,cardRect:{x:cardRect.x,y:cardRect.y,w:cardRect.width,h:cardRect.height}};
            });
            console.log('EXACT_CARD_LAYERS',JSON.stringify({...reference,sourceRules:reference.sourceRules.filter(x=>/gradient|--f46-bg/.test(x.css))}));
            assert.equal(reference.theme,'dark');
            await p.screenshot({path:process.env.RUNNER_TEMP+'/premium-proof/stats-reference.png'});
            const v=reference.paint?.[0]?.value;
            assert(v,'NO_GRADIENT_ON_CUMULATIVE_UNITS_VISUAL_LAYER');
            reference.cum=v;reference.outcome=v;reference.rate=v;
            await p.goto('https://ball46.com/',{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>[...document.querySelectorAll('[data-match-id]')].filter(e=>e.getBoundingClientRect().width>100&&e.querySelector('.market-cell')).length>=2,null,{timeout:60000});
            const pair=await p.evaluate(()=>[...document.querySelectorAll('[data-match-id]')].filter(e=>e.getBoundingClientRect().width>100&&e.querySelector('.market-cell')).slice(0,2).map(e=>e.dataset.matchId));
            const clickRow=async id=>{await p.locator('[data-match-id="'+id.replaceAll('"','\\"')+'"]').first().evaluate(e=>e.click());await p.waitForTimeout(500)};
            const state=async()=>p.evaluate(ids=>ids.map(id=>{const e=[...document.querySelectorAll('[data-match-id]')].find(x=>x.dataset.matchId===id&&x.getBoundingClientRect().width>100);return e?{id,classes:[...e.classList],attrs:[...e.attributes].filter(a=>/^(aria-|data-)/.test(a.name)&&/active|selected|current|focus/i.test(a.name)).map(a=>[a.name,a.value])}:null}),pair);
            await clickRow(pair[0]);const first=await state();await clickRow(pair[1]);const second=await state();
            const candidates=[];
            if(first.every(Boolean)&&second.every(Boolean)){
              const token=c=>/active|selected|current|focus|picked|chosen/i.test(c);
              for(const c of second[1].classes)if(token(c)&&!second[0].classes.includes(c)&&first[0].classes.includes(c)&&!first[1].classes.includes(c))candidates.push('[data-match-id].'+c);
              for(const [k,val] of second[1].attrs)if(val&&val!=='false'&&val!=='0'&&first[0].attrs.some(a=>a[0]===k&&a[1]===val)&&!first[1].attrs.some(a=>a[0]===k&&a[1]===val)&&!second[0].attrs.some(a=>a[0]===k&&a[1]===val))candidates.push('[data-match-id]['+k+'='+JSON.stringify(val)+']');
            }
            reference.activeSelectors=candidates;
            console.log('NATIVE_MATCH_SELECTION',JSON.stringify({first,second,candidates}));
          }finally{await browser.close()}
          const source=reference.cum;
          const stops=source.backgroundImage.match(/linear-gradient\(155deg, rgb\((\d+), (\d+), (\d+)\) 0%, rgb\((\d+), (\d+), (\d+)\) 55%, rgb\((\d+), (\d+), (\d+)\) 100%\)/);
          assert(stops,'SOURCE_PALETTE_CHANGED');
          const left=stops.slice(1,4).map(Number),mid=stops.slice(4,7).map(Number);
          const flat=left.map((n,i)=>Math.round(n+(mid[i]-n)*50/55));
          const rgb=a=>'rgb('+a.join(', ')+')';
          const v={...source,backgroundImage:'linear-gradient(90deg, '+rgb(left)+' 0%, '+rgb(flat)+' 50%, '+rgb(flat)+' 100%)'};
          reference.originalGradient=source.backgroundImage;
          reference.flatRightColor=rgb(flat);
          reference.cum=v;reference.outcome=v;reference.rate=v;
          assert(v.backgroundImage.endsWith(reference.flatRightColor+' 50%, '+reference.flatRightColor+' 100%)'));
          assert(reference.activeSelectors.includes('[data-match-id].active'),'NATIVE_ACTIVE_SELECTOR_NOT_CONFIRMED');
          const scope='html:root[data-theme="dark"] body ';
          const specificity='#b46-premium-specificity#b46-premium-specificity#b46-premium-specificity,';
          const rule=(sel,decl)=>scope+':is('+specificity+sel+'){'+decl+'}';
          const row='[data-match-id].match-row',cell=row+' .market-cell';
          const hoverTint='linear-gradient(rgba(255,255,255,.035),rgba(255,255,255,.035)), '+v.backgroundImage;
          const activeTint=hoverTint;
          const hoverShadow='none';
          const activeShadow='none';
          const clearLegacy='filter:none!important;transform:none!important;translate:none!important;scale:none!important;rotate:none!important;animation:none!important;transition:none!important;';
          const visual=(state,image,shadow)=>clearLegacy+'--b46-premium-state:'+state+'!important;background-image:'+image+'!important;box-shadow:'+shadow+'!important;';
          const declarations=rules.map(([sel])=>rule(sel,'background-color:'+v.backgroundColor+'!important;background-image:'+v.backgroundImage+'!important')).join('\n');
          const normal=rule(row+','+cell,clearLegacy+'--b46-premium-state:normal!important');
          const hover=rule(row+':not(.active):hover:not(:active)',visual('hover',hoverTint,hoverShadow))+
            rule(row+':not(.active) .market-cell:hover',visual('hover',hoverTint,hoverShadow));
          const active=rule(row+'.active,'+row+':active',visual('active',activeTint,activeShadow))+
            rule(row+'.active .market-cell:hover',clearLegacy+'background-image:'+v.backgroundImage+'!important;box-shadow:none!important;--b46-premium-state:normal!important');
          const css='@layer b46PremiumMatch{@media (min-width:1024px){'+declarations+normal+active+'}@media (min-width:1024px) and (hover:hover) and (pointer:fine){'+hover+'}}';
          reference.hoverTint=hoverTint;reference.activeTint=activeTint;reference.hoverShadow=hoverShadow;reference.activeShadow=activeShadow;
          await writeFile('premium-qa/palette.json',JSON.stringify({css,rules,reference}));
          EOF
      - name: Deploy only isolated CSS test worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > premium-qa/worker.mjs <<'EOF'
          import palette from './palette.json';
          export default {async fetch(req,env){
            const u=new URL(req.url);
            if(!['GET','HEAD'].includes(req.method))return new Response('READ_ONLY',{status:405});
            if(u.pathname==='/_premium_health')return Response.json({ok:true,scope:'TEST_ONLY_CSS',revision:'STAT_CARD_FLAT_RIGHT_V11',...palette});
            if(/^\/(admin|internal)(\/|$)/i.test(u.pathname))return new Response('Forbidden',{status:403});
            const headers=new Headers();for(const k of ['accept','accept-language','user-agent','sec-ch-ua-mobile']){const v=req.headers.get(k);if(v)headers.set(k,v);}
            const r=await env.B46_PRODUCTION_READ.fetch(new Request(new URL(u.pathname+u.search,'https://ball46.com'),{method:req.method,headers,redirect:'manual'}));
            const h=new Headers(r.headers);h.delete('set-cookie');h.set('x-robots-tag','noindex, nofollow');
            const loc=h.get('location');if(loc){const d=new URL(loc,'https://ball46.com');if(['ball46.com','www.ball46.com'].includes(d.hostname))h.set('location',new URL(d.pathname+d.search+d.hash,req.url).toString())}
            if(req.method!=='GET'||!r.ok||!['/','/index','/index.html'].includes(u.pathname)||!h.get('content-type')?.includes('text/html'))return new Response(req.method==='HEAD'?null:r.body,{status:r.status,headers:h});
            for(const k of ['content-length','content-encoding','etag','last-modified'])h.delete(k);
            h.set('cache-control','no-store');
            return new HTMLRewriter().on('head',{element(e){e.prepend('<style id="b46-premium-match-test">'+palette.css+'</style>',{html:true})}}).transform(new Response(r.body,{status:r.status,headers:h}));
          }};
          EOF
          cat > premium-qa/wrangler.toml <<'EOF'
          name = "ball46-premium-match-colors-test-20261120"
          main = "worker.mjs"
          compatibility_date = "2026-11-20"
          workers_dev = true
          preview_urls = false
          [[services]]
          binding = "B46_PRODUCTION_READ"
          service = "ball46-production"
          EOF
          node --check premium-qa/worker.mjs
          npx --yes wrangler@4.50.0 deploy --config premium-qa/wrangler.toml --name ball46-premium-match-colors-test-20261120
      - name: Verify PC dark and light
        run: |
          node --input-type=module <<'EOF'
          import {chromium,devices} from 'playwright';
          import assert from 'node:assert/strict';
          const base='https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev';
          let h;for(let i=0;i<15;i++){try{const r=await fetch(base+'/_premium_health');if(r.ok){const candidate=await r.json();if(candidate.revision==='STAT_CARD_FLAT_RIGHT_V11'){h=candidate;break}}}catch{}await new Promise(r=>setTimeout(r,2000))}
          assert.equal(h?.scope,'TEST_ONLY_CSS');assert.equal(h?.revision,'STAT_CARD_FLAT_RIGHT_V11');
          const browser=await chromium.launch();
          try{for(const mobile of [false])for(const theme of ['dark','light']){
            const p=await browser.newPage(mobile?{...devices['iPhone 13'],serviceWorkers:'block'}:{viewport:{width:1440,height:950},serviceWorkers:'block'});
            await p.addInitScript(t=>localStorage.setItem('nomad343_dashboard_theme_v1',t),theme);
            await p.route('**/*',r=>['GET','HEAD'].includes(r.request().method())?r.continue():r.abort());
            await p.goto(base+'/',{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>[...document.querySelectorAll('[data-match-id]')].some(e=>e.getBoundingClientRect().width>100),null,{timeout:60000});
            await p.mouse.move(0,0);
            const proof=await p.evaluate(({rules,theme,activeSelectors})=>{
              const visible=e=>e.getBoundingClientRect().width>40&&e.getBoundingClientRect().height>15;
              const targets=rules.map(([selector,type])=>({type,e:[...document.querySelectorAll(selector)].find(e=>visible(e)&&!e.matches(':hover')&&!activeSelectors.some(s=>e.matches(s)||e.closest(s)))}));
              if(targets.some(x=>!x.e))return null;
              const surface=e=>{const s=getComputedStyle(e);return {w:e.offsetWidth,h:e.offsetHeight,bg:s.backgroundImage,color:s.backgroundColor,border:s.borderTopColor}};
              const style=document.getElementById('b46-premium-match-test');
              const applied=targets.map(({type,e})=>({type,...surface(e)}));
              style.sheet.disabled=true;
              const original=targets.map(({type,e})=>({type,...surface(e)}));
              style.sheet.disabled=false;
              return {applied,original,theme:document.documentElement.dataset.theme};
            },{rules:h.rules,theme,activeSelectors:h.reference.activeSelectors});
            console.log('COMPUTED_PROOF',JSON.stringify(proof));await p.screenshot({path:process.env.RUNNER_TEMP+'/premium-proof/actual-'+theme+'.png'});assert(proof);assert.equal(proof.theme,theme);
            const refs={row:h.reference.cum,header:h.reference.outcome,odds:h.reference.rate};
            for(let i=0;i<proof.applied.length;i++){const x=proof.applied[i],o=proof.original[i];assert.equal(x.w,o.w);assert.equal(x.h,o.h);if(theme==='dark'){assert.equal(x.bg,refs[x.type].backgroundImage);assert.equal(x.color,refs[x.type].backgroundColor);assert.equal(x.border,o.border)}else assert.deepEqual(x,o)}
            console.log('PALETTE_PASS',JSON.stringify({mobile,theme,proof}));
            await p.screenshot({path:process.env.RUNNER_TEMP+'/premium-proof/after-'+mobile+'-'+theme+'.png'});
            if(theme==='dark'){
              const row=p.locator('[data-match-id].match-row:visible:not(.active)').filter({has:p.locator('.market-cell')}).first();
              await row.scrollIntoViewIfNeeded();
              const id=await row.getAttribute('data-match-id');
              const target=p.locator('[data-match-id].match-row:visible').filter({has:p.locator('.market-cell')});
              const index=await target.evaluateAll((all,id)=>all.findIndex(e=>e.dataset.matchId===id),id);
              const chosen=target.nth(index);
              const read=()=>chosen.evaluate(e=>{const s=getComputedStyle(e);return {bg:s.backgroundImage,shadow:s.boxShadow,filter:s.filter,transform:s.transform,transition:s.transitionDuration,animation:s.animationName,state:s.getPropertyValue('--b46-premium-state').trim(),hover:e.matches(':hover'),active:e.classList.contains('active'),w:e.offsetWidth,h:e.offsetHeight}});
              const expected=await p.evaluate(r=>{const e=document.createElement('div');document.body.append(e);const f=(bg,shadow)=>{e.style.backgroundImage=bg;e.style.boxShadow=shadow;const s=getComputedStyle(e);return {bg:s.backgroundImage,shadow:s.boxShadow}};const ret={hover:f(r.hoverTint,r.hoverShadow),active:f(r.activeTint,r.activeShadow)};e.remove();return ret},h.reference);
              const check=(s,k)=>{assert.equal(s.state,k);assert.equal(s.bg,expected[k].bg);assert.equal(s.shadow,expected[k].shadow);assert.equal(s.filter,'none');assert.equal(s.transform,'none');assert.equal(s.transition,'0s');assert.equal(s.animation,'none')};
              const normal=await read();
              await chosen.hover({position:{x:100,y:30}});
              await p.waitForTimeout(100);
              const hover=await read();console.log('HOVER_PROOF',JSON.stringify({hover,expected:expected.hover,media:await p.evaluate(()=>matchMedia('(hover:hover) and (pointer:fine)').matches)}));assert(hover.hover);check(hover,'hover');assert.equal(hover.w,normal.w);assert.equal(hover.h,normal.h);
              await p.screenshot({path:process.env.RUNNER_TEMP+'/premium-proof/hover.png'});
              await chosen.click({position:{x:100,y:30}});
              await p.mouse.move(0,0);
              await p.waitForFunction(id=>[...document.querySelectorAll('[data-match-id].match-row.active')].some(e=>e.dataset.matchId===id),id,{timeout:8000});
              const active=await read();assert.equal(active.bg,hover.bg);assert(active.bg.includes('linear-gradient(90deg'));assert(active.bg.endsWith(h.reference.flatRightColor+' 50%, '+h.reference.flatRightColor+' 100%)'));assert.equal(active.shadow,'none');assert.equal(hover.shadow,'none');console.log('ACTIVE_PROOF',JSON.stringify({active,expected:expected.active}));assert(active.active);check(active,'active');assert.equal(hover.w,active.w);assert.equal(hover.h,active.h);
              await chosen.hover({position:{x:100,y:30}});
              const stillActive=await read();check(stillActive,'active');
              await p.screenshot({path:process.env.RUNNER_TEMP+'/premium-proof/active.png'});
              console.log('INTERACTION_PASS',JSON.stringify({hover,active,stillActive,persistent:true,oldEffectsRemoved:true}));
            }
            await p.close();
          }}finally{await browser.close()}
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-match-proof
          path: ${{ runner.temp }}/premium-proof
          if-no-files-found: ignore

      - name: Publish final Worker verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          if [ "$JOB_STATUS" = cancelled ]; then state=error; fi
          gh api --method POST repos/${{ github.repository }}/statuses/${{ github.sha }} -f state="$state" -f context=ball46-premium-worker -f description="Worker verification: $JOB_STATUS" -f target_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
