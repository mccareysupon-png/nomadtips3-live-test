name: BALL46 premium match colors isolated QA
on:
  push:
    branches: [test/ball46-premium-match-colors-20261120]
    paths: ['.github/workflows/premium-match-colors-test.yml']
permissions:
  contents: read
jobs:
  stage:
    if: github.ref == 'refs/heads/test/ball46-premium-match-colors-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover actual match palette and create CSS only
        run: |
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
          mkdir -p premium-qa "$RUNNER_TEMP/premium-proof"
          node --input-type=module <<'EOF'
          import {chromium,devices} from 'playwright';
          import assert from 'node:assert/strict';
          import {writeFile} from 'node:fs/promises';
          const browser=await chromium.launch();
          const rules=new Map();
          try{
            for(const mobile of [false]){
              const p=await browser.newPage(mobile?{...devices['iPhone 13'],serviceWorkers:'block'}:{viewport:{width:1440,height:950},serviceWorkers:'block'});
              await p.addInitScript(()=>localStorage.setItem('nomad343_dashboard_theme_v1','dark'));
              await p.route('**/*',r=>['GET','HEAD'].includes(r.request().method())?r.continue():r.abort());
              await p.goto('https://ball46.com/',{waitUntil:'domcontentloaded'});
              await p.waitForFunction(()=>[...document.querySelectorAll('[data-match-id]')].some(e=>e.getBoundingClientRect().width>100),null,{timeout:60000});
              const data=await p.evaluate(()=>{
                const rows=[...document.querySelectorAll('[data-match-id]')].filter(e=>e.getBoundingClientRect().width>100);
                const out=[];
                const cls=e=>[...e.classList].find(c=>/odds|market|price|league|cell/i.test(c)&&!/active|selected|hover|badge|signal|prediction/i.test(c));
                for(const row of rows.slice(0,12)){
                  out.push({selector:'[data-match-id]',type:'row',color:getComputedStyle(row).background});
                  for(const e of row.querySelectorAll('*')){
                    const b=e.getBoundingClientRect(),s=getComputedStyle(e),c=cls(e);
                    if(!c||b.width<55||b.height<20||b.width>row.getBoundingClientRect().width*.6||e.querySelectorAll('*').length<1)continue;
                    if(!/odds|market|price|cell/i.test(c)||/badge|signal|prediction/i.test(c))continue;
                    if(s.backgroundImage==='none'&&['rgba(0, 0, 0, 0)','transparent'].includes(s.backgroundColor))continue;
                    out.push({selector:'[data-match-id] .'+CSS.escape(c),type:'odds',color:s.background});
                  }
                  let a=row.parentElement;for(let i=0;a&&i<4;i++,a=a.parentElement)for(const e of a.children)if(e.matches('.league-head'))out.push({selector:'.league-head',type:'header',color:getComputedStyle(e).background});
                }
                return {theme:document.documentElement.dataset.theme,rows:rows.length,out};
              });
              console.log('DISCOVERED',JSON.stringify({mobile,...data}));
              assert(data.theme==='dark','DARK_THEME_NOT_CONFIRMED');
              assert(data.out.some(x=>x.type==='row'),'ROW_PALETTE_NOT_FOUND');
              for(const x of data.out)rules.set(x.selector,x.type);
              await p.screenshot({path:process.env.RUNNER_TEMP+'/premium-proof/before-'+mobile+'.png'});
              await p.close();
            }
          }finally{await browser.close()}
          assert([...rules.values()].includes('odds')&&[...rules.values()].includes('header'),'SOURCE_SELECTORS_NOT_CONFIRMED');
          const referenceBrowser=await chromium.launch();
          let reference;
          try{
            const p=await referenceBrowser.newPage({viewport:{width:1440,height:950},serviceWorkers:'block'});
            await p.addInitScript(()=>localStorage.setItem('nomad343_dashboard_theme_v1','dark'));
            await p.route('**/*',r=>['GET','HEAD'].includes(r.request().method())?r.continue():r.abort());
            await p.goto('https://ball46.com/index.html?view=statistics',{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>{const c=document.querySelector('#b46-finance-chart-card');return c&&c.getBoundingClientRect().width>100&&/CUMULATIVE UNITS/i.test(c.innerText)&&/WIN RATE/i.test(c.innerText)},null,{timeout:60000});
            reference=await p.evaluate(()=>{
              const root=document.querySelector('#b46-finance-chart-card');
              const leaf=t=>[...root.querySelectorAll('*')].find(e=>e.childElementCount===0&&e.textContent.trim().toUpperCase()===t&&e.getBoundingClientRect().width>0);
              const ancestors=e=>{const a=[];for(let i=0;e&&root.contains(e)&&i<12;i++,e=e.parentElement)a.push(e);return a};
              const surface=e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return {className:e.className,backgroundColor:s.backgroundColor,backgroundImage:s.backgroundImage,borderColor:s.borderTopColor,width:r.width,height:r.height}};
              const solid=x=>x.backgroundImage!=='none'||!['rgba(0, 0, 0, 0)','transparent'].includes(x.backgroundColor);
              const cum=ancestors(leaf('CUMULATIVE UNITS')).map(surface).find(x=>solid(x)&&x.width>300&&x.height>150);
              const roi=ancestors(leaf('ROI')).map(surface).find(x=>solid(x)&&x.width>90&&x.width<330&&x.height>=35&&x.height<=130);
              const rate=ancestors(leaf('WIN RATE')).map(surface).find(x=>solid(x)&&x.width>90&&x.width<330&&x.height>=35&&x.height<=130);
              const outcome=ancestors(leaf('SIGNAL OUTCOMES')).map(surface).find(x=>solid(x)&&x.width>300&&x.height>=35&&x.height<=140);
              return {theme:document.documentElement.dataset.theme,cum,roi,rate,outcome};
            });
            console.log('EXACT_STATS_REFERENCE',JSON.stringify(reference));assert.equal(reference.theme,'dark');assert(reference.cum&&reference.rate&&reference.outcome,'STATS_REFERENCE_SURFACE_MISSING');
            await p.screenshot({path:process.env.RUNNER_TEMP+'/premium-proof/stats-reference.png'});
          }finally{await referenceBrowser.close()}
          const colors={row:reference.cum,header:reference.outcome,odds:reference.rate};
          const css='@layer b46PremiumMatch{@media (min-width: 1024px){'+[...rules].map(([sel,t])=>{const v=colors[t];return 'html:root[data-theme="dark"] body :is(#b46-premium-specificity#b46-premium-specificity#b46-premium-specificity,'+sel+'){background-color:'+v.backgroundColor+'!important;background-image:'+v.backgroundImage+'!important;border-color:'+v.borderColor+'!important}'}).join('\n')+'}}';
          await writeFile('premium-qa/palette.json',JSON.stringify({css,rules:[...rules],reference}));
          EOF
      - name: Deploy only isolated CSS test worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cat > premium-qa/worker.mjs <<'EOF'
          import palette from './palette.json';
          export default {async fetch(req,env){
            const u=new URL(req.url);
            if(!['GET','HEAD'].includes(req.method))return new Response('READ_ONLY',{status:405});
            if(u.pathname==='/_premium_health')return Response.json({ok:true,scope:'TEST_ONLY_CSS',...palette});
            if(/^\/(admin|internal)(\/|$)/i.test(u.pathname))return new Response('Forbidden',{status:403});
            const headers=new Headers();for(const k of ['accept','accept-language','user-agent','sec-ch-ua-mobile']){const v=req.headers.get(k);if(v)headers.set(k,v);}
            const r=await env.B46_PRODUCTION_READ.fetch(new Request(new URL(u.pathname+u.search,'https://ball46.com'),{method:req.method,headers,redirect:'manual'}));
            const h=new Headers(r.headers);h.delete('set-cookie');h.set('x-robots-tag','noindex, nofollow');
            const loc=h.get('location');if(loc){const d=new URL(loc,'https://ball46.com');if(['ball46.com','www.ball46.com'].includes(d.hostname))h.set('location',new URL(d.pathname+d.search+d.hash,req.url).toString())}
            if(req.method!=='GET'||!r.ok||!['/','/index','/index.html'].includes(u.pathname)||!h.get('content-type')?.includes('text/html'))return new Response(req.method==='HEAD'?null:r.body,{status:r.status,headers:h});
            for(const k of ['content-length','content-encoding','etag','last-modified'])h.delete(k);
            h.set('cache-control','no-store');
            return new HTMLRewriter().on('head',{element(e){e.prepend('<style id="b46-premium-match-test">'+palette.css+'</style>',{html:true})}}).transform(new Response(r.body,{status:r.status,headers:h}));
          }};
          EOF
          cat > premium-qa/wrangler.toml <<'EOF'
          name = "ball46-premium-match-colors-test-20261120"
          main = "worker.mjs"
          compatibility_date = "2026-11-20"
          workers_dev = true
          preview_urls = false
          [[services]]
          binding = "B46_PRODUCTION_READ"
          service = "ball46-production"
          EOF
          node --check premium-qa/worker.mjs
          npx --yes wrangler@4.50.0 deploy --config premium-qa/wrangler.toml --name ball46-premium-match-colors-test-20261120
      - name: Verify PC dark and light
        run: |
          node --input-type=module <<'EOF'
          import {chromium,devices} from 'playwright';
          import assert from 'node:assert/strict';
          const base='https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev';
          let h;for(let i=0;i<15;i++){try{const r=await fetch(base+'/_premium_health');if(r.ok){h=await r.json();break}}catch{}await new Promise(r=>setTimeout(r,2000))}
          assert.equal(h?.scope,'TEST_ONLY_CSS');
          const browser=await chromium.launch();
          try{for(const mobile of [false])for(const theme of ['dark','light']){
            const p=await browser.newPage(mobile?{...devices['iPhone 13'],serviceWorkers:'block'}:{viewport:{width:1440,height:950},serviceWorkers:'block'});
            await p.addInitScript(t=>localStorage.setItem('nomad343_dashboard_theme_v1',t),theme);
            await p.route('**/*',r=>['GET','HEAD'].includes(r.request().method())?r.continue():r.abort());
            await p.goto(base+'/',{waitUntil:'domcontentloaded'});
            await p.waitForFunction(()=>[...document.querySelectorAll('[data-match-id]')].some(e=>e.getBoundingClientRect().width>100),null,{timeout:60000});
            const proof=await p.evaluate(({rules,theme})=>{
              const rows=[...document.querySelectorAll('[data-match-id]')].filter(e=>e.getBoundingClientRect().width>100);
              const e=rows.find(e=>rules.some(([s,t])=>t==='row'&&e.matches(s)));
              if(!e)return null;
              const before={w:e.offsetWidth,h:e.offsetHeight,bg:getComputedStyle(e).backgroundImage};
              const style=document.getElementById('b46-premium-match-test');style.disabled=true;
              const original={w:e.offsetWidth,h:e.offsetHeight,bg:getComputedStyle(e).backgroundImage};
              style.disabled=false;
              return {before,original,theme:document.documentElement.dataset.theme};
            },{rules:h.rules,theme});
            console.log('COMPUTED_PROOF',JSON.stringify(proof));assert(proof);assert.equal(proof.theme,theme);assert.equal(proof.before.w,proof.original.w);assert.equal(proof.before.h,proof.original.h);
            if(theme==='dark')assert.equal(proof.before.bg,h.reference.cum.backgroundImage);else assert.equal(proof.before.bg,proof.original.bg);
            console.log('PALETTE_PASS',JSON.stringify({mobile,theme,proof}));
            await p.screenshot({path:process.env.RUNNER_TEMP+'/premium-proof/after-'+mobile+'-'+theme+'.png'});
            await p.close();
          }}finally{await browser.close()}
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-match-proof
          path: ${{ runner.temp }}/premium-proof
          if-no-files-found: ignore
