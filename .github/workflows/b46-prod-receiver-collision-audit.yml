name: B46 receiver collision audit (READ ONLY)
on:
  push:
    branches: [chatgpt/ball46-new-ledger-clean-v1]
    paths: ['.github/workflows/b46-prod-receiver-collision-audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect deployed version metadata and service bindings without changing anything
        run: |
          node <<'NODE'
          const {createHash}=require('node:crypto');
          const base='https://api.cloudflare.com/client/v4/accounts/62cb0db544160e6591342abd6b4f35cc';
          const headers={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const get=async p=>{const r=await fetch(base+p,{headers,signal:AbortSignal.timeout(20000)});const d=await r.json();if(!r.ok||!d.success)throw Error('CF_READ_'+r.status);return d.result};
          (async()=>{
            for(const name of ['nomadtips3-engine-343','ball46-shadow-receiver-production','ball46-production']){
              const d=await get('/workers/scripts/'+name+'/deployments?per_page=1'),v=d.deployments?.[0]?.versions;
              if(v?.length!==1)throw Error('ACTIVE_VERSION_UNEXPECTED');
              const version=v[0].version_id,w=await get('/workers/workers/'+name+'/versions/'+version+'?include=modules'),s=await get('/workers/scripts/'+name+'/settings');
              const mods=(w.modules||[]).filter(x=>typeof x.content_base64==='string');
              const texts=mods.filter(x=>/\.(js|mjs)$/.test(x.name)).map(x=>Buffer.from(x.content_base64,'base64').toString('utf8'));
              console.log('RECEIVER_COLLISION_AUDIT='+JSON.stringify({name,version,modules:mods.map(m=>({name:m.name,sha256:createHash('sha256').update(Buffer.from(m.content_base64,'base64')).digest('hex')})).filter(m=>/^(index|worker|.*receiver).*\.(js|mjs)$/.test(m.name)),bindings:(s.bindings||[]).map(b=>({name:b.name,type:b.type,service:b.type==='service'?b.service:undefined,class_name:b.type==='durable_object_namespace'?b.class_name:undefined})),mentionsHealth:texts.some(t=>t.includes('/health')),mentionsSettled:texts.some(t=>t.includes('/settled')),mentionsShadowHook:texts.some(t=>t.includes('B46_SHADOW_RECEIVER')),mentionsAlarm:texts.some(t=>/\balarm\s*\(/.test(t))}));
            }
          })().catch(e=>{console.error(String(e.message).slice(0,100));process.exitCode=1});
          NODE
