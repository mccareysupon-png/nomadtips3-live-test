name: BALL46 pending page safe cursor audit
on:
  push:
    branches: [stage/ball46-multisource-v5-20261017]
    paths: [.github/workflows/ball46-pending-upper-bound.yml]
permissions: {contents: read}
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Ledger V2 first page with upper bound cursor (no scan)
        run: |
          node - <<'NODE'
          (async()=>{
            const max='stat:v2:row:9999999999999:~';
            const url='https://nomadtips3-engine-343.mccarey-supon.workers.dev/statistics?cursor='+encodeURIComponent(max)+'&paged=1';
            const r=await fetch(url,{signal:AbortSignal.timeout(10000)});
            const d=await r.json();
            console.log('PENDING_LEDGER_PAGE',JSON.stringify({
              http:r.status,source:d.statisticsSource,version:d.statisticsLedgerVersion,
              rows:d.rows?.length,hold:d.rows?.filter(x=>x.status==='PENDING').length,
              nextCursor:!!d.nextCursor,ledgerTotal:d.ledgerTotal,pendingTotal:d.pending,
              sampleMarketFields:d.rows?.[0]?Object.keys(d.rows[0]).slice(0,35):[]}));
            if(!r.ok||d.statisticsSource!=='LEDGER_V2_ONLY')process.exitCode=1;
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
