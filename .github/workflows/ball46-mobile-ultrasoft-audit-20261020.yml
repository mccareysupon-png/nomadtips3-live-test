name: BALL46 Mobile Ultra Soft Event Flow Read Only Audit
on:
  push:
    branches: [codex/ball46-mobile-ultrasoft-eventflow-20261020]
    paths:
      - '.github/workflows/ball46-mobile-ultrasoft-audit-20261020.yml'
      - 'deploy-assets/mobile-ultrasoft-flow-20261020/audit.mjs'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect chart from active Worker without edits
        working-directory: deploy-assets/mobile-ultrasoft-flow-20261020
        run: |
          node --check audit.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
          node audit.mjs
