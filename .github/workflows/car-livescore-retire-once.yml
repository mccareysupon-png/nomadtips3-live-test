name: Retire CAR LiveScore Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/car-livescore-retire-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: car-livescore-retire-once
  cancel-in-progress: true

jobs:
  retire-and-confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Delete CAR LiveScore Worker
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCRIPT_NAME: nomadtips3-car-livescore
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          code=$(curl -sS -o /tmp/cf-delete.json -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME")
          cat /tmp/cf-delete.json || true
          if [ "$code" != "200" ] && [ "$code" != "404" ]; then
            echo "Unexpected Cloudflare delete status: $code"
            exit 1
          fi

      - name: Verify Worker is not serving
        run: |
          sleep 5
          if curl -fsS "https://nomadtips3-car-livescore.mccarey-supon.workers.dev/health" >/dev/null; then
            echo "CAR LiveScore Worker is still reachable"
            exit 1
          fi
          echo "CAR LiveScore Worker is no longer reachable"

      - name: Write success marker
        run: |
          printf 'CAR LiveScore retired successfully at %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > car-livescore-retired.marker
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add car-livescore-retired.marker
          git commit -m "confirm car-livescore worker retired"
          git push
