name: STEP 2 - Ball46 Scorebar 6x4 Prepare Dry Run 20260928

on:
  push:
    branches:
      - ops/ball46-scorebar-6x4-surgical-20260928
    paths:
      - '.github/workflows/ball46-scorebar-6x4-prepare-20260928.yml'

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download exact verified Production payload
        uses: actions/download-artifact@v4
        with:
          name: ball46-favicon-surgical-36362568908
          path: /tmp/b46-scorebar-base
          repository: mccareysupon-png/nomadtips3-live-test
          run-id: 36362568908
          github-token: ${{ github.token }}
      - name: Build one-file 6x4 candidate and dry run only
        shell: bash
        run: bash .github/scripts/ball46_scorebar_6x4_prepare_20260928.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-scorebar-6x4-candidate-${{ github.run_id }}
          path: /tmp/b46-scorebar-prepare
          if-no-files-found: ignore
          retention-days: 30
