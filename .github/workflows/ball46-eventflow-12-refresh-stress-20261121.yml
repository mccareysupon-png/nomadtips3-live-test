name: BALL46 Event Flow 12 refresh performance and scroll stress isolated TEST
on:
  push:
    branches: [test/ball46-fullmarket-odds-v3-20261121]
    paths:
      - '.github/workflows/ball46-eventflow-12-refresh-stress-20261121.yml'
      - 'qa/fullmarket-odds-v3-20261121/eventflow-refresh-stress.mjs'
permissions: {contents: read}
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Verify repeated Event Flow icon redraw and nested scroll against original native flow
        run: node qa/fullmarket-odds-v3-20261121/eventflow-refresh-stress.mjs
