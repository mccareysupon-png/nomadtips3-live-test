name: Emergency Ball46 Statistics Browser QA
on:
  push:
    branches: [work/ball46-phase3-missing-hub-final-20261011]
    paths:
      - '.github/workflows/diag-ball46-stats-browser-incident-20261011.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - run: node deploy-assets/ball46-phase3/stats-browser-incident.mjs
