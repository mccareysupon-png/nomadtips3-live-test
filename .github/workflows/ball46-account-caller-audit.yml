name: BALL46 account-wide 5USD caller audit
on:
  push:
    branches: [test/ball46-prematch-v1-20261120]
    paths: ['.github/workflows/ball46-account-caller-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Inventory active Cloudflare Workers and provider bindings, no upstream calls
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
        run: node qa/prematch-history-20261120/account-caller-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-caller-audit
          path: evidence/
          retention-days: 7
