name: BALL46 Restore Pre-Today Mobile Match Colors 20261020
on:
  push:
    branches: [codex/ball46-mobile-revert-colors-20261020]
    paths:
      - '.github/workflows/ball46-mobile-original-colors-20261020.yml'
      - 'deploy-assets/mobile-pre-recolor-20261020/deploy.mjs'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  verified-mobile-color-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and browser dependencies
        working-directory: deploy-assets/mobile-pre-recolor-20261020
        run: |
          set -euo pipefail
          node --check deploy.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
      - name: Verify baseline and mobile restore, deploy only when safe
        working-directory: deploy-assets/mobile-pre-recolor-20261020
        run: node deploy.mjs
      - name: Preserve before and after screenshots and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-mobile-original-colors-before-after
          path: deploy-assets/mobile-pre-recolor-20261020/audit/
          retention-days: 30
          if-no-files-found: warn
