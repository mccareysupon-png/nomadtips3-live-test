name: Patch 3.43 Full Price On Expand

on:
  push:
    branches:
      - work/nomad343-clean-bet365-ui
    paths:
      - .github/workflows/patch-343-full-price-expand.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nomad343-clean-bet365-ui
          fetch-depth: 0

      - name: Apply isolated full-price patch
        run: python .github/scripts/patch343_full_price_expand.py

      - name: Validate patch
        run: |
          set -euo pipefail
          node --check workers/nomadtips3-engine-343/src/index.js
          node --check nomad-live-343/bet365-board.js
          grep -Fq "const VERSION='nomad343-engine-v3-settlement-safe'" workers/nomadtips3-engine-343/src/index.js
          grep -Fq "const VERSION='343-bet365-board-v4-market-language'" nomad-live-343/bet365-board.js
          grep -Fq "u.pathname==='/fixture-odds'" workers/nomadtips3-engine-343/src/index.js
          grep -Fq "FULL_ODDS_API='/api/engine/fixture-odds'" nomad-live-343/bet365-board.js
          grep -Fq 'fix=fullprices1' nomad-live-343/index.html

      - name: Commit isolated full-price patch
        run: |
          set -euo pipefail
          git config user.name 'nomad343-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add workers/nomadtips3-engine-343/src/index.js nomad-live-343/bet365-board.js nomad-live-343/index.html
          git rm .github/workflows/patch-343-full-price-expand.yml .github/scripts/patch343_full_price_expand.py
          git commit -m '3.43: load full Bet365 prices on expanded cards'
          git push origin HEAD:work/nomad343-clean-bet365-ui
