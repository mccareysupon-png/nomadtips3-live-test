name: NOMAD 3.42 Public E2E Check

on:
  workflow_dispatch:
  push:
    branches:
      - 'feat/342-totalcorner-inlet'
    paths:
      - '.github/workflows/nomad342-public-e2e-check.yml'

permissions:
  contents: read

jobs:
  public-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prime stable feed twice
        shell: bash
        run: |
          set -euo pipefail
          base='https://nomadtips3-live-engine-342-test.mccarey-supon.workers.dev'
          curl -fsS --max-time 35 "$base/feed?force=1&_=$RANDOM" -o /tmp/feed1.json
          sleep 12
          curl -fsS --max-time 35 "$base/feed?force=1&_=$RANDOM" -o /tmp/feed2.json
          node - <<'NODE'
          const fs=require('fs');
          for(const f of ['/tmp/feed1.json','/tmp/feed2.json']){
            const j=JSON.parse(fs.readFileSync(f,'utf8'));
            const matches=Array.isArray(j.matches)?j.matches:[];
            const multi=matches.filter(m=>Array.isArray(m.event?.snapshots)&&m.event.snapshots.length>=2).length;
            console.log(f,{ok:j.ok,count:matches.length,multiSnapshotMatches:multi,source:j.source?.name,lastError:j.lastError});
            if(j.ok!==true||j.source?.name!=='TotalCorner'||matches.length<1)process.exit(1);
          }
          NODE

      - name: Open public Live Score Event page
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          url='https://mccareysupon-png.github.io/nomadtips3-live-test/nomad-live-342/index.html?e2e=1'
          "$chrome" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=26000 --dump-dom "$url" >/tmp/page.html 2>/tmp/chrome.log
          cards="$(grep -o 'class="signal-card event-compact' /tmp/page.html | wc -l)"
          graphs="$(grep -o 'class="attack-chart"' /tmp/page.html | wc -l)"
          empty="$(grep -o 'Building attack history' /tmp/page.html | wc -l)"
          echo "cards=$cards graphs=$graphs building=$empty"
          echo '--- chrome log ---'
          tail -n 80 /tmp/chrome.log || true
          test "$cards" -gt 0
          test "$graphs" -gt 0
