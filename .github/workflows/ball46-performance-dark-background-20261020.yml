name: BALL46 PC Dark Performance Background 20261020
on:
  push:
    branches: [codex/ball46-performance-dark-background-20261020]
    paths:
      - '.github/workflows/ball46-performance-dark-background-20261020.yml'
      - 'deploy-assets/performance-dark-background-20261020/run.mjs'
      - 'deploy-assets/performance-dark-background-20261020/patch.mjs'
      - 'deploy-assets/performance-dark-background-20261020/patch.test.mjs'
      - 'deploy-assets/performance-dark-background-20261020/cutover.mjs'
      - 'deploy-assets/performance-dark-background-20261020/cutover.test.mjs'
      - 'deploy-assets/performance-dark-background-20261020/provenance.json'
      - 'deploy-assets/performance-dark-background-20261020/resource-404.json'
      - 'deploy-assets/performance-dark-background-20261020/request.json'
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  pc-performance-background:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scope and execute guarded phase
        working-directory: deploy-assets/performance-dark-background-20261020
        run: |
          node --check run.mjs
          node cutover.test.mjs
          node --test --test-name-pattern="source drift|non-main routes" patch.test.mjs
          node run.mjs
          if [ -f audit/source-index.html ]; then node patch.test.mjs; fi
          if [ -f audit/candidate-runtime.mjs ]; then node --check audit/candidate-runtime.mjs; fi
      - name: Preserve audit on isolated branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-assets/performance-dark-background-20261020/audit-last
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record PC dark Performance phase ${GITHUB_RUN_ID} [skip ci]"
          git push origin HEAD:codex/ball46-performance-dark-background-20261020
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-performance-dark-${{ github.run_id }}
          path: deploy-assets/performance-dark-background-20261020/audit
          retention-days: 30
