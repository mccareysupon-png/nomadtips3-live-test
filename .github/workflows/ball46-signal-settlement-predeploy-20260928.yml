name: READ ONLY - Ball46 Signal Settlement Scorebar Predeploy 20260928
on:
  push:
    branches:
      - work/ball46-scorebar-signal-settlement-20260928
    paths:
      - '.github/workflows/ball46-signal-settlement-predeploy-20260928.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble guarded predeploy script
        run: cat .github/scripts/ball46_signal_settlement_predeploy.part1 .github/scripts/ball46_signal_settlement_predeploy.part2 .github/scripts/ball46_signal_settlement_predeploy.part3 .github/scripts/ball46_signal_settlement_predeploy.part4 > /tmp/predeploy.sh && bash -n /tmp/predeploy.sh
      - name: Verify signal settlement scorebar candidate without deploy
        run: bash /tmp/predeploy.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-signal-settlement-predeploy-${{ github.run_id }}
          path: /tmp/b46-signal-settlement-pre
          if-no-files-found: ignore
          retention-days: 30
