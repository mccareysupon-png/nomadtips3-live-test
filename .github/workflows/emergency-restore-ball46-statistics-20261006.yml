name: Emergency Restore Ball46 Statistics 20261006

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emergency-restore-ball46-statistics-20261006.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-statistics-emergency-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout emergency rollback
        uses: actions/checkout@v4
        with:
          ref: work/ball46-statistics-emergency-rollback-20261006
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore previous Engine and verify Statistics
        working-directory: deploy-assets/statistics-emergency-rollback-20261006
        run: node run.mjs
