name: BALL46 BTTS V2 EXISTING Client Anchors READ ONLY
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-btts-ui-v2-client-anchors-inspect-20261122.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read only exact existing BTTS tab layout and data URLs
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const token=process.env.CLOUDFLARE_API_TOKEN,acc=process.env.CLOUDFLARE_ACCOUNT_ID;
          assert(token&&acc);
          const root='https://api.cloudflare.com/client/v4/accounts/'+acc+'/workers';
          async function cf(p){const r=await fetch(root+p,{headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(25000)});
           const j=await r.json();assert(r.ok&&j.success);return j.result}
          const n='ball46-premium-match-colors-test-20261120';
          const deployed=(await cf('/scripts/'+n+'/deployments?per_page=1')).deployments[0].versions[0].version_id;
          const info=await cf('/workers/'+n+'/versions/'+deployed+'?include=modules');
          const code=Buffer.from(info.modules[0].content_base64,'base64').toString('utf8');
          const m=code.match(/var prematchClientScript = ("(?:\\.|[^"\\])*");/);assert(m);
          const client=JSON.parse(m[1]);
          const excerpts={};
          for(const needle of [
            "function render(", "function renderContent(", "function renderList(", "function renderStats(",
            "function show(modeNext)", "function load()", "function premiumMatchRow(",
            "function perfSource()", "function updateMenu()", "function renderCards(",
            "function showOverlay(", "function fetch", "function ensure(", "const routes=",
            "const root=", "if(mode==='btts')", "function paint(", "function makeStat",
            "function renderMatches(", "function updateStats(",
            "var prematchClientScript ="
          ]){
           const i=client.indexOf(needle);if(i>=0)excerpts[needle]=client.slice(Math.max(0,i-100),i+2500);
          }
          const routeSegments=[];
          for(const needle of ['/__b46_prematch_data','const prematchClientScript','var prematchClientScript','testLedger','PREMATCH_STORE']){
           let pos=-1,n=0;
           while((pos=code.indexOf(needle,pos+1))!==-1&&n++<4){
             routeSegments.push({needle,at:pos,text:code.slice(Math.max(0,pos-180),pos+400)});
           }
          }
          console.log('B46_BTTS_CLIENT_UI_ANCHORS '+JSON.stringify({
           deployed,clientLen:client.length,initialClientFragment:client.slice(0,1300),
           excerpts,routeSegments
          }));
          JS
