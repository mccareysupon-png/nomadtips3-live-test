name: ONE SHOT - Ball46 Scorebar Results Deploy 20260928
on:
  push:
    branches:
      - work/ball46-scorebar-results-20260928
    paths:
      - '.github/scripts/ball46_scorebar_results_deploy_20260928.sh'
      - '.github/workflows/ball46-scorebar-results-deploy-20260928.yml'
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Download exact proven predeploy candidate
        uses: actions/download-artifact@v4
        with:
          name: ball46-scorebar-results-predeploy-v2-36377335831
          path: /tmp/b46-scorebar-result-predeploy
          github-token: ${{ github.token }}
          run-id: 36377335831
          repository: mccareysupon-png/nomadtips3-live-test
      - name: Deploy exact three-file scorebar result patch with guards
        run: bash .github/scripts/ball46_scorebar_results_deploy_20260928.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-scorebar-results-deploy-${{ github.run_id }}
          path: /tmp/b46-scorebar-result-deploy-verify
          if-no-files-found: ignore
          retention-days: 30
