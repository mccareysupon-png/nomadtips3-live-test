name: BALL46 Main Card Prediction isolated Worker
on:
  push:
    branches: [test/ball46-live-prediction-card-20261119]
    paths: ['.github/workflows/live-prediction-card-20261119.yml']
permissions:
  contents: read
jobs:
  stage:
    if: github.ref == 'refs/heads/test/ball46-live-prediction-card-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy isolated test only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --check qa/live-prediction-card-20261119/worker.mjs
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {patchHtml,patchDashboard} from './qa/live-prediction-card-20261119/worker.mjs';
          const base='https://ball46-production.mccarey-supon.workers.dev';
          const get=async p=>{const r=await fetch(base+p);assert(r.ok,p);return r.text()};
          const html=await get('/index.html');const href=[...html.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(m=>m[1]).find(x=>x.includes('/dashboard-v2-stage3-featured-facts-20261013a.js'));assert(href,'DASHBOARD_SCRIPT_NOT_FOUND');const u=new URL(href,base);console.log('ACTUAL_DASHBOARD '+u.pathname+u.search);const js=await get(u.pathname+u.search);
          const a=patchHtml(html),b=patchDashboard(js);assert(a.includes('ACTIVE PREDICTIONS')&&a.includes('LIVE PREDICTION')&&a.includes("f.signalCount===1?' Prediction':' Predictions'"));assert(b.includes("hasSignals?'FEATURED LIVE PREDICTION':'FEATURED MATCH'"));new Function(b);
          console.log('SOURCE_RENDERER_PREFLIGHT_PASS');
          EOF
          cat > qa/live-prediction-card-20261119/wrangler.toml <<'EOF'
          name = "ball46-live-prediction-card-test-20261119"
          main = "worker.mjs"
          compatibility_date = "2026-11-19"
          workers_dev = true
          preview_urls = false
          [[services]]
          binding = "B46_PRODUCTION_READ"
          service = "ball46-production"
          EOF
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {writeFile} from 'node:fs/promises';
          const a=process.env.CLOUDFLARE_ACCOUNT_ID,t=process.env.CLOUDFLARE_API_TOKEN;assert(a&&t);
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+a+'/workers/scripts/ball46-production/deployments?per_page=1',{headers:{authorization:'Bearer '+t}});
          const j=await r.json();assert(j.success);
          await writeFile(process.env.RUNNER_TEMP+'/production-before.json',JSON.stringify(j.result.deployments[0].versions));
          EOF
          npx --yes wrangler@4.50.0 deploy --config qa/live-prediction-card-20261119/wrangler.toml --name ball46-live-prediction-card-test-20261119
      - name: Browser verify PC and mobile
        run: |
          npm install --prefix qa/live-prediction-card-20261119/.runtime --no-fund --no-audit playwright@1.55.0
          qa/live-prediction-card-20261119/.runtime/node_modules/.bin/playwright install chromium --only-shell
          mkdir -p "$RUNNER_TEMP/prediction-proof"
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          const {chromium,devices}=createRequire(process.cwd()+'/qa/live-prediction-card-20261119/.runtime/package.json')('playwright');
          const base='https://ball46-live-prediction-card-test-20261119.mccarey-supon.workers.dev';
          let health;for(let i=0;i<15;i++){try{const r=await fetch(base+'/_prediction_test_health');if(r.ok){health=await r.json();break}}catch{}await new Promise(r=>setTimeout(r,2000))}
          assert.equal(health?.scope,'SHARED_RENDERER_SOURCE');assert.equal(health.overlay,false);
          const html=await fetch(base+'/index.html');assert.equal(html.status,200);const hs=await html.text();assert(!hs.includes('/_prediction-card-test.js')&&hs.includes('content:"ACTIVE PREDICTIONS"'));const href=[...hs.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(m=>m[1]).find(x=>x.includes('/dashboard-v2-stage3-featured-facts-20261013a.js'));assert(href);const u=new URL(href,base);const script=await fetch(base+u.pathname+u.search);assert(script.ok);new Function(await script.text());
          assert.equal((await fetch(base+'/_prediction_test_health',{method:'POST'})).status,405);
          const browser=await chromium.launch({headless:true});
          try{for(const mobile of [false,true]){
            const p=await browser.newPage(mobile?{...devices['iPhone 13'],serviceWorkers:'block'}:{viewport:{width:1440,height:950},serviceWorkers:'block'});
            const errors=[];p.on('pageerror',e=>errors.push(e.message));
            await p.route('**/*',r=>['GET','HEAD'].includes(r.request().method())?r.continue():r.abort());
            try{
              await p.goto(base+'/',{waitUntil:'domcontentloaded',timeout:60000});
              await p.waitForFunction(()=>document.body.innerText.length>100,null,{timeout:90000});
              await p.waitForTimeout(8000);
              const observed=await p.evaluate(()=>({headers:[...document.querySelectorAll('body *')].filter(e=>e.childElementCount===0&&e.textContent.trim()==='LIVE PREDICTION'&&e.getClientRects().length).length,badges:[...document.querySelectorAll('body *')].filter(e=>e.childElementCount===0&&/^(?:[•·]\\s*)?\\d+\\s+Predictions?$/.test(e.textContent.trim())&&e.getClientRects().length).map(e=>e.textContent.trim())}));
              console.log('MAIN_CARD_OBSERVED '+JSON.stringify({mobile,...observed}));
              const proof=await p.evaluate(()=>({view:document.body.dataset.workspaceView,rows:document.querySelectorAll('[data-match-id]').length,desktop:[...document.querySelectorAll('.b46-league-market-signal-count')].map(e=>e.textContent),mobile:[...document.querySelectorAll('.b46gn-live')].map(e=>e.textContent).filter(t=>/prediction|signal/i.test(t)),heading:document.querySelector('[data-featured-kicker]')?.textContent,featured:document.querySelector('[data-featured-signal]')?.textContent,pseudo:document.querySelector('[data-featured-signal]')?getComputedStyle(document.querySelector('[data-featured-signal]'),'::before').content:null}));
              console.log('REAL_RENDERER_PROOF '+JSON.stringify(proof));
              assert(proof.rows>0,'NO_REAL_BOARD_ROWS');
              assert(!proof.desktop.some(t=>/signals?/i.test(t))&&!proof.mobile.some(t=>/signals?/i.test(t)),'OLD_BADGE');
              if(proof.featured&&/Prediction/i.test(proof.featured)){assert(!/Signal /i.test(proof.featured));assert.equal(proof.heading,'FEATURED LIVE PREDICTION');}
              if(!proof.desktop.length&&!proof.mobile.length)console.log('NO_ACTIVE_SIGNAL_SAMPLE_YET');
              assert.deepEqual(errors,[]);
              await p.screenshot({path:process.env.RUNNER_TEMP+'/prediction-proof/'+(mobile?'mobile':'pc')+'.png',fullPage:false});
            }catch(e){console.log('BROWSER_STOP '+JSON.stringify({mobile,error:e.message,errors}));await p.screenshot({path:process.env.RUNNER_TEMP+'/prediction-proof/'+(mobile?'mobile':'pc')+'-failure.png'}).catch(()=>{});throw e}finally{await p.close()}
          }}finally{await browser.close()}
          EOF
      - name: Confirm Production unchanged
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          const a=process.env.CLOUDFLARE_ACCOUNT_ID,t=process.env.CLOUDFLARE_API_TOKEN;
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+a+'/workers/scripts/ball46-production/deployments?per_page=1',{headers:{authorization:'Bearer '+t}});
          const j=await r.json();assert(j.success);
          const before=await readFile(process.env.RUNNER_TEMP+'/production-before.json','utf8').catch(e=>{if(e.code==='ENOENT')return null;throw e});if(before===null){console.log('PRECHECK_STOPPED_BEFORE_DEPLOY');process.exit(0)}
          assert.deepEqual(j.result.deployments[0].versions,JSON.parse(before));
          console.log('PRODUCTION_UNCHANGED');
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prediction-card-proof
          path: ${{ runner.temp }}/prediction-proof
          if-no-files-found: ignore

