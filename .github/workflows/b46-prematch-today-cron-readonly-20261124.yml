name: BALL46 TEST readonly today cutoff and selection cron audit 20261124
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-prematch-today-cron-readonly-20261124.yml]
permissions: {contents: read}
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: GET live TEST cron, last daily mission, history round and OU current state; no POST or provider calls
        run: node qa/prematch-history-20261120/b46-prematch-today-cron-readonly-20261124.mjs
