name: DEPLOY Ball46 approved scorebar backgrounds 20261002

on:
  push:
    branches: [work/ball46-scorebar-bg-currentprod-20261002]
    paths:
      - '.github/workflows/deploy-ball46-scorebar-approved-bg-20261002.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  BALL46_URL: https://ball46.com

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout approved image assets only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch exact current Production image routes only
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          mkdir -p /tmp/modules /tmp/before /tmp/after

          # Approved set: exactly four files. Green running duplicate is intentionally absent.
          for f in loss win pending draw; do test -s "deploy-assets/scorebar-20261002/$f.webp"; done
          test "$(find deploy-assets/scorebar-20261002 -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 4
          sha256sum deploy-assets/scorebar-20261002/*.webp | sort | tee /tmp/approved-assets.sha256

          # Lock exact currently active Production. Repo source is never used as Worker source.
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=3" -H "$AUTH" -o /tmp/deploy-before.json
          BASE=$(node -e "const j=require('/tmp/deploy-before.json');const d=j.result?.deployments?.[0];if(!d||d.versions?.length!==1||Number(d.versions[0].percentage)!==100)process.exit(2);process.stdout.write(String(d.versions[0].version_id||''))")
          [ -n "$BASE" ] || exit 2
          printf '%s' "$BASE" >/tmp/base-version
          echo "BASE_PRODUCTION=$BASE"

          K="${GITHUB_RUN_ID}-$(date +%s%N)"
          curl -fsS "$BALL46_URL/api/engine/health?before=$K" -o /tmp/before/e.json
          curl -fsS "$BALL46_URL/api/full-market/health?before=$K" -o /tmp/before/f.json
          curl -fsS "$BALL46_URL/api/engine/statistics?before=$K" -o /tmp/before/s.json
          node - <<'NODE'
          const fs=require('fs'),e=require('/tmp/before/e.json'),f=require('/tmp/before/f.json'),s=require('/tmp/before/s.json');
          if(e.ok!==true||f.ok!==true||s.ok!==true)throw Error('BACKEND_NOT_OK_BEFORE');
          fs.writeFileSync('/tmp/backend-before.json',JSON.stringify({engine:e.version,fullMarket:f.version,settlementRevision:s.settlementRevision}));
          NODE

          # Capture current public presentation assets so we can prove they did not change.
          curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/dashboard-v2-tune.css?v=343-scorebar-divider-camo-20260929a&before=$K" -o /tmp/before/tune.css
          curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/dashboard-v2-stage3.js?v=343-scorebar-details-20260929a&before=$K" -o /tmp/before/stage3.js
          sha256sum /tmp/before/tune.css | awk '{print $1}' >/tmp/tune-before.sha
          sha256sum /tmp/before/stage3.js | awk '{print $1}' >/tmp/stage3-before.sha
          node --check /tmp/before/stage3.js
          for n in win loss draw pending; do grep -Fq "scorebar-$n-20260929a.webp" /tmp/before/tune.css; done

          # Download every module from the exact active Worker version.
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/workers/$SCRIPT_NAME/versions/$BASE?include=modules" -H "$AUTH" -o /tmp/version.json
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const j=require('/tmp/version.json');if(j.success!==true)throw Error('VERSION_FETCH_FAILED');
          const r=j.result;if(!r?.main_module||!r.modules?.length)throw Error('MODULES_MISSING');
          const meta=[];
          for(const m of r.modules){
            const b=Buffer.from(m.content_base64,'base64'),p=path.join('/tmp/modules',m.name);
            fs.mkdirSync(path.dirname(p),{recursive:true});fs.writeFileSync(p,b);
            meta.push({name:m.name,content_type:m.content_type,beforeSha:crypto.createHash('sha256').update(b).digest('hex')});
          }
          fs.writeFileSync('/tmp/main',r.main_module);fs.writeFileSync('/tmp/meta.json',JSON.stringify(meta));
          NODE

          # Surgical patch: add four binary responses to the OUTERMOST current wrapper only.
          node - <<'NODE'
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const main=fs.readFileSync('/tmp/main','utf8').trim(),p=path.join('/tmp/modules',main);
          const orig=fs.readFileSync(p,'utf8');let s=orig;
          if(s.includes('B46_SCOREBAR_APPROVED_BG_20261002'))throw Error('SCOREBAR_BG_ALREADY_PRESENT');
          const cnt=(h)=>s.split(h).length-1;
          const marker='function __b46Text(body,type)';
          if(cnt(marker)!==1)throw Error('OUTER_HELPER_MARKER_COUNT_'+cnt(marker));
          const paths={
            '/scorebar-win-20260929a.webp':'deploy-assets/scorebar-20261002/win.webp',
            '/scorebar-loss-20260929a.webp':'deploy-assets/scorebar-20261002/loss.webp',
            '/scorebar-draw-20260929a.webp':'deploy-assets/scorebar-20261002/draw.webp',
            '/scorebar-pending-20260929a.webp':'deploy-assets/scorebar-20261002/pending.webp'
          };
          const b64={};for(const [k,v] of Object.entries(paths))b64[k]=fs.readFileSync(v).toString('base64');
          const helper=`/* B46_SCOREBAR_APPROVED_BG_20261002 — approved presentation assets only */\nconst __B46_SCOREBAR_BG_B64__=${JSON.stringify(b64)};\nfunction __b46ScorebarBgResponse(path){const b64=__B46_SCOREBAR_BG_B64__[path];if(!b64)return null;const raw=atob(b64),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new Response(bytes,{status:200,headers:{'content-type':'image/webp','cache-control':'no-store, no-cache, must-revalidate, max-age=0','pragma':'no-cache','expires':'0','x-ball46-scorebar-bg-revision':'scorebar-bg-approved-20261002'}});}\n`;
          s=s.replace(marker,()=>helper+marker);
          const oldGet="if(request.method==='GET'){if(url.pathname==='/legal.css')";
          const newGet="if(request.method==='GET'){const __b46ScorebarBg=__b46ScorebarBgResponse(url.pathname);if(__b46ScorebarBg)return __b46ScorebarBg;if(url.pathname==='/legal.css')";
          const n=(s.split(oldGet).length-1);if(n!==1)throw Error('OUTER_GET_COUNT_'+n);
          s=s.replace(oldGet,()=>newGet);
          if(!s.includes('B46_SCOREBAR_APPROVED_BG_20261002')||!s.includes("x-ball46-scorebar-bg-revision"))throw Error('PATCH_MISSING');
          // Guard against any accidental API or renderer edits: only generated helper + one GET interception should differ.
          fs.writeFileSync(p,s);
          fs.writeFileSync('/tmp/main-before.sha',crypto.createHash('sha256').update(orig).digest('hex'));
          fs.writeFileSync('/tmp/main-after.sha',crypto.createHash('sha256').update(s).digest('hex'));
          console.log('MAIN_PATCH_READY delta='+(s.length-orig.length)+' before='+fs.readFileSync('/tmp/main-before.sha','utf8')+' after='+fs.readFileSync('/tmp/main-after.sha','utf8'));
          NODE

          # Abort if someone else changed Production while we prepared.
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/recheck.json
          CUR=$(node -e "const j=require('/tmp/recheck.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))")
          [ "$CUR" = "$BASE" ] || { echo "ABORT_CONCURRENT_DEPLOY:$CUR";exit 4; }

          node -e "const fs=require('fs');fs.writeFileSync('/tmp/upload-meta.json',JSON.stringify({main_module:fs.readFileSync('/tmp/main','utf8').trim()}))"
          mapfile -t args < <(node - <<'NODE'
          const fs=require('fs');for(const m of JSON.parse(fs.readFileSync('/tmp/meta.json','utf8')))console.log(`-F\n${m.name}=@/tmp/modules/${m.name};type=${m.content_type}`);
          NODE
          )
          CURL_ARGS=();i=0;while [ $i -lt ${#args[@]} ];do CURL_ARGS+=("${args[$i]}" "${args[$((i+1))]}");i=$((i+2));done
          curl -fsS -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/content" -H "$AUTH" -F 'metadata=</tmp/upload-meta.json;type=application/json' "${CURL_ARGS[@]}" -o /tmp/update.json
          node -e "const j=require('/tmp/update.json');if(j.success!==true)throw Error(JSON.stringify(j.errors||[]));console.log('UPLOAD_ACCEPTED')"

          rollback(){
            set +e
            [ -s /tmp/our-version ] || return
            OUR=$(cat /tmp/our-version)
            curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/current.json || return
            NOW=$(node -e "const j=require('/tmp/current.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))")
            [ "$NOW" = "$OUR" ] || return
            node -e "require('fs').writeFileSync('/tmp/rb.json',JSON.stringify({strategy:'percentage',versions:[{version_id:process.argv[1],percentage:100}],annotations:{'workers/message':'Rollback approved scorebar backgrounds verification failure'}}))" "$BASE"
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments" -H "$AUTH" -H 'content-type: application/json' --data-binary @/tmp/rb.json >/tmp/rb-resp.json || true
            echo "ROLLBACK_TO:$BASE"
          }
          trap 'rc=$?;rollback;exit $rc' ERR

          CAND=''
          for n in $(seq 1 25); do
            curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/d.json
            CAND=$(node -e "const j=require('/tmp/d.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))")
            [ -n "$CAND" ] && [ "$CAND" != "$BASE" ] && break
            sleep 2
          done
          [ -n "$CAND" ] && [ "$CAND" != "$BASE" ]
          printf '%s' "$CAND" >/tmp/our-version
          echo "CANDIDATE=$CAND"

          # Verify exact approved bytes are what public Production now serves.
          declare -A src=(
            [win]='deploy-assets/scorebar-20261002/win.webp'
            [loss]='deploy-assets/scorebar-20261002/loss.webp'
            [draw]='deploy-assets/scorebar-20261002/draw.webp'
            [pending]='deploy-assets/scorebar-20261002/pending.webp'
          )
          for n in win loss draw pending; do
            ok=0
            for try in $(seq 1 20); do
              Q="${GITHUB_RUN_ID}-$n-$try-$(date +%s%N)"
              curl -fsS -L -D "/tmp/after/$n.h" -H 'Cache-Control: no-cache' "$BALL46_URL/scorebar-$n-20260929a.webp?verify=$Q" -o "/tmp/after/$n.webp"
              if grep -Fiq 'content-type: image/webp' "/tmp/after/$n.h" && grep -Fiq 'x-ball46-scorebar-bg-revision: scorebar-bg-approved-20261002' "/tmp/after/$n.h" && cmp -s "${src[$n]}" "/tmp/after/$n.webp"; then ok=1; break; fi
              sleep 2
            done
            [ "$ok" = 1 ] || { echo "PUBLIC_IMAGE_VERIFY_FAIL:$n"; false; }
            echo "PUBLIC_IMAGE_PASS:$n sha=$(sha256sum /tmp/after/$n.webp|awk '{print $1}')"
          done

          # Prove presentation mapping and central signal renderer stayed byte-identical.
          Q="${GITHUB_RUN_ID}-static-$(date +%s%N)"
          curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/dashboard-v2-tune.css?v=343-scorebar-divider-camo-20260929a&after=$Q" -o /tmp/after/tune.css
          curl -fsS -L -H 'Cache-Control: no-cache' "$BALL46_URL/dashboard-v2-stage3.js?v=343-scorebar-details-20260929a&after=$Q" -o /tmp/after/stage3.js
          [ "$(sha256sum /tmp/after/tune.css|awk '{print $1}')" = "$(cat /tmp/tune-before.sha)" ] || { echo CSS_CHANGED; false; }
          [ "$(sha256sum /tmp/after/stage3.js|awk '{print $1}')" = "$(cat /tmp/stage3-before.sha)" ] || { echo STAGE3_CHANGED; false; }
          node --check /tmp/after/stage3.js
          for n in win loss draw pending; do grep -Fq "scorebar-$n-20260929a.webp" /tmp/after/tune.css; done
          echo 'CSS_AND_SIGNAL_RENDERER_UNCHANGED_PASS'

          # Verify every non-main Worker module is byte-identical to the exact base version.
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/workers/$SCRIPT_NAME/versions/$CAND?include=modules" -H "$AUTH" -o /tmp/candidate.json
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const base=JSON.parse(fs.readFileSync('/tmp/meta.json','utf8')),j=require('/tmp/candidate.json');if(j.success!==true)throw Error('CANDIDATE_FETCH_FAILED');
          const r=j.result,main=fs.readFileSync('/tmp/main','utf8').trim(),by=new Map((r.modules||[]).map(m=>[m.name,m]));
          for(const m of base){if(m.name===main)continue;const c=by.get(m.name);if(!c)throw Error('MISSING_MODULE:'+m.name);const sha=crypto.createHash('sha256').update(Buffer.from(c.content_base64,'base64')).digest('hex');if(sha!==m.beforeSha)throw Error('NON_MAIN_CHANGED:'+m.name)}
          console.log('NON_MAIN_MODULES_BYTE_IDENTICAL_PASS');
          NODE

          # Backend identities must remain unchanged.
          curl -fsS "$BALL46_URL/api/engine/health?after=${GITHUB_RUN_ID}" -o /tmp/after/e.json
          curl -fsS "$BALL46_URL/api/full-market/health?after=${GITHUB_RUN_ID}" -o /tmp/after/f.json
          curl -fsS "$BALL46_URL/api/engine/statistics?after=${GITHUB_RUN_ID}" -o /tmp/after/s.json
          node - <<'NODE'
          const b=require('/tmp/backend-before.json'),e=require('/tmp/after/e.json'),f=require('/tmp/after/f.json'),s=require('/tmp/after/s.json');
          const a={engine:e.version,fullMarket:f.version,settlementRevision:s.settlementRevision};
          if(JSON.stringify(a)!==JSON.stringify(b))throw Error('BACKEND_CHANGED');
          console.log('BACKEND_UNCHANGED_PASS',a);
          NODE

          OUR=$(cat /tmp/our-version)
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=2" -H "$AUTH" -o /tmp/final.json
          FINAL=$(node -e "const j=require('/tmp/final.json');process.stdout.write(String(j.result?.deployments?.[0]?.versions?.[0]?.version_id||''))")
          [ "$FINAL" = "$OUR" ] || { echo "FINAL_VERSION_CHANGED:$FINAL"; false; }
          echo "FINAL_PRODUCTION=$FINAL"
          echo 'VERIFY_APPROVED_SCOREBAR_BACKGROUNDS_PASS'
          trap - ERR
