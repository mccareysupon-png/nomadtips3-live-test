name: Ball46 Mobile Focus Diagnostic ONLY

on:
  push:
    branches: [work/ball46-mobile-match-focus-20260918]
    paths:
      - '.github/workflows/ball46-mobile-focus-diagnostic-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Probe Ball46 worker and custom domain
        shell: bash
        run: |
          set -u
          for base in https://ball46-production.mccarey-supon.workers.dev https://ball46.com; do
            echo "=== $base ==="
            for path in /index.html /mobile-match-focus-343.js /mobile-match-focus-343.css /api/hub/health /api/engine/board /api/engine/signals; do
              code=$(curl -sS --max-time 25 -D /tmp/h -o /tmp/b -w '%{http_code}' "$base$path?diag=${GITHUB_RUN_ID}" || true)
              type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub(/\r/,"");sub(/^[^:]*:[[:space:]]*/,"");print;exit}' /tmp/h)
              size=$(wc -c </tmp/b 2>/dev/null || echo 0)
              echo "$path code=$code type=$type bytes=$size"
              if [ "$path" = '/index.html' ]; then grep -o 'mobile-match-focus-343[^"<]*' /tmp/b || true; fi
              if [ "$path" = '/mobile-match-focus-343.js' ]; then grep -o '343-mobile-match-focus-v1' /tmp/b | head -1 || true; fi
              if [ "$path" = '/mobile-match-focus-343.css' ]; then grep -o '@media(max-width:900px)' /tmp/b | head -1 || true; fi
              if [[ "$path" == /api/* ]]; then node -e 'const fs=require("fs");const j=JSON.parse(fs.readFileSync("/tmp/b","utf8"));if(j.ok!==true)process.exit(2);' || echo "API_JSON_NOT_OK $path"; fi
            done
          done
