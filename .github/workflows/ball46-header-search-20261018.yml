name: BALL46 Header search visibility and mobile logo 20261018
on:
  push:
    branches: [codex/ball46-header-search-20261018]
    paths:
      - '.github/workflows/ball46-header-search-20261018.yml'
      - 'deploy-assets/header-search-20261018/run.mjs'
      - 'deploy-assets/header-search-20261018/assets.mjs'
      - 'deploy-assets/header-search-20261018/assets.test.mjs'
      - 'deploy-assets/header-search-20261018/cutover.mjs'
      - 'deploy-assets/header-search-20261018/cutover.test.mjs'
      - 'deploy-assets/header-search-20261018/patch.mjs'
      - 'deploy-assets/header-search-20261018/patch.test.mjs'
      - 'deploy-assets/header-search-20261018/team-kits-343.js'
      - 'deploy-assets/header-search-20261018/provenance.json'
      - 'deploy-assets/header-search-20261018/request.json'
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  header-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate upload protocol and run the requested phase
        working-directory: deploy-assets/header-search-20261018
        run: |
          node --check run.mjs
          node assets.test.mjs
          node cutover.test.mjs
          node --test --test-name-pattern="global|layout|unrelated|unexpected" patch.test.mjs
          node run.mjs
          if [ -f audit/source-assets/index.html ]; then node patch.test.mjs; else node --test --test-name-pattern="global|layout|unrelated|unexpected" patch.test.mjs; fi
      - name: Preserve sanitized audit on the isolated branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-assets/header-search-20261018/audit-last
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Header CSS phase ${GITHUB_RUN_ID} [skip ci]"
          git push origin HEAD:codex/ball46-header-search-20261018
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-header-search-${{ github.run_id }}
          path: deploy-assets/header-search-20261018/audit
          retention-days: 30
