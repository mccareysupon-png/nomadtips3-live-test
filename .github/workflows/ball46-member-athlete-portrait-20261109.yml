name: BALL46 approved close-up member portrait release 20261109
on:
  push:
    branches: [codex/ball46-member-promo-20261104]
    paths: ['work/member-promo-4k-20261109/release-request.json']
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm install --no-save --package-lock=false --prefix work/member-promo-4k-20261109 parse5@7.3.0 playwright@1.56.1 sharp@0.35.5
          cd work/member-promo-4k-20261109 && npx playwright install --with-deps chromium
      - name: Capture fresh actual Production, verify lossless pixels and preserve all current runtime modules
        run: node work/member-promo-4k-20261109/release.mjs stage
      - name: Candidate photo UI PC mobile light dark with unchanged public read-only data
        run: node work/member-promo-4k-20261109/release-browser.mjs candidate
      - name: Actual-origin browser-only photo verification PC mobile light dark
        run: node work/member-promo-4k-20261109/release-browser.mjs shadow
      - name: Activate only the current photo payload after eight browser cases and fresh health
        run: node work/member-promo-4k-20261109/release.mjs activate
      - name: Production photo and live score verification PC mobile light dark
        run: node work/member-promo-4k-20261109/release-browser.mjs production
      - name: Roll back to immediate actual Production baseline if post-activation checks fail
        if: failure()
        run: node work/member-promo-4k-20261109/release-rollback.mjs
      - name: Preserve exact deployment evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/member-promo-4k-20261109/release-audit/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record approved close-up member portrait deployment [skip ci]"
          git push origin HEAD:codex/ball46-member-promo-20261104
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: member-athlete-portrait-20261109-proof
          path: |
            work/member-promo-4k-20261109/release-audit
            work/member-promo-4k-20261109/assets/member-athlete-lossless.webp
