name: DIAG Ball46 Settled Summary Card 20261012

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-ball46-settled-summary-card-20261012.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-performance-chart-market-style-20261012
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts acorn@8
      - name: Find settled summary card
        working-directory: deploy-assets/performance-chart-market-style-20261012
        run: |
          node --input-type=module <<'NODE'
          import {publicFile} from '../daily-performance-20261005/production.mjs';
          const delay=ms=>new Promise(r=>setTimeout(r,ms));
          async function read(path){let last;for(let i=0;i<5;i++){try{return (await publicFile('/'+path)).toString('utf8')}catch(e){last=e;await delay(1000*(i+1))}}throw last}
          for(const name of ['singlepage-workspace-343.js','statistics.js','statistics-next.js','statistics.html','statistics-next.html','ui-sync-fixes-343-v2.js','dashboard-v2-stage3.js']){
            const s=await read(name);
            if(name==='singlepage-workspace-343.js'){
              console.log('\n=== FILE '+name+' ===');
              for(const needle of ['UNSETTLED','SETTLED','WIN RATE','AVG ODDS','Current sample','Awaiting settlement','Winning signals','Losing signals','Neutral results','Push excluded','Recorded entry']){
                let from=0,n=0;while(true){const i=s.indexOf(needle,from);if(i<0)break;n++;console.log('\n--- '+needle+' #'+n+' @ '+i+' ---\n'+s.slice(Math.max(0,i-1800),Math.min(s.length,i+3200)));from=i+needle.length;if(n>=12)break}
              }
            }
          }
          NODE
