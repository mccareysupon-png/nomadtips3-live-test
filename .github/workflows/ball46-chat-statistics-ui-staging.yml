name: BALL46 GPT Chat Statistics UI - ISOLATED STAGING ONLY
on:
  push:
    branches:
      - chatgpt/ball46-statistics-ui-v1
    paths:
      - 'chatgpt-statistics-ui/**'
      - '.github/workflows/ball46-chat-statistics-ui-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate preview and isolated deployment target
        working-directory: chatgpt-statistics-ui
        run: |
          set -euo pipefail
          node --check worker.mjs
          test -s preview.html
          test -f wrangler.toml
          grep -F 'name = "ball46-chat-statistics-ui-staging-20261115"' wrangler.toml
          grep -F 'workers_dev = true' wrangler.toml
          if grep -Ein '(^|[[:space:]])(route|routes|zone_id|zone_name)[[:space:]]*=' wrangler.toml; then
            echo "BLOCKED: staging cannot use custom domains or production routes" >&2
            exit 1
          fi
          echo "Staging target verified; no Production files patched."
      - name: Deploy separate workers.dev preview (never ball46-production)
        working-directory: chatgpt-statistics-ui
        env:
          CLOUDFLARE_API_TOKEN: ${{{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "62cb0db544160e6591342abd6b4f35cc"
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "STAGING NOT DEPLOYED: CLOUDFLARE_API_TOKEN missing; no production or staging writes"
            exit 0
          fi
          npx --yes wrangler@4 deploy --config wrangler.toml
          echo "Deployed ONLY isolated worker ball46-chat-statistics-ui-staging-20261115"
