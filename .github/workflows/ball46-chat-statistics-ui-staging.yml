name: BALL46 GPT Chat Statistics UI - ISOLATED STAGING ONLY
on:
  push:
    branches:
      - chatgpt/ball46-statistics-ui-v1
    paths:
      - 'chatgpt-statistics-ui/**'
      - '.github/workflows/ball46-chat-statistics-ui-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate preview and isolated deployment target
        working-directory: chatgpt-statistics-ui
        run: |
          set -euo pipefail
          node --check worker.mjs
          test -s preview.html
          test -f wrangler.toml
          grep -F 'name = "ball46-chat-statistics-ui-staging-20261115"' wrangler.toml
          grep -F 'workers_dev = true' wrangler.toml
          if grep -Ein '(^|[[:space:]])(route|routes|zone_id|zone_name)[[:space:]]*=' wrangler.toml; then
            echo "BLOCKED: staging cannot use custom domains or production routes" >&2
            exit 1
          fi
          echo "Staging target verified; no Production files patched."
      - name: Deploy separate workers.dev preview (never ball46-production)
        working-directory: chatgpt-statistics-ui
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "62cb0db544160e6591342abd6b4f35cc"
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "STAGING DEPLOY BLOCKED: CLOUDFLARE_API_TOKEN missing; no production or staging writes" >&2
            exit 1
          fi
          npx --yes wrangler@4 deploy --config wrangler.toml
          echo "Deployed ONLY isolated worker ball46-chat-statistics-ui-staging-20261115"
      - name: Verify live STAGING URL and updated 1px chart (never Production)
        working-directory: chatgpt-statistics-ui
        run: |
          set -euo pipefail
          URL="https://ball46-chat-statistics-ui-staging-20261115.mccarey-supon.workers.dev/"
          echo "Checking staging HTTP response at $URL"
          curl --fail-with-body --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 10 --max-time 30 \
            --dump-header /tmp/b46-chat-stage-headers.txt \
            --output /tmp/b46-chat-stage-response.html "$URL"
          grep -Fi 'content-type: text/html' /tmp/b46-chat-stage-headers.txt
          grep -Fq 'B46-STAT-UI-01' /tmp/b46-chat-stage-response.html
          grep -Fq 'stroke-width:1;vector-effect:non-scaling-stroke;shape-rendering:geometricPrecision' /tmp/b46-chat-stage-response.html
          echo "STAGING URL VERIFIED: HTTP OK, current preview marker and thin 1px chart present."

