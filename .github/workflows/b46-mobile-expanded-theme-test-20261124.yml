name: BALL46 Mobile Expanded Theme Sandbox 20261124
on:
  push:
    branches: [test/ball46-mobile-expanded-theme-20261124]
    paths:
      - '.github/workflows/b46-mobile-expanded-theme-test-20261124.yml'
      - 'qa/mobile-expanded-theme-20261124/**'
permissions:
  contents: read
concurrency:
  group: ball46-mobile-expanded-theme-test-20261124
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy the named sandbox only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.50.0 deploy --config qa/mobile-expanded-theme-20261124/wrangler.toml --name ball46-mobile-expanded-theme-test-20261124
      - name: Check real mobile expansion in Dark and Light
        env:
          B46_QA_DIR: ${{ runner.temp }}/mobile-expanded-theme
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
          node qa/mobile-expanded-theme-20261124/qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b46-mobile-expanded-theme-${{ github.run_id }}
          path: ${{ runner.temp }}/mobile-expanded-theme/
          if-no-files-found: warn
