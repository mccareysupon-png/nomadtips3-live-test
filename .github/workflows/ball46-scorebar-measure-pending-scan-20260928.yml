name: READ ONLY - Ball46 Scorebar Measure Pending Scan 20260928
on:
  push:
    branches:
      - work/ball46-scorebar-background-pending-20260928
    paths:
      - .github/workflows/ball46-scorebar-measure-pending-scan-20260928.yml
      - .github/scripts/ball46_scorebar_measure_pending_scan_20260928.sh
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Measure live scorebar and inspect pending Signal schema
        run: bash .github/scripts/ball46_scorebar_measure_pending_scan_20260928.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-scorebar-measure-${{ github.run_id }}
          path: /tmp/b46-scorebar-measure
          retention-days: 14
