name: PREVIEW - Ball46 League Flags Prefix Fix 20261004

on:
  push:
    branches:
      - work/ball46-league-flags-prefix-20261004
    paths:
      - '.github/workflows/ball46-league-flags-prefix-preview-20261004.yml'
      - 'deploy-assets/match-status-svg-20261003/league-flags-343.asset.js'
      - 'deploy-assets/match-status-svg-20261003/league-flags-patch.mjs'
      - 'deploy-assets/match-status-svg-20261003/league-flags-test.mjs'
      - 'deploy-assets/match-status-svg-20261003/league-flags-prefix-run.mjs'

permissions:
  contents: read

concurrency:
  group: ball46-league-flags-prefix-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preview flag fix from current Production only
        shell: bash
        run: |
          cd deploy-assets/match-status-svg-20261003
          export PLAYWRIGHT_EXECUTABLE_PATH
          PLAYWRIGHT_EXECUTABLE_PATH=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$PLAYWRIGHT_EXECUTABLE_PATH" || { echo PREVIEW_CHROME_MISSING; exit 1; }
          npm ci --ignore-scripts --no-audit --no-fund
          node --test league-flags-test.mjs
          node league-flags-prefix-run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-league-flags-prefix-preview-${{ github.run_id }}
          path: deploy-assets/match-status-svg-20261003/audit/league-flags-prefix/
          if-no-files-found: error
          retention-days: 30
