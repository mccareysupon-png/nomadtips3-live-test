name: Ball46 Featured Match Read-Only Scout 20261004

on:
  push:
    branches: [work/featured-match-scout-20261004]
    paths:
      - '.github/workflows/ball46-featured-match-scout-20261004.yml'
      - 'deploy-assets/match-status-svg-20261003/featured-match-current-scout.mjs'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  read-only-scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact proven-rail dependencies
        working-directory: deploy-assets/match-status-svg-20261003
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inspect current Production Featured Match owner and selectors
        working-directory: deploy-assets/match-status-svg-20261003
        run: node featured-match-current-scout.mjs
      - name: Retain scout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-featured-match-scout-${{ github.run_id }}
          path: deploy-assets/match-status-svg-20261003/audit/
          if-no-files-found: error
          retention-days: 30
