name: Mobile Team Row Geometry Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-team-row-order-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify shirt name score order on production mobile
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          node - <<'NODE'
          const puppeteer=require('puppeteer-core');
          const executablePath=process.env.CHROME_PATH||'/usr/bin/google-chrome-stable';
          const check=(ok,msg)=>{if(!ok)throw new Error(msg)};
          (async()=>{
            const browser=await puppeteer.launch({executablePath,headless:true,args:['--no-sandbox','--disable-gpu']});
            try{
              const page=await browser.newPage();
              await page.setViewport({width:390,height:844,deviceScaleFactor:1});
              const errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              await page.goto('https://www.nomadtips3.com/?rowcheck='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForSelector('.match-list',{timeout:30000});
              await new Promise(r=>setTimeout(r,12000));
              const out=await page.evaluate(()=>{
                const lines=[...document.querySelectorAll('.mobile-team-line.mobile-team-score-ready')];
                const sample=lines.slice(0,4).map(line=>{
                  const shirt=line.querySelector(':scope > .mobile-team-shirt-icon');
                  const name=line.querySelector(':scope > .mobile-team-name');
                  const score=line.querySelector(':scope > .mobile-team-score');
                  const sr=shirt?.getBoundingClientRect(), nr=name?.getBoundingClientRect(), cr=score?.getBoundingClientRect(), lr=line.getBoundingClientRect();
                  return {
                    children:[...line.children].map(el=>`${el.tagName}.${el.className}`),
                    grid:getComputedStyle(line).gridTemplateColumns,
                    shirt:sr?{x:sr.x,y:sr.y,w:sr.width,h:sr.height}:null,
                    name:nr?{x:nr.x,y:nr.y,w:nr.width,h:nr.height}:null,
                    score:cr?{x:cr.x,y:cr.y,w:cr.width,h:cr.height}:null,
                    line:{x:lr.x,y:lr.y,w:lr.width,h:lr.height}
                  };
                });
                return {
                  matchCount:document.querySelectorAll('.match-wrap[data-match-id]').length,
                  lineCount:lines.length,
                  hiddenSources:[...document.querySelectorAll('.score-live-value.mobile-score-source-hidden')].filter(el=>getComputedStyle(el).display==='none').length,
                  times:document.querySelectorAll('.score-live-time').length,
                  sample
                };
              });
              console.log('ROW_GEOMETRY',JSON.stringify(out));
              console.log('BROWSER_ERRORS',JSON.stringify(errors));
              check(out.matchCount>0,'no live matches rendered');
              check(out.lineCount===out.matchCount*2,`expected ${out.matchCount*2} team rows, got ${out.lineCount}`);
              check(out.hiddenSources===out.matchCount,'live source scores not hidden exactly once per match');
              check(out.times===out.matchCount,'single live time count mismatch');
              for(const [i,row] of out.sample.entries()){
                check(row.children.length===3,`row ${i} child count ${row.children.length}`);
                check(row.children[0].startsWith('IMG.mobile-team-shirt-icon'),`row ${i} shirt is not first`);
                check(row.children[1].startsWith('SPAN.mobile-team-name'),`row ${i} name is not second`);
                check(row.children[2].startsWith('SPAN.mobile-team-score'),`row ${i} score is not third`);
                check(row.shirt&&row.name&&row.score,`row ${i} missing geometry`);
                check(row.shirt.x < row.name.x && row.name.x < row.score.x,`row ${i} horizontal order wrong`);
                const cy=x=>x.y+x.h/2;
                check(Math.abs(cy(row.shirt)-cy(row.name))<3,`row ${i} shirt/name not same row`);
                check(Math.abs(cy(row.name)-cy(row.score))<3,`row ${i} name/score not same row`);
              }
              check(errors.length===0,`browser errors: ${errors.join(' | ')}`);
              console.log('MOBILE_TEAM_ROW_ORDER_OK');
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          # one-shot geometry verification
