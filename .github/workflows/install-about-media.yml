name: Install About Us Media

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-about-media.yml'
      - '.media-upload/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nomadtips3-install-about-media
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode optimized About Us media
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G '.media-upload/about-loop.part*.b64' > /dev/null; then
            echo 'No staged About Us media found.'
            exit 0
          fi
          test -f .media-upload/about-poster.b64
          mkdir -p about/media
          cat .media-upload/about-loop.part*.b64 | tr -d '\n\r ' | base64 --decode > about/media/about-loop.mp4
          tr -d '\n\r ' < .media-upload/about-poster.b64 | base64 --decode > about/media/about-poster.jpg
          test -s about/media/about-loop.mp4
          test -s about/media/about-poster.jpg
          file about/media/about-loop.mp4 | grep -qi 'ISO Media\|MP4'
          file about/media/about-poster.jpg | grep -qi 'JPEG image data'
          rm -rf .media-upload
          ls -lh about/media

      - name: Commit optimized media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- about/media .media-upload
          if git diff --cached --quiet; then
            echo 'No media changes to commit.'
            exit 0
          fi
          git commit -m 'Install optimized About Us media'
          git pull --rebase origin main
          git push origin main
