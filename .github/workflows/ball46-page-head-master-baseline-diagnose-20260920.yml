name: Ball46 Page Head Master Baseline Diagnose 20260920
on:
  push:
    branches: [work/ball46-page-head-stability-v1-current-20260920]
    paths:
      - '.github/workflows/ball46-page-head-master-baseline-diagnose-20260920.yml'
permissions:
  contents: read
env:
  BALL46_URL: https://ball46.com
  TARGET_BASE_VERSION: 9019cd81-673d-488d-b36d-7ae15d4cc6cc
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-page-head-stability-v1-current-20260920
      - name: Lock production version
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deployments list --config wrangler.ball46.jsonc --json >/tmp/d.json
          node - <<'NODE'
          const fs=require('fs'),d=JSON.parse(fs.readFileSync('/tmp/d.json','utf8')),x=d[d.length-1],t=process.env.TARGET_BASE_VERSION;if(!x?.versions?.some(v=>v.version_id===t&&+v.percentage===100)){console.error('PRODUCTION_CHANGED',JSON.stringify(x));process.exit(1)}console.log('LOCKED',t);
          NODE
      - name: Measure untouched live master
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)
          npm install --no-save --no-package-lock puppeteer-core@24.16.0 >/dev/null 2>&1
          CHROME_BIN="$CHROME" node - <<'NODE'
          const p=require('puppeteer-core');
          const pages=[['P1','index.html','.dash-heading','.dash-shell'],['P2','signal.html','.next-page-head','.next-shell'],['P3','statistics.html','.next-page-head','.next-shell']];
          const vps=[[1920,1080,'desktop-1920'],[1366,900,'desktop-1366'],[390,844,'mobile-390']];
          const base=process.env.BALL46_URL;
          (async()=>{const b=await p.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});try{for(const [w,h,label] of vps){const rows=[];for(const [name,path,hs,ss] of pages){const page=await b.newPage();await page.setJavaScriptEnabled(false);await page.setViewport({width:w,height:h});await page.goto(`${base}/${path}?master=${Date.now()}-${Math.random()}`,{waitUntil:'networkidle0',timeout:30000});rows.push(await page.evaluate(({name,hs,ss})=>{const h=document.querySelector(hs),s=document.querySelector(ss),eb=h.querySelector('.eyebrow'),h1=h.querySelector('h1'),d=h.querySelector(':scope > div:first-child > p:last-child'),st=h.querySelector('.data-state,.next-status');const R=n=>{if(!n)return null;const r=n.getBoundingClientRect();return {left:+r.left.toFixed(2),top:+r.top.toFixed(2),width:+r.width.toFixed(2),height:+r.height.toFixed(2),bottom:+r.bottom.toFixed(2)}};const C=n=>{if(!n)return null;const x=getComputedStyle(n);return {fontFamily:x.fontFamily,fontSize:x.fontSize,fontWeight:x.fontWeight,lineHeight:x.lineHeight,letterSpacing:x.letterSpacing,marginTop:x.marginTop,marginBottom:x.marginBottom,paddingLeft:x.paddingLeft,paddingTop:x.paddingTop,position:x.position,width:x.width}};return {name,bodyClass:document.body.className,shell:R(s),head:R(h),eyebrow:R(eb),h1:R(h1),desc:R(d),status:R(st),eyebrowCss:C(eb),h1Css:C(h1),descCss:C(d),headCss:C(h),shellCss:C(s)}} ,{name,hs,ss}));await page.close()}console.log('MASTER_ROWS',label,JSON.stringify(rows))}}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - run: echo BASELINE_ONLY_NO_DEPLOY
