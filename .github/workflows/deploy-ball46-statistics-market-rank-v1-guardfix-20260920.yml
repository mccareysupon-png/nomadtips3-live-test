name: BLOCKED - Legacy Ball46 Production Rail

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-firewall:
    runs-on: ubuntu-24.04
    steps:
      - name: Block retired production rail
        shell: bash
        run: |
          echo "BALL46_PRODUCTION_FIREWALL_BLOCK"
          echo "Legacy Ball46/Engine deployment is retired."
          echo "Historical UI snapshots, old wrapper refs, and old engine bundles cannot touch current Production."
          exit 1
