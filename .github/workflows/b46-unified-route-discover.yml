name: BALL46 unified PreMatch routing whitelist discovery
on:
  push:
    branches: [release/b46-prematch-unified-no-flicker-20261125]
    paths: ['.github/workflows/b46-unified-route-discover.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node qa/adaptive-readonly-production-20261125/unified-routes.mjs
