name: B46 source audit legacy loader and UI READ ONLY
on:
  push:
    branches: [chatgpt/ball46-statistics-ui-v1]
    paths: ['.github/workflows/b46-source-audit-remove-old-ui-20261116.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect original live Worker source and HTML for loading overlay producers
        run: |
          node <<'NODE'
          const acc='62cb0db544160e6591342abd6b4f35cc',base='https://api.cloudflare.com/client/v4/accounts/'+acc;
          const headers={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const markers=['b46sl-loading','b46-statistics-visuals-20261114-runtime','b46sl-loader','b46sl-root','b46-stats-loader','Your game. In numbers.','Loading statistics','b46sl-skeleton'];
          (async()=>{
           const dep=await fetch(base+'/workers/scripts/ball46-production/deployments?per_page=1',{headers});
           const d=await dep.json();if(!dep.ok||!d.success)throw Error('DEPLOY_FETCH_FAILED');
           const version=d.result.deployments[0].versions[0].version_id;
           console.log('B46_AUDIT_ACTIVE='+version);
           const res=await fetch(base+'/workers/workers/ball46-production/versions/'+version+'?include=modules',{headers});
           const j=await res.json();if(!res.ok||!j.success)throw Error('VERSION_FETCH_FAILED');
           const modules=j.result.modules;
           console.log('B46_AUDIT_META='+JSON.stringify({modules:modules.length,main:j.result.main_module}));
           const decode=m=>Buffer.from(m.content_base64,'base64').toString('utf8');
           for(const m of modules){
             const text=decode(m);
             for(const term of markers){
               let index=text.indexOf(term);
               if(index>=0)console.log('B46_AUDIT_HIT='+JSON.stringify({
                 module:m.name,term,position:index,length:text.length,
                 near:text.slice(Math.max(0,index-1500),Math.min(text.length,index+1800))
               }));
             }
           }
           const html=await fetch('https://www.ball46.com/?view=statistics',{cache:'no-store'});
           const source=await html.text();
           console.log('B46_AUDIT_HTML='+JSON.stringify({status:html.status,bytes:source.length}));
           for(const term of markers){
             let i=source.indexOf(term);
             if(i>=0)console.log('B46_AUDIT_HTML_HIT='+JSON.stringify({term,position:i,near:source.slice(Math.max(0,i-1200),i+1800)}));
           }
          })().catch(e=>{console.error('B46_AUDIT_FAILED='+String(e));process.exitCode=1});
          NODE
