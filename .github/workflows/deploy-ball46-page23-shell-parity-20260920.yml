name: Deploy Ball46 Page23 Shell Parity 20260920

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Deploy or remove only the Page 2/3 shell parity layer
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-ball46-page23-shell-parity-20260920.yml'

permissions:
  contents: read

env:
  SOURCE_BRANCH: work/ball46-page2-workspace-20260920
  BALL46_URL: https://ball46.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy-page23-shell-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout isolated Page 2/3 UI source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Mirror current production and lock protected identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod /tmp/hdr
          while IFS= read -r f; do
            name="${f#nomad-live-343/}"
            case "$name" in
              *.html|*.js|*.css|*.svg|*.json|*.png|*.webp|*.jpg|*.jpeg|*.ico) ;;
              *) continue ;;
            esac
            [ "$name" = 'page23-shell-parity-v1.css' ] && continue
            safe="${name//\//_}"
            code=$(curl -sS -L --max-time 25 -D "/tmp/hdr/$safe" -o "/tmp/prod/$safe" -w '%{http_code}' "$BALL46_URL/$name?page23-parity-rb0=${GITHUB_RUN_ID}") || true
            [ "$code" = 200 ] || continue
            ctype=$(tr -d '\r' < "/tmp/hdr/$safe" | awk 'BEGIN{IGNORECASE=1}/^content-type:/{print tolower($0)}' | tail -1)
            case "$name" in
              *.js) [[ "$ctype" == *javascript* || "$ctype" == *text/plain* ]] || continue ;;
              *.css) [[ "$ctype" == *text/css* || "$ctype" == *text/plain* ]] || continue ;;
              *.html) [[ "$ctype" == *text/html* || "$ctype" == *text/plain* ]] || continue ;;
            esac
            cp "/tmp/prod/$safe" "$f"
          done < <(find nomad-live-343 -maxdepth 1 -type f | sort)

          for f in index.html signal.html statistics.html v2-header.css signal-next.js statistics-next.js dashboard-v2-stage3.js bulk-odds-compat-343.js full-market-bookmaker-343.js live-summary-full-odds-343.js page2-workspace-v1.js page2-workspace-v1.css page2-hide-kpis-v1.css page2-scroll-five-v1.css; do
            test -s "/tmp/prod/${f//\//_}" || { echo "PRODUCTION_ASSET_MISSING:$f"; exit 1; }
          done

          for f in index.html v2-header.css signal-next.js statistics-next.js dashboard-v2-stage3.js bulk-odds-compat-343.js full-market-bookmaker-343.js live-summary-full-odds-343.js page2-workspace-v1.js page2-workspace-v1.css page2-hide-kpis-v1.css page2-scroll-five-v1.css; do
            sha256sum "/tmp/prod/${f//\//_}" | awk '{print $1}' > "/tmp/${f//\//_}.sha"
          done

          python3 - <<'PY'
          from pathlib import Path
          import re
          for page in ('signal','statistics'):
              s=Path(f'/tmp/prod/{page}.html').read_text()
              srcs='\n'.join(re.findall(r'<script[^>]+src=["\']([^"\']+)',s,re.I))
              Path(f'/tmp/{page}-scripts-before.txt').write_text(srcs)
          PY

          curl -fsS --max-time 25 "$BALL46_URL/api/engine/health?page23-parity-rb0=${GITHUB_RUN_ID}" -o /tmp/engine-before.json
          curl -fsS --max-time 25 "$BALL46_URL/api/full-market/health?page23-parity-rb0=${GITHUB_RUN_ID}" -o /tmp/full-before.json
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/engine-before.json','utf8'));
          const f=JSON.parse(fs.readFileSync('/tmp/full-before.json','utf8'));
          if(!e.version||!f.version) throw Error('HEALTH_VERSION_MISSING');
          fs.writeFileSync('/tmp/engine-version',String(e.version));
          fs.writeFileSync('/tmp/full-version',String(f.version));
          fs.writeFileSync('/tmp/full-policy',String(f.staleCachePolicy||''));
          console.log('PAGE23_PARITY_RB0_LOCKED',JSON.stringify({engine:e.version,fullMarket:f.version}));
          NODE

      - name: Apply isolated Page 2/3 geometry layer
        shell: bash
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'deploy' }}
        run: |
          set -euo pipefail
          test -s nomad-live-343/page23-shell-parity-v1.css
          grep -Fq 'max-width:1920px' nomad-live-343/page23-shell-parity-v1.css
          grep -Fq 'grid-template-columns:210px minmax(0,1fr) 320px' nomad-live-343/page23-shell-parity-v1.css
          grep -Fq 'padding:18px clamp(10px,1.4vw,22px) 54px' nomad-live-343/page23-shell-parity-v1.css
          ! grep -Fq 'fetch(' nomad-live-343/page23-shell-parity-v1.css
          ! grep -Fq '/api/' nomad-live-343/page23-shell-parity-v1.css
          ! grep -Fq 'XMLHttpRequest' nomad-live-343/page23-shell-parity-v1.css

          python3 - <<'PY'
          from pathlib import Path
          import os,re
          mode=os.environ.get('MODE','deploy')
          tag='<link rel="stylesheet" href="page23-shell-parity-v1.css?v=343-page23-shell-parity-v1-20260920">'
          for name in ('signal.html','statistics.html'):
              p=Path('nomad-live-343')/name
              s=p.read_text()
              s=re.sub(r'\s*<link[^>]+page23-shell-parity-v1\.css[^>]*>','',s,flags=re.I)
              if mode=='deploy':
                  if '</head>' not in s: raise SystemExit(f'HEAD_ANCHOR_MISSING:{name}')
                  s=s.replace('</head>',tag+'\n</head>',1)
              elif mode!='rollback':
                  raise SystemExit('UNKNOWN_MODE:'+mode)
              p.write_text(s)
          print('PAGE23_SHELL_PARITY_MODE',mode)
          PY

          cmp -s /tmp/prod/index.html nomad-live-343/index.html
          cmp -s /tmp/prod/v2-header.css nomad-live-343/v2-header.css
          cmp -s /tmp/prod/signal-next.js nomad-live-343/signal-next.js
          cmp -s /tmp/prod/statistics-next.js nomad-live-343/statistics-next.js
          cmp -s /tmp/prod/dashboard-v2-stage3.js nomad-live-343/dashboard-v2-stage3.js
          cmp -s /tmp/prod/bulk-odds-compat-343.js nomad-live-343/bulk-odds-compat-343.js
          cmp -s /tmp/prod/full-market-bookmaker-343.js nomad-live-343/full-market-bookmaker-343.js
          cmp -s /tmp/prod/live-summary-full-odds-343.js nomad-live-343/live-summary-full-odds-343.js
          cmp -s /tmp/prod/page2-workspace-v1.js nomad-live-343/page2-workspace-v1.js
          cmp -s /tmp/prod/page2-workspace-v1.css nomad-live-343/page2-workspace-v1.css
          cmp -s /tmp/prod/page2-hide-kpis-v1.css nomad-live-343/page2-hide-kpis-v1.css
          cmp -s /tmp/prod/page2-scroll-five-v1.css nomad-live-343/page2-scroll-five-v1.css

          python3 - <<'PY'
          from pathlib import Path
          import re
          for page in ('signal','statistics'):
              s=Path(f'nomad-live-343/{page}.html').read_text()
              srcs='\n'.join(re.findall(r'<script[^>]+src=["\']([^"\']+)',s,re.I))
              before=Path(f'/tmp/{page}-scripts-before.txt').read_text()
              if srcs != before:
                  raise SystemExit(f'SCRIPT_LIST_CHANGED:{page}')
          PY

          if [ "$MODE" = deploy ]; then
            grep -Fq 'page23-shell-parity-v1.css?v=343-page23-shell-parity-v1-20260920' nomad-live-343/signal.html
            grep -Fq 'page23-shell-parity-v1.css?v=343-page23-shell-parity-v1-20260920' nomad-live-343/statistics.html
          else
            ! grep -Fq 'page23-shell-parity-v1.css' nomad-live-343/signal.html
            ! grep -Fq 'page23-shell-parity-v1.css' nomad-live-343/statistics.html
          fi
          echo PAGE23_GEOMETRY_BOUNDARY_PASS

      - name: Deploy Ball46 wrapper assets only
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify shell parity and protected systems
        shell: bash
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'deploy' }}
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 20); do
            curl -fsS -L --max-time 25 "$BALL46_URL/signal.html?page23-parity=${GITHUB_RUN_ID}-${n}" -o /tmp/signal-after.html || true
            curl -fsS -L --max-time 25 "$BALL46_URL/statistics.html?page23-parity=${GITHUB_RUN_ID}-${n}" -o /tmp/statistics-after.html || true
            if [ "$MODE" = deploy ]; then
              curl -fsS -L --max-time 25 "$BALL46_URL/page23-shell-parity-v1.css?page23-parity=${GITHUB_RUN_ID}-${n}" -o /tmp/parity-after.css || true
              if grep -Fq 'page23-shell-parity-v1.css?v=343-page23-shell-parity-v1-20260920' /tmp/signal-after.html && grep -Fq 'page23-shell-parity-v1.css?v=343-page23-shell-parity-v1-20260920' /tmp/statistics-after.html && grep -Fq 'max-width:1920px' /tmp/parity-after.css; then ok=1; break; fi
            else
              if ! grep -Fq 'page23-shell-parity-v1.css' /tmp/signal-after.html && ! grep -Fq 'page23-shell-parity-v1.css' /tmp/statistics-after.html; then ok=1; break; fi
            fi
            sleep 2
          done
          [ "$ok" = 1 ]

          python3 - <<'PY'
          from pathlib import Path
          import re
          for page in ('signal','statistics'):
              s=Path(f'/tmp/{page}-after.html').read_text()
              srcs='\n'.join(re.findall(r'<script[^>]+src=["\']([^"\']+)',s,re.I))
              before=Path(f'/tmp/{page}-scripts-before.txt').read_text()
              if srcs != before:
                  raise SystemExit(f'LIVE_SCRIPT_LIST_CHANGED:{page}')
          PY

          for f in index.html v2-header.css signal-next.js statistics-next.js dashboard-v2-stage3.js bulk-odds-compat-343.js full-market-bookmaker-343.js live-summary-full-odds-343.js page2-workspace-v1.js page2-workspace-v1.css page2-hide-kpis-v1.css page2-scroll-five-v1.css; do
            safe="${f//\//_}"
            curl -fsS -L --max-time 25 "$BALL46_URL/$f?page23-parity=${GITHUB_RUN_ID}-protected" -o "/tmp/$safe.after"
            test "$(sha256sum "/tmp/$safe.after" | awk '{print $1}')" = "$(cat "/tmp/$safe.sha")" || { echo "PROTECTED_ASSET_CHANGED:$f"; exit 1; }
          done

          curl -fsS --max-time 25 "$BALL46_URL/api/engine/health?page23-parity=${GITHUB_RUN_ID}-after" -o /tmp/engine-after.json
          curl -fsS --max-time 25 "$BALL46_URL/api/full-market/health?page23-parity=${GITHUB_RUN_ID}-after" -o /tmp/full-after.json
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/engine-after.json','utf8'));
          const f=JSON.parse(fs.readFileSync('/tmp/full-after.json','utf8'));
          if(String(e.version||'')!==fs.readFileSync('/tmp/engine-version','utf8')) throw Error('ENGINE_CHANGED');
          if(String(f.version||'')!==fs.readFileSync('/tmp/full-version','utf8')) throw Error('FULL_MARKET_CHANGED');
          if(String(f.staleCachePolicy||'')!==fs.readFileSync('/tmp/full-policy','utf8')) throw Error('FULL_MARKET_POLICY_CHANGED');
          console.log('BALL46_PAGE23_SHELL_PARITY_PASS',JSON.stringify({engine:e.version,fullMarket:f.version}));
          NODE
