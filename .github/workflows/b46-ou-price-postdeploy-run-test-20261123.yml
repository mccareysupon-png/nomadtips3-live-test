name: BALL46 O/U TEST new Worker propagation and live quote tick verification
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-ou-price-postdeploy-run-test-20261123.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Inspect current TEST deployment then activate exactly one guarded O/U quote tick
        run: |
          node --input-type=module <<'JS'
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const token=process.env.CLOUDFLARE_API_TOKEN,a=process.env.CLOUDFLARE_ACCOUNT_ID;
          const root='https://api.cloudflare.com/client/v4/accounts/'+a+'/workers';
          const backend='ball46-prematch-only-test-20261120',expected='dd7b0b9b-daf8-4186-9863-acd04b19c328';
          const protectedNames=['ball46-production','nomadtips3-engine-343','nomadtips3-5usd-hub-343',
            'ball46-premium-match-colors-test-20261120'];
          async function cf(p){
           const r=await fetch(root+p,{headers:{authorization:'Bearer '+token},signal:AbortSignal.timeout(40000)});
           const j=await r.json();assert(r.ok&&j.success,'CF_'+p);return j.result;
          }
          async function version(name){
           const v=(await cf('/scripts/'+name+'/deployments?per_page=1')).deployments[0].versions[0].version_id;
           assert(v);return v;
          }
          const before=Object.fromEntries(await Promise.all(protectedNames.map(async n=>[n,await version(n)])));
          const active=await version(backend);assert.equal(active,expected,'TEST_BACKEND_CHANGED_SINCE_DEPLOY');
          const source=await cf('/workers/'+backend+'/versions/'+active+'?include=modules');
          const names=source.modules.map(x=>x.name),main=Buffer.from(source.modules.find(x=>x.name===source.main_module).content_base64,'base64').toString('utf8');
          assert.equal(names.length,26);
          for(const name of ['ou-price-pickup-v1-test.mjs','ou-verified-price-ingest-v1-test.mjs','ou-math-v1-test.mjs']){
           assert(names.includes(name),'MISSING_QUOTE_MODULE_'+name);
          }
          assert(main.includes("path==='/ou-price-pickup-tick'"));
          assert(main.includes("https://prematch.internal/ou-price-pickup-tick"));
          assert(main.includes('BTTS_CYCLE_DISABLED_PROJECT_CLOSED'));
          const host='https://'+backend+'.mccarey-supon.workers.dev';
          const key=crypto.createHmac('sha256',token).update('BALL46_PREMATCH_ONLY_V1').digest('hex');
          async function owner(path,method='GET'){
           const r=await fetch(host+path,{method,headers:{authorization:'Bearer '+key},cache:'no-store',signal:AbortSignal.timeout(45000)});
           const body=await r.json().catch(()=>null);
           return {status:r.status,body};
          }
          let data=null,firstHttp=null;
          for(let i=0;i<80;i++){
           const out=await owner('/ou-price-pickup-state');
           if(i===0)firstHttp=out.status;
           if(out.status===200&&out.body?.system==='O_U_VERIFIED_PRICE_PICKUP_TEST'){data=out.body;break}
           if(i%10===0)console.log('OU_TEST_PROPAGATION '+JSON.stringify({attempt:i+1,status:out.status}));
           if(out.status===500||out.status===502)throw Error('NEW_WORKER_RUNTIME_ERROR_'+out.status);
           await new Promise(resolve=>setTimeout(resolve,1500));
          }
          assert(data,'NEW_TEST_ROUTE_NOT_AVAILABLE');
          assert.equal(data.policy.maxProviderCallsPerLondonDay,1);
          assert.equal(data.policy.sharedQuotaGuarantee,false);
          console.log('OU_TEST_ACTIVE_ROUTE_PASS '+JSON.stringify({version:expected,modules:names.length,
            firstHttp,nowVisible:true,callsToday:data.providerCallsToday,priced:data.pricedImported}));
          const [oneBefore,btBefore,auditBefore]=await Promise.all([
           owner('/test-ledger'),owner('/btts-bulk-v2-state'),owner('/prematch-stats-registry-audit-test')
          ]);
          assert.equal(oneBefore.status,200);
          assert.equal(btBefore.body?.config?.mode,'CLOSED','BTTS_MUST_REMAIN_CLOSED');
          assert(auditBefore.body?.verified,'BEFORE_MARKET_STATS_AUDIT_FAILED');
          const run=await owner('/ou-price-pickup-tick','POST');
          assert.equal(run.status,200,'OU_PRICE_RUN_HTTP_'+run.status+'_'+JSON.stringify(run.body).slice(0,300));
          assert([0,1].includes(run.body.providerCalls),'QUOTE_PER_TICK_CAP_VIOLATION');
          const twice=await owner('/ou-price-pickup-tick','POST');
          assert.equal(twice.status,200);
          assert.equal(twice.body.providerCalls,0,'OU_QUOTE_REQUEST_REPEATED');
          const [state,preview,btts,oneAfter,auditAfter]=await Promise.all([
           owner('/ou-price-pickup-state'),owner('/preview-data'),owner('/btts-bulk-v2-state'),
           owner('/test-ledger'),owner('/prematch-stats-registry-audit-test')
          ]);
          assert.equal(state.status,200);
          assert(state.body.providerCallsToday<=1);
          assert.equal(preview.status,200);
          assert.equal(preview.body.ouLedger?.mode,'TEST_ONLY');
          assert.equal(btts.body?.config?.mode,'CLOSED');
          assert.equal(oneAfter.body?.mode,'TEST_ONLY');
          assert(auditAfter.body?.verified);
          assert.deepEqual(Object.fromEntries(await Promise.all(protectedNames.map(async n=>[n,await version(n)]))),before,
           'PROTECTED_WORKER_VERSION_CHANGED');
          console.log('B46_OU_PRICE_TEST_WORKER_RUNNING_PASS '+JSON.stringify({
           backendVersion:active,cron:'*/15 * * * *',modules:source.modules.length,
           firstRun:{state:run.body.state,providerCalls:run.body.providerCalls,
             fixtureId:run.body.fixtureId??null,priced:run.body.priced??null,
             remaining:run.body.providerRemaining??null},
           repeat:{state:twice.body.state,providerCalls:twice.body.providerCalls},
           database:{callsToday:state.body.providerCallsToday,pricedImported:state.body.pricedImported,
             recent:state.body.recent?.slice(0,2),ouTotal:preview.body.ouLedger.stats.total,
             pricedRows:preview.body.ouLedger.rows.filter(x=>x.price!==null).length},
           oneX2LedgerRows:oneAfter.body.rows?.length,
           bttsClosed:true,statisticsRegistryValid:true,productionUnchanged:true,
           maxProviderCallsPerLondonDay:1,sharedQuotaGuarantee:false
          }));
          JS
