name: DEPLOY - Ball46 Scorebar Adaptive Latest Production 20260928
on:
  push:
    branches:
      - work/ball46-scorebar-background-pending-20260928
    paths:
      - '.github/workflows/ball46-scorebar-adaptive-deploy-20260928.yml'
      - '.github/scripts/ball46_scorebar_adaptive_deploy_20260928.sh'
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ball46-signal-settlement-predeploy-v5-36379588125
          path: /tmp/b46-template
          github-token: ${{ github.token }}
          run-id: 36379588125
          repository: mccareysupon-png/nomadtips3-live-test
      - name: Rebase on latest Production, verify, deploy, and verify again
        run: bash .github/scripts/ball46_scorebar_adaptive_deploy_20260928.sh
      - name: Upload adaptive proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-scorebar-adaptive-deploy-${{ github.run_id }}
          path: |
            /tmp/b46-bg-pending
            /tmp/b46-bg-pending-deploy
          if-no-files-found: ignore
          retention-days: 30
