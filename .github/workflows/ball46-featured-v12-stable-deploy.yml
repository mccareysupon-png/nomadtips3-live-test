name: BALL46 Featured V12 Stabilize Card Flicker and Event Rows
on:
  push:
    branches: [fix/ball46-featured-events-inline-v12-20261021]
    paths:
      - '.github/workflows/ball46-featured-v12-stable-deploy.yml'
      - 'deploy-assets/featured-events-v12/stable-events-v12.css'
      - 'deploy-assets/featured-events-v12/stable-featured-v12.js'
      - 'deploy-assets/featured-events-v12/deploy-stable-v12.mjs'
permissions: {contents: read}
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation and browser QA
        working-directory: deploy-assets/featured-events-v12
        run: |
          node --check stable-featured-v12.js
          node --check deploy-stable-v12.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Test existing card stable refresh and Event alignment, deploy only after candidate PASS
        working-directory: deploy-assets/featured-events-v12
        run: node deploy-stable-v12.mjs
      - name: Preserve screenshots and rollback report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-v12-stable-events-and-flicker-production
          path: deploy-assets/featured-events-v12/proof/
          retention-days: 30
          if-no-files-found: warn