name: Ball46 Live Recovery 20260921

on:
  push:
    branches: [work/ball46-full-market-20260918]
    paths:
      - '.github/workflows/ball46-live-recovery-20260921.yml'

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BALL46_URL: https://www.ball46.com

jobs:
  recover-live-board:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-full-market-20260918
          fetch-depth: 0

      - name: Patch stale-engine fallback only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('workers/nomadtips3-343-preview/src/index.js')
          s=p.read_text()
          old="""  const engineHasOdds = boardHasBookmakerOdds(engineBoard);\n\n  if (engineResponse.ok && engineBoard?.ok === true && engineHasOdds) {"""
          new="""  const engineHasOdds = boardHasBookmakerOdds(engineBoard);\n  const engineHubAgeMs = num(engineBoard?.hubAgeMs);\n  const engineStale = engineBoard?.stale === true || engineBoard?.staleGuard === true || (engineHubAgeMs !== null && engineHubAgeMs > 180_000);\n\n  if (engineResponse.ok && engineBoard?.ok === true && !engineStale && engineHasOdds) {"""
          assert old in s, 'engine acceptance block not found'
          s=s.replace(old,new,1)
          old2="""  const hubHasOdds = boardHasBookmakerOdds(hub);\n  if (engineResponse.ok && !hubHasOdds) return engineResponse;"""
          new2="""  const hubHasOdds = boardHasBookmakerOdds(hub);\n  if (engineResponse.ok && !engineStale && !hubHasOdds) return engineResponse;"""
          assert old2 in s, 'hub odds fallback guard not found'
          s=s.replace(old2,new2,1)
          old3="""    engineBoardFallbackReason: engineResponse.ok ? 'ENGINE_BOARD_ODDS_EMPTY' : 'ENGINE_BOARD_ERROR',"""
          new3="""    engineBoardFallbackReason: engineStale ? 'ENGINE_BOARD_STALE' : (engineResponse.ok ? 'ENGINE_BOARD_ODDS_EMPTY' : 'ENGINE_BOARD_ERROR'),"""
          assert old3 in s, 'fallback reason block not found'
          s=s.replace(old3,new3,1)
          old4="""    if (board?.ok === true && Array.isArray(board.fixtures)) return liveFixtureIds(board);"""
          new4="""    const boardAgeMs = num(board?.hubAgeMs);\n    const boardStale = board?.stale === true || board?.staleGuard === true || (boardAgeMs !== null && boardAgeMs > 180_000);\n    if (board?.ok === true && !boardStale && Array.isArray(board.fixtures)) return liveFixtureIds(board);"""
          assert old4 in s, 'prewarm board block not found'
          s=s.replace(old4,new4,1)
          p.write_text(s)
          PY
          node --check workers/nomadtips3-343-preview/src/index.js
          git diff --check -- workers/nomadtips3-343-preview/src/index.js
          git diff -- workers/nomadtips3-343-preview/src/index.js

      - name: Persist exact recovery patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ADD-K Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add workers/nomadtips3-343-preview/src/index.js
          git commit -m 'fix(ball46): bypass stale engine board via fresh hub fallback'
          git push origin HEAD:work/ball46-full-market-20260918

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Ball46 wrapper only
        working-directory: workers/nomadtips3-343-preview
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify live chain now
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          curl -fsS --max-time 30 "$BALL46_URL/api/hub/health?recovery=$GITHUB_RUN_ID" -o /tmp/hub-health.json
          curl -fsS --max-time 30 "$BALL46_URL/api/hub/snapshot?recovery=$GITHUB_RUN_ID" -o /tmp/hub.json
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/health?recovery=$GITHUB_RUN_ID" -o /tmp/engine-health.json
          curl -fsS --max-time 30 -D /tmp/board.headers "$BALL46_URL/api/engine/board?recovery=$GITHUB_RUN_ID" -o /tmp/board.json
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/signals?recovery=$GITHUB_RUN_ID" -o /tmp/signals.json
          node - <<'NODE'
          const fs=require('fs');
          const hh=JSON.parse(fs.readFileSync('/tmp/hub-health.json','utf8'));
          const h=JSON.parse(fs.readFileSync('/tmp/hub.json','utf8'));
          const eh=JSON.parse(fs.readFileSync('/tmp/engine-health.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/board.json','utf8'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals.json','utf8'));
          if(hh?.ok!==true) throw Error('HUB health not ok');
          if(h?.ok!==true || !Array.isArray(h?.fixtures)) throw Error('HUB snapshot not ready');
          if(b?.ok!==true || !Array.isArray(b?.fixtures)) throw Error('public board not ready');
          if(s?.ok!==true || !Array.isArray(s?.signals)) throw Error('signals not ready');
          const engineStale=eh?.staleGuard===true || eh?.skipReason==='HUB_STALE';
          if(engineStale && h?.stale!==true && b?.engineBoardFallback!==true) throw Error('stale ENGINE was not bypassed');
          if(engineStale && h?.stale!==true && b?.engineBoardFallbackReason!=='ENGINE_BOARD_STALE') throw Error('wrong stale fallback reason');
          console.log('RECOVERY_PASS',{
            hubAgeMs:h?.ageMs,hubStale:h?.stale,
            engineVersion:eh?.version,engineStaleGuard:eh?.staleGuard,engineSkipReason:eh?.skipReason,
            boardFallback:b?.engineBoardFallback,boardReason:b?.engineBoardFallbackReason,
            fixtures:b.fixtures.length,live:b.fixtures.filter(x=>String(x?.boardState||'').toLowerCase()==='live').length,
            signals:s.signals.length,mirror:s?.mirror
          });
          NODE
          cat /tmp/board.headers | grep -i '^x-ball46-board-source:' || true

      - name: Verify refresh advances
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$BALL46_URL/api/hub/snapshot?advance=1-$GITHUB_RUN_ID" -o /tmp/hub1.json
          sleep 130
          curl -fsS --max-time 30 "$BALL46_URL/api/hub/snapshot?advance=2-$GITHUB_RUN_ID" -o /tmp/hub2.json
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/board?advance=2-$GITHUB_RUN_ID" -o /tmp/board2.json
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/hub1.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/hub2.json','utf8'));
          const board=JSON.parse(fs.readFileSync('/tmp/board2.json','utf8'));
          if(a?.ok!==true||b?.ok!==true||board?.ok!==true) throw Error('advance probe unhealthy');
          if(Number(b?.fetchedAt||0)<=Number(a?.fetchedAt||0) && b?.stale===true) throw Error('HUB did not advance and is stale');
          console.log('ADVANCE_PASS',{from:a?.fetchedAt,to:b?.fetchedAt,ageMs:b?.ageMs,stale:b?.stale,boardFallback:board?.engineBoardFallback,boardReason:board?.engineBoardFallbackReason});
          NODE
