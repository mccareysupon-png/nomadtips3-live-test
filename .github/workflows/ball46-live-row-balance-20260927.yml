name: ONE SHOT - Ball46 Live Row Balance 20260927

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ball46-live-row-balance-20260927.yml'

permissions:
  contents: read
  actions: read

env:
  SOURCE_COMMIT: ac7229ca7f521f8627bd66d5fbb939b970118571
  PATCH_COMMIT: 66fd637a1376c85a196bb4131203ff7517cf0946
  PATCH_SHA256: 6b1e5d8a6d197e4979aac47af5f2057c9deb36d8669c4b71c317289c8c937e3c
  SNAPSHOT_RUN_ID: 36275642150
  SNAPSHOT_NAME: ball46-pre-mobile-parity-36275642150
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  live-row-balance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact production package source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download exact protected production snapshot
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SNAPSHOT_NAME }}
          path: /tmp/pre-mobile
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SNAPSHOT_RUN_ID }}

      - name: Load pinned deployment helper
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 1 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${PATCH_COMMIT}/.github/scripts/ball46_row_balance_patch_20260927.py" \
            -o /tmp/row-balance.py
          test "$(sha256sum /tmp/row-balance.py | awk '{print $1}')" = "$PATCH_SHA256"
          python3 -m py_compile /tmp/row-balance.py
          test -s /tmp/pre-mobile/index.html
          test -s /tmp/pre-mobile/protected.sha
          test ! -s /tmp/pre-mobile/missing.txt

      - name: Preflight exact live production
        shell: bash
        run: python3 /tmp/row-balance.py remote-check "$BALL46_WORKER" baseline

      - name: Rebuild exact snapshot and patch presentation only
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/pre-mobile/index.html nomad-live-343/index.html
          while read -r expected name; do
            src="/tmp/pre-mobile/current-assets/$name"
            test -s "$src"
            test "$(sha256sum "$src" | awk '{print $1}')" = "$expected"
            cp "$src" "nomad-live-343/$name"
          done < /tmp/pre-mobile/protected.sha
          python3 /tmp/row-balance.py patch nomad-live-343
          node --check nomad-live-343/dashboard-v2-stage3.js

      - name: Dry run exact package
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy exact row-balance package
        id: deploy
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify production after deploy
        id: verify
        continue-on-error: true
        shell: bash
        run: python3 /tmp/row-balance.py remote-check "$BALL46_WORKER" new

      - name: Automatic rollback on verification failure
        id: rollback
        if: steps.deploy.outcome == 'success' && steps.verify.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/pre-mobile/index.html nomad-live-343/index.html
          while read -r expected name; do
            cp "/tmp/pre-mobile/current-assets/$name" "nomad-live-343/$name"
          done < /tmp/pre-mobile/protected.sha
          python3 /tmp/row-balance.py baseline nomad-live-343
          node --check nomad-live-343/dashboard-v2-stage3.js
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc
          cd ../..
          python3 /tmp/row-balance.py remote-check "$BALL46_WORKER" baseline

      - name: Final gate
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.verify.outcome }}" != "success" ]; then
            echo "ROW_BALANCE_VERIFY_FAILED; rollback=${{ steps.rollback.outcome }}"
            exit 1
          fi
          echo ROW_BALANCE_DEPLOYMENT_VERIFIED
