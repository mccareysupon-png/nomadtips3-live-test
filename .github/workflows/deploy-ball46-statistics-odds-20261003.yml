name: DEPLOY Ball46 Statistics Odds wiring 20261003

on:
  push:
    branches: [ops/ball46-stat-odds-20261003]
    paths:
      - '.github/workflows/deploy-ball46-statistics-odds-20261003.yml'
      - 'deploy-assets/decorative-borders-20261002/odds-statistics-20261003.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ball46-production-statistics-odds-20261003
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  BALL46_URL: https://ball46.com
  EXPECTED_BASE_VERSION: '17d95cff-da96-41b4-8a17-e984adcee694'

jobs:
  guarded-statistics-odds:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned verification dependencies
        working-directory: deploy-assets/decorative-borders-20261002
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for Statistics DEC/FRA/AM verification
        working-directory: deploy-assets/decorative-borders-20261002
        run: npx playwright install --with-deps chromium
      - name: Patch only Statistics odds display wiring and guarded publish
        working-directory: deploy-assets/decorative-borders-20261002
        run: node odds-statistics-20261003.mjs
      - name: Retain deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-statistics-odds-deploy-${{ github.run_id }}
          path: deploy-assets/decorative-borders-20261002/audit-statistics-odds-20261003/
          if-no-files-found: error
          retention-days: 14
