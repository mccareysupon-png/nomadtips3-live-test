name: READ ONLY - Ball46 Signal Count Audit 20260928

on:
  push:
    branches:
      - ops/ball46-affiliate-price-only-20260928
    paths:
      - '.github/workflows/ball46-signal-count-readonly-audit-20260928.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current Production signal count paths
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/b46-signal-count-audit
          DIRECT='https://ball46-production.mccarey-supon.workers.dev'
          WWW='https://www.ball46.com'
          rm -rf "$ROOT" && mkdir -p "$ROOT"
          nonce="${GITHUB_RUN_ID}-$(date +%s%N)"
          for f in index.html signal.js dashboard-v2-stage3.js singlepage-workspace-343.js live-summary-full-odds-343.js; do
            code=$(curl -sS -L --retry 4 --retry-all-errors --max-time 30 -H 'Cache-Control: no-cache' -o "$ROOT/$f" -w '%{http_code}' "$DIRECT/$f?audit=$nonce-${RANDOM}") || true
            echo "FETCH $f HTTP=$code SIZE=$(wc -c < "$ROOT/$f" 2>/dev/null || echo 0)"
            [ "$code" = 200 ] || exit 1
          done
          curl -fsS -L --retry 4 --max-time 30 "$WWW/api/engine/signals?audit=$nonce" -o "$ROOT/signals.json"
          curl -fsS -L --retry 4 --max-time 30 "$WWW/api/engine/board?audit=$nonce" -o "$ROOT/board.json"
          echo '--- API snapshot ---'
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/b46-signal-count-audit/signals.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/b46-signal-count-audit/board.json','utf8'));
          const rows=Array.isArray(s.signals)?s.signals:[];
          console.log('SIGNALS_API_TOTAL',rows.length);
          console.log('SIGNALS_TOP_KEYS',rows.slice(0,5).map(x=>({id:x.id||x.signal_id||x.signalId,fixture_id:x.fixture_id||x.fixtureId||x.fixture?.id,market:x.market||x.market_type||x.type,status:x.status,minute:x.minute,created_at:x.created_at||x.createdAt})));
          console.log('BOARD_FIXTURES',Array.isArray(b.fixtures)?b.fixtures.length:'NA');
          NODE
          echo '--- index signal counters ---'
          grep -nE 'workspace-signal-count|signal-count|signal-market-count|data-workspace-view="signal"' "$ROOT/index.html" || true
          echo '--- signal.js count/filter/render paths ---'
          grep -nE 'signal|count|filter|render|active|expired|status|market' "$ROOT/signal.js" | head -240 || true
          echo '--- dashboard count paths ---'
          grep -nE 'workspace-signal-count|signal-count|signals|renderSignal|signalRows|activeSignal|filter' "$ROOT/dashboard-v2-stage3.js" | head -280 || true
          echo '--- workspace count paths ---'
          grep -nE 'workspace-signal-count|signal-count|signals|signal-market-count|filter|render' "$ROOT/singlepage-workspace-343.js" | head -280 || true
          echo '--- live summary signal paths ---'
          grep -nE 'signal|count|filter|active|status' "$ROOT/live-summary-full-odds-343.js" | head -220 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-signal-count-audit-${{ github.run_id }}
          path: /tmp/b46-signal-count-audit
          if-no-files-found: ignore
          retention-days: 7
