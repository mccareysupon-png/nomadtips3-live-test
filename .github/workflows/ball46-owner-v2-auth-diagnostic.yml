name: BALL46 isolated owner JWT diagnosis
on:
  push:
    branches: [codex/ball46-owner-control-v2-20261103]
    paths: ['work/api-settings-v2/auth-diagnostic-request.json']
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: work/ball46-5usd-latency-control-20261102
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture current Active Production without writes
        run: node production-preflight.mjs
      - name: Prepare and test owner JWT verification
        run: |
          node ../api-settings-v2/prepare.mjs
          node --check ../api-settings-v2/diagnose.mjs
          node ../api-settings-v2/gateway.test.mjs > production-audit/owner-v2-tests.txt
      - name: Diagnose isolated owner Worker only
        run: node ../api-settings-v2/diagnose.mjs
      - name: Preserve sanitized evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production-audit
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record isolated owner auth diagnosis [skip ci]"
          git push origin HEAD:codex/ball46-owner-control-v2-20261103
