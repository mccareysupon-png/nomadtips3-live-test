name: Repair Ball46 Favicon Only 20260923

on:
  push:
    branches: [work/ball46-event-flow-bars-20260922]
    paths:
      - '.github/workflows/repair-ball46-favicon-only-20260923.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  BALL46_PUBLIC: https://www.ball46.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  SAFE_BASE_SHA: 1ab43bbf6219c3f089a3833cf6dfec90f126f917

jobs:
  favicon-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Verify backend source unchanged
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            workers/nomadtips3-343-preview/src/index.js \
            workers/nomadtips3-343-preview/wrangler.ball46.jsonc \
            workers/nomadtips3-engine-343/src/index.js; do
            git diff --quiet "$SAFE_BASE_SHA"..HEAD -- "$p" || { echo "BACKEND_SOURCE_CHANGED:$p"; exit 1; }
          done

      - name: Mirror current Production assets exactly from known package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find nomad-live-343 -maxdepth 1 -type f | sort)
          mkdir -p /tmp/prod
          for f in "${files[@]}"; do
            name="${f#nomad-live-343/}"
            case "$name" in *.html|*.js|*.css|*.svg|*.json|*.png|*.webp|*.jpg|*.jpeg|*.ico) ;; *) continue ;; esac
            rm -f "$f"
            safe="${name//\//_}"
            code=$(curl -sS -L --retry 3 --retry-all-errors --retry-delay 1 --max-time 25 -o "/tmp/prod/$safe" -w '%{http_code}' "$BALL46_WORKER/$name?favicon-repair-copy=${GITHUB_RUN_ID}") || true
            if [ "$code" = 200 ] && [ -s "/tmp/prod/$safe" ]; then
              cp "/tmp/prod/$safe" "$f"
            fi
          done
          test -s nomad-live-343/index.html || { echo INDEX_MIRROR_FAILED; exit 1; }
          cp nomad-live-343/index.html /tmp/index.before.html

      - name: Check live core before change
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?favicon-repair-before=${GITHUB_RUN_ID}" -o /tmp/board-before.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?favicon-repair-before=${GITHUB_RUN_ID}" -o /tmp/signals-before.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/board-before.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals-before.json'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures)) throw Error('PRE_BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals)) throw Error('PRE_SIGNALS_UNHEALTHY');
          console.log('PRE_CORE_OK',{fixtures:b.fixtures.length,signals:s.signals.length});
          NODE

      - name: Inject favicon only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          p=Path('nomad-live-343/index.html')
          h=p.read_text()
          h=re.sub(r'\s*<link[^>]+rel=["\'](?:shortcut\s+)?icon["\'][^>]*>','',h,flags=re.I)
          svg='''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><rect width="256" height="256" rx="56" fill="#000000"/><g text-anchor="middle" font-family="Arial Black,Arial,Helvetica,sans-serif" font-weight="900"><text x="128" y="101" font-size="74" fill="#ffffff" letter-spacing="-4">ball</text><text x="128" y="205" font-size="112" fill="#0f8f5f" letter-spacing="-5">46</text></g></svg>'''
          data=base64.b64encode(svg.encode()).decode()
          tag=f'<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,{data}" data-ball46-favicon="20260923-repair">'
          if '</head>' not in h: raise SystemExit('HEAD_MISSING')
          p.write_text(h.replace('</head>',tag+'\n</head>',1))
          PY
          grep -Fq 'data-ball46-favicon="20260923-repair"' nomad-live-343/index.html
          test "$(grep -o 'rel="icon"' nomad-live-343/index.html | wc -l)" -eq 1

      - name: Dry run exact Production package plus favicon
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy favicon-only index change
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify favicon and live core
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 15); do
            if curl -fsS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 "$BALL46_WORKER/index.html?favicon-repair-after=${GITHUB_RUN_ID}-${n}" -o /tmp/index.after.html \
              && grep -Fq 'data-ball46-favicon="20260923-repair"' /tmp/index.after.html; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo FAVICON_MARKER_NOT_PROPAGATED; exit 1; }
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?favicon-repair-final=${GITHUB_RUN_ID}" -o /tmp/board-after.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?favicon-repair-final=${GITHUB_RUN_ID}" -o /tmp/signals-after.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/board-after.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals-after.json'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures)) throw Error('POST_BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals)) throw Error('POST_SIGNALS_UNHEALTHY');
          console.log('POST_CORE_OK',{fixtures:b.fixtures.length,signals:s.signals.length});
          NODE
          pub=0
          for n in $(seq 1 10); do
            if curl -fsS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 "$BALL46_PUBLIC/?favicon-repair-public=${GITHUB_RUN_ID}-${n}" -o /tmp/public.html \
              && grep -Fq 'data-ball46-favicon="20260923-repair"' /tmp/public.html; then pub=1; break; fi
            sleep 3
          done
          [ "$pub" = 1 ] || { echo PUBLIC_FAVICON_NOT_PROPAGATED; exit 1; }
          echo BALL46_FAVICON_REPAIR_OK
