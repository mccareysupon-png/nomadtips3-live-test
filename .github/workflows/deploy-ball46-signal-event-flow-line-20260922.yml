name: Deploy Ball46 Signal Event Flow Line 20260922

on:
  push:
    branches: [work/ball46-signal-event-flow-line-20260922]
    paths:
      - 'nomad-live-343/signal-event-flow-line-343.js'
      - 'nomad-live-343/signal-event-flow-line-343.css'
      - '.github/workflows/deploy-ball46-signal-event-flow-line-20260922.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Preflight signal-flow-only isolation
        shell: bash
        run: |
          set -euo pipefail
          node --check nomad-live-343/signal-event-flow-line-343.js
          ! grep -Fq 'fetch(' nomad-live-343/signal-event-flow-line-343.js
          ! grep -Fq 'setInterval' nomad-live-343/signal-event-flow-line-343.js
          ! grep -Fq 'MutationObserver' nomad-live-343/signal-event-flow-line-343.js
          grep -Fq 'LIVE PREDICT · 10M' nomad-live-343/signal-event-flow-line-343.js
          git diff --check

      - name: Mirror exact Production UI baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod
          fetch_required(){
            name="$1"; safe="${name//\//_}"
            code=$(curl -sS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 -o "/tmp/prod/$safe" -w '%{http_code}' "$BALL46_WORKER/$name?signal-flow-copy=${GITHUB_RUN_ID}") || true
            [ "$code" = 200 ] || { echo "REQUIRED_PROD_ASSET_HTTP_${code}:$name"; exit 1; }
            test -s "/tmp/prod/$safe" || { echo "REQUIRED_PROD_ASSET_EMPTY:$name"; exit 1; }
            mkdir -p "$(dirname "nomad-live-343/$name")"
            cp "/tmp/prod/$safe" "nomad-live-343/$name"
          }
          fetch_required index.html
          cp nomad-live-343/index.html /tmp/index.before.html
          python3 - <<'PY' > /tmp/assets.txt
          from pathlib import Path
          import re
          h=Path('/tmp/index.before.html').read_text(errors='ignore')
          found=set()
          for x in re.findall(r'''(?:src|href)=["']([^"']+)["']''',h,re.I):
              x=x.split('?',1)[0].split('#',1)[0].strip().lstrip('./').lstrip('/')
              if not x or '://' in x or '/' in x: continue
              if re.search(r'\.(?:js|css|svg|json|png|webp|jpg|jpeg|ico)$',x,re.I): found.add(x)
          for x in sorted(found): print(x)
          PY
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            case "$name" in signal-event-flow-line-343.js|signal-event-flow-line-343.css) continue ;; esac
            fetch_required "$name"
          done < /tmp/assets.txt
          protected='dashboard-v2-stage3.js dashboard-v2-tune.js bulk-odds-compat-343.js expanded-match-343.js full-market-bookmaker-343.js live-summary-full-odds-343.js singlepage-workspace-343.js mobile-menu-classic-343.js event-flow-icons-343.js'
          : > /tmp/protected.sha
          for f in $protected; do
            fetch_required "$f"
            printf '%s  %s\n' "$(sha256sum "nomad-live-343/$f" | awk '{print $1}')" "$f" >> /tmp/protected.sha
          done
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?signal-flow-before=${GITHUB_RUN_ID}" -o /tmp/board-before.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?signal-flow-before=${GITHUB_RUN_ID}" -o /tmp/signals-before.json

      - name: Inject only Signal Event Flow line assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('nomad-live-343/index.html'); h=p.read_text()
          h=re.sub(r'\s*<link[^>]+signal-event-flow-line-343\.css[^>]*>','',h,flags=re.I)
          h=re.sub(r'\s*<script[^>]+signal-event-flow-line-343\.js[^>]*></script>','',h,flags=re.I)
          css='<link rel="stylesheet" href="signal-event-flow-line-343.css?v=343-signal-flow-line-20260922b">'
          js='<script src="signal-event-flow-line-343.js?v=343-signal-flow-line-20260922b" defer></script>'
          if '</head>' not in h or '</body>' not in h: raise SystemExit('INDEX_ANCHOR_MISSING')
          p.write_text(h.replace('</head>',css+'\n</head>',1).replace('</body>',js+'\n</body>',1))
          PY
          node --check nomad-live-343/signal-event-flow-line-343.js
          while read -r expected f; do
            actual=$(sha256sum "nomad-live-343/$f" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "PROTECTED_LOCAL_CHANGED:$f"; exit 1; }
          done < /tmp/protected.sha

      - name: Dry run Production package
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy Signal Event Flow line
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify continuity
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 2 --max-time 25 "$BALL46_WORKER/index.html?signal-flow-after=${GITHUB_RUN_ID}" -o /tmp/index.after.html
          grep -Fq 'signal-event-flow-line-343.css?v=343-signal-flow-line-20260922b' /tmp/index.after.html
          grep -Fq 'signal-event-flow-line-343.js?v=343-signal-flow-line-20260922b' /tmp/index.after.html
          ! grep -Fq 'event-flow-bars-343.js' /tmp/index.after.html
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/signal-event-flow-line-343.js?verify=${GITHUB_RUN_ID}" -o /tmp/signal-flow.js
          node --check /tmp/signal-flow.js
          ! grep -Fq 'fetch(' /tmp/signal-flow.js
          grep -Fq 'LIVE PREDICT · 10M' /tmp/signal-flow.js
          while read -r expected f; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/$f?signal-flow-protected=${GITHUB_RUN_ID}" -o "/tmp/protected-$f"
            actual=$(sha256sum "/tmp/protected-$f" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "PROTECTED_DEPLOYED_CHANGED:$f"; exit 1; }
          done < /tmp/protected.sha
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?signal-flow-final=${GITHUB_RUN_ID}" -o /tmp/board-after.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?signal-flow-final=${GITHUB_RUN_ID}" -o /tmp/signals-after.json
          node - <<'NODE'
          const fs=require('fs'),b=JSON.parse(fs.readFileSync('/tmp/board-after.json')),s=JSON.parse(fs.readFileSync('/tmp/signals-after.json'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures))throw Error('BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals))throw Error('SIGNALS_UNHEALTHY');
          console.log('SIGNAL_FLOW_LINE_OK',{fixtures:b.fixtures.length,signals:s.signals.length});
          NODE
