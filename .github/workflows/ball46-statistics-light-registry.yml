name: BALL46 Statistics audit registry recovery
on:
  push:
    branches: [codex/ball46-statistics-light-20261101]
    paths: ['deploy-assets/statistics-light-20261101/registry-request.json']
permissions:
  contents: write
  actions: read
jobs:
  verify-registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: statistics-light-41281333118
          path: deploy-assets/statistics-light-20261101/recovered
          run-id: 41281333118
          github-token: ${{ github.token }}
      - name: Read-only active version and artifact verification
        working-directory: deploy-assets/statistics-light-20261101
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node registry-verify.mjs
      - name: Preserve release registry with no deployment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy-assets/statistics-light-20261101/audit/releases/41281333118/*.json
          git commit -m "Preserve verified Statistics light production registry [skip ci]"
          git push origin HEAD:codex/ball46-statistics-light-20261101
