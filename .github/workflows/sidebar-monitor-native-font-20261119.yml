name: BALL46 match native sidebar typography - isolated Worker
on:
  push:
    branches: [test/ball46-sidebar-monitor-live-20261119]
    paths: ['.github/workflows/sidebar-monitor-native-font-20261119.yml']
permissions:
  contents: read
jobs:
  stage:
    if: github.ref == 'refs/heads/test/ball46-sidebar-monitor-live-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record Production baseline
        id: baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {writeFile} from 'node:fs/promises';
          const a=process.env.CLOUDFLARE_ACCOUNT_ID,t=process.env.CLOUDFLARE_API_TOKEN;
          assert(a&&t);
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+a+'/workers/scripts/ball46-production/deployments?per_page=1',{headers:{authorization:'Bearer '+t}});
          const j=await r.json();assert(j.success);
          await writeFile(process.env.RUNNER_TEMP+'/production-before.json',JSON.stringify(j.result.deployments[0].versions));
          EOF
      - name: Measure actual native sidebar count typography
        run: |
          npm install --prefix qa/sidebar-monitor-live-20261119/.runtime --no-fund --no-audit playwright@1.55.0
          qa/sidebar-monitor-live-20261119/.runtime/node_modules/.bin/playwright install chromium --only-shell
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          import {writeFile} from 'node:fs/promises';
          const {chromium}=createRequire(process.cwd()+'/qa/sidebar-monitor-live-20261119/.runtime/package.json')('playwright');
          const browser=await chromium.launch({headless:true});
          try{
            const p=await browser.newPage({viewport:{width:1440,height:950},serviceWorkers:'block'});
            await p.goto('https://ball46-sidebar-monitor-live-test-20261119.mccarey-supon.workers.dev/index.html?view=statistics&b46_mask=0',{waitUntil:'domcontentloaded',timeout:60000});
            await p.waitForFunction(()=>{const n=document.querySelector('[data-filter-count="all"]');return n&&Number((n.dataset.b46Display||n.textContent).replace(/,/g,''))>0},null,{timeout:45000});
            const t=await p.evaluate(()=>{
              const n=document.querySelector('[data-filter-count="all"]');
              if(!n)return null;
              const info=pseudo=>{const c=getComputedStyle(n,pseudo||null);return {size:c.fontSize,weight:c.fontWeight,family:c.fontFamily,content:c.content,pseudo:pseudo||'element'}};
              const variants=[info('::after'),info('::before'),info(null)];
              const visible=variants.find(x=>parseFloat(x.size)>0&&(x.pseudo==='element'||!['none','normal','""'].includes(x.content)));
              return visible?{...visible,reference:'All matches',html:n.outerHTML.slice(0,200),variants}:null;
            });
            assert(t&&/^\d+(?:\.\d+)?px$/.test(t.size)&&/^\d+$/.test(t.weight)&&/^[\w\s,"'.-]+$/.test(t.family),'MEASURE_INVALID '+JSON.stringify(t));
            console.log('NATIVE_TYPOGRAPHY '+JSON.stringify(t));
            assert(Number.parseFloat(t.size)>0&&Number.parseFloat(t.size)<=40,'NATIVE_SIZE_INVALID '+JSON.stringify(t));
            await writeFile('qa/sidebar-monitor-live-20261119/typography.mjs','export const typography='+JSON.stringify({size:t.size,weight:t.weight,family:t.family,reference:t.reference})+';\n');
          }finally{await browser.close()}
          EOF
      - name: Validate and deploy dedicated test only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node qa/sidebar-monitor-live-20261119/test.mjs
          node qa/sidebar-monitor-live-20261119/capture.mjs
          node --check qa/sidebar-monitor-live-20261119/worker.mjs
          cat > qa/sidebar-monitor-live-20261119/wrangler.toml <<'EOF'
          name = "ball46-sidebar-monitor-live-test-20261119"
          main = "worker.mjs"
          compatibility_date = "2026-11-19"
          workers_dev = true
          preview_urls = false
          [[services]]
          binding = "B46_PRODUCTION_READ"
          service = "ball46-production"
          [[services]]
          binding = "B46_MARKET_READER"
          service = "ball46-shadow-receiver-production"
          entrypoint = "MarketStatisticsReader"
          [[durable_objects.bindings]]
          name = "B46_MONITOR_CACHE"
          class_name = "MonitorRateCache"
          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["MonitorRateCache"]
          EOF
          npx --yes wrangler@4.50.0 deploy --config qa/sidebar-monitor-live-20261119/wrangler.toml --name ball46-sidebar-monitor-live-test-20261119
      - name: Check HTML and unchanged scripts
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const base='https://ball46-sidebar-monitor-live-test-20261119.mccarey-supon.workers.dev';
          const read=async p=>{let status=0;for(let i=0;i<12;i++){const r=await fetch(base+p,{signal:AbortSignal.timeout(40000)});status=r.status;if(status===200)return r.text();await new Promise(resolve=>setTimeout(resolve,2000))}assert.equal(status,200,p)};
          let h;for(let i=0;i<15;i++){h=JSON.parse(await read('/_mask_health?font='+i));if(h.typography)break;await new Promise(r=>setTimeout(r,2000))}assert.equal(h.mode,'LIVE_MONITOR_TEST');assert(h.typography&&h.selector.includes('font-size:'+h.typography.size+'!important;'),'FONT_CSS_MISSING');assert.equal(Object.keys(h.snapshot.rates).length,8);
          const clean=await read('/index.html?view=statistics&b46_mask=0'),masked=await read('/index.html?view=statistics');
          const tag='<style id="b46-css-only-mask">'+h.selector+'</style>';
          assert(!clean.includes(tag));assert(masked.includes(tag));assert.equal((masked.match(/data-b46-rate-snapshot=/g)||[]).length,8,'STATIC_LABEL_COVERAGE');
          const scripts=s=>[...s.matchAll(/<script\b[^>]*>[\s\S]*?<\/script>/gi)].map(m=>m[0]);
          assert.deepEqual(scripts(masked).filter(s=>!s.includes('data-b46-monitor-bridge="1"')),scripts(clean),'HTML_SCRIPT_DRIFT');assert.equal(scripts(masked).filter(s=>s.includes('data-b46-monitor-bridge="1"')).length,1);
          for(const p of ['/singlepage-workspace-343.js','/longterm-performance-343.js']){
            const a=await read(p+'?b46_mask=0'),b=await read(p);
            assert.equal(createHash('sha256').update(a).digest('hex'),createHash('sha256').update(b).digest('hex'),'SCRIPT_DRIFT');
          }
          assert.equal((await fetch(base+'/_mask_health',{method:'POST'})).status,405);
          console.log('NATIVE_FONT_SOURCE_PASS '+JSON.stringify(h.typography));
          EOF
      - name: Verify sidebar font and retained rows
        run: |
          npm install --prefix qa/sidebar-monitor-live-20261119/.runtime --no-fund --no-audit playwright@1.55.0
          qa/sidebar-monitor-live-20261119/.runtime/node_modules/.bin/playwright install chromium --only-shell
          mkdir -p "$RUNNER_TEMP/css-mask-proof"
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          const {chromium}=createRequire(process.cwd()+'/qa/sidebar-monitor-live-20261119/.runtime/package.json')('playwright');
          const base='https://ball46-sidebar-monitor-live-test-20261119.mccarey-supon.workers.dev';
          const health=await (await fetch(base+'/_mask_health')).json();const t=health.typography;
          const browser=await chromium.launch({headless:true});
          try{
           const p=await browser.newPage({viewport:{width:1440,height:950},serviceWorkers:'block'});
           const errors=[];p.on('pageerror',e=>errors.push(e.message));
           await p.goto(base+'/index.html?view=statistics',{waitUntil:'domcontentloaded',timeout:60000});
           await p.waitForFunction(()=>document.querySelectorAll('[data-b46-rate-snapshot]').length===8,null,{timeout:35000});
           await p.waitForFunction(()=>[...document.querySelectorAll('[data-sp-table-body] tr')].some(r=>r.cells.length>=4),null,{timeout:90000});
           const result=await p.evaluate(()=>({labels:[...document.querySelectorAll('[data-b46-rate-snapshot]')].map(e=>({market:e.dataset.b46RateSnapshot,text:e.textContent,font:getComputedStyle(e).fontSize,weight:getComputedStyle(e).fontWeight,family:getComputedStyle(e).fontFamily,visible:!!e.getClientRects().length})),original:[...document.querySelectorAll('[data-stat-market] b')].map(e=>({text:e.textContent,hidden:getComputedStyle(e).visibility==='hidden'})),rows:document.querySelectorAll('[data-sp-table-body] tr').length}));
           console.log('COMPUTED_RESULT '+JSON.stringify({expected:t,...result,errors}));assert.equal(result.labels.length,8);assert(result.labels.every(e=>e.font===t.size&&e.weight===t.weight&&e.visible),'FONT_MISMATCH');
           assert.equal(result.original.length,8);assert(result.original.every(e=>e.hidden));assert(result.rows>0);
           await p.screenshot({path:process.env.RUNNER_TEMP+'/css-mask-proof/sidebar-native-font.png',fullPage:true});
           console.log('FONT_VISUAL_PASS '+JSON.stringify({...result,errors}));
          }finally{await browser.close()}
          EOF
      - name: Confirm Production active version unchanged
        if: always() && steps.baseline.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          const a=process.env.CLOUDFLARE_ACCOUNT_ID,t=process.env.CLOUDFLARE_API_TOKEN;
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+a+'/workers/scripts/ball46-production/deployments?per_page=1',{headers:{authorization:'Bearer '+t}});
          const j=await r.json();assert(j.success);
          assert.deepEqual(j.result.deployments[0].versions,JSON.parse(await readFile(process.env.RUNNER_TEMP+'/production-before.json','utf8')));
          console.log('PRODUCTION_UNCHANGED');
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: css-mask-proof
          path: ${{ runner.temp }}/css-mask-proof
          if-no-files-found: ignore
