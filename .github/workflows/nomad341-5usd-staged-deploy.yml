name: Deploy NOMAD 3.41 5USD Central Worker

on:
  push:
    branches:
      - work/341-ui-clone-5usd-staged-runtime
    paths:
      - 'nomad-live-341-5usd/**'
      - '.github/workflows/nomad341-5usd-staged-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
  WORKER_URL: https://nomadtips3-341-5usd-staged.mccarey-supon.workers.dev

jobs:
  deploy-hard-off:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate isolated 3.41 hard-off runtime
        run: |
          set -euo pipefail
          node --check nomad-live-341-5usd/server/worker-staged.js
          node --check nomad-live-341-5usd/server/control-page.js
          grep -Fq "include=odds,events,stats&per_page=500" nomad-live-341-5usd/server/worker-staged.js
          grep -Fq "apiArmed:false" nomad-live-341-5usd/server/worker-staged.js
          grep -Fq "priceRefereeProviderRequests:0" nomad-live-341-5usd/server/worker-staged.js
          grep -Fq '"NOMAD341_LIVE_PROVIDER_ENABLED": "false"' nomad-live-341-5usd/server/wrangler.staged.jsonc
          if grep -Fq '"crons"' nomad-live-341-5usd/server/wrangler.staged.jsonc; then echo '3.41 staged cron must remain removed'; exit 1; fi

      - name: Run offline safety tests
        working-directory: nomad-live-341-5usd/server
        run: |
          set -euo pipefail
          node offline-selftest.mjs
          node control-selftest.mjs

      - name: Dry run Worker bundle
        working-directory: nomad-live-341-5usd/server
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.staged.jsonc --outdir .wrangler-deploy-check

      - name: Validate deploy credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Deploy isolated 3.41 Worker hard-off
        working-directory: nomad-live-341-5usd/server
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.staged.jsonc

      - name: Verify 3.41 clone cannot reach provider
        run: |
          set -euo pipefail
          sleep 4
          curl -fsS --max-time 25 "$WORKER_URL/api/nomad341/control" -o /tmp/control.json
          curl -fsS --max-time 25 "$WORKER_URL/api/nomad341/check" -o /tmp/check.json
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('/tmp/control.json','utf8'));
          const d=JSON.parse(fs.readFileSync('/tmp/check.json','utf8'));
          if(c.hardProviderGate!==false) throw new Error('3.41 hard provider gate is not OFF');
          if(c.effectiveProviderEnabled!==false) throw new Error('3.41 provider is still effective');
          if(d.request?.hardProviderGate!==false) throw new Error('diagnostics still report 3.41 hard gate ON');
          if(d.request?.effectiveProviderEnabled!==false) throw new Error('diagnostics still report provider effective');
          console.log('NOMAD 3.41 HARD-OFF PASS', {
            hardGate:c.hardProviderGate,
            effective:c.effectiveProviderEnabled,
            apiArmed:c.apiArmed,
            polling:c.pollingEnabled,
            note:'Shared 5USD key is not revoked or modified.'
          });
          NODE
