name: Verify 3.43 Recovery Runtime

on:
  push:
    branches: [work/nomad343-clean-bet365-ui]
    paths:
      - '.github/workflows/verify-343-recovery-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify restored 07:47 runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://nomadtips3-343-preview.mccarey-supon.workers.dev'
          for path in / /index.html /signal.html /statistics.html /api/engine/health /api/engine/board /api/full-market/health; do
            code="$(curl -L -sS --max-time 30 -o /tmp/check -w '%{http_code}' "$BASE$path?verify=$RANDOM$RANDOM")"
            echo "$path -> HTTP $code"
            test "$code" = '200'
          done
          curl -fsS --max-time 30 "$BASE/api/engine/board?verify=$RANDOM" -o /tmp/board.json
          node - <<'NODE'
          const fs=require('fs');
          const b=require('/tmp/board.json');
          if(b.ok!==true||!Array.isArray(b.fixtures)||!b.fixtures.length) throw Error('board not ready');
          const live=b.fixtures.filter(f=>String(f?.boardState||'').toLowerCase()==='live');
          const pick=live.find(f=>f?.fixtureId)||b.fixtures.find(f=>f?.fixtureId);
          if(!pick) throw Error('no fixture id');
          fs.writeFileSync('/tmp/fixture-id',String(pick.fixtureId));
          console.log('BOARD_OK',b.fixtures.length,'LIVE',live.length,'FIXTURE',pick.fixtureId);
          NODE
          FIXTURE_ID="$(cat /tmp/fixture-id)"
          code="$(curl -sS --max-time 30 -o /tmp/full.json -w '%{http_code}' "$BASE/api/full-market/fixture-odds?fixtureId=$FIXTURE_ID&verify=$RANDOM")"
          echo "FULL_MARKET fixture=$FIXTURE_ID -> HTTP $code"
          test "$code" = '200'
          node - <<'NODE'
          const j=require('/tmp/full.json');
          if(j.ok!==true) throw Error('full market not ready');
          if(!j.fullOdds||typeof j.fullOdds!=='object') throw Error('full odds missing');
          console.log('FULL_MARKET_OK',j.fixtureId,j.source,'books',Array.isArray(j.availableBookmakers)?j.availableBookmakers.length:0,'cached',j.cached);
          NODE
