name: BALL46 PC Sidebar Spacing — readonly audit
on:
  push:
    branches: [fix/ball46-pc-sidebar-spacing-20261024]
    paths:
      - '.github/workflows/b46-pc-sidebar-spacing-audit.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core
          node --check deploy-assets/pc-sidebar-spacing-20261024/inspect.mjs
          node deploy-assets/pc-sidebar-spacing-20261024/inspect.mjs
