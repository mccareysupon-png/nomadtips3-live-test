name: Ball46 Match Card Theme Scout 20261004

on:
  push:
    branches: [work/card-signal-more-20261004]
    paths:
      - '.github/workflows/ball46-match-card-theme-scout-20261004.yml'
      - 'ops/ball46-card-stability/match-card-theme-scout-20261004.mjs'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  read-only-scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact proven-rail dependencies
        working-directory: deploy-assets/match-status-svg-20261003
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Inspect current match card theme only
        run: node ops/ball46-card-stability/match-card-theme-scout-20261004.mjs
