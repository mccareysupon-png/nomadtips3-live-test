name: BALL46 read-only ledger cursor function
on:
  push:
    branches: [stage/ball46-multisource-v5-20261017]
    paths: [.github/workflows/ball46-ledger-cursor-function.yml]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Extract current ledger pagination algorithm only
        env:
          CF_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node - <<'NODE'
          (async()=>{
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ID+'/workers/scripts/nomadtips3-engine-343',{headers:{Authorization:'Bearer '+process.env.CF_TOKEN}});
            if(!r.ok)throw Error(r.status);
            const s=await r.text(),i=s.indexOf('async latestLedgerRows(');
            console.log('LEDGER_CURSOR_METHOD',i,i<0?'NONE':s.slice(i,i+2000));
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
