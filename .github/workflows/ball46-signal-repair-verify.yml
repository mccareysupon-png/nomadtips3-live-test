name: BALL46 SIGNAL repaired — independent read only postdeploy
on:
  push:
    branches: [fix/ball46-signal-feed-20261023]
    paths:
      - .github/workflows/ball46-signal-repair-verify.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check deploy-assets/signal-repair-20261023/verify.mjs
          node deploy-assets/signal-repair-20261023/verify.mjs
