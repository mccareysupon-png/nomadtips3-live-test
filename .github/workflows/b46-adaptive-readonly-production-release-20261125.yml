name: BALL46 Adaptive read-only Research page guarded Production release
on:
  push:
    branches: [release/b46-adaptive-readonly-page-20261125]
    paths: ['.github/workflows/b46-adaptive-readonly-production-release-20261125.yml']
permissions: {contents: read}
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  guarded-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate read-only release source
        run: |
          node --check qa/adaptive-readonly-production-20261125/b46-adaptive-readonly-page-20261125.mjs
          node --check qa/adaptive-readonly-production-20261125/release.mjs
          node --check qa/adaptive-readonly-production-20261125/rollback.mjs
          node --check qa/adaptive-readonly-production-20261125/qa.mjs
      - name: Install browser testing
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Stage inactive Candidate while Production is unchanged
        id: stage
        env:
          B46_ADAPTIVE_RELEASE_MODE: stage
        run: node qa/adaptive-readonly-production-20261125/release.mjs
      - name: Verify inactive Cloudflare Production preview on PC and Mobile
        env:
          B46_ADAPTIVE_QA_ORIGIN: ${{ steps.stage.outputs.preview }}
        run: node qa/adaptive-readonly-production-20261125/qa.mjs
      - name: Activate candidate only after inactive Browser QA passes
        id: activate
        env:
          B46_ADAPTIVE_RELEASE_MODE: activate
          B46_ADAPTIVE_CANDIDATE: ${{ steps.stage.outputs.candidate }}
          B46_ADAPTIVE_BASE: ${{ steps.stage.outputs.base }}
        run: node qa/adaptive-readonly-production-20261125/release.mjs
      - name: Verify public ball46.com on Desktop and Mobile after activation
        env:
          B46_ADAPTIVE_QA_ORIGIN: https://ball46.com
        run: node qa/adaptive-readonly-production-20261125/qa.mjs
      - name: Rollback if any Production activation or browser check failed
        if: ${{ failure() && steps.stage.outputs.candidate != '' }}
        env:
          B46_ADAPTIVE_CANDIDATE: ${{ steps.stage.outputs.candidate }}
          B46_ADAPTIVE_BASE: ${{ steps.stage.outputs.base }}
        run: node qa/adaptive-readonly-production-20261125/rollback.mjs
      - name: Upload release proof and rollback version
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b46-adaptive-readonly-production-${{ github.run_id }}
          path: qa/adaptive-readonly-production-20261125/audit/
          if-no-files-found: warn
          retention-days: 30
