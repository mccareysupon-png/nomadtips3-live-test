name: Fix active page history shadow once

on:
  push:
    paths:
      - '.github/workflows/fix-share-refresh-history-shadow-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix Browser History API shadowing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "if(updateHash&&location.hash!=='#'+view)history.replaceState(null,'','#'+view);"
          new = "if(updateHash&&location.hash!=='#'+view)window.history.replaceState(null,'','#'+view);"
          if old not in s:
              raise SystemExit('History target not found; no changes made.')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'NOMADTIPS3 automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix active page refresh state'
          git push origin HEAD:main
