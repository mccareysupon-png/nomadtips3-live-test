name: Ball46 Page Head Stability V1 Current V2 Deploy 20260920

on:
  push:
    branches: [work/ball46-page-head-stability-v1-current-20260920]
    paths:
      - '.github/workflows/ball46-page-head-stability-v1-current-v2-deploy-20260920.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_URL: https://ball46.com
  SOURCE_BRANCH: work/ball46-page-head-stability-v1-current-20260920
  TARGET_BASE_VERSION: 9019cd81-673d-488d-b36d-7ae15d4cc6cc
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Guard active production and worker code
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet d0f5787c401d158d10c58b279117ede9d94d2bca..HEAD -- workers/nomadtips3-343-preview/src/index.js
          git diff --quiet d0f5787c401d158d10c58b279117ede9d94d2bca..HEAD -- workers/nomadtips3-343-preview/wrangler.ball46.jsonc
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deployments list --config wrangler.ball46.jsonc --json >/tmp/deployments.json
          cd ../..
          node - <<'NODE'
          const fs=require('fs'),d=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8')),x=d[d.length-1],t=process.env.TARGET_BASE_VERSION;
          if(!x?.versions?.some(v=>v.version_id===t&&Number(v.percentage)===100)){console.error('ACTIVE_PRODUCTION_CHANGED',JSON.stringify(x));process.exit(1)}
          console.log('BASE_VERSION_LOCKED',t);
          NODE

      - name: Mirror current live assets and backend state
        shell: bash
        run: |
          set -euo pipefail
          cp nomad-live-343/page-head-stability-v1.css /tmp/page-head-stability-v1.css
          mkdir -p /tmp/prod /tmp/before
          : >/tmp/protected.tsv
          while IFS= read -r f; do
            name="${f#nomad-live-343/}"
            [ "$name" = page-head-stability-v1.css ] && continue
            case "$name" in *.html|*.js|*.css|*.svg|*.json|*.txt|*.xml|*.png|*.webp|*.jpg|*.jpeg|*.ico) ;; *) continue ;; esac
            tmp="/tmp/prod/${name//\//_}"
            code=$(curl -sS -L --retry 3 --retry-all-errors --retry-delay 1 --max-time 20 -o "$tmp" -w '%{http_code}' "$BALL46_URL/$name?headmirror=$GITHUB_RUN_ID") || code=000
            if [ "$code" = 200 ] && [ -s "$tmp" ]; then
              cp "$tmp" "$f"
              case "$name" in index.html|signal.html|statistics.html) ;; *) printf '%s\t%s\n' "$(sha256sum "$tmp"|awk '{print $1}')" "$name" >>/tmp/protected.tsv ;; esac
            fi
          done < <(find nomad-live-343 -maxdepth 1 -type f | sort)
          cp /tmp/page-head-stability-v1.css nomad-live-343/page-head-stability-v1.css

          for f in index.html signal.html statistics.html v2-header.css dashboard-v2.css ball46-next.css ball46-product-pages-v1.css page2-workspace-v1.css statistics-refine-v2.css; do
            test -s "nomad-live-343/$f" || { echo "MISSING_BASE:$f"; exit 1; }
          done
          cp nomad-live-343/index.html /tmp/index.original.html
          cp nomad-live-343/signal.html /tmp/signal.original.html
          cp nomad-live-343/statistics.html /tmp/statistics.original.html

          # Only fetch a referenced asset if this source branch does not already contain it.
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          root=Path('nomad-live-343')
          for page in ('index.html','signal.html','statistics.html'):
              h=(root/page).read_text(errors='ignore')
              for ref in re.findall(r'(?:src|href)=["\']([^"\']+)["\']',h,re.I):
                  ref=ref.split('#',1)[0]
                  if not ref or ref.startswith(('http:','https:','//','data:','mailto:','#','/api/')): continue
                  path=ref.split('?',1)[0].lstrip('./')
                  if path=='page-head-stability-v1.css' or not re.search(r'\.(css|js|svg|png|webp|jpg|jpeg|ico)$',path,re.I): continue
                  dst=root/path
                  if dst.exists(): continue
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  subprocess.run(['curl','-fsS','-L','--retry','4','--retry-all-errors','--max-time','25','https://ball46.com/'+path,'-o',str(dst)],check=True)
                  print('mirrored missing ref',path)
          PY

          for ep in engine hub full-market; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_URL/api/$ep/health?headbefore=$GITHUB_RUN_ID" -o "/tmp/before/$ep.json"
          done
          node - <<'NODE'
          const fs=require('fs'),o={};for(const n of ['engine','hub','full-market']){const j=JSON.parse(fs.readFileSync(`/tmp/before/${n}.json`,'utf8'));if(j?.ok!==true||!j.version)throw Error('HEALTH_'+n);o[n]={version:String(j.version||''),component:String(j.component||''),staleCachePolicy:String(j.staleCachePolicy||'')}}fs.writeFileSync('/tmp/backend-before.json',JSON.stringify(o));console.log('BACKEND_BEFORE',JSON.stringify(o));
          NODE

      - name: Apply loader only and verify HTML parity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'body[data-page="live"] .dash-heading' nomad-live-343/page-head-stability-v1.css
          grep -Fq '.ball46-product-page .next-page-head' nomad-live-343/page-head-stability-v1.css
          ! grep -Fq 'fetch(' nomad-live-343/page-head-stability-v1.css
          ! grep -Fq '/api/' nomad-live-343/page-head-stability-v1.css
          python3 - <<'PY'
          from pathlib import Path
          import re
          css=Path('nomad-live-343/page-head-stability-v1.css').read_text()
          if css.count('{')!=css.count('}'): raise SystemExit('CSS_BRACE_MISMATCH')
          loader='<link rel="stylesheet" href="page-head-stability-v1.css?v=343-page-head-stability-v1-20260920a">'
          for n in ('index','signal','statistics'):
              p=Path(f'nomad-live-343/{n}.html');s=p.read_text();s=re.sub(r'\s*<link[^>]+page-head-stability-v1\.css[^>]*>','',s,flags=re.I)
              if '</head>' not in s: raise SystemExit('NO_HEAD:'+n)
              p.write_text(s.replace('</head>',loader+'\n</head>',1))
          def strip(s):
              s=re.sub(r'\s*<link[^>]+page-head-stability-v1\.css[^>]*>','',s,flags=re.I)
              return re.sub(r'>\s+<','><',s).strip()
          for n in ('index','signal','statistics'):
              if strip(Path(f'/tmp/{n}.original.html').read_text())!=strip(Path(f'nomad-live-343/{n}.html').read_text()): raise SystemExit('NON_LOADER_HTML_CHANGED:'+n)
          print('HTML_PARITY_PASS')
          PY

      - name: Geometry gate locally BEFORE deploy
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true); [ -n "$CHROME" ]
          npm install --no-save --no-package-lock puppeteer-core@24.16.0 >/dev/null 2>&1
          python3 -m http.server 4173 --directory nomad-live-343 >/tmp/http.log 2>&1 & PID=$!; trap 'kill $PID 2>/dev/null||true' EXIT
          for n in $(seq 1 20); do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break || sleep .25; done
          CHROME_BIN="$CHROME" BASE_URL=http://127.0.0.1:4173 node - <<'NODE'
          const p=require('puppeteer-core');const pages=[['index.html','.dash-heading'],['signal.html','.next-page-head'],['statistics.html','.next-page-head']],vps=[[1920,1080,'1920'],[1366,900,'1366'],[390,844,'390']];
          (async()=>{const b=await p.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});try{for(const [w,h,n] of vps){const a=[];for(const [path,sel] of pages){const x=await b.newPage();await x.setJavaScriptEnabled(false);await x.setViewport({width:w,height:h});await x.goto(process.env.BASE_URL+'/'+path,{waitUntil:'networkidle0'});a.push(await x.$eval(sel,e=>{const R=z=>{const r=z.getBoundingClientRect();return [r.left,r.top]};const eb=e.querySelector('.eyebrow'),h=e.querySelector('h1'),d=e.querySelector(':scope > div:first-child > p:last-child');return {head:R(e),eb:R(eb),h:R(h),d:R(d),fs:[parseFloat(getComputedStyle(eb).fontSize),parseFloat(getComputedStyle(h).fontSize),parseFloat(getComputedStyle(d).fontSize)]}}));await x.close()}for(const [k,i] of [['head',0],['head',1],['eb',0],['eb',1],['h',0],['h',1],['d',0],['d',1]]){const z=Math.max(...a.map(x=>x[k][i]))-Math.min(...a.map(x=>x[k][i]));if(z>1.5)throw Error(`LOCAL_GEOMETRY_${n}_${k}_${i}_${z}`)}for(let i=0;i<3;i++){const z=Math.max(...a.map(x=>x.fs[i]))-Math.min(...a.map(x=>x.fs[i]));if(z>.1)throw Error(`LOCAL_FONT_${n}_${i}_${z}`)}console.log('LOCAL_GEOMETRY_PASS',n,JSON.stringify(a))}}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Dry run and recheck version lock
        shell: bash
        run: |
          set -euo pipefail
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc --dry-run
          npx --yes wrangler@4.92.0 deployments list --config wrangler.ball46.jsonc --json >/tmp/predeploy.json
          cd ../..
          node - <<'NODE'
          const fs=require('fs'),d=JSON.parse(fs.readFileSync('/tmp/predeploy.json','utf8')),x=d[d.length-1],t=process.env.TARGET_BASE_VERSION;if(!x?.versions?.some(v=>v.version_id===t&&Number(v.percentage)===100)){console.error('PRODUCTION_CHANGED_DURING_GATES',JSON.stringify(x));process.exit(1)}console.log('PREDEPLOY_LOCK_PASS');
          NODE

      - name: Deploy presentation overlay
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc | tee /tmp/deploy.txt
          touch /tmp/deployed

      - name: Verify live files backend and geometry
        shell: bash
        run: |
          set -euo pipefail
          M='page-head-stability-v1.css?v=343-page-head-stability-v1-20260920a'
          for f in index.html signal.html statistics.html; do
            for n in $(seq 1 15); do curl -fsS -L --max-time 25 "$BALL46_URL/$f?headafter=$GITHUB_RUN_ID-$n" -o "/tmp/$f.after" && grep -Fq "$M" "/tmp/$f.after" && break || sleep 2; done
            grep -Fq "$M" "/tmp/$f.after"
          done
          while IFS=$'\t' read -r hash name; do [ -n "$name" ]||continue; out="/tmp/${name//\//_}.after"; curl -fsS -L --retry 4 --retry-all-errors --max-time 25 "$BALL46_URL/$name?protect=$GITHUB_RUN_ID" -o "$out"; [ "$(sha256sum "$out"|awk '{print $1}')" = "$hash" ] || { echo "PROTECTED_CHANGED:$name"; exit 1; }; done </tmp/protected.tsv
          mkdir -p /tmp/after
          for ep in engine hub full-market; do curl -fsS -L --retry 4 --retry-all-errors --max-time 30 "$BALL46_URL/api/$ep/health?headafter=$GITHUB_RUN_ID" -o "/tmp/after/$ep.json"; done
          node - <<'NODE'
          const fs=require('fs'),b=JSON.parse(fs.readFileSync('/tmp/backend-before.json','utf8'));for(const n of ['engine','hub','full-market']){const j=JSON.parse(fs.readFileSync(`/tmp/after/${n}.json`,'utf8'));if(j?.ok!==true)throw Error(n+'_HEALTH');for(const k of ['version','component','staleCachePolicy'])if(b[n][k]&&String(j[k]||'')!==b[n][k])throw Error(n+'_'+k+'_CHANGED')}console.log('BACKEND_INVARIANTS_PASS');
          NODE
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium); CHROME_BIN="$CHROME" BASE_URL="$BALL46_URL" node - <<'NODE'
          const p=require('puppeteer-core');const pages=[['index.html','.dash-heading'],['signal.html','.next-page-head'],['statistics.html','.next-page-head']],vps=[[1920,1080,'1920'],[1366,900,'1366'],[390,844,'390']];
          (async()=>{const b=await p.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});try{for(const [w,h,n] of vps){const a=[];for(const [path,sel] of pages){const x=await b.newPage();await x.setJavaScriptEnabled(false);await x.setViewport({width:w,height:h});await x.goto(process.env.BASE_URL+'/'+path+'?geometry='+Date.now()+Math.random(),{waitUntil:'networkidle0'});a.push(await x.$eval(sel,e=>{const R=z=>{const r=z.getBoundingClientRect();return [r.left,r.top]};const eb=e.querySelector('.eyebrow'),h=e.querySelector('h1'),d=e.querySelector(':scope > div:first-child > p:last-child');return {head:R(e),eb:R(eb),h:R(h),d:R(d),fs:[parseFloat(getComputedStyle(eb).fontSize),parseFloat(getComputedStyle(h).fontSize),parseFloat(getComputedStyle(d).fontSize)]}}));await x.close()}for(const [k,i] of [['head',0],['head',1],['eb',0],['eb',1],['h',0],['h',1],['d',0],['d',1]]){const z=Math.max(...a.map(x=>x[k][i]))-Math.min(...a.map(x=>x[k][i]));if(z>1.5)throw Error(`LIVE_GEOMETRY_${n}_${k}_${i}_${z}`)}for(let i=0;i<3;i++){const z=Math.max(...a.map(x=>x.fs[i]))-Math.min(...a.map(x=>x.fs[i]));if(z>.1)throw Error(`LIVE_FONT_${n}_${i}_${z}`)}console.log('LIVE_GEOMETRY_PASS',n,JSON.stringify(a))}}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Report active version
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deployments list --config wrangler.ball46.jsonc --json | tail -c 12000

      - name: Auto rollback if anything failed after deploy
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          [ -f /tmp/deployed ] || { echo NO_DEPLOY_OCCURRED; exit 0; }
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 rollback "$TARGET_BASE_VERSION" --config wrangler.ball46.jsonc --message "Auto rollback page-head stability verification failure"
          echo "AUTO_ROLLBACK_COMPLETE:$TARGET_BASE_VERSION"
