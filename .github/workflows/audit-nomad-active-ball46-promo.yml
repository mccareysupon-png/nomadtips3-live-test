name: Audit NOMAD Active BALL46 Promo
on:
  push:
    branches: [work/nomad341-test-production-rail]
    paths: ['nomad-live-web-test/AUDIT_ACTIVE_BALL46_PROMO_READY']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node nomad-live-web-test/audit-active-ball46-promo.mjs
