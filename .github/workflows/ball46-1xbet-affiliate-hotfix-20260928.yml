name: ONE SHOT - Ball46 1xBet Affiliate Hotfix 20260928

on:
  push:
    branches:
      - ops/ball46-1xbet-affiliate-20260928
    paths:
      - '.github/workflows/ball46-1xbet-affiliate-hotfix-20260928.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch current Production presentation layer only
        shell: bash
        run: bash .github/scripts/ball46_1xbet_affiliate_hotfix_20260928.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-1xbet-affiliate-${{ github.run_id }}
          path: /tmp/b46-1xbet-affiliate/verify
          if-no-files-found: ignore
          retention-days: 30
