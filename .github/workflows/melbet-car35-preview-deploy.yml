name: Deploy MelBet CAR35 Preview

on:
  push:
    branches:
      - work/melbet-car35-detector
    paths:
      - 'melbet-car35-detector/**'
      - '.github/workflows/melbet-car35-preview-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PREVIEW_URL: https://nomadtips3-melbet-preview.mccarey-supon.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate source
        run: |
          node --check melbet-car35-detector/index.js
          grep -q "MELBET_DIRECT" melbet-car35-detector/index.js
          grep -q "Signal Detector" melbet-car35-detector/index.js
          grep -q "Statistics" melbet-car35-detector/index.js
          grep -q "Settings" melbet-car35-detector/index.js
          grep -q "MELBET_STATE" melbet-car35-detector/wrangler.jsonc

      - name: Validate Cloudflare credentials
        run: |
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"

      - name: Deploy preview
        id: deploy
        working-directory: melbet-car35-detector
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Smoke test preview
        id: smoke
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base=process.env.PREVIEW_URL, stamp=Date.now();
          const diag={deploy:'success',smoke:'failed',previewUrl:base,stage:null,error:null};
          const save=()=>{fs.mkdirSync('.deploy-status',{recursive:true});fs.writeFileSync('.deploy-status/melbet-preview.json',JSON.stringify(diag,null,2))};
          try{
            const getText=async p=>{const r=await fetch(base+p+(p.includes('?')?'&':'?')+'t='+stamp,{cache:'no-store'});return{r,text:await r.text()}};
            diag.stage='detector'; const root=await getText('/'); if(!root.r.ok||!root.text.includes('Signal Detector')||!root.text.includes('MELBET DIRECT'))throw new Error(`detector ${root.r.status}`);
            diag.stage='statistics'; const stats=await getText('/statistics'); if(!stats.r.ok||!stats.text.includes('Statistics'))throw new Error(`statistics ${stats.r.status}`);
            diag.stage='settings'; const settings=await getText('/settings'); if(!settings.r.ok||!settings.text.includes('Settings')||!settings.text.includes('Momentum weights'))throw new Error(`settings ${settings.r.status}`);
            diag.stage='health'; const health=await fetch(base+'/health?t='+stamp,{cache:'no-store'}).then(async r=>({status:r.status,body:await r.text()})); let h;try{h=JSON.parse(health.body)}catch{throw new Error(`health non-json ${health.status}: ${health.body.slice(0,180)}`)} if(!h.ok||h.source!=='MELBET_DIRECT'||h.mode!=='DIRECT_MELBET')throw new Error(`health contract ${health.status}: ${health.body.slice(0,240)}`);
            diag.stage='config'; const cr=await fetch(base+'/config?t='+stamp,{cache:'no-store'}); const cb=await cr.text(); let c;try{c=JSON.parse(cb)}catch{throw new Error(`config non-json ${cr.status}: ${cb.slice(0,180)}`)} if(!c.ok||!c.config||c.config.minuteMin!==60||c.config.minuteMax!==80)throw new Error(`config contract ${cr.status}: ${cb.slice(0,240)}`);
            diag.stage='history'; const hr=await fetch(base+'/history?page=1&limit=25&t='+stamp,{cache:'no-store'}); const hb=await hr.text(); let hist;try{hist=JSON.parse(hb)}catch{throw new Error(`history non-json ${hr.status}: ${hb.slice(0,180)}`)} if(!hist.ok||hist.historyStorage!=='MELBET_SQLITE_HISTORY_V1'||!Array.isArray(hist.records))throw new Error(`history contract ${hr.status}: ${hb.slice(0,240)}`);
            diag.stage='live'; const lr=await fetch(base+'/live?t='+stamp,{cache:'no-store'}); const lb=await lr.text(); let live;try{live=JSON.parse(lb)}catch{throw new Error(`live non-json ${lr.status}: ${lb.slice(0,180)}`)} if(live.source!=='MELBET_DIRECT'||!Array.isArray(live.matches))throw new Error(`live contract ${lr.status}: ${lb.slice(0,300)}`);
            Object.assign(diag,{smoke:'success',stage:'complete',liveOk:!!live.ok,liveError:live.error||null,liveMatches:live.matches.length,sourceHealth:live.sourceHealth||null,generatedAt:live.generatedAt||null}); save();
          }catch(e){diag.error=String(e?.message||e);save();process.exitCode=1}
          NODE

      - name: Persist diagnostics
        if: always()
        run: |
          if [ ! -f .deploy-status/melbet-preview.json ]; then
            mkdir -p .deploy-status
            printf '{"deploy":"%s","smoke":"failed","stage":"before-smoke","previewUrl":"%s"}\n' "${{ steps.deploy.outcome }}" "$PREVIEW_URL" > .deploy-status/melbet-preview.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy-status/melbet-preview.json
          git commit -m "Record MelBet preview diagnostics" || exit 0
          git push

      - name: Fail if smoke failed
        if: steps.smoke.outcome != 'success'
        run: exit 1
