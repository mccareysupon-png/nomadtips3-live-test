name: B46 engine handshake preflight (READ ONLY)
on:
  push:
    branches: [chatgpt/ball46-new-ledger-clean-v1]
    paths: ['.github/workflows/b46-engine-handshake-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify active versions and handshake capability without mutation
        run: |
          node <<'JS'
          const {createHash}=require('node:crypto');
          const base='https://api.cloudflare.com/client/v4/accounts/62cb0db544160e6591342abd6b4f35cc';
          const headers={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const get=async p=>{const r=await fetch(base+p,{headers,signal:AbortSignal.timeout(20000)});const d=await r.json();if(!r.ok||!d.success)throw Error('CF_READ_'+r.status);return d.result};
          (async()=>{
            for(const name of ['nomadtips3-engine-343','ball46-shadow-receiver-production','ball46-production']){
              const d=await get('/workers/scripts/'+name+'/deployments?per_page=1'),v=d.deployments?.[0]?.versions;if(v?.length!==1)throw Error('ACTIVE_VERSION_UNEXPECTED');
              const version=v[0].version_id,w=await get('/workers/workers/'+name+'/versions/'+version+'?include=modules'),s=await get('/workers/scripts/'+name+'/settings');
              const sub=await get('/workers/scripts/'+name+'/subdomain');
              const mods=(w.modules||[]).filter(m=>typeof m.content_base64==='string'&&/\.(js|mjs)$/.test(m.name));const src=mods.map(m=>Buffer.from(m.content_base64,'base64').toString('utf8')).join('\n');
              const bindings=(s.bindings||[]).map(b=>({name:b.name,type:b.type,service:b.type==='service'?b.service:undefined,class_name:b.type==='durable_object_namespace'?b.class_name:undefined}));
              console.log('PREFLIGHT='+JSON.stringify({name,version,bindings,workersDev:sub.enabled,previewUrls:sub.previews_enabled,sha256:mods.length===1?createHash('sha256').update(Buffer.from(mods[0].content_base64,'base64')).digest('hex'):null,hasDirectReceiverCall:src.includes('B46_SHADOW_RECEIVER'),exportsDurableObject:bindings.some(b=>b.type==='durable_object_namespace'),hasDefaultFetch: /async\s+fetch\s*\(/.test(src),healthPathCount:(src.match(/\/health\b/g)||[]).length,settingsKeys:Object.keys(s).sort(),versionKeys:Object.keys(w).sort(),resourcesKeys:Object.keys(w.resources||{}).sort()}));
            }
          })().catch(e=>{console.error(String(e.message));process.exitCode=1});
          JS
