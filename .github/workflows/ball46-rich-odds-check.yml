name: Ball46 Rich Odds Check

# production verification: John-safe central gate, one fixture only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ball46-rich-odds-check.yml'

permissions:
  contents: read

jobs:
  check-rich-odds:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe restored all-bookmaker odds through Ball46 gate
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ball46.com'
          curl -fsS --max-time 30 "$BASE/api/engine/board?_=${GITHUB_RUN_ID}" -o /tmp/board.json
          node - <<'NODE'
          const j=require('/tmp/board.json');
          const fs=Array.isArray(j.fixtures)?j.fixtures:[];
          const live=fs.find(f=>String(f?.boardState||f?.status||'').toLowerCase().includes('live')||String(f?.status||'').toLowerCase().includes('in_play'))||fs[0];
          if(!live?.fixtureId) throw Error('NO_FIXTURE');
          require('fs').writeFileSync('/tmp/id',String(live.fixtureId));
          console.log('FIXTURE',live.fixtureId);
          NODE
          ID="$(cat /tmp/id)"
          code="$(curl -sS --max-time 30 -D /tmp/rich.headers -o /tmp/rich.json -w '%{http_code}' "$BASE/api/full-market/fixture-odds?fixtureId=${ID}&_=${GITHUB_RUN_ID}" || true)"
          echo "BALL46_FULL_MARKET_HTTP $code"
          test "$code" = 200
          node - <<'NODE'
          const j=require('/tmp/rich.json');
          const full=j?.fullOdds||{};
          const rows=Array.isArray(full?.bookmakers)?full.bookmakers:[];
          const requested=Array.isArray(j?.requestedBookmakers)?j.requestedBookmakers:[];
          const summarize=x=>{
            const odds=x?.odds||{};
            const ah=odds.asian_handicap?.inplay??odds.asian_handicap?.closing??null;
            const ou=odds.goal_line?.inplay??odds.goal_line?.closing??null;
            return {slug:x?.slug??x?.name,markets:Object.keys(odds),ah:ah&&typeof ah==='object'?{line:ah.line,home:ah.home,away:ah.away}:ah,ou:ou&&typeof ou==='object'?{line:ou.line,over:ou.over,under:ou.under}:ou};
          };
          console.log('BALL46_ALL_BOOKS_SUMMARY',JSON.stringify({ok:j?.ok,fixtureId:j?.fixtureId,bookCount:rows.length,requestedCount:requested.length,cached:j?.cached,stale:j?.stale,externalRequestsAdded:j?.externalRequestsAdded,books:rows.map(x=>x?.slug),details:rows.map(summarize)},null,2));
          if(j?.ok!==true) process.exit(21);
          if(requested.length!==19) throw Error(`requestedCount=${requested.length}`);
          if(!rows.length) throw Error('NO_BOOKMAKER_ROWS');
          NODE
