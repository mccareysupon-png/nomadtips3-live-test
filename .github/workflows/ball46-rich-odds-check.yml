name: Ball46 Rich Odds Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ball46-rich-odds-check.yml'

permissions:
  contents: read

env:
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}

jobs:
  check-rich-odds:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe all-bookmaker full odds in one request
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIVEDOLLAR_API_KEY"
          BASE='https://ball46.com'
          BOOKS='bet365,pinnacle,williamhill,ladbrokes,vcbet,1xbet,bwin,easybets,interwetten,betfair,snai,macauslot,betsson,betathome,18bet,10bet,12bet,coral,crown'
          curl -fsS --max-time 30 "$BASE/api/engine/board?_=${GITHUB_RUN_ID}" -o /tmp/board.json
          node - <<'NODE'
          const j=require('/tmp/board.json');
          const fs=Array.isArray(j.fixtures)?j.fixtures:[];
          const live=fs.find(f=>String(f?.boardState||f?.status||'').toLowerCase().includes('live')||String(f?.status||'').toLowerCase().includes('in_play'))||fs[0];
          if(!live?.fixtureId) throw Error('NO_FIXTURE');
          require('fs').writeFileSync('/tmp/id',String(live.fixtureId));
          console.log('FIXTURE',live.fixtureId);
          NODE
          ID="$(cat /tmp/id)"
          code="$(curl -sS --max-time 30 -o /tmp/provider.json -w '%{http_code}' -H 'Accept: application/json' -H "Authorization: Bearer $FIVEDOLLAR_API_KEY" "https://api.5dollarfootballapi.com/v1/fixtures/${ID}/odds?bookmakers=${BOOKS}" || true)"
          echo "PROVIDER_ALL_BOOKS_HTTP $code"
          node - <<'NODE'
          const fs=require('fs'); const text=fs.readFileSync('/tmp/provider.json','utf8');
          let j={}; try{j=JSON.parse(text)}catch{}
          const root=j?.data??j;
          const rows=Array.isArray(root?.bookmakers)?root.bookmakers:[];
          const summarize=x=>{
            const odds=x?.odds||{};
            const ah=odds.asian_handicap?.inplay??odds.asian_handicap?.closing??null;
            const ou=odds.goal_line?.inplay??odds.goal_line?.closing??null;
            return {slug:x?.slug??x?.name,markets:Object.keys(odds),ah:ah&&typeof ah==='object'?{line:ah.line,home:ah.home,away:ah.away}:ah,ou:ou&&typeof ou==='object'?{line:ou.line,over:ou.over,under:ou.under}:ou};
          };
          console.log('ALL_BOOKS_SUMMARY',JSON.stringify({success:j?.success,fixtureId:root?.fixture_id,bookCount:rows.length,books:rows.map(x=>x?.slug),details:rows.map(summarize)},null,2));
          if(!j?.success||!rows.length) process.exit(21);
          NODE
