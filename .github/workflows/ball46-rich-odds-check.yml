name: Ball46 Rich Odds Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ball46-rich-odds-check.yml'

permissions:
  contents: read

env:
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}

jobs:
  check-rich-odds:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe live fixture and provider full odds
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIVEDOLLAR_API_KEY"
          BASE='https://ball46.com'
          curl -fsS --max-time 30 "$BASE/api/engine/board?_=${GITHUB_RUN_ID}" -o /tmp/board.json
          node - <<'NODE'
          const j=require('/tmp/board.json');
          const fs=Array.isArray(j.fixtures)?j.fixtures:[];
          const live=fs.find(f=>String(f?.boardState||f?.status||'').toLowerCase().includes('live')||String(f?.status||'').toLowerCase().includes('in_play'))||fs[0];
          if(!live?.fixtureId) throw Error('NO_FIXTURE');
          require('fs').writeFileSync('/tmp/id',String(live.fixtureId));
          console.log('FIXTURE',live.fixtureId);
          NODE
          ID="$(cat /tmp/id)"

          code="$(curl -sS --max-time 30 -o /tmp/provider.json -w '%{http_code}' -H 'Accept: application/json' -H "Authorization: Bearer $FIVEDOLLAR_API_KEY" "https://api.5dollarfootballapi.com/v1/fixtures/${ID}/odds" || true)"
          echo "PROVIDER_FULL_ODDS_HTTP $code"
          node - <<'NODE'
          const fs=require('fs'); const text=fs.readFileSync('/tmp/provider.json','utf8');
          let j={}; try{j=JSON.parse(text)}catch{}
          const root=j?.data??j;
          const books=root?.bookmakers??j?.bookmakers??[];
          const rows=Array.isArray(books)?books:[];
          const first=rows[0]||null;
          const odds=first?.odds??first?.markets??first?.data?.odds??first?.data?.markets??null;
          console.log('PROVIDER_FULL_ODDS_SHAPE',JSON.stringify({keys:Object.keys(j||{}),rootKeys:root&&typeof root==='object'?Object.keys(root).slice(0,60):[],bookCount:rows.length,books:rows.map(x=>x?.slug??x?.name??x?.bookmaker?.slug??x?.bookmaker?.name).filter(Boolean).slice(0,30),firstBookKeys:first&&typeof first==='object'?Object.keys(first):[],marketKeys:odds&&typeof odds==='object'?Object.keys(odds).slice(0,60):[],error:j?.error||null}));
          console.log('PROVIDER_FULL_ODDS_SAMPLE',JSON.stringify(j).slice(0,14000));
          NODE

          code2="$(curl -sS --max-time 30 -o /tmp/rich.json -w '%{http_code}' "$BASE/api/hub/rich-odds?fixtureId=${ID}&_=${GITHUB_RUN_ID}" || true)"
          echo "CURRENT_HUB_RICH_HTTP $code2"
          head -c 1200 /tmp/rich.json || true
          echo
