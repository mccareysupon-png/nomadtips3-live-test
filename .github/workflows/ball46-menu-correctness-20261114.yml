name: BALL46 Statistics menu correctness release
on:
  push:
    branches: [test/ball46-statistics-content-revision-20261113]
    paths: ['.github/workflows/ball46-menu-correctness-20261114.yml','work/statistics-content-revision-20261113/menu-*.mjs']
permissions:
  contents: read
jobs:
  menu-only:
    if: contains(github.event.head_commit.message, '[menu-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture current source and static files read-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node work/statistics-summary-shadow-20261113/fresh-source.mjs
          node work/statistics-summary-shadow-20261113/capture-ui.mjs
          mkdir -p work/statistics-summary-shadow-20261113/reference/ui-proof/qa/ui-capture work/statistics-content-revision-20261113/qa/release
          cp -r work/statistics-summary-shadow-20261113/qa/ui-capture/. work/statistics-summary-shadow-20261113/reference/ui-proof/qa/ui-capture/
      - name: Reproduce exact 132-row discrepancy and verify one owner
        run: node work/statistics-content-revision-20261113/menu-single-owner-test.mjs
      - name: Install browser verification
        run: |
          npm install --prefix work/statistics-summary-shadow-20261113/.runtime --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          work/statistics-summary-shadow-20261113/.runtime/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify preview and deploy menu-only patch with rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node work/statistics-content-revision-20261113/menu-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-menu-correctness-proof
          path: |
            work/statistics-content-revision-20261113/qa/menu-counts.json
            work/statistics-content-revision-20261113/qa/release
            work/statistics-summary-shadow-20261113/source/active.json
