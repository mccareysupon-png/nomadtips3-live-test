name: Fix 3.43 Settlement Tail

on:
  push:
    branches:
      - work/nomad343-settlement-tail-20260914
    paths:
      - .github/workflows/fix-343-settlement-tail.yml

jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
      ACTIVE_BRANCH: work/nomad343-server-prewarm-20260914
      ROLLBACK_REF: backup/pre-343-settlement-tail-20260914
      CANARY_HUB_URL: https://nomadtips3-5usd-hub-343-stable-canary.mccarey-supon.workers.dev
      PROD_HUB_URL: https://nomadtips3-5usd-hub-343.mccarey-supon.workers.dev
      ENGINE_URL: https://nomadtips3-engine-343.mccarey-supon.workers.dev

    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nomad343-settlement-tail-20260914
          fetch-depth: 50

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify rollback point
        run: |
          set -euo pipefail
          git fetch origin "$ROLLBACK_REF" --depth=1
          test "$(git rev-parse origin/$ROLLBACK_REF)" = "e4122f0fd9f2a4f013cf331a93d77828e04797f9"

      - name: Apply isolated settlement patch
        run: |
          set -euo pipefail
          python .github/scripts/patch-343-settlement-tail.py
          node --check workers/nomadtips3-5usd-hub-343/src/index-v5.js
          node --check workers/nomadtips3-engine-343/src/index.js
          grep -Fq "nomad343-5usd-hub-v6-settlement-tail" workers/nomadtips3-5usd-hub-343/src/index-v5.js
          grep -Fq "status=scheduled&include=${include}" workers/nomadtips3-5usd-hub-343/src/index-v5.js
          grep -Fq "status=live&include=${include}" workers/nomadtips3-5usd-hub-343/src/index-v5.js
          grep -Fq "status=finished&include=events,stats" workers/nomadtips3-5usd-hub-343/src/index-v5.js
          grep -Fq "const MAX_PROVIDER_REQUESTS_PER_REFRESH=5;" workers/nomadtips3-5usd-hub-343/src/index-v5.js
          grep -Fq "hub.settlements||[]" workers/nomadtips3-engine-343/src/index.js
          grep -Fq "nomad343-engine-v5-settlement-tail" workers/nomadtips3-engine-343/src/index.js

      - name: Verify runtime scope and existing Engine tests
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | sort >/tmp/changed.txt
          printf '%s\n' \
            'workers/nomadtips3-5usd-hub-343/src/index-v5.js' \
            'workers/nomadtips3-engine-343/src/index.js' | sort >/tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          node --test workers/nomadtips3-engine-343/test/*.test.mjs
          git diff --quiet -- workers/nomadtips3-engine-343/src/market-core.js nomad-live-343 nomad-live-341 workers/nomadtips3-343-full-market workers/nomadtips3-343-full-market-central

      - name: Dry-run HUB Canary, HUB Production, Engine
        run: |
          set -euo pipefail
          (cd workers/nomadtips3-5usd-hub-343 && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.stable.toml)
          (cd workers/nomadtips3-5usd-hub-343 && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.toml)
          (cd workers/nomadtips3-engine-343 && npx --yes wrangler@4.92.0 deploy --dry-run)

      - name: Commit isolated runtime patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/nomadtips3-5usd-hub-343/src/index-v5.js workers/nomadtips3-engine-343/src/index.js
          git commit -m "fix(343): settle signals from recent finished fixtures"
          git push origin HEAD:work/nomad343-settlement-tail-20260914

      - name: Deploy Canary HUB
        working-directory: workers/nomadtips3-5usd-hub-343
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --config wrangler.stable.toml
          printf '%s' "$FIVEDOLLAR_API_KEY" | npx --yes wrangler@4.92.0 secret put FIVEDOLLAR_API_KEY --config wrangler.stable.toml

      - name: Verify Canary settlement side channel
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 8); do
            curl -fsS --max-time 40 "$CANARY_HUB_URL/snapshot?settle=$RANDOM$(date +%s)" -o /tmp/canary-hub.json || true
            if node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/canary-hub.json','utf8'));
          const good=j.ok===true && j.version==='nomad343-5usd-hub-v6-settlement-tail' && Array.isArray(j.fixtures) && Array.isArray(j.settlements) && Number(j.counts?.finished||0)===0 && Number(j.providerRequestCount||0)<=5 && j.settlementAgeMs!==null && Number(j.settlementRequests||0)>=1;
          console.log('CANARY SETTLEMENT',{good,fixtures:j.fixtureCount,counts:j.counts,settlementCount:j.settlementCount,settlementAgeMs:j.settlementAgeMs,settlementRequests:j.settlementRequests,requests:j.providerRequestCount,settlementError:j.settlementLastError});
          process.exit(good?0:1);
          NODE
            then ok=1; break; fi
            sleep 16
          done
          test "$ok" = 1

      - name: Verify active branch still at rollback before Production
        run: |
          set -euo pipefail
          git fetch origin "$ACTIVE_BRANCH" "$ROLLBACK_REF" --depth=1
          test "$(git rev-parse origin/$ACTIVE_BRANCH)" = "$(git rev-parse origin/$ROLLBACK_REF)" || { echo ACTIVE_BRANCH_MOVED_BEFORE_PROD; exit 1; }

      - name: Capture pre-fix pending signals and statistics
        run: |
          set -euo pipefail
          curl -fsS --max-time 40 "$ENGINE_URL/signals?pre=$RANDOM" -o /tmp/pre-signals.json
          curl -fsS --max-time 40 "$ENGINE_URL/statistics?pre=$RANDOM" -o /tmp/pre-statistics.json
          node - <<'NODE'
          const s=require('/tmp/pre-signals.json'), st=require('/tmp/pre-statistics.json');
          console.log('PRE_FIX',{pending:(s.signals||[]).length,allCount:s.allCount,settledRows:(st.rows||[]).length,bookmakers:[...new Set((st.rows||[]).map(x=>x.bookmaker||'Bet365'))]});
          NODE

      - name: Deploy Production HUB
        id: prod_hub
        working-directory: workers/nomadtips3-5usd-hub-343
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --config wrangler.toml
          printf '%s' "$FIVEDOLLAR_API_KEY" | npx --yes wrangler@4.92.0 secret put FIVEDOLLAR_API_KEY --config wrangler.toml

      - name: Verify Production HUB and compute recoverable pending set
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 8); do
            curl -fsS --max-time 40 "$PROD_HUB_URL/snapshot?settle=$RANDOM$(date +%s)" -o /tmp/prod-hub.json || true
            if node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/prod-hub.json','utf8'));
          const good=j.ok===true && j.version==='nomad343-5usd-hub-v6-settlement-tail' && Array.isArray(j.fixtures) && Array.isArray(j.settlements) && Number(j.counts?.finished||0)===0 && Number(j.providerRequestCount||0)<=5 && j.settlementAgeMs!==null;
          console.log('PROD HUB',{good,counts:j.counts,settlementCount:j.settlementCount,settlementAgeMs:j.settlementAgeMs,settlementRequests:j.settlementRequests,requests:j.providerRequestCount,settlementError:j.settlementLastError});
          process.exit(good?0:1);
          NODE
            then ok=1; break; fi
            sleep 16
          done
          test "$ok" = 1
          node - <<'NODE'
          const fs=require('fs');
          const pre=JSON.parse(fs.readFileSync('/tmp/pre-signals.json','utf8'));
          const hub=JSON.parse(fs.readFileSync('/tmp/prod-hub.json','utf8'));
          const terminal=new Set((hub.settlements||[]).map(x=>String(x.fixtureId)));
          const recoverable=(pre.signals||[]).filter(s=>terminal.has(String(s.fixtureId))).map(s=>({fixtureId:String(s.fixtureId),market:s.market,selection:s.selection,bookmaker:s.bookmaker,odds:s.odds,line:s.line}));
          fs.writeFileSync('/tmp/recoverable.json',JSON.stringify(recoverable,null,2));
          console.log('RECOVERABLE_PENDING',recoverable.length,recoverable.slice(0,20));
          NODE

      - name: Deploy Production Engine settlement merge
        id: prod_engine
        working-directory: workers/nomadtips3-engine-343
        run: npx --yes wrangler@4.92.0 deploy

      - name: Force scan and verify recovered statistics
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 20); do
            curl -fsS --max-time 40 "$ENGINE_URL/health?settle=$RANDOM$(date +%s)" -o /tmp/health.json || true
            if jq -e '.version == "nomad343-engine-v5-settlement-tail"' /tmp/health.json >/dev/null 2>&1; then ok=1; break; fi
            sleep 3
          done
          test "$ok" = 1
          curl -fsS -X POST --max-time 60 "$ENGINE_URL/scan?settle=$RANDOM" -o /tmp/scan.json
          sleep 2
          curl -fsS --max-time 40 "$ENGINE_URL/signals?post=$RANDOM" -o /tmp/post-signals.json
          curl -fsS --max-time 40 "$ENGINE_URL/statistics?post=$RANDOM" -o /tmp/post-statistics.json
          node - <<'NODE'
          const fs=require('fs');
          const preS=JSON.parse(fs.readFileSync('/tmp/pre-signals.json','utf8'));
          const preSt=JSON.parse(fs.readFileSync('/tmp/pre-statistics.json','utf8'));
          const postS=JSON.parse(fs.readFileSync('/tmp/post-signals.json','utf8'));
          const postSt=JSON.parse(fs.readFileSync('/tmp/post-statistics.json','utf8'));
          const rec=JSON.parse(fs.readFileSync('/tmp/recoverable.json','utf8'));
          const pendingAfter=new Set((postS.signals||[]).map(s=>`${s.fixtureId}:${s.market}:${s.selection}`));
          const rows=postSt.rows||[];
          const byKey=new Map(rows.map(s=>[`${s.fixtureId}:${s.market}:${s.selection}`,s]));
          let recovered=0;
          for(const x of rec){
            const key=`${x.fixtureId}:${x.market}:${x.selection}`;
            if(pendingAfter.has(key)) throw Error('RECOVERABLE_STILL_PENDING '+key);
            const row=byKey.get(key);
            if(!row) throw Error('RECOVERABLE_NOT_IN_STATISTICS '+key);
            if(String(row.bookmaker||'')!==String(x.bookmaker||'')) throw Error(`BOOKMAKER_CHANGED ${key} ${x.bookmaker} -> ${row.bookmaker}`);
            if(Number(row.odds)!==Number(x.odds)) throw Error(`ODDS_CHANGED ${key} ${x.odds} -> ${row.odds}`);
            recovered++;
          }
          if(rows.length < (preSt.rows||[]).length) throw Error('STATISTICS_ROW_COUNT_DECREASED');
          console.log('POST_FIX',{prePending:(preS.signals||[]).length,postPending:(postS.signals||[]).length,preSettled:(preSt.rows||[]).length,postSettled:rows.length,recoverable:rec.length,recovered,bookmakers:[...new Set(rows.map(x=>x.bookmaker||'Bet365'))]});
          NODE

      - name: Promote verified patch to active branch
        run: |
          set -euo pipefail
          git fetch origin "$ACTIVE_BRANCH" --depth=1
          git merge-base --is-ancestor "origin/$ACTIVE_BRANCH" HEAD || { echo ACTIVE_BRANCH_MOVED_OR_DIVERGED; exit 1; }
          git push origin HEAD:"$ACTIVE_BRANCH"

      - name: Roll back Production HUB and Engine on failure after deploy
        if: failure() && (steps.prod_hub.outcome == 'success' || steps.prod_engine.outcome == 'success')
        run: |
          set -euo pipefail
          git fetch origin "$ROLLBACK_REF" --depth=1
          git checkout --detach "origin/$ROLLBACK_REF"
          (cd workers/nomadtips3-5usd-hub-343 && npx --yes wrangler@4.92.0 deploy --config wrangler.toml)
          (cd workers/nomadtips3-engine-343 && npx --yes wrangler@4.92.0 deploy)
          echo "ROLLED_BACK_TO_$ROLLBACK_REF"
