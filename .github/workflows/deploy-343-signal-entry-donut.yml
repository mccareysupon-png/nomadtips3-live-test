name: Deploy 3.43 Signal Entry Donuts
on:
  push:
    branches:
      - work/nomad343-server-prewarm-20260914
    paths:
      - .github/workflows/deploy-343-signal-entry-donut.yml
      - .github/scripts/test-343-signal-entry-donut.js
jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CANARY_URL: https://nomadtips3-343-stable-preview.mccarey-supon.workers.dev
      PROD_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nomad343-server-prewarm-20260914
          fetch-depth: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify donut source and scope
        run: |
          set -euo pipefail
          node --check nomad-live-343/signal-entry-donut-343.js
          grep -Fq '343-entry-donut-v1' nomad-live-343/signal-entry-donut-343.js
          grep -Fq 'signal-entry-donut-343.css?v=343-entry-donut-v1' nomad-live-343/signal.html
          grep -Fq 'signal-entry-donut-343.js?v=343-entry-donut-v1' nomad-live-343/signal.html
          grep -Fq '#4ac378' nomad-live-343/signal-entry-donut-343.css
          grep -Fq '#cfbf51' nomad-live-343/signal-entry-donut-343.css
          git diff --quiet HEAD~7..HEAD -- workers/nomadtips3-engine-343 workers/nomadtips3-5usd-hub-343 workers/nomadtips3-343-full-market workers/nomadtips3-343-full-market-central nomad-live-341 nomad-live-343/index.html nomad-live-343/statistics.html || { echo UNEXPECTED_CORE_CHANGE; exit 1; }
      - name: Dry run viewers
        run: |
          set -euo pipefail
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.stable.jsonc)
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc)
      - name: Install browser test
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Deploy canary viewer
        run: |
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.stable.jsonc
      - name: Wait for canary donut assets
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            html="$(curl -fsS "$CANARY_URL/signal.html?asset=$RANDOM$(date +%s)" || true)"
            js="$(curl -fsS "$CANARY_URL/signal-entry-donut-343.js?asset=$RANDOM$(date +%s)" || true)"
            if grep -Fq '343-entry-donut-v1' <<<"$html" && grep -Fq '343-entry-donut-v1' <<<"$js"; then echo "CANARY ASSETS READY attempt=$i"; exit 0; fi
            sleep 2
          done
          echo CANARY_DONUT_ASSET_NOT_READY
          exit 1
      - name: Verify canary entry donuts
        run: TARGET_URL="$CANARY_URL" node .github/scripts/test-343-signal-entry-donut.js
      - name: Deploy production viewer
        run: |
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc
      - name: Wait for production donut assets
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            html="$(curl -fsS "$PROD_URL/signal.html?asset=$RANDOM$(date +%s)" || true)"
            js="$(curl -fsS "$PROD_URL/signal-entry-donut-343.js?asset=$RANDOM$(date +%s)" || true)"
            if grep -Fq '343-entry-donut-v1' <<<"$html" && grep -Fq '343-entry-donut-v1' <<<"$js"; then echo "PRODUCTION ASSETS READY attempt=$i"; exit 0; fi
            sleep 2
          done
          echo PRODUCTION_DONUT_ASSET_NOT_READY
          exit 1
      - name: Verify production entry donuts
        run: TARGET_URL="$PROD_URL" node .github/scripts/test-343-signal-entry-donut.js
