name: DIAG Ball46 V8 Rollback 20261012

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-ball46-v8-rollback-20261012.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-performance-chart-market-style-20261012
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts acorn@8
      - working-directory: deploy-assets/performance-chart-market-style-20261012
        run: |
          node --input-type=module <<'NODE'
          import {inspect,publicFile} from '../daily-performance-20261005/production.mjs';
          const cur=await inspect();
          const s=(await publicFile('/longterm-performance-343.js')).toString('utf8');
          console.log('ACTIVE='+cur.restore.version);
          console.log('V8='+s.includes('B46_DAILY_OHLC_CHART_V8_20261012'));
          console.log('V5='+s.includes('B46_UNIT_CHART_SELECTOR_V5_20261012'));
          NODE
