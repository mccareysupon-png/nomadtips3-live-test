name: Ball46 Signal Detail Watch Scout 20261003

on:
  push:
    branches: [work/ball46-signal-detail-watch-20261003]
    paths:
      - '.github/workflows/ball46-signal-detail-watch-scout-20261003.yml'

permissions:
  contents: read

concurrency:
  group: ball46-signal-detail-watch-scout
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect exact current Signal Detail render path (read only, pinpoint count writer)
        working-directory: deploy-assets/signal-detail-watch-20261003
        run: node scout.mjs
      - name: Retain scout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-signal-detail-watch-scout-${{ github.run_id }}
          path: deploy-assets/signal-detail-watch-20261003/audit/
          if-no-files-found: error
          retention-days: 14
