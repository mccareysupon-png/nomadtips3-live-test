name: Diagnose 3.43 Bulk Bookmakers

on:
  push:
    branches: [work/nomad343-stable-bulk-viewer-20260914]
    paths:
      - '.github/workflows/diag-343-bulk-bookmakers.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect live bulk and full-market payloads
        env:
          FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
        run: |
          node - <<'NODE'
          const key=process.env.FIVEDOLLAR_API_KEY;
          if(!key) throw new Error('missing key');
          const books='bet365,pinnacle,crown,1xbet,12bet,interwetten,macauslot,18bet,vcbet,easybets';
          async function get(url){const r=await fetch(url,{headers:{authorization:`Bearer ${key}`,accept:'application/json'}});const t=await r.text();let j={};try{j=JSON.parse(t)}catch{};return {r,j}}
          const base=await get('https://api.5dollarfootballapi.com/v1/fixtures?status=live&include=odds,events,stats&per_page=500');
          const rows=Array.isArray(base.j?.data)?base.j.data:Array.isArray(base.j?.data?.data)?base.j.data.data:[];
          const f=rows[0]||{};
          console.log('BULK HTTP',base.r.status,'FIXTURE',f.id||null,'ODDS_KEYS',f.odds&&typeof f.odds==='object'?Object.keys(f.odds):null,'BOOKMAKERS',Array.isArray(f.bookmakers)?f.bookmakers.length:0);
          if(!f.id) process.exit(0);
          const detail=await get(`https://api.5dollarfootballapi.com/v1/fixtures/${f.id}/odds?bookmakers=${encodeURIComponent(books)}`);
          console.log('DETAIL HTTP',detail.r.status,'RATE',detail.r.headers.get('x-ratelimit-remaining'));
          const d=detail.j?.data??detail.j;
          console.log('DETAIL_KEYS',d&&typeof d==='object'?Object.keys(d):null);
          const arr=Array.isArray(d?.bookmakers)?d.bookmakers:Array.isArray(d)?d:Array.isArray(d?.odds)?d.odds:[];
          console.log('DETAIL_BOOK_COUNT',arr.length);
          console.log('DETAIL_BOOKS',arr.map(x=>x?.slug||x?.name||x?.bookmaker?.slug||x?.bookmaker?.name).filter(Boolean));
          const one=arr[0]||{};
          console.log('DETAIL_FIRST_KEYS',Object.keys(one));
          console.log('DETAIL_FIRST_ODDS_KEYS',one.odds&&typeof one.odds==='object'?Object.keys(one.odds):one.markets&&typeof one.markets==='object'?Object.keys(one.markets):null);
          NODE
