name: NOMAD 3.42 OddStorm Referee Adapter

on:
  pull_request:
    paths:
      - 'workers/nomadtips3-live-engine-5dollar/src/index.js'
      - 'workers/nomadtips3-live-engine-5dollar/src/index-oddstorm.js'
      - 'workers/nomadtips3-live-engine-5dollar/src/oddstorm-referee.js'
      - 'workers/nomadtips3-live-engine-5dollar/test/**'
      - 'workers/nomadtips3-live-engine-5dollar/package.json'
      - 'workers/nomadtips3-live-engine-5dollar/wrangler.jsonc'
      - '.github/workflows/nomad342-oddstorm-referee-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'workers/nomadtips3-live-engine-5dollar/src/index.js'
      - 'workers/nomadtips3-live-engine-5dollar/src/index-oddstorm.js'
      - 'workers/nomadtips3-live-engine-5dollar/src/oddstorm-referee.js'
      - 'workers/nomadtips3-live-engine-5dollar/test/**'
      - 'workers/nomadtips3-live-engine-5dollar/package.json'
      - 'workers/nomadtips3-live-engine-5dollar/wrangler.jsonc'
      - '.github/workflows/nomad342-oddstorm-referee-deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-nomad342-oddstorm-referee
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and referee contract
        working-directory: workers/nomadtips3-live-engine-5dollar
        run: npm run build
      - name: Verify fail-open isolation contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const wrapper = fs.readFileSync('workers/nomadtips3-live-engine-5dollar/src/index-oddstorm.js','utf8');
          const referee = fs.readFileSync('workers/nomadtips3-live-engine-5dollar/src/oddstorm-referee.js','utf8');
          const wrangler = fs.readFileSync('workers/nomadtips3-live-engine-5dollar/wrangler.jsonc','utf8');
          assert(wrapper.includes("import baseWorker from './index.js'"), 'existing 5Dollar adapter must remain the base worker');
          assert(wrapper.includes("referee?.decision === 'REJECT'"), 'strong OddStorm disagreement must be able to reject');
          assert(referee.includes("failOpen: true"), 'OddStorm outage must be fail-open');
          for (const book of ['Unibet','Stake','Pinnacle','Ladbrokes','BWin','BetWay']) assert(referee.includes(`'${book}'`), `missing referee ${book}`);
          assert(referee.includes('ODDSTORM_HTTP_403') || referee.includes('response.status === 403'), '403 circuit breaker missing');
          assert(referee.includes('response.status === 429'), '429 circuit breaker missing');
          assert(wrangler.includes('src/index-oddstorm.js'), 'OddStorm wrapper must be the deployed entrypoint');
          console.log('OddStorm fail-open isolation contract PASS');
          NODE

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deploy isolated 5Dollar + OddStorm referee adapter
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.120.0
          command: deploy --config workers/nomadtips3-live-engine-5dollar/wrangler.jsonc
      - name: Verify deployed health contract
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://nomadtips3-live-engine-5dollar.mccarey-supon.workers.dev/health';
          let lastError = null;
          for (let attempt = 1; attempt <= 6; attempt += 1) {
            try {
              const response = await fetch(`${url}?verify=${Date.now()}`, { headers: { accept: 'application/json' } });
              const body = await response.json();
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              if (body?.service !== 'nomadtips3-s8-external') throw new Error('base 5Dollar service missing');
              if (body?.oddStormReferee?.mode !== 'fail-open') throw new Error('OddStorm fail-open health contract missing');
              const books = body?.oddStormReferee?.selectedBookmakers || [];
              if (books.length !== 6) throw new Error(`expected 6 OddStorm bookmakers, got ${books.length}`);
              console.log(JSON.stringify({ deployed: true, service: body.service, oddStormReferee: body.oddStormReferee }, null, 2));
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.log(`health verify attempt ${attempt} failed: ${error.message}`);
              if (attempt < 6) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          throw lastError || new Error('OddStorm referee deploy verification failed');
          NODE
