name: BALL46 John 5USD Worker inventory READ ONLY
on:
  push:
    branches: [audit/ball46-john-poller-20261027]
    paths:
      - 'deploy-assets/ball46-john-poller-20261027/audit.mjs'
      - 'deploy-assets/ball46-john-poller-20261027/analytics.mjs'
      - 'deploy-assets/ball46-john-poller-20261027/do-analytics.mjs'
      - 'deploy-assets/ball46-john-poller-20261027/dependency-audit.mjs'
      - 'deploy-assets/ball46-john-poller-20261027/all-rates.mjs'
      - 'deploy-assets/ball46-john-poller-20261027/legacy-dependencies.mjs'
      - 'deploy-assets/ball46-john-poller-20261027/live-health.mjs'
      - 'deploy-assets/ball46-john-poller-20261027/observability.mjs'
      - 'deploy-assets/ball46-john-poller-20261027/url-routes.mjs'
      - '.github/workflows/ball46-john-poller-20261027.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ball46-john-poller-readonly
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only Cloudflare Worker inventory (GET only)
        run: |
          node --check deploy-assets/ball46-john-poller-20261027/audit.mjs
          node deploy-assets/ball46-john-poller-20261027/audit.mjs
      - name: Read-only Worker Analytics (GraphQL query, no mutation)
        run: |
          node --check deploy-assets/ball46-john-poller-20261027/analytics.mjs
          node deploy-assets/ball46-john-poller-20261027/analytics.mjs

      - name: Read-only Durable Object alarm analytics
        run: |
          node --check deploy-assets/ball46-john-poller-20261027/do-analytics.mjs
          node deploy-assets/ball46-john-poller-20261027/do-analytics.mjs

      - name: Read-only active-version and dependency verification
        run: |
          node --check deploy-assets/ball46-john-poller-20261027/dependency-audit.mjs
          node deploy-assets/ball46-john-poller-20261027/dependency-audit.mjs

      - name: Read-only all-Worker aggregate rates
        run: |
          node --check deploy-assets/ball46-john-poller-20261027/all-rates.mjs
          node deploy-assets/ball46-john-poller-20261027/all-rates.mjs

      - name: Read-only legacy and member Worker dependency check
        run: |
          node --check deploy-assets/ball46-john-poller-20261027/legacy-dependencies.mjs
          node deploy-assets/ball46-john-poller-20261027/legacy-dependencies.mjs

      - name: Public read-only HUB and SHADOW health
        run: |
          node --check deploy-assets/ball46-john-poller-20261027/live-health.mjs
          node deploy-assets/ball46-john-poller-20261027/live-health.mjs

      - name: Read-only outbound observability events diagnostic
        run: |
          node --check deploy-assets/ball46-john-poller-20261027/observability.mjs
          node deploy-assets/ball46-john-poller-20261027/observability.mjs
      - name: Read-only route and worker subdomain inspection
        run: |
          node --check deploy-assets/ball46-john-poller-20261027/url-routes.mjs
          node deploy-assets/ball46-john-poller-20261027/url-routes.mjs
