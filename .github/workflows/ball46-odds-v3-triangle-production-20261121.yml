name: BALL46 Odds V3 filled-triangle guarded production deployment
on:
  push:
    branches: [release/ball46-odds-v3-triangle-20261121]
    paths:
      - '.github/workflows/ball46-odds-v3-triangle-production-20261121.yml'
      - 'deploy-assets/odds-v3-triangle-20261121/**'
permissions:
  contents: read
  statuses: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  guarded-triangle-release:
    if: github.ref == 'refs/heads/release/ball46-odds-v3-triangle-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source syntax and install guarded browser tools
        run: |
          node --check deploy-assets/odds-v3-triangle-20261121/deploy.mjs
          node --check deploy-assets/odds-v3-triangle-20261121/odds-movement.mjs
          node --check deploy-assets/odds-v3-triangle-20261121/odds-movement-baseline.mjs
          npm install --no-audit --no-fund acorn@8 playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Candidate version preview, guarded live cutover, browser smoke and rollback
        working-directory: deploy-assets/odds-v3-triangle-20261121
        run: node deploy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-v3-triangle-production-audit-${{ github.run_id }}
          path: deploy-assets/odds-v3-triangle-20261121/audit
          if-no-files-found: warn
          retention-days: 30
