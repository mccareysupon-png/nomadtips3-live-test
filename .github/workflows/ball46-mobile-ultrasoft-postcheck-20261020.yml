name: BALL46 Mobile Ultra Soft V3 Production Read Only Postcheck
on:
  push:
    branches: [codex/ball46-mobile-ultrasoft-eventflow-20261020]
    paths:
      - '.github/workflows/ball46-mobile-ultrasoft-postcheck-20261020.yml'
      - 'deploy-assets/mobile-ultrasoft-flow-20261020/verify.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed Worker and smartphone/desktop soft line rendering
        working-directory: deploy-assets/mobile-ultrasoft-flow-20261020
        run: |
          set -euo pipefail
          node --check verify.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
          node verify.mjs
      - name: Save read only visual verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-mobile-ultrasoft-eventflow-production-proof
          path: deploy-assets/mobile-ultrasoft-flow-20261020/audit/verification/
          retention-days: 30
          if-no-files-found: warn
