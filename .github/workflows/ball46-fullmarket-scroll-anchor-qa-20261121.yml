name: BALL46 Full Market V3 wheel containment and scroll anchor isolated QA
on:
  push:
    branches: [test/ball46-fullmarket-odds-v3-20261121]
    paths:
      - '.github/workflows/ball46-fullmarket-scroll-anchor-qa-20261121.yml'
      - 'qa/fullmarket-odds-v3-20261121/scroll-anchor-qa.mjs'
permissions: {contents: read}
jobs:
  scroll:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-audit --no-fund --no-save playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Native scroll containment and expanded Full Market no jump
        run: node qa/fullmarket-odds-v3-20261121/scroll-anchor-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b46-fullmarket-scroll-anchor-qa
          path: qa-fullmarket-scroll-anchor.png
          if-no-files-found: ignore