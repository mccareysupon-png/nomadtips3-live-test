name: NOMAD 3.41 Native 5USD Parity Probe

on:
  push:
    branches:
      - work/nomad341-5usd-native
    paths:
      - 'nomad-live-engine/scripts/fivedollar-parity-probe.mjs'
      - 'nomad-live-engine/src/fivedollar.js'
      - 'nomad-live-engine/src/fivedollar-identity.js'
      - '.github/workflows/nomad341-5usd-parity-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity-readonly-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: nomad-live-engine
    env:
      FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
      LEGACY_FEED_URL: https://nomadtips3-live-engine.mccarey-supon.workers.dev/feed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run read-only parity gate
        run: node scripts/fivedollar-parity-probe.mjs
