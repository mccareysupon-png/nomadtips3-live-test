name: Probe Real Member Worker Daily Feed 20261011
on:
  push:
    branches: [member/ledger-pending-repair-20261011]
    paths: ['.github/workflows/probe-member-worker-daily-20261011.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b6176e185cd98b5fe7958e719ce613b6fc307545
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute actual Member Worker with mock signed owner access and REAL upstream
        working-directory: ball46-member
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import worker from './src/worker.js';
          import {webcrypto} from 'node:crypto';
          const wc=webcrypto;
          const kp=await wc.subtle.generateKey({name:'RSASSA-PKCS1-v1_5',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['sign','verify']);
          const jwk=await wc.subtle.exportKey('jwk',kp.publicKey);
          jwk.kid='member-test';jwk.use='sig';jwk.alg='RS256';
          const b64=o=>Buffer.from(JSON.stringify(o)).toString('base64url');
          const now=Math.floor(Date.now()/1000);
          const head=b64({alg:'RS256',kid:'member-test'});
          const pay=b64({sub:'member-probe',email:'owner@probe.test',iss:'https://probe.cloudflareaccess.com',aud:['probe-audience'],iat:now-10,exp:now+3600});
          const data=head+'.'+pay;
          const sig=Buffer.from(await wc.subtle.sign('RSASSA-PKCS1-v1_5',kp.privateKey,new TextEncoder().encode(data))).toString('base64url');
          const original=globalThis.fetch;
          globalThis.fetch=async(resource,...args)=>{
            if(String(resource).includes('probe.cloudflareaccess.com/cdn-cgi/access/certs')){
              return new Response(JSON.stringify({keys:[jwk]}),{headers:{'content-type':'application/json'}});
            }
            return original(resource,...args);
          };
          const env={CF_ACCESS_TEAM_DOMAIN:'probe.cloudflareaccess.com',CF_ACCESS_AUD:'probe-audience',OWNER_CHECKOUT_EMAIL:'owner@probe.test'};
          const req=new Request('https://member.ball46.com/api/member/daily',{headers:{'Cf-Access-Jwt-Assertion':data+'.'+sig}});
          try{
            const start=Date.now();const resp=await worker.fetch(req,env,{});
            const obj=await resp.json();
            console.log('WORKER_PROBE',JSON.stringify({http:resp.status,ok:obj.ok,error:obj.error,detail:obj.detail,signalCount:obj.signalCount,pagesRead:obj.pagesRead,generatedAt:obj.generatedAt,summaryAll:obj.summary?.ALL,firstFive:obj.signals?.slice(0,5).map(r=>({hasId:!!r.id,fixtureId:r.fixtureId,status:r.status,result:r.result,createdAt:r.createdAt})),ms:Date.now()-start}));
            if(!resp.ok||!obj.ok||!Array.isArray(obj.signals)||!obj.signals.length)process.exitCode=1;
          }catch(e){console.error('WORKER_EXCEPTION',e.stack||e);process.exitCode=1}
          NODE
