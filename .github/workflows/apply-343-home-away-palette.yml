name: Apply 3.43 Home Away Palette

on:
  push:
    branches: [work/nomad343-server-prewarm-20260914]
    paths:
      - '.github/workflows/apply-343-home-away-palette.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CANARY_URL: https://nomadtips3-343-stable-preview.mccarey-supon.workers.dev
  PROD_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/nomad343-server-prewarm-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch unified team palette
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          HOME='#52d985'
          AWAY='#e6d45a'

          app=Path('nomad-live-343/app.css')
          s=app.read_text()
          marker='/* 343 HOME AWAY TEAM PALETTE V1 */'
          if marker not in s:
              s += f'''\n{marker}\n.visual-team-key span:first-child{{color:{HOME}!important}}\n.visual-team-key span:last-child{{color:{AWAY}!important}}\n.mirror-row .home i{{background:{HOME}!important}}\n.mirror-row .away i{{background:{AWAY}!important}}\n.event-line.home{{stroke:{HOME}!important}}\n.event-line.away{{stroke:{AWAY}!important}}\n.event-dot.home{{fill:{HOME}!important}}\n.event-dot.away{{fill:{AWAY}!important}}\n'''
          app.write_text(s)

          sig=Path('nomad-live-343/signal-compact-343.css')
          s=sig.read_text()
          marker='/* 343 SIGNAL HOME AWAY TEAM PALETTE V1 */'
          if marker not in s:
              s += f'''\n{marker}\n.signal-mirror-half.home i{{background:{HOME}!important}}\n.signal-mirror-half.away i{{background:{AWAY}!important}}\n'''
          sig.write_text(s)

          flow=Path('nomad-live-343/event-flow-343.css')
          s=flow.read_text()
          marker='/* 343 EVENT FLOW HOME AWAY TEAM PALETTE V1 */'
          if marker not in s:
              s += f'''\n{marker}\n.nomad-flow-legend .home i{{background:{HOME}!important;box-shadow:0 0 8px rgba(82,217,133,.45)!important}}\n.nomad-flow-legend .away i{{background:{AWAY}!important;box-shadow:0 0 8px rgba(230,212,90,.40)!important}}\n.nomad-flow-line.home{{stroke:{HOME}!important;filter:drop-shadow(0 1px 1.2px rgba(82,217,133,.38))!important}}\n.nomad-flow-line.away{{stroke:{AWAY}!important;filter:drop-shadow(0 1px 1.2px rgba(230,212,90,.34))!important}}\n.nomad-flow-end.home{{fill:{HOME}!important;stroke:#b8ffd0!important}}\n.nomad-flow-end.away{{fill:{AWAY}!important;stroke:#fff0a3!important}}\n'''
          flow.write_text(s)

          flowjs=Path('nomad-live-343/event-flow-343.js')
          s=flowjs.read_text()
          s=s.replace("const VERSION='343-flow-v4-standard-match-events';","const VERSION='343-flow-v5-team-palette';",1)
          s=s.replace('#e08d5f',AWAY)
          flowjs.write_text(s)

          for name in ['index.html','signal.html','statistics.html']:
              p=Path('nomad-live-343')/name
              h=p.read_text()
              h=re.sub(r'app\.css\?v=[^"\']+', 'app.css?v=343-team-palette-v1', h)
              h=re.sub(r'event-flow-343\.css\?v=[^"\']+', 'event-flow-343.css?v=343-flow-v5-team-palette', h)
              h=re.sub(r'event-flow-343\.js\?v=[^"\']+', 'event-flow-343.js?v=343-flow-v5-team-palette', h)
              if name in ['signal.html','statistics.html']:
                  h=re.sub(r'signal-compact-343\.css\?v=[^"\']+', 'signal-compact-343.css?v=343-team-palette-v1', h)
              p.write_text(h)
          PY
          node --check nomad-live-343/event-flow-343.js
          grep -Fq '343 HOME AWAY TEAM PALETTE V1' nomad-live-343/app.css
          grep -Fq '343 SIGNAL HOME AWAY TEAM PALETTE V1' nomad-live-343/signal-compact-343.css
          grep -Fq '343 EVENT FLOW HOME AWAY TEAM PALETTE V1' nomad-live-343/event-flow-343.css
          grep -Fq "343-flow-v5-team-palette" nomad-live-343/event-flow-343.js
          grep -Fq '#e6d45a' nomad-live-343/event-flow-343.js

      - name: Persist palette only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nomad-live-343/app.css nomad-live-343/signal-compact-343.css nomad-live-343/event-flow-343.css nomad-live-343/event-flow-343.js nomad-live-343/index.html nomad-live-343/signal.html nomad-live-343/statistics.html
          git commit -m 'style(343): standardize home green away yellow'
          git push origin HEAD:work/nomad343-server-prewarm-20260914

      - name: Guard exact scope
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD^ HEAD | sort)"
          expected="$(printf '%s\n' nomad-live-343/app.css nomad-live-343/event-flow-343.css nomad-live-343/event-flow-343.js nomad-live-343/index.html nomad-live-343/signal-compact-343.css nomad-live-343/signal.html nomad-live-343/statistics.html | sort)"
          [ "$changed" = "$expected" ] || { echo "UNEXPECTED_SCOPE: $changed"; exit 1; }
          git diff --quiet HEAD^ HEAD -- workers/nomadtips3-engine-343 workers/nomadtips3-5usd-hub-343 workers/nomadtips3-343-full-market workers/nomadtips3-343-full-market-central nomad-live-341

      - name: Dry run viewers
        run: |
          set -euo pipefail
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.stable.jsonc)
          (cd workers/nomadtips3-343-preview && npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc)

      - name: Deploy canary viewer
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.stable.jsonc

      - name: Wait for canary palette assets
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            app="$(curl -fsS "$CANARY_URL/app.css?x=$RANDOM$(date +%s)" || true)"
            flow="$(curl -fsS "$CANARY_URL/event-flow-343.js?x=$RANDOM$(date +%s)" || true)"
            if grep -Fq '343 HOME AWAY TEAM PALETTE V1' <<<"$app" && grep -Fq '343-flow-v5-team-palette' <<<"$flow"; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Verify palette on canary
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          TARGET_URL="$CANARY_URL" node - <<'NODE'
          const {chromium}=require('playwright');
          const rgb=s=>String(s).replace(/\s+/g,'');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1366,height:900}});
            let detailCalls=0;
            page.on('request',r=>{if(r.url().includes('/api/full-market/fixture-odds'))detailCalls++});

            await page.goto(process.env.TARGET_URL+'/?palette='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForFunction(()=>window.NOMAD_EVENT_FLOW_343?.version==='343-flow-v5-team-palette',{timeout:30000});
            const live=await page.evaluate(()=>{
              const host=document.createElement('div');
              host.innerHTML='<div class="mirror-row"><div></div><div class="mirror-half home"><i style="width:50%;background:red"></i></div><span>X</span><div class="mirror-half away"><i style="width:50%;background:blue"></i></div></div>';
              document.body.appendChild(host);
              const h=getComputedStyle(host.querySelector('.home i')).backgroundColor;
              const a=getComputedStyle(host.querySelector('.away i')).backgroundColor;
              const flow=document.createElement('section');flow.className='nomad-event-flow-card';flow.dataset.eventFlowFixture='palette';flow.dataset.home='H';flow.dataset.away='A';document.body.appendChild(flow);
              const now=Date.now(),rows=[];for(let m=1;m<=30;m+=5)rows.push({at:now+m*60000,minute:m,attacks:{home:m,away:m*.8},dangerousAttacks:{home:m*.5,away:m*.4},shotsOnTarget:{home:Math.floor(m/10),away:Math.floor(m/12)},shotsOffTarget:{home:Math.floor(m/8),away:Math.floor(m/9)},corners:{home:Math.floor(m/10),away:Math.floor(m/11)},possession:{home:54,away:46}});
              window.NOMAD_EVENT_FLOW_343.render(flow,{rows});
              const hs=getComputedStyle(flow.querySelector('.nomad-flow-line.home')).stroke;
              const as=getComputedStyle(flow.querySelector('.nomad-flow-line.away')).stroke;
              const awayStop=flow.querySelector('linearGradient[id^="flow-away-"] stop')?.getAttribute('stop-color');
              host.remove();flow.remove();return{h,a,hs,as,awayStop};
            });
            if(rgb(live.h)!=='rgb(82,217,133)'||rgb(live.a)!=='rgb(230,212,90)')throw Error('LIVE_BARS '+JSON.stringify(live));
            if(rgb(live.hs)!=='rgb(82,217,133)'||rgb(live.as)!=='rgb(230,212,90)'||String(live.awayStop).toLowerCase()!=='#e6d45a')throw Error('FLOW_COLORS '+JSON.stringify(live));

            for(const path of ['/signal.html','/statistics.html']){
              await page.goto(process.env.TARGET_URL+path+'?palette='+Date.now(),{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForFunction(()=>window.NOMAD_EVENT_FLOW_343?.version==='343-flow-v5-team-palette',{timeout:30000});
              const got=await page.evaluate(()=>{const h=document.createElement('div');h.innerHTML='<div class="signal-mirror-row"><div class="signal-mirror-half home"><i style="width:50%"></i></div><div class="signal-mirror-half away"><i style="width:50%"></i></div></div>';document.body.appendChild(h);const a=getComputedStyle(h.querySelector('.home i')).backgroundColor,b=getComputedStyle(h.querySelector('.away i')).backgroundColor;h.remove();return{home:a,away:b}});
              if(rgb(got.home)!=='rgb(82,217,133)'||rgb(got.away)!=='rgb(230,212,90)')throw Error(path+' '+JSON.stringify(got));
            }
            if(detailCalls!==0)throw Error('VIEWER_DETAIL_CALLS='+detailCalls);
            console.log('CANARY TEAM PALETTE OK',live,{detailCalls});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Deploy production viewer
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc

      - name: Verify production palette assets
        run: |
          set -euo pipefail
          for i in $(seq 1 15); do
            app="$(curl -fsS "$PROD_URL/app.css?x=$RANDOM$(date +%s)" || true)"
            sig="$(curl -fsS "$PROD_URL/signal-compact-343.css?x=$RANDOM$(date +%s)" || true)"
            flow="$(curl -fsS "$PROD_URL/event-flow-343.js?x=$RANDOM$(date +%s)" || true)"
            if grep -Fq '343 HOME AWAY TEAM PALETTE V1' <<<"$app" && grep -Fq '343 SIGNAL HOME AWAY TEAM PALETTE V1' <<<"$sig" && grep -Fq '343-flow-v5-team-palette' <<<"$flow"; then
              echo 'PRODUCTION TEAM PALETTE ASSETS OK'
              exit 0
            fi
            sleep 2
          done
          exit 1
