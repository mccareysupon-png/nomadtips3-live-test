name: ONE SHOT - Ball46 Hide Page Intro 20260927

on:
  push:
    branches: [ops/ball46-hide-page-intro-20260927]
    paths:
      - '.github/workflows/one-shot-ball46-hide-page-intro-20260927.yml'

permissions:
  contents: read

env:
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  GH_TOKEN: ${{ github.token }}
  EXPECTED_PRE_VERSION: 3e94c66c-49bb-4337-9540-1331be38be87
  PATH_SOURCE_SHA: 6276320261cdc10a3835b27e81850c3d4f17f126

jobs:
  hide-page-intro:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Capture exact current Production and lock it
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/b46-assets /tmp/b46-before /tmp/b46-after /tmp/b46-runtime /tmp/b46-backup
          mkdir -p /tmp/b46-assets /tmp/b46-runtime /tmp/b46-backup
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          hdr={'Authorization':f'Bearer {token}','Accept':'application/json'}
          dep=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/ball46-production/deployments'
          with urllib.request.urlopen(urllib.request.Request(dep,headers=hdr),timeout=30) as r: p=json.load(r)
          ds=(p.get('result') or {}).get('deployments') or []
          if not ds or not ds[0].get('versions'): raise SystemExit('NO_ACTIVE_DEPLOYMENT')
          vid=ds[0]['versions'][0]['version_id']
          expected=os.environ['EXPECTED_PRE_VERSION']
          print('ACTIVE_VERSION='+vid)
          if vid!=expected: raise SystemExit(f'PRODUCTION_MOVED:{vid}!={expected}')
          pathlib.Path('/tmp/pre-version.txt').write_text(vid)
          url=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/workers/ball46-production/versions/{vid}?include=modules'
          with urllib.request.urlopen(urllib.request.Request(url,headers=hdr),timeout=30) as r: vp=json.load(r)
          result=vp.get('result') or {}; mods=result.get('modules') or []
          if len(mods)!=1 or mods[0].get('name')!='index.js' or not mods[0].get('content_base64'): raise SystemExit('ACTIVE_RUNTIME_UNEXPECTED')
          runtime=base64.b64decode(mods[0]['content_base64'])
          pathlib.Path('/tmp/b46-runtime/index.js').write_bytes(runtime)
          pathlib.Path('/tmp/runtime-before.sha').write_text(hashlib.sha256(runtime).hexdigest())
          meta={k:result.get(k) for k in ['main_module','compatibility_date','bindings','assets','usage_model']}
          pathlib.Path('/tmp/runtime-meta-before.json').write_text(json.dumps(meta,sort_keys=True))
          expected_bindings={('ASSETS','assets','',''),('ENGINE','service','nomadtips3-engine-343','production'),('FULL_MARKET','service','nomadtips3-full-market-343-ball46','production'),('HUB','service','nomadtips3-5usd-hub-343','production')}
          got={(str(b.get('name') or ''),str(b.get('type') or ''),str(b.get('service') or ''),str(b.get('environment') or '')) for b in result.get('bindings') or []}
          if result.get('compatibility_date')!='2026-09-09' or got!=expected_bindings: raise SystemExit('ACTIVE_RUNTIME_METADATA_CHANGED')
          print('RUNTIME_SHA256='+hashlib.sha256(runtime).hexdigest())
          PY
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          sha=os.environ['PATH_SOURCE_SHA']
          req=urllib.request.Request(f'https://api.github.com/repos/mccareysupon-png/nomadtips3-live-test/git/trees/{sha}?recursive=1',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=30) as r: p=json.load(r)
          prefix='nomad-live-343/'
          paths=sorted(x['path'][len(prefix):] for x in p.get('tree',[]) if x.get('type')=='blob' and x.get('path','').startswith(prefix))
          if len(paths)!=69: raise SystemExit(f'PATH_COUNT_CHANGED:{len(paths)}')
          pathlib.Path('/tmp/asset-paths.txt').write_text('\n'.join(paths)+'\n')
          PY
          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            mkdir -p "/tmp/b46-assets/$(dirname "$rel")"
            code=$(curl -sS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 -H 'Cache-Control: no-cache' -o "/tmp/b46-assets/$rel" -w '%{http_code}' "$BALL46_WORKER/$rel?hide-intro-base=${GITHUB_RUN_ID}-$(date +%s%N)") || true
            [ "$code" = 200 ] || { echo "ASSET_FETCH_${code}:$rel"; exit 1; }
          done < /tmp/asset-paths.txt
          cp -a /tmp/b46-assets /tmp/b46-before
          cp /tmp/b46-runtime/index.js /tmp/b46-backup/index.js
          cp /tmp/pre-version.txt /tmp/runtime-before.sha /tmp/runtime-meta-before.json /tmp/asset-paths.txt /tmp/b46-backup/
          cp -a /tmp/b46-before /tmp/b46-backup/assets
          (cd /tmp/b46-before && while IFS= read -r rel; do sha256sum "$rel"; done < /tmp/asset-paths.txt) > /tmp/before.manifest
          cp /tmp/before.manifest /tmp/b46-backup/
          [ "$(sha256sum /tmp/b46-assets/v2-shared.css | awk '{print $1}')" = "8cb3141029ed8d4c3e8818665528a34241243ed1ac533614fd280b23c9efa065" ] || { echo V2_SHARED_BASE_MOVED; exit 1; }
          [ "$(sha256sum /tmp/b46-assets/index.html | awk '{print $1}')" = "17092c25cd52919a0db2160de14f4c80320a065a21e268b3042b021823ae7d7b" ] || { echo INDEX_BASE_MOVED; exit 1; }
          grep -Fq 'BALL46_LIVE_STABLE_DOM_20260927' /tmp/b46-assets/dashboard-v2-stage3.js
          grep -Fq 'class="dash-heading"' /tmp/b46-assets/index.html
          grep -Fq 'NOMAD LIVE 3.43 · WORKSPACE' /tmp/b46-assets/index.html
          grep -Fq 'class="next-page-head"' /tmp/b46-assets/signal.html
          grep -Fq 'class="next-page-head"' /tmp/b46-assets/statistics.html
          grep -Fq 'v2-shared.css' /tmp/b46-assets/index.html
          grep -Fq 'v2-shared.css' /tmp/b46-assets/signal.html
          grep -Fq 'v2-shared.css' /tmp/b46-assets/statistics.html
          echo EXACT_CURRENT_PRODUCTION_LOCKED

      - name: Save exact pre-change rollback package
        uses: actions/upload-artifact@v4
        with:
          name: ball46-pre-hide-page-intro-${{ github.run_id }}
          path: /tmp/b46-backup
          retention-days: 30

      - name: Hide only page intro headings in shared presentation CSS
        shell: bash
        run: |
          set -euo pipefail
          marker='BALL46_HIDE_PAGE_INTRO_20260927'
          ! grep -Fq "$marker" /tmp/b46-assets/v2-shared.css || { echo PATCH_ALREADY_PRESENT; exit 1; }
          cat >> /tmp/b46-assets/v2-shared.css <<'CSS'

          /* BALL46_HIDE_PAGE_INTRO_20260927 — presentation only; keep data/API/controls untouched */
          .dash-heading,
          .next-page-head{display:none!important}
          CSS
          grep -Fq 'BALL46_HIDE_PAGE_INTRO_20260927' /tmp/b46-assets/v2-shared.css
          grep -Fq '.next-page-head{display:none!important}' /tmp/b46-assets/v2-shared.css
          sha256sum /tmp/b46-assets/v2-shared.css | awk '{print $1}' > /tmp/css-after.sha
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          a=Path('/tmp/b46-before'); b=Path('/tmp/b46-assets'); changed=[]
          for rel in Path('/tmp/asset-paths.txt').read_text().splitlines():
              if hashlib.sha256((a/rel).read_bytes()).digest()!=hashlib.sha256((b/rel).read_bytes()).digest(): changed.append(rel)
          print('CHANGED_ASSETS=',changed)
          if changed!=['v2-shared.css']: raise SystemExit('UNEXPECTED_CHANGED_ASSETS:'+repr(changed))
          PY
          echo CSS_ONLY_DIFF_PASS

      - name: Dry run exact current runtime plus one CSS change
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/b46-runtime/wrangler.jsonc <<'EOF'
          {"name":"ball46-production","main":"./index.js","compatibility_date":"2026-09-09","no_bundle":true,"services":[{"binding":"ENGINE","service":"nomadtips3-engine-343","environment":"production"},{"binding":"FULL_MARKET","service":"nomadtips3-full-market-343-ball46","environment":"production"},{"binding":"HUB","service":"nomadtips3-5usd-hub-343","environment":"production"}],"assets":{"directory":"/tmp/b46-assets","binding":"ASSETS","html_handling":"none","not_found_handling":"none","run_worker_first":true},"triggers":{"crons":["* * * * *"]}}
          EOF
          cd /tmp/b46-runtime
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc

      - name: Final race guard before Production
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          a=os.environ['CLOUDFLARE_ACCOUNT_ID']; t=os.environ['CLOUDFLARE_API_TOKEN']; h={'Authorization':f'Bearer {t}','Accept':'application/json'}
          with urllib.request.urlopen(urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/scripts/ball46-production/deployments',headers=h),timeout=30) as r:p=json.load(r)
          cur=((p.get('result') or {}).get('deployments') or [])[0]['versions'][0]['version_id']; pre=open('/tmp/pre-version.txt').read().strip()
          print('RACE',cur,pre)
          if cur!=pre: raise SystemExit('PRODUCTION_MOVED')
          PY
          for f in v2-shared.css index.html dashboard-v2-stage3.js signal.html statistics.html; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 -H 'Cache-Control: no-cache' "$BALL46_WORKER/$f?hide-intro-race=${GITHUB_RUN_ID}-$(date +%s%N)" -o "/tmp/race-$f"
            [ "$(sha256sum "/tmp/race-$f" | awk '{print $1}')" = "$(sha256sum "/tmp/b46-before/$f" | awk '{print $1}')" ] || { echo "RACE_ASSET_MOVED:$f"; exit 1; }
          done
          echo FINAL_RACE_PASS

      - name: Deploy one CSS asset on exact current Production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/b46-runtime
          npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc | tee /tmp/deploy.log
          grep -Fq 'Uploaded ball46-production' /tmp/deploy.log
          echo DEPLOY_COMMAND_PASS

      - name: Verify exact runtime, CSS hide, all other assets unchanged, APIs healthy
        shell: bash
        run: |
          set -euo pipefail
          sleep 4
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          a=os.environ['CLOUDFLARE_ACCOUNT_ID']; t=os.environ['CLOUDFLARE_API_TOKEN']; h={'Authorization':f'Bearer {t}','Accept':'application/json'}
          dep=f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/scripts/ball46-production/deployments'
          with urllib.request.urlopen(urllib.request.Request(dep,headers=h),timeout=30) as r:p=json.load(r)
          vid=((p.get('result') or {}).get('deployments') or [])[0]['versions'][0]['version_id']; print('POST_VERSION='+vid)
          if vid==pathlib.Path('/tmp/pre-version.txt').read_text().strip(): raise SystemExit('VERSION_DID_NOT_ADVANCE')
          url=f'https://api.cloudflare.com/client/v4/accounts/{a}/workers/workers/ball46-production/versions/{vid}?include=modules'
          with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=30) as r:vp=json.load(r)
          result=vp.get('result') or {}; mods=result.get('modules') or []
          runtime=base64.b64decode(mods[0]['content_base64']); post=hashlib.sha256(runtime).hexdigest(); pre=pathlib.Path('/tmp/runtime-before.sha').read_text().strip()
          if post!=pre: raise SystemExit('RUNTIME_CHANGED')
          before=json.loads(pathlib.Path('/tmp/runtime-meta-before.json').read_text()); after={k:result.get(k) for k in ['main_module','compatibility_date','bindings','assets','usage_model']}
          if json.dumps(before,sort_keys=True)!=json.dumps(after,sort_keys=True): raise SystemExit('RUNTIME_META_CHANGED')
          PY
          csswant=$(cat /tmp/css-after.sha)
          good=0
          for i in $(seq 1 12); do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 -H 'Cache-Control: no-cache' "$BALL46_WORKER/v2-shared.css?hide-intro-after=${GITHUB_RUN_ID}-${i}-$(date +%s%N)" -o /tmp/live-css
            if [ "$(sha256sum /tmp/live-css | awk '{print $1}')" = "$csswant" ] && grep -Fq 'BALL46_HIDE_PAGE_INTRO_20260927' /tmp/live-css; then good=$((good+1)); [ "$good" -ge 2 ] && break; else good=0; fi
            sleep 2
          done
          [ "$good" -ge 2 ] || { echo CSS_NOT_STABLE; exit 1; }
          verified=0
          for pass in 1 2 3 4; do
            rm -rf /tmp/b46-after && mkdir -p /tmp/b46-after
            while IFS= read -r rel; do [ -n "$rel" ] || continue; mkdir -p "/tmp/b46-after/$(dirname "$rel")"; curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 -H 'Cache-Control: no-cache' "$BALL46_WORKER/$rel?hide-intro-verify=${GITHUB_RUN_ID}-${pass}-$(date +%s%N)" -o "/tmp/b46-after/$rel"; done < /tmp/asset-paths.txt
            if python3 - <<'PY'
          from pathlib import Path
          import hashlib
          pre=Path('/tmp/b46-before'); patch=Path('/tmp/b46-assets'); live=Path('/tmp/b46-after'); bad=[]
          for rel in Path('/tmp/asset-paths.txt').read_text().splitlines():
              got=hashlib.sha256((live/rel).read_bytes()).digest(); want=hashlib.sha256(((patch if rel=='v2-shared.css' else pre)/rel).read_bytes()).digest()
              if got!=want: bad.append(rel)
          print('ASSET_MISMATCH=',bad)
          raise SystemExit(0 if not bad else 1)
          PY
            then verified=1; break; fi
            sleep 2
          done
          [ "$verified" = 1 ] || { echo ALL_ASSET_VERIFY_FAILED; exit 1; }
          grep -Fq 'BALL46_LIVE_STABLE_DOM_20260927' /tmp/b46-after/dashboard-v2-stage3.js
          grep -Fq 'NOMAD LIVE 3.43 · WORKSPACE' /tmp/b46-after/index.html
          for ep in board signals statistics; do curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/$ep?hide-intro-api=${GITHUB_RUN_ID}" -o "/tmp/$ep.json"; done
          node - <<'NODE'
          const fs=require('fs');const b=JSON.parse(fs.readFileSync('/tmp/board.json')),s=JSON.parse(fs.readFileSync('/tmp/signals.json')),t=JSON.parse(fs.readFileSync('/tmp/statistics.json'));
          if(b?.ok!==true||!Array.isArray(b.fixtures)||!Array.isArray(s.signals)||t?.ok!==true||!Array.isArray(t.rows))process.exit(1);
          console.log('HIDE_PAGE_INTRO_OK',{fixtures:b.fixtures.length,signals:s.signals.length,settled:t.rows.length});
          NODE
          echo HIDE_PAGE_INTRO_DEPLOYMENT_VERIFIED

      - name: Restore exact pre-change package if verification fails
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'Verification failed after deploy; restoring exact captured pre-change package.'
          cp /tmp/b46-runtime/wrangler.jsonc /tmp/b46-runtime/wrangler.rollback.jsonc
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/b46-runtime/wrangler.rollback.jsonc')
          s=p.read_text().replace('"directory":"/tmp/b46-assets"','"directory":"/tmp/b46-before"')
          p.write_text(s)
          PY
          cd /tmp/b46-runtime
          npx --yes wrangler@4.92.0 deploy --config wrangler.rollback.jsonc | tee /tmp/rollback.log
          grep -Fq 'Uploaded ball46-production' /tmp/rollback.log
          old=$(sha256sum /tmp/b46-before/v2-shared.css | awk '{print $1}')
          ok=0
          for i in $(seq 1 12); do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 -H 'Cache-Control: no-cache' "$BALL46_WORKER/v2-shared.css?hide-intro-rollback=${GITHUB_RUN_ID}-${i}-$(date +%s%N)" -o /tmp/rollback-css
            if [ "$(sha256sum /tmp/rollback-css | awk '{print $1}')" = "$old" ]; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo ROLLBACK_VERIFY_FAILED; exit 1; }
          echo EXACT_PRE_CHANGE_PACKAGE_RESTORED
