name: BALL46 PreMatch Unified Statistics BTTS Total ROI Snapshot TEST stage 2 3
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-prematch-unified-statistics-stage23-deploy-20261122.yml]
permissions: {contents: read}
concurrency:
  group: ball46-premium-match-colors-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate common UI patch and immutable statistics registry
        run: |
          node --check qa/prematch-history-20261120/patch-prematch-unified-performance-test-20261122.mjs
          node --check qa/prematch-history-20261120/deploy-prematch-unified-performance-test-20261122.mjs
          node --test qa/prematch-history-20261120/patch-prematch-unified-performance.test.mjs qa/prematch-history-20261120/prematch-stats-registry-test.test.mjs qa/prematch-history-20261120/btts-pick-ledger-test.test.mjs
      - name: Deploy corrected same-theme BTTS/Total graph and ROI Snapshot in existing TEST UI only
        run: node qa/prematch-history-20261120/deploy-prematch-unified-performance-test-20261122.mjs
