name: Diagnose Ball46 Referee Conditions 20260926

on:
  push:
    branches:
      - diag/ball46-layout-click-20260926
    paths:
      - .github/workflows/diag-ball46-layout-click-20260926.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch current Production read-only
        run: |
          set -euo pipefail
          mkdir -p /tmp/ball46-referee
          for ep in board signals statistics; do
            echo "=== FETCH $ep ==="
            curl -fsS --retry 2 --max-time 30 "https://www.ball46.com/api/engine/$ep?diag=$(date +%s)" -o "/tmp/ball46-referee/$ep.json"
            echo "$ep bytes=$(wc -c < /tmp/ball46-referee/$ep.json)"
          done
          curl -fsS --retry 2 --max-time 30 "https://www.ball46.com/dashboard-v2-stage3.js?diag=$(date +%s)" -o /tmp/ball46-referee/dashboard.js || true
          echo "dashboard bytes=$(wc -c < /tmp/ball46-referee/dashboard.js 2>/dev/null || echo 0)"
      - name: Audit referee source condition and market fields
        run: |
          cat > /tmp/ball46-referee/audit.js <<'NODE'
          const fs=require('fs');
          const path='/tmp/ball46-referee';
          const keyRx=/(bookmaker|referee|judge|source|provider|vendor|market|status|stage|condition|reason|rule|signal|detect|candidate|valid|eligible|odds|price|confidence)/i;
          const whoRx=/(bookmaker|referee|judge|source|provider|vendor)/i;
          function load(n){try{return JSON.parse(fs.readFileSync(`${path}/${n}.json`,'utf8'))}catch(e){console.log('PARSE_FAIL',n,e.message);return null}}
          function scalar(v){return v==null||['string','number','boolean'].includes(typeof v)}
          function walk(v,p,out,objs){
            if(Array.isArray(v)){v.forEach((x,i)=>walk(x,`${p}[${i}]`,out,objs));return}
            if(!v||typeof v!=='object')return;
            const ks=Object.keys(v);
            const hit=ks.filter(k=>keyRx.test(k));
            if(hit.length){
              const row={path:p};
              for(const k of hit){ if(scalar(v[k])) row[k]=v[k]; }
              if(Object.keys(row).length>1) objs.push(row);
            }
            for(const [k,x] of Object.entries(v)){
              if(keyRx.test(k) && scalar(x)){
                const kk=k.toLowerCase();
                out[kk]??=new Map();
                const s=String(x).slice(0,180);
                out[kk].set(s,(out[kk].get(s)||0)+1);
              }
              walk(x,p?`${p}.${k}`:k,out,objs);
            }
          }
          for(const n of ['board','signals','statistics']){
            const d=load(n); if(!d)continue;
            console.log(`\n===== ${n.toUpperCase()} =====`);
            console.log('TOP_TYPE',Array.isArray(d)?'array':typeof d,'TOP_KEYS',d&&typeof d==='object'&&!Array.isArray(d)?Object.keys(d):[],'TOP_LEN',Array.isArray(d)?d.length:'');
            const out={},objs=[]; walk(d,'$',out,objs);
            console.log('--- UNIQUE/COUNT RELEVANT FIELDS ---');
            for(const [k,m] of Object.entries(out).sort()){
              const vals=[...m.entries()].sort((a,b)=>b[1]-a[1]);
              console.log(k,JSON.stringify(vals.slice(0,40)));
            }
            console.log('--- OBJECTS WITH REFEREE/SOURCE + CONDITIONS (first 120) ---');
            const relevant=objs.filter(o=>Object.keys(o).some(k=>whoRx.test(k)) || Object.keys(o).some(k=>/(condition|reason|rule|valid|eligible|detect|candidate|signal)/i.test(k)));
            relevant.slice(0,120).forEach(o=>console.log(JSON.stringify(o)));
          }
          const jsFile=`${path}/dashboard.js`;
          if(fs.existsSync(jsFile)){
            const js=fs.readFileSync(jsFile,'utf8');
            console.log('\n===== DASHBOARD CODE HITS =====');
            const rx=/(bookmaker|referee|judge|provider|source|Bet365|1xBet|Nowgoal|Pinnacle|market|signal|candidate|condition|validation|rule)/ig;
            let m,c=0;
            while((m=rx.exec(js))&&c<160){
              const a=Math.max(0,m.index-180),b=Math.min(js.length,m.index+360);
              console.log(`HIT ${++c} ${m[0]} @${m.index}:`,js.slice(a,b).replace(/\s+/g,' '));
              rx.lastIndex=Math.max(rx.lastIndex,m.index+1);
            }
          }
          NODE
          node /tmp/ball46-referee/audit.js | tee /tmp/ball46-referee/report.txt
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-referee-audit-${{ github.run_id }}
          path: /tmp/ball46-referee
          retention-days: 3
