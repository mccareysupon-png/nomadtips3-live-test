name: Diagnose Ball46 Horizontal Cards 20260926

on:
  push:
    branches:
      - diag/ball46-layout-click-20260926
    paths:
      - .github/workflows/diag-ball46-layout-click-20260926.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Inspect moving horizontal cards safely
        run: |
          cat > inspect.js <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000},deviceScaleFactor:1,ignoreHTTPSErrors:true});
            const r=await page.goto('https://www.ball46.com/index.html?diagcards='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            console.log('HTTP',r?.status(),page.url());
            await page.waitForTimeout(5000);
            const before=await page.evaluate(()=>[...document.querySelectorAll('*')].map((el,i)=>{
              const r=el.getBoundingClientRect(), c=getComputedStyle(el);
              return {i,tag:el.tagName,id:el.id||'',cls:typeof el.className==='string'?el.className:'',txt:(el.textContent||'').replace(/\s+/g,' ').trim().slice(0,160),x:+r.x.toFixed(1),y:+r.y.toFixed(1),w:+r.width.toFixed(1),h:+r.height.toFixed(1),display:c.display,visibility:c.visibility,overflowX:c.overflowX,whiteSpace:c.whiteSpace,position:c.position,transform:c.transform,animation:c.animationName};
            }).filter(x=>x.y<180&&x.y+x.h>0&&x.w>120&&x.h>12&&x.display!=='none'&&x.visibility!=='hidden'));
            console.log('===TOP_CANDIDATES===');
            before.forEach(x=>console.log(JSON.stringify(x)));
            await page.waitForTimeout(1200);
            const moving=await page.evaluate((before)=>[...document.querySelectorAll('*')].map((el,i)=>{
              const r=el.getBoundingClientRect(), c=getComputedStyle(el), b=before.find(x=>x.i===i);
              if(!b)return null;
              const dx=+(r.x-b.x).toFixed(1),dy=+(r.y-b.y).toFixed(1);
              if(Math.abs(dx)<0.5&&Math.abs(dy)<0.5&&c.animationName==='none'&&c.transform==='none')return null;
              return {i,tag:el.tagName,id:el.id||'',cls:typeof el.className==='string'?el.className:'',txt:(el.textContent||'').replace(/\s+/g,' ').trim().slice(0,160),x:+r.x.toFixed(1),y:+r.y.toFixed(1),w:+r.width.toFixed(1),h:+r.height.toFixed(1),dx,dy,transform:c.transform,animation:c.animationName};
            }).filter(Boolean),before);
            console.log('===MOVING_CANDIDATES===');
            moving.forEach(x=>console.log(JSON.stringify(x)));
            await page.screenshot({path:'/tmp/current.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node inspect.js
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-horizontal-card-diag-${{ github.run_id }}
          path: /tmp/current.png
          retention-days: 3
