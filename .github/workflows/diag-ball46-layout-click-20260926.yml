name: Diagnose Ball46 Layout Clicks 20260926

on:
  push:
    branches:
      - diag/ball46-layout-click-20260926
    paths:
      - .github/workflows/diag-ball46-layout-click-20260926.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Click current Ball46 views and measure layout
        run: |
          cat > diag-ball46.js <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000},deviceScaleFactor:1,ignoreHTTPSErrors:true});
            await page.addInitScript(()=>{
              window.__allLayoutShifts=[];
              new PerformanceObserver(list=>{for(const e of list.getEntries())window.__allLayoutShifts.push({value:e.value,hadRecentInput:e.hadRecentInput,time:e.startTime});}).observe({type:'layout-shift',buffered:true});
            });
            const response=await page.goto('https://www.ball46.com/index.html?layoutdiag='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            console.log('HTTP',response?.status(),page.url());
            await page.waitForTimeout(4500);
            fs.mkdirSync('/tmp/ball46-diag',{recursive:true});

            const snap=async(label)=>page.evaluate(label=>{
              const rectOf=sel=>{for(const el of document.querySelectorAll(sel)){const r=el.getBoundingClientRect(),c=getComputedStyle(el);if(r.width>1&&r.height>1&&c.display!=='none'&&c.visibility!=='hidden')return{x:+r.x.toFixed(1),y:+r.y.toFixed(1),w:+r.width.toFixed(1),h:+r.height.toFixed(1),sel};}return null};
              const shift=(window.__allLayoutShifts||[]);
              return {label,url:location.href,view:document.body.getAttribute('data-workspace-view'),
                header:rectOf('header'),sidebar:rectOf('aside'),workspace:rectOf('.workspace'),main:rectOf('main'),
                scorebar:rectOf('.ball46-scorebar10')||rectOf('.ball46-signal-scorebar')||rectOf('[class*="scorebar"]'),
                scrollWidth:document.documentElement.scrollWidth,shiftCount:shift.length,shiftSum:+shift.reduce((a,b)=>a+(b.value||0),0).toFixed(5)};
            },label);

            const targets=['All matches','Live','Signal','Upcoming','Waiting','Finished','Total','1X2','AH','O/U','BTTS','Corners','Cards','Other'];
            const report=[await snap('INITIAL')];
            await page.screenshot({path:'/tmp/ball46-diag/00-initial.png',fullPage:true});
            let idx=1;
            for(const name of targets){
              const loc=page.getByText(name,{exact:true});
              let clicked=false;
              for(let i=0;i<await loc.count();i++){
                const el=loc.nth(i);
                if(await el.isVisible().catch(()=>false)){
                  try{await el.click({timeout:8000,force:true});clicked=true;break;}catch(e){}
                }
              }
              if(!clicked){console.log('NOT_FOUND',name);continue;}
              await page.waitForTimeout(900);
              const s=await snap(name);report.push(s);
              console.log('SNAP',JSON.stringify(s));
              await page.screenshot({path:`/tmp/ball46-diag/${String(idx++).padStart(2,'0')}-${name.replace(/[^a-z0-9]+/gi,'_')}.png`,fullPage:true});
            }
            fs.writeFileSync('/tmp/ball46-diag/report.json',JSON.stringify(report,null,2));
            console.log('===LAYOUT_REPORT===');
            report.forEach(x=>console.log(JSON.stringify(x)));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node diag-ball46.js
      - name: Upload diagnostic screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-layout-click-report-${{ github.run_id }}
          path: /tmp/ball46-diag
          retention-days: 7
