name: Diagnose Ball46 Golden Checkpoint And Scorebar 20260926

on:
  push:
    branches:
      - diag/ball46-layout-click-20260926
    paths:
      - .github/workflows/diag-ball46-layout-click-20260926.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capture current production checkpoint read-only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ball46-golden/assets
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "captured_at=$TS" | tee /tmp/ball46-golden/manifest.txt
          curl -fsS --retry 2 --max-time 30 "https://www.ball46.com/?golden=$(date +%s)" -o /tmp/ball46-golden/index.html
          sha256sum /tmp/ball46-golden/index.html | tee -a /tmp/ball46-golden/manifest.txt
          python - <<'PY'
          import re, pathlib, urllib.parse, urllib.request, hashlib
          root='https://www.ball46.com/'
          html=pathlib.Path('/tmp/ball46-golden/index.html').read_text(errors='ignore')
          urls=[]
          for u in re.findall(r'''(?:src|href)=["']([^"']+)["']''',html,re.I):
              full=urllib.parse.urljoin(root,u)
              p=urllib.parse.urlparse(full)
              if p.netloc not in ('www.ball46.com','ball46.com'): continue
              if not p.path.lower().endswith(('.js','.css')): continue
              if full not in urls: urls.append(full)
          print('ASSET_COUNT',len(urls))
          out=pathlib.Path('/tmp/ball46-golden/assets')
          mf=pathlib.Path('/tmp/ball46-golden/manifest.txt')
          with mf.open('a') as m:
              for i,u in enumerate(urls):
                  try:
                      req=urllib.request.Request(u,headers={'User-Agent':'Ball46GoldenCheckpoint/1.0','Cache-Control':'no-cache'})
                      data=urllib.request.urlopen(req,timeout=25).read()
                      name=f'{i:03d}-'+pathlib.Path(urllib.parse.urlparse(u).path).name
                      (out/name).write_bytes(data)
                      h=hashlib.sha256(data).hexdigest()
                      m.write(f'{h} {len(data)} {u}\n')
                  except Exception as e:
                      m.write(f'FETCH_FAIL {u} {e}\n')
          PY
          for ep in board signals statistics; do
            curl -fsS --retry 2 --max-time 30 "https://www.ball46.com/api/engine/$ep?golden=$(date +%s)" -o "/tmp/ball46-golden/$ep.json"
            sha256sum "/tmp/ball46-golden/$ep.json" | tee -a /tmp/ball46-golden/manifest.txt
          done
          echo '=== CLOUDFLARE VERSIONS (read-only) ===' | tee /tmp/ball46-golden/cloudflare.txt
          npx --yes wrangler@4.92.0 versions list --config wrangler.ball46.jsonc 2>&1 | tee -a /tmp/ball46-golden/cloudflare.txt || true
          echo '=== CLOUDFLARE DEPLOYMENTS (read-only) ===' | tee -a /tmp/ball46-golden/cloudflare.txt
          npx --yes wrangler@4.92.0 deployments list --config wrangler.ball46.jsonc 2>&1 | tee -a /tmp/ball46-golden/cloudflare.txt || true

      - name: Diagnose scorebar click layout shift read-only
        run: |
          set -euo pipefail
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat > /tmp/scorebar-click.js <<'NODE'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const events=[];
            page.on('console',m=>events.push('CONSOLE '+m.type()+' '+m.text()));
            await page.goto('https://www.ball46.com/?diagClick='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(1500);
            const snapshot=async label=>page.evaluate((label)=>{
              const sels=['.workspace','.left-rail','.workspace-stage','.workspace-stable-head','.workspace-scorebar-slot','.workspace-scorebar-grid','.workspace-panel','.main-board'];
              const out={label,url:location.href,scrollX,scrollY,bodyClass:document.body.className,active:document.activeElement?.outerHTML?.slice(0,300)||''};
              for(const s of sels){const e=document.querySelector(s);if(!e){out[s]=null;continue}const r=e.getBoundingClientRect(),c=getComputedStyle(e);out[s]={x:r.x,y:r.y,w:r.width,h:r.height,display:c.display,overflowX:c.overflowX,transform:c.transform,pointerEvents:c.pointerEvents,transition:c.transition,animation:c.animation,cursor:c.cursor,class:e.className};}
              const grid=document.querySelector('.workspace-scorebar-grid');
              out.gridHtml=grid?.innerHTML?.slice(0,1500)||'';
              out.clickables=grid?[...grid.querySelectorAll('a,button,[role="button"],[onclick],[tabindex]')].slice(0,20).map(e=>({tag:e.tagName,cls:e.className,href:e.getAttribute('href'),role:e.getAttribute('role'),tabindex:e.getAttribute('tabindex'),text:e.textContent.trim().slice(0,100)})):[];
              return out;
            },label);
            const before=await snapshot('before');
            console.log('BEFORE',JSON.stringify(before));
            const grid=page.locator('.workspace-scorebar-grid');
            const target=grid.locator('a,button,[role="button"],[onclick],[tabindex]').first();
            let clicked='none';
            if(await target.count()){
              clicked=await target.evaluate(e=>({tag:e.tagName,cls:e.className,href:e.getAttribute('href'),text:e.textContent.trim().slice(0,120)}));
              await target.click({timeout:5000}).catch(async()=>{await grid.click({position:{x:40,y:25},timeout:5000}).catch(()=>{})});
            }else if(await grid.count()){
              clicked='grid';
              await grid.click({position:{x:40,y:25},timeout:5000}).catch(()=>{});
            }
            await page.waitForTimeout(1200);
            const after=await snapshot('after');
            console.log('CLICKED',JSON.stringify(clicked));
            console.log('AFTER',JSON.stringify(after));
            for(const s of ['.workspace','.left-rail','.workspace-stage','.workspace-stable-head','.workspace-scorebar-slot','.workspace-scorebar-grid','.workspace-panel','.main-board']){
              const a=before[s],b=after[s];if(!a||!b)continue;
              const d={dx:+(b.x-a.x).toFixed(2),dy:+(b.y-a.y).toFixed(2),dw:+(b.w-a.w).toFixed(2),dh:+(b.h-a.h).toFixed(2)};
              if(Object.values(d).some(x=>x!==0))console.log('SHIFT',s,JSON.stringify(d));
            }
            console.log('URL_CHANGE',before.url,'=>',after.url);
            console.log(events.join('\n'));
            await page.screenshot({path:'/tmp/ball46-golden/after-click.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/scorebar-click.js | tee /tmp/ball46-golden/scorebar-click.txt

      - name: Upload golden checkpoint diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-golden-checkpoint-${{ github.run_id }}
          path: /tmp/ball46-golden
          retention-days: 30
