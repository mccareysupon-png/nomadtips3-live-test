name: BALL46 native PreMatch O-U original TEST panel Adaptive actual prices deploy 20261124
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-adaptive-native-ou-price-ui-deploy-20261124.yml]
permissions: {contents: read}
concurrency:
  group: ball46-premium-match-colors-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check qa/prematch-history-20261120/patch-adaptive-research-native-ou-test.mjs
          node --check qa/prematch-history-20261120/b46-adaptive-native-ou-price-ui-deploy-20261124.mjs
          node --test qa/prematch-history-20261120/patch-adaptive-research-native-ou.test.mjs
      - run: node qa/prematch-history-20261120/b46-adaptive-native-ou-price-ui-deploy-20261124.mjs
