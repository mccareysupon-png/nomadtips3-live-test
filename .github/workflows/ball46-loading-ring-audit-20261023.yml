name: BALL46 Loading Ring READ ONLY production inspection 20261023
on:
  push:
    branches: [audit/ball46-loading-ring-fix-20261023]
    paths:
      - '.github/workflows/ball46-loading-ring-audit-20261023.yml'
      - 'deploy-assets/loading-ring-fix-20261023/inspect.mjs'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect actual Production active Worker and response
        run: |
          node --check deploy-assets/loading-ring-fix-20261023/inspect.mjs
          node deploy-assets/loading-ring-fix-20261023/inspect.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-loading-ring-inspection-${{ github.run_id }}
          path: deploy-assets/loading-ring-fix-20261023/audit/
          retention-days: 14
