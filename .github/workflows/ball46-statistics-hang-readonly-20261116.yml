name: BALL46 Statistics hang diagnostic READ ONLY
on:
  push:
    branches: [chatgpt/ball46-statistics-ui-v1]
    paths: ['.github/workflows/ball46-statistics-hang-readonly-20261116.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only stats API timing and response shape
        run: |
          set -u
          echo 'B46_READ_ONLY_NO_DEPLOY_NO_DATA_WRITE'
          for route in '/?view=statistics' '/longterm-performance-343.js' '/api/engine/statistics?paged=1&limit=1'; do
            echo "DIAG_REQUEST=$route"
            curl -sS --max-time 35 -L -o /tmp/b46response -w 'DIAG_HTTP=%{http_code} TTFB=%{time_starttransfer} TOTAL=%{time_total} BYTES=%{size_download} TYPE=%{content_type}\n' "https://ball46.com$route" || true
            if [[ "$route" == /api/engine/statistics* ]]; then
              node - /tmp/b46response <<'NODE'
          const fs=require('node:fs');
          try {
            const data=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
            const describe=(k,v)=>({key:k,type:Array.isArray(v)?'array':typeof v,count:Array.isArray(v)?v.length:undefined,keys:v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).slice(0,20):undefined});
            console.log('DIAG_API_SHAPE='+JSON.stringify({root:describe('root',data),fields:Object.entries(data).slice(0,18).map(([k,v])=>describe(k,v))}));
          }catch(e){console.log('DIAG_API_PARSE_ERROR='+e.message)}
          NODE
            fi
          done
      - name: Install Chromium
        run: |
          npm install --prefix /tmp/b46diag --no-audit --no-fund playwright@1.65.1
          /tmp/b46diag/node_modules/.bin/playwright install --with-deps chromium
      - name: Read-only browser diagnostics production versus staging
        run: |
          cat >/tmp/b46diag.cjs <<'NODE'
          const {chromium}=require('/tmp/b46diag/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const test of [
              {name:'PROD_PC',width:1366,url:'https://ball46.com/?view=statistics'},
              {name:'PROD_MOBILE',width:390,url:'https://ball46.com/?view=statistics'},
              {name:'STAGING_PC',width:1366,url:'https://ball46-chat-statistics-live-ui-test-20261115.mccarey-supon.workers.dev/?view=statistics'}
            ]){
              const context=await browser.newContext({viewport:{width:test.width,height:900},timezoneId:'Asia/Bangkok'});
              const page=await context.newPage(),events=[],errors=[],failed=[];
              page.on('response',r=>{const p=new URL(r.url()).pathname;if((p.includes('statistics')||p.includes('engine')||r.status()>=400)&&events.length<150)events.push({path:p,status:r.status()})});
              page.on('pageerror',e=>errors.push(e.message.slice(0,250)));
              page.on('requestfailed',r=>{if(failed.length<15)failed.push({path:new URL(r.url()).pathname,error:r.failure()?.errorText})});
              const start=Date.now();let entry='FAILED';
              try{const r=await page.goto(test.url,{waitUntil:'domcontentloaded',timeout:45000});entry=r?.status()||'null'}catch(e){entry=e.message.slice(0,150)}
              for(const seconds of [0,10,30,60]){
                const remaining=seconds*1000-(Date.now()-start);if(remaining>0)await page.waitForTimeout(remaining);
                const state=await page.evaluate(()=>{
                  const root=document.querySelector('#b46-finance-chart-card'),card=root?.querySelector('.f46-card'),svg=root?.querySelector('.f46-svg');
                  return {title:document.title,ready:document.readyState,chartRoot:!!root,cardVisible:!!card&&!!card.getClientRects().length,svgVisible:!!svg&&!!svg.getClientRects().length,rootText:root?.innerText?.slice(0,150)||null,domNodes:document.getElementsByTagName('*').length,heapMB:performance.memory?Math.round(performance.memory.usedJSHeapSize/1048576):null,resources:performance.getEntriesByType('resource').length,spinners:document.querySelectorAll('.spinner,.loading,[aria-busy="true"]').length}
                }).catch(e=>({error:e.message}));
                console.log('DIAG_BROWSER_SAMPLE='+JSON.stringify({test:test.name,seconds,elapsedMs:Date.now()-start,entry,state}));
              }
              await page.screenshot({path:'/tmp/b46diag-'+test.name+'.png',fullPage:false}).catch(()=>{});
              console.log('DIAG_BROWSER_NETWORK='+JSON.stringify({test:test.name,events:events.slice(-80),errors:errors.slice(0,10),failed}));
              await context.close();
            }
            await browser.close();
          })().catch(e=>{console.error('DIAG_FATAL='+String(e));process.exitCode=1});
          NODE
          node /tmp/b46diag.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b46-statistics-hang-readonly-20261116
          path: /tmp/b46diag-*.png
          retention-days: 7
          if-no-files-found: ignore
