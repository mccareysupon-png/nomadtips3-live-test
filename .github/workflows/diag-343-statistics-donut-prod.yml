name: Diagnose 3.43 Statistics Donut Production
on:
  push:
    branches:
      - work/nomad343-server-prewarm-20260914
    paths:
      - .github/workflows/diag-343-statistics-donut-prod.yml
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      PROD_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/nomad343-server-prewarm-20260914
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Diagnose production Statistics donut runtime
        run: TARGET_URL="$PROD_URL" node .github/scripts/diag-343-statistics-donut-prod.js
