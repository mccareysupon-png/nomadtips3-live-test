name: BALL46 native writer shape check
on:
  workflow_dispatch:
  push:
    branches: [stage/ball46-multisource-v5-20261017]
    paths: [.github/workflows/ball46-native-writer-shape-check.yml]
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect active worker read only
        env:
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node - <<'NODE'
          const u='https://api.cloudflare.com/client/v4/accounts/'+process.env.ACCOUNT+'/workers/scripts/nomadtips3-engine-343';
          fetch(u,{headers:{Authorization:'Bearer '+process.env.TOKEN}}).then(async r=>{
            const s=await r.text();
            const terms=['readWorkingSignals','writeWorkingSignals','upsertLedgerRows','reconcileExternalFinal','ledger-import','missing-final-direct-v1','LEDGER_V2_ONLY'];
            console.log('ACTIVE_WORKER_HTTP',r.status,'BYTES',s.length);
            for(const term of terms)console.log('SYMBOL_COUNT',term,s.split(term).length-1);
            if(!r.ok)process.exitCode=1;
          }).catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
