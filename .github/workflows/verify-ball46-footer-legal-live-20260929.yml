name: VERIFY Ball46 Footer Legal Live 20260929

on:
  push:
    branches: [ops/ball46-footer-legal-20260929]
    paths: ['.github/workflows/verify-ball46-footer-legal-live-20260929.yml']

permissions:
  contents: read

env:
  ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SCRIPT_NAME: ball46-production
  BALL46_URL: https://ball46.com

jobs:
  verify-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify current live footer legal and protected backend identities
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $API_TOKEN"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$SCRIPT_NAME/deployments?per_page=5" -H "$AUTH" -o /tmp/deployments.json
          node - <<'NODE'
          const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));if(j.success!==true)throw Error('DEPLOYMENTS_FAILED');const d=j.result?.deployments?.[0];if(!d)throw Error('NO_ACTIVE_DEPLOYMENT');console.log('CURRENT_DEPLOYMENT',JSON.stringify({id:d.id,created_on:d.created_on,source:d.source,versions:d.versions}));
          NODE
          nonce="${GITHUB_RUN_ID}-$(date +%s%N)"
          for f in index signal statistics; do
            code=$(curl -sS -L --max-time 25 -o "/tmp/$f.html" -w '%{http_code}' "$BALL46_URL/$f.html?verify=$nonce")
            [ "$code" = 200 ]
            grep -Fq 'b46-site-footer-v1' "/tmp/$f.html"
            grep -Fq '/ball46-footer.css?v=20260929' "/tmp/$f.html"
            echo "CORE_FOOTER_PASS:$f"
          done
          for p in information about user-guide methodology privacy terms disclaimer affiliate-disclosure responsible-gambling cookies contact; do
            code=$(curl -sS -L --max-time 25 -o "/tmp/$p.html" -w '%{http_code}' "$BALL46_URL/$p.html?verify=$nonce")
            [ "$code" = 200 ]
            grep -Fq 'ball46.com' "/tmp/$p.html"
            ! grep -qiE 'nomadtips3|manualprototype|preview|standalone|owner review' "/tmp/$p.html"
            echo "LEGAL_LIVE_PASS:$p"
          done
          grep -Fq 'jay@ball46.com' /tmp/contact.html
          code=$(curl -sS -L --max-time 25 -o /tmp/footer.css -w '%{http_code}' "$BALL46_URL/ball46-footer.css?verify=$nonce")
          [ "$code" = 200 ]
          grep -Fq '#b46-site-footer-v1' /tmp/footer.css
          curl -fsS --max-time 25 "$BALL46_URL/api/engine/health?verify=$nonce" -o /tmp/e.json
          curl -fsS --max-time 25 "$BALL46_URL/api/full-market/health?verify=$nonce" -o /tmp/f.json
          curl -fsS --max-time 25 "$BALL46_URL/api/engine/statistics?verify=$nonce" -o /tmp/s.json
          node - <<'NODE'
          const fs=require('fs');const e=JSON.parse(fs.readFileSync('/tmp/e.json'));const f=JSON.parse(fs.readFileSync('/tmp/f.json'));const s=JSON.parse(fs.readFileSync('/tmp/s.json'));if(e.ok!==true||f.ok!==true||s.ok!==true)throw Error('BACKEND_NOT_OK');if(e.version!=='nomad343-engine-v5-best19-referee')throw Error('ENGINE_CHANGED:'+e.version);if(f.version!=='nomad343-ball46-full-market-v6-server-prewarm-cache')throw Error('FULL_MARKET_CHANGED:'+f.version);if(s.settlementRevision!=='bet365-rules-v2')throw Error('SETTLEMENT_CHANGED:'+s.settlementRevision);console.log('LIVE_BACKEND_PASS',JSON.stringify({engine:e.version,fullMarket:f.version,settlement:s.settlementRevision}));
          NODE
