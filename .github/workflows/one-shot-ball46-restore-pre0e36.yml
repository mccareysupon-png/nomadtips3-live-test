name: ONE SHOT - Ball46 Restore Pre0e36
on:
  push:
    branches: [work/ball46-row-balance-livebase-20260927]
    paths: ['.github/workflows/one-shot-ball46-restore-pre0e36.yml']
permissions:
  contents: read
  actions: read
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WWW: https://www.ball46.com
      WORKER: https://ball46-production.mccarey-supon.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6276320261cdc10a3835b27e81850c3d4f17f126
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ball46-livebase-v2-36291401917
          path: /tmp/livebase
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36291401917
      - name: Verify exact snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < /tmp/livebase/current-assets.sha256 | tr -d ' ')" = 69
          (cd /tmp/livebase/current-assets && sha256sum -c /tmp/livebase/current-assets.sha256)
          grep -Fq 'd6385dcc5d9c6123a8a16f6c574287804baca177b004cdca4315b7cb9dc2305a  index.html' /tmp/livebase/current-assets.sha256
          grep -Fq '2ef44e4c4bd1f0837525444d7b28ab8ab9aa77cf4e03fac33ea69e536b12cb85  dashboard-v2-stage3.js' /tmp/livebase/current-assets.sha256
          grep -Fq '54ca6c53ad6f6f7836e61efd8180030c74ea2827a42c180153c0fc15005e431d  dashboard-v2-tune.css' /tmp/livebase/current-assets.sha256
      - name: Build exact pre0e36 package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf nomad-live-343
          mkdir -p nomad-live-343
          cp -a /tmp/livebase/current-assets/. nomad-live-343/
          (cd nomad-live-343 && sha256sum -c /tmp/livebase/current-assets.sha256)
          node --check nomad-live-343/dashboard-v2-stage3.js
      - name: Dry run
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc
      - name: Deploy exact package
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc | tee /tmp/deploy.log
          grep -Eq 'Uploaded ball46-production|Current Version ID:' /tmp/deploy.log
      - name: Verify exact public assets and backend
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          for base in "$WORKER" "$WWW"; do
            bad=0
            while read -r expected name; do
              out="/tmp/v-${name//\//_}"
              curl -fsS -L --retry 4 --retry-all-errors --max-time 30 -H 'Cache-Control: no-cache' "$base/$name?restore=${GITHUB_RUN_ID}-$(date +%s%N)" -o "$out"
              actual=$(sha256sum "$out" | awk '{print $1}')
              if [ "$actual" != "$expected" ]; then echo "MISMATCH $base $name"; bad=$((bad+1)); fi
            done < /tmp/livebase/current-assets.sha256
            test "$bad" = 0
            echo "EXACT69_OK $base"
          done
          for ep in health board signals statistics; do curl -fsS -L --retry 4 --retry-all-errors --max-time 30 "$WWW/api/engine/$ep?restore=${GITHUB_RUN_ID}" -o "/tmp/$ep.json"; done
          node - <<'NODE'
          const fs=require('fs');const h=JSON.parse(fs.readFileSync('/tmp/health.json'));const b=JSON.parse(fs.readFileSync('/tmp/board.json'));const s=JSON.parse(fs.readFileSync('/tmp/signals.json'));const t=JSON.parse(fs.readFileSync('/tmp/statistics.json'));if(h?.ok!==true||b?.ok!==true||!Array.isArray(b.fixtures)||!Array.isArray(s.signals)||t?.ok!==true||!Array.isArray(t.rows))process.exit(1);console.log('BACKEND_OK',b.fixtures.length,s.signals.length,t.rows.length)
          NODE
      - name: Verify LIVE renders odds
        shell: bash
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$chrome" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000 --dump-dom "$WWW/index.html?status=live&check=${GITHUB_RUN_ID}" >/tmp/dom.html 2>/tmp/chrome.log
          grep -Fq 'class="market-prices' /tmp/dom.html
          python3 - <<'PY'
          import re
          d=open('/tmp/dom.html').read();n=len(re.findall(r'<strong>\s*[0-9]+(?:\.[0-9]+)?\s*</strong>',d));print('NUMERIC_ODDS',n);raise SystemExit(0 if n>0 else 1)
          PY
          echo PRE0E36_RESTORE_VERIFIED
