name: BALL46 Statistics Leagues Navigation Fix V9
on:
  push:
    branches: [fix/ball46-stats-leagues-nav-20261021]
    paths:
      - '.github/workflows/ball46-stats-leagues-nav-v9-deploy.yml'
      - 'deploy-assets/stats-leagues-20261021/league-nav-patch.mjs'
      - 'deploy-assets/stats-leagues-20261021/deploy-nav-v9.mjs'
permissions: {contents: read}
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check JS syntax and browser dependencies
        working-directory: deploy-assets/stats-leagues-20261021
        run: |
          set -euo pipefail
          node --check league-nav-patch.mjs
          node --check deploy-nav-v9.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Guard V8, verify real league clicks and original mobile navigation, deploy only if safe
        working-directory: deploy-assets/stats-leagues-20261021
        run: node deploy-nav-v9.mjs
      - name: Keep before, candidate, Production screenshots and rollback report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-stats-leagues-navigation-v9-proof
          path: deploy-assets/stats-leagues-20261021/proof/
          retention-days: 20
          if-no-files-found: warn