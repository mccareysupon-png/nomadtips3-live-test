name: BALL46 verify shadow isolated from production read-only
on:
  workflow_dispatch:
  push:
    branches:
      - stage/ball46-multisource-v5-20261017
    paths:
      - workers/ball46-result-sidecar/verify-shadow-release-readonly.mjs
      - .github/workflows/ball46-shadow-versus-engine-readonly.yml
permissions:
  contents: read
jobs:
  verify-both-with-GET:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check two distinct current deployment IDs without modifying either
        run: node workers/ball46-result-sidecar/verify-shadow-release-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-shadow-vs-engine-deployments
          path: shadow-vs-engine-readonly.json
          retention-days: 7
          if-no-files-found: warn
