name: BALL46 membership visual test only
on:
  push:
    branches: [test/ball46-membership-visual-v2-20261120]
    paths: ['.github/workflows/membership-visual-v2-test-20261120.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy isolated test only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --check qa/membership-visual-v2-20261120/worker.mjs
          cat > qa/membership-visual-v2-20261120/wrangler.toml <<'EOF'
          name = "ball46-membership-visual-v2-test-20261120"
          main = "worker.mjs"
          compatibility_date = "2026-11-20"
          workers_dev = true
          preview_urls = false
          [[services]]
          binding = "B46_PRODUCTION_READ"
          service = "ball46-production"
          EOF
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';import {writeFile} from 'node:fs/promises';
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/ball46-production/deployments?per_page=1',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});const j=await r.json();assert(j.success);await writeFile(process.env.RUNNER_TEMP+'/prod-before.json',JSON.stringify(j.result.deployments[0].versions));
          EOF
          for attempt in 1 2 3; do
            if npx --yes wrangler@4.50.0 deploy --config qa/membership-visual-v2-20261120/wrangler.toml --name ball46-membership-visual-v2-test-20261120; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Verify mobile card alignment and desktop unchanged
        run: |
          npm install --prefix qa/membership-visual-v2-20261120/.runtime --no-audit --no-fund playwright@1.55.0
          qa/membership-visual-v2-20261120/.runtime/node_modules/.bin/playwright install chromium --only-shell
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';import {createRequire} from 'node:module';
          const {chromium,devices}=createRequire(process.cwd()+'/qa/membership-visual-v2-20261120/.runtime/package.json')('playwright');
          const base='https://ball46-membership-visual-v2-test-20261120.mccarey-supon.workers.dev';
          let health;for(let i=0;i<15;i++){try{const r=await fetch(base+'/_membership_visual_health');if(r.ok){health=await r.json();break}}catch{}await new Promise(r=>setTimeout(r,2000))}
          assert.equal(health?.scope,'TEST_ONLY_MEMBERSHIP_VISUAL');assert.equal(health?.revision,'MEMBERSHIP_MOBILE_ALIGN_V15');assert.equal((await fetch(base+'/_membership_visual_health',{method:'POST'})).status,405);
          const browser=await chromium.launch();try{
          const prod='https://ball46.com';
          for(const [width,height,theme] of [[320,720,'dark'],[360,800,'light'],[390,844,'dark'],[390,844,'light'],[430,932,'dark'],[430,932,'light'],[1440,950,'dark'],[1440,950,'light']]){
            const mobile=width<=760,mode=width+'-'+theme;
            const context=mobile?{...devices['iPhone 13'],viewport:{width,height},screen:{width,height},serviceWorkers:'block'}:{viewport:{width,height},serviceWorkers:'block'};
            const measure=async(host)=>{const p=await browser.newPage(context);try{
              await p.addInitScript(t=>localStorage.setItem('nomad343_dashboard_theme_v1',t),theme);
              await p.route('**/*',r=>['GET','HEAD'].includes(r.request().method())?r.continue():r.abort());
              await p.goto(host+'/index.html?view=statistics',{waitUntil:'domcontentloaded',timeout:60000});
              const link=mobile?'.b46-exact-mobile>a':'.b46-stat-member-top>a.b46-exact-link';
              await p.locator(link).waitFor({state:'visible',timeout:30000});
              await p.waitForFunction(()=>document.querySelector('#b46-finance-chart-card')?.getBoundingClientRect().height>200,null,{timeout:60000});
              if(mobile)await p.locator(link+' img').evaluate(e=>e.decode());
              const result=await p.evaluate(({link,mobile})=>{const panel=document.querySelector('[data-workspace-panel="statistics"]');const rect=e=>{if(!e)return null;const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {x:r.x,right:r.right,w:r.width,h:r.height,y:r.y,radius:s.borderRadius,border:s.borderTopWidth,shadow:s.boxShadow,display:s.display,position:s.position,margin:s.margin}};return {theme:document.documentElement.dataset.theme,viewport:innerWidth,docWidth:document.documentElement.scrollWidth,marker:!!document.querySelector('#b46-mobile-stat-card-align-v15'),baseMarkers:document.querySelectorAll('#b46-membership-label-v12').length,panel:rect(panel),banner:rect(panel.querySelector(link)),head:rect(panel.querySelector('.workspace-view-head')),graph:rect(panel.querySelector('#b46-finance-chart-card')),graphInner:rect(panel.querySelector('.f46-card')),results:rect(panel.querySelector('.sp-results')),hiddenHistory:[...panel.querySelectorAll('button.b46-fast-details')].every(e=>getComputedStyle(e).display==='none'),image:mobile?panel.querySelector(link+' img')?.getAttribute('src'):null,href:panel.querySelector(link)?.href,groups:[...panel.querySelectorAll('[class*="summary"],[class*="stats"],[class*="metric"]')].filter(e=>{let r=e.getBoundingClientRect();return r.width>=innerWidth*.7&&r.height>15&&r.height<400}).slice(0,12).map(e=>({class:e.className,...rect(e)}))}},{link,mobile});
              if(host===base&&mobile){const shot=await p.screenshot({type:'jpeg',quality:65});console.log('MOBILE_ALIGN_PREVIEW '+mode+' '+shot.toString('base64'))}
              return result;
            }finally{await p.close()}};
            const old=await measure(prod),now=await measure(base);
            console.log('ALIGN_PROOF '+JSON.stringify({mode,old,now}));
            assert.equal(now.marker,true);assert.equal(now.baseMarkers,1);assert.equal(now.theme,theme);assert.equal(now.href,old.href);assert(now.hiddenHistory);
            if(mobile){
              assert(now.head&&now.graph&&now.banner,'MISSING_CARD');
              for(const item of [now.head,now.banner]){assert(Math.abs(item.x-now.graph.x)<=1&&Math.abs(item.right-now.graph.right)<=1,'MOBILE_EDGES '+JSON.stringify({mode,item,graph:now.graph}));assert.equal(item.radius,'11px')}
              assert.equal(now.banner.border,'0px');assert.equal(now.image,old.image);assert(Math.abs(now.banner.h-now.banner.w*185/785)<1);assert(now.docWidth<=now.viewport+1,'HORIZONTAL_OVERFLOW');
              assert(Math.abs(now.graph.w-old.graph.w)<=1&&Math.abs(now.graph.x-old.graph.x)<=1,'GRAPH_CHANGED');
            }else{
              for(const k of ['banner','graph']){assert(Math.abs(now[k].x-old[k].x)<1&&Math.abs(now[k].w-old[k].w)<1&&(k!=='banner'||Math.abs(now[k].h-old[k].h)<1),'PC_CHANGED '+k);assert.equal(now[k].radius,old[k].radius)}
              assert.equal(now.banner.position,old.banner.position);
            }
            console.log('ALIGN_PASS '+mode);
          }
          }finally{await browser.close()}
          EOF
      - name: Confirm Production unchanged
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';import {readFile} from 'node:fs/promises';
          const before=await readFile(process.env.RUNNER_TEMP+'/prod-before.json','utf8');const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/ball46-production/deployments?per_page=1',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});const j=await r.json();assert(j.success);assert.deepEqual(j.result.deployments[0].versions,JSON.parse(before));console.log('PRODUCTION_UNCHANGED')
          EOF
