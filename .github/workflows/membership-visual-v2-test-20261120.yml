name: BALL46 membership visual test only
on:
  push:
    branches: [test/ball46-membership-visual-v2-20261120]
    paths: ['.github/workflows/membership-visual-v2-test-20261120.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy isolated test only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from PIL import Image
          from pathlib import Path
          import base64, hashlib, io, json
          p=Path('qa/membership-visual-v2-20261120')
          raw=base64.b64decode(''.join(f.read_text() for f in sorted(p.glob('source-*.b64'))))
          assert hashlib.sha256(raw).hexdigest()=='9d8d2fb96812a12584f5ec7efca28ba296981005166fc4862dc272bf47bc8e97'
          im=Image.open(io.BytesIO(raw)).convert('RGB')
          assert im.size==(2048,682)
          assets={}
          def encode(name,box):
              crop=im.crop(box)
              f=io.BytesIO(); crop.save(f,'WEBP',quality=88,method=6)
              data=f.getvalue()
              assets[name+'.webp']=base64.b64encode(data).decode()
              print('ASSET',name,crop.size,len(data))
          for theme,y0,y1 in [('dark',78,223),('light',269,419)]:
              encode(theme,(48,y0,2000,y1))
              encode(theme+'-left',(48,y0,1050,y1))
              encode(theme+'-right',(1110,y0,2000,y1))
          encode('person-dark',(1430,80,1718,222))
          encode('person-light',(1430,270,1718,418))
          (p/'assets.mjs').write_text('export default '+json.dumps(assets,separators=(',',':'))+';\n')
          PY
          node --check qa/membership-visual-v2-20261120/worker.mjs
          cat > qa/membership-visual-v2-20261120/wrangler.toml <<'EOF'
          name = "ball46-membership-visual-v2-test-20261120"
          main = "worker.mjs"
          compatibility_date = "2026-11-20"
          workers_dev = true
          preview_urls = false
          [[services]]
          binding = "B46_PRODUCTION_READ"
          service = "ball46-production"
          EOF
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';import {writeFile} from 'node:fs/promises';
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/ball46-production/deployments?per_page=1',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});const j=await r.json();assert(j.success);await writeFile(process.env.RUNNER_TEMP+'/prod-before.json',JSON.stringify(j.result.deployments[0].versions));
          EOF
          for attempt in 1 2 3; do
            if npx --yes wrangler@4.50.0 deploy --config qa/membership-visual-v2-20261120/wrangler.toml --name ball46-membership-visual-v2-test-20261120; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Verify desktop sticky membership and unchanged mobile
        run: |
          npm install --prefix qa/membership-visual-v2-20261120/.runtime --no-audit --no-fund playwright@1.55.0
          qa/membership-visual-v2-20261120/.runtime/node_modules/.bin/playwright install chromium --only-shell
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';import {createRequire} from 'node:module';
          const {chromium,devices}=createRequire(process.cwd()+'/qa/membership-visual-v2-20261120/.runtime/package.json')('playwright');
          const base='https://ball46-membership-visual-v2-test-20261120.mccarey-supon.workers.dev';
          let health;for(let i=0;i<15;i++){try{const r=await fetch(base+'/_membership_visual_health');if(r.ok){health=await r.json();break}}catch{}await new Promise(r=>setTimeout(r,2000))}
          assert.equal(health?.scope,'TEST_ONLY_MEMBERSHIP_VISUAL');assert.equal(health?.revision,'MEMBERSHIP_NATIVE_V3');assert.equal((await fetch(base+'/_membership_visual_health',{method:'POST'})).status,405);
          const browser=await chromium.launch();try{
          for(const mode of ['desktop-dark','desktop-light','wide-dark','wide-light','mobile-dark','mobile-light']){
          const mobile=mode.startsWith('mobile'),theme=mode.endsWith('dark')?'dark':'light',wide=mode.startsWith('wide');
          const p=await browser.newPage(mobile?{...devices['iPhone 13'],serviceWorkers:'block'}:{viewport:{width:wide?1920:1440,height:950},serviceWorkers:'block'});
          const errors=[];p.on('pageerror',e=>errors.push(e.message));await p.addInitScript(t=>localStorage.setItem('nomad343_dashboard_theme_v1',t),theme);
          await p.route('**/*',r=>['GET','HEAD'].includes(r.request().method())?r.continue():r.abort());
          await p.goto(base+'/index.html?view=statistics',{waitUntil:'domcontentloaded',timeout:60000});
          const sel=mobile?'.b46-membership-v3-mobile>a':'.b46-stat-member-top>a.b46-membership-v3-link';
          await p.locator(sel).waitFor({state:'visible',timeout:30000});
          const proof=await p.locator(sel).evaluate(e=>{const r=e.getBoundingClientRect(),person=e.querySelector('.b46v3-person'),cta=e.querySelector('.b46v3-cta'),copy=e.querySelector('.b46v3-copy');return {x:r.x,y:r.y,w:r.width,h:r.height,href:e.href,theme:document.documentElement.dataset.theme,bg:getComputedStyle(person).backgroundImage,position:getComputedStyle(e.parentElement).position,cta:cta.getBoundingClientRect().toJSON(),copy:copy.getBoundingClientRect().toJSON(),native:e.querySelector('.b46v3-head').textContent,overflow:e.scrollWidth>e.clientWidth+2}});
          console.log('NATIVE_PROOF '+JSON.stringify({mode,...proof,errors}));assert.equal(proof.href,'https://member.ball46.com/pricing');assert.equal(proof.theme,theme);assert.equal(proof.native,'Get closer to the game.');assert(!proof.overflow);assert(proof.cta.right<=proof.x+proof.w+1&&proof.copy.right<=proof.cta.left+1);assert(proof.bg.includes('person-'+theme+'.webp'));const url=proof.bg.match(/url\("([^"]+)"\)/)[1];const img=await p.request.get(url);assert.equal(img.status(),200);assert(img.headers()['content-type'].includes('image/webp'));
          if(mobile){assert(proof.w>300&&proof.h<100&&proof.position==='static');assert.equal(await p.locator('.b46-stat-member-top:visible').count(),0);}
          else{assert.equal(proof.h,90);assert.equal(proof.position,'sticky');
          const d=p.locator('.b46-fast-details');if(await d.count())await d.first().evaluate(e=>e.click());await p.waitForFunction(()=>{const e=document.querySelector('[data-workspace-panel="statistics"]');return e.scrollHeight>e.clientHeight+750},null,{timeout:90000});await p.mouse.move(750,450);await p.mouse.wheel(0,650);await p.waitForTimeout(450);
          const after=await p.locator(sel).evaluate(e=>({y:e.getBoundingClientRect().y,root:scrollY,scroll:e.closest('[data-workspace-panel]').scrollTop}));assert(after.scroll>100&&after.root===0&&Math.abs(after.y-proof.y)<2,'STICKY_REGRESSION');}
          const shot=await p.locator(sel).screenshot({type:'jpeg',quality:72});console.log('BANNER_PREVIEW '+mode+' '+shot.toString('base64'));
          await p.goto(base+'/',{waitUntil:'domcontentloaded'});await p.waitForTimeout(2000);assert.equal(await p.locator('.b46-membership-v3-mobile:visible,.b46-membership-v3-link:visible').count(),0,'HOME_LEAK');if(!mobile)assert(await p.locator('.b46mp-card').count());await p.close();
          }
          }finally{await browser.close()}
          EOF
      - name: Confirm Production unchanged
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';import {readFile} from 'node:fs/promises';
          const before=await readFile(process.env.RUNNER_TEMP+'/prod-before.json','utf8');const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/ball46-production/deployments?per_page=1',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});const j=await r.json();assert(j.success);assert.deepEqual(j.result.deployments[0].versions,JSON.parse(before));console.log('PRODUCTION_UNCHANGED')
          EOF
