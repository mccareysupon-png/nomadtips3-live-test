name: Rollback NOMAD 3.43 Full Market to v3

on:
  push:
    branches: [work/nomad343-full-market-v4-clean-20260914]
    paths:
      - 'workers/nomadtips3-343-full-market/ROLLBACK_TO_V3'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PREVIEW_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify rollback target
        working-directory: workers/nomadtips3-343-full-market
        run: |
          set -euo pipefail
          node --check src/index.js
          grep -Fq 'main = "src/index.js"' wrangler.toml
          grep -Fq "nomad343-full-market-v3-api-mixer" src/index.js
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.toml
      - name: Deploy stable v3 Full Market only
        working-directory: workers/nomadtips3-343-full-market
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.toml
      - name: Smoke rollback
        run: |
          set -euo pipefail
          sleep 5
          curl -fsS --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 "$PREVIEW_URL/api/full-market/health?rollback=$RANDOM" -o /tmp/health.json
          node - <<'NODE'
          const j=require('/tmp/health.json');
          if(j.ok!==true) throw Error(j.error||'health failed');
          if(j.version!=='nomad343-full-market-v3-api-mixer') throw Error(`wrong version ${j.version}`);
          console.log('ROLLBACK HEALTH OK',j.version);
          NODE
