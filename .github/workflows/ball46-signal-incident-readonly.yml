name: BALL46 SIGNAL INCIDENT — READ ONLY
on:
  push:
    branches: [audit/ball46-signal-loss-20261023]
    paths:
      - .github/workflows/ball46-signal-incident-readonly.yml
      - deploy-assets/signal-loss-20261023/**
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect SIGNAL incident production GET only
        run: |
          node --check deploy-assets/signal-loss-20261023/inspect.mjs
          node --check deploy-assets/signal-loss-20261023/compare.mjs
          node --check deploy-assets/signal-loss-20261023/proxy-concise.mjs
          node deploy-assets/signal-loss-20261023/proxy-concise.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b46-signal-incident-${{ github.run_id }}
          path: deploy-assets/signal-loss-20261023/audit/
          retention-days: 14
