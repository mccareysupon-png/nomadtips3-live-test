name: BALL46 Active Signals UI source READ ONLY audit 20261023
on:
  push:
    branches: [audit/ball46-active-signals-flicker-20261023]
    paths:
      - '.github/workflows/ball46-active-signals-audit-20261023.yml'
      - 'deploy-assets/active-signals-flicker-20261023/inspect.mjs'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan exact current Worker, HTML and linked assets for ACTIVE SIGNALS duplicate renderers
        run: |
          node --check deploy-assets/active-signals-flicker-20261023/inspect.mjs
          node deploy-assets/active-signals-flicker-20261023/inspect.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-active-signals-readonly-${{ github.run_id }}
          path: deploy-assets/active-signals-flicker-20261023/audit
          retention-days: 14
