name: Ball46 Signal Detail Persist Surgical 20261003

on:
  push:
    branches: [work/ball46-signal-detail-watch-20261003]
    paths:
      - '.github/workflows/ball46-signal-detail-persist-deploy-20261003.yml'

permissions:
  contents: read

concurrency:
  group: ball46-production-signal-detail-persist
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  DEPLOY_ENABLED: 'false'

jobs:
  surgical-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guarded current-Production preview
        working-directory: deploy-assets/signal-detail-fix-20261003
        run: node run.mjs
      - name: Browser regression proof after deploy
        if: env.DEPLOY_ENABLED == 'true'
        working-directory: deploy-assets/signal-detail-fix-20261003
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node qa.mjs
      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-signal-detail-persist-${{ github.run_id }}
          path: deploy-assets/signal-detail-fix-20261003/audit/
          if-no-files-found: error
          retention-days: 30
