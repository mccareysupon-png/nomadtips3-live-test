name: BALL46 Global Loading Signals Audit
on:
  push:
    branches: [fix/ball46-global-loading-orbit-20261019]
    paths: ['.github/workflows/ball46-global-loading-audit-20261019.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Read-only audit active Cloudflare version and live loader HTML
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          assert(account&&token,'Missing Cloudflare read credentials');
          const api='https://api.cloudflare.com/client/v4/accounts/'+account;
          const cf=await fetch(api+'/workers/scripts/ball46-production/deployments?per_page=1',{headers:{Authorization:'Bearer '+token}});
          const data=await cf.json();
          assert(cf.ok&&data.success===true,'Cloudflare read-only deployments fetch failed');
          const dep=data.result?.deployments?.[0];
          const active=dep?.versions?.filter(v=>Number(v.percentage)===100);
          assert(active?.length===1,'Cannot identify sole 100% live Worker version');
          const htmlResponse=await fetch('https://ball46.com/index.html?ringAudit='+Date.now(),{headers:{'cache-control':'no-cache'}});
          const html=await htmlResponse.text();
          const marker='b46-global-data-orbit-style-20261019';
          const checks={activeVersion:active[0].version_id,deploymentId:dep.id,httpStatus:htmlResponse.status,htmlBytes:Buffer.byteLength(html),ringMarkup:html.includes('id="b46-data-orbit-loading"'),ringStyle:html.includes(marker),ringRuntime:html.includes('b46-global-data-orbit-runtime-20261019'),orbitCSS:html.includes('@keyframes b46-orbit-rotate-20261019'),firstPaintGuard:html.includes('b46-mobile-first-paint-guard-20261019')};
          console.log('LIVE_RING_READONLY_AUDIT',JSON.stringify(checks));
          assert.equal(htmlResponse.status,200,'Live homepage not HTTP 200');
          const {chromium}=await import('playwright');
          const browser=await chromium.launch({headless:true});
          try{
            for(const width of [390,1280]){
              const page=await browser.newPage({viewport:{width,height:850}});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('https://ball46.com/?ringAudit='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              const snapshot=await page.evaluate(()=>{
                const e=document.querySelector('#b46-data-orbit-loading');
                const ring=e?.querySelector('.b46-orbit-ring');
                const style=ring?getComputedStyle(ring,'::before'):null;
                return {exists:!!e,visibility:e?getComputedStyle(e).visibility:null,animationName:style?.animationName??null,animationDuration:style?.animationDuration??null,animationPlayState:style?.animationPlayState??null,done:document.documentElement.dataset.b46OrbitDone||null,domLoaded:document.readyState};
              });
              console.log('LIVE_RING_BROWSER',JSON.stringify({width,...snapshot,errors:errors.slice(0,5)}));
              await page.close();
            }
          }finally{await browser.close()}
          assert(checks.ringMarkup&&checks.ringStyle&&checks.ringRuntime&&checks.orbitCSS,'LIVE_LOADING_ORBIT_MISSING_AFTER_DEPLOY');
          JS
      - name: Check real load readiness on both breakpoints
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const html=await(await fetch('https://ball46.com/index.html?loadingSource='+Date.now())).text();
          for(const term of ['data-state','data-board-sections','Connecting to Live Data','setState(','function renderBoard(','data-load','data-status-filter','function render(){','data-b46gn','const board=','const current=','function renderEmpty']){
            let pos=0,n=0;while(n++<5&&(pos=html.indexOf(term,pos))>=0){console.log('SOURCE',JSON.stringify({term,pos,around:html.slice(Math.max(0,pos-450),pos+1600)}));pos+=term.length}
          }
          const js=await(await fetch('https://ball46.com/dashboard-v2-stage3-featured-facts-20261013a.js')).text();
          for(const term of ['function setState(','function renderBoard(','data-state','Connecting to Live Data','function initControls(','function boot','function updateData','setInterval(','function refreshBoard','engine/board']){
            let pos=0,n=0;while(n++<3&&(pos=js.indexOf(term,pos))>=0){console.log('DASH',JSON.stringify({term,pos,around:js.slice(Math.max(0,pos-300),pos+1700)}));pos+=term.length}
          }
          const browser=await chromium.launch({headless:true});
          try{
            for(const width of [390,1280]){
              const page=await browser.newPage({viewport:{width,height:850}});
              const events=[];
              page.on('response',r=>{if(/api\/engine\/(board|signals)|api\/full-market/.test(r.url()))events.push({at:Date.now(),code:r.status(),path:r.url().split('?')[0].slice(-100)});});
              await page.goto('https://ball46.com/?loadingAudit='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              for(const ms of [0,200,750,1800,3200]){
                if(ms)await page.waitForTimeout(ms);
                const v=await page.evaluate(()=>{
                  const s=document.querySelector('[data-state]'),board=document.querySelector('[data-board-sections]'),rows=document.querySelectorAll('[data-board-sections] .match-row[data-match-id]'),newCards=document.querySelectorAll('#b46gn-cards [data-b46gn-fixture]'),hero=document.querySelector('#b46gn-results');
                  return {readyMode:document.documentElement.dataset.b46gn||null,bodyView:document.body.dataset.workspaceView||null,loadingText:s?.innerText||null,loadingHtml:s?.outerHTML.slice(0,450),
                  boardRows:rows.length,mobileCards:newCards.length,boardHidden:board?.hidden,boardDisplay:board?getComputedStyle(board).display:null,
                  greenResultsDisplay:hero?getComputedStyle(hero).display:null,pageText:document.body.innerText.slice(0,420),loadingAttrs:{...s?.dataset}};
                });
                console.log('LOAD_STAGE',JSON.stringify({width,ms,snapshot:v,events:events.slice(-10)}).slice(0,2600));
              }
              await page.close();
            }
          }finally{await browser.close()}
          JS
