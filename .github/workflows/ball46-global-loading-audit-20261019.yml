name: BALL46 Global Loading Signals Audit
on:
  push:
    branches: [fix/ball46-global-loading-orbit-20261019]
    paths: ['.github/workflows/ball46-global-loading-audit-20261019.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check real load readiness on both breakpoints
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const html=await(await fetch('https://ball46.com/index.html?loadingSource='+Date.now())).text();
          for(const term of ['data-state','data-board-sections','Connecting to Live Data','setState(','function renderBoard(','data-load','data-status-filter','function render(){','data-b46gn','const board=','const current=','function renderEmpty']){
            let pos=0,n=0;while(n++<5&&(pos=html.indexOf(term,pos))>=0){console.log('SOURCE',JSON.stringify({term,pos,around:html.slice(Math.max(0,pos-450),pos+1600)}));pos+=term.length}
          }
          const js=await(await fetch('https://ball46.com/dashboard-v2-stage3-featured-facts-20261013a.js')).text();
          for(const term of ['function setState(','function renderBoard(','data-state','Connecting to Live Data','function initControls(','function boot','function updateData','setInterval(','function refreshBoard','engine/board']){
            let pos=0,n=0;while(n++<3&&(pos=js.indexOf(term,pos))>=0){console.log('DASH',JSON.stringify({term,pos,around:js.slice(Math.max(0,pos-300),pos+1700)}));pos+=term.length}
          }
          const browser=await chromium.launch({headless:true});
          try{
            for(const width of [390,1280]){
              const page=await browser.newPage({viewport:{width,height:850}});
              const events=[];
              page.on('response',r=>{if(/api\/engine\/(board|signals)|api\/full-market/.test(r.url()))events.push({at:Date.now(),code:r.status(),path:r.url().split('?')[0].slice(-100)});});
              await page.goto('https://ball46.com/?loadingAudit='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              for(const ms of [0,200,750,1800,3200]){
                if(ms)await page.waitForTimeout(ms);
                const v=await page.evaluate(()=>{
                  const s=document.querySelector('[data-state]'),board=document.querySelector('[data-board-sections]'),rows=document.querySelectorAll('[data-board-sections] .match-row[data-match-id]'),newCards=document.querySelectorAll('#b46gn-cards [data-b46gn-fixture]'),hero=document.querySelector('#b46gn-results');
                  return {readyMode:document.documentElement.dataset.b46gn||null,bodyView:document.body.dataset.workspaceView||null,loadingText:s?.innerText||null,loadingHtml:s?.outerHTML.slice(0,450),
                  boardRows:rows.length,mobileCards:newCards.length,boardHidden:board?.hidden,boardDisplay:board?getComputedStyle(board).display:null,
                  greenResultsDisplay:hero?getComputedStyle(hero).display:null,pageText:document.body.innerText.slice(0,420),loadingAttrs:{...s?.dataset}};
                });
                console.log('LOAD_STAGE',JSON.stringify({width,ms,snapshot:v,events:events.slice(-10)}).slice(0,2600));
              }
              await page.close();
            }
          }finally{await browser.close()}
          JS
