name: Ball46 Event Flow Route Proof 20261004

on:
  push:
    branches: [ops/ball46-odds-surgical-20260928]
    paths:
      - '.github/workflows/ball46-eventflow-route-proof-20261004.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact rail dependencies
        working-directory: deploy-assets/match-status-svg-20261003
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prove Event Flow route source read only
        working-directory: deploy-assets/match-status-svg-20261003
        run: |
          mkdir -p audit/eventflow-route-proof
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { activeVersion,getVersion,literals,publicFile,directOrigin,origin,sha } from './production.mjs';
          const before=await activeVersion();
          const v=await getVersion(before);
          const main=v.modules.find(m=>m.name===v.main_module);
          if(!main?.content_base64)throw new Error('MAIN_MODULE_MISSING');
          const source=Buffer.from(main.content_base64,'base64').toString('utf8');
          const lits=literals(source);
          const names=[...lits.keys()].filter(n=>/EVENTFLOW|SIGNAL_JS/i.test(n));
          const rows=names.map(name=>{const value=lits.get(name).value;return{name,bytes:Buffer.byteLength(value),sha:sha(value),hasSignalAnnotation:value.includes('B46_EVENTFLOW_SIGNAL_ANNOTATION_20261004'),hasExpandMode:value.includes('B46_EVENTFLOW_EXPAND_MODE_20261004')}});
          const direct=await publicFile('/expanded-match-343.js',undefined,directOrigin);
          const pub=await publicFile('/expanded-match-343.js',undefined,origin);
          const routeFacts={
            activeVersion:before,
            mainModule:v.main_module,
            mainSha:sha(source),
            routePathOccurrences:(source.match(/\/expanded-match-343\.js/g)||[]).length,
            noStoreOccurrences:(source.match(/noStoreUiAsset/g)||[]).length,
            revisionAnnotation:(source.match(/eventflow-signal-[a-z0-9-]+/gi)||[]).slice(0,20),
            embedded:rows,
            direct:{sha:sha(direct),bytes:direct.length,hasSignalAnnotation:direct.toString().includes('B46_EVENTFLOW_SIGNAL_ANNOTATION_20261004'),hasExpandMode:direct.toString().includes('B46_EVENTFLOW_EXPAND_MODE_20261004')},
            public:{sha:sha(pub),bytes:pub.length,hasSignalAnnotation:pub.toString().includes('B46_EVENTFLOW_SIGNAL_ANNOTATION_20261004'),hasExpandMode:pub.toString().includes('B46_EVENTFLOW_EXPAND_MODE_20261004')}
          };
          writeFileSync('audit/eventflow-route-proof/report.json',JSON.stringify(routeFacts,null,2));
          console.log(JSON.stringify(routeFacts,null,2));
          for(const row of rows)if(row.sha===routeFacts.direct.sha)console.log(`DIRECT_MATCHES_EMBEDDED=${row.name}`);
          const after=await activeVersion();if(after!==before)throw new Error(`RACE_GUARD_ABORT:${before}->${after}`);
          console.log(`RACE_GUARD_PASS=${after}`);
          console.log('EVENTFLOW_ROUTE_PROOF_PASS');
          NODE
      - name: Retain proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-eventflow-route-proof-${{ github.run_id }}
          path: deploy-assets/match-status-svg-20261003/audit/eventflow-route-proof/
          if-no-files-found: error
          retention-days: 14
