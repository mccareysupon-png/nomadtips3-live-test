name: Ball46 Rollback Execute 20260920

on:
  push:
    branches: [ops/ball46-rollback-inspect2-20260920]
    paths:
      - '.github/workflows/ball46-rollback-execute-20260920.yml'

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BALL46_URL: https://ball46.com
  TARGET_VERSION: c04eae08-c1a2-4e00-94ce-79d567069640

jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Capture backend health before rollback
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_URL/api/engine/health?rb=${GITHUB_RUN_ID}-before" -o /tmp/engine-before.json
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_URL/api/full-market/health?rb=${GITHUB_RUN_ID}-before" -o /tmp/full-before.json
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/engine-before.json','utf8'));
          const f=JSON.parse(fs.readFileSync('/tmp/full-before.json','utf8'));
          if(!e.version||!f.version) throw Error('HEALTH_VERSION_MISSING');
          fs.writeFileSync('/tmp/engine-version',String(e.version));
          fs.writeFileSync('/tmp/full-version',String(f.version));
          console.log('BACKEND_BEFORE',JSON.stringify({engine:e.version,fullMarket:f.version}));
          NODE

      - name: Roll back Ball46 production to 12:39 ICT known-good version
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 rollback "$TARGET_VERSION" --config wrangler.ball46.jsonc --message "Rollback Ball46 to known-good production from 2026-09-20 12:39 ICT"

      - name: Verify active deployment and public pages
        shell: bash
        run: |
          set -euo pipefail
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deployments list --config wrangler.ball46.jsonc --json > /tmp/deployments.json
          cd ../..
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          const latest=d[d.length-1];
          const target=process.env.TARGET_VERSION;
          if(!latest||!Array.isArray(latest.versions)||!latest.versions.some(v=>v.version_id===target && Number(v.percentage)===100)) {
            console.error('LATEST_DEPLOYMENT',JSON.stringify(latest));
            throw Error('ROLLBACK_TARGET_NOT_ACTIVE');
          }
          console.log('ROLLBACK_ACTIVE',JSON.stringify({deployment:latest.id,target}));
          NODE
          for p in index.html signal.html statistics.html v2-header.css ball46-next.css; do
            code=$(curl -sS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 25 -o "/tmp/${p}.after" -w '%{http_code}' "$BALL46_URL/$p?rb=${GITHUB_RUN_ID}")
            [ "$code" = 200 ] || { echo "HTTP_FAIL:$p:$code"; exit 1; }
            test -s "/tmp/${p}.after" || { echo "EMPTY_ASSET:$p"; exit 1; }
          done

      - name: Verify backend unchanged after rollback
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_URL/api/engine/health?rb=${GITHUB_RUN_ID}-after" -o /tmp/engine-after.json
          curl -fsS -L --retry 5 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_URL/api/full-market/health?rb=${GITHUB_RUN_ID}-after" -o /tmp/full-after.json
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/engine-after.json','utf8'));
          const f=JSON.parse(fs.readFileSync('/tmp/full-after.json','utf8'));
          if(String(e.version||'')!==fs.readFileSync('/tmp/engine-version','utf8')) throw Error('ENGINE_CHANGED');
          if(String(f.version||'')!==fs.readFileSync('/tmp/full-version','utf8')) throw Error('FULL_MARKET_CHANGED');
          console.log('ROLLBACK_VERIFY_PASS',JSON.stringify({engine:e.version,fullMarket:f.version}));
          NODE
