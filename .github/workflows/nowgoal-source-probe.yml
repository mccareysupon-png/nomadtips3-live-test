name: Nowgoal Source Probe

on:
  pull_request:
    paths:
      - 'tools/nowgoal-probe.mjs'
      - 'tools/nowgoal-live-ah-probe.mjs'
      - '.github/workflows/nowgoal-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Inspect public Nowgoal page and JS request paths
        run: node tools/nowgoal-probe.mjs
      - name: Inspect live Nowgoal 1xBet AH payloads
        run: node tools/nowgoal-live-ah-probe.mjs
