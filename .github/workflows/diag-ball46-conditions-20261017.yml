name: READ ONLY Ball46 conditions and Signal throttle audit 20261017
on:
  push:
    branches: [diag/ball46-conditions-20261017]
    paths: [.github/workflows/diag-ball46-conditions-20261017.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read effective market settings, signal times, price backoff and per-fixture stages
        shell: bash
        run: |
          node <<'NODE'
          const base='https://ball46-production.mccarey-supon.workers.dev';
          const endpoints={
            settings:'https://nomadtips3-engine-343.mccarey-supon.workers.dev/settings',
            health:'https://nomadtips3-engine-343.mccarey-supon.workers.dev/health',
            board:'https://nomadtips3-engine-343.mccarey-supon.workers.dev/board',
            signals:'https://nomadtips3-engine-343.mccarey-supon.workers.dev/signals',
            active:base+'/api/engine/signals',
            fullMarket:base+'/api/full-market/health',
            fullSettings:base+'/api/full-market/settings',
            hub:'https://nomadtips3-5usd-hub-343.mccarey-supon.workers.dev/health'
          };
          const entries=await Promise.all(Object.entries(endpoints).map(async([k,url])=>{
            try{const res=await fetch(url+'?audit='+Date.now(),{signal:AbortSignal.timeout(15000),headers:{'cache-control':'no-cache'}}); const j=await res.json();return[k,{http:res.status,data:j}]}catch(e){return[k,{error:String(e.message)}]}
          }));
          const all=Object.fromEntries(entries);
          const get=k=>all[k]?.data||{};
          const s=get('settings'),h=get('health'),b=get('board'),sg=get('signals'),act=get('active'),fm=get('fullMarket'),fs=get('fullSettings'),hu=get('hub');
          const keys=Object.keys(s);const skeys=Object.keys(s.settings||{});
          const getConfig=(v)=>v&&typeof v==='object'?Object.fromEntries(Object.entries(v).filter(([k,x])=>/minute|threshold|evidence|odds|enabled|period|delta|confidence|score|volume|window|run|line|corner|goal|asian|over|under|edge|limit|selection|market|active/i.test(k)&&['string','number','boolean'].includes(typeof x))):{};
          const markets={};for(const [market,v] of Object.entries(s.settings||{}))if(v&&typeof v==='object')markets[market]=getConfig(v);
          console.log('SETTINGS_AUDIT '+JSON.stringify({http:all.settings?.http,ok:s.ok,keys,settingsKeys:skeys,marketCount:Object.keys(markets).length,effectiveMarkets:markets,flags:s.run||s.flags||s.enabled||s.settings?.run||null,otherTop:Object.fromEntries(Object.entries(s).filter(([k,v])=>!['settings','run','flags','enabled'].includes(k)&&v!==null&&['string','number','boolean'].includes(typeof v)))}));
          const fixtures=Array.isArray(b.fixtures)?b.fixtures:Array.isArray(b.rows)?b.rows:[];
          const status={};const analyses={};const samples=[];let analyzed=0;
          for(const f of fixtures){
            const st=String(f.statusCode||f.status||f.boardState||'UNKNOWN');status[st]=(status[st]||0)+1;
            const rules=f.analysis||f.marketAnalysis||f.decisions||f.markets||null;
            if(rules&&typeof rules==='object'){
              analyzed++;
              for(const [market,r] of Object.entries(rules)){
                const stage=typeof r==='object'?(r?.state||r?.status||r?.reason||'UNKNOWN'):String(r);
                const key=market+':'+stage;analyses[key]=(analyses[key]||0)+1;
              }
              if(samples.length<2)samples.push({fixtureId:f.fixtureId,state:st,analysisKeys:Object.keys(rules).slice(0,6)});
            }
          }
          const grouped={};for(const [key,count] of Object.entries(analyses)){const stage=key.slice(key.indexOf(':')+1);grouped[stage]=(grouped[stage]||0)+count}
          console.log('BOARD_AUDIT '+JSON.stringify({http:all.board?.http,keys:Object.keys(b),size:fixtures.length,firstKeys:fixtures.length?Object.keys(fixtures[0]):[],statuses:status,analysisFixtureCount:analyzed,stageTotals:grouped,byMarketStage:analyses,samples}).slice(0,17000));
          const signals=Array.isArray(sg.signals)?sg.signals:[];const localDay=t=>new Date(t+7*3600e3).toISOString().slice(0,10);
          const today='2026-10-17';const deployAt=Date.parse('2026-10-17T13:53:23Z');
          const allDates={},byMarket={},byHour={},newAfterDeploy=[],preDeploy=[];
          for(const x of signals){const t=Number(x.createdAt||x.lockedAt||0);if(!t)continue;const day=localDay(t);allDates[day]=(allDates[day]||0)+1;if(day!==today)continue;const market=String(x.market||'unknown');byMarket[market]=(byMarket[market]||0)+1;const hour=new Date(t+7*3600e3).toISOString().slice(11,13);byHour[hour]=(byHour[hour]||0)+1;(t>=deployAt?newAfterDeploy:preDeploy).push({market,minute:x.minute||x.entryMinute||null,at:new Date(t).toISOString()});}
          console.log('SIGNAL_AUDIT '+JSON.stringify({http:all.signals?.http,allCount:sg.allCount,pending:signals.length,dates:allDates,todayByMarket:byMarket,todayByHour:byHour,todayBeforeRepair:preDeploy.length,todayAfterRepair:newAfterDeploy.length,latestAfterRepair:newAfterDeploy.slice(0,6)}));
          console.log('ACTIVE_AUDIT '+JSON.stringify({http:all.active?.http,activeSignals:act.signals?.length,mirror:act.mirror}));
          console.log('HEALTH_AUDIT '+JSON.stringify({http:all.health?.http,ok:h.ok,version:h.version,startedAt:h.startedAt,finishedAt:h.finishedAt,fixtureCount:h.fixtureCount,liveCount:h.liveCount,signalCount:h.signalCount,refereeQueued:h.refereeQueued,refereeRequests:h.refereeRequests,externalOddsRequests:h.externalOddsRequests,refereeErrors:h.refereeErrors?.slice?.(0,7),lastError:h.lastError}));
          console.log('PRICE_AUDIT '+JSON.stringify({http:all.fullMarket?.http,health:fm,settings:fs,hub:{lastError:hu.lastError,liveCount:hu.liveCount,ageMs:hu.ageMs}}).slice(0,11000));
          NODE

      - name: Inspect precise run flags and active stage impact without changing settings
        shell: bash
        run: |
          node <<'NODE'
          for(const [name,url] of [
            ['settings','https://nomadtips3-engine-343.mccarey-supon.workers.dev/settings'],
            ['board','https://nomadtips3-engine-343.mccarey-supon.workers.dev/board']
          ]) {
            try {
              const res=await fetch(url+'?runflags='+Date.now(),{signal:AbortSignal.timeout(15000)});
              const d=await res.json();
              if(name==='settings'){
                console.log('RUNFLAGS '+JSON.stringify({ok:d.ok,runState:d.runState,markets:d.markets,settingsCount:Object.keys(d.settings||{}).length}));
                const names=['ft_1x2','ft_ah','ft_over','ft_under','ht_1x2','ht_ah','ht_over','ht_under','ft_corner_over','ft_corner_under','ht_corner_over','ht_corner_under','ft_corner_ah','ft_cards_over','ft_cards_under','ft_cards_ah','ft_btts_yes','ft_btts_no'];
                const table=names.map(m=>({market:m,enabled:d.runState?.[m]??d.markets?.[m]?.run??d.markets?.[m]?.enabled??null,minuteFrom:d.settings?.[m]?.minuteFrom,minuteTo:d.settings?.[m]?.minuteTo,evidenceRequired:d.settings?.[m]?.evidenceRequired,oddsMin:d.settings?.[m]?.oddsMin}));
                console.log('RULE_TABLE '+JSON.stringify(table));
              }else {
                console.log('BOARD_RUNFLAGS '+JSON.stringify({runState:d.runState,counts:d.counts,referee:d.referee}).slice(0,12000));
              }
            } catch(error){console.log('RUNFLAGS_ERROR '+name+' '+String(error.message))}
          }
          NODE

      - name: Read all persisted thresholds for 18 markets exactly
        shell: bash
        run: |
          node <<'NODE'
          const r=await fetch('https://nomadtips3-engine-343.mccarey-supon.workers.dev/settings?full_detail='+Date.now(),{signal:AbortSignal.timeout(20000),headers:{'cache-control':'no-cache'}});
          const j=await r.json();if(!r.ok||j?.ok!==true)throw Error('SETTINGS_UNAVAILABLE');
          for(const [name,settings] of Object.entries(j.settings||{})){
            console.log('MARKET_DETAIL '+JSON.stringify({market:name,enabled:j.runState?.[name]===true,settings}));
          }
          console.log('SETTINGS_COUNTS '+JSON.stringify({total:Object.keys(j.settings||{}).length,enabled:Object.values(j.runState||{}).filter(Boolean).length}));
          NODE

      - name: Compare repeated live signal and price backoff snapshots
        shell: bash
        run: |
          node <<'NODE'
          const b='https://ball46-production.mccarey-supon.workers.dev';
          const e='https://nomadtips3-engine-343.mccarey-supon.workers.dev';
          async function fetchJson(url){
            const r=await fetch(url+'?repeat='+Date.now(),{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(16000)});
            return {status:r.status,value:await r.json().catch(()=>({}))};
          }
          function sig(x){const s=Array.isArray(x?.signals)?x.signals:[];return{count:s.length,first:s.slice(0,8).map(v=>({market:v.market,fixtureId:v.fixtureId,minute:v.entryMinute,createdAt:v.createdAt,bookmaker:v.bookmaker,status:v.status})),allCount:x.allCount,mirror:x.mirror||null}}
          for(let i=0;i<3;i++){
            const out=await Promise.allSettled([
              fetchJson(b+'/api/engine/signals'),fetchJson(e+'/signals'),fetchJson(e+'/health'),fetchJson(b+'/api/full-market/health'),fetchJson(e+'/board')
            ]);
            const [active,engine,health,price,board]=out.map(o=>o.status==='fulfilled'?o.value.value:{error:String(o.reason)});
            const ref=Array.isArray(health.refereeErrors)?health.refereeErrors:[];
            const priceMiss=ref.filter(v=>String(v.error).includes('CACHE_MISS')).length;
            const stateCount={};const f=Array.isArray(board.fixtures)?board.fixtures:[];
            for(const fixture of f)for(const [market,v] of Object.entries(fixture.analysis||{})){if(board.runState?.[market]!==true)continue;const st=v?.state||'UNSET';stateCount[st]=(stateCount[st]||0)+1}
            console.log('SIGNAL_SNAPSHOT '+JSON.stringify({sample:i,at:new Date().toISOString(),active:sig(active),engine:sig(engine),
              health:{liveCount:health.liveCount,fixtureCount:health.fixtureCount,signalCount:health.signalCount,refereeQueued:health.refereeQueued,refereeRequests:health.refereeRequests,externalOddsRequests:health.externalOddsRequests,priceMiss,otherErrors:ref.slice(0,4).map(x=>x.error),lastError:health.lastError},
              pricing:{prewarm:price.prewarmMeta,provider:price.providerMeta,blockedUntil:price.blockedUntil,retryAfterSec:price.retryAfterSec,callsLast60s:price.callsLast60s,remainingLocalBudget:price.remainingLocalBudget},activeMarketStages:stateCount}));
            if(i<2)await new Promise(done=>setTimeout(done,16000));
          }
          NODE

      - name: Read-only identify current shared 5USD cron competitors
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'NODE'
          const a=process.env.CLOUDFLARE_ACCOUNT_ID,t=process.env.CLOUDFLARE_API_TOKEN;
          if(!a||!t){console.log('CONSUMER_AUDIT missing credentials');process.exit(0)}
          const workers=['nomadtips3-engine-343','nomadtips3-5usd-hub-343','nomadtips3-5usd-hub-343-stable-canary',
          'nomadtips3-full-market-343-ball46','nomadtips3-343-central-cache','nomadtips3-343-central-cache-canary',
          'nomadtips3-343-full-market-central-canary','nomadtips3-343-auto-engine','nomadtips3-rich-odds-343','ball46-production'];
          async function get(path){
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+a+'/workers/scripts/'+path,{headers:{Authorization:'Bearer '+t},signal:AbortSignal.timeout(20000)});
            const j=await r.json();if(!j.success)throw Error('STATUS_'+r.status+'_'+JSON.stringify(j.errors).slice(0,100));return j.result;
          }
          for(const w of workers){
            try{
              const [sched,setting]=await Promise.all([get(w+'/schedules'),get(w+'/settings')]);
              const binds=(setting.bindings||[]).filter(x=>x.type==='service'||x.type==='secret_text').map(x=>({name:x.name,type:x.type,service:x.service||null}));
              console.log('ACTIVE_5USD_CONSUMER '+JSON.stringify({worker:w,crons:(sched.schedules||[]).map(x=>x.cron),bindings:binds,compatibilityDate:setting.compatibility_date}));
            }catch(e){console.log('CONSUMER_AUDIT_ERROR '+w+' '+String(e.message).slice(0,250))}
          }
          NODE
      - name: Probe parallel old cache producer health read-only
        shell: bash
        run: |
          node <<'NODE'
          const workers=['nomadtips3-343-central-cache','nomadtips3-343-central-cache-canary','nomadtips3-343-full-market-central-canary','nomadtips3-5usd-hub-343-stable-canary','nomadtips3-343-auto-engine'];
          await Promise.all(workers.map(async w=>{try{
            const r=await fetch('https://'+w+'.mccarey-supon.workers.dev/health?compare='+Date.now(),{signal:AbortSignal.timeout(14000)});
            const j=await r.json().catch(()=>({}));
            const result={worker:w,http:r.status,ok:j.ok,version:j.version,providerCalls60s:j.providerCalls60s,maxProviderCalls60s:j.maxProviderCalls60s,
             lastTick:j.lastTick?{providerCalls:j.lastTick.providerCalls,failed:j.lastTick.failed?.slice(0,2),at:j.lastTick.at}:null,refereeRequests:j.refereeRequests,
             lastError:j.lastError||j.error||null,provider:j.providerMeta||j.provider||null};
            console.log('COMPETITOR_HEALTH '+JSON.stringify(result).slice(0,1700));
          }catch(e){console.log('COMPETITOR_HEALTH '+JSON.stringify({worker:w,error:String(e.message)}))}}));
          NODE
