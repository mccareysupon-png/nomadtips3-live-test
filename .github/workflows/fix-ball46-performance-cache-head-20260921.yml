name: Fix Ball46 Performance Cache HEAD 20260921

on:
  push:
    branches: [work/ball46-performance-golden-20260921]
    paths:
      - '.github/workflows/fix-ball46-performance-cache-head-20260921.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  PREVIEW_URL: https://nomadtips3-343-ultra-preview.mccarey-supon.workers.dev
  PROD_URL: https://ball46-production.mccarey-supon.workers.dev
  GOLDEN_PROD_SHA: ad34452074b300787c91c7788c02d0e242854d0d

jobs:
  fix-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Support GET and HEAD for immutable versioned assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('workers/nomadtips3-343-preview/src/index.js')
          s=p.read_text()
          old="if (request.method === 'GET' && url.searchParams.has('v') && /\\.(?:js|css|svg)$/.test(url.pathname)) return versionedUiAsset(request, env);"
          new="if ((request.method === 'GET' || request.method === 'HEAD') && url.searchParams.has('v') && /\\.(?:js|css|svg)$/.test(url.pathname)) return versionedUiAsset(request, env);"
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('versioned asset route anchor not found')
          p.write_text(s)
          PY
      - name: Validate and guard Golden Odds
        shell: bash
        run: |
          set -euo pipefail
          node --check workers/nomadtips3-343-preview/src/index.js
          node --check nomad-live-343/dashboard-v2-stage3.js
          node --check nomad-live-343/singlepage-workspace-343.js
          for p in workers/nomadtips3-engine-343/src/index.js nomad-live-343/bulk-odds-compat-343.js nomad-live-343/full-market-bookmaker-343.js nomad-live-343/live-summary-full-odds-343.js nomad-live-343/expanded-match-343.js; do
            git diff --quiet "$GOLDEN_PROD_SHA"..HEAD -- "$p" || { echo "FORBIDDEN GOLDEN ODDS CHANGE: $p"; exit 1; }
          done
          grep -Fq '343-dashboard-v2-stage3-v6-board-first' nomad-live-343/index.html
          grep -Fq '343-singlepage-perf-v1-20260921' nomad-live-343/index.html
          grep -Fq "request.method === 'HEAD'" workers/nomadtips3-343-preview/src/index.js
          git diff --check
      - name: Commit HEAD cache support
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'mccareysupon-png'
          git config user.email 'mccarey.supon@gmail.com'
          git add workers/nomadtips3-343-preview/src/index.js
          if ! git diff --cached --quiet; then
            git commit -m 'perf(ball46): cache versioned assets on GET and HEAD'
            git push origin HEAD:work/ball46-performance-golden-20260921
          fi
      - name: Dry-run isolated preview
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.jsonc
      - name: Deploy isolated preview
        working-directory: workers/nomadtips3-343-preview
        run: npx --yes wrangler@4.92.0 deploy --config wrangler.jsonc
      - name: Final performance preview validation
        shell: bash
        run: |
          set -euo pipefail
          sleep 4
          curl -fsS --max-time 30 "$PREVIEW_URL/?perffinal=$GITHUB_RUN_ID" -o /tmp/home.html
          grep -Fq '343-dashboard-v2-stage3-v6-board-first' /tmp/home.html
          grep -Fq '343-singlepage-perf-v1-20260921' /tmp/home.html
          grep -Fq 'full-market-bookmaker-343.js' /tmp/home.html
          grep -Fq 'live-summary-full-odds-343.js' /tmp/home.html
          curl -fsS --max-time 30 "$PROD_URL/api/engine/board?golden=$GITHUB_RUN_ID" -o /tmp/prod.json
          curl -fsS --max-time 30 "$PREVIEW_URL/api/engine/board?preview=$GITHUB_RUN_ID" -o /tmp/prev.json
          curl -fsS --max-time 30 "$PREVIEW_URL/api/engine/signals?preview=$GITHUB_RUN_ID" -o /tmp/sig.json
          curl -fsS --max-time 30 "$PREVIEW_URL/api/engine/statistics-lite?preview=$GITHUB_RUN_ID" -o /tmp/stats.json
          node - <<'NODE'
          const fs=require('fs'); const a=JSON.parse(fs.readFileSync('/tmp/prod.json')); const b=JSON.parse(fs.readFileSync('/tmp/prev.json')); const s=JSON.parse(fs.readFileSync('/tmp/sig.json')); const t=JSON.parse(fs.readFileSync('/tmp/stats.json'));
          function has(v){if(Array.isArray(v))return v.length>0;if(!v||typeof v!=='object')return false;const c=[v.bookmakers,v.odds,v.markets,v?.data?.bookmakers,v?.data?.odds,v?.data?.markets];return c.some(x=>Array.isArray(x)?x.length>0:!!(x&&typeof x==='object'&&Object.keys(x).length))||Object.keys(v).some(k=>/bet365|pinnacle|crown|1xbet|12bet|interwetten|macauslot|18bet|vcbet|easybets|bookmaker/i.test(String(k)))}
          const oc=x=>(x.fixtures||[]).filter(f=>has(f?.providerOdds)||has(f?.fullOdds)||has(f?.odds)).length; if(a?.ok!==true||b?.ok!==true)throw Error('board unhealthy'); const pa=oc(a),pb=oc(b); if(pa>0&&pb===0)throw Error(`odds lost ${pa}->0`); if(!Array.isArray(s?.signals))throw Error('signals unhealthy'); if(t?.ok!==true||t?.compact!==true||!Array.isArray(t?.rows))throw Error('stats-lite unhealthy'); const z=fs.statSync('/tmp/stats.json').size; if(z>900000)throw Error(`stats-lite too large ${z}`); console.log('FINAL PERFORMANCE PREVIEW PASS',{goldenOdds:pa,previewOdds:pb,signals:s.signals.length,statsRows:t.rows.length,statsBytes:z});
          NODE
          curl -fsSI --max-time 20 "$PREVIEW_URL/dashboard-v2-stage3.js?v=343-dashboard-v2-stage3-v6-board-first" | grep -Fqi 'cache-control: public, max-age=31536000, immutable'
