name: Test BALL46 Pin V2 Signal Badge Fix 20261111
on:
  push:
    branches: [test/ball46-pinned-fixtures-v2-20261111]
    paths: ['pinned-fixtures-v2/SIGNAL_FIX_TEST_READY']
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: test/ball46-pinned-fixtures-v2-20261111}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node pinned-fixtures-v2/signal-badge-fix-test.mjs
