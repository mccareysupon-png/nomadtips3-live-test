name: Read-only Ball46 Live OU Engine Inspection
on:
  push:
    branches:
      - audit/ball46-live-engine-corners-ou-20261010
    paths:
      - .github/workflows/audit-ball46-live-ou-20261010.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
    steps:
      - name: Inspect current active Worker and OU market functions (NO CHANGES)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN;
          if(!account||!token)throw Error('CLOUDFLARE_AUTH_UNAVAILABLE');
          const worker='nomadtips3-engine-343';
          const root=`https://api.cloudflare.com/client/v4/accounts/${account}/workers`;
          const get=async p=>{
            const r=await fetch(root+p,{headers:{Authorization:`Bearer ${token}`},signal:AbortSignal.timeout(35000)});
            const j=await r.json();
            if(!r.ok||!j.success)throw Error(`CLOUDFLARE_READ_FAILED:${r.status}:${p}`);
            return j.result;
          };
          const deployments=await get(`/scripts/${worker}/deployments`);
          const deployed=deployments.deployments?.[0];
          const active=deployed?.versions?.find(x=>Number(x.percentage)===100);
          if(!active)throw Error('ACTIVE_100_PERCENT_VERSION_NOT_FOUND');
          const v=await get(`/workers/${worker}/versions/${active.version_id}?include=modules`);
          const main=v.modules?.find(x=>x.name===v.main_module);
          if(!main?.content_base64)throw Error('ACTIVE_MAIN_MODULE_UNAVAILABLE');
          const s=Buffer.from(main.content_base64,'base64').toString('utf8');
          const sha=createHash('sha256').update(s).digest('hex');
          const versionTags=[...s.matchAll(/nomad343-engine-v[^'"`\s;]{1,90}/ig)].slice(0,6).map(m=>m[0]);
          console.log('ACTIVE_ENGINE',{worker,versionId:active.version_id,sha256:sha,bytes:s.length,main:v.main_module,moduleCount:v.modules?.length,created:deployed.created_on,tags:versionTags});
          const pats=[/function\s+priceFor\s*\(/g,/function\s+pricePass\s*\(/g,/function\s+findMarket\s*\(/g,/function\s+oddsRoot\s*\(/g,/function\s+pickBestPriced\s*\(/g,/function\s+fetchFullOdds\s*\(/g,/corner_line/g,/goal_line/g,/lineGapMax/g,/priceAge/g];
          const rows=s.split('\n');
          for(const pat of pats){
            let hits=[];
            for(let i=0;i<rows.length;i++)if(pat.test(rows[i])){hits.push(i);pat.lastIndex=0;if(hits.length>=3)break;}
            console.log('SOURCE_MATCH',String(pat),hits.map(i=>({line:i+1,snippet:rows.slice(Math.max(0,i-1),Math.min(rows.length,i+4)).map(x=>x.slice(0,550)).join(' ')})));
          }
          const publicBase='https://www.ball46.com/api/engine';
          for(const part of ['health','registry','settings']){
            try{
              const r=await fetch(publicBase+'/'+part+'?_='+Date.now(),{signal:AbortSignal.timeout(20000),cache:'no-store'});
              const j=await r.json().catch(()=>({}));
              console.log('PUBLIC_'+part.toUpperCase(),JSON.stringify({http:r.status,ok:j.ok,version:j.version,settlementRevision:j.settlementRevision,markets:part==='registry'?Object.fromEntries(Object.entries(j.markets||{}).filter(([k])=>/^(?:ft|ht)_(?:corner_)?(?:over|under)$/.test(k))):undefined,settings:part==='settings'?Object.fromEntries(Object.entries(j.settings||{}).filter(([k])=>/^(?:ft|ht)_(?:corner_)?(?:over|under)$/.test(k)).map(([k,v])=>[k,{lineGapMax:v.lineGapMax,oddsMin:v.oddsMin,oddsMax:v.oddsMax,minuteFrom:v.minuteFrom,minuteTo:v.minuteTo}])):undefined}).slice(0,11500));
            }catch(e){console.log('PUBLIC_'+part.toUpperCase()+'_ERROR',String(e?.message||e))}
          }
          // Read only: report actual persisted runState independently of thresholds.
          try{
            const r=await fetch('https://www.ball46.com/api/engine/settings?audit_run='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(20000)});
            const j=await r.json();
            if(!r.ok||j.ok!==true)throw Error('SETTINGS_NOT_OK_'+r.status);
            const keys=['ft_corner_over','ft_corner_under','ht_corner_over','ht_corner_under','ft_corner_ah'];
            const exists=Object.keys(j.runState||{});
            console.log('LIVE_CORNER_RUNSTATE',JSON.stringify({checkedAt:new Date().toISOString(),version:j.version,runKeysPresent:keys.filter(k=>Object.hasOwn(j.runState||{},k)),missingKeys:keys.filter(k=>!Object.hasOwn(j.runState||{},k)),corners:Object.fromEntries(keys.map(k=>[k,Object.hasOwn(j.runState||{},k)?j.runState[k]:null])),otherEnabled:Object.entries(j.runState||{}).filter(([k,v])=>!keys.includes(k)&&v===true).map(([k])=>k)}));
          }catch(e){console.log('LIVE_CORNER_RUNSTATE_ERROR',String(e?.message||e))}
          // Read-only daily reconciliation: do not print match names or player data.
          try{
            const now=Date.now(), offset=7*3600000,local=new Date(now+offset);
            let cycleStart=Date.UTC(local.getUTCFullYear(),local.getUTCMonth(),local.getUTCDate(),12)-offset;
            if(now<cycleStart)cycleStart-=86400000;
            const cycleEnd=cycleStart+86400000, ids=new Map();
            let cursor=null,hasMore=true,pages=0,totalFetched=0,lastMeta=null;
            while(hasMore&&pages<30){
              const u=new URL('https://www.ball46.com/api/engine/statistics');
              u.searchParams.set('paged','1');if(cursor)u.searchParams.set('cursor',cursor);
              const response=await fetch(u,{cache:'no-store',signal:AbortSignal.timeout(20000)});
              const j=await response.json();
              if(!response.ok||j?.ok===false)throw Error('STATISTICS_FAILED '+response.status);
              pages++;lastMeta={hasMore:j.hasMore,nextCursor:!!j.nextCursor,source:j.statisticsSource,
               count:Array.isArray(j.rows)?j.rows.length:-1};const rows=Array.isArray(j.rows)?j.rows:[];
              totalFetched+=rows.length;let oldest=Infinity;
              for(const row of rows){
                const created=Number(row.createdAt);if(!Number.isFinite(created))continue;
                oldest=Math.min(oldest,created);
                if(created>=cycleStart&&created<cycleEnd&&row.id&&!ids.has(String(row.id)))ids.set(String(row.id),row);
              }
              hasMore=j.hasMore===true&&Boolean(j.nextCursor);
              cursor=j.nextCursor||null;
              if(!rows.length||oldest<cycleStart)break;
            }
            const counts={},status={},category={},examples={};let pendingCalc=0,strictPending=0,unresolved=0,voids=0;
            for(const row of ids.values()){
              const result=String(row.result||'PENDING').toUpperCase();
              const st=String(row.status||'PENDING').toUpperCase();
              counts[result]=(counts[result]||0)+1;status[st]=(status[st]||0)+1;
              const key=String(row.market||row.providerMarket||'').toLowerCase();
              const cat=key.includes('corner')?'CORNERS':key.includes('card')?'CARDS':key.includes('btts')?'BTTS':key.includes('1x2')?'1X2':/(^|_)(ah|asian)(_|$)/.test(key)||key.includes('handicap')?'AH':/(over|under|goalline|goal_line|total)/.test(key)?'O/U':'OTHER';
              const box=category[cat]||(category[cat]={total:0,pending:0,strictPending:0});
              box.total++;
              const terminal=['WIN','LOSS','PUSH','HALF_WIN','HALF_LOSS'];
              const memberPending=!terminal.includes(result);
              if(memberPending){pendingCalc++;box.pending++}
              if(st==='PENDING'&&result==='PENDING'){strictPending++;box.strictPending++}
              if(st==='UNRESOLVED')unresolved++;
              if(result==='VOID')voids++;
            }
            console.log('LIVE_DAILY_PENDING_AUDIT',JSON.stringify({
              now:new Date(now).toISOString(),cycleStart:new Date(cycleStart).toISOString(),
              cycleEnd:new Date(cycleEnd).toISOString(),total:ids.size,totalFetched,pages,lastMeta,
              byResult:counts,byStatus:status,byCategory:category,
              currentMemberPendingCalc:pendingCalc,strictPending,unresolved,voids,scanComplete:!hasMore
            }));
          }catch(e){console.log('LIVE_DAILY_PENDING_AUDIT_ERROR',String(e?.message||e))}

          // Investigate one user-reported already-lost O/U selection.
          // Keep this read-only; do not emit secret environment variables.
          try{
            const functionLines=s.split('\n');
            for(const name of ['pricePass','priceFor','pickBestPriced']){
              const idx=functionLines.findIndex(v=>new RegExp('function\\s+'+name+'\\s*\\(').test(v));
              console.log('ACTIVE_OU_GUARD_FUNCTION_'+name,JSON.stringify({
                found:idx>=0,line:idx+1,source:idx>=0?functionLines.slice(idx,idx+(name==='pricePass'?30:14)).join('\n').slice(0,6900):''
              }));
            }
            const spot=functionLines.findIndex(x=>/ft_under\s*:\s*\{/.test(x));
            if(spot>=0)console.log('ACTIVE_FT_UNDER_CONFIG',functionLines.slice(Math.max(0,spot-2),spot+3).join('\n').slice(0,1300));
            let cur=null,pages=0,found=[],seen=new Set(),scanned=0,more=true;
            while(more&&pages<8&&found.length<5){
              const u=new URL('https://www.ball46.com/api/engine/statistics');
              u.searchParams.set('paged','1');
              if(cur)u.searchParams.set('cursor',cur);
              const res=await fetch(u,{cache:'no-store',signal:AbortSignal.timeout(30000)});
              const j=await res.json();
              if(!res.ok||j.ok===false)throw Error('STATISTICS_FAIL_'+res.status);
              pages++;
              for(const row of Array.isArray(j.rows)?j.rows:[]){
                scanned++;
                const a=String(row?.home?.name||row?.home||'').toLowerCase();
                const b=String(row?.away?.name||row?.away||'').toLowerCase();
                if(!((a.includes('sevilla')||b.includes('sevilla'))&&(a.includes('tomares')||b.includes('tomares'))))continue;
                if(seen.has(String(row.id)))continue;seen.add(String(row.id));
                found.push({
                  id:String(row.id||'').slice(0,85),
                  fixtureId:String(row.fixtureId||''),
                  market:row.market,marketLabel:row.marketLabel,selection:row.selection,
                  period:row.period,line:row.line,odds:row.odds,bookmaker:row.bookmaker,
                  providerMarket:row.providerMarket,priceSource:row.priceSource,priceStage:row.priceStage,
                  entryMinute:row.minute??row.entryMinute,
                  createdAt:row.createdAt,createdISO:Number.isFinite(Number(row.createdAt))?new Date(Number(row.createdAt)).toISOString():null,
                  entryScore:row.entryScore??row.scoreAt,
                  mirrorScore:row.mirrorScore,finalScore:row.finalScore,
                  result:row.result,status:row.status,settledAt:row.settledAt
                });
              }
              more=j.hasMore===true&&Boolean(j.nextCursor);cur=j.nextCursor||null;
            }
            console.log('SEVILLA_TOMARES_SIGNAL_AUDIT',JSON.stringify({pages,scanned,more,found}));
            for(const row of found){
              if(!row.fixtureId)continue;
              const boardResponse=await fetch('https://www.ball46.com/api/engine/board?audit_fixture='+encodeURIComponent(row.fixtureId),{cache:'no-store',signal:AbortSignal.timeout(20000)});
              const board=await boardResponse.json();
              const f=Array.isArray(board.fixtures)?board.fixtures.find(x=>String(x.fixtureId)===String(row.fixtureId)):null;
              console.log('SEVILLA_TOMARES_BOARD',JSON.stringify({id:row.fixtureId,status:f?.status,statusCode:f?.statusCode,minute:f?.minute,goals:f?.goals,score:f?.score,fullOddsSource:f?.fullOddsSource,found:!!f}));
              break;
            }
          }catch(e){console.log('SEVILLA_TOMARES_AUDIT_ERROR',String(e?.stack||e).slice(0,700))}
          console.log('TARGET_FIXTURE_202465949_RECHECK');

          // Cross-site diagnosis at the time of inspection: public Engine remains read-only.
          try {
            const base='https://www.ball46.com/api/engine',started=Date.now();
            const read=async name=>{
              const r=await fetch(base+'/'+name+'?_incident='+started,{cache:'no-store',signal:AbortSignal.timeout(25000)});
              const v=await r.json();return {status:r.status,...v};
            };
            const [health,board,settings]=await Promise.all([read('health'),read('board'),read('settings')]);
            const bh=board?.fixtures||[];
            const zones={};
            for(const f of bh){
              const st=String(f.status||f.statusCode||f.boardState||'UNKNOWN');
              zones[st]=(zones[st]||0)+1;
            }
            console.log('PENDING_INCIDENT_ENGINE_HEALTH',JSON.stringify({at:new Date().toISOString(),...health}));
            console.log('PENDING_INCIDENT_BOARD',JSON.stringify({at:new Date().toISOString(),http:board.status,ok:board.ok,version:board.version,hubFetchedAt:board.hubFetchedAt,hubAgeMs:board.hubAgeMs,stale:board.stale,staleGuard:board.staleGuard,counts:board.counts,fixtureCount:bh.length,states:zones}));
            console.log('PENDING_INCIDENT_RUNSTATE',JSON.stringify({at:new Date().toISOString(),http:settings.status,version:settings.version,enabledMarkets:Object.entries(settings.runState||{}).filter(([,v])=>v===true).map(([k])=>k)}));
            // Fetch recent ledger pages in newest-first order and compare by result vs status.
            const all=[],ids=new Set(),offset=7*3600000,local=new Date(started+offset);
            let cycleStart=Date.UTC(local.getUTCFullYear(),local.getUTCMonth(),local.getUTCDate(),12)-offset;
            if(started<cycleStart)cycleStart-=86400000;
            const since14=Date.UTC(local.getUTCFullYear(),local.getUTCMonth(),local.getUTCDate(),14)-offset;
            let cursor=null,hasMore=true,pages=0,last=null;
            while(hasMore&&pages<30){
              const url=new URL(base+'/statistics');
              url.searchParams.set('paged','1');
              if(cursor)url.searchParams.set('cursor',cursor);
              url.searchParams.set('_incident',String(started));
              const r=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(30000)});
              const j=await r.json();
              if(!r.ok||j.ok===false)throw Error('LEDGER_FETCH_'+r.status+'_'+(j.error||''));
              last={hasMore:j.hasMore,cursor:!!j.nextCursor,statisticsSource:j.statisticsSource};
              pages++;const rows=Array.isArray(j.rows)?j.rows:[];
              let oldest=Infinity;
              for(const row of rows){
                const created=Number(row?.createdAt);
                if(Number.isFinite(created))oldest=Math.min(oldest,created);
                if(!row?.id||ids.has(String(row.id)))continue;
                ids.add(String(row.id));
                if(Number.isFinite(created)&&created>=cycleStart)all.push(row);
              }
              hasMore=j.hasMore===true&&!!j.nextCursor;cursor=j.nextCursor||null;
              if(!rows.length||oldest<cycleStart)break;
            }
            const group={total:all.length,byStatus:{},byResult:{},byHour:{},oldPending:{over60m:0,over120m:0,over180m:0,over240m:0},since14:{count:0,pending:0,live:0,settled:0},oldPendingExamples:[],finishedButPending:[],unresolved:0,latestCreated:null,oldestCreated:null};
            const byId=new Map(bh.map(f=>[String(f.fixtureId),f]));
            for(const r of all){
              const result=String(r.result||'PENDING').toUpperCase(),status=String(r.status||'PENDING').toUpperCase(),created=Number(r.createdAt),mins=(started-created)/60000;
              const hour=new Date(created+offset).toISOString().slice(11,13)+':00';
              group.byStatus[status]=(group.byStatus[status]||0)+1;group.byResult[result]=(group.byResult[result]||0)+1;
              const p=group.byHour[hour]||(group.byHour[hour]={count:0,pending:0,live:0,settled:0});
              p.count++;
              const pending=(status==='PENDING'||status==='UNRESOLVED'),terminal=['WIN','LOSS','PUSH','HALF_WIN','HALF_LOSS','VOID'].includes(result);
              if(pending)p.pending++;
              if(result==='LIVE')p.live++;
              if(terminal)p.settled++;
              if(created>=since14){
                group.since14.count++;if(pending)group.since14.pending++;if(result==='LIVE')group.since14.live++;if(terminal)group.since14.settled++;
              }
              if(pending){
                if(mins>60)group.oldPending.over60m++;
                if(mins>120)group.oldPending.over120m++;
                if(mins>180)group.oldPending.over180m++;
                if(mins>240)group.oldPending.over240m++;
                if(mins>120&&group.oldPendingExamples.length<15)group.oldPendingExamples.push({id:String(r.id).slice(0,75),fixtureId:r.fixtureId,created:new Date(created).toISOString(),status,result,market:r.market,boardStatus:byId.get(String(r.fixtureId))?.status||null,boardMinute:byId.get(String(r.fixtureId))?.minute??null});
                const f=byId.get(String(r.fixtureId));
                if(f&&/finish|ended|ft|full.?time|after|90|match.?end/i.test(String(f.status||f.statusCode||f.boardState||''))&&group.finishedButPending.length<20){
                  group.finishedButPending.push({id:String(r.id).slice(0,70),fixtureId:r.fixtureId,boardStatus:f.status,status,result});
                }
              }
              if(status==='UNRESOLVED')group.unresolved++;
              group.latestCreated=Math.max(group.latestCreated||0,created);
              group.oldestCreated=Math.min(group.oldestCreated||Infinity,created);
            }
            console.log('PENDING_INCIDENT_LEDGER',JSON.stringify({at:new Date(started).toISOString(),bangkokHour:new Date(started+offset).toISOString().slice(11,16),cycleStart:new Date(cycleStart).toISOString(),since14:new Date(since14).toISOString(),pages,hasMore,last,...group}));
          } catch(err){console.log('PENDING_INCIDENT_ERROR',String(err?.stack||err).slice(0,1700))}

          // Inspect actual runtime Engine code and its last Cloudflare deployments.
          try{
            const readRoot='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers';
            const deployRes=await fetch(readRoot+'/scripts/nomadtips3-engine-343/deployments',{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(18000)});
            const deployJson=await deployRes.json();
            console.log('INCIDENT_DEPLOYMENTS',JSON.stringify({http:deployRes.status,success:deployJson.success,deployments:(deployJson.result?.deployments||[]).slice(0,8).map(v=>({id:v.id,created_on:v.created_on,versions:v.versions,author:v.author,message:v.message,source:v.source}))}));
            const lines=s.split('\n');
            const regexes=[/function periodCompleteForSignal\(/,/function isFinished\(/,/function isLive\(/,/const fixtureMap\s*=/,/function settleMarketSignal\(/,/let reconciled = 0/,/for \(const sig of signals\)/,/for \(const s of signals\)/,/function scanIfDue\(/];
            const found=[];
            for(const re of regexes){
              const ix=lines.findIndex(l=>re.test(l));
              if(ix<0)continue;
              found.push({pattern:String(re),line:ix+1,source:lines.slice(Math.max(0,ix-4),Math.min(lines.length,ix+38)).join('\n').slice(0,6500)});
            }
            console.log('INCIDENT_ACTIVE_SETTLEMENT_CODE',JSON.stringify(found));
            const base='https://www.ball46.com/api/engine';
            const now=Date.now(),offset=7*3600000,local=new Date(now+offset);
            let cycle=Date.UTC(local.getUTCFullYear(),local.getUTCMonth(),local.getUTCDate(),12)-offset;if(now<cycle)cycle-=86400000;
            const [boardResp,ledgerResp]=await Promise.all([
              fetch(base+'/board?incident='+now,{cache:'no-store',signal:AbortSignal.timeout(24000)}),
              fetch(base+'/statistics?paged=1&incident='+now,{cache:'no-store',signal:AbortSignal.timeout(24000)})
            ]);
            const board=await boardResp.json(),ledger=await ledgerResp.json();
            const byId=new Map((board.fixtures||[]).map(f=>[String(f.fixtureId),f]));
            const group={total:0,notYetSettled:0,pendingOnBoardFinished:0,pendingOnBoardLive:0,pendingOnBoardUnknown:0,pendingMissingFromBoard:0,finishedExamples:[],missingExamples:[],liveExamples:[]};
            for(const row of ledger.rows||[]){
              if(Number(row.createdAt)<cycle)continue;
              group.total++;
              if(row.status==='SETTLED')continue;
              group.notYetSettled++;
              const match=byId.get(String(row.fixtureId));
              const mstatus=String(match?.status||match?.statusCode||match?.boardState||'UNKNOWN');
              const mini={fixtureId:row.fixtureId,signalId:String(row.id||'').slice(0,65),status:row.status,result:row.result,market:row.market,matchState:mstatus,matchMinute:match?.minute,entryMinute:row.entryMinute,entryScore:row.entryScore};
              if(!match){group.pendingMissingFromBoard++;if(group.missingExamples.length<8)group.missingExamples.push(mini)}
              else if(/finish|full|ended/i.test(mstatus)){group.pendingOnBoardFinished++;if(group.finishedExamples.length<8)group.finishedExamples.push(mini)}
              else if(/in_play|live|progress/i.test(mstatus)){group.pendingOnBoardLive++;if(group.liveExamples.length<5)group.liveExamples.push(mini)}
              else group.pendingOnBoardUnknown++;
            }
            console.log('INCIDENT_MATCH_SETTLEMENT_CROSSCHECK',JSON.stringify(group));
          }catch(e){console.log('INCIDENT_DEEP_DIAG_ERROR',String(e?.stack||e).slice(0,1400))}

          try {
            const lines=s.split('\n');
            for(const pattern of ['async autoReconcileMissingFinals(', 'autoReconcileMissingFinals(', 'async upsertLedgerRows(', 'async readWorkingSignals(', 'scanIfDue()', 'async scheduled(']){
              const hits=[];for(let i=0;i<lines.length;i++)if(lines[i].includes(pattern))hits.push(i);
              console.log('INCIDENT_FINALIZATION_PATH',JSON.stringify({pattern,hits:hits.slice(0,10).map(i=>({line:i+1,source:lines.slice(Math.max(0,i-4),Math.min(i+65,lines.length)).join('\n').slice(0,12500)}))}));
            }
          }catch(e){console.log('INCIDENT_FINALIZATION_PATH_ERROR',String(e).slice(0,600))}

          try{
            const lines=s.split('\n');
            const keys=['FINAL_RECHECK_MIN_SIGNAL_AGE_MS','FINAL_RECHECK_INTERVAL_MS','FINAL_RECHECK_MAX_PER_SCAN','FINAL_RECHECK_TIMEOUT_MS','FINAL_RECONCILE_VERSION'];
            const list=lines.map((line,index)=>({line,index:index+1})).filter(x=>keys.some(k=>x.line.includes(k))).slice(0,35).map(x=>({line:x.index,code:x.line.slice(0,350)}));
            const ix=lines.findIndex(l=>l.includes('async autoReconcileMissingFinals()'));
            console.log('INCIDENT_FALLBACK_SETTINGS',JSON.stringify({definitions:list,source:ix>=0?lines.slice(ix+58,ix+102).join('\n').slice(0,6000):''}));
          }catch(e){console.log('INCIDENT_FALLBACK_SETTINGS_ERROR',String(e).slice(0,400))}

          // Critical: verify upstream final match data for missing board fixtures, WITHOUT settling or mutating.
          try {
            const key=process.env.FIVEDOLLAR_API_KEY;
            if(!key)throw Error('FIVEDOLLAR_API_KEY_GITHUB_SECRET_NOT_SET');
            for(const fixtureId of ['202465949','202563101','202522856','202465308','201864783']){
              const url='https://api.5dollarfootballapi.com/v1/fixtures/'+fixtureId+'?include=events,stats';
              const res=await fetch(url,{headers:{Authorization:'Bearer '+key,Accept:'application/json'},signal:AbortSignal.timeout(16000),cache:'no-store'});
              let payload=await res.json().catch(()=>({}));
              const d=payload?.data||payload?.fixture||{};
              console.log('PROVIDER_MISSING_FIXTURE_PROBE',JSON.stringify({
