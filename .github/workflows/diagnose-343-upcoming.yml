name: Diagnose NOMAD 3.43 Upcoming

on:
  push:
    branches:
      - work/nomad343-3s-engine-rateguard-20260912
    paths:
      - '.github/workflows/diagnose-343-upcoming.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
      HUB_URL: https://nomadtips3-5usd-hub-343.mccarey-supon.workers.dev
      PREVIEW_URL: https://nomadtips3-343-preview.mccarey-supon.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect Hub, Engine and provider windows
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$HUB_URL/snapshot?diag=$RANDOM" -o /tmp/hub.json
          curl -fsS --max-time 30 "$PREVIEW_URL/api/engine/board?diag=$RANDOM" -o /tmp/board.json
          node - <<'NODE'
          const fs=require('fs');
          const hub=JSON.parse(fs.readFileSync('/tmp/hub.json','utf8'));
          const board=JSON.parse(fs.readFileSync('/tmp/board.json','utf8'));
          const classify=x=>String(x?.boardState??x?.status??'').toLowerCase();
          const count=rows=>rows.reduce((o,x)=>{const k=classify(x)||'blank';o[k]=(o[k]||0)+1;return o;},{});
          const hs=Array.isArray(hub.fixtures)?hub.fixtures:[];
          const bs=Array.isArray(board.fixtures)?board.fixtures:[];
          console.log('HUB_SUMMARY',JSON.stringify({fixtureCount:hub.fixtureCount,counts:hub.counts,computed:count(hs),todayWindow:hub.todayWindow,fastLive:hub.fastLive},null,2));
          console.log('BOARD_SUMMARY',JSON.stringify({fixtureCount:bs.length,computed:count(bs)},null,2));
          NODE
          python - <<'PY'
          import time, datetime, subprocess, json, os
          key=os.environ['FIVEDOLLAR_API_KEY']; now=int(time.time())
          th=datetime.timezone(datetime.timedelta(hours=7)); d=datetime.datetime.now(th)
          b0=d.replace(hour=0,minute=0,second=0,microsecond=0); b1=b0+datetime.timedelta(days=1)
          u=datetime.datetime.now(datetime.timezone.utc); u0=u.replace(hour=0,minute=0,second=0,microsecond=0); u1=u0+datetime.timedelta(days=1)
          windows={
            'BKK_DAY':(int(b0.timestamp()),int(b1.timestamp())),
            'NEXT_24H':(now,now+86400),
            'UTC_DAY':(int(u0.timestamp()),int(u1.timestamp())),
          }
          for name,(start,end) in windows.items():
            url=f'https://api.5dollarfootballapi.com/v1/fixtures?start_time={start}&end_time={end}&status=scheduled&per_page=100&page=1'
            raw=subprocess.check_output(['curl','-fsS','--max-time','30','-H','Accept: application/json','-H',f'Authorization: Bearer {key}',url],text=True)
            j=json.loads(raw); rows=j.get('data',[]); rows=rows if isinstance(rows,list) else []
            p=j.get('pagination') or {}
            print(name,json.dumps({'count_page1':len(rows),'has_more':p.get('has_more'),'first':[(x.get('kickoff_utc'),(x.get('teams') or {}).get('home',{}).get('name'),(x.get('teams') or {}).get('away',{}).get('name')) for x in rows[:5]]},ensure_ascii=False))
          PY
