name: Migrate Car 3 API key to VPS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-car3-key-to-vps.yml"

permissions:
  contents: write

concurrency:
  group: migrate-car3-key-to-vps
  cancel-in-progress: false

jobs:
  encrypt-and-self-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Encrypt the existing key for the VPS
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_FOOTBALL_KEY:-}"
          umask 077
          printf '%s' "$API_FOOTBALL_KEY" \
            | openssl pkeyutl -encrypt -pubin \
                -inkey live-engine-v2/deploy/car3-migration-public.pem \
                -pkeyopt rsa_padding_mode:oaep \
                -pkeyopt rsa_oaep_md:sha256 \
                -pkeyopt rsa_mgf1_md:sha256 \
            | base64 -w0 > live-engine-v2/deploy/car3-key.enc
          test -s live-engine-v2/deploy/car3-key.enc

      - name: Publish ciphertext and remove migration materials
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/migrate-car3-key-to-vps.yml
          git rm live-engine-v2/deploy/car3-migration-public.pem
          git add live-engine-v2/deploy/car3-key.enc
          git commit -m "Stage encrypted Car 3 VPS secret migration [skip ci]"

          for attempt in $(seq 1 20); do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 3
          done
          exit 1
