name: BALL46 PC Sidebar Compact — guarded candidate
on:
  push:
    branches: [fix/ball46-pc-sidebar-spacing-20261024]
    paths:
      - '.github/workflows/b46-pc-sidebar-spacing-candidate.yml'
      - 'deploy-assets/pc-sidebar-spacing-20261024/patch.mjs'
      - 'deploy-assets/pc-sidebar-spacing-20261024/candidate.mjs'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright-core
          node --check deploy-assets/pc-sidebar-spacing-20261024/candidate.mjs
          node deploy-assets/pc-sidebar-spacing-20261024/candidate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-pc-sidebar-preview-${{ github.run_id }}
          path: deploy-assets/pc-sidebar-spacing-20261024/audit/
          retention-days: 21
