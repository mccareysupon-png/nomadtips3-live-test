name: BALL46 board error recovery TEST ONLY
on:
  push:
    branches: [codex/ball46-favorites-test-20261110]
    paths: ['work/board-error-recovery-20261110/verify-request.json']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test failure recovery without network
        run: node work/board-error-recovery-20261110/test.mjs
      - name: Verify actual Production source and build only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node work/board-error-recovery-20261110/verify-current.mjs
      - name: Save test and source verification reports only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/board-error-recovery-20261110/test-results.json work/board-error-recovery-20261110/stage/report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record board recovery test and active-source verification [skip ci]"
          git push origin HEAD:codex/ball46-favorites-test-20261110
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-board-error-recovery-test-only
          path: |
            work/board-error-recovery-20261110/stage
            work/board-error-recovery-20261110/test-results.json
