name: CAR 3.1 Animation V3 Validation

on:
  push:
    branches:
      - feature/car31-animation-v3-goaloo-20260816
    paths:
      - "car3-1-hybrid-live-engine/**"
      - ".github/workflows/car31-animation-v3-test.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run CAR 3.1 regression tests
        working-directory: car3-1-hybrid-live-engine
        run: |
          node --test
          node --check worker/src/index.js
          node --check worker/src/upgrade.js
          node --check worker/src/settlement-v2.js
          node --check worker/src/animation-v3-source.js
          node --check worker/src/main-v3.js
          node --check web/app.js
          node --check web/animation-v3.js
          node --check web/animation-v2.js
