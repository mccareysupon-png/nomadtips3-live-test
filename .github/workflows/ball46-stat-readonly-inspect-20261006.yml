name: Ball46 statistics read-only inspect 20261006

on:
  push:
    branches:
      - ops/ball46-stat-realtime-pending-20261005b
    paths:
      - '.github/workflows/ball46-stat-readonly-inspect-20261006.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect signal commit context without deploy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json,os,urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          api=f'https://api.cloudflare.com/client/v4/accounts/{account}'; worker='nomadtips3-engine-343'
          h={'Authorization':f'Bearer {token}','Accept':'application/json'}
          def getj(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=30) as r: return json.load(r)
          deps=getj(f'{api}/workers/scripts/{worker}/deployments')['result']['deployments']
          active=[str(v['version_id']) for v in (deps[0].get('versions') or []) if v.get('version_id') and float(v.get('percentage',0))>=99.999]
          if len(active)!=1: raise SystemExit('ACTIVE_VERSION_AMBIGUOUS')
          vid=active[0]
          ver=getj(f'{api}/workers/workers/{worker}/versions/{vid}?include=modules')['result']
          m=[x for x in (ver.get('modules') or []) if x.get('name')=='index-bulk-recovery.js' and x.get('content_base64')]
          s=base64.b64decode(m[0]['content_base64']).decode(); lines=s.splitlines()
          print('ACTIVE_VERSION',vid)
          needles=['writeWorkingSignals(this.ctx, capped)','const capped =','let capped =','newSignals','createdSignals','createdAt: now','status: "PENDING"']
          for n in needles:
            hits=[i for i,x in enumerate(lines) if n in x]
            print('\n===',n,'HITS',len(hits),'===')
            for i in hits[:6]:
              a=max(0,i-35); b=min(len(lines),i+45)
              print('\n'.join(f'{j+1}: {lines[j]}' for j in range(a,b)))
              print('---END---')
          PY
