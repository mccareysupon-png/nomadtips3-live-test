name: BALL46 Visitor Monitor final verification (read only)
on:
  push:
    branches: [work/ball46-traffic-intelligence-isolated-20261020]
    paths: ['.github/workflows/ball46-visitor-monitor-final-verification.yml']
permissions:
  contents: read
jobs:
  production-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: traffic-intelligence/isolated-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify actual versions, owner Access, stored metadata and main health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node verify-presence-production.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visitor-monitor-final-production-evidence
          path: traffic-intelligence/isolated-deploy/production-verification/
          retention-days: 30
