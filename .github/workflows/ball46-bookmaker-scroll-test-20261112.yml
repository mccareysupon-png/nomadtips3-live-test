name: BALL46 fresh bookmaker scroll TEST ONLY
on:
  push:
    branches: [test/ball46-bookmaker-scroll-20261112]
    paths: ['work/bookmaker-scroll-fix-20261112/test-request.json']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      B46_COMPONENT_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix work/bookmaker-scroll-fix-20261112 --no-save --package-lock=false playwright@1.56.1
      - name: Reproduce actual Production source and build narrow patch
        run: node work/bookmaker-scroll-fix-20261112/build.mjs
      - name: Desktop and mobile isolated interaction and zero request QA
        env:
          PLAYWRIGHT_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: node work/bookmaker-scroll-fix-20261112/qa.mjs
      - name: Save results only without any Cloudflare credentials or deployment
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/bookmaker-scroll-fix-20261112/qa/*.json work/bookmaker-scroll-fix-20261112/proof.json
          git commit -m "Record isolated bookmaker scroll test results [skip ci]"
          git push origin HEAD:test/ball46-bookmaker-scroll-20261112
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bookmaker-scroll-test-only
          path: work/bookmaker-scroll-fix-20261112/qa
