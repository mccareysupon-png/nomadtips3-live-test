name: BALL46 Snapshot V1 DEPLOY BLOCKER preflight (READ ONLY)
# latest local-preview-tested branch; preflight must BLOCK on unresolved served-asset provenance
# phase-3 provenance audit, whitelist and URL reconciliation
on:
  push:
    branches:
      - work/ball46-performance-snapshot-v1-20261029
    paths:
      - .github/workflows/ball46-snapshot-v1-deploy-preflight-20261029.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation only
        run: node --check isolated-labs/ball46-performance-snapshot-v1/preflight-readonly.mjs
      - name: Inspect deployment provenance, never deploy
        run: node isolated-labs/ball46-performance-snapshot-v1/preflight-readonly.mjs
      - name: Save sanitized preflight result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-snapshot-v1-preflight-readonly
          path: reports/ball46-snapshot-v1-deploy-preflight.json
          retention-days: 7
          if-no-files-found: warn
