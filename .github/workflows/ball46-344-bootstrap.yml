name: Bootstrap Ball46 3.44

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ball46-344-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize isolated Ball46 3.44
        shell: bash
        run: |
          set -euo pipefail
          cat .ball46-bootstrap/part01.txt .ball46-bootstrap/part02.txt .ball46-bootstrap/part03.txt .ball46-bootstrap/part04.txt > /tmp/ball46.b64
          base64 -d /tmp/ball46.b64 > /tmp/ball46.tgz
          tar -xzf /tmp/ball46.tgz -C .
          node --check workers/ball46-344-engine/src/index.js
          node --check ball46-344/app.js
          git config user.name 'Ball46 Bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add ball46-344 workers/ball46-344-engine
          git commit -m 'build isolated Ball46 3.44 platform'
          git push origin HEAD:main
