name: Bootstrap Ball46 3.44

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ball46-344-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize Ball46 3.44 isolated project
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ball46.part1 <<'B64A'

B64A
          cat > /tmp/ball46.part2 <<'B64B'

B64B
          cat /tmp/ball46.part1 /tmp/ball46.part2 | base64 -d > /tmp/ball46.tgz
          tar -xzf /tmp/ball46.tgz -C .
          node --check workers/ball46-344-engine/src/index.js
          node --check ball46-344/app.js
          git config user.name 'Ball46 Bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add ball46-344 workers/ball46-344-engine .github/workflows/ball46-344-deploy.yml
          git commit -m 'build isolated Ball46 3.44 platform'
          git push origin HEAD:main
