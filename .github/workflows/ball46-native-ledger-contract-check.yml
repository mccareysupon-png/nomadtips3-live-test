name: BALL46 native ledger contract check
on:
  push:
    branches: [stage/ball46-multisource-v5-20261017]
    paths: [.github/workflows/ball46-native-ledger-contract-check.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect active source methods without writes
        env:
          CF_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node - <<'NODE'
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ID+'/workers/scripts/nomadtips3-engine-343';
          (async()=>{
            const r=await fetch(url,{headers:{Authorization:'Bearer '+process.env.CF_TOKEN}});
            if(!r.ok)throw Error('HTTP_'+r.status);
            const source=await r.text();
            for(const key of ['async reconcileExternalFinal(','async upsertLedgerRows(','async readWorkingSignals(','async writeWorkingSignals(','/ledger-import']){
              let from=source.indexOf(key);
              console.log('SOURCE_SECTION',key,'OFFSET',from);
              if(from<0)continue;
              const chunk=source.slice(Math.max(0,from-80),from+3800);
              console.log('SOURCE_EXCERPT',key,chunk.replace(/['"][A-Za-z0-9_-]{35,}['"]/g,'[REDACTED]'));
            }
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
