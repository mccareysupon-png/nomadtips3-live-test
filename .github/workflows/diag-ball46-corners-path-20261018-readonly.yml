name: READ ONLY BALL46 Corners Detection and Settlement 20261018
on:
  push:
    branches: [repair/ball46-5usd-corners-only-20261018]
    paths: ['.github/workflows/diag-ball46-corners-path-20261018-readonly.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  corners:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Inspect native 5USD Corners only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const urls={
            engineBoard:'https://nomadtips3-engine-343.mccarey-supon.workers.dev/board',
            engineSettings:'https://nomadtips3-engine-343.mccarey-supon.workers.dev/settings',
            engineSignals:'https://nomadtips3-engine-343.mccarey-supon.workers.dev/signals',
            engineHealth:'https://nomadtips3-engine-343.mccarey-supon.workers.dev/health',
            ledgerHealth:'https://nomadtips3-engine-343.mccarey-supon.workers.dev/ledger-health',
            hubSnapshot:'https://nomadtips3-5usd-hub-343.mccarey-supon.workers.dev/snapshot'
          };
          async function read(name,url){
           try{
            const r=await fetch(url+'?corner_audit='+Date.now(),{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(18000)});
            const j=await r.json(); return {status:r.status,data:j};
           }catch(e){return {status:0,error:String(e.message)}}
          }
          const d=Object.fromEntries(await Promise.all(Object.entries(urls).map(async([k,u])=>[k,await read(k,u)])));
          const value=k=>d[k]?.data||{};
          const b=value('engineBoard'), hub=value('hubSnapshot'), run=value('engineSettings');
          const markets=['ft_corner_over','ft_corner_under','ht_corner_over','ht_corner_under','ft_corner_ah'];
          const live=(b.fixtures||[]).filter(f=>String(f.boardState||f.status||'').toLowerCase().includes('live'));
          const states={};const samples={};const fresh={};
          for(const m of markets){states[m]={};samples[m]=[];fresh[m]=0;for(const f of live){
           const a=f.analysis?.[m]||{},stage=a.state||'NO_ANALYSIS';
           states[m][stage]=(states[m][stage]||0)+1;
           if(stage==='PASS')fresh[m]++;
           if(samples[m].length<12&&stage!=='STOP')samples[m].push({id:f.fixtureId,minute:f.minute,stage,line:a.line??null,odds:a.odds??null,source:a.priceSource??null,entryCorners:f.corners??null,priceError:a.reason??a.error??null});
          }}
          const all=value('engineSignals').signals||[];
          const corner=all.filter(x=>markets.includes(x.market));
          const hm=new Set((hub.fixtures||[]).map(f=>String(f.fixtureId)));
          const pend=corner.map(s=>({fixtureId:s.fixtureId,market:s.market,status:s.status,result:s.result||null,
           at:s.createdAt?new Date(s.createdAt).toISOString():null,inHub:hm.has(String(s.fixtureId)),
           finalCorners:s.finalCorners||null,entryCorners:s.entryCorners||null,
           settlementError:s.settlementError||null}));
          const info={checkedAt:new Date().toISOString(),endpoints:Object.fromEntries(Object.entries(d).map(([k,v])=>[k,{http:v.status,error:v.error||null,ok:v.data?.ok,version:v.data?.version}])),
           hub:{counts:hub.counts,lastError:hub.lastError||null,stale:hub.stale,ageMs:hub.ageMs},
           engine:{lastError:value('engineHealth').lastError||null,refereeErrors:(value('engineHealth').refereeErrors||[]).slice(0,5),
           runState:b.runState??run.run??run.runState??run.running??null,
           activeKeys:Object.keys(run),sampleCount:live.length},
           detection:{states,samples},cornerSignals:pend,ledger:{total:value('ledgerHealth').ledgerTotal,settled:value('ledgerHealth').settledTotal,pending:value('ledgerHealth').pendingTotal}};
          console.log('BALL46_CORNER_PRODUCTION_READONLY '+JSON.stringify(info).slice(0,28000));
          NODE
      - name: Inspect active native Corners code and settlement guards
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const deployment=await(await fetch(base+'/workers/scripts/nomadtips3-engine-343/deployments?per_page=1',{headers})).json();
          if(!deployment.success)throw Error('DEPLOYMENT_READ_FAILED');
          const id=deployment.result.deployments?.[0]?.versions?.[0]?.version_id;
          if(!id)throw Error('ACTIVE_VERSION_MISSING');
          const v=await(await fetch(base+'/workers/workers/nomadtips3-engine-343/versions/'+id+'?include=modules',{headers})).json();
          if(!v.success)throw Error('SOURCE_READ_FAILED');
          const code=Buffer.from(v.result.modules.find(m=>m.name===v.result.main_module).content_base64,'base64').toString();
          const terms=['BALL46_CORNER_TICK_REQUESTS_PER_SCAN','BALL46_CORNER_TICK_MAX_AGE_MS','CORNER_HISTORY_BUDGET','CORNER_LIVE_PRICE_UNVERIFIED','function fetchVerifiedCornerOnly','async function fetchVerifiedCornerOnly','async reconcileExternalFinal','status = "UNRESOLVED"','status === "PENDING"','FINAL_RECHECK_MIN_SIGNAL_AGE_MS'];
          const spots=Object.fromEntries(terms.map(t=>{const at=code.indexOf(t);return[t,{present:at>=0,snippet:at>=0?code.slice(Math.max(0,at-100),Math.min(code.length,at+340)):null}]}));
          console.log('NATIVE_CORNER_SOURCE_READONLY '+JSON.stringify({version:id,main:v.result.main_module,spots}).slice(0,9000));
          NODE
      - name: Inspect precise native corner and final recovery code safely
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID;
          const h={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const dep=await(await fetch(base+'/workers/scripts/nomadtips3-engine-343/deployments?per_page=1',{headers:h})).json();
          const id=dep.result.deployments[0].versions[0].version_id;
          const v=await(await fetch(base+'/workers/workers/nomadtips3-engine-343/versions/'+id+'?include=modules',{headers:h})).json();
          if(!v.success)throw Error('READ_FAILED');
          const code=Buffer.from(v.result.modules.find(m=>m.name===v.result.main_module).content_base64,'base64').toString('utf8');
          const targets=['function isVerifiedCornerMarket','function verifyRecentCornerHistory','async function fetchVerifiedCornerOnly','async scan() {','CORNER_HISTORY_BUDGET','async function runFinalRecheck','async finalRecheck','FINAL_RECHECK_MAX_PER_SCAN','FINAL_RECHECK_STATE_KEY','FINAL_DATA_UNAVAILABLE','async reconcileExternalFinal','missing-final-direct-v1','const refereeRotationOffset'];
          for(const term of targets) {
           const at=code.indexOf(term);
           if(at<0) {console.log('CORNER_REPAIR_SOURCE '+JSON.stringify({term,missing:true}));continue}
           const start=Math.max(0,at-(term.includes('FINAL_')?800:250)),end=Math.min(code.length,at+(term==='FINAL_RECHECK_STATE_KEY'?3500:term==='FINAL_DATA_UNAVAILABLE'?2600:term==='async scan() {'?3700:term==='CORNER_HISTORY_BUDGET'?3000:term==='missing-final-direct-v1'?2500:2000));
           let fragment=code.slice(start,end).replace(/Bearer\s+[A-Za-z0-9_\-]+/g,'Bearer [REDACTED]');
           console.log('CORNER_REPAIR_SOURCE '+JSON.stringify({term,at,fragment}).slice(0,4800));
          }
          NODE
