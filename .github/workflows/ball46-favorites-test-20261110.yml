name: BALL46 Favorites browser-only TEST
on:
  push:
    branches: [codex/ball46-favorites-test-20261110]
    paths: ['work/favorites-test-20261110/test-request.json']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare only browser overlay from current captured Production
        run: |
          node work/favorites-test-20261110/prepare.mjs
          node --check work/favorites-test-20261110/candidate/dashboard.js
          node --check work/favorites-test-20261110/candidate/workspace.js
          node --check work/favorites-test-20261110/favorites.js
      - name: Install isolated browser
        run: |
          npm install --no-save --package-lock=false --prefix work/favorites-test-20261110 playwright@1.56.1
          cd work/favorites-test-20261110 && npx playwright install --with-deps chromium
      - name: PC mobile dark light star navigation refresh history and score tests
        run: node work/favorites-test-20261110/browser-test.mjs
      - name: Save only test evidence; no Cloudflare token in this workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/favorites-test-20261110/qa/*.json work/favorites-test-20261110/candidate/boundary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Favorites test-only navigation and persistence checks [skip ci]"
          git push origin HEAD:codex/ball46-favorites-test-20261110
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-favorites-test-proof
          path: |
            work/favorites-test-20261110/qa
            work/favorites-test-20261110/candidate/boundary.json