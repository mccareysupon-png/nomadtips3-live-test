name: BALL46 hide statistics filter cards test only
on:
  push:
    branches: [test/ball46-stats-clean-filters-20261120]
    paths: ['.github/workflows/stats-clean-test-20261120.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy isolated test only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --check qa/stats-clean-filters-20261120/worker.mjs
          cat > qa/stats-clean-filters-20261120/wrangler.toml <<'EOF'
          name = "ball46-stats-clean-filters-test-20261120"
          main = "worker.mjs"
          compatibility_date = "2026-11-20"
          workers_dev = true
          preview_urls = false
          [[services]]
          binding = "B46_PRODUCTION_READ"
          service = "ball46-production"
          EOF
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';import {writeFile} from 'node:fs/promises';
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/ball46-production/deployments?per_page=1',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});const j=await r.json();assert(j.success);await writeFile(process.env.RUNNER_TEMP+'/prod-before.json',JSON.stringify(j.result.deployments[0].versions));
          EOF
          npx --yes wrangler@4.50.0 deploy --config qa/stats-clean-filters-20261120/wrangler.toml --name ball46-stats-clean-filters-test-20261120
      - name: Verify all eight markets desktop and mobile
        run: |
          npm install --prefix qa/stats-clean-filters-20261120/.runtime --no-audit --no-fund playwright@1.55.0
          qa/stats-clean-filters-20261120/.runtime/node_modules/.bin/playwright install chromium --only-shell
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';import {createRequire} from 'node:module';
          const {chromium,devices}=createRequire(process.cwd()+'/qa/stats-clean-filters-20261120/.runtime/package.json')('playwright');
          const base='https://ball46-stats-clean-filters-test-20261120.mccarey-supon.workers.dev';
          let health;for(let i=0;i<15;i++){try{const r=await fetch(base+'/_stats_clean_health');if(r.ok){health=await r.json();break}}catch{}await new Promise(r=>setTimeout(r,2000))}
          assert.equal(health?.scope,'TEST_ONLY_CSS_FILTER_CARDS');assert.equal(health?.gap,12);assert.equal((await fetch(base+'/_stats_clean_health',{method:'POST'})).status,405);
          const browser=await chromium.launch();try{for(const mobile of [false,true]){
          const p=await browser.newPage(mobile?{...devices['iPhone 13'],serviceWorkers:'block'}:{viewport:{width:1440,height:950},serviceWorkers:'block'});
          await p.route('**/*',r=>['GET','HEAD'].includes(r.request().method())?r.continue():r.abort());
          await p.goto(base+'/index.html?view=statistics',{waitUntil:'domcontentloaded'});
          await p.waitForFunction(()=>[...document.querySelectorAll('[data-sp-table-body] tr')].some(r=>r.cells.length>=4),null,{timeout:90000});
          for(const market of ['all','1x2','ah','ou','btts','corners','cards','other']){
          if(!mobile)await p.locator('[data-stat-market="'+market+'"]').first().click();
          else if(market!=='all'){await p.locator('[data-stat-market="'+market+'"]').first().evaluate(e=>e.click())}
          await p.waitForFunction(m=>document.querySelector('[data-stat-market].active')?.dataset.statMarket===m&&document.querySelector('#b46-finance-chart-card')?.getBoundingClientRect().height>0&&document.querySelector('.sp-results')?.getBoundingClientRect().height>0,market,{timeout:15000});await p.waitForTimeout(1400);
          const proof=await p.evaluate(()=>({filters:[...document.querySelectorAll('.sp-stats-content > section.sp-filters')].map(e=>({display:getComputedStyle(e).display,rects:e.getClientRects().length})),graph:!!document.querySelector('#b46-finance-chart-card'),gap:document.querySelector('.sp-results').getBoundingClientRect().top-document.querySelector('#b46-finance-chart-card').getBoundingClientRect().bottom,rows:[...document.querySelectorAll('[data-sp-table-body] tr')].filter(r=>r.cells.length>=4).length,active:document.querySelector('[data-stat-market].active')?.dataset.statMarket}));
          console.log('FILTER_HIDE_PASS '+JSON.stringify({mobile,market,...proof}));assert.equal(proof.filters.length,2);assert(proof.filters.every(x=>x.display==='none'&&x.rects===0),'FILTER_STILL_VISIBLE');assert(proof.graph,'STATS_GRAPH_MISSING');assert.equal(proof.active,market);assert(Math.abs(proof.gap-12)<=1,'GRAPH_HISTORY_GAP');
          }await p.close()
          }}finally{await browser.close()}
          EOF
      - name: Confirm Production unchanged
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';import {readFile} from 'node:fs/promises';
          const before=await readFile(process.env.RUNNER_TEMP+'/prod-before.json','utf8');const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/ball46-production/deployments?per_page=1',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});const j=await r.json();assert(j.success);assert.deepEqual(j.result.deployments[0].versions,JSON.parse(before));console.log('PRODUCTION_UNCHANGED')
          EOF
