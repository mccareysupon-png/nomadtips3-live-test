name: BALL46 Statistics Mobile 7x2 — Verify Live Production Browser
on:
  push:
    branches: [codex/ball46-stats-mobile-14-kpi-7x2-prod-20261020]
    paths:
      - '.github/workflows/ball46-stats-mobile-14kpi-live-browser-20261020.yml'
      - 'deploy-assets/stats-mobile-v1-preview-20261020/audit-live-mobile14.mjs'
permissions:
  contents: read
jobs:
  read-only-browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Browser; check read-only script
        working-directory: deploy-assets/stats-mobile-v1-preview-20261020
        run: |
          node --check audit-live-mobile14.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
      - name: Verify real ball46.com mobile 7x2 and preserved PC
        working-directory: deploy-assets/stats-mobile-v1-preview-20261020
        run: node audit-live-mobile14.mjs
      - name: Publish screenshots and live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-mobile-stats-7x2-real-production-browser-proof
          path: deploy-assets/stats-mobile-v1-preview-20261020/audit/live/
          retention-days: 30
          if-no-files-found: warn
