name: BALL46 approved 5s cached live screen display release
on:
  push:
    branches: [codex/ball46-screen-refresh-5s-20261104]
    paths: ['work/screen-refresh-5s-20261104/release-request.json']
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install source parsing and browser verification
        run: |
          npm install --no-save --package-lock=false --prefix work/screen-refresh-5s-20261104 acorn@8.15.0 parse5@7.3.0 playwright@1.56.1
          cd work/screen-refresh-5s-20261104 && npx playwright install --with-deps chromium
      - name: Verify exact already-tested patch and isolated cache contracts
        run: |
          node work/screen-refresh-5s-20261104/build.mjs
          node work/screen-refresh-5s-20261104/tests.mjs
          node --check work/screen-refresh-5s-20261104/release.mjs
      - name: Fresh Production capture and non-traffic candidate with all current modules and assets
        run: node work/screen-refresh-5s-20261104/release.mjs stage
      - name: Verify current Production PC and mobile with real match data
        run: node work/screen-refresh-5s-20261104/release-browser.mjs baseline
      - name: Verify candidate PC and mobile, real cache-only 5s cadence, scores and resource hashes
        run: node work/screen-refresh-5s-20261104/release-browser.mjs candidate
      - name: Activate explicitly owner-approved display patch only
        run: node work/screen-refresh-5s-20261104/release.mjs activate
      - name: Verify Production PC and mobile after activation
        run: node work/screen-refresh-5s-20261104/release-browser.mjs production
      - name: Restore immediate baseline on post-activation verification failure
        if: failure()
        run: node work/screen-refresh-5s-20261104/release-rollback.mjs
      - name: Preserve release evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/screen-refresh-5s-20261104/release-audit/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record guarded 5s live display release and preserved services [skip ci]"
          git push origin HEAD:codex/ball46-screen-refresh-5s-20261104
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-refresh-5s-release-proof
          path: work/screen-refresh-5s-20261104/release-audit
