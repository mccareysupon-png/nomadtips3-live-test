name: BALL46 spacing audit recovery - read only
on:
  push:
    branches: [codex/ball46-kit-spacing-20261030]
    paths: ['deploy-assets/kit-spacing-20261030/audit-request.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: kit-spacing-41013134195
          run-id: '41013134195'
          github-token: ${{ github.token }}
          path: deploy-assets/kit-spacing-20261030/audit
      - name: Verify existing deployment without writes
        working-directory: deploy-assets/kit-spacing-20261030
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node recover-audit.mjs
      - name: Save recovered audit
        working-directory: deploy-assets/kit-spacing-20261030
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/*.json
          git commit -m "Recover successful jersey spacing release audit [skip ci]"
          git fetch origin codex/ball46-kit-spacing-20261030
          git rebase FETCH_HEAD
          git push origin HEAD:codex/ball46-kit-spacing-20261030
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spacing-recovery-${{ github.run_id }}
          path: deploy-assets/kit-spacing-20261030/audit
