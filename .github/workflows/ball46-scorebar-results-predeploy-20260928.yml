name: READ ONLY - Ball46 Scorebar Results Predeploy 20260928
on:
  push:
    branches:
      - work/ball46-scorebar-results-20260928
    paths:
      - '.github/scripts/ball46_scorebar_results_predeploy_20260928.sh'
      - '.github/workflows/ball46-scorebar-results-predeploy-20260928.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify scorebar result candidate without deploy
        run: bash .github/scripts/ball46_scorebar_results_predeploy_20260928.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-scorebar-results-predeploy-${{ github.run_id }}
          path: /tmp/b46-scorebar-result-predeploy
          if-no-files-found: ignore
          retention-days: 30
