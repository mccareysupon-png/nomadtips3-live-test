name: BALL46 sidebar Win Rate instant Receiver hydrate isolated test 20261121
on:
  push:
    branches: [test/ball46-sidebar-winrate-20261121]
    paths:
      - '.github/workflows/ball46-sidebar-winrate-test-20261121.yml'
      - 'qa/sidebar-winrate-20261121/sidebar-hydrator.mjs'
      - 'qa/sidebar-winrate-20261121/worker.mjs'
      - 'qa/sidebar-winrate-20261121/wrangler.toml'
      - 'qa/sidebar-winrate-20261121/verify.mjs'
permissions:
  contents: read
  statuses: write
concurrency:
  group: ball46-sidebar-winrate-test-20261121
  cancel-in-progress: false
jobs:
  test-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check isolated code
        run: |
          node --check qa/sidebar-winrate-20261121/sidebar-hydrator.mjs
          node --check qa/sidebar-winrate-20261121/worker.mjs
          node --check qa/sidebar-winrate-20261121/verify.mjs
      - name: Deploy independent test Worker only
        run: npx --yes wrangler@4.50.0 deploy --config qa/sidebar-winrate-20261121/wrangler.toml --name ball46-sidebar-winrate-test-20261121
      - name: Install browser QA
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Verify summary rates before click across desktop, mobile and reload
        run: |
          mkdir -p sidebar-audit
          node qa/sidebar-winrate-20261121/verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-sidebar-winrate-hydration-proof-${{ github.run_id }}
          path: sidebar-audit
          if-no-files-found: warn
          retention-days: 14
