name: BALL46 memory existing logs READ ONLY
on:
  push:
    branches: [codex/ball46-favorites-test-20261110]
    paths: ['work/engine-memory-diagnosis-20261110/log-request.json']
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Query existing Engine logs without calling Engine
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node work/engine-memory-diagnosis-20261110/read-existing-logs.mjs
      - name: Save sanitized log report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/engine-memory-diagnosis-20261110/existing-logs-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record sanitized existing memory error telemetry [skip ci]"
          git push origin HEAD:codex/ball46-favorites-test-20261110
