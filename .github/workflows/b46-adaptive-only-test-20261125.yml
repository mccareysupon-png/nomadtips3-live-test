name: BALL46 TEST Adaptive 2.5 only
on:
  push:
    branches: [fix/ball46-adaptive-only-test-20261125]
    paths: [.github/workflows/b46-adaptive-only-test-20261125.yml]
permissions: {contents: read}
concurrency:
  group: ball46-prematch-only-test-20261120
  cancel-in-progress: false
jobs:
  deploy-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Deploy and verify Adaptive-only scheduling on the TEST Worker
        run: node qa/prematch-history-20261120/deploy-adaptive-only-test-20261125.mjs
