name: NOMADTIPS3 Selected Matches Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-selected-matches.yml'
      - '.github/scripts/refresh_live_selected.py'
      - 'selected-live-matches.json'
  schedule:
    - cron: '*/5 * 4-5 8 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nomadtips3-selected-matches-live
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      DETAIL_REFRESH: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh selected scores
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_FOOTBALL_KEY:-}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python3 .github/scripts/refresh_live_selected.py

          git add live-data-*.json live-matches.json result-feed.json
          if git diff --cached --quiet; then
            echo 'No score or status change.'
            exit 0
          fi

          git commit -m "Live score refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pushed=0
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              pushed=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          test "$pushed" -eq 1
