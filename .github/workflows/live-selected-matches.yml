name: NOMADTIPS3 Selected Matches Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-selected-matches.yml'
      - '.github/scripts/refresh_live_selected.py'
      - 'selected-live-matches.json'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nomadtips3-selected-matches-live
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh selected scores frequently while live
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_FOOTBALL_KEY:-}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for cycle in $(seq 0 7); do
            if (( cycle % 4 == 0 )); then
              export DETAIL_REFRESH=1
            else
              export DETAIL_REFRESH=0
            fi

            refreshed=0
            for attempt in 1 2 3; do
              if python3 .github/scripts/refresh_live_selected.py; then
                refreshed=1
                break
              fi
              echo "Live refresh attempt ${attempt} failed; retrying automatically."
              sleep $((attempt * 5))
            done
            test "$refreshed" -eq 1

            git add selected-live-matches.json live-data-*.json live-matches.json result-feed.json
            if ! git diff --cached --quiet; then
              git commit -m "Live score refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              pushed=0
              for attempt in 1 2 3; do
                if git pull --rebase origin main && git push origin main; then
                  pushed=1
                  break
                fi
                git rebase --abort 2>/dev/null || true
                sleep 2
              done
              test "$pushed" -eq 1
            fi

            active=$(python3 -c "import json; print(json.load(open('/tmp/nomad-live-state.json'))['active'])")
            live=$(python3 -c "import json; print(json.load(open('/tmp/nomad-live-state.json'))['live'])")
            next=$(python3 -c "import json; v=json.load(open('/tmp/nomad-live-state.json'))['next_kickoff_seconds']; print(-1 if v is None else int(v))")

            if [ "$active" -eq 0 ]; then
              echo 'All selected matches are settled.'
              break
            fi

            if [ "$live" -eq 0 ] && { [ "$next" -lt 0 ] || [ "$next" -gt 900 ]; }; then
              echo 'No live match or kickoff within fifteen minutes.'
              break
            fi

            if [ "$cycle" -lt 7 ]; then
              sleep 30
            fi
          done

      - name: Queue the next refresh while matches remain active
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE=/tmp/nomad-live-state.json
          if [ ! -f "$STATE" ]; then
            echo 'No live state file; cron will retry.'
            exit 0
          fi

          active=$(python3 -c "import json; print(json.load(open('$STATE'))['active'])")
          live=$(python3 -c "import json; print(json.load(open('$STATE'))['live'])")
          next=$(python3 -c "import json; v=json.load(open('$STATE'))['next_kickoff_seconds']; print(-1 if v is None else int(v))")

          if [ "$active" -le 0 ]; then
            echo 'All selected matches are settled; refresh chain stopped.'
            exit 0
          fi

          if [ "$live" -eq 0 ] && { [ "$next" -lt 0 ] || [ "$next" -gt 900 ]; }; then
            sleep 240
          fi

          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/live-selected-matches.yml/dispatches" \
            -d '{"ref":"main"}'
