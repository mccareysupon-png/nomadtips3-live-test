# KING_DEFAULT_40_188_ACTIVATED_2026-09-04
name: The King — 07:00 Selection Wheel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/the_king_engine_default.py'
      - '.github/scripts/the_king_engine_v10.py'
      - '.github/workflows/the-king-selection.yml'
      - '.github/workflows/the-king-settlement.yml'
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: the-king-selection-wheel-default-40-188
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install scraper dependencies
        run: python3 -m pip install --disable-pip-version-check requests beautifulsoup4 playwright

      - name: Default engine self-test
        run: |
          python3 .github/scripts/the_king_engine_v10.py self-test
          python3 .github/scripts/the_king_engine_default.py self-test

      - name: Run Thailand selection — Goaloo default 40% / 1.88
        shell: bash
        run: |
          set -euo pipefail
          TARGET_DATE="$(TZ=Asia/Bangkok date +%F)"
          echo 'Using persistent owner default: confidence>=40%, odds>=1.88, odds<=3.00, recent>=8/team, non-draw, unlimited qualified picks.'
          python3 .github/scripts/the_king_engine_default.py select --date "$TARGET_DATE"

      - name: Publish The King feed and health state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add the-king-feed.json the-king-state.json
          if git diff --cached --quiet; then
            echo 'No The King default selection-state change.'
            exit 0
          fi
          git commit -m "The King default 40-188 Goaloo selection $(TZ=Asia/Bangkok date +%F)"
          for attempt in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
