name: The King — 07:00 Selection Wheel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/the_king_engine_v9.py'
      - '.github/workflows/the-king-selection.yml'
      - '.github/workflows/the-king-settlement.yml'
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: the-king-selection-wheel-v9
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install scraper dependencies
        run: python3 -m pip install --disable-pip-version-check requests beautifulsoup4 playwright

      - name: Engine self-test
        run: python3 .github/scripts/the_king_engine_v9.py self-test

      - name: Run 07:00 Thailand selection — Goaloo + Manual Set 2
        shell: bash
        run: |
          set -euo pipefail
          TARGET_DATE="$(TZ=Asia/Bangkok date +%F)"
          python3 .github/scripts/the_king_engine_v9.py select --date "$TARGET_DATE"

      - name: Publish The King feed and health state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add the-king-feed.json the-king-state.json
          if git diff --cached --quiet; then
            echo 'No The King selection-state change.'
            exit 0
          fi
          git commit -m "The King Goaloo Manual Set2 selection $(TZ=Asia/Bangkok date +%F)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
