name: Ball46 Statistics Realtime V2 Static QA 20261006

on:
  push:
    branches:
      - ops/ball46-stat-realtime-pending-v2-20261006
    paths:
      - '.github/scripts/ball46_stat_realtime_pending_v2_patch_20261006.py'
      - '.github/workflows/ball46-stat-realtime-v2-static-qa-20261006.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ball46-stat-realtime-pending-v2-20261006
          fetch-depth: 1

      - name: Fetch exact current Production source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b46-v2
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']; token=os.environ['CLOUDFLARE_API_TOKEN']
          api=f'https://api.cloudflare.com/client/v4/accounts/{account}'; worker='nomadtips3-engine-343'
          h={'Authorization':f'Bearer {token}','Accept':'application/json'}
          def getj(u):
            with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=30) as r: return json.load(r)
          deps=getj(f'{api}/workers/scripts/{worker}/deployments')['result']['deployments']
          active=[str(v['version_id']) for v in (deps[0].get('versions') or []) if v.get('version_id') and float(v.get('percentage',0))>=99.999]
          if active!=['c4174e9b-50ab-4e15-a7f5-6ef637fb6599']:
            raise SystemExit('PRODUCTION_VERSION_MOVED:'+repr(active))
          ver=getj(f'{api}/workers/workers/{worker}/versions/{active[0]}?include=modules')['result']
          target=[m for m in (ver.get('modules') or []) if m.get('name')=='index-bulk-recovery.js' and m.get('content_base64')]
          if len(target)!=1: raise SystemExit('SOURCE_MODULE_MISSING')
          raw=base64.b64decode(target[0]['content_base64'])
          sha=hashlib.sha256(raw).hexdigest()
          if sha!='5805e5eac5833a3e6fae38e4f2d1665d90d0943856535e8216f07b73d94aacb9':
            raise SystemExit('PRODUCTION_SOURCE_MOVED:'+sha)
          pathlib.Path('/tmp/b46-v2/before.js').write_bytes(raw)
          print('PRODUCTION_LOCK_OK',active[0],sha)
          PY

      - name: Apply V2 patch and verify surgical scope
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ball46_stat_realtime_pending_v2_patch_20261006.py /tmp/b46-v2/before.js /tmp/b46-v2/after.js
          node --check /tmp/b46-v2/after.js
          python3 - <<'PY'
          from pathlib import Path
          import difflib,re
          a=Path('/tmp/b46-v2/before.js').read_text().splitlines()
          b=Path('/tmp/b46-v2/after.js').read_text().splitlines()
          diff=list(difflib.unified_diff(a,b,fromfile='before.js',tofile='after.js',lineterm=''))
          print('\n'.join(diff))
          added=[x[1:] for x in diff if x.startswith('+') and not x.startswith('+++')]
          removed=[x[1:] for x in diff if x.startswith('-') and not x.startswith('---')]
          if removed:
            raise SystemExit('V2_PATCH_MUST_NOT_REMOVE_EXISTING_LINES:'+repr(removed[:20]))
          required=[
            'const realtimePendingNewRows = []; // realtime-pending-v2-new-only',
            'realtimePendingNewRows.push(sig);',
            'if (realtimePendingNewRows.length) {',
            'await this.upsertLedgerRows(realtimePendingNewRows, fixtureMap);'
          ]
          text='\n'.join(b)
          for x in required:
            if x not in text: raise SystemExit('V2_WIRING_MISSING:'+x)
          # Guard protected subsystems byte-for-byte by anchored blocks.
          before='\n'.join(a); after='\n'.join(b)
          guards=[
            ('REFEREE','if (u.pathname === "/referee" && request.method === "GET") {','if (u.pathname === "/fixture-odds" && request.method === "GET") {'),
            ('STAT_RESPONSE','async statisticsLedgerResponse(cursor = null, paged = false) {','async scan() {'),
            ('EXTERNAL_FINAL','async reconcileExternalFinal(request) {','  async fetch(request) {')
          ]
          for name,start,end in guards:
            def block(s):
              i=s.find(start); j=s.find(end,i)
              if i<0 or j<0: raise SystemExit(name+'_ANCHOR_MISSING')
              return s[i:j]
            if block(before)!=block(after): raise SystemExit(name+'_CHANGED')
          print('SURGICAL_SCOPE_PASS')
          print('NO_PRESENTATION_CHANGE_PASS')
          print('NO_SETTLEMENT_CHANGE_PASS')
          print('NO_REFEREE_CHANGE_PASS')
          PY
