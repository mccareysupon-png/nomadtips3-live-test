name: Soccer Predictions Forebet Enrich (Manual Diagnostic)

# Forebet returns HTTP 403 to GitHub-hosted runners. Keep this workflow manual-only
# for diagnostics; normal Selected Matches enrichment is supplied through reviewed
# source data and must never attempt to bypass Forebet access controls.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soccer-predictions-forebet-enrich
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install isolated dependencies
        run: python -m pip install -r soccer-predictions/semi-auto/requirements.txt

      - name: Diagnostic only — never publish
        run: |
          echo "Manual diagnostic only. Forebet returned HTTP 403 to GitHub-hosted runners on 2026-08-29."
          echo "No Selected Matches, NOMAD Picks, Statistics, or Live files will be written."
