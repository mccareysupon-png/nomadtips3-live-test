name: Restore Ball46 Missing Signal Scorebar 20260926

on:
  push:
    branches: [work/ball46-scorebar-below-workspace-prod-safe-20260926]
    paths:
      - '.github/workflows/restore-ball46-missing-scorebar-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  restore-missing-scorebar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Mirror exact current Production and prove scorebar is missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod /tmp/rollback
          fetch_required(){
            name="$1"; safe="${name//\//_}"
            code=$(curl -sS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 -o "/tmp/prod/$safe" -w '%{http_code}' "$BALL46_WORKER/$name?signal-scorebar-restore=${GITHUB_RUN_ID}") || true
            [ "$code" = 200 ] || { echo "PROD_ASSET_HTTP_${code}:$name"; exit 1; }
            test -s "/tmp/prod/$safe"
            mkdir -p "$(dirname "nomad-live-343/$name")"
            cp "/tmp/prod/$safe" "nomad-live-343/$name"
          }
          fetch_required index.html
          python3 - <<'PY' > /tmp/index-assets.txt
          from pathlib import Path
          import re
          h=Path('nomad-live-343/index.html').read_text(errors='ignore')
          found=set()
          for x in re.findall(r'''(?:src|href)=["']([^"']+)["']''',h,re.I):
              x=x.split('?',1)[0].split('#',1)[0].strip().lstrip('./').lstrip('/')
              if x and '://' not in x and re.search(r'\.(?:js|css|svg|json|png|webp|jpg|jpeg|ico)$',x,re.I): found.add(x)
          print('\n'.join(sorted(found)))
          PY
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ "$f" = "ball46-scorebar-below-workspace-20260926.js" ] && continue
            fetch_required "$f"
          done < /tmp/index-assets.txt
          grep -Fq 'BALL46_SCOREBAR_BELOW_WORKSPACE_20260926' nomad-live-343/index.html
          grep -Fq 'BALL46_STABLE_CARD_REFRESH_20260926' nomad-live-343/dashboard-v2-stage3.js
          grep -Fq 'const COLLAPSED_LIMIT=10;' nomad-live-343/dashboard-v2-stage3.js
          code=$(curl -sS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 -o /tmp/prod-scorebar-before.js -w '%{http_code}' "$BALL46_WORKER/ball46-scorebar-below-workspace-20260926.js?signal-scorebar-before=${GITHUB_RUN_ID}") || true
          [ "$code" = 404 ] || { echo "EXPECTED_SCOREBAR_404_GOT_${code}"; exit 1; }
          touch /tmp/rollback/scorebar.was-absent
          sha256sum nomad-live-343/index.html > /tmp/rollback/index.sha256
          sha256sum nomad-live-343/dashboard-v2-stage3.js > /tmp/rollback/dashboard.sha256
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?signal-scorebar-before=${GITHUB_RUN_ID}" -o /tmp/board-before.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?signal-scorebar-before=${GITHUB_RUN_ID}" -o /tmp/signals-before.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/statistics?signal-scorebar-before=${GITHUB_RUN_ID}" -o /tmp/stats-before.json
          node -e "const fs=require('fs');const b=JSON.parse(fs.readFileSync('/tmp/board-before.json'));const s=JSON.parse(fs.readFileSync('/tmp/signals-before.json'));const t=JSON.parse(fs.readFileSync('/tmp/stats-before.json'));if(b?.ok!==true||!Array.isArray(b?.fixtures))throw Error('PRE_BOARD');if(!Array.isArray(s?.signals))throw Error('PRE_SIGNALS');if(t?.ok!==true||!Array.isArray(t?.rows))throw Error('PRE_STATS');console.log('PRECHECK_OK',{fixtures:b.fixtures.length,signals:s.signals.length,settled:t.rows.length})"

      - name: Snapshot exact pre-change shell
        uses: actions/upload-artifact@v4
        with:
          name: ball46-pre-signal-scorebar-restore-${{ github.run_id }}
          path: /tmp/rollback
          retention-days: 30

      - name: Add only isolated scorebar asset
        shell: bash
        run: |
          set -euo pipefail
          cp ops/ball46-scorebar-below-workspace-20260926.js nomad-live-343/ball46-scorebar-below-workspace-20260926.js
          node --check nomad-live-343/ball46-scorebar-below-workspace-20260926.js
          grep -Fq 'BALL46_SCOREBAR_MATCH_STATUS_MIN10_20260926' nomad-live-343/ball46-scorebar-below-workspace-20260926.js
          grep -Fq "view!=='live'&&view!=='signal'" nomad-live-343/ball46-scorebar-below-workspace-20260926.js
          grep -Fq "document.addEventListener('ball46:workspace-view',schedule)" nomad-live-343/ball46-scorebar-below-workspace-20260926.js
          [ "$(grep -Fc 'fetch(' nomad-live-343/ball46-scorebar-below-workspace-20260926.js)" = 0 ]
          [ "$(sha256sum nomad-live-343/index.html|awk '{print $1}')" = "$(awk '{print $1}' /tmp/rollback/index.sha256)" ]
          [ "$(sha256sum nomad-live-343/dashboard-v2-stage3.js|awk '{print $1}')" = "$(awk '{print $1}' /tmp/rollback/dashboard.sha256)" ]
          echo SIGNAL_SCOREBAR_ASSET_ONLY_GUARD_OK

      - name: Dry run exact package
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Race guard exact current Production
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/index.html?signal-scorebar-race=${GITHUB_RUN_ID}" -o /tmp/index-race.html
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/dashboard-v2-stage3.js?signal-scorebar-race=${GITHUB_RUN_ID}" -o /tmp/dashboard-race.js
          [ "$(sha256sum /tmp/index-race.html|awk '{print $1}')" = "$(awk '{print $1}' /tmp/rollback/index.sha256)" ]
          [ "$(sha256sum /tmp/dashboard-race.js|awk '{print $1}')" = "$(awk '{print $1}' /tmp/rollback/dashboard.sha256)" ]
          code=$(curl -sS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 -o /tmp/scorebar-race.js -w '%{http_code}' "$BALL46_WORKER/ball46-scorebar-below-workspace-20260926.js?signal-scorebar-race=${GITHUB_RUN_ID}") || true
          [ "$code" = 404 ]
          echo PRODUCTION_RACE_GUARD_OK

      - name: Deploy isolated Signal scorebar restore
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc
          touch /tmp/deployed

      - name: Verify exact target and core continuity
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 20); do
            if curl -fsS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 "$BALL46_WORKER/ball46-scorebar-below-workspace-20260926.js?signal-scorebar-after=${GITHUB_RUN_ID}-${n}" -o /tmp/scorebar-after.js && grep -Fq 'BALL46_SCOREBAR_MATCH_STATUS_MIN10_20260926' /tmp/scorebar-after.js; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = 1 ]
          node --check /tmp/scorebar-after.js
          grep -Fq "view!=='live'&&view!=='signal'" /tmp/scorebar-after.js
          grep -Fq "document.addEventListener('ball46:workspace-view',schedule)" /tmp/scorebar-after.js
          [ "$(grep -Fc 'fetch(' /tmp/scorebar-after.js)" = 0 ]
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/index.html?signal-scorebar-index=${GITHUB_RUN_ID}" -o /tmp/index-after.html
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/dashboard-v2-stage3.js?signal-scorebar-dashboard=${GITHUB_RUN_ID}" -o /tmp/dashboard-after.js
          [ "$(sha256sum /tmp/index-after.html|awk '{print $1}')" = "$(awk '{print $1}' /tmp/rollback/index.sha256)" ]
          [ "$(sha256sum /tmp/dashboard-after.js|awk '{print $1}')" = "$(awk '{print $1}' /tmp/rollback/dashboard.sha256)" ]
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?signal-scorebar-final=${GITHUB_RUN_ID}" -o /tmp/board-after.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?signal-scorebar-final=${GITHUB_RUN_ID}" -o /tmp/signals-after.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/statistics?signal-scorebar-final=${GITHUB_RUN_ID}" -o /tmp/stats-after.json
          node -e "const fs=require('fs');const b=JSON.parse(fs.readFileSync('/tmp/board-after.json'));const s=JSON.parse(fs.readFileSync('/tmp/signals-after.json'));const t=JSON.parse(fs.readFileSync('/tmp/stats-after.json'));if(b?.ok!==true||!Array.isArray(b?.fixtures))throw Error('POST_BOARD');if(!Array.isArray(s?.signals))throw Error('POST_SIGNALS');if(t?.ok!==true||!Array.isArray(t?.rows))throw Error('POST_STATS');console.log('BALL46_SIGNAL_SCOREBAR_RESTORE_PASS',{fixtures:b.fixtures.length,signals:s.signals.length,settled:t.rows.length})"

      - name: Restore only pre-change missing scorebar state if verification fails
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          [ -f /tmp/deployed ] || { echo 'No Production deploy occurred; restore not needed'; exit 0; }
          rm -f nomad-live-343/ball46-scorebar-below-workspace-20260926.js
          [ "$(sha256sum nomad-live-343/index.html|awk '{print $1}')" = "$(awk '{print $1}' /tmp/rollback/index.sha256)" ]
          [ "$(sha256sum nomad-live-343/dashboard-v2-stage3.js|awk '{print $1}')" = "$(awk '{print $1}' /tmp/rollback/dashboard.sha256)" ]
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc
          echo PRECHANGE_MISSING_SCOREBAR_STATE_RESTORED
