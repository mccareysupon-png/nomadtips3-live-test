name: BALL46 TEST deploy O/U odds 1.40 to 10.00 inclusive 20261124
on:
  push:
    branches: [fix/ball46-btts-stats-registry-snapshot-test-20261122]
    paths: [.github/workflows/b46-ou-price-1p40-10-test-deploy-20261124.yml]
permissions: {contents: read}
concurrency:
  group: ball46-prematch-only-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Recheck acceptance bounds and all core O/U history and Asian price regression
        run: |
          node --check qa/prematch-history-20261120/b46-ou-price-1p40-10-test-deploy-20261124.mjs
          node --experimental-sqlite --test qa/prematch-history-20261120/ou-value-screener-v2.test.mjs qa/prematch-history-20261120/prematch-ou-engine-v1.test.mjs qa/prematch-history-20261120/ou-v3-history-math.test.mjs
      - name: Roll only changed price gate and policy into isolated TEST worker
        run: node qa/prematch-history-20261120/b46-ou-price-1p40-10-test-deploy-20261124.mjs
