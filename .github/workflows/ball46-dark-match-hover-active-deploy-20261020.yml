name: BALL46 Production Dark Match Hover Active Fix 20261020
on:
  push:
    branches: [codex/ball46-dark-match-hover-active-20261020]
    paths:
      - '.github/workflows/ball46-dark-match-hover-active-deploy-20261020.yml'
      - 'deploy-assets/match-interaction-20261020/deploy.mjs'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  guarded-dark-hover-active:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and browser dependencies
        working-directory: deploy-assets/match-interaction-20261020
        run: |
          set -euo pipefail
          node --check deploy.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24 >/dev/null 2>&1
      - name: Verify live Worker, preview hover active, deploy and rollback when needed
        working-directory: deploy-assets/match-interaction-20261020
        run: node deploy.mjs
      - name: Preserve audit and before after desktop mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-dark-hover-active-audit
          path: deploy-assets/match-interaction-20261020/audit/
          retention-days: 30
          if-no-files-found: warn
