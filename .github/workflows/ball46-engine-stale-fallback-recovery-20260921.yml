name: Ball46 Engine Stale Fallback Recovery 20260921

on:
  push:
    branches: [work/ball46-full-market-20260918]
    paths:
      - '.github/workflows/ball46-engine-stale-fallback-recovery-20260921.yml'

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  BALL46_URL: https://www.ball46.com

jobs:
  repair-engine-stale-board:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-full-market-20260918
          fetch-depth: 0

      - name: Patch ENGINE board stale response only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('workers/nomadtips3-engine-343/src/index.js')
          s=p.read_text()
          old="if(u.pathname==='/board')return Response.json(await this.ctx.storage.get('board')||{ok:false,version:VERSION,error:'NO_BOARD'});"
          new="if(u.pathname==='/board'){const board=await this.ctx.storage.get('board')||{ok:false,version:VERSION,error:'NO_BOARD'};if(board?.staleGuard===true||board?.stale===true)return Response.json({...board,ok:false,error:'HUB_STALE'}, {status:503,headers:{'cache-control':'no-store'}});return Response.json(board,{headers:{'cache-control':'no-store'}})}"
          assert old in s, 'board route not found'
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check workers/nomadtips3-engine-343/src/index.js
          git diff --check -- workers/nomadtips3-engine-343/src/index.js
          git diff -- workers/nomadtips3-engine-343/src/index.js

      - name: Persist ENGINE-only patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ADD-K Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add workers/nomadtips3-engine-343/src/index.js
          git commit -m 'fix(ball46): expose stale engine board as unavailable for hub fallback'
          git push origin HEAD:work/ball46-full-market-20260918

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy ENGINE only
        working-directory: workers/nomadtips3-engine-343
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.toml
          npx --yes wrangler@4.92.0 deploy --config wrangler.toml

      - name: Verify Ball46 pages and live path
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          for p in index.html signal.html statistics.html settings.html; do
            code=$(curl -sS --max-time 30 -o "/tmp/${p}" -w '%{http_code}' "$BALL46_URL/$p?enginefix=$GITHUB_RUN_ID-$(date +%s%N)")
            echo "$p=$code"
            test "$code" = 200
            test -s "/tmp/${p}"
          done
          curl -fsS --max-time 30 "$BALL46_URL/api/hub/snapshot?enginefix=$GITHUB_RUN_ID" -o /tmp/hub.json
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/health?enginefix=$GITHUB_RUN_ID" -o /tmp/engine-health.json
          curl -fsS --max-time 30 -D /tmp/board.headers "$BALL46_URL/api/engine/board?enginefix=$GITHUB_RUN_ID" -o /tmp/board.json
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/signals?enginefix=$GITHUB_RUN_ID" -o /tmp/signals.json
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/hub.json'));
          const e=JSON.parse(fs.readFileSync('/tmp/engine-health.json'));
          const b=JSON.parse(fs.readFileSync('/tmp/board.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals.json'));
          if(h?.ok!==true||!Array.isArray(h?.fixtures)) throw Error('HUB_FAIL '+JSON.stringify(h));
          if(b?.ok!==true||!Array.isArray(b?.fixtures)) throw Error('PUBLIC_BOARD_FAIL '+JSON.stringify(b));
          if(s?.ok!==true||!Array.isArray(s?.signals)) throw Error('SIGNALS_FAIL '+JSON.stringify(s));
          console.log('ENGINE_FIX_PASS',{hubAgeMs:h.ageMs,hubStale:h.stale,engineStaleGuard:e?.staleGuard,engineSkipReason:e?.skipReason,boardFallback:b?.engineBoardFallback,boardReason:b?.engineBoardFallbackReason,fixtures:b.fixtures.length,signals:s.signals.length});
          NODE
          grep -i '^x-ball46-board-source:' /tmp/board.headers || true

      - name: Verify HUB keeps advancing
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$BALL46_URL/api/hub/snapshot?advance=a-$GITHUB_RUN_ID" -o /tmp/a.json
          sleep 130
          curl -fsS --max-time 30 "$BALL46_URL/api/hub/snapshot?advance=b-$GITHUB_RUN_ID" -o /tmp/b.json
          curl -fsS --max-time 30 "$BALL46_URL/api/engine/board?advance=b-$GITHUB_RUN_ID" -o /tmp/board2.json
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/a.json'));
          const b=JSON.parse(fs.readFileSync('/tmp/b.json'));
          const board=JSON.parse(fs.readFileSync('/tmp/board2.json'));
          if(a?.ok!==true||b?.ok!==true||board?.ok!==true) throw Error('ADVANCE_HEALTH_FAIL');
          if(Number(b?.fetchedAt||0)<=Number(a?.fetchedAt||0) && b?.stale===true) throw Error('HUB_STUCK_STALE');
          console.log('ADVANCE_PASS',{from:a.fetchedAt,to:b.fetchedAt,hubAgeMs:b.ageMs,hubStale:b.stale,boardFallback:board?.engineBoardFallback,boardReason:board?.engineBoardFallbackReason});
          NODE
