name: Verify Ball46 Verified Corners Referee Production 20261011
on:
  push:
    branches: [work/ball46-corner-live-referee-20261011]
    paths: [.github/workflows/verify-ball46-corner-live-referee-20261011.yml]
permissions:
  contents: read
jobs:
  verify-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify active Worker, settings and newest Corners signal provenance (read-only)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers';
          const auth={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const get=async p=>{const r=await fetch(base+p,{headers:auth,signal:AbortSignal.timeout(25000)});const j=await r.json();if(!r.ok||j.success!==true)throw Error('CF_READ_'+r.status);return j.result};
          const ds=await get('/scripts/nomadtips3-engine-343/deployments');
          const active=ds.deployments?.[0]?.versions?.find(v=>Number(v.percentage)===100)?.version_id;
          const v=await get('/workers/nomadtips3-engine-343/versions/'+active+'?include=modules');
          const source=Buffer.from(v.modules.find(m=>m.name===v.main_module).content_base64,'base64').toString('utf8');
          const sha=createHash('sha256').update(source).digest('hex');
          console.log('PRODUCTION_READBACK',JSON.stringify({active,sha,created:ds.deployments[0].created_on,cornerGuard:source.includes('BALL46_CORNER_TICK_MAX_AGE_MS=90*1e3'),historyEndpoint:source.includes('/odds/history?market='),priceTag:source.includes('BET365_VERIFIED_HISTORY_INPLAY'),priceBudget:source.includes('BALL46_CORNER_TICK_REQUESTS_PER_SCAN=2')}));
          const keys=['health','settings','board','signals'];
          for(const k of keys){
            try{
              const response=await fetch('https://www.ball46.com/api/engine/'+k+'?corner_verify='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(20000)});
              const j=await response.json().catch(()=>({}));
              if(k==='health')console.log('POST_CORNER_HEALTH',JSON.stringify({http:response.status,ok:j.ok,version:j.version,fixtureCount:j.fixtureCount,liveCount:j.liveCount,signalCount:j.signalCount,refereeErrorsCount:j.refereeErrors?.length||0}));
              if(k==='settings')console.log('POST_CORNER_SETTINGS',JSON.stringify({http:response.status,corners:{over:j.runState?.ft_corner_over,under:j.runState?.ft_corner_under,ah:j.runState?.ft_corner_ah},lineGapMax:j.settings?.ft_corner_over?.lineGapMax,oddsMin:j.settings?.ft_corner_over?.oddsMin}));
              if(k==='board'){
                const totals={};for(const f of j.fixtures||[])for(const key of ['ft_corner_over','ft_corner_ah']){const s=f.analysis?.[key]?.state||'NONE';totals[key+':'+s]=(totals[key+':'+s]||0)+1;}
                console.log('POST_CORNER_BOARD',JSON.stringify({http:response.status,ok:j.ok,fixtureCount:j.fixtures?.length,states:totals,refereeErrorsCount:j.referee?.errors?.length||0}));
              }
              if(k==='signals'){
                const rows=(j.signals||[]).filter(x=>/corner/i.test(String(x.market||'')));
                const cutoff=Date.parse('2026-10-11T08:04:28Z');
                const newer=rows.filter(x=>Number(x.createdAt||0)>cutoff);
                const evidence=newer.map(x=>({market:x.market,priceSource:x.priceSource,bookmakerSlug:x.bookmakerSlug,odds:x.odds,line:x.line})).slice(-6);
                console.log('POST_CORNER_SIGNAL_PROVENANCE',JSON.stringify({http:response.status,ok:j.ok,totalCornerRows:rows.length,newAfterDeploy:newer.length,quotes:evidence}));
                if(newer.some(x=>x.priceSource!=='BET365_VERIFIED_HISTORY_INPLAY'||String(x.bookmakerSlug||'').toLowerCase()!=='bet365'))throw Error('UNVERIFIED_CORNER_SIGNAL_AFTER_DEPLOY');
              }
            }catch(e){console.log('POST_CORNER_'+k.toUpperCase()+'_ERROR',String(e?.message||e));if(k==='signals')throw e}
          }
          if(active!=='1d017a67-0c2d-46df-beec-daaab08a4f37')console.log('NOTE_NEWER_DEPLOY_ACTIVE');
          NODE
