name: BALL46 native Pre-Match integration PC and mobile QA
on:
  push:
    branches: [test/ball46-premium-match-colors-20261120]
    paths: ['.github/workflows/ball46-prematch-native-integration-qa.yml']
permissions: {contents: read}
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium --only-shell
      - name: Validate actual full-site test menus and prediction ledger
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p evidence/native-prematch
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium,devices} from 'playwright';
          import fs from 'node:fs';
          const base='https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev';
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers';
          const cf=async p=>{const r=await fetch(root+p,{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});const j=await r.json();assert(r.ok&&j.success,p);return j.result};
          const prodBefore=(await cf('/scripts/ball46-production/deployments?per_page=1')).deployments[0].versions;
          let data,health;
          for(let i=0;i<24;i++){
            try{
              const h=await fetch(base+'/_premium_health',{cache:'no-store'});
              if(!h.ok)throw Error('health '+h.status);
              health=await h.json();
              const d=await fetch(base+'/__b46_prematch_data',{cache:'no-store'});
              if(!d.ok)throw Error('data '+d.status);
              data=await d.json();
              const client=await(await fetch(base+'/__b46_prematch_client.js',{cache:'no-store'})).text();
              if(health.prematchNative===true&&data.testLedger?.stats?.total>=8&&data.dailyBook?.window?.cutoffLocal==='06:00'&&client.includes('b46pm-daybar'))break;
            }catch(e){console.log('PROPAGATION '+i+' '+String(e.message))}
            await new Promise(r=>setTimeout(r,2500));
          }
          assert.equal(health?.prematchNative,true,'PREMATCH_MODULE_NOT_ACTIVE');
          assert.equal(data?.testLedger?.mode,'TEST_ONLY');
          assert.equal(data.testLedger.stats.total,8);
          assert.equal(data.dailyBook.window.timezone,'Europe/London');assert.equal(data.dailyBook.providerCalls,0);
          const browser=await chromium.launch();
          const cases=[];
          try{
            for(const mobile of [false,true]){
              for(const theme of ['dark','light']){
                const p=await browser.newPage(mobile?{...devices['iPhone 13'],serviceWorkers:'block'}:{viewport:{width:1440,height:1000},serviceWorkers:'block'});
                const jsErrors=[];p.on('pageerror',e=>jsErrors.push(e.message));
                await p.addInitScript(t=>localStorage.setItem('nomad343_dashboard_theme_v1',t),theme);
                await p.goto(base+'/?b46prematchqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
                const nativeScope=mobile?'#b46m-drawer ':'aside.left-rail ';
                const route=id=>p.locator(nativeScope+'[data-b46-prematch-route="'+id+'"]');
                if(mobile)await p.locator('[data-b46m-open]').click();
                await p.waitForSelector(nativeScope+'[data-b46-prematch-route="predictions"]',{state:'attached',timeout:25000});
                await p.waitForSelector(nativeScope+'[data-b46-prematch-route="1x2"]',{state:'attached',timeout:25000});
                await route('predictions').waitFor({state:'visible',timeout:10000});
                const old=await p.locator('[data-b46-sidebar-row]').evaluateAll(els=>els.filter(e=>!e.hasAttribute('data-b46-prematch-route')).map(e=>e.dataset.b46SidebarRow));
                await route('predictions').evaluate(e=>e.click());
                if(mobile){await p.waitForTimeout(500);const d=await p.evaluate(()=>({mode:document.body.dataset.b46PrematchView,body:document.body.getAttribute('data-b46-prematch-view'),panel:!!document.querySelector('#b46-prematch-panel'),panelHidden:document.querySelector('#b46-prematch-panel')?.hidden,cardCount:document.querySelectorAll('#b46-prematch-panel .b46pm-card').length,active:[...document.querySelectorAll('[data-b46-prematch-route].active')].map(e=>e.dataset.b46PrematchRoute),drawer:document.querySelector('#b46m-drawer')?.getAttribute('aria-hidden'),scripts:[...document.scripts].filter(x=>x.src.includes('prematch')).map(x=>x.src)}));console.log('MOBILE_ACTION_DIAG '+JSON.stringify({d,jsErrors}));}
                await p.waitForFunction(()=>document.body.dataset.b46PrematchView==='1'&&document.querySelector('#b46-prematch-panel .b46pm-summary')&&document.querySelector('#b46-prematch-panel .b46pm-daybar'));
                const first=await p.evaluate(mobile=>{
                  const panel=document.querySelector('#b46-prematch-panel');const menu=document.querySelector((mobile?'#b46m-drawer ':'aside.left-rail ')+'[data-b46-prematch-route="predictions"]');return {heading:document.querySelector('[data-workspace-heading]')?.textContent,panelWidth:panel.getBoundingClientRect().width,sideWidth:document.querySelector('aside.left-rail')?.getBoundingClientRect().width,screenWidth:innerWidth,scrollWidth:document.documentElement.scrollWidth,menuActive:menu.classList.contains('active'),summary:[...panel.querySelectorAll('.b46pm-card')].map(x=>x.textContent),matches:panel.querySelectorAll('.b46pm-match').length}},mobile); 
                assert((mobile||first.menuActive)&&first.summary.some(s=>s==='TOTAL8')&&first.panelWidth>200&&first.panelWidth<=first.screenWidth+5,JSON.stringify(first));
                const dailyText=await p.locator('#b46-prematch-panel .b46pm-daybar').innerText();assert(dailyText.includes(data.dailyBook.window.businessDay)&&dailyText.includes('London')&&dailyText.includes('PICKS TODAY')&&dailyText.includes('P/L TODAY'),dailyText);
                await p.screenshot({path:'evidence/native-prematch/'+(mobile?'mobile':'desktop')+'-'+theme+'-predictions.png',fullPage:true});
                if(mobile){await p.locator('[data-b46m-open]').click();await p.waitForFunction(()=>document.querySelector('#b46m-drawer [data-b46-prematch-route="predictions"]')?.classList.contains('active'),null,{timeout:8000})}
                await route('1x2').waitFor({state:'visible',timeout:10000});
                await route('1x2').evaluate(e=>e.click());
                await p.waitForFunction(mobile=>document.querySelector('#b46-prematch-panel .b46pm-match')&&(mobile?document.body.dataset.b46PrematchView==='1':document.querySelector('aside.left-rail [data-b46-prematch-route="1x2"]').classList.contains('active')),mobile);
                const stat=await p.evaluate(mobile=>({title:document.querySelector('#b46-prematch-panel .b46pm-title').textContent,count:document.querySelectorAll('#b46-prematch-panel .b46pm-match').length,route:document.querySelector((mobile?'#b46m-drawer ':'aside.left-rail ')+'[data-b46-prematch-route="1x2"]').getAttribute('aria-current')}),mobile);
                assert.equal(stat.count,8);if(!mobile)assert.equal(stat.route,'page');
                await p.screenshot({path:'evidence/native-prematch/'+(mobile?'mobile':'desktop')+'-'+theme+'-1x2.png',fullPage:true});
                if(mobile){await p.locator('[data-b46m-open]').click();await p.waitForFunction(()=>document.querySelector('#b46m-drawer [data-b46-prematch-route="1x2"]')?.classList.contains('active'),null,{timeout:8000})}
                await route('btts').waitFor({state:'visible',timeout:10000});
                await route('btts').evaluate(e=>e.click());
                assert(await p.locator('#b46-prematch-panel').textContent().then(t=>t.includes('No predictions recorded yet')));
                if(mobile){await p.locator('[data-b46m-open]').click();await p.locator('#b46m-drawer [data-b46m-page="signal"]').evaluate(e=>e.click())}
                else await p.locator('[data-b46-sidebar-row="status-signal"]').evaluate(e=>e.click());
                await p.waitForFunction(()=>!document.body.dataset.b46PrematchView);
                const after=await p.locator('[data-b46-sidebar-row]').evaluateAll(els=>els.filter(e=>!e.hasAttribute('data-b46-prematch-route')).map(e=>e.dataset.b46SidebarRow));
                assert.deepEqual(after,old,'ORIGINAL_LIVE_SIDEBAR_CHANGED');assert.equal(jsErrors.length,0,JSON.stringify(jsErrors));
                const result={mobile,theme,first,stat,nativeNavigationRestored:true,jsErrors};cases.push(result);console.log('NATIVE_PREMATCH_CASE '+JSON.stringify(result));await p.close();
              }
            }
          }finally{await browser.close()}
          const prodAfter=(await cf('/scripts/ball46-production/deployments?per_page=1')).deployments[0].versions;
          assert.deepEqual(prodAfter,prodBefore,'PRODUCTION_CHANGED');
          console.log('NATIVE_PREMATCH_PASS '+JSON.stringify({url:base,menuCount:4,stored:data.testLedger.stats,dailyBook:data.dailyBook,cases:cases.length,published:0,productionUnchanged:true}));
          fs.writeFileSync('evidence/native-prematch/report.json',JSON.stringify({url:base,stats:data.testLedger.stats,cases,productionUnchanged:true},null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-prematch-pc-mobile-proof
          path: evidence/native-prematch/
          retention-days: 7

# Verify after staged full-site Worker deployment and propagation.

# Validate native drawer content after delayed-mount fix.

# Reverify after mobile drawer close and route order repair.
