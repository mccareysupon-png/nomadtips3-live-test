name: Ball46 Realtime Pending Current Deploy 20261006

on:
  push:
    branches: [work/ball46-stat-realtime-current-20261006]
    paths:
      - '.github/workflows/ball46-stat-realtime-current-deploy-20261006.yml'
      - '.github/scripts/ball46_stat_realtime_current_deploy_20261006.sh'
      - '.github/scripts/ball46_stat_realtime_pending_patch_20261006.py'

permissions:
  contents: read

concurrency:
  group: ball46-stat-realtime-current-production
  cancel-in-progress: false

jobs:
  guarded-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ball46-stat-realtime-current-20261006
          fetch-depth: 1
      - name: Deploy realtime PENDING statistics only
        shell: bash
        run: bash .github/scripts/ball46_stat_realtime_current_deploy_20261006.sh
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-stat-realtime-current-${{ github.run_id }}
          path: /tmp/b46-stat-realtime-current-20261006
          if-no-files-found: warn
          retention-days: 14
