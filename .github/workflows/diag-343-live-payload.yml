name: Diagnose 3.43 Live Hub Payload

on:
  push:
    branches:
      - work/nomad343-clean-bet365-ui
    paths:
      - .github/workflows/diag-343-live-payload.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one ENGINE odds payload only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 'https://nomadtips3-engine-343.mccarey-supon.workers.dev/board' -o /tmp/board.json
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/board.json','utf8'));
          const all=Array.isArray(s.fixtures)?s.fixtures:[];
          const x=all.find(v=>String(v.fixtureId)==='200100164');
          if(!x){console.log('fixture not found');process.exit(2)}
          console.log(JSON.stringify({fixtureId:x.fixtureId,home:x.home?.name,away:x.away?.name,minute:x.minute,providerOdds:x.providerOdds},null,2));
          NODE
