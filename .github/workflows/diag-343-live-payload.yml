name: Diagnose 3.43 Live Hub Payload

on:
  push:
    branches:
      - work/nomad343-clean-bet365-ui
    paths:
      - .github/workflows/diag-343-live-payload.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read live HUB snapshot only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 'https://nomadtips3-5usd-hub-343.mccarey-supon.workers.dev/snapshot' -o /tmp/snapshot.json
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/snapshot.json','utf8'));
          const all=Array.isArray(s.fixtures)?s.fixtures:[];
          const live=all.filter(x=>x.boardState==='live');
          const rows=live.map(x=>({
            fixtureId:x.fixtureId,
            home:x.home?.name,
            away:x.away?.name,
            minute:x.minute,
            providerOdds:x.providerOdds==null?'ABSENT':'PRESENT',
            oddsTopKeys:x.providerOdds&&typeof x.providerOdds==='object'?Object.keys(x.providerOdds):[],
            directOddsKeys:x.providerOdds?.odds&&typeof x.providerOdds.odds==='object'?Object.keys(x.providerOdds.odds):[],
            eventCount:Array.isArray(x.events)?x.events.length:null,
            stats:x.statistics==null?'ABSENT':'PRESENT'
          }));
          console.log(JSON.stringify({ok:s.ok,version:s.version,include:s.include,fixtureCount:s.fixtureCount,liveCount:live.length,liveWithOdds:rows.filter(x=>x.providerOdds==='PRESENT').length,rows},null,2));
          NODE
