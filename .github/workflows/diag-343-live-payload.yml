name: Diagnose 3.43 Live Hub Payload

on:
  push:
    branches:
      - work/nomad343-clean-bet365-ui
    paths:
      - .github/workflows/diag-343-live-payload.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect rendered Preview DOM only
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          "$BROWSER" --headless=new --disable-gpu --no-sandbox --virtual-time-budget=15000 --dump-dom 'https://nomadtips3-343-preview.mccarey-supon.workers.dev/?diag=odds' > /tmp/dom.html 2>/tmp/chrome.log || true
          echo '=== browser ==='
          echo "$BROWSER"
          echo '=== checks ==='
          grep -o 'Bucheon FC 1995' /tmp/dom.html | head -1 || true
          echo "B365_ADDONS=$(grep -o 'data-b365-addon' /tmp/dom.html | wc -l)"
          echo "B365_BOARDS=$(grep -o 'class=\"b365-board\"' /tmp/dom.html | wc -l)"
          echo "ODDS_EMPTY=$(grep -o 'Odds unavailable in current batch for this fixture' /tmp/dom.html | wc -l)"
          echo "ASIAN_MARKETS=$(grep -o 'Asian Handicap · Full Time' /tmp/dom.html | wc -l)"
          echo "GOAL_MARKETS=$(grep -o 'Goals O/U · Full Time' /tmp/dom.html | wc -l)"
          echo '=== Bucheon vicinity ==='
          grep -n -m1 -B1 -A2 'Bucheon FC 1995' /tmp/dom.html | cut -c1-1200 || true
          echo '=== console/errors ==='
          tail -80 /tmp/chrome.log || true
          test "$(grep -o 'Bucheon FC 1995' /tmp/dom.html | wc -l)" -ge 1
