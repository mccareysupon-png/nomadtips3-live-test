name: Restore Ball46 Pre-Scorebar Surgical 20260926

on:
  push:
    branches:
      - work/ball46-remove-scorebar-surgical-20260926
    paths:
      - .github/workflows/restore-ball46-pre-scorebar-surgical-20260926.yml

permissions:
  contents: read
  actions: read

env:
  BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
  BALL46_PUBLIC: https://www.ball46.com
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  SNAPSHOT_ARTIFACT_ID: '10866085695'

jobs:
  restore-pre-scorebar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mirror exact current Production and guard files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/prod /tmp/current /tmp/restore
          fetch_required(){
            name="$1"; safe="${name//\//_}"
            code=$(curl -sS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 -o "/tmp/prod/$safe" -w '%{http_code}' "$BALL46_WORKER/$name?surgical-restore-copy=${GITHUB_RUN_ID}") || true
            [ "$code" = 200 ] || { echo "REQUIRED_PROD_ASSET_HTTP_${code}:$name"; exit 1; }
            test -s "/tmp/prod/$safe" || { echo "REQUIRED_PROD_ASSET_EMPTY:$name"; exit 1; }
            mkdir -p "$(dirname "nomad-live-343/$name")"
            cp "/tmp/prod/$safe" "nomad-live-343/$name"
          }
          fetch_required index.html
          python3 - <<'PY' > /tmp/index-assets.txt
          from pathlib import Path
          import re
          h=Path('nomad-live-343/index.html').read_text(errors='ignore')
          found=set()
          for x in re.findall(r'''(?:src|href)=["']([^"']+)["']''',h,re.I):
              x=x.split('?',1)[0].split('#',1)[0].strip().lstrip('./').lstrip('/')
              if not x or '://' in x or '/' in x: continue
              if re.search(r'\.(?:js|css|svg|json|png|webp|jpg|jpeg|ico)$',x,re.I): found.add(x)
          for x in sorted(found): print(x)
          PY
          while IFS= read -r name; do [ -n "$name" ] && fetch_required "$name"; done < /tmp/index-assets.txt
          fetch_required dashboard-v2-stage3.js
          cp nomad-live-343/dashboard-v2-stage3.js /tmp/current/dashboard-v2-stage3.js
          sha256sum nomad-live-343/index.html | awk '{print $1}' > /tmp/index-before.sha
          grep -Fc 'fetch(' nomad-live-343/dashboard-v2-stage3.js > /tmp/fetch-before.count
          grep -Fq 'BALL46_SCOREBAR10_20260925' nomad-live-343/dashboard-v2-stage3.js
          grep -Fq 'const COLLAPSED_LIMIT=10;' nomad-live-343/dashboard-v2-stage3.js
          : > /tmp/protected.sha
          protected='dashboard-v2.css dashboard-v2-tune.js v2-shared.css v2-shared.js bulk-odds-compat-343.js expanded-match-343.js full-market-bookmaker-343.js live-summary-full-odds-343.js signal-next.js singlepage-workspace-343.js singlepage-workspace-343.css signal-shared-view-343.css ball46-next.css market-registry-343.js'
          for f in $protected; do
            fetch_required "$f"
            printf '%s  %s\n' "$(sha256sum "nomad-live-343/$f" | awk '{print $1}')" "$f" >> /tmp/protected.sha
          done
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?surgical-before=${GITHUB_RUN_ID}" -o /tmp/board-before.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?surgical-before=${GITHUB_RUN_ID}" -o /tmp/signals-before.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/statistics?surgical-before=${GITHUB_RUN_ID}" -o /tmp/stats-before.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/board-before.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals-before.json'));
          const t=JSON.parse(fs.readFileSync('/tmp/stats-before.json'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures))throw Error('PRE_BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals))throw Error('PRE_SIGNALS_UNHEALTHY');
          if(t?.ok!==true||!Array.isArray(t?.rows))throw Error('PRE_STATS_UNHEALTHY');
          console.log('PRE_RESTORE_BACKEND_OK',{fixtures:b.fixtures.length,signals:s.signals.length,settled:t.rows.length});
          NODE

      - name: Download exact pre-scorebar snapshot and restore one file only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SNAPSHOT_ARTIFACT_ID}/zip" > /tmp/pre-scorebar.zip
          unzip -q /tmp/pre-scorebar.zip -d /tmp/restore
          test -s /tmp/restore/dashboard-v2-stage3.js
          grep -Fq 'const COLLAPSED_LIMIT=10;' /tmp/restore/dashboard-v2-stage3.js
          ! grep -Fq 'BALL46_SCOREBAR10_20260925' /tmp/restore/dashboard-v2-stage3.js
          node --check /tmp/restore/dashboard-v2-stage3.js
          cp /tmp/restore/dashboard-v2-stage3.js nomad-live-343/dashboard-v2-stage3.js
          node --check nomad-live-343/dashboard-v2-stage3.js
          ! grep -Fq 'BALL46_SCOREBAR10_20260925' nomad-live-343/dashboard-v2-stage3.js
          grep -Fq 'const COLLAPSED_LIMIT=10;' nomad-live-343/dashboard-v2-stage3.js
          [ "$(cat /tmp/fetch-before.count)" = "$(grep -Fc 'fetch(' nomad-live-343/dashboard-v2-stage3.js)" ] || { echo 'FETCH_CALL_COUNT_CHANGED'; exit 1; }
          [ "$(cat /tmp/index-before.sha)" = "$(sha256sum nomad-live-343/index.html | awk '{print $1}')" ] || { echo 'INDEX_CHANGED'; exit 1; }
          while read -r expected f; do
            actual=$(sha256sum "nomad-live-343/$f" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "PROTECTED_LOCAL_CHANGED:$f"; exit 1; }
          done < /tmp/protected.sha
          echo 'SURGICAL_RESTORE_ONE_FILE_PREFLIGHT_OK'

      - name: Dry run exact Production package
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"; test -n "$CLOUDFLARE_ACCOUNT_ID"
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy surgical restore
        shell: bash
        run: |
          set -euo pipefail
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc

      - name: Verify exact restore and backend continuity
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 20); do
            if curl -fsS -L --retry 2 --retry-all-errors --retry-delay 1 --max-time 20 "$BALL46_WORKER/dashboard-v2-stage3.js?surgical-after=${GITHUB_RUN_ID}-${n}" -o /tmp/target.after.js \
              && grep -Fq 'const COLLAPSED_LIMIT=10;' /tmp/target.after.js \
              && ! grep -Fq 'BALL46_SCOREBAR10_20260925' /tmp/target.after.js; then ok=1; break; fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo 'PRE_SCOREBAR_TARGET_NOT_LIVE'; exit 1; }
          [ "$(sha256sum /tmp/target.after.js | awk '{print $1}')" = "$(sha256sum /tmp/restore/dashboard-v2-stage3.js | awk '{print $1}')" ] || { echo 'RESTORED_HASH_MISMATCH'; exit 1; }
          [ "$(cat /tmp/fetch-before.count)" = "$(grep -Fc 'fetch(' /tmp/target.after.js)" ] || { echo 'DEPLOYED_FETCH_COUNT_CHANGED'; exit 1; }
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/index.html?surgical-index=${GITHUB_RUN_ID}" -o /tmp/index.after.html
          [ "$(sha256sum /tmp/index.after.html | awk '{print $1}')" = "$(cat /tmp/index-before.sha)" ] || { echo 'INDEX_DEPLOYED_CHANGED'; exit 1; }
          while read -r expected f; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/$f?surgical-protected=${GITHUB_RUN_ID}" -o "/tmp/protected-${f//\//_}"
            actual=$(sha256sum "/tmp/protected-${f//\//_}" | awk '{print $1}')
            [ "$actual" = "$expected" ] || { echo "PROTECTED_DEPLOYED_CHANGED:$f"; exit 1; }
          done < /tmp/protected.sha
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/board?surgical-final=${GITHUB_RUN_ID}" -o /tmp/board-after.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/signals?surgical-final=${GITHUB_RUN_ID}" -o /tmp/signals-after.json
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_WORKER/api/engine/statistics?surgical-final=${GITHUB_RUN_ID}" -o /tmp/stats-after.json
          node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/board-after.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/signals-after.json'));
          const t=JSON.parse(fs.readFileSync('/tmp/stats-after.json'));
          if(b?.ok!==true||!Array.isArray(b?.fixtures))throw Error('POST_BOARD_UNHEALTHY');
          if(!Array.isArray(s?.signals))throw Error('POST_SIGNALS_UNHEALTHY');
          if(t?.ok!==true||!Array.isArray(t?.rows))throw Error('POST_STATS_UNHEALTHY');
          console.log('SURGICAL_RESTORE_BACKEND_OK',{fixtures:b.fixtures.length,signals:s.signals.length,settled:t.rows.length});
          NODE
          curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 25 "$BALL46_PUBLIC/dashboard-v2-stage3.js?surgical-public=${GITHUB_RUN_ID}" -o /tmp/public-target.js
          grep -Fq 'const COLLAPSED_LIMIT=10;' /tmp/public-target.js
          ! grep -Fq 'BALL46_SCOREBAR10_20260925' /tmp/public-target.js
          echo 'BALL46_PRE_SCOREBAR_SURGICAL_RESTORE_PASS'

      - name: Restore current pre-operation target if verification fails
        if: failure() && steps.verify.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/current/dashboard-v2-stage3.js nomad-live-343/dashboard-v2-stage3.js
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc
