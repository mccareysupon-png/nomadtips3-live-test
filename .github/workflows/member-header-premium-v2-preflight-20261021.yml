name: BALL46 Member Premium Header V2 — Read Only Preflight
on:
  push:
    branches: [codex/ball46-member-topbar-alignment-premium-v2-20261021]
    paths:
      - '.github/workflows/member-header-premium-v2-preflight-20261021.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify compile and exactly scoped icon/layout HTML change
        run: |
          set -euo pipefail
          node --check ball46-member/member-odds-topbar-premium-v2-20261021/premium.mjs
          node --check ball46-member/member-odds-topbar-premium-v2-20261021/deploy.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {patchPremiumTopbar,PREMIUM_CSS,SVG_BEFORE,SVG_AFTER} from './ball46-member/member-odds-topbar-premium-v2-20261021/premium.mjs';
          const oldHtml='<link href="/member-odds-topbar.css?v=20261021-topbar-v1"><button id="b46-member-odds-trigger">'+SVG_BEFORE+'</button><script src="/member-odds-topbar.js"></script>';
          const oldCss='/* BALL46 MEMBER ODDS TOPBAR V1 */';
          const next=patchPremiumTopbar({html:oldHtml,css:oldCss});
          assert(next.html.includes(SVG_AFTER));
          assert.equal(next.html.replace(SVG_AFTER,SVG_BEFORE).replace('member-odds-topbar.css?v=20261021-topbar-premium-v2','member-odds-topbar.css?v=20261021-topbar-v1'),oldHtml);
          assert.equal(next.css,oldCss+'\n'+PREMIUM_CSS+'\n');
          assert(next.css.includes('grid-template-columns:132px minmax(0,1fr) 38px 176px'));
          assert(next.css.includes('grid-template-columns:minmax(85px,1fr) 34px minmax(0,154px)'));
          console.log('BALL46_MEMBER_PREMIUM_HEADER_V2_LOCAL_PATCH_PASS');
          JS
      - name: Verify real active member version, pinned live CSS, ODDS and data code (read only)
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
          assert(account&&token,'READONLY_CREDENTIALS_MISSING');
          const url='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/ball46-member-production/deployments?per_page=1';
          const response=await fetch(url,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(30000)});
          const j=await response.json();assert(response.ok&&j.success,'CF_READ_ONLY_ERROR');
          const v=j.result.deployments?.[0]?.versions;
          assert(v?.length===1&&v[0].percentage===100,'PRODUCTION_SPLIT_VERSION');
          assert.equal(v[0].version_id,'83e2727d-360a-481e-9884-eae184d0a7fa','MEMBER_ACTIVE_VERSION_CHANGED');
          const want={
            '/styles.css':'5186dd9dfa27c36b7dced6068b15a20d04ab8f15ab771e33d61116c8725b817d',
            '/member.js':'ef4489618ae07303a7f275b4b37fddd0f7a8cb721bf98d3216c887128c806524',
            '/member-odds-topbar.css':'97f544c20ab10ad1d44b1ecd29ea590fc41d3435e0698824ceefb21b1ce7282b',
            '/member-odds-topbar.js':'12265bd447751f9223860a852196bc97a576e1c70a08020343f12524698848c7'
          };
          const sha=x=>createHash('sha256').update(x).digest('hex');
          for(const [path,expected] of Object.entries(want)){
            const r=await fetch('https://member.ball46.com'+path+'?preflight='+Date.now(),{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(25000)});
            assert.equal(r.status,200,'LIVE_ASSET_STATUS_'+path);
            assert.equal(sha(Buffer.from(await r.arrayBuffer())),expected,'LIVE_ASSET_HASH_CHANGED_'+path);
          }
          const auth=await fetch('https://member.ball46.com/member.html',{redirect:'manual',signal:AbortSignal.timeout(25000)});
          assert([302,303].includes(auth.status),'MEMBER_ACCESS_GATE_BYPASS');
          console.log('BALL46_MEMBER_PREMIUM_HEADER_V2_PRODUCTION_PREFLIGHT_PASS',JSON.stringify({active:v[0].version_id,hashesChecked:4,loginProtected:true}));
          JS
