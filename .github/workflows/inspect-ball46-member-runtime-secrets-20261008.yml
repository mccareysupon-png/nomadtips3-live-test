name: Inspect Ball46 Member Runtime Secrets
on:
  push:
    branches:
      - member/ball46-member-v1-20261008
    paths:
      - '.github/workflows/inspect-ball46-member-runtime-secrets-20261008.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      GH_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      GH_STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
      GH_MEMBER_SESSION_SECRET: ${{ secrets.MEMBER_SESSION_SECRET }}
      GH_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: member/ball46-member-v1-20261008
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect secret names only
        working-directory: ball46-member
        shell: bash
        run: |
          set -euo pipefail
          echo "=== GITHUB SECRET PRESENCE ==="
          for v in GH_STRIPE_SECRET_KEY GH_STRIPE_WEBHOOK_SECRET GH_STRIPE_PRICE_ID GH_MEMBER_SESSION_SECRET GH_RESEND_API_KEY; do
            if [ -n "${!v:-}" ]; then echo "$v=PRESENT"; else echo "$v=MISSING"; fi
          done
          echo "=== CLOUDFLARE WORKER SECRET NAMES ==="
          npx --yes wrangler@4.92.0 secret list --config wrangler.jsonc | sed -E 's/("name"[[:space:]]*:[[:space:]]*"[^"]+").*/\1/' || true
          echo "RUNTIME_SECRET_INSPECTION_COMPLETE"
