name: BALL46 PreMatch League ID Catalog TEST Deploy
on:
  push:
    branches:
      - fix/ball46-prematch-league-id-registry-20261122
    paths:
      - .github/workflows/b46-prematch-league-id-catalog-deploy-test-20261122.yml
permissions:
  contents: read
concurrency:
  group: ball46-prematch-only-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify legacy selection and full cargo regressions
        run: |
          node --check qa/prematch-history-20261120/deploy-league-id-catalog-test-20261122.mjs
          node --test qa/prematch-history-20261120/league-id-catalog.test.mjs qa/prematch-history-20261120/league-name-cache.test.mjs qa/prematch-history-20261120/stored-prematch-feed.test.mjs qa/prematch-history-20261120/test-pick-ledger.test.mjs qa/prematch-history-20261120/history-cargo-registry.test.mjs qa/prematch-history-20261120/history-cargo-full-payload.test.mjs
      - name: Deploy only league names into isolated PreMatch TEST Worker and validate active version
        run: node qa/prematch-history-20261120/deploy-league-id-catalog-test-20261122.mjs
