name: Ball46 SEO Final Verify 20260926

on:
  push:
    branches:
      - ops/ball46-seo-deploy-20260926
    paths:
      - '.github/workflows/ball46-seo-final-verify-20260926.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  SEO_COMMIT: 345645a8b9eae0db932cc012f1473cc8e5bdf87b
  EXPECTED_PRESEO_SIGNAL_SHA: dee06f5d7c6ad042dbb8c7722e8cfe1bee5503e98ec8072b6a5b8b20ea44dd3b
  WORKER_URL: https://ball46-production.mccarey-supon.workers.dev
  BALL46_URL: https://www.ball46.com

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout approved SEO source
        uses: actions/checkout@v4
        with:
          ref: 345645a8b9eae0db932cc012f1473cc8e5bdf87b
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify live assets exactly
        shell: bash
        run: |
          set -euo pipefail
          q="final_verify=${GITHUB_RUN_ID}"

          SOURCE_INDEX_SHA=$(sha256sum nomad-live-343/index.html | awk '{print $1}')
          curl -fsS -L --retry 4 --retry-all-errors --max-time 30 "$WORKER_URL/index.html?$q" -o /tmp/live-index.html
          LIVE_INDEX_SHA=$(sha256sum /tmp/live-index.html | awk '{print $1}')
          echo "SOURCE_INDEX_SHA=$SOURCE_INDEX_SHA"
          echo "LIVE_INDEX_SHA=$LIVE_INDEX_SHA"
          test "$LIVE_INDEX_SHA" = "$SOURCE_INDEX_SHA"

          curl -fsS -L --retry 4 --retry-all-errors --max-time 30 "$WORKER_URL/signal.html?$q" -o /tmp/live-signal.html
          LIVE_SIGNAL_SHA=$(sha256sum /tmp/live-signal.html | awk '{print $1}')
          echo "EXPECTED_PRESEO_SIGNAL_SHA=$EXPECTED_PRESEO_SIGNAL_SHA"
          echo "LIVE_SIGNAL_SHA=$LIVE_SIGNAL_SHA"
          test "$LIVE_SIGNAL_SHA" = "$EXPECTED_PRESEO_SIGNAL_SHA"

          grep -Fq '<!-- BALL46 SEO START -->' /tmp/live-index.html
          grep -Fq 'Football Predictions Today | Verified Win Rate & Results | Ball46' /tmp/live-index.html
          grep -Fq '<h1>Football Predictions Today</h1>' /tmp/live-index.html
          grep -Fq 'verified win-rate statistics' /tmp/live-index.html

          curl -fsS -L --retry 4 --retry-all-errors --max-time 30 "$BALL46_URL/?$q" -o /tmp/www-home.html
          grep -Fq 'Football Predictions Today | Verified Win Rate & Results | Ball46' /tmp/www-home.html
          grep -Fq '<h1>Football Predictions Today</h1>' /tmp/www-home.html

          curl -fsS --retry 4 --retry-all-errors --max-time 30 "$BALL46_URL/api/engine/health?$q" -o /tmp/health.json
          curl -fsS --retry 4 --retry-all-errors --max-time 30 "$BALL46_URL/api/engine/board?$q" -o /tmp/board.json
          node -e 'const j=require("/tmp/health.json"); if(j?.ok!==true) throw Error("ENGINE_UNHEALTHY")'
          node -e 'const j=require("/tmp/board.json"); if(j?.ok!==true || !Array.isArray(j?.fixtures)) throw Error("BOARD_UNHEALTHY")'
          echo 'BALL46_FINAL_ASSET_AND_ENGINE_VERIFY_PASS'

      - name: Show active Cloudflare deployment
        shell: bash
        run: npx --yes wrangler@4.92.0 deployments list --name ball46-production
