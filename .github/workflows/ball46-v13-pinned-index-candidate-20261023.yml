name: BALL46 V13 Pinned Pristine Index — Candidate Only, Never Production
on:
  push:
    branches: [fix/ball46-v13-pinned-index-candidate-20261023]
    paths:
      - '.github/workflows/ball46-v13-pinned-index-candidate-20261023.yml'
      - 'deploy-assets/featured-flicker-v13/deploy-v13.mjs'
      - 'deploy-assets/featured-flicker-v13/feature-stable-patch.mjs'
permissions: {contents: read}
concurrency:
  group: ball46-v13-pinned-index-candidate-20261023
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      B46_V13_CANDIDATE_ONLY: '1'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify syntax and install headless QA
        working-directory: deploy-assets/featured-flicker-v13
        run: |
          set -euo pipefail
          node --check deploy-v13.mjs
          node --check feature-stable-patch.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Verify pinned pristine static HTML and V13 featured, never promote
        working-directory: deploy-assets/featured-flicker-v13
        run: node deploy-v13.mjs
      - name: Save proof and snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-v13-pinned-index-candidate-proof
          path: deploy-assets/featured-flicker-v13/proof/
          if-no-files-found: warn
          retention-days: 21
