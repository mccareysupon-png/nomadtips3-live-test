name: LIVE chart TEST deploy and click QA
on:
  push:
    branches: [fix/ball46-live-statistics-inplace-20261125]
    paths: [.github/workflows/live-chart-test-deploy.yml]
permissions: {contents: read}
concurrency:
  group: ball46-premium-match-colors-test-20261120
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Deploy isolated chart asset
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          assert(token&&account,'CLOUDFLARE_TEST_SECRETS_MISSING');
          const name='ball46-premium-match-colors-test-20261120',host='https://'+name+'.mccarey-supon.workers.dev';
          const api='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers';
          const protectedWorkers=['ball46-prematch-only-test-20261120','ball46-production',
           'nomadtips3-engine-343','nomadtips3-5usd-hub-343','nomadtips3-full-market-343-ball46'];
          async function cf(path,opt={}){
           const r=await fetch(api+path,{...opt,headers:{authorization:'Bearer '+token,...opt.headers},signal:AbortSignal.timeout(55000)});
           const j=await r.json();assert(r.ok&&j.success,'CF_'+path+'_'+r.status+'_'+JSON.stringify(j.errors??[]).slice(0,250));return j.result;
          }
          const ver=async n=>(await cf('/scripts/'+n+'/deployments?per_page=1')).deployments[0].versions[0].version_id;
          const frozen=Object.fromEntries(await Promise.all(protectedWorkers.map(async n=>[n,await ver(n)])));
          const current=await ver(name);
          const [v,settings]=await Promise.all([
           cf('/workers/'+name+'/versions/'+current+'?include=modules'),
           cf('/scripts/'+name+'/settings')]);
          const modules=Object.fromEntries(v.modules.map(m=>[m.name,Buffer.from(m.content_base64,'base64').toString()]));
          const main=v.main_module,source=modules[main];
          
          const client="(()=>{\n'use strict';\nconst API='/api/engine/statistics';\nconst CACHE_MS=300000;\nconst RANGE_DAYS={d7:7,d30:30,d90:90,all:null};\nconst MARKET_NAMES={all:'Total · All Markets','1x2':'1X2 · Match Result',ah:'AH · Asian Handicap',ou:'Over / Under · Totals',btts:'BTTS · Both Teams To Score',corners:'Corners · All Corner Markets',cards:'Cards · All Card Markets',other:'Other · Remaining Markets'};\nconst $=s=>document.querySelector(s);\nconst esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst num=v=>v===null||v===undefined||v===''||typeof v==='boolean'||!Number.isFinite(Number(v))?null:Number(v);\nconst dateMs=v=>{const n=num(v);if(n!==null)return n<1e12?n*1000:n;const p=Date.parse(String(v||''));return Number.isFinite(p)?p:0};\nconst fmtDate=ms=>{if(!ms)return'—';try{return new Intl.DateTimeFormat(navigator.language||'en-GB',{day:'2-digit',month:'short',year:'2-digit'}).format(new Date(ms))}catch{return'—'}};\nconst fmtShort=ms=>{if(!ms)return'—';try{return new Intl.DateTimeFormat(navigator.language||'en-GB',{day:'2-digit',month:'short'}).format(new Date(ms))}catch{return'—'}};\nlet rowsCache=[];\nlet loadedAt=0;\nlet loading=null;\nlet range='all';\nlet metric='units';\n/* B46_FINANCE_LINE_VISUAL_V1_20261114 */\nlet currentPoints=[];\n\nfunction marketDef(r){return window.BALL46_MARKET_REGISTRY?.resolve?.(r)||null}\nfunction marketKey(r){const d=marketDef(r);if(d?.family)return d.family;const x=String(r?.marketLabel||r?.market||r?.providerMarket||'').toLowerCase();if(/corner/.test(x))return'corners';if(/card/.test(x))return'cards';if(/btts|both teams/.test(x))return'btts';if(/asian|handicap|\\bah\\b/.test(x))return'ah';if(/over|under|o\\/u|total/.test(x))return'ou';if(/1x2|match result|moneyline|winner|3way|three way/.test(x))return'1x2';return'other'}\nfunction selectionKey(r){const x=String(r?.selection||r?.pick||'').trim().toUpperCase();if(x.includes('HOME'))return'home';if(x.includes('AWAY'))return'away';if(x.includes('DRAW')||x==='X')return'draw';if(x.includes('OVER'))return'over';if(x.includes('UNDER'))return'under';if(x==='YES'||x.includes('BTTS YES'))return'yes';if(x==='NO'||x.includes('BTTS NO'))return'no';return x.toLowerCase().replace(/[^a-z0-9]+/g,'_')||'other'}\nfunction outcome(r){return window.BALL46_STATISTICS_DATA.outcome(r)}\nfunction settlement(r){const o=outcome(r),odds=num(r?.odds);if(o==='PUSH'||o==='VOID')return{profit:0,stake:1,priced:true};if(o==='LOSS')return{profit:-1,stake:1,priced:true};if(o==='HALF_LOSS')return{profit:-.5,stake:1,priced:true};if(o==='WIN'){if(odds===null||odds<=1)return{profit:null,stake:0,priced:false};return{profit:odds-1,stake:1,priced:true}}if(o==='HALF_WIN'){if(odds===null||odds<=1)return{profit:null,stake:0,priced:false};return{profit:(odds-1)/2,stake:1,priced:true}}return{profit:null,stake:0,priced:false}}\nfunction routeFilter(){const q=new URLSearchParams(location.search);return{market:q.get('market')||'all',variant:q.get('variant')||'all',filter:q.get('filter')||'all'}}\nfunction filteredRows(){const f=routeFilter();let rows=rowsCache.slice();if(f.market!=='all')rows=rows.filter(r=>marketKey(r)===f.market);if(f.variant!=='all')rows=rows.filter(r=>marketDef(r)?.key===f.variant);if(f.filter!=='all')rows=rows.filter(r=>selectionKey(r)===f.filter);const days=RANGE_DAYS[range];if(days){const cutoff=Date.now()-days*86400000;rows=rows.filter(r=>dateMs(r?.settledAt??r?.createdAt)>=cutoff)}return rows.sort((a,b)=>dateMs(a?.settledAt??a?.createdAt)-dateMs(b?.settledAt??b?.createdAt))}\nfunction stats(rows){let winCredits=0,wins=0,losses=0,pushes=0,net=0,stake=0,priced=0,oddsSum=0,oddsN=0,peak=0,maxDD=0,trough=0,bestRun=0;const unitPoints=[],roiPoints=[],ratePoints=[];for(const r of rows){const o=outcome(r);winCredits+=o==='WIN'||o==='HALF_WIN'?1:0;if(o==='WIN'||o==='HALF_WIN')wins++;else if(o==='LOSS'||o==='HALF_LOSS')losses++;else if(o==='PUSH'||o==='VOID')pushes++;const odd=num(r?.odds);if(odd!==null&&odd>1){oddsSum+=odd;oddsN++}const s=settlement(r);if(s.priced){priced++;stake+=s.stake;net+=s.profit;peak=Math.max(peak,net);maxDD=Math.max(maxDD,peak-net);trough=Math.min(trough,net);bestRun=Math.max(bestRun,net-trough);unitPoints.push({row:r,value:net,profit:s.profit,date:dateMs(r?.settledAt??r?.createdAt),stake,net});roiPoints.push({row:r,value:stake?net/stake*100:0,profit:s.profit,date:dateMs(r?.settledAt??r?.createdAt),stake,net})}const wl=wins+losses;ratePoints.push({row:r,value:wl?winCredits/wl*100:0,profit:s.profit,date:dateMs(r?.settledAt??r?.createdAt),stake,net})}return{rows:rows.length,wins,losses,pushes,priced,net,stake,roi:stake?net/stake*100:null,avgOdds:oddsN?oddsSum/oddsN:null,maxDD,peak,bestRun,unitPoints,roiPoints,ratePoints}}\nfunction currentTitle(){const f=routeFilter();return $('[data-sp-market-title]')?.textContent?.trim()||MARKET_NAMES[f.market]||'Performance'}\nfunction modeLabel(){return metric==='units'?'Cumulative units':metric==='roi'?'ROI %':'Win rate %'}\nfunction b46DisplayFixed(v,d){const p=v.toFixed(d).split(\".\");p[0]=p[0].replace(/\\B(?=(\\d{3})+(?!\\d))/g,\",\");return p.join(\".\")}\nfunction valueText(v){if(!Number.isFinite(v))return'—';if(metric==='units')return`${v>=0?'+':''}${b46DisplayFixed(v,2)}U`;return`${v.toFixed(1)}%`}\nfunction kpiText(v,type){if(v===null||v===undefined||!Number.isFinite(v))return'—';if(type==='u')return`${v>=0?'+':''}${b46DisplayFixed(v,2)}U`;if(type==='pct')return`${v.toFixed(1)}%`;if(type==='odds')return v.toFixed(2);return String(v)}\nfunction getPoints(s){return metric==='roi'?s.roiPoints:metric==='rate'?s.ratePoints:s.unitPoints}\nfunction yScale(points){if(metric==='rate')return{min:0,max:100};const vals=points.map(p=>p.value).filter(Number.isFinite);if(!vals.length)return{min:-1,max:1};let min=vals.reduce((a,b)=>Math.min(a,b),0),max=vals.reduce((a,b)=>Math.max(a,b),0);if(min===max){min-=1;max+=1}const pad=(max-min)*.12;min-=pad;max+=pad;if(metric==='roi'){min=Math.floor(min/5)*5;max=Math.ceil(max/5)*5}else{min=Math.floor(min);max=Math.ceil(max)}if(min===max)max=min+1;return{min,max}}\nfunction pathData(points,min,max){const L=72,R=18,T=15,B=42,W=1000,H=250,pw=W-L-R,ph=H-T-B,span=Math.max(.0001,max-min);const xy=points.map((p,i)=>({x:L+(points.length===1?pw/2:i/(points.length-1)*pw),y:T+(max-p.value)/span*ph,p}));const line=xy.map((q,i)=>`${i?'L':'M'}${q.x.toFixed(1)} ${q.y.toFixed(1)}`).join(' ');const baseY=T+(max-0)/span*ph;const area=xy.length?`${line} L${xy[xy.length-1].x.toFixed(1)} ${Math.max(T,Math.min(T+ph,baseY)).toFixed(1)} L${xy[0].x.toFixed(1)} ${Math.max(T,Math.min(T+ph,baseY)).toFixed(1)} Z`:'';return{xy,line,area,baseY,L,R,T,B,W,H,pw,ph}}\nfunction axisSvg(points,min,max,geo){/* B46_MULTI_YEAR_AXIS_20261012 */\n const yTicks=[];for(let i=0;i<5;i++){const value=max-(max-min)*i/4,y=geo.T+geo.ph*i/4;yTicks.push('<line x1=\"'+geo.L+'\" y1=\"'+y+'\" x2=\"'+(geo.W-geo.R)+'\" y2=\"'+y+'\" class=\"b46-perf-grid '+(Math.abs(value)<1e-9?'zero':'')+'\"></line><text x=\"'+(geo.L-10)+'\" y=\"'+(y+4)+'\" text-anchor=\"end\" class=\"b46-perf-axis-text\">'+esc(valueText(value))+'</text>')}\n const n=points.length,xIdx=[];\n if(metric==='units'){\n  const maxTicks=13,stride=Math.max(1,Math.ceil(n/maxTicks));\n  for(let i=0;i<n;i++)if(i%stride===0||i===n-1)xIdx.push(i)\n }else{\n  const slots=Math.min(5,n);for(let i=0;i<slots;i++){const idx=slots===1?0:Math.round(i*(n-1)/(slots-1));if(!xIdx.includes(idx))xIdx.push(idx)}\n }\n const spanMs=Math.max(0,(points[n-1]?.date||0)-(points[0]?.date||0));\n const axisDate=(p)=>{if(metric==='units'&&p?.dayKey)return formatDayKeyEn(p.dayKey);const ms=p?.date;if(!ms)return'—';try{return new Intl.DateTimeFormat('en-GB',spanMs>330*86400000?{month:'short',year:'2-digit'}:{day:'2-digit',month:'short'}).format(new Date(ms))}catch{return fmtShort(ms)}};\n const xTicks=xIdx.map(idx=>{const p=geo.xy[idx],label=axisDate(points[idx]);return '<line x1=\"'+p.x+'\" y1=\"'+geo.T+'\" x2=\"'+p.x+'\" y2=\"'+(geo.T+geo.ph)+'\" class=\"b46-perf-vgrid\"></line><text x=\"'+p.x+'\" y=\"'+(geo.H-17)+'\" text-anchor=\"middle\" class=\"b46-perf-axis-text\">'+esc(label)+'</text>'}).join('');\n return yTicks.join('')+xTicks+'<text x=\"'+geo.L+'\" y=\"11\" class=\"b46-perf-axis-title\">'+esc(modeLabel())+'</text><text x=\"'+(geo.W-geo.R)+'\" y=\"'+(geo.H-3)+'\" text-anchor=\"end\" class=\"b46-perf-axis-title\">'+(metric==='units'?'Daily settlement timeline':'Settled signal timeline')+'</text>'\n}\nlet b46UnitView={start:null,count:null,total:0};let currentPointOffset=0,currentPointTotal=0;/* B46_UNIT_STOCK_CHART_V3_20261012 */\nfunction bangkokDayKey(ms){\n try{return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(ms))}\n catch{return new Date(ms).toISOString().slice(0,10)}\n}\nfunction formatDayKeyEn(dayKey){/* B46_DAILY_DATE_AXIS_V9_20261012 */ const m=/^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(String(dayKey||''));if(!m)return String(dayKey||'—');const mons=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],mi=Number(m[2])-1;return m[3]+' '+(mons[mi]||m[2])+' '+m[1]}\nfunction dailyUnitPoints(points){/* B46_DAILY_OHLC_CHART_V8_20261012 */\n const out=[];let d=null;\n for(const p of points){\n  const close=Number(p.value),profit=Number.isFinite(p.profit)?Number(p.profit):0,open=close-profit,key=bangkokDayKey(p.date);\n  if(!d||d.dayKey!==key){\n   if(d)out.push(d);\n   d={dayKey:key,date:p.date,open,high:Math.max(open,close),low:Math.min(open,close),close,value:close,profit:close-open,count:1,firstDate:p.date,lastDate:p.date}\n  }else{\n   d.high=Math.max(d.high,close);d.low=Math.min(d.low,close);d.close=close;d.value=close;d.profit=d.close-d.open;d.count++;d.lastDate=p.date\n  }\n }\n if(d)out.push(d);\n return out\n}\n\nconst f46CSS=\"/* Scoped to the new chart only. No page, navigation, table or promo selectors. */\\nhtml body #b46-finance-chart-card{display:block!important;background:transparent!important;box-shadow:none!important;border:0!important;padding:0!important;margin:0 0 16px!important;color:var(--f46-ink);--f46-bg:#13251e;--f46-ink:#eef6f1;--f46-muted:#8fa99b;--f46-border:#263b31;--f46-grid:#23392e;--f46-green:#40d99a;--f46-red:#fa727c;--f46-button:#1e372b;--f46-accent:var(--f46-green)}\\nhtml:not([data-theme=dark]) body #b46-finance-chart-card{--f46-bg:#fff;--f46-ink:#17291f;--f46-muted:#748278;--f46-border:#e5ece7;--f46-grid:#eaf0eb;--f46-green:#0c9560;--f46-red:#d64655;--f46-button:#e9f5ef}\\nhtml body #b46-finance-chart-card>.b46-perf-shell{display:block!important;padding:0!important;background:transparent!important;border:0!important}\\n#b46-finance-chart-card .f46-card{background:var(--f46-bg);border:1px solid var(--f46-border);border-radius:14px;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--f46-ink)}\\n#b46-finance-chart-card .f46-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 26px 0}#b46-finance-chart-card .f46-heading small{display:block;font-size:9px;letter-spacing:1.2px;font-weight:700;color:var(--f46-muted)}#b46-finance-chart-card .f46-heading h3{font-size:16px;margin:6px 0 0;letter-spacing:-.3px;color:var(--f46-ink)}\\n#b46-finance-chart-card .f46-overview{display:flex;align-items:center;justify-content:space-between;gap:30px;padding:20px 26px}#b46-finance-chart-card .f46-caption{font-size:9px;font-weight:650;letter-spacing:1px;color:var(--f46-muted)}#b46-finance-chart-card .f46-value{font-size:36px;line-height:1.35;font-weight:600;letter-spacing:-1px;color:var(--f46-accent);font-variant-numeric:tabular-nums}#b46-finance-chart-card .f46-meta{font-size:10px;color:var(--f46-muted);min-height:16px;margin-top:3px}#b46-finance-chart-card .f46-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}#b46-finance-chart-card .f46-metrics div{display:flex;flex-direction:column;gap:8px}#b46-finance-chart-card .f46-metrics span{font-size:8px;font-weight:650;letter-spacing:.6px;color:var(--f46-muted)}#b46-finance-chart-card .f46-metrics b{font-size:17px;font-weight:600;color:var(--f46-ink);font-variant-numeric:tabular-nums}\\n#b46-finance-chart-card .f46-controls{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 26px;padding-bottom:12px;border-bottom:1px solid var(--f46-border)}#b46-finance-chart-card .f46-buttons{display:flex;gap:5px}#b46-finance-chart-card .f46-controls button{background:none;color:var(--f46-muted);border:0;border-radius:7px;font:600 11px Inter,system-ui,sans-serif;padding:8px 11px;cursor:pointer}#b46-finance-chart-card .f46-controls button.active{background:var(--f46-button);color:var(--f46-green)}#b46-finance-chart-card .f46-controls button:hover{color:var(--f46-green)}#b46-finance-chart-card button:focus-visible,#b46-finance-chart-card svg:focus-visible{outline:2px solid var(--f46-green);outline-offset:2px}\\n#b46-finance-chart-card .f46-plot{position:relative;height:270px;margin:12px 18px 0;min-height:0;touch-action:pan-y}#b46-finance-chart-card .f46-svg{display:block;width:100%;height:100%;overflow:visible;touch-action:pan-y;user-select:none}#b46-finance-chart-card .f46-grid{stroke:var(--f46-grid);stroke-width:1}#b46-finance-chart-card .f46-axis{fill:var(--f46-muted);font:10px Inter,system-ui,sans-serif}#b46-finance-chart-card .f46-line{stroke:var(--f46-accent);stroke-width:2.25;fill:none;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}#b46-finance-chart-card .f46-stop{stop-color:var(--f46-accent)}#b46-finance-chart-card .f46-dot{fill:var(--f46-accent);stroke:var(--f46-bg);stroke-width:2}#b46-finance-chart-card .f46-cross{stroke:var(--f46-muted);stroke-dasharray:3 4;stroke-opacity:.65}#b46-finance-chart-card .f46-zero{stroke:var(--f46-muted);stroke-dasharray:3 5;stroke-opacity:.2}\\n#b46-finance-chart-card .f46-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 26px;padding:5px 0 19px;font-size:9px;color:var(--f46-muted)}#b46-finance-chart-card .f46-legend{display:flex;align-items:center;gap:7px}#b46-finance-chart-card .f46-legend i{width:6px;height:6px;border-radius:50%;background:var(--f46-accent)}#b46-finance-chart-card .f46-details{display:flex;gap:20px;padding:13px 26px;border-top:1px solid var(--f46-border);font-size:9px;color:var(--f46-muted)}#b46-finance-chart-card .f46-details b{font-weight:550;color:var(--f46-ink);margin-left:5px}#b46-finance-chart-card .f46-note{margin-left:auto}#b46-finance-chart-card .b46-perf-kpis{display:none!important}\\n#b46-finance-chart-card .f46-tip{position:absolute;z-index:3;pointer-events:none;background:var(--f46-bg);border:1px solid var(--f46-border);box-shadow:0 3px 14px #00000014;border-radius:8px;padding:9px 12px;font-size:10px;color:var(--f46-muted);white-space:nowrap}#b46-finance-chart-card .f46-tip strong{display:block;margin-top:4px;font-size:13px;color:var(--f46-accent);font-variant-numeric:tabular-nums}#b46-finance-chart-card [hidden]{display:none!important}#b46-finance-chart-card .f46-empty{height:100%;display:grid;place-content:center;color:var(--f46-muted);font-size:12px}\\n@media(max-width:600px){#b46-finance-chart-card .f46-card{border-radius:11px}#b46-finance-chart-card .f46-heading{padding:18px 17px 0}#b46-finance-chart-card .f46-heading small{font-size:8px}#b46-finance-chart-card .f46-heading h3{font-size:14px}#b46-finance-chart-card .f46-overview{display:block;padding:17px}#b46-finance-chart-card .f46-value{font-size:32px}#b46-finance-chart-card .f46-metrics{margin-top:21px;gap:9px}#b46-finance-chart-card .f46-metrics span{font-size:7px}#b46-finance-chart-card .f46-metrics b{font-size:14px}#b46-finance-chart-card .f46-controls{margin:0 17px;padding-bottom:10px;gap:8px}#b46-finance-chart-card .f46-buttons{gap:2px}#b46-finance-chart-card .f46-controls button{padding:7px 8px;font-size:10px}#b46-finance-chart-card .f46-plot{height:210px;margin:10px 10px 0}#b46-finance-chart-card .f46-foot{margin:0 17px;padding-bottom:16px;font-size:8px}#b46-finance-chart-card .f46-details{padding:12px 17px;gap:10px;font-size:8px;flex-wrap:wrap}#b46-finance-chart-card .f46-note{flex-basis:100%;margin-left:0}}\\n\";let f46Geo=null,f46Observer=null,f46ObservedWidth=0;\nfunction f46Style(){if(!document.getElementById('b46-finance-line-style')){const e=document.createElement('style');e.id='b46-finance-line-style';e.textContent=f46CSS;document.head.appendChild(e)}}\nfunction f46Date(t,year=false){return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',day:'numeric',month:'short',...(year?{year:'numeric'}:{})}).format(new Date(t))}\nfunction f46Points(s){const raw=getPoints(s);if(s.b46Daily)return raw;if(metric==='units')return dailyUnitPoints(raw).map(p=>({date:p.lastDate,value:p.close}));const days=new Map();for(const p of raw)days.set(bangkokDayKey(p.date),{date:p.date,value:p.value});return [...days.values()]}\nfunction chartHtml(s){const points=f46Points(s);currentPoints=points;if(!points.length){f46Geo=null;return '<div class=\"f46-empty\">No settled results in this range.</div>'}const card=document.getElementById('b46-finance-chart-card'),mobile=innerWidth<600,W=Math.max(250,Math.round(card.clientWidth-(mobile?20:36))),H=mobile?210:270,L=7,R=mobile?48:62,T=22,B=34,pw=W-L-R,ph=H-T-B;let min=Math.min(0,...points.map(p=>p.value)),max=Math.max(0,...points.map(p=>p.value));if(metric==='rate'){min=0;max=100}else{const span=Math.max(1,max-min);if(min<0)min-=span*.12;max+=span*.12}if(min===max)max=min+1;const y=v=>T+(max-v)/(max-min)*ph,x=i=>L+(points.length===1?pw/2:i/(points.length-1)*pw);f46Geo={xy:points.map((p,i)=>({x:x(i),y:y(p.value)})),W,H,L,R,T,B};let axes='';for(let i=0;i<5;i++){const v=max-(max-min)*i/4,yy=y(v);axes+='<line class=\"f46-grid\" x1=\"'+L+'\" x2=\"'+(W-R)+'\" y1=\"'+yy+'\" y2=\"'+yy+'\"/><text class=\"f46-axis\" x=\"'+(W-R+9)+'\" y=\"'+(yy+3)+'\">'+v.toLocaleString('en-GB',{maximumFractionDigits:max-min<10?1:0})+(metric==='units'?'':'%')+'</text>'}const ticks=mobile?3:5;for(let i=0;i<ticks;i++){const n=Math.round(i*(points.length-1)/(ticks-1));axes+='<text class=\"f46-axis\" text-anchor=\"'+(i===0?'start':i===ticks-1?'end':'middle')+'\" x=\"'+x(n)+'\" y=\"'+(H-7)+'\">'+f46Date(points[n].date)+'</text>'}const xy=f46Geo.xy,line=xy.map((p,i)=>(i?'L':'M')+p.x.toFixed(2)+','+p.y.toFixed(2)).join(' '),last=xy.at(-1),zero=y(0),area=line+' L'+last.x+','+zero+' L'+xy[0].x+','+zero+'Z';return '<svg class=\"b46-perf-svg f46-svg\" data-f46-line=\"1\" data-point-count=\"'+points.length+'\" tabindex=\"0\" role=\"img\" aria-label=\"'+esc(modeLabel())+' daily line chart\" viewBox=\"0 0 '+W+' '+H+'\" preserveAspectRatio=\"none\"><defs><linearGradient id=\"f46fade\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop class=\"f46-stop\" offset=\"0%\" stop-opacity=\".16\"/><stop class=\"f46-stop\" offset=\"100%\" stop-opacity=\"0\"/></linearGradient></defs>'+axes+(min<0?'<line class=\"f46-zero\" x1=\"'+L+'\" x2=\"'+(W-R)+'\" y1=\"'+zero+'\" y2=\"'+zero+'\"/>':'')+'<path fill=\"url(#f46fade)\" d=\"'+area+'\"/><path class=\"f46-line\" d=\"'+line+'\"/><circle class=\"f46-dot\" cx=\"'+last.x+'\" cy=\"'+last.y+'\" r=\"3.5\"/><line data-f46-cross class=\"f46-cross\" y1=\"'+T+'\" y2=\"'+(H-B)+'\" visibility=\"hidden\"/><circle data-f46-dot class=\"f46-dot\" r=\"4.5\" visibility=\"hidden\"/></svg><div class=\"f46-tip\" data-f46-tip hidden></div>'}\nfunction ensureCard(){f46Style();const el=$('.sp-trend');if(!el)return null;el.id='b46-finance-chart-card';el.dataset.f46Visual='1';if(!el.classList.contains('b46-perf-card')){el.classList.add('b46-perf-card');el.innerHTML='<div class=\"b46-perf-shell\" data-b46-perf-shell></div>'}return el}\nlet b46GraphData=null,b46GraphKey='',b46Request=null,b46Last=0,b46FailedAt=0,b46FailedKey='';\nconst b46Aliases={all:'all',ah:'AH','1x2':'1X2',ou:'O/U',corners:'Corners',btts:'BTTS',cards:'Cards',other:'Other'};\nfunction b46Query(){const f=routeFilter(),market=b46Aliases[f.market];return market?new URLSearchParams({market,variant:f.variant,filter:f.filter,range}):null}\nfunction b46Valid(g,q){return g&&g.ok===true&&g.source==='RECEIVER'&&g.schema===1&&['market','variant','filter','range'].every(k=>g[k]===q.get(k))&&Number.isSafeInteger(g.sequence)&&Number.isSafeInteger(g.summary?.rows)&&Number.isFinite(g.summary?.net)&&['units','roi','rate'].every(k=>Array.isArray(g.series?.[k])&&g.series[k].every(p=>Number.isFinite(p.date)&&Number.isFinite(p.value)))}\nfunction b46Expose(){const content=$('.sp-stats-content');if(content)content.style.setProperty('display','block','important');document.documentElement.classList.add('b46-receiver-graph-ready');}\nfunction b46Legacy(){if(typeof window.__B46_FAST_LOAD_DETAILS==='function')window.__B46_FAST_LOAD_DETAILS();else setTimeout(()=>{if(active())window.__B46_FAST_LOAD_DETAILS?.()},100);if(rowsCache.length)renderFromStats(stats(filteredRows()),'legacy');else void legacyLoad()}\nfunction render(force=false){\n if(!active())return;\n const q=b46Query(),key=q?.toString();if(!q){b46Legacy();return}\n const same=b46GraphKey===key&&b46GraphData;\n if(same){renderFromStats(b46GraphData,'receiver');if(!force&&Date.now()-b46Last<12000)return}\n if(b46FailedKey===key&&Date.now()-b46FailedAt<10000){if(!same)b46Legacy();return}\n if(b46Request?.key===key)return;\n const request={key};b46Request=request;\n if(!same){const c=ensureCard();if(c){c.dataset.b46StatisticsSource='loading';const sh=c.querySelector('[data-b46-perf-shell]');if(sh&&!sh.querySelector('.f46-card'))sh.innerHTML='<div class=\"f46-empty\">Loading performance…</div>'}b46Expose()}\n (async()=>{try{\n  const response=await fetch('/b46-receiver-v1/graph?'+q,{cache:'no-store',signal:AbortSignal.timeout(8000)});\n  if(!response.ok)throw Error('RECEIVER_HTTP_'+response.status);\n  const g=await response.json();if(!b46Valid(g,q))throw Error('RECEIVER_GRAPH_INVALID');\n  if(!active()||b46Query()?.toString()!==key||b46Request!==request)return;\n  b46GraphData={...g.summary,b46TotalCounts:g.counts,unitPoints:g.series.units,roiPoints:g.series.roi,ratePoints:g.series.rate,b46Daily:true,b46Sequence:g.sequence,b46Market:g.market,b46Variant:g.variant,b46Filter:g.filter,b46Range:g.range};\n  b46GraphKey=key;b46Last=Date.now();b46FailedAt=0;renderFromStats(b46GraphData,'receiver');\n  if(!window.__B46_FAST_DETAILS_REQUESTED&&!window.__B46_HISTORY_RESTORE_QUEUED){\n   window.__B46_HISTORY_RESTORE_QUEUED=true;\n   requestAnimationFrame(()=>setTimeout(()=>{\n    window.__B46_HISTORY_RESTORE_QUEUED=false;\n    if(active()&&!window.__B46_FAST_DETAILS_REQUESTED)window.__B46_FAST_LOAD_DETAILS?.();\n   },300));\n  }\n \n }catch(e){\n  if(!active()||b46Query()?.toString()!==key||b46Request!==request)return;\n  b46FailedKey=key;b46FailedAt=Date.now();b46GraphData=null;b46GraphKey='';b46Legacy();\n }finally{if(b46Request===request)b46Request=null}})();\n}\n\n/* TEST_ONLY_20261119: desktop TOTAL all-time, receiver-owned summary. */\nlet b46TotalLast=null;\nfunction b46TotalOwner(s,source,card){\n const f=routeFilter();\n const own=source==='receiver'&&window.matchMedia('(min-width:851px)').matches&&f.market==='all'&&f.variant==='all'&&f.filter==='all'&&range==='all'&&s.b46Market==='all'&&s.b46Range==='all'&&[s.rows,s.wins,s.pushes,s.losses,s.settledDays].every(n=>Number.isSafeInteger(n)&&n>=0)&&s.wins+s.pushes+s.losses===s.rows;\n const panel=card.closest('.sp-stats-content');\n if(own){card.dataset.b46TotalOwner='receiver';card.classList.add('b46-stage-summary-ready');panel?.classList.add('b46-stage-summary-ready')}\n else if(card.dataset.b46TotalOwner==='receiver'){delete card.dataset.b46TotalOwner;card.classList.remove('b46-stage-summary-ready');panel?.classList.remove('b46-stage-summary-ready');b46TotalLast=null}\n return own;\n}\nfunction b46TotalSignature(s,card,points,rate){\n return JSON.stringify([metric,range,currentTitle(),card.clientWidth,s.rows,s.net,s.roi,rate,s.avgOdds,s.settledDays,s.wins,s.pushes,s.losses,s.stake,s.maxDD,points.map(p=>[p.date,p.value])]);\n}\nfunction b46TotalUnchanged(s,card,shell,points,rate){\n return b46TotalLast&&b46TotalLast.shell===shell&&b46TotalLast.signature===b46TotalSignature(s,card,points,rate)&&shell.querySelector('.b46-stage-summary-grid')&&shell.querySelector('.b46-stage-outcomes');\n}\nfunction b46TotalCommit(s,card,shell,points,rate){b46TotalLast={shell,signature:b46TotalSignature(s,card,points,rate)}}\nfunction b46TotalPending(s,card){\n let pending=null;\n const counts=s.b46TotalCounts;\n if(Number.isSafeInteger(counts?.pending)&&counts.pending>=0&&Number.isSafeInteger(counts?.unresolved)&&counts.unresolved>=0)pending=counts.pending+counts.unresolved;\n if(pending===null){let snap;try{snap=window.BALL46_STATISTICS_DATA?.getSnapshot?.()}catch{}if(snap?.ok===true&&snap.total===s.rows&&Number.isSafeInteger(snap.pending)&&snap.pending>=0&&Number.isSafeInteger(snap.unresolved)&&snap.unresolved>=0)pending=snap.pending+snap.unresolved}\n const item=card.querySelector('.b46-stage-summary-item[data-key=\"unsettled\"]');\n const value=item?.querySelector('.b46-stage-summary-number');\n if(value&&pending!==null){const next=String(pending);if(value.textContent!==next){value.textContent=next;item.title='UNSETTLED · '+next}}\n}\nfunction b46WdlMarkup(v){const m=String(v).match(/^([\\d,]+)\\s*·\\s*([\\d,]+)\\s*·\\s*([\\d,]+)$/);return m?['win','draw','loss'].map((k,i)=>'<span data-b46-wdl=\"'+k+'\">'+esc(m[i+1])+'</span>').join(' · '):esc(v)}\nfunction b46RoiTone(v){const t=String(v).trim();if(!/^[-+]?\\d+(?:\\.\\d+)?%$/.test(t))return 'neutral';const n=Number(t.slice(0,-1));return n>0?'green':n<0?'red':'yellow'}\nfunction b46RateTone(v){const m=String(v).trim().match(/^(\\d+(?:\\.\\d+)?)%$/);if(!m)return 'neutral';const n=Number(m[1]);return n>50?'green':n===50?'yellow':'red'}\nfunction b46MarketOutcomeMarkup(s){const outcomes=[['win','Win',s.wins],['push','DRAW',s.pushes],['loss','Loss',s.losses]];const pct=n=>s.rows?(100*n/s.rows).toFixed(1)+'%':'—';\n return '<section class=\"b46-market-unified-outcomes\" aria-label=\"Signal outcomes by settlement result\"><div class=\"b46-market-unified-outcomes-heading\"><strong>SIGNAL OUTCOMES</strong><span>'+esc(range==='all'?'All time':'Last '+RANGE_DAYS[range]+' days')+'</span></div><div class=\"b46-market-unified-outcomes-track\" role=\"img\" aria-label=\"'+esc(outcomes.map(([k,l,n])=>l.toLowerCase()+' '+n.toLocaleString('en-US')).join(', '))+'\">'+outcomes.map(([k,l,n])=>'<span class=\"b46-market-unified-outcomes-segment\" data-result=\"'+k+'\" data-count=\"'+n+'\" style=\"flex-grow:'+n+'\" title=\"'+esc(l+' · '+n.toLocaleString('en-US')+' · '+pct(n))+'\"></span>').join('')+'</div><div class=\"b46-market-unified-outcomes-legend\">'+outcomes.map(([k,l,n])=>'<span class=\"b46-market-unified-outcomes-legend-item\" data-result=\"'+k+'\"><i class=\"b46-market-unified-outcomes-legend-dot\" aria-hidden=\"true\"></i><span>'+l+'</span><b>'+pct(n)+'</b></span>').join('')+'</div></section>';}\nfunction b46TotalMarkup(s,rate){\n const outcomes=[['win','Win',s.wins],['push','DRAW',s.pushes],['loss','Loss',s.losses]];\n const pct=n=>s.rows?(100*n/s.rows).toFixed(1)+'%':'—';\n const tiles=[['ROI','roi',kpiText(s.roi,'pct'),b46RoiTone(kpiText(s.roi,'pct'))],['WIN RATE','rate',kpiText(rate,'pct'),b46RateTone(kpiText(rate,'pct'))],['AVG ODDS','odds',kpiText(s.avgOdds,'odds'),'white'],['SETTLED DAYS','days',String(s.settledDays),'white'],['UNSETTLED','unsettled','—','amber'],['W · D · L','wpl',[s.wins,s.pushes,s.losses].map(n=>n.toLocaleString('en-US')).join(' · '),'white'],['UNITS USED','stake',b46DisplayFixed(s.stake,0)+'U','white'],['MAX DRAWDOWN','drawdown',s.maxDD?'-'+b46DisplayFixed(s.maxDD,2)+'U':'0.00U',s.maxDD?'red':'white']];\n return '<section class=\"b46-stage-outcomes\" aria-label=\"Signal outcomes by settlement result\"><div class=\"b46-stage-outcomes-heading\"><strong>SIGNAL OUTCOMES</strong><span>All time</span></div><div class=\"b46-stage-outcomes-track\" role=\"img\" aria-label=\"'+esc(outcomes.map(([k,l,n])=>l.toLowerCase()+' '+n.toLocaleString('en-US')).join(', '))+'\">'+outcomes.map(([k,l,n])=>'<span class=\"b46-stage-outcomes-segment\" data-result=\"'+k+'\" data-count=\"'+n+'\" style=\"flex-grow:'+n+'\" title=\"'+esc(l+' · '+n.toLocaleString('en-US')+' · '+pct(n))+'\"></span>').join('')+'</div><div class=\"b46-stage-outcomes-legend\">'+outcomes.map(([k,l,n])=>'<span class=\"b46-stage-outcomes-legend-item\" data-result=\"'+k+'\"><i class=\"b46-stage-outcomes-legend-dot\" aria-hidden=\"true\"></i><span>'+l+'</span><b>'+pct(n)+'</b></span>').join('')+'</div></section><div class=\"b46-stage-summary-grid\" role=\"group\" aria-label=\"All-time statistics summary\">'+tiles.map(([l,k,v,t])=>'<div class=\"b46-stage-summary-item\" data-key=\"'+k+'\" data-tone=\"'+t+'\" title=\"'+esc(l+' · '+v)+'\"><span class=\"b46-stage-summary-label\">'+l+'</span><strong class=\"b46-stage-summary-number\"'+(k==='rate'?' data-b46-rate-tone=\"'+b46RateTone(v)+'\"':k==='roi'?' data-b46-roi-tone=\"'+b46RoiTone(v)+'\"':'')+'>'+(k==='wpl'?b46WdlMarkup(v):esc(v))+'</strong></div>').join('')+'</div>';\n}\n\nfunction renderFromStats(s,source){const card=ensureCard();if(!card)return;const shell=card.querySelector('[data-b46-perf-shell]');if(!shell)return;const points=f46Points(s),last=points.at(-1),rate=(s.wins+s.losses)>0?s.wins/(s.wins+s.losses)*100:null;const totalOwned=b46TotalOwner(s,source,card);if(totalOwned&&b46TotalUnchanged(s,card,shell,points,rate)){b46TotalPending(s,card);card.dataset.b46Sequence=String(s.b46Sequence??'');return}card.style.setProperty('--f46-accent',(last?.value??0)<0?'var(--f46-red)':'var(--f46-green)');\n const oldKpis='<div class=\"b46-perf-kpis\" hidden aria-hidden=\"true\">'+[['ROI',kpiText(s.roi,'pct'),'Net ÷ units used'],['NET',kpiText(s.net,'u'),'Cumulative P/L'],['UNITS USED',b46DisplayFixed(s.stake,0)+'U','1U per priced signal'],['W · D · L',[s.wins,s.pushes,s.losses].map(n=>n.toLocaleString('en-US')).join(' · '),s.rows.toLocaleString('en-US')+' settled'],['AVG ODDS',kpiText(s.avgOdds,'odds'),'Recorded entry'],['MAX DRAWDOWN',s.maxDD?'-'+b46DisplayFixed(s.maxDD,2)+'U':'0.00U','Peak-to-trough']].map(v=>'<div class=\"b46-perf-kpi\"><span>'+v[0]+'</span><b>'+v[1]+'</b><small>'+v[2]+'</small></div>').join('')+'</div>';\n const nextMarkup='<article class=\"f46-card\"><div class=\"f46-heading\"><div><small>LONG-TERM PERFORMANCE · 1 UNIT</small><h3>'+esc(currentTitle())+'</h3></div></div><div class=\"f46-overview\"><div><div class=\"f46-caption\">'+esc(modeLabel()).toUpperCase()+'</div><div class=\"f46-value\" data-f46-value>'+valueText(last?.value)+'</div><div class=\"f46-meta\" data-f46-meta>'+s.rows.toLocaleString('en-GB')+' settled signals · '+(range==='all'?'All time':'Last '+RANGE_DAYS[range]+' days')+'</div></div>'+(totalOwned?b46TotalMarkup(s,rate):'')+(!totalOwned||!window.matchMedia('(min-width:851px)').matches?b46MarketOutcomeMarkup(s):'')+'<div class=\"f46-metrics\">'+[['ROI',kpiText(s.roi,'pct')],['WIN RATE',kpiText(rate,'pct')],['AVG ODDS',kpiText(s.avgOdds,'odds')],['SETTLED',s.rows.toLocaleString('en-GB')]].map(v=>'<div><span>'+v[0]+'</span><b'+(v[0]==='WIN RATE'?' data-b46-rate-tone=\"'+b46RateTone(v[1])+'\"':v[0]==='ROI'?' data-b46-roi-tone=\"'+b46RoiTone(v[1])+'\"':'')+'>'+v[1]+'</b></div>').join('')+'</div></div><div class=\"f46-controls\"><div class=\"f46-buttons\">'+[['units','Net units'],['roi','ROI'],['rate','Win rate']].map(v=>'<button data-b46-mode=\"'+v[0]+'\" class=\"'+(metric===v[0]?'active':'')+'\" aria-pressed=\"'+(metric===v[0])+'\">'+v[1]+'</button>').join('')+'</div><div class=\"f46-buttons\">'+[['d7','7D'],['d30','30D'],['d90','90D'],['all','ALL']].map(v=>'<button data-b46-range=\"'+v[0]+'\" class=\"'+(range===v[0]?'active':'')+'\" aria-pressed=\"'+(range===v[0])+'\">'+v[1]+'</button>').join('')+'</div></div><div class=\"f46-plot\" data-f46-plot>'+chartHtml(s)+'</div><div class=\"f46-foot\"><span class=\"f46-legend\"><i></i>'+esc(modeLabel())+' · Daily close</span><span>'+(points.length?f46Date(points[0].date)+' — '+f46Date(last.date):'—')+'</span></div><div class=\"f46-details\"><span>UNITS USED <b>'+b46DisplayFixed(s.stake,0)+'U</b></span><span>Max drawdown <b>'+(s.maxDD?'-'+b46DisplayFixed(s.maxDD,2)+'U':'0.00U')+'</b></span><span class=\"f46-note\">'+(s.rows>s.priced?(s.rows-s.priced)+' rows without entry odds':'1 unit per priced signal')+'</span></div>'+oldKpis+'</article>';b46Inplace(shell,nextMarkup);card.dataset.b46StatisticsSource=source;card.dataset.b46Sequence=String(s.b46Sequence??'');card.dataset.b46Market=String(s.b46Market??'');card.dataset.b46Variant=String(s.b46Variant??'');card.dataset.b46Filter=String(s.b46Filter??'');card.dataset.b46Range=String(s.b46Range??'');card.dataset.b46Settled=String(s.rows);card.dataset.b46Net=String(s.net);if(totalOwned){b46TotalPending(s,card);b46TotalCommit(s,card,shell,points,rate)}b46Expose();if(!window.__B46_FAST_DETAILS_REQUESTED&&!shell.querySelector('.b46-fast-details')){const btn=document.createElement('button');btn.type='button';btn.className='b46-fast-details';btn.dataset.b46LegacyDetails='1';btn.textContent='Load detailed history';btn.style.cssText='padding:8px 12px;margin:6px 12px 12px;border:1px solid var(--f46-border);border-radius:8px;background:var(--f46-button);color:var(--f46-ink);cursor:pointer';btn.onclick=()=>{btn.disabled=true;btn.textContent='Loading detailed history…';window.__B46_FAST_LOAD_DETAILS?.();};shell.querySelector('.f46-card')?.append(btn)}bindCard();bindChart();if(!f46Observer){f46ObservedWidth=card.clientWidth;f46Observer=new ResizeObserver(()=>{const w=card.clientWidth;if(w>0&&Math.abs(w-f46ObservedWidth)>2){f46ObservedWidth=w;requestAnimationFrame(()=>{if(active())render()})}});f46Observer.observe(card)}document.dispatchEvent(new CustomEvent('ball46:finance-line-ready'));}\n/* B46_LIVE_INPLACE_TEST_V1 */\nfunction b46Inplace(shell,markup){\n const t=document.createElement('template');t.innerHTML=markup;\n const next=t.content.firstElementChild,old=shell.querySelector('.f46-card');\n if(!old){shell.replaceChildren(next);return}\n for(const sel of ['.f46-heading','.f46-overview','.f46-plot','.f46-foot','.f46-details','.b46-perf-kpis']){\n const a=old.querySelector(sel),b=next.querySelector(sel);\n if(a&&b&&a.innerHTML!==b.innerHTML)a.innerHTML=b.innerHTML;\n }\n for(const btn of old.querySelectorAll('[data-b46-range],[data-b46-mode]')){\n const active=btn.dataset.b46Range===range||btn.dataset.b46Mode===metric;\n btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',String(active));\n }\n}\nfunction bindCard(){const card=document.getElementById('b46-finance-chart-card');card.querySelectorAll('[data-b46-range]').forEach(b=>b.onclick=()=>{range=b.dataset.b46Range;render()});card.querySelectorAll('[data-b46-mode]').forEach(b=>b.onclick=()=>{metric=b.dataset.b46Mode;render()})}\nfunction bindChart(){const card=document.getElementById('b46-finance-chart-card'),svg=card.querySelector('[data-f46-line]'),plot=card.querySelector('[data-f46-plot]'),tip=card.querySelector('[data-f46-tip]');if(!svg||!f46Geo||!tip||svg.dataset.b46Bound)return;svg.dataset.b46Bound='1';let frame=0,index=currentPoints.length-1;const initialValue=card.querySelector('[data-f46-value]').textContent,initialMeta=card.querySelector('[data-f46-meta]').textContent;const hide=()=>{tip.hidden=true;card.querySelector('[data-f46-cross]').setAttribute('visibility','hidden');card.querySelector('[data-f46-dot]').setAttribute('visibility','hidden');card.querySelector('[data-f46-value]').textContent=initialValue;card.querySelector('[data-f46-meta]').textContent=initialMeta};const select=n=>{index=Math.max(0,Math.min(currentPoints.length-1,n));const p=currentPoints[index],xy=f46Geo.xy[index],cross=card.querySelector('[data-f46-cross]'),dot=card.querySelector('[data-f46-dot]');cross.setAttribute('x1',xy.x);cross.setAttribute('x2',xy.x);cross.setAttribute('visibility','visible');dot.setAttribute('cx',xy.x);dot.setAttribute('cy',xy.y);dot.setAttribute('visibility','visible');card.querySelector('[data-f46-value]').textContent=valueText(p.value);card.querySelector('[data-f46-meta]').textContent=f46Date(p.date,true)+' · Daily close';tip.innerHTML=esc(f46Date(p.date,true))+'<strong>'+esc(valueText(p.value))+'</strong>';tip.hidden=false;const scale=plot.clientWidth/f46Geo.W;tip.style.left=Math.max(0,Math.min(plot.clientWidth-tip.offsetWidth,xy.x*scale+12))+'px';tip.style.top=Math.max(0,xy.y*(plot.clientHeight/f46Geo.H)-tip.offsetHeight-12)+'px'};svg.addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*f46Geo.W;cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>select(Math.round((x-f46Geo.L)/(f46Geo.W-f46Geo.L-f46Geo.R)*(currentPoints.length-1))))});svg.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch')hide()});svg.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Escape'].includes(e.key)){e.preventDefault();if(e.key==='Escape')hide();else select(index+(e.key==='ArrowLeft'?-1:1))}})}\nfunction load(){render()}\nasync function legacyLoad(){/* B46_VERIFIED_FAST_V1_LAZY_20261116 */if(!window.__B46_FAST_DETAILS_REQUESTED)return;if(rowsCache.length&&Date.now()-loadedAt<CACHE_MS){renderFromStats(stats(filteredRows()),'legacy');return}if(loading){await loading;return}loading=(async()=>{try{const data=await window.BALL46_STATISTICS_DATA.load();rowsCache=data.rows;loadedAt=Date.now();if(active())renderFromStats(stats(filteredRows()),'legacy')}catch(err){const card=ensureCard();if(card){const shell=card.querySelector('[data-b46-perf-shell]');if(shell)shell.innerHTML='<div class=\"b46-perf-empty\">Long-term performance data is incomplete or temporarily unavailable.</div>'}console.warn('[Ball46 performance]',err)}})();try{await loading}finally{loading=null}}\nfunction active(){return document.body.dataset.workspaceView==='statistics'||$('[data-workspace-panel=\"statistics\"]')?.hidden===false}\ndocument.addEventListener('ball46:statistics-snapshot',e=>{rowsCache=e.detail.rows;loadedAt=Date.now();if(active())render()});\nfunction refreshSoon(){setTimeout(()=>{if(active())load()},40)}\ndocument.addEventListener('ball46:workspace-view',e=>{if(e?.detail?.view==='statistics')load()});document.addEventListener('click',e=>{if(e.target.closest('[data-stat-market],[data-sp-filter],[data-sp-variant]'))refreshSoon()});window.addEventListener('popstate',refreshSoon);\nconst boot=()=>{const label=$('[data-sp-filter-label]');if(label)new MutationObserver(()=>{if(active())render()}).observe(label,{childList:true,subtree:true,characterData:true});if(active())load()};\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();setInterval(()=>{if(active()&&!document.hidden)render(true)},15000);\n})();\n\n/* B46_CANONICAL_WIN_RATE_PROD_V1 */\n";
          const anchor='const r = await env.B46_PRODUCTION_READ.fetch(new Request(new URL(u.pathname + u.search, "https://ball46.com"), { method: req.method, headers, redirect: "manual" }));';
          assert.equal(source.split(anchor).length,2,'ROUTE_DRIFT');
          const worker=source.replace(anchor,()=> 'if(u.pathname==="/longterm-performance-343.js" && (req.method==="GET"||req.method==="HEAD")) return new Response(req.method==="HEAD"?null:'+JSON.stringify(client)+',{headers:{"content-type":"application/javascript; charset=utf-8","cache-control":"no-store","x-robots-tag":"noindex, nofollow"}});\n'+anchor);
          for(const [n,t] of [['worker',worker],['client',client]]){fs.writeFileSync('/tmp/'+n+'.mjs',t);execFileSync(process.execPath,['--check','/tmp/'+n+'.mjs']);}
          const mods={...modules,[main]:worker};
          assert.equal(await ver(name),current,'CONCURRENT_FRONTEND_UPDATE_ABORT');
          const metadata={main_module:main,compatibility_date:v.compatibility_date||'2026-11-20',
           bindings:settings.bindings.map(b=>({name:b.name,type:'inherit'})),
           ...(v.compatibility_flags?.length?{compatibility_flags:v.compatibility_flags}:{})};
          const form=new FormData();
          form.append('metadata',new Blob([JSON.stringify(metadata)],{type:'application/json'}),'metadata.json');
          for(const [moduleName,t] of Object.entries(mods))
           form.append(moduleName,new Blob([t],{type:'application/javascript+module'}),moduleName);
          console.log('TEST_PREVIOUS',current);
          await cf('/scripts/'+name+'?bindings_inherit=strict',{method:'PUT',body:form});
          let target=null;
          for(let i=0;i<45;i++){
           const next=await ver(name);
           if(next!==current){
            const raw=await cf('/workers/'+name+'/versions/'+next+'?include=modules');
            const got=Object.fromEntries(raw.modules.map(m=>[m.name,Buffer.from(m.content_base64,'base64').toString()]));
            if(Object.keys(got).length===Object.keys(mods).length&&
             Object.entries(mods).every(([k,v])=>got[k]===v)){target=next;break}
           }
           await new Promise(resolve=>setTimeout(resolve,900));
          }
          assert(target,'NEW_TEST_FRONTEND_BINARY_NOT_VERIFIED');
          await cf('/scripts/'+name+'/deployments',{method:'POST',headers:{'content-type':'application/json'},
           body:JSON.stringify({strategy:'percentage',versions:[{version_id:target,percentage:100}],code_update_strategy:{mode:'immediate'}})});
          
          console.log('TEST_DEPLOY',target,'ROLLBACK',current);
          const response=await fetch(host+'/longterm-performance-343.js?qa='+Date.now());assert.equal(await response.text(),client);
          assert.deepEqual(Object.fromEntries(await Promise.all(protectedWorkers.map(async n=>[n,await ver(n)]))),frozen);
          
          JS
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Click QA
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          for(const width of [1440,390]){
          const page=await browser.newPage({viewport:{width,height:900}});
          await page.goto('https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev/index.html?view=statistics&market=1x2');
          const card=page.locator('#b46-finance-chart-card .f46-card');
          await card.waitFor({timeout:45000});
          await page.evaluate(()=>{window.qaCard=document.querySelector('.f46-card');window.qaPlot=document.querySelector('[data-f46-plot]');});
          for(const range of ['d7','d30','d90','all']){
          await page.locator('[data-b46-range="'+range+'"]').click();
          await page.waitForFunction(r=>document.querySelector('[data-b46-range="'+r+'"]')?.classList.contains('active'),range,{timeout:20000});
          assert(await page.evaluate(()=>window.qaCard===document.querySelector('.f46-card')&&window.qaPlot===document.querySelector('[data-f46-plot]')));
          }
          for(const metric of await page.locator('[data-b46-mode]').evaluateAll(xs=>xs.map(x=>x.dataset.b46Mode))){
          await page.locator('[data-b46-mode="'+metric+'"]').click();
          await page.waitForFunction(m=>document.querySelector('[data-b46-mode="'+m+'"]')?.classList.contains('active'),metric);
          assert(await page.evaluate(()=>window.qaCard===document.querySelector('.f46-card')));
          }
          console.log('CLICK_QA_PASS',width);await page.close();
          }await browser.close();
