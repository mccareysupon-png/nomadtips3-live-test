name: Audit BALL46 Production Mobile Pin 20261112
on:
  push:
    branches: [test/ball46-pin-v2-mobile-fix-20261112]
    paths: ['pinned-fixtures-v2-production/MOBILE_PROD_AUDIT_READY']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: test/ball46-pin-v2-mobile-fix-20261112}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install chromium
      - run: node pinned-fixtures-v2-production/mobile-prod-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-prod-audit-${{ github.run_id }}
          path: pinned-fixtures-v2-production/mobile-prod-audit.png
          retention-days: 7
