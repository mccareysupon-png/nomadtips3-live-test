name: B46 private production receiver and safe handshake
on:
  push:
    branches: [chatgpt/ball46-new-ledger-clean-v1]
    paths: ['.github/workflows/b46-production-receiver-gate.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b46-production-receiver-gate
  cancel-in-progress: false
jobs:
  receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '62cb0db544160e6591342abd6b4f35cc'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Stage candidate, then deploy only new private receiver after stage passes
        working-directory: chatgpt-statistics-ui
        run: |
          set -euo pipefail
          node --check shadow-receiver-production.mjs
          node --check shadow-receiver-binding-verifier.mjs
          TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$TOKEN"
          STAGE="ball46-shadow-receiver-qa-${GITHUB_RUN_ID}"
          PROD="ball46-shadow-receiver-production"
          VERIFY="ball46-shadow-receiver-verifier-${GITHUB_RUN_ID}"
          receiver_config() {
            local target="$1"
            case "$target" in "$STAGE"|"$PROD") ;; *) exit 1;; esac
            cat > wrangler-receiver-gate.toml <<CONF
          name = "$target"
          main = "shadow-receiver-production.mjs"
          compatibility_date = "2026-11-17"
          workers_dev = false
          preview_urls = false
          [[durable_objects.bindings]]
          name = "PRODUCTION_SHADOW_BOOK"
          class_name = "ProductionShadowInbox"
          [[migrations]]
          tag = "shadow-inbox-v1"
          new_sqlite_classes = ["ProductionShadowInbox"]
          CONF
            npx --yes wrangler@4 deploy --config wrangler-receiver-gate.toml
            printf '%s' "$TOKEN" | npx --yes wrangler@4 secret put SHADOW_HEALTH_TOKEN --config wrangler-receiver-gate.toml
          }
          verifier_config() {
            local target="$1" mode="$2"
            if [ "$target" = "$PROD" ]; then test "$mode" = "health-only"; fi
            cat > wrangler-verifier-gate.toml <<CONF
          name = "$VERIFY"
          main = "shadow-receiver-binding-verifier.mjs"
          compatibility_date = "2026-11-17"
          workers_dev = true
          preview_urls = false
          [vars]
          TEST_MODE = "$mode"
          [[services]]
          binding = "B46_SHADOW_RECEIVER"
          service = "$target"
          CONF
            npx --yes wrangler@4 deploy --config wrangler-verifier-gate.toml || { sleep 5; npx --yes wrangler@4 deploy --config wrangler-verifier-gate.toml; }
            printf '%s' "$TOKEN" | npx --yes wrangler@4 secret put SHADOW_HEALTH_TOKEN --config wrangler-verifier-gate.toml
          }
          BASE="https://$VERIFY.mccarey-supon.workers.dev"
          check_health() {
            local total="$1" good=false
            for i in $(seq 1 20); do
              code=$(curl -sS --max-time 20 -o /tmp/b46-receiver-health.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$BASE/verify" || true)
              if [ "$code" = 200 ] && node -e 'const d=require("/tmp/b46-receiver-health.json");process.exit(d.ok&&d.unauthenticatedStatus===403&&d.authenticatedStatus===200&&d.state.total===Number(process.argv[1])&&!d.state.hasPending&&!d.state.hasConflicts?0:1)' "$total"; then good=true; break; fi
              sleep 3
            done
            test "$good" = true
          }
          receiver_config "$STAGE"
          verifier_config "$STAGE" stage-only
          sleep 5
          check_health 0
          dry=$(curl -sS --max-time 30 -o /tmp/b46-stage-write.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" "$BASE/test-staging")
          test "$dry" = 200
          node -e 'const d=require("/tmp/b46-stage-write.json");if(!d.ok)throw Error("STAGE_WRITE_FAILED");console.log("STAGE_DUPLICATE_SEND="+JSON.stringify(d))'
          check_health 2
          node -e 'console.log("STAGE_RECEIVER_PASS="+JSON.stringify(require("/tmp/b46-receiver-health.json")))'
          # Only the new receiver is a production deployment target. Never deploy the Engine.
          receiver_config "$PROD"
          verifier_config "$PROD" health-only
          sleep 5
          check_health 0
          node -e 'console.log("PRODUCTION_RECEIVER_HANDSHAKE="+JSON.stringify(require("/tmp/b46-receiver-health.json")))'
          echo "ENGINE_BINDING_CANDIDATE=B46_SHADOW_RECEIVER -> $PROD"
          echo "ENGINE_CHANGED=false; LIVE_ENGINE_HANDSHAKE=false; PRODUCTION_TEST_WRITES=0"
      - name: Delete temporary public verifier only
        if: always()
        working-directory: chatgpt-statistics-ui
        run: |
          if [ -f wrangler-verifier-gate.toml ]; then
            grep -Fx "name = \"ball46-shadow-receiver-verifier-${GITHUB_RUN_ID}\"" wrangler-verifier-gate.toml
            npx --yes wrangler@4 delete --config wrangler-verifier-gate.toml --force
          fi
