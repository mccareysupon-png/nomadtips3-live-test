name: BALL46 Flag JS Source Audit Read Only
on:
  push:
    branches: [fix/ball46-flag-flicker-root-cause-20261021]
    paths:
      - '.github/workflows/ball46-flag-source-readonly.yml'
      - 'deploy-assets/flag-flicker-20261021/source-inspect.mjs'
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node deploy-assets/flag-flicker-20261021/source-inspect.mjs