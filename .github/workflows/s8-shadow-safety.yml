name: S8 Shadow Safety

on:
  push:
    branches: [feature/s8-shadow-readonly-341]
    paths:
      - "nomad-live-engine/**"
      - ".github/workflows/s8-shadow-safety.yml"
  pull_request:
    branches: [main]
    paths:
      - "nomad-live-engine/**"
      - ".github/workflows/s8-shadow-safety.yml"

permissions:
  contents: read

jobs:
  shadow-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify branch touches only shadow safety files
        shell: bash
        run: |
          git fetch origin main
          ALLOWED='^(nomad-live-engine/src/price-sources\.js|nomad-live-engine/test/s8-external\.test\.js|\.github/workflows/s8-shadow-safety\.yml)$'
          BAD=$(git diff --name-only origin/main...HEAD | grep -Ev "$ALLOWED" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Unexpected files changed on S8 shadow branch"
            printf '%s\n' "$BAD"
            exit 1
          fi

      - name: Run NOMAD 3.41 engine tests
        working-directory: nomad-live-engine
        run: npm test

      - name: Assert S8 is hard-blocked from selection
        shell: bash
        run: |
          grep -q "item.id!=='source8'" nomad-live-engine/src/price-sources.js
          grep -q "S8 shadow can never act alone" nomad-live-engine/test/s8-external.test.js
          echo "S8 shadow selection fuse present"
