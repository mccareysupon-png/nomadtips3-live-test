name: BALL46 Statistics Light/Dark Active Worker Read Only
on:
  push:
    branches: [codex/ball46-stats-14row-allthemes-repair-20261020]
    paths:
      - '.github/workflows/ball46-stats-v23-status-readonly.yml'
      - 'deploy-assets/stats-pc-v2-preview-20261020/status-only-v23.mjs'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node deploy-assets/stats-pc-v2-preview-20261020/status-only-v23.mjs
