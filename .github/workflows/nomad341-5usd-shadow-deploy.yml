name: NOMAD 3.41 Native 5USD Shadow Deploy

on:
  push:
    branches:
      - work/nomad341-5usd-native
    paths:
      - 'nomad-live-engine/src/fivedollar.js'
      - 'nomad-live-engine/src/fivedollar-runtime.js'
      - 'nomad-live-engine/src/index-fiveusd-shadow.js'
      - 'nomad-live-engine/test/fivedollar*.test.js'
      - 'nomad-live-engine/test/index-fiveusd-shadow.test.js'
      - 'nomad-live-engine/wrangler-fiveusd-shadow.toml'
      - '.github/workflows/nomad341-5usd-shadow-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FIVEDOLLAR_API_KEY: ${{ secrets.FIVEDOLLAR_API_KEY }}
  SHADOW_URL: https://nomadtips3-live-engine-5usd-shadow.mccarey-supon.workers.dev
  EXPECTED_RUNTIME_CONTRACT: 341-5usd-unrestricted-v1

jobs:
  validate-deploy-observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate native shadow code
        working-directory: nomad-live-engine
        run: |
          set -euo pipefail
          node --test
          node --check src/fivedollar.js
          node --check src/fivedollar-runtime.js
          node --check src/index-fiveusd-shadow.js
          grep -Fq 'main = "src/index-fiveusd-shadow.js"' wrangler-fiveusd-shadow.toml
          grep -Fq 'FIVEUSD_NATIVE_MODE = "shadow"' wrangler-fiveusd-shadow.toml
          grep -Fq 'FIVEUSD_SHADOW_LEGACY_DISABLED = "true"' wrangler-fiveusd-shadow.toml
          grep -Fq 'FIVEUSD_LIVE_REFRESH_MS = "3000"' wrangler-fiveusd-shadow.toml
          grep -Fq 'FIVEUSD_GLOBAL_REQUEST_BUDGET_PER_60S = "40"' wrangler-fiveusd-shadow.toml
          grep -Fq "341-5usd-unrestricted-v1" src/index-fiveusd-shadow.js
          ! grep -Fq 'FIVEUSD_LIVE_REQUEST_BUDGET_PER_60S' wrangler-fiveusd-shadow.toml
          ! grep -Fq 'FIVEUSD_UPCOMING_REQUEST_BUDGET_PER_60S' wrangler-fiveusd-shadow.toml
          ! grep -Fq 'FIVEUSD_REFEREE_REQUEST_BUDGET_PER_60S' wrangler-fiveusd-shadow.toml
          ! grep -Fq 'FIVEUSD_MAX_REFEREE_STARTS_PER_TICK' wrangler-fiveusd-shadow.toml
          ! grep -Fq 'FIVEUSD_LIVE_MAX_PAGES' wrangler-fiveusd-shadow.toml

      - name: Dry-run shadow bundle
        working-directory: nomad-live-engine
        run: npx --yes wrangler@4.131.1 deploy --dry-run --config wrangler-fiveusd-shadow.toml

      - name: Validate deploy credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$FIVEDOLLAR_API_KEY"

      - name: Deploy isolated 3.41 shadow worker
        working-directory: nomad-live-engine
        run: npx --yes wrangler@4.131.1 deploy --config wrangler-fiveusd-shadow.toml

      - name: Bind 5USD secret to shadow worker
        working-directory: nomad-live-engine
        run: printf '%s' "$FIVEDOLLAR_API_KEY" | npx --yes wrangler@4.131.1 secret put FIVEDOLLAR_API_KEY --config wrangler-fiveusd-shadow.toml

      - name: Re-deploy code after secret update
        working-directory: nomad-live-engine
        run: npx --yes wrangler@4.131.1 deploy --config wrangler-fiveusd-shadow.toml

      - name: Arm shadow engine and verify unrestricted native lanes
        run: |
          set -euo pipefail
          probe() {
            local url="$1" out="$2"
            local code=""
            for attempt in $(seq 1 15); do
              code=$(curl -sS --max-time 20 -o "$out" -w '%{http_code}' "$url" || true)
              echo "probe attempt $attempt -> HTTP $code"
              if [ "$code" = "200" ]; then return 0; fi
              sleep 2
            done
            echo "::error::Shadow endpoint never became ready: $url"
            [ -f "$out" ] && cat "$out" || true
            return 1
          }

          wait_contract() {
            local out="$1"
            for attempt in $(seq 1 20); do
              probe "$SHADOW_URL/fiveusd-native?contract=$RANDOM" "$out"
              actual=$(node -e "const x=require('$out');process.stdout.write(String(x.runtimeContract||''))")
              echo "runtime contract attempt $attempt -> ${actual:-missing}"
              if [ "$actual" = "$EXPECTED_RUNTIME_CONTRACT" ]; then return 0; fi
              sleep 2
            done
            echo "::error::Expected runtime contract $EXPECTED_RUNTIME_CONTRACT was not active"
            cat "$out" || true
            return 1
          }

          probe "$SHADOW_URL/health?arm=$RANDOM" /tmp/health0.json
          wait_contract /tmp/contract.json
          sleep 10
          probe "$SHADOW_URL/fiveusd-native?sample=1&n=$RANDOM" /tmp/native1.json
          sleep 8
          probe "$SHADOW_URL/fiveusd-native?sample=2&n=$RANDOM" /tmp/native2.json
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/native1.json','utf8'));
          const b=JSON.parse(fs.readFileSync('/tmp/native2.json','utf8'));
          const expected=process.env.EXPECTED_RUNTIME_CONTRACT;
          if(a.runtimeContract!==expected||b.runtimeContract!==expected) throw new Error('stale runtime contract');
          if(a.ok!==true||b.ok!==true) throw new Error('shadow endpoint not ok');
          if(a.enabled!==true||a.mode!=='shadow'||a.shadowOnly!==true) throw new Error('shadow mode contract mismatch');
          if(a.legacyShadowDisabled!==true) throw new Error('legacy isolation missing');
          if(a.cadence?.cycleMs!==3000||a.cadence?.noOverlap!==true) throw new Error('3s cadence contract mismatch');
          if(!a.state?.startedAt||!b.state?.startedAt) throw new Error('native alarm did not tick');
          if(b.state?.ok!==true) throw new Error(`native state unhealthy: ${b.state?.lastError||'unknown'}`);
          if(Number(b.live?.fetchedAt||0)<=Number(a.live?.fetchedAt||0)) throw new Error('live snapshot did not advance');
          if(Number(b.board?.terminalDisplayed||0)!==0) throw new Error('terminal fixture leaked to board');
          if(Number(b.rate?.global?.usedLast60s||0)>40) throw new Error('provider global ceiling exceeded');
          for(const [name,rate] of Object.entries({live:b.rate?.live,waiting:b.rate?.upcoming,referee:b.rate?.referee})){
            if(rate?.unlocked!==true) throw new Error(`${name} lane is still locked`);
            if(rate?.configuredCeiling!==null) throw new Error(`${name} lane still has a configured ceiling`);
            if(rate?.guardScope!=='GLOBAL_ONLY') throw new Error(`${name} lane guard scope is not GLOBAL_ONLY`);
          }
          if(Number(b.candidateShadow?.maxRefereeStartsPerTick||0)!==0) throw new Error('candidate referee start cap still active');
          console.log('NATIVE_UNRESTRICTED_PASS',JSON.stringify({
            runtimeContract:b.runtimeContract,
            firstLiveAt:a.live?.fetchedAt,
            secondLiveAt:b.live?.fetchedAt,
            live:b.board?.counts?.live,
            waiting:b.board?.counts?.waiting,
            terminalDisplayed:b.board?.terminalDisplayed,
            globalRate:b.rate?.global,
            liveRate:b.rate?.live,
            waitingRate:b.rate?.upcoming,
            refereeRate:b.rate?.referee,
            rateLimited:b.state?.rateLimited,
            throttled:b.state?.throttled,
            candidateShadow:b.candidateShadow,
            eventFlow:b.eventFlow,
            state:b.state
          },null,2));
          NODE
