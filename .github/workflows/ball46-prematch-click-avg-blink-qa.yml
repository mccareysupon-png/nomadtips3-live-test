name: BALL46 test Pre-Match click stability, blinking minutes and AVG ODDS
on:
  push:
    branches: [test/ball46-premium-match-colors-20261120]
    paths: ['.github/workflows/ball46-prematch-click-avg-blink-qa.yml', 'qa/prematch-native-ui-20261121/prematch-client.mjs']
permissions: {contents: read}
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium --only-shell
      - run: |
          mkdir -p evidence/prematch-click-avg-blink
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import fs from 'node:fs';
          import {chromium,devices} from 'playwright';
          const base='https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev';
          const url=base+'/__b46_prematch_data';
          let data,src,styles;
          for(let i=0;i<70;i++){
            const [r,js,css]=await Promise.all([fetch(url,{cache:'no-store'}),fetch(base+'/__b46_prematch_client.js',{cache:'no-store'}),fetch(base)]);
            if(r.ok&&js.ok&&css.ok){
              data=await r.json();src=await js.text();styles=await css.text();
              if(src.includes('const avgOdds=items=>')&&src.includes("e.target?.closest?.('#b46-prematch-panel')")&&src.includes('b46pm-minute-mark')&&src.includes("window.addEventListener('click'")&&src.includes('function clearNativeActive()')&&src.includes('change.target===side')&&src.includes('b46pm-stats-board')&&src.includes('b46PmPeriod')&&src.includes('function readRoute()')&&src.includes('function syncRoute()')&&src.includes('function membershipBanner()')&&src.includes('function syncPrematchViewport()')&&src.includes('b46pm-scroll-region')&&src.includes('function performancePanel()')&&src.includes('B46_PM_PERFORMANCE_DAILY_DATE_V2')&&src.includes('B46_PM_RECEIVER_SCHEMA_V1')&&src.includes('B46_PM_PERSISTED_TEST_RECEIVER_V1')&&src.includes('const resultTone=n=>')&&src.includes('b46pm-performance-three-tone')&&src.includes('The outer Pre-Match frame is the ONLY content scrollbar'))break;
            }
            await new Promise(r=>setTimeout(r,2200));
          }
          assert(src.includes("e.target?.closest?.('#b46-prematch-panel')"),'CONTENT_CLICK_GUARD_NOT_DEPLOYED');
          assert(src.includes('const avgOdds=items=>'),'AVG_ODDS_NOT_DEPLOYED');
          assert(src.includes('b46pm-minute-mark'),'APOSTROPHE_ONLY_BLINK_NOT_DEPLOYED');
          assert(src.includes("window.addEventListener('click'"),'WINDOW_CAPTURE_SHIELD_NOT_DEPLOYED');
          assert(src.includes('function clearNativeActive()'),'NATIVE_ACTIVE_EXCLUSIVITY_NOT_DEPLOYED');
          assert(src.includes('change.target===side'),'LATEST_NAVIGATION_OBSERVER_NOT_DEPLOYED');
          assert(src.includes('b46pm-stats-board')&&src.includes('b46PmPeriod'),'UNIFIED_STATS_PANEL_NOT_DEPLOYED');
          assert(src.includes('function readRoute()')&&src.includes('function syncRoute()'),'PREMATCH_REFRESH_ROUTING_NOT_DEPLOYED');
          assert(src.includes('function membershipBanner()')&&src.includes('b46pm-membership-promo'),'PREMATCH_MEMBERSHIP_BANNER_NOT_DEPLOYED');
          assert(src.includes('function syncPrematchViewport()')&&src.includes('b46pm-scroll-region'),'CLIPPED_SCROLL_REGION_NOT_DEPLOYED');
          assert(src.includes('function performancePanel()'),'PERFORMANCE_DASHBOARD_NOT_DEPLOYED');
          assert(src.includes('B46_PM_PERFORMANCE_DAILY_DATE_V2'),'CORRECTED_PERFORMANCE_VERSION_NOT_DEPLOYED');
          assert(src.includes('B46_PM_RECEIVER_SCHEMA_V1'),'RECEIVER_PARITY_UI_NOT_DEPLOYED');
          assert(src.includes('B46_PM_PERSISTED_TEST_RECEIVER_V1'),'PERSISTED_TEST_GRAPH_UI_NOT_DEPLOYED');
          assert(src.includes('const resultTone=n=>')&&src.includes('b46pm-performance-three-tone'),'THREE_TONE_PREMATCH_UI_NOT_DEPLOYED');
          assert(src.includes('The outer Pre-Match frame is the ONLY content scrollbar'),'SINGLE_OUTER_SCROLLBAR_NOT_DEPLOYED');
          assert.equal(data.testLedger?.mode,'TEST_ONLY');
          const expected=rows=>{const n=rows.map(x=>Number(x.price)).filter(x=>Number.isFinite(x)&&x>1);return n.length?(n.reduce((a,b)=>a+b,0)/n.length).toFixed(2):'—'};
          const allAvg=expected(data.testLedger.rows),w=data.dailyBook.window;
          const todayAvg=expected(data.testLedger.rows.filter(x=>Number(x.picked_at)>=w.begin&&Number(x.picked_at)<w.end));
          const b=await chromium.launch();const results=[];
          try{
            for(const mobile of [false,true])for(const theme of ['dark','light']){
              const p=await b.newPage(mobile?{...devices['iPhone 13'],serviceWorkers:'block'}:{viewport:{width:1440,height:940},serviceWorkers:'block'});
              const errors=[];p.on('pageerror',e=>errors.push(e.message));
              await p.addInitScript(t=>localStorage.setItem('nomad343_dashboard_theme_v1',t),theme);
              await p.goto(base+'/?pmclicktest='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              if(mobile){await p.locator('[data-b46m-open]').click();await p.locator('#b46m-drawer [data-b46-prematch-route="predictions"]').waitFor({state:'visible',timeout:18000})}
              const nav=mobile?'#b46m-drawer [data-b46-prematch-route="predictions"]':'aside.left-rail [data-b46-prematch-route="predictions"]';
              await p.locator(nav).evaluate(x=>x.click());
              await p.waitForFunction(()=>document.body.dataset.b46PrematchView==='1'&&document.querySelectorAll('#b46-prematch-panel .b46pm-stat').length===9,null,{timeout:20000});
              await p.waitForTimeout(600);
              if(mobile){const navStatus=await p.evaluate(()=>{
                const drawer=document.querySelector('#b46m-drawer'),overlay=document.querySelector('[data-b46m-overlay]');
                const rect=document.querySelector('#b46-prematch-panel .b46pm-title')?.getBoundingClientRect();
                const target=rect?document.elementFromPoint(rect.x+rect.width/2,rect.y+rect.height/2):null;
                return {drawerClass:drawer?.className,drawerHidden:drawer?.getAttribute('aria-hidden'),overlayClass:overlay?.className,overlayPointer:overlay&&getComputedStyle(overlay).pointerEvents,centerTarget:target?.outerHTML.slice(0,230)}
              });console.log('PREMATCH_MOBILE_DRAWER_STATE '+JSON.stringify(navStatus));}
              // The original Membership V12 promo must appear once, above Pre-Match
              // content, retaining its official artwork, destination and sticky placement.
              await p.locator('#b46-prematch-panel>#b46pm-membership-promo').waitFor({timeout:10000});
              if(mobile)await p.waitForFunction(()=>{const i=document.querySelector('#b46pm-membership-promo .b46pm-membership-image');return i?.complete&&i.naturalWidth>0},null,{timeout:12000});
              const promo=await p.evaluate(isMobile=>{
                const panel=document.querySelector('#b46-prematch-panel');
                const banner=panel?.querySelector(':scope > #b46pm-membership-promo');
                const desktop=banner?.querySelector('.b46pm-membership-desktop');
                const mobile=banner?.querySelector('.b46pm-membership-mobile');
                const img=mobile?.querySelector('img');
                const art=banner?.querySelector('.b46-exact-art');
                const artImages=art?[...art.children].map(x=>getComputedStyle(x).backgroundImage):[];
                const beforeHead=banner?.nextElementSibling?.id==='b46pm-scroll-region'&&banner.nextElementSibling.firstElementChild?.classList.contains('b46pm-head');
                const rect=banner?.getBoundingClientRect();
                return {
                  count:document.querySelectorAll('#b46-prematch-panel>#b46pm-membership-promo').length,
                  href:[...banner.querySelectorAll('a')].map(a=>a.href),
                  targets:[...banner.querySelectorAll('a')].map(a=>a.target),
                  position:getComputedStyle(banner).position,top:getComputedStyle(banner).top,
                  width:rect?.width,height:rect?.height,beforeHead,
                  visibleDesktop:getComputedStyle(desktop).display!=='none',
                  visibleMobile:getComputedStyle(mobile).display!=='none',
                  src:img?.getAttribute('src'),imgLoaded:!!(img?.complete&&img.naturalWidth>0),
                  artImages, originalStillPresent:!!document.querySelector('[data-workspace-panel="statistics"] .b46-stat-member-top')
                };
              },mobile);
              assert.equal(promo.count,1,'DUPLICATE_PROMO_BANNER');
              assert.equal(promo.position,'sticky','PROMO_NOT_STICKY_INSIDE_OUTER_FRAME');
              assert.equal(promo.top,'0px','PROMO_STICKY_TOP_NOT_ZERO');
              assert.equal(promo.beforeHead,true,'PROMO_NOT_TOP_OF_PREMATCH');
              assert(promo.width>100&&promo.height>20,'PROMO_NO_VISIBLE_GEOMETRY');
              assert.deepEqual(promo.href,['https://member.ball46.com/pricing','https://member.ball46.com/pricing'],'PROMO_LINK_CHANGED');
              assert(promo.targets.every(x=>x==='_blank'),'PROMO_NEW_TAB_BROKEN');
              if(mobile){
                assert.equal(promo.visibleDesktop,false,'DESKTOP_PROMO_SHOWN_ON_MOBILE');
                assert.equal(promo.visibleMobile,true,'MOBILE_PROMO_HIDDEN');
                assert(promo.imgLoaded,'MOBILE_ART_NOT_LOADED');
                assert(promo.src.includes('label-mobile-'+theme+'-v12.webp'),'MOBILE_THEME_ART_WRONG '+JSON.stringify(promo));
              }else{
                assert.equal(promo.visibleDesktop,true,'DESKTOP_PROMO_HIDDEN');
                assert.equal(promo.visibleMobile,false,'MOBILE_PROMO_SHOWN_ON_DESKTOP');
                assert(promo.artImages.some(x=>x.includes('label-'+theme)),'DESKTOP_THEME_ART_WRONG '+JSON.stringify(promo));
              }
              console.log('PREMATCH_MEMBERSHIP_PROMO_PASS '+JSON.stringify({mobile,theme,position:promo.position,dim:[promo.width,promo.height],loaded:mobile?promo.imgLoaded:true,src:promo.src,href:promo.href[0],originalPreserved:promo.originalStillPresent}));
              // Read-only probe: identify which scroll root moves the entire page
              // before the new sticky promo takes effect, and check text overlap.
              const sampleScroll=()=>p.evaluate(()=>{
                const banner=document.querySelector('#b46pm-membership-promo');
                const panel=document.querySelector('#b46-prematch-panel');
                const head=panel.querySelector('.b46pm-head');
                const ancestors=[];let node=banner;
                while(node&&ancestors.length<9){
                  const c=getComputedStyle(node),r=node.getBoundingClientRect();
                  ancestors.push({tag:node.tagName,id:node.id,cls:String(node.className).slice(0,64),x:r.x,y:r.y,h:r.height,scrollTop:node.scrollTop,scrollHeight:node.scrollHeight,clientHeight:node.clientHeight,overflowY:c.overflowY,position:c.position,top:c.top,background:c.backgroundColor});
                  node=node.parentElement;
                }
                const br=banner.getBoundingClientRect(),hr=head.getBoundingClientRect();
                return {ancestors,windowY:scrollY,docY:document.scrollingElement?.scrollTop,bannerY:br.y,headY:hr.y,bannerHeight:br.height,rootHeight:document.scrollingElement?.scrollHeight};
              });
              // Single right-edge scrollbar, content must scroll underneath
              // pinned banner by native mouse-wheel (including over banner).
              await p.evaluate(()=>document.querySelector('#b46-prematch-panel').scrollTop=0);
              const probeBefore=await sampleScroll();
              const frame=await p.locator('#b46-prematch-panel').boundingBox();
              const scrollArea=await p.locator('#b46pm-scroll-region').boundingBox();
              assert(frame&&frame.width>100&&frame.height>100,'OUTER_SCROLL_FRAME_NOT_FOUND');
              assert(scrollArea&&scrollArea.width>100,'CONTENT_BOUNDS_NOT_FOUND');
              await p.mouse.move(scrollArea.x+Math.min(160,scrollArea.width/2),Math.min(frame.y+frame.height-40,Math.max(frame.y+promo.height+25,scrollArea.y+55)));
              await p.mouse.wheel(0,65);
              await p.waitForTimeout(250);
              const probeAfter=await sampleScroll();
              console.log('PREMATCH_SCROLL_FIRST_WHEEL_PROBE '+JSON.stringify({mobile,theme,before:probeBefore,after:probeAfter}));
              const fixedFrameBefore=probeBefore.ancestors.find(x=>x.id==='b46-prematch-panel');
              const fixedFrameAfter=probeAfter.ancestors.find(x=>x.id==='b46-prematch-panel');
              assert(Math.abs(probeAfter.bannerY-probeBefore.bannerY)<1,'PROMO_JUMP_FIRST_WHEEL '+JSON.stringify({mobile,theme,before:probeBefore.bannerY,after:probeAfter.bannerY}));
              assert(Math.abs(probeAfter.windowY-probeBefore.windowY)<1,'DOCUMENT_SCROLLED_IN_PREMATCH');
              assert(Math.abs(fixedFrameAfter.y-fixedFrameBefore.y)<1,'OUTER_FRAME_MOVED');
              assert(fixedFrameAfter.scrollTop>=35,'OUTER_SCROLLBAR_DID_NOT_MOVE '+JSON.stringify(fixedFrameAfter));
              const clip=await p.evaluate(()=>{
                const banner=document.querySelector('#b46pm-membership-promo');
                const panel=document.querySelector('#b46-prematch-panel');
                const region=document.querySelector('#b46pm-scroll-region');
                const br=banner.getBoundingClientRect(),pr=panel.getBoundingClientRect();
                const middle=document.elementFromPoint(br.left+br.width/2,br.top+br.height/2);
                const pStyle=getComputedStyle(panel),rStyle=getComputedStyle(region);
                return {
                  panelOverflow:pStyle.overflowY,panelScrollTop:panel.scrollTop,
                  panelRight:pr.right,regionScrollTop:region.scrollTop,regionOverflow:rStyle.overflowY,
                  bannerY:br.top,bannerBottom:br.bottom,hitPromo:!!middle?.closest?.('#b46pm-membership-promo'),
                  rootOverflow:getComputedStyle(document.documentElement).overflowY,
                  scrollbarWidth:panel.offsetWidth-panel.clientWidth
                };
              });
              assert(['auto','scroll'].includes(clip.panelOverflow),'SCROLLBAR_NOT_ON_OUTER_FRAME '+JSON.stringify(clip));
              assert.equal(clip.regionOverflow,'visible','NESTED_SCROLLBAR_STILL_PRESENT');
              assert.equal(clip.regionScrollTop,0,'NESTED_SCROLLBAR_MOVED');
              assert(clip.hitPromo,'CONTENT_PAINTED_THROUGH_STICKY_PROMO '+JSON.stringify(clip));
              assert.equal(clip.rootOverflow,'hidden','DOCUMENT_SCROLL_UNLOCKED');
              assert(clip.scrollbarWidth>=0,'OUTER_SCROLLBAR_INVALID');
              console.log('PREMATCH_SCROLL_CLIP_PASS '+JSON.stringify({mobile,theme,bannerY:probeAfter.bannerY,documentY:probeAfter.windowY,outerScroll:clip.panelScrollTop,scrollbarEdge:clip.panelRight,hitPromo:clip.hitPromo}));
              // Wheel directly over the stationary banner still advances the
              // outer scrollbar and never turns into document scrolling.
              await p.mouse.move(frame.x+Math.min(170,frame.width/2),probeAfter.bannerY+Math.min(promo.height/2,35));
              await p.mouse.wheel(0,38);
              await p.waitForTimeout(160);
              const overBanner=await p.evaluate(()=>({scroll:document.querySelector('#b46-prematch-panel').scrollTop,y:scrollY}));
              assert(overBanner.scroll>clip.panelScrollTop+15,'WHEEL_ON_BANNER_DID_NOT_SCROLL_OUTER_FRAME');
              assert.equal(overBanner.y,probeAfter.windowY,'WHEEL_ON_BANNER_SCROLLED_DOCUMENT');
              console.log('PREMATCH_OUTER_SCROLLBAR_WHEEL_PASS '+JSON.stringify({mobile,theme,afterContent:clip.panelScrollTop,afterBanner:overBanner.scroll}));
              await p.mouse.wheel(0,-110);
              await p.waitForTimeout(200);
              const readStats=()=>p.evaluate(()=>{
                const board=document.querySelector('#b46-prematch-panel .b46pm-stats-board');
                const entries=[...board.querySelectorAll('.b46pm-stat')];
                const pairs=entries.map(x=>[x.querySelector('.b46pm-stat-label')?.textContent,x.querySelector('.b46pm-stat-value')?.textContent]);
                return {period:board.dataset.b46PmPeriod,pairs,borders:entries.map(x=>getComputedStyle(x).borderTopWidth),boardBorder:getComputedStyle(board).borderTopWidth,activeButtons:[...board.querySelectorAll('.b46pm-period-btn[aria-pressed="true"]')].map(x=>x.dataset.b46PmPeriod),scrollWidth:document.documentElement.scrollWidth,viewWidth:innerWidth};
              });
              const checkPeriod=(stats,period)=>{
                assert.equal(stats.period,period);
                assert.equal(stats.pairs.length,9,'STATS_MUST_HAVE_NINE_METRICS');
                assert.equal(new Set(stats.pairs.map(x=>x[0])).size,9,'DUPLICATE_STATS_LABELS');
                assert(stats.borders.every(x=>x==='0px'),'METRIC_BORDER_FOUND');
                assert.equal(stats.boardBorder,'0px','BOARD_BORDER_FOUND');
                assert.deepEqual(stats.activeButtons,[period],'PERIOD_NOT_EXCLUSIVE');
                assert(stats.scrollWidth<=stats.viewWidth+1,'STATS_HORIZONTAL_OVERFLOW');
              };
              const today=await readStats();
              checkPeriod(today,'today');
              assert.equal(new Map(today.pairs).get('AVG ODDS'),todayAvg,'TODAY_AVG_ODDS_WRONG');
              assert.equal(Number(new Map(today.pairs).get('PICKS')),Number(data.dailyBook.selected.total),'PICKS_TODAY_WRONG');
              await p.locator('#b46-prematch-panel [data-b46-pm-period="all"]').click();
              const all=await readStats();
              checkPeriod(all,'all');
              assert.equal(new Map(all.pairs).get('AVG ODDS'),allAvg,'ALL_AVG_ODDS_WRONG');
              assert.equal(Number(new Map(all.pairs).get('TOTAL')),Number(data.testLedger.stats.total),'TOTAL_WRONG');
              await p.screenshot({path:'evidence/prematch-click-avg-blink/'+(mobile?'mobile':'desktop')+'-'+theme+'-all.png',fullPage:true});
              await p.locator('#b46-prematch-panel [data-b46-pm-period="today"]').click();
              checkPeriod(await readStats(),'today');
              console.log('PREMATCH_UNIFIED_STATS_PASS '+JSON.stringify({mobile,theme,today:today.pairs,all:all.pairs,borderless:true,exclusive:true}));
              // Verify deep-link continuity across a real hard refresh, not only same-page clicks.
              const reloadRoute=mobile?(theme==='dark'?'1x2':'btts'):(theme==='dark'?'predictions':'all');
              const reloadPeriod=theme==='dark'?'all':'today';
              await p.locator('#b46-prematch-panel .b46pm-period-btn[data-b46-pm-period="'+reloadPeriod+'"]').evaluate(x=>x.click());
              const preReloadNav=(mobile?'#b46m-drawer':'aside.left-rail')+' [data-b46-prematch-route="'+reloadRoute+'"]';
              await p.locator(preReloadNav).evaluate(x=>x.click());
              const beforeReload=await p.evaluate(()=>({route:new URL(location.href).searchParams.get('b46pm'),period:new URL(location.href).searchParams.get('b46pmPeriod')}));
              assert.equal(beforeReload.route,reloadRoute,'ROUTE_NOT_PERSISTED_TO_URL');
              assert.equal(beforeReload.period,reloadPeriod,'PERIOD_NOT_PERSISTED_TO_URL');
              await p.reload({waitUntil:'domcontentloaded',timeout:60000});
              await p.waitForFunction(({route,period})=>{
                const url=new URL(location.href);
                return document.body.dataset.b46PrematchView==='1'
                  && !document.querySelector('#b46-prematch-panel')?.hidden
                  && url.searchParams.get('b46pm')===route
                  && url.searchParams.get('b46pmPeriod')===period
                  && (route==='predictions'?document.querySelector('#b46-prematch-panel .b46pm-stats-board')?.dataset.b46PmPeriod===period:!!document.querySelector('#b46-prematch-panel .b46pm-performance'))
                  && [...document.querySelectorAll('[data-b46-prematch-route="'+route+'"]')].some(e=>e.classList.contains('active'));
              },{route:reloadRoute,period:reloadPeriod},{timeout:22000});
              const reloaded=await p.evaluate(isMobile=>{
                const root=document.querySelector(isMobile?'#b46m-drawer':'aside.left-rail');
                return [...root.querySelectorAll('[data-b46-sidebar-row],.b46m-item')].filter(n=>n.classList.contains('active')||n.getAttribute('aria-current')==='page').map(n=>n.dataset.b46PrematchRoute||null);
              },mobile);
              assert.deepEqual(reloaded,[reloadRoute],'RELOAD_ACTIVE_LOST_OR_DUPLICATED');
              console.log('PREMATCH_REFRESH_ROUTE_PASS '+JSON.stringify({mobile,theme,route:reloadRoute,period:reloadPeriod,active:reloaded,url:await p.url()}));
              // Return to the prediction page for the original 48 content-click checks.
              const predictionsNav=(mobile?'#b46m-drawer':'aside.left-rail')+' [data-b46-prematch-route="predictions"]';
              await p.locator(predictionsNav).evaluate(x=>x.click());
              // Only one sidebar item may be active in the visible navigation context.
              // Test each Pre-Match sub-route and then return to predictions for click QA.
              for(const route of ['predictions','all','1x2','btts','predictions']){
                 const target=(mobile?'#b46m-drawer':'aside.left-rail')+' [data-b46-prematch-route="'+route+'"]';
                 await p.locator(target).evaluate(e=>e.click());
                 await p.waitForFunction(selector=>document.querySelector(selector)?.classList.contains('active'),target,{timeout:8000});
                 await p.waitForTimeout(120);
                 const active=await p.evaluate(isMobile=>{
                   const root=document.querySelector(isMobile?'#b46m-drawer':'aside.left-rail');
                   const activeNodes=[...root.querySelectorAll('[data-b46-sidebar-row],.b46m-item')].filter(n=>n.classList.contains('active')||n.getAttribute('aria-current')==='page');
                   return activeNodes.map(n=>({route:n.dataset.b46PrematchRoute||null,name:(n.textContent||'').trim().slice(0,40)}));
                 },mobile);
                 assert.deepEqual(active.map(x=>x.route),[route],'DUPLICATE_ACTIVE '+JSON.stringify({mobile,theme,route,active}));
                 console.log('PREMATCH_SINGLE_ACTIVE_PASS '+JSON.stringify({mobile,theme,route,active}));
              }

              // Pre-Match 1X2 summary is intentionally separate from the
              // prediction Today's card grid; it must never inherit Live Stats.
              for(const route of ['all','1x2']){
                const navPerf=(mobile?'#b46m-drawer':'aside.left-rail')+' [data-b46-prematch-route="'+route+'"]';
                await p.locator(navPerf).evaluate(e=>e.click());
                await p.locator('#b46-prematch-panel .b46pm-performance').waitFor({timeout:10000});
                assert.equal(await p.locator('#b46-prematch-panel .b46pm-performance').count(),1);
                assert.equal(await p.locator('#b46-prematch-panel .b46pm-stats-board').count(),0,'DUPLICATED_STATS_IN_PERFORMANCE');
                await p.waitForFunction(()=>document.querySelector('#b46-prematch-panel .b46pm-performance-provenance')?.textContent.includes('Pre-Match Receiver'),null,{timeout:20000});
                const displayed=await p.locator('#b46-prematch-panel .b46pm-performance').innerText();
                assert(displayed.includes('LONG-TERM PERFORMANCE')&&displayed.includes('CUMULATIVE UNITS')&&displayed.includes('ROI')&&displayed.includes('MAX DRAWDOWN'),'DASHBOARD_FIELDS_MISSING');
                assert(displayed.includes('Pre-Match Receiver'),'TEST_RECEIVER_NOT_CONNECTED');
                assert(displayed.includes('+4.70U'),'PERSISTED_TEST_RECEIVER_UNITS_WRONG');
                for(const range of ['7D','30D','90D','ALL'])await p.locator('#b46-prematch-panel [data-b46pm-perf-range="'+range+'"]').click();
                for(const metric of ['units','roi','winRate'])await p.locator('#b46-prematch-panel [data-b46pm-perf-metric="'+metric+'"]').click();
                const metrics=await p.evaluate(()=>({
                  metric:[...document.querySelectorAll('#b46-prematch-panel [data-b46pm-perf-metric][aria-pressed="true"]')].map(e=>e.dataset.b46pmPerfMetric),
                  range:[...document.querySelectorAll('#b46-prematch-panel [data-b46pm-perf-range][aria-pressed="true"]')].map(e=>e.dataset.b46pmPerfRange),
                  pointCount:document.querySelectorAll('#b46-prematch-panel .b46pm-chart-stage svg circle').length,
                  source:document.querySelector('#b46-prematch-panel .b46pm-performance-provenance')?.textContent
                }));
                assert.deepEqual(metrics.metric,['winRate']);assert.deepEqual(metrics.range,['ALL']);
                assert.equal(metrics.pointCount,1,'A SINGLE REAL DAILY CLOSE MUST BE ONE POINT NOT A FAKE TREND');
                assert(metrics.source.includes('Pre-Match Receiver'),'REAL_RECEIVER_SOURCE_LOST');
                console.log('PREMATCH_PERFORMANCE_BASE_PASS '+JSON.stringify({mobile,theme,route,metrics}));
              }
              const bttsNav=(mobile?'#b46m-drawer':'aside.left-rail')+' [data-b46-prematch-route="btts"]';
              await p.locator(bttsNav).evaluate(e=>e.click());
