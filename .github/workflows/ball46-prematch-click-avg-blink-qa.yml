name: BALL46 test Pre-Match click stability, blinking minutes and AVG ODDS
on:
  push:
    branches: [test/ball46-premium-match-colors-20261120]
    paths: ['.github/workflows/ball46-prematch-click-avg-blink-qa.yml']
permissions: {contents: read}
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium --only-shell
      - run: |
          mkdir -p evidence/prematch-click-avg-blink
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import fs from 'node:fs';
          import {chromium,devices} from 'playwright';
          const base='https://ball46-premium-match-colors-test-20261120.mccarey-supon.workers.dev';
          const url=base+'/__b46_prematch_data';
          let data,src,styles;
          for(let i=0;i<70;i++){
            const [r,js,css]=await Promise.all([fetch(url,{cache:'no-store'}),fetch(base+'/__b46_prematch_client.js',{cache:'no-store'}),fetch(base)]);
            if(r.ok&&js.ok&&css.ok){
              data=await r.json();src=await js.text();styles=await css.text();
              if(src.includes('const avgOdds=items=>')&&src.includes("e.target?.closest?.('#b46-prematch-panel')")&&src.includes('b46pm-minute-mark')&&src.includes("window.addEventListener('click'")&&src.includes('function clearNativeActive()')&&src.includes('change.target===side')&&src.includes('b46pm-stats-board')&&src.includes('b46PmPeriod')&&src.includes('function readRoute()')&&src.includes('function syncRoute()'))break;
            }
            await new Promise(r=>setTimeout(r,2200));
          }
          assert(src.includes("e.target?.closest?.('#b46-prematch-panel')"),'CONTENT_CLICK_GUARD_NOT_DEPLOYED');
          assert(src.includes('const avgOdds=items=>'),'AVG_ODDS_NOT_DEPLOYED');
          assert(src.includes('b46pm-minute-mark'),'APOSTROPHE_ONLY_BLINK_NOT_DEPLOYED');
          assert(src.includes("window.addEventListener('click'"),'WINDOW_CAPTURE_SHIELD_NOT_DEPLOYED');
          assert(src.includes('function clearNativeActive()'),'NATIVE_ACTIVE_EXCLUSIVITY_NOT_DEPLOYED');
          assert(src.includes('change.target===side'),'LATEST_NAVIGATION_OBSERVER_NOT_DEPLOYED');
          assert(src.includes('b46pm-stats-board')&&src.includes('b46PmPeriod'),'UNIFIED_STATS_PANEL_NOT_DEPLOYED');
          assert(src.includes('function readRoute()')&&src.includes('function syncRoute()'),'PREMATCH_REFRESH_ROUTING_NOT_DEPLOYED');
          assert.equal(data.testLedger?.mode,'TEST_ONLY');
          const expected=rows=>{const n=rows.map(x=>Number(x.price)).filter(x=>Number.isFinite(x)&&x>1);return n.length?(n.reduce((a,b)=>a+b,0)/n.length).toFixed(2):'—'};
          const allAvg=expected(data.testLedger.rows),w=data.dailyBook.window;
          const todayAvg=expected(data.testLedger.rows.filter(x=>Number(x.picked_at)>=w.begin&&Number(x.picked_at)<w.end));
          const b=await chromium.launch();const results=[];
          try{
            for(const mobile of [false,true])for(const theme of ['dark','light']){
              const p=await b.newPage(mobile?{...devices['iPhone 13'],serviceWorkers:'block'}:{viewport:{width:1440,height:940},serviceWorkers:'block'});
              const errors=[];p.on('pageerror',e=>errors.push(e.message));
              await p.addInitScript(t=>localStorage.setItem('nomad343_dashboard_theme_v1',t),theme);
              await p.goto(base+'/?pmclicktest='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
              if(mobile){await p.locator('[data-b46m-open]').click();await p.locator('#b46m-drawer [data-b46-prematch-route="predictions"]').waitFor({state:'visible',timeout:18000})}
              const nav=mobile?'#b46m-drawer [data-b46-prematch-route="predictions"]':'aside.left-rail [data-b46-prematch-route="predictions"]';
              await p.locator(nav).evaluate(x=>x.click());
              await p.waitForFunction(()=>document.body.dataset.b46PrematchView==='1'&&document.querySelectorAll('#b46-prematch-panel .b46pm-stat').length===9,null,{timeout:20000});
              await p.waitForTimeout(600);
              if(mobile){const navStatus=await p.evaluate(()=>{
                const drawer=document.querySelector('#b46m-drawer'),overlay=document.querySelector('[data-b46m-overlay]');
                const rect=document.querySelector('#b46-prematch-panel .b46pm-title')?.getBoundingClientRect();
                const target=rect?document.elementFromPoint(rect.x+rect.width/2,rect.y+rect.height/2):null;
                return {drawerClass:drawer?.className,drawerHidden:drawer?.getAttribute('aria-hidden'),overlayClass:overlay?.className,overlayPointer:overlay&&getComputedStyle(overlay).pointerEvents,centerTarget:target?.outerHTML.slice(0,230)}
              });console.log('PREMATCH_MOBILE_DRAWER_STATE '+JSON.stringify(navStatus));}
              const readStats=()=>p.evaluate(()=>{
                const board=document.querySelector('#b46-prematch-panel .b46pm-stats-board');
                const entries=[...board.querySelectorAll('.b46pm-stat')];
                const pairs=entries.map(x=>[x.querySelector('.b46pm-stat-label')?.textContent,x.querySelector('.b46pm-stat-value')?.textContent]);
                return {period:board.dataset.b46PmPeriod,pairs,borders:entries.map(x=>getComputedStyle(x).borderTopWidth),boardBorder:getComputedStyle(board).borderTopWidth,activeButtons:[...board.querySelectorAll('.b46pm-period-btn[aria-pressed="true"]')].map(x=>x.dataset.b46PmPeriod),scrollWidth:document.documentElement.scrollWidth,viewWidth:innerWidth};
              });
              const checkPeriod=(stats,period)=>{
                assert.equal(stats.period,period);
                assert.equal(stats.pairs.length,9,'STATS_MUST_HAVE_NINE_METRICS');
                assert.equal(new Set(stats.pairs.map(x=>x[0])).size,9,'DUPLICATE_STATS_LABELS');
                assert(stats.borders.every(x=>x==='0px'),'METRIC_BORDER_FOUND');
                assert.equal(stats.boardBorder,'0px','BOARD_BORDER_FOUND');
                assert.deepEqual(stats.activeButtons,[period],'PERIOD_NOT_EXCLUSIVE');
                assert(stats.scrollWidth<=stats.viewWidth+1,'STATS_HORIZONTAL_OVERFLOW');
              };
              const today=await readStats();
              checkPeriod(today,'today');
              assert.equal(new Map(today.pairs).get('AVG ODDS'),todayAvg,'TODAY_AVG_ODDS_WRONG');
              assert.equal(Number(new Map(today.pairs).get('PICKS')),Number(data.dailyBook.selected.total),'PICKS_TODAY_WRONG');
              await p.locator('#b46-prematch-panel [data-b46-pm-period="all"]').click();
              const all=await readStats();
              checkPeriod(all,'all');
              assert.equal(new Map(all.pairs).get('AVG ODDS'),allAvg,'ALL_AVG_ODDS_WRONG');
              assert.equal(Number(new Map(all.pairs).get('TOTAL')),Number(data.testLedger.stats.total),'TOTAL_WRONG');
              await p.screenshot({path:'evidence/prematch-click-avg-blink/'+(mobile?'mobile':'desktop')+'-'+theme+'-all.png',fullPage:true});
              await p.locator('#b46-prematch-panel [data-b46-pm-period="today"]').click();
              checkPeriod(await readStats(),'today');
              console.log('PREMATCH_UNIFIED_STATS_PASS '+JSON.stringify({mobile,theme,today:today.pairs,all:all.pairs,borderless:true,exclusive:true}));
              // Verify deep-link continuity across a real hard refresh, not only same-page clicks.
              const reloadRoute=mobile?(theme==='dark'?'1x2':'btts'):(theme==='dark'?'predictions':'all');
              const reloadPeriod=theme==='dark'?'all':'today';
              await p.locator('#b46-prematch-panel .b46pm-period-btn[data-b46-pm-period="'+reloadPeriod+'"]').evaluate(x=>x.click());
              const preReloadNav=(mobile?'#b46m-drawer':'aside.left-rail')+' [data-b46-prematch-route="'+reloadRoute+'"]';
              await p.locator(preReloadNav).evaluate(x=>x.click());
              const beforeReload=await p.evaluate(()=>({route:new URL(location.href).searchParams.get('b46pm'),period:new URL(location.href).searchParams.get('b46pmPeriod')}));
              assert.equal(beforeReload.route,reloadRoute,'ROUTE_NOT_PERSISTED_TO_URL');
              assert.equal(beforeReload.period,reloadPeriod,'PERIOD_NOT_PERSISTED_TO_URL');
              await p.reload({waitUntil:'domcontentloaded',timeout:60000});
              await p.waitForFunction(({route,period})=>{
                const url=new URL(location.href);
                return document.body.dataset.b46PrematchView==='1'
                  && !document.querySelector('#b46-prematch-panel')?.hidden
                  && url.searchParams.get('b46pm')===route
                  && url.searchParams.get('b46pmPeriod')===period
                  && document.querySelector('#b46-prematch-panel .b46pm-stats-board')?.dataset.b46PmPeriod===period
                  && [...document.querySelectorAll('[data-b46-prematch-route="'+route+'"]')].some(e=>e.classList.contains('active'));
              },{route:reloadRoute,period:reloadPeriod},{timeout:22000});
              const reloaded=await p.evaluate(isMobile=>{
                const root=document.querySelector(isMobile?'#b46m-drawer':'aside.left-rail');
                return [...root.querySelectorAll('[data-b46-sidebar-row],.b46m-item')].filter(n=>n.classList.contains('active')||n.getAttribute('aria-current')==='page').map(n=>n.dataset.b46PrematchRoute||null);
              },mobile);
              assert.deepEqual(reloaded,[reloadRoute],'RELOAD_ACTIVE_LOST_OR_DUPLICATED');
              console.log('PREMATCH_REFRESH_ROUTE_PASS '+JSON.stringify({mobile,theme,route:reloadRoute,period:reloadPeriod,active:reloaded,url:await p.url()}));
              // Return to the prediction page for the original 48 content-click checks.
              const predictionsNav=(mobile?'#b46m-drawer':'aside.left-rail')+' [data-b46-prematch-route="predictions"]';
              await p.locator(predictionsNav).evaluate(x=>x.click());
              // Only one sidebar item may be active in the visible navigation context.
              // Test each Pre-Match sub-route and then return to predictions for click QA.
              for(const route of ['predictions','all','1x2','btts','predictions']){
                 const target=(mobile?'#b46m-drawer':'aside.left-rail')+' [data-b46-prematch-route="'+route+'"]';
                 await p.locator(target).evaluate(e=>e.click());
                 await p.waitForFunction(selector=>document.querySelector(selector)?.classList.contains('active'),target,{timeout:8000});
                 await p.waitForTimeout(120);
                 const active=await p.evaluate(isMobile=>{
                   const root=document.querySelector(isMobile?'#b46m-drawer':'aside.left-rail');
                   const activeNodes=[...root.querySelectorAll('[data-b46-sidebar-row],.b46m-item')].filter(n=>n.classList.contains('active')||n.getAttribute('aria-current')==='page');
                   return activeNodes.map(n=>({route:n.dataset.b46PrematchRoute||null,name:(n.textContent||'').trim().slice(0,40)}));
                 },mobile);
                 assert.deepEqual(active.map(x=>x.route),[route],'DUPLICATE_ACTIVE '+JSON.stringify({mobile,theme,route,active}));
                 console.log('PREMATCH_SINGLE_ACTIVE_PASS '+JSON.stringify({mobile,theme,route,active}));
              }
              const selections=['.b46pm-title','.b46pm-stats-board','.b46pm-stats-toolbar','.b46pm-stat','.b46pm-stat-label','.b46pm-stat-value','.b46pm-list-head','.b46pm-match','.b46pm-meta','.b46pm-teams','.b46pm-pick','.b46pm-details'];
              const clickProof=[];
              for(const sel of selections){
               const locator=p.locator('#b46-prematch-panel '+sel).first();
               if(!await locator.count())continue;
               await p.waitForFunction(()=>document.body.dataset.b46PrematchView==='1');
               try{
                 const box=await p.evaluate(sel=>{
                   const x=document.querySelector('#b46-prematch-panel '+sel);
                   if(!x)return null;
                   x.scrollIntoView({block:'center'});
                   const r=x.getBoundingClientRect();
                   return {x:r.x,y:r.y,width:r.width,height:r.height};
                 },sel);
                 if(!box||box.width<2||box.height<2)continue;
                 await p.mouse.click(box.x+Math.min(box.width/2,Math.max(5,box.width-5)),box.y+Math.min(box.height/2,Math.max(5,box.height-5)));
                 await p.waitForTimeout(120);
                 const result=await p.evaluate(()=>({url:location.href,mode:document.body.dataset.b46PrematchView,title:document.querySelector('#b46-prematch-panel .b46pm-title')?.textContent,overlay:document.querySelector('[data-b46m-overlay]')&&getComputedStyle(document.querySelector('[data-b46m-overlay]')).pointerEvents}));
                 assert.equal(result.mode,'1','UNEXPECTED_NAVIGATION '+sel+' '+JSON.stringify(result));
                 assert.equal(result.title,'Pre-Match Predictions');
                 clickProof.push(sel);
               }catch(e){throw Error('CLICK_CASE '+(mobile?'mobile':'desktop')+' '+theme+' '+sel+' '+String(e))}
              }
              assert.equal(errors.length,0,JSON.stringify(errors));
              await p.screenshot({path:'evidence/prematch-click-avg-blink/'+(mobile?'mobile':'desktop')+'-'+theme+'.png',fullPage:true});
              results.push({mobile,theme,clicksPassed:clickProof,allAvg,todayAvg,errors});
              console.log('PREMATCH_CLICK_ODDS_CASE '+JSON.stringify(results.at(-1)));
              await p.close();
            }
            const p=await b.newPage({viewport:{width:1440,height:900},serviceWorkers:'block'});
            const injected=structuredClone(data),pending=injected.testLedger.rows.find(x=>x.status==='PENDING');
            assert(pending,'NO_PENDING_TO_TEST_LIVE_MINUTES');
            injected.testMonitor={...(injected.testMonitor??{}),snapshotStale:false,monitor:{...(injected.testMonitor?.monitor??{}),[pending.fixture_id]:{phase:'LIVE',minute:63,label:"63'",score:{home:1,away:0}}}};
            await p.route('**/__b46_prematch_data',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(injected)}));
            await p.goto(base+'/?pmminute='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            await p.locator('aside.left-rail [data-b46-prematch-route="predictions"]').evaluate(x=>x.click());
            await p.locator('#b46-prematch-panel .b46pm-minute-mark').first().waitFor({timeout:10000});
            const minute=await p.locator('#b46-prematch-panel .b46pm-clock').first().evaluate(x=>({fullText:x.textContent,number:x.querySelector('.b46pm-minute-digits')?.textContent,numberAnimation:getComputedStyle(x.querySelector('.b46pm-minute-digits')).animationName,mark:x.querySelector('.b46pm-minute-mark')?.textContent,markAnimation:getComputedStyle(x.querySelector('.b46pm-minute-mark')).animationName,color:getComputedStyle(x).color,clockAnimation:getComputedStyle(x).animationName}));
            assert.equal(minute.fullText,"63'");assert.equal(minute.number,'63');assert.equal(minute.mark,"'");assert.equal(minute.numberAnimation,'none','DIGITS_MUST_NOT_BLINK');assert.equal(minute.clockAnimation,'none','CLOCK_MUST_NOT_BLINK');assert(minute.markAnimation.includes('b46pm-apostrophe-blink'),'ONLY_APOSTROPHE_MUST_BLINK');
            await p.emulateMedia({reducedMotion:'reduce'});
            const reduced=await p.locator('#b46-prematch-panel .b46pm-minute-mark').first().evaluate(x=>getComputedStyle(x).animationName);
            assert.equal(reduced,'none','REDUCED_MOTION_NOT_HONORED');
            await p.close();
            console.log('PREMATCH_LIVE_MINUTE_VERIFIED '+JSON.stringify({minute,reducedMotionAnimation:reduced,isSimulatedBrowserTest:true}));
          }finally{await b.close()}
          fs.writeFileSync('evidence/prematch-click-avg-blink/summary.json',JSON.stringify({testedAt:new Date().toISOString(),results,liveMinuteIsMockedBrowserOnly:true},null,2));
          console.log('PREMATCH_CLICK_ODDS_BLINK_PASS '+JSON.stringify({cases:results.length,totalClicks:results.reduce((n,x)=>n+x.clicksPassed.length,0),allAvg,todayAvg,worker:base}));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-prematch-click-blink-average-qa
          path: evidence/prematch-click-avg-blink/
          retention-days: 7

# Reverify updated minute UI: only trailing apostrophe blinks; stable digits.
