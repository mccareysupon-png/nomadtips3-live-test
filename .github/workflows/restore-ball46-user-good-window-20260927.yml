name: Restore Ball46 user-good window 20260927

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-ball46-user-good-window-20260927.yml'

permissions:
  contents: read

env:
  TARGET_VERSION: 1c002b58-317e-408e-a64e-84c3db83b6d7
  EXPECT_INDEX_SHA: 49082e5c2336bb83e7f2652a9f44c83966f54a024464544c8b690ddf135c5dd5
  EXPECT_LOGO_SHA: ce33cd0c99f7d36e00d89bb108502afb308528fe801381a9c55cc7cb7b7fbb48
  BALL46: https://ball46-production.mccarey-supon.workers.dev
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Prove target is the exact version active through user-confirmed good window
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 versions list --name ball46-production --json > /tmp/versions.json
          node - <<'NODE'
          const fs=require('fs');
          const target=process.env.TARGET_VERSION;
          const raw=JSON.parse(fs.readFileSync('/tmp/versions.json'));
          const a=Array.isArray(raw)?raw:(raw?.versions||raw?.result||[]);
          const i=a.findIndex(v=>(v.id||v.version_id||v.versionId)===target);
          if(i<0) throw Error('TARGET_VERSION_NOT_FOUND');
          const v=a[i], next=a[i+1];
          const created=v?.metadata?.created_on;
          const nextCreated=next?.metadata?.created_on;
          if(created!=='2026-09-26T13:48:41.679415Z') throw Error('TARGET_TIMESTAMP_MISMATCH:'+created);
          if(!next || nextCreated!=='2026-09-26T22:15:18.678247Z') throw Error('NEXT_VERSION_NOT_MOBILE_BOUNDARY:'+nextCreated);
          console.log('GOOD_WINDOW_TARGET_PROVEN', {target,created,nextId:next.id,nextCreated});
          NODE
      - name: Restore exact whole Ball46 Worker version
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 rollback "$TARGET_VERSION" --name ball46-production --message "Restore exact version active 20:48-05:15 ICT before mobile regression"
      - name: Verify exact pre-mobile bytes, pages, favicon and backend routing
        shell: bash
        run: |
          set -euo pipefail
          pass=0
          for n in 1 2 3 4 5 6 7 8; do
            curl -fsS -L --retry 2 --max-time 25 "$BALL46/index.html?good=${GITHUB_RUN_ID}-${n}" -o /tmp/index.html || true
            curl -fsS -L --retry 2 --max-time 25 "$BALL46/ball46-logo.svg?good=${GITHUB_RUN_ID}-${n}" -o /tmp/logo.svg || true
            if [ "$(sha256sum /tmp/index.html 2>/dev/null | awk '{print $1}')" = "$EXPECT_INDEX_SHA" ] && [ "$(sha256sum /tmp/logo.svg 2>/dev/null | awk '{print $1}')" = "$EXPECT_LOGO_SHA" ]; then pass=1; break; fi
            sleep 5
          done
          [ "$pass" = 1 ] || { echo 'EXACT_PRE_MOBILE_BYTES_NOT_LIVE'; exit 1; }
          grep -Eq '<link[^>]+rel="icon"[^>]+href="/ball46-logo\.svg"|<link[^>]+href="/ball46-logo\.svg"[^>]+rel="icon"' /tmp/index.html
          curl -fsS -L --retry 4 --max-time 25 "$BALL46/signal.html?good=${GITHUB_RUN_ID}" -o /tmp/signal.html
          curl -fsS -L --retry 4 --max-time 25 "$BALL46/statistics.html?good=${GITHUB_RUN_ID}" -o /tmp/statistics.html
          for ep in health board signals statistics; do curl -fsS -L --retry 4 --max-time 25 "$BALL46/api/engine/$ep?good=${GITHUB_RUN_ID}" -o "/tmp/$ep.json"; done
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json'));const b=JSON.parse(fs.readFileSync('/tmp/board.json'));const s=JSON.parse(fs.readFileSync('/tmp/signals.json'));const t=JSON.parse(fs.readFileSync('/tmp/statistics.json'));
          if(h?.ok!==true||b?.ok!==true||!Array.isArray(b?.fixtures)||!Array.isArray(s?.signals)||t?.ok!==true||!Array.isArray(t?.rows)) throw Error('BACKEND_ROUTE_FAIL');
          console.log('BALL46_USER_GOOD_WINDOW_RESTORED',{indexSha:process.env.EXPECT_INDEX_SHA,fixtures:b.fixtures.length,pending:s.signals.length,settled:t.rows.length});
          NODE

# retrigger requested restore 2026-09-27
