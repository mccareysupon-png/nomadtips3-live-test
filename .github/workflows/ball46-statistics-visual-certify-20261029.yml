name: BALL46 Statistics visual release read-only production certification
on:
  push:
    branches: [codex/ball46-statistics-visual-release-20261029]
    paths: ['deploy-assets/statistics-visual-release-20261029/certify.mjs', '.github/workflows/ball46-statistics-visual-certify-20261029.yml']
permissions:
  contents: write
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  hide-member-count:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and execute guarded phase
        working-directory: deploy-assets/statistics-visual-release-20261029
        run: |
          node --check certify.mjs
          node --test patch.test.mjs
          node certify.mjs
          if [ -f audit/candidate-runtime.mjs ]; then node --check audit/candidate-runtime.mjs; fi
      - name: Record sanitized evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy-assets/statistics-visual-release-20261029/audit-last
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Statistics visual release audit [skip ci]"
          git fetch origin codex/ball46-statistics-visual-release-20261029
          git rebase FETCH_HEAD
          git push origin HEAD:codex/ball46-statistics-visual-release-20261029
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ball46-statistics-no-flash-${{ github.run_id }}
          path: deploy-assets/statistics-visual-release-20261029/audit
          retention-days: 30
