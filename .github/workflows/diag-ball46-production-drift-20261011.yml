name: DIAG Ball46 Production Drift 20261011
# trigger-2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-ball46-production-drift-20261011.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect actual Production version and browser asset
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/b46-drift
          mkdir -p "$ROOT"
          curl -fsSL --max-time 30 https://ball46.com/ -o "$ROOT/index.html"
          echo "=== INDEX SCRIPT REF ==="
          python3 - <<'PY'
          import re
          h=open('/tmp/b46-drift/index.html',encoding='utf-8',errors='replace').read()
          for m in re.findall(r'singlepage-workspace-343\\.js[^"<> ]*',h,re.I)[:10]:
              print(m)
          PY

          ASSET_URL=$(python3 - <<'PY'
          import re
          from urllib.parse import urljoin
          h=open('/tmp/b46-drift/index.html',encoding='utf-8',errors='replace').read()
          m=re.search(r'<script[^>]+src=["\']([^"\']*singlepage-workspace-343\.js[^"\']*)["\']',h,re.I)
          print(urljoin('https://ball46.com/',m.group(1)) if m else 'https://ball46.com/singlepage-workspace-343.js')
          PY
          )
          echo "ASSET_URL $ASSET_URL"
          curl -fsSL --max-time 30 "$ASSET_URL" -o "$ROOT/live.js"
          sha256sum "$ROOT/live.js"
          echo "=== LIVE MARKERS ==="
          grep -o "BALL46_STATISTICS_ENTRY_PREMIUM_SUCCESS\|height:62px;overflow:visible;white-space:normal\|gap:5px\|color:#f3c969\|color:#67d7d0\|Array.isArray(j.ledgerRows)?j.ledgerRows:j.rows\|color:var(--green);font-weight:900" "$ROOT/live.js" | sort | uniq -c || true

          echo "=== CLOUDFLARE CURRENT VERSION ==="
          npm install --no-save --ignore-scripts wrangler@latest >/dev/null 2>&1
          npx wrangler deployments list --name ball46-production --json > "$ROOT/deployments.json"
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/b46-drift/deployments.json'))
          print(json.dumps(j[:5] if isinstance(j,list) else j,indent=2))
          PY

          echo "=== RESPONSE HEADERS ==="
          curl -sSI https://ball46.com/ | sed -n '1,40p'
          curl -sSI "$ASSET_URL" | sed -n '1,40p'
