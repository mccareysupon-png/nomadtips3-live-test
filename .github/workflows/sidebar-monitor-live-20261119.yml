name: BALL46 live Monitor bridge - isolated Worker
on:
  push:
    branches: [test/ball46-sidebar-monitor-live-20261119]
    paths: ['.github/workflows/sidebar-monitor-live-20261119.yml']
permissions:
  contents: read
jobs:
  stage:
    if: github.ref == 'refs/heads/test/ball46-sidebar-monitor-live-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and deploy dedicated test only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node qa/sidebar-monitor-live-20261119/test.mjs
          node qa/sidebar-monitor-live-20261119/capture.mjs
          node --check qa/sidebar-monitor-live-20261119/worker.mjs
          cat > qa/sidebar-monitor-live-20261119/wrangler.toml <<'EOF'
          name = "ball46-sidebar-monitor-live-test-20261119"
          main = "worker.mjs"
          compatibility_date = "2026-11-19"
          workers_dev = true
          preview_urls = false
          [[services]]
          binding = "B46_PRODUCTION_READ"
          service = "ball46-production"
          [[services]]
          binding = "B46_MARKET_READER"
          service = "ball46-shadow-receiver-production"
          entrypoint = "MarketStatisticsReader"
          [[durable_objects.bindings]]
          name = "B46_MONITOR_CACHE"
          class_name = "MonitorRateCache"
          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["MonitorRateCache"]
          EOF
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {writeFile} from 'node:fs/promises';
          const a=process.env.CLOUDFLARE_ACCOUNT_ID,t=process.env.CLOUDFLARE_API_TOKEN;
          assert(a&&t);
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+a+'/workers/scripts/ball46-production/deployments?per_page=1',{headers:{authorization:'Bearer '+t}});
          const j=await r.json();assert(j.success);
          await writeFile(process.env.RUNNER_TEMP+'/production-before.json',JSON.stringify(j.result.deployments[0].versions));
          EOF
          npx --yes wrangler@4.50.0 deploy --config qa/sidebar-monitor-live-20261119/wrangler.toml --name ball46-sidebar-monitor-live-test-20261119
      - name: Check HTML and unchanged scripts
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const base='https://ball46-sidebar-monitor-live-test-20261119.mccarey-supon.workers.dev';
          const read=async p=>{let status=0;for(let i=0;i<12;i++){const r=await fetch(base+p,{signal:AbortSignal.timeout(40000)});status=r.status;if(status===200)return r.text();await new Promise(resolve=>setTimeout(resolve,2000))}assert.equal(status,200,p)};
          const h=JSON.parse(await read('/_mask_health'));assert.equal(h.mode,'LIVE_MONITOR_TEST');assert.equal(Object.keys(h.snapshot.rates).length,8);
          const clean=await read('/index.html?view=statistics&b46_mask=0'),masked=await read('/index.html?view=statistics');
          const tag='<style id="b46-css-only-mask">'+h.selector+'</style>';
          assert(!clean.includes(tag));assert(masked.includes(tag));assert.equal((masked.match(/data-b46-rate-snapshot=/g)||[]).length,8,'STATIC_LABEL_COVERAGE');
          const scripts=s=>[...s.matchAll(/<script\b[^>]*>[\s\S]*?<\/script>/gi)].map(m=>m[0]);
          assert.deepEqual(scripts(masked).filter(s=>!s.includes('data-b46-monitor-bridge="1"')),scripts(clean),'HTML_SCRIPT_DRIFT');assert.equal(scripts(masked).filter(s=>s.includes('data-b46-monitor-bridge="1"')).length,1);
          for(const p of ['/singlepage-workspace-343.js','/longterm-performance-343.js']){
            const a=await read(p+'?b46_mask=0'),b=await read(p);
            assert.equal(createHash('sha256').update(a).digest('hex'),createHash('sha256').update(b).digest('hex'),'SCRIPT_DRIFT');
          }
          assert.equal((await fetch(base+'/_mask_health',{method:'POST'})).status,405);
          const q='market=all&variant=all&filter=all&range=all';let live=null;
          for(let i=0;i<8;i++){const g=await fetch(base+'/b46-receiver-v1/graph?'+q);assert.equal(g.status,200);const data=await g.json(),header=g.headers.get('x-b46-monitor-rates');if(header){const value=JSON.parse(header);if(value.sequence>=data.sequence){live=value;break}}await new Promise(r=>setTimeout(r,1500))}
          assert(live,'NO_LIVE_RECEIVER_HEADER');assert.equal(Object.keys(live.rates).length,8);
          const checked=JSON.parse(await read('/_mask_health'));assert(checked.current?.snapshot?.sequence>=live.sequence);
          console.log('LIVE_RECEIVER_HEADER_PASS '+JSON.stringify(live));console.log('CSS_MASK_SOURCE_PASS '+base);
          EOF
      - name: Browser check rows and native DOM
        run: |
          npm install --prefix qa/sidebar-monitor-live-20261119/.runtime --no-fund --no-audit playwright@1.55.0
          qa/sidebar-monitor-live-20261119/.runtime/node_modules/.bin/playwright install chromium --only-shell
          mkdir -p "$RUNNER_TEMP/css-mask-proof"
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          const {chromium}=createRequire(process.cwd()+'/qa/sidebar-monitor-live-20261119/.runtime/package.json')('playwright');
          const origin='https://ball46-sidebar-monitor-live-test-20261119.mccarey-supon.workers.dev',out=process.env.RUNNER_TEMP+'/css-mask-proof';
          const health=await (await fetch(origin+'/_mask_health')).json();const labelsFor=s=>Object.fromEntries(Object.entries(s.rates).map(([k,v])=>[k,v===null?'—':v.toFixed(2)+'%']));
          const browser=await chromium.launch({headless:true});
          try{
           for(const mobile of [false,true]){
            const c=await browser.newContext({viewport:{width:mobile?390:1440,height:mobile?844:950},isMobile:mobile,hasTouch:mobile,serviceWorkers:'block'});
            await c.route('**/*',r=>['GET','HEAD'].includes(r.request().method())?r.continue():r.abort());
            const p=await c.newPage(),errors=[],net=[];
            p.on('pageerror',e=>errors.push(e.message));p.on('response',r=>{const q=new URL(r.url());if(q.pathname.includes('/api/')||q.pathname.includes('/b46-receiver-v1/'))net.push({path:q.pathname,status:r.status()})});
            try{
             await p.goto(origin+'/index.html?view=statistics',{waitUntil:'domcontentloaded',timeout:60000});
             await p.waitForFunction(()=>document.querySelectorAll('[data-stat-market] b').length>=8,null,{timeout:35000});
             await p.waitForFunction(()=>[...document.querySelectorAll('[data-sp-table-body] tr')].some(r=>r.cells.length>=4),null,{timeout:90000});
             await p.waitForFunction(()=>[...document.querySelectorAll('[data-b46-rate-snapshot]')].every(e=>e.dataset.b46MonitorSequence),null,{timeout:45000});
             let checked=0;
             const liveHealth=await (await fetch(origin+'/_mask_health')).json();
             const rateLabels=labelsFor(liveHealth.current.snapshot);
             const labels=await p.evaluate(()=>[...document.querySelectorAll('[data-stat-market]')].map(b=>({market:b.dataset.statMarket,label:b.querySelector('.b46-rate-snapshot-v2')?.textContent,shown:!!b.querySelector('.b46-rate-snapshot-v2')?.getClientRects().length,hidden:getComputedStyle(b.querySelector('b')).visibility==='hidden'})));assert.equal(labels.length,8);for(const l of labels){assert.equal(l.label,rateLabels[l.market],'WR_LABEL '+l.market);assert(l.hidden);if(!mobile)assert(l.shown,'WR_LABEL_NOT_VISIBLE '+l.market)};console.log('ALL_8_RATE_LABELS '+JSON.stringify({mobile,labels}));
             for(const market of ['all','1x2','ah','ou','corners','btts','cards','other']){
              const b=p.locator('[data-stat-market="'+market+'"]').first();
              if(!await b.isVisible()){console.log('MARKET_NOT_VISIBLE '+market+' '+mobile);continue}
              await b.click();
              await p.waitForTimeout(500);
              const result=await p.evaluate(m=>{
               const style=document.getElementById('b46-css-only-mask');
               if(!style)throw Error('MASK_MISSING');
               const nav=()=>[...document.querySelectorAll('[data-stat-market] b')];
               const rows=()=>[...document.querySelectorAll('[data-sp-table-body] tr')].filter(r=>r.cells.length>=4);
               const chart=document.querySelector('#b46-finance-chart-card'),nodes=rows(),nums=nav();
               const prev=style.disabled;style.disabled=true;
               const before={counts:nums.map(n=>n.textContent),rows:nodes.map(r=>({text:r.textContent,visible:!!r.getClientRects().length})),graph:chart?.textContent};
               style.disabled=false;
               const after={counts:nav().map(n=>n.textContent),rows:rows().map(r=>({text:r.textContent,visible:!!r.getClientRects().length})),graph:document.querySelector('#b46-finance-chart-card')?.textContent};
               const mask=nav().every(n=>getComputedStyle(n).visibility==='hidden'),sameRows=nodes.every((r,i)=>rows()[i]===r),sameNumbers=nums.every((n,i)=>nav()[i]===n);
               style.disabled=prev;
               return {market:m,before,after,mask,sameRows,sameNumbers,active:document.querySelector('[data-stat-market].active')?.dataset.statMarket};
              },market);
              assert.deepEqual(result.after,result.before,'DATA_OR_RENDER_CHANGED '+market);
              assert(result.mask&&result.sameRows&&result.sameNumbers,'MASK_OR_IDENTITY '+market);
              assert.equal(result.active,market,'NAVIGATION '+market);
              checked++;
              console.log('MARKET_MASK_PASS '+JSON.stringify({mobile,market,rows:result.before.rows.length,counts:result.before.counts,mask:result.mask}));
              if(market==='all'||market==='ah')await p.screenshot({path:out+'/'+(mobile?'mobile':'pc')+'-'+market+'.png',fullPage:true});
             }
             if(!mobile){
                assert.equal(checked,8,'MARKET_COVERAGE');
                // Browser-only synthetic header proves live update without modifying source or history.
                const base=liveHealth.current.snapshot;
                const fake={...base,sequence:base.sequence+100000,rates:{...base.rates,all:12.34}};
                await p.route('**/b46-receiver-v1/graph?*',async route=>{
                  const response=await route.fetch();await route.fulfill({response,headers:{...response.headers(),'x-b46-monitor-rates':JSON.stringify(fake)}});
                },{times:1});
                const proof=await p.evaluate(async()=>{
                  const n=document.querySelector('[data-stat-market="all"] b'),before=n.textContent;
                  const rows=[...document.querySelectorAll('[data-sp-table-body] tr')];
                  const q='market=all&variant=all&filter=all&range=all';
                  // One QA-only call, never part of the deployed bridge.
                  const response=await fetch('/b46-receiver-v1/graph?'+q);
                  const json=await response.json();
                  await new Promise(r=>setTimeout(r,30));
                  return {ok:json.ok,trueOriginal:n===document.querySelector('[data-stat-market="all"] b')&&n.textContent===before,rate:document.querySelector('[data-b46-rate-snapshot="all"]').textContent};
                });
                assert(proof.ok&&proof.trueOriginal);assert.equal(proof.rate,'12.34%');console.log('BROWSER_UPDATE_FIXTURE_PASS');
               }else console.log('MOBILE_VISIBLE_MARKET_COVERAGE '+checked);assert.equal(errors.length,0,JSON.stringify(errors));
            }catch(e){
             console.log('BROWSER_FAILURE '+JSON.stringify({mobile,error:e.message,url:p.url(),errors,net:net.slice(-30),dom:await p.evaluate(()=>({title:document.title,body:document.body?.innerText?.slice(0,600),nav:document.querySelectorAll('[data-stat-market]').length,rows:document.querySelectorAll('[data-sp-table-body] tr').length,mask:!!document.getElementById('b46-css-only-mask')}))}));
             await p.screenshot({path:out+'/'+(mobile?'mobile':'pc')+'-failure.png',fullPage:true}).catch(()=>{});
             throw e;
            }finally{await c.close()}
           }
          }finally{await browser.close()}
          EOF
      - name: Confirm Production active version unchanged
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          const a=process.env.CLOUDFLARE_ACCOUNT_ID,t=process.env.CLOUDFLARE_API_TOKEN;
          const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+a+'/workers/scripts/ball46-production/deployments?per_page=1',{headers:{authorization:'Bearer '+t}});
          const j=await r.json();assert(j.success);
          assert.deepEqual(j.result.deployments[0].versions,JSON.parse(await readFile(process.env.RUNNER_TEMP+'/production-before.json','utf8')));
          console.log('PRODUCTION_UNCHANGED');
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: css-mask-proof
          path: ${{ runner.temp }}/css-mask-proof
          if-no-files-found: ignore
