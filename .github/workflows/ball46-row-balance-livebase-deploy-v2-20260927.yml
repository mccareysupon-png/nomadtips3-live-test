name: DEPLOY V2 - Ball46 row balance exact livebase 20260927

on:
  push:
    branches: [work/ball46-row-balance-livebase-20260927]
    paths:
      - '.github/workflows/ball46-row-balance-livebase-deploy-v2-20260927.yml'

permissions:
  contents: read
  actions: read

jobs:
  deploy-row-balance-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_COMMIT: 6276320261cdc10a3835b27e81850c3d4f17f126
      PATCH_COMMIT: bb055502511638df5b6f2fc741ce93e80e15c09e
      LIVEBASE_RUN_ID: 36291401917
      LIVEBASE_NAME: ball46-livebase-v2-36291401917
      BALL46_WORKER: https://ball46-production.mccarey-supon.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact current runtime source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download exact prework Production package
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.LIVEBASE_NAME }}
          path: /tmp/livebase
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.LIVEBASE_RUN_ID }}

      - name: Load immutable patcher and verify captured package
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-all-errors --retry-delay 1 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${PATCH_COMMIT}/.github/scripts/ball46_row_balance_livebase_v3_20260927.py" -o /tmp/patch.py
          test -s /tmp/patch.py
          python3 -m py_compile /tmp/patch.py
          test -s /tmp/livebase/current-assets.sha256
          test -s /tmp/livebase/reference-files.txt
          test "$(wc -l < /tmp/livebase/reference-files.txt)" = 69
          test "$(wc -l < /tmp/livebase/current-assets.sha256)" = 69
          (cd /tmp/livebase/current-assets && sha256sum -c /tmp/livebase/current-assets.sha256)
          echo CAPTURED_PREWORK_69_PASS

      - name: Hard gate current Production equals exact prework package before touching it
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while read -r expected name; do
            safe="${name//\//_}"
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 -H 'Cache-Control: no-cache' \
              "$BALL46_WORKER/$name?v2-pre=${GITHUB_RUN_ID}-$(date +%s%N)" -o "/tmp/v2-pre-$safe"
            actual=$(sha256sum "/tmp/v2-pre-$safe" | awk '{print $1}')
            if [ "$actual" != "$expected" ]; then echo "PRE_DEPLOY_MISMATCH:$name expected=$expected actual=$actual"; bad=$((bad+1)); fi
          done < /tmp/livebase/current-assets.sha256
          test "$bad" = 0 || { echo "PRE_DEPLOY_STOP_MISMATCH_COUNT=$bad"; exit 1; }
          echo PRE_DEPLOY_EXACT_69_PASS

      - name: Verify backend before UI-only deployment
        shell: bash
        run: |
          set -euo pipefail
          for ep in health board signals statistics; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_WORKER/api/engine/$ep?v2-before=${GITHUB_RUN_ID}" -o "/tmp/v2-before-$ep.json"
          done
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/v2-before-health.json'));
          const b=JSON.parse(fs.readFileSync('/tmp/v2-before-board.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/v2-before-signals.json'));
          const t=JSON.parse(fs.readFileSync('/tmp/v2-before-statistics.json'));
          if(h?.ok!==true||b?.ok!==true||!Array.isArray(b.fixtures)||!Array.isArray(s.signals)||t?.ok!==true||!Array.isArray(t.rows)) process.exit(1);
          console.log('V2_PRE_BACKEND_PASS',{fixtures:b.fixtures.length,signals:s.signals.length,settled:t.rows.length});
          NODE

      - name: Build candidate from exact current Production and enforce three-file diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf nomad-live-343
          mkdir -p nomad-live-343
          cp -a /tmp/livebase/current-assets/. nomad-live-343/
          python3 /tmp/patch.py verify-base nomad-live-343
          python3 /tmp/patch.py patch nomad-live-343
          node --check nomad-live-343/dashboard-v2-stage3.js
          python3 /tmp/patch.py gate nomad-live-343 /tmp/livebase/current-assets /tmp/livebase/reference-files.txt
          cd nomad-live-343
          while IFS= read -r f; do sha256sum "$f"; done < /tmp/livebase/reference-files.txt > /tmp/candidate.sha256
          cd - >/dev/null
          echo '--- CANDIDATE TARGET HASHES ---'
          grep -E '  (index\.html|dashboard-v2-stage3\.js|dashboard-v2-tune\.css)$' /tmp/candidate.sha256
          echo CANDIDATE_EXACT_THREE_FILE_GATE_PASS

      - name: Final race guard exact prework key files
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html dashboard-v2-stage3.js dashboard-v2-tune.css; do
            expected=$(grep -F "  $f" /tmp/livebase/current-assets.sha256 | awk '{print $1}')
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 -H 'Cache-Control: no-cache' \
              "$BALL46_WORKER/$f?v2-race=${GITHUB_RUN_ID}-$(date +%s%N)" -o "/tmp/v2-race-$f"
            actual=$(sha256sum "/tmp/v2-race-$f" | awk '{print $1}')
            test "$actual" = "$expected" || { echo "FINAL_RACE_STOP:$f"; exit 1; }
          done
          echo FINAL_KEY_RACE_PASS

      - name: Dry run exact candidate
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: npx --yes wrangler@4.92.0 deploy --dry-run --config wrangler.ball46.jsonc

      - name: Deploy exact current package plus row-balance patch
        id: deploy
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc | tee /tmp/v2-deploy.log
          grep -Fq 'Uploaded ball46-production' /tmp/v2-deploy.log
          grep -Fq 'Found 3 new or modified static assets to upload' /tmp/v2-deploy.log

      - name: Wait until all three changed assets are candidate-stable three consecutive samples
        id: stabilize
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          idx=$(grep -F '  index.html' /tmp/candidate.sha256 | awk '{print $1}')
          js=$(grep -F '  dashboard-v2-stage3.js' /tmp/candidate.sha256 | awk '{print $1}')
          css=$(grep -F '  dashboard-v2-tune.css' /tmp/candidate.sha256 | awk '{print $1}')
          stable=0
          for n in $(seq 1 30); do
            for f in index.html dashboard-v2-stage3.js dashboard-v2-tune.css; do
              curl -fsS -L --retry 3 --retry-all-errors --retry-delay 1 --max-time 25 -H 'Cache-Control: no-cache' \
                "$BALL46_WORKER/$f?v2-stable=${GITHUB_RUN_ID}-$n-$(date +%s%N)" -o "/tmp/v2-stable-$f"
            done
            a=$(sha256sum /tmp/v2-stable-index.html | awk '{print $1}')
            b=$(sha256sum /tmp/v2-stable-dashboard-v2-stage3.js | awk '{print $1}')
            c=$(sha256sum /tmp/v2-stable-dashboard-v2-tune.css | awk '{print $1}')
            echo "V2_SAMPLE $n index=$a js=$b css=$c"
            if [ "$a" = "$idx" ] && [ "$b" = "$js" ] && [ "$c" = "$css" ]; then stable=$((stable+1)); else stable=0; fi
            if [ "$stable" -ge 3 ]; then echo CANDIDATE_KEY_ASSETS_STABLE_3X; exit 0; fi
            sleep 3
          done
          echo CANDIDATE_KEY_ASSETS_NEVER_STABLE
          exit 1

      - name: Verify all 69 assets and backend after stabilization
        id: verify
        if: steps.stabilize.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while read -r expected name; do
            safe="${name//\//_}"
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 -H 'Cache-Control: no-cache' \
              "$BALL46_WORKER/$name?v2-after=${GITHUB_RUN_ID}-$(date +%s%N)" -o "/tmp/v2-after-$safe"
            actual=$(sha256sum "/tmp/v2-after-$safe" | awk '{print $1}')
            if [ "$actual" != "$expected" ]; then echo "POST_DEPLOY_MISMATCH:$name expected=$expected actual=$actual"; bad=$((bad+1)); fi
          done < /tmp/candidate.sha256
          test "$bad" = 0 || { echo "POST_DEPLOY_69_MISMATCH_COUNT=$bad"; exit 1; }
          grep -Fq 'layout=20260927-row-balance-livebase-v3' /tmp/v2-after-index.html
          grep -Fq 'class=\"match-meta-cell\"' /tmp/v2-after-dashboard-v2-stage3.js
          grep -Fq 'BALL46 LIVE ROW BALANCE LIVEBASE V3 20260927' /tmp/v2-after-dashboard-v2-tune.css
          for ep in health board signals statistics; do
            curl -fsS -L --retry 4 --retry-all-errors --retry-delay 1 --max-time 30 "$BALL46_WORKER/api/engine/$ep?v2-after-api=${GITHUB_RUN_ID}" -o "/tmp/v2-after-$ep.json"
          done
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/v2-after-health.json'));
          const b=JSON.parse(fs.readFileSync('/tmp/v2-after-board.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/v2-after-signals.json'));
          const t=JSON.parse(fs.readFileSync('/tmp/v2-after-statistics.json'));
          if(h?.ok!==true||b?.ok!==true||!Array.isArray(b.fixtures)||!Array.isArray(s.signals)||t?.ok!==true||!Array.isArray(t.rows)) process.exit(1);
          console.log('V2_POST_BACKEND_PASS',{fixtures:b.fixtures.length,signals:s.signals.length,settled:t.rows.length});
          NODE
          echo V2_POST_DEPLOY_EXACT_69_PASS

      - name: Exact-package recovery if stabilization or verification fails
        id: recover
        if: steps.deploy.outcome == 'success' && (steps.stabilize.outcome != 'success' || steps.verify.outcome != 'success')
        working-directory: workers/nomadtips3-343-preview
        shell: bash
        run: |
          set -euo pipefail
          cd ../..
          rm -rf nomad-live-343
          mkdir -p nomad-live-343
          cp -a /tmp/livebase/current-assets/. nomad-live-343/
          cd workers/nomadtips3-343-preview
          npx --yes wrangler@4.92.0 deploy --config wrangler.ball46.jsonc | tee /tmp/v2-recovery.log
          cd ../..
          idx=$(grep -F '  index.html' /tmp/livebase/current-assets.sha256 | awk '{print $1}')
          js=$(grep -F '  dashboard-v2-stage3.js' /tmp/livebase/current-assets.sha256 | awk '{print $1}')
          css=$(grep -F '  dashboard-v2-tune.css' /tmp/livebase/current-assets.sha256 | awk '{print $1}')
          stable=0
          for n in $(seq 1 30); do
            for f in index.html dashboard-v2-stage3.js dashboard-v2-tune.css; do
              curl -fsS -L --retry 3 --retry-all-errors --retry-delay 1 --max-time 25 -H 'Cache-Control: no-cache' \
                "$BALL46_WORKER/$f?v2-recover=${GITHUB_RUN_ID}-$n-$(date +%s%N)" -o "/tmp/v2-recover-$f"
            done
            a=$(sha256sum /tmp/v2-recover-index.html | awk '{print $1}')
            b=$(sha256sum /tmp/v2-recover-dashboard-v2-stage3.js | awk '{print $1}')
            c=$(sha256sum /tmp/v2-recover-dashboard-v2-tune.css | awk '{print $1}')
            echo "RECOVERY_SAMPLE $n index=$a js=$b css=$c"
            if [ "$a" = "$idx" ] && [ "$b" = "$js" ] && [ "$c" = "$css" ]; then stable=$((stable+1)); else stable=0; fi
            if [ "$stable" -ge 3 ]; then echo EXACT_PREWORK_RECOVERY_STABLE_3X; exit 0; fi
            sleep 3
          done
          exit 1

      - name: Final gate
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.deploy.outcome }}" != "success" ]; then echo V2_DEPLOY_NOT_COMPLETED; exit 1; fi
          if [ "${{ steps.stabilize.outcome }}" != "success" ] || [ "${{ steps.verify.outcome }}" != "success" ]; then
            echo "V2_VERIFY_FAILED recovery=${{ steps.recover.outcome }}"
            exit 1
          fi
          echo BALL46_ROW_BALANCE_V2_DEPLOY_VERIFIED
