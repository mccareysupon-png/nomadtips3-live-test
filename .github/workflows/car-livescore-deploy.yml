name: Retire CAR LiveScore

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/car-livescore-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: car-livescore-retire
  cancel-in-progress: true

env:
  SCRIPT_NAME: nomadtips3-car-livescore
  LIVESCORE_WORKER_URL: https://nomadtips3-car-livescore.mccarey-supon.workers.dev

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete isolated CAR LiveScore worker
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
          curl --fail-with-body -sS \
            -X DELETE \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$SCRIPT_NAME"

      - name: Verify Worker no longer serves traffic
        run: |
          sleep 5
          if curl -fsS "$LIVESCORE_WORKER_URL/health" >/dev/null; then
            echo "Worker is still reachable"
            exit 1
          fi
          echo "CAR LiveScore worker is retired"
