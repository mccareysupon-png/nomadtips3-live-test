name: Deploy CAR LiveScore

on:
  push:
    branches: [main]
    paths:
      - "car-livescore/worker/**"
      - ".github/workflows/car-livescore-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  LIVESCORE_WORKER_URL: https://nomadtips3-car-livescore.mccarey-supon.workers.dev

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validate isolated source
        run: |
          node --check car-livescore/worker/src/index.js
          node --check car-livescore/web/livescore.js
          test -f car-livescore/web/index.html
          test -f car-livescore/web/results.html

      - name: Validate Cloudflare credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy isolated CAR LiveScore worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: car-livescore/worker
          wranglerVersion: "4"
          command: deploy

      - name: Smoke test worker
        shell: bash
        run: |
          HEALTH=$(curl -fsS "$LIVESCORE_WORKER_URL/health")
          echo "$HEALTH"
          printf '%s' "$HEALTH" | grep -q '"CAR LIVESCORE"' || { echo "::error::Worker identity missing"; exit 1; }

          SCORES=$(curl -fsS "$LIVESCORE_WORKER_URL/scores")
          echo "$SCORES" | head -c 12000
          echo
          printf '%s' "$SCORES" | grep -q '"matches"' || { echo "::error::Scores payload missing"; exit 1; }

      - name: Show preview URLs
        run: |
          echo "Worker: $LIVESCORE_WORKER_URL"
          echo "Live Scores: https://mccareysupon-png.github.io/nomadtips3-live-test/car-livescore/web/"
          echo "Results: https://mccareysupon-png.github.io/nomadtips3-live-test/car-livescore/web/results.html"
