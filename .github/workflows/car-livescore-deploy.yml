name: Deploy CAR LiveScore Nowgoal

on:
  push:
    branches: [main]
    paths:
      - "car-livescore/worker/**"
      - "car-livescore/web/**"
      - ".github/workflows/car-livescore-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  LIVESCORE_WORKER_URL: https://nomadtips3-car-livescore.mccarey-supon.workers.dev

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate source
        run: node --check car-livescore/worker/src/index.js
      - name: Validate Cloudflare credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN"
          test -n "$CF_ACCOUNT_ID"
      - name: Deploy isolated CAR LiveScore worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: car-livescore/worker
          wranglerVersion: "4"
          command: deploy
      - name: Probe Nowgoal26 source
        run: |
          sleep 4
          mkdir -p car-livescore
          curl -fsS "$LIVESCORE_WORKER_URL/health"
          curl -fsS "$LIVESCORE_WORKER_URL/probe" > car-livescore/probe-result.json
          head -c 20000 car-livescore/probe-result.json
      - name: Save probe result
        run: |
          git config user.name "nomadtips3-bot"
          git config user.email "actions@users.noreply.github.com"
          git add car-livescore/probe-result.json
          if git diff --cached --quiet; then
            echo "Probe result unchanged"
          else
            git commit -m "Record Nowgoal26 probe result"
            git push
          fi
