name: BALL46 read-only settings exposure audit
on:
  push:
    branches: [test/ball46-sidebar-spacing-20261119]
    paths: ['.github/workflows/detection-settings-audit-20261119.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect dependencies and anonymous status without dumping contents
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node qa/detection-private-20261119/audit-settings.mjs
