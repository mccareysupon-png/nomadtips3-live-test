name: NOMAD 3.42 DRAW Palette Guard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'nomad-live-342/vintage-draw-theme.js'
      - 'nomad-live-342/vintage-draw-theme.css'
      - 'nomad-live-342/index.html'
      - '.github/workflows/nomad342-draw-palette-guard.yml'

permissions:
  contents: read

jobs:
  draw-palette-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Enforce presentation-only boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check nomad-live-342/vintage-draw-theme.js
          test -s nomad-live-342/vintage-draw-theme.css
          if grep -Ein 'fetch[[:space:]]*\(|NOMAD342_RUNTIME|engineBase|/feed|totalcorner\.com|localStorage' nomad-live-342/vintage-draw-theme.js nomad-live-342/vintage-draw-theme.css; then
            echo '::error::DRAW presentation layer crossed the data/runtime boundary.'
            exit 1
          fi

      - name: Validate 12 DRAW colors and 36-color uniqueness
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const assert=require('assert');
          const context={
            window:{},
            document:{readyState:'loading',addEventListener(){}},
            console
          };
          vm.runInNewContext(fs.readFileSync('nomad-live-342/vintage-draw-theme.js','utf8'),context);
          const theme=context.window.NOMAD342_DRAW_THEME;
          assert(theme,'DRAW theme must initialize');
          assert.strictEqual(theme.colors.length,12,'DRAW must contain exactly 12 colors');
          assert.strictEqual(new Set(theme.colors.map(v=>v.toLowerCase())).size,12,'DRAW colors must be unique');
          assert.strictEqual(theme.exactUnique,true,'HOME/AWAY/DRAW 36 colors must not contain exact duplicates');
          assert.strictEqual(theme.localDistinct,true,'Each DRAW color must be visually separated from HOME/AWAY');
          console.log('DRAW_PALETTE_OK',JSON.stringify(theme));
          NODE

      - name: Validate live asset order
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const assert=require('assert');
          const html=fs.readFileSync('nomad-live-342/index.html','utf8');
          const baseCss=html.indexOf('vintage-card-theme.css');
          const drawCss=html.indexOf('vintage-draw-theme.css');
          const baseJs=html.indexOf('vintage-card-theme.js');
          const drawJs=html.indexOf('vintage-draw-theme.js');
          assert(baseCss>=0&&drawCss>baseCss,'DRAW CSS must load after base Vintage CSS');
          assert(baseJs>=0&&drawJs>baseJs,'DRAW JS must load after base Vintage JS');
          const css=fs.readFileSync('nomad-live-342/vintage-draw-theme.css','utf8');
          assert(css.includes('var(--vt-draw)'),'DRAW CSS must consume per-card --vt-draw');
          console.log('DRAW_ASSET_ORDER_OK');
          NODE

      - name: Validate all 12 DRAW palettes in browser
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock puppeteer-core@24 >/dev/null 2>&1
          cat > nomad-live-342/__draw_guard.html <<'HTML'
          <!doctype html><html><head>
          <link rel="stylesheet" href="vintage-draw-theme.css">
          </head><body data-page="live"><div id="matchList"></div>
          <script>
          const homes=['#d86f78','#72c28b','#6e9ed8','#d16c76','#cd6b7d','#df7c34','#a882bd','#c95d64','#d0a43e','#6fb6bc','#9ca65e','#6c92df'];
          const aways=['#e6d7b3','#e5dcc0','#d8ae4b','#8eb9c5','#62b7bf','#b8b9b4','#d7c397','#a7cfad','#6d8fc5','#b8676d','#e7dfc8','#cc676d'];
          document.getElementById('matchList').innerHTML=homes.map((home,i)=>`<article class="event-compact vintage-theme-ready" data-vintage-palette="${String(i+1).padStart(2,'0')}" style="--vt-home:${home};--vt-away:${aways[i]}"><div class="nlp-draw"><span>DRAW</span><b>${30+i}%</b></div><div class="nlp-track"><i class="nlp-track-draw"></i></div></article>`).join('');
          </script>
          <script src="vintage-draw-theme.js"></script>
          </body></html>
          HTML
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/nomad342-draw-guard.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; rm -f nomad-live-342/__draw_guard.html' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/nomad-live-342/__draw_guard.html >/dev/null; then break; fi
            sleep .2
          done
          node - <<'NODE'
          const puppeteer=require('puppeteer-core');
          const executablePath=process.env.CHROME_PATH||'/usr/bin/google-chrome-stable';
          const check=(ok,msg)=>{if(!ok)throw new Error(msg)};
          (async()=>{
            const browser=await puppeteer.launch({executablePath,headless:true,args:['--no-sandbox','--disable-gpu']});
            try{
              const page=await browser.newPage();
              await page.goto('http://127.0.0.1:8080/nomad-live-342/__draw_guard.html',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForFunction(()=>document.querySelectorAll('.event-compact.vintage-draw-theme-ready').length===12,{timeout:10000});
              const result=await page.evaluate(()=>[...document.querySelectorAll('.event-compact')].map(card=>{
                const probe=document.createElement('i');
                probe.style.color='var(--vt-draw)';card.appendChild(probe);
                const draw=getComputedStyle(probe).color;probe.remove();
                return {
                  palette:card.dataset.vintagePalette,
                  drawVar:card.style.getPropertyValue('--vt-draw').trim().toLowerCase(),
                  draw,
                  label:getComputedStyle(card.querySelector('.nlp-draw b')).color,
                  track:getComputedStyle(card.querySelector('.nlp-track-draw')).backgroundColor
                };
              }));
              console.log('DRAW_BROWSER',JSON.stringify(result));
              check(result.length===12,'expected 12 DRAW cards');
              check(new Set(result.map(x=>x.drawVar)).size===12,'browser DRAW variables must stay unique');
              result.forEach(x=>{
                check(x.drawVar,`palette ${x.palette}: missing --vt-draw`);
                check(x.label===x.draw,`palette ${x.palette}: DRAW label escaped palette`);
                check(x.track===x.draw,`palette ${x.palette}: DRAW track escaped palette`);
              });
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
