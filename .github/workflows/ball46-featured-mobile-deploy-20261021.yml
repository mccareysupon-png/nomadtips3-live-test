name: BALL46 Featured Native Mobile Production
on:
  push:
    branches: [fix/ball46-featured-mobile-native-card-20261021]
    paths:
      - 'deploy-assets/featured-mobile-native-20261021/native-mobile.css'
      - 'deploy-assets/featured-mobile-native-20261021/deploy-native.mjs'
      - '.github/workflows/ball46-featured-mobile-deploy-20261021.yml'
permissions:
  contents: read
concurrency:
  group: ball46-production-deploy
  cancel-in-progress: false
jobs:
  mobile-native-featured:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployment script and install browser
        working-directory: deploy-assets/featured-mobile-native-20261021
        run: |
          set -euo pipefail
          node --check deploy-native.mjs
          npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Baseline, inactive candidate browser QA, then guarded Production deploy
        working-directory: deploy-assets/featured-mobile-native-20261021
        run: node deploy-native.mjs
      - name: Keep full before / candidate / Production screenshots and rollback report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ball46-featured-mobile-native-production-proof
          path: deploy-assets/featured-mobile-native-20261021/proof/
          retention-days: 30
          if-no-files-found: warn