name = "nomadtips3-live-engine"
main = "src/index-fiveusd-production.js"
compatibility_date = "2026-08-20"
workers_dev = true

[limits]
subrequests = 1000

[vars]
FIVEUSD_NATIVE_MODE = "authority"
FIVEUSD_SHADOW_LEGACY_DISABLED = "true"
FIVEUSD_LIVE_REFRESH_MS = "3000"
FIVEUSD_GLOBAL_REQUEST_BUDGET_PER_60S = "40"

[[durable_objects.bindings]]
name = "ENGINE"
class_name = "EngineState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EngineState"]

[env.test]
name = "nomadtips3-live-engine-test"
workers_dev = false
preview_urls = false

[env.test.vars]
ENGINE_CYCLE_MODE = "on_demand"
FIVEUSD_NATIVE_MODE = "authority"
FIVEUSD_SHADOW_LEGACY_DISABLED = "true"
FIVEUSD_LIVE_REFRESH_MS = "3000"
FIVEUSD_GLOBAL_REQUEST_BUDGET_PER_60S = "40"

[[env.test.durable_objects.bindings]]
name = "ENGINE"
class_name = "EngineState"

[[env.test.migrations]]
tag = "v1"
new_sqlite_classes = ["EngineState"]
