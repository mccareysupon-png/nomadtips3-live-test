name = "nomadtips3-live-engine-5usd-shadow"
main = "src/index-fiveusd-shadow.js"
compatibility_date = "2026-08-20"
workers_dev = true

[vars]
ENGINE_CYCLE_MODE = "continuous"
FIVEUSD_NATIVE_MODE = "shadow"
FIVEUSD_SHADOW_LEGACY_DISABLED = "true"
FIVEUSD_UPCOMING_WINDOW_MINUTES = "120"
FIVEUSD_LIVE_REFRESH_MS = "3000"
FIVEUSD_UPCOMING_REFRESH_MS = "120000"
FIVEUSD_REFEREE_REFRESH_MS = "60000"
FIVEUSD_LIVE_REQUEST_BUDGET_PER_60S = "20"
FIVEUSD_UPCOMING_REQUEST_BUDGET_PER_60S = "3"
FIVEUSD_REFEREE_REQUEST_BUDGET_PER_60S = "10"
FIVEUSD_GLOBAL_REQUEST_BUDGET_PER_60S = "40"
FIVEUSD_LIVE_MAX_PAGES = "1"
FIVEUSD_UPCOMING_MAX_PAGES = "3"
FIVEUSD_MAX_REFEREE_STARTS_PER_TICK = "1"

[limits]
subrequests = 1000

[[durable_objects.bindings]]
name = "ENGINE"
class_name = "EngineState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EngineState"]
