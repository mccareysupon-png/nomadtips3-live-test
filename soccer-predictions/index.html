<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#123328">
  <title>nomadtips3 · Soccer Predictions</title>
  <link rel="stylesheet" href="predictions.css?v=20260828-ui-v2">
  <link rel="stylesheet" href="daily-rotation.css?v=20260829-two-tabs-text-only-v2">
  <link rel="stylesheet" href="clean-cards.css?v=20260828-team-logos-v2">
  <link rel="stylesheet" href="analysis-polish.css?v=20260829-opponent-dashed-v2">
  <link rel="stylesheet" href="stadium-card-header.css?v=20260829-no-images-keep-logos-v1">
  <link rel="stylesheet" href="result-summary.css?v=20260828-v1">
  <link rel="stylesheet" href="toolbar-center.css?v=20260828-v2">
  <link rel="stylesheet" href="hero-title-scale.css?v=20260829-title-yellow-plus10-v3">
  <link rel="stylesheet" href="flat-category-cards.css?v=20260829-flat-category-v1">
  <link rel="stylesheet" href="green-brightness.css?v=20260829-green-plus15-v2">
  <link rel="stylesheet" href="trend-film-sharp.css?v=20260829-sharp-film-v1">
  <link rel="stylesheet" href="selected-depth.css?v=20260829-selected-green-safe-v1">
  <link rel="stylesheet" href="match-explorer.css?v=20260829-selected-matches-v1">
  <link rel="stylesheet" href="card-separator-theme.css?v=20260829-dark-green-match-header-v1">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner topbar-brand-only">
      <span class="brand">nomad<span>tips</span>3</span>
    </div>
  </header>

  <main class="shell">
    <section class="hero">
      <div>
        <h1>Soccer Predictions</h1>
        <p>NOMAD picks and manually curated match analysis, with the previous NOMAD slate's settled results kept separate.</p>
      </div>
      <div class="hero-badge">
        <span id="heroLabel">TODAY'S PREDICTIONS</span>
        <strong id="pickCount">—</strong>
        <small id="heroSmall">qualified picks</small>
      </div>
    </section>

    <nav class="scope-switch" aria-label="Prediction coverage">
      <button class="scope-tab active" type="button" data-scope="nomad">NOMAD Predictions <span id="nomadScopeCount">—</span></button>
      <button class="scope-tab" type="button" data-scope="selected">Selected Matches <span id="selectedScopeCount">—</span></button>
    </nav>

    <nav class="day-switch" aria-label="Prediction day views">
      <button class="day-tab active" type="button" data-view="today">Today's Predictions <span id="todayCount">—</span></button>
      <button class="day-tab" type="button" data-view="yesterday">Yesterday's Results <span id="yesterdayCount">—</span></button>
    </nav>

    <section id="matchExplorerTools" class="match-explorer-tools" hidden>
      <div id="explorerStatus" class="explorer-status">
        <strong id="coverageLabel">CURATED MATCHES</strong>
        <span id="coverageNote">Loading curated match set…</span>
      </div>
      <div id="leagueStrip" class="league-strip" aria-label="League filters"></div>
      <div id="commandStrip" class="command-strip" aria-label="Quick match filters">
        <button class="command-chip active" type="button" data-command="ALL">All</button>
        <button class="command-chip nomad" type="button" data-command="NOMAD">NOMAD Pick</button>
        <button class="command-chip" type="button" data-command="CONF55">Confidence ≥55%</button>
        <button class="command-chip" type="button" data-command="ODDS2">Odds ≥2.00</button>
      </div>
    </section>

    <section class="toolbar">
      <div class="toolbar-copy">
        <p class="eyebrow" id="sectionEyebrow">TODAY'S SELECTIONS</p>
        <h2 id="sectionTitle"></h2>
      </div>
      <label class="search">Search <input id="searchInput" type="search" placeholder="team / league"></label>
    </section>

    <section id="predictionList" class="prediction-list">
      <div class="loading">Loading prediction cards…</div>
    </section>

    <div class="explorer-foot">
      <button id="loadMoreMatches" class="load-more-matches" type="button" hidden>Load more</button>
    </div>

    <section id="resultList" class="result-list" hidden>
      <div class="loading">Loading previous results…</div>
    </section>
  </main>

  <script src="predictions.js?v=20260829-source-metrics-v1" defer></script>
  <script src="match-explorer.js?v=20260829-selected-matches-v1" defer></script>
  <script src="selected-emphasis.js?v=20260829-selected-green-safe-v1" defer></script>
  <script src="local-time.js?v=20260829-local-time-v1" defer></script>
  <script src="performance-trend.js?v=20260829-smooth-sharp-film-v1" defer></script>
  <script src="view-reset.js?v=20260828-v1" defer></script>
</body>
</html>
