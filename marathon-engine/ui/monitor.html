<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marathon Engine</title><style>
:root{color-scheme:dark;--bg:#0c0f0e;--panel:#141817;--line:#2c3431;--text:#f2f4f3;--muted:#9da8a3;--yellow:#f4d21f;--green:#24c46b;--red:#ff6666}*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:var(--bg);color:var(--text)}header{position:sticky;top:0;background:#0c0f0ef2;border-bottom:1px solid var(--line)}.wrap{max-width:1280px;margin:auto;padding:0 18px}.bar{min-height:66px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:20px}.brand b{color:var(--yellow)}nav{display:flex;gap:8px}nav a{color:var(--muted);text-decoration:none;padding:9px 12px;border-radius:8px;border:1px solid transparent}nav a.active,nav a:hover{color:var(--text);background:var(--panel);border-color:var(--line)}main{padding:20px 0}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px}.stat small{color:var(--muted);display:block;margin-bottom:6px}.stat strong{font-size:18px}.panel{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:auto}.panel h2{font-size:16px;margin:0;padding:15px 16px;border-bottom:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--muted);font-size:12px}.signal{color:var(--green);font-weight:800}.off{color:var(--muted)}.error{color:var(--red)}.foot{color:var(--muted);padding:12px 0;line-height:1.5}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.bar{padding:12px 0;align-items:flex-start;flex-direction:column;gap:10px}}
</style></head><body><header><div class="wrap bar"><div class="brand">MARATHON <b>ENGINE</b></div><nav><a class="active" href="/">MONITOR</a><a href="/settings">SETTINGS</a></nav></div></header><main class="wrap"><div class="stats"><div class="stat"><small>ENGINE</small><strong id="engine">…</strong></div><div class="stat"><small>DETECTOR</small><strong id="detector">…</strong></div><div class="stat"><small>LIVE MATCHES</small><strong id="matches">0</strong></div><div class="stat"><small>LOCKED SIGNALS</small><strong id="signals">0</strong></div><div class="stat"><small>RAW STATS</small><strong id="stats">0</strong></div><div class="stat"><small>RAW EVENTS</small><strong id="events">0</strong></div></div><section class="panel"><h2>Live Football</h2><table><thead><tr><th>League</th><th>Match</th><th>Time</th><th>Score</th><th>HOME AH / Odds</th><th>AWAY AH / Odds</th><th>Decision</th></tr></thead><tbody id="rows"></tbody></table></section><div id="foot" class="foot">Loading Marathon source…</div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function tick(){try{const [h,l,s,st,ev]=await Promise.all([fetch('/api/health').then(r=>r.json()),fetch('/api/live').then(r=>r.json()),fetch('/api/signals').then(r=>r.json()),fetch('/api/stats').then(r=>r.json()),fetch('/api/events').then(r=>r.json())]);document.getElementById('engine').textContent=h.ok?'ONLINE':(h.applyingSettings?'APPLYING':'WAITING');document.getElementById('engine').className=h.ok?'signal':(h.lastError?'error':'off');document.getElementById('detector').textContent=h.detectorEnabled?'ON':'OFF';document.getElementById('matches').textContent=h.matchCount;document.getElementById('signals').textContent=s.filter(x=>(x.locked||[]).length).length;document.getElementById('stats').textContent=(st.items||[]).length;document.getElementById('events').textContent=(ev.items||[]).length;document.getElementById('rows').innerHTML=(l.matches||[]).map(m=>{const ah=(m.markets||[]).find(x=>x.type==='HANDICAP');const home=ah?`${ah.home.rawLine} @ ${ah.home.rawOdds}`:'—';const away=ah?`${ah.away.rawLine} @ ${ah.away.rawOdds}`:'—';const d=m.detection?.decision||'—';return `<tr><td>${esc(m.identity.league||'—')}</td><td>${esc(m.identity.home)} — ${esc(m.identity.away)}</td><td>${esc(m.live.clock.raw||'—')}</td><td>${esc(m.live.score.raw||'—')}</td><td>${esc(home)}</td><td>${esc(away)}</td><td class="${d==='SIGNAL'?'signal':'off'}">${esc(d)}</td></tr>`}).join('')||'<tr><td colspan="7" class="off">ยังไม่พบคู่ที่ parse ได้จาก source</td></tr>';document.getElementById('foot').textContent=`Source: ${h.sourceUrl} · Scan ${h.pollMs} ms · Last source: ${h.lastSourceOkAt||'—'}${h.lastError?' · '+h.lastError:''}`}catch(e){document.getElementById('foot').textContent=e.message}}
tick();setInterval(tick,2000)
</script></body></html>
