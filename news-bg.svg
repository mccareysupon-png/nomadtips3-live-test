<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="NOMADTIPS3 editorial football analytics background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09100d"/>
      <stop offset=".52" stop-color="#0b1511"/>
      <stop offset="1" stop-color="#10140f"/>
    </linearGradient>
    <linearGradient id="goldArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d0b055" stop-opacity=".28"/>
      <stop offset="1" stop-color="#d0b055" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="78%" cy="35%" r="42%">
      <stop offset="0" stop-color="#d5aa37" stop-opacity=".16"/>
      <stop offset="1" stop-color="#d5aa37" stop-opacity="0"/>
    </radialGradient>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="fade"><feFuncA type="table" tableValues="0 .075"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="fade" mode="soft-light"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#b7c4ba" stroke-opacity=".065" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#d5ad48" fill-opacity=".32"/>
    </pattern>
    <clipPath id="rightFade"><rect x="515" y="0" width="1085" height="900" rx="0"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>

  <g opacity=".16" stroke="#b2bdae" fill="none">
    <circle cx="-70" cy="100" r="285" stroke-width="3"/>
    <circle cx="-40" cy="690" r="260" stroke-width="3"/>
    <circle cx="170" cy="900" r="190" stroke-width="2"/>
    <path d="M0 465 C180 430 315 500 470 615" stroke-width="2"/>
  </g>

  <g clip-path="url(#rightFade)">
    <g opacity=".11" transform="translate(910 70) scale(1.05)">
      <path d="M124 22l66 17 48-15 65 38 75-5 76 45-28 72-64 18-8 63-48 58-42 102-72 41-92-24-63-74-13-80 32-56-18-74 51-54z" fill="#768676"/>
      <circle cx="185" cy="105" r="23" fill="#050706"/>
      <circle cx="238" cy="92" r="34" fill="#050706"/>
      <circle cx="280" cy="156" r="46" fill="#050706"/>
      <circle cx="335" cy="95" r="19" fill="#050706"/>
      <circle cx="365" cy="194" r="29" fill="#050706"/>
      <circle cx="415" cy="126" r="15" fill="#050706"/>
    </g>

    <g transform="translate(635 500) rotate(-4)" opacity=".22" fill="none" stroke="#9fa99f">
      <rect x="0" y="0" width="690" height="330" rx="8" stroke-width="2"/>
      <line x1="345" y1="0" x2="345" y2="330"/>
      <circle cx="345" cy="165" r="52"/>
      <rect x="0" y="68" width="120" height="194"/>
      <rect x="570" y="68" width="120" height="194"/>
      <rect x="0" y="115" width="46" height="100"/>
      <rect x="644" y="115" width="46" height="100"/>
      <g stroke="#d6ad46" stroke-opacity=".65" stroke-dasharray="8 10">
        <path d="M145 205 C250 95 345 108 445 168 S565 220 632 145"/>
        <path d="M182 265 C278 235 360 245 482 290"/>
      </g>
      <g fill="#d7ad43" stroke="none">
        <circle cx="145" cy="205" r="5"/><circle cx="278" cy="126" r="5"/><circle cx="395" cy="156" r="5"/><circle cx="515" cy="206" r="5"/><circle cx="632" cy="145" r="5"/>
      </g>
    </g>

    <path d="M535 610 L570 596 L606 605 L642 580 L678 590 L714 552 L750 505 L786 526 L822 484 L858 498 L894 458 L930 474 L966 438 L1002 405 L1038 360 L1074 332 L1110 292 L1146 340 L1182 305 L1218 335 L1254 302 L1290 262 L1326 282 L1362 246 L1398 256 L1434 218 L1470 228 L1506 196 L1542 165 L1578 175" fill="none" stroke="#d8b752" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M535 610 L570 596 L606 605 L642 580 L678 590 L714 552 L750 505 L786 526 L822 484 L858 498 L894 458 L930 474 L966 438 L1002 405 L1038 360 L1074 332 L1110 292 L1146 340 L1182 305 L1218 335 L1254 302 L1290 262 L1326 282 L1362 246 L1398 256 L1434 218 L1470 228 L1506 196 L1542 165 L1578 175 L1578 650 L535 650 Z" fill="url(#goldArea)"/>
    <path d="M535 620 C660 600 755 555 850 515 S1025 445 1110 365 S1290 310 1395 250 S1510 205 1580 180" fill="none" stroke="#b9561d" stroke-width="2.4" stroke-linecap="round"/>

    <line x1="940" y1="210" x2="1590" y2="210" stroke="#d4ad46" stroke-opacity=".45" stroke-dasharray="5 9"/>
    <line x1="940" y1="236" x2="1590" y2="236" stroke="#d4ad46" stroke-opacity=".18" stroke-dasharray="2 8"/>
    <circle cx="1542" cy="165" r="12" fill="#0c120f" stroke="#e0c45e" stroke-width="3" filter="url(#glow)"/>
    <path d="M1548 153l22-28" fill="none" stroke="#e3c866" stroke-width="3" stroke-linecap="round"/>
    <path d="M1565 129l6-5-1 8" fill="#e3c866"/>
  </g>

  <rect x="1320" y="685" width="300" height="215" fill="url(#dots)" opacity=".65"/>
  <rect x="0" y="580" width="270" height="210" fill="url(#dots)" opacity=".18"/>
  <rect width="1600" height="900" fill="transparent" filter="url(#paper)"/>
  <rect width="1600" height="900" fill="none" stroke="#d6b653" stroke-opacity=".06" stroke-width="2"/>
</svg>
