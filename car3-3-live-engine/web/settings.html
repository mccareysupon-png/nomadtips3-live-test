<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOMADTIPS3 Settings 3.3</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./rgb-dark-v2.css?v=20260816-source-xy"></head><body><header class="topbar"><div class="brand">NOMAD<span>TIPS3</span></div><nav class="nav"><a href="./index.html">LIVE DETECTION</a><a href="./history.html">STATISTICS</a><a class="active" href="./settings.html">SETTINGS</a></nav></header><div class="shell"><section class="hero"><h1>SETTINGS</h1><p>Rules that create a confirmed live signal.</p></section><div id="rule" class="rule-summary"></div><form id="form"><div class="form-grid"><div class="field"><label>SIDE</label><select name="side"><option>HOME</option><option>AWAY</option><option>BOTH</option></select></div><div class="field"><label>MINUTE FROM</label><input name="minuteMin" type="number"></div><div class="field"><label>MINUTE TO</label><input name="minuteMax" type="number"></div><div class="field"><label>MARKET</label><select name="market"><option>WIN</option><option>AH</option><option>OU</option></select></div><div class="field"><label>ODDS MIN</label><input name="oddsMin" type="number" step="0.01"></div><div class="field"><label>ODDS MAX</label><input name="oddsMax" type="number" step="0.01"></div><div class="field"><label>AH LINE MIN</label><input name="ahMin" type="number" step="0.25"></div><div class="field"><label>AH LINE MAX</label><input name="ahMax" type="number" step="0.25"></div><div class="field"><label>MOMENTUM MIN %</label><input name="momentumMin" type="number"></div><div class="field"><label>CONFIRMATION ROUNDS</label><input name="confirmationRounds" type="number"></div><div class="field"><label>O/U DIRECTION</label><select name="ouDirection"><option>OVER</option><option>UNDER</option></select></div><div class="field"><label>O/U LINE</label><input name="ouLine" type="number" step="0.25"></div></div><details class="advanced"><summary>ATTACK EVIDENCE</summary><div class="form-grid" style="margin-top:10px"><div class="field"><label>DANGEROUS ATTACK MIN</label><input name="attackEvidenceDangerousAttacksMin" type="number"></div><div class="field"><label>SHOTS MIN</label><input name="attackEvidenceShotsMin" type="number"></div><div class="field"><label>SHOTS ON TARGET MIN</label><input name="attackEvidenceShotsOnTargetMin" type="number"></div><div class="field"><label>CORNERS MIN</label><input name="attackEvidenceCornersMin" type="number"></div><div class="field"><label>REQUIREMENT</label><select name="attackEvidenceRequirement"><option>1</option><option>2</option><option>3</option><option>ALL</option></select></div></div></details><div class="actions"><button class="primary-btn" type="submit">SAVE & RUN</button><button id="reset" class="secondary-btn" type="button">RESET DEFAULTS</button></div><div id="status" class="count" style="margin-top:8px"></div></form></div><script type="module" src="./settings.js"></script></body></html>
