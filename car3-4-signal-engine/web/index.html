<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b0d0c"><title>NOMADTIPS3 — CAR 3.4 Signal Board</title><link rel="stylesheet" href="./styles.css"></head><body><main class="shell"><header class="top"><div class="brand">nomad<b>tips3</b> · 3.4</div><nav><a class="active" href="./index.html">SIGNALS</a><a href="./stats.html">STATISTICS</a><a href="./settings.html">SETTINGS</a></nav></header><section class="hero"><div class="eyebrow">CAR 3.4 · SIGNAL BOARD</div><h1>เห็นแล้วรู้เลยว่าเลือกอะไร</h1><p>หน้าแรกแสดงเฉพาะสัญญาณที่ถูกบันทึกจริง: ทีม/ตลาด/ไลน์/Odds/สกอร์ตอนตรวจจับ/เวลาตรวจจับ และผลสุดท้าย ไม่ยัดตารางบอลสดทั้งตลาด</p></section><div class="statusbar"><i class="dot"></i><span id="health">กำลังเชื่อมต่อเครื่องยนต์…</span></div><section id="metrics" class="metrics"></section><div class="section-title"><h2>ล่าสุด</h2><span id="updated">—</span></div><section id="signals" class="signals"><div class="empty">กำลังโหลดสัญญาณ…</div></section></main><script type="module">import{esc,dt,clock,line,resultOf,getHistory,getHealth,$,CAR34}from'./core.js';
const metric=(k,v)=>`<article class="metric"><small>${k}</small><b>${v}</b></article>`;
function score(r){const s=r.entryScore;return s&&s.home!=null?`${esc(s.home)}-${esc(s.away)}`:'—'}
function pick(r){const team=r.selectedTeam||r.selectedSide||'—';const market=String(r.market||'—').toUpperCase();const ln=market==='WIN'?'':` ${line(r.line)}`;return `${esc(team)} · ${esc(market)}${esc(ln)}`}
function card(r){const result=resultOf(r),odds=r.odds==null?'—':Number(r.odds).toFixed(2);return `<article class="signal"><div><div class="league">${esc(r.league||'NOMADTIPS3 LIVE')}</div><div class="match">${esc(r.home)} <span style="color:#747c74">vs</span> ${esc(r.away)}</div><div class="score">Score at detection <b>${score(r)}</b> · Detected <b>${clock(r.selectedAt)}</b></div></div><div class="pick"><small>SELECTION · LINE · ODDS</small><strong>${pick(r)}</strong><div class="pick-meta">Odds @ <b>${esc(odds)}</b> · ${dt(r.selectedAt)}</div></div><div><span class="result ${result.toLowerCase()}">${result}</span></div></article>`}
async function load(){try{const [h,health]=await Promise.all([getHistory(1,50),getHealth().catch(()=>null)]),s=h.summary||{},rows=h.records||[];const win=s.win??s.correct??rows.filter(r=>resultOf(r)==='WIN').length,loss=s.loss??s.incorrect??rows.filter(r=>resultOf(r)==='LOSS').length,draw=s.draw??s.push??rows.filter(r=>resultOf(r)==='DRAW').length,pending=s.pending??rows.filter(r=>resultOf(r)==='PENDING').length,total=s.total??h.total??rows.length;const settled=Number(win)+Number(loss),wr=s.winRate??s.accuracy??(settled?win/settled*100:0);$('metrics').innerHTML=metric('TOTAL SIGNALS',total)+metric('WIN',win)+metric('LOSS',loss)+metric('PENDING',pending)+metric('WIN RATE',`${Number(wr||0).toFixed(1)}%`);$('signals').innerHTML=rows.length?rows.slice(0,12).map(card).join(''):'<div class="empty">ยังไม่มีสัญญาณที่ถูกบันทึก เมื่อเครื่องตรวจพบคู่ที่ผ่านเงื่อนไข สัญญาณจะขึ้นตรงนี้พร้อม Selection / Line / Odds</div>';$('updated').textContent=`Updated ${clock(h.generatedAt)}`;$('health').textContent=health?`ENGINE ONLINE · scan ${clock(health.lastSuccess||health.lastCycle)} · history ${health.historyTotal??total}`:`${CAR34.version} · data connected`;}catch(e){$('signals').innerHTML=`<div class="empty">โหลดข้อมูลไม่ได้: ${esc(e.message)}</div>`;$('health').textContent='ENGINE CONNECTION ERROR';}}
load();setInterval(load,CAR34.refreshMs);</script></body></html>
