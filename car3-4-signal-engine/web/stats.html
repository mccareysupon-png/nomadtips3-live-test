<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b0d0c"><title>NOMADTIPS3 — CAR 3.4 Statistics</title><link rel="stylesheet" href="./styles.css"></head><body><main class="shell"><header class="top"><div class="brand">nomad<b>tips3</b> · 3.4</div><nav><a href="./index.html">SIGNALS</a><a class="active" href="./stats.html">STATISTICS</a><a href="./settings.html">SETTINGS</a></nav></header><section class="hero"><div class="eyebrow">CAR 3.4 · FULL RECORD</div><h1>STATISTICS</h1><p>หน้าสถิติลงข้อมูลเต็ม ส่วนหน้าแรกเก็บไว้ให้ดูสัญญาณง่าย ๆ เท่านั้น</p></section><section id="metrics" class="metrics"></section><div class="section-title"><h2>Signal history</h2><span id="updated">—</span></div><div class="table-wrap"><table><thead><tr><th>#</th><th>DETECTED</th><th>MATCH</th><th>SELECTION</th><th>MARKET</th><th>LINE</th><th>ODDS</th><th>ENTRY SCORE</th><th>FINAL</th><th>RESULT</th><th>SETTLED</th></tr></thead><tbody id="body"><tr><td colspan="11">กำลังโหลด…</td></tr></tbody></table></div><div class="pager"><button id="prev">PREV</button><span id="page">—</span><button id="next">NEXT</button></div></main><script type="module">import{esc,dt,line,resultOf,getHistory,$}from'./core.js';let page=1;const limit=25;const metric=(k,v)=>`<article class="metric"><small>${k}</small><b>${v}</b></article>`;const score=s=>s&&s.home!=null?`${esc(s.home)}-${esc(s.away)}`:'—';
function render(d){const s=d.summary||{},rows=d.records||[],win=s.win??s.correct??0,loss=s.loss??s.incorrect??0,draw=s.draw??s.push??0,pending=s.pending??0,total=s.total??d.total??0,settled=Number(win)+Number(loss),wr=s.winRate??s.accuracy??(settled?win/settled*100:0),avg=s.averageOdds??0;$('metrics').innerHTML=metric('TOTAL',total)+metric('WIN',win)+metric('LOSS',loss)+metric('WIN RATE',`${Number(wr).toFixed(1)}%`)+metric('AVG ODDS',Number(avg).toFixed(2));$('body').innerHTML=rows.length?rows.map((r,i)=>{const res=resultOf(r);return `<tr><td>${(d.offset||0)+i+1}</td><td><b>${dt(r.selectedAt)}</b></td><td><b>${esc(r.home)}</b><br>${esc(r.away)}<br><small>${esc(r.league)}</small></td><td><b>${esc(r.selectedTeam||r.selectedSide)}</b><br><small>${esc(r.selectedSide)}</small></td><td>${esc(r.market)}</td><td>${line(r.line)}</td><td><b>${r.odds==null?'—':esc(Number(r.odds).toFixed(2))}</b></td><td>${score(r.entryScore)}</td><td>${score(r.finalScore)}</td><td><span class="result ${res.toLowerCase()}">${res}</span></td><td>${dt(r.settledAt)}</td></tr>`}).join(''):'<tr><td colspan="11" class="empty">ยังไม่มีประวัติสัญญาณ</td></tr>';$('updated').textContent=`Updated ${dt(d.generatedAt)}`;$('page').textContent=`Page ${d.page||page} / ${Math.max(1,d.pages||1)}`;$('prev').disabled=(d.page||page)<=1;$('next').disabled=(d.page||page)>=(d.pages||1);}
async function load(){try{render(await getHistory(page,limit))}catch(e){$('body').innerHTML=`<tr><td colspan="11">โหลดไม่ได้: ${esc(e.message)}</td></tr>`}}$('prev').onclick=()=>{if(page>1){page--;load()}};$('next').onclick=()=>{page++;load().catch(()=>page--)};load();</script></body></html>
