<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BALL46 Statistics — safe test preview</title>
<style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#e7f2ed;background:#101d19;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;padding:16px;max-width:1380px;margin-inline:auto}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{font-size:24px;font-weight:800;letter-spacing:-1px}.brand em{font-style:normal;color:#48d6a1}
h1{font-size:23px;letter-spacing:-.03em;margin:0}.sub{color:#8da99d;font-size:12px}
.card{background:#172923;border:1px solid #2e493e;border-radius:12px;padding:14px;margin-bottom:12px}
.nav{display:flex;gap:6px;overflow:auto;margin-bottom:15px;padding-bottom:6px}
button{border:1px solid #365b4d;background:#1d352b;border-radius:8px;color:inherit;padding:9px 12px;white-space:nowrap;font:inherit;cursor:pointer}
button.active{background:#245f49;border-color:#54c99c}button:focus-visible{outline:2px solid #60e4ad}button:disabled{opacity:.4;cursor:default}
nav button b{color:#a6dac5;margin-left:5px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{background:#172923;border:1px solid #2e493e;padding:12px;border-radius:11px;min-width:0}
.kpi .value{font-size:clamp(18px,2vw,26px);font-weight:800;overflow-wrap:anywhere}
.kpi .name{font-size:11px;color:#a8c8b8;text-transform:uppercase;letter-spacing:.06em}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chart{width:100%;height:180px;display:block}.chart path{fill:none;stroke:#4dd7a7;stroke-width:2;vector-effect:non-scaling-stroke}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}th,td{text-align:left;border-bottom:1px solid #30483e;padding:10px}th{color:#a6c9b7}
.muted{color:#91ac9f}.status{font-size:12px;color:#a6d5bf}.pager{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:10px}
.skel{min-height:24px;animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.4}}body[data-ready="1"] .skel{animation:none}
@media(max-width:680px){body{padding:9px}header{margin-bottom:12px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.card{padding:10px}h1{font-size:19px}.chart{height:130px}th,td{padding:9px 7px;font-size:12px}}
</style></head>
<body data-ready="0">
<header><div class="brand">ball<em>46</em></div><div><h1>Statistics</h1><div class="sub">Verified read model · TEST ONLY · No Production changes</div></div><span id="state" class="status">Loading verified snapshot…</span></header>
<nav class="nav" aria-label="Statistics markets" id="markets"></nav>
<div class="kpis" id="kpis" aria-live="polite"><div class="kpi skel">Loading…</div></div>
<section class="card"><div class="headrow"><strong>Long-term performance · 1 unit</strong><div><button data-range="all" class="active">All</button> <button data-range="90">90D</button> <button data-range="30">30D</button></div></div><svg id="chart" class="chart" role="img" aria-label="Cumulative unit net performance" viewBox="0 0 1000 180"><path d="M0 90L1000 90"/></svg><div id="chartNote" class="muted">Loading verified chart…</div></section>
<section class="card"><div class="headrow"><strong>Verified History</strong><span id="count" class="muted">—</span></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Market</th><th>Selection</th><th>Status</th><th>Result</th><th>Odds</th></tr></thead><tbody id="history"></tbody></table></div><div class="pager"><button id="prev" disabled>Previous</button><span id="pagerStatus" class="muted">—</span><button id="next" disabled>Next</button></div></section>
<script>
(()=>{
'use strict';
const markets=['all','1x2','ah','ou','btts','corners','cards','other'];let market='all',page=1,rangeDays='all',summary=null,ticket=0;
const byId=id=>document.getElementById(id),fmt=n=>Number.isFinite(n)?Number(n).toLocaleString('en-US'):'—';
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}
const nav=()=>{byId('markets').innerHTML=markets.map(m=>'<button data-market="'+m+'" class="'+(m===market?'active':'')+'">'+m.toUpperCase()+' <b>'+fmt(summary?.marketCounts?.[m])+'</b></button>').join('');byId('markets').querySelectorAll('button').forEach(b=>b.onclick=()=>{market=b.dataset.market;page=1;load()})};
function graph(points){const svg=byId('chart'),path=svg.querySelector('path');if(!points.length){path.setAttribute('d','M0 90L1000 90');byId('chartNote').textContent='No settled records in selected range';return}let min=Math.min(0,...points.map(p=>p.low)),max=Math.max(0,...points.map(p=>p.high));if(min===max)max=min+1;const d=points.map((p,i)=>((i?'L':'M')+(points.length===1?500:i*1000/(points.length-1)).toFixed(1)+' '+(170-(p.close-min)/(max-min)*160).toFixed(1))).join(' ');path.setAttribute('d',d);byId('chartNote').textContent=points.length+' dated points · latest '+Number(points.at(-1).close||0).toFixed(2)+' units'}
function metrics(m){const values=[['Records',m.ledgerTotal],['Settled',m.settledTotal],['Pending',m.pending],['Win Rate',m.winRate==null?'—':m.winRate.toFixed(1)+'%'],['Net Units',m.net==null?'—':m.net.toFixed(2)+' U']];byId('kpis').innerHTML=values.map(([label,value])=>'<div class="kpi"><div class="name">'+label+'</div><div class="value">'+esc(value)+'</div></div>').join('')}
async function load(){
 const current=++ticket;document.body.dataset.ready='0';byId('state').textContent='Loading verified snapshot…';
 try{
  if(!summary){summary=await get('/api/statistics/fast-summary');if(!summary.ok||summary.marketCounts?.all!==summary.ledgerTotal)throw Error('Summary mismatch')}
  if(current!==ticket)return;
  const q=new URLSearchParams({market,page:String(page),limit:'50',rangeDays,revision:String(summary.contentRevision)});
  const v=await get('/api/statistics/fast-view?'+q);
  if(current!==ticket)return;
  if(v.contentRevision!==summary.contentRevision||v.totalRows!==v.metrics.ledgerTotal)throw Error('Snapshot revision/count mismatch');
  nav();metrics(v.metrics);graph(v.chart);
  byId('count').textContent=fmt(v.totalRows)+' total records · '+Math.min(v.rows.length,50)+' on this page';
  byId('history').innerHTML=v.rows.map(r=>'<tr><td>'+esc(new Date(r.settledAt??r.createdAt).toISOString().slice(0,16).replace('T',' '))+'</td><td>'+esc(r.marketLabel??r.market)+'</td><td>'+esc(r.selection)+'</td><td>'+esc(r.status)+'</td><td>'+esc(r.result)+'</td><td>'+esc(r.odds)+'</td></tr>').join('');
  byId('prev').disabled=page<=1;byId('next').disabled=page>=v.pages;byId('pagerStatus').textContent='Page '+page+' of '+v.pages;
  byId('state').textContent='Verified revision '+v.contentRevision;document.body.dataset.ready='1';performance.mark('statistics-ready');
 }catch(e){if(current!==ticket)return;byId('state').textContent='Statistics unavailable · '+e.message;document.body.dataset.ready='error';}
}
byId('prev').onclick=()=>{page=Math.max(1,page-1);load()};byId('next').onclick=()=>{page++;load()};
document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{rangeDays=b.dataset.range==='all'?'all':Number(b.dataset.range);document.querySelectorAll('[data-range]').forEach(x=>x.classList.toggle('active',x===b));load()});
load();
})();
</script></body></html>
