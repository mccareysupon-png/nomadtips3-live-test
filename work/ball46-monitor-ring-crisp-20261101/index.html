<!doctype html><html lang="th" data-theme="dark"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BALL46 · Ring edge preview</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0c1e16;color:#ecf5ef;font:14px Arial,sans-serif;padding:24px}main{max-width:680px;margin:auto}h1{font-size:22px;margin:0 0 8px}p{color:#a7c0b1;line-height:1.7}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,select{border:1px solid #355646;background:#18392a;color:#ecf5ef;border-radius:9px;padding:10px 14px;cursor:pointer}button:hover{border-color:#57e3ab}section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:22px 0}h2{font-size:13px;color:#a7c0b1}iframe{display:block;border:0;width:260px;max-width:100%;height:360px}aside{background:#163124;padding:12px 16px;border-radius:10px;color:#a7c0b1;font-size:12px;line-height:1.8}@media(max-width:570px){body{padding:16px}section{grid-template-columns:1fr}iframe{margin:auto}}html[data-theme=light] body{background:#edf4ef;color:#183e2a}html[data-theme=light] p,html[data-theme=light] h2{color:#526e60}</style>
<main><h1>ขอบลำแสง · เปรียบเทียบก่อน–หลัง</h1><p>ปรับเฉพาะเส้นวงกลม ใช้รูปแบบการ์ดและสีเดิม ข้อมูลตัวอย่างสำหรับทดสอบภาพ ไม่ใช่ข้อมูล LIVE</p>
<nav><button onclick="motion('play')">หมุนต่อเนื่อง</button><button onclick="motion('pause')">หยุดดูขอบเส้น</button><select id="theme" onchange="draw()"><option value="dark">โหมดมืด</option><option value="light">โหมดสว่าง</option></select><select id="width" onchange="draw()"><option value="260">ขนาดแคบ 260px</option><option value="296">ขนาด 296px</option><option value="334">มือถือ 334px</option></select></nav>
<section id="grid"></section><aside>ฝั่งใหม่ให้ลำแสงวิ่งบนเส้น SVG ที่อยู่นิ่ง และนำเงาที่ทำให้ขอบเส้นนุ่มออก วงเปอร์เซ็นต์ใช้ขอบเวกเตอร์แบบเดียวกัน ชุดนี้ยังไม่ดีพลอย</aside></main>
<script>function motion(type){document.querySelectorAll('iframe').forEach(f=>f.contentWindow.postMessage({type,time:type==='pause'?800:undefined},location.origin))}function draw(){const theme=document.getElementById('theme').value,width=document.getElementById('width').value;document.documentElement.dataset.theme=theme;document.getElementById('grid').innerHTML=['awaiting','live'].flatMap(state=>['before','after'].map(variant=>`<article><h2>${variant==='before'?'ก่อนปรับ':'หลังปรับ'} · ${state==='live'?'มีค่าเปอร์เซ็นต์':'รอข้อมูล / ลำแสง'}</h2><iframe title="${variant} ${state}" style="width:${width}px" src="card.html?variant=${variant}&state=${state}&theme=${theme}"></iframe></article>`)).join('')}draw();</script></html>
